<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="836" viewBox="0 0 1240 836" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sharding-title sharding-desc">
<title id="sharding-title">Write sharding, and what it costs</title>
<desc id="sharding-desc">A suffix splits one hot key across ten partitions and raises the write ceiling tenfold, at the cost of every read querying all ten and merging. Isolating the heavy values or caching is often cheaper.</desc>
<defs>
<marker id="sharding-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sharding-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sharding-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sharding-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="836" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Write sharding, and what it costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The cost is immediate and it is on the read side.</text>
<rect x="40" y="758" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="758" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="460" y="118" width="320" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="151" font-size="21" font-weight="700" fill="#080C50" text-anchor="middle">one hot key</text>
<path d="M620 178V212" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 178V212" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sharding-marker-slate)"/>
<rect x="120" y="218" width="1000" height="68" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="142" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="182" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#0</text><rect x="239" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="279" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#1</text><rect x="336" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="376" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#2</text><rect x="433" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="473" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#3</text><rect x="530" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="570" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#4</text><rect x="627" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="667" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#5</text><rect x="724" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="764" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#6</text><rect x="821" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="861" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#7</text><rect x="918" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="958" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#8</text><rect x="1015" y="233" width="80" height="38" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1055" y="259" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">#9</text>
<text x="620" y="318" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pk = "product#1234#" + random(0..9)</text>
<rect x="40" y="344" width="560" height="96" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="344" width="5" height="96" rx="2.5" fill="#39D5AA"/><text x="64" y="385" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Writes</text><text x="64" y="411" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the effective ceiling is now tenfold what it was</text>
<rect x="640" y="344" width="560" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="344" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="664" y="385" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Reads</text><text x="664" y="411" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every read now queries all ten partitions and merges</text>
<rect x="40" y="458" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="458" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="493" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">So the write-to-read ratio decides it, which is the number the first module said to ask for</text>
<text x="40" y="554" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two alternatives, because sharding is not always the repair</text>
<rect x="40" y="572" width="560" height="80" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="604.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Isolate the heavy values: give three</text><text x="320" y="631.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">enormous tenants their own table</text>
<rect x="640" y="572" width="560" height="80" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="604.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Absorb the heat: a read-heavy hot key</text><text x="920" y="631.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is often a caching problem</text>
<rect x="40" y="672" width="1160" height="60" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="672" width="5" height="60" rx="2.5" fill="#F3CF6A"/><text x="64" y="708" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A calculated suffix keeps reads on one partition, and gives up range scans.</text>
<text x="66" y="792" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Sharding by default makes every read ten times more expensive in advance. Size the problem first.</text>
</svg>