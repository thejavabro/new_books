<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1220" viewBox="0 0 1200 1220" role="img" aria-labelledby="title desc"><title id="title">Food delivery: client architecture</title><desc id="desc">The screens use repositories for menus, carts, and orders. The order coordinator saves and recovers submissions; the tracking component provides current order and location updates. Local storage preserves the data needed after restart. The backend decides order and payment outcomes. Selected connections are shown; menu requests also use the API client.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="arrowStart" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="1220" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><rect x="25" y="140" width="1150" height="735" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="34" fill="#0f172a" font-weight="700">Food delivery: client architecture</text><text x="50" y="105" font-size="23" fill="#334155" font-weight="400">Separate screen state, recoverable work, and server decisions.</text><rect x="50" y="165" width="715" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="74" y="205" font-size="25" fill="#2563eb" font-weight="700">Customer screens + presentation state</text><text x="74" y="246" font-size="21" fill="#334155" font-weight="400">Browse menus, edit the cart, review checkout, and track orders.</text><text x="838" y="192" font-size="20" fill="#64748b" font-weight="700">MOBILE APP</text><text x="838" y="230" font-size="20" fill="#334155" font-weight="400">Arrows show actions,</text><text x="838" y="261" font-size="20" fill="#334155" font-weight="400">data, or status updates.</text><path d="M215 293 V352" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><path d="M600 293 V352" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><rect x="50" y="360" width="330" height="190" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="404" font-size="25" fill="#7c3aed" font-weight="700">Menu and cart</text><text x="72" y="435" font-size="25" fill="#7c3aed" font-weight="700">repositories</text><text x="72" y="491" font-size="21" fill="#334155" font-weight="400">Load menus; edit the cart.</text><rect x="435" y="360" width="330" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="404" font-size="25" fill="#059669" font-weight="700">Order repository</text><text x="457" y="435" font-size="25" fill="#059669" font-weight="700">and coordinator</text><text x="457" y="491" font-size="21" fill="#334155" font-weight="400">Save, submit, and recover</text><text x="457" y="522" font-size="21" fill="#334155" font-weight="400">order operations.</text><rect x="820" y="360" width="330" height="190" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="404" font-size="24" fill="#c2410c" font-weight="700">Tracking component</text><text x="842" y="460" font-size="20" fill="#334155" font-weight="400">Receive order and location</text><text x="842" y="491" font-size="20" fill="#334155" font-weight="400">updates. Keep their age visible.</text><path d="M812 435 H773" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="776" y="420" font-size="16" fill="#64748b" font-weight="400">data</text><path d="M215 558 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><path d="M540 558 V612 H450 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><path d="M660 558 V612 H800 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><path d="M985 558 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="260" y="648" font-size="20" fill="#64748b" font-weight="400">Saved data</text><text x="1000" y="605" font-size="20" fill="#64748b" font-weight="400">Requests</text><text x="1000" y="636" font-size="20" fill="#64748b" font-weight="400">and updates</text><rect x="50" y="680" width="520" height="170" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="74" y="722" font-size="25" fill="#7c3aed" font-weight="700">Account-scoped local store</text><text x="74" y="763" font-size="21" fill="#334155" font-weight="400">Menus and editable cart</text><text x="74" y="794" font-size="21" fill="#334155" font-weight="400">Approved requests and operation IDs</text><text x="74" y="825" font-size="21" fill="#334155" font-weight="400">Confirmed orders and sync checkpoints</text><rect x="650" y="680" width="500" height="170" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="674" y="722" font-size="25" fill="#2563eb" font-weight="700">API client + live updates</text><text x="674" y="763" font-size="21" fill="#334155" font-weight="400">Menus, quotes, and order submission</text><text x="674" y="794" font-size="21" fill="#334155" font-weight="400">Status lookup for existing operations</text><text x="674" y="825" font-size="21" fill="#334155" font-weight="400">Tracking through a stream or polling</text><path d="M900 858 V950" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrowStart)"/><text x="922" y="918" font-size="20" fill="#64748b" font-weight="400">Network</text><rect x="650" y="960" width="500" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="674" y="1002" font-size="26" fill="#c2410c" font-weight="700">Backend services</text><text x="674" y="1043" font-size="21" fill="#334155" font-weight="400">Validate quotes and accept orders.</text><text x="674" y="1074" font-size="21" fill="#334155" font-weight="400">Coordinate payment and corrections.</text><text x="674" y="1105" font-size="21" fill="#334155" font-weight="400">Own confirmed outcomes.</text><rect x="50" y="935" width="520" height="195" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="74" y="975" font-size="24" fill="#ffffff" font-weight="700">When the cart screen closes</text><text x="74" y="1016" font-size="21" fill="#ffffff" font-weight="400">Keep the saved operation and its ID.</text><text x="74" y="1047" font-size="21" fill="#ffffff" font-weight="400">Recover when the app can run again.</text><text x="74" y="1078" font-size="21" fill="#ffffff" font-weight="400">Keep existing-order tracking available.</text><text x="50" y="1177" font-size="21" fill="#475569" font-weight="400">Selected connections shown. Menu requests also use the API client.</text></g></svg>