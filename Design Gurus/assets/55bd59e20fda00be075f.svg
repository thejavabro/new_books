<svg xmlns="http://www.w3.org/2000/svg" width="980" height="440" viewBox="0 0 980 440" style="background-color:#ffffff">
<defs>
<marker id="fca" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold" fill="#b4322c">Every caller repeats the sequence, and each one gets the cleanup slightly wrong</text>

<rect x="30" y="42" width="430" height="118" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="46" y="64" font-family="monospace" font-size="11.5">inventory.reserve(sku, qty);</text>
<text x="46" y="82" font-family="monospace" font-size="11.5">if (!payments.charge(cents)) {</text>
<text x="76" y="100" font-family="monospace" font-size="11.5">inventory.release(sku, qty);  // easy to forget</text>
<text x="46" y="118" font-family="monospace" font-size="11.5">}</text>
<text x="46" y="136" font-family="monospace" font-size="11.5">shipping.createShipment(sku, qty);</text>
<text x="46" y="154" font-family="monospace" font-size="11.5">email.sendConfirmation(customer, orderId);</text>

<text x="500" y="66" font-size="12.5" fill="#b4322c">The subsystem is not badly designed. It is</text>
<text x="500" y="84" font-size="12.5" fill="#b4322c">powerful, and power means options.</text>
<text x="500" y="112" font-size="12.5" fill="#b4322c">The problem is that almost every caller wants</text>
<text x="500" y="130" font-size="12.5" fill="#b4322c">the same default path, and writes it out again.</text>

<line x1="30" y1="186" x2="950" y2="186" stroke="#dbe2ed"/>

<text x="30" y="214" font-size="13.5" font-weight="bold" fill="#2f7a55">One entry point that knows the sequence and the cleanup</text>

<rect x="30" y="240" width="210" height="60" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="135" y="266" text-anchor="middle" font-weight="bold">Checkout page</text>
<text x="135" y="286" text-anchor="middle" font-family="monospace" font-size="11">placeOrder(...)</text>

<rect x="320" y="228" width="190" height="84" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="415" y="256" text-anchor="middle" font-weight="bold">OrderFacade</text>
<text x="415" y="278" text-anchor="middle" font-size="11.5" fill="#2f7a55">sequences the four,</text>
<text x="415" y="296" text-anchor="middle" font-size="11.5" fill="#2f7a55">and undoes on failure</text>

<rect x="620" y="196" width="230" height="38" rx="3" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="735" y="220" text-anchor="middle" font-size="12" fill="#414d60">InventoryService</text>
<rect x="620" y="244" width="230" height="38" rx="3" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="735" y="268" text-anchor="middle" font-size="12" fill="#414d60">PaymentGateway</text>
<rect x="620" y="292" width="230" height="38" rx="3" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="735" y="316" text-anchor="middle" font-size="12" fill="#414d60">ShippingService</text>
<rect x="620" y="340" width="230" height="38" rx="3" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="735" y="364" text-anchor="middle" font-size="12" fill="#414d60">EmailService</text>

<path d="M 240 270 L 315 270" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#fca)"/>
<path d="M 510 250 L 565 250 L 565 215 L 615 215" stroke="#3a6fb0" fill="none" marker-end="url(#fca)"/>
<path d="M 510 262 L 580 262 L 580 263 L 615 263" stroke="#3a6fb0" fill="none" marker-end="url(#fca)"/>
<path d="M 510 278 L 580 278 L 580 311 L 615 311" stroke="#3a6fb0" fill="none" marker-end="url(#fca)"/>
<path d="M 510 292 L 565 292 L 565 359 L 615 359" stroke="#3a6fb0" fill="none" marker-end="url(#fca)"/>

<text x="880" y="252" font-size="11.5" fill="#6b7789">the subsystem,</text>
<text x="880" y="268" font-size="11.5" fill="#6b7789">still public and</text>
<text x="880" y="284" font-size="11.5" fill="#6b7789">still usable</text>

<rect x="30" y="398" width="920" height="34" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="420" font-size="12.5" fill="#414d60">The facade is a convenience, not a wall. Leave the four services reachable, or the next unusual requirement has nowhere to go.</text>
</g>
</svg>