<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="694" viewBox="0 0 1240 694" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="twoprojects-title twoprojects-desc">
<title id="twoprojects-title">Two projects in one brief</title>
<desc id="twoprojects-desc">The brief merges a latency requirement with a survival requirement, and three of its phrases are not yet requirements at all.</desc>
<defs>
<marker id="twoprojects-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="twoprojects-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="twoprojects-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="twoprojects-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="694" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two projects in one brief</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The brief merges a latency requirement with a survival requirement.</text>
<rect x="40" y="616" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="616" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V282A6 6 0 0 0 46 288H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The European customers asked for</text>
<text x="320" y="206" font-size="30" font-weight="700" fill="#155B9E" text-anchor="middle">LATENCY</text>
<text x="320" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a serving problem, solved by placing</text><text x="320" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">read capacity near the reader</text>
<rect x="640" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V282A6 6 0 0 0 646 288H654Z" fill="#AC8BE8"/><text x="670" y="154" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">The largest prospect asked for</text>
<text x="920" y="206" font-size="30" font-weight="700" fill="#6040A8" text-anchor="middle">SURVIVAL</text>
<text x="920" y="244" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a recovery problem, stated as two</text><text x="920" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">numbers rather than as geography</text>
<rect x="40" y="306" width="1160" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="336.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Those are two different projects, and the brief merges them.</text><text x="620" y="363.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separating them is the highest-value move here</text>
<text x="40" y="422" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What looks like a requirement and is not one yet</text>
<rect x="40" y="440" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 440H46A6 6 0 0 0 40 446V584A6 6 0 0 0 46 590H54Z" fill="#5EC9EC"/>
<text x="226" y="480" font-size="22" font-weight="700" fill="#155B9E" text-anchor="middle">"multi-region"</text>
<text x="226" y="518" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">covers a read replica through to</text><text x="226" y="543" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">two independent active stacks. A</text><text x="226" y="568" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">factor of ten in cost and effort</text>
<rect x="434" y="440" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 440H440A6 6 0 0 0 434 446V584A6 6 0 0 0 440 590H448Z" fill="#F3CF6A"/>
<text x="620" y="480" font-size="22" font-weight="700" fill="#91642E" text-anchor="middle">"no downtime"</text>
<text x="620" y="518" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">zero seconds per request, no</text><text x="620" y="543" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">planned window, or an availability</text><text x="620" y="568" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">number sustained through the work</text>
<rect x="828" y="440" width="372" height="150" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 440H834A6 6 0 0 0 828 446V584A6 6 0 0 0 834 590H842Z" fill="#F28B9D"/>
<text x="1014" y="480" font-size="22" font-weight="700" fill="#A83147" text-anchor="middle">"cannot more than double"</text>
<text x="1014" y="518" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a ceiling on what: the current</text><text x="1014" y="543" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">bill, the compute line, or the</text><text x="1014" y="568" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">total including new transfer</text>
<text x="66" y="650" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most answers design for the expensive reading of a requirement nobody checked.</text>
</svg>