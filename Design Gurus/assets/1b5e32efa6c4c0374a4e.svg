<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A cache entry through three phases: fresh until the soft TTL, stale but still served while a background refresh runs, and expired after the hard TTL">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="ca3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One cache entry, written once, read many times</text>

  
  <rect x="80" y="86" width="360" height="168" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <rect x="440" y="86" width="440" height="168" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="880" y="86" width="280" height="168" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

  <text x="260" y="124" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Fresh</text>
  <text x="260" y="160" font-size="20" fill="#065F46" text-anchor="middle">Served straight from</text>
  <text x="260" y="188" font-size="20" fill="#065F46" text-anchor="middle">cache. No refresh,</text>
  <text x="260" y="216" font-size="20" fill="#065F46" text-anchor="middle">no origin traffic.</text>

  <text x="660" y="124" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Stale but still usable</text>
  <text x="660" y="160" font-size="20" fill="#92400E" text-anchor="middle">Still served from cache, so the</text>
  <text x="660" y="188" font-size="20" fill="#92400E" text-anchor="middle">reader never waits. One request</text>
  <text x="660" y="216" font-size="20" fill="#92400E" text-anchor="middle">refreshes it in the background.</text>

  <text x="1020" y="124" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Expired</text>
  <text x="1020" y="160" font-size="20" fill="#B91C1C" text-anchor="middle">No longer served.</text>
  <text x="1020" y="188" font-size="20" fill="#B91C1C" text-anchor="middle">The next reader waits</text>
  <text x="1020" y="216" font-size="20" fill="#B91C1C" text-anchor="middle">for the origin, or errors.</text>

  
  <line x1="80" y1="300" x2="1180" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#ca3-slate)"/>
  <line x1="80" y1="288" x2="80" y2="312" stroke="#475569" stroke-width="2"/>
  <line x1="440" y1="284" x2="440" y2="316" stroke="#D97706" stroke-width="2.5"/>
  <line x1="880" y1="284" x2="880" y2="316" stroke="#DC2626" stroke-width="2.5"/>

  <text x="80" y="346" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">written</text>
  <text x="440" y="346" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">soft TTL</text>
  <text x="440" y="374" font-size="20" fill="#92400E" text-anchor="middle">5 minutes</text>
  <text x="880" y="346" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">hard TTL</text>
  <text x="880" y="374" font-size="20" fill="#B91C1C" text-anchor="middle">30 minutes</text>
  <text x="1180" y="346" font-size="20" fill="#475569" text-anchor="end">time</text>

  
  <rect x="80" y="424" width="1080" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="458" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The soft TTL buys speed. The hard TTL buys correctness.</text>
  <text x="620" y="490" font-size="20" fill="#475569" text-anchor="middle">Between them, a reader is never blocked and the data is never older than the hard limit.</text>
  <text x="620" y="518" font-size="20" fill="#475569" text-anchor="middle">The hard TTL must always be greater than or equal to the soft TTL.</text>
</svg>