<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one token per node the ring arcs are uneven, and with many virtual nodes per physical node the key distribution evens out">
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
  <defs>
    <filter id="sh7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Virtual nodes are what make the ring fair</text>

  
  <rect x="40" y="72" width="560" height="452" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#B91C1C">One token per node</text>

  <circle cx="320" cy="290" r="132" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  
  <path d="M320 158 A132 132 0 0 1 434 356" fill="none" stroke="#DC2626" stroke-width="9" stroke-linecap="round"/>
  <circle cx="320" cy="158" r="11" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="434" cy="356" r="11" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="206" cy="356" r="11" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="252" cy="187" r="11" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>

  <text x="320" y="140" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A</text>
  <text x="462" y="364" font-size="20" font-weight="600" fill="#334155">B</text>
  <text x="178" y="364" font-size="20" font-weight="600" fill="#334155" text-anchor="end">C</text>
  <text x="228" y="172" font-size="20" font-weight="600" fill="#334155" text-anchor="end">D</text>

  <text x="320" y="470" font-size="20" fill="#B91C1C" text-anchor="middle">The arc into B is much wider than</text>
  <text x="320" y="498" font-size="20" fill="#B91C1C" text-anchor="middle">the rest, so B gets far more keys.</text>

  
  <rect x="640" y="72" width="560" height="452" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="664" y="106" font-size="20" font-weight="600" fill="#065F46">150 virtual nodes per node</text>

  <circle cx="920" cy="290" r="132" fill="none" stroke="#CBD5E1" stroke-width="2"/>
  <g stroke="#059669" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M920 158 A132 132 0 0 1 986 176"/>
    <path d="M1020 210 A132 132 0 0 1 1049 262"/>
    <path d="M1046 330 A132 132 0 0 1 1010 379"/>
    <path d="M960 415 A132 132 0 0 1 902 421"/>
    <path d="M851 409 A132 132 0 0 1 806 375"/>
    <path d="M793 322 A132 132 0 0 1 790 268"/>
    <path d="M801 232 A132 132 0 0 1 833 187"/>
    <path d="M866 165 A132 132 0 0 1 900 158"/>
  </g>

  <text x="920" y="470" font-size="20" fill="#065F46" text-anchor="middle">Each node owns many small arcs</text>
  <text x="920" y="498" font-size="20" fill="#065F46" text-anchor="middle">scattered around the whole ring.</text>

  
  <rect x="40" y="552" width="1160" height="70" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="582" font-size="20" fill="#475569" text-anchor="middle">More tokens mean a more even split, and a failed node's keys land on many neighbours instead of one.</text>
  <text x="620" y="610" font-size="20" fill="#475569" text-anchor="middle">The cost is metadata: the ring now holds hundreds of entries per node instead of one.</text>
</svg>