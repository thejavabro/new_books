<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Choose by message pattern and connection needs. Test how the app reconnects and catches up after missing updates.">
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>
  <defs>
    <marker id="rt7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="rt7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M230,250 C230,150 355,125 480,125" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#rt7-slate)"/>
  <text x="345" y="105" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>

  <path d="M420,305 C520,305 670,305 670,400" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#rt7-slate)"/>
  <text x="520" y="280" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <path d="M860,455 C960,455 960,305 920,305" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#rt7-slate)"/>
  <text x="895" y="390" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>

  <path d="M670,510 C670,560 785,545 900,545" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#rt7-slate)"/>
  <text x="800" y="528" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  
  <g filter="url(#rt7-soft)">
    <rect x="40" y="250" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="480" y="400" width="380" height="110" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="230" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Must both sides send on</text>
  <text x="230" y="320" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">the same connection?</text>
  <text x="670" y="442" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Do updates flow only from</text>
  <text x="670" y="470" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">the server to the client?</text>

  
  <g filter="url(#rt7-soft)">
    <rect x="480" y="60" width="300" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="920" y="240" width="300" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="920" y="480" width="300" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="630" y="100" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">WebSocket</text>
  <text x="630" y="138" font-size="20" fill="#64748B" text-anchor="middle">chat, games,</text>
  <text x="630" y="164" font-size="20" fill="#64748B" text-anchor="middle">collaborative editing</text>
  <text x="1070" y="280" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server Sent Events</text>
  <text x="1070" y="318" font-size="20" fill="#64748B" text-anchor="middle">feeds, scores,</text>
  <text x="1070" y="344" font-size="20" fill="#64748B" text-anchor="middle">streaming AI answers</text>
  <text x="1070" y="520" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Long Polling</text>
  <text x="1070" y="558" font-size="20" fill="#64748B" text-anchor="middle">fallback: uses</text>
  <text x="1070" y="584" font-size="20" fill="#64748B" text-anchor="middle">ordinary HTTP</text>
</svg>