<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The database per service rule: each service owns its store and is its only writer; every other service goes through the API, never to the tables">
  <defs>
    <marker id="dbps2-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="dbps2-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="dbps2-k1"><rect x="150" y="110" width="340" height="70" rx="12"/></clipPath>
    <clipPath id="dbps2-k2"><rect x="750" y="110" width="340" height="70" rx="12"/></clipPath>
    <filter id="dbps2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbps2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  <rect x="40" y="44" width="560" height="340" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">The rule: one service, one store</text>
  <rect x="640" y="44" width="560" height="340" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="74" font-size="16.5" font-weight="600" fill="#BE185D">How other services reach the data</text>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M320,180 V226" marker-end="url(#dbps2-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="320" y="212" fill="#047857">the only writer</text>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M750,145 H502" marker-end="url(#dbps2-memerald)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="626" y="130" fill="#047857">calls the API</text>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M920,200 V303 Q920,315 908,315 H436" marker-end="url(#dbps2-mpink)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="680" y="342" fill="#BE185D">direct table access: not allowed</text>
  </g>
  <g filter="url(#dbps2-soft)">
    <rect x="150" y="110" width="340" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="150" y="110" width="6" height="70" fill="#059669" clip-path="url(#dbps2-k1)"/>
  </g>
  <circle cx="188" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,134.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="214" y="152" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M 220,260 L 220,314 A 100,16 0 0 0 420,314 L 420,260" fill="#D1FAE5"/>
    <ellipse cx="320" cy="260" rx="100" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="320" y="307" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Orders Database</text>
  <text x="320" y="355" font-size="15.5" text-anchor="middle" fill="#6B7280">schema private to the owning team</text>
  <g filter="url(#dbps2-soft)">
    <rect x="750" y="110" width="340" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="750" y="110" width="6" height="70" fill="#DB2777" clip-path="url(#dbps2-k2)"/>
  </g>
  <circle cx="788" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,134.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="814" y="152" font-size="18.5" font-weight="600" fill="#111827">Inventory Service</text>
  <rect x="40" y="420" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="444" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="466" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The rule</text>
  <text x="288" y="466" font-size="15.5" fill="#475569">one service owns the store, writes the schema, and answers for the data</text>
  <rect x="64" y="488" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="510" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The boundary</text>
  <text x="288" y="510" font-size="15.5" fill="#475569">no other service touches the tables, the API is the only door</text>
</svg>