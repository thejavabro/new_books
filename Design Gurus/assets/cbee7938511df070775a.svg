<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="932" viewBox="0 0 1240 932" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The risk funnel checks all 200 million daily items cheaply, sends about 2 million to heavy models, and about 200,000 to human review">
  <defs>
    <marker id="hcdrf-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="hcdrf-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="hcdrf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="hcdrf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="hcdrf-k1"><rect x="340" y="116" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="hcdrf-k2"><rect x="340" y="283" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="hcdrf-k3"><rect x="340" y="450" width="560" height="90" rx="12"/></clipPath>
    <clipPath id="hcdrf-k4"><rect x="340" y="617" width="560" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="932" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="720" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Risk funnel: 200 million new items a day</text>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M620,243 V283" marker-end="url(#hcdrf-mblue)"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="636" y="268.5" fill="#1D4ED8">no match</text></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M620,410 V450" marker-end="url(#hcdrf-mblue)"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="636" y="435.5" fill="#1D4ED8">about 1 percent pass</text></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M620,577 V617" marker-end="url(#hcdrf-mblue)"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#EFF6FF" stroke-width="7"><text x="636" y="602.5" fill="#1D4ED8">still uncertain</text></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1050,138 V690" marker-end="url(#hcdrf-mslate)"/></g>
  <text x="1050" y="124" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">cheap per item</text>
  <text x="1050" y="716" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">costly per item</text>
  <g filter="url(#hcdrf-soft)">
    <rect x="340" y="116" width="560" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="116" width="6" height="90" fill="#4F46E5" clip-path="url(#hcdrf-k1)"/>
  </g>
  <circle cx="378" cy="161" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,150.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="404" y="168" font-size="18.5" font-weight="600" fill="#111827">Stage 1: Hashes and rules</text>
  <text x="620" y="231" font-size="15.5" text-anchor="middle" fill="#6B7280">known harmful media and clear cases</text>
  <text x="190" y="166.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280">200 million a day</text>
  <g filter="url(#hcdrf-soft)">
    <rect x="340" y="283" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="283" width="6" height="90" fill="#2563EB" clip-path="url(#hcdrf-k2)"/>
  </g>
  <circle cx="378" cy="328" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,317.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="404" y="335" font-size="18.5" font-weight="600" fill="#111827">Stage 2: The fast classifier</text>
  <text x="620" y="398" font-size="15.5" text-anchor="middle" fill="#6B7280">decides which items advance</text>
  <text x="190" y="333.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280">200 million a day</text>
  <g filter="url(#hcdrf-lift)">
    <rect x="340" y="450" width="560" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="340" y="450" width="9" height="90" fill="#2563EB" clip-path="url(#hcdrf-k3)"/>
  </g>
  <circle cx="378" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,484.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="404" y="502" font-size="18.5" font-weight="600" fill="#111827">Stage 3: The heavy multimodal models</text>
  <text x="620" y="565" font-size="15.5" text-anchor="middle" fill="#6B7280">text, image, and frames together</text>
  <text x="190" y="500.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280">about 2 million a day</text>
  <g filter="url(#hcdrf-soft)">
    <rect x="340" y="617" width="560" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="340" y="617" width="6" height="90" fill="#7C3AED" clip-path="url(#hcdrf-k4)"/>
  </g>
  <circle cx="378" cy="662" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,651.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M2 21v-2a4 4 0 0 1 4-4h6a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></g>
  <text x="404" y="669" font-size="18.5" font-weight="600" fill="#111827">Stage 4: Human review</text>
  <text x="620" y="732" font-size="15.5" text-anchor="middle" fill="#6B7280">a reviewer decides</text>
  <text x="190" y="667.5" font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280">about 200,000 a day</text>
  <rect x="40" y="816" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="861" text-anchor="middle" font-size="16" fill="#475569">This funnel filters for risk at each stage, not for relevance.</text>
</svg>