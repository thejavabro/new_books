<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="anchors-title anchors-desc">
<title id="anchors-title">Round hard, because your inputs are soft</title>
<desc id="anchors-desc">Treating a day as a hundred thousand seconds is a sixteen percent error that is invisible beside inputs uncertain by a factor of three. The anchors worth memorizing are ratios and physical limits rather than anything that changes quickly.</desc>
<defs>
<marker id="anchors-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="anchors-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="anchors-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="anchors-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="764" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Round hard, because your inputs are soft</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The most common error in estimation is not arithmetic.</text>
<rect x="40" y="686" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="686" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="116" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="116" rx="2.5" fill="#F28B9D"/><text x="64" y="143" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">False precision</text><text x="64" y="169" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">86,400 seconds in a day</text><text x="64" y="195" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">carried through a calculation</text><text x="64" y="221" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">whose first input was a guess</text>
<rect x="640" y="118" width="560" height="116" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="118" width="5" height="116" rx="2.5" fill="#39D5AA"/><text x="664" y="143" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Honest rounding</text><text x="664" y="169" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">100,000 seconds in a day</text><text x="664" y="195" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">16 percent error, invisible beside</text><text x="664" y="221" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a user count uncertain threefold</text>
<text x="40" y="272" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Anchors worth holding</text>
<rect x="40" y="290" width="560" height="48" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="321" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A day</text><text x="584" y="321" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">100,000 seconds</text>
<rect x="620" y="290" width="580" height="48" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="320" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a month 2.5 million, a year 30 million</text>
<rect x="40" y="346" width="560" height="48" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="377" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">A million a day</text><text x="584" y="377" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">12 per second</text>
<rect x="620" y="346" width="580" height="48" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="376" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">converts an impressive number into an ordinary one</text>
<rect x="40" y="402" width="560" height="48" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="433" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">1 gigabit/sec</text><text x="584" y="433" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">125 megabytes/sec</text>
<rect x="40" y="458" width="560" height="48" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="489" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Memory, disk, network</text><text x="584" y="489" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">100 ns, 100 us, 0.5 ms</text>
<rect x="620" y="458" width="580" height="48" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="488" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">memory to disk is 1000x; disk to network only ~5x</text>
<rect x="40" y="514" width="560" height="48" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="545" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Continent, ocean</text><text x="584" y="545" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">tens of ms, about 100 ms</text>
<rect x="620" y="514" width="580" height="48" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="544" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">set by the speed of light, so unmovable</text>
<rect x="40" y="582" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="582" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="612.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Durable numbers are ratios and physical limits.</text><text x="64" y="641.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Prices and device speeds are not; look those up.</text>
<text x="66" y="720" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Rounding to powers of ten is an honest representation of what you actually know.</text>
</svg>