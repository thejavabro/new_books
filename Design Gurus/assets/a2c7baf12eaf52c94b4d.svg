<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="666" viewBox="0 0 1240 666" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="staleset-title staleset-desc">
<title id="staleset-title">The race a delete does not fix</title>
<desc id="staleset-desc">A reader misses and loads the old value. Before it writes to the cache a writer stores the new value and deletes the entry. The reader then writes the old value in, where it stays until expiry, even though the delete ran correctly.</desc>
<defs>
<marker id="staleset-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="staleset-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="staleset-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="staleset-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="666" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The race a delete does not fix</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The reader then writes the old value in, where it stays until expiry, even though the delete ran correctly.</text>
<rect x="40" y="588" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="588" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<path d="M146 148H1200" fill="none" stroke="#D5E3EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="155" font-size="20" font-weight="700" fill="#155B9E" text-anchor="end">Reader</text>
<path d="M146 224H1200" fill="none" stroke="#D5E3EF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="130" y="231" font-size="20" font-weight="700" fill="#A83147" text-anchor="end">Writer</text>
<path d="M440 148H880" fill="none" stroke="#8795A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="160" y="118" width="280" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="140.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">1. miss, loads 1</text><text x="300" y="167.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">from the store</text>
<rect x="480" y="194" width="300" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="630" y="216.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">2. stores 2, then</text><text x="630" y="243.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deletes the entry</text>
<rect x="880" y="118" width="320" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1040" y="140.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">3. writes 1 into</text><text x="1040" y="167.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the cache</text>
<rect x="40" y="274" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="274" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="303.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Store holds 2. Cache holds 1.</text><text x="64" y="332.5" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">The delete ran, and ran correctly.</text>
<text x="40" y="390" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four fixes, in increasing order of effort</text>
<rect x="40" y="408" width="272" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="176" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Short expiry</text>
<text x="176" y="496" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">bounds the window</text>
<rect x="336" y="408" width="272" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="472" y="444" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write only if absent</text>
<text x="472" y="496" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the late write finds</text><text x="472" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the key taken</text>
<rect x="632" y="408" width="272" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="768" y="430.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Delete again</text><text x="768" y="457.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">after a delay</text>
<text x="768" y="496" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">cleans up behind</text><text x="768" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the late write</text>
<rect x="928" y="408" width="272" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1064" y="430.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Lease the key</text><text x="1064" y="457.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on a miss</text>
<text x="1064" y="496" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">only the lease holder</text><text x="1064" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">may populate</text>
<text x="620" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Most systems take the first two. The important part is knowing the race exists.</text>
<text x="66" y="622" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The symptom is one wrong value that persists while everything else behaves normally.</text>
</svg>