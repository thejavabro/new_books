<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="742" viewBox="0 0 1240 742" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A producer id and a sequence number let the broker recognise a retried write and append it only once, so a lost acknowledgement does not create a duplicate in the log">
  <rect x="0" y="0" width="1240" height="742" fill="#FFFFFF"/>
  <defs>
    <marker id="ms3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ms3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ms3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ms3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The producer retries blindly, and the broker recognises the retry</text>

  <line x1="250" y1="134" x2="250" y2="600" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="700" y1="134" x2="700" y2="600" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>

  <g filter="url(#ms3-soft)">
    <rect x="140" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="590" y="80" width="220" height="54" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="250" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="700" y="114" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker</text>

  <text x="475" y="180" font-size="20" fill="#1E40AF" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">send (pid 7, seq 5)</text>
  <line x1="254" y1="194" x2="696" y2="194" stroke="#3B82F6" stroke-width="2" marker-end="url(#ms3-blue)"/>

  <rect x="600" y="212" width="200" height="46" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="700" y="240" font-size="20" fill="#1E40AF" text-anchor="middle">seq 5 is new</text>

  <text x="500" y="298" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">ack, lost in the network</text>
  <line x1="696" y1="314" x2="400" y2="314" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="370" y1="304" x2="390" y2="324" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="390" y1="304" x2="370" y2="324" stroke="#DC2626" stroke-width="2.5"/>

  <text x="475" y="380" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">retry (pid 7, seq 5)</text>
  <line x1="254" y1="394" x2="696" y2="394" stroke="#D97706" stroke-width="2" marker-end="url(#ms3-amber)"/>

  <rect x="570" y="412" width="260" height="66" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="700" y="440" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">pid 7 already has seq 5</text>
  <text x="700" y="466" font-size="20" fill="#065F46" text-anchor="middle">drop it, ack again</text>

  <text x="475" y="528" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">ack, nothing appended</text>
  <line x1="696" y1="544" x2="254" y2="544" stroke="#059669" stroke-width="2" marker-end="url(#ms3-emerald)"/>

  
  <rect x="880" y="80" width="300" height="340" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1030" y="118" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Partition log</text>

  <rect x="900" y="140" width="260" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1030" y="169" font-size="20" fill="#5B21B6" text-anchor="middle">seq 3</text>
  <rect x="900" y="194" width="260" height="44" rx="8" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1030" y="223" font-size="20" fill="#5B21B6" text-anchor="middle">seq 4</text>
  <rect x="900" y="248" width="260" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="1030" y="277" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">seq 5, written once</text>

  <text x="1030" y="340" font-size="20" fill="#64748B" text-anchor="middle">the retry added</text>
  <text x="1030" y="366" font-size="20" fill="#64748B" text-anchor="middle">nothing to the log</text>

  
  <rect x="50" y="620" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="656" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The producer never has to know whether its first attempt landed.</text>
  <text x="620" y="686" font-size="20" fill="#334155" text-anchor="middle">A producer id plus a sequence number is all it takes to make a blind resend safe.</text>
</svg>