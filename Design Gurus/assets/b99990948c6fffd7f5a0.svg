<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="866" viewBox="0 0 1240 866" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dive-title dive-desc">
<title id="dive-title">The deep dive is the interview</title>
<desc id="dive-desc">Sixteen minutes on one or two components, where the level is decided. A single answer presented as the answer is a junior pattern even when the answer is right.</desc>
<defs>
<marker id="dive-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dive-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dive-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dive-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="866" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The deep dive is the interview</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Sixteen minutes on one or two components, where the level is decided.</text>
<rect x="40" y="788" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="788" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">State the problem precisely</text>
<path d="M536 148H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 148H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dive-marker-slate)"/>
<rect x="580" y="118" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not "we need caching" but "reads are a hundred times</text><text x="600" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">writes and the database cannot serve them"</text>
<circle cx="60" cy="220" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="227" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="190" width="440" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Give two or three options</text>
<path d="M536 220H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 220H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dive-marker-slate)"/>
<rect x="580" y="190" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with what each costs. The options are the content</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="262" width="440" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Choose, and say why</text>
<path d="M536 292H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 292H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dive-marker-slate)"/>
<rect x="580" y="262" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">grounded in the priority established during scoping</text>
<circle cx="60" cy="364" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="371" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="334" width="440" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name what it costs</text>
<path d="M536 364H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 364H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dive-marker-slate)"/>
<rect x="580" y="334" width="620" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="370" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and what would make you revisit it</text>
<rect x="40" y="410" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="410" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="447" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">weaker</text>
<text x="200" y="447" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"we would add a cache in front of the database"</text>
<rect x="40" y="490" width="1160" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="106" rx="2.5" fill="#39D5AA"/>
<text x="64" y="549" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">stronger</text>
<text x="200" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"a read-through cache on the user profile, keyed by user id,</text><text x="200" y="549" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">TTL of five minutes because stale profile data is tolerable,</text><text x="200" y="576" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">and we invalidate on write so an update is not visible late"</text>
<text x="620" y="634" font-size="22" font-weight="700" fill="#6040A8" text-anchor="middle">Both describe a cache. Only one shows the decisions inside the decision.</text>
<text x="40" y="684" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three things to bring unprompted</text>
<rect x="40" y="702" width="372" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="738" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what happens when this fails</text>
<rect x="434" y="702" width="372" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="738" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what this costs</text>
<rect x="828" y="702" width="372" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="738" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">how you would know it broke</text>
<text x="66" y="822" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Each is one sentence, and each maps to an entire module of this course.</text>
</svg>