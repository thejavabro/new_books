  <g transform="translate(1003.36,182.36) scale(0.72)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1034" y="197.46" font-size="17" font-weight="600" fill="#111827">Post-checks</text>
