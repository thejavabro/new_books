  <text x="110" y="197.46" font-size="17" font-weight="600" fill="#111827">Query processing</text>
  <text x="58" y="134" font-size="15.5" font-weight="600" fill="#6B7280">100 to 200 ms</text>
  <text x="158" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">rewrite, classify</text>
  <g filter="url(#c5rp1-soft)">
    <rect x="289" y="146" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
