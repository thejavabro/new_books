  <circle cx="319" cy="191" r="15" fill="#FFFFFF"/>
  <g transform="translate(310.36,182.36) scale(0.72)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="341" y="197.46" font-size="17" font-weight="600" fill="#111827">Retrieval</text>
