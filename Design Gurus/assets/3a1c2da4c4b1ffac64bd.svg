  <g transform="translate(535.56,410.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="572" y="428.03" font-size="18.5" font-weight="600" fill="#111827">Fallback ladder</text>
  <text x="620" y="491" font-size="15.5" text-anchor="middle" fill="#6B7280">retry once, then refuse honestly</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1137" y="346" fill="#047857">passes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="828.5" y="326" fill="#5B21B6">fails</text></g>
  <rect x="40" y="531" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="576" text-anchor="middle" font-size="16" fill="#475569">Each stage prepares a cleaner input for the next one. Generation takes the most time.</text>
