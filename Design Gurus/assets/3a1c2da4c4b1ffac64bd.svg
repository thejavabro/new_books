  <text x="803" y="197.46" font-size="17" font-weight="600" fill="#111827">Generation</text>
  <text x="751" y="134" font-size="15.5" font-weight="600" fill="#6B7280">several seconds</text>
  <text x="751" y="113" font-size="15.5" font-weight="600" fill="#6B7280">About 1 second to</text>
  <text x="851" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">answer with citations</text>
