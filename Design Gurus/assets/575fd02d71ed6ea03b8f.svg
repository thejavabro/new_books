<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: rendering one page makes three sequential round trips, getUser, getUserAddress, and getRecentOrders, and each call waits for the one before it so the waits add up">
  <defs>
    <marker id="m02-l05-chatty-page-render-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m02-l05-chatty-page-render-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="240" y1="110" x2="240" y2="560"/>
    <line x1="620" y1="110" x2="620" y2="560"/>
    <line x1="1000" y1="110" x2="1000" y2="560"/>
  </g>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M246,190 L614,190" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
    <path d="M614,250 L246,250" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
    <path d="M246,320 L614,320" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
    <path d="M614,380 L246,380" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
    <path d="M246,450 L994,450" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
    <path d="M994,510 L246,510" marker-end="url(#m02-l05-chatty-page-render-bl)"/>
  </g>

  <rect x="232" y="182" width="16" height="336" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="612" y="186" width="16" height="68" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="612" y="316" width="16" height="68" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="992" y="446" width="16" height="68" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  <g filter="url(#m02-l05-chatty-page-render-soft)">
    <rect x="130" y="40" width="220" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="240" y="82" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Page render</text>

  <g filter="url(#m02-l05-chatty-page-render-soft)">
    <rect x="510" y="40" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="82" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User service</text>

  <g filter="url(#m02-l05-chatty-page-render-soft)">
    <rect x="890" y="40" width="220" height="70" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1000" y="82" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order service</text>

  <g font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="430" y="176">getUser (round trip 1)</text>
    <text x="430" y="236">user</text>
    <text x="430" y="306">getUserAddress (round trip 2)</text>
    <text x="430" y="366">address</text>
    <text x="620" y="436">getRecentOrders (round trip 3)</text>
    <text x="620" y="496">orders</text>
  </g>

  <g font-size="20" text-anchor="end" fill="#64748B">
    <text x="205" y="228">wait 1</text>
    <text x="205" y="358">wait 2</text>
    <text x="205" y="488">wait 3</text>
  </g>

  <g filter="url(#m02-l05-chatty-page-render-soft)">
    <rect x="90" y="590" width="480" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="330" y="630" text-anchor="middle" font-size="20" fill="#B91C1C">Each call waits for the one before it,</text>
  <text x="330" y="662" text-anchor="middle" font-size="20" fill="#B91C1C">so the waits add up</text>

  <g stroke-width="4">
    <line x1="40" y1="730" x2="74" y2="730" stroke="#3B82F6"/>
  </g>
  <text x="84" y="737" font-size="20" fill="#475569">Synchronous request: the caller stops and waits for the answer</text>
  <text x="84" y="777" font-size="20" fill="#475569">Three round trips for one page, and every one of them is sequential</text>
</svg>