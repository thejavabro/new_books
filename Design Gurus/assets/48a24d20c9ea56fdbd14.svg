<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="980" viewBox="0 0 1240 980" role="img" aria-label="The code judging system data model. Problems live in a NoSQL document store keyed by problem_id, holding the title, difficulty, allowed languages and pointers to the test case files. Submissions live in a relational table keyed by submission_id, with indexes on problem_id and user_id, recording the language, the verdict, the runtime and when it was submitted. The test case input and output files themselves live in object storage, not in either database.">
  <defs>
    <filter id="sch-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/>
    </filter>
    <marker id="sch-arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="sch-arrow-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#64748B"/></marker>
    <marker id="sch-arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="980" fill="#FFFFFF"/>



