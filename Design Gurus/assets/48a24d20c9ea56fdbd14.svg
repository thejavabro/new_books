  <path d="M64 246 h 500" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="274" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">difficulty</text>
  <text x="548" y="274" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">indexed</text>
  <rect x="65.5" y="288" width="497" height="42" fill="#F8FAFC"/>
  <path d="M64 288 h 500" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="316" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">allowed_languages</text>
  <text x="548" y="316" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">LIST</text>
  <path d="M64 330 h 500" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="88" y="358" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">test_case_refs</text>
  <text x="548" y="358" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">LIST</text>
  <rect x="624" y="68" width="520" height="346" rx="14" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.8" filter="url(#sch-shadow)"/>
