  <path d="M624 120 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="636" y="129" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="655" y="147" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">PK</text>
  <text x="686" y="148" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">submission_id</text>
  <text x="1128" y="148" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">BIGINT</text>
  <rect x="625.5" y="162" width="517" height="42" fill="#F8FAFC"/>
  <path d="M624 162 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="636" y="171" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="655" y="189" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">FK</text>
  <text x="686" y="190" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">problem_id</text>
  <text x="1128" y="190" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">indexed</text>
  <path d="M624 204 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="636" y="213" width="38" height="24" rx="6" fill="#EEF2FF" stroke="#4F46E5" stroke-width="1.2"/>
  <text x="655" y="231" font-size="15" font-weight="700" fill="#4338CA" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">FK</text>
  <text x="686" y="232" font-size="19" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">user_id</text>
