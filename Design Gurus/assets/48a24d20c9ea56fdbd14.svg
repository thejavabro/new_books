  <rect x="625.5" y="246" width="517" height="42" fill="#F8FAFC"/>
  <path d="M624 246 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="648" y="274" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">language</text>
  <text x="1128" y="274" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">VARCHAR</text>
  <path d="M624 288 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="648" y="316" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">status</text>
  <text x="1128" y="316" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">VARCHAR</text>
  <rect x="625.5" y="330" width="517" height="42" fill="#F8FAFC"/>
  <path d="M624 330 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="648" y="358" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">runtime_ms</text>
  <text x="1128" y="358" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">INT</text>
  <path d="M624 372 h 520" fill="none" stroke="#E2E8F0" stroke-width="1"/>
  <text x="648" y="400" font-size="19" font-weight="400" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">submitted_at</text>
  <text x="1128" y="400" font-size="18" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">TIMESTAMP</text>

  <rect x="64" y="520" width="500" height="180" rx="14" fill="#FFFFFF" stroke="#64748B" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sch-shadow)"/>
  <text x="314" y="560" font-size="21" font-weight="700" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Object store</text>
  <text x="314" y="594" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The test case files themselves.</text>
  <text x="314" y="621" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Megabytes each, read whole, never queried.</text>
  <rect x="624" y="520" width="520" height="180" rx="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" stroke-dasharray="6 4" filter="url(#sch-shadow)"/>
  <text x="884" y="560" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Cache</text>
  <text x="884" y="594" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Hot problems and the problem list.</text>
  <text x="884" y="621" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A popular problem is served from here.</text>

  <path d="M564 183 H 616" fill="none" stroke="#059669" stroke-width="2.2" marker-end="url(#sch-arrow-emerald)"/>
  <path d="M314 372 V 512" fill="none" stroke="#64748B" stroke-width="2.2" marker-end="url(#sch-arrow-slate)"/>
  <path d="M450 372 V 490 H 884 V 512" fill="none" stroke="#D97706" stroke-width="2.2" marker-end="url(#sch-arrow-amber)"/>
  <rect x="596.75" y="472" width="126.5" height="36" rx="8" fill="#FFFFFF" opacity="0.96"/>
  <text x="660" y="497" font-size="18" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cached hard</text>

  <text x="884" y="450" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One row per attempt, indexed by problem and by user.</text>
  <text x="314" y="740" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The database holds the pointer. The store holds the bytes.</text>
  <text x="884" y="740" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Read constantly, edited almost never.</text>

  <rect x="40" y="780" width="1160" height="180" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="620" y="820" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Two stores because the two access patterns have nothing in common</text>
  <text x="620" y="860" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A problem is read by everyone who opens it and edited almost never, so it is cached hard.</text>
  <text x="620" y="890" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Submissions are written on every attempt, grow without limit, and are partitioned by time.</text>
  <text x="620" y="920" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Test files are too large for either, so both databases store only a reference to them.</text>
</svg>