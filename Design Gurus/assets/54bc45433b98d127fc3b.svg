<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="642" viewBox="0 0 1240 642" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="TCP, UDP and QUIC compared on reliable delivery, ordering, congestion control, encryption and multiplexing">
  <rect x="0" y="0" width="1240" height="642" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">What each protocol gives you, and what you have to build yourself</text>

  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="481" y="121" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">TCP</text>
  <text x="745" y="121" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">UDP</text>
  <text x="1008" y="121" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">QUIC</text>

  <text x="70" y="181" font-size="20" font-weight="600" fill="#0F172A">Reliable delivery</text>
  <text x="481" y="181" font-size="20" fill="#065F46" text-anchor="middle">yes</text>
  <text x="745" y="181" font-size="20" fill="#B91C1C" text-anchor="middle">no</text>
  <text x="1008" y="181" font-size="20" fill="#065F46" text-anchor="middle">yes</text>

  <text x="70" y="249" font-size="20" font-weight="600" fill="#0F172A">Ordering</text>
  <text x="481" y="249" font-size="20" fill="#334155" text-anchor="middle">strict, whole connection</text>
  <text x="745" y="249" font-size="20" fill="#B91C1C" text-anchor="middle">none</text>
  <text x="1008" y="249" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">per stream</text>

  <text x="70" y="317" font-size="20" font-weight="600" fill="#0F172A">Congestion control</text>
  <text x="481" y="317" font-size="20" fill="#065F46" text-anchor="middle">yes</text>
  <text x="745" y="317" font-size="20" fill="#92400E" text-anchor="middle">you build it</text>
  <text x="1008" y="317" font-size="20" fill="#065F46" text-anchor="middle">yes</text>

  <text x="70" y="385" font-size="20" font-weight="600" fill="#0F172A">Encryption</text>
  <text x="481" y="385" font-size="20" fill="#334155" text-anchor="middle">add TLS on top</text>
  <text x="745" y="385" font-size="20" fill="#334155" text-anchor="middle">add DTLS on top</text>
  <text x="1008" y="385" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">always on</text>

  <text x="70" y="453" font-size="20" font-weight="600" fill="#0F172A">Multiplexing</text>
  <text x="481" y="453" font-size="20" fill="#B91C1C" text-anchor="middle">one stream only</text>
  <text x="745" y="453" font-size="20" fill="#64748B" text-anchor="middle">not applicable</text>
  <text x="1008" y="453" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">many streams</text>

  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="208" x2="1190" y2="208" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="276" x2="1190" y2="276" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="344" x2="1190" y2="344" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="412" x2="1190" y2="412" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="480" x2="1190" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="350" y1="88" x2="350" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="613" y1="88" x2="613" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="877" y1="88" x2="877" y2="480" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="480" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <rect x="50" y="520" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="556" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">QUIC is UDP with everything TCP gives you rebuilt on top, in user space where it can be changed.</text>
  <text x="620" y="586" font-size="20" fill="#334155" text-anchor="middle">Choose UDP when you want none of it. Choose QUIC when you want it all, per stream.</text>
</svg>