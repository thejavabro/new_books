<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Retry amplification. One user click reaches a gateway that makes up to 3 attempts, checkout makes up to 3 attempts per gateway attempt for 9 calls, and payments receives up to 27 calls at the deepest layer. Dot grids show 1, 3, 9 and 27 calls.">
  <defs>
    <marker id="m04-l03-retry-amplification-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l03-retry-amplification-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l03-retry-amplification-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="60" y="78" font-size="20" font-weight="600" fill="#B91C1C">Retry amplification: every layer retries on its own</text>
  <text x="1180" y="78" text-anchor="end" font-size="20" fill="#64748B">3 attempts at each of three layers</text>
  <rect x="60" y="100" width="1120" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g filter="url(#m04-l03-retry-amplification-soft)">
    <rect x="60" y="130" width="250" height="140" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="185" y="175" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1 user click</text>
  <text x="185" y="207" text-anchor="middle" font-size="20" fill="#64748B">one request</text>
  <text x="185" y="239" text-anchor="middle" font-size="20" fill="#1E40AF">= 1 call</text>
  <g filter="url(#m04-l03-retry-amplification-soft)">
    <rect x="350" y="130" width="250" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="475" y="175" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="475" y="207" text-anchor="middle" font-size="20" fill="#64748B">up to 3 attempts</text>
  <text x="475" y="239" text-anchor="middle" font-size="20" fill="#B91C1C">= 3 calls out</text>
  <g filter="url(#m04-l03-retry-amplification-soft)">
    <rect x="640" y="130" width="250" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="765" y="175" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="765" y="207" text-anchor="middle" font-size="20" fill="#64748B">3 attempts each</text>
  <text x="765" y="239" text-anchor="middle" font-size="20" fill="#B91C1C">= 9 calls out</text>
  <g filter="url(#m04-l03-retry-amplification-soft)">
    <rect x="930" y="130" width="250" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1055" y="175" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1055" y="207" text-anchor="middle" font-size="20" fill="#64748B">3 attempts each</text>
  <text x="1055" y="239" text-anchor="middle" font-size="20" fill="#B91C1C">= 27 calls out</text>

  <g fill="none" stroke-width="2.5">
    <path d="M310,200 L342,200" stroke="#3B82F6" marker-end="url(#m04-l03-retry-amplification-bl)"/>
    <path d="M600,200 L632,200" stroke="#DC2626" marker-end="url(#m04-l03-retry-amplification-rd)"/>
    <path d="M890,200 L922,200" stroke="#DC2626" marker-end="url(#m04-l03-retry-amplification-rd)"/>
  </g>

  <text x="60" y="358" font-size="20" font-weight="600" fill="#334155">Calls each layer sends on, one dot per call</text>
  <text x="1180" y="358" text-anchor="end" font-size="20" fill="#64748B">the bottom of the stack receives the product</text>
  <rect x="60" y="380" width="1120" height="220" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1055" y="422" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3 x 3 x 3 = 27 calls</text>

  <line x1="80" y1="530" x2="1160" y2="530" stroke="#E2E8F0" stroke-width="2"/>
  <g>
    <circle cx="185" cy="512" r="8" fill="#3B82F6"/>
    <circle cx="451" cy="512" r="8" fill="#3B82F6"/>
    <circle cx="475" cy="512" r="8" fill="#DC2626"/>
    <circle cx="499" cy="512" r="8" fill="#DC2626"/>
    <circle cx="741" cy="512" r="8" fill="#DC2626"/>
    <circle cx="765" cy="512" r="8" fill="#DC2626"/>
    <circle cx="789" cy="512" r="8" fill="#DC2626"/>
    <circle cx="741" cy="488" r="8" fill="#DC2626"/>
    <circle cx="765" cy="488" r="8" fill="#DC2626"/>
    <circle cx="789" cy="488" r="8" fill="#DC2626"/>
    <circle cx="741" cy="464" r="8" fill="#DC2626"/>
    <circle cx="765" cy="464" r="8" fill="#DC2626"/>
    <circle cx="789" cy="464" r="8" fill="#DC2626"/>
    <circle cx="741" cy="512" r="8" fill="#3B82F6"/>
    <circle cx="959" cy="512" r="8" fill="#DC2626"/>
    <circle cx="983" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1007" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1031" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1055" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1079" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1103" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1127" cy="512" r="8" fill="#DC2626"/>
    <circle cx="1151" cy="512" r="8" fill="#DC2626"/>
    <circle cx="959" cy="488" r="8" fill="#DC2626"/>
    <circle cx="983" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1007" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1031" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1055" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1079" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1103" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1127" cy="488" r="8" fill="#DC2626"/>
    <circle cx="1151" cy="488" r="8" fill="#DC2626"/>
    <circle cx="959" cy="464" r="8" fill="#DC2626"/>
    <circle cx="983" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1007" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1031" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1055" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1079" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1103" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1127" cy="464" r="8" fill="#DC2626"/>
    <circle cx="1151" cy="464" r="8" fill="#DC2626"/>
    <circle cx="959" cy="512" r="8" fill="#3B82F6"/>
  </g>

  <text x="185" y="568" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">1 call</text>
  <text x="185" y="594" text-anchor="middle" font-size="20" fill="#64748B">the user's request</text>
  <text x="475" y="568" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">3 calls</text>
  <text x="475" y="594" text-anchor="middle" font-size="20" fill="#64748B">out of the Gateway</text>
  <text x="765" y="568" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">9 calls</text>
  <text x="765" y="594" text-anchor="middle" font-size="20" fill="#64748B">out of Checkout</text>
  <text x="1055" y="568" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">27 calls</text>
  <text x="1055" y="594" text-anchor="middle" font-size="20" fill="#64748B">to the deepest layer</text>

  <rect x="60" y="630" width="1120" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="660" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">The rule: retry at one layer, not at every layer.</text>
  <text x="620" y="686" text-anchor="middle" font-size="20" fill="#065F46">Every layer below it fails fast and reports honestly upward.</text>

  <line x1="60" y1="750" x2="96" y2="750" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="757" font-size="20" fill="#475569">The one call the user actually asked for</text>
  <line x1="60" y1="790" x2="96" y2="790" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="797" font-size="20" fill="#475569">Extra calls created by retries: each hop multiplies the load by 3</text>
</svg>