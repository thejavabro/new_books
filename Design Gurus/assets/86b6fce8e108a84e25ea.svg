<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="700" viewBox="0 0 1300 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Blue-green deployment: blue serves everyone while green sits deployed and verified at zero traffic, the router moves all traffic at once, and the same switch backwards is the rollback">
  <rect x="0" y="0" width="1300" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="s" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#475569"/>
    </marker>
    <marker id="b" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1E3A8A"/>
    </marker>
    <marker id="g" viewBox="0 0 9 9" refX="8.5" refY="4.5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#059669"/>
    </marker>
  </defs>

  
  <rect x="40" y="188" width="180" height="80" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="130" y="223" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">All traffic</text>
  <text x="130" y="251" font-size="20" fill="#334155" text-anchor="middle">one version, always</text>
  <line x1="220" y1="228" x2="268" y2="228" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="270" y="178" width="200" height="100" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2.5"/>
  <text x="370" y="215" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Router</text>
  <text x="370" y="243" font-size="20" fill="#334155" text-anchor="middle">a load balancer target,</text>
  <text x="370" y="267" font-size="20" fill="#334155" text-anchor="middle">or a service selector</text>

  
  <path d="M470,210 L540,210 L540,124 L610,124" fill="none" stroke="#1E3A8A" stroke-width="3.5" marker-end="url(#b)"/>
  <text x="600" y="100" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="end">100% of traffic, right now</text>

  
  <path d="M470,246 L540,246 L540,352 L610,352" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#g)"/>
  <text x="600" y="392" font-size="20" font-weight="700" fill="#059669" text-anchor="end">0% of traffic, until the switch</text>

  
  <rect x="612" y="60" width="420" height="128" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="3"/>
  <text x="636" y="98" font-size="22" font-weight="700" fill="#1E3A8A">Blue: v1.41, live</text>
  <text x="636" y="130" font-size="20" fill="#334155">Stays running for hours after the</text>
  <text x="636" y="158" font-size="20" fill="#334155">switch, because it is the undo button.</text>

  
  <rect x="612" y="288" width="420" height="128" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="3"/>
  <text x="636" y="326" font-size="22" font-weight="700" fill="#065F46">Green: v1.42, idle</text>
  <text x="636" y="358" font-size="20" fill="#334155">Same infrastructure and config. Smoke</text>
  <text x="636" y="386" font-size="20" fill="#334155">tested, health checks green, pools warmed.</text>

  
  <path d="M1080,150 L1080,330 A80,26 0 0 0 1240,330 L1240,150 A80,26 0 0 0 1080,150" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <ellipse cx="1160" cy="150" rx="80" ry="26" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  <text x="1160" y="212" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">One</text>
  <text x="1160" y="240" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">database,</text>
  <text x="1160" y="268" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">shared by</text>
  <text x="1160" y="296" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">both</text>

  <line x1="1032" y1="124" x2="1076" y2="164" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>
  <line x1="1032" y1="352" x2="1076" y2="312" stroke="#475569" stroke-width="2.5" marker-end="url(#s)"/>

  
  <rect x="40" y="450" width="600" height="112" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2.5"/>
  <text x="64" y="486" font-size="20" font-weight="700" fill="#1E3A8A">The switch forward: seconds</text>
  <text x="64" y="518" font-size="20" fill="#334155">New requests go to green. Blue drains: work</text>
  <text x="64" y="546" font-size="20" fill="#334155">already in flight finishes where it started.</text>

  <rect x="660" y="450" width="600" height="112" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="684" y="486" font-size="20" font-weight="700" fill="#065F46">The switch back: about 10 seconds</text>
  <text x="684" y="518" font-size="20" fill="#334155">The rollback is the same switch, backwards.</text>
  <text x="684" y="546" font-size="20" fill="#334155">No build, no CI, nothing to ship.</text>

  
  <text x="40" y="616" font-size="20" font-weight="700" fill="#0F172A">One version answers at any given moment, so there is no mixed fleet to reason about. The database does not</text>
  <text x="40" y="646" font-size="20" font-weight="700" fill="#0F172A">switch with it, so schema changes ship additive first and contract only once no version that needs the old</text>
  <text x="40" y="676" font-size="20" font-weight="700" fill="#0F172A">shape can come back.</text>
</svg>