<text x="620" y="392" text-anchor="middle" font-size="18" font-weight="600" fill="#BE185D">splitting "5|apple##14|banana##cherry##" on ## would give 4 pieces, not 2</text>
<text x="186" y="454" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">decoded back</text>
<text x="216" y="454" font-size="18" fill="#475569">nothing decoded yet</text>
<text x="620" y="588" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Writing the length in front removes the guessing entirely</text>
<rect x="40" y="656" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="696" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A separator can always appear inside the data, but a length cannot lie</text>
<text x="620" y="728" text-anchor="middle" font-size="18.5" fill="#475569">Read the length, then take exactly that many characters, whatever they are</text>
