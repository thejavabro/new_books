<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Change data capture streams every write into a search cluster, which acts as a global index: queries get primary keys from search and rows from the database">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ix18-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ix18-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="ix18-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="360" y1="46" x2="392" y2="46" stroke="#D97706" stroke-width="3"/>
  <text x="404" y="53" font-size="20" fill="#475569">indexing path, always slightly behind</text>
  <line x1="800" y1="46" x2="832" y2="46" stroke="#3B82F6" stroke-width="3"/>
  <text x="844" y="53" font-size="20" fill="#475569">query path</text>

  
  <path d="M300,200 L376,200" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix18-amber)"/>
  <path d="M580,200 L656,200" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix18-amber)"/>
  <path d="M860,200 L936,200" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ix18-amber)"/>

  
  <path d="M720,470 C900,470 1070,462 1070,242" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix18-blue)"/>
  <path d="M520,470 C340,470 180,462 180,256" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix18-blue)"/>

  
  <g filter="url(#ix18-soft)">
    <path d="M60,170 v60 a120,20 0 0 0 240,0 v-60 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <ellipse cx="180" cy="170" rx="120" ry="20" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="180" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database</text>
  <text x="180" y="132" font-size="20" fill="#64748B" text-anchor="middle">owns the rows</text>

  
  <g filter="url(#ix18-soft)">
    <rect x="380" y="164" width="200" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="480" y="196" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Change data</text>
  <text x="480" y="222" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">capture</text>
  <text x="480" y="132" font-size="20" fill="#64748B" text-anchor="middle">reads the replication log</text>

  
  <g filter="url(#ix18-soft)">
    <path d="M660,170 v60 a100,20 0 0 0 200,0 v-60 z" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="760" cy="170" rx="100" ry="20" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="760" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Queue</text>
  <text x="760" y="132" font-size="20" fill="#64748B" text-anchor="middle">absorbs bursts</text>

  
  <g filter="url(#ix18-soft)">
    <rect x="940" y="164" width="240" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="1060" y="209" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Search cluster</text>
  <text x="1060" y="132" font-size="20" fill="#64748B" text-anchor="middle">inverted index of everything</text>

  
  <g filter="url(#ix18-soft)">
    <rect x="520" y="438" width="200" height="64" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="477" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Query</text>

  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="928" y="418" font-size="20" fill="#1D4ED8" text-anchor="middle">1. find the matching primary keys</text>
    <text x="316" y="418" font-size="20" fill="#1D4ED8" text-anchor="middle">2. fetch those rows</text>
  </g>

  <text x="620" y="558" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">This is a global secondary index assembled from separate parts.</text>

  <rect x="120" y="586" width="1000" height="60" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="622" font-size="20" fill="#334155" text-anchor="middle">Same properties: fast targeted reads, eventual consistency, one more system to run.</text>

  <text x="620" y="682" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">What you gain is ranking, fuzzy matching and geospatial filters, which no database index can do.</text>
</svg>