<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1002" viewBox="0 0 1180 1002" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Making a string great">
<defs>
<marker id="stringgreat-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="stringgreat-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="stringgreat-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="stringgreat-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="stringgreat-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="stringgreat-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="stringgreat-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="stringgreat-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="stringgreat-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1180" height="1002" fill="#FFFFFF"/>
<text x="590" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Making a string great</text>
<text x="590" y="90" text-anchor="middle" font-size="19" fill="#475569">Input: "AaBCcdEeff". Two adjacent copies of the same letter in different cases cancel.</text>
<rect x="86" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="106" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">A</text>
<text x="106" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">0</text>
<rect x="129" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="149" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">a</text>
<text x="149" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">1</text>
<rect x="172" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="192" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">B</text>
<text x="192" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">2</text>
<rect x="215" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="235" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">C</text>
<text x="235" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">3</text>
<rect x="258" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="278" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">c</text>
<text x="278" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">4</text>
<rect x="301" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="321" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">d</text>
<text x="321" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">5</text>
<rect x="344" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="364" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">E</text>
<text x="364" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">6</text>
<rect x="387" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="407" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">e</text>
<text x="407" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">7</text>
<rect x="430" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="450" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">f</text>
<text x="450" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">8</text>
<rect x="473" y="132" width="40" height="40" rx="7" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.4"/>
<text x="493" y="158" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">f</text>
<text x="493" y="190" text-anchor="middle" font-size="14.5" fill="#6B7280">9</text>
<text x="535" y="158" text-anchor="start" font-size="18.5" fill="#6B7280">index below each cell</text>
<text x="86" y="216" font-size="19.5" font-weight="600" fill="#475569">Step</text>
<text x="270" y="216" font-size="19.5" font-weight="600" fill="#475569">What happens</text>
<rect x="60" y="232" width="1060" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="262" font-size="18.5" font-weight="600" fill="#1D4ED8">'A'</text>
<text x="270" y="262" font-size="18.5" fill="#475569">the stack is empty, so push 'A'</text>
<text x="1094" y="262" text-anchor="end" font-size="18.5" fill="#047857">stack: A</text>
<rect x="60" y="294" width="1060" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="324" font-size="18.5" font-weight="600" fill="#1D4ED8">'a'</text>
<text x="270" y="324" font-size="18.5" fill="#475569">the top is 'A', the same letter in the other case, so the pair cancels</text>
<text x="1094" y="324" text-anchor="end" font-size="18.5" fill="#047857">stack: empty</text>
<rect x="60" y="356" width="1060" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="386" font-size="18.5" font-weight="600" fill="#1D4ED8">'B'</text>
<text x="270" y="386" font-size="18.5" fill="#475569">the stack is empty, so push 'B'</text>
<text x="1094" y="386" text-anchor="end" font-size="18.5" fill="#047857">stack: B</text>
<rect x="60" y="418" width="1060" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="448" font-size="18.5" font-weight="600" fill="#1D4ED8">'C'</text>
<text x="270" y="448" font-size="18.5" fill="#475569">the top is 'B', not a case pair, so push 'C'</text>
<text x="1094" y="448" text-anchor="end" font-size="18.5" fill="#047857">stack: B C</text>
<rect x="60" y="480" width="1060" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="510" font-size="18.5" font-weight="600" fill="#1D4ED8">'c'</text>
<text x="270" y="510" font-size="18.5" fill="#475569">the top is 'C', the same letter in the other case, so the pair cancels</text>
<text x="1094" y="510" text-anchor="end" font-size="18.5" fill="#047857">stack: B</text>
<rect x="60" y="542" width="1060" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="572" font-size="18.5" font-weight="600" fill="#1D4ED8">'d'</text>
<text x="270" y="572" font-size="18.5" fill="#475569">the top is 'B', not a case pair, so push 'd'</text>
<text x="1094" y="572" text-anchor="end" font-size="18.5" fill="#047857">stack: B d</text>
<rect x="60" y="604" width="1060" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="634" font-size="18.5" font-weight="600" fill="#1D4ED8">'E'</text>
<text x="270" y="634" font-size="18.5" fill="#475569">the top is 'd', not a case pair, so push 'E'</text>
<text x="1094" y="634" text-anchor="end" font-size="18.5" fill="#047857">stack: B d E</text>
<rect x="60" y="666" width="1060" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="696" font-size="18.5" font-weight="600" fill="#1D4ED8">'e'</text>
<text x="270" y="696" font-size="18.5" fill="#475569">the top is 'E', the same letter in the other case, so the pair cancels</text>
<text x="1094" y="696" text-anchor="end" font-size="18.5" fill="#047857">stack: B d</text>
<rect x="60" y="728" width="1060" height="54" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="758" font-size="18.5" font-weight="600" fill="#1D4ED8">'f'</text>
<text x="270" y="758" font-size="18.5" fill="#475569">the top is 'd', not a case pair, so push 'f'</text>
<text x="1094" y="758" text-anchor="end" font-size="18.5" fill="#047857">stack: B d f</text>
<rect x="60" y="790" width="1060" height="54" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="820" font-size="18.5" font-weight="600" fill="#1D4ED8">'f'</text>
<text x="270" y="820" font-size="18.5" fill="#475569">the top is 'f', not a case pair, so push 'f'</text>
<text x="1094" y="820" text-anchor="end" font-size="18.5" fill="#047857">stack: B d f f</text>
<rect x="60" y="878" width="1060" height="92" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="84" y="898" width="250" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="209" y="923" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Answer: "Bdff"</text>
<text x="352" y="923" font-size="18.5" fill="#475569">Only the top of the stack is ever compared, so one pass is enough.</text>
</svg>