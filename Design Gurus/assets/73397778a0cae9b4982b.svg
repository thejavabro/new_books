<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rubric-title rubric-desc">
<title id="rubric-title">The five things being scored</title>
<desc id="rubric-desc">The same rubric for all three exercises, and the same one real interviews use, because these five areas are where senior answers differ from competent ones.</desc>
<defs>
<marker id="rubric-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rubric-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rubric-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rubric-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="728" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The five things being scored</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The scoring guide, which interviewers call a rubric, is the same for all three.</text>
<rect x="40" y="650" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="650" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="148" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="155" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="428" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scoping</text>
<path d="M526 148H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 148H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rubric-marker-slate)"/>
<rect x="570" y="118" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">numbers asked for, a priority among the conflicting</text><text x="590" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">goals, and what is out of scope</text>
<circle cx="60" cy="218" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="225" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="188" width="428" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Trade-off reasoning</text>
<path d="M526 218H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 218H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rubric-marker-slate)"/>
<rect x="570" y="188" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="211.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">options, what each costs, a choice,</text><text x="590" y="236.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and when you would revisit it</text>
<circle cx="60" cy="288" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="295" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="258" width="428" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="306" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure-mode coverage</text>
<path d="M526 288H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 288H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rubric-marker-slate)"/>
<rect x="570" y="258" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="281.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what breaks per component,</text><text x="590" y="306.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and how much it takes with it</text>
<circle cx="60" cy="358" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="365" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="328" width="428" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="364" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cost awareness</text>
<path d="M526 358H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 358H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rubric-marker-slate)"/>
<rect x="570" y="328" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="351.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a number, the dominant component,</text><text x="590" y="376.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the cheaper design you rejected</text>
<circle cx="60" cy="428" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="435" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="92" y="398" width="428" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="306" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operability</text>
<path d="M526 428H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 428H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rubric-marker-slate)"/>
<rect x="570" y="398" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the signal, the debugging path,</text><text x="590" y="446.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the action at three in the morning</text>
<text x="40" y="504" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three properties of the rubric</text>
<rect x="40" y="522" width="372" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="522" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="552" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">None is about the</text><text x="64" y="578" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">architecture being right</text><text x="64" y="604" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the architecture is the medium</text>
<rect x="434" y="522" width="372" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="434" y="522" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="458" y="552" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">They are not weighted equally</text><text x="458" y="578" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">scoping and trade-offs are</text><text x="458" y="604" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the largest</text>
<rect x="828" y="522" width="372" height="100" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="828" y="522" width="5" height="100" rx="2.5" fill="#F3CF6A"/><text x="852" y="552" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Each maps to</text><text x="852" y="578" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">covered material</text><text x="852" y="604" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">nothing here is new</text>
<text x="66" y="684" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The architecture is what the five are read off.</text>
</svg>