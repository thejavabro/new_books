<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Dividing a daily count by 100,000 seconds turns a business number into a requests-per-second number by dropping five zeros">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="be5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="be5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="430" y1="120" x2="600" y2="120" stroke="#475569" stroke-width="2.5" marker-end="url(#be5-slate)"/>
  <line x1="430" y1="220" x2="600" y2="220" stroke="#475569" stroke-width="2.5" marker-end="url(#be5-slate)"/>
  <line x1="430" y1="320" x2="600" y2="320" stroke="#475569" stroke-width="2.5" marker-end="url(#be5-slate)"/>

  <g filter="url(#be5-soft)">
    <rect x="100" y="80" width="320" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="100" y="180" width="320" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="100" y="280" width="320" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="610" y="80" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="610" y="180" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="610" y="280" width="320" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="260" y="128" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">1 million a day</text>
  <text x="260" y="228" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">100 million a day</text>
  <text x="260" y="328" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">1 billion a day</text>

  <text x="770" y="128" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">10 a second</text>
  <text x="770" y="228" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">1,000 a second</text>
  <text x="770" y="328" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">10,000 a second</text>

  <text x="515" y="106" font-size="20" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">divide by 100,000</text>
  <text x="515" y="206" font-size="20" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">divide by 100,000</text>
  <text x="515" y="306" font-size="20" fill="#475569" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">divide by 100,000</text>

  <rect x="960" y="180" width="240" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1080" y="212" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Drop five</text>
  <text x="1080" y="242" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">zeros</text>

  <text x="620" y="398" font-size="20" fill="#475569" text-anchor="middle">A day is about 100,000 seconds, so the whole conversion is dropping five zeros</text>
</svg>