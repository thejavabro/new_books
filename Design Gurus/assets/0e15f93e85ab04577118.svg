<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="619" viewBox="0 0 1240 619" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Programmatic checks cover every output at almost no cost, an LLM judge scores a sample against a rubric, and human experts review the smallest sample">
  <defs>
    <marker id="c4ev1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="c4ev1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c4ev1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c4ev1-k1"><rect x="410" y="56" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev1-k2"><rect x="270" y="202" width="700" height="90" rx="12"/></clipPath>
    <clipPath id="c4ev1-k3"><rect x="130" y="348" width="980" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="619" fill="#FFFFFF"/>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M90,434 V60" marker-end="url(#c4ev1-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1150,60 V434" marker-end="url(#c4ev1-mslate)"/></g>
  <g filter="url(#c4ev1-soft)">
    <rect x="410" y="56" width="420" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="410" y="56" width="6" height="90" fill="#7C3AED" clip-path="url(#c4ev1-k1)"/>
  </g>
  <circle cx="448" cy="101" r="18" fill="#FFFFFF"/>
  <g transform="translate(437.56,90.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="474" y="108" font-size="18.5" font-weight="600" fill="#111827">Layer 3: Human evaluation</text>
  <text x="620" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">experts score a small sample by hand, using expert time</text>
  <g filter="url(#c4ev1-soft)">
    <rect x="270" y="202" width="700" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="270" y="202" width="6" height="90" fill="#4F46E5" clip-path="url(#c4ev1-k2)"/>
  </g>
  <circle cx="308" cy="247" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,236.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="334" y="254" font-size="18.5" font-weight="600" fill="#111827">Layer 2: LLM-as-judge</text>
  <text x="620" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">a model scores the golden set and a production sample against a rubric</text>
  <g filter="url(#c4ev1-soft)">
    <rect x="130" y="348" width="980" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="130" y="348" width="6" height="90" fill="#059669" clip-path="url(#c4ev1-k3)"/>
  </g>
  <circle cx="168" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,382.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="194" y="400" font-size="18.5" font-weight="600" fill="#111827">Layer 1: Programmatic checks</text>
  <text x="620" y="463" font-size="15.5" text-anchor="middle" fill="#6B7280">code checks every output, at almost no cost</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="108" y="243" fill="#B45309">pricier</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="108" y="264" fill="#B45309">at the top</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1132" y="243" fill="#047857">cheap and broad</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1132" y="264" fill="#047857">at the bottom</text></g>
  <rect x="40" y="503" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="548" text-anchor="middle" font-size="16" fill="#475569">Each layer checks what the layer below it cannot.</text>
</svg>