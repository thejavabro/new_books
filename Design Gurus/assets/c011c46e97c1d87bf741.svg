<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The reverse proxy terminates the encrypted connection from the client and passes plain traffic to the backend servers, which no longer spend CPU on encryption">
  <rect x="0" y="0" width="1240" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="px6-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="px6-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="px6-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="325" y="142" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">encrypted</text>
  <line x1="238" y1="162" x2="414" y2="162" stroke="#DC2626" stroke-width="3" marker-end="url(#px6-red)"/>

  <line x1="686" y1="142" x2="874" y2="90" stroke="#059669" stroke-width="2.5" marker-end="url(#px6-emerald)"/>
  <line x1="686" y1="162" x2="874" y2="162" stroke="#059669" stroke-width="2.5" marker-end="url(#px6-emerald)"/>
  <line x1="686" y1="182" x2="874" y2="234" stroke="#059669" stroke-width="2.5" marker-end="url(#px6-emerald)"/>

  <g filter="url(#px6-soft)">
    <rect x="60" y="122" width="178" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="420" y="112" width="266" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="880" y="62" width="250" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="134" width="250" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="206" width="250" height="56" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="149" y="169" font-size="20" fill="#0F172A" text-anchor="middle">Client</text>

  <text x="553" y="150" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Reverse proxy</text>
  <text x="553" y="184" font-size="20" fill="#7C3AED" text-anchor="middle">decrypts here</text>

  <text x="1005" y="97" font-size="20" fill="#065F46" text-anchor="middle">Backend server</text>
  <text x="1005" y="169" font-size="20" fill="#065F46" text-anchor="middle">Backend server</text>
  <text x="1005" y="241" font-size="20" fill="#065F46" text-anchor="middle">Backend server</text>

  <text x="880" y="310" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">plain traffic</text>
  <text x="880" y="340" font-size="20" fill="#475569" text-anchor="middle">no CPU spent on encryption</text>
</svg>