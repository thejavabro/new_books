<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Reading a file in a DFS: the client asks the metadata server for block locations, then reads the blocks directly from storage nodes">
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>
  <defs>
    <marker id="df3-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="df3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="df3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <line x1="240" y1="112" x2="240" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="620" y1="112" x2="620" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="1000" y1="112" x2="1000" y2="500" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  
  <line x1="248" y1="170" x2="612" y2="170" stroke="#3B82F6" stroke-width="2" marker-end="url(#df3-blue)"/>
  <text x="430" y="146" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. Where is /photos/trip.jpg?</text>

  <line x1="612" y1="320" x2="250" y2="320" stroke="#059669" stroke-width="2" marker-end="url(#df3-emerald)"/>
  <text x="430" y="296" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. Block list: B1 on node 1, B2 on node 3</text>

  <line x1="248" y1="400" x2="992" y2="400" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#df3-blue)"/>
  <text x="620" y="376" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. Read blocks directly from the storage nodes</text>

  <line x1="992" y1="460" x2="250" y2="460" stroke="#059669" stroke-width="2.5" marker-end="url(#df3-emerald)"/>
  <text x="620" y="436" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. Block data streams back to the client</text>

  
  <g filter="url(#df3-soft)">
    <rect x="90" y="40" width="300" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="470" y="40" width="300" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="850" y="40" width="300" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="240" y="98" font-size="20" fill="#64748B" text-anchor="middle">wants /photos/trip.jpg</text>
  <text x="620" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metadata Server</text>
  <text x="620" y="98" font-size="20" fill="#64748B" text-anchor="middle">file tree and block map</text>
  <text x="1000" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage Nodes</text>
  <text x="1000" y="98" font-size="20" fill="#64748B" text-anchor="middle">hold the data blocks</text>

  
  <g filter="url(#df3-soft)">
    <rect x="460" y="200" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="231" font-size="20" fill="#334155" text-anchor="middle">Looks up the file's blocks</text>
  <text x="620" y="258" font-size="20" fill="#334155" text-anchor="middle">and their locations</text>

  
  <rect x="170" y="530" width="900" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="561" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">File data never flows through the metadata server.</text>
  <text x="620" y="589" font-size="20" fill="#64748B" text-anchor="middle">It answers small lookups. The storage nodes move the heavy bytes.</text>
</svg>