<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Filtering by email matches 1 row, which is high selectivity. Filtering by country matches about 50,000 rows, which is medium selectivity. Filtering by status matches about 5,000,000 rows, which is low selectivity, and the database often scans the table instead.">
  <defs>
    <filter id="wi3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="wi3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="wi3-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="wi3-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="wi3-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Selectivity: how many rows one value matches</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same users table with 10 million rows, filtered by three different columns.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#wi3-lift)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="64" y="140" width="9" height="90" fill="#059669" clip-path="url(#wi3-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">email: 1 row</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">high selectivity</text>
  <g filter="url(#wi3-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#D97706" clip-path="url(#wi3-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">country: ~50,000 rows</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">medium selectivity</text>
  <g filter="url(#wi3-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#wi3-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">status: ~5,000,000 rows</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">low selectivity</text>

  <rect x="40" y="310" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="335" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="360" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">High</text>
  <text x="323" y="360" font-size="18.5" fill="#475569">the index filters out almost every row, so it saves a lot of work</text>
  <rect x="64" y="385" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="410" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Low</text>
  <text x="323" y="410" font-size="18.5" fill="#475569">millions of separate jumps to the table, so a full scan is often faster</text>
</svg>