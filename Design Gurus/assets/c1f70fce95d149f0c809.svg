<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left, high cohesion: the Dispatch module holds courier assignment, courier location tracking and the delivery-time estimate, which change for one reason and belong to one team. Right, low cohesion: a common module holds a refund calculation, SMS templates, a menu photo resizer and a distance formula, owned by all three teams and imported by every part of the app.">
