<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" style="background-color:#ffffff">
<defs>
<marker id="tmc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="290" y="40" width="380" height="152" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="290" y="40" width="380" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="480" y="59" text-anchor="middle" font-weight="bold" font-style="italic">ImportJob</text>

<text x="302" y="88" font-weight="bold">+ run(source)   {final}</text>
<text x="302" y="104" font-size="10.5" fill="#2f7a55">the template method: fixes the order, cannot be overridden</text>

<line x1="290" y1="116" x2="670" y2="116" stroke="#6c8ebf"/>
<text x="302" y="136" font-style="italic"># name(), readRows(), parseRow()</text>
<text x="302" y="150" font-size="10.5" fill="#b4322c">abstract: every subclass must supply these</text>

<text x="302" y="172"># shouldValidate() : boolean</text>
<text x="302" y="186" font-size="10.5" fill="#8a5f10">a hook: has a default, a subclass may override it</text>

<rect x="120" y="268" width="290" height="66" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="120" y="268" width="290" height="26" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="265" y="286" text-anchor="middle" font-weight="bold" font-size="12">CsvImportJob</text>
<text x="132" y="312" font-size="11.5"># name(), readRows(), parseRow()</text>
<text x="132" y="328" font-size="10.5" fill="#414d60">the three required steps, and nothing else</text>

<rect x="550" y="268" width="290" height="66" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="550" y="268" width="290" height="26" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="695" y="286" text-anchor="middle" font-weight="bold" font-size="12">JsonImportJob</text>
<text x="562" y="312" font-size="11.5"># name(), readRows(), parseRow()</text>
<text x="562" y="328" font-size="10.5" fill="#8a5f10"># shouldValidate() : returns false</text>

<path d="M 265 268 L 265 224 L 480 224 L 480 192" stroke="#000000" fill="none" marker-end="url(#tmc)"/>
<path d="M 695 268 L 695 224 L 480 224" stroke="#000000" fill="none"/>

<text x="60" y="96" font-size="12" fill="#414d60">The base class calls</text>
<text x="60" y="114" font-size="12" fill="#414d60">down into the subclass.</text>
<text x="60" y="140" font-size="12" fill="#414d60">That inversion is why</text>
<text x="60" y="158" font-size="12" fill="#414d60">this is the shape every</text>
<text x="60" y="176" font-size="12" fill="#414d60">framework uses.</text>

<text x="700" y="96" font-size="12" fill="#b4322c">Never call an abstract</text>
<text x="700" y="114" font-size="12" fill="#b4322c">step from the base</text>
<text x="700" y="132" font-size="12" fill="#b4322c">constructor: the</text>
<text x="700" y="150" font-size="12" fill="#b4322c">subclass fields it needs</text>
<text x="700" y="168" font-size="12" fill="#b4322c">are not set yet.</text>

<rect x="30" y="356" width="900" height="34" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="378" font-size="12.5" fill="#414d60">Keep required steps few. Nine abstract methods make the base class a form to fill in; most of them should be hooks with defaults.</text>
</g>
</svg>