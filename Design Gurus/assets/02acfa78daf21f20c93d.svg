<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With one gateway instance, its failure takes every client offline, and with several behind a load balancer the traffic simply moves">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="ag7-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ag7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ag7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="380" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">One gateway instance</text>

  <rect x="640" y="40" width="580" height="380" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Several, behind a load balancer</text>

  <line x1="310" y1="164" x2="310" y2="200" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag7-red)"/>
  <line x1="930" y1="164" x2="930" y2="200" stroke="#059669" stroke-width="2.5" marker-end="url(#ag7-emerald)"/>
  <line x1="880" y1="262" x2="810" y2="298" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="980" y1="262" x2="1050" y2="298" stroke="#059669" stroke-width="2.5" marker-end="url(#ag7-emerald)"/>

  <g filter="url(#ag7-soft)">
    <rect x="120" y="106" width="380" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="150" y="204" width="320" height="82" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="120" y="330" width="380" height="58" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="740" y="106" width="380" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="820" y="204" width="220" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="700" y="302" width="200" height="58" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="960" y="302" width="200" height="58" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="310" y="143" font-size="20" fill="#0F172A" text-anchor="middle">All client traffic</text>
  <text x="310" y="236" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Gateway: down</text>
  <text x="310" y="266" font-size="20" fill="#DC2626" text-anchor="middle">nothing gets past it</text>
  <text x="310" y="367" font-size="20" fill="#64748B" text-anchor="middle">Every service, unreachable</text>

  <text x="930" y="143" font-size="20" fill="#0F172A" text-anchor="middle">All client traffic</text>
  <text x="930" y="241" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Load balancer</text>
  <text x="800" y="339" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Gateway: down</text>
  <text x="1060" y="339" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Gateway: serving</text>

  <text x="620" y="452" font-size="20" fill="#475569" text-anchor="middle">The gateway is a single point of failure only when you run a single one</text>
</svg>