<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each dependency on the checkout path has a timeout and a fallback, so the customer always sees an estimate">
  <defs>
    <marker id="c2eta2-mbrown" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#B45309"/>
    </marker>
    <filter id="c2eta2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c2eta2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c2eta2-k1"><rect x="70" y="110" width="370" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta2-k2"><rect x="70" y="260" width="370" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta2-k3"><rect x="70" y="410" width="370" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta2-k4"><rect x="750" y="110" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta2-k5"><rect x="750" y="260" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="c2eta2-k6"><rect x="750" y="410" width="420" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="716" fill="#FFFFFF"/>
  <rect x="40" y="56" width="430" height="504" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Normal path</text>
  <rect x="720" y="56" width="480" height="504" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="744" y="86" font-size="16.5" font-weight="600" fill="#B45309">Fallback</text>
  <g fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6"><path d="M440,155 H750" marker-end="url(#c2eta2-mbrown)"/></g>
  <g fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6"><path d="M440,305 H750" marker-end="url(#c2eta2-mbrown)"/></g>
  <g fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="8 6"><path d="M440,455 H750" marker-end="url(#c2eta2-mbrown)"/></g>
  <g filter="url(#c2eta2-soft)">
    <rect x="70" y="110" width="370" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="110" width="6" height="90" fill="#64748B" clip-path="url(#c2eta2-k1)"/>
  </g>
  <circle cx="108" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="134" y="162" font-size="18.5" font-weight="600" fill="#111827">Routing service</text>
  <text x="255" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">live route, within about 15 ms</text>
  <g filter="url(#c2eta2-soft)">
    <rect x="70" y="260" width="370" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="70" y="260" width="6" height="90" fill="#4F46E5" clip-path="url(#c2eta2-k2)"/>
  </g>
  <circle cx="108" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,294.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="134" y="312" font-size="18.5" font-weight="600" fill="#111827">Online feature store</text>
  <text x="255" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">fresh streaming aggregates</text>
  <g filter="url(#c2eta2-soft)">
    <rect x="70" y="410" width="370" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="70" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#c2eta2-k3)"/>
  </g>
  <circle cx="108" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="134" y="462" font-size="18.5" font-weight="600" fill="#111827">Model service</text>
  <text x="255" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">the GBDT predicts minutes</text>
  <g filter="url(#c2eta2-soft)">
    <rect x="750" y="110" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="750" y="110" width="6" height="90" fill="#D97706" clip-path="url(#c2eta2-k4)"/>
  </g>
  <circle cx="788" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="814" y="162" font-size="18.5" font-weight="600" fill="#111827">Cached zone-to-zone estimates</text>
  <text x="960" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">plus a wider buffer</text>
  <g filter="url(#c2eta2-soft)">
    <rect x="750" y="260" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="750" y="260" width="6" height="90" fill="#D97706" clip-path="url(#c2eta2-k5)"/>
  </g>
  <circle cx="788" cy="305" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,294.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="814" y="312" font-size="18.5" font-weight="600" fill="#111827">Trained-in defaults</text>
  <text x="960" y="375" font-size="15.5" text-anchor="middle" fill="#6B7280">and a freshness monitor fires</text>
  <g filter="url(#c2eta2-soft)">
    <rect x="750" y="410" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="750" y="410" width="6" height="90" fill="#D97706" clip-path="url(#c2eta2-k6)"/>
  </g>
  <circle cx="788" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(777.56,444.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="814" y="462" font-size="18.5" font-weight="600" fill="#111827">Per-restaurant heuristic table</text>
  <text x="960" y="525" font-size="15.5" text-anchor="middle" fill="#6B7280">kept warm and versioned</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="595" y="144" fill="#B45309">down or slow</text></g>
  <text x="595" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">after about 15 ms</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="595" y="294" fill="#B45309">stale</text></g>
  <text x="595" y="329" font-size="15.5" text-anchor="middle" fill="#6B7280">old timestamps</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="595" y="444" fill="#B45309">down</text></g>
  <rect x="40" y="600" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="644" text-anchor="middle" font-size="15.5" fill="#374151">No failure leaves the checkout screen empty. Each fallback gives a less exact estimate with a wider window.</text>
</svg>