<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Choose layered architecture when building CRUD web applications and APIs that also apply business rules, when the database or providers may change, when you need clear separation of concerns, and when you want maintainable and testable code. It may not be the best fit when the application is very simple, when the domain is highly complex, or when the service is a narrow microservice">
  <defs>
    <filter id="m02l-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m02l-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02l-k1"><rect x="64" y="170" width="266" height="212" rx="12"/></clipPath>
    <clipPath id="m02l-k2"><rect x="346" y="170" width="266" height="212" rx="12"/></clipPath>
    <clipPath id="m02l-k3"><rect x="628" y="170" width="266" height="212" rx="12"/></clipPath>
    <clipPath id="m02l-k4"><rect x="910" y="170" width="266" height="212" rx="12"/></clipPath>
    <clipPath id="m02l-k5"><rect x="64" y="488" width="360" height="146" rx="12"/></clipPath>
    <clipPath id="m02l-k6"><rect x="440" y="488" width="360" height="146" rx="12"/></clipPath>
    <clipPath id="m02l-k7"><rect x="816" y="488" width="360" height="146" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to choose layered architecture</text>


  <rect x="40" y="120" width="1160" height="286" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Choose layered architecture when...</text>
  <rect x="40" y="438" width="1160" height="220" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="468" font-size="19.5" font-weight="600" fill="#BE185D">It may not be the best fit when...</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m02l-soft)">
    <rect x="64" y="170" width="266" height="212" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="170" width="6" height="212" fill="#059669" clip-path="url(#m02l-k1)"/>
  </g>
  <text x="84" y="283" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="346" y="170" width="266" height="212" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="346" y="170" width="6" height="212" fill="#059669" clip-path="url(#m02l-k2)"/>
  </g>
  <text x="366" y="283" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="628" y="170" width="266" height="212" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="628" y="170" width="6" height="212" fill="#059669" clip-path="url(#m02l-k3)"/>
  </g>
  <text x="648" y="283" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="910" y="170" width="266" height="212" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="910" y="170" width="6" height="212" fill="#059669" clip-path="url(#m02l-k4)"/>
  </g>
  <text x="930" y="283" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="64" y="488" width="360" height="146" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="488" width="6" height="146" fill="#DB2777" clip-path="url(#m02l-k5)"/>
  </g>
  <text x="84" y="568" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="440" y="488" width="360" height="146" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="440" y="488" width="6" height="146" fill="#DB2777" clip-path="url(#m02l-k6)"/>
  </g>
  <text x="460" y="568" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02l-soft)">
    <rect x="816" y="488" width="360" height="146" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="816" y="488" width="6" height="146" fill="#DB2777" clip-path="url(#m02l-k7)"/>
  </g>
  <text x="836" y="568" font-size="21.5" font-weight="600" fill="#111827"> </text>
  <text x="88" y="208" font-size="19.5" font-weight="600" fill="#111827">CRUD web applications</text>
  <text x="88" y="233" font-size="19.5" font-weight="600" fill="#111827">and APIs</text>
  <text x="88" y="268" font-size="17.5" fill="#475569">Request handling, business</text>
  <text x="88" y="292" font-size="17.5" fill="#475569">rules and data storage</text>
  <text x="88" y="316" font-size="17.5" fill="#475569">separate cleanly, as in most</text>
  <text x="88" y="340" font-size="17.5" fill="#475569">CRUD applications that also</text>
  <text x="88" y="364" font-size="17.5" fill="#475569">apply business rules.</text>
  <text x="370" y="208" font-size="19.5" font-weight="600" fill="#111827">The database or</text>
  <text x="370" y="233" font-size="19.5" font-weight="600" fill="#111827">providers may change</text>
  <text x="370" y="268" font-size="17.5" fill="#475569">Interfaces at layer</text>
  <text x="370" y="292" font-size="17.5" fill="#475569">boundaries keep most of the</text>
  <text x="370" y="316" font-size="17.5" fill="#475569">change inside one layer.</text>
  <text x="652" y="208" font-size="19.5" font-weight="600" fill="#111827">You need clear</text>
  <text x="652" y="233" font-size="19.5" font-weight="600" fill="#111827">separation of concerns</text>
  <text x="652" y="268" font-size="17.5" fill="#475569">Different teams can work</text>
  <text x="652" y="292" font-size="17.5" fill="#475569">on UI, business logic, and</text>
  <text x="652" y="316" font-size="17.5" fill="#475569">data layers independently.</text>
  <text x="934" y="208" font-size="19.5" font-weight="600" fill="#111827">You want maintainable</text>
  <text x="934" y="233" font-size="19.5" font-weight="600" fill="#111827">and testable code</text>
  <text x="934" y="268" font-size="17.5" fill="#475569">Clear layers make the</text>
  <text x="934" y="292" font-size="17.5" fill="#475569">system easier to test,</text>
  <text x="934" y="316" font-size="17.5" fill="#475569">maintain, and evolve over</text>
  <text x="934" y="340" font-size="17.5" fill="#475569">time.</text>
  <text x="88" y="526" font-size="19.5" font-weight="600" fill="#111827">The application is very simple</text>
  <text x="88" y="561" font-size="17.5" fill="#475569">With few business rules, nearly every</text>
  <text x="88" y="585" font-size="17.5" fill="#475569">request is a pass-through call (the</text>
  <text x="88" y="609" font-size="17.5" fill="#475569">architecture sinkhole).</text>
  <text x="464" y="526" font-size="19.5" font-weight="600" fill="#111827">The domain is highly complex</text>
  <text x="464" y="561" font-size="17.5" fill="#475569">Rich business rules benefit from</text>
  <text x="464" y="585" font-size="17.5" fill="#475569">hexagonal architecture, which isolates</text>
  <text x="464" y="609" font-size="17.5" fill="#475569">the domain from all infrastructure.</text>
  <text x="840" y="526" font-size="19.5" font-weight="600" fill="#111827">It is a narrow microservice</text>
  <text x="840" y="561" font-size="17.5" fill="#475569">A small service with little business</text>
  <text x="840" y="585" font-size="17.5" fill="#475569">logic may need only a service and a</text>
  <text x="840" y="609" font-size="17.5" fill="#475569">repository, without formal layers.</text>




</svg>