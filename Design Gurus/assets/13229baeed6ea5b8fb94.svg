<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="884" viewBox="0 0 1240 884" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="nat-title nat-desc">
<title id="nat-title">Charged for traffic that never leaves</title>
<desc id="nat-desc">A subnet gateway bills per GB processed, and the traffic it most commonly processes is calls to the provider own storage and queues, from your own instances, in your own region.</desc>
<defs>
<marker id="nat-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="nat-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="nat-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="nat-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="884" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Charged for traffic that never leaves</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A thousand dollars a month to let your services reach storage in the same region.</text>
<rect x="40" y="806" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="806" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="124" width="300" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">your instances</text><text x="190" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">private subnet</text>
<path d="M348 156H398" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M348 156H398" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nat-marker-slate)"/>
<rect x="406" y="124" width="300" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="556" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">subnet gateway</text><text x="556" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">$0.045 per GB</text>
<path d="M714 156H764" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M714 156H764" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nat-marker-slate)"/>
<rect x="772" y="124" width="428" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="986" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">object storage, queues, APIs</text><text x="986" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">same provider, same region</text>
<text x="620" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the traffic never leaves the region, and is charged as though it did</text>
<rect x="40" y="242" width="1160" height="146" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="72" y="282" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">20 TB/month processing</text>
<text x="620" y="282" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">20,000 GB x $0.045</text>
<text x="1168" y="282" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$900</text>
<text x="72" y="318" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">hourly, three zones</text>
<text x="620" y="318" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">$0.045 x 730 x 3</text>
<text x="1168" y="318" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$99</text>
<rect x="72" y="332" width="1096" height="44" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="88" y="361" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">to let your services reach same-region storage</text><text x="1152" y="361" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$999</text>
<text x="40" y="422" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">The fix is a private endpoint, and only one of the two kinds is free</text>
<rect x="40" y="440" width="560" height="96" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="468" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Routing-table endpoint: $0</text><text x="320" y="494" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">object storage and the key-value store,</text><text x="320" y="520" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">and the charge disappears</text>
<rect x="640" y="440" width="560" height="96" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="468" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Network-interface endpoint: about $0.01/GB</text><text x="920" y="494" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">everything else, plus an hourly charge,</text><text x="920" y="520" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">so a fifth of the gateway rate, not zero</text>
<rect x="40" y="556" width="1160" height="146" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="72" y="596" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">the same 20 TB, through the gateway</text>
<text x="620" y="596" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">$900 + $99</text>
<text x="1168" y="596" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$999</text>
<text x="72" y="632" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">network-interface endpoint</text>
<text x="620" y="632" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">$200 + $22</text>
<text x="1168" y="632" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$222</text>
<rect x="72" y="646" width="1096" height="44" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="88" y="675" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">routing-table endpoint</text><text x="1152" y="675" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$0</text>
<rect x="40" y="722" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="722" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="756" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">When a line item is large, ask what the charge is actually for.</text>
<text x="66" y="840" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Here the charge is for address translation, which same-region traffic does not need.</text>
</svg>