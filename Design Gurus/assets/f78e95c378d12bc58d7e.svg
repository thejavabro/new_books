  <circle cx="650" cy="751.5" r="3.5" fill="#059669"/>
  <text x="664" y="757.5" font-size="18.5" fill="#1F2937">Processes requests</text>
  <circle cx="650" cy="778.5" r="3.5" fill="#059669"/>
  <text x="664" y="784.5" font-size="18.5" fill="#1F2937">Calls data tier (databases, cache)</text>
  <circle cx="650" cy="805.5" r="3.5" fill="#059669"/>
  <text x="664" y="811.5" font-size="18.5" fill="#1F2937">Returns response to presentation tier</text>
