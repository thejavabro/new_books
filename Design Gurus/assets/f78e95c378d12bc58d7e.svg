<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1080" viewBox="0 0 1240 1080" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five rows, top to bottom, each tagged with a tier; the web servers row is tagged as the presentation tier together with the load balancer, which is not a tier of its own. Presentation tier: the client, a browser or mobile app, sends an HTTP or HTTPS request to the delivery tier, a CDN at the edge, which caches static content, serves content from edge locations, reduces latency, offloads traffic from origin servers and terminates TLS at the edge. For dynamic content or a cache miss it forwards the request to the web servers (presentation tier) and load balancer (Nginx, Apache), which handle incoming HTTP or HTTPS requests, terminate TLS, route requests to the application tier and serve remaining static assets. The application tier (application servers in Python, Java, Go and so on) runs business logic, processes requests, calls the data tier and returns the response. The data tier holds a database (PostgreSQL, MySQL), a cache (Redis), search (Elasticsearch) and object storage (S3). The response travels back up through each tier to the client">
