    <clipPath id="m03h-k7"><rect x="270" y="966" width="400" height="56" rx="12"/></clipPath>
    <clipPath id="m03h-k8"><rect x="720" y="966" width="456" height="56" rx="12"/></clipPath>
    <marker id="m03h-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m03h-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1080" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four-tier architecture: adding a CDN and delivery tier</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The delivery tier sits between the client and the load balancer, which is not a tier of its own.</text>

