  <text x="784" y="935" font-size="17" font-weight="600" fill="#111827">Cache: Redis</text>
  <g filter="url(#m03h-soft)">
    <rect x="270" y="966" width="400" height="56" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="270" y="966" width="6" height="56" fill="#7C3AED" clip-path="url(#m03h-k7)"/>
