  <text x="334" y="179.25" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="334" y="204.75" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m03h-soft)">
    <rect x="270" y="320" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
