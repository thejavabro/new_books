  <text x="784" y="1001" font-size="17" font-weight="600" fill="#111827">Object storage: S3</text>
  <text x="334" y="203.25" font-size="17" fill="#4B5563">browser or mobile app</text>
  <text x="334" y="606" font-size="17" fill="#4B5563">Nginx, Apache</text>
  <text x="334" y="783.25" font-size="17" fill="#4B5563">Python, Java, Go, and so on</text>

  <rect x="64" y="166" width="182" height="38" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="155" y="191" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Presentation tier</text>
  <rect x="64" y="346" width="182" height="38" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="155" y="371" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Delivery tier</text>
  <circle cx="650" cy="317" r="3.5" fill="#D97706"/>
  <text x="664" y="323" font-size="18.5" fill="#1F2937">Caches static content</text>
  <circle cx="650" cy="341" r="3.5" fill="#D97706"/>
  <text x="664" y="347" font-size="18.5" fill="#1F2937">Serves content from edge locations</text>
  <circle cx="650" cy="365" r="3.5" fill="#D97706"/>
  <text x="664" y="371" font-size="18.5" fill="#1F2937">Reduces latency</text>
  <circle cx="650" cy="389" r="3.5" fill="#D97706"/>
  <text x="664" y="395" font-size="18.5" fill="#1F2937">Offloads traffic from origin servers</text>
  <circle cx="650" cy="413" r="3.5" fill="#D97706"/>
  <text x="664" y="419" font-size="18.5" fill="#1F2937">Terminates TLS at the edge</text>
  <rect x="64" y="545" width="182" height="60" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="155" y="569.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Presentation tier</text>
  <text x="155" y="593.5" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">and load balancer</text>
  <circle cx="650" cy="534.5" r="3.5" fill="#2563EB"/>
  <text x="664" y="540.5" font-size="18.5" fill="#1F2937">Handles incoming HTTP/HTTPS requests</text>
  <circle cx="650" cy="561.5" r="3.5" fill="#2563EB"/>
  <text x="664" y="567.5" font-size="18.5" fill="#1F2937">Terminates TLS</text>
  <circle cx="650" cy="588.5" r="3.5" fill="#2563EB"/>
  <text x="664" y="594.5" font-size="18.5" fill="#1F2937">Routes requests to application tier</text>
  <circle cx="650" cy="615.5" r="3.5" fill="#2563EB"/>
  <text x="664" y="621.5" font-size="18.5" fill="#1F2937">Serves remaining static assets</text>
  <rect x="64" y="746" width="182" height="38" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="155" y="771" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Application tier</text>
  <circle cx="650" cy="724.5" r="3.5" fill="#059669"/>
