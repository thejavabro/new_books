  <text x="732" y="198" font-size="18.5" font-weight="600" fill="#111827">Job resource</text>
  <text x="916" y="261" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose an asynchronous job; accept polling or completion</text>
  <text x="916" y="284" text-anchor="middle" font-size="15.5" fill="#6B7280">delivery plus terminal-state and cancellation rules."</text>

  
