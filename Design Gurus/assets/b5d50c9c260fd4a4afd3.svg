  <text x="140" y="1198" font-size="18.5" font-weight="600" fill="#111827">but compute must be limited</text>
  <g filter="url(#p4f-soft)">
    <rect x="668" y="1126" width="496" height="112" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
