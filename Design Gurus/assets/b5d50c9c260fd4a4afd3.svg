    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="732" y="1172" font-size="18.5" font-weight="600" fill="#111827">Reserve input plus maximum</text>
  <text x="732" y="1198" font-size="18.5" font-weight="600" fill="#111827">output, then settle</text>
  <text x="916" y="1263" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose reservation and settlement; accept conservative</text>
  <text x="916" y="1286" text-anchor="middle" font-size="15.5" fill="#6B7280">temporary capacity and require a maximum output value."</text>

  
  <rect x="40" y="1336" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1358" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="1380" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Trigger</text>
  <text x="288" y="1380" font-size="15.5" fill="#475569">the situation that breaks the ordinary request</text>
  <rect x="64" y="1402" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="1424" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Choice</text>
  <text x="288" y="1424" font-size="15.5" fill="#475569">the design you name once the trigger is true</text>
  <rect x="64" y="1446" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="1468" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Interview sentence</text>
  <text x="288" y="1468" font-size="15.5" fill="#475569">the gray line is an example to explain in your own words</text>

  
  <rect x="40" y="1524" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1569" text-anchor="middle" font-size="16" fill="#475569">All six sentences have one shape: choose a single design, then name the cost you accept for it.</text>
