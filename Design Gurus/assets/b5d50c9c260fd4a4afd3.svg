  <text x="916" y="653" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose direct transfer; accept short-lived credentials</text>
  <text x="916" y="676" text-anchor="middle" font-size="15.5" fill="#6B7280">and a second transfer boundary in the client."</text>

  
