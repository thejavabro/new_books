  <text x="732" y="394" font-size="18.5" font-weight="600" fill="#111827">Resumable numbered parts</text>
  <text x="916" y="457" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose an upload session; accept temporary state,</text>
  <text x="916" y="480" text-anchor="middle" font-size="15.5" fill="#6B7280">expiry, cleanup, and completion."</text>

  
