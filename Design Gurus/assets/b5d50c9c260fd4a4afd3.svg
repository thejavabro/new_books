  <text x="916" y="849" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose API proxying; accept bandwidth, connection,</text>
  <text x="916" y="872" text-anchor="middle" font-size="15.5" fill="#6B7280">and capacity cost."</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
