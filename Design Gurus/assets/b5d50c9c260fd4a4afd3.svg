  <text x="916" y="1045" text-anchor="middle" font-size="15.5" fill="#6B7280">"Choose an in-stream error event; accept that the original</text>
  <text x="916" y="1068" text-anchor="middle" font-size="15.5" fill="#6B7280">HTTP status can no longer describe the final outcome."</text>

  
  <rect x="40" y="1106" width="1160" height="202" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
