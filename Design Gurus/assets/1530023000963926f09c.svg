<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="826" viewBox="0 0 1240 826" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One file sharing product seen through two lenses. The system design lens asks whether it keeps working as load grows, and lists clients, a load balancer, services, a cache, a database, and object storage. The API design lens asks whether a stranger can use it correctly for years, and lists one request, one response, named failures, and a versioning promise. The closing note says system design protects the implementation under growth, and API design protects the caller across change.">
