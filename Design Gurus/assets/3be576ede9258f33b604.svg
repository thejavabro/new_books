<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="688" viewBox="0 0 1240 688" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A content-addressed name is derived from the bytes and keeps working wherever the file is stored, while a location-based URL names a place and breaks as soon as the file moves">
  <rect x="0" y="0" width="1240" height="688" fill="#FFFFFF"/>
  <defs>
    <marker id="st1-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="st1-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same file, named two different ways, and then moved</text>

  
  <rect x="40" y="76" width="1160" height="248" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#065F46">Content addressed: the name comes from the bytes</text>

  <rect x="70" y="140" width="330" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="235" y="182" font-size="20" fill="#334155" text-anchor="middle">the file, whatever it is</text>
  <line x1="404" y1="175" x2="466" y2="175" stroke="#059669" stroke-width="2" marker-end="url(#st1-emerald)"/>
  <rect x="470" y="140" width="420" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="680" y="182" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">sha256:9f2c4a...</text>
  <text x="910" y="182" font-size="20" font-weight="600" fill="#065F46">the address</text>

  <text x="70" y="256" font-size="20" fill="#0F172A">Move it to another server, another region, another provider:</text>
  <text x="70" y="290" font-size="20" font-weight="600" fill="#065F46">the name still resolves, because the name is the content.</text>

  
  <rect x="40" y="344" width="1160" height="248" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="378" font-size="20" font-weight="600" fill="#B91C1C">Location addressed: the name is a place</text>

  <rect x="70" y="408" width="330" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="235" y="450" font-size="20" fill="#334155" text-anchor="middle">the same file</text>
  <line x1="404" y1="443" x2="466" y2="443" stroke="#DC2626" stroke-width="2" marker-end="url(#st1-red)"/>
  <rect x="470" y="408" width="420" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="680" y="450" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">/eu/vol3/report.pdf</text>
  <text x="910" y="450" font-size="20" font-weight="600" fill="#B91C1C">the address</text>

  <text x="70" y="524" font-size="20" fill="#0F172A">Move it to another server, another region, another provider:</text>
  <text x="70" y="558" font-size="20" font-weight="600" fill="#B91C1C">the name now points at nothing, and every link to it is dead.</text>

  
  <rect x="40" y="616" width="1160" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="648" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One name describes what the thing is. The other describes where you last put it.</text>
</svg>