<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of a short timeout and a long timeout. A short timeout notices a real failure in about one second but often marks healthy machines as dead. A long timeout almost never marks a healthy machine as dead but leaves a broken machine in the pool for up to thirty seconds.">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="hb4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="hb4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="hb4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="hb4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="hb4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="hb4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="hb4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="hb4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="hb4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The timeout is a trade, and both directions cost you something</text>
  <g filter="url(#hb4-soft)"><rect x="354" y="56" width="426" height="40" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="567" y="84" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">Short timeout (1 second)</text>
  <g filter="url(#hb4-soft)"><rect x="790" y="56" width="426" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1003" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">Long timeout (30 seconds)</text>
  <rect x="24" y="106" width="320" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="138" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Time to notice</text>
  <text x="48" y="166" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">a real failure</text>
  <g filter="url(#hb4-soft)"><rect x="354" y="106" width="426" height="78" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="567" y="152" font-size="19" fill="#0F172A" text-anchor="middle">about 1 second</text>
  <g filter="url(#hb4-soft)"><rect x="790" y="106" width="426" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1003" y="152" font-size="19" fill="#0F172A" text-anchor="middle">up to 30 seconds</text>
  <rect x="24" y="194" width="320" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="226" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Healthy machines</text>
  <text x="48" y="254" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">marked dead</text>
  <g filter="url(#hb4-soft)"><rect x="354" y="194" width="426" height="78" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="567" y="226" font-size="19" fill="#0F172A" text-anchor="middle">often, after any brief</text>
  <text x="567" y="252" font-size="19" fill="#0F172A" text-anchor="middle">network problem</text>
  <g filter="url(#hb4-soft)"><rect x="790" y="194" width="426" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1003" y="240" font-size="19" fill="#0F172A" text-anchor="middle">almost never</text>
  <rect x="24" y="282" width="320" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="328" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Cost of being wrong</text>
  <g filter="url(#hb4-soft)"><rect x="354" y="282" width="426" height="78" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="567" y="314" font-size="19" fill="#0F172A" text-anchor="middle">work moves and data is</text>
  <text x="567" y="340" font-size="19" fill="#0F172A" text-anchor="middle">copied for no reason</text>
  <g filter="url(#hb4-soft)"><rect x="790" y="282" width="426" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1003" y="314" font-size="19" fill="#0F172A" text-anchor="middle">requests keep going to</text>
  <text x="1003" y="340" font-size="19" fill="#0F172A" text-anchor="middle">a machine that is gone</text>
  <rect x="24" y="370" width="320" height="78" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="416" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Good fit for</text>
  <g filter="url(#hb4-soft)"><rect x="354" y="370" width="426" height="78" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="567" y="402" font-size="19" fill="#0F172A" text-anchor="middle">one data center,</text>
  <text x="567" y="428" font-size="19" fill="#0F172A" text-anchor="middle">stable network</text>
  <g filter="url(#hb4-soft)"><rect x="790" y="370" width="426" height="78" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="1003" y="402" font-size="19" fill="#0F172A" text-anchor="middle">across regions,</text>
  <text x="1003" y="428" font-size="19" fill="#0F172A" text-anchor="middle">slow or shared links</text>
  <text x="620" y="488" font-size="19" fill="#64748B" text-anchor="middle">Most systems settle between three and five seconds</text>
</svg>