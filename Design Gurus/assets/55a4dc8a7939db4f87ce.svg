<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1016" viewBox="0 0 1240 1016" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-stakes answers wait for a per-claim check and ship only if every claim passes, while low-stakes answers ship at once and a sample is checked later">
  <defs>
    <marker id="kagsr-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="kagsr-mgreen" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="kagsr-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="kagsr-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="kagsr-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="kagsr-k1"><rect x="40" y="490" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k2"><rect x="300" y="120" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k3"><rect x="552" y="120" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k4"><rect x="950" y="120" width="226" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k5"><rect x="570" y="300" width="184" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k6"><rect x="920" y="300" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k7"><rect x="235" y="710" width="274" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k8"><rect x="557" y="710" width="264" height="90" rx="12"/></clipPath>
    <clipPath id="kagsr-k9"><rect x="869" y="710" width="307" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1016" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1160" height="400" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">High stakes: synchronous check</text>
  <text x="64" y="94" font-size="15.5" fill="#6B7280">money amounts, refund rules, allergy information</text>
  <rect x="40" y="630" width="1160" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="660" font-size="16.5" font-weight="600" fill="#B45309">Low stakes: sampled asynchronous check</text>
  <text x="64" y="684" font-size="15.5" fill="#6B7280">how to track an order</text>
