  <circle cx="988" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,154.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1014" y="172" font-size="18.5" font-weight="600" fill="#111827">Answer released</text>
  <text x="1063" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">every claim supported</text>
  <g filter="url(#kagsr-soft)">
    <rect x="570" y="300" width="184" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="570" y="300" width="6" height="90" fill="#D97706" clip-path="url(#kagsr-k5)"/>
  </g>
  <circle cx="608" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(597.56,334.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="634" y="352" font-size="18.5" font-weight="600" fill="#111827">Retry once</text>
  <text x="662" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">with tightened instructions</text>
  <g filter="url(#kagsr-soft)">
    <rect x="920" y="300" width="256" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="920" y="300" width="6" height="90" fill="#DB2777" clip-path="url(#kagsr-k6)"/>
  </g>
  <circle cx="958" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="984" y="352" font-size="18.5" font-weight="600" fill="#111827">Refuse and escalate</text>
  <text x="1048" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">a human handoff</text>
  <g filter="url(#kagsr-soft)">
    <rect x="235" y="710" width="274" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="235" y="710" width="6" height="90" fill="#2563EB" clip-path="url(#kagsr-k7)"/>
  </g>
  <circle cx="273" cy="755" r="18" fill="#FFFFFF"/>
  <g transform="translate(262.56,744.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="299" y="762" font-size="18.5" font-weight="600" fill="#111827">Answer shown at once</text>
  <text x="372" y="825" font-size="15.5" text-anchor="middle" fill="#6B7280">can stream</text>
  <g filter="url(#kagsr-soft)">
    <rect x="557" y="710" width="264" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="557" y="710" width="6" height="90" fill="#D97706" clip-path="url(#kagsr-k8)"/>
  </g>
  <circle cx="595" cy="755" r="18" fill="#FFFFFF"/>
  <g transform="translate(584.56,744.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="621" y="762" font-size="18.5" font-weight="600" fill="#111827">Sample checked later</text>
  <text x="689" y="825" font-size="15.5" text-anchor="middle" fill="#6B7280">such as 5 percent</text>
  <g filter="url(#kagsr-soft)">
    <rect x="869" y="710" width="307" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="869" y="710" width="6" height="90" fill="#64748B" clip-path="url(#kagsr-k9)"/>
  </g>
  <circle cx="907" cy="755" r="18" fill="#FFFFFF"/>
  <g transform="translate(896.56,744.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="933" y="762" font-size="18.5" font-weight="600" fill="#111827">Dashboard and golden set</text>
  <text x="1022.5" y="825" font-size="15.5" text-anchor="middle" fill="#6B7280">the results feed both</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="236" y="155" fill="#1D4ED8">high stakes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="344" y="525" fill="#B45309">low stakes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="861" y="155" fill="#047857">every claim passes</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="650" y="280" fill="#BE185D">a claim fails</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="827" y="382" fill="#BE185D">fails again</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="873" y="263.5" fill="#047857">passes</text></g>
  <rect x="40" y="900" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="945" text-anchor="middle" font-size="16" fill="#475569">The synchronous path blocks bad claims, and the asynchronous path counts them.</text>
</svg>