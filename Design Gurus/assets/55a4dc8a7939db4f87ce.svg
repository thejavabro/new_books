    <rect x="40" y="490" width="6" height="90" fill="#64748B" clip-path="url(#kagsr-k1)"/>
  </g>
  <circle cx="78" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,524.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="542" font-size="18.5" font-weight="600" fill="#111827">Answer generated</text>
  <text x="160" y="605" font-size="15.5" text-anchor="middle" fill="#6B7280">routed by its stakes</text>
  <g filter="url(#kagsr-soft)">
    <rect x="300" y="120" width="196" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="300" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#kagsr-k2)"/>
  </g>
  <circle cx="338" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(327.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="364" y="172" font-size="18.5" font-weight="600" fill="#111827">Answer held</text>
  <text x="398" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">cannot stream while it is checked</text>
  <g filter="url(#kagsr-soft)">
    <rect x="552" y="120" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="552" y="120" width="6" height="90" fill="#2563EB" clip-path="url(#kagsr-k3)"/>
  </g>
  <circle cx="590" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(579.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="616" y="172" font-size="18.5" font-weight="600" fill="#111827">Per-claim check</text>
  <text x="662" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">about 100 to 300 ms</text>
  <g filter="url(#kagsr-soft)">
    <rect x="950" y="120" width="226" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="950" y="120" width="6" height="90" fill="#059669" clip-path="url(#kagsr-k4)"/>
