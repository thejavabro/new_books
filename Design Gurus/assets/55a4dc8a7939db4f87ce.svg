  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M280,535 H408 Q420,535 420,547 V710" marker-end="url(#kagsr-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M496,165 H552" marker-end="url(#kagsr-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M772,165 H950" marker-end="url(#kagsr-mgreen)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M662,247 V300" marker-end="url(#kagsr-mpink)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M754,360 H920" marker-end="url(#kagsr-mpink)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M754,330 H849 Q861,330 861,318 V197 Q861,185 873,185 H950" marker-end="url(#kagsr-mgreen)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M509,755 H557" marker-end="url(#kagsr-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M821,755 H869" marker-end="url(#kagsr-mslate)"/></g>
