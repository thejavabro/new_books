<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A payment request for 100 US dollars goes to the core system; the core looks up a plugin by the capability payment.process in the plugin registry; the registry finds the matching plugins among Stripe, PayPal and Razorpay, which all declare payment.process; it selects the preferred provider, or else the first active plugin, here Stripe; the core executes the request through the selected plugin">
  <defs>
    <filter id="m09i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m09i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m09i-k1"><rect x="40" y="150" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m09i-k2"><rect x="430" y="150" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m09i-k3"><rect x="900" y="150" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m09i-k4"><rect x="864" y="410" width="312" height="64" rx="12"/></clipPath>
    <clipPath id="m09i-k5"><rect x="864" y="520" width="312" height="64" rx="12"/></clipPath>
    <clipPath id="m09i-k6"><rect x="864" y="630" width="312" height="64" rx="12"/></clipPath>
    <clipPath id="m09i-k7"><rect x="330" y="470" width="400" height="90" rx="12"/></clipPath>
    <marker id="m09i-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m09i-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="m09i-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Capability-based plugin selection</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The core asks the registry for a capability, not a provider, and runs the request through the plugin it gets back.</text>

  <rect x="840" y="330" width="360" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="864" y="360" font-size="19.5" font-weight="600" fill="#475569">Available plugins</text>

  <g fill="none" stroke-width="2">
    <path d="M300,195 H430" stroke="#2563EB" marker-end="url(#m09i-m-blue)"/>
    <path d="M690,195 H900" stroke="#2563EB" marker-end="url(#m09i-m-blue)"/>
    <path d="M1020,240 V330" stroke="#7C3AED" marker-end="url(#m09i-m-violet)"/>
    <path d="M930,240 V288 Q930,300 918,300 H632 Q620,300 620,312 V470" stroke="#7C3AED" stroke-dasharray="7 6" marker-end="url(#m09i-m-violet)"/>
    <path d="M480,240 V470" stroke="#059669" marker-end="url(#m09i-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="795" y="130" fill="#1D4ED8">1. Lookup plugin</text>
    <text x="795" y="154" fill="#1D4ED8">by capability</text>
    <text x="795" y="178" fill="#1D4ED8">(payment.process)</text>
    <text x="1034" y="276" fill="#5B21B6" text-anchor="start">2. Find matching</text>
    <text x="1034" y="300" fill="#5B21B6" text-anchor="start">plugins</text>
    <text x="634" y="350" fill="#5B21B6" text-anchor="start">3. Select a plugin</text>
    <text x="634" y="374" fill="#5B21B6" text-anchor="start">(preferred provider,</text>
    <text x="634" y="398" fill="#5B21B6" text-anchor="start">or else first active)</text>
    <text x="466" y="372" fill="#047857" text-anchor="end">4. Execute request</text>
    <text x="466" y="396" fill="#047857" text-anchor="end">through plugin</text>
  </g>

  <g filter="url(#m09i-soft)">
    <rect x="40" y="150" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#m09i-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Payment request</text>
  <text x="170" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">amount: $100</text>
  <text x="170" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">currency: USD</text>
  
  <g filter="url(#m09i-lift)">
    <rect x="430" y="150" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="430" y="150" width="9" height="90" fill="#2563EB" clip-path="url(#m09i-k2)"/>
  </g>
  <circle cx="468" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="494" y="189.25" font-size="21.5" font-weight="600" fill="#111827">Core system</text>
  <text x="494" y="214.75" font-size="21.5" font-weight="600" fill="#111827">(microkernel)</text>
  <g filter="url(#m09i-soft)">
    <rect x="900" y="150" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="900" y="150" width="6" height="90" fill="#7C3AED" clip-path="url(#m09i-k3)"/>
  </g>
  <circle cx="938" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,184.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="964" y="202" font-size="21.5" font-weight="600" fill="#111827">Plugin registry</text>
  <g filter="url(#m09i-soft)">
    <rect x="864" y="410" width="312" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="864" y="410" width="6" height="64" fill="#059669" clip-path="url(#m09i-k4)"/>
  </g>
  <circle cx="902" cy="442" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,431.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="928" y="449" font-size="19.5" font-weight="600" fill="#111827">Stripe plugin</text>
  <text x="1020" y="503" font-size="18.5" text-anchor="middle" fill="#6B7280">capabilities: payment.process</text>
  <g filter="url(#m09i-soft)">
    <rect x="864" y="520" width="312" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="864" y="520" width="6" height="64" fill="#64748B" clip-path="url(#m09i-k5)"/>
  </g>
  <circle cx="902" cy="552" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,541.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="928" y="559" font-size="19.5" font-weight="600" fill="#111827">PayPal plugin</text>
  <text x="1020" y="613" font-size="18.5" text-anchor="middle" fill="#6B7280">capabilities: payment.process</text>
  <g filter="url(#m09i-soft)">
    <rect x="864" y="630" width="312" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="864" y="630" width="6" height="64" fill="#64748B" clip-path="url(#m09i-k6)"/>
  </g>
  <circle cx="902" cy="662" r="18" fill="#FFFFFF"/>
  <g transform="translate(891.56,651.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="928" y="669" font-size="19.5" font-weight="600" fill="#111827">Razorpay plugin</text>
  <text x="1020" y="723" font-size="18.5" text-anchor="middle" fill="#6B7280">capabilities: payment.process</text>
  <g filter="url(#m09i-soft)">
    <rect x="330" y="470" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="330" y="470" width="6" height="90" fill="#059669" clip-path="url(#m09i-k7)"/>
  </g>
  <circle cx="368" cy="515" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,504.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="394" y="522" font-size="21.5" font-weight="600" fill="#111827">Selected: Stripe plugin</text>
  <text x="530" y="589" font-size="18.5" text-anchor="middle" fill="#6B7280">capabilities: payment.process</text>




</svg>