<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1542" viewBox="0 0 1240 1542" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Deployment diagram. Browsers load web application files from a CDN and call a managed load balancer over HTTPS. Browsers are devices that run the web application. Inside one cloud region, a deployment node whose tasks run on a managed container platform, the load balancer sends HTTP traffic to two API application container instances, one in zone A and one in zone B. A worker container instance runs in zone A. All three tasks use the PostgreSQL primary in zone A, which replicates to a standby in zone B. Object storage, the image registry and logs and metrics are regional managed services. The worker stores certificate PDFs in object storage over HTTPS, and every task sends logs and metrics. A build pipeline pushes one image to the registry, and every task pulls it.">
