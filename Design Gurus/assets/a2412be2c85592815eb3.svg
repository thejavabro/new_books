<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Update in place stores only the current balance and destroys history; an append-only event store keeps every change as an immutable row">
  <defs>
    <marker id="es1-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="es1-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="es1-k1"><rect x="170" y="290" width="260" height="70" rx="12"/></clipPath>
    <clipPath id="es1-k2"><rect x="740" y="100" width="360" height="70" rx="12"/></clipPath>
    <clipPath id="es1-k3"><rect x="740" y="220" width="360" height="70" rx="12"/></clipPath>
    <clipPath id="es1-k4"><rect x="740" y="340" width="360" height="70" rx="12"/></clipPath>
    <filter id="es1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="es1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>

  <rect x="40" y="44" width="560" height="420" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">Update in place: state only</text>
  <rect x="640" y="44" width="560" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="74" font-size="16.5" font-weight="600" fill="#047857">Append only: every change kept</text>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M300,226 V282" marker-end="url(#es1-mpink)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M920,170 V212" marker-end="url(#es1-memerald)"/>
    <path d="M920,290 V332" marker-end="url(#es1-memerald)"/>
  </g>
  <g stroke="#DB2777" stroke-width="1.5">
    <path d="M 150,140 L 150,194 A 150,16 0 0 0 450,194 L 450,140" fill="#FCE7F3"/>
    <ellipse cx="300" cy="140" rx="150" ry="16" fill="#FDF2F8"/>
  </g>
  <text x="300" y="187" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">accounts table</text>
  <g filter="url(#es1-soft)">
    <rect x="170" y="290" width="260" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="170" y="290" width="6" height="70" fill="#DB2777" clip-path="url(#es1-k1)"/>
  </g>
  <circle cx="208" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="234" y="332" font-size="18.5" font-weight="600" fill="#111827">balance = 40</text>
  <text x="300" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">the update overwrote the 60</text>
  <text x="300" y="408" font-size="15.5" text-anchor="middle" fill="#94A3B8">history gone at commit</text>
  <g filter="url(#es1-soft)">
    <rect x="740" y="100" width="360" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="100" width="6" height="70" fill="#059669" clip-path="url(#es1-k2)"/>
  </g>
  <circle cx="778" cy="135" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,124.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="804" y="142" font-size="18.5" font-weight="600" fill="#111827">AccountOpened</text>
  <g filter="url(#es1-soft)">
    <rect x="740" y="220" width="360" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="220" width="6" height="70" fill="#059669" clip-path="url(#es1-k3)"/>
  </g>
  <circle cx="778" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,244.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="804" y="262" font-size="18.5" font-weight="600" fill="#111827">MoneyDeposited 60</text>
  <g filter="url(#es1-soft)">
    <rect x="740" y="340" width="360" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="740" y="340" width="6" height="70" fill="#059669" clip-path="url(#es1-k4)"/>
  </g>
  <circle cx="778" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(767.56,364.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="804" y="382" font-size="18.5" font-weight="600" fill="#111827">MoneyWithdrawn 20</text>
  <text x="920" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">rows are added, never changed</text>
  <rect x="40" y="504" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="528" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="550" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">State only</text>
  <text x="288" y="550" font-size="15.5" fill="#475569">answers one question: what is the value now</text>
  <rect x="64" y="572" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="594" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Events</text>
  <text x="288" y="594" font-size="15.5" fill="#475569">answer every question: what happened, in what order, and why</text>
</svg>