<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two stacked sequence diagrams contrasting the same moment. Top band, synchronous: Checkout calls Payments to charge the card and stays blocked until the result comes back. Bottom band, asynchronous: Checkout publishes an order placed message to a broker, responds to the user immediately, and the broker delivers the message to Notifications when the consumer is ready.">
  <defs>
    <marker id="m03-l01-sync-vs-async-contrast-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l01-sync-vs-async-contrast-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m03-l01-sync-vs-async-contrast-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l01-sync-vs-async-contrast-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="310" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous: the caller waits</text>
  <text x="1178" y="98" text-anchor="end" font-size="20" fill="#64748B">if Payments hangs, Checkout hangs with it</text>
  <rect x="40" y="400" width="1160" height="340" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="438" font-size="20" font-weight="600" fill="#92400E">Asynchronous: the caller moves on</text>
  <text x="1178" y="438" text-anchor="end" font-size="20" fill="#64748B">the broker holds the message</text>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="330" y1="206" x2="330" y2="356"/>
    <line x1="980" y1="206" x2="980" y2="356"/>
    <line x1="330" y1="536" x2="330" y2="722"/>
    <line x1="700" y1="536" x2="700" y2="722"/>
    <line x1="1010" y1="536" x2="1010" y2="722"/>
  </g>

  
  <g fill="none">
    <path d="M338,258 L968,258" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l01-sync-vs-async-contrast-bl)"/>
    <path d="M968,324 L338,324" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m03-l01-sync-vs-async-contrast-em)"/>
    <path d="M332,584 L688,584" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l01-sync-vs-async-contrast-ab)"/>
    <path d="M334,614 H396 Q408,614 408,626 V642 Q408,654 396,654 H334" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m03-l01-sync-vs-async-contrast-em)"/>
    <path d="M708,700 L998,700" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m03-l01-sync-vs-async-contrast-ab)"/>
  </g>

  
  <rect x="323" y="248" width="14" height="84" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="973" y="254" width="14" height="72" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="215" y="130" width="230" height="76" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="330" y="164" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="330" y="194" text-anchor="middle" font-size="20" fill="#64748B">the caller</text>
  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="855" y="130" width="250" height="76" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="980" y="164" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <text x="980" y="194" text-anchor="middle" font-size="20" fill="#64748B">the callee</text>

  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="215" y="460" width="230" height="76" rx="10" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="330" y="494" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="330" y="524" text-anchor="middle" font-size="20" fill="#64748B">the caller</text>
  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="580" y="460" width="240" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="700" y="494" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="700" y="524" text-anchor="middle" font-size="20" fill="#64748B">queue or topic</text>
  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="880" y="460" width="260" height="76" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1010" y="494" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <text x="1010" y="524" text-anchor="middle" font-size="20" fill="#64748B">the consumer</text>

  
  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="44" y="272" width="262" height="54" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="175" y="306" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF">Blocked until the reply</text>

  <g filter="url(#m03-l01-sync-vs-async-contrast-soft)">
    <rect x="44" y="600" width="262" height="54" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="175" y="634" text-anchor="middle" font-size="20" font-weight="600" fill="#92400E">Free after the publish</text>

  
  <g font-size="20" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="653" y="244" text-anchor="middle" fill="#1E40AF">charge card</text>
    <text x="653" y="310" text-anchor="middle" fill="#065F46">result (the caller was blocked until now)</text>
    <text x="510" y="570" text-anchor="middle" fill="#92400E">publish "order placed"</text>
    <text x="422" y="648" fill="#065F46">respond to the user immediately</text>
    <text x="853" y="686" text-anchor="middle" fill="#92400E">delivered when the consumer is ready</text>
  </g>

  <line x1="50" y1="780" x2="86" y2="780" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="787" font-size="20" fill="#475569">Synchronous call: the caller blocks until the reply</text>
  <line x1="50" y1="820" x2="86" y2="820" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="827" font-size="20" fill="#475569">Reply, or the immediate response to the user</text>
  <line x1="50" y1="860" x2="86" y2="860" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="867" font-size="20" fill="#475569">Asynchronous message: published to the broker, delivered later</text>
</svg>