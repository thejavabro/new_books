<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1126" viewBox="0 0 1240 1126" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four broken invoice URLs and their repairs, ranked by consequence: an action in the path, identity in a query parameter, filters and paging as path segments, and a verb where a sub-resource belongs.">
  <defs>
    <filter id="xl04surface-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <marker id="xl04surface-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <clipPath id="xl04surface-k1"><rect x="200" y="176" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k2"><rect x="200" y="252" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k3"><rect x="200" y="396" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k4"><rect x="200" y="472" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k5"><rect x="200" y="616" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k6"><rect x="200" y="692" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k7"><rect x="200" y="836" width="960" height="48" rx="10"/></clipPath>
    <clipPath id="xl04surface-k8"><rect x="200" y="912" width="960" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1126" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">A draft API with more consistent URL patterns</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each repair sits under the URL it replaces</text>

  
  <rect x="40" y="126" width="1160" height="198" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="64" y="140" width="30" height="26" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="79" y="158" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">1</text>
  <text x="106" y="158" font-size="16.5" font-weight="600" fill="#475569">An action name is less consistent with the resource-oriented convention.</text>

  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,226 L620,248" marker-end="url(#xl04surface-sl)"/>
  </g>

  <text x="180" y="206" text-anchor="end" font-size="15.5" fill="#6B7280">Draft</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="176" width="960" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="200" y="176" width="6" height="48" fill="#DB2777" clip-path="url(#xl04surface-k1)"/>
  </g>
  <circle cx="234" cy="200" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,191) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="258" y="207" font-size="18.5" font-weight="600" fill="#111827">POST /createInvoice</text>

  <text x="180" y="282" text-anchor="end" font-size="15.5" fill="#6B7280">Repaired</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="252" width="960" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="200" y="252" width="6" height="48" fill="#059669" clip-path="url(#xl04surface-k2)"/>
  </g>
  <circle cx="234" cy="276" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,267) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="258" y="283" font-size="18.5" font-weight="600" fill="#111827">POST /invoices</text>

  
  <rect x="40" y="346" width="1160" height="198" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="64" y="360" width="30" height="26" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="79" y="378" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">2</text>
  <text x="106" y="378" font-size="16.5" font-weight="600" fill="#475569">Identity was a query parameter, and the collection noun was singular.</text>

  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,446 L620,468" marker-end="url(#xl04surface-sl)"/>
  </g>

  <text x="180" y="426" text-anchor="end" font-size="15.5" fill="#6B7280">Draft</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="396" width="960" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="200" y="396" width="6" height="48" fill="#DB2777" clip-path="url(#xl04surface-k3)"/>
  </g>
  <circle cx="234" cy="420" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,411) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="258" y="427" font-size="18.5" font-weight="600" fill="#111827">GET /invoice?id=inv_81M</text>

  <text x="180" y="502" text-anchor="end" font-size="15.5" fill="#6B7280">Repaired</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="472" width="960" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="200" y="472" width="6" height="48" fill="#059669" clip-path="url(#xl04surface-k4)"/>
  </g>
  <circle cx="234" cy="496" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,487) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="258" y="503" font-size="18.5" font-weight="600" fill="#111827">GET /invoices/inv_81M</text>

  
  <rect x="40" y="566" width="1160" height="198" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="64" y="580" width="30" height="26" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="79" y="598" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">3</text>
  <text x="106" y="598" font-size="16.5" font-weight="600" fill="#475569">Filters and paging were path segments, so the path invented an identity per status and page.</text>

  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,666 L620,688" marker-end="url(#xl04surface-sl)"/>
  </g>

  <text x="180" y="646" text-anchor="end" font-size="15.5" fill="#6B7280">Draft</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="616" width="960" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="200" y="616" width="6" height="48" fill="#DB2777" clip-path="url(#xl04surface-k5)"/>
  </g>
  <circle cx="234" cy="640" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,631) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="258" y="647" font-size="18.5" font-weight="600" fill="#111827">GET /customers/cus_42Q/invoices/status/overdue/page/3</text>

  <text x="180" y="722" text-anchor="end" font-size="15.5" fill="#6B7280">Repaired</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="692" width="960" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="200" y="692" width="6" height="48" fill="#059669" clip-path="url(#xl04surface-k6)"/>
  </g>
  <circle cx="234" cy="716" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,707) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="258" y="723" font-size="18.5" font-weight="600" fill="#111827">GET /customers/cus_42Q/invoices?status=overdue&amp;limit=20</text>

  
  <rect x="40" y="786" width="1160" height="198" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="64" y="800" width="30" height="26" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="79" y="818" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">4</text>
  <text x="106" y="818" font-size="16.5" font-weight="600" fill="#475569">A sent reminder has an id and a delivery result, so it is a sub-resource, not a verb.</text>

  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,886 L620,908" marker-end="url(#xl04surface-sl)"/>
  </g>

  <text x="180" y="866" text-anchor="end" font-size="15.5" fill="#6B7280">Draft</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="836" width="960" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="200" y="836" width="6" height="48" fill="#DB2777" clip-path="url(#xl04surface-k7)"/>
  </g>
  <circle cx="234" cy="860" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,851) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="258" y="867" font-size="18.5" font-weight="600" fill="#111827">POST /customers/cus_42Q/invoices/inv_81M/sendReminder</text>

  <text x="180" y="942" text-anchor="end" font-size="15.5" fill="#6B7280">Repaired</text>
  <g filter="url(#xl04surface-soft)">
    <rect x="200" y="912" width="960" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="200" y="912" width="6" height="48" fill="#059669" clip-path="url(#xl04surface-k8)"/>
  </g>
  <circle cx="234" cy="936" r="15" fill="#FFFFFF"/>
  <g transform="translate(225,927) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="258" y="943" font-size="18.5" font-weight="600" fill="#111827">POST /invoices/inv_81M/reminders</text>

  
  <rect x="40" y="1010" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1055" text-anchor="middle" font-size="16" fill="#475569">The corrected surface is smaller because each part of the URL now has exactly one job.</text>
</svg>