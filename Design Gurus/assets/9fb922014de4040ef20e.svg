<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1396" viewBox="0 0 1240 1396" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ten conventions the course fixes once and reuses in every lesson and worked answer: list envelopes, page size, identifiers, time, money, enums, invalid input, creation, error bodies, and additive change.">
