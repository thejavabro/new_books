      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl01convent-k1"><rect x="110" y="136" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k2"><rect x="690" y="136" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k3"><rect x="110" y="364" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k4"><rect x="690" y="364" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k5"><rect x="110" y="592" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k6"><rect x="690" y="592" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k7"><rect x="110" y="820" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k8"><rect x="690" y="820" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k9"><rect x="110" y="1048" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl01convent-k10"><rect x="690" y="1048" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1396" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="1192" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Ten default conventions used in this course</text>

  
  <rect x="64" y="88" width="1112" height="208" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="118" font-size="16.5" font-weight="600" fill="#1D4ED8">List responses and paging</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="110" y="136" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="110" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#xl01convent-k1)"/>
  </g>
  <circle cx="148" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="174" y="188" font-size="18.5" font-weight="600" fill="#111827">Lists</text>
  <text x="330" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">items and next_cursor</text>
  <text x="330" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">never a bare array, and next_cursor is null at the end</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="690" y="136" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="690" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#xl01convent-k2)"/>
  </g>
  <circle cx="728" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="754" y="188" font-size="18.5" font-weight="600" fill="#111827">Page size</text>
  <text x="910" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">20 by default, 100 at most</text>
  <text x="910" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">a larger request returns 400, not a silent cut</text>

  
  <rect x="64" y="316" width="1112" height="208" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="88" y="346" font-size="16.5" font-weight="600" fill="#BE185D">Identifiers and time</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="110" y="364" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="110" y="364" width="6" height="90" fill="#DB2777" clip-path="url(#xl01convent-k3)"/>
  </g>
  <circle cx="148" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,398.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="174" y="416" font-size="18.5" font-weight="600" fill="#111827">Identifiers</text>
  <text x="330" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">opaque strings</text>
  <text x="330" y="502" font-size="15.5" text-anchor="middle" fill="#94A3B8">stored and compared, never parsed or ordered</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="690" y="364" width="440" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="690" y="364" width="6" height="90" fill="#DB2777" clip-path="url(#xl01convent-k4)"/>
  </g>
  <circle cx="728" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,398.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="754" y="416" font-size="18.5" font-weight="600" fill="#111827">Time</text>
  <text x="910" y="479" font-size="15.5" text-anchor="middle" fill="#6B7280">RFC 3339 in UTC</text>
  <text x="910" y="502" font-size="15.5" text-anchor="middle" fill="#94A3B8">a field that names a moment ends in _at</text>

  
  <rect x="64" y="544" width="1112" height="208" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="574" font-size="16.5" font-weight="600" fill="#047857">Money and enums</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="110" y="592" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="110" y="592" width="6" height="90" fill="#059669" clip-path="url(#xl01convent-k5)"/>
  </g>
  <circle cx="148" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,626.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.4 7.6l3.6 4.2 3.6-4.2"/>
    <path d="M8.4 13.1h7.2M8.4 16h7.2M12 11.8v4.9"/>
  </g>
  <text x="174" y="644" font-size="18.5" font-weight="600" fill="#111827">Money</text>
  <text x="330" y="707" font-size="15.5" text-anchor="middle" fill="#6B7280">smallest unit, plus currency</text>
  <text x="330" y="730" font-size="15.5" text-anchor="middle" fill="#94A3B8">never an unqualified decimal amount</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="690" y="592" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="592" width="6" height="90" fill="#059669" clip-path="url(#xl01convent-k6)"/>
  </g>
  <circle cx="728" cy="637" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,626.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="754" y="644" font-size="18.5" font-weight="600" fill="#111827">Enums</text>
  <text x="910" y="707" font-size="15.5" text-anchor="middle" fill="#6B7280">strings that will grow</text>
  <text x="910" y="730" font-size="15.5" text-anchor="middle" fill="#94A3B8">callers tolerate a value they have not seen</text>

  
  <rect x="64" y="772" width="1112" height="208" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="88" y="802" font-size="16.5" font-weight="600" fill="#B45309">Validation and creation</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="110" y="820" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="110" y="820" width="6" height="90" fill="#D97706" clip-path="url(#xl01convent-k7)"/>
  </g>
  <circle cx="148" cy="865" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,854.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="174" y="872" font-size="18.5" font-weight="600" fill="#111827">Invalid input</text>
  <text x="330" y="935" font-size="15.5" text-anchor="middle" fill="#6B7280">400 Bad Request</text>
  <text x="330" y="958" font-size="15.5" text-anchor="middle" fill="#94A3B8">course convention; other APIs may use 422</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="690" y="820" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="690" y="820" width="6" height="90" fill="#D97706" clip-path="url(#xl01convent-k8)"/>
  </g>
  <circle cx="728" cy="865" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,854.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="754" y="872" font-size="18.5" font-weight="600" fill="#111827">Creation</text>
  <text x="910" y="935" font-size="15.5" text-anchor="middle" fill="#6B7280">201 Created, and Location</text>
  <text x="910" y="958" font-size="15.5" text-anchor="middle" fill="#94A3B8">the body carries the complete new resource</text>

  
  <rect x="64" y="1000" width="1112" height="208" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="88" y="1030" font-size="16.5" font-weight="600" fill="#5B21B6">Error bodies and change</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="110" y="1048" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="110" y="1048" width="6" height="90" fill="#7C3AED" clip-path="url(#xl01convent-k9)"/>
  </g>
  <circle cx="148" cy="1093" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,1082.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="174" y="1100" font-size="18.5" font-weight="600" fill="#111827">Errors</text>
  <text x="330" y="1163" font-size="15.5" text-anchor="middle" fill="#6B7280">code, message, field, request_id</text>
  <text x="330" y="1186" font-size="15.5" text-anchor="middle" fill="#94A3B8">programs read code, people read message</text>

  <g filter="url(#xl01convent-soft)">
    <rect x="690" y="1048" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="690" y="1048" width="6" height="90" fill="#7C3AED" clip-path="url(#xl01convent-k10)"/>
  </g>
  <circle cx="728" cy="1093" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,1082.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="754" y="1100" font-size="18.5" font-weight="600" fill="#111827">Change</text>
  <text x="910" y="1163" font-size="15.5" text-anchor="middle" fill="#6B7280">callers ignore unknown fields</text>
  <text x="910" y="1186" font-size="15.5" text-anchor="middle" fill="#94A3B8">one condition for a compatible field addition</text>

  
  <rect x="40" y="1256" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1296" text-anchor="middle" font-size="16" fill="#475569">These are course defaults, not the only valid choices. Explain any exception.</text>
  <text x="620" y="1324" text-anchor="middle" font-size="16" fill="#475569">Choose a reasonable convention, say it aloud, apply it everywhere, then spend time on the product.</text>
</svg>