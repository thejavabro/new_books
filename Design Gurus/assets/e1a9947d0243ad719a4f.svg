<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="compaction-title compaction-desc">
<title id="compaction-title">Compaction strategies and their costs</title>
<desc id="compaction-desc">Leveled compaction keeps read and space amplification low and pays a high write amplification. Size-tiered compaction does the reverse. Time-window compaction groups SSTables by time so an expired window is deleted rather than merged.</desc>
<defs>
<marker id="compaction-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="compaction-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="compaction-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="compaction-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="608" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Compaction strategies and their costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The strategies differ in which cost they accept.</text>
<rect x="40" y="530" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="530" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<rect x="40" y="118" width="372" height="386" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V498A6 6 0 0 0 46 504H54Z" fill="#5EC9EC"/>
<circle cx="86" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="86" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="118" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Leveled</text>
<text x="118" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">RocksDB default</text>
<rect x="166" y="196" width="120" height="32" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">L0</text><rect x="121" y="236" width="210" height="32" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="258" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">L1</text><rect x="76" y="276" width="300" height="32" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">L2</text><text x="226" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">each level 10x the one above</text>
<rect x="62" y="356" width="328" height="40" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="78" y="383" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Write amp</text><text x="374" y="383" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">10x and higher</text>
<rect x="62" y="402" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="78" y="429" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Read amp</text><text x="374" y="429" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">low</text>
<rect x="62" y="448" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="78" y="475" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Space amp</text><text x="374" y="475" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">low</text>
<rect x="434" y="118" width="372" height="386" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V498A6 6 0 0 0 440 504H448Z" fill="#39D5AA"/>
<circle cx="480" cy="146" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="480" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="512" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Size-tiered</text>
<text x="512" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Cassandra default</text>
<rect x="456" y="196" width="90" height="32" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="501" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="575" y="196" width="90" height="32" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle"></text><rect x="694" y="196" width="90" height="32" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="739" y="218" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle"></text><path d="M620 232V266" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 232V266" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#compaction-marker-slate)"/><rect x="530" y="270" width="180" height="32" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="292" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">merged</text><text x="620" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">similar sizes merge in batches</text>
<rect x="456" y="356" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="472" y="383" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Write amp</text><text x="768" y="383" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">low</text>
<rect x="456" y="402" width="328" height="40" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="472" y="429" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Read amp</text><text x="768" y="429" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">high</text>
<rect x="456" y="448" width="328" height="40" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="472" y="475" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Space amp</text><text x="768" y="475" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">high</text>
<rect x="828" y="118" width="372" height="386" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V498A6 6 0 0 0 834 504H842Z" fill="#F3CF6A"/>
<circle cx="874" cy="146" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="874" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="906" y="154" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Time-window</text>
<text x="906" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">time-series data</text>
<rect x="850" y="196" width="96" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="898" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Mon</text><rect x="966" y="196" width="96" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tue</text><rect x="1082" y="196" width="96" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1130" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Wed</text><text x="898" y="290" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">past its</text><text x="898" y="314" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">retention</text><text x="1072" y="290" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the whole window is</text><text x="1072" y="314" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">deleted, never merged</text>
<rect x="850" y="356" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="866" y="383" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Write amp</text><text x="1162" y="383" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">low</text>
<rect x="850" y="402" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="866" y="429" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Read amp</text><text x="1162" y="429" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">low in window</text>
<rect x="850" y="448" width="328" height="40" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="866" y="475" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Expiry</text><text x="1162" y="475" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">file delete</text>
<text x="66" y="564" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">No strategy escapes amplification. Each one lowers two of the three quantities by raising the third.</text>
</svg>