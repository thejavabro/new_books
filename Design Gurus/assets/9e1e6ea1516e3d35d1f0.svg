<text x="620" y="449" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Object Storage</text><text x="620" y="524" text-anchor="middle" font-size="15.5" fill="#6B7280">the paste contents live here, not in the row</text><rect x="40" y="560" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="586" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="608" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Metadata row</text><text x="288" y="608" font-size="15.5" fill="#475569">small and fixed size; the 10 MB paste itself is stored as an object, so the table stays fast to scan and cache</text>
