<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The product details and the buy button load normally. The reviews service is down, so the reviews section is hidden. The recommendations service is down, so the page shows best sellers instead.">
  <defs>
    <filter id="re4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="re4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="re4-k1"><rect x="64" y="180" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="re4-k2"><rect x="636" y="180" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="re4-k3"><rect x="64" y="330" width="540" height="90" rx="12"/></clipPath>
    <clipPath id="re4-k4"><rect x="636" y="330" width="540" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A product page that degrades gracefully</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Two services behind the page fail. The page still loads, and customers can still buy.</text>

  <rect x="40" y="120" width="1160" height="380" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Product page</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#re4-soft)">
    <rect x="64" y="180" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#059669" clip-path="url(#re4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Product details</text>
  <text x="334" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">loads normally</text>
  <g filter="url(#re4-soft)">
    <rect x="636" y="180" width="540" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="636" y="180" width="6" height="90" fill="#059669" clip-path="url(#re4-k2)"/>
  </g>
  <circle cx="674" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(663.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="700" y="232" font-size="21.5" font-weight="600" fill="#111827">Buy button</text>
  <text x="906" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">loads normally</text>
  <g filter="url(#re4-soft)">
    <rect x="64" y="330" width="540" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="330" width="6" height="90" fill="#DB2777" clip-path="url(#re4-k3)"/>
  </g>
  <circle cx="102" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,364.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="382" font-size="21.5" font-weight="600" fill="#111827">Reviews</text>
  <text x="334" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">service down: section is hidden</text>
  <g filter="url(#re4-soft)">
    <rect x="636" y="330" width="540" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="636" y="330" width="6" height="90" fill="#D97706" clip-path="url(#re4-k4)"/>
  </g>
  <circle cx="674" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(663.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="700" y="382" font-size="21.5" font-weight="600" fill="#111827">Recommendations</text>
  <text x="906" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">service down: shows best sellers</text>

  <rect x="40" y="530" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="555" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="580" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Works</text>
  <text x="323" y="580" font-size="18.5" fill="#475569">the main actions keep working</text>
  <rect x="64" y="605" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="630" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Fallback</text>
  <text x="323" y="630" font-size="18.5" fill="#475569">a simpler answer replaces the feature that failed</text>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Hidden</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">a feature that cannot work is left out, not shown as an error</text>
</svg>