<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dualwrite-title dualwrite-desc">
<title id="dualwrite-title">The dual write, and its four outcomes</title>
<desc id="dualwrite-desc">A service that changes its own state and publishes an event performs two operations against two systems with no transaction spanning both. Two of the four outcomes leave the systems diverged, and neither raises an error.</desc>
<defs>
<marker id="dualwrite-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dualwrite-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dualwrite-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dualwrite-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="760" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The dual write, and its four outcomes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There is no transaction spanning both, so there are four outcomes and two of them are wrong.</text>
<rect x="40" y="682" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="682" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="460" y="118" width="320" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Service handles a request</text>
<path d="M620 174V184M460 184H780" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M460 184V202" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M460 184V202" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-slate)"/>
<path d="M780 184V202" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M780 184V202" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-slate)"/>
<rect x="320" y="210" width="280" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="460" y="240" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">write to database</text>
<rect x="640" y="210" width="280" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="780" y="240" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">publish to broker</text>
<text x="620" y="288" font-size="22" font-weight="700" fill="#6040A8" text-anchor="middle">Two systems, no shared transaction</text>
<rect x="40" y="302" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="336" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Both succeed</text>
<path d="M526 330H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 330H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-green)"/>
<rect x="570" y="302" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="336" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">correct</text>
<rect x="40" y="370" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="404" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Both fail</text>
<path d="M526 398H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 398H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-green)"/>
<rect x="570" y="370" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">correct, nothing happened</text>
<rect x="40" y="438" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="472" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Database commits, publish fails</text>
<path d="M526 466H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 466H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-red)"/>
<rect x="570" y="438" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="472" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the order exists and nobody downstream knows</text>
<rect x="40" y="506" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="540" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Publish succeeds, database rolls back</text>
<path d="M526 534H560" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 534H560" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dualwrite-marker-red)"/>
<rect x="570" y="506" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="540" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">consumers act on an order that does not exist</text>
<rect x="40" y="586" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="586" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="614" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The third case is the common one, and its defining property is silence.</text><text x="64" y="640" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Each system did exactly what it was told, so no error is raised anywhere.</text>
<text x="66" y="716" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Not a Kafka problem. It appears with any broker, any queue, and any outbound call.</text>
</svg>