<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1018" viewBox="0 0 1240 1018" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two workable choices when capacity is unavailable: refuse immediately with 429 and Retry-After, or hold the request in a short bounded published queue. Each choice is shown with when to use it and what it costs. An unbounded queue is not a third choice, because it converts overload into timeouts.">
  <defs>
    <filter id="p2a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2a-k1"><rect x="76" y="146" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2a-k2"><rect x="76" y="394" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p2a-k3"><rect x="76" y="642" width="340" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1018" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Two workable choices when capacity is gone</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">compared by when to use it, and what it costs</text>

  
  <rect x="40" y="126" width="1160" height="224" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2a-lift)">
    <rect x="76" y="146" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="76" y="146" width="9" height="90" fill="#D97706" clip-path="url(#p2a-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Refuse now</text>
  <rect x="964" y="175" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="1064" y="196" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">workable choice one</text>

  <rect x="76" y="254" width="130" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="141" y="275" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Use it when</text>
  <text x="230" y="275" font-size="15.5" fill="#6B7280">A person is waiting, queue delay would break the first-output promise, and the caller can retry</text>

  <rect x="76" y="296" width="130" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="141" y="317" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The cost</text>
  <text x="230" y="317" font-size="15.5" fill="#6B7280">Visible refusals during short bursts</text>

  
  <rect x="40" y="374" width="1160" height="224" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2a-lift)">
    <rect x="76" y="394" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="394" width="9" height="90" fill="#2563EB" clip-path="url(#p2a-k2)"/>
  </g>
  <circle cx="114" cy="439" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,428.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="446" font-size="18.5" font-weight="600" fill="#111827">Short queue</text>
  <rect x="964" y="423" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="1064" y="444" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">workable choice two</text>

  <rect x="76" y="502" width="130" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="141" y="523" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Use it when</text>
  <text x="230" y="523" font-size="15.5" fill="#6B7280">A published maximum wait, a stated deadline interaction, and cancellation while queued</text>

  <rect x="76" y="544" width="130" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="141" y="565" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The cost</text>
  <text x="230" y="565" font-size="15.5" fill="#6B7280">Added latency, and held connection state</text>

  
  <rect x="40" y="622" width="1160" height="224" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2a-soft)">
    <rect x="76" y="642" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="642" width="6" height="90" fill="#DB2777" clip-path="url(#p2a-k3)"/>
  </g>
  <circle cx="114" cy="687" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,676.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="694" font-size="18.5" font-weight="600" fill="#111827">Unbounded queue</text>
  <rect x="964" y="671" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1064" y="692" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">not a third choice</text>

  <rect x="76" y="750" width="130" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="141" y="771" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Use it when</text>
  <text x="230" y="771" font-size="15.5" fill="#6B7280">Never. This is not a third choice.</text>

  <rect x="76" y="792" width="130" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="141" y="813" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The cost</text>
  <text x="230" y="813" font-size="15.5" fill="#6B7280">Overload becomes timeouts, the real wait is hidden, cancellation costs more</text>

  
  <rect x="40" y="878" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="920" text-anchor="middle" font-size="16" fill="#475569">Refuse immediately with 429 and Retry-After, or hold the request in a short bounded published queue.</text>
  <text x="620" y="948" text-anchor="middle" font-size="16" fill="#475569">An unbounded queue is not a third choice, because it converts overload into timeouts.</text>
</svg>