<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="530" viewBox="0 0 1240 530" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="API composition replacing a SQL join: the order service reads its own store, then makes one HTTP call to the catalog service for product names">
  <defs>
    <marker id="dbps4-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="dbps4-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="dbps4-k1"><rect x="72" y="60" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="dbps4-k2"><rect x="868" y="60" width="300" height="70" rx="12"/></clipPath>
    <filter id="dbps4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dbps4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="530" fill="#FFFFFF"/>

  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M372,95 H860" marker-end="url(#dbps4-mblue)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="616" y="80" fill="#1D4ED8">one HTTP call for the product names</text>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M222,130 V212" marker-end="url(#dbps4-mviolet)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="288" y="180" fill="#5B21B6">local read</text>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M1018,130 V212" marker-end="url(#dbps4-mviolet)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="952" y="180" fill="#5B21B6">local read</text>
  </g>
  <g filter="url(#dbps4-soft)">
    <rect x="72" y="60" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="60" width="6" height="70" fill="#2563EB" clip-path="url(#dbps4-k1)"/>
  </g>
  <circle cx="110" cy="95" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,84.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="102" font-size="18.5" font-weight="600" fill="#111827">Order Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 132,236 L 132,290 A 90,16 0 0 0 312,290 L 312,236" fill="#EDE9FE"/>
    <ellipse cx="222" cy="236" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="222" y="283" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Orders</text>
  <text x="222" y="331" font-size="15.5" text-anchor="middle" fill="#6B7280">the join used to live here</text>
  <g filter="url(#dbps4-soft)">
    <rect x="868" y="60" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="868" y="60" width="6" height="70" fill="#2563EB" clip-path="url(#dbps4-k2)"/>
  </g>
  <circle cx="906" cy="95" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,84.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/>
  </g>
  <text x="932" y="102" font-size="18.5" font-weight="600" fill="#111827">Catalog Service</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M 928,236 L 928,290 A 90,16 0 0 0 1108,290 L 1108,236" fill="#EDE9FE"/>
    <ellipse cx="1018" cy="236" rx="90" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1018" y="283" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Products</text>
  <text x="1018" y="331" font-size="15.5" text-anchor="middle" fill="#6B7280">only its owner reads it</text>
  <rect x="40" y="390" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="414" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="436" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">API composition</text>
  <text x="288" y="436" font-size="15.5" fill="#475569">the caller fetches from each owner and combines the result in code</text>
  <rect x="64" y="458" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="480" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Private stores</text>
  <text x="288" y="480" font-size="15.5" fill="#475569">each service reads only the store it owns</text>
</svg>