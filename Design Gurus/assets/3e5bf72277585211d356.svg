<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1050" viewBox="0 0 1200 1050" role="img" aria-labelledby="title desc"><title id="title">Several callers share one initialization attempt</title><desc id="desc">Two callers that need the same component use one readiness owner. That owner starts one initialization attempt and exposes Initializing, Ready, or Failed. Callers use the component only when ready and receive a defined failure or retry behavior. Optional initialization should not block unrelated useful content.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1050" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Several callers share one initialization attempt</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Lazy initialization moves work to first use; it does not remove the cost.</text><rect x="50" y="175" width="440" height="125" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="215" font-size="24" fill="#7c3aed" font-weight="700">Caller A</text><text x="72" y="256" font-size="21" fill="#334155" font-weight="400">Needs the component.</text><rect x="710" y="175" width="440" height="125" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="732" y="215" font-size="24" fill="#7c3aed" font-weight="700">Caller B</text><text x="732" y="256" font-size="21" fill="#334155" font-weight="400">Needs the same component.</text><rect x="300" y="425" width="600" height="165" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="322" y="465" font-size="24" fill="#2563eb" font-weight="700">Shared readiness owner</text><text x="322" y="506" font-size="21" fill="#334155" font-weight="400">Register one attempt before starting the work.</text><text x="322" y="537" font-size="21" fill="#334155" font-weight="400">Expose Initializing while it runs.</text><path d="M270 308 V355 H470 V417" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M930 308 V355 H730 V417" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="720" width="520" height="155" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="72" y="760" font-size="24" fill="#059669" font-weight="700">Ready</text><text x="72" y="801" font-size="21" fill="#334155" font-weight="400">Both callers use the initialized component.</text><text x="72" y="832" font-size="21" fill="#334155" font-weight="400">Later callers reuse this ready state.</text><rect x="650" y="720" width="500" height="155" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="760" font-size="24" fill="#c2410c" font-weight="700">Failed</text><text x="672" y="801" font-size="21" fill="#334155" font-weight="400">Return a defined failure to the callers.</text><text x="672" y="832" font-size="21" fill="#334155" font-weight="400">Retry only under an explicit policy.</text><path d="M470 598 V655 H310 V712" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M730 598 V655 H900 V712" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="925" width="1100" height="90" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="965" font-size="24" fill="#ffffff" font-weight="700">Do not initialize a second copy just because another screen asks.</text></g></svg>