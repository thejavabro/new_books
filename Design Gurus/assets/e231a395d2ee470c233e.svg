<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The bitonic array before the search">
<defs>
<filter id="bm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Find the largest number in the bitonic array [1, 3, 8, 12, 4, 2]</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The values rise and then fall, so the largest sits exactly where the direction turns</text>
<rect x="40" y="106" width="1160" height="294" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole array is still in range</text>
<rect x="330" y="198" width="580" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="338" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="380" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="380" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="434" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="476" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="476" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="530" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="572" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">8</text>
<text x="572" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="626" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="668" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<text x="668" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="722" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="764" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="764" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="818" y="206" width="84" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="860" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="860" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<path d="M371,324 L389,324 L380,310 Z" fill="#4F46E5"/>
<text x="380" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">start</text>
<path d="M851,324 L869,324 L860,310 Z" fill="#DB2777"/>
<text x="860" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">end</text>
<rect x="40" y="426" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="466" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Compare each probe with its right hand neighbour to see which slope it is on</text>
<text x="620" y="498" text-anchor="middle" font-size="18.5" fill="#475569">Rising means the peak is still ahead, falling means the probe may itself be the peak</text>
</svg>