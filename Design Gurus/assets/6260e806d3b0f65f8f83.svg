<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="525" viewBox="0 0 1240 525" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Shifting traffic without a deploy: the proxy sends ninety percent of calls to version one and ten percent to version two, and the split is a rule pushed to the proxies rather than a release">
  <defs>
    <marker id="sm5-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="sm5-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="sm5-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="sm5-k1"><rect x="72" y="150" width="248" height="80" rx="12"/></clipPath>
    <clipPath id="sm5-k2"><rect x="420" y="150" width="240" height="80" rx="12"/></clipPath>
    <clipPath id="sm5-k3"><rect x="760" y="104" width="408" height="72" rx="12"/></clipPath>
    <clipPath id="sm5-k4"><rect x="760" y="244" width="408" height="72" rx="12"/></clipPath>
    <filter id="sm5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sm5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="525" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="337" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">The proxy decides where each request goes</text>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M320,190 H420" marker-end="url(#sm5-mamber)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M660,190 H700 Q716,190 716,174 V140 H760" marker-end="url(#sm5-memerald)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M660,190 H700 Q716,190 716,206 V280 H760" marker-end="url(#sm5-mviolet)"/>
  </g>
  <g filter="url(#sm5-soft)">
    <rect x="72" y="150" width="248" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="150" width="6" height="80" fill="#2563EB" clip-path="url(#sm5-k1)"/>
  </g>
  <circle cx="110" cy="190" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,179.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="197" font-size="18.5" font-weight="600" fill="#111827">Caller</text>
  <g filter="url(#sm5-lift)">
    <rect x="420" y="150" width="240" height="80" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="420" y="150" width="9" height="80" fill="#D97706" clip-path="url(#sm5-k2)"/>
  </g>
  <circle cx="458" cy="190" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,179.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="484" y="197" font-size="18.5" font-weight="600" fill="#111827">Its Proxy</text>
  <g filter="url(#sm5-soft)">
    <rect x="760" y="104" width="408" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="760" y="104" width="6" height="72" fill="#059669" clip-path="url(#sm5-k3)"/>
  </g>
  <circle cx="798" cy="140" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,129.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="824" y="147" font-size="18.5" font-weight="600" fill="#111827">Payment Version One</text>
  <text x="964" y="201" font-size="15.5" text-anchor="middle" fill="#6B7280">90 percent of calls</text>
  <g filter="url(#sm5-soft)">
    <rect x="760" y="244" width="408" height="72" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="760" y="244" width="6" height="72" fill="#7C3AED" clip-path="url(#sm5-k4)"/>
  </g>
  <circle cx="798" cy="280" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,269.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="824" y="287" font-size="18.5" font-weight="600" fill="#111827">Payment Version Two</text>
  <text x="964" y="341" font-size="15.5" text-anchor="middle" fill="#6B7280">10 percent of calls</text>
  <rect x="40" y="417" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="441" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="463" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Why it is cheap</text>
  <text x="288" y="463" font-size="15.5" fill="#475569">the split is a rule pushed to the proxies, so neither version is redeployed to change it</text>
</svg>