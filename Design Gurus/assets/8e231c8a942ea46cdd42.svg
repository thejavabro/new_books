<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three rounds of the water bottles process, tracking full bottles, empties and the running total"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="774" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="470" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Follow the rules the question gives, and stop when a trade is impossible</text>
<rect x="90" y="148" width="140" height="54" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="160" y="183" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">round</text>
<rect x="250" y="148" width="200" height="54" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="350" y="183" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">full</text>
<rect x="470" y="148" width="200" height="54" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="570" y="183" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">drunk so far</text>
<rect x="690" y="148" width="200" height="54" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="790" y="183" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">empties</text>
<rect x="910" y="148" width="250" height="54" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="1035" y="183" text-anchor="middle" font-size="19.5" font-weight="600" fill="#94A3B8">then</text>
<rect x="90" y="222" width="140" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="160" y="263" text-anchor="middle" font-size="20.5" font-weight="600" fill="#111827">1</text>
<rect x="250" y="222" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="350" y="263" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">9</text>
<rect x="470" y="222" width="200" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="570" y="263" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">9</text>
<rect x="690" y="222" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="790" y="263" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">9</text>
<rect x="910" y="222" width="250" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="1035" y="263" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">9 / 3 = 3 full</text>
<rect x="90" y="304" width="140" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="160" y="345" text-anchor="middle" font-size="20.5" font-weight="600" fill="#111827">2</text>
<rect x="250" y="304" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="350" y="345" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<rect x="470" y="304" width="200" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="570" y="345" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">12</text>
<rect x="690" y="304" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="790" y="345" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">3</text>
<rect x="910" y="304" width="250" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="1035" y="345" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">3 / 3 = 1 full</text>
<rect x="90" y="386" width="140" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="160" y="427" text-anchor="middle" font-size="20.5" font-weight="600" fill="#111827">3</text>
<rect x="250" y="386" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="350" y="427" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<rect x="470" y="386" width="200" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="570" y="427" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">13</text>
<rect x="690" y="386" width="200" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="790" y="427" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<rect x="910" y="386" width="250" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="1035" y="427" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">1 &lt; 3, so stop</text>
<text x="90" y="500" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">the state is three counters, and the stop condition is the last column</text>
<rect x="40" y="558" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="580" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="606" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">a trade happened</text>
<text x="348" y="606" font-size="19.5" fill="#475569">enough empties, so the process continues</text>
<rect x="64" y="628" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="654" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the answer</text>
<text x="348" y="654" font-size="19.5" fill="#475569">the running total when no further trade is possible</text>
<rect x="64" y="676" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="702" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">plain state</text>
<text x="348" y="702" font-size="19.5" fill="#475569">counters the rules update on every round</text>
</svg>