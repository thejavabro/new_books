<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lags-title lags-desc">
<title id="lags-title">Three lags, not one</title>
<desc id="lags-desc">Write lag measures receiving, flush lag measures persisting, and replay lag measures applying. Only replay lag describes what a read on the standby can actually see, which makes it the one to alert on.</desc>
<defs>
<marker id="lags-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lags-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lags-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lags-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three lags, not one</text>
<text x="40" y="86" font-size="21" fill="#4A5568">pg_stat_replication reports three different lags, and they are not interchangeable.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<path d="M150 204H1050" fill="none" stroke="#284E65" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="150" cy="204" r="13" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="3"/>
<text x="150" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Primary commits</text>
<circle cx="450" cy="204" r="13" fill="#E8FCF3" stroke="#39D5AA" stroke-width="3"/>
<text x="450" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby receives</text>
<circle cx="750" cy="204" r="13" fill="#E8FCF3" stroke="#39D5AA" stroke-width="3"/>
<text x="750" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby flushes</text>
<circle cx="1050" cy="204" r="13" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="3"/>
<text x="1050" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Standby applies</text>
<text x="1050" y="176" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and becomes visible to reads</text>
<path d="M450 221V251" fill="none" stroke="#5EC9EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="150" y="255" width="300" height="34" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="278" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">has it arrived?</text>
<text x="468" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Write lag</text>
<path d="M750 221V315" fill="none" stroke="#39D5AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="150" y="319" width="600" height="34" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="450" y="342" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">is it durable there?</text>
<text x="768" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Flush lag</text>
<path d="M1050 221V379" fill="none" stroke="#F3CF6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="150" y="383" width="900" height="34" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="600" y="406" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">can it be read there?</text>
<text x="1068" y="407" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Replay lag</text>
<rect x="810" y="428" width="240" height="42" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="930" y="456" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Alert on this one</text>
<rect x="40" y="494" width="1160" height="104" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="494" width="5" height="104" rx="2.5" fill="#5EC9EC"/><text x="64" y="526" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Seconds of replay lag is normal. Minutes at peak is a warning.</text><text x="64" y="552" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Lag that grows without bound means the replica cannot keep up at all,</text><text x="64" y="578" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which is an undersized replica or a job running at full speed on the primary.</text>
<text x="66" y="657" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">pg_stat_replication reports all three separately. A dashboard showing only one of them is showing the wrong one.</text>
</svg>