<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1350" viewBox="0 0 1240 1350" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence of one message: the sender client sends with a client message id to gateway node 7, which forwards to Chat; Chat assigns sequence 42 and commits it to the inbox, then acks back through the gateway to the sender; Chat publishes to the conversation topic, Fan-out reads the registry which says the recipient device is on node 12, pushes message 42 to gateway node 12, which delivers to the recipient client, takes the ack for the message id, and sends the delivery receipt to Receipts on the lower priority stream.">
  <defs>
    <marker id="m07-l07-message-path-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l07-message-path-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l07-message-path-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l07-message-path-vt" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m07-l07-message-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1350" fill="#FFFFFF"/>

  <rect x="40" y="250" width="1160" height="370" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="40" y="660" width="1160" height="410" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="105" y1="195" x2="105" y2="1100"/>
    <line x1="275" y1="195" x2="275" y2="1100"/>
    <line x1="445" y1="195" x2="445" y2="1100"/>
    <line x1="615" y1="195" x2="615" y2="1100"/>
    <line x1="785" y1="195" x2="785" y2="1100"/>
    <line x1="955" y1="195" x2="955" y2="1100"/>
    <line x1="1125" y1="195" x2="1125" y2="1100"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M111,340 L269,340" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l07-message-path-bl)"/>
    <path d="M281,390 L439,390" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l07-message-path-bl)"/>
    <path d="M451,430 H501 Q513,430 513,444 V456 Q513,470 501,470 H455" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#m07-l07-message-path-vt)"/>
    <path d="M439,520 L281,520" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-path-em)"/>
    <path d="M269,570 L111,570" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-path-em)"/>
    <path d="M451,760 L609,760" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-path-ab)"/>
    <path d="M621,800 H671 Q683,800 683,814 V826 Q683,840 671,840 H625" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#m07-l07-message-path-vt)"/>
    <path d="M621,880 L779,880" stroke="#3B82F6" marker-end="url(#m07-l07-message-path-bl)"/>
    <path d="M791,930 L1119,930" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l07-message-path-bl)"/>
    <path d="M1119,980 L791,980" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-path-em)"/>
    <path d="M791,1030 L949,1030" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l07-message-path-ab)"/>
  </g>

  <text x="60" y="292" font-size="20" font-weight="600" fill="#1E3A8A" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Synchronous: the sender is waiting on the ack, so this path is short</text>
  <text x="60" y="702" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Asynchronous: everything after the commit</text>
  <text x="1180" y="702" text-anchor="end" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on its own topics and consumers</text>

  <text x="190" y="328" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. send with a client message id</text>
  <text x="360" y="378" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. forward the send</text>
  <text x="525" y="456" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. assign sequence 42 and commit</text>
  <text x="360" y="508" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. ack with sequence 42</text>
  <text x="190" y="558" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. ack with sequence 42</text>
  <text x="530" y="748" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. publish to the conversation topic</text>
  <text x="695" y="826" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. registry lookup: node 12</text>
  <text x="700" y="868" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">8. push message 42</text>
  <text x="955" y="918" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">9. deliver over the socket</text>
  <text x="955" y="968" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">10. ack the message id</text>
  <text x="870" y="1018" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">11. delivery receipt</text>

  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="50" y="800" width="300" height="180" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="849" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The sender is not waiting</text>
  <text x="200" y="881" text-anchor="middle" font-size="20" fill="#64748B">Its ack came back at step 5,</text>
  <text x="200" y="913" text-anchor="middle" font-size="20" fill="#64748B">and every push after the</text>
  <text x="200" y="945" text-anchor="middle" font-size="20" fill="#64748B">commit is best effort.</text>

  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="25" y="60" width="160" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="105" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Sender</text>
  <text x="105" y="148" text-anchor="middle" font-size="20" fill="#64748B">makes the id</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="195" y="60" width="160" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="275" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway 7</text>
  <text x="275" y="148" text-anchor="middle" font-size="20" fill="#64748B">stateful</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="365" y="60" width="160" height="130" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="445" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Chat</text>
  <text x="445" y="148" text-anchor="middle" font-size="20" fill="#64748B">single writer</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="535" y="60" width="160" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="615" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fan-out</text>
  <text x="615" y="148" text-anchor="middle" font-size="20" fill="#64748B">no state</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="705" y="60" width="160" height="130" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="785" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway 12</text>
  <text x="785" y="148" text-anchor="middle" font-size="20" fill="#64748B">stateful</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="875" y="60" width="160" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="955" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Receipts</text>
  <text x="955" y="148" text-anchor="middle" font-size="20" fill="#64748B">low priority</text>
  <g filter="url(#m07-l07-message-path-soft)">
    <rect x="1045" y="60" width="160" height="130" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1125" y="116" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recipient</text>
  <text x="1125" y="148" text-anchor="middle" font-size="20" fill="#64748B">dedupes</text>

  <rect x="40" y="1120" width="1160" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1175" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">At-least-once on the wire, plus dedupe on the client, equals exactly-once for the user.</text>

  <line x1="60" y1="1250" x2="96" y2="1250" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1257" font-size="20" fill="#475569">The live path: the send and the push</text>
  <line x1="60" y1="1290" x2="96" y2="1290" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1297" font-size="20" fill="#475569">The ack going back</text>
  <line x1="60" y1="1330" x2="96" y2="1330" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="1337" font-size="20" fill="#475569">An internal step: the commit, the registry lookup</text>
</svg>