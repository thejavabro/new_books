<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four failure handling tools. 1, dead-letter queue or failure destination: an asynchronous or poll-based event invokes a function; when retries are exhausted the event goes to a dead-letter queue, from which it can be inspected and replayed. 2, timeout shorter than the caller: the caller has the longer timeout and the function it invokes has the shorter one, to avoid wasted work. 3, partial batch response: the function reports which records in a batch failed, and only those records are retried. 4, circuit breaking and backoff: a function calls a downstream service through a circuit breaker; retries back off and an open breaker stops calls, protecting the service from retry storms">
  <defs>
    <filter id="m15n-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m15n-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m15n-k1"><rect x="64" y="245" width="130" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k2"><rect x="240" y="245" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k3"><rect x="240" y="395" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k4"><rect x="654" y="245" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k5"><rect x="966" y="245" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k6"><rect x="64" y="705" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k7"><rect x="314" y="705" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k8"><rect x="284" y="855" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k9"><rect x="654" y="705" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m15n-k10"><rect x="894" y="705" width="180" height="90" rx="12"/></clipPath>
    <marker id="m15n-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m15n-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="m15n-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1060" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Serverless failure handling</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Four tools handle failures: dead-letter queues, timeouts, partial batch response, and circuit breaking.</text>

  <rect x="40" y="120" width="570" height="440" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Dead-letter queue or failure destination</text>
  <rect x="630" y="120" width="570" height="440" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#047857">2. Timeout shorter than the caller's</text>
  <rect x="40" y="580" width="570" height="440" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="610" font-size="19.5" font-weight="600" fill="#B45309">3. Partial batch response</text>
  <rect x="630" y="580" width="570" height="440" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="610" font-size="19.5" font-weight="600" fill="#475569">4. Circuit breaking and backoff</text>

  <g fill="none" stroke-width="2">
    <path d="M194,290 H240" stroke="#2563EB" marker-end="url(#m15n-m-blue)"/>
    <path d="M325,335 V395" stroke="#DB2777" marker-end="url(#m15n-m-pink)"/>
    <path d="M410,440 H424 Q436,440 436,428 V302 Q436,290 424,290 H410" stroke="#2563EB" marker-end="url(#m15n-m-blue)"/>
    <path d="M824,290 H966" stroke="#2563EB" marker-end="url(#m15n-m-blue)"/>
    <path d="M234,750 H314" stroke="#059669" marker-end="url(#m15n-m-emerald)"/>
    <path d="M389,795 V855" stroke="#DB2777" marker-end="url(#m15n-m-pink)"/>
    <path d="M824,750 H894" stroke="#059669" marker-end="url(#m15n-m-emerald)"/>
    <path d="M984,795 V839" stroke="#059669" marker-end="url(#m15n-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="450" y="361" fill="#1D4ED8" text-anchor="start">Inspect</text>
    <text x="450" y="385" fill="#1D4ED8" text-anchor="start">and replay</text>
    <text x="312" y="361" fill="#BE185D" text-anchor="end">Retries</text>
    <text x="312" y="385" fill="#BE185D" text-anchor="end">exhausted</text>
    <text x="895" y="278" fill="#1D4ED8">Invokes</text>
    <text x="859" y="740" fill="#047857">Calls</text>
  </g>

  <g filter="url(#m15n-soft)">
    <rect x="64" y="245" width="130" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="245" width="6" height="90" fill="#2563EB" clip-path="url(#m15n-k1)"/>
  </g>
  <circle cx="102" cy="290" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,279.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="297" font-size="21.5" font-weight="600" fill="#111827">Event</text>
  <g filter="url(#m15n-soft)">
    <rect x="240" y="245" width="170" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="240" y="245" width="6" height="90" fill="#7C3AED" clip-path="url(#m15n-k2)"/>
  </g>
  <circle cx="278" cy="290" r="18" fill="#FFFFFF"/>
  <g transform="translate(267.56,279.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="304" y="297" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15n-soft)">
    <rect x="240" y="395" width="170" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="240" y="395" width="6" height="90" fill="#DB2777" clip-path="url(#m15n-k3)"/>
  </g>
  <circle cx="278" cy="440" r="18" fill="#FFFFFF"/>
  <g transform="translate(267.56,429.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="304" y="435.75" font-size="18.5" font-weight="600" fill="#111827">Dead-letter</text>
  <text x="304" y="458.25" font-size="18.5" font-weight="600" fill="#111827">queue</text>
  <g filter="url(#m15n-soft)">
    <rect x="654" y="245" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="654" y="245" width="6" height="90" fill="#64748B" clip-path="url(#m15n-k4)"/>
  </g>
  <circle cx="692" cy="290" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,279.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="718" y="297" font-size="21.5" font-weight="600" fill="#111827">Caller</text>
  <g filter="url(#m15n-soft)">
    <rect x="966" y="245" width="190" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="966" y="245" width="6" height="90" fill="#7C3AED" clip-path="url(#m15n-k5)"/>
  </g>
  <circle cx="1004" cy="290" r="18" fill="#FFFFFF"/>
  <g transform="translate(993.56,279.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="1030" y="297" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <text x="739" y="362" font-size="18.5" text-anchor="middle" fill="#6B7280">Longer timeout</text>
  <text x="1061" y="362" font-size="18.5" text-anchor="middle" fill="#6B7280">Shorter timeout</text>
  <g filter="url(#m15n-soft)">
    <rect x="64" y="705" width="170" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="705" width="6" height="90" fill="#7C3AED" clip-path="url(#m15n-k6)"/>
  </g>
  <circle cx="102" cy="750" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,739.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="757" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15n-soft)">
    <rect x="314" y="705" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="314" y="705" width="6" height="90" fill="#059669" clip-path="url(#m15n-k7)"/>
  </g>
  <circle cx="352" cy="750" r="18" fill="#FFFFFF"/>
  <g transform="translate(341.56,739.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="378" y="745.75" font-size="18.5" font-weight="600" fill="#111827">Reports failed</text>
  <text x="378" y="768.25" font-size="18.5" font-weight="600" fill="#111827">records</text>
  <g filter="url(#m15n-soft)">
    <rect x="284" y="855" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="284" y="855" width="6" height="90" fill="#DB2777" clip-path="url(#m15n-k8)"/>
  </g>
  <circle cx="322" cy="900" r="18" fill="#FFFFFF"/>
  <g transform="translate(311.56,889.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="348" y="895.75" font-size="18.5" font-weight="600" fill="#111827">Only failed</text>
  <text x="348" y="918.25" font-size="18.5" font-weight="600" fill="#111827">records retried</text>
  <g filter="url(#m15n-soft)">
    <rect x="654" y="705" width="170" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="654" y="705" width="6" height="90" fill="#7C3AED" clip-path="url(#m15n-k9)"/>
  </g>
  <circle cx="692" cy="750" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,739.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="718" y="757" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <g filter="url(#m15n-soft)">
    <rect x="894" y="705" width="180" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="894" y="705" width="6" height="90" fill="#059669" clip-path="url(#m15n-k10)"/>
  </g>
  <circle cx="932" cy="750" r="18" fill="#FFFFFF"/>
  <g transform="translate(921.56,739.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="958" y="745.75" font-size="18.5" font-weight="600" fill="#111827">Circuit</text>
  <text x="958" y="768.25" font-size="18.5" font-weight="600" fill="#111827">breaker</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M909,855 L909,909 A75,16 0 0 0 1059,909 L1059,855" fill="#DBEAFE"/>
    <ellipse cx="984" cy="855" rx="75" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="984" y="891" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Downstream</text>
  <text x="984" y="914" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">service</text>
  <text x="984" y="959" font-size="18.5" text-anchor="middle" fill="#6B7280">Retries back off;</text>
  <text x="984" y="986" font-size="18.5" text-anchor="middle" fill="#94A3B8">an open breaker stops calls</text>
  <text x="64" y="186" font-size="18.5" fill="#6B7280">Asynchronous and poll-based events that exhaust</text>
  <text x="64" y="213" font-size="18.5" fill="#6B7280">retries are kept for inspection and replay.</text>
  <text x="654" y="186" font-size="18.5" fill="#6B7280">Set the function timeout shorter than the upstream</text>
  <text x="654" y="213" font-size="18.5" fill="#6B7280">caller's timeout to avoid wasted work.</text>
  <text x="64" y="646" font-size="18.5" fill="#6B7280">The function reports which records in a batch failed,</text>
  <text x="64" y="673" font-size="18.5" fill="#6B7280">so the platform does not retry the whole batch.</text>
  <text x="654" y="646" font-size="18.5" fill="#6B7280">They protect downstream services from the retry</text>
  <text x="654" y="673" font-size="18.5" fill="#6B7280">storms that elastic scaling can produce.</text>




</svg>