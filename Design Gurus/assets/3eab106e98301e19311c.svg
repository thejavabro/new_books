<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="491" viewBox="0 0 1240 491" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two training traps and the fix for each">
  <defs>
    <marker id="m3l1c-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m3l1c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m3l1c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m3l1c-k1"><rect x="60" y="70" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m3l1c-k2"><rect x="600" y="70" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="m3l1c-k3"><rect x="60" y="220" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m3l1c-k4"><rect x="600" y="220" width="480" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="491" fill="#FFFFFF"/>

  <g fill="none" stroke="#059669" stroke-width="2"><path d="M346,115 L600,115" marker-end="url(#m3l1c-memerald)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M346,265 L600,265" marker-end="url(#m3l1c-memerald)"/></g>
  <g filter="url(#m3l1c-soft)">
    <rect x="60" y="70" width="286" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="60" y="70" width="6" height="90" fill="#DB2777" clip-path="url(#m3l1c-k1)"/>
  </g>
  <circle cx="98" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,104.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="124" y="122" font-size="18.5" font-weight="600" fill="#111827">Position bias</text>
  <text x="203" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">higher positions get more attention</text>
  <g filter="url(#m3l1c-soft)">
    <rect x="600" y="70" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="600" y="70" width="6" height="90" fill="#059669" clip-path="url(#m3l1c-k2)"/>
  </g>
  <circle cx="638" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="664" y="122" font-size="18.5" font-weight="600" fill="#111827">Model bias or weight by propensity</text>
  <text x="840" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">validate exposure assumptions</text>
  <g filter="url(#m3l1c-soft)">
    <rect x="60" y="220" width="286" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="60" y="220" width="6" height="90" fill="#DB2777" clip-path="url(#m3l1c-k3)"/>
  </g>
  <circle cx="98" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,254.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="124" y="272" font-size="18.5" font-weight="600" fill="#111827">The proxy trap</text>
  <text x="203" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">single metrics can reward poor content</text>
  <g filter="url(#m3l1c-soft)">
    <rect x="600" y="220" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="600" y="220" width="6" height="90" fill="#059669" clip-path="url(#m3l1c-k4)"/>
  </g>
  <circle cx="638" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,254.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/><path d="M2.5 9.5h7M14.5 9.5h7"/></g>
  <text x="664" y="272" font-size="18.5" font-weight="600" fill="#111827">Weigh several objectives at once</text>
  <text x="840" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">measure retention over enough time</text>
  <rect x="40" y="375" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="420" text-anchor="middle" font-size="16" fill="#475569">Check exposure bias and whether short-term training signals support the long-term product goal.</text>
</svg>