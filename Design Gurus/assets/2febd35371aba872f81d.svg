<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1000" viewBox="0 0 1160 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Depth first search over a five node graph using an explicit stack">
<defs>
<marker id="dfs-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="dfs-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="dfs-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="dfs-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="dfs-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="dfs-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="dfs-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="dfs-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="dfs-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1160" height="1000" fill="#FFFFFF"/>
<text x="580" y="56" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Depth first search with a stack</text>
<text x="580" y="90" text-anchor="middle" font-size="19" fill="#475569">A node is printed the first time it is popped off the stack, and never again.</text>
<line x1="557.3" y1="186.6" x2="462.7" y2="247.4" stroke="#2563EB" stroke-width="2"/>
<line x1="580.0" y1="199.0" x2="580.0" y2="235.0" stroke="#2563EB" stroke-width="2"/>
<line x1="602.7" y1="186.6" x2="697.3" y2="247.4" stroke="#2563EB" stroke-width="2"/>
<line x1="467.0" y1="262.0" x2="553.0" y2="262.0" stroke="#2563EB" stroke-width="2"/>
<line x1="580.0" y1="289.0" x2="580.0" y2="325.0" stroke="#2563EB" stroke-width="2"/>
<circle cx="580" cy="172" r="27" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
<text x="580" y="179" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">0</text>
<text x="615" y="151" text-anchor="start" font-size="15" font-weight="600" fill="#047857">1</text>
<circle cx="440" cy="262" r="27" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
<text x="440" y="269" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">1</text>
<text x="405" y="241" text-anchor="end" font-size="15" font-weight="600" fill="#047857">5</text>
<circle cx="580" cy="262" r="27" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
<text x="580" y="269" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">2</text>
<text x="615" y="241" text-anchor="start" font-size="15" font-weight="600" fill="#047857">3</text>
<circle cx="720" cy="262" r="27" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
<text x="720" y="269" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">3</text>
<text x="755" y="241" text-anchor="start" font-size="15" font-weight="600" fill="#047857">2</text>
<circle cx="580" cy="352" r="27" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.6"/>
<text x="580" y="359" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">4</text>
<text x="615" y="331" text-anchor="start" font-size="15" font-weight="600" fill="#047857">4</text>
<text x="580" y="400" text-anchor="middle" font-size="18.5" fill="#047857">small green numbers give the order the nodes are printed in</text>
<text x="86" y="446" font-size="19.5" font-weight="600" fill="#475569">Step</text>
<text x="290" y="446" font-size="19.5" font-weight="600" fill="#475569">What happens</text>
<rect x="60" y="462" width="1040" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="492" font-size="18.5" font-weight="600" fill="#1D4ED8">start</text>
<text x="290" y="492" font-size="18.5" fill="#475569">push 0 onto the stack to begin the walk from it</text>
<rect x="60" y="516" width="1040" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="546" font-size="18.5" font-weight="600" fill="#1D4ED8">pop 0</text>
<text x="290" y="546" font-size="18.5" fill="#475569">0 is new, so print it and push its unvisited neighbours 1, 2, 3</text>
<rect x="60" y="570" width="1040" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="600" font-size="18.5" font-weight="600" fill="#1D4ED8">pop 3</text>
<text x="290" y="600" font-size="18.5" fill="#475569">3 is new, so print it; all of its neighbours are already visited</text>
<rect x="60" y="624" width="1040" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="654" font-size="18.5" font-weight="600" fill="#1D4ED8">pop 2</text>
<text x="290" y="654" font-size="18.5" fill="#475569">2 is new, so print it and push its unvisited neighbours 1, 4</text>
<rect x="60" y="678" width="1040" height="46" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="708" font-size="18.5" font-weight="600" fill="#1D4ED8">pop 4</text>
<text x="290" y="708" font-size="18.5" fill="#475569">4 is new, so print it; all of its neighbours are already visited</text>
<rect x="60" y="732" width="1040" height="46" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
<text x="86" y="762" font-size="18.5" font-weight="600" fill="#1D4ED8">pop 1</text>
<text x="290" y="762" font-size="18.5" fill="#475569">1 is new, so print it; all of its neighbours are already visited</text>
<rect x="60" y="786" width="1040" height="46" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
<text x="86" y="816" font-size="18.5" font-weight="600" fill="#BE185D">pop 1</text>
<text x="290" y="816" font-size="18.5" fill="#BE185D">1 has already been visited, so it is discarded without printing</text>
<rect x="60" y="866" width="1040" height="102" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="84" y="886" width="260" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="214" y="911" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Order: 0, 3, 2, 4, 1</text>
<text x="362" y="911" font-size="18.5" fill="#475569">the same node can sit on the stack twice, which is why the visited check is needed.</text>
<text x="84" y="944" font-size="18.5" fill="#475569">A repeat pop is discarded silently. It is not printed, and it does not appear in the traversal order.</text>
</svg>