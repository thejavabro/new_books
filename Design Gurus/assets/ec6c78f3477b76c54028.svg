<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A browser, a phone app, and a partner system send requests to one load balancer. The load balancer forwards requests to server 1 and server 2, which are healthy. Server 3 failed its health checks and receives no traffic.">
  <defs>
    <filter id="ld1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ld1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ld1-k1"><rect x="40" y="140" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k2"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k3"><rect x="40" y="440" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k4"><rect x="470" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k5"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k6"><rect x="900" y="290" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="ld1-k7"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="ld1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="ld1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A load balancer in front of a server pool</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Clients use one address. The load balancer sends each request to a healthy server.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,185 H400 Q415,185 415,200 V300 Q415,315 430,315 H470" stroke="#64748B" marker-end="url(#ld1-m-slate)"/>
    <path d="M300,335 H470" stroke="#64748B" marker-end="url(#ld1-m-slate)"/>
    <path d="M300,485 H400 Q415,485 415,470 V370 Q415,355 430,355 H470" stroke="#64748B" marker-end="url(#ld1-m-slate)"/>
    <path d="M750,320 H810 Q825,320 825,305 V200 Q825,185 840,185 H900" stroke="#2563EB" marker-end="url(#ld1-m-blue)"/>
    <path d="M750,335 H900" stroke="#2563EB" marker-end="url(#ld1-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ld1-soft)">
    <rect x="40" y="140" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ld1-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Browser</text>
  <g filter="url(#ld1-soft)">
    <rect x="40" y="290" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#ld1-k2)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Phone app</text>
  <g filter="url(#ld1-soft)">
    <rect x="40" y="440" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="440" width="6" height="90" fill="#64748B" clip-path="url(#ld1-k3)"/>
  </g>
  <circle cx="78" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="104" y="492" font-size="21.5" font-weight="600" fill="#111827">Partner system</text>
  <g filter="url(#ld1-lift)">
    <rect x="470" y="290" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="470" y="290" width="9" height="90" fill="#2563EB" clip-path="url(#ld1-k4)"/>
  </g>
  <circle cx="508" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="534" y="342" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <text x="610" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">one public address</text>
  <g filter="url(#ld1-soft)">
    <rect x="900" y="140" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="140" width="6" height="90" fill="#059669" clip-path="url(#ld1-k5)"/>
  </g>
  <circle cx="938" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">Server 1</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">healthy</text>
  <g filter="url(#ld1-soft)">
    <rect x="900" y="290" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="900" y="290" width="6" height="90" fill="#059669" clip-path="url(#ld1-k6)"/>
  </g>
  <circle cx="938" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,324.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="964" y="342" font-size="21.5" font-weight="600" fill="#111827">Server 2</text>
  <text x="1050" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">healthy</text>
  <g filter="url(#ld1-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#DB2777" clip-path="url(#ld1-k7)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Server 3</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">failed checks: no traffic</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Server pool</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">the backend servers, also called the server farm</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Health checks</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">a server that fails them gets no traffic until it recovers</text>
</svg>