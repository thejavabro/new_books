  </defs>

  <rect x="0" y="0" width="1240" height="2100" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Reminder alert system: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Millions of reminders, each due at its own second. The whole design turns on never scanning a table to ask what is due now.</text>

  <rect x="40" y="380" width="1160" height="416" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Services, each with its own store</text>
  <rect x="40" y="1090" width="1160" height="416" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="1120" font-size="19.5" font-weight="600" fill="#5B21B6">One sender per channel, and what it records</text>
  <rect x="40" y="1550" width="1160" height="236" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="1580" font-size="19.5" font-weight="600" fill="#B45309">External providers, outside our system</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#rem1-m-blue)"/>
    <path d="M540,312 V374" stroke="#2563EB" stroke-width="2.5" marker-end="url(#rem1-m-blue)"/>
