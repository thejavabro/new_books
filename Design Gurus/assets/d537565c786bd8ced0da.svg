  <text x="128" y="1662" font-size="21.5" font-weight="600" fill="#111827">SMTP server</text>
  <text x="234" y="1729" font-size="18.5" text-anchor="middle" fill="#6B7280">SendGrid, Mailgun</text>
  <g filter="url(#rem1-soft)">
    <rect x="440" y="1610" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
