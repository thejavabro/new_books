    <clipPath id="rem1-k11"><rect x="64" y="1610" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rem1-k12"><rect x="440" y="1610" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="rem1-k13"><rect x="816" y="1610" width="340" height="90" rx="12"/></clipPath>
