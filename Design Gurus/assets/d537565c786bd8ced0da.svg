  </g>
  <text x="400" y="1382" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Notification log</text>
  <text x="400" y="1454" font-size="18.5" text-anchor="middle" fill="#6B7280">every attempt, with status</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M660,1330 L660,1404 A160,16 0 0 0 980,1404 L980,1330" fill="#E2E8F0"/>
    <ellipse cx="820" cy="1330" rx="160" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="820" y="1382" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">In-app store</text>
  <text x="820" y="1454" font-size="18.5" text-anchor="middle" fill="#6B7280">unread per user</text>

  <rect x="40" y="1820" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1845" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1870" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Never scan for due work</text>
  <text x="323" y="1870" font-size="18.5" fill="#475569">the scheduler keeps the next fire time indexed, so it reads one row, not the table</text>
  <rect x="64" y="1895" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1920" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">One topic per channel</text>
  <text x="323" y="1920" font-size="18.5" fill="#475569">a dead SMS provider stops SMS, and email and push carry on unaffected</text>
  <rect x="64" y="1945" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1970" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">At least once, then dedupe</text>
  <text x="323" y="1970" font-size="18.5" fill="#475569">the log is what stops a retried alert waking someone up for a second time</text>
</svg>