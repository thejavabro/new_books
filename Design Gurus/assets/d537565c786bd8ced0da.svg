    <ellipse cx="234" cy="620" rx="170" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="234" y="672" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Reminders</text>
  <text x="234" y="744" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL, behind a cache</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M440,620 L440,694 A170,16 0 0 0 780,694 L780,620" fill="#D1FAE5"/>
    <ellipse cx="610" cy="620" rx="170" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="610" y="672" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Due alerts</text>
  <text x="610" y="744" font-size="18.5" text-anchor="middle" fill="#6B7280">what fires next, and when</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M816,620 L816,694 A170,16 0 0 0 1156,694 L1156,620" fill="#E0E7FF"/>
    <ellipse cx="986" cy="620" rx="170" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="986" y="672" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Preferences</text>
  <text x="986" y="744" font-size="18.5" text-anchor="middle" fill="#6B7280">SQL, behind a cache</text>
