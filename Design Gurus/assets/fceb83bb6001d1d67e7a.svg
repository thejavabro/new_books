<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="why-title why-desc">
<title id="why-title">Why time series breaks the rules</title>
<desc id="why-desc">Writes are relentless and set by the source count rather than user behavior, the natural key is monotonic, and value decays faster than for any other data. The third property makes retention part of the model.</desc>
<defs>
<marker id="why-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="why-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="why-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="why-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="700" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why time series breaks the rules</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Time-series data has three properties that fight the normal approach.</text>
<rect x="40" y="622" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="622" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="158" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="165" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="122" width="480" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="330" y="164" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Writes are relentless and append-only</text>
<path d="M576 158H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 158H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="620" y="122" width="580" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="151.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the rate is set by the number of sources,</text><text x="640" y="176.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so there is no quiet hour</text>
<circle cx="60" cy="242" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="249" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="206" width="480" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="330" y="248" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The natural key is monotonic</text>
<path d="M576 242H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 242H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="620" y="206" width="580" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="235.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">exactly the key shape that concentrates</text><text x="640" y="260.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every write on one partition</text>
<circle cx="60" cy="326" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="333" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="290" width="480" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="330" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Value decays faster than any other data</text>
<path d="M576 326H610" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 326H610" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#why-marker-slate)"/>
<rect x="620" y="290" width="580" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="640" y="319.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">five minutes old is being read now;</text><text x="640" y="344.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">five months old almost never is</text>
<rect x="40" y="394" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="394" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="437" font-size="24" font-weight="700" fill="#6040A8" text-anchor="start">The third one changes the model, not just the keys.</text><text x="64" y="463" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Retention stops being an operational afterthought and becomes part of the design.</text>
<rect x="40" y="524" width="1160" height="72" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="72" rx="2.5" fill="#F3CF6A"/><text x="64" y="566" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Storing old data at full resolution is nearly all of the cost.</text>
<text x="66" y="656" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Every modeling mistake from the previous lesson shows up here at once.</text>
</svg>