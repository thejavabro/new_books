<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="788" viewBox="0 0 1240 788" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Seven common types of caching, from the client device out to the DNS system, with what each one stores and what it is used for">
  <rect x="0" y="0" width="1240" height="788" fill="#FFFFFF"/>
  <defs>
    <filter id="ca1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="48" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Seven common types of caching</text>
  <g filter="url(#ca1-soft)">
    <rect x="40" y="84" width="270" height="70" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <rect x="40" y="184" width="270" height="70" rx="10" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
    <rect x="40" y="284" width="270" height="70" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="40" y="384" width="270" height="70" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="40" y="484" width="270" height="70" rx="10" fill="#E0E7FF" stroke="#4F46E5" stroke-width="1.5"/>
    <rect x="40" y="584" width="270" height="70" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="40" y="684" width="270" height="70" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  </g>
  <text x="175" y="126" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle">In-memory caching</text>
  <text x="340" y="114" font-size="20" fill="#0F172A">Data kept in main memory, the fastest place to read from</text>
  <text x="340" y="142" font-size="20" fill="#64748B">API responses, session data, page fragments; Memcached, Redis</text>
  <text x="175" y="226" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">Disk caching</text>
  <text x="340" y="214" font-size="20" fill="#0F172A">Data kept on the hard disk, slower than memory but faster than a remote source</text>
  <text x="340" y="242" font-size="20" fill="#64748B">Data too large for memory, or data that must survive a restart</text>
  <text x="175" y="326" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Database caching</text>
  <text x="340" y="314" font-size="20" fill="#0F172A">Frequently accessed data kept inside the database itself</text>
  <text x="340" y="342" font-size="20" fill="#64748B">Query caching and result set caching</text>
  <text x="175" y="426" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">Client-side caching</text>
  <text x="340" y="414" font-size="20" fill="#0F172A">Data kept on the user's own device</text>
  <text x="340" y="442" font-size="20" fill="#64748B">Browser cache and local storage for images, CSS and JavaScript</text>
  <text x="175" y="526" font-size="20" font-weight="600" fill="#4338CA" text-anchor="middle">Server-side caching</text>
  <text x="340" y="514" font-size="20" fill="#0F172A">Data kept on the server, inside the web application or backend</text>
  <text x="340" y="542" font-size="20" fill="#64748B">Full-page caching, fragment caching, object caching</text>
  <text x="175" y="626" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle">CDN caching</text>
  <text x="340" y="614" font-size="20" fill="#0F172A">Copies kept on a network of servers spread around the world</text>
  <text x="340" y="642" font-size="20" fill="#64748B">Images, videos and other static assets</text>
  <text x="175" y="726" font-size="20" font-weight="600" fill="#BE185D" text-anchor="middle">DNS caching</text>
  <text x="340" y="714" font-size="20" fill="#0F172A">The answer to a DNS query kept for a period of time</text>
  <text x="340" y="742" font-size="20" fill="#64748B">Repeat lookups are answered without asking the DNS servers again</text>
</svg>