<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" style="background-color:#ffffff">
<defs>
<marker id="oba" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
<marker id="obb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">

<text x="30" y="26" font-size="13" font-weight="bold" fill="#b4322c">Direct calls: the pipeline imports Slack, the dashboard, metrics and the deployer</text>

<rect x="30" y="42" width="170" height="66" rx="4" fill="#f7e2e0" stroke="#b4322c"/>
<text x="115" y="70" text-anchor="middle" font-size="12">BuildPipeline</text>
<text x="115" y="90" text-anchor="middle" font-size="10.5" fill="#b4322c">knows all four</text>

<rect x="300" y="34" width="140" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="370" y="52" text-anchor="middle" font-size="11">SlackNotifier</text>
<rect x="300" y="66" width="140" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="370" y="84" text-anchor="middle" font-size="11">DashboardUpdater</text>
<rect x="300" y="98" width="140" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="370" y="116" text-anchor="middle" font-size="11">MetricsRecorder</text>
<rect x="300" y="130" width="140" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="370" y="148" text-anchor="middle" font-size="11">DeployTrigger</text>

<path d="M 204 62 L 295 47" stroke="#b4322c" fill="none" marker-end="url(#oba)"/>
<path d="M 204 72 L 295 79" stroke="#b4322c" fill="none" marker-end="url(#oba)"/>
<path d="M 204 82 L 295 111" stroke="#b4322c" fill="none" marker-end="url(#oba)"/>
<path d="M 204 92 L 295 143" stroke="#b4322c" fill="none" marker-end="url(#oba)"/>

<text x="480" y="52" font-size="12" fill="#b4322c">A domain object now depends on Slack.</text>
<text x="480" y="72" font-size="12" fill="#b4322c">Adding a fifth reaction edits the pipeline.</text>
<text x="480" y="92" font-size="12" fill="#b4322c">Testing it means stubbing four services.</text>
<text x="480" y="112" font-size="12" fill="#b4322c">Turning one off in staging means a flag</text>
<text x="480" y="130" font-size="12" fill="#b4322c">inside code that should not care.</text>

<line x1="30" y1="184" x2="950" y2="184" stroke="#dbe2ed"/>

<text x="30" y="212" font-size="13" font-weight="bold" fill="#2f7a55">Observers: the pipeline holds a list of one interface</text>

<rect x="30" y="228" width="170" height="66" rx="4" fill="#dcefe4" stroke="#2f7a55"/>
<text x="115" y="256" text-anchor="middle" font-size="12">BuildPipeline</text>
<text x="115" y="276" text-anchor="middle" font-size="10.5" fill="#2f7a55">knows BuildListener</text>

<rect x="260" y="240" width="150" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.5"/>
<text x="335" y="258" text-anchor="middle" font-size="11.5">BuildListener</text>
<text x="335" y="274" text-anchor="middle" font-size="10.5" fill="#414d60">one method</text>

<rect x="480" y="212" width="150" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="555" y="230" text-anchor="middle" font-size="11">SlackNotifier</text>
<rect x="480" y="244" width="150" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="555" y="262" text-anchor="middle" font-size="11">DashboardUpdater</text>
<rect x="480" y="276" width="150" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="555" y="294" text-anchor="middle" font-size="11">MetricsRecorder</text>
<rect x="480" y="308" width="150" height="26" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="555" y="326" text-anchor="middle" font-size="11">DeployTrigger</text>

<path d="M 204 261 L 255 261" stroke="#2f7a55" fill="none" marker-end="url(#obb)"/>
<path d="M 414 255 L 475 225" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#obb)"/>
<path d="M 414 261 L 475 257" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#obb)"/>
<path d="M 414 267 L 475 289" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#obb)"/>
<path d="M 414 273 L 475 321" stroke="#2f7a55" fill="none" stroke-dasharray="4 3" marker-end="url(#obb)"/>

<text x="672" y="230" font-size="12" fill="#2f7a55">The pipeline imports none of them.</text>
<text x="672" y="250" font-size="12" fill="#2f7a55">A fifth reaction is one class plus</text>
<text x="672" y="268" font-size="12" fill="#2f7a55">one subscribe call.</text>
<text x="672" y="294" font-size="12" fill="#414d60">Staging can subscribe three and</text>
<text x="672" y="312" font-size="12" fill="#414d60">production four, with no flag.</text>

<rect x="30" y="352" width="920" height="60" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="376" font-size="12.5" fill="#414d60">What you give up: reading BuildPipeline no longer tells you what happens when a build finishes. Nothing at the call site names a listener.</text>
<text x="52" y="398" font-size="12.5" fill="#b4322c">And a listener that never unsubscribes is held forever, which is the leading cause of slow memory growth in long-lived applications.</text>
</g>
</svg>