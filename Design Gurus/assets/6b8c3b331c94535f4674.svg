<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="the sorted array">
<defs>
<filter id="sm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Sort first, then fix one value and close in</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">with the array sorted, one pair decides a whole run of triplets at once</text>
<rect x="40" y="100" width="1160" height="240" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the array sorted, target 3</text>
<rect x="438" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="479" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<text x="479" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="532" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="573" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="573" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="626" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="667" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="667" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="720" y="142" width="82" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="761" y="177.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="761" y="220" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="40" y="360" width="1160" height="124" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="390" font-size="19.5" font-weight="600" fill="#047857">triplets counted so far</text>
<rect x="110" y="408" width="260" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="240" y="440.5" text-anchor="middle" font-size="18" fill="#94A3B8">none yet</text>
<rect x="40" y="500" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="540" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">sorted: -1, 0, 2, 3</text>
<text x="620" y="572" text-anchor="middle" font-size="18.5" fill="#475569">sorting is what lets a pointer move in one direction and never come back</text>
</svg>