  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Why physical tier separation matters</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Separate machines give each tier its own scaling, failure domain, technology and network boundary.</text>

  <rect x="40" y="120" width="1160" height="240" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Independent scaling</text>
  <rect x="40" y="384" width="1160" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="414" font-size="19.5" font-weight="600" fill="#047857">2. Failure isolation</text>
  <rect x="40" y="648" width="1160" height="240" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="678" font-size="19.5" font-weight="600" fill="#B45309">3. Technology flexibility</text>
  <rect x="40" y="912" width="1160" height="240" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="942" font-size="19.5" font-weight="600" fill="#BE185D">4. Improved security</text>

