<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four panels. 1, independent scaling: each tier can be scaled based on its own load and bottleneck; scale out web servers, scale out application servers, scale up or add replicas for the data tier. 2, failure isolation: a failure in one tier does not necessarily bring down the entire system; the application tier has failed while the web tier keeps running and returns a 503 service unavailable response, and the data tier keeps running. 3, technology flexibility: each tier can use the best technology for its needs and be upgraded independently; Nginx or Apache for the web tier, Python, Java, Go or Node.js for the application tier, PostgreSQL, MySQL or MongoDB for the data tier. 4, improved security: each tier can be placed in its own network boundary with controlled access; the internet reaches the public, internet-facing web tier, which reaches the private application tier on the internal network, which reaches the private data tier with restricted access">
