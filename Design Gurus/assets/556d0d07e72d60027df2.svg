  <text x="128" y="1064" font-size="19.5" font-weight="600" fill="#111827">Internet</text>
  <text x="64" y="180" font-size="18.5" fill="#6B7280">Each tier can be scaled based on its own load and bottleneck.</text>
  <text x="64" y="444" font-size="18.5" fill="#6B7280">A failure in one tier does not necessarily bring down the entire system.</text>
  <text x="64" y="708" font-size="18.5" fill="#6B7280">Each tier can use the best technology for its needs and be upgraded independently.</text>
  <text x="64" y="972" font-size="18.5" fill="#6B7280">Each tier can be placed in its own network boundary with controlled access.</text>

