  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four types of pipes in pipe-and-filter architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The pipe between two filters can be a direct call, a queue, a stream, or a network channel.</text>

