  <text x="64" y="184" font-size="18.5" fill="#6B7280">Data passed directly in memory.</text>
  <text x="659" y="184" font-size="18.5" fill="#6B7280">Data placed in a queue between filters.</text>
  <text x="64" y="474" font-size="18.5" fill="#6B7280">Continuous flow of data between filters.</text>
  <text x="659" y="474" font-size="18.5" fill="#6B7280">Data sent over a network between filters.</text>

  <rect x="64" y="326" width="517" height="42" rx="10" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="322.5" y="353" text-anchor="middle" font-size="18.5" fill="#1F2937">In-memory call (synchronous)</text>
