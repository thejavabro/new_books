  <text x="64" y="440" font-size="19.5" font-weight="600" fill="#475569">3. Stream</text>
  <rect x="635" y="410" width="565" height="270" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="659" y="440" font-size="19.5" font-weight="600" fill="#475569">4. Network channel</text>

