<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Notification sits at the center as the shared source of truth. Notification preference sits above it, and device and webhook registration below it. On the right, three delivery paths leave the notification: events to the browser through SSE, notification ids to a closed mobile application through platform push, and signed events to a partner server through a webhook.">
  <defs>
    <marker id="pw-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="pw-vm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>

    <filter id="pw-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pw-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pw-k1"><rect x="230" y="96" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k2"><rect x="230" y="269" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k3"><rect x="70" y="465" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k4"><rect x="430" y="465" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k5"><rect x="860" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k6"><rect x="860" y="280" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pw-k7"><rect x="860" y="450" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="720" height="570" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One source of truth</text>

  
  <rect x="820" y="40" width="380" height="570" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="844" y="70" font-size="16.5" font-weight="600" fill="#5B21B6">Three delivery paths</text>

  
  <g fill="none" stroke-width="2">
    <path d="M280,359 V441 Q280,453 268,453 H232 Q220,453 220,465" stroke="#059669" marker-end="url(#pw-em)"/>
    <path d="M520,359 V441 Q520,453 532,453 H568 Q580,453 580,465" stroke="#059669" marker-end="url(#pw-em)"/>
    <path d="M570,289 H700 Q712,289 712,277 V167 Q712,155 724,155 H860" stroke="#7C3AED" marker-end="url(#pw-vm)"/>
    <path d="M570,325 H860" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#pw-vm)"/>
    <path d="M570,339 H768 Q780,339 780,351 V483 Q780,495 792,495 H860" stroke="#7C3AED" marker-end="url(#pw-vm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="622" y="275" fill="#5B21B6">events</text>
    <text x="680" y="313" fill="#5B21B6">notification id</text>
    <text x="640" y="363" fill="#5B21B6">signed event</text>
  </g>

  
  <g filter="url(#pw-soft)">
    <rect x="230" y="96" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="230" y="96" width="6" height="90" fill="#D97706" clip-path="url(#pw-k1)"/>
  </g>
  <circle cx="268" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(257.56,130.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="294" y="148" font-size="18.5" font-weight="600" fill="#111827">NotificationPreference</text>
  <text x="400" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">changes channels, not history</text>

  
  <g filter="url(#pw-lift)">
    <rect x="230" y="269" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="230" y="269" width="9" height="90" fill="#2563EB" clip-path="url(#pw-k2)"/>
  </g>
  <circle cx="268" cy="314" r="18" fill="#FFFFFF"/>
  <g transform="translate(257.56,303.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="294" y="321" font-size="18.5" font-weight="600" fill="#111827">Notification</text>
  <text x="400" y="384" font-size="15.5" text-anchor="middle" fill="#6B7280">the shared source of truth</text>
  <text x="400" y="407" font-size="15.5" text-anchor="middle" fill="#94A3B8">one read state per user</text>

  
  <g filter="url(#pw-soft)">
    <rect x="70" y="465" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="70" y="465" width="6" height="90" fill="#059669" clip-path="url(#pw-k3)"/>
  </g>
  <circle cx="108" cy="510" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,499.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="134" y="517" font-size="18.5" font-weight="600" fill="#111827">Device</text>
  <text x="220" y="580" font-size="15.5" text-anchor="middle" fill="#6B7280">push destination</text>

  
  <g filter="url(#pw-soft)">
    <rect x="430" y="465" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="430" y="465" width="6" height="90" fill="#059669" clip-path="url(#pw-k4)"/>
  </g>
  <circle cx="468" cy="510" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,499.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="494" y="517" font-size="18.5" font-weight="600" fill="#111827">WebhookRegistration</text>
  <text x="580" y="580" font-size="15.5" text-anchor="middle" fill="#6B7280">partner destination</text>

  
  <g filter="url(#pw-soft)">
    <rect x="860" y="110" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="860" y="110" width="6" height="90" fill="#7C3AED" clip-path="url(#pw-k5)"/>
  </g>
  <circle cx="898" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,144.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="924" y="162" font-size="18.5" font-weight="600" fill="#111827">Browser</text>
  <text x="1010" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">SSE stream of events</text>

  
  <g filter="url(#pw-soft)">
    <rect x="860" y="280" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="860" y="280" width="6" height="90" fill="#7C3AED" clip-path="url(#pw-k6)"/>
  </g>
  <circle cx="898" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,314.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/>
    <path d="M10.5 18.5h3"/>
  </g>
  <text x="924" y="332" font-size="18.5" font-weight="600" fill="#111827">Mobile application</text>
  <text x="1010" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">platform push carries an id</text>
  <text x="1010" y="418" font-size="15.5" text-anchor="middle" fill="#94A3B8">arrives when the application is closed</text>

  
  <g filter="url(#pw-soft)">
    <rect x="860" y="450" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="860" y="450" width="6" height="90" fill="#7C3AED" clip-path="url(#pw-k7)"/>
  </g>
  <circle cx="898" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,484.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="924" y="502" font-size="18.5" font-weight="600" fill="#111827">Partner server</text>
  <text x="1010" y="565" font-size="15.5" text-anchor="middle" fill="#6B7280">signed webhook delivery</text>

  
  <rect x="40" y="640" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="682" text-anchor="middle" font-size="16" fill="#475569">A delivery path is not the source of truth.</text>
  <text x="620" y="710" text-anchor="middle" font-size="16" fill="#475569">Every consumer can return to the REST notification for authoritative state.</text>
</svg>