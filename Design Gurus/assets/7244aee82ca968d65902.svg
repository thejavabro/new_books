<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="524" viewBox="0 0 1240 524" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three ways to deal with a legacy system. A big bang rewrite ships nothing for months and puts all the risk on one release day. Doing nothing lets cost and security risk keep growing. The strangler fig pattern moves one function at a time, so each step is small and reversible and the old system shrinks">
  <defs>
    <filter id="sf1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sf1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sf1-k1"><rect x="65" y="110" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="sf1-k2"><rect x="460" y="110" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="sf1-k3"><rect x="855" y="110" width="320" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="524" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="370" height="280" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#BE185D">Option 1: replace it all at once</text>

  <rect x="435" y="44" width="370" height="280" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="459" y="74" font-size="16.5" font-weight="600" fill="#475569">Option 2: leave it alone</text>

  <rect x="830" y="44" width="370" height="280" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="854" y="74" font-size="16.5" font-weight="600" fill="#047857">Option 3: replace it piece by piece</text>

  
  <g filter="url(#sf1-soft)">
    <rect x="65" y="110" width="320" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="65" y="110" width="6" height="90" fill="#DB2777" clip-path="url(#sf1-k1)"/>
  </g>
  <circle cx="103" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(92.56,144.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="129" y="162" font-size="18.5" font-weight="600" fill="#111827">Big Bang Rewrite</text>
  <text x="225" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">months with nothing shipped</text>
  <text x="225" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">one release day carries the risk</text>
  <text x="225" y="271" font-size="15.5" text-anchor="middle" fill="#94A3B8">often abandoned part way</text>

  
  <g filter="url(#sf1-soft)">
    <rect x="460" y="110" width="320" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="460" y="110" width="6" height="90" fill="#64748B" clip-path="url(#sf1-k2)"/>
  </g>
  <circle cx="498" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="524" y="162" font-size="18.5" font-weight="600" fill="#111827">Do Nothing</text>
  <text x="620" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">maintenance cost keeps rising</text>
  <text x="620" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">security gaps stay open</text>
  <text x="620" y="271" font-size="15.5" text-anchor="middle" fill="#94A3B8">hiring gets harder each year</text>

  
  <g filter="url(#sf1-lift)">
    <rect x="855" y="110" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="855" y="110" width="9" height="90" fill="#059669" clip-path="url(#sf1-k3)"/>
  </g>
  <circle cx="893" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,144.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="919" y="162" font-size="18.5" font-weight="600" fill="#111827">Strangler Fig</text>
  <text x="1015" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">one function moved at a time</text>
  <text x="1015" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">each step is small and reversible</text>
  <text x="1015" y="271" font-size="15.5" text-anchor="middle" fill="#94A3B8">the old system shrinks as you go</text>

  
  <rect x="40" y="356" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="380" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="402" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Why 1 fails</text>
  <text x="288" y="402" font-size="15.5" fill="#475569">a rewrite has to match every feature of the old system before it can ship anything at all</text>

  <rect x="64" y="424" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="446" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Why 3 works</text>
  <text x="288" y="446" font-size="15.5" fill="#475569">value ships on the first migrated function, and the old path stays available if the new one fails</text>
</svg>