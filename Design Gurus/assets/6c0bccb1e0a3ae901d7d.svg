<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A 48-bit TweetID bit layout: the high 31 bits hold epoch seconds and the low 17 bits hold an auto-incrementing sequence that resets every second, so the creation time lives inside the ID itself.">
  <defs>
    <filter id="tw03-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="tw03-kL"><rect x="40" y="92" width="749" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>

  
  <text x="40" y="56" font-size="18.5" font-weight="600" fill="#111827">One 48-bit TweetID</text>

  
  <g filter="url(#tw03-soft)">
    <path d="M 52,92 H 789 V 182 H 52 A 12 12 0 0 1 40,170 V 104 A 12 12 0 0 1 52,92 Z" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <path d="M 789,92 H 1188 A 12 12 0 0 1 1200,104 V 170 A 12 12 0 0 1 1188,182 H 789 Z" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="92" width="6" height="90" fill="#7C3AED" clip-path="url(#tw03-kL)"/>
    <rect x="789" y="92" width="6" height="90" fill="#059669"/>
  </g>
  <text x="417" y="131" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Epoch seconds</text>
  <text x="417" y="158" text-anchor="middle" font-size="15.5" fill="#6B7280">31 bits</text>
  <text x="997" y="131" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Sequence</text>
  <text x="997" y="158" text-anchor="middle" font-size="15.5" fill="#6B7280">17 bits</text>

  
  <text x="417" y="211" text-anchor="middle" font-size="15.5" fill="#6B7280">covers 50 years, about 1.6 billion seconds</text>
  <text x="997" y="211" text-anchor="middle" font-size="15.5" fill="#6B7280">resets every second; 2^17 = 130K tweets per second</text>

  
  <rect x="40" y="248" width="1160" height="104" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="72" y="292" font-size="17" font-weight="600"><tspan fill="#5B21B6">1483228800</tspan><tspan dx="14" fill="#047857">000001</tspan></text>
  <text x="72" y="326" font-size="17" font-weight="600"><tspan fill="#5B21B6">1483228800</tspan><tspan dx="14" fill="#047857">000002</tspan></text>
  <text x="340" y="313" font-size="15.5" fill="#6B7280">the same second, two sequence numbers</text>

  
  <rect x="40" y="392" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="429" text-anchor="middle" font-size="16" fill="#475569">The creation time lives inside the ID itself, so tweets sort by time on the primary key and no separate timestamp column or index is needed.</text>
</svg>