<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How few characters of "amazingracecar" are left over?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The dictionary is "race" and "car", and words are read in place, never reordered</text>
