<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The numbers, unsorted, with nothing measured yet">
<defs>
<filter id="lc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How long is the longest run of consecutive numbers?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Sorting would answer it, and there is a way that does not need sorting</text>
<rect x="40" y="106" width="1160" height="508" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Put every number in a set first, so asking whether a number is present costs one step</text>
<text x="236" y="260" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the numbers</text>
<rect x="260" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="326" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="412" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="478" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="564" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="630" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="716" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="782" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">100</text>
<rect x="868" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="934" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">101</text>
<rect x="1020" y="222" width="132" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1086" y="259.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">102</text>
<text x="236" y="384" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">is it a start?</text>
<rect x="260" y="350" width="680" height="62" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="600" y="388.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">a run should only ever be counted from the number that STARTS it</text>
<rect x="430" y="444" width="380" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="477.02" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">longest so far: 0</text>
<text x="620" y="556" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Without that rule the same run gets recounted from each of its members</text>
<rect x="40" y="626" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="666" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A number starts a run exactly when the number below it is missing</text>
<text x="620" y="698" text-anchor="middle" font-size="18.5" fill="#475569">So check for that first, and only then walk upwards</text>
</svg>