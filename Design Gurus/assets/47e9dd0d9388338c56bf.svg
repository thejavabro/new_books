<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="330" viewBox="0 0 1240 330" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Estimation sits between clarifying the requirements and drawing the high-level design, because it needs the requirements and the design needs it">
  <rect x="0" y="0" width="1240" height="330" fill="#FFFFFF"/>
  <defs>
    <marker id="be2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="be2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="300" y1="165" x2="343" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#be2-slate)"/>
  <line x1="610" y1="165" x2="653" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#be2-slate)"/>
  <line x1="920" y1="165" x2="963" y2="165" stroke="#475569" stroke-width="2.5" marker-end="url(#be2-slate)"/>

  <g filter="url(#be2-soft)">
    <rect x="40" y="110" width="260" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="350" y="110" width="260" height="110" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
    <rect x="660" y="110" width="260" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="970" y="110" width="260" height="110" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <text x="170" y="155" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Clarify the</text>
  <text x="170" y="188" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">requirements</text>

  <text x="480" y="155" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Estimate</text>
  <text x="480" y="188" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">the size</text>

  <text x="790" y="155" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">High-level</text>
  <text x="790" y="188" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">design</text>

  <text x="1100" y="155" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Deep dive on</text>
  <text x="1100" y="188" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">one component</text>

  <text x="480" y="86" font-size="20" font-weight="700" fill="#D97706" text-anchor="middle">this chapter</text>

  <text x="620" y="290" font-size="20" fill="#475569" text-anchor="middle">Estimation needs the requirements, and the high-level design needs the estimation</text>
</svg>