<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Web browser and mobile app send ordinary requests and the API client sends many requests to the application servers. Inside each server, Server 1 shown in front of Server 2 and Server 3, a rate limiter runs after authentication and counts requests per user ID: requests within the limit pass on to the application logic in the same server, and only the API client&#39;s requests over that user&#39;s limit are rejected back to it with 429 Too Many Requests. The rate limiter in every server reads and writes one shared count in Redis, a sliding window log with one sorted set per user">
  <defs>
    <filter id="m04k-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m04k-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m04k-k1"><rect x="60" y="210" width="200" height="64" rx="12"/></clipPath>
    <clipPath id="m04k-k2"><rect x="60" y="300" width="200" height="64" rx="12"/></clipPath>
    <clipPath id="m04k-k3"><rect x="60" y="390" width="200" height="64" rx="12"/></clipPath>
    <clipPath id="m04k-k4"><rect x="468" y="360" width="240" height="130" rx="12"/></clipPath>
    <clipPath id="m04k-k5"><rect x="880" y="380" width="220" height="90" rx="12"/></clipPath>
    <marker id="m04k-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="m04k-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m04k-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m04k-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Rate limiting: protecting servers from overload</text>


  <rect x="40" y="130" width="240" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="160" font-size="19.5" font-weight="600" fill="#475569">Clients</text>
  <rect x="420" y="130" width="780" height="450" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="444" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Application servers</text>
  <rect x="484" y="200" width="680" height="265" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="508" y="230" font-size="19.5" font-weight="600" fill="#1D4ED8">Server 3</text>
  <rect x="464" y="240" width="680" height="265" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="488" y="270" font-size="19.5" font-weight="600" fill="#1D4ED8">Server 2</text>
  <rect x="444" y="280" width="680" height="265" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="468" y="310" font-size="19.5" font-weight="600" fill="#1D4ED8">Server 1</text>

  <g fill="none" stroke-width="2">
    <path d="M260,242 L468,381" stroke="#2563EB" marker-end="url(#m04k-m-blue)"/>
    <path d="M260,332 L468,403" stroke="#2563EB" marker-end="url(#m04k-m-blue)"/>
    <path d="M260,404 L468,425" stroke="#2563EB" marker-end="url(#m04k-m-blue)"/>
    <path d="M260,422 L468,447" stroke="#2563EB" marker-end="url(#m04k-m-blue)"/>
    <path d="M260,440 L468,469" stroke="#2563EB" marker-end="url(#m04k-m-blue)"/>
    <path d="M708,425 H880" stroke="#059669" marker-end="url(#m04k-m-emerald)"/>
    <path d="M696,490 V598 Q696,610 684,610 H170 Q160,610 160,600 V454" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m04k-m-pink)"/>
    <path d="M708,465 H830 Q840,465 840,475 V594" stroke="#2563EB" marker-end="url(#m04k-m-blue)" marker-start="url(#m04k-s-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="350" y="484" fill="#1D4ED8">Many requests</text>
    <text x="794" y="388" fill="#047857">Allowed requests</text>
    <text x="794" y="411" fill="#047857">(within limit)</text>
    <text x="480" y="656" fill="#BE185D">Rejected: 429 Too Many Requests</text>
    <text x="480" y="679" fill="#BE185D">(over that user's limit)</text>
  </g>

  <g filter="url(#m04k-soft)">
    <rect x="60" y="210" width="200" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="210" width="6" height="64" fill="#64748B" clip-path="url(#m04k-k1)"/>
  </g>
  <circle cx="98" cy="242" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,231.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="124" y="249" font-size="18.5" font-weight="600" fill="#111827">Web browser</text>
  <g filter="url(#m04k-soft)">
    <rect x="60" y="300" width="200" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="300" width="6" height="64" fill="#64748B" clip-path="url(#m04k-k2)"/>
  </g>
  <circle cx="98" cy="332" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,321.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="124" y="339" font-size="18.5" font-weight="600" fill="#111827">Mobile app</text>
  <g filter="url(#m04k-soft)">
    <rect x="60" y="390" width="200" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="390" width="6" height="64" fill="#64748B" clip-path="url(#m04k-k3)"/>
  </g>
  <circle cx="98" cy="422" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,411.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="124" y="429" font-size="18.5" font-weight="600" fill="#111827">API client</text>
  <g filter="url(#m04k-soft)">
    <rect x="468" y="360" width="240" height="130" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="468" y="360" width="6" height="130" fill="#4F46E5" clip-path="url(#m04k-k4)"/>
  </g>
  <circle cx="506" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(495.56,414.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="532" y="432" font-size="21.5" font-weight="600" fill="#111827">Rate limiter</text>
  <text x="588" y="512" font-size="18.5" text-anchor="middle" fill="#6B7280">runs in every server,</text>
  <text x="588" y="535" font-size="18.5" text-anchor="middle" fill="#6B7280">one shared count</text>
  <text x="588" y="345" font-size="18.5" text-anchor="middle" fill="#6B7280">after authentication, per user ID</text>
  <g filter="url(#m04k-soft)">
    <rect x="880" y="380" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="880" y="380" width="6" height="90" fill="#2563EB" clip-path="url(#m04k-k5)"/>
  </g>
  <circle cx="918" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,414.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="944" y="419.25" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="944" y="444.75" font-size="21.5" font-weight="600" fill="#111827">logic</text>

  <circle cx="98" cy="332" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,321.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></g>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M740,610 L740,684 A100,16 0 0 0 940,684 L940,610" fill="#DBEAFE"/>
    <ellipse cx="840" cy="610" rx="100" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="840" y="662" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Redis</text>
  <text x="960" y="645" font-size="18.5" fill="#6B7280">sliding window log,</text>
  <text x="960" y="668" font-size="18.5" fill="#6B7280">one sorted set per user</text>
  <circle cx="480" cy="610" r="15" fill="#DB2777" stroke="#FFFFFF" stroke-width="3"/>
  <path d="M474.5,604.5 L485.5,615.5 M485.5,604.5 L474.5,615.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>


</svg>