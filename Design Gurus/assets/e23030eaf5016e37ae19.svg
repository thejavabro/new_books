<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="410" viewBox="0 0 1240 410" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A burst at the minute boundary: three allowed requests at the end of minute one and three more at the start of minute two make six requests in about two seconds.">
  <rect x="0" y="0" width="1240" height="410" fill="#FFFFFF"/>

  
  <rect x="120" y="40" width="498" height="58" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="144" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">minute one (3 requests)</text>
  <rect x="622" y="40" width="498" height="58" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="646" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">minute two (3 requests)</text>

  
  <g stroke="#64748B" stroke-width="2">
    <line x1="80" y1="190" x2="1160" y2="190"/>
    <line x1="120" y1="182" x2="120" y2="198"/>
    <line x1="620" y1="182" x2="620" y2="198"/>
    <line x1="1120" y1="182" x2="1120" y2="198"/>
  </g>
  <g font-size="15.5" text-anchor="middle" fill="#6B7280">
    <text x="120" y="225">03:00</text>
    <text x="620" y="225">03:01</text>
    <text x="1120" y="225">03:02</text>
  </g>

  
  <g fill="#059669">
    <circle cx="512" cy="190" r="11"/>
    <circle cx="550" cy="190" r="11"/>
    <circle cx="588" cy="190" r="11"/>
    <circle cx="652" cy="190" r="11"/>
    <circle cx="690" cy="190" r="11"/>
    <circle cx="728" cy="190" r="11"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M507,190 l3.5,3.5 l6.5,-7.5"/>
    <path d="M545,190 l3.5,3.5 l6.5,-7.5"/>
    <path d="M583,190 l3.5,3.5 l6.5,-7.5"/>
    <path d="M647,190 l3.5,3.5 l6.5,-7.5"/>
    <path d="M685,190 l3.5,3.5 l6.5,-7.5"/>
    <path d="M723,190 l3.5,3.5 l6.5,-7.5"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="512" y="164">m1</text>
    <text x="550" y="164">m2</text>
    <text x="588" y="164">m3</text>
    <text x="652" y="164">m4</text>
    <text x="690" y="164">m5</text>
    <text x="728" y="164">m6</text>
  </g>

  
  <path d="M500,238 V250 H740 V238 M620,250 V264" fill="none" stroke="#DB2777" stroke-width="2"/>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="620" y="290" fill="#BE185D">6 requests in about two seconds, against a limit of 3 per minute</text>
  </g>

  
  <rect x="40" y="320" width="1160" height="56" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="354" text-anchor="middle" font-size="16" fill="#475569">Each fixed window is within its limit; the burst crosses the edge.</text>
</svg>