<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four stages from top to bottom. One, shadow traffic: for 2 weeks in all cities, a copy of every order request goes to the new service in dry-run mode and the results are compared, while the monolith remains the source of truth. Two, reads by percentage, for 1 week: the routing key is a hash of the courier ID, moving 1, then 10, 50 and 100 percent of couriers, with the monolith still the source of truth. Three, matching by city, over 5 weeks: the routing key is the city, moving City D with 8 percent of orders, then C with 17, B with 30 and A with 45, and the new service becomes the source of truth city by city. Four, completion: after 4 weeks with every city on the new service, the gateway sends Courier app calls straight to the service and the old Dispatch code and tables are removed.">
  <defs>
    <filter id="md04c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md04c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md04c-k1"><rect x="40" y="130" width="430" height="84" rx="12"/></clipPath>
    <clipPath id="md04c-k2"><rect x="40" y="250" width="430" height="84" rx="12"/></clipPath>
    <clipPath id="md04c-k3"><rect x="40" y="370" width="430" height="84" rx="12"/></clipPath>
    <clipPath id="md04c-k4"><rect x="40" y="490" width="430" height="84" rx="12"/></clipPath>
    <marker id="md04c-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Staged routing for the Dispatch extraction</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each stage starts only after the previous one has produced evidence.</text>



  <g fill="none" stroke-width="2">
    <path d="M255,214 V250" stroke="#64748B" marker-end="url(#md04c-m-slate)"/>
    <path d="M255,334 V370" stroke="#64748B" marker-end="url(#md04c-m-slate)"/>
    <path d="M255,454 V490" stroke="#64748B" marker-end="url(#md04c-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md04c-soft)">
    <rect x="40" y="130" width="430" height="84" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="84" fill="#64748B" clip-path="url(#md04c-k1)"/>
  </g>
  <circle cx="78" cy="172" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,161.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="179" font-size="21.5" font-weight="600" fill="#111827">1. Shadow traffic</text>
  <g filter="url(#md04c-soft)">
    <rect x="40" y="250" width="430" height="84" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="250" width="6" height="84" fill="#2563EB" clip-path="url(#md04c-k2)"/>
  </g>
  <circle cx="78" cy="292" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,281.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a5 5 0 0 1 3.5 4.8V20"/></g>
  <text x="104" y="299" font-size="21.5" font-weight="600" fill="#111827">2. Reads by percentage</text>
  <g filter="url(#md04c-soft)">
    <rect x="40" y="370" width="430" height="84" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="370" width="6" height="84" fill="#7C3AED" clip-path="url(#md04c-k3)"/>
  </g>
  <circle cx="78" cy="412" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,401.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="104" y="419" font-size="21.5" font-weight="600" fill="#111827">3. Matching by city</text>
  <g filter="url(#md04c-lift)">
    <rect x="40" y="490" width="430" height="84" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="490" width="9" height="84" fill="#059669" clip-path="url(#md04c-k4)"/>
  </g>
  <circle cx="78" cy="532" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,521.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="539" font-size="21.5" font-weight="600" fill="#111827">4. Completion</text>
  <text x="510" y="148" font-size="18.5" fill="#475569">All cities, 2 weeks: a copy of every order request</text>
  <text x="510" y="175" font-size="18.5" fill="#6B7280">The new service runs in dry-run mode, results compared</text>
  <text x="510" y="202" font-size="18.5" font-weight="600" fill="#334155">Source of truth: the monolith</text>
  <text x="510" y="268" font-size="18.5" fill="#475569">Routing key: a hash of the courier ID</text>
  <text x="510" y="295" font-size="18.5" fill="#6B7280">1 week: 1, then 10, 50 and 100 percent of couriers</text>
  <text x="510" y="322" font-size="18.5" font-weight="600" fill="#334155">Source of truth: the monolith</text>
  <text x="510" y="388" font-size="18.5" fill="#475569">Routing key: the city</text>
  <text x="510" y="415" font-size="18.5" fill="#6B7280">5 weeks: City D (8 percent of orders), then C (17), B (30), A (45)</text>
  <text x="510" y="442" font-size="18.5" font-weight="600" fill="#334155">Source of truth: the new service, city by city</text>
  <text x="510" y="508" font-size="18.5" fill="#475569">After 4 weeks with every city on the new service</text>
  <text x="510" y="535" font-size="18.5" fill="#6B7280">The gateway sends Courier app calls straight to the service</text>
  <text x="510" y="562" font-size="18.5" fill="#6B7280">Old Dispatch code and tables are removed</text>




</svg>