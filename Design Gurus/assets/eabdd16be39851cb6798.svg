<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="656" viewBox="0 0 1240 656" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">What a design-killing estimate looks like</title>
<desc id="shape-desc">A plausible design, one quantity estimated roughly in under a minute, a result off by an order of magnitude rather than marginally, and a replacement that follows from the same number.</desc>
<defs>
<marker id="shape-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shape-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shape-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shape-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="656" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a design-killing estimate looks like</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each case has the same shape, and that shape is the part you can carry to other problems.</text>
<rect x="40" y="578" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="578" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="260" height="228" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V340A6 6 0 0 0 46 346H54Z" fill="#5EC9EC"/>
<circle cx="170" cy="156" r="21" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="170" y="164" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="170" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">A design is</text><text x="170" y="236" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">proposed</text>
<text x="170" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and it sounds entirely</text><text x="170" y="299" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">plausible</text>
<path d="M304 156H336" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M304 156H336" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="340" y="118" width="260" height="228" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M354 118H346A6 6 0 0 0 340 124V340A6 6 0 0 0 346 346H354Z" fill="#39D5AA"/>
<circle cx="470" cy="156" r="21" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="470" y="164" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="470" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">One quantity is</text><text x="470" y="236" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">estimated</text>
<text x="470" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">roughly, in under a</text><text x="470" y="299" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">minute</text>
<path d="M604 156H636" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M604 156H636" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="640" y="118" width="260" height="228" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V340A6 6 0 0 0 646 346H654Z" fill="#F28B9D"/>
<circle cx="770" cy="156" r="21" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="770" y="164" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="770" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The result is not</text><text x="770" y="236" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">marginal</text>
<text x="770" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">it is off by an order of</text><text x="770" y="299" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">magnitude</text>
<path d="M904 156H936" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M904 156H936" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="940" y="118" width="260" height="228" rx="14" fill="#F4F7FA" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.6"/><path d="M954 118H946A6 6 0 0 0 940 124V340A6 6 0 0 0 946 346H954Z" fill="#AC8BE8"/>
<circle cx="1070" cy="156" r="21" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1070" y="164" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1070" y="208" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The design is</text><text x="1070" y="236" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">eliminated</text>
<text x="1070" y="274" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and what replaces it</text><text x="1070" y="299" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">follows from the same</text><text x="1070" y="324" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">number</text>
<rect x="40" y="370" width="1160" height="182" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="406" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Step three is what makes a case worth working. Marginal numbers teach nothing.</text>
<rect x="70" y="426" width="540" height="106" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="70" y="426" width="5" height="106" rx="2.5" fill="#F3CF6A"/><text x="94" y="458" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Close to the threshold</text><text x="94" y="485" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">means measure more carefully</text><text x="94" y="512" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and keep designing</text>
<rect x="630" y="426" width="540" height="106" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="630" y="426" width="5" height="106" rx="2.5" fill="#F28B9D"/><text x="654" y="458" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A hundred times over it</text><text x="654" y="485" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">means stop designing that thing</text><text x="654" y="512" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and it is available very early</text>
<text x="66" y="612" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An estimate near the threshold tells you to measure. One far past it tells you to stop.</text>
</svg>