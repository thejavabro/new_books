<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four calculations">
  <rect x="0" y="0" width="1240" height="550" fill="#FFFFFF"/>

  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">The four calculations</text>
  <rect x="30" y="108" width="570" height="146" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="315" y="148" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">In flight</text>
  <text x="315" y="188" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">rate x duration</text>
  <text x="315" y="228" font-size="20" fill="#334155" text-anchor="middle">300/s x 2 s = 600 in flight</text>
  <rect x="640" y="108" width="570" height="146" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="925" y="148" font-size="22" font-weight="700" fill="#065F46" text-anchor="middle">Chain availability</text>
  <text x="925" y="188" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">multiply, or add the failures</text>
  <text x="925" y="228" font-size="20" fill="#334155" text-anchor="middle">0.999 five times = 99.5%</text>
  <rect x="30" y="298" width="570" height="146" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="315" y="338" font-size="22" font-weight="700" fill="#92400E" text-anchor="middle">Cache load</text>
  <text x="315" y="378" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">(1 - hit ratio) x rate</text>
  <text x="315" y="418" font-size="20" fill="#334155" text-anchor="middle">99% hit = 120/s. 90% = 1,200/s</text>
  <rect x="640" y="298" width="570" height="146" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="925" y="338" font-size="22" font-weight="700" fill="#5B21B6" text-anchor="middle">Sizing</text>
  <text x="925" y="378" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">per day / 100,000</text>
  <text x="925" y="418" font-size="20" fill="#334155" text-anchor="middle">10M a day = 100 per second</text>
  <text x="620" y="498" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Round aggressively. A day is 100,000 seconds. Peak is 3x to 5x the average.</text>
</svg>