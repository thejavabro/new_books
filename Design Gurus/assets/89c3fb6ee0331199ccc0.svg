<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="710" viewBox="0 0 1240 710" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three panels. First, the Orders module holds three jobs: placing and tracking orders, courier earnings and SMS message text, so three teams edit one file. Second, the delivery fee formula is copied into the Customer app, Orders and Payments, so one fee change needs three edits and a customer can be shown 2.99 dollars and charged 3.49. Third, Orders reads the menu_items table inside the Menu module with direct SQL, so a column rename breaks Orders. The repairs are: move each job to its owner, let Orders own the fee, and read prices through the Menu interface.">
