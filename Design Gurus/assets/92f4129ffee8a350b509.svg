<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A canary deployment loop: real traffic reaches a router that sends 99 percent to the stable v1 fleet and 1 percent to the v2 canary. Metrics from both fleets feed an automated comparison of error rate and p99 latency. A clean comparison promotes the canary to 10 percent, then 50 percent, then all traffic. A regression triggers an automatic rollback.">
  <defs>
    <marker id="m06-l04-canary-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m06-l04-canary-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l04-canary-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m06-l04-canary-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m06-l04-canary-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l04-canary-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="60" y="44" font-size="20" font-weight="600" fill="#334155">The canary loop</text>
  <text x="1180" y="44" text-anchor="end" font-size="20" fill="#64748B">hold each stage for minutes, not seconds</text>

  <g filter="url(#m06-l04-canary-soft)">
    <rect x="50" y="390" width="220" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="160" y="436" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Traffic</text>
  <text x="160" y="468" text-anchor="middle" font-size="20" fill="#64748B">real user requests</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="320" y="390" width="250" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="445" y="436" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Router</text>
  <text x="445" y="468" text-anchor="middle" font-size="20" fill="#64748B">splits by share</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="620" y="200" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="760" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stable fleet: v1</text>
  <text x="760" y="283" text-anchor="middle" font-size="20" fill="#64748B">the metric baseline</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="620" y="560" width="280" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="760" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Canary: v2</text>
  <text x="760" y="643" text-anchor="middle" font-size="20" fill="#64748B">the new version</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="620" y="370" width="280" height="140" rx="10" fill="#F8FAFC" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="760" y="415" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Automated comparison</text>
  <text x="760" y="447" text-anchor="middle" font-size="20" fill="#64748B">error rate, p99 latency</text>
  <text x="760" y="479" text-anchor="middle" font-size="20" fill="#64748B">canary vs stable cohort</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="960" y="200" width="220" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1070" y="251" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Promote</text>
  <text x="1070" y="283" text-anchor="middle" font-size="20" fill="#64748B">10%, 50%, then all</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="960" y="560" width="220" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1070" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Auto rollback</text>
  <text x="1070" y="643" text-anchor="middle" font-size="20" fill="#64748B">1% for minutes</text>
  <g filter="url(#m06-l04-canary-soft)">
    <rect x="50" y="560" width="250" height="140" rx="10" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5"/>
  </g>
  <text x="175" y="605" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A canary nobody</text>
  <text x="175" y="637" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">measures is just a</text>
  <text x="175" y="669" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">rolling update</text>

  <g fill="none" stroke-width="2.5">
    <path d="M270,445 L312,445" stroke="#3B82F6" marker-end="url(#m06-l04-canary-bl)"/>
    <path d="M570,420 C600,420 600,260 612,260" stroke="#3B82F6" stroke-width="3" marker-end="url(#m06-l04-canary-bl)"/>
    <path d="M570,470 C600,470 600,620 612,620" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#m06-l04-canary-vi)"/>
    <path d="M760,320 L760,362" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l04-canary-sl)"/>
    <path d="M760,560 L760,518" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l04-canary-sl)"/>
    <path d="M900,420 C930,420 930,260 952,260" stroke="#059669" marker-end="url(#m06-l04-canary-em)"/>
    <path d="M900,460 C930,460 930,620 952,620" stroke="#DC2626" marker-end="url(#m06-l04-canary-rd)"/>
    <path d="M1070,200 L1070,110 L445,110 L445,382" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m06-l04-canary-em)"/>
  </g>

  <text x="560" y="300" text-anchor="end" font-size="20" font-weight="600" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">99%</text>
  <text x="560" y="545" text-anchor="end" font-size="20" font-weight="600" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1%</text>
  <text x="778" y="348" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">metrics</text>
  <text x="600" y="545" text-anchor="end" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">metrics</text>
  <text x="830" y="350" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">clean</text>
  <text x="830" y="545" text-anchor="end" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">regression</text>
  <text x="760" y="92" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">raise the canary share, then compare again</text>

  <line x1="60" y1="800" x2="96" y2="800" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Live request path: the router sends 99% of real traffic to v1</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">The new version, v2: only 1% of real traffic reaches it</text>
  <line x1="60" y1="880" x2="96" y2="880" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="887" font-size="20" fill="#475569">Metrics from both fleets, compared cohort to cohort</text>
</svg>