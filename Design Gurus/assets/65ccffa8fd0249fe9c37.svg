  <text x="235" y="301" font-size="15.5" fill="#6B7280">Callers, important jobs, constraints, and scope</text>

  
  <g filter="url(#p3s-soft)">
    <rect x="205" y="356" width="620" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
