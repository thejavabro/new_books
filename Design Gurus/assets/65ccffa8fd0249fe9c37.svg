  <text x="235" y="1151" font-size="15.5" fill="#6B7280">Chosen options, rejected options, and accepted costs</text>

  
  <rect x="40" y="1221" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1266" text-anchor="middle" font-size="16" fill="#475569">Order is a separate skill: it prevents premature commitment and protects the strongest evidence.</text>
