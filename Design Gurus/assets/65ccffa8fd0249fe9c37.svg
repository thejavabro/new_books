<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1337" viewBox="0 0 1240 1337" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six-step method one final time, with the minutes each step receives and the visible output it must produce, from consumers and jobs through resources, operations, one operation in full, the hard parts, and the trade-offs.">
