  <rect x="0" y="0" width="1240" height="1337" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The method, once more</text>
  <rect x="440" y="56" width="76" height="28" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="478" y="76" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Time</text>
  <text x="532" y="77" font-size="15.5" fill="#6B7280">the minutes each step gets</text>
