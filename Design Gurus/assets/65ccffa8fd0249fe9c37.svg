    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="269" y="748" font-size="18.5" font-weight="600" fill="#111827">4. Design one operation completely</text>
