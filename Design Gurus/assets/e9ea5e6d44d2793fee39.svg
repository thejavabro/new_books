<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1134" viewBox="0 0 1240 1134" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated metrics system architecture: agent ingestion through Kafka to a time series database, dashboard read path through an inverted index, stream based alerting, and downsampling">
  <defs>
    <filter id="me-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="me-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="me-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="me-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="me-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="me-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1134" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Metrics and monitoring: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">One million writes a second in, rare reads out, and alerting that never touches the database</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#92400E">1. Ingestion · 100,000 hosts, 1 million data points a second</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#me-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#me-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">202</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#me-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consume</text>
  <g filter="url(#me-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Agent</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">batches for 10s</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metrics Gateway</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">validates only</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="776" y="262" font-size="20" fill="#92400E" text-anchor="middle">partitioned by series</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">TSDB</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">Gorilla, 2 bytes a point</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#92400E">2. Alerting · tap the stream, never poll the database</text>
  <path d="M364,436 L456,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#me-amber)"/>
  <text x="410" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">tap</text>
  <path d="M784,436 L876,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#me-amber)"/>
  <text x="830" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no disk</text>
  <g filter="url(#me-soft)">
    <path d="M40,413 L40,459 A160,15 0 0 0 360,459 L360,413" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="200" cy="413" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="200" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="200" y="504" font-size="20" fill="#92400E" text-anchor="middle">the same stream</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Alert processor</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">5 minute window</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PagerDuty</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">fires in seconds</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Dashboard read · rare, but must answer in under 500ms</text>
  <path d="M264,678 L349,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#me-blue)"/>
  <text x="307" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">query</text>
  <path d="M577,678 L662,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#me-blue)"/>
  <text x="620" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">which?</text>
  <path d="M890,678 L975,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#me-blue)"/>
  <text x="933" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">fetch</text>
  <g filter="url(#me-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,655 L666,701 A110,15 0 0 0 886,701 L886,655" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="655" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M979,655 L979,701 A110,15 0 0 0 1199,701 L1199,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="655" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Engineer</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">env:prod</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Query Service</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">plans the read</text>
  <text x="776" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Inverted index</text>
  <text x="776" y="746" font-size="20" fill="#065F46" text-anchor="middle">tag to series ids</text>
  <text x="1089" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">TSDB blocks</text>
  <text x="1089" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">sequential, not random</text>

  <rect x="24" y="822" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. Making a year of data affordable · downsample and tier it</text>
  <path d="M364,920 L456,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#me-amber)"/>
  <text x="410" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">roll up</text>
  <path d="M784,920 L876,920" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#me-amber)"/>
  <text x="830" y="908" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">tier</text>
  <g filter="url(#me-soft)">
    <path d="M40,897 L40,943 A160,15 0 0 0 360,943 L360,897" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="200" cy="897" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M880,897 L880,943 A160,15 0 0 0 1200,943 L1200,897" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="897" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Raw, 10 second</text>
  <text x="200" y="988" font-size="20" fill="#5B21B6" text-anchor="middle">kept 7 days</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Compactor</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">rolls up hourly</text>
  <text x="1040" y="931" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 Parquet</text>
  <text x="1040" y="988" font-size="20" fill="#5B21B6" text-anchor="middle">cold, 80% cheaper</text>
  <line x1="44" y1="1094" x2="72" y2="1094" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1101" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1094" x2="344.576" y2="1094" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1101" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1085" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1101" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1085" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1101" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1085" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1101" font-size="20" fill="#475569">core service</text>
</svg>