<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two clients read document revision 120 and both submit a change against it. A is applied unchanged as revision 121. B is rebased through A, so its position moves from 18 to 24 and it is applied as revision 122. Presence sits apart because it carries freshness, not correctness.">
  <defs>
    <marker id="p34-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p34-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p34-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="p34-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p34-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="p34-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p34-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p34-k1"><rect x="460" y="100" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k2"><rect x="130" y="250" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k3"><rect x="770" y="250" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k4"><rect x="130" y="400" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k5"><rect x="770" y="400" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k6"><rect x="130" y="560" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k7"><rect x="770" y="560" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k8"><rect x="460" y="740" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="p34-k9"><rect x="470" y="950" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1210" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="840" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Both writers keep their work</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">two clients, one base revision</text>

  
  <g fill="none" stroke-width="2">
    <path d="M530,190 V208 Q530,220 518,220 H212 Q200,220 200,232 V250" stroke="#64748B" marker-end="url(#p34-sl)"/>
    <path d="M710,190 V208 Q710,220 722,220 H1028 Q1040,220 1040,232 V250" stroke="#64748B" marker-end="url(#p34-sl)"/>
    <path d="M200,340 V400" stroke="#2563EB" marker-end="url(#p34-bl)"/>
    <path d="M1040,340 V400" stroke="#7C3AED" marker-end="url(#p34-vi)"/>
    <path d="M200,490 V560" stroke="#059669" marker-end="url(#p34-em)"/>
    <path d="M1040,490 V560" stroke="#059669" marker-end="url(#p34-em)"/>
    <path d="M470,605 H770" stroke="#D97706" stroke-width="2.5" marker-end="url(#p34-am)"/>
    <path d="M200,650 V773 Q200,785 212,785 H460" stroke="#059669" marker-end="url(#p34-em)"/>
    <path d="M1040,650 V773 Q1040,785 1028,785 H780" stroke="#059669" marker-end="url(#p34-em)"/>
