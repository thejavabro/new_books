  </g>
  <circle cx="498" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,134.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
