    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="194" y="302" font-size="18.5" font-weight="600" fill="#111827">Client A reads 120</text>

  
  <g filter="url(#p34-soft)">
    <rect x="770" y="250" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="770" y="250" width="6" height="90" fill="#7C3AED" clip-path="url(#p34-k3)"/>
