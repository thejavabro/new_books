    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="834" y="302" font-size="18.5" font-weight="600" fill="#111827">Client B reads 120</text>

  
  <g filter="url(#p34-soft)">
    <rect x="130" y="400" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="130" y="400" width="6" height="90" fill="#2563EB" clip-path="url(#p34-k4)"/>
  </g>
  <circle cx="168" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,434.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="194" y="452" font-size="18.5" font-weight="600" fill="#111827">insert at position 4</text>
  <text x="300" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">base_revision 120</text>

  
  <g filter="url(#p34-soft)">
    <rect x="770" y="400" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="770" y="400" width="6" height="90" fill="#7C3AED" clip-path="url(#p34-k5)"/>
  </g>
  <circle cx="808" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,434.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="834" y="452" font-size="18.5" font-weight="600" fill="#111827">insert at position 18</text>
  <text x="940" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">base_revision 120</text>

  
  <g filter="url(#p34-soft)">
    <rect x="130" y="560" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="130" y="560" width="6" height="90" fill="#059669" clip-path="url(#p34-k6)"/>
  </g>
  <circle cx="168" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(157.56,594.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="194" y="612" font-size="18.5" font-weight="600" fill="#111827">applied as revision 121</text>
  <text x="300" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">position 4, unchanged</text>

  
  <g filter="url(#p34-soft)">
    <rect x="770" y="560" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="770" y="560" width="6" height="90" fill="#059669" clip-path="url(#p34-k7)"/>
  </g>
  <circle cx="808" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,594.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="834" y="612" font-size="18.5" font-weight="600" fill="#111827">applied as revision 122</text>
  <text x="940" y="675" font-size="15.5" text-anchor="middle" fill="#6B7280">position 18 becomes 24</text>

  
  <g filter="url(#p34-lift)">
    <rect x="460" y="740" width="320" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="460" y="740" width="9" height="90" fill="#4F46E5" clip-path="url(#p34-k8)"/>
  </g>
  <circle cx="498" cy="785" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,774.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="524" y="792" font-size="18.5" font-weight="600" fill="#111827">Document revision 122</text>
  <text x="620" y="855" font-size="15.5" text-anchor="middle" fill="#6B7280">both edits present</text>

  
  <rect x="40" y="900" width="1160" height="190" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="930" font-size="16.5" font-weight="600" fill="#475569">Presence sits apart from the revision flow</text>
  <text x="1176" y="930" text-anchor="end" font-size="15.5" fill="#6B7280">no revision number, no rebase</text>

  <g filter="url(#p34-soft)">
    <rect x="470" y="950" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="950" width="6" height="90" fill="#64748B" clip-path="url(#p34-k9)"/>
  </g>
  <circle cx="508" cy="995" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,984.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="534" y="1002" font-size="18.5" font-weight="600" fill="#111827">Presence</text>
  <text x="620" y="1065" font-size="15.5" text-anchor="middle" fill="#6B7280">freshness only, not correctness</text>

  
  <rect x="40" y="1110" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1155" text-anchor="middle" font-size="16" fill="#475569">Each client applies the returned applied_operations, not the positions it submitted.</text>
</svg>