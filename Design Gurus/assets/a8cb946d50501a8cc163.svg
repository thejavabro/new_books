<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="696" viewBox="0 0 1240 696" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="exceptions-title exceptions-desc">
<title id="exceptions-title">When monolith-first is wrong</title>
<desc id="exceptions-desc">Four cases argue the other way: replacing a system whose boundaries are already known, a component with radically different scaling needs, a component that must be isolated, and teams that already conflict.</desc>
<defs>
<marker id="exceptions-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="exceptions-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="exceptions-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="exceptions-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="696" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">When monolith-first is wrong</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The default is a default rather than a rule, and four situations genuinely argue the other way.</text>
<rect x="40" y="618" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="618" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V270A6 6 0 0 0 46 276H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Replacing a system you understand</text>
<rect x="70" y="172" width="500" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="90" y="209.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The boundaries are not a guess. The existing</text><text x="90" y="234.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">system already taught you where they are.</text>
<rect x="640" y="118" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V270A6 6 0 0 0 646 276H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">One component scales differently</text>
<rect x="670" y="172" width="500" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="690" y="197" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Specialized hardware or transcoding, where the</text><text x="690" y="222" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">alternative is the whole application on</text><text x="690" y="247" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">expensive instances.</text>
<rect x="40" y="300" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 300H46A6 6 0 0 0 40 306V452A6 6 0 0 0 46 458H54Z" fill="#F3CF6A"/><text x="70" y="336" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Isolation is the requirement</text>
<rect x="70" y="354" width="500" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="90" y="379" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A narrower compliance scope, or a failure that</text><text x="90" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">must not reach the rest. The separation is the</text><text x="90" y="429" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">point.</text>
<rect x="640" y="300" width="560" height="158" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 300H646A6 6 0 0 0 640 306V452A6 6 0 0 0 646 458H654Z" fill="#F28B9D"/><text x="670" y="336" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">The teams already conflict</text>
<rect x="670" y="354" width="500" height="88" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="690" y="379" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Separate roadmaps blocking each other in one</text><text x="690" y="404" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">codebase. The organization decided and the</text><text x="690" y="429" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">architecture is lagging.</text>
<rect x="40" y="482" width="1160" height="110" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="482" width="5" height="110" rx="2.5" fill="#AC8BE8"/><text x="64" y="516" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Notice the shape of all four</text><text x="64" y="543" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The information the monolith was supposed to give you is already available,</text><text x="64" y="570" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">or the isolation is itself the requirement.</text>
<text x="66" y="652" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The default is a default rather than a rule, and each exception is specific enough to check.</text>
</svg>