<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Left, before: Dispatch runs its own UPDATE on the orders table, beside the Orders module that owns the table. It skips the check that the status is ready, sent couriers to 4 canceled orders, and Orders cannot change its table alone. Right, after: Dispatch calls the assign_courier command on Orders, and Orders makes a checked write to its table. Every write passes the Orders rules, canceled orders are rejected, and Orders can change its table alone.">
  <defs>
    <filter id="md03c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md03c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md03c-k1"><rect x="64" y="170" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="md03c-k2"><rect x="260" y="330" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="md03c-k3"><rect x="664" y="170" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="md03c-k4"><rect x="860" y="330" width="220" height="90" rx="12"/></clipPath>
    <marker id="md03c-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="md03c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="md03c-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A cross-boundary write and its fix</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">After the fix, only Orders writes the orders table, and it checks its rule first.</text>

  <rect x="40" y="120" width="560" height="730" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Before: Dispatch writes the table</text>
  <rect x="640" y="120" width="560" height="730" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#047857">After: Dispatch calls an Orders command</text>

  <g fill="none" stroke-width="2">
    <path d="M154,260 V550 H270" stroke="#DB2777" stroke-width="2.5" marker-end="url(#md03c-m-pink)"/>
    <path d="M370,420 V484" stroke="#2563EB" marker-end="url(#md03c-m-blue)"/>
    <path d="M754,260 V375 H860" stroke="#059669" stroke-width="2.5" marker-end="url(#md03c-m-emerald)"/>
    <path d="M970,420 V484" stroke="#059669" marker-end="url(#md03c-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="166" y="305" fill="#BE185D" text-anchor="start">UPDATE orders</text>
    <text x="382" y="458" fill="#1D4ED8" text-anchor="start">owner</text>
    <text x="766" y="305" fill="#047857" text-anchor="start">assign_courier()</text>
    <text x="982" y="458" fill="#047857" text-anchor="start">checked write</text>
  </g>

  <g filter="url(#md03c-soft)">
    <rect x="64" y="170" width="180" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="170" width="6" height="90" fill="#D97706" clip-path="url(#md03c-k1)"/>
  </g>
  <circle cx="102" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,204.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="128" y="222" font-size="21.5" font-weight="600" fill="#111827">Dispatch</text>
  <g filter="url(#md03c-soft)">
    <rect x="260" y="330" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="260" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#md03c-k2)"/>
  </g>
  <circle cx="298" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(287.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="324" y="382" font-size="21.5" font-weight="600" fill="#111827">Orders</text>
  <g filter="url(#md03c-soft)">
    <rect x="664" y="170" width="180" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="664" y="170" width="6" height="90" fill="#D97706" clip-path="url(#md03c-k3)"/>
  </g>
  <circle cx="702" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,204.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="728" y="222" font-size="21.5" font-weight="600" fill="#111827">Dispatch</text>
  <g filter="url(#md03c-soft)">
    <rect x="860" y="330" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="860" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#md03c-k4)"/>
  </g>
  <circle cx="898" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="924" y="382" font-size="21.5" font-weight="600" fill="#111827">Orders</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M270,500 L270,584 A100,16 0 0 0 470,584 L470,500" fill="#DBEAFE"/>
    <ellipse cx="370" cy="500" rx="100" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="370" y="544.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">orders</text>
  <text x="370" y="569.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">table</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M870,500 L870,584 A100,16 0 0 0 1070,584 L1070,500" fill="#DBEAFE"/>
    <ellipse cx="970" cy="500" rx="100" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="970" y="544.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">orders</text>
  <text x="970" y="569.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">table</text>
  <rect x="64" y="660" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,671) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="688.5" font-size="18.5" fill="#1F2937">Skips the check that status is ready</text>
  <rect x="64" y="714" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,725) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="742.5" font-size="18.5" fill="#1F2937">Couriers sent to 4 canceled orders</text>
  <rect x="64" y="768" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(78,779) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="114" y="796.5" font-size="18.5" fill="#1F2937">Orders cannot change its table alone</text>
  <rect x="664" y="660" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,671) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="688.5" font-size="18.5" fill="#1F2937">Every write passes the Orders rules</text>
  <rect x="664" y="714" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,725) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="742.5" font-size="18.5" fill="#1F2937">Canceled orders are rejected</text>
  <rect x="664" y="768" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(678,779) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="714" y="796.5" font-size="18.5" fill="#1F2937">Orders can change its table alone</text>




</svg>