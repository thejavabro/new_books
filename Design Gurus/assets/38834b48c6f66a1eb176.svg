<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A saga runs four local transactions in order: create order, reserve stock, charge card, book shipping. When the charge step fails, the saga runs a compensation for each earlier step in reverse order, so the order is cancelled and the stock is released, and the shipping step never runs">
  <defs>
    <marker id="sg1-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="sg1-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="sg1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="sg1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sg1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="sg1-k1"><rect x="72" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k2"><rect x="364" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k3"><rect x="656" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k4"><rect x="948" y="112" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k5"><rect x="72" y="398" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k6"><rect x="364" y="398" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k7"><rect x="656" y="398" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="sg1-k8"><rect x="948" y="398" width="220" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="824" fill="#FFFFFF"/>

  
  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">Forward path: each step commits in its own service, then publishes an event</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#B45309">When a step fails, the saga runs each earlier step's compensation in reverse order</text>

  
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M292,157 L360,157" marker-end="url(#sg1-em)"/>
    <path d="M584,157 L652,157" marker-end="url(#sg1-em)"/>
    <path d="M876,157 L944,157" marker-end="url(#sg1-em)"/>
  </g>

  
  <g fill="none" stroke="#DB2777" stroke-width="2.5">
    <path d="M766,296 L766,394" marker-end="url(#sg1-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="766" y="350" fill="#BE185D">card declined</text>
  </g>

  
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M652,443 L588,443" marker-end="url(#sg1-am)"/>
    <path d="M360,443 L296,443" marker-end="url(#sg1-am)"/>
  </g>

  
  <g filter="url(#sg1-soft)">
    <rect x="72" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#059669" clip-path="url(#sg1-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Create Order</text>
  <text x="182" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">order service</text>
  <text x="182" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">status = PENDING</text>

  <g filter="url(#sg1-soft)">
    <rect x="364" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="364" y="112" width="6" height="90" fill="#059669" clip-path="url(#sg1-k2)"/>
  </g>
  <circle cx="402" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="428" y="164" font-size="18.5" font-weight="600" fill="#111827">Reserve Stock</text>
  <text x="474" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">inventory service</text>
  <text x="474" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">hold one unit</text>

  <g filter="url(#sg1-lift)">
    <rect x="656" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="656" y="112" width="9" height="90" fill="#059669" clip-path="url(#sg1-k3)"/>
  </g>
  <circle cx="694" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="5" width="20" height="14" rx="2"/>
    <path d="M2 10h20"/>
  </g>
  <text x="720" y="164" font-size="18.5" font-weight="600" fill="#111827">Charge Card</text>
  <text x="766" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">payment service</text>
  <text x="766" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">this step fails</text>

  <g filter="url(#sg1-soft)">
    <rect x="948" y="112" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="948" y="112" width="6" height="90" fill="#059669" clip-path="url(#sg1-k4)"/>
  </g>
  <circle cx="986" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(975.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1.5" y="6" width="13" height="10" rx="1.5"/>
    <path d="M14.5 9.5h4l3 3.5v3h-7z"/>
    <circle cx="6" cy="18" r="1.8"/>
    <circle cx="17" cy="18" r="1.8"/>
  </g>
  <text x="1012" y="164" font-size="18.5" font-weight="600" fill="#111827">Book Shipping</text>
  <text x="1058" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">shipping service</text>
  <text x="1058" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">never starts</text>

  
  <g filter="url(#sg1-soft)">
    <rect x="72" y="398" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="398" width="6" height="90" fill="#D97706" clip-path="url(#sg1-k5)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10h11a5 5 0 0 1 0 10h-6"/>
    <path d="M6.5 6.5L3 10l3.5 3.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Cancel Order</text>
  <text x="182" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">order service</text>
  <text x="182" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">status = CANCELLED</text>

  <g filter="url(#sg1-soft)">
    <rect x="364" y="398" width="220" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="364" y="398" width="6" height="90" fill="#D97706" clip-path="url(#sg1-k6)"/>
  </g>
  <circle cx="402" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(391.56,432.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 10h11a5 5 0 0 1 0 10h-6"/>
    <path d="M6.5 6.5L3 10l3.5 3.5"/>
  </g>
  <text x="428" y="450" font-size="18.5" font-weight="600" fill="#111827">Release Stock</text>
  <text x="474" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">inventory service</text>
  <text x="474" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">put the unit back</text>

  <g filter="url(#sg1-lift)">
    <rect x="656" y="398" width="220" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="656" y="398" width="9" height="90" fill="#DB2777" clip-path="url(#sg1-k7)"/>
  </g>
  <circle cx="694" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,432.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="720" y="450" font-size="18.5" font-weight="600" fill="#111827">Payment Fails</text>
  <text x="766" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">nothing to undo here</text>
  <text x="766" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">the step never committed</text>

  <g filter="url(#sg1-soft)">
    <rect x="948" y="398" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="948" y="398" width="6" height="90" fill="#64748B" clip-path="url(#sg1-k8)"/>
  </g>
  <circle cx="986" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(975.56,432.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12h8"/>
  </g>
  <text x="1012" y="450" font-size="18.5" font-weight="600" fill="#111827">Not Reached</text>
  <text x="1058" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">shipping service</text>
  <text x="1058" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">no shipment created</text>

  
  <rect x="40" y="612" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Local transaction</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">commits in one service against one database, then publishes an event that starts the next step</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Compensation</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">a normal write that reverses the effect of one committed step, not a database rollback</text>

  <rect x="64" y="724" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="746" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Failed step</text>
  <text x="288" y="746" font-size="15.5" fill="#475569">the step that broke a business rule, so the saga stops moving forward and starts undoing</text>
</svg>