<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="616" viewBox="0 0 1240 616" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Write-ahead logging writes the log record and fsyncs it to disk before the transaction is committed and long before the data pages are updated, and this ordering is what makes crash recovery possible">
  <rect x="0" y="0" width="1240" height="616" fill="#FFFFFF"/>
  <defs>
    <marker id="db3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="db3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Moving $100 from account A to account B, in the order WAL requires</text>

  <line x1="304" y1="195" x2="334" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#db3-slate)"/>
  <line x1="594" y1="195" x2="624" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#db3-slate)"/>
  <line x1="884" y1="195" x2="914" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#db3-slate)"/>

  <g filter="url(#db3-soft)">
    <rect x="50" y="110" width="250" height="170" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="340" y="110" width="250" height="170" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
    <rect x="630" y="110" width="250" height="170" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="920" y="110" width="250" height="170" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <circle cx="175" cy="145" r="20" fill="#3B82F6"/>
  <text x="175" y="152" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="175" y="192" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Write the log record</text>
  <text x="175" y="224" font-size="20" fill="#1E40AF" text-anchor="middle">A: -$100, B: +$100</text>
  <text x="175" y="250" font-size="20" fill="#1E40AF" text-anchor="middle">appended to the WAL</text>

  <circle cx="465" cy="145" r="20" fill="#059669"/>
  <text x="465" y="152" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="465" y="192" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">fsync the log</text>
  <text x="465" y="224" font-size="20" fill="#065F46" text-anchor="middle">the record is now on</text>
  <text x="465" y="250" font-size="20" fill="#065F46" text-anchor="middle">durable storage</text>

  <circle cx="755" cy="145" r="20" fill="#3B82F6"/>
  <text x="755" y="152" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="755" y="192" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Only now, commit</text>
  <text x="755" y="224" font-size="20" fill="#1E40AF" text-anchor="middle">the client is told the</text>
  <text x="755" y="250" font-size="20" fill="#1E40AF" text-anchor="middle">transfer succeeded</text>

  <circle cx="1045" cy="145" r="20" fill="#D97706"/>
  <text x="1045" y="152" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="1045" y="192" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Update the data pages</text>
  <text x="1045" y="224" font-size="20" fill="#92400E" text-anchor="middle">much later, at the</text>
  <text x="1045" y="250" font-size="20" fill="#92400E" text-anchor="middle">next checkpoint</text>

  <line x1="465" y1="284" x2="465" y2="302" stroke="#059669" stroke-width="2.5"/>
  <text x="465" y="328" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the transaction is durable from this point</text>

  
  <rect x="50" y="356" width="560" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="394" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Log first, then the data page</text>
  <text x="330" y="428" font-size="20" fill="#065F46" text-anchor="middle">A crash is always repairable.</text>
  <text x="330" y="460" font-size="20" fill="#065F46" text-anchor="middle">Replay the log from the last checkpoint.</text>

  <rect x="630" y="356" width="560" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="910" y="394" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Data page first, then the log</text>
  <text x="910" y="428" font-size="20" fill="#B91C1C" text-anchor="middle">A crash can leave a half written page</text>
  <text x="910" y="460" font-size="20" fill="#B91C1C" text-anchor="middle">with no record of what it should hold.</text>

  
  <rect x="50" y="516" width="1140" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="556" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">WAL does not make writes faster. It makes the order of writes a promise that recovery can rely on.</text>
</svg>