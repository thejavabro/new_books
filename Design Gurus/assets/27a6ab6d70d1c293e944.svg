<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="prereq-title prereq-desc">
<title id="prereq-title">Three things that exist before step one</title>
<desc id="prereq-desc">A comparison mechanism, a separate flag for each switchable step, and a resumable re-runnable backfill. Building them is part of the work rather than preparation for it.</desc>
<defs>
<marker id="prereq-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="prereq-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="prereq-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="prereq-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="738" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Three things that exist before step one</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Building them is part of the work rather than preparation for it.</text>
<rect x="40" y="660" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="660" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three pieces of machinery need to exist first</text>
<circle cx="60" cy="201" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="208" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="168" width="428" height="66" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="207" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A comparison mechanism</text>
<path d="M526 201H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 201H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#prereq-marker-slate)"/>
<rect x="570" y="168" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="194.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reads both representations and reports</text><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">agreement as a count over time</text>
<circle cx="60" cy="279" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="286" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="246" width="428" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A flag per switchable step</text>
<path d="M526 279H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 279H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#prereq-marker-slate)"/>
<rect x="570" y="246" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dual writing, read source and turning off the old</text><text x="590" y="297.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">write are three separate controls</text>
<circle cx="60" cy="357" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="364" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="324" width="428" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="363" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A resumable backfill</text>
<path d="M526 357H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 357H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#prereq-marker-slate)"/>
<rect x="570" y="324" width="630" height="66" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">key-range cursor, durable position,</text><text x="590" y="375.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">derived transformation, guarded write</text>
<rect x="40" y="434" width="1160" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="64" y="469.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">If any of the three is missing, the migration can still be performed</text><text x="64" y="498.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">and it cannot be performed safely.</text>
<rect x="40" y="546" width="1160" height="88" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="546" width="5" height="88" rx="2.5" fill="#AC8BE8"/><text x="64" y="581.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The difference between the two is entirely in</text><text x="64" y="610.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">what you can observe and what you can undo.</text>
<text x="66" y="694" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A plan that starts with a schema change has started in the wrong place.</text>
</svg>