  <text x="556" y="532" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1F2937" xml:space="preserve">OrderRepository):</text>
  <text x="523" y="556" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1F2937" xml:space="preserve"><tspan fill="#2563EB">def</tspan> find_by_id(self, order_id):</text>
