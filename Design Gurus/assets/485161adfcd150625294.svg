  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="674" y="386" text-anchor="start" fill="#475569">implements</text>
    <text x="410" y="553" fill="#475569">Map to</text>
    <text x="410" y="577" fill="#475569">domain</text>
    <text x="410" y="601" fill="#475569">model</text>
    <text x="910" y="577" fill="#475569">Map to</text>
    <text x="910" y="601" fill="#475569">DB model</text>
