<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three columns: the domain model, an Order class with an order id, a customer id, line items, a total and a status and the methods confirm and cancel, a rich domain object with business rules and behavior; the OrderRepository interface with find_by_id and save, implemented by PostgresOrderRepository, which maps the database model to the domain model and the domain model to the database model; and the database model, an orders table with the total amount and its currency and an order_items table">
  <defs>
    <filter id="m11j-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11j-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11j-k1"><rect x="56" y="590" width="288" height="112" rx="12"/></clipPath>
    <marker id="m11j-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m11j-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Repository pattern: domain model vs. database model</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The repository implementation maps between the rich domain object and the database tables.</text>

  <rect x="40" y="120" width="320" height="604" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#4338CA">Domain model</text>
  <rect x="460" y="120" width="400" height="234" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="484" y="150" font-size="19.5" font-weight="600" fill="#B45309">OrderRepository</text>
  <rect x="460" y="404" width="400" height="304" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="484" y="434" font-size="19.5" font-weight="600" fill="#047857">PostgresOrderRepository</text>
  <rect x="960" y="120" width="240" height="604" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="984" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Database model</text>

