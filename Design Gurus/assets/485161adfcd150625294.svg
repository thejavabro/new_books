  <text x="76" y="630.5" font-size="18.5" font-weight="600" fill="#111827">Rich domain object</text>
  <text x="76" y="653" font-size="18.5" font-weight="600" fill="#111827">with business rules</text>
  <text x="76" y="675.5" font-size="18.5" font-weight="600" fill="#111827">and behavior</text>
