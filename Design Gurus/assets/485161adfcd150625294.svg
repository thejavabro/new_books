  <rect x="476" y="194" width="368" height="142" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="490" y="224" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1F2937" xml:space="preserve"><tspan fill="#2563EB">class</tspan> OrderRepository(ABC):</text>
  <text x="523" y="248" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="15" fill="#1F2937" xml:space="preserve"><tspan fill="#7C3AED">@abstractmethod</tspan></text>
