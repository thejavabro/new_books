<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="618" viewBox="0 0 1240 618" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three states of a circuit breaker. Closed lets calls through and counts failures. Too many failures moves it to open, where calls fail immediately. After the reset timeout it moves to half-open and lets a few trial calls through. If a trial call succeeds it closes again, and if a trial call fails it opens again">
  <defs>
    <marker id="cb2-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="cb2-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="cb2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="cb2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cb2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cb2-k1"><rect x="72" y="170" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="cb2-k2"><rect x="490" y="170" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="cb2-k3"><rect x="908" y="170" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="618" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="330" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">The breaker moves between three states, and only one of them lets every call through</text>

  
  <g fill="none" stroke="#DB2777" stroke-width="2.5">
    <path d="M332,215 L486,215" marker-end="url(#cb2-pk)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2.5">
    <path d="M750,215 L904,215" marker-end="url(#cb2-am)"/>
  </g>

  
  <g fill="none" stroke="#059669" stroke-width="2.5">
    <path d="M1038,170 L1038,132 Q1038,120 1026,120 L214,120 Q202,120 202,132 L202,166" marker-end="url(#cb2-em)"/>
  </g>

  
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M1038,260 L1038,298 Q1038,310 1026,310 L632,310 Q620,310 620,298 L620,264" marker-end="url(#cb2-pk)"/>
  </g>

  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="409" y="208" fill="#BE185D">too many failures</text>
    <text x="827" y="208" fill="#B45309">reset timeout</text>
    <text x="620" y="113" fill="#047857">a trial call succeeds</text>
    <text x="829" y="303" fill="#BE185D">a trial call fails</text>
  </g>

  
  <g filter="url(#cb2-soft)">
    <rect x="72" y="170" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="170" width="6" height="90" fill="#059669" clip-path="url(#cb2-k1)"/>
  </g>
  <circle cx="110" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,204.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="136" y="222" font-size="18.5" font-weight="600" fill="#111827">Closed</text>

  
  <g filter="url(#cb2-soft)">
    <rect x="490" y="170" width="260" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="490" y="170" width="6" height="90" fill="#DB2777" clip-path="url(#cb2-k2)"/>
  </g>
  <circle cx="528" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(517.56,204.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="554" y="222" font-size="18.5" font-weight="600" fill="#111827">Open</text>

  
  <g filter="url(#cb2-lift)">
    <rect x="908" y="170" width="260" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="908" y="170" width="9" height="90" fill="#D97706" clip-path="url(#cb2-k3)"/>
  </g>
  <circle cx="946" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(935.56,204.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="972" y="222" font-size="18.5" font-weight="600" fill="#111827">Half-Open</text>

  
  <rect x="40" y="406" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="430" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Closed</text>
  <text x="288" y="452" font-size="15.5" fill="#475569">every call goes through to the service, and the breaker counts how many of them fail</text>

  <rect x="64" y="474" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="496" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Open</text>
  <text x="288" y="496" font-size="15.5" fill="#475569">calls fail at once without touching the service, which is what frees the caller's threads</text>

  <rect x="64" y="518" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="540" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Half-Open</text>
  <text x="288" y="540" font-size="15.5" fill="#475569">a small number of trial calls are let through to test recovery, and the rest still fail at once</text>
</svg>