<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The stub resolver on the device sends a recursive query to the recursive resolver. The resolver sends iterative queries to a root server, which refers it to the .com servers, to a TLD server, which refers it to the example.com name servers, and to an authoritative server, which returns the IP address.">
  <defs>
    <filter id="dr1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="dr1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="dr1-k1"><rect x="40" y="360" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="dr1-k2"><rect x="400" y="360" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="dr1-k3"><rect x="880" y="140" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="dr1-k4"><rect x="880" y="360" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="dr1-k5"><rect x="880" y="580" width="320" height="90" rx="12"/></clipPath>
    <marker id="dr1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="dr1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="dr1-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dr1-s-violet" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#7C3AED"/></marker>
    <marker id="dr1-s-emerald" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Recursive and iterative queries in one lookup</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The device asks once for the full answer. The resolver then asks each server in turn.</text>



  <g fill="none" stroke-width="2">
    <path d="M280,405 H400" stroke="#2563EB" stroke-width="2.5" marker-end="url(#dr1-m-blue)"/>
    <path d="M680,380 H760 Q775,380 775,365 V200 Q775,185 790,185 H880" stroke="#7C3AED" marker-end="url(#dr1-m-violet)" marker-start="url(#dr1-s-violet)"/>
    <path d="M680,405 H880" stroke="#7C3AED" marker-end="url(#dr1-m-violet)" marker-start="url(#dr1-s-violet)"/>
    <path d="M680,430 H760 Q775,430 775,445 V610 Q775,625 790,625 H880" stroke="#059669" marker-end="url(#dr1-m-emerald)" marker-start="url(#dr1-s-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="340" y="393" fill="#1D4ED8">recursive</text>
    <text x="830" y="393" fill="#5B21B6">iterative</text>
  </g>

  <g filter="url(#dr1-soft)">
    <rect x="40" y="360" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="360" width="6" height="90" fill="#64748B" clip-path="url(#dr1-k1)"/>
  </g>
  <circle cx="78" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,394.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="412" font-size="21.5" font-weight="600" fill="#111827">Stub resolver</text>
  <text x="160" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">on your device</text>
  <g filter="url(#dr1-lift)">
    <rect x="400" y="360" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="400" y="360" width="9" height="90" fill="#2563EB" clip-path="url(#dr1-k2)"/>
  </g>
  <circle cx="438" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="464" y="412" font-size="21.5" font-weight="600" fill="#111827">Recursive resolver</text>
  <text x="540" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">finds the full answer</text>
  <g filter="url(#dr1-soft)">
    <rect x="880" y="140" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="880" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#dr1-k3)"/>
  </g>
  <circle cx="918" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="944" y="192" font-size="21.5" font-weight="600" fill="#111827">Root server</text>
  <text x="1040" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">referral: ask .com servers</text>
  <g filter="url(#dr1-soft)">
    <rect x="880" y="360" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="880" y="360" width="6" height="90" fill="#7C3AED" clip-path="url(#dr1-k4)"/>
  </g>
  <circle cx="918" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,394.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="944" y="412" font-size="21.5" font-weight="600" fill="#111827">.com TLD server</text>
  <text x="1040" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">referral: ask example.com servers</text>
  <g filter="url(#dr1-soft)">
    <rect x="880" y="580" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="580" width="6" height="90" fill="#059669" clip-path="url(#dr1-k5)"/>
  </g>
  <circle cx="918" cy="625" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,614.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="944" y="632" font-size="21.5" font-weight="600" fill="#111827">Authoritative server</text>
  <text x="1040" y="699" font-size="18.5" text-anchor="middle" fill="#6B7280">answer: 203.0.113.10</text>

  <rect x="40" y="740" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Recursive</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">the client asks for the full answer, and the resolver does the lookups</text>
  <rect x="64" y="815" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="840" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Iterative</text>
  <text x="323" y="840" font-size="18.5" fill="#475569">each server returns what it knows, often a referral to the next server</text>
</svg>