<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The ropes before any join">
<defs>
<filter id="cr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Join [1, 3, 11, 5] into one rope as cheaply as possible</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Joining two ropes costs the sum of their lengths, and the joined rope can be joined again</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">All ropes in the heap, shortest on top</text>
<text x="362" y="225" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">ropes</text>
<rect x="386" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="482" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="524" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<rect x="578" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">11</text>
<rect x="674" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="716" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">5</text>
<text x="362" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="386" y="316" width="84" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="428" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="428" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">top</text>
<rect x="482" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="524" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="578" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="674" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="716" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Always join the two shortest ropes available</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">A rope joined early is carried into every later join, so short ones must go first</text>
</svg>