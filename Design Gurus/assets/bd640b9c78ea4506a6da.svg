<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="688" viewBox="0 0 1240 688" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="coalesce-title coalesce-desc">
<title id="coalesce-title">Request coalescing</title>
<desc id="coalesce-desc">Without coalescing, two thousand concurrent misses become two thousand backend queries. With it, one request acquires a lock and recomputes while the rest wait and then read the stored result, which turns a load problem into a latency problem.</desc>
<defs>
<marker id="coalesce-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="coalesce-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="coalesce-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="coalesce-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="688" fill="#FFFFFF"/>
