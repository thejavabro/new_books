<rect x="690" y="272" width="100" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="690" y="272" width="100.0" height="24" rx="10" fill="#159BEF"/>
<rect x="690" y="302" width="100" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="690" y="302" width="100.0" height="24" rx="10" fill="#159BEF"/>
<rect x="690" y="332" width="100" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="690" y="332" width="100.0" height="24" rx="10" fill="#159BEF"/>
<rect x="690" y="362" width="100" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="690" y="362" width="100.0" height="24" rx="10" fill="#159BEF"/>
<path d="M796 194H826" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M796 194H826" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coalesce-marker-green)"/>
<rect x="832" y="174" width="170" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="917" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">wins the lock</text>
<path d="M1008 194H1099V244" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1008 194H1099V244" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coalesce-marker-green)"/>
<rect x="1024" y="250" width="150" height="84" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1099" y="284.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backend</text><text x="1099" y="311.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">1 query</text>
<path d="M792 224H802V374H792" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M802 292H826" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M802 292H826" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#coalesce-marker-slate)"/>
<rect x="832" y="250" width="170" height="84" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="917" y="284.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the rest</text><text x="917" y="311.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">wait</text>
<text x="920" y="410" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">one recomputation, 1,999 waiters</text>
<rect x="40" y="446" width="1160" height="138" rx="14" fill="#F4F7FA" stroke="#D5E3EF" stroke-opacity="1" stroke-width="1.6"/><text x="620" y="482" font-size="23" font-weight="700" fill="#6040A8" text-anchor="middle">Coalescing converts a load problem into a latency problem</text>
<rect x="70" y="502" width="540" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="340" y="525.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">If the winner takes 3 seconds,</text><text x="340" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">all 1,999 waiters take 3 seconds</text>
<rect x="630" y="502" width="540" height="62" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="900" y="525.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">So: a timeout on the wait, and a</text><text x="900" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">decided answer for a timed-out waiter</text>
<text x="66" y="644" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A per-process lock divides the pile-up by your instance count. A lock in the cache reduces it to one.</text>
</svg>