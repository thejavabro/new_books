<rect x="640" y="118" width="560" height="306" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V418A6 6 0 0 0 646 424H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">With coalescing</text>
<rect x="690" y="182" width="100" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="690" y="182" width="100.0" height="24" rx="10" fill="#06AC80"/>
