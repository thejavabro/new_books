<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shardkey-title shardkey-desc">
<title id="shardkey-title">Scoring a shard key</title>
<desc id="shardkey-desc">Three candidate shard keys scored against cardinality, distribution and query alignment. Country fails on cardinality and distribution. User id passes cardinality but needs the query patterns checked. Tenant id usually passes all three in multi-tenant software.</desc>
<defs>
<marker id="shardkey-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shardkey-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shardkey-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shardkey-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="662" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Scoring a shard key</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Evaluate a candidate key against three properties, in this order.</text>
<rect x="40" y="584" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="584" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="475" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">High cardinality</text>
<text x="475" y="168" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">enough distinct values to</text><text x="475" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">spread the data</text>
<text x="765" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">Uniform distribution</text>
<text x="765" y="168" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">no key owns a</text><text x="765" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">disproportionate share</text>
<text x="1055" y="142" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">Query alignment</text>
<text x="1055" y="168" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">most queries touch exactly</text><text x="1055" y="192" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one shard</text>
<rect x="40" y="214" width="276" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="214" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="243" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">country</text><text x="64" y="269" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">40% in one country</text>
<rect x="344" y="226" width="262" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="475" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no</text>
<rect x="634" y="226" width="262" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="765" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no</text>
<rect x="924" y="226" width="262" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1055" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe</text>
<rect x="40" y="298" width="276" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="298" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="327" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">user_id</text><text x="64" y="353" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the usual first answer</text>
<rect x="344" y="310" width="262" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="475" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">yes</text>
<rect x="634" y="310" width="262" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="765" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe</text>
<rect x="924" y="310" width="262" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1055" y="340" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe</text>
<rect x="40" y="382" width="276" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="382" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="411" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">tenant_id</text><text x="64" y="437" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">multi-tenant software</text>
<rect x="344" y="394" width="262" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="475" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">yes</text>
<rect x="634" y="394" width="262" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="765" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">maybe</text>
<rect x="924" y="394" width="262" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1055" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">yes</text>
<rect x="40" y="478" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="478" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="511" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Evaluate in this order, and stop at the first "no".</text><text x="64" y="537" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A key that passes the first two and fails the third gives you a correct system that is permanently slow.</text>
<text x="66" y="618" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Write down your twenty most frequent queries and check each one against the key before committing.</text>
</svg>