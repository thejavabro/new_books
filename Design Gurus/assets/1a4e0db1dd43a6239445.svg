<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="802" viewBox="0 0 1240 802" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="law-title law-desc">
<title id="law-title">What the law actually requires</title>
<desc id="law-desc">Transfers outside the European Economic Area are permitted with safeguards rather than prohibited. Transfer restriction is legal work; hard localization is an architectural requirement, and they are often confused.</desc>
<defs>
<marker id="law-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="law-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="law-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="law-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="802" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the law actually requires</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Transfers are permitted with safeguards rather than prohibited.</text>
<rect x="40" y="724" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="724" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="155" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The GDPR does not require personal data to stay in the European Union.</text>
<rect x="40" y="194" width="1160" height="76" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="194" width="5" height="76" rx="2.5" fill="#5EC9EC"/><text x="64" y="225" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">It restricts transfers outside the European Economic Area unless an approved mechanism exists:</text><text x="64" y="251" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">an adequacy decision, standard contractual clauses, binding corporate rules, and others</text>
<text x="40" y="314" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And the engineering consequence is large</text>
<rect x="40" y="332" width="560" height="204" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 332H46A6 6 0 0 0 40 338V530A6 6 0 0 0 46 536H54Z" fill="#39D5AA"/><text x="70" y="368" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Transfer-restricted</text>
<rect x="72" y="392" width="496" height="124" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="422.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Host where you like, given the legal</text><text x="92" y="447.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">mechanism. The work is legal work,</text><text x="92" y="472.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">not architecture. A region topology</text><text x="92" y="497.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">solves nothing.</text>
<rect x="640" y="332" width="560" height="204" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 332H646A6 6 0 0 0 640 338V530A6 6 0 0 0 646 536H654Z" fill="#F28B9D"/><text x="670" y="368" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Hard localization</text>
<rect x="672" y="392" width="496" height="124" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="422.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The data must physically remain in</text><text x="692" y="447.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the country. An architectural</text><text x="692" y="472.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">requirement, and it forces</text><text x="692" y="497.5" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">per-region partitioning.</text>
<rect x="40" y="560" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="560" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="597" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Establish which one you are actually subject to before designing for the stricter one.</text>
<rect x="40" y="636" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="636" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="673" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">"The data must stay in Europe" deserves one follow-up question.</text>
<text x="66" y="758" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The answer changes the architecture and the cost by a large factor.</text>
</svg>