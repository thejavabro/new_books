<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="lagdef-title lagdef-desc">
<title id="lagdef-title">What consumer lag measures</title>
<desc id="lagdef-desc">Lag is the gap between a partition log end offset and the group committed offset, measured per partition. A summed figure cannot distinguish every partition running slightly behind from one partition being completely stuck.</desc>
<defs>
<marker id="lagdef-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="lagdef-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="lagdef-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="lagdef-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What consumer lag measures</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Consumer lag is the most watched number in a Kafka deployment and the most misread.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="151" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Lag = log end offset minus committed offset</text><text x="64" y="177" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per partition, per consumer group</text>
<text x="40" y="240" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The same summed number, two completely different incidents</text>
<rect x="40" y="258" width="560" height="214" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 258H46A6 6 0 0 0 40 264V466A6 6 0 0 0 46 472H54Z" fill="#39D5AA"/><text x="320" y="294" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">Every partition slightly behind</text>
<rect x="96.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="142.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="188.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="234.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="280.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="326.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="372.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="418.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="464.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<rect x="510.0" y="404.0" width="34" height="20" rx="5" fill="#06AC80"/>
<path d="M80 424H560" stroke="#284E65" stroke-width="3" stroke-linecap="round"/>
<text x="320" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">healthy, keeping up</text>
<rect x="640" y="258" width="560" height="214" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 258H646A6 6 0 0 0 640 264V466A6 6 0 0 0 646 472H654Z" fill="#F28B9D"/><text x="920" y="294" font-size="23" font-weight="700" fill="#A83147" text-anchor="middle">One partition stuck</text>
<rect x="696.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="742.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="788.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="834.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="880.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="926.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="972.0" y="314.0" width="34" height="110" rx="5" fill="#F25461"/>
<rect x="1018.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="1064.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<rect x="1110.0" y="414.0" width="34" height="10" rx="5" fill="#06AC80"/>
<path d="M680 424H1160" stroke="#284E65" stroke-width="3" stroke-linecap="round"/>
<text x="920" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one consumer wedged, the rest barely moving</text>
<rect x="40" y="490" width="1160" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="521" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Both charts sum to the same total lag</text>
<text x="40" y="582" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two more things the number does not say</text>
<rect x="40" y="600" width="560" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="627.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It counts committed offsets,</text><text x="320" y="654.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">not processed records</text>
<rect x="640" y="600" width="560" height="70" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="920" y="627.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Non-zero lag is normal. The signal is</text><text x="920" y="654.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the direction it moves, not the value</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Flat lag is a healthy consumer with a backlog. Climbing lag is a consumer that is losing.</text>
</svg>