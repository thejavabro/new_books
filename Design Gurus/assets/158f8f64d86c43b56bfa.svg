<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Capacity estimation for a unique ID generator: 100,000 requests a second, 64 or 128 bit IDs, and nothing persisted; giving 8.6 billion IDs a day, about 5 MB a second of network, and near zero storage">
  <defs>
    <filter id="uies-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uies-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uies-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uies-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uies-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uies-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uies-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="uies-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Unique ID generator: capacity estimation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The unusual one: the load is enormous and the storage is almost nothing, because IDs are never kept.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What we assume</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What follows from it</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uies-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#uies-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">100k a second</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">as a baseline, with peaks</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">of 200 to 300k</text>
  <g filter="url(#uies-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#uies-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">64 or 128 bits</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">8 bytes ordered, or</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">16 bytes opaque</text>
  <g filter="url(#uies-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#uies-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">Nothing is stored</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">an ID is computed and</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">returned, never logged</text>
  <g filter="url(#uies-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#uies-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">8.6 billion a day</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">and trillions over the</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">course of a year</text>
  <g filter="url(#uies-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#uies-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">5 MB a second out</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">about 50 bytes per</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">response including overhead</text>
  <g filter="url(#uies-lift)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="820" y="430" width="9" height="90" fill="#DB2777" clip-path="url(#uies-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">Storage near zero</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a few counters, not a</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">row per ID</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Write only</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">there is no read path at all, which removes most of the consistency questions other systems face</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">64 bits</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">about 9.2 x 10^18 values, which is plenty even at 10 billion IDs a day for a decade</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Trade</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">compute is spent to avoid storage, which is a good trade because generating an ID is very cheap</text>
</svg>