      <path d="M0,0 L8,4 L0,8 Z" fill="#047857"/>
    </marker>
    <marker id="c7mft-m7C3AED" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c7mft-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c7mft-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c7mft-k1"><rect x="440" y="136" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="c7mft-k2"><rect x="470" y="406" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c7mft-k3"><rect x="100" y="666" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c7mft-k4"><rect x="470" y="666" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="c7mft-k5"><rect x="840" y="666" width="300" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="937" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Inside each model call</text>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M620,406 V263" marker-end="url(#c7mft-m2563EB)"/></g>
  <g fill="none" stroke="#4F46E5" stroke-width="2"><path d="M500,534 V544 Q500,556 488,556 H250 Q238,556 238,568 V666" marker-end="url(#c7mft-m4F46E5)"/></g>
  <g fill="none" stroke="#4F46E5" stroke-width="2"><path d="M262,666 V592 Q262,580 274,580 H512 Q524,580 524,568 V534" marker-end="url(#c7mft-m4F46E5)"/></g>
  <g fill="none" stroke="#047857" stroke-width="2"><path d="M608,534 V666" marker-end="url(#c7mft-m047857)"/></g>
  <g fill="none" stroke="#047857" stroke-width="2"><path d="M632,666 V534" marker-end="url(#c7mft-m047857)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M716,534 V568 Q716,580 728,580 H966 Q978,580 978,592 V666" marker-end="url(#c7mft-m7C3AED)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1002,666 V568 Q1002,556 990,556 H752 Q740,556 740,544 V534" marker-end="url(#c7mft-m7C3AED)"/></g>
  <text x="440" y="124" font-size="15.5" font-weight="600" fill="#6B7280">lasts one model call</text>
  <g filter="url(#c7mft-lift)">
    <rect x="440" y="136" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="440" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c7mft-k1)"/>
  </g>
  <circle cx="478" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="504" y="188" font-size="18.5" font-weight="600" fill="#111827">Context window</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">current plan, recent tool results, a short summary of older steps</text>
  <g filter="url(#c7mft-soft)">
    <rect x="470" y="406" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="406" width="6" height="90" fill="#64748B" clip-path="url(#c7mft-k2)"/>
  </g>
  <circle cx="508" cy="451" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,440.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="534" y="458" font-size="18.5" font-weight="600" fill="#111827">Runtime</text>
  <text x="620" y="521" font-size="15.5" text-anchor="middle" fill="#6B7280">builds every call and runs every tool</text>
  <text x="100" y="654" font-size="15.5" font-weight="600" fill="#6B7280">lasts one task</text>
  <g filter="url(#c7mft-soft)">
    <rect x="100" y="666" width="300" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="100" y="666" width="6" height="90" fill="#4F46E5" clip-path="url(#c7mft-k3)"/>
  </g>
  <circle cx="138" cy="711" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,700.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="164" y="718" font-size="18.5" font-weight="600" fill="#111827">Scratchpad</text>
  <text x="250" y="781" font-size="15.5" text-anchor="middle" fill="#6B7280">notes and files for this task</text>
  <text x="470" y="654" font-size="15.5" font-weight="600" fill="#6B7280">survives crashes</text>
  <g filter="url(#c7mft-soft)">
    <rect x="470" y="666" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="470" y="666" width="6" height="90" fill="#059669" clip-path="url(#c7mft-k4)"/>
  </g>
  <circle cx="508" cy="711" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,700.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="534" y="718" font-size="18.5" font-weight="600" fill="#111827">Durable task state</text>
  <text x="620" y="781" font-size="15.5" text-anchor="middle" fill="#6B7280">each step's status, key, and outcome</text>
  <text x="840" y="654" font-size="15.5" font-weight="600" fill="#6B7280">lasts many tasks</text>
  <g filter="url(#c7mft-soft)">
    <rect x="840" y="666" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="666" width="6" height="90" fill="#7C3AED" clip-path="url(#c7mft-k5)"/>
  </g>
  <circle cx="878" cy="711" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,700.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="904" y="718" font-size="18.5" font-weight="600" fill="#111827">Long-term memory</text>
  <text x="990" y="781" font-size="15.5" text-anchor="middle" fill="#6B7280">preferences, environment facts, past outcomes</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="634" y="352" fill="#1D4ED8">only what this step needs</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="228" y="618" fill="#4338CA">save</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="272" y="618" fill="#4338CA">pull when needed</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="598" y="618" fill="#047857">record each step</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="642" y="618" fill="#047857">resume after a crash</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="968" y="618" fill="#5B21B6">governed write</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1012" y="618" fill="#5B21B6">retrieve at task start</text></g>
  <rect x="40" y="821" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="866" text-anchor="middle" font-size="16" fill="#475569">Only the context window is inside the model call. Every other tier is reached through the runtime.</text>
</svg>