<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="937" viewBox="0 0 1240 937" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four memory tiers: the context window inside each model call, and the scratchpad, durable task state, and long-term memory outside it, each reached through the runtime">
