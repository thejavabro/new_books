<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="apikey-title apikey-desc">
<title id="apikey-title">Idempotency keys at an API boundary</title>
<desc id="apikey-desc">The client supplies a key for an operation it intends to perform once and resends it on every retry. The server stores the key with the result and replays it, binding the key to the request body and handling concurrent retries explicitly.</desc>
<defs>
<marker id="apikey-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="apikey-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="apikey-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="apikey-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="700" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Idempotency keys at an API boundary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The same problem appears at synchronous boundaries, where the client is the one retrying.</text>
<rect x="40" y="622" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="622" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="134" width="260" height="78" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="170" y="179" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Client</text>
<rect x="940" y="134" width="260" height="78" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1070" y="179" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Server</text>
<text x="620" y="132" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">request + idempotency key</text>
<path d="M306 154H934" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M306 154H934" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apikey-marker-slate)"/>
<path d="M934 192H306" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M934 192H306" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apikey-marker-green)"/>
<text x="620" y="224" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">retry carries the same key, and gets the stored result</text>
<text x="40" y="272" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three details that separate working from dangerous</text>
<circle cx="60" cy="322" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="329" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="290" width="380" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="328" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Bind the key to the body</text>
<path d="M476 322H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 322H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apikey-marker-slate)"/>
<rect x="520" y="290" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="315.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">store a hash of the request. A key reused with different</text><text x="540" y="340.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">parameters is a client mistake, and the right answer is an error.</text>
<circle cx="60" cy="398" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="405" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="366" width="380" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="404" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Answer concurrent retries</text>
<path d="M476 398H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 398H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apikey-marker-slate)"/>
<rect x="520" y="366" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="391.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">insert the key in a reserved state before working, then make</text><text x="540" y="416.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the second request wait or report that it is in progress.</text>
<circle cx="60" cy="474" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="481" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="442" width="380" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="480" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Store failures too</text>
<path d="M476 474H510" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M476 474H510" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#apikey-marker-slate)"/>
<rect x="520" y="442" width="680" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="540" y="467.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a deterministic failure replayed on retry is cheaper,</text><text x="540" y="492.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and it avoids a half-completed second attempt.</text>
<rect x="40" y="530" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="530" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="569" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Returning a success you cannot back up is the dangerous option.</text>
<text x="66" y="656" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The same problem, moved to where the retry originates outside your system.</text>
</svg>