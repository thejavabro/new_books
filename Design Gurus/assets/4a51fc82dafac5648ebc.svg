<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: Checkout charges the card at Payments, Payments moves the money at the Bank, the Bank confirms the money moved, then Payments dies before it replies, so the reply never reaches Checkout and Checkout only sees a timeout. From there a charge that succeeded and a charge that never happened look identical, which is why a blind retry can charge the customer twice.">
  <defs>
    <marker id="m04-l01-partial-failure-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l01-partial-failure-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l01-partial-failure-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l01-partial-failure-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <filter id="m04-l01-partial-failure-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  
  <rect x="90" y="328" width="1120" height="228" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="110" y="352" font-size="13.5" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">Ambiguity window</text>
  <text x="1190" y="352" text-anchor="end" font-size="12" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">from here on, Checkout cannot tell what happened</text>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="260" y1="106" x2="260" y2="568"/>
    <line x1="620" y1="106" x2="620" y2="568"/>
    <line x1="980" y1="106" x2="980" y2="568"/>
  </g>

  
  <text x="55" y="140" text-anchor="middle" font-size="12" fill="#64748B">time</text>
  <line x1="55" y1="152" x2="55" y2="520" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#m04-l01-partial-failure-sl)"/>

  
  <g fill="none">
    <path d="M266,180 L614,180" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m04-l01-partial-failure-bl)"/>
    <path d="M626,246 L974,246" stroke="#3B82F6" stroke-width="2" marker-end="url(#m04-l01-partial-failure-bl)"/>
    <path d="M974,312 L626,312" stroke="#059669" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m04-l01-partial-failure-em)"/>
    <path d="M614,456 L334,456" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5"/>
  </g>

  
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <path d="M321,447 L339,465"/>
    <path d="M339,447 L321,465"/>
  </g>

  
  <rect x="254" y="172" width="12" height="308" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="614" y="178" width="12" height="159" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="974" y="240" width="12" height="78" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>

  
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <path d="M609,337 L631,359"/>
    <path d="M631,337 L609,359"/>
  </g>

  
  <g filter="url(#m04-l01-partial-failure-soft)">
    <rect x="470" y="372" width="300" height="48" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="620" y="401" text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">Payments dies before it replies</text>

  <g filter="url(#m04-l01-partial-failure-soft)">
    <rect x="110" y="490" width="300" height="50" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="13" font-weight="600" fill="#B91C1C">
    <text x="260" y="510">Timeout. The truth is</text>
    <text x="260" y="529">unknowable from here</text>
  </g>

  <g filter="url(#m04-l01-partial-failure-soft)">
    <rect x="830" y="468" width="310" height="54" rx="8" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="985" y="490" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">The charge is complete at the Bank</text>
  <text x="985" y="510" text-anchor="middle" font-size="12" fill="#64748B">the truth exists, out of Checkout's reach</text>

  
  <g font-size="12" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="440" y="168" fill="#1E40AF">Charge the card</text>
    <text x="800" y="234" fill="#1E40AF">Move the money</text>
    <text x="800" y="300" fill="#065F46">Money moved</text>
    <text x="474" y="444" fill="#B91C1C">Reply never arrives</text>
  </g>

  
  <g filter="url(#m04-l01-partial-failure-soft)">
    <rect x="170" y="40" width="180" height="66" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="520" y="40" width="200" height="66" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
    <rect x="890" y="40" width="180" height="66" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">
    <text x="260" y="70">Checkout</text>
    <text x="620" y="70">Payments</text>
    <text x="980" y="70">Bank</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#64748B">
    <text x="260" y="91">the caller, waiting</text>
    <text x="620" y="91">charges the card, then dies</text>
    <text x="980" y="91">the money really moved</text>
  </g>

  
  <rect x="90" y="596" width="1120" height="146" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="110" y="622" font-size="13.5" font-weight="600" fill="#334155">What Checkout cannot distinguish: both of these produce exactly the same timeout</text>

  <g fill="none">
    <path d="M760,679 L826,679" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m04-l01-partial-failure-rd)"/>
  </g>

  <g filter="url(#m04-l01-partial-failure-soft)">
    <rect x="130" y="640" width="290" height="78" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="470" y="640" width="290" height="78" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="830" y="640" width="330" height="78" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <g text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">
    <text x="275" y="673">Succeeded, unconfirmed</text>
    <text x="615" y="673">Failed</text>
    <text x="995" y="673">A blind retry charges twice</text>
  </g>
  <g text-anchor="middle" font-size="12" fill="#64748B">
    <text x="275" y="695">the money moved, the reply was lost</text>
    <text x="615" y="695">the charge never happened</text>
    <text x="995" y="695">retry only what is idempotent</text>
  </g>
  <text x="445" y="688" text-anchor="middle" font-size="26" font-weight="600" fill="#DC2626">=</text>

  
  <g stroke-width="3" fill="none">
    <line x1="60" y1="772" x2="88" y2="772" stroke="#3B82F6"/>
    <line x1="430" y1="772" x2="458" y2="772" stroke="#059669" stroke-dasharray="6 5"/>
    <line x1="680" y1="772" x2="708" y2="772" stroke="#DC2626" stroke-dasharray="6 5"/>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="96" y="776">Synchronous call: the caller stops and waits</text>
    <text x="466" y="776">Reply to a waiting caller</text>
    <text x="716" y="776">Reply that never arrives, the caller only sees a timeout</text>
  </g>
</svg>