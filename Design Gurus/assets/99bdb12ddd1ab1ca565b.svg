<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="burn-title burn-desc">
<title id="burn-title">Alerting on budget burn</title>
<desc id="burn-desc">Burn rate is the ratio of actual budget consumption to the rate that would exactly exhaust it over the window, and it fixes both failures of threshold alerting.</desc>
<defs>
<marker id="burn-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="burn-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="burn-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="burn-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="844" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Alerting on budget burn</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The published starting configuration for a 99.9 percent objective uses three rules.</text>
<rect x="40" y="766" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="766" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="144" font-size="19" font-weight="700" fill="#6040A8" text-anchor="start">Not "is the error rate above a number somebody guessed",</text><text x="64" y="170" font-size="19" font-weight="700" fill="#6040A8" text-anchor="start">but "how fast is the budget going"</text>
<rect x="40" y="202" width="372" height="104" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="202" width="5" height="104" rx="2.5" fill="#5EC9EC"/><text x="64" y="234" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">burn rate 1</text><text x="64" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the budget lasts exactly</text><text x="64" y="286" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the 30 days</text>
<rect x="434" y="202" width="372" height="104" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="434" y="202" width="5" height="104" rx="2.5" fill="#F3CF6A"/><text x="458" y="234" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">burn rate 2</text><text x="458" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the budget is gone</text><text x="458" y="286" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">in 15 days</text>
<rect x="828" y="202" width="372" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="828" y="202" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="852" y="234" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">burn rate 14.4</text><text x="852" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the budget is gone</text><text x="852" y="286" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">in about 2 days</text>
<text x="140" y="342" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">burn rate</text>
<text x="368" y="342" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">long window</text>
<text x="612" y="342" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">short window</text>
<text x="835" y="342" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">budget spent</text>
<text x="1071" y="342" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">response</text>
<rect x="40" y="360" width="200" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="140" y="390" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">14.4</text>
<rect x="252" y="360" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="368" y="391" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">1 hour</text>
<rect x="496" y="360" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="612" y="391" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">5 minutes</text>
<rect x="740" y="360" width="190" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="835" y="391" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">2%</text>
<rect x="942" y="360" width="258" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1071" y="390" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Page</text>
<rect x="40" y="418" width="200" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="140" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">6</text>
<rect x="252" y="418" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="368" y="449" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">6 hours</text>
<rect x="496" y="418" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="612" y="449" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">30 minutes</text>
<rect x="740" y="418" width="190" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="835" y="449" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">5%</text>
<rect x="942" y="418" width="258" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1071" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Page</text>
<rect x="40" y="476" width="200" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="140" y="506" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">1</text>
<rect x="252" y="476" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="368" y="507" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">3 days</text>
<rect x="496" y="476" width="232" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="612" y="507" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">6 hours</text>
<rect x="740" y="476" width="190" height="48" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="835" y="507" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">10%</text>
<rect x="942" y="476" width="258" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1071" y="506" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ticket</text>
<rect x="40" y="548" width="560" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="548" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="580" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Why the short window exists</text><text x="64" y="606" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">both must be burning to fire, so the</text><text x="64" y="632" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">alert clears when the problem does</text>
<rect x="640" y="548" width="560" height="104" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="548" width="5" height="104" rx="2.5" fill="#F3CF6A"/><text x="664" y="580" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Why the budget column matters</text><text x="664" y="606" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">you are woken because 2% of the</text><text x="664" y="632" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">month's allowance went in an hour</text>
<rect x="40" y="674" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="674" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="713" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">For 99.9 percent, 43 minutes is the whole month. 14.4x for an hour spends 52 seconds of it.</text>
<text x="66" y="800" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A persistent small error rate now fires. A trivial spike does not.</text>
</svg>