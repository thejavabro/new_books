<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="honest-title honest-desc">
<title id="honest-title">The honest single-region design</title>
<desc id="honest-desc">Multiple zones, backups restored on a schedule, a specified degraded mode, and a written statement of the exposure accepted by somebody who can accept it. Without the fourth, declining is an omission rather than a decision.</desc>
<defs>
<marker id="honest-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="honest-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="honest-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="honest-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The honest single-region design</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Declining a second region is only a decision if it comes with the four things that make it defensible.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Multiple availability zones</text>
<path d="M536 150H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 150H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#honest-marker-slate)"/>
<rect x="580" y="118" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">for everything stateful and stateless, with the database</text><text x="600" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">failover tested rather than assumed</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="440" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="218.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backups elsewhere,</text><text x="310" y="245.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">restored on a schedule</text>
<path d="M536 226H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 226H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#honest-marker-slate)"/>
<rect x="580" y="194" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with the measured restore time written down; this is the</text><text x="600" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">plan for the event you are declining</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="440" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A specified degraded mode</text>
<path d="M536 302H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 302H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#honest-marker-slate)"/>
<rect x="580" y="270" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what still works when the database is unavailable,</text><text x="600" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and who can turn it on</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="440" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A written statement of the exposure</text>
<path d="M536 378H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 378H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#honest-marker-slate)"/>
<rect x="580" y="346" width="620" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">roughly four hours of downtime and five minutes of data,</text><text x="600" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">accepted by somebody who can accept it</text>
<rect x="40" y="438" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="438" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="474" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The fourth item converts the decision from a gap into a choice.</text><text x="64" y="500" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A design is proportionate only if what you did not build is stated with its trigger.</text>
<rect x="40" y="552" width="1160" height="118" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="552" width="5" height="118" rx="2.5" fill="#39D5AA"/><text x="64" y="588" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The shape of the expected answer</text><text x="64" y="617" font-size="22" font-weight="400" fill="#080C50" text-anchor="start">Not yet. Here is what a region failure would cost us, here is the cheaper thing</text><text x="64" y="646" font-size="22" font-weight="400" fill="#080C50" text-anchor="start">that covers most of it, and here is the trigger that would change the answer.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The failure to avoid is treating a second region as a maturity signal.</text>
</svg>