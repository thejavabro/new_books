<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An update anomaly happens when some copies of a value change and others do not. An insert anomaly happens when one fact cannot be stored without another, like a product that no one has ordered. A delete anomaly happens when deleting one fact also removes another, like deleting the last order for a product.">
  <defs>
    <filter id="nvd2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nvd2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nvd2-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd2-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nvd2-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three problems that normalization prevents</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">They appear when the same fact is stored in several places.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nvd2-lift)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="64" y="140" width="9" height="90" fill="#DB2777" clip-path="url(#nvd2-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Update anomaly</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">some copies change,</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">others do not</text>
  <g filter="url(#nvd2-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#D97706" clip-path="url(#nvd2-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Insert anomaly</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">a product no one ordered</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">cannot be stored</text>
  <g filter="url(#nvd2-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#nvd2-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Delete anomaly</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">deleting the last order</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">removes the product</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">The cause</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">the same fact is stored in more than one place</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">The fix</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">store each fact once, and point to it by a key</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Normal forms</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">names for levels of normalization, like third normal form (3NF)</text>
</svg>