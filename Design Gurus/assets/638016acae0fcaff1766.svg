<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="722" viewBox="0 0 1240 722" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The five kinds of integrity constraint, what each one protects against, and the SQL that declares it">
<rect x="0" y="0" width="1240" height="722" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="556" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Five rules the database enforces for every application that connects</text>

<g stroke="#CBD5E1" stroke-width="1.2">
<rect x="64" y="96" width="250" height="44" fill="#E2E8F0"/>
<rect x="314" y="96" width="420" height="44" fill="#E2E8F0"/>
<rect x="734" y="96" width="442" height="44" fill="#E2E8F0"/>
<rect x="64" y="140" width="250" height="88" fill="#EFF6FF"/><rect x="314" y="140" width="420" height="88" fill="#EFF6FF"/><rect x="734" y="140" width="442" height="88" fill="#EFF6FF"/>
<rect x="64" y="228" width="250" height="88" fill="#F5F3FF"/><rect x="314" y="228" width="420" height="88" fill="#F5F3FF"/><rect x="734" y="228" width="442" height="88" fill="#F5F3FF"/>
<rect x="64" y="316" width="250" height="110" fill="#ECFDF5"/><rect x="314" y="316" width="420" height="110" fill="#ECFDF5"/><rect x="734" y="316" width="442" height="110" fill="#ECFDF5"/>
<rect x="64" y="426" width="250" height="78" fill="#FFFBEB"/><rect x="314" y="426" width="420" height="78" fill="#FFFBEB"/><rect x="734" y="426" width="442" height="78" fill="#FFFBEB"/>
<rect x="64" y="504" width="250" height="68" fill="#FDF2F8"/><rect x="314" y="504" width="420" height="68" fill="#FDF2F8"/><rect x="734" y="504" width="442" height="68" fill="#FDF2F8"/>
</g>

<g font-size="15.5" font-weight="600" fill="#475569">
<text x="82" y="124">Constraint</text>
<text x="332" y="124">What it refuses</text>
<text x="752" y="124">How you declare it</text>
</g>

<text x="82" y="172" font-size="16" font-weight="600" fill="#1D4ED8">Domain</text>
<text x="82" y="200" font-size="14.5" fill="#6B7280">the allowed set of values</text>
<text x="332" y="172" font-size="14.5" fill="#111827">Marks of 210 out of 100.</text>
<text x="332" y="198" font-size="14.5" fill="#111827">The text "twenty" in a number column.</text>
<text x="752" y="172" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">marks INT</text>
<text x="752" y="198" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">  CHECK (marks BETWEEN 0 AND 100)</text>

<text x="82" y="260" font-size="16" font-weight="600" fill="#5B21B6">Entity integrity</text>
<text x="82" y="288" font-size="14.5" fill="#6B7280">every row is identifiable</text>
<text x="332" y="260" font-size="14.5" fill="#111827">A row whose primary key is empty.</text>
<text x="332" y="286" font-size="14.5" fill="#111827">Half of a composite key left blank.</text>
<text x="752" y="260" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">PRIMARY KEY (loan_id)</text>
<text x="752" y="286" font-size="14" fill="#6B7280">NOT NULL comes with it automatically</text>

<text x="82" y="348" font-size="16" font-weight="600" fill="#047857">Referential integrity</text>
<text x="82" y="376" font-size="14.5" fill="#6B7280">a foreign key points at</text>
<text x="82" y="396" font-size="14.5" fill="#6B7280">a real row, or at nothing</text>
<text x="332" y="348" font-size="14.5" fill="#111827">A loan for a member id that does not exist.</text>
<text x="332" y="374" font-size="14.5" fill="#111827">Deleting a member who still has loans,</text>
<text x="332" y="394" font-size="14.5" fill="#111827">unless you chose CASCADE or SET NULL.</text>
<text x="752" y="348" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">FOREIGN KEY (member_id)</text>
<text x="752" y="372" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">  REFERENCES Member(member_id)</text>
<text x="752" y="396" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">  ON DELETE RESTRICT</text>

<text x="82" y="458" font-size="16" font-weight="600" fill="#B45309">Key constraint</text>
<text x="82" y="486" font-size="14.5" fill="#6B7280">no duplicate values</text>
<text x="332" y="458" font-size="14.5" fill="#111827">Two members sharing one email address.</text>
<text x="332" y="484" font-size="14.5" fill="#6B7280">Several NULLs are usually still allowed.</text>
<text x="752" y="458" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">UNIQUE KEY uq_member_email (email)</text>
<text x="752" y="484" font-size="14" fill="#6B7280">add NOT NULL if the value is required</text>

<text x="82" y="536" font-size="16" font-weight="600" fill="#BE185D">Check constraint</text>
<text x="82" y="560" font-size="14.5" fill="#6B7280">any condition you can state</text>
<text x="332" y="536" font-size="14.5" fill="#111827">A due date earlier than the issue date.</text>
<text x="332" y="560" font-size="14.5" fill="#111827">A negative price.</text>
<text x="752" y="536" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14" fill="#111827">CHECK (due_date &gt; issue_date)</text>
<text x="752" y="560" font-size="14" fill="#6B7280">one rule, held for every application</text>

<rect x="40" y="630" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="668" font-size="16" fill="#475569">The same rule written as an if statement in one application holds only for that application. In the schema it holds for all of them.</text>
</svg>