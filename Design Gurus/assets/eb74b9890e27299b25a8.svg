<text x="134" y="85" font-size="18.5" font-weight="600" fill="#111827">File (one row per file)</text><text x="94" y="131" font-size="15.5" fill="#111827">FileID</text><text x="516" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="142" x2="526" y2="142" stroke="#93C5FD" stroke-width="1"/><text x="94" y="167" font-size="15.5" fill="#111827">WorkspaceID</text><text x="516" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">bigint</text><line x1="84" y1="178" x2="526" y2="178" stroke="#93C5FD" stroke-width="1"/><text x="94" y="203" font-size="15.5" fill="#111827">Path, Name</text><text x="516" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">varchar</text><line x1="84" y1="214" x2="526" y2="214" stroke="#93C5FD" stroke-width="1"/><text x="94" y="239" font-size="15.5" fill="#111827">Size</text><text x="516" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">bytes</text><line x1="84" y1="250" x2="526" y2="250" stroke="#93C5FD" stroke-width="1"/><text x="94" y="275" font-size="15.5" fill="#111827">Version</text><text x="516" y="275" font-size="15.5" text-anchor="end" fill="#6B7280">int, +1 per commit</text><line x1="84" y1="286" x2="526" y2="286" stroke="#93C5FD" stroke-width="1"/><text x="94" y="311" font-size="15.5" fill="#111827">ChunkHashes</text><text x="516" y="311" font-size="15.5" text-anchor="end" fill="#6B7280">ordered list</text><line x1="84" y1="322" x2="526" y2="322" stroke="#93C5FD" stroke-width="1"/><text x="94" y="347" font-size="15.5" fill="#111827">Permissions</text><text x="516" y="347" font-size="15.5" text-anchor="end" fill="#6B7280">who may view or modify</text><g filter="url(#dbx1-soft)">
<rect x="760" y="50" width="400" height="214" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="760" y="50" width="6" height="214" fill="#7C3AED" clip-path="url(#dbx1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">Chunk</text><text x="784" y="131" font-size="15.5" fill="#111827">ChunkHash</text><text x="1136" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">SHA-256, primary key</text><line x1="774" y1="142" x2="1146" y2="142" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">SizeBytes</text><text x="1136" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">up to 4 MB</text><line x1="774" y1="178" x2="1146" y2="178" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">StorageURL</text><text x="1136" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">pointer, not the data</text><line x1="774" y1="214" x2="1146" y2="214" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="239" font-size="15.5" fill="#111827">RefCount</text><text x="1136" y="239" font-size="15.5" text-anchor="end" fill="#6B7280">files using this chunk</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 810,350 L 810,444 A 150,16 0 0 0 1110,444 L 1110,350" fill="#E2E8F0"/>
<ellipse cx="960" cy="350" rx="150" ry="16" fill="#F8FAFC"/>
</g>
<text x="960" y="419" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Cloud storage</text><text x="960" y="485" font-size="15.5" text-anchor="middle" fill="#6B7280">the chunk data itself, in an object store like S3</text><g filter="url(#dbx1-soft)">
<rect x="70" y="470" width="470" height="178" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="70" y="470" width="6" height="178" fill="#4F46E5" clip-path="url(#dbx1-k3)"/>
</g>
