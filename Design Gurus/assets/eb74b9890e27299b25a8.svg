<path d="M 540,304 H 638 Q 650,304 650,292 V 136 Q 650,124 662,124 H 757" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#dbx1-mbl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="210" fill="#1D4ED8">the ordered chunk list</text><text x="650" y="232" fill="#1D4ED8">rebuilds the file</text></g><path d="M 960,264 V 331" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#dbx1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="960" y="305" fill="#475569">StorageURL points here</text></g><path d="M 305,372 V 467" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#dbx1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="305" y="426" fill="#4338CA">every file lives in one workspace</text></g><path d="M 540,580 H 638 Q 650,580 650,592 V 602 Q 650,614 662,614 H 757" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#dbx1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="566" fill="#475569">owned by one user</text></g><path d="M 540,850 H 638 Q 650,850 650,838 V 698 Q 650,686 662,686 H 757" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dbx1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="762" fill="#B45309">about three devices</text><text x="650" y="784" fill="#B45309">per user</text></g><g filter="url(#dbx1-lift)">
<rect x="70" y="50" width="470" height="322" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="70" y="50" width="9" height="322" fill="#2563EB" clip-path="url(#dbx1-k1)"/>
