<text x="134" y="505" font-size="18.5" font-weight="600" fill="#111827">Workspace (the sync folder)</text><text x="94" y="551" font-size="15.5" fill="#111827">WorkspaceID</text><text x="516" y="551" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="562" x2="526" y2="562" stroke="#A5B4FC" stroke-width="1"/><text x="94" y="587" font-size="15.5" fill="#111827">OwnerID</text><text x="516" y="587" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="598" x2="526" y2="598" stroke="#A5B4FC" stroke-width="1"/><text x="94" y="623" font-size="15.5" fill="#111827">RootPath</text><text x="516" y="623" font-size="15.5" text-anchor="end" fill="#6B7280">varchar</text><g filter="url(#dbx1-soft)">
<rect x="760" y="540" width="400" height="178" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="760" y="540" width="6" height="178" fill="#64748B" clip-path="url(#dbx1-k4)"/>
</g>
<circle cx="798" cy="568" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,557.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="824" y="575" font-size="18.5" font-weight="600" fill="#111827">User</text><text x="784" y="621" font-size="15.5" fill="#111827">UserID</text><text x="1136" y="621" font-size="15.5" text-anchor="end" fill="#6B7280">int, primary key</text><line x1="774" y1="632" x2="1146" y2="632" stroke="#94A3B8" stroke-width="1"/><text x="784" y="657" font-size="15.5" fill="#111827">Name, Email</text><text x="1136" y="657" font-size="15.5" text-anchor="end" fill="#6B7280">varchar</text><line x1="774" y1="668" x2="1146" y2="668" stroke="#94A3B8" stroke-width="1"/><text x="784" y="693" font-size="15.5" fill="#111827">CreatedAt</text><text x="1136" y="693" font-size="15.5" text-anchor="end" fill="#6B7280">datetime</text><g filter="url(#dbx1-soft)">
<rect x="70" y="740" width="470" height="214" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="70" y="740" width="6" height="214" fill="#D97706" clip-path="url(#dbx1-k5)"/>
</g>
<circle cx="108" cy="768" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,757.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
<text x="134" y="775" font-size="18.5" font-weight="600" fill="#111827">Device</text><text x="94" y="821" font-size="15.5" fill="#111827">DeviceID</text><text x="516" y="821" font-size="15.5" text-anchor="end" fill="#6B7280">bigint, primary key</text><line x1="84" y1="832" x2="526" y2="832" stroke="#FCD34D" stroke-width="1"/><text x="94" y="857" font-size="15.5" fill="#111827">UserID</text><text x="516" y="857" font-size="15.5" text-anchor="end" fill="#6B7280">int</text><line x1="84" y1="868" x2="526" y2="868" stroke="#FCD34D" stroke-width="1"/><text x="94" y="893" font-size="15.5" fill="#111827">Platform</text><text x="516" y="893" font-size="15.5" text-anchor="end" fill="#6B7280">desktop, mobile, web</text><line x1="84" y1="904" x2="526" y2="904" stroke="#FCD34D" stroke-width="1"/><text x="94" y="929" font-size="15.5" fill="#111827">LastSyncedVersion</text><text x="516" y="929" font-size="15.5" text-anchor="end" fill="#6B7280">the since value</text><rect x="40" y="1000" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="1026" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="1048" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The two big tables</text><text x="288" y="1048" font-size="15.5" fill="#475569">File and Chunk hold 100 billion rows and more; step 6 partitions them by hashing the FileID</text><rect x="64" y="1070" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/><text x="164" y="1092" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Versions are cheap</text><text x="288" y="1092" font-size="15.5" fill="#475569">an old version is an older chunk list, and unchanged chunks are shared between versions</text>
</svg>