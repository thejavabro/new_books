<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Dropbox metadata model: File with an ordered chunk list, Chunk keyed by content hash pointing into cloud storage, Workspace, User, and Device">
