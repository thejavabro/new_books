<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1380" viewBox="0 0 1240 1380" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. A thin client, a browser, sends requests to one server tier that holds the application logic (business logic, data, processing) and the database, and gets responses back; it does little local processing. A thick client, a desktop or mobile app, sends requests to one server tier that holds the application logic (data, core services) and the database; it runs significant processing and business logic itself">
  <defs>
    <filter id="m04h-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m04h-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m04h-k1"><rect x="64" y="300" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m04h-k2"><rect x="608" y="300" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m04h-k3"><rect x="64" y="930" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="m04h-k4"><rect x="608" y="930" width="270" height="90" rx="12"/></clipPath>
    <marker id="m04h-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m04h-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m04h-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1380" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Thin client vs. thick client architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Both are two-tier: the client talks directly to one server that holds the data and the logic that does not run on the client.</text>

  <rect x="40" y="120" width="1160" height="590" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Thin client</text>
  <rect x="40" y="750" width="1160" height="590" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="780" font-size="19.5" font-weight="600" fill="#4338CA">Thick client</text>
  <rect x="584" y="220" width="592" height="228" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="608" y="250" font-size="19.5" font-weight="600" fill="#1D4ED8">Server: application logic and data in one tier</text>
  <rect x="584" y="850" width="592" height="228" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="608" y="880" font-size="19.5" font-weight="600" fill="#1D4ED8">Server: data and the logic that does not run on the client</text>

  <g fill="none" stroke-width="2">
    <path d="M334,330 H584" stroke="#2563EB" marker-end="url(#m04h-m-blue)"/>
    <path d="M584,364 H334" stroke="#059669" marker-end="url(#m04h-m-emerald)"/>
    <path d="M878,350 H976" stroke="#2563EB" marker-end="url(#m04h-m-blue)" marker-start="url(#m04h-s-blue)"/>
    <path d="M334,960 H584" stroke="#2563EB" marker-end="url(#m04h-m-blue)"/>
    <path d="M584,994 H334" stroke="#059669" marker-end="url(#m04h-m-emerald)"/>
    <path d="M878,980 H976" stroke="#2563EB" marker-end="url(#m04h-m-blue)" marker-start="url(#m04h-s-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="459" y="317" fill="#1D4ED8">Request</text>
    <text x="459" y="390" fill="#047857">Response</text>
    <text x="459" y="947" fill="#1D4ED8">Request</text>
    <text x="459" y="1020" fill="#047857">Response</text>
  </g>

  <g filter="url(#m04h-soft)">
    <rect x="64" y="300" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="300" width="6" height="90" fill="#64748B" clip-path="url(#m04h-k1)"/>
  </g>
  <circle cx="102" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,334.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="128" y="352" font-size="21.5" font-weight="600" fill="#111827">Thin client</text>
  <text x="199" y="419" font-size="18.5" text-anchor="middle" fill="#6B7280">browser</text>
  <g filter="url(#m04h-soft)">
    <rect x="608" y="300" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="608" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#m04h-k2)"/>
  </g>
  <circle cx="646" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(635.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="672" y="339.25" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="672" y="364.75" font-size="21.5" font-weight="600" fill="#111827">logic</text>
  <text x="743" y="419" font-size="18.5" text-anchor="middle" fill="#6B7280">business logic, data, processing</text>
  <g filter="url(#m04h-soft)">
    <rect x="64" y="930" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="930" width="6" height="90" fill="#64748B" clip-path="url(#m04h-k3)"/>
  </g>
  <circle cx="102" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,964.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="982" font-size="21.5" font-weight="600" fill="#111827">Thick client</text>
  <text x="199" y="1049" font-size="18.5" text-anchor="middle" fill="#6B7280">desktop or mobile app</text>
  <g filter="url(#m04h-soft)">
    <rect x="608" y="930" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="608" y="930" width="6" height="90" fill="#2563EB" clip-path="url(#m04h-k4)"/>
  </g>
  <circle cx="646" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(635.56,964.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="672" y="969.25" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="672" y="994.75" font-size="21.5" font-weight="600" fill="#111827">logic</text>
  <text x="743" y="1049" font-size="18.5" text-anchor="middle" fill="#6B7280">data, core services</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M976,304 L976,384 A88,16 0 0 0 1152,384 L1152,304" fill="#DBEAFE"/>
    <ellipse cx="1064" cy="304" rx="88" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1064" y="359" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M976,934 L976,1014 A88,16 0 0 0 1152,1014 L1152,934" fill="#DBEAFE"/>
    <ellipse cx="1064" cy="934" rx="88" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1064" y="989" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="178" font-size="18.5" fill="#475569">Most of the processing happens on the server.</text>
  <text x="64" y="808" font-size="18.5" fill="#475569">Significant processing happens on the client.</text>

  <rect x="64" y="480" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="502" r="8" fill="#2563EB"/>
  <text x="114" y="508.5" font-size="18.5" fill="#1F2937">Minimal local processing.</text>
  <rect x="64" y="534" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="556" r="8" fill="#2563EB"/>
  <text x="114" y="562.5" font-size="18.5" fill="#1F2937">Relies on the server for most of the work.</text>
  <rect x="64" y="588" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="610" r="8" fill="#2563EB"/>
  <text x="114" y="616.5" font-size="18.5" fill="#1F2937">Renders what the server returns.</text>
  <rect x="64" y="642" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="664" r="8" fill="#2563EB"/>
  <text x="114" y="670.5" font-size="18.5" fill="#1F2937">Accessed through a browser or lightweight client.</text>
  <rect x="64" y="1110" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="90" cy="1132" r="8" fill="#4F46E5"/>
  <text x="114" y="1138.5" font-size="18.5" fill="#1F2937">Significant processing and business logic on the client.</text>
  <rect x="64" y="1164" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="90" cy="1186" r="8" fill="#4F46E5"/>
  <text x="114" y="1192.5" font-size="18.5" fill="#1F2937">Richer user experience and offline capabilities.</text>
  <rect x="64" y="1218" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="90" cy="1240" r="8" fill="#4F46E5"/>
  <text x="114" y="1246.5" font-size="18.5" fill="#1F2937">The server keeps the data and the logic the client does not run.</text>
  <rect x="64" y="1272" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="90" cy="1294" r="8" fill="#4F46E5"/>
  <text x="114" y="1300.5" font-size="18.5" fill="#1F2937">Common in desktop applications and some mobile apps.</text>


</svg>