<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="696" viewBox="0 0 1240 696" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="decides-title decides-desc">
<title id="decides-title">The question that decides it</title>
<desc id="decides-desc">Build what a customer would choose you for, and buy what you merely depend on. For the middle case, buy behind an abstraction so the decision can be revisited.</desc>
<defs>
<marker id="decides-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="decides-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="decides-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="decides-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="696" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The question that decides it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Build what a customer would choose you for, and buy what you merely depend on.</text>
<rect x="40" y="618" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="618" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="155" font-size="24" font-weight="700" fill="#6040A8" text-anchor="start">Is this thing something you compete on?</text>
<rect x="40" y="192" width="560" height="188" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 192H46A6 6 0 0 0 40 198V374A6 6 0 0 0 46 380H54Z" fill="#39D5AA"/><text x="70" y="228" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Build what differentiates you</text>
<rect x="72" y="248" width="500" height="112" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the matching engine</text><text x="92" y="297.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the ranking model</text><text x="92" y="322.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the pricing logic</text><text x="92" y="347.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what the company is actually about</text>
<rect x="640" y="192" width="560" height="188" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 192H646A6 6 0 0 0 640 198V374A6 6 0 0 0 646 380H654Z" fill="#5EC9EC"/><text x="670" y="228" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Buy what you merely depend on</text>
<rect x="672" y="248" width="500" height="112" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">authentication, payments</text><text x="692" y="297.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">email delivery, error tracking</text><text x="692" y="322.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">log aggregation, feature flags</text><text x="692" y="347.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">necessary, and not why anyone chose you</text>
<rect x="40" y="400" width="560" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="425.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure mode: a worse version</text><text x="320" y="452.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">of a solved problem, called ownership</text>
<rect x="640" y="400" width="560" height="66" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="425.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Failure mode: outsourcing the thing</text><text x="920" y="452.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">that makes you different. Rarer, worse</text>
<rect x="40" y="486" width="1160" height="106" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="486" width="5" height="106" rx="2.5" fill="#AC8BE8"/><text x="64" y="519" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">For the middle case, not a differentiator today but on the path to one</text><text x="64" y="545" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Buy it now with an abstraction in front of it, so the decision can be revisited when you know more.</text><text x="64" y="571" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">That is the move that holds up best.</text>
<text x="66" y="652" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most of the analysis refines a decision that one question usually settles.</text>
</svg>