<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Protocol placement: browsers, mobile apps, and third party clients reach the gateway or BFF layer over REST or GraphQL, the gateway calls the Orders and Users services over gRPC, and Orders calls Inventory over gRPC.">
  <defs>
    <marker id="m03-l02-protocol-placement-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m03-l02-protocol-placement-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="220" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#334155">Edges you do not control</text>
  <text x="1178" y="98" text-anchor="end" font-size="20" fill="#64748B">REST: universal and cacheable</text>
  <rect x="40" y="490" width="1160" height="300" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="528" font-size="20" font-weight="600" fill="#1E3A8A">Inside the system, you control both ends</text>
  <text x="1178" y="528" text-anchor="end" font-size="20" fill="#64748B">gRPC: typed contracts, compact payloads</text>

  
  <g fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l02-protocol-placement-blue)">
    <path d="M370,244 C370,300 500,286 545,324"/>
    <path d="M870,244 C870,300 740,286 695,324"/>
    <path d="M560,440 V556 H290 V598"/>
    <path d="M680,440 V556 H632 V598"/>
    <path d="M290,694 V736 H995 V698"/>
  </g>

  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="180" y="140" width="380" height="104" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="370" y="188" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Browser and mobile apps</text>
  <text x="370" y="218" text-anchor="middle" font-size="20" fill="#64748B">browsers cannot speak gRPC</text>
  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="680" y="140" width="380" height="104" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="870" y="188" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Third party clients</text>
  <text x="870" y="218" text-anchor="middle" font-size="20" fill="#64748B">every language already speaks it</text>
  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="430" y="330" width="380" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="381" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway or BFF layer</text>
  <text x="620" y="411" text-anchor="middle" font-size="20" fill="#64748B">REST or GraphQL in, gRPC out</text>
  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="150" y="604" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="290" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders service</text>
  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="492" y="604" width="280" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="632" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Users service</text>
  <g filter="url(#m03-l02-protocol-placement-soft)">
    <rect x="850" y="604" width="290" height="90" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="995" y="656" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory service</text>

  
  <g font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="234" y="306">REST or GraphQL</text>
    <text x="884" y="306">REST</text>
    <text x="380" y="546" text-anchor="middle">gRPC</text>
    <text x="716" y="546" text-anchor="middle">gRPC</text>
    <text x="640" y="726" text-anchor="middle">gRPC</text>
  </g>

  <line x1="50" y1="832" x2="86" y2="832" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="839" font-size="20" fill="#475569">Blue edges are synchronous calls: the caller waits for a reply</text>
  <rect x="50" y="860" width="82" height="34" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="91" y="884" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF">REST</text>
  <text x="148" y="884" font-size="20" fill="#475569">public and browser-facing edges</text>
  <rect x="50" y="906" width="82" height="34" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="91" y="930" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF">gRPC</text>
  <text x="148" y="930" font-size="20" fill="#475569">internal service-to-service hops</text>
  <rect x="50" y="952" width="118" height="34" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="109" y="976" text-anchor="middle" font-size="20" font-weight="600" fill="#1E40AF">GraphQL</text>
  <text x="184" y="976" font-size="20" fill="#475569">client aggregation edge, when clients differ</text>
</svg>