<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Symmetric encryption uses one shared key to encrypt and decrypt; asymmetric encryption uses a public key to encrypt and a private key to decrypt">
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
  <defs>
    <marker id="se7-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="se7-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se7-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="se7-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="se7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="40" y="60" width="560" height="610" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="320" y="94" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Symmetric encryption</text>

  <rect x="640" y="60" width="560" height="610" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="920" y="94" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Asymmetric encryption</text>

  
  <line x1="220" y1="218" x2="220" y2="300" stroke="#3B82F6" stroke-width="2" marker-end="url(#se7-blue)"/>
  <text x="206" y="264" font-size="20" fill="#1E40AF" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">encrypt</text>
  <line x1="220" y1="382" x2="220" y2="464" stroke="#059669" stroke-width="2" marker-end="url(#se7-emerald)"/>
  <text x="206" y="428" font-size="20" fill="#065F46" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">decrypt</text>

  
  <line x1="370" y1="259" x2="228" y2="259" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se7-amber)"/>
  <path d="M400,292 C400,380 300,423 228,423" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se7-amber)"/>
  <g filter="url(#se7-soft)">
    <rect x="370" y="232" width="210" height="60" rx="26" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="475" y="260" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Key K</text>
  <text x="475" y="283" font-size="20" fill="#64748B" text-anchor="middle">the shared secret</text>

  
  <g filter="url(#se7-soft)">
    <rect x="100" y="150" width="240" height="68" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="100" y="314" width="240" height="68" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="100" y="478" width="240" height="68" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="220" y="180" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Plaintext</text>
  <text x="220" y="205" font-size="20" fill="#64748B" text-anchor="middle">readable data</text>
  <text x="220" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ciphertext</text>
  <text x="220" y="369" font-size="20" fill="#64748B" text-anchor="middle">unreadable code</text>
  <text x="220" y="508" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Plaintext again</text>
  <text x="220" y="533" font-size="20" fill="#64748B" text-anchor="middle">readable data</text>

  
  <line x1="820" y1="218" x2="820" y2="300" stroke="#3B82F6" stroke-width="2" marker-end="url(#se7-blue)"/>
  <text x="806" y="264" font-size="20" fill="#1E40AF" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">encrypt</text>
  <line x1="820" y1="382" x2="820" y2="464" stroke="#059669" stroke-width="2" marker-end="url(#se7-emerald)"/>
  <text x="806" y="428" font-size="20" fill="#065F46" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">decrypt</text>

  
  <line x1="970" y1="259" x2="828" y2="259" stroke="#3B82F6" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se7-blue)"/>
  <line x1="970" y1="423" x2="828" y2="423" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#se7-violet)"/>
  <g filter="url(#se7-soft)">
    <rect x="970" y="229" width="210" height="60" rx="26" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="970" y="393" width="210" height="60" rx="26" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1075" y="257" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Public key</text>
  <text x="1075" y="280" font-size="20" fill="#64748B" text-anchor="middle">anyone has it</text>
  <text x="1075" y="421" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Private key</text>
  <text x="1075" y="444" font-size="20" fill="#64748B" text-anchor="middle">only you have it</text>

  
  <g filter="url(#se7-soft)">
    <rect x="700" y="150" width="240" height="68" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="700" y="314" width="240" height="68" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="700" y="478" width="240" height="68" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="820" y="180" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Plaintext</text>
  <text x="820" y="205" font-size="20" fill="#64748B" text-anchor="middle">readable data</text>
  <text x="820" y="344" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ciphertext</text>
  <text x="820" y="369" font-size="20" fill="#64748B" text-anchor="middle">unreadable code</text>
  <text x="820" y="508" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Plaintext again</text>
  <text x="820" y="533" font-size="20" fill="#64748B" text-anchor="middle">readable data</text>

  
  <text x="320" y="605" font-size="20" fill="#64748B" text-anchor="middle">one shared key locks and unlocks: fast,</text>
  <text x="320" y="632" font-size="20" fill="#64748B" text-anchor="middle">but the key must be shared safely</text>
  <text x="920" y="605" font-size="20" fill="#64748B" text-anchor="middle">two different keys: the public key encrypts,</text>
  <text x="920" y="632" font-size="20" fill="#64748B" text-anchor="middle">the private key decrypts</text>
</svg>