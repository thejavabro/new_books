<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="642" viewBox="0 0 1240 642" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="After a crash the database replays the write-ahead log from the last checkpoint, redoing the committed transaction and undoing the one that never reached a commit record">
  <rect x="0" y="0" width="1240" height="642" fill="#FFFFFF"/>
  <defs>
    <marker id="db4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The power fails here. The log already knows what to do about it.</text>

  <text x="1150" y="134" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">CRASH</text>
  <line x1="1150" y1="142" x2="1150" y2="250" stroke="#DC2626" stroke-width="2.5"/>

  <rect x="110" y="152" width="150" height="52" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="184" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">checkpoint</text>

  <rect x="282" y="152" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="357" y="184" font-size="20" fill="#1E40AF" text-anchor="middle">T1 begin</text>

  <rect x="454" y="152" width="150" height="52" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="529" y="184" font-size="20" fill="#1E40AF" text-anchor="middle">T1  A -$100</text>

  <rect x="626" y="152" width="150" height="52" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="701" y="184" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">T1 COMMIT</text>

  <rect x="798" y="152" width="150" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="873" y="184" font-size="20" fill="#92400E" text-anchor="middle">T2 begin</text>

  <rect x="970" y="152" width="150" height="52" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1045" y="184" font-size="20" fill="#92400E" text-anchor="middle">T2  X -$50</text>

  <line x1="110" y1="230" x2="1190" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#db4-slate)"/>

  <path d="M110 264 V252 H1150 V264" fill="none" stroke="#7C3AED" stroke-width="2"/>
  <text x="630" y="292" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">recovery reads only from the last checkpoint forward</text>

  
  <rect x="50" y="320" width="560" height="170" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="330" y="358" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">REDO T1</text>
  <text x="330" y="396" font-size="20" fill="#065F46" text-anchor="middle">T1 committed before the crash.</text>
  <text x="330" y="426" font-size="20" fill="#065F46" text-anchor="middle">Its records are all in the log, so replay them.</text>
  <text x="330" y="456" font-size="20" fill="#065F46" text-anchor="middle">The $100 transfer survives.</text>

  <rect x="630" y="320" width="560" height="170" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="910" y="358" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">UNDO T2</text>
  <text x="910" y="396" font-size="20" fill="#92400E" text-anchor="middle">T2 never reached a commit record.</text>
  <text x="910" y="426" font-size="20" fill="#92400E" text-anchor="middle">Its partial change is rolled back.</text>
  <text x="910" y="456" font-size="20" fill="#92400E" text-anchor="middle">Account X is left exactly as it was.</text>

  
  <rect x="50" y="520" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="556" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The log is the truth. The data files are a cache of it that recovery rebuilds.</text>
  <text x="620" y="586" font-size="20" fill="#334155" text-anchor="middle">The checkpoint is what keeps that rebuild short instead of replaying all of history.</text>
</svg>