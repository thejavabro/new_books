<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The heaviest moment, not the heaviest job">
<defs>
<filter id="cp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="44" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">The heaviest moment, not the heaviest job</text>
<text x="620" y="76" text-anchor="middle" font-size="19" fill="#475569">overlapping jobs add their loads, so the busiest moment wins</text>
<rect x="40" y="100" width="1160" height="280" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="130" font-size="19.5" font-weight="600" fill="#475569">the jobs, sorted by start</text>
<line x1="116" y1="340" x2="1164" y2="340" stroke="#94A3B8" stroke-width="1.5"/>
<line x1="130" y1="335" x2="130" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="130" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<line x1="232" y1="335" x2="232" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="232" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<line x1="334" y1="335" x2="334" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="334" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<line x1="436" y1="335" x2="436" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="436" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<line x1="538" y1="335" x2="538" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="538" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<line x1="640" y1="335" x2="640" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="640" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">5</text>
<line x1="742" y1="335" x2="742" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="742" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">6</text>
<line x1="844" y1="335" x2="844" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="844" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">7</text>
<line x1="946" y1="335" x2="946" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="946" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">8</text>
<line x1="1048" y1="335" x2="1048" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1048" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">9</text>
<line x1="1150" y1="335" x2="1150" y2="345" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1150" y="364" text-anchor="middle" font-size="15.5" fill="#94A3B8">10</text>
<rect x="232" y="156" width="306" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="385" y="179.5" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">1, 4  load 3</text>
<rect x="334" y="202" width="306" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="487" y="225.5" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">2, 5  load 4</text>
<rect x="844" y="248" width="204" height="34" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="946" y="271.5" text-anchor="middle" font-size="18" font-weight="600" fill="#1D4ED8">7, 9  load 6</text>
<rect x="40" y="400" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="60" y="430" font-size="19.5" font-weight="600" fill="#475569">the result so far</text>
<rect x="110" y="446" width="320" height="50" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="270" y="477.5" text-anchor="middle" font-size="18" fill="#94A3B8">nothing yet</text>
<rect x="40" y="536" width="1160" height="78" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="576" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">the same shape as counting rooms, with a load instead of a count</text>
<text x="620" y="608" text-anchor="middle" font-size="18.5" fill="#475569">jobs that run together add their loads, so the answer is the largest total at any moment</text>
</svg>