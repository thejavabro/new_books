<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: the user places an order with the checkout service, checkout calls the recommendations service synchronously, recommendations hangs, checkout waits forever, and the timeout failure propagates back to the user.">
  <defs>
    <marker id="m01-l04-sync-coupling-sequence-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m01-l04-sync-coupling-sequence-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m01-l04-sync-coupling-sequence-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <filter id="m01-l04-sync-coupling-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="200" y1="104" x2="200" y2="600"/>
    <line x1="620" y1="104" x2="620" y2="600"/>
    <line x1="1040" y1="104" x2="1040" y2="600"/>
  </g>

  
  <text x="55" y="150" text-anchor="middle" font-size="20" fill="#64748B">time</text>
  <line x1="55" y1="170" x2="55" y2="560" stroke="#94A3B8" stroke-width="2" marker-end="url(#m01-l04-sync-coupling-sequence-sl)"/>

  
  <g fill="none">
    <path d="M206,190 L614,190" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m01-l04-sync-coupling-sequence-bl)"/>
    <path d="M626,270 L1034,270" stroke="#3B82F6" stroke-width="3" marker-end="url(#m01-l04-sync-coupling-sequence-bl)"/>
    <path d="M614,510 L206,510" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m01-l04-sync-coupling-sequence-rd)"/>
  </g>

  
  <rect x="192" y="182" width="16" height="336" rx="2" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <rect x="612" y="186" width="16" height="332" rx="2" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="1032" y="266" width="16" height="310" rx="2" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

  
  <g filter="url(#m01-l04-sync-coupling-sequence-soft)">
    <rect x="110" y="40" width="180" height="64" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="200" y="79" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>

  <g filter="url(#m01-l04-sync-coupling-sequence-soft)">
    <rect x="480" y="40" width="280" height="64" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="79" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout service</text>

  <g filter="url(#m01-l04-sync-coupling-sequence-soft)">
    <rect x="880" y="40" width="320" height="64" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1040" y="79" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Recommendations service</text>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="410" y="178" fill="#1E40AF">Place order</text>
    <text x="830" y="230" fill="#1E40AF">Get recommendations</text>
    <text x="830" y="258" fill="#1E40AF">(synchronous call)</text>
    <text x="410" y="498" fill="#B91C1C">Checkout times out too</text>
  </g>

  
  <g filter="url(#m01-l04-sync-coupling-sequence-soft)">
    <rect x="890" y="310" width="300" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1040" y="347" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Recommendations hangs</text>

  <g filter="url(#m01-l04-sync-coupling-sequence-soft)">
    <rect x="475" y="400" width="290" height="60" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="620" y="437" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Checkout waits forever</text>

  
  <g stroke-width="4" fill="none">
    <line x1="40" y1="650" x2="74" y2="650" stroke="#3B82F6"/>
    <line x1="40" y1="690" x2="74" y2="690" stroke="#DC2626" stroke-dasharray="6 5"/>
  </g>
  <text x="84" y="657" font-size="20" fill="#475569">Synchronous call: the caller stops and waits for the answer</text>
  <text x="84" y="697" font-size="20" fill="#475569">Failure propagating back to the caller</text>
</svg>