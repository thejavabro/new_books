<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="deploy-title deploy-desc">
<title id="deploy-title">The boundary people skip</title>
<desc id="deploy-desc">Most total outages are caused by a change rather than by hardware, and the radius of a change is set by how it is rolled out. Teams with excellent redundancy frequently deploy to all of it at once.</desc>
<defs>
<marker id="deploy-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="deploy-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="deploy-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="deploy-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="842" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The boundary people skip</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Most total outages are caused by a change rather than by hardware.</text>
<rect x="40" y="764" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="764" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="152" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A deploy that reaches everything at once has the blast radius of having no redundancy</text>
<circle cx="60" cy="218" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="225" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="188" width="430" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="305" y="224" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One instance</text>
<path d="M526 218H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 218H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-slate)"/>
<rect x="570" y="188" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="211.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">compared against the others, catching</text><text x="590" y="236.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">anything that fails immediately</text>
<circle cx="60" cy="290" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="297" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="260" width="430" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="305" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">One zone or cell</text>
<path d="M526 290H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 290H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-slate)"/>
<rect x="570" y="260" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">held long enough for real traffic patterns to exercise it</text>
<circle cx="60" cy="362" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="369" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="332" width="430" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="305" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The rest, progressively</text>
<path d="M526 362H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 362H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-slate)"/>
<rect x="570" y="332" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="368" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">with an automatic halt on a health signal</text>
<text x="40" y="434" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three things that make it real rather than for show</text>
<rect x="40" y="452" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="488" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A waiting period long enough</text>
<path d="M526 482H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 482H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-green)"/>
<rect x="570" y="452" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="475.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">memory leaks, filling disks and gradual</text><text x="590" y="500.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">corruption do not fail on request one</text>
<rect x="40" y="524" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="560" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An automatic halt</text>
<path d="M526 554H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 554H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-green)"/>
<rect x="570" y="524" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="547.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if it stops only when somebody notices,</text><text x="590" y="572.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the radius is set by attention span</text>
<rect x="40" y="596" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="632" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A comparison, not a threshold</text>
<path d="M526 626H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 626H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#deploy-marker-green)"/>
<rect x="570" y="596" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="632" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">judged against the old version running at the same moment</text>
<rect x="40" y="674" width="1160" height="64" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="674" width="5" height="64" rx="2.5" fill="#AC8BE8"/><text x="64" y="699" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Configuration is the most common cause of simultaneous global failure</text><text x="64" y="725" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It is distributed instantly to everything by design, and needs the same rollout as code.</text>
<text x="66" y="798" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Almost nowhere gives configuration the protection the code path already has.</text>
</svg>