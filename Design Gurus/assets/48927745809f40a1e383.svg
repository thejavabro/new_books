<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients A, B, and C request the same report at the same moment, and it is not cached. The proxy combines them into one request. The server reads the report from disk once, and the proxy returns the result to all three clients.">
  <defs>
    <filter id="pr3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pr3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pr3-k1"><rect x="40" y="140" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr3-k2"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr3-k3"><rect x="40" y="440" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr3-k4"><rect x="470" y="290" width="300" height="90" rx="12"/></clipPath>
    <marker id="pr3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="pr3-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pr3-s-amber" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Collapsed forwarding</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three identical requests for data that is not cached. The server reads the data only once.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,185 H400 Q415,185 415,200 V300 Q415,315 430,315 H470" stroke="#64748B" marker-end="url(#pr3-m-slate)"/>
    <path d="M300,335 H470" stroke="#64748B" marker-end="url(#pr3-m-slate)"/>
    <path d="M300,485 H400 Q415,485 415,470 V370 Q415,355 430,355 H470" stroke="#64748B" marker-end="url(#pr3-m-slate)"/>
    <path d="M770,335 H918" stroke="#D97706" marker-end="url(#pr3-m-amber)" marker-start="url(#pr3-s-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="845" y="323" fill="#B45309">1 request</text>
  </g>

  <g filter="url(#pr3-soft)">
    <rect x="40" y="140" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#pr3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Client A</text>
  <text x="170" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">GET /report</text>
  <g filter="url(#pr3-soft)">
    <rect x="40" y="290" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#pr3-k2)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Client B</text>
  <text x="170" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">GET /report</text>
  <g filter="url(#pr3-soft)">
    <rect x="40" y="440" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="440" width="6" height="90" fill="#64748B" clip-path="url(#pr3-k3)"/>
  </g>
  <circle cx="78" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,474.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="492" font-size="21.5" font-weight="600" fill="#111827">Client C</text>
  <text x="170" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">GET /report</text>
  <g filter="url(#pr3-lift)">
    <rect x="470" y="290" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="470" y="290" width="9" height="90" fill="#D97706" clip-path="url(#pr3-k4)"/>
  </g>
  <circle cx="508" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,324.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="534" y="342" font-size="21.5" font-weight="600" fill="#111827">Proxy</text>
  <text x="620" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">combines them into one</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M920,285 L920,369 A130,16 0 0 0 1180,369 L1180,285" fill="#E0E7FF"/>
    <ellipse cx="1050" cy="285" rx="130" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="1050" y="342" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="1050" y="419" font-size="18.5" text-anchor="middle" fill="#6B7280">reads the data once</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Collapsed</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">identical requests for uncached data are combined into one request</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Result</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">the data is read from disk once, and every client gets the same answer</text>
</svg>