<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One machine has no internal network so no partition can happen inside it, but the moment the system spans two machines a link exists and links break">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="cp7-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="cp7-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="330" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="78" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">One machine: CA is possible</text>

  <rect x="640" y="40" width="580" height="330" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="78" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Two machines: CA is gone</text>

  <line x1="310" y1="196" x2="310" y2="232" stroke="#475569" stroke-width="2.5" marker-end="url(#cp7-slate)"/>
  <line x1="880" y1="230" x2="908" y2="230" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="952" y1="230" x2="980" y2="230" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4"/>
  <path d="M914,214 L946,246 M946,214 L914,246" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>

  <rect x="80" y="108" width="460" height="196" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="310" y="140" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">a single server</text>

  <g filter="url(#cp7-soft)">
    <rect x="130" y="158" width="360" height="60" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="130" y="234" width="360" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="670" y="130" width="210" height="200" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="980" y="130" width="210" height="200" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="310" y="196" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">application</text>
  <text x="310" y="272" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">database</text>
  <text x="775" y="180" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Machine A</text>
  <text x="775" y="290" font-size="20" fill="#64748B" text-anchor="middle">holds a copy</text>
  <text x="1085" y="180" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Machine B</text>
  <text x="1085" y="290" font-size="20" fill="#64748B" text-anchor="middle">holds a copy</text>

  <text x="310" y="410" font-size="20" fill="#475569" text-anchor="middle">No network runs between its parts,</text>
  <text x="310" y="442" font-size="20" fill="#475569" text-anchor="middle">so no partition can occur inside it.</text>
  <text x="930" y="410" font-size="20" fill="#475569" text-anchor="middle">A link now exists between the copies,</text>
  <text x="930" y="442" font-size="20" fill="#475569" text-anchor="middle">and any link can go down.</text>
</svg>