<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="820" viewBox="0 0 1240 820" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two tracks compared: a thin event carries only the order ID, so the consumer makes a synchronous callback to the Orders API and availability becomes coupled to Orders; a fat event carries items, totals and addresses, so the consumer keeps a local copy with no callback and pays with a bigger contract and duplicated data.">
  <defs>
    <marker id="m03-l04-thin-vs-fat-events-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m03-l04-thin-vs-fat-events-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l04-thin-vs-fat-events-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m03-l04-thin-vs-fat-events-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m03-l04-thin-vs-fat-events-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m03-l04-thin-vs-fat-events-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="820" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="280" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#334155">Thin event (notification style)</text>
  <text x="1178" y="98" text-anchor="end" font-size="20" fill="#64748B">the contract stays simple, but the callback returns</text>
  <rect x="40" y="380" width="1160" height="280" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="418" font-size="20" font-weight="600" fill="#334155">Fat event (event-carried state transfer)</text>
  <text x="1178" y="418" text-anchor="end" font-size="20" fill="#64748B">consumers stay independent, and you pay in contract size</text>

  <path d="M318,225 L354,225" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-am)"/>
  <path d="M606,225 L642,225" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-bl)"/>
  <path d="M894,225 L930,225" fill="none" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-red)"/>
  <path d="M318,545 L354,545" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-am)"/>
  <path d="M606,545 L642,545" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-em)"/>
  <path d="M894,545 L930,545" fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#m03-l04-thin-vs-fat-events-sl)"/>

  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="70" y="150" width="248" height="150" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="194" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event carries</text>
  <text x="194" y="232" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the order ID only</text>
  <text x="194" y="264" text-anchor="middle" font-size="20" fill="#64748B">and little else</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="358" y="150" width="248" height="150" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="482" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumer</text>
  <text x="482" y="232" text-anchor="middle" font-size="20" fill="#64748B">Fulfillment,</text>
  <text x="482" y="264" text-anchor="middle" font-size="20" fill="#64748B">Analytics, Loyalty</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="646" y="150" width="248" height="150" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="770" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Synchronous callback</text>
  <text x="770" y="232" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">to the Orders API</text>
  <text x="770" y="264" text-anchor="middle" font-size="20" fill="#64748B">the consumer waits</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="934" y="150" width="248" height="150" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="1058" y="200" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Availability now</text>
  <text x="1058" y="232" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">coupled to Orders</text>
  <text x="1058" y="264" text-anchor="middle" font-size="20" fill="#64748B">chattiness at scale</text>

  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="70" y="470" width="248" height="150" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="194" y="520" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event carries items,</text>
  <text x="194" y="552" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">totals, addresses</text>
  <text x="194" y="584" text-anchor="middle" font-size="20" fill="#64748B">the order data</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="358" y="470" width="248" height="150" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="482" y="520" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumer</text>
  <text x="482" y="552" text-anchor="middle" font-size="20" fill="#64748B">Fulfillment,</text>
  <text x="482" y="584" text-anchor="middle" font-size="20" fill="#64748B">Analytics, Loyalty</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="646" y="470" width="248" height="150" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="770" y="520" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Keeps a local copy,</text>
  <text x="770" y="552" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">no callback</text>
  <text x="770" y="584" text-anchor="middle" font-size="20" fill="#64748B">decoupling preserved</text>
  <g filter="url(#m03-l04-thin-vs-fat-events-soft)">
    <rect x="934" y="470" width="248" height="150" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1058" y="520" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Bigger contract,</text>
  <text x="1058" y="552" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">duplicated data</text>
  <text x="1058" y="584" text-anchor="middle" font-size="20" fill="#64748B">copied per consumer</text>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="336" y="140" fill="#92400E">delivered async</text>
    <text x="624" y="140" fill="#1E40AF">needs details not in the event</text>
    <text x="912" y="140" fill="#B91C1C">Orders API must be up</text>
    <text x="336" y="460" fill="#92400E">delivered async</text>
    <text x="624" y="460" fill="#065F46">details ride inside the event</text>
    <text x="912" y="460" fill="#475569">the trade you accept</text>
  </g>

  <line x1="50" y1="710" x2="86" y2="710" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="717" font-size="20" fill="#475569">Thin: a synchronous callback, so the consumer waits on Orders</text>
  <line x1="50" y1="750" x2="86" y2="750" stroke="#059669" stroke-width="4"/>
  <text x="98" y="757" font-size="20" fill="#475569">Fat: no callback, so the consumer stays independent</text>
</svg>