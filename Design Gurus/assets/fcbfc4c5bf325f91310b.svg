<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="limits-title limits-desc">
<title id="limits-title">Capacity, limits and failure</title>
<desc id="limits-desc">The operational properties need the same treatment as any other dependency, with a degradation ladder decided before it is needed.</desc>
<defs>
<marker id="limits-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="limits-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="limits-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="limits-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="880" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Capacity, limits and failure</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The operational properties need the same treatment as any other dependency.</text>
<rect x="40" y="802" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="802" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Two timeouts</text>
<path d="M526 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#limits-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one for the first token, one for the whole response</text>
<rect x="40" y="186" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A retry budget</text>
<path d="M526 214H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 214H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#limits-marker-slate)"/>
<rect x="570" y="186" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a retried generation is a full second cost</text>
<rect x="40" y="254" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Provider rate limits</text>
<path d="M526 282H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 282H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#limits-marker-slate)"/>
<rect x="570" y="254" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="275.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">expressed in requests and tokens, and tokens</text><text x="590" y="300.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">bind first on long prompts</text>
<rect x="40" y="322" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Queue, do not drop</text>
<path d="M526 350H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 350H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#limits-marker-slate)"/>
<rect x="570" y="322" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a bounded queue turns a rate limit from an error into a wait</text>
<text x="40" y="418" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The degradation ladder, decided in advance</text>
<rect x="40" y="436" width="300" height="48" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="466" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">normal</text>
<text x="356" y="467" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">the capable model, full context</text>
<rect x="40" y="492" width="300" height="48" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">under pressure</text>
<text x="356" y="523" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">a smaller model, shorter context</text>
<rect x="40" y="548" width="300" height="48" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="578" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">further</text>
<text x="356" y="579" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">a cached or templated response</text>
<rect x="40" y="604" width="300" height="48" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="190" y="634" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">floor</text>
<text x="356" y="635" font-size="20" font-weight="400" fill="#4A5568" text-anchor="start">a clear refusal with an explanation</text>
<rect x="840" y="452" width="360" height="160" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="840" y="452" width="5" height="160" rx="2.5" fill="#AC8BE8"/><text x="864" y="497.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">And model output is not</text><text x="864" y="524.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">trusted input: anything</text><text x="864" y="551.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">executed, queried or</text><text x="864" y="578.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">rendered crosses a boundary</text>
<rect x="40" y="676" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="676" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="706" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Cost is an availability concern</text><text x="64" y="732" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">An unbounded per-request cost leads to a bill that forces an emergency shutdown,</text><text x="64" y="758" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">which is an outage caused by accounting. Per-tenant token quotas are the fix.</text>
<text x="66" y="836" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Retrying into an overloaded inference service is the classic amplification case.</text>
</svg>