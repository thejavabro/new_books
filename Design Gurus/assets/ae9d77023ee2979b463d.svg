    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="748" y="226" font-size="18.5" font-weight="600" fill="#111827">storage_quota_exceeded</text>
  <rect x="1078" y="204" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1109" y="224" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">403</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,279 L697,290 M697,279 L686,290"/>
  </g>
  <text x="712" y="290" font-size="15.5" fill="#6B7280">No remaining storage quota</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,310 L690.5,314.5 L698,304.5"/>
  </g>
  <text x="712" y="316" font-size="15.5" fill="#6B7280">Free space or buy more; waiting will not help</text>

  
  <rect x="644" y="354" width="556" height="392" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="668" y="384" font-size="16.5" font-weight="600" fill="#475569">409 Conflict and 410 Gone</text>
  <text x="1176" y="384" text-anchor="end" font-size="15.5" fill="#6B7280">two failures</text>

  
  <g filter="url(#pq-soft)">
    <rect x="684" y="402" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="402" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k6)"/>
  </g>
  <circle cx="722" cy="447" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,436.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="748" y="454" font-size="18.5" font-weight="600" fill="#111827">upload_already_completed</text>
  <rect x="1078" y="432" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1109" y="452" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">409</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,507 L697,518 M697,507 L686,518"/>
  </g>
  <text x="712" y="518" font-size="15.5" fill="#6B7280">A write arrived after completion</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,538 L690.5,542.5 L698,532.5"/>
  </g>
  <text x="712" y="544" font-size="15.5" fill="#6B7280">Use the created file</text>

  
  <g filter="url(#pq-soft)">
    <rect x="684" y="582" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="582" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k7)"/>
  </g>
  <circle cx="722" cy="627" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,616.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="748" y="634" font-size="18.5" font-weight="600" fill="#111827">upload_session_expired</text>
  <rect x="1078" y="612" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1109" y="632" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">410</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,687 L697,698 M697,687 L686,698"/>
  </g>
  <text x="712" y="698" font-size="15.5" fill="#6B7280">The session passed its expires_at</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,718 L690.5,722.5 L698,712.5"/>
  </g>
  <text x="712" y="724" font-size="15.5" fill="#6B7280">Create a new session</text>

  
  <rect x="40" y="902" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="944" text-anchor="middle" font-size="16" fill="#475569">Rejecting a five gigabyte file after the fifth gigabyte wastes the caller's time and data.</text>
  <text x="620" y="972" text-anchor="middle" font-size="16" fill="#475569">Metadata cannot prove bytes match the claimed type. Name any later check in advance.</text>
</svg>