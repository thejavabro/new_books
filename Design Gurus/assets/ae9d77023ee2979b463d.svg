<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1042" viewBox="0 0 1240 1042" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven named transfer failures, grouped by status code, each with its stable code, the condition that fails, and the caller action. Rejecting a five gigabyte file after the fifth gigabyte wastes the caller&#39;s time and data, so every limit is published before transfer begins.">
  <defs>
    <filter id="pq-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pq-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pq-k1"><rect x="84" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k2"><rect x="84" y="354" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k3"><rect x="84" y="534" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k4"><rect x="84" y="714" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k5"><rect x="684" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k6"><rect x="684" y="402" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="pq-k7"><rect x="684" y="582" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1042" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Publish every limit before accepting one byte</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M700,66 L711,77 M711,66 L700,77"/>
  </g>
  <text x="723" y="77" font-size="15.5" fill="#6B7280">the condition</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M880,71 L884.5,75.5 L892,65.5"/>
  </g>
  <text x="906" y="77" font-size="15.5" fill="#6B7280">the caller action</text>

  
  <rect x="40" y="126" width="556" height="752" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">400 Bad Request</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  
  <g filter="url(#pq-lift)">
    <rect x="84" y="174" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="84" y="174" width="9" height="90" fill="#DB2777" clip-path="url(#pq-k1)"/>
  </g>
  <circle cx="122" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,208.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3h8l5 5v13H6z"/>
    <path d="M14 3v5h5"/>
    <path d="M9 13.5h6M9 17.5h4"/>
  </g>
  <text x="148" y="226" font-size="18.5" font-weight="600" fill="#111827">file_too_large</text>
  <rect x="478" y="204" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="509" y="224" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,279 L97,290 M97,279 L86,290"/>
  </g>
  <text x="112" y="290" font-size="15.5" fill="#6B7280">The declared size is above the maximum</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,310 L90.5,314.5 L98,304.5"/>
  </g>
  <text x="112" y="316" font-size="15.5" fill="#6B7280">Choose a smaller file</text>

  
  <g filter="url(#pq-soft)">
    <rect x="84" y="354" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="354" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k2)"/>
  </g>
  <circle cx="122" cy="399" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,388.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="148" y="406" font-size="18.5" font-weight="600" fill="#111827">unsupported_content_type</text>
  <rect x="478" y="384" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="509" y="404" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,459 L97,470 M97,459 L86,470"/>
  </g>
  <text x="112" y="470" font-size="15.5" fill="#6B7280">The declared type is not allowed</text>
