    <path d="M86,490 L90.5,494.5 L98,484.5"/>
  </g>
  <text x="112" y="496" font-size="15.5" fill="#6B7280">Use an allowed type</text>

  
  <g filter="url(#pq-soft)">
    <rect x="84" y="534" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="534" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k3)"/>
  </g>
  <circle cx="122" cy="579" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,568.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
