  </g>
  <text x="148" y="586" font-size="18.5" font-weight="600" fill="#111827">too_many_parts</text>
  <rect x="478" y="564" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="509" y="584" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,639 L97,650 M97,639 L86,650"/>
  </g>
  <text x="112" y="650" font-size="15.5" fill="#6B7280">The part plan exceeds maximum_parts</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,670 L90.5,674.5 L98,664.5"/>
  </g>
  <text x="112" y="676" font-size="15.5" fill="#6B7280">Use the published part size</text>

  
  <g filter="url(#pq-soft)">
    <rect x="84" y="714" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="714" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k4)"/>
  </g>
  <circle cx="122" cy="759" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,748.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="148" y="766" font-size="18.5" font-weight="600" fill="#111827">checksum_mismatch</text>
  <rect x="478" y="744" width="62" height="30" rx="9" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="509" y="764" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,819 L97,830 M97,819 L86,830"/>
  </g>
  <text x="112" y="830" font-size="15.5" fill="#6B7280">A part's bytes do not match its part checksum</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,850 L90.5,854.5 L98,844.5"/>
  </g>
  <text x="112" y="856" font-size="15.5" fill="#6B7280">Resend only the affected part</text>

  
  <rect x="644" y="126" width="556" height="212" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#475569">403 Forbidden</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">one failure</text>

  
  <g filter="url(#pq-soft)">
    <rect x="684" y="174" width="472" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="90" fill="#DB2777" clip-path="url(#pq-k5)"/>
  </g>
  <circle cx="722" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,208.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
