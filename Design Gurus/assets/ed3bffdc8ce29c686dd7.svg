<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels around the domain hexagon of entities, business rules and use cases. Driving ports (inbound ports) define what the system can do and how external actors invoke it: web and REST, CLI and queue consumer adapters call the driving port interface, which defines the operations the application offers. Driven ports (outbound ports) define what the system needs from the outside world: database, payment and notification adapters implement the driven port interface, which defines what the domain needs from the outside. Every arrow is a dependency and points toward the domain">
