  <rect x="545" y="465" width="150" height="34" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="488" text-anchor="middle" font-size="17" fill="#1F2937">Business rules</text>
  <rect x="545" y="509" width="150" height="34" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="532" text-anchor="middle" font-size="17" fill="#1F2937">Use cases</text>
  <text x="384" y="645" text-anchor="middle" font-size="18.5" fill="#6B7280">Defines the operations</text>
