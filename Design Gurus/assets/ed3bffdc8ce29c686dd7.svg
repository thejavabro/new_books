  <text x="1018" y="560.75" font-size="18.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1018" y="583.25" font-size="18.5" font-weight="600" fill="#111827">adapter</text>
  <text x="64" y="182" font-size="18.5" fill="#475569">Define what the system can do and how external</text>
  <text x="64" y="209" font-size="18.5" fill="#475569">actors can invoke the application.</text>
  <text x="654" y="182" font-size="18.5" fill="#475569">Define what the system needs from the outside</text>
  <text x="654" y="209" font-size="18.5" fill="#475569">world to complete its work.</text>
  <text x="342" y="467.5" font-size="18.5" fill="#475569">(interface)</text>
  <text x="814" y="467.5" font-size="18.5" fill="#475569">(interface)</text>

