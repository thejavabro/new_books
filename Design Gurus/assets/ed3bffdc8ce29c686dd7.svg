    <marker id="m10d-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Driving ports vs. driven ports</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every arrow is a dependency and points toward the domain: driving adapters call a port, driven adapters implement one.</text>

