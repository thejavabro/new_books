<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="744" viewBox="0 0 1240 744" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In the safe path a credential is verified and produces caller_id, tenant_id and scopes, which enter the order operation together. In the unsafe path a tenant id taken from the URL flows straight into the database query, so every handler must remember to compare it against the caller&#39;s membership.">
  <defs>
    <marker id="p1c-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p1c-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p1c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1c-k1"><rect x="72" y="219" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="p1c-k2"><rect x="334" y="219" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p1c-k3"><rect x="586" y="176" width="230" height="48" rx="10"/></clipPath>
    <clipPath id="p1c-k4"><rect x="586" y="240" width="230" height="48" rx="10"/></clipPath>
    <clipPath id="p1c-k5"><rect x="586" y="304" width="230" height="48" rx="10"/></clipPath>
    <clipPath id="p1c-k6"><rect x="876" y="219" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p1c-k7"><rect x="72" y="466" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p1c-k8"><rect x="554" y="466" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p1c-k9"><rect x="916" y="466" width="260" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="744" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Where tenant context comes from</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">safe above, unsafe below</text>

  
  <rect x="40" y="118" width="1160" height="262" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="148" font-size="16.5" font-weight="600" fill="#047857">Safe: the verified credential supplies the boundary</text>
  <text x="1176" y="148" text-anchor="end" font-size="15.5" fill="#6B7280">All three values enter the operation together.</text>

  
  <g fill="none" stroke-width="2">
    <path d="M272,264 H334" stroke="#059669" marker-end="url(#p1c-em)"/>
    <path d="M524,264 H548 Q560,264 560,252 V212 Q560,200 572,200 H586" stroke="#059669" marker-end="url(#p1c-em)"/>
    <path d="M524,264 H586" stroke="#059669" marker-end="url(#p1c-em)"/>
    <path d="M524,264 H548 Q560,264 560,276 V316 Q560,328 572,328 H586" stroke="#059669" marker-end="url(#p1c-em)"/>
    <path d="M816,200 H840 Q852,200 852,212 V252 Q852,264 864,264" stroke="#059669"/>
    <path d="M816,328 H840 Q852,328 852,316 V276 Q852,264 864,264" stroke="#059669"/>
    <path d="M816,264 H876" stroke="#059669" stroke-width="2.5" marker-end="url(#p1c-em)"/>
  </g>

  
  <g filter="url(#p1c-soft)">
    <rect x="72" y="219" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="219" width="6" height="90" fill="#059669" clip-path="url(#p1c-k1)"/>
  </g>
  <circle cx="110" cy="264" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,253.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="136" y="271" font-size="18.5" font-weight="600" fill="#111827">Credential</text>

  
  <g filter="url(#p1c-lift)">
    <rect x="334" y="219" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="334" y="219" width="9" height="90" fill="#059669" clip-path="url(#p1c-k2)"/>
  </g>
  <circle cx="372" cy="264" r="18" fill="#FFFFFF"/>
  <g transform="translate(361.56,253.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="398" y="271" font-size="18.5" font-weight="600" fill="#111827">Verify</text>

  
  <g filter="url(#p1c-soft)">
    <rect x="586" y="176" width="230" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="586" y="176" width="6" height="48" fill="#059669" clip-path="url(#p1c-k3)"/>
  </g>
  <circle cx="620" cy="200" r="4.5" fill="#059669"/>
  <text x="644" y="207" font-size="18.5" font-weight="600" fill="#111827">caller_id</text>

  <g filter="url(#p1c-soft)">
    <rect x="586" y="240" width="230" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="586" y="240" width="6" height="48" fill="#059669" clip-path="url(#p1c-k4)"/>
  </g>
  <circle cx="620" cy="264" r="4.5" fill="#059669"/>
  <text x="644" y="271" font-size="18.5" font-weight="600" fill="#111827">tenant_id</text>

  <g filter="url(#p1c-soft)">
    <rect x="586" y="304" width="230" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="586" y="304" width="6" height="48" fill="#059669" clip-path="url(#p1c-k5)"/>
  </g>
  <circle cx="620" cy="328" r="4.5" fill="#059669"/>
  <text x="644" y="335" font-size="18.5" font-weight="600" fill="#111827">scopes</text>

  
  <g filter="url(#p1c-soft)">
    <rect x="876" y="219" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="876" y="219" width="6" height="90" fill="#059669" clip-path="url(#p1c-k6)"/>
  </g>
  <circle cx="914" cy="264" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,253.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="940" y="271" font-size="18.5" font-weight="600" fill="#111827">GET /orders/ord_81M</text>
  <text x="1026" y="334" font-size="15.5" text-anchor="middle" fill="#6B7280">resolved inside the tenant</text>

  
  <rect x="40" y="404" width="1160" height="204" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="434" font-size="16.5" font-weight="600" fill="#BE185D">Unsafe: the caller chooses the boundary</text>
  <text x="1176" y="434" text-anchor="end" font-size="15.5" fill="#6B7280">Every handler, query and cache key must remember the membership check.</text>

  
  <g fill="none" stroke-width="2">
    <path d="M492,511 H554" stroke="#DB2777" marker-end="url(#p1c-pm)"/>
    <path d="M854,511 H916" stroke="#DB2777" marker-end="url(#p1c-pm)"/>
  </g>

  
  <g filter="url(#p1c-soft)">
    <rect x="72" y="466" width="420" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="466" width="6" height="90" fill="#DB2777" clip-path="url(#p1c-k7)"/>
  </g>
  <circle cx="110" cy="511" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,500.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="136" y="518" font-size="18.5" font-weight="600" fill="#111827">/tenants/tenant_91P/orders/...</text>
  <text x="282" y="581" font-size="15.5" text-anchor="middle" fill="#6B7280">tenant id taken from the URL</text>

  
  <g filter="url(#p1c-lift)">
    <rect x="554" y="466" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="554" y="466" width="9" height="90" fill="#DB2777" clip-path="url(#p1c-k8)"/>
  </g>
  <circle cx="592" cy="511" r="18" fill="#FFFFFF"/>
  <g transform="translate(581.56,500.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="618" y="518" font-size="18.5" font-weight="600" fill="#111827">Database query</text>
  <text x="704" y="581" font-size="15.5" text-anchor="middle" fill="#6B7280">the query trusts that value</text>

  
  <g filter="url(#p1c-soft)">
    <rect x="916" y="466" width="260" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="916" y="466" width="6" height="90" fill="#DB2777" clip-path="url(#p1c-k9)"/>
  </g>
  <circle cx="954" cy="511" r="18" fill="#FFFFFF"/>
  <g transform="translate(943.56,500.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="980" y="518" font-size="18.5" font-weight="600" fill="#111827">Unchecked</text>
  <text x="1046" y="581" font-size="15.5" text-anchor="middle" fill="#6B7280">no membership check</text>

  
  <rect x="40" y="628" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="673" text-anchor="middle" font-size="16" fill="#475569">Tenant context is trusted identity, not ordinary caller input.</text>
</svg>