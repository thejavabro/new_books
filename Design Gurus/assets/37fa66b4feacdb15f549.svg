<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="five-title five-desc">
<title id="five-title">The same problem, two team sizes</title>
<desc id="five-desc">At five engineers every system is a second job for somebody, on-call is one week in five, nobody is a specialist, and a one-quarter migration is five percent of annual output. At eighty engineers none of that holds.</desc>
<defs>
<marker id="five-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="five-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="five-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="five-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The same problem, two team sizes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Small teams are not scaled-down large teams.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="404" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V516A6 6 0 0 0 46 522H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Five engineers</text>
<rect x="72" y="174" width="500" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="196.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Three or four systems</text><text x="322" y="223.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">in production is the ceiling</text>
<rect x="72" y="240" width="500" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="276" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On-call is one week in five, for everyone</text>
<rect x="72" y="306" width="500" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Every engineer must debug every system</text>
<rect x="72" y="372" width="500" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nobody is a specialist in anything</text>
<rect x="72" y="438" width="500" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="460.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A one-quarter migration</text><text x="322" y="487.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is five percent of the year</text>
<rect x="640" y="118" width="560" height="404" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V516A6 6 0 0 0 646 522H654Z" fill="#5EC9EC"/><text x="670" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Eighty engineers</text>
<rect x="672" y="174" width="500" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="922" y="210" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Dozens of services are normal</text>
<rect x="672" y="240" width="500" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="922" y="262.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">On-call is per team,</text><text x="922" y="289.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with specialists on each</text>
<rect x="672" y="306" width="500" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="922" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Nobody needs to understand all of it</text>
<rect x="672" y="372" width="500" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="922" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A platform team maintains the shared parts</text>
<rect x="672" y="438" width="500" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="922" y="460.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The same migration</text><text x="922" y="487.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is three tenths of one percent</text>
<rect x="40" y="546" width="560" height="146" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="546" width="5" height="146" rx="2.5" fill="#F3CF6A"/><text x="64" y="573" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Most published architecture advice comes from the</text><text x="64" y="599" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">right-hand column and is applied in interviews to</text><text x="64" y="625" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">problems that belong in the left-hand one.</text><text x="64" y="651" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The same decision has completely different weight</text><text x="64" y="677" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">on each side.</text>
<rect x="640" y="546" width="560" height="146" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="546" width="5" height="146" rx="2.5" fill="#AC8BE8"/><text x="664" y="584.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The question a small team actually asks</text><text x="664" y="611.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"What is the smallest number of systems that</text><text x="664" y="638.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">solves this, and can one of us debug each one</text><text x="664" y="665.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">at three in the morning?"</text>
<text x="66" y="752" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">On-call is a stronger argument for boring technology than any technical comparison.</text>
</svg>