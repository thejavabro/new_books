<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="918" viewBox="0 0 1240 918" role="img" aria-label="The system design master template arranged in six layers: how the request reaches you, where the work happens, where the data lives, how you make it fast, how you keep it alive, and where the data goes afterwards, each listing its components.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="918" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="40" width="9" height="128" rx="4" fill="#3B82F6"/>
  <circle cx="88" cy="84" r="21" fill="#3B82F6"/>
  <text x="88" y="91" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1</text>
  <text x="124" y="80" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">How the request reaches you</text>
  <text x="124" y="108" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Keep traffic away from your servers, and get what is left to a healthy one</text>
  <rect x="124" y="120" width="63" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="155.5" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">DNS</text>
  <rect x="197" y="120" width="63" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="228.5" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">CDN</text>
  <rect x="270" y="120" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="353.5" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Load Balancer</text>
  <rect x="447" y="120" width="146" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="520" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">API Gateway</text>
  <rect x="603" y="120" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="686.5" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Rate Limiting</text>
  <rect x="780" y="120" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="863.5" y="145" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reverse Proxy</text>
  <rect x="40" y="182" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="182" width="9" height="128" rx="4" fill="#6D28D9"/>
  <circle cx="88" cy="226" r="21" fill="#6D28D9"/>
  <text x="88" y="233" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">2</text>
  <text x="124" y="222" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Where the work happens</text>
  <text x="124" y="250" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Run the request, and push everything that can wait off the response path</text>
  <rect x="124" y="262" width="115" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="181.5" y="287" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Services</text>
  <rect x="249" y="262" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="332.5" y="287" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Message Queue</text>
  <rect x="426" y="262" width="219" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="535.5" y="287" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Real-time Delivery</text>
  <rect x="655" y="262" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="738.5" y="287" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Notifications</text>
  <rect x="832" y="262" width="198" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="931" y="287" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Full-text Search</text>
  <rect x="40" y="324" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="324" width="9" height="128" rx="4" fill="#059669"/>
  <circle cx="88" cy="368" r="21" fill="#059669"/>
  <text x="88" y="375" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">3</text>
  <text x="124" y="364" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Where the data lives</text>
  <text x="124" y="392" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The layer that decides whether the design actually works at this scale</text>
  <rect x="124" y="404" width="146" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="197" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">SQL / NoSQL</text>
  <rect x="280" y="404" width="84" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="322" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Index</text>
  <rect x="374" y="404" width="157" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="452.5" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Partitioning</text>
  <rect x="541" y="404" width="146" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="614" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Replication</text>
  <rect x="697" y="404" width="146" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="770" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Consistency</text>
  <rect x="853" y="404" width="178" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="942" y="429" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Object Storage</text>
  <rect x="40" y="466" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="466" width="9" height="128" rx="4" fill="#D97706"/>
  <circle cx="88" cy="510" r="21" fill="#D97706"/>
  <text x="88" y="517" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">4</text>
  <text x="124" y="506" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">How you make it fast</text>
  <text x="124" y="534" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every hop is a chance to answer without doing the work again</text>
  <rect x="124" y="546" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="207.5" y="571" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Browser cache</text>
  <rect x="301" y="546" width="126" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="364" y="571" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">CDN cache</text>
  <rect x="437" y="546" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="520.5" y="571" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Gateway cache</text>
  <rect x="614" y="546" width="126" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="677" y="571" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">App cache</text>
  <rect x="750" y="546" width="115" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="807.5" y="571" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">DB cache</text>
  <rect x="40" y="608" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="608" width="9" height="128" rx="4" fill="#DC2626"/>
  <circle cx="88" cy="652" r="21" fill="#DC2626"/>
  <text x="88" y="659" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">5</text>
  <text x="124" y="648" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">How you keep it alive</text>
  <text x="124" y="676" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">What a senior answer includes and a junior answer leaves out</text>
  <rect x="124" y="688" width="126" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="187" y="713" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Heartbeat</text>
  <rect x="260" y="688" width="115" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="317.5" y="713" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Checksum</text>
  <rect x="385" y="688" width="157" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="463.5" y="713" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Coordination</text>
  <rect x="552" y="688" width="167" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="635.5" y="713" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Observability</text>
  <rect x="40" y="750" width="1160" height="128" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5" filter="url(#sh)"/>
  <rect x="40" y="750" width="9" height="128" rx="4" fill="#14B8A6"/>
  <circle cx="88" cy="794" r="21" fill="#14B8A6"/>
  <text x="88" y="801" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">6</text>
  <text x="124" y="790" font-size="20" font-weight="600" fill="#0F766E" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Where the data goes afterwards</text>
  <text x="124" y="818" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A second path through the system, that nobody is waiting on</text>
  <rect x="124" y="830" width="94" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="171" y="855" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Events</text>
  <rect x="228" y="830" width="157" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="306.5" y="855" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Event Stream</text>
  <rect x="395" y="830" width="209" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="499.5" y="855" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Stream Processing</text>
  <rect x="614" y="830" width="198" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="713" y="855" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Batch Processing</text>
  <rect x="822" y="830" width="126" height="38" rx="9" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="885" y="855" font-size="20" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Warehouse</text>
</svg>