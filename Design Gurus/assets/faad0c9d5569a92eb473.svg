<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="556" viewBox="0 0 1240 556" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sorted array before the search">
<defs>
<filter id="md-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="556" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which number in [4, 6, 10] is closest to 7?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">7 is not in the array, so the answer is whichever neighbour it lands between</text>
<rect x="40" y="106" width="1160" height="294" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole array is still in range</text>
<rect x="456" y="198" width="328" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2.5"/>
<rect x="464" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="512" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="572" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<text x="620" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="680" y="206" width="96" height="64" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="245.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="728" y="292" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<path d="M503,324 L521,324 L512,310 Z" fill="#4F46E5"/>
<text x="512" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">start</text>
<path d="M719,324 L737,324 L728,310 Z" fill="#DB2777"/>
<text x="728" y="348" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">end</text>
<rect x="40" y="426" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="466" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Search as if looking for the key, then look at where the search stopped</text>
<text x="620" y="498" text-anchor="middle" font-size="18.5" fill="#475569">When the loop ends, start and end straddle the gap the key falls into</text>
</svg>