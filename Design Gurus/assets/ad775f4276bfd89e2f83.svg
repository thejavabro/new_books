<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="670" viewBox="0 0 1240 670" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="arith-title arith-desc">
<title id="arith-title">The arithmetic nobody did</title>
<desc id="arith-desc">Twenty four application instances holding forty pooled connections each is nine hundred and sixty connections. At thirty two thousand queries per second with a low millisecond service time, and sixteen cores, the database can use about thirty two at a time. The remainder is memory, processes and context switching.</desc>
<defs>
<marker id="arith-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="arith-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="arith-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="arith-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="670" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The arithmetic nobody did</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Twenty-four application instances at 40 connections each is 960 connections.</text>
<rect x="40" y="592" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="592" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<rect x="40" y="118" width="560" height="220" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V332A6 6 0 0 0 46 338H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">What the application holds</text>
<rect x="72" y="174" width="210" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="177" y="209" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">24 instances</text>
<text x="319" y="212" font-size="26" font-weight="700" fill="#080C50" text-anchor="middle">x</text>
<rect x="356" y="174" width="210" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="461" y="209" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pool of 40</text>
<text x="320" y="280" font-size="34" font-weight="700" fill="#A83147" text-anchor="middle">960 connections</text>
<text x="320" y="314" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">before cron, workers and reporting</text>
<rect x="640" y="118" width="560" height="220" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V332A6 6 0 0 0 646 338H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">What the database can use</text>
<text x="920" y="190" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">32,000 queries/sec  x  low-ms service time</text>
<text x="920" y="222" font-size="19" font-weight="400" fill="#080C50" text-anchor="middle">and 16 vCPU x 2</text>
<text x="920" y="280" font-size="34" font-weight="700" fill="#169B77" text-anchor="middle">about 32 executing</text>
<text x="920" y="314" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the rest are queueing, not working</text>
<text x="120" y="376" font-size="23" font-weight="700" fill="#4A5568" text-anchor="start">The gap</text>
<rect x="120" y="396" width="1000" height="44" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="120" y="396" width="1000.0" height="44" rx="10" fill="#F25461"/>
<rect x="120.0" y="396.0" width="34" height="44" rx="5" fill="#06AC80"/>
<text x="166" y="470" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">useful</text>
<text x="700" y="470" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">memory, processes and context switches</text>
<rect x="40" y="492" width="1160" height="74" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="492" width="5" height="74" rx="2.5" fill="#AC8BE8"/><text x="64" y="521.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Roughly thirty times more connections than the database can use,</text><text x="64" y="548.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">which explains a CPU number that rose with no change in the application.</text>
<text x="66" y="626" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is the cheapest credible intervention, and it was not one of the three options offered.</text>
</svg>