<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four monitoring layers, from system health that reacts in seconds to outcome quality that waits for real labels">
  <defs>
    <marker id="mdr1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="mdr1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mdr1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mdr1-k1"><rect x="64" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="mdr1-k2"><rect x="341" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="mdr1-k3"><rect x="618" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="mdr1-k4"><rect x="938" y="136" width="242" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <rect x="40" y="56" width="838" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">No labels needed</text>
  <rect x="918" y="56" width="282" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="942" y="86" font-size="16.5" font-weight="600" fill="#B45309">Needs real labels</text>
  <g fill="none" stroke="#64748B" stroke-width="1.5"><path d="M64,340 H1180" marker-end="url(#mdr1-mslate)"/></g>
  <text x="64" y="368" font-size="15.5" fill="#6B7280">cheapest and fastest</text>
  <text x="1180" y="368" font-size="15.5" text-anchor="end" fill="#6B7280">truest and slowest</text>
  <g filter="url(#mdr1-soft)">
    <rect x="64" y="136" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#mdr1-k1)"/>
  </g>
  <circle cx="102" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="64" y="124" font-size="15.5" font-weight="600" fill="#6B7280">seconds</text>
  <text x="128" y="188" font-size="18.5" font-weight="600" fill="#111827">1. System health</text>
  <text x="174" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">latency, error rate, freshness</text>
  <text x="174" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">catches outages and stale pipelines</text>
  <g filter="url(#mdr1-soft)">
    <rect x="341" y="136" width="220" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="341" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#mdr1-k2)"/>
  </g>
  <circle cx="379" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(368.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="341" y="124" font-size="15.5" font-weight="600" fill="#6B7280">minutes to hours</text>
  <text x="405" y="176" font-size="18.5" font-weight="600" fill="#111827">2. Input</text>
  <text x="405" y="199" font-size="18.5" font-weight="600" fill="#111827">distributions</text>
  <text x="451" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">feature values, null rates</text>
  <text x="451" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">catches data drift and broken inputs</text>
  <g filter="url(#mdr1-soft)">
    <rect x="618" y="136" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="618" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#mdr1-k3)"/>
  </g>
  <circle cx="656" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(645.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="618" y="124" font-size="15.5" font-weight="600" fill="#6B7280">minutes to hours</text>
  <text x="682" y="176" font-size="18.5" font-weight="600" fill="#111827">3. Prediction</text>
  <text x="682" y="199" font-size="18.5" font-weight="600" fill="#111827">distributions</text>
  <text x="728" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">average estimate, score shape</text>
  <text x="728" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">catches changes in what the model does</text>
  <g filter="url(#mdr1-lift)">
    <rect x="938" y="136" width="242" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="938" y="136" width="9" height="90" fill="#059669" clip-path="url(#mdr1-k4)"/>
  </g>
  <circle cx="976" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(965.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="938" y="124" font-size="15.5" font-weight="600" fill="#6B7280">about an hour to weeks</text>
  <text x="1002" y="188" font-size="18.5" font-weight="600" fill="#111827">4. Outcome quality</text>
  <text x="1059" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">ETA error, recall on confirmed fraud</text>
  <text x="1059" y="274" font-size="15.5" text-anchor="middle" fill="#94A3B8">the truth</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="888" y="187" fill="#B45309">label delay</text></g>
  <rect x="40" y="404" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="449" text-anchor="middle" font-size="16" fill="#475569">Layers 2 and 3 give an early warning while the labels for Layer 4 are still on their way.</text>
</svg>