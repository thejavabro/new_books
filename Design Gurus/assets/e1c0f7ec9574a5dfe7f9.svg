<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="770" viewBox="0 0 1240 770" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A unit test that covers only business logic creates a fake in-memory repository, calls the use case and verifies the results; the fake repository implements the interface that CreateOrderUseCase depends on; the use case in the Use Cases ring uses the Order entity with its business rules in the Entities ring; the real PostgresOrderRepository in the Interface Adapters ring also points inward to the use case through the same interface but is not needed for unit tests">
  <defs>
    <filter id="m11n-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11n-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11n-k1"><rect x="64" y="210" width="282" height="64" rx="12"/></clipPath>
    <clipPath id="m11n-k2"><rect x="64" y="500" width="282" height="90" rx="12"/></clipPath>
    <clipPath id="m11n-k3"><rect x="520" y="255" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="m11n-k4"><rect x="500" y="500" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m11n-k5"><rect x="896" y="500" width="290" height="90" rx="12"/></clipPath>
    <marker id="m11n-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="m11n-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m11n-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="770" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture: testing without infrastructure</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A unit test passes a fake repository to the use case, so the real database is never touched.</text>

  <rect x="40" y="125" width="330" height="605" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#475569">Unit test</text>
  <rect x="480" y="125" width="360" height="605" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="504" y="155" font-size="19.5" font-weight="600" fill="#B45309">Use Cases ring</text>
  <rect x="500" y="175" width="320" height="225" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="524" y="205" font-size="19.5" font-weight="600" fill="#4338CA">Entities ring</text>
  <rect x="880" y="125" width="320" height="605" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="904" y="155" font-size="19.5" font-weight="600" fill="#047857">Interface Adapters ring</text>

  <g fill="none" stroke-width="2">
    <path d="M205,438 V500" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#m11n-m-slate)"/>
    <path d="M346,545 H500" stroke="#059669" marker-end="url(#m11n-m-emerald)"/>
    <path d="M346,364 H408 Q420,364 420,376 V428 Q420,440 432,440 H548 Q560,440 560,452 V500" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#m11n-m-slate)"/>
    <path d="M660,500 V400" stroke="#D97706" stroke-dasharray="7 6" marker-end="url(#m11n-m-amber)"/>
    <path d="M896,545 H820" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#m11n-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="425" y="506" fill="#047857">Implements</text>
    <text x="425" y="530" fill="#047857">interface</text>
  </g>

  <g filter="url(#m11n-soft)">
    <rect x="64" y="210" width="282" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="210" width="6" height="64" fill="#64748B" clip-path="url(#m11n-k1)"/>
  </g>
  <circle cx="102" cy="242" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,231.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="249" font-size="21.5" font-weight="600" fill="#111827">Test</text>
  <g filter="url(#m11n-soft)">
    <rect x="64" y="500" width="282" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="500" width="6" height="90" fill="#059669" clip-path="url(#m11n-k2)"/>
  </g>
  <circle cx="102" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,534.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="552" font-size="21.5" font-weight="600" fill="#111827">Fake repository</text>
  <text x="205" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">in-memory</text>
  <g filter="url(#m11n-soft)">
    <rect x="520" y="255" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="520" y="255" width="6" height="90" fill="#4F46E5" clip-path="url(#m11n-k3)"/>
  </g>
  <circle cx="558" cy="300" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,289.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="584" y="307" font-size="21.5" font-weight="600" fill="#111827">Order</text>
  <text x="660" y="374" font-size="18.5" text-anchor="middle" fill="#6B7280">business rules</text>
  <g filter="url(#m11n-lift)">
    <rect x="500" y="500" width="320" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="500" y="500" width="9" height="90" fill="#D97706" clip-path="url(#m11n-k4)"/>
  </g>
  <circle cx="538" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,534.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="564" y="552" font-size="18.5" font-weight="600" fill="#111827">CreateOrderUseCase</text>
  <text x="660" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">depends on the</text>
  <text x="660" y="646" font-size="18.5" text-anchor="middle" fill="#94A3B8">OrderRepository interface</text>
  <g filter="url(#m11n-soft)">
    <rect x="896" y="500" width="290" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="896" y="500" width="6" height="90" fill="#059669" clip-path="url(#m11n-k5)"/>
  </g>
  <circle cx="934" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(923.56,534.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="960" y="552" font-size="17" font-weight="600" fill="#111827">PostgresOrderRepository</text>
  <text x="1041" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">database</text>
  <rect x="64" y="290" width="282" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <g transform="translate(78,301) scale(0.92)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="318.5" font-size="18.5" fill="#1F2937">Create fake repository</text>
  <rect x="64" y="342" width="282" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <g transform="translate(78,353) scale(0.92)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="370.5" font-size="18.5" fill="#1F2937">Call use case</text>
  <rect x="64" y="394" width="282" height="44" rx="10" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.2"/>
  <g transform="translate(78,405) scale(0.92)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="114" y="422.5" font-size="18.5" fill="#1F2937">Verify results</text>
  <text x="64" y="181" font-size="18.5" fill="#475569">(only business logic)</text>
  <text x="904" y="181" font-size="18.5" fill="#047857">(real implementation)</text>

  <g transform="translate(1146,135) scale(1.5)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <rect x="911" y="660" width="260" height="44" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1041" y="688" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Not needed for unit tests</text>


</svg>