<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="576" viewBox="0 0 1240 576" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four stages of a training pipeline and the promotion gate">
  <defs>
    <marker id="m2l1b-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="m2l1b-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="m2l1b-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="m2l1b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m2l1b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m2l1b-k1"><rect x="50" y="64" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1b-k2"><rect x="390" y="64" width="193" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1b-k3"><rect x="647" y="64" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1b-k4"><rect x="925" y="64" width="235" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1b-k5"><rect x="274" y="300" width="276" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1b-k6"><rect x="720" y="300" width="317" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="576" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M326,109 L390,109" marker-end="url(#m2l1b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M583,109 L647,109" marker-end="url(#m2l1b-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M861,109 L925,109" marker-end="url(#m2l1b-mslate)"/></g>
  <g fill="none" stroke="#DB2777" stroke-width="2"><path d="M754,154 V236 Q754,248 742,248 H424 Q412,248 412,260 V300" marker-end="url(#m2l1b-mpink)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M1160,130 H1180 Q1192,130 1192,142 V236 Q1192,248 1180,248 H890.5 Q878.5,248 878.5,260 V300" marker-end="url(#m2l1b-mviolet)"/></g>
  <g filter="url(#m2l1b-soft)">
    <rect x="50" y="64" width="276" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m2l1b-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">1. Data preparation</text>
  <text x="188" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">joins features to later labels</text>
  <text x="188" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">validate data and joins</text>
  <g filter="url(#m2l1b-soft)">
    <rect x="390" y="64" width="193" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="390" y="64" width="6" height="90" fill="#D97706" clip-path="url(#m2l1b-k2)"/>
  </g>
  <circle cx="428" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="454" y="116" font-size="18.5" font-weight="600" fill="#111827">2. Training</text>
  <text x="486.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">fits the model</text>
  <g filter="url(#m2l1b-lift)">
    <rect x="647" y="64" width="214" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="647" y="64" width="9" height="90" fill="#059669" clip-path="url(#m2l1b-k3)"/>
  </g>
  <circle cx="685" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(674.56,98.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="711" y="116" font-size="18.5" font-weight="600" fill="#111827">3. Evaluation</text>
  <g filter="url(#m2l1b-soft)">
    <rect x="925" y="64" width="235" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="925" y="64" width="6" height="90" fill="#7C3AED" clip-path="url(#m2l1b-k4)"/>
  </g>
  <circle cx="963" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="989" y="116" font-size="18.5" font-weight="600" fill="#111827">4. Registration</text>
  <text x="1042.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">version, metrics, lineage</text>
  <g filter="url(#m2l1b-soft)">
    <rect x="274" y="300" width="276" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="274" y="300" width="6" height="90" fill="#DB2777" clip-path="url(#m2l1b-k5)"/>
  </g>
  <circle cx="312" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(301.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="338" y="352" font-size="18.5" font-weight="600" fill="#111827">Nothing is promoted</text>
  <text x="412" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">the old model keeps serving</text>
  <g filter="url(#m2l1b-soft)">
    <rect x="720" y="300" width="317" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="720" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#m2l1b-k6)"/>
  </g>
  <circle cx="758" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="784" y="352" font-size="18.5" font-weight="600" fill="#111827">Serving loads the model</text>
  <text x="878.5" y="415" font-size="15.5" text-anchor="middle" fill="#6B7280">rollback points at an older version</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="600" y="240" fill="#BE185D">criteria not met</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="1060" y="240" fill="#5B21B6">promoted</text></g>
  <rect x="40" y="460" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="505" text-anchor="middle" font-size="16" fill="#475569">Release only after the candidate meets the agreed quality, cost, and safety criteria.</text>
</svg>