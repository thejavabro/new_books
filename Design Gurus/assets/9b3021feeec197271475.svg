<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1264" viewBox="0 0 1240 1264" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A web client posts to a REST driving adapter and an event driving adapter subscribes to a message queue for an order message; both call create_order on the application core, where OrderUseCasesImpl implements the OrderUseCases port beside business rules, domain entities and the port list (driving: OrderUseCases; driven: OrderRepository, ProductCatalog, PaymentGateway, InventoryService, NotificationService and EventPublisher); three driven adapters depend on the ports of the core, the database adapter implementing OrderRepository, the payment adapter implementing PaymentGateway and the notification adapter implementing NotificationService, which reach the database, the payment gateway and an email or SMS service">
