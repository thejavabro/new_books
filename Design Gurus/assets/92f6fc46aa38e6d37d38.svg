<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client writes value v1 to five replicas; replicas 1 to 3 confirm, forming a majority, so the write is committed while replicas 4 and 5 catch up later">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="qr2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qr2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="qr2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M530,114 C420,180 190,200 190,295" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr2-blue)"/>
  <path d="M574,114 C520,190 405,210 405,295" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr2-blue)"/>
  <path d="M620,114 L620,295" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr2-blue)"/>
  <path d="M665,114 C720,190 835,210 835,295" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr2-blue)"/>
  <path d="M710,114 C820,180 1050,200 1050,295" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#qr2-blue)"/>
  <text x="300" y="154" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">write v1 sent to all 5 replicas</text>

  <path d="M490,433 C520,450 520,480 525,521" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#qr2-emerald)"/>

  
  <rect x="95" y="267" width="620" height="210" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="115" y="451" font-size="20" font-weight="600" fill="#065F46">Write quorum: 3 of 5 confirmed</text>

  
  <rect x="740" y="267" width="410" height="210" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="765" y="451" font-size="20" font-weight="600" fill="#92400E">Behind: will catch up later</text>

  
  <g filter="url(#qr2-soft)">
    <rect x="500" y="40" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="70" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="620" y="98" font-size="20" fill="#64748B" text-anchor="middle">writes value v1</text>

  
  <g filter="url(#qr2-soft)">
    <path d="M115,310 L115,360 A75,15 0 0 0 265,360 L265,310" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="190" cy="310" rx="75" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M330,310 L330,360 A75,15 0 0 0 480,360 L480,310" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="405" cy="310" rx="75" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M545,310 L545,360 A75,15 0 0 0 695,360 L695,310" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="310" rx="75" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M760,310 L760,360 A75,15 0 0 0 910,360 L910,310" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="835" cy="310" rx="75" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M975,310 L975,360 A75,15 0 0 0 1125,360 L1125,310" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1050" cy="310" rx="75" ry="15" fill="#FAF8FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="190" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 1</text>
  <text x="405" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 2</text>
  <text x="620" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 3</text>
  <text x="835" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 4</text>
  <text x="1050" y="347" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Replica 5</text>

  
  <g filter="url(#qr2-soft)">
    <rect x="105" y="393" width="170" height="40" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="320" y="393" width="170" height="40" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="535" y="393" width="170" height="40" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="750" y="393" width="170" height="40" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="965" y="393" width="170" height="40" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="190" y="420" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">confirmed</text>
  <text x="405" y="420" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">confirmed</text>
  <text x="620" y="420" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">confirmed</text>
  <text x="835" y="420" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">no reply yet</text>
  <text x="1050" y="420" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">no reply yet</text>

  
  <g filter="url(#qr2-soft)">
    <rect x="370" y="523" width="500" height="108" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="620" y="555" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Write committed</text>
  <text x="620" y="585" font-size="20" fill="#065F46" text-anchor="middle">3 of 5 replicas is a majority,</text>
  <text x="620" y="612" font-size="20" fill="#065F46" text-anchor="middle">so the write is declared successful</text>

  
  <line x1="326" y1="671" x2="354" y2="671" stroke="#3B82F6" stroke-width="3"/>
  <text x="364" y="678" font-size="20" fill="#475569">write request</text>
  <line x1="646" y1="671" x2="674" y2="671" stroke="#059669" stroke-width="3"/>
  <text x="684" y="678" font-size="20" fill="#475569">quorum reached, write commits</text>
</svg>