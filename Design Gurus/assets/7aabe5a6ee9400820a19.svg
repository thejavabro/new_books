<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Live prices and comments: client architecture</title><desc id="desc">The subscription coordinator manages authorized interests and connection lifetime. The decoder validates event identity and ordering, then sends prices and comments to different state owners. Price state can replace older display values for the same symbol. The comment repository reconciles distinct comments, edits, deletions, and history. An optional order coordinator is a separate durable-operation path.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1240" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="790" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Live prices and comments: client architecture</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">Share the connection, but use different rules for prices and comments.</text><rect x="50" y="165" width="1100" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="205" font-size="24" fill="#2563eb" font-weight="700">View + presentation state</text><text x="72" y="243" font-size="21" fill="#334155" font-weight="400">Render at a measured UI rate. Show data age and preserve the reader’s position.</text><rect x="50" y="365" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="405" font-size="24" fill="#7c3aed" font-weight="700">Price state</text><text x="72" y="443" font-size="21" fill="#334155" font-weight="400">Newest valid value per subscribed symbol</text><text x="72" y="473" font-size="21" fill="#334155" font-weight="400">Replace older display values for that symbol.</text><text x="72" y="503" font-size="21" fill="#334155" font-weight="400">Keep the amount of visible state bounded.</text><rect x="650" y="365" width="500" height="185" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="405" font-size="24" fill="#059669" font-weight="700">Comment repository</text><text x="672" y="443" font-size="21" fill="#334155" font-weight="400">History, live comments, edits, and deletions</text><text x="672" y="473" font-size="21" fill="#334155" font-weight="400">Reconcile by comment identity and revision.</text><text x="672" y="503" font-size="21" fill="#334155" font-weight="400">Preserve distinct eligible comments.</text><path d="M310 357 V273" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M900 357 V273" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="995" y="310" font-size="18" fill="#64748b" font-weight="700">MOBILE APP</text><rect x="50" y="675" width="1100" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="715" font-size="24" fill="#2563eb" font-weight="700">Subscription coordinator + stream decoder</text><text x="72" y="753" font-size="21" fill="#334155" font-weight="400">Manage authorized interests and connection lifetime.</text><text x="72" y="783" font-size="21" fill="#334155" font-weight="400">Validate event schema, identity, and ordering scope.</text><text x="72" y="813" font-size="21" fill="#334155" font-weight="400">Route each event to the correct state owner; recover missed history when required.</text><path d="M310 667 V558" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M900 667 V558" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="332" y="617" font-size="21" fill="#64748b" font-weight="400">Price events</text><text x="700" y="617" font-size="21" fill="#64748b" font-weight="400">Comment events</text><path d="M900 873 V977" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="922" y="947" font-size="19" fill="#64748b" font-weight="400">Network</text><rect x="650" y="985" width="500" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="1025" font-size="24" fill="#c2410c" font-weight="700">Stream and history services</text><text x="672" y="1063" font-size="21" fill="#334155" font-weight="400">Enforce authorized subscriptions.</text><text x="672" y="1093" font-size="21" fill="#334155" font-weight="400">Provide versioned updates and recovery data.</text><rect x="50" y="985" width="520" height="170" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1025" font-size="24" fill="#ffffff" font-weight="700">Keep business operations separate</text><text x="72" y="1063" font-size="21" fill="#ffffff" font-weight="400">A displayed price is not an accepted order.</text><text x="72" y="1093" font-size="21" fill="#ffffff" font-weight="400">If orders are in scope, use a durable</text><text x="72" y="1123" font-size="21" fill="#ffffff" font-weight="400">order coordinator and backend confirmation.</text><text x="50" y="1198" font-size="19" fill="#475569" font-weight="400">Arrows show the selected data path. Subscription requests and history recovery also use the connection.</text></g></svg>