    <marker id="m03c-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1200" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two-tier architecture: thick client vs. thin client</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Both models have two tiers: the client and one server. They differ in where the business logic runs.</text>

  <rect x="40" y="120" width="1160" height="490" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Thick client model (business logic runs on the client)</text>
  <rect x="64" y="420" width="1112" height="166" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="450" font-size="19.5" font-weight="600" fill="#1D4ED8">Key characteristics</text>
  <rect x="40" y="640" width="1160" height="520" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="670" font-size="19.5" font-weight="600" fill="#047857">Thin client model (business logic runs on the server)</text>
  <rect x="450" y="696" width="726" height="260" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="474" y="726" font-size="19.5" font-weight="600" fill="#5B21B6">Server (Tier 2): one deployment</text>
  <rect x="64" y="970" width="1112" height="166" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="1000" font-size="19.5" font-weight="600" fill="#047857">Key characteristics</text>

