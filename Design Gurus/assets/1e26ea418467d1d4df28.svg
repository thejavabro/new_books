<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Thick client model, where business logic runs on the client: the client (tier 1) holds presentation, business and data access logic and sends SQL queries over a direct database connection to the database server (tier 2), which stores data, processes queries and manages transactions and returns raw data. Key characteristics: business logic runs on the client, the client connects directly to the database, common in desktop applications, harder to deploy, maintain and update. Thin client model, where business logic runs on the server: the client (tier 1) holds presentation logic only and sends HTTP or HTTPS requests to the server (tier 2), one deployment that holds the application logic (business logic, data access logic, API endpoints) and the database (data storage, query processing, transaction management); the application logic sends SQL queries to the database and gets results, and the server returns UI data to the client. Key characteristics: business logic runs on the server, the client sends requests over HTTP or HTTPS, common in web applications, easier to maintain and update with better security">
