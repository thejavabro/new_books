    </filter>
    <filter id="m03c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m03c-k1"><rect x="96" y="200" width="300" height="90" rx="12"/></clipPath>
