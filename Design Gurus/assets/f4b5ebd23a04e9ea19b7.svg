  <text x="279" y="542" font-size="18.5" font-weight="600" fill="#111827">Delivery list</text>
  <text x="320" y="605" font-size="15.5" text-anchor="middle" fill="#6B7280">who receives the summary</text>
  <g filter="url(#c8mtg3-soft)">
    <rect x="790" y="490" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
