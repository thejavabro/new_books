  <circle cx="558" cy="301" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,290.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="584" y="308" font-size="18.5" font-weight="600" fill="#111827">Access rule</text>
  <text x="620" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">what you attended, plus what was</text>
  <text x="620" y="394" font-size="15.5" text-anchor="middle" fill="#6B7280">explicitly shared with you</text>
  <g filter="url(#c8mtg3-soft)">
