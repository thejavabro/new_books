      <path d="M0,0 L8,4 L0,8 Z" fill="#B45309"/>
    </marker>
    <marker id="c8mtg3-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="c8mtg3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c8mtg3-lift" x="-14%" y="-16%" width="128%" height="145%">
