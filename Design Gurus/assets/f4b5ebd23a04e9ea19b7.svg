<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One access rule reads attendance and explicit shares from the meeting record, and both the delivery list and the archive search filter use it">
  <defs>
