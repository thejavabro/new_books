    </filter>
    <clipPath id="c8mtg3-k1"><rect x="508" y="56" width="224" height="90" rx="12"/></clipPath>
    <clipPath id="c8mtg3-k2"><rect x="520" y="256" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c8mtg3-k3"><rect x="215" y="490" width="210" height="90" rx="12"/></clipPath>
    <clipPath id="c8mtg3-k4"><rect x="790" y="490" width="260" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="796" fill="#FFFFFF"/>
  <rect x="40" y="430" width="560" height="210" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="460" font-size="16.5" font-weight="600" fill="#B45309">Async lane</text>
  <rect x="640" y="430" width="560" height="210" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
