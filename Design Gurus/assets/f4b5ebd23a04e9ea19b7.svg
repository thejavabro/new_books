  <g fill="none" stroke="#B45309" stroke-width="2"><path d="M520,301 H332 Q320,301 320,313 V490" marker-end="url(#c8mtg3-mamber)"/></g>
  <g fill="none" stroke="#2563EB" stroke-width="2"><path d="M720,301 H908 Q920,301 920,313 V490" marker-end="url(#c8mtg3-mblue)"/></g>
  <g filter="url(#c8mtg3-soft)">
    <rect x="508" y="56" width="224" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="508" y="56" width="6" height="90" fill="#7C3AED" clip-path="url(#c8mtg3-k1)"/>
