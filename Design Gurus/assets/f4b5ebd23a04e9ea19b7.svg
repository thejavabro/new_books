  <text x="572" y="108" font-size="18.5" font-weight="600" fill="#111827">Meeting record</text>
  <text x="620" y="171" font-size="15.5" text-anchor="middle" fill="#6B7280">attendance and explicit shares</text>
  <g filter="url(#c8mtg3-soft)">
    <rect x="520" y="256" width="200" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="520" y="256" width="6" height="90" fill="#4F46E5" clip-path="url(#c8mtg3-k2)"/>
