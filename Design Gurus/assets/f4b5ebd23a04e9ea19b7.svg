  </g>
  <circle cx="828" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(817.56,524.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="854" y="542" font-size="18.5" font-weight="600" fill="#111827">Archive search filter</text>
  <text x="920" y="605" font-size="15.5" text-anchor="middle" fill="#6B7280">which meetings a question can see</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="634" y="224" fill="#475569">reads attendance and shares</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="426" y="289" fill="#B45309">the same rule</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="814" y="289" fill="#1D4ED8">the same rule</text></g>
  <rect x="40" y="680" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="725" text-anchor="middle" font-size="16" fill="#475569">Search and delivery call the same rule, so they can never disagree.</text>
</svg>