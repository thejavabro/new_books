<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="State diagram of the checkout order lifecycle. An order is created in pending_inventory, moves to pending_payment once items are reserved, and reaches confirmed when the charge succeeds. No stock from pending_inventory, or a declined card from pending_payment, moves the order to cancelled after compensations run in reverse. Confirmed and cancelled are both terminal, and the two pending states are public vocabulary that other services read and respect.">
  <defs>
    <marker id="m05-l08-order-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l08-order-states-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l08-order-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m05-l08-order-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l08-order-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <rect x="140" y="100" width="760" height="250" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="160" y="140" font-size="20" font-weight="600" fill="#334155">In-flight states</text>
  <text x="880" y="140" text-anchor="end" font-size="20" fill="#64748B">each has an honest message for the user</text>

  <g filter="url(#m05-l08-order-states-soft)">
    <rect x="170" y="200" width="300" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="320" y="240" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">pending_inventory</text>
  <text x="320" y="272" text-anchor="middle" font-size="20" fill="#64748B">order row + outbox event</text>
  <text x="320" y="304" text-anchor="middle" font-size="20" fill="#64748B">committed together</text>
  <g filter="url(#m05-l08-order-states-soft)">
    <rect x="550" y="200" width="300" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="700" y="240" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">pending_payment</text>
  <text x="700" y="272" text-anchor="middle" font-size="20" fill="#64748B">15-minute reservation held</text>
  <text x="700" y="304" text-anchor="middle" font-size="20" fill="#64748B">idempotent charge in flight</text>
  <g filter="url(#m05-l08-order-states-soft)">
    <rect x="930" y="200" width="250" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1055" y="240" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">confirmed</text>
  <text x="1055" y="272" text-anchor="middle" font-size="20" fill="#64748B">Fulfillment ships only</text>
  <text x="1055" y="304" text-anchor="middle" font-size="20" fill="#64748B">on this status</text>
  <g filter="url(#m05-l08-order-states-soft)">
    <rect x="430" y="500" width="320" height="140" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="590" y="545" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">cancelled</text>
  <text x="590" y="577" text-anchor="middle" font-size="20" fill="#64748B">compensations ran in reverse</text>
  <text x="590" y="609" text-anchor="middle" font-size="20" fill="#64748B">no hold, no charge</text>
  <g filter="url(#m05-l08-order-states-soft)">
    <rect x="800" y="500" width="380" height="170" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="990" y="544" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Public vocabulary</text>
  <text x="990" y="576" text-anchor="middle" font-size="20" fill="#0F172A">other services read these statuses</text>
  <text x="990" y="608" text-anchor="middle" font-size="20" fill="#0F172A">and respect them: Fulfillment ships</text>
  <text x="990" y="640" text-anchor="middle" font-size="20" fill="#0F172A">nothing that is not confirmed</text>

  <g fill="none" stroke-width="2.5">
    <path d="M60,265 L162,265" stroke="#475569" stroke-width="2" marker-end="url(#m05-l08-order-states-sl)"/>
    <path d="M470,265 L542,265" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l08-order-states-ab)"/>
    <path d="M850,265 L922,265" stroke="#059669" marker-end="url(#m05-l08-order-states-em)"/>
    <path d="M320,330 L320,570 L422,570" stroke="#DC2626" stroke-width="2" marker-end="url(#m05-l08-order-states-rd)"/>
    <path d="M700,330 L700,430 L620,430 L620,492" stroke="#DC2626" marker-end="url(#m05-l08-order-states-rd)"/>
  </g>

  <circle cx="48" cy="265" r="12" fill="#475569"/>

  <text x="110" y="180" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">order created</text>
  <text x="506" y="180" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">items reserved</text>
  <text x="886" y="180" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">charge succeeds</text>
  <text x="200" y="545" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no stock</text>
  <text x="716" y="410" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">card declined,</text>
  <text x="716" y="436" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">compensations run</text>

  <line x1="60" y1="720" x2="96" y2="720" stroke="#475569" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">Lifecycle: the start and the end</text>
  <line x1="60" y1="760" x2="96" y2="760" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">Forward step, fired by an event</text>
  <line x1="60" y1="800" x2="96" y2="800" stroke="#059669" stroke-width="4"/>
  <text x="108" y="807" font-size="20" fill="#475569">Success: the charge landed and the order is final</text>
  <line x1="60" y1="840" x2="96" y2="840" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="847" font-size="20" fill="#475569">Failure: compensations run in reverse</text>
</svg>