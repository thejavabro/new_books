<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The URL https://shop.example.com:443/products/42?color=red#reviews has a scheme https, host shop.example.com, port 443, path /products/42, query ?color=red, and fragment #reviews. The fragment stays in the browser.">
  <defs>
    <filter id="ur2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ur2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ur2-k1"><rect x="42" y="140" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="ur2-k2"><rect x="238" y="140" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="ur2-k3"><rect x="434" y="140" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="ur2-k4"><rect x="630" y="140" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="ur2-k5"><rect x="826" y="140" width="176" height="90" rx="12"/></clipPath>
    <clipPath id="ur2-k6"><rect x="1022" y="140" width="176" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The six parts of a URL</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">https://shop.example.com:443/products/42?color=red#reviews</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ur2-soft)">
    <rect x="42" y="140" width="176" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="42" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ur2-k1)"/>
  </g>
  <circle cx="80" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(69.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="106" y="192" font-size="21.5" font-weight="600" fill="#111827">Scheme</text>
  <text x="130" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">https</text>
  <text x="130" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">how to connect</text>
  <g filter="url(#ur2-soft)">
    <rect x="238" y="140" width="176" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="238" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ur2-k2)"/>
  </g>
  <circle cx="276" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(265.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="302" y="192" font-size="21.5" font-weight="600" fill="#111827">Host</text>
  <text x="326" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">shop.example.com</text>
  <text x="326" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">which server</text>
  <g filter="url(#ur2-soft)">
    <rect x="434" y="140" width="176" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="434" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ur2-k3)"/>
  </g>
  <circle cx="472" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(461.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="498" y="192" font-size="21.5" font-weight="600" fill="#111827">Port</text>
  <text x="522" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">443</text>
  <text x="522" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">often left out</text>
  <g filter="url(#ur2-soft)">
    <rect x="630" y="140" width="176" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="630" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ur2-k4)"/>
  </g>
  <circle cx="668" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(657.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="694" y="192" font-size="21.5" font-weight="600" fill="#111827">Path</text>
  <text x="718" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">/products/42</text>
  <text x="718" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">which resource</text>
  <g filter="url(#ur2-soft)">
    <rect x="826" y="140" width="176" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="826" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ur2-k5)"/>
  </g>
  <circle cx="864" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(853.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="890" y="192" font-size="21.5" font-weight="600" fill="#111827">Query</text>
  <text x="914" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">?color=red</text>
  <text x="914" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">extra options</text>
  <g filter="url(#ur2-soft)">
    <rect x="1022" y="140" width="176" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="1022" y="140" width="6" height="90" fill="#D97706" clip-path="url(#ur2-k6)"/>
  </g>
  <circle cx="1060" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1049.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="1086" y="192" font-size="21.5" font-weight="600" fill="#111827">Fragment</text>
  <text x="1110" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">#reviews</text>
  <text x="1110" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">a spot on the page</text>

  <rect x="40" y="340" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Sent to server</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">the scheme, host, port, path, and query shape the request</text>
  <rect x="64" y="415" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="440" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Browser only</text>
  <text x="323" y="440" font-size="18.5" fill="#475569">the fragment is never sent to the server</text>
</svg>