<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Twitter Search data model: the Tweet table in MySQL, the inverted index entry in index-server memory, and the Index-Builder&#39;s reverse index record">
<defs>
<filter id="ts1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="ts1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="ts1-mvio" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="ts1-mamb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<clipPath id="ts1-k1"><rect x="70" y="80" width="470" height="142" rx="12"/></clipPath>
<clipPath id="ts1-k2"><rect x="760" y="50" width="410" height="178" rx="12"/></clipPath>
<clipPath id="ts1-k3"><rect x="760" y="390" width="410" height="142" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>
<path d="M 760,160 H 662 Q 650,160 650,158 V 156 Q 650,154 638,154 H 543" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ts1-mvio)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="205" fill="#5B21B6">the index stores IDs;</text><text x="650" y="227" fill="#5B21B6">the text lives here</text></g><path d="M 760,500 H 662 Q 650,500 650,488 V 202 Q 650,190 638,190 H 543" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ts1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="650" y="330" fill="#B45309">names the tweets each</text><text x="650" y="352" fill="#B45309">index server holds</text></g><g filter="url(#ts1-soft)">
<rect x="70" y="80" width="470" height="142" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<rect x="70" y="80" width="6" height="142" fill="#2563EB" clip-path="url(#ts1-k1)"/>
</g>
<circle cx="108" cy="108" r="18" fill="#FFFFFF"/>
<g transform="translate(97.56,97.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
<text x="134" y="115" font-size="18.5" font-weight="600" fill="#111827">Tweet (one row per tweet)</text><text x="94" y="161" font-size="15.5" fill="#111827">TweetID</text><text x="516" y="161" font-size="15.5" text-anchor="end" fill="#6B7280">5 bytes, primary key</text><line x1="84" y1="172" x2="526" y2="172" stroke="#93C5FD" stroke-width="1"/><text x="94" y="197" font-size="15.5" fill="#111827">TweetText</text><text x="516" y="197" font-size="15.5" text-anchor="end" fill="#6B7280">about 300 bytes</text><text x="305" y="247" font-size="15.5" text-anchor="middle" fill="#6B7280">in MySQL, partitioned by hash of TweetID</text><text x="305" y="270" font-size="15.5" text-anchor="middle" fill="#94A3B8">400 million new rows arrive every day</text><g filter="url(#ts1-lift)">
<rect x="760" y="50" width="410" height="178" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<rect x="760" y="50" width="9" height="178" fill="#7C3AED" clip-path="url(#ts1-k2)"/>
</g>
<circle cx="798" cy="78" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,67.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="824" y="85" font-size="18.5" font-weight="600" fill="#111827">Inverted index entry</text><text x="784" y="131" font-size="15.5" fill="#111827">Word</text><text x="1146" y="131" font-size="15.5" text-anchor="end" fill="#6B7280">the key, 500K words</text><line x1="774" y1="142" x2="1156" y2="142" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="167" font-size="15.5" fill="#111827">TweetIDs</text><text x="1146" y="167" font-size="15.5" text-anchor="end" fill="#6B7280">every tweet with the word</text><line x1="774" y1="178" x2="1156" y2="178" stroke="#C4B5FD" stroke-width="1"/><text x="784" y="203" font-size="15.5" fill="#111827">Popularity</text><text x="1146" y="203" font-size="15.5" text-anchor="end" fill="#6B7280">one number per entry</text><text x="965" y="253" font-size="15.5" text-anchor="middle" fill="#6B7280">in the memory of the index servers</text><text x="965" y="276" font-size="15.5" text-anchor="middle" fill="#94A3B8">about 21 TB holds two years of tweets</text><g filter="url(#ts1-soft)">
<rect x="760" y="390" width="410" height="142" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="760" y="390" width="6" height="142" fill="#D97706" clip-path="url(#ts1-k3)"/>
</g>
<circle cx="798" cy="418" r="18" fill="#FFFFFF"/>
<g transform="translate(787.56,407.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
<text x="824" y="425" font-size="18.5" font-weight="600" fill="#111827">Reverse index record</text><text x="784" y="471" font-size="15.5" fill="#111827">IndexServerNo</text><text x="1146" y="471" font-size="15.5" text-anchor="end" fill="#6B7280">the key</text><line x1="774" y1="482" x2="1156" y2="482" stroke="#FCD34D" stroke-width="1"/><text x="784" y="507" font-size="15.5" fill="#111827">TweetIDs</text><text x="1146" y="507" font-size="15.5" text-anchor="end" fill="#6B7280">a HashSet</text><text x="965" y="557" font-size="15.5" text-anchor="middle" fill="#6B7280">kept by the Index-Builder</text><text x="965" y="580" font-size="15.5" text-anchor="middle" fill="#94A3B8">how a dead index server rebuilds, step 6</text><rect x="40" y="620" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="646" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/><text x="164" y="668" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">IDs, never text</text><text x="288" y="668" font-size="15.5" fill="#475569">both index structures store 5-byte TweetIDs; only the database holds the tweet text</text><rect x="64" y="690" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="712" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Two copies of the data</text><text x="288" y="712" font-size="15.5" fill="#475569">the database is organized by tweet, and the index is the same data organized by word</text>
</svg>