<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two families for cross-service queries: API composition, where a gateway fans out to Orders, Catalog and Fulfillment at read time, and a materialized read model built from those services&#39; events at write time and answered with one indexed lookup.">
  <defs>
    <marker id="m05-l06-composition-vs-cqrs-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l06-composition-vs-cqrs-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m05-l06-composition-vs-cqrs-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="910" fill="#FFFFFF"/>

  <rect x="40" y="80" width="560" height="700" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="60" y="120" font-size="20" font-weight="600" fill="#1E3A8A">Option 1, API composition</text>
  <text x="60" y="152" font-size="20" fill="#64748B">join at read time</text>
  <text x="60" y="184" font-size="20" fill="#065F46">no new infrastructure, fresh data</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="170" y="220" width="300" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="320" y="266" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway / BFF</text>
  <text x="320" y="298" text-anchor="middle" font-size="20" fill="#64748B">fans out, merges in memory</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="60" y="392" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="142.5" y="433" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <text x="142.5" y="465" text-anchor="middle" font-size="20" fill="#64748B">order rows</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="240" y="392" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="322.5" y="433" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <text x="322.5" y="465" text-anchor="middle" font-size="20" fill="#64748B">names</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="420" y="392" width="165" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="502.5" y="433" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="502.5" y="465" text-anchor="middle" font-size="20" fill="#64748B">statuses</text>
  <text x="320" y="570" text-anchor="middle" font-size="20" fill="#B91C1C">Minus: every read waits for the</text>
  <text x="320" y="602" text-anchor="middle" font-size="20" fill="#B91C1C">slowest of the three</text>

  <rect x="630" y="80" width="550" height="700" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="650" y="120" font-size="20" font-weight="600" fill="#92400E">Option 2, materialized view</text>
  <text x="650" y="152" font-size="20" fill="#64748B">join at write time</text>
  <text x="650" y="184" font-size="20" fill="#065F46">reads never fan out</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="650" y="220" width="165" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="732.5" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders</text>
  <text x="732.5" y="288" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">events</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="830" y="220" width="165" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="912.5" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog</text>
  <text x="912.5" y="288" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">events</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="1010" y="220" width="165" height="90" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="1092.5" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1092.5" y="288" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">events</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <path d="M730,400 L730,500 A190,20 0 0 0 1110,500 L1110,400" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="920" cy="400" rx="190" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="920" y="442" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Read model</text>
  <text x="920" y="472" text-anchor="middle" font-size="20" fill="#64748B">one row per order, pre-joined</text>
  <g filter="url(#m05-l06-composition-vs-cqrs-soft)">
    <rect x="770" y="570" width="300" height="100" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="920" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One indexed lookup</text>
  <text x="920" y="643" text-anchor="middle" font-size="20" fill="#64748B">fast at any scale</text>
  <text x="920" y="710" text-anchor="middle" font-size="20" fill="#B91C1C">Minus: the view lags its sources,</text>
  <text x="920" y="742" text-anchor="middle" font-size="20" fill="#B91C1C">and it is infrastructure to run</text>

  <g fill="none" stroke-width="2.5">
    <path d="M320,330 L320,384" stroke="#3B82F6" marker-end="url(#m05-l06-composition-vs-cqrs-bl)"/>
    <path d="M280,330 C220,360 142,340 142,384" stroke="#3B82F6" marker-end="url(#m05-l06-composition-vs-cqrs-bl)"/>
    <path d="M360,330 C420,360 502,340 502,384" stroke="#3B82F6" marker-end="url(#m05-l06-composition-vs-cqrs-bl)"/>
    <path d="M732,310 C760,340 860,340 880,372" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l06-composition-vs-cqrs-ab)"/>
    <path d="M912,310 L912,372" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l06-composition-vs-cqrs-ab)"/>
    <path d="M1092,310 C1064,340 970,340 950,372" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l06-composition-vs-cqrs-ab)"/>
    <path d="M920,520 L920,562" stroke="#3B82F6" marker-end="url(#m05-l06-composition-vs-cqrs-bl)"/>
  </g>

  <text x="938" y="548" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one hop</text>

  <line x1="60" y1="830" x2="96" y2="830" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="837" font-size="20" fill="#475569">Synchronous read path: three calls on the left, one hop on the right</text>
  <line x1="60" y1="870" x2="96" y2="870" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="877" font-size="20" fill="#475569">Events: the join happens at write time, before anyone asks</text>
</svg>