<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Capacity estimation for a recommendation system: 200 million users with 100 million daily, about 100 titles watched each, and a catalogue of only 100 thousand titles; giving 300 million requests a day, over 10 thousand queries a second at peak, and 10 billion watch events">
  <defs>
    <filter id="nfes-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nfes-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nfes-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfes-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfes-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfes-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfes-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nfes-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Recommendation system: capacity estimation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A tiny catalogue and an enormous history. That asymmetry is what the architecture answers.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What we assume</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What follows from it</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nfes-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#nfes-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">200M users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">with about 100 million</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">active in a day</text>
  <g filter="url(#nfes-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#nfes-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">100 titles each</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">watched, on average,</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">across their history</text>
  <g filter="url(#nfes-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#nfes-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">100k titles only</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a few GB, small enough</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">to cache entirely</text>
  <g filter="url(#nfes-lift)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="80" y="430" width="9" height="90" fill="#059669" clip-path="url(#nfes-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">300M requests a day</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">with peaks over 10,000</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">queries a second</text>
  <g filter="url(#nfes-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#nfes-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">10 billion events</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">of watch history, running</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">to terabytes</text>
  <g filter="url(#nfes-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#D97706" clip-path="url(#nfes-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">5 billion rows</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">top 50 recommendations</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">precomputed per user</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">100 to 1</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">reads to writes, which is why results are precomputed rather than derived on each request</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Small catalogue</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">a few GB of titles can sit in memory on every server, while user data has to be sharded</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Hot and cold</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">recent history in a fast store, older history in cold storage, because most of it is never read</text>
</svg>