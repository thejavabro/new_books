<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends requests to a reverse proxy, which routes /api requests to API servers, page requests to web servers, and /images requests to image servers. The client sees only the proxy.">
  <defs>
    <filter id="pr4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pr4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pr4-k1"><rect x="40" y="290" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="pr4-k2"><rect x="400" y="290" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pr4-k3"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pr4-k4"><rect x="900" y="290" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pr4-k5"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="pr4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="pr4-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A reverse proxy hides the servers</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The client talks to one address. The proxy sends each request to the right servers.</text>



  <g fill="none" stroke-width="2">
    <path d="M300,335 H400" stroke="#64748B" marker-end="url(#pr4-m-slate)"/>
    <path d="M700,315 H785 Q800,315 800,300 V200 Q800,185 815,185 H900" stroke="#7C3AED" marker-end="url(#pr4-m-violet)"/>
    <path d="M700,335 H900" stroke="#7C3AED" marker-end="url(#pr4-m-violet)"/>
    <path d="M700,355 H785 Q800,355 800,370 V470 Q800,485 815,485 H900" stroke="#7C3AED" marker-end="url(#pr4-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#pr4-soft)">
    <rect x="40" y="290" width="260" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#pr4-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="170" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">sees one address</text>
  <g filter="url(#pr4-lift)">
    <rect x="400" y="290" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="400" y="290" width="9" height="90" fill="#7C3AED" clip-path="url(#pr4-k2)"/>
  </g>
  <circle cx="438" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,324.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="464" y="342" font-size="21.5" font-weight="600" fill="#111827">Reverse proxy</text>
  <text x="550" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">routes, caches, balances</text>
  <g filter="url(#pr4-soft)">
    <rect x="900" y="140" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#pr4-k3)"/>
  </g>
  <circle cx="938" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">API servers</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">/api/...</text>
  <g filter="url(#pr4-soft)">
    <rect x="900" y="290" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="290" width="6" height="90" fill="#2563EB" clip-path="url(#pr4-k4)"/>
  </g>
  <circle cx="938" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,324.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="964" y="342" font-size="21.5" font-weight="600" fill="#111827">Web servers</text>
  <text x="1050" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">page requests</text>
  <g filter="url(#pr4-soft)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="900" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#pr4-k5)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Image servers</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">/images/...</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Hides servers</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">users see one address, and the backend servers stay private</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Common tools</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">Nginx, HAProxy, Envoy, load balancers, CDNs, and API gateways</text>
</svg>