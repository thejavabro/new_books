<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Point-to-point queue: producers push messages to the rear of a queue, and each message is pulled from the front by exactly one consumer">
  <rect x="0" y="0" width="1240" height="490" fill="#FFFFFF"/>
  <defs>
    <marker id="dm1-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="dm1-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M262,80 C340,80 370,100 451,124" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm1-amber)"/>
  <path d="M262,296 C340,296 370,276 451,233" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm1-amber)"/>
  <text x="357" y="188" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push to the rear</text>

  <path d="M769,124 C850,100 880,80 958,80" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm1-amber)"/>
  <path d="M769,233 C850,276 880,296 958,296" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#dm1-amber)"/>
  <text x="873" y="188" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pull from the front</text>

  
  <rect x="455" y="90" width="310" height="160" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="610" y="118" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Message Queue (buffer)</text>

  
  <g filter="url(#dm1-soft)">
    <rect x="477" y="140" width="46" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="532" y="140" width="46" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="587" y="140" width="46" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="642" y="140" width="46" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
    <rect x="697" y="140" width="46" height="64" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="500" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">M5</text>
  <text x="555" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">M4</text>
  <text x="610" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">M3</text>
  <text x="665" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">M2</text>
  <text x="720" y="179" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">M1</text>
  <text x="500" y="230" font-size="20" fill="#92400E" text-anchor="middle">rear</text>
  <text x="720" y="230" font-size="20" fill="#92400E" text-anchor="middle">front</text>

  
  <g filter="url(#dm1-soft)">
    <rect x="30" y="44" width="230" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="30" y="260" width="230" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="145" y="74" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer 1</text>
  <text x="145" y="102" font-size="20" fill="#64748B" text-anchor="middle">sends messages</text>
  <text x="145" y="290" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer 2</text>
  <text x="145" y="318" font-size="20" fill="#64748B" text-anchor="middle">sends messages</text>

  
  <g filter="url(#dm1-soft)">
    <rect x="980" y="44" width="230" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="980" y="260" width="230" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1095" y="74" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer 1</text>
  <text x="1095" y="102" font-size="20" fill="#64748B" text-anchor="middle">gets M1, then M3 ...</text>
  <text x="1095" y="290" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer 2</text>
  <text x="1095" y="318" font-size="20" fill="#64748B" text-anchor="middle">gets M2, then M4 ...</text>

  
  <rect x="240" y="372" width="760" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="403" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Each message is consumed by exactly one consumer.</text>
  <text x="620" y="431" font-size="20" fill="#64748B" text-anchor="middle">Once a consumer takes a message, it is removed from the queue.</text>
</svg>