<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="742" viewBox="0 0 1240 742" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three ads in one auction: each bid is multiplied by its pCTR, Ad A wins, and A pays just enough per click to beat Ad B">
  <defs>
    <marker id="c3ac1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c3ac1-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="c3ac1-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c3ac1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c3ac1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c3ac1-k1"><rect x="165" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c3ac1-k2"><rect x="510" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c3ac1-k3"><rect x="855" y="136" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c3ac1-k4"><rect x="165" y="436" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="c3ac1-k5"><rect x="654" y="436" width="322" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="742" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Step 1: rank by bid times pCTR</text>
  <rect x="40" y="356" width="1160" height="230" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="303" y="386" font-size="16.5" font-weight="600" fill="#1D4ED8">Step 2: the winner pays just enough to beat the runner-up</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M385,481 H654" marker-end="url(#c3ac1-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M275,263 V436" marker-end="url(#c3ac1-memerald)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M620,263 V324 Q620,336 632,336 H803 Q815,336 815,348 V436" marker-end="url(#c3ac1-mviolet)"/></g>
  <g filter="url(#c3ac1-lift)">
    <rect x="165" y="136" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="165" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c3ac1-k1)"/>
  </g>
  <circle cx="203" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(192.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="165" y="124" font-size="15.5" font-weight="600" fill="#6B7280">bid $2.00 per click</text>
  <text x="229" y="188" font-size="18.5" font-weight="600" fill="#111827">Ad A</text>
  <text x="275" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">2 percent pCTR, score 4 cents</text>
  <g filter="url(#c3ac1-soft)">
    <rect x="510" y="136" width="220" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="510" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c3ac1-k2)"/>
  </g>
  <circle cx="548" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="510" y="124" font-size="15.5" font-weight="600" fill="#6B7280">bid $3.00 per click</text>
  <text x="574" y="188" font-size="18.5" font-weight="600" fill="#111827">Ad B</text>
  <text x="620" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">1 percent pCTR, score 3 cents</text>
  <g filter="url(#c3ac1-soft)">
    <rect x="855" y="136" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="855" y="136" width="6" height="90" fill="#64748B" clip-path="url(#c3ac1-k3)"/>
  </g>
  <circle cx="893" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(882.56,170.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="855" y="124" font-size="15.5" font-weight="600" fill="#6B7280">bid $0.50 per click</text>
  <text x="919" y="188" font-size="18.5" font-weight="600" fill="#111827">Ad C</text>
  <text x="965" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">4 percent pCTR, score 2 cents</text>
  <g filter="url(#c3ac1-soft)">
    <rect x="165" y="436" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="165" y="436" width="6" height="90" fill="#059669" clip-path="url(#c3ac1-k4)"/>
  </g>
  <circle cx="203" cy="481" r="18" fill="#FFFFFF"/>
  <g transform="translate(192.56,470.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="165" y="424" font-size="15.5" font-weight="600" fill="#6B7280">highest score</text>
  <text x="229" y="488" font-size="18.5" font-weight="600" fill="#111827">Ad A wins</text>
  <text x="275" y="551" font-size="15.5" text-anchor="middle" fill="#6B7280">even though Ad B bid more</text>
  <g filter="url(#c3ac1-soft)">
    <rect x="654" y="436" width="322" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="654" y="436" width="6" height="90" fill="#7C3AED" clip-path="url(#c3ac1-k5)"/>
  </g>
  <circle cx="692" cy="481" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,470.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="654" y="424" font-size="15.5" font-weight="600" fill="#6B7280">second-price</text>
  <text x="718" y="488" font-size="18.5" font-weight="600" fill="#111827">A pays about $1.51 per click</text>
  <text x="815" y="551" font-size="15.5" text-anchor="middle" fill="#6B7280">3 cents divided by 2 percent is $1.50</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="287" y="322" fill="#047857">4 cents wins</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="717.5" y="322" fill="#5B21B6">runner-up score: 3 cents</text></g>
  <rect x="40" y="626" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="671" text-anchor="middle" font-size="16" fill="#475569">pCTR appears twice: it picks the winner, and it sets the price.</text>
</svg>