<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four options in order from the least change to the most. Each option changes more of the structure than the one above it, but effort does not always grow in the same order. One, retain the design: only capacity or configuration changes, such as sending matching reads to a read replica, in 2 to 3 days, undone in hours. Two, refactor inside the codebase: code and data move behind clearer interfaces, such as replacing 14 direct queries with interface calls, in 6 to 7 weeks, undone in days. Three, move work to background workers: slow work leaves the request path, such as sending new-order messages to restaurants from a worker, in 1 to 2 weeks, undone in about a day. Four, extract a service: its own codebase, pipeline, database and owner, such as a Dispatch service, in 3 to 4 months, undone in months. Rule: test the options in order and choose the first one that meets the measured requirement.">
  <defs>
    <filter id="md04a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md04a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md04a-k1"><rect x="200" y="120" width="470" height="84" rx="12"/></clipPath>
    <clipPath id="md04a-k2"><rect x="200" y="230" width="470" height="84" rx="12"/></clipPath>
    <clipPath id="md04a-k3"><rect x="200" y="340" width="470" height="84" rx="12"/></clipPath>
    <clipPath id="md04a-k4"><rect x="200" y="450" width="470" height="84" rx="12"/></clipPath>
    <clipPath id="md04a-k5"><rect x="40" y="580" width="1160" height="76" rx="12"/></clipPath>
    <marker id="md04a-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four ways to change a running system</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each option changes more of the structure than the one above it; effort is illustrative and does not always grow in that order.</text>



  <g fill="none" stroke-width="2">
    <path d="M172,124 V530" stroke="#64748B" stroke-width="2.5" marker-end="url(#md04a-m-slate)"/>
    <path d="M435,204 V230" stroke="#64748B" marker-end="url(#md04a-m-slate)"/>
    <path d="M435,314 V340" stroke="#64748B" marker-end="url(#md04a-m-slate)"/>
    <path d="M435,424 V450" stroke="#64748B" marker-end="url(#md04a-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md04a-soft)">
    <rect x="200" y="120" width="470" height="84" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="200" y="120" width="6" height="84" fill="#2563EB" clip-path="url(#md04a-k1)"/>
  </g>
  <circle cx="238" cy="162" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,151.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="264" y="169" font-size="19.5" font-weight="600" fill="#111827">1. Retain the design</text>
  <g filter="url(#md04a-soft)">
    <rect x="200" y="230" width="470" height="84" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="200" y="230" width="6" height="84" fill="#4F46E5" clip-path="url(#md04a-k2)"/>
  </g>
  <circle cx="238" cy="272" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,261.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="264" y="279" font-size="19.5" font-weight="600" fill="#111827">2. Refactor inside the codebase</text>
  <g filter="url(#md04a-soft)">
    <rect x="200" y="340" width="470" height="84" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="200" y="340" width="6" height="84" fill="#D97706" clip-path="url(#md04a-k3)"/>
  </g>
  <circle cx="238" cy="382" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,371.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="264" y="389" font-size="19.5" font-weight="600" fill="#111827">3. Move work to background workers</text>
  <g filter="url(#md04a-soft)">
    <rect x="200" y="450" width="470" height="84" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="200" y="450" width="6" height="84" fill="#7C3AED" clip-path="url(#md04a-k4)"/>
  </g>
  <circle cx="238" cy="492" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,481.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="264" y="499" font-size="19.5" font-weight="600" fill="#111827">4. Extract a service</text>
  <g filter="url(#md04a-lift)">
    <rect x="40" y="580" width="1160" height="76" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="580" width="9" height="76" fill="#059669" clip-path="url(#md04a-k5)"/>
  </g>
  <circle cx="78" cy="618" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,607.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="104" y="625" font-size="19.5" font-weight="600" fill="#111827">Test the options in order and choose the first one that meets the measured requirement</text>
  <text x="700" y="142" font-size="18.5" fill="#475569">Capacity or configuration only</text>
  <text x="700" y="168" font-size="18.5" fill="#6B7280">Example: matching reads go to a read replica</text>
  <text x="700" y="194" font-size="18.5" fill="#94A3B8">Effort: 2 to 3 days. Undo: hours</text>
  <text x="700" y="252" font-size="18.5" fill="#475569">Code and data move behind clearer interfaces</text>
  <text x="700" y="278" font-size="18.5" fill="#6B7280">Example: 14 direct queries become interface calls</text>
  <text x="700" y="304" font-size="18.5" fill="#94A3B8">Effort: 6 to 7 weeks. Undo: days</text>
  <text x="700" y="362" font-size="18.5" fill="#475569">Slow work leaves the request path</text>
  <text x="700" y="388" font-size="18.5" fill="#6B7280">Example: a worker sends new-order messages to restaurants</text>
  <text x="700" y="414" font-size="18.5" fill="#94A3B8">Effort: 1 to 2 weeks. Undo: about a day</text>
  <text x="700" y="472" font-size="18.5" fill="#475569">Own codebase, pipeline, database and owner</text>
  <text x="700" y="498" font-size="18.5" fill="#6B7280">Example: Dispatch becomes its own service</text>
  <text x="700" y="524" font-size="18.5" fill="#94A3B8">Effort: 3 to 4 months. Undo: months</text>
  <text x="152" y="150" font-size="18.5" font-weight="600" text-anchor="end" fill="#475569">least</text>
  <text x="152" y="176" font-size="18.5" font-weight="600" text-anchor="end" fill="#475569">change</text>
  <text x="152" y="486" font-size="18.5" font-weight="600" text-anchor="end" fill="#475569">most</text>
  <text x="152" y="512" font-size="18.5" font-weight="600" text-anchor="end" fill="#475569">change</text>




</svg>