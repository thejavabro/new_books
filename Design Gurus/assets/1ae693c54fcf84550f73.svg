<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="CQRS. Write side: a client sends a write command to the order service, which stores it in the order database and publishes an order created event to the message broker. The message broker, for example Kafka, holds events from all services: order created from the order service, user created and user updated from the user service, and order shipped from the fulfillment service. Read side: one order dashboard consumer consumes all of these streams and maintains one order dashboard view, the read model, which the user orders query reads with fast reads">
