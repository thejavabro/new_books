    <marker id="m05l-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">CQRS: building a read model across microservices</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The write side publishes events; the read side folds events from several services into one pre-joined view.</text>

