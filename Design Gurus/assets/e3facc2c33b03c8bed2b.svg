<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="orphans-title orphans-desc">
<title id="orphans-title">The resources nobody owns</title>
<desc id="orphans-desc">Detached volumes, snapshots without retention, idle balancers, experiment clusters, non-production running overnight and stranded reserved capacity. An organizational failure that shows up as money.</desc>
<defs>
<marker id="orphans-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="orphans-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="orphans-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="orphans-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The resources nobody owns</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The last category is not a pricing model, it is an organizational failure that shows up as money.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Detached volumes</text>
<rect x="434" y="118" width="372" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Snapshots, no retention</text>
<rect x="828" y="118" width="372" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1014" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Idle load balancers</text>
<rect x="40" y="192" width="372" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="230" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Clusters from an experiment</text>
<rect x="434" y="192" width="372" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="216.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Non-production,</text><text x="620" y="243.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">nights and weekends</text>
<rect x="828" y="192" width="372" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="216.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reserved capacity,</text><text x="1014" y="243.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">workload moved</text>
<rect x="40" y="274" width="1160" height="74" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="274" width="5" height="74" rx="2.5" fill="#AC8BE8"/><text x="64" y="304" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Individually small, collectively a double-digit percentage of a bill</text><text x="64" y="330" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and nobody is certain they are unused, which is why they survive.</text>
<text x="40" y="382" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A design problem, so it has a design answer</text>
<rect x="40" y="400" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tagging enforced at creation</text>
<path d="M526 428H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 428H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orphans-marker-green)"/>
<rect x="570" y="400" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="434" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">untagged resources are the ones that survive forever</text>
<rect x="40" y="468" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="502" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An expiry set when created</text>
<path d="M526 496H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 496H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orphans-marker-green)"/>
<rect x="570" y="468" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="502" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because it will not be set later</text>
<rect x="40" y="536" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="570" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scheduled non-production shutdown</text>
<path d="M526 564H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 564H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#orphans-marker-green)"/>
<rect x="570" y="536" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="570" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the largest single saving available to most organizations</text>
<rect x="40" y="612" width="1160" height="58" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="612" width="5" height="58" rx="2.5" fill="#F3CF6A"/><text x="64" y="647" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Leaving is free when you take all your data. Operating is the expensive part.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A resource with no owner is a subscription with no cancel button.</text>
</svg>