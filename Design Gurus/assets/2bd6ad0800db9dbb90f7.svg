<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="706" viewBox="0 0 1240 706" role="img" aria-label="What the interviewer is actually scoring in a system design interview, and what a weak and a strong signal look like on each of five dimensions: problem solving, technical knowledge, scale and reliability, trade-offs, and communication. None of them is about knowing the answer in advance.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="706" fill="#FFFFFF"/>
  <path d="M499.0475 46 l18 18 M517.0475 46 l-18 18" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="590" y="62" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">weak signal</text>
  <path d="M888.6925 56 l7 8 l15 -17" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="990" y="62" font-size="19" font-weight="700" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">strong signal</text>
  <rect x="40" y="80" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M40 94 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#2563EB"/>
  <circle cx="76" cy="126" r="21" fill="#EFF6FF"/>
  <g transform="translate(63.5 113.5) scale(1.0417)" fill="none" stroke="#1D4ED8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1D4ED8"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5.5 5.5"/></g>
  <text x="112" y="133" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Problem solving</text>
  <rect x="400" y="92" width="380" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="418" y="124" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">starts drawing boxes in</text>
  <text x="418" y="149" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the first minute</text>
  <rect x="800" y="92" width="380" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="818" y="124" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">asks what the system must</text>
  <text x="818" y="149" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">do, before drawing anything</text>
  <rect x="40" y="184" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M40 198 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#4F46E5"/>
  <circle cx="76" cy="230" r="21" fill="#EEF2FF"/>
  <g transform="translate(63.5 217.5) scale(1.0417)" fill="none" stroke="#4338CA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#4338CA"><rect x="3.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.4"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.4"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.4"/></g>
  <text x="112" y="237" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Technical knowledge</text>
  <rect x="400" y="196" width="380" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="418" y="228" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">names technologies:</text>
  <text x="418" y="253" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"we would use Kafka here"</text>
  <rect x="800" y="196" width="380" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="818" y="228" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">says what each component</text>
  <text x="818" y="253" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">is there to do</text>
  <rect x="40" y="288" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M40 302 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#7C3AED"/>
  <circle cx="76" cy="334" r="21" fill="#F5F3FF"/>
  <g transform="translate(63.5 321.5) scale(1.0417)" fill="none" stroke="#6D28D9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6D28D9"><path d="M3.5 20.5h17"/><rect x="5" y="12" width="3.6" height="7" rx="1"/><rect x="10.2" y="8" width="3.6" height="11" rx="1"/><rect x="15.4" y="4.5" width="3.6" height="14.5" rx="1"/></g>
  <text x="112" y="341" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Scale and reliability</text>
  <rect x="400" y="300" width="380" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="418" y="332" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">one design, and no numbers</text>
  <text x="418" y="357" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">anywhere in it</text>
  <rect x="800" y="300" width="380" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="818" y="332" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">says where it breaks first,</text>
  <text x="818" y="357" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and at roughly what number</text>
  <rect x="40" y="392" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M40 406 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#D97706"/>
  <circle cx="76" cy="438" r="21" fill="#FFFBEB"/>
  <g transform="translate(63.5 425.5) scale(1.0417)" fill="none" stroke="#B45309" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#B45309"><path d="M12 3.5v5M4 13.5h16M4 13.5v6M12 13.5v6M20 13.5v6M12 8.5v5"/></g>
  <text x="112" y="445" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Trade-offs</text>
  <rect x="400" y="404" width="380" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="418" y="436" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"Cassandra is the best</text>
  <text x="418" y="461" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">choice here"</text>
  <rect x="800" y="404" width="380" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="818" y="436" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">"Cassandra, because ...,</text>
  <text x="818" y="461" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">at the cost of ..."</text>
  <rect x="40" y="496" width="1160" height="92" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6" filter="url(#sh)"/>
  <path d="M40 510 a14 14 0 0 1 14 -14 h0 v92 h0 a14 14 0 0 1 -14 -14 z" fill="#0D9488"/>
  <circle cx="76" cy="542" r="21" fill="#F0FDFA"/>
  <g transform="translate(63.5 529.5) scale(1.0417)" fill="none" stroke="#0F766E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#0F766E"><circle cx="6" cy="18" r="1.7" fill="currentColor" stroke="none"/><path d="M4.5 11.5a8 8 0 0 1 8 8M4.5 5.5a14 14 0 0 1 14 14"/></g>
  <text x="112" y="549" font-size="21" font-weight="700" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Communication</text>
  <rect x="400" y="508" width="380" height="68" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="418" y="540" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">silence, then a finished</text>
  <text x="418" y="565" font-size="19" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">drawing</text>
  <rect x="800" y="508" width="380" height="68" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="818" y="540" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">thinks out loud, and checks</text>
  <text x="818" y="565" font-size="19" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in as they go</text>
  <rect x="40" y="608" width="1160" height="62" rx="13" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
  <text x="620" y="647" font-size="21" font-weight="600" fill="#1D4ED8" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Not one of these is about knowing the answer before you walk in.</text>
</svg>