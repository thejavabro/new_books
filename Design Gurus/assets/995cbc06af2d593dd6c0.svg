<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three uploads of identical content are stored once under content addressing but three times under path addressing, and deleting one path breaks the links that pointed at it">
  <rect x="0" y="0" width="1240" height="708" fill="#FFFFFF"/>
  <defs>
    <marker id="st2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="st2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three people upload the same 40 MB attachment</text>

  
  <rect x="40" y="76" width="1160" height="256" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#065F46">Content addressed: identical bytes get one address</text>

  <rect x="70" y="140" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="170" font-size="20" fill="#334155" text-anchor="middle">upload from Ana</text>
  <rect x="70" y="196" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="226" font-size="20" fill="#334155" text-anchor="middle">upload from Ben</text>
  <rect x="70" y="252" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="282" font-size="20" fill="#334155" text-anchor="middle">upload from Chi</text>

  <line x1="304" y1="163" x2="426" y2="205" stroke="#059669" stroke-width="2" marker-end="url(#st2-emerald)"/>
  <line x1="304" y1="219" x2="426" y2="219" stroke="#059669" stroke-width="2" marker-end="url(#st2-emerald)"/>
  <line x1="304" y1="275" x2="426" y2="233" stroke="#059669" stroke-width="2" marker-end="url(#st2-emerald)"/>

  <rect x="430" y="180" width="420" height="78" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  <text x="640" y="212" font-size="20" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">sha256:9f2c4a...</text>
  <text x="640" y="242" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">stored once, 40 MB</text>

  <text x="890" y="212" font-size="20" font-weight="600" fill="#065F46">the second and third</text>
  <text x="890" y="242" font-size="20" font-weight="600" fill="#065F46">uploads cost nothing</text>

  
  <rect x="40" y="352" width="1160" height="256" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="386" font-size="20" font-weight="600" fill="#B91C1C">Path addressed: three names, three copies</text>

  <rect x="70" y="416" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="446" font-size="20" fill="#334155" text-anchor="middle">upload from Ana</text>
  <rect x="70" y="472" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="502" font-size="20" fill="#334155" text-anchor="middle">upload from Ben</text>
  <rect x="70" y="528" width="230" height="46" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="185" y="558" font-size="20" fill="#334155" text-anchor="middle">upload from Chi</text>

  <line x1="304" y1="439" x2="426" y2="439" stroke="#DC2626" stroke-width="2" marker-end="url(#st2-red)"/>
  <line x1="304" y1="495" x2="426" y2="495" stroke="#DC2626" stroke-width="2" marker-end="url(#st2-red)"/>
  <line x1="304" y1="551" x2="426" y2="551" stroke="#DC2626" stroke-width="2" marker-end="url(#st2-red)"/>

  <rect x="430" y="416" width="420" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="640" y="446" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">/ana/report.pdf</text>
  <rect x="430" y="472" width="420" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="640" y="502" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">/ben/report.pdf</text>
  <rect x="430" y="528" width="420" height="46" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="640" y="558" font-size="20" fill="#B91C1C" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">/chi/report.pdf</text>

  <text x="890" y="446" font-size="20" font-weight="600" fill="#B91C1C">120 MB for one file</text>
  <text x="890" y="502" font-size="20" font-weight="600" fill="#B91C1C">Ben leaves, path</text>
  <text x="890" y="530" font-size="20" font-weight="600" fill="#B91C1C">deleted, links 404</text>

  
  <rect x="40" y="632" width="1160" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="664" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Deduplication and link stability are the same property, seen from two directions.</text>
</svg>