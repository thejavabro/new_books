<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1200" viewBox="0 0 1240 1200" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Entity services fold into a handful of capability services: User, Address and Wishlist become a customer context; Cart, Order and Coupon become an ordering context; Product and Review become a catalog context; Payment stays as Payments with an idempotency key; Email and SMS are kept as is.">
  <defs>
    <marker id="m07-l11-regrouped-contexts-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m07-l11-regrouped-contexts-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m07-l11-regrouped-contexts-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1200" fill="#FFFFFF"/>

  <rect x="60" y="140" width="460" height="800" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="182" font-size="20" font-weight="600" fill="#B91C1C">Handed to you: one service per noun</text>
  <rect x="720" y="140" width="460" height="800" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="740" y="182" font-size="20" font-weight="600" fill="#065F46">The fix: capability services</text>

  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="80" y="230" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="290" y="287" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User, Address, Wishlist</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="740" y="230" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="287" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Customer context</text>
  <path d="M500,280 L732,280" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m07-l11-regrouped-contexts-em)"/>
  <text x="616" y="250" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">three into one</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="80" y="370" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="290" y="427" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Cart, Order, Coupon</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="740" y="370" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="427" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Ordering context</text>
  <path d="M500,420 L732,420" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m07-l11-regrouped-contexts-em)"/>
  <text x="616" y="390" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">three into one</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="80" y="510" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="290" y="567" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product, Review</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="740" y="510" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="950" y="567" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog context</text>
  <path d="M500,560 L732,560" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#m07-l11-regrouped-contexts-em)"/>
  <text x="616" y="530" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">two into one</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="80" y="650" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="707" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="740" y="650" width="420" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="950" y="707" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payments</text>
  <path d="M500,700 L732,700" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m07-l11-regrouped-contexts-sl)"/>
  <text x="616" y="670" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">it stays as is</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="80" y="790" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="847" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Email, SMS</text>
  <g filter="url(#m07-l11-regrouped-contexts-soft)">
    <rect x="740" y="790" width="420" height="100" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="950" y="847" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Notifications</text>
  <path d="M500,840 L732,840" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m07-l11-regrouped-contexts-sl)"/>
  <text x="616" y="810" text-anchor="middle" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">already right</text>

  <rect x="60" y="980" width="1120" height="90" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="1035" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">The direction is consolidation, not decomposition.</text>

  <line x1="60" y1="1120" x2="96" y2="1120" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1127" font-size="20" fill="#475569">Consolidation: entity services fold into one owner that owns its data</text>
  <line x1="60" y1="1160" x2="96" y2="1160" stroke="#64748B" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1167" font-size="20" fill="#475569">Unchanged: already a capability, so isolating it was right</text>
</svg>