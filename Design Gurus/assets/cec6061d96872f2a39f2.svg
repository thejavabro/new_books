<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="870" viewBox="0 0 1240 870" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two size bounds as a decision flow: a service must do its core job on its own data, and one team must be able to own it; failing either bound means too small or too big, passing both means right-sized at any size in the band">
  <defs>
    <marker id="m02-l03-size-checks-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l03-size-checks-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m02-l03-size-checks-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m02-l03-size-checks-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="870" fill="#FFFFFF"/>

  <rect x="40" y="140" width="760" height="440" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="178" font-size="20" font-weight="600" fill="#334155">The two bounds, one from each direction</text>

  <g fill="none" stroke-width="2.5">
    <path d="M470,130 L470,190" stroke="#475569" marker-end="url(#m02-l03-size-checks-sl)"/>
    <path d="M470,340 L470,400" stroke="#475569" marker-end="url(#m02-l03-size-checks-sl)"/>
    <path d="M470,550 L470,610" stroke="#059669" stroke-width="3" marker-end="url(#m02-l03-size-checks-em)"/>
    <path d="M720,265 L830,265" stroke="#DC2626" marker-end="url(#m02-l03-size-checks-rd)"/>
    <path d="M720,475 L830,475" stroke="#DC2626" marker-end="url(#m02-l03-size-checks-rd)"/>
  </g>

  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="514" y="377" fill="#065F46">Yes</text>
    <text x="514" y="587" fill="#065F46">Yes</text>
    <text x="775" y="253" fill="#B91C1C">No</text>
    <text x="775" y="463" fill="#B91C1C">No</text>
  </g>

  <g filter="url(#m02-l03-size-checks-soft)">
    <rect x="270" y="40" width="400" height="90" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Proposed service</text>
  <text x="470" y="110" text-anchor="middle" font-size="20" fill="#64748B">measured by responsibility, not code</text>

  <g filter="url(#m02-l03-size-checks-soft)">
    <path d="M470,190 L720,265 L470,340 L220,265 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="470" y="259" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Can it do its core job</text>
  <text x="470" y="287" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">on its own data?</text>

  <g filter="url(#m02-l03-size-checks-soft)">
    <path d="M470,400 L720,475 L470,550 L220,475 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2" stroke-linejoin="round"/>
  </g>
  <text x="470" y="469" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Can one team fully own</text>
  <text x="470" y="497" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">and understand it?</text>

  <g text-anchor="end">
    <text x="200" y="257" font-size="20" font-weight="600" fill="#334155">Lower bound</text>
    <text x="200" y="285" font-size="20" fill="#64748B">independence</text>
    <text x="200" y="467" font-size="20" font-weight="600" fill="#334155">Upper bound</text>
    <text x="200" y="495" font-size="20" fill="#64748B">ownership</text>
  </g>

  <g filter="url(#m02-l03-size-checks-soft)">
    <rect x="830" y="220" width="380" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1020" y="258" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Too small</text>
  <text x="1020" y="290" text-anchor="middle" font-size="20" fill="#64748B">a function with a network bill</text>

  <g filter="url(#m02-l03-size-checks-soft)">
    <rect x="830" y="430" width="380" height="90" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1020" y="468" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Too big</text>
  <text x="1020" y="500" text-anchor="middle" font-size="20" fill="#64748B">the release train returns</text>

  <g filter="url(#m02-l03-size-checks-soft)">
    <rect x="270" y="610" width="400" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="470" y="650" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Right-sized</text>
  <text x="470" y="682" text-anchor="middle" font-size="20" fill="#64748B">any size in this band works</text>
  <text x="470" y="712" text-anchor="middle" font-size="20" fill="#64748B">healthy even at 80,000 lines</text>

  <g stroke-width="4">
    <line x1="40" y1="790" x2="74" y2="790" stroke="#475569"/>
    <line x1="560" y1="790" x2="594" y2="790" stroke="#DC2626"/>
    <line x1="40" y1="830" x2="74" y2="830" stroke="#059669"/>
  </g>
  <text x="84" y="797" font-size="20" fill="#475569">Proceed to the next check</text>
  <text x="604" y="797" font-size="20" fill="#475569">Fails a bound: too small or too big</text>
  <text x="84" y="837" font-size="20" fill="#475569">Passes both checks: right-sized</text>
</svg>