<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sticky sessions pin a user to one server and lose the session when it dies, while an external session store lets any server serve the user and survives a server failure">
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
  <defs>
    <marker id="lb2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lb2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lb2-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="lb2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two ways to keep a user's session, and what each does when a server dies</text>

  
  <rect x="40" y="72" width="1160" height="316" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#92400E">Sticky sessions: the load balancer pins the user to one server</text>

  <line x1="264" y1="204" x2="360" y2="204" stroke="#D97706" stroke-width="2" marker-end="url(#lb2-amber)"/>
  <line x1="592" y1="204" x2="700" y2="204" stroke="#D97706" stroke-width="2" marker-end="url(#lb2-amber)"/>
  <text x="646" y="180" font-size="20" fill="#92400E" text-anchor="middle">always A</text>

  <g filter="url(#lb2-soft)">
    <rect x="80" y="168" width="184" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="364" y="168" width="228" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="704" y="152" width="250" height="104" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
    <rect x="984" y="168" width="180" height="72" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="172" y="212" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="478" y="200" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="478" y="226" font-size="20" fill="#92400E" text-anchor="middle">affinity cookie</text>
  <text x="829" y="186" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server A</text>
  <text x="829" y="216" font-size="20" fill="#B91C1C" text-anchor="middle">holds the session</text>
  <text x="829" y="242" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">crashes</text>
  <text x="1074" y="212" font-size="20" fill="#94A3B8" text-anchor="middle">Server B</text>

  <rect x="80" y="292" width="1084" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="622" y="324" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">The session dies with the server.</text>
  <text x="622" y="352" font-size="20" fill="#B91C1C" text-anchor="middle">Server B is healthy and idle, and cannot help: it never had the data.</text>

  
  <rect x="40" y="416" width="1160" height="340" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="450" font-size="20" font-weight="600" fill="#065F46">External session store: any server can serve any request</text>

  <line x1="264" y1="548" x2="360" y2="548" stroke="#059669" stroke-width="2" marker-end="url(#lb2-emerald)"/>
  <path d="M592 530 L700 500" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#lb2-red)"/>
  <path d="M592 566 L700 604" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#lb2-emerald)"/>
  <text x="620" y="636" font-size="20" fill="#065F46" text-anchor="middle">any server</text>

  <g filter="url(#lb2-soft)">
    <rect x="80" y="512" width="184" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="364" y="512" width="228" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="704" y="464" width="220" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="704" y="572" width="220" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="172" y="556" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User</text>
  <text x="478" y="556" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="814" y="498" font-size="20" fill="#B91C1C" text-anchor="middle">Server A crashed</text>
  <text x="814" y="606" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Server B serves it</text>

  <line x1="928" y1="608" x2="1000" y2="608" stroke="#059669" stroke-width="2" marker-end="url(#lb2-emerald)"/>

  <g filter="url(#lb2-soft)">
    <path d="M1004 590 a80 14 0 0 1 160 0 v40 a80 14 0 0 1 -160 0 z" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1084" cy="590" rx="80" ry="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="1084" y="620" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Redis</text>

  <rect x="80" y="668" width="1084" height="72" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="622" y="700" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">The session outlives any single server.</text>
  <text x="622" y="728" font-size="20" fill="#065F46" text-anchor="middle">Servers become stateless, so scaling out and rolling restarts stop being disruptive.</text>
</svg>