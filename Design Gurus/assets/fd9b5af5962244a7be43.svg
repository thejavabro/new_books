<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1664" viewBox="0 0 1240 1664" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The retry, concurrency, and conflict cheat sheet: idempotency keys, ETag and If-Match, expiring holds, and the other contention choices, each with the sentence to say.">
  <defs>
    <filter id="p4c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p4c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p4c-k1"><rect x="76" y="174" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k2"><rect x="76" y="348" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k3"><rect x="76" y="582" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k4"><rect x="76" y="756" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k5"><rect x="76" y="930" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k6"><rect x="76" y="1164" width="640" height="90" rx="12"/></clipPath>
    <clipPath id="p4c-k7"><rect x="76" y="1338" width="640" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1664" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Retry, concurrency, and conflict: who wins, and what it costs</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M640,66 L651,77 M651,66 L640,77"/>
  </g>
  <text x="666" y="77" font-size="15.5" fill="#6B7280">when it shows up</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M830,71 L834.5,75.5 L842,65.5"/>
  </g>
  <text x="856" y="77" font-size="15.5" fill="#6B7280">the sentence to say</text>

  
  <rect x="40" y="126" width="1160" height="384" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#1D4ED8">Repeat delivery: the same write arrives twice</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two choices</text>

  
  <g filter="url(#p4c-lift)">
    <rect x="76" y="174" width="640" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="174" width="9" height="90" fill="#2563EB" clip-path="url(#p4c-k1)"/>
  </g>
  <circle cx="114" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="226" font-size="18.5" font-weight="600" fill="#111827">Caller-generated idempotency key</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,279 L89,290 M89,279 L78,290"/>
  </g>
  <text x="104" y="290" font-size="15.5" fill="#6B7280">Repeating a create can duplicate meaningful work.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,310 L82.5,314.5 L90,304.5"/>
  </g>
  <text x="104" y="316" font-size="15.5" fill="#6B7280">"Choose a 24-hour idempotency record; accept storage, fingerprinting, and coordination."</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="348" width="640" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#p4c-k2)"/>
  </g>
  <circle cx="114" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,382.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="400" font-size="18.5" font-weight="600" fill="#111827">Persist the key at local intent creation</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,453 L89,464 M89,453 L78,464"/>
  </g>
  <text x="104" y="464" font-size="15.5" fill="#6B7280">Offline writes may be resent after an application restart.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,484 L82.5,488.5 L90,478.5"/>
  </g>
  <text x="104" y="490" font-size="15.5" fill="#6B7280">"Choose intent-time idempotency identity; accept durable client outbox state."</text>

  
  <rect x="40" y="534" width="1160" height="558" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="564" font-size="16.5" font-weight="600" fill="#5B21B6">Concurrent writers on one mutable resource</text>
  <text x="1176" y="564" text-anchor="end" font-size="15.5" fill="#6B7280">three choices</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="582" width="640" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="582" width="6" height="90" fill="#7C3AED" clip-path="url(#p4c-k3)"/>
  </g>
  <circle cx="114" cy="627" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,616.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="634" font-size="18.5" font-weight="600" fill="#111827">ETag and If-Match</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,687 L89,698 M89,687 L78,698"/>
  </g>
  <text x="104" y="698" font-size="15.5" fill="#6B7280">Two writers may overwrite the same mutable resource.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,718 L82.5,722.5 L90,712.5"/>
  </g>
  <text x="104" y="724" font-size="15.5" fill="#6B7280">"Choose conditional writes; accept 412 and a client-side refresh decision."</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="756" width="640" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="756" width="6" height="90" fill="#7C3AED" clip-path="url(#p4c-k4)"/>
  </g>
  <circle cx="114" cy="801" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,790.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="808" font-size="18.5" font-weight="600" fill="#111827">Whole-resource conditional update</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,861 L89,872 M89,861 L78,872"/>
  </g>
  <text x="104" y="872" font-size="15.5" fill="#6B7280">One person normally edits at a time.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,892 L82.5,896.5 L90,886.5"/>
  </g>
  <text x="104" y="898" font-size="15.5" fill="#6B7280">"Choose If-Match replacement; accept that a conflicting editor must merge or retry."</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="930" width="640" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#7C3AED" clip-path="url(#p4c-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">Ordered small changes with a published merge contract</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1035 L89,1046 M89,1035 L78,1046"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Two people edit simultaneously and neither should restart.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1066 L82.5,1070.5 L90,1060.5"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">"Choose change streaming; accept greater client and server complexity than whole-document replacement."</text>

  
  <rect x="40" y="1116" width="1160" height="384" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="1146" font-size="16.5" font-weight="600" fill="#B45309">Scarce capacity and time-bound value</text>
  <text x="1176" y="1146" text-anchor="end" font-size="15.5" fill="#6B7280">two choices</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="1164" width="640" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1164" width="6" height="90" fill="#D97706" clip-path="url(#p4c-k6)"/>
  </g>
  <circle cx="114" cy="1209" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1198.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1216" font-size="18.5" font-weight="600" fill="#111827">Expiring Hold resource</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1269 L89,1280 M89,1269 L78,1280"/>
  </g>
  <text x="104" y="1280" font-size="15.5" fill="#6B7280">Two callers compete for scarce capacity over several minutes.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1300 L82.5,1304.5 L90,1294.5"/>
  </g>
  <text x="104" y="1306" font-size="15.5" fill="#6B7280">"Choose a hold; accept temporarily hidden capacity and an expiry lifecycle."</text>

  
  <g filter="url(#p4c-soft)">
    <rect x="76" y="1338" width="640" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="1338" width="6" height="90" fill="#D97706" clip-path="url(#p4c-k7)"/>
  </g>
  <circle cx="114" cy="1383" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1372.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="1390" font-size="18.5" font-weight="600" fill="#111827">Expiring Quote resource</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1443 L89,1454 M89,1443 L78,1454"/>
  </g>
  <text x="104" y="1454" font-size="15.5" fill="#6B7280">Price must remain stable while a customer decides.</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1474 L82.5,1478.5 L90,1468.5"/>
  </g>
  <text x="104" y="1480" font-size="15.5" fill="#6B7280">"Choose a quote; accept that checkout may fail after expiry and require a new price promise."</text>

  
  <rect x="40" y="1524" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1566" text-anchor="middle" font-size="16" fill="#475569">A cheat sheet for retry, concurrency, and conflict: idempotency keys, ETag and If-Match, expiring holds, and the rest.</text>
  <text x="620" y="1594" text-anchor="middle" font-size="16" fill="#475569">Every choice carries a cost, and naming that cost out loud is the sentence the interviewer waits for.</text>
</svg>