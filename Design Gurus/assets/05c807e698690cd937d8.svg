<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">One shape, not one technique</title>
<desc id="shape-desc">Add, write both, backfill, verify and move reads, remove. A column type change, a store move, a partition key change and a provider swap are all this sequence, because the medium changes and the order does not.</desc>
<defs>
<marker id="shape-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shape-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shape-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shape-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="724" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">One shape, not one technique</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The shape is always the same five moves.</text>
<rect x="40" y="646" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="646" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="196" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="138" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add</text>
<path d="M242 154H276" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M242 154H276" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="281" y="118" width="196" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="379" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write both</text>
<path d="M483 154H517" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M483 154H517" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="522" y="118" width="196" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backfill</text>
<path d="M724 154H758" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M724 154H758" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="763" y="118" width="196" height="72" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="861" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Verify, move</text><text x="861" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">reads</text>
<path d="M965 154H999" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M965 154H999" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="1004" y="118" width="196" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1102" y="160" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Remove</text>
<text x="40" y="234" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The same five moves, whatever is changing</text>
<rect x="40" y="252" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a column type</text>
<rect x="434" y="252" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a table to another database</text>
<rect x="828" y="252" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1014" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a cache implementation</text>
<rect x="40" y="320" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a partition key</text>
<rect x="434" y="320" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a payment provider</text>
<rect x="828" y="320" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1014" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one table into two</text>
<rect x="40" y="404" width="1160" height="90" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="404" width="5" height="90" rx="2.5" fill="#AC8BE8"/><text x="64" y="440.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Expand and contract is not a database technique.</text><text x="64" y="469.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">It is what any migration looks like when every intermediate state has to work.</text>
<rect x="40" y="514" width="1160" height="106" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="514" width="5" height="106" rx="2.5" fill="#39D5AA"/><text x="64" y="547" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The test</text><text x="64" y="573" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">At every point, with any mixture of old and new code running, the system is correct.</text><text x="64" y="599" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A plan with a moment where that is untrue has an outage in it.</text>
<text x="66" y="680" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Recognizing it as a shape is what lets you apply it to migrations that look nothing like a rename.</text>
</svg>