<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One wide table repeats the customer details on every order row, while the normalized version stores them once and links the tables by customer id">
