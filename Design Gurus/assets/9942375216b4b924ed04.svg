<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A slot with capacity four is fully claimed by two active holds of two each, so remaining is zero. One hold is confirmed into a booking in one atomic state change. The other reaches its expiry, and its two places return to remaining capacity.">
  <defs>
    <marker id="p2s-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p2s-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p2s-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p2s-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2s-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2s-k1"><rect x="500" y="96" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p2s-k2"><rect x="140" y="348" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p2s-k3"><rect x="720" y="348" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p2s-k4"><rect x="140" y="520" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="p2s-k5"><rect x="720" y="520" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="816" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="628" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">A hold owns capacity until it expires or is consumed</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">two active holds, two places each</text>

  
  <g fill="none" stroke-width="2">
    <path d="M558,266 V286 Q558,298 546,298 H342 Q330,298 330,310 V348" stroke="#2563EB" marker-end="url(#p2s-bm)"/>
    <path d="M682,266 V286 Q682,298 694,298 H898 Q910,298 910,310 V348" stroke="#D97706" marker-end="url(#p2s-am)"/>
    <path d="M910,478 V520" stroke="#D97706" marker-end="url(#p2s-am)"/>
    <path d="M1100,565 H1146 Q1158,565 1158,553 V153 Q1158,141 1146,141 H740" stroke="#D97706" marker-end="url(#p2s-am)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M330,478 V520" stroke="#059669" marker-end="url(#p2s-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="440" y="303" fill="#1D4ED8">takes 2</text>
    <text x="800" y="303" fill="#B45309">takes 2</text>
    <text x="404" y="504" fill="#047857">confirmed</text>
    <text x="978" y="504" fill="#B45309">expired</text>
    <text x="930" y="146" fill="#B45309">capacity returns to the slot</text>
  </g>

  
  <g filter="url(#p2s-lift)">
    <rect x="500" y="96" width="240" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="500" y="96" width="9" height="90" fill="#64748B" clip-path="url(#p2s-k1)"/>
  </g>
  <circle cx="538" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,130.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="564" y="148" font-size="18.5" font-weight="600" fill="#111827">Slot</text>
  <text x="620" y="211" font-size="15.5" text-anchor="middle" fill="#6B7280">capacity 4, remaining 0</text>

  
  <rect x="500" y="232" width="54" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="562" y="232" width="54" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="624" y="232" width="54" height="34" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
  <rect x="686" y="232" width="54" height="34" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>

  
  <g filter="url(#p2s-soft)">
    <rect x="140" y="348" width="380" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="140" y="348" width="6" height="90" fill="#2563EB" clip-path="url(#p2s-k2)"/>
  </g>
  <circle cx="178" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,382.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="204" y="400" font-size="18.5" font-weight="600" fill="#111827">Hold, quantity 2</text>
  <text x="330" y="463" font-size="15.5" text-anchor="middle" fill="#6B7280">active</text>

  
  <g filter="url(#p2s-soft)">
    <rect x="720" y="348" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="720" y="348" width="6" height="90" fill="#D97706" clip-path="url(#p2s-k3)"/>
  </g>
  <circle cx="758" cy="393" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,382.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="784" y="400" font-size="18.5" font-weight="600" fill="#111827">Hold, quantity 2</text>
  <text x="910" y="463" font-size="15.5" text-anchor="middle" fill="#6B7280">active</text>

  
  <g filter="url(#p2s-soft)">
    <rect x="140" y="520" width="380" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="140" y="520" width="6" height="90" fill="#059669" clip-path="url(#p2s-k4)"/>
  </g>
  <circle cx="178" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(167.56,554.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="204" y="572" font-size="18.5" font-weight="600" fill="#111827">Booking</text>
  <text x="330" y="635" font-size="15.5" text-anchor="middle" fill="#6B7280">one atomic state change</text>

  
  <g filter="url(#p2s-soft)">
    <rect x="720" y="520" width="380" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="720" y="520" width="6" height="90" fill="#D97706" clip-path="url(#p2s-k5)"/>
  </g>
  <circle cx="758" cy="565" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,554.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="784" y="572" font-size="18.5" font-weight="600" fill="#111827">Expired</text>
  <text x="910" y="635" font-size="15.5" text-anchor="middle" fill="#6B7280">quantity 2 returns</text>

  
  <rect x="40" y="700" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="745" text-anchor="middle" font-size="16" fill="#475569">A slot is never simply marked as held. Remaining is capacity not claimed by an active hold or a booking.</text>
</svg>