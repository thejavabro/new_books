<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="logs-title logs-desc">
<title id="logs-title">Logs as data, not sentences</title>
<desc id="logs-desc">The reader is somebody else, in two years, at 3 am, trying to aggregate across a million lines. Message strings that interpolate values cannot be grouped, because every line is unique.</desc>
<defs>
<marker id="logs-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="logs-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="logs-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="logs-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="816" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Logs as data, not sentences</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The distinction is between a sentence and a record.</text>
<rect x="40" y="738" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="738" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="149" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A sentence: greppable at best, aggregatable never</text><text x="64" y="175" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">ERROR Failed to charge customer 8812 after 3 retries, giving up</text>
<rect x="40" y="214" width="1160" height="108" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="214" width="5" height="108" rx="2.5" fill="#39D5AA"/><text x="64" y="248" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A record: every field can be filtered, grouped and counted</text><text x="64" y="274" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">{"level":"error","event":"charge_failed","customer_id":8812,</text><text x="64" y="300" font-size="19" font-weight="400" fill="#080C50" text-anchor="start"> "attempts":3,"gateway":"primary","trace_id":"4bf92f35...","duration_ms":9120}</text>
<rect x="40" y="342" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="378" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Log events, not prose</text>
<path d="M526 372H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 372H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#logs-marker-slate)"/>
<rect x="570" y="342" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="378" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a stable event name, with the variable parts as fields</text>
<rect x="40" y="410" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Include the filters you will want</text>
<path d="M526 440H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 440H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#logs-marker-slate)"/>
<rect x="570" y="410" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="433.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">trace id, tenant, resource, code version.</text><text x="590" y="458.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Impossible to add later</text>
<rect x="40" y="478" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Log the decision, not just the outcome</text>
<path d="M526 508H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 508H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#logs-marker-slate)"/>
<rect x="570" y="478" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">why the fallback ran is worth more than the fact that it ran</text>
<rect x="40" y="546" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="582" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Keep levels meaningful</text>
<path d="M526 576H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 576H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#logs-marker-slate)"/>
<rect x="570" y="546" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="569.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">error means somebody should look,</text><text x="590" y="594.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which makes the count an indicator</text>
<rect x="40" y="626" width="1160" height="86" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="626" width="5" height="86" rx="2.5" fill="#F3CF6A"/><text x="64" y="662" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Log volume is priced by ingestion, so it grows with traffic and with every field added</text><text x="64" y="688" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Sample the high-volume success paths, keep errors unsampled, set retention by value.</text>
<text x="66" y="772" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">How many charges failed, by gateway, is a question only the second form can answer.</text>
</svg>