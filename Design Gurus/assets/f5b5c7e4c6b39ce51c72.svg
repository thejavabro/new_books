<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1300" viewBox="0 0 1240 1300" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two stacked panels. Traditional server architecture: clients send requests to three application servers, which all use one database; you manage provisioning, patches and operating system updates, auto scaling, replacing failed instances, and you pay for running servers even when idle. Serverless architecture: clients call an API gateway, which invokes three on-demand functions, which use managed services such as a database, object storage and a message queue, one function using two of them; the provider manages provisioning, fine-grained scaling including scale to zero, and runs across several availability zones by default on Lambda; you pay only for invocations and execution time, and the provider patches the operating system and runtime">
