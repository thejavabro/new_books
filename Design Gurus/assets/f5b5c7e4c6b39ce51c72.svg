  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Traditional server architecture vs. serverless architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">With traditional servers you manage the fleet; with serverless the provider manages it.</text>

