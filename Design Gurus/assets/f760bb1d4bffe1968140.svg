<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1024" viewBox="0 0 1240 1024" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Freshness published per operation rather than as one adjective for the whole API. A create is authoritative for what it returns, a read with a freshness token includes at least that write point, a report may lag by a published number of seconds, and a permission check never reuses stale authorization.">
  <defs>
    <filter id="p1k-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1k-k1"><rect x="76" y="146" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1k-k2"><rect x="76" y="318" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1k-k3"><rect x="76" y="490" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="p1k-k4"><rect x="76" y="662" width="360" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1024" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">"Reads are eventually consistent" tells a caller nothing</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">operation on the card, freshness promise beneath it</text>

  
  <rect x="40" y="126" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1k-soft)">
    <rect x="76" y="146" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p1k-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">POST /payments</text>
  <circle cx="86" cy="257" r="4.5" fill="#059669"/>
  <text x="106" y="263" font-size="15.5" fill="#6B7280">The response body is authoritative for the created payment</text>

  
  <rect x="40" y="298" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1k-soft)">
    <rect x="76" y="318" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="318" width="6" height="90" fill="#2563EB" clip-path="url(#p1k-k2)"/>
  </g>
  <circle cx="114" cy="363" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,352.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="140" y="370" font-size="18.5" font-weight="600" fill="#111827">GET /payments/{payment_id}</text>
  <circle cx="86" cy="429" r="4.5" fill="#2563EB"/>
  <text x="106" y="435" font-size="15.5" fill="#6B7280">With a valid freshness token, includes at least that token's write point</text>

  
  <rect x="40" y="470" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1k-soft)">
    <rect x="76" y="490" width="360" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="490" width="6" height="90" fill="#D97706" clip-path="url(#p1k-k3)"/>
  </g>
  <circle cx="114" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,524.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="542" font-size="18.5" font-weight="600" fill="#111827">GET /payment-reports</text>
  <circle cx="86" cy="601" r="4.5" fill="#D97706"/>
  <text x="106" y="607" font-size="15.5" fill="#6B7280">May lag accepted payments by up to 60 seconds</text>

  
  <rect x="40" y="642" width="1160" height="156" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p1k-soft)">
    <rect x="76" y="662" width="360" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="662" width="6" height="90" fill="#DB2777" clip-path="url(#p1k-k4)"/>
  </g>
  <circle cx="114" cy="707" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,696.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="714" font-size="18.5" font-weight="600" fill="#111827">GET /permissions/me</text>
  <circle cx="86" cy="773" r="4.5" fill="#DB2777"/>
  <text x="106" y="779" font-size="15.5" fill="#6B7280">Reflects current permission state; no stale authorization decision is reused</text>

  
  <rect x="40" y="822" width="1160" height="62" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="859" font-size="16.5" font-weight="600" fill="#1D4ED8">If the required freshness cannot be served in the deadline, return a named failure, not stale success.</text>

  
  <rect x="40" y="908" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="953" text-anchor="middle" font-size="16" fill="#475569">Publish the promise per operation, because different reads have different product needs.</text>
</svg>