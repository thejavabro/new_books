<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two load balancers share one address. The active one serves all the traffic. The passive one keeps checking whether the active one is alive, and takes over the same address if it stops.">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <marker id="lb5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lb5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lb5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lb5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lb5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lb5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lb5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two load balancers, one address</text>
  <g filter="url(#lb5-soft)"><rect x="50" y="196" width="150" height="64" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="125" y="234" font-size="20" fill="#0F172A" text-anchor="middle">client</text>
  <line x1="204" y1="228" x2="276" y2="228" stroke="#94A3B8" stroke-width="2.2" marker-end="url(#lb5-s)"/>
  <rect x="284" y="82" width="420" height="372" rx="11" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="494" y="118" font-size="21" font-weight="600" fill="#0F172A" text-anchor="middle">one address</text>
  <text x="494" y="146" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">203.0.113.10</text>
  <g filter="url(#lb5-soft)"><rect x="320" y="168" width="348" height="92" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="494" y="204" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">load balancer A</text>
  <text x="494" y="234" font-size="18" fill="#64748B" text-anchor="middle">active: it serves all the traffic</text>
  <g filter="url(#lb5-soft)"><rect x="320" y="330" width="348" height="92" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6" stroke-dasharray="6 5"/></g>
  <text x="494" y="366" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">load balancer B</text>
  <text x="494" y="396" font-size="18" fill="#64748B" text-anchor="middle">passive: it waits and watches</text>
  <line x1="360" y1="326" x2="360" y2="266" stroke="#94A3B8" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#lb5-s)"/>
  <text x="520" y="302" font-size="18" fill="#64748B" text-anchor="middle">B checks A every second</text>
  <g filter="url(#lb5-soft)"><rect x="980" y="98" width="200" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1080" y="137" font-size="20" fill="#0F172A" text-anchor="middle">server 1</text>
  <line x1="672" y1="214" x2="974" y2="130" stroke="#059669" stroke-width="2.2" marker-end="url(#lb5-e)"/>
  <g filter="url(#lb5-soft)"><rect x="980" y="196" width="200" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1080" y="235" font-size="20" fill="#0F172A" text-anchor="middle">server 2</text>
  <line x1="672" y1="214" x2="974" y2="228" stroke="#059669" stroke-width="2.2" marker-end="url(#lb5-e)"/>
  <g filter="url(#lb5-soft)"><rect x="980" y="294" width="200" height="64" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1080" y="333" font-size="20" fill="#0F172A" text-anchor="middle">server 3</text>
  <line x1="672" y1="214" x2="974" y2="326" stroke="#059669" stroke-width="2.2" marker-end="url(#lb5-e)"/>
  <rect x="50" y="472" width="1130" height="62" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="615" y="498" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">If A stops answering, B takes over the same address and the traffic keeps flowing.</text>
  <text x="615" y="524" font-size="19" fill="#64748B" text-anchor="middle">The client never chooses between them. It always sends to the same address.</text>
</svg>