<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="904" viewBox="0 0 1240 904" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Original nodes mapped to their copies, so a pointer to a node not yet copied still resolves"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="904" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="600" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">The map turns a pointer to an original into a pointer to its copy</text>
<rect x="300" y="190" width="140" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="370" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">A</text>
<rect x="560" y="190" width="140" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="630" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">B</text>
<rect x="820" y="190" width="140" height="70" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="890" y="233" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">C</text>
<text x="272" y="233" text-anchor="end" font-size="19.5" font-weight="600" fill="#475569">original</text>
<line x1="440" y1="225" x2="554" y2="225" stroke="#94A3B8" stroke-width="2"/>
<line x1="700" y1="225" x2="814" y2="225" stroke="#94A3B8" stroke-width="2"/>
<rect x="300" y="430" width="140" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="370" y="473" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">A'</text>
<rect x="560" y="430" width="140" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="630" y="473" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">B'</text>
<rect x="820" y="430" width="140" height="70" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="890" y="473" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">C'</text>
<text x="272" y="473" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">the copy</text>
<line x1="440" y1="465" x2="554" y2="465" stroke="#059669" stroke-width="2"/>
<line x1="700" y1="465" x2="814" y2="465" stroke="#059669" stroke-width="2"/>
<line x1="370" y1="266" x2="370" y2="424" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
<line x1="630" y1="266" x2="630" y2="424" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
<line x1="890" y1="266" x2="890" y2="424" stroke="#7C3AED" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#ar)"/>
<text x="1000" y="352" text-anchor="start" font-size="19.5" font-weight="600" fill="#5B21B6">the map</text>
<path d="M 370 190 Q 620 140 890 190" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 4"/>
<text x="620" y="132" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#475569">A.random points at C</text>
<path d="M 370 500 Q 620 560 890 500" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arg)"/>
<text x="620" y="590" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">so A'.random must point at C'</text>
<text x="200" y="635" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">C is not copied yet when A is wired, and the map is what resolves it</text>
<rect x="40" y="688" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="710" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="736" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">the original</text>
<text x="348" y="736" font-size="19.5" fill="#475569">never changed, and never pointed at by the copy</text>
<rect x="64" y="758" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="784" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the copy</text>
<text x="348" y="784" font-size="19.5" fill="#475569">created on first sight, before any pointer is followed</text>
<rect x="64" y="806" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="832" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the map entry</text>
<text x="348" y="832" font-size="19.5" fill="#475569">from each original node to the node that copies it</text>
</svg>