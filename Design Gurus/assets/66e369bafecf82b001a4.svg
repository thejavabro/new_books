<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="notyet-title notyet-desc">
<title id="notyet-title">What to exhaust before sharding</title>
<desc id="notyet-desc">Vertical scaling, a connection pooler, read replicas, caching the hot path and separating the one problem table all cost between an afternoon and a quarter. Sharding costs permanently, because every future migration, backup and schema change now happens N times.</desc>
<defs>
<marker id="notyet-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="notyet-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="notyet-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="notyet-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="728" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What to exhaust before sharding</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Before sharding, work through this checklist honestly.</text>
<rect x="40" y="650" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="650" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="400" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="150" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Scale the machine up</text>
<text x="460" y="150" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">an afternoon</text>
<rect x="40" y="182" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="214" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add a connection pooler</text>
<text x="540" y="214" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">an afternoon</text>
<rect x="40" y="246" width="560" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="278" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add read replicas</text>
<text x="620" y="278" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">a week</text>
<rect x="40" y="310" width="640" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="360" y="342" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cache the hot path</text>
<text x="700" y="342" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">a sprint</text>
<rect x="40" y="374" width="720" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="400" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Split the one hot table out</text>
<text x="780" y="406" font-size="20" font-weight="700" fill="#4A5568" text-anchor="start">a quarter</text>
<rect x="40" y="438" width="800" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="440" y="470" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shard</text>
<text x="860" y="470" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">permanent, every change x N</text>
<rect x="40" y="514" width="1160" height="110" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="514" width="5" height="110" rx="2.5" fill="#5EC9EC"/><text x="64" y="549" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">The threshold, honestly applied</text><text x="64" y="575" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">Over ~1 TB, or over ~10,000 sustained writes/sec, AFTER vertical scaling.</text><text x="64" y="601" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A 50 GB database doing 5,000 writes/sec needs a bigger instance and a pooler.</text>
<text x="66" y="684" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The width of each bar is the work it creates. Only the last one keeps creating work after it ships.</text>
</svg>