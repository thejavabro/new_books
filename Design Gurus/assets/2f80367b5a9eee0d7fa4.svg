<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Treat a model as one more component in the diagram">
  <defs>
    <marker id="m1l0c-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m1l0c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l0c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m1l0c-k1"><rect x="390" y="64" width="460" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M620,195 L620,208"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M185,208 L1055,208"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M185,208 L185,228" marker-end="url(#m1l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M475,208 L475,228" marker-end="url(#m1l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M765,208 L765,228" marker-end="url(#m1l0c-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M1055,208 L1055,228" marker-end="url(#m1l0c-mslate)"/></g>
  <g filter="url(#m1l0c-lift)">
    <rect x="390" y="64" width="460" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="390" y="64" width="9" height="90" fill="#7C3AED" clip-path="url(#m1l0c-k1)"/>
  </g>
  <circle cx="428" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,98.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="454" y="116" font-size="18.5" font-weight="600" fill="#111827">A model</text>
  <text x="620" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">a function that learns patterns from data</text>
  <rect x="50" y="228" width="270" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
  <text x="185" y="262" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8">Response time</text>
  <rect x="340" y="228" width="270" height="56" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  <text x="475" y="262" text-anchor="middle" font-size="16.5" font-weight="600" fill="#B45309">Cost per request</text>
  <rect x="630" y="228" width="270" height="56" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="765" y="262" text-anchor="middle" font-size="16.5" font-weight="600" fill="#BE185D">Possible failures</text>
  <rect x="920" y="228" width="270" height="56" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="1055" y="262" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">Deployment and updates</text>
  <rect x="40" y="322" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="356" font-size="16" fill="#475569">Training learns or updates a model. Inference uses the model to produce results.</text>
  <rect x="64" y="382" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="404" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">System component</text>
  <text x="288" y="404" font-size="15.5" fill="#475569">plan its inputs, outputs, cost, and behavior when something fails</text>
  <rect x="64" y="426" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="448" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Training</text>
  <text x="288" y="448" font-size="15.5" fill="#475569">often runs in background jobs, separately from live user requests</text>
  <rect x="64" y="470" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="492" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Inference</text>
  <text x="288" y="492" font-size="15.5" fill="#475569">runs for live requests or in background batches</text>
  <rect x="40" y="540" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="585" text-anchor="middle" font-size="16" fill="#475569">Show training and inference separately. Measure output quality as well as response time.</text>
</svg>