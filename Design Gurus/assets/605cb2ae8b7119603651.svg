<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1308" viewBox="0 0 1240 1308" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of a course purchase after the change. 1, the browser sends POST /checkout to the Billing API. 2, Billing calls the API application to authenticate the session, get the user and check access. 3, Billing stores a pending session in PostgreSQL. 4, Billing asks the payment provider for a checkout page with an idempotency key. 5, Billing returns the page address to the browser. 6, the learner pays on the hosted page. 7, the provider sends the payment.succeeded webhook to the Billing API. 8, in one transaction Billing stores the event ID, marks the payment paid and adds a grant job and a receipt job. 9, the worker from the api image claims the grant job about 1 second later. 10, the worker runs grant_access, which writes the enrollment. 11, the browser polls GET /checkout/{id}. 12, Billing calls the API application to check access, which now exists. 13, Billing answers ready, within about 3 seconds of the webhook.">
