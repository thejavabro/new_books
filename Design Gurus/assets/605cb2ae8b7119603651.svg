  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="218" y="251" fill="#1D4ED8">1. POST /checkout</text>
    <text x="414" y="311" fill="#1D4ED8">2. authenticate, get user, access check</text>
    <text x="512" y="371" fill="#1D4ED8">3. pending session</text>
    <text x="708" y="431" fill="#1D4ED8">4. create checkout page, idempotency key</text>
    <text x="218" y="491" fill="#1D4ED8">5. page address</text>
    <text x="610" y="551" fill="#1D4ED8">6. learner pays on the hosted page</text>
    <text x="708" y="611" fill="#1D4ED8">7. webhook: payment.succeeded</text>
    <text x="512" y="671" fill="#1D4ED8">8. one transaction:</text>
    <text x="512" y="708" fill="#1D4ED8">event ID, paid, grant and receipt jobs</text>
    <text x="806" y="761" fill="#B45309">9. claim grant job, about 1 s</text>
    <text x="806" y="821" fill="#B45309">10. grant_access writes enrollment</text>
    <text x="218" y="881" fill="#1D4ED8">11. poll GET /checkout/{id}</text>
    <text x="414" y="941" fill="#1D4ED8">12. access check</text>
    <text x="218" y="1001" fill="#1D4ED8">13. ready, within about 3 s</text>
  </g>

