<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Fault tolerance: a server fails, the other active copies are already serving, and users see nothing. High availability: a server fails, the system detects it and fails over in about 30 seconds, and then service is back.">
  <defs>
    <filter id="ft1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ft1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ft1-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ft1-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ft1-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ft1-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ft1-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="ft1-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="ft1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">What happens after a server fails</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same failure, seen from the user side under each promise.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Fault tolerance: users never notice</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#047857">High availability: users rarely notice, and only briefly</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#ft1-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#ft1-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#ft1-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#ft1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ft1-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#ft1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Server fails</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">one copy stops</text>
  <g filter="url(#ft1-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#7C3AED" clip-path="url(#ft1-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">Copies already serve</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">nothing needs to switch</text>
  <g filter="url(#ft1-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#059669" clip-path="url(#ft1-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">Users see nothing</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">no downtime, no data loss</text>
  <g filter="url(#ft1-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#ft1-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">Server fails</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">one copy stops</text>
  <g filter="url(#ft1-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#D97706" clip-path="url(#ft1-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">Detect and fail over</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a short pause, like 30 seconds</text>
  <g filter="url(#ft1-soft)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="836" y="430" width="6" height="90" fill="#059669" clip-path="url(#ft1-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Service is back</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">recent writes may be lost</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Fault tolerance</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">costs more, because every copy is active all the time</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">High availability</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">costs less, and accepts a brief interruption</text>
</svg>