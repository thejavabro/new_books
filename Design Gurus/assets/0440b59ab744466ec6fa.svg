<rect x="0" y="0" width="1240" height="668" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Can "SEE" be spelled by walking neighbouring cells?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Each step moves up, down, left or right, and no cell may be used twice</text>
