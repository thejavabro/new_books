<text x="620" y="234" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Two cells hold an S, so the search has two starting points to try</text>
<rect x="40" y="544" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="584" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A wrong path is not a failure, it is information</text>
<text x="620" y="616" text-anchor="middle" font-size="18.5" fill="#475569">The search undoes its last step and tries the next neighbour instead</text>
