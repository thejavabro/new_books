<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="668" viewBox="0 0 1240 668" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The board and the word before the search starts">
<defs>
