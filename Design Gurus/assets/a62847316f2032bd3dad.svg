er-events="all"/><g transform="translate(-0.5 -0.5)"><text x="18" y="315" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="18" y="315">A</tspan></text></g><rect x="152" y="220" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="235" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="235">B</tspan></text></g><rect x="152" y="260" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="275" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="275">B</tspan></text></g><rect x="152" y="460" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="475" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="475">B</tspan></text></g><rect x="152" y="300" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="315" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="315">B</tspan></text></g><rect x="152" y="340" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="355" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="355">B</tspan></text></g><rect x="152" y="380" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="395" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="395">B</tspan></text></g><rect x="152" y="420" width="30" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="154" y="435" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="154" y="435">B</tspan></text></g><rect x="186" y="71" width="390" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="86" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="86">Interface: Classes implement interfaces, denoted by Realization.</tspan></text></g><rect x="186" y="149" width="340" height="40" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="164" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="156.8">Class: Every class can have properties and methods.</tspan><tspan x="188" y="171.2">Abstract classes are identified by their Italic names.</tspan></text></g><rect x="186" y="220" width="200" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="235" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="235">Realization: A implements B.</tspan></text></g><rect x="186" y="260" width="240" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="275" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="275">Generalization: A inherits from B, so A "is-a" B.</tspan></text></g><rect x="186" y="300" width="210" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="315" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="315">Dependency: A uses B, which is often an interface.</tspan></text></g><rect x="186" y="340" width="220" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="355" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="355">Association: A and B call each other.</tspan></text></g><rect x="186" y="380" width="350" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="395" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="395">Uni-directional Association: A can call B, but not vice versa.</tspan></text></g><rect x="186" y="420" width="350" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="435" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="435">Aggregation: A "has-an" instance of B. B can exist without A.</tspan></text></g><rect x="186" y="460" width="370" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="188" y="475" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px"><tspan x="188" y="475">Composition: A "has-an" instance of B. B cannot exist without A.</tspan></text></g><rect x="203" y="12" width="120" height="20" fill="none" stroke="none" pointer-events="all"/><g transform="translate(-0.5 -0.5)"><text x="263" y="27" fill="rgb(0, 0, 0)" font-family="Helvetica" font-size="12px" text-anchor="middle" font-weight="bold"><tspan x="263" y="27">UML conventions</tspan></text></g></g><switch><g requiredFeatures="http://www.w3.org/TR/SVG11/feature#Extensibility"/><a transform="translate(0,-5)" target="_blank"><text text-anchor="middle" font-size="10px" x="50%" y="100%">Text is not SVG - cannot display</text></a></switch></svg>