<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="804" viewBox="0 0 1240 804" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="shape-title shape-desc">
<title id="shape-title">A workload with unusual properties</title>
<desc id="shape-desc">Five properties break the instincts the rest of the course builds, and every subsequent decision depends on getting the shape right.</desc>
<defs>
<marker id="shape-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="shape-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="shape-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="shape-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="804" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A workload with unusual properties</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Five properties break the instincts the rest of the course builds.</text>
<rect x="40" y="726" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="726" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="130" y="118" width="420" height="66" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="340" y="143.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prefill</text><text x="340" y="170.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the whole input at once</text>
<path d="M556 151H604" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M556 151H604" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="612" y="118" width="498" height="66" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="861" y="143.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">decode</text><text x="861" y="170.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one token at a time, for an unknown count</text>
<text x="620" y="214" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">completely different resource profiles, inside one request</text>
<rect x="40" y="236" width="480" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Duration is unknown in advance</text>
<path d="M526 264H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 264H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="236" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every queueing and timeout assumption is shakier than usual</text>
<rect x="40" y="304" width="480" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Memory binds, not compute</text>
<path d="M526 332H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="304" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="325.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the attention cache for in-flight requests</text><text x="590" y="350.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is what limits concurrency</text>
<rect x="40" y="372" width="480" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The unit of cost is the token</text>
<path d="M526 400H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 400H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="372" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="393.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">two requests to the same endpoint can differ</text><text x="590" y="418.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">by three orders of magnitude</text>
<rect x="40" y="440" width="480" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Latency has two numbers</text>
<path d="M526 468H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 468H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="570" y="440" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">time to the first token, and the rate after that</text>
<rect x="40" y="520" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="561" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Requests per second against instances produces a model wrong in both directions.</text>
<text x="40" y="628" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So the levers are different, in this order</text>
<rect x="40" y="646" width="248" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="164" y="679" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">batching</text>
<path d="M294 673H338" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M294 673H338" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="344" y="646" width="248" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="468" y="679" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">caching</text>
<path d="M598 673H642" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M598 673H642" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="648" y="646" width="248" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="772" y="679" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">routing</text>
<path d="M902 673H946" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M902 673H946" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#shape-marker-slate)"/>
<rect x="952" y="646" width="248" height="54" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1076" y="679" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">not calling it</text>
<text x="66" y="760" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Adding instances is the expensive lever and the last one.</text>
</svg>