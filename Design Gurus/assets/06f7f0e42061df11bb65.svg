<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="950" viewBox="0 0 1240 950" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Backends for frontends: the mobile app, web app and third parties all pass one shared edge layer that handles auth, rate limits and TLS, then reach their own mobile, web or partner API BFF, and all three BFFs call the same Catalog, Checkout and Orders services.">
  <defs>
    <marker id="m03-l06-bff-per-client-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m03-l06-bff-per-client-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="950" fill="#FFFFFF"/>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l06-bff-per-client-blue)">
    <path d="M220,234 C220,262 350,262 350,286"/>
    <path d="M620,234 L620,286"/>
    <path d="M1020,234 C1020,262 890,262 890,286"/>
    <path d="M350,424 C350,452 220,456 220,486"/>
    <path d="M620,424 L620,486"/>
    <path d="M890,424 C890,452 1020,456 1020,486"/>
    <path d="M220,634 C220,662 350,666 350,686"/>
    <path d="M620,634 L620,686"/>
    <path d="M1020,634 C1020,662 890,666 890,686"/>
  </g>

  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="60" y="100" width="320" height="134" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="142" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mobile app</text>
  <text x="220" y="174" text-anchor="middle" font-size="20" fill="#64748B">tiny payloads,</text>
  <text x="220" y="206" text-anchor="middle" font-size="20" fill="#64748B">coarse endpoints</text>
  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="460" y="100" width="320" height="134" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="620" y="142" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Web app</text>
  <text x="620" y="174" text-anchor="middle" font-size="20" fill="#64748B">rich pages,</text>
  <text x="620" y="206" text-anchor="middle" font-size="20" fill="#64748B">more data per screen</text>
  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="860" y="100" width="320" height="134" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1020" y="142" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Third parties</text>
  <text x="1020" y="174" text-anchor="middle" font-size="20" fill="#64748B">stability and</text>
  <text x="1020" y="206" text-anchor="middle" font-size="20" fill="#64748B">strict versioning</text>

  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="260" y="290" width="720" height="134" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="620" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shared edge layer</text>
  <text x="620" y="364" text-anchor="middle" font-size="20" fill="#475569">auth, rate limits, TLS, and every request passes here</text>
  <text x="620" y="396" text-anchor="middle" font-size="20" fill="#475569">one implementation, not three</text>

  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="60" y="490" width="320" height="144" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="537" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Mobile BFF</text>
  <text x="220" y="569" text-anchor="middle" font-size="20" fill="#64748B">the 6 fields the screen</text>
  <text x="220" y="601" text-anchor="middle" font-size="20" fill="#64748B">shows, not the 60</text>
  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="460" y="490" width="320" height="144" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="537" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Web BFF</text>
  <text x="620" y="569" text-anchor="middle" font-size="20" fill="#64748B">richer page payloads,</text>
  <text x="620" y="601" text-anchor="middle" font-size="20" fill="#64748B">web release pace</text>
  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="860" y="490" width="320" height="144" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1020" y="537" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Partner API BFF</text>
  <text x="1020" y="569" text-anchor="middle" font-size="20" fill="#64748B">stable, strictly versioned</text>
  <text x="1020" y="601" text-anchor="middle" font-size="20" fill="#64748B">for outside developers</text>

  <g filter="url(#m03-l06-bff-per-client-soft)">
    <rect x="260" y="690" width="720" height="134" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="732" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Catalog, Checkout, Orders</text>
  <text x="620" y="764" text-anchor="middle" font-size="20" fill="#64748B">shared by all three BFFs</text>
  <text x="620" y="796" text-anchor="middle" font-size="20" fill="#64748B">topology can change freely</text>

  <g font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="648" y="268">all client traffic</text>
    <text x="648" y="464">routed by client type</text>
    <text x="648" y="668">all three call the same services</text>
  </g>

  <line x1="50" y1="872" x2="86" y2="872" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="879" font-size="20" fill="#475569">Synchronous path: the shared edge layer first, then that client's own BFF</text>
  <text x="50" y="919" font-size="20" fill="#64748B">Cost: several thin gateways instead of one, so shared auth and rate limiting live in the one shared layer.</text>
</svg>