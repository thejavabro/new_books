<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="802" viewBox="0 0 1240 802" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The model chooses what users see, users act only on that, and a small exploration slice adds outcomes the model would never choose">
  <defs>
    <marker id="mdr3-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="mdr3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="mdr3-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="mdr3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="mdr3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="mdr3-k1"><rect x="458" y="40" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="mdr3-k2"><rect x="80" y="256" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="mdr3-k3"><rect x="440" y="256" width="256" height="90" rx="12"/></clipPath>
    <clipPath id="mdr3-k4"><rect x="880" y="256" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="mdr3-k5"><rect x="890" y="501" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="mdr3-k6"><rect x="454" y="501" width="228" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="802" fill="#FFFFFF"/>
  <rect x="40" y="196" width="1160" height="205" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="226" font-size="16.5" font-weight="600" fill="#1D4ED8">Online: what users see</text>
  <rect x="40" y="441" width="1160" height="205" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="471" font-size="16.5" font-weight="600" fill="#B45309">Offline: the next training set</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M260,301 H440" marker-end="url(#mdr3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M696,301 H880" marker-end="url(#mdr3-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M568,167 V256" marker-end="url(#mdr3-mviolet)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M980,383 V501" marker-end="url(#mdr3-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M890,546 H682" marker-end="url(#mdr3-mslate)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M454,546 H32 Q20,546 20,534 V313 Q20,301 32,301 H80" marker-end="url(#mdr3-mamber)"/></g>
  <g filter="url(#mdr3-soft)">
    <rect x="458" y="40" width="220" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="458" y="40" width="6" height="90" fill="#7C3AED" clip-path="url(#mdr3-k1)"/>
  </g>
  <circle cx="496" cy="85" r="18" fill="#FFFFFF"/>
  <g transform="translate(485.56,74.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="522" y="92" font-size="18.5" font-weight="600" fill="#111827">Exploration slice</text>
  <text x="568" y="155" font-size="15.5" text-anchor="middle" fill="#6B7280">1 to 5 percent of traffic</text>
  <g filter="url(#mdr3-soft)">
    <rect x="80" y="256" width="180" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="256" width="6" height="90" fill="#2563EB" clip-path="url(#mdr3-k2)"/>
  </g>
  <circle cx="118" cy="301" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,290.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="144" y="308" font-size="18.5" font-weight="600" fill="#111827">Model</text>
  <text x="170" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">ranks the items</text>
  <g filter="url(#mdr3-soft)">
    <rect x="440" y="256" width="256" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="256" width="6" height="90" fill="#2563EB" clip-path="url(#mdr3-k3)"/>
  </g>
  <circle cx="478" cy="301" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,290.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="504" y="308" font-size="18.5" font-weight="600" fill="#111827">Feed shows 20 items</text>
  <text x="568" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">the model's top choices</text>
  <g filter="url(#mdr3-soft)">
    <rect x="880" y="256" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="880" y="256" width="6" height="90" fill="#2563EB" clip-path="url(#mdr3-k4)"/>
  </g>
  <circle cx="918" cy="301" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,290.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="944" y="308" font-size="18.5" font-weight="600" fill="#111827">Users click</text>
  <text x="980" y="371" font-size="15.5" text-anchor="middle" fill="#6B7280">only on what the feed showed</text>
  <g filter="url(#mdr3-soft)">
    <rect x="890" y="501" width="180" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="890" y="501" width="6" height="90" fill="#059669" clip-path="url(#mdr3-k5)"/>
  </g>
  <circle cx="928" cy="546" r="18" fill="#FFFFFF"/>
  <g transform="translate(917.56,535.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="954" y="553" font-size="18.5" font-weight="600" fill="#111827">Logs</text>
  <text x="980" y="616" font-size="15.5" text-anchor="middle" fill="#6B7280">clicks, with the probability each item was chosen</text>
  <g filter="url(#mdr3-soft)">
    <rect x="454" y="501" width="228" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="454" y="501" width="6" height="90" fill="#D97706" clip-path="url(#mdr3-k6)"/>
  </g>
  <circle cx="492" cy="546" r="18" fill="#FFFFFF"/>
  <g transform="translate(481.56,535.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="518" y="553" font-size="18.5" font-weight="600" fill="#111827">Next training run</text>
  <text x="568" y="616" font-size="15.5" text-anchor="middle" fill="#6B7280">learns from those clicks</text>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="582" y="216" fill="#5B21B6">items outside the top choices</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="247" y="532" fill="#B45309">each round narrows the choices further</text></g>
  <rect x="40" y="686" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="731" text-anchor="middle" font-size="16" fill="#475569">Exploration costs a little metric today and keeps the training data honest for next quarter.</text>
</svg>