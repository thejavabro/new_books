<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" role="img" aria-label="Almost every estimate derives from the agreed user count: users and actions give load, load and object size give storage from totals, and viewing time gives bandwidth from concurrency.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="480" fill="#FFFFFF"/>
  <rect x="50" y="66" width="300" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="200" y="108" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Daily active users</text>
  <text x="200" y="133" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the one you agree or assume</text>
  <rect x="490" y="66" width="260" height="88" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="620" y="108" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Actions per user</text>
  <text x="620" y="133" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">posts, views, uploads</text>
  <line x1="352" y1="110" x2="488" y2="110" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="890" y="66" width="280" height="88" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1030" y="108" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Requests per second</text>
  <text x="1030" y="133" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">then multiply for peak</text>
  <line x1="752" y1="110" x2="888" y2="110" stroke="#3B82F6" stroke-width="2" marker-end="url(#ar-blu)"/>
  <rect x="240" y="252" width="320" height="96" rx="10" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5" filter="url(#sh)"/>
  <text x="400" y="298" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Storage</text>
  <text x="400" y="323" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">from totals: every item ever kept</text>
  <rect x="710" y="252" width="340" height="96" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="880" y="298" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Bandwidth</text>
  <text x="880" y="323" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">from concurrency: who is active now</text>
  <path d="M596 158 C 560 200, 430 200, 400 250" fill="none" stroke="#6D28D9" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M648 158 C 690 200, 850 200, 880 250" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="396" width="1160" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="434" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The split that matters: storage comes from totals, bandwidth comes from concurrency.</text>
</svg>