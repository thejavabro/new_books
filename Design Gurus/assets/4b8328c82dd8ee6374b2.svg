<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A chaos experiment defines normal behavior with metrics, predicts what should happen, injects a small failure, then compares the metrics with normal and fixes any weakness.">
  <defs>
    <filter id="re5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="re5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="re5-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re5-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re5-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="re5-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="re5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The four steps of a chaos experiment</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Break something small on purpose, and check that the system behaves as predicted.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#re5-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#re5-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#re5-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#re5-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#re5-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">1. Define normal</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">checkout success rate</text>
  <g filter="url(#re5-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#re5-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Predict</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">"checkout keeps working"</text>
  <g filter="url(#re5-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#re5-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Inject</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">stop one reviews instance</text>
  <g filter="url(#re5-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#re5-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">4. Compare</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fix any weakness found</text>

  <rect x="40" y="300" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="325" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="350" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Start small</text>
  <text x="323" y="350" font-size="18.5" fill="#475569">one instance or 1% of traffic, in a test environment first</text>
  <rect x="64" y="375" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="400" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Tools</text>
  <text x="323" y="400" font-size="18.5" fill="#475569">Chaos Monkey randomly stops instances; Gremlin runs many kinds of failures</text>
</svg>