<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1220" viewBox="0 0 1240 1220" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Choreography: an event source sends an event to function A (process order), which writes to object storage, an event source that triggers function B (charge payment), which publishes to a message queue, an event source that triggers function C (update inventory); no function calls another function directly. Orchestration: an event source starts a workflow orchestrator, such as Step Functions, which holds the workflow state, sends commands to function A (process order), function B (charge payment) and function C (update inventory), and receives each outcome to decide the next step">
