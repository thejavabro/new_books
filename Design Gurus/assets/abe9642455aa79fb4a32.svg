  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Choreography vs. orchestration in serverless architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Functions either trigger each other through events, or a central orchestrator coordinates them.</text>

