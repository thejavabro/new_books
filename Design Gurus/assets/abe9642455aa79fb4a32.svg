  <text x="928" y="1042" font-size="21.5" font-weight="600" fill="#111827">Function C</text>
  <text x="1004" y="1109" font-size="18.5" text-anchor="middle" fill="#6B7280">(Update inventory)</text>
  <text x="594" y="967" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example, Step Functions,</text>
  <text x="594" y="994" font-size="18.5" text-anchor="middle" fill="#6B7280">which holds the workflow state)</text>
  <text x="64" y="180" font-size="18.5" fill="#6B7280">Functions communicate through events. Each function acts independently and triggers the next step.</text>
  <text x="64" y="660" font-size="18.5" fill="#6B7280">A central orchestrator coordinates the workflow, manages state, retries, and controls the execution flow.</text>




