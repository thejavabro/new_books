<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated collaborative whiteboard architecture: sticky routed stateful websocket server, optimistic local updates, asynchronous persistence and viewport culling">
  <defs>
    <filter id="mi-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="mi-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="mi-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="mi-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="mi-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="mi-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Collaborative whiteboard: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">A stateful server per board, optimistic clients, and writes that never wait for a database</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. One board, one server · sticky routing is what makes the rest work</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">connect</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#mi-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">sticky</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">register</text>
  <g filter="url(#mi-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">renders instantly</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Load balancer</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">hash on board id</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">WebSocket server</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">board state in RAM</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis routing</text>
  <text x="1089" y="262" font-size="20" fill="#065F46" text-anchor="middle">board to server ip</text>

  <rect x="24" y="338" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Dragging a note · the client never waits for the server</text>
  <path d="M264,436 L349,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="307" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">drag</text>
  <path d="M577,436 L662,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="620" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">op</text>
  <path d="M890,436 L975,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="933" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#mi-soft)">
    <rect x="40" y="398" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="398" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="979" y="398" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User A</text>
  <text x="150" y="458" font-size="20" fill="#64748B" text-anchor="middle">optimistic redraw</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Throttle</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">20 a second, not 60</text>
  <text x="776" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Server memory</text>
  <text x="776" y="458" font-size="20" fill="#64748B" text-anchor="middle">last write wins</text>
  <text x="1089" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">User B</text>
  <text x="1089" y="458" font-size="20" fill="#64748B" text-anchor="middle">sees it in 50ms</text>

  <rect x="24" y="534" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="566" font-size="20" font-weight="600" fill="#92400E">3. Saving (asynchronous) · 5 million events a second cannot hit a database</text>
  <path d="M264,632 L349,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#mi-amber)"/>
  <text x="307" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">emit</text>
  <path d="M577,632 L662,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#mi-amber)"/>
  <text x="620" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M890,632 L975,632" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#mi-amber)"/>
  <text x="933" y="620" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">save</text>
  <g filter="url(#mi-soft)">
    <rect x="40" y="594" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M353,609 L353,655 A110,15 0 0 0 573,655 L573,609" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="463" cy="609" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="594" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,609 L979,655 A110,15 0 0 0 1199,655 L1199,609" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="609" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">WebSocket server</text>
  <text x="150" y="654" font-size="20" fill="#64748B" text-anchor="middle">does not block</text>
  <text x="463" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="463" y="700" font-size="20" fill="#92400E" text-anchor="middle">buffers the firehose</text>
  <text x="776" y="628" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Writer</text>
  <text x="776" y="654" font-size="20" fill="#64748B" text-anchor="middle">debounces the moves</text>
  <text x="1089" y="643" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">MongoDB</text>
  <text x="1089" y="700" font-size="20" fill="#5B21B6" text-anchor="middle">sharded by board id</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#475569">4. Big boards and crashes · what stops a 1,000 person board melting</text>
  <path d="M364,874 L456,874" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#mi-blue)"/>
  <text x="410" y="862" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">slow link</text>
  <path d="M784,874 L876,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#mi-amber)"/>
  <text x="830" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on crash</text>
  <g filter="url(#mi-soft)">
    <rect x="40" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="836" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,851 L880,897 A160,15 0 0 0 1200,897 L1200,851" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="851" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Viewport culling</text>
  <text x="200" y="896" font-size="20" fill="#64748B" text-anchor="middle">only your tiles</text>
  <text x="620" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Snapshot mode</text>
  <text x="620" y="896" font-size="20" fill="#64748B" text-anchor="middle">drops mid frames</text>
  <text x="1040" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Rebuild</text>
  <text x="1040" y="942" font-size="20" fill="#5B21B6" text-anchor="middle">reload from Mongo</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>