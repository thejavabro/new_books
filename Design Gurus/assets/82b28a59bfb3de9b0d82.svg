  </g>
  <text x="484" y="262" font-size="18.5" font-weight="600" fill="#111827">Shared cache</text>
  <text x="570" y="325" text-anchor="middle" font-size="15.5" fill="#6B7280">Cache-Control: public</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="820" y="210" width="290" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="820" y="210" width="6" height="90" fill="#DB2777" clip-path="url(#p1o-k4)"/>
  </g>
  <circle cx="858" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,244.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="884" y="262" font-size="18.5" font-weight="600" fill="#111827">A's profile</text>
  <text x="965" y="325" text-anchor="middle" font-size="15.5" fill="#6B7280">B receives the body that belonged to A.</text>

  
  <rect x="64" y="410" width="1112" height="334" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="88" y="440" font-size="16.5" font-weight="600" fill="#047857">Safe: private per caller, shared only for caller-independent data</text>

  
  <path d="M610,462 V726" fill="none" stroke="#A7D9C3" stroke-width="1.8" stroke-dasharray="7 6"/>

  <text x="88" y="482" font-size="16.5" font-weight="600" fill="#047857">Profile: private, per caller</text>
  <text x="634" y="482" font-size="16.5" font-weight="600" fill="#047857">Catalog: public, shared</text>

  
  <g fill="none" stroke-width="2">
    <path d="M278,553 H328" stroke="#059669" marker-end="url(#p1o-em)"/>
    <path d="M278,673 H328" stroke="#059669" marker-end="url(#p1o-em)"/>
    <path d="M864,553 H914" stroke="#059669" stroke-width="2.5" marker-end="url(#p1o-em)"/>
  </g>

  
  <g filter="url(#p1o-soft)">
    <rect x="88" y="508" width="190" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="508" width="6" height="90" fill="#64748B" clip-path="url(#p1o-k5)"/>
  </g>
  <circle cx="126" cy="553" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,542.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="560" font-size="18.5" font-weight="600" fill="#111827">Caller A</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="328" y="508" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="328" y="508" width="6" height="90" fill="#059669" clip-path="url(#p1o-k6)"/>
  </g>
  <circle cx="366" cy="553" r="18" fill="#FFFFFF"/>
  <g transform="translate(355.56,542.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="392" y="560" font-size="18.5" font-weight="600" fill="#111827">A's own copy</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="88" y="628" width="190" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="88" y="628" width="6" height="90" fill="#64748B" clip-path="url(#p1o-k7)"/>
  </g>
  <circle cx="126" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,662.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="680" font-size="18.5" font-weight="600" fill="#111827">Caller B</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="328" y="628" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="328" y="628" width="6" height="90" fill="#059669" clip-path="url(#p1o-k8)"/>
  </g>
  <circle cx="366" cy="673" r="18" fill="#FFFFFF"/>
  <g transform="translate(355.56,662.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="392" y="680" font-size="18.5" font-weight="600" fill="#111827">B's own copy</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="634" y="508" width="230" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="634" y="508" width="6" height="90" fill="#64748B" clip-path="url(#p1o-k9)"/>
  </g>
  <circle cx="672" cy="553" r="18" fill="#FFFFFF"/>
  <g transform="translate(661.56,542.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="698" y="560" font-size="18.5" font-weight="600" fill="#111827">GET /catalog</text>

  
  <g filter="url(#p1o-lift)">
    <rect x="914" y="508" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="914" y="508" width="9" height="90" fill="#059669" clip-path="url(#p1o-k10)"/>
  </g>
  <circle cx="952" cy="553" r="18" fill="#FFFFFF"/>
  <g transform="translate(941.56,542.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="978" y="560" font-size="18.5" font-weight="600" fill="#111827">Shared cache</text>
  <text x="1029" y="623" text-anchor="middle" font-size="15.5" fill="#6B7280">The same body suits every caller,</text>
  <text x="1029" y="646" text-anchor="middle" font-size="15.5" fill="#94A3B8">so sharing it is safe.</text>

  
  <rect x="40" y="792" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="837" text-anchor="middle" font-size="16" fill="#475569">A response that depends on who is calling is never public.</text>
</svg>