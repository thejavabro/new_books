    <rect x="420" y="210" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="420" y="210" width="9" height="90" fill="#DB2777" clip-path="url(#p1o-k3)"/>
