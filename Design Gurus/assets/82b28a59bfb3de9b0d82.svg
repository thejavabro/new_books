    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="152" y="322" font-size="18.5" font-weight="600" fill="#111827">Caller B</text>

  
