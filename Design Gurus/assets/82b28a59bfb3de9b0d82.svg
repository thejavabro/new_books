<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="908" viewBox="0 0 1240 908" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="In the unsafe path a personalized profile marked public enters a shared cache, which then serves one caller&#39;s body to another. In the safe path each caller keeps its own private copy while only the caller-independent catalog is shared.">
  <defs>
    <marker id="p1o-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p1o-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p1o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1o-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1o-k1"><rect x="88" y="150" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k2"><rect x="88" y="270" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k3"><rect x="420" y="210" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k4"><rect x="820" y="210" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k5"><rect x="88" y="508" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k6"><rect x="328" y="508" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k7"><rect x="88" y="628" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k8"><rect x="328" y="628" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k9"><rect x="634" y="508" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="p1o-k10"><rect x="914" y="508" width="230" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="908" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="728" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">What a shared cache may reuse</text>

  
  <rect x="64" y="92" width="1112" height="294" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="88" y="122" font-size="16.5" font-weight="600" fill="#BE185D">Unsafe: a personalized response marked public</text>

  
  <g fill="none" stroke-width="2">
    <path d="M288,195 H342 Q354,195 354,207 V223 Q354,235 366,235 H420" stroke="#DB2777" marker-end="url(#p1o-pm)"/>
    <path d="M288,315 H342 Q354,315 354,303 V287 Q354,275 366,275 H420" stroke="#DB2777" marker-end="url(#p1o-pm)"/>
    <path d="M720,255 H820" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p1o-pm)"/>
  </g>

  
