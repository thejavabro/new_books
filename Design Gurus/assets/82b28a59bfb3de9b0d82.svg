  </g>
  <text x="152" y="202" font-size="18.5" font-weight="600" fill="#111827">Caller A</text>

  
  <g filter="url(#p1o-soft)">
    <rect x="88" y="270" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
