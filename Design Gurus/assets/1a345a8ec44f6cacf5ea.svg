<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With pull, one post is written with one write, and each of the 5,000 feed loads builds the feed, so the cost is paid on every read. With push, the post is copied to followers when it is written, and each of the 5,000 feed loads is one lookup, so the cost is paid once at write time.">
  <defs>
    <filter id="pvp4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pvp4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pvp4-k1"><rect x="64" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvp4-k2"><rect x="450" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvp4-k3"><rect x="836" y="180" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvp4-k4"><rect x="64" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvp4-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="pvp4-k6"><rect x="836" y="430" width="340" height="90" rx="12"/></clipPath>
    <marker id="pvp4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Push moves work from read time to write time</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One post is written once and appears in 5,000 feed loads.</text>

  <rect x="40" y="120" width="1160" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#B45309">Pull: the work happens on every read</text>
  <rect x="40" y="370" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="400" font-size="19.5" font-weight="600" fill="#047857">Push: the work happens once, at write time</text>

  <g fill="none" stroke-width="2">
    <path d="M404,225 H450" stroke="#64748B" marker-end="url(#pvp4-m-slate)"/>
    <path d="M790,225 H836" stroke="#64748B" marker-end="url(#pvp4-m-slate)"/>
    <path d="M404,475 H450" stroke="#64748B" marker-end="url(#pvp4-m-slate)"/>
    <path d="M790,475 H836" stroke="#64748B" marker-end="url(#pvp4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#pvp4-soft)">
    <rect x="64" y="180" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#pvp4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1 post written</text>
  <text x="234" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">1 cheap write</text>
  <g filter="url(#pvp4-soft)">
    <rect x="450" y="180" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="450" y="180" width="6" height="90" fill="#D97706" clip-path="url(#pvp4-k2)"/>
  </g>
  <circle cx="488" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="232" font-size="21.5" font-weight="600" fill="#111827">5,000 feed loads</text>
  <text x="620" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">each one builds the feed</text>
  <g filter="url(#pvp4-soft)">
    <rect x="836" y="180" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="836" y="180" width="6" height="90" fill="#D97706" clip-path="url(#pvp4-k3)"/>
  </g>
  <circle cx="874" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,214.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="900" y="232" font-size="21.5" font-weight="600" fill="#111827">5,000 builds</text>
  <text x="1006" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">cost on every read</text>
  <g filter="url(#pvp4-soft)">
    <rect x="64" y="430" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="430" width="6" height="90" fill="#64748B" clip-path="url(#pvp4-k4)"/>
  </g>
  <circle cx="102" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="128" y="482" font-size="21.5" font-weight="600" fill="#111827">1 post written</text>
  <text x="234" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">copied to followers</text>
  <g filter="url(#pvp4-soft)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="450" y="430" width="6" height="90" fill="#059669" clip-path="url(#pvp4-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">5,000 feed loads</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">each one is a lookup</text>
  <g filter="url(#pvp4-lift)">
    <rect x="836" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="836" y="430" width="9" height="90" fill="#059669" clip-path="url(#pvp4-k6)"/>
  </g>
  <circle cx="874" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="900" y="482" font-size="21.5" font-weight="600" fill="#111827">Cheap reads</text>
  <text x="1006" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">cost paid at write time</text>

  <rect x="40" y="620" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Reads win</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">when reads far outnumber writes, push is the better trade</text>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Writes win</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">when writes outnumber reads, the answer reverses to pull</text>
</svg>