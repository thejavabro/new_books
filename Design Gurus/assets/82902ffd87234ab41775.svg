<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="488" viewBox="0 0 1240 488" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The tasks and their counts">
<defs>
<filter id="sc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="488" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How long does [a, a, a, b, c, c] take with a gap of 2 between equal tasks?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">a runs 3 times, b runs 1 time, c runs 2 times</text>
<rect x="40" y="106" width="1160" height="230" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Every task in the heap, most frequent on top</text>
<text x="403" y="202" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="425" y="166" width="118" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="484" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<text x="484" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">3 left</text>
<rect x="561" y="166" width="118" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<text x="620" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">2 left</text>
<rect x="697" y="166" width="118" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="756" y="201.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">b</text>
<text x="756" y="244" text-anchor="middle" font-size="15.5" fill="#94A3B8">1 left</text>
<text x="309" y="304" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">timeline</text>
<text x="337" y="303" font-size="18" fill="#475569">nothing scheduled yet</text>
<rect x="40" y="358" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="398" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Run up to 3 different tasks in a row, then start again</text>
<text x="620" y="430" text-anchor="middle" font-size="18.5" fill="#475569">3 in a row is exactly the spacing the gap requires</text>
</svg>