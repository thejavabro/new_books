<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated rate limiter architecture: gateway middleware, atomic Redis check, local short circuit for blocked users, fail open behaviour and sharding">
  <defs>
    <filter id="rl-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="rl-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rl-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rl-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rl-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rl-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Distributed rate limiter: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">The hot path check, the atomic Lua script, and the two paths that keep it off Redis</text>

  <rect x="24" y="96" width="1192" height="314" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. The hot path · every request pays this, so it must cost under 10ms</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">request</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#rl-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Lua</text>
  <path d="M620,232 L620,300" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="638" y="274" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">if allowed</text>
  <g filter="url(#rl-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="460" y="304" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">10,000 QPS</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">runs the check</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis</text>
  <text x="1040" y="262" font-size="20" fill="#065F46" text-anchor="middle">limiter:{user}:{route}</text>
  <text x="620" y="338" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Backend</text>
  <text x="620" y="364" font-size="20" fill="#64748B" text-anchor="middle">never sees a block</text>

  <rect x="24" y="440" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="472" font-size="20" font-weight="600" fill="#475569">2. The algorithm · sliding window counter, one atomic script, no race</text>
  <path d="M364,538 L456,538" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="410" y="526" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">add</text>
  <path d="M784,538 L876,538" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="830" y="526" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">compare</text>
  <g filter="url(#rl-soft)">
    <path d="M40,515 L40,561 A160,15 0 0 0 360,561 L360,515" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="200" cy="515" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M460,515 L460,561 A160,15 0 0 0 780,561 L780,515" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="515" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="500" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="549" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Previous window</text>
  <text x="200" y="606" font-size="20" fill="#065F46" text-anchor="middle">weighted by overlap</text>
  <text x="620" y="549" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Current window</text>
  <text x="620" y="606" font-size="20" fill="#065F46" text-anchor="middle">counted in full</text>
  <text x="1040" y="534" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Verdict</text>
  <text x="1040" y="560" font-size="20" fill="#64748B" text-anchor="middle">allow or 429</text>

  <rect x="24" y="682" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="714" font-size="20" font-weight="600" fill="#475569">3. Keeping Redis out of the way · a bot must not cost 1,000 round trips</text>
  <path d="M364,780 L456,780" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="410" y="768" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">flood</text>
  <path d="M784,780 L876,780" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#rl-blue)"/>
  <text x="830" y="768" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">instant</text>
  <g filter="url(#rl-soft)">
    <rect x="40" y="742" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M460,757 L460,803 A160,15 0 0 0 780,803 L780,757" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="757" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="880" y="742" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="776" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bot</text>
  <text x="200" y="802" font-size="20" fill="#64748B" text-anchor="middle">1,000 per second</text>
  <text x="620" y="791" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Local block list</text>
  <text x="620" y="848" font-size="20" fill="#065F46" text-anchor="middle">in gateway RAM, 1s</text>
  <text x="1040" y="776" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Rejected</text>
  <text x="1040" y="802" font-size="20" fill="#64748B" text-anchor="middle">429 with Retry-After</text>

  <rect x="24" y="924" width="1192" height="166" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="956" font-size="20" font-weight="600" fill="#92400E">4. When Redis dies · fail open, because a limiter must never take the site down</text>
  <path d="M264,1022 L349,1022" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#rl-amber)"/>
  <text x="307" y="1010" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no reply</text>
  <path d="M577,1022 L662,1022" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#rl-amber)"/>
  <text x="620" y="1010" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">default</text>
  <path d="M890,1022 L975,1022" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#rl-amber)"/>
  <text x="933" y="1010" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">recovers</text>
  <g filter="url(#rl-soft)">
    <rect x="40" y="984" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="353" y="984" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="984" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="979" y="984" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="1018" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Gateway</text>
  <text x="150" y="1044" font-size="20" fill="#64748B" text-anchor="middle">waits 10ms</text>
  <text x="463" y="1018" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Timeout</text>
  <text x="463" y="1044" font-size="20" fill="#64748B" text-anchor="middle">circuit trips</text>
  <text x="776" y="1018" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Allow anyway</text>
  <text x="776" y="1044" font-size="20" fill="#64748B" text-anchor="middle">logs and passes</text>
  <text x="1089" y="1018" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sharded Redis</text>
  <text x="1089" y="1044" font-size="20" fill="#64748B" text-anchor="middle">by user id</text>
  <line x1="44" y1="1150" x2="72" y2="1150" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1157" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1150" x2="344.576" y2="1150" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1157" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1141" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1157" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1141" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1157" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1141" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1157" font-size="20" fill="#475569">core service</text>
</svg>