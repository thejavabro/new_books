<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram. The producer team deploys a rename of the field total to amount on the Order API, both consumer teams then receive responses with no total field and their parsers fail in production, while the producer team&#39;s own metrics stay perfectly healthy.">
  <defs>
    <marker id="m06-l06-breaking-change-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m06-l06-breaking-change-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m06-l06-breaking-change-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="600" y="280" width="580" height="380" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1160" y="320" text-anchor="end" font-size="20" font-weight="600" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">damage lands where the producer never looks</text>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="185" y1="145" x2="185" y2="660"/>
    <line x1="475" y1="145" x2="475" y2="660"/>
    <line x1="765" y1="145" x2="765" y2="660"/>
    <line x1="1055" y1="145" x2="1055" y2="660"/>
  </g>

  <g fill="none" stroke-width="2.5">
    <path d="M191,220 L469,220" stroke="#7C3AED" marker-end="url(#m06-l06-breaking-change-vi)"/>
    <path d="M481,380 L759,380" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m06-l06-breaking-change-rd)"/>
    <path d="M481,460 L1049,460" stroke="#DC2626" stroke-dasharray="6 5" marker-end="url(#m06-l06-breaking-change-rd)"/>
  </g>

  <text x="330" y="208" text-anchor="middle" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Rename total to amount</text>
  <text x="330" y="248" text-anchor="middle" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no compiler finds the callers</text>
  <text x="620" y="368" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Response has no total field</text>
  <text x="765" y="448" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Response has no total field</text>

  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="650" y="510" width="510" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="905" y="556" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Both parsers fail</text>
  <text x="905" y="588" text-anchor="middle" font-size="20" fill="#64748B">at 2 PM, in production</text>
  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="60" y="510" width="300" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="210" y="556" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Producer metrics look healthy</text>
  <text x="210" y="588" text-anchor="middle" font-size="20" fill="#64748B">nothing throws on this side</text>

  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="50" y="50" width="270" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="185" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Producer team</text>
  <text x="185" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">ships on its own</text>
  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="340" y="50" width="270" height="95" rx="10" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="475" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order API</text>
  <text x="475" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">the contract</text>
  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="630" y="50" width="270" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="765" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumer A</text>
  <text x="765" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">reads total</text>
  <g filter="url(#m06-l06-breaking-change-soft)">
    <rect x="920" y="50" width="270" height="95" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1055" y="88.5" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consumer B</text>
  <text x="1055" y="120.5" text-anchor="middle" font-size="20" fill="#64748B">reads total</text>

  <line x1="60" y1="700" x2="96" y2="700" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="707" font-size="20" fill="#475569">The producer deploys on its own schedule</text>
  <line x1="60" y1="740" x2="96" y2="740" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="747" font-size="20" fill="#475569">The break, arriving in somebody else</text>
</svg>