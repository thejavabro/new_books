<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">A sample 45-minute design plan</title><desc id="desc">The 45-minute practice plan allocates 5 minutes to requirements, 8 to API and data, 10 to architecture, 17 to detail, and 5 to the closing review.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="800" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">A sample 45-minute design plan</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Count from the start of discussing the design question.</tspan></text><rect x="80" y="150" width="1040" height="73" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="105" y="196" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="105" dy="0">Requirements: 0-5 minutes</tspan></text><rect x="80" y="243" width="1040" height="73" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="105" y="289" font-size="26" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="105" dy="0">API and data: 5-13 minutes</tspan></text><rect x="80" y="336" width="1040" height="73" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="105" y="382" font-size="26" fill="#059669" font-weight="700" text-anchor="start"><tspan x="105" dy="0">Architecture: 13-23 minutes</tspan></text><rect x="80" y="429" width="1040" height="73" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="105" y="475" font-size="26" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="105" dy="0">Detailed discussion: 23-40 minutes</tspan></text><rect x="80" y="522" width="1040" height="73" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="105" y="568" font-size="26" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="105" dy="0">Recovery and summary: 40-45 minutes</tspan></text><rect x="50" y="655" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="701" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Consider failures throughout; adjust this practice plan when needed.</tspan></text></g></svg>