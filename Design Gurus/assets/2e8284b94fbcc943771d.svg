<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="816" viewBox="0 0 1240 816" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="tools-title tools-desc">
<title id="tools-title">Tools are the dangerous part</title>
<desc id="tools-desc">The classification that matters is by reversibility rather than by function, and the rule that follows is the most important design decision in the lesson.</desc>
<defs>
<marker id="tools-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="tools-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="tools-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="tools-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="816" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Tools are the dangerous part</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The classification that matters is by reversibility rather than by function.</text>
<rect x="40" y="738" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="738" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="320" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="200" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Read-only</text>
<rect x="370" y="118" width="380" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="153" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">query, search, fetch</text>
<rect x="760" y="118" width="440" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="780" y="140.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">safe to retry, the large majority</text><text x="780" y="165.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">of useful tools</text>
<rect x="40" y="186" width="320" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="200" y="221" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Reversible writes</text>
<rect x="370" y="186" width="380" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="208.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">create a draft, set a field,</text><text x="390" y="233.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">add a record</text>
<rect x="760" y="186" width="440" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="780" y="221" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recoverable with effort</text>
<rect x="40" y="254" width="320" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="200" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Irreversible or external</text>
<rect x="370" y="254" width="380" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="390" y="276.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">send a message, charge a card,</text><text x="390" y="301.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">delete something</text>
<rect x="760" y="254" width="440" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="780" y="289" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">needs different treatment entirely</text>
<rect x="40" y="336" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="336" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="362.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Irreversible actions need a confirmation step or a hard-coded policy</text><text x="64" y="391.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">They are never left to the model's judgment alone.</text>
<text x="40" y="438" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four further practices come straight from earlier modules</text>
<rect x="40" y="456" width="400" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="491" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Timeouts and budgets per tool</text>
<path d="M446 485H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 485H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tools-marker-slate)"/>
<rect x="490" y="456" width="710" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="491" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">an agent is a client that will retry enthusiastically</text>
<rect x="40" y="522" width="400" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="557" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Run with the user's permissions</text>
<path d="M446 551H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 551H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tools-marker-slate)"/>
<rect x="490" y="522" width="710" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="557" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">broad agent credentials acting for one user is privilege escalation</text>
<rect x="40" y="588" width="400" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="623" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tool output is untrusted input</text>
<path d="M446 617H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 617H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tools-marker-slate)"/>
<rect x="490" y="588" width="710" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="610.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">fetched content can contain instructions, and the model</text><text x="510" y="635.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">does not reliably tell data from direction</text>
<rect x="40" y="654" width="400" height="58" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="689" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Validate parameters in code</text>
<path d="M446 683H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 683H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#tools-marker-slate)"/>
<rect x="490" y="654" width="710" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="689" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the model proposes, the code checks ranges, types and ownership</text>
<text x="66" y="772" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The decision to take an irreversible action should not rest solely on a non-deterministic component.</text>
</svg>