<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="350" viewBox="0 0 1240 350" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sliding window check at 03:01:50: one old timestamp is dropped, three remain inside the last minute, so the incoming request is rejected and nothing is inserted.">
  <defs>
    <marker id="rl09-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1240" height="350" fill="#FFFFFF"/>

  
  <g font-size="15.5" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="80" y="52" fill="#475569">1. remove timestamps older than one minute</text>
    <text x="80" y="76" fill="#475569">2. three remain inside the window</text>
    <text x="80" y="100" fill="#BE185D">3. reject and insert nothing</text>
  </g>

  
  <rect x="536" y="130" width="500" height="58" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="560" y="164" font-size="16.5" font-weight="600" fill="#5B21B6">sliding window (one minute)</text>
  <line x1="536" y1="188" x2="536" y2="242" stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 4"/>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="1036" y="72" fill="#BE185D">incoming at 03:01:50</text>
  </g>
  <path d="M1036,116 V246" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#rl09-pk)"/>
  <circle cx="1036" cy="100" r="13" fill="#DB2777"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <path d="M1031,95 l10,10 M1041,95 l-10,10"/>
  </g>

  
  <g stroke="#64748B" stroke-width="2">
    <line x1="80" y1="250" x2="1160" y2="250"/>
    <line x1="120" y1="242" x2="120" y2="258"/>
    <line x1="620" y1="242" x2="620" y2="258"/>
    <line x1="1120" y1="242" x2="1120" y2="258"/>
  </g>
  <g font-size="15.5" text-anchor="middle" fill="#6B7280">
    <text x="120" y="285">03:00</text>
    <text x="620" y="285">03:01</text>
    <text x="1120" y="285">03:02</text>
  </g>

  
  <circle cx="453" cy="250" r="11" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2"/>
  <g fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round">
    <path d="M449,246 l8,8 M457,246 l-8,8"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="453" y="226" fill="#475569">dropped</text>
  </g>

  
  <g fill="#059669">
    <circle cx="661" cy="250" r="11"/>
    <circle cx="786" cy="250" r="11"/>
    <circle cx="995" cy="250" r="11"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M656,250 l3.5,3.5 l6.5,-7.5"/>
    <path d="M781,250 l3.5,3.5 l6.5,-7.5"/>
    <path d="M990,250 l3.5,3.5 l6.5,-7.5"/>
  </g>

  
  <g font-size="15.5" text-anchor="middle" fill="#6B7280">
    <text x="453" y="312">03:00:40</text>
    <text x="661" y="312">03:01:05</text>
    <text x="786" y="312">03:01:20</text>
    <text x="995" y="312">03:01:45</text>
  </g>
</svg>