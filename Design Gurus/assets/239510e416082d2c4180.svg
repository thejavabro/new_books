<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1040" viewBox="0 0 1240 1040" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two questions decide every edge in the order flow. First: is someone waiting on this answer? If yes, the edge is a synchronous call, and a second question decides the protocol: REST over HTTPS on the public edge, gRPC between internal services. If no, publish an event and move on, and the event goes to a broker topic where consumers read at their own pace.">
  <defs>
    <marker id="m03-l07-edge-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m03-l07-edge-decision-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m03-l07-edge-decision-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l07-edge-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1040" fill="#FFFFFF"/>

  <rect x="30" y="400" width="640" height="520" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="52" y="438" font-size="20" font-weight="600" fill="#1E3A8A">Synchronous branch</text>
  <text x="648" y="438" text-anchor="end" font-size="20" fill="#64748B">then choose the protocol</text>

  <rect x="700" y="400" width="500" height="520" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="722" y="438" font-size="20" font-weight="600" fill="#92400E">Asynchronous branch</text>
  <text x="1178" y="438" text-anchor="end" font-size="20" fill="#64748B">no second question</text>

  <g fill="none">
    <path d="M630,180 L630,214" stroke="#475569" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-sl)"/>
    <path d="M500,368 C420,412 350,410 350,456" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-bl)"/>
    <path d="M760,368 C846,412 950,410 950,456" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-ab)"/>
    <path d="M350,560 L350,600" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-bl)"/>
    <path d="M262,752 C214,786 183,788 183,822" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-bl)"/>
    <path d="M438,752 C486,786 525,788 525,822" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-bl)"/>
    <path d="M950,560 L950,822" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l07-edge-decision-ab)"/>
  </g>

  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="440" y="50" width="380" height="130" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="630" y="94" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">One edge in the flow</text>
  <text x="630" y="128" text-anchor="middle" font-size="20" fill="#64748B">one call or one message</text>
  <text x="630" y="160" text-anchor="middle" font-size="20" fill="#64748B">between two parts of the system</text>

  <g filter="url(#m03-l07-edge-decision-soft)">
    <path d="M630,220 L880,320 L630,420 L380,320 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="630" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Is someone waiting</text>
  <text x="630" y="342" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">on this answer?</text>

  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="180" y="460" width="340" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="350" y="506" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Synchronous call</text>
  <text x="350" y="536" text-anchor="middle" font-size="20" fill="#64748B">the caller waits</text>
  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="730" y="460" width="440" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="950" y="506" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Publish an event and move on</text>
  <text x="950" y="536" text-anchor="middle" font-size="20" fill="#64748B">nothing here delays the user</text>

  <g filter="url(#m03-l07-edge-decision-soft)">
    <path d="M350,600 L570,700 L350,800 L130,700 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="350" y="708" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Is this the public edge?</text>

  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="48" y="822" width="270" height="94" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="183" y="865" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">REST over HTTPS</text>
  <text x="183" y="895" text-anchor="middle" font-size="20" fill="#64748B">the public edge</text>
  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="390" y="822" width="270" height="94" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="525" y="865" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">gRPC internally</text>
  <text x="525" y="895" text-anchor="middle" font-size="20" fill="#64748B">cheaper per call</text>
  <g filter="url(#m03-l07-edge-decision-soft)">
    <rect x="730" y="822" width="440" height="94" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="950" y="865" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker topic</text>
  <text x="950" y="895" text-anchor="middle" font-size="20" fill="#64748B">consumers read at their own pace</text>

  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="466" y="392" fill="#1E40AF">Yes</text>
    <text x="806" y="392" fill="#92400E">No</text>
    <text x="240" y="790" fill="#1E40AF">Yes</text>
    <text x="462" y="790" fill="#1E40AF">No</text>
  </g>
  <g font-size="20" text-anchor="end" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="926" y="690">one event,</text>
    <text x="926" y="722">published once</text>
  </g>

  <line x1="50" y1="960" x2="86" y2="960" stroke="#3B82F6" stroke-width="4"/>
  <text x="98" y="967" font-size="20" fill="#475569">Synchronous: someone waits, so a protocol has to be chosen</text>
  <line x1="50" y1="1000" x2="86" y2="1000" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="1007" font-size="20" fill="#475569">Asynchronous: publish the fact, consumers read it later</text>
</svg>