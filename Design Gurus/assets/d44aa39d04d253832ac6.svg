<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="662" viewBox="0 0 1240 662" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same two concurrent edits under vector clocks: neither clock dominates the other, so the system detects a conflict and keeps both versions instead of discarding one">
  <rect x="0" y="0" width="1240" height="662" fill="#FFFFFF"/>
  <defs>
    <marker id="cr4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="cr4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="cr4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same two edits, and this time the system notices</text>

  <line x1="354" y1="228" x2="422" y2="198" stroke="#475569" stroke-width="2" marker-end="url(#cr4-slate)"/>
  <line x1="354" y1="252" x2="422" y2="330" stroke="#475569" stroke-width="2" marker-end="url(#cr4-slate)"/>
  <line x1="754" y1="195" x2="822" y2="222" stroke="#059669" stroke-width="2" marker-end="url(#cr4-emerald)"/>
  <line x1="754" y1="335" x2="822" y2="258" stroke="#059669" stroke-width="2" marker-end="url(#cr4-emerald)"/>

  <g filter="url(#cr4-soft)">
    <rect x="70" y="180" width="284" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="430" y="140" width="320" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="430" y="280" width="320" height="110" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="830" y="180" width="340" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>

  <text x="212" y="216" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Both read</text>
  <text x="212" y="250" font-size="20" fill="#334155" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">name: Sam</text>
  <text x="212" y="278" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">clock [1, 0]</text>

  <text x="590" y="176" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Alice sets city = Berlin</text>
  <text x="590" y="210" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">clock [2, 0]</text>
  <text x="590" y="238" font-size="20" fill="#334155" text-anchor="middle">first entry advanced</text>

  <text x="590" y="316" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bob sets name = Samuel</text>
  <text x="590" y="350" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">clock [1, 1]</text>
  <text x="590" y="378" font-size="20" fill="#334155" text-anchor="middle">second entry advanced</text>

  <text x="1000" y="216" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Conflict detected</text>
  <text x="1000" y="250" font-size="20" fill="#065F46" text-anchor="middle">both versions kept</text>
  <text x="1000" y="278" font-size="20" fill="#065F46" text-anchor="middle">as siblings</text>

  <rect x="50" y="430" width="1140" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="472" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">2 &gt; 1 on the first entry, 0 &lt; 1 on the second. Neither happened before the other, so both survive.</text>

  
  <rect x="50" y="540" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="576" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A vector clock cannot merge anything. What it buys you is knowing that a merge is needed.</text>
  <text x="620" y="606" font-size="20" fill="#334155" text-anchor="middle">The application then decides: keep both, ask the user, or apply a rule from the domain.</text>
</svg>