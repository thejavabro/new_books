<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the client side, a laptop sends its request to a forward proxy, which hides who is asking. The request crosses the internet to the server side, where a reverse proxy receives it, hides who is answering, and passes it to the web servers.">
  <defs>
    <filter id="pr1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pr1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pr1-k1"><rect x="64" y="180" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="pr1-k2"><rect x="64" y="330" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="pr1-k3"><rect x="726" y="180" width="450" height="90" rx="12"/></clipPath>
    <clipPath id="pr1-k4"><rect x="726" y="330" width="450" height="90" rx="12"/></clipPath>
    <marker id="pr1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two kinds of proxy</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same idea on two sides: one proxy acts for the clients, the other for the servers.</text>

  <rect x="40" y="120" width="570" height="370" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Client side</text>
  <rect x="630" y="120" width="570" height="370" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Server side</text>

  <g fill="none" stroke-width="2">
    <path d="M139,270 V330" stroke="#64748B" marker-end="url(#pr1-m-slate)"/>
    <path d="M514,375 H726" stroke="#64748B" marker-end="url(#pr1-m-slate)"/>
    <path d="M1100,330 V270" stroke="#64748B" marker-end="url(#pr1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="363" fill="#475569">over the internet</text>
  </g>

  <g filter="url(#pr1-soft)">
    <rect x="64" y="180" width="450" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#pr1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Laptop</text>
  <text x="289" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">your device</text>
  <g filter="url(#pr1-lift)">
    <rect x="64" y="330" width="450" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="64" y="330" width="9" height="90" fill="#2563EB" clip-path="url(#pr1-k2)"/>
  </g>
  <circle cx="102" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="382" font-size="21.5" font-weight="600" fill="#111827">Forward proxy</text>
  <text x="289" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">hides who is asking</text>
  <g filter="url(#pr1-soft)">
    <rect x="726" y="180" width="450" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="726" y="180" width="6" height="90" fill="#64748B" clip-path="url(#pr1-k3)"/>
  </g>
  <circle cx="764" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(753.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="790" y="232" font-size="21.5" font-weight="600" fill="#111827">Web servers</text>
  <text x="951" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">the site's real servers</text>
  <g filter="url(#pr1-lift)">
    <rect x="726" y="330" width="450" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="726" y="330" width="9" height="90" fill="#7C3AED" clip-path="url(#pr1-k4)"/>
  </g>
  <circle cx="764" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(753.56,364.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="790" y="382" font-size="21.5" font-weight="600" fill="#111827">Reverse proxy</text>
  <text x="951" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">hides who is answering</text>

  <rect x="40" y="520" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="545" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="570" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Forward proxy</text>
  <text x="323" y="570" font-size="18.5" fill="#475569">sits in front of clients and acts on their behalf</text>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Reverse proxy</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">sits in front of servers and acts on their behalf</text>
</svg>