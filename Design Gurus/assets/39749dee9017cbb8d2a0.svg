<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1055" viewBox="0 0 1240 1055" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two support agents refunding the same payment. Both read ETag pay-81M-r3 and each tries to refund 1800 against a refundable amount of 2599. Agent A succeeds and the payment ETag advances. Agent B is refused with 412 because its condition is stale, and after rereading is refused with 409 because 1800 now exceeds the remaining 799.">
  <defs>
    <marker id="p1t-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p1t-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p1t-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p1t-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p1t-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1t-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1t-k1"><rect x="114" y="106" width="462" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k2"><rect x="114" y="271" width="462" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k3"><rect x="114" y="436" width="462" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k4"><rect x="114" y="601" width="462" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k5"><rect x="114" y="766" width="462" height="90" rx="12"/></clipPath>

    <clipPath id="p1t-k6"><rect x="656" y="106" width="508" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k7"><rect x="656" y="271" width="508" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k8"><rect x="656" y="436" width="508" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k9"><rect x="656" y="601" width="508" height="90" rx="12"/></clipPath>
    <clipPath id="p1t-k10"><rect x="656" y="766" width="508" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1055" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="871" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Two agents, one refundable amount, two different refusals</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">five steps, in order</text>

  
  <g fill="none" stroke-width="2">
    
    <path d="M576,151 H656" stroke="#64748B" marker-end="url(#p1t-sl)"/>
    <path d="M576,316 H656" stroke="#059669" marker-end="url(#p1t-em)"/>
    <path d="M576,481 H656" stroke="#D97706" stroke-width="2.5" marker-end="url(#p1t-am)"/>
    <path d="M576,646 H656" stroke="#64748B" marker-end="url(#p1t-sl)"/>
    <path d="M576,811 H656" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p1t-pk)"/>

    
    <path d="M78,169 V298" stroke="#64748B" marker-end="url(#p1t-sl)"/>
    <path d="M78,334 V463" stroke="#64748B" marker-end="url(#p1t-sl)"/>
    <path d="M78,499 V628" stroke="#64748B" marker-end="url(#p1t-sl)"/>
    <path d="M78,664 V793" stroke="#64748B" marker-end="url(#p1t-sl)"/>
  </g>

  
  <g font-size="16.5" font-weight="600" text-anchor="middle" fill="#475569">
    <circle cx="78" cy="151" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="78" y="157">1</text>
    <circle cx="78" cy="316" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="78" y="322">2</text>
    <circle cx="78" cy="481" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="78" y="487">3</text>
    <circle cx="78" cy="646" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="78" y="652">4</text>
    <circle cx="78" cy="811" r="18" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="78" y="817">5</text>
  </g>

  
  <g filter="url(#p1t-soft)">
    <rect x="114" y="106" width="462" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="114" y="106" width="6" height="90" fill="#2563EB" clip-path="url(#p1t-k1)"/>
  </g>
  <circle cx="152" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(141.56,140.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="178" y="158" font-size="18.5" font-weight="600" fill="#111827">Both agents read the payment</text>
  <text x="345" y="221" font-size="15.5" text-anchor="middle" fill="#6B7280">at ETag "pay-81M-r3"</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="656" y="106" width="508" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="656" y="106" width="6" height="90" fill="#64748B" clip-path="url(#p1t-k6)"/>
  </g>
  <circle cx="694" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,140.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="720" y="158" font-size="18.5" font-weight="600" fill="#111827">refundable_amount is 2599</text>
  <text x="910" y="221" font-size="15.5" text-anchor="middle" fill="#6B7280">the state both agents just read</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="114" y="271" width="462" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="114" y="271" width="6" height="90" fill="#2563EB" clip-path="url(#p1t-k2)"/>
  </g>
  <circle cx="152" cy="316" r="18" fill="#FFFFFF"/>
  <g transform="translate(141.56,305.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="178" y="323" font-size="18.5" font-weight="600" fill="#111827">Agent A refunds 1800</text>
  <text x="345" y="386" font-size="15.5" text-anchor="middle" fill="#6B7280">with If-Match "pay-81M-r3"</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="656" y="271" width="508" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="656" y="271" width="6" height="90" fill="#059669" clip-path="url(#p1t-k7)"/>
  </g>
  <circle cx="694" cy="316" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,305.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="720" y="323" font-size="18.5" font-weight="600" fill="#111827">201 Created</text>
  <text x="910" y="386" font-size="15.5" text-anchor="middle" fill="#6B7280">the payment ETag advances to r4</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="114" y="436" width="462" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="114" y="436" width="6" height="90" fill="#2563EB" clip-path="url(#p1t-k3)"/>
  </g>
  <circle cx="152" cy="481" r="18" fill="#FFFFFF"/>
  <g transform="translate(141.56,470.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="178" y="488" font-size="18.5" font-weight="600" fill="#111827">Agent B sends 1800</text>
  <text x="345" y="551" font-size="15.5" text-anchor="middle" fill="#6B7280">with the stale "pay-81M-r3"</text>

  
  <g filter="url(#p1t-lift)">
    <rect x="656" y="436" width="508" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="656" y="436" width="9" height="90" fill="#D97706" clip-path="url(#p1t-k8)"/>
  </g>
  <circle cx="694" cy="481" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,470.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="720" y="488" font-size="18.5" font-weight="600" fill="#111827">Refused with 412</text>
  <text x="910" y="551" font-size="15.5" text-anchor="middle" fill="#6B7280">the stated condition is no longer true</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="114" y="601" width="462" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="114" y="601" width="6" height="90" fill="#2563EB" clip-path="url(#p1t-k4)"/>
  </g>
  <circle cx="152" cy="646" r="18" fill="#FFFFFF"/>
  <g transform="translate(141.56,635.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="178" y="653" font-size="18.5" font-weight="600" fill="#111827">Agent B rereads the payment</text>
  <text x="345" y="716" font-size="15.5" text-anchor="middle" fill="#6B7280">the pending refund reserved its amount</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="656" y="601" width="508" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="656" y="601" width="6" height="90" fill="#64748B" clip-path="url(#p1t-k9)"/>
  </g>
  <circle cx="694" cy="646" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,635.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="720" y="653" font-size="18.5" font-weight="600" fill="#111827">refundable_amount is now 799</text>
  <text x="910" y="716" font-size="15.5" text-anchor="middle" fill="#6B7280">before A even succeeds</text>

  
  <g filter="url(#p1t-soft)">
    <rect x="114" y="766" width="462" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="114" y="766" width="6" height="90" fill="#2563EB" clip-path="url(#p1t-k5)"/>
  </g>
  <circle cx="152" cy="811" r="18" fill="#FFFFFF"/>
  <g transform="translate(141.56,800.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="178" y="818" font-size="18.5" font-weight="600" fill="#111827">Agent B sends 1800 again</text>
  <text x="345" y="881" font-size="15.5" text-anchor="middle" fill="#6B7280">with the current ETag "pay-81M-r4"</text>

  
  <g filter="url(#p1t-lift)">
    <rect x="656" y="766" width="508" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="656" y="766" width="9" height="90" fill="#DB2777" clip-path="url(#p1t-k10)"/>
  </g>
  <circle cx="694" cy="811" r="18" fill="#FFFFFF"/>
  <g transform="translate(683.56,800.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="720" y="818" font-size="18.5" font-weight="600" fill="#111827">Refused with 409</text>
  <text x="910" y="881" font-size="15.5" text-anchor="middle" fill="#6B7280">refund_amount_exceeds_available</text>

  
  <rect x="40" y="939" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="984" text-anchor="middle" font-size="16" fill="#475569">The server guarantees that pending reserved plus succeeded refunds never exceed the payment amount.</text>
</svg>