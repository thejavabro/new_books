<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1822" viewBox="0 0 1240 1822" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The eight trade-offs of the offline messaging client answer, each with what it gives and the cost accepted: a local projection before network, reusing the existing service vocabulary, an embedded receipt, two parallel calls on thread open, one queued change at a time, two recovery markers, a derived unread count, and deletion tombstones.">
  <defs>
    <filter id="p3p-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p3p-k1"><rect x="76" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k2"><rect x="76" y="342" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k3"><rect x="76" y="538" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k4"><rect x="76" y="734" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k5"><rect x="76" y="930" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k6"><rect x="76" y="1126" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k7"><rect x="76" y="1322" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p3p-k8"><rect x="76" y="1518" width="460" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1822" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Messaging client: eight choices, eight costs</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,71 L704.5,75.5 L712,65.5"/>
  </g>
  <text x="726" y="77" font-size="15.5" fill="#6B7280">what it gives</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M930,66 L941,77 M941,66 L930,77"/>
  </g>
  <text x="956" y="77" font-size="15.5" fill="#6B7280">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="146" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p3p-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">A local projection first</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">The screen paints instantly, offline or online.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">A client model to keep reconciled with the server.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="342" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p3p-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">The existing service vocabulary</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">No parallel names for the same concepts.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">The client cannot rename anything for its own convenience.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="538" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p3p-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">An embedded receipt per conversation</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">The list screen needs no extra call per row.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">A larger list response.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="734" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p3p-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Two parallel calls on thread open</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844 L82.5,848.5 L90,838.5"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">One wait, not two, for header plus messages.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">A composed operation would have been one call.</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="930" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p3p-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">One queued change at a time</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1040 L82.5,1044.5 L90,1034.5"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Order and dependencies stay correct per conversation.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1061 L89,1072 M89,1061 L78,1072"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">Lower send throughput on a busy conversation.</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="1126" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p3p-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Two recovery markers</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1236 L82.5,1240.5 L90,1230.5"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">Durable sync and live replay each resume correctly.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1257 L89,1268 M89,1257 L78,1268"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">The client stores and reasons about both.</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="1322" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p3p-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">A derived unread count</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1432 L82.5,1436.5 L90,1426.5"/>
  </g>
  <text x="104" y="1438" font-size="15.5" fill="#6B7280">It agrees across devices with no extra write path.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1453 L89,1464 M89,1453 L78,1464"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">The client computes it from two server numbers.</text>

  
  <rect x="40" y="1498" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p3p-soft)">
    <rect x="76" y="1518" width="460" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1518" width="6" height="90" fill="#059669" clip-path="url(#p3p-k8)"/>
  </g>
  <circle cx="114" cy="1563" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1552.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="1570" font-size="18.5" font-weight="600" fill="#111827">Deletion tombstones</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1628 L82.5,1632.5 L90,1622.5"/>
  </g>
  <text x="104" y="1634" font-size="15.5" fill="#6B7280">Sync and paging stay correct after a delete.</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1649 L89,1660 M89,1649 L78,1660"/>
  </g>
  <text x="104" y="1660" font-size="15.5" fill="#6B7280">Retaining metadata for removed content.</text>

  
  <rect x="40" y="1706" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1751" text-anchor="middle" font-size="16" fill="#475569">The cost proves that the alternative was actually considered.</text>
</svg>