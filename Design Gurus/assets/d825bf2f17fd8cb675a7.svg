<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1330" viewBox="0 0 1240 1330" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Uber data model: the DriverLocationHT record, the QuadTree grid, and the subscription list in server memory, and the Drivers, Customers, and Rides tables in the database">
<defs>
<filter id="ub1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="ub1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="ub1-mbl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="ub1-mamb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="ub1-msl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<clipPath id="ub1-k1"><rect x="90" y="115" width="470" height="250" rx="12"/></clipPath>
<clipPath id="ub1-k2"><rect x="720" y="115" width="440" height="178" rx="12"/></clipPath>
<clipPath id="ub1-k3"><rect x="720" y="365" width="440" height="142" rx="12"/></clipPath>
<clipPath id="ub1-k4"><rect x="90" y="660" width="470" height="250" rx="12"/></clipPath>
<clipPath id="ub1-k5"><rect x="720" y="660" width="440" height="214" rx="12"/></clipPath>
<clipPath id="ub1-k6"><rect x="720" y="935" width="440" height="142" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="1330" fill="#FFFFFF"/>
<rect x="40" y="50" width="1160" height="505" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="64" y="80" font-size="16.5" font-weight="600" fill="#1D4ED8">Server memory, the fast-changing data</text><rect x="40" y="595" width="1160" height="535" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/><text x="64" y="625" font-size="16.5" font-weight="600" fill="#475569">The database, the slow-changing data</text><path d="M 560,190 H 717" fill="none" stroke="#D97706" stroke-width="2.5" marker-end="url(#ub1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="640" y="147" fill="#B45309">refreshed every</text><text x="640" y="169" fill="#B45309">15 seconds</text></g><path d="M 560,330 H 628 Q 640,330 640,342 V 427 Q 640,439 652,439 H 717" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#ub1-mbl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="640" y="380" fill="#1D4ED8">pushed to the</text><text x="640" y="402" fill="#1D4ED8">driver's subscribers</text></g><path d="M 560,762 H 717" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ub1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="640" y="745" fill="#475569">names one driver</text></g><path d="M 560,778 H 628 Q 640,778 640,790 V 997 Q 640,1009 652,1009 H 717" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ub1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="640" y="905" fill="#475569">names one customer</text></g><g filter="url(#ub1-lift)">
<rect x="90" y="115" width="470" height="250" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="90" y="115" width="9" height="250" fill="#2563EB" clip-path="url(#ub1-k1)"/>
</g>
<circle cx="128" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,132.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
<text x="154" y="150" font-size="18.5" font-weight="600" fill="#111827">DriverLocationHT (one per driver)</text><text x="114" y="196" font-size="15.5" fill="#111827">DriverID</text><text x="536" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">the key, 3 bytes</text><line x1="104" y1="207" x2="546" y2="207" stroke="#93C5FD" stroke-width="1"/><text x="114" y="232" font-size="15.5" fill="#111827">Old latitude</text><text x="536" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="243" x2="546" y2="243" stroke="#93C5FD" stroke-width="1"/><text x="114" y="268" font-size="15.5" fill="#111827">Old longitude</text><text x="536" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="279" x2="546" y2="279" stroke="#93C5FD" stroke-width="1"/><text x="114" y="304" font-size="15.5" fill="#111827">New latitude</text><text x="536" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><line x1="104" y1="315" x2="546" y2="315" stroke="#93C5FD" stroke-width="1"/><text x="114" y="340" font-size="15.5" fill="#111827">New longitude</text><text x="536" y="340" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes</text><text x="325" y="390" font-size="15.5" text-anchor="middle" fill="#6B7280">35 bytes per driver; 1M drivers = 35 MB</text><text x="325" y="413" font-size="15.5" text-anchor="middle" fill="#94A3B8">spread across Driver Location servers, step 6</text><g filter="url(#ub1-soft)">
<rect x="720" y="115" width="440" height="178" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="720" y="115" width="6" height="178" fill="#4F46E5" clip-path="url(#ub1-k2)"/>
</g>
<circle cx="758" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,132.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="784" y="150" font-size="18.5" font-weight="600" fill="#111827">QuadTree grid (one per map area)</text><text x="744" y="196" font-size="15.5" fill="#111827">Grid boundary</text><text x="1136" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">the area this grid covers</text><line x1="734" y1="207" x2="1146" y2="207" stroke="#A5B4FC" stroke-width="1"/><text x="744" y="232" font-size="15.5" fill="#111827">Drivers inside</text><text x="1136" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">DriverID and position</text><line x1="734" y1="243" x2="1146" y2="243" stroke="#A5B4FC" stroke-width="1"/><text x="744" y="268" font-size="15.5" fill="#111827">Rating per driver</text><text x="1136" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">copied for ranking, step 6</text><text x="940" y="318" font-size="15.5" text-anchor="middle" fill="#6B7280">answers: which drivers are near this point?</text><text x="940" y="341" font-size="15.5" text-anchor="middle" fill="#94A3B8">a full grid splits into four; 10 percent cushion, step 6</text><g filter="url(#ub1-soft)">
<rect x="720" y="365" width="440" height="142" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
<rect x="720" y="365" width="6" height="142" fill="#7C3AED" clip-path="url(#ub1-k3)"/>
</g>
<circle cx="758" cy="393" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,382.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
<text x="784" y="400" font-size="18.5" font-weight="600" fill="#111827">Subscription list (one per driver)</text><text x="744" y="446" font-size="15.5" fill="#111827">DriverID</text><text x="1136" y="446" font-size="15.5" text-anchor="end" fill="#6B7280">the key, 3 bytes</text><line x1="734" y1="457" x2="1146" y2="457" stroke="#C4B5FD" stroke-width="1"/><text x="744" y="482" font-size="15.5" fill="#111827">CustomerIDs</text><text x="1136" y="482" font-size="15.5" text-anchor="end" fill="#6B7280">the subscribers, 8 bytes each</text><text x="940" y="532" font-size="15.5" text-anchor="middle" fill="#6B7280">kept by the Notification Service; about 21 MB</text><g filter="url(#ub1-soft)">
<rect x="90" y="660" width="470" height="250" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="90" y="660" width="6" height="250" fill="#059669" clip-path="url(#ub1-k4)"/>
</g>
<circle cx="128" cy="688" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,677.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
<text x="154" y="695" font-size="18.5" font-weight="600" fill="#111827">Rides (one row per ride)</text><text x="114" y="741" font-size="15.5" fill="#111827">RideID</text><text x="536" y="741" font-size="15.5" text-anchor="end" fill="#6B7280">primary key</text><line x1="104" y1="752" x2="546" y2="752" stroke="#6EE7B7" stroke-width="1"/><text x="114" y="777" font-size="15.5" fill="#111827">CustomerID, DriverID</text><text x="536" y="777" font-size="15.5" text-anchor="end" fill="#6B7280">one customer, one driver</text><line x1="104" y1="788" x2="546" y2="788" stroke="#6EE7B7" stroke-width="1"/><text x="114" y="813" font-size="15.5" fill="#111827">Pickup, Destination</text><text x="536" y="813" font-size="15.5" text-anchor="end" fill="#6B7280">where the ride starts and ends</text><line x1="104" y1="824" x2="546" y2="824" stroke="#6EE7B7" stroke-width="1"/><text x="114" y="849" font-size="15.5" fill="#111827">Start time, End time</text><text x="536" y="849" font-size="15.5" text-anchor="end" fill="#6B7280">set as the trip runs</text><line x1="104" y1="860" x2="546" y2="860" stroke="#6EE7B7" stroke-width="1"/><text x="114" y="885" font-size="15.5" fill="#111827">Status</text><text x="536" y="885" font-size="15.5" text-anchor="end" fill="#6B7280">searching, accepted, completed</text><text x="325" y="935" font-size="15.5" text-anchor="middle" fill="#6B7280">one million new rows a day, about 12 per second</text><g filter="url(#ub1-soft)">
<rect x="720" y="660" width="440" height="214" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<rect x="720" y="660" width="6" height="214" fill="#64748B" clip-path="url(#ub1-k5)"/>
</g>
<circle cx="758" cy="688" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,677.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="784" y="695" font-size="18.5" font-weight="600" fill="#111827">Drivers (one row per driver)</text><text x="744" y="741" font-size="15.5" fill="#111827">DriverID</text><text x="1136" y="741" font-size="15.5" text-anchor="end" fill="#6B7280">3 bytes, primary key</text><line x1="734" y1="752" x2="1146" y2="752" stroke="#94A3B8" stroke-width="1"/><text x="744" y="777" font-size="15.5" fill="#111827">Name, Car</text><text x="1136" y="777" font-size="15.5" text-anchor="end" fill="#6B7280">profile data</text><line x1="734" y1="788" x2="1146" y2="788" stroke="#94A3B8" stroke-width="1"/><text x="744" y="813" font-size="15.5" fill="#111827">Rating</text><text x="1136" y="813" font-size="15.5" text-anchor="end" fill="#6B7280">stars out of ten</text><line x1="734" y1="824" x2="1146" y2="824" stroke="#94A3B8" stroke-width="1"/><text x="744" y="849" font-size="15.5" fill="#111827">Status</text><text x="1136" y="849" font-size="15.5" text-anchor="end" fill="#6B7280">free to pick up, or not</text><text x="940" y="899" font-size="15.5" text-anchor="middle" fill="#6B7280">one million drivers in total</text><g filter="url(#ub1-soft)">
<rect x="720" y="935" width="440" height="142" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="720" y="935" width="6" height="142" fill="#D97706" clip-path="url(#ub1-k6)"/>
</g>
<circle cx="758" cy="963" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,952.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
<text x="784" y="970" font-size="18.5" font-weight="600" fill="#111827">Customers (one row per account)</text><text x="744" y="1016" font-size="15.5" fill="#111827">CustomerID</text><text x="1136" y="1016" font-size="15.5" text-anchor="end" fill="#6B7280">8 bytes, primary key</text><line x1="734" y1="1027" x2="1146" y2="1027" stroke="#FCD34D" stroke-width="1"/><text x="744" y="1052" font-size="15.5" fill="#111827">Name</text><text x="1136" y="1052" font-size="15.5" text-anchor="end" fill="#6B7280">profile data</text><text x="940" y="1102" font-size="15.5" text-anchor="middle" fill="#6B7280">300 million accounts, 1 million active a day</text><rect x="40" y="1160" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="1186" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="1208" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Two speeds of data</text><text x="288" y="1208" font-size="15.5" fill="#475569">memory absorbs 167 thousand writes a second; the database changes about 12 times a second</text><rect x="64" y="1230" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/><text x="164" y="1252" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The 15 second gap</text><text x="288" y="1252" font-size="15.5" fill="#475569">a QuadTree position can be 15 seconds old; a car does not move far in that time</text>
</svg>