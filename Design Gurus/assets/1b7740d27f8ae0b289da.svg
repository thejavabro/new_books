<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="During a rolling deploy the readiness probe holds traffic back from a new instance until warm-up finishes, and drains the old instance before it stops">
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>
  <defs>
    <marker id="lb4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Readiness is what makes a rolling deploy invisible</text>

  
  <line x1="90" y1="470" x2="1170" y2="470" stroke="#475569" stroke-width="2" marker-end="url(#lb4-slate)"/>
  <line x1="90" y1="458" x2="90" y2="482" stroke="#475569" stroke-width="2"/>
  <line x1="450" y1="454" x2="450" y2="486" stroke="#D97706" stroke-width="2.5"/>
  <line x1="810" y1="454" x2="810" y2="486" stroke="#059669" stroke-width="2.5"/>
  <text x="90" y="516" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">v2 starts</text>
  <text x="450" y="516" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">still warming up</text>
  <text x="810" y="516" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">reports ready</text>
  <text x="1170" y="516" font-size="20" fill="#475569" text-anchor="end">time</text>

  
  <rect x="90" y="110" width="720" height="150" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <rect x="810" y="110" width="360" height="150" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

  <text x="450" y="148" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">v2 is running but NOT ready</text>
  <text x="450" y="184" font-size="20" fill="#92400E" text-anchor="middle">Loading config, filling caches, opening pools.</text>
  <text x="450" y="212" font-size="20" fill="#92400E" text-anchor="middle">The readiness probe returns a failure on purpose,</text>
  <text x="450" y="240" font-size="20" fill="#92400E" text-anchor="middle">so the load balancer sends it nothing.</text>

  <text x="990" y="148" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">v2 is ready</text>
  <text x="990" y="184" font-size="20" fill="#065F46" text-anchor="middle">The probe passes and the</text>
  <text x="990" y="212" font-size="20" fill="#065F46" text-anchor="middle">load balancer adds it to</text>
  <text x="990" y="240" font-size="20" fill="#065F46" text-anchor="middle">the pool.</text>

  
  <rect x="90" y="292" width="720" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="810" y="292" width="360" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="450" y="326" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">v1 carries all the traffic</text>
  <text x="450" y="354" font-size="20" fill="#1E40AF" text-anchor="middle">users notice nothing</text>
  <text x="990" y="326" font-size="20" font-weight="600" fill="#64748B" text-anchor="middle">v1 is drained, then stopped</text>
  <text x="990" y="354" font-size="20" fill="#94A3B8" text-anchor="middle">marked unready first</text>

  
  <rect x="90" y="546" width="1080" height="40" rx="8" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="573" font-size="20" fill="#334155" text-anchor="middle">Without readiness the balancer would send users to v2 while it was still starting, and they would get errors.</text>
</svg>