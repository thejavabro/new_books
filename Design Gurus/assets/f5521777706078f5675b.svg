<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five messages on a two second timeline counted by two fixed windows above the axis and one rolling window below it.">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>

  
  <rect x="120" y="36" width="498" height="58" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="144" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">fixed window 1 (2 msgs)</text>
  <rect x="622" y="36" width="498" height="58" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="646" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">fixed window 2 (3 msgs)</text>

  
  <g stroke="#C4B5FD" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="320" y1="182" x2="320" y2="232"/>
    <line x1="820" y1="182" x2="820" y2="232"/>
  </g>

  
  <g stroke="#64748B" stroke-width="2">
    <line x1="80" y1="170" x2="1160" y2="170"/>
    <line x1="120" y1="162" x2="120" y2="178"/>
    <line x1="620" y1="162" x2="620" y2="178"/>
    <line x1="1120" y1="162" x2="1120" y2="178"/>
  </g>
  <g font-size="15.5" text-anchor="middle" fill="#6B7280">
    <text x="120" y="205">0.0s</text>
    <text x="620" y="205">1.0s</text>
    <text x="1120" y="205">2.0s</text>
  </g>

  
  <g fill="#DBEAFE" stroke="#2563EB" stroke-width="2">
    <circle cx="320" cy="170" r="11"/>
    <circle cx="395" cy="170" r="11"/>
    <circle cx="695" cy="170" r="11"/>
    <circle cx="795" cy="170" r="11"/>
    <circle cx="1045" cy="170" r="11"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="320" y="205">m1</text>
    <text x="395" y="205">m2</text>
    <text x="695" y="205">m3</text>
    <text x="795" y="205">m4</text>
    <text x="1045" y="205">m5</text>
  </g>

  
  <rect x="320" y="232" width="500" height="58" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="344" y="266" font-size="16.5" font-weight="600" fill="#5B21B6">rolling window (4 msgs)</text>

  
  <rect x="40" y="322" width="1160" height="56" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="356" text-anchor="middle" font-size="16" fill="#475569">The same five messages counted both ways.</text>
</svg>