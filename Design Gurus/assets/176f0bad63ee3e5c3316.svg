<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level Twitter design where clients reach a tier of application servers through a load balancer, tweets and relationships are stored in a tweet database, and photos and videos live in file storage.">
  <defs>
    <marker id="tw02-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="tw02-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="tw02-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="tw02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="tw02-k1"><rect x="40" y="297" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="tw02-k2"><rect x="270" y="297" width="214" height="90" rx="12"/></clipPath>
    <clipPath id="tw02-k3"><rect x="588" y="160" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="tw02-k4"><rect x="588" y="274" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="tw02-k5"><rect x="588" y="388" width="204" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  
  <rect x="540" y="110" width="300" height="465" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="564" y="140" font-size="16.5" font-weight="600" fill="#1D4ED8">Application Servers</text>

  
  <g fill="none" stroke-width="2">
    <path d="M210,342 L270,342" stroke="#2563EB" marker-end="url(#tw02-bl)"/>
    <path d="M484,342 L540,342" stroke="#2563EB" marker-end="url(#tw02-bl)"/>
    <path d="M840,220 L1010,220" stroke="#7C3AED" marker-end="url(#tw02-vi)"/>
    <path d="M840,475 L1010,475" stroke="#D97706" marker-end="url(#tw02-am)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="925" y="208" fill="#5B21B6">read / write tweets</text>
    <text x="925" y="463" fill="#B45309">media</text>
  </g>

  
  <g filter="url(#tw02-soft)">
    <rect x="40" y="297" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="297" width="6" height="90" fill="#2563EB" clip-path="url(#tw02-k1)"/>
  </g>
  <circle cx="78" cy="342" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,331.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="104" y="349" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#tw02-soft)">
    <rect x="270" y="297" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="270" y="297" width="6" height="90" fill="#64748B" clip-path="url(#tw02-k2)"/>
  </g>
  <circle cx="308" cy="342" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,331.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="334" y="349" font-size="18.5" font-weight="600" fill="#111827">Load Balancer</text>

  
  <g filter="url(#tw02-soft)">
    <rect x="588" y="160" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="588" y="160" width="6" height="90" fill="#2563EB" clip-path="url(#tw02-k3)"/>
  </g>
  <circle cx="626" cy="205" r="18" fill="#FFFFFF"/>
  <g transform="translate(615.56,194.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="1.5"/>
    <rect x="3" y="13" width="18" height="7" rx="1.5"/>
    <path d="M6.5 7.5h1M6.5 16.5h1"/>
  </g>
  <text x="652" y="212" font-size="18.5" font-weight="600" fill="#111827">App Server 1</text>

  
  <g filter="url(#tw02-soft)">
    <rect x="588" y="274" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="588" y="274" width="6" height="90" fill="#2563EB" clip-path="url(#tw02-k4)"/>
  </g>
  <circle cx="626" cy="319" r="18" fill="#FFFFFF"/>
  <g transform="translate(615.56,308.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="1.5"/>
    <rect x="3" y="13" width="18" height="7" rx="1.5"/>
    <path d="M6.5 7.5h1M6.5 16.5h1"/>
  </g>
  <text x="652" y="326" font-size="18.5" font-weight="600" fill="#111827">App Server 2</text>

  
  <g filter="url(#tw02-soft)">
    <rect x="588" y="388" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="588" y="388" width="6" height="90" fill="#2563EB" clip-path="url(#tw02-k5)"/>
  </g>
  <circle cx="626" cy="433" r="18" fill="#FFFFFF"/>
  <g transform="translate(615.56,422.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4" width="18" height="7" rx="1.5"/>
    <rect x="3" y="13" width="18" height="7" rx="1.5"/>
    <path d="M6.5 7.5h1M6.5 16.5h1"/>
  </g>
  <text x="652" y="440" font-size="18.5" font-weight="600" fill="#111827">App Server 3</text>

  
  <text x="690" y="503" font-size="15.5" text-anchor="middle" fill="#6B7280">average 1,150 writes and</text>
  <text x="690" y="526" font-size="15.5" text-anchor="middle" fill="#6B7280">325K reads per second;</text>
  <text x="690" y="549" font-size="15.5" text-anchor="middle" fill="#94A3B8">peak is several times higher</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M1010,170 L1010,244 A85,16 0 0 0 1180,244 L1180,170" fill="#EDE9FE"/>
    <ellipse cx="1095" cy="170" rx="85" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="1095" y="220" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Tweet Database</text>
  <text x="1095" y="290" font-size="15.5" text-anchor="middle" fill="#6B7280">tweets, follows, favorites</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M1010,430 L1010,504 A85,16 0 0 0 1180,504 L1180,430" fill="#FEF3C7"/>
    <ellipse cx="1095" cy="430" rx="85" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="1095" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">File Storage</text>
  <text x="1095" y="550" font-size="15.5" text-anchor="middle" fill="#6B7280">photos and videos</text>

  
  <rect x="40" y="630" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="670" text-anchor="middle" font-size="16" fill="#475569">Load balancers spread the traffic across application servers.</text>
  <text x="620" y="696" text-anchor="middle" font-size="16" fill="#475569">Tweets and relationships live in the database; photos and videos live in file storage.</text>
</svg>