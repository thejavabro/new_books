<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="deleted-title deleted-desc">
<title id="deleted-title">A slice is done when the old code is deleted</title>
<desc id="deleted-desc">Code that is merely unreachable still carries cost and still leaves the option of routing back, which is how a migration becomes permanent. The common failure is reaching eighty percent and stopping.</desc>
<defs>
<marker id="deleted-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="deleted-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="deleted-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="deleted-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="800" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">A slice is done when the old code is deleted</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The definition matters more than it sounds, because the most common way this pattern fails is not technical.</text>
<rect x="40" y="722" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="722" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="157" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A slice is finished when the old implementation has been deleted.</text>
<text x="40" y="218" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Not these</text>
<rect x="40" y="236" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">disabled</text>
<rect x="434" y="236" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">behind a flag</text>
<rect x="828" y="236" width="372" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1014" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">left in case somebody needs it</text>
<text x="620" y="326" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Unreachable code is still compiled, scanned, upgraded and read by whoever opens the file</text>
<text x="40" y="372" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The failure that actually happens</text>
<defs><clipPath id="clip-40-390"><rect x="40" y="390" width="1160" height="44" rx="10"/></clipPath></defs><rect x="40" y="390" width="1160" height="44" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="40.0" y="390" width="928.0" height="44" fill="#06AC80" clip-path="url(#clip-40-390)"/><rect x="968.0" y="390" width="232.0" height="44" fill="#F25461" clip-path="url(#clip-40-390)"/><rect x="40" y="390" width="1160" height="44" rx="10" fill="none" stroke="#5EC9EC" stroke-width="2"/>
<text x="504" y="419" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">the easy slices, done</text>
<text x="1084" y="419" font-size="19" font-weight="700" fill="#FFFFFF" text-anchor="middle">the hard 20%</text>
<rect x="40" y="464" width="1160" height="82" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="464" width="5" height="82" rx="2.5" fill="#F28B9D"/><text x="64" y="497.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Pressure moves to new work, and the organization operates both systems forever.</text><text x="64" y="524.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">All the cost of the migration, none of the simplification, and a routing layer nobody understands.</text>
<text x="40" y="586" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two sequencing decisions made at the start</text>
<rect x="40" y="604" width="560" height="88" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="627" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Order the slices so something is</text><text x="320" y="654" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">deleted early, which proves the</text><text x="320" y="681" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">pattern and makes the next easier</text>
<rect x="640" y="604" width="560" height="88" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="627" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Treat deletion as part of the slice.</text><text x="920" y="654" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Follow-up work in a migration is</text><text x="920" y="681" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">work that does not happen</text>
<text x="66" y="756" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The worst available outcome, and it is organizational rather than technical.</text>
</svg>