<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="script-title script-desc">
<title id="script-title">The five moves of the opening</title>
<desc id="script-desc">Restate the problem and name the core, list features and mark some out of scope, ask for three or four numbers each tied to a decision, state assumptions with their consequences, and define success in those numbers.</desc>
<defs>
<marker id="script-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="script-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="script-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="script-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="678" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The five moves of the opening</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Put together, the opening is roughly eight minutes and has five moves.</text>
<rect x="40" y="600" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="600" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Restate and name the core</text>
<path d="M536 146H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 146H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#script-marker-slate)"/>
<rect x="580" y="118" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"Here is what I think this is. The hard part is X."</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">List features, mark some out</text>
<path d="M536 214H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 214H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#script-marker-slate)"/>
<rect x="580" y="186" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so an omission reads as a decision</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ask for three or four numbers</text>
<path d="M536 282H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 282H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#script-marker-slate)"/>
<rect x="580" y="254" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">each one tied to a decision as you ask it</text>
<circle cx="60" cy="350" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">State assumptions with consequences</text>
<path d="M536 350H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 350H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#script-marker-slate)"/>
<rect x="580" y="322" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the X, Y, Z form, out loud</text>
<circle cx="60" cy="418" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="425" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="390" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="424" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say what success looks like</text>
<path d="M536 418H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 418H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#script-marker-slate)"/>
<rect x="580" y="390" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="424" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in the numbers you just gathered</text>
<rect x="40" y="470" width="560" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="502" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">About eight minutes</text><text x="64" y="528" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">of a forty-minute interview, with a</text><text x="64" y="554" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">couple of minutes spare for surprises.</text>
<rect x="640" y="470" width="560" height="104" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="470" width="5" height="104" rx="2.5" fill="#AC8BE8"/><text x="664" y="502" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Two things make it work</text><text x="664" y="528" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Pause to check part-way through. Write the</text><text x="664" y="554" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">numbers where you both can see them.</text>
<text x="66" y="634" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The worst opening is going quiet and starting to draw.</text>
</svg>