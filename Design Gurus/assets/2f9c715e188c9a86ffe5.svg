<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="610" viewBox="0 0 1240 610" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: the checkout context publishes an OrderPlaced event carrying only a product ID and quantity; the shipping context looks up weight and dimensions in its own data; only the ID and the event cross the context boundary">
  <defs>
    <marker id="m02-l01-context-translation-sequence-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m02-l01-context-translation-sequence-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="610" fill="#FFFFFF"/>

  
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="330" y1="130" x2="330" y2="480"/>
    <line x1="910" y1="130" x2="910" y2="480"/>
  </g>

  
  <path d="M330,200 L906,200" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m02-l01-context-translation-sequence-ab)"/>
  <text x="620" y="186" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">OrderPlaced event (product ID, quantity)</text>

  
  <g filter="url(#m02-l01-context-translation-sequence-soft)">
    <rect x="140" y="40" width="380" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="330" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout context</text>
  <text x="330" y="110" text-anchor="middle" font-size="20" fill="#64748B">publishes the event</text>

  <g filter="url(#m02-l01-context-translation-sequence-soft)">
    <rect x="720" y="40" width="380" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="910" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Shipping context</text>
  <text x="910" y="110" text-anchor="middle" font-size="20" fill="#64748B">builds its own view from the ID</text>

  
  <g filter="url(#m02-l01-context-translation-sequence-soft)">
    <rect x="710" y="250" width="400" height="90" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="910" y="288" text-anchor="middle" font-size="20" fill="#065F46">Looks up weight and dimensions</text>
  <text x="910" y="318" text-anchor="middle" font-size="20" fill="#065F46">in its own data</text>

  
  <rect x="270" y="380" width="700" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="620" y="423" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Only the ID and the event cross the boundary</text>

  
  <g stroke-width="4">
    <line x1="40" y1="530" x2="74" y2="530" stroke="#D97706" stroke-dasharray="6 5"/>
    <line x1="40" y1="570" x2="74" y2="570" stroke="#059669"/>
  </g>
  <text x="84" y="537" font-size="20" fill="#475569">Async event: checkout publishes, shipping reacts, no shared model</text>
  <text x="84" y="577" font-size="20" fill="#475569">Own-data lookup: no import of the checkout model</text>
</svg>