<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="792" viewBox="0 0 1240 792" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="common-title common-desc">
<title id="common-title">What the three have in common</title>
<desc id="common-desc">Three very different briefs with one shared property, and three patterns that transfer to briefs that look nothing like these.</desc>
<defs>
<marker id="common-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="common-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="common-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="common-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="792" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the three have in common</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three exercises, three very different briefs, and one shared property.</text>
<rect x="40" y="714" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="714" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="136" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V248A6 6 0 0 0 46 254H54Z" fill="#5EC9EC"/>
<text x="226" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The migration</text>
<text x="226" y="186" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a sequencing problem. A correct</text><text x="226" y="211" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">target diagram answered the</text><text x="226" y="236" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">wrong question</text>
<rect x="434" y="118" width="372" height="136" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M448 118H440A6 6 0 0 0 434 124V248A6 6 0 0 0 440 254H448Z" fill="#39D5AA"/>
<text x="620" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The billing rebuild</text>
<text x="620" y="186" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a correctness problem. The design</text><text x="620" y="211" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">that achieved it was a shape</text><text x="620" y="236" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">already described</text>
<rect x="828" y="118" width="372" height="136" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M842 118H834A6 6 0 0 0 828 124V248A6 6 0 0 0 834 254H842Z" fill="#F3CF6A"/>
<text x="1014" y="154" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">The platform design</text>
<text x="1014" y="186" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a restraint problem. Every</text><text x="1014" y="211" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">component in the answer</text><text x="1014" y="236" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">was ordinary</text>
<rect x="40" y="272" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="272" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="309" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Senior work is rarely blocked on knowing a component</text>
<text x="40" y="368" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three patterns that transfer to any brief</text>
<rect x="40" y="386" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="408.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The requirement was questioned</text><text x="280" y="435.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">before it was priced</text>
<path d="M526 416H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 416H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#common-marker-slate)"/>
<rect x="570" y="386" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="409.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in all three, accepting the requirement as stated</text><text x="590" y="434.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">produced a worse answer</text>
<rect x="40" y="458" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="480.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The expensive decisions were</text><text x="280" y="507.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">separated from the cheap</text>
<path d="M526 488H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 488H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#common-marker-slate)"/>
<rect x="570" y="458" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="481.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a cross-ocean write is cheap to change.</text><text x="590" y="506.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A globally ordered ledger is not</text>
<rect x="40" y="530" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="552.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The path was treated</text><text x="280" y="579.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">as part of the design</text>
<path d="M526 560H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 560H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#common-marker-slate)"/>
<rect x="570" y="530" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a design without a path to it is a drawing of an end state</text>
<rect x="40" y="610" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="610" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="639.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">In all three, the architecture was not the hard part.</text><text x="64" y="668.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">That is the claim this whole course has been making</text>
<text x="66" y="748" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It is blocked on deciding, sequencing, bounding and defending.</text>
</svg>