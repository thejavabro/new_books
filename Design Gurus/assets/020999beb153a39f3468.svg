<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Vertical scaling upgrades one server from 8 cores and 32 GB to 64 cores and 512 GB, and it is still one machine. Horizontal scaling puts a load balancer in front of three nodes and adds nodes while running.">
  <defs>
    <filter id="sc1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sc1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sc1-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k2"><rect x="64" y="380" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k3"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k4"><rect x="654" y="380" width="156" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k5"><rect x="837" y="380" width="156" height="90" rx="12"/></clipPath>
    <clipPath id="sc1-k6"><rect x="1020" y="380" width="156" height="90" rx="12"/></clipPath>
    <marker id="sc1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="sc1-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Two ways to add capacity</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Make one machine bigger, or add more machines and spread the work.</text>

  <rect x="40" y="120" width="570" height="460" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Vertical: make one machine bigger</text>
  <rect x="630" y="120" width="570" height="460" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Horizontal: add more machines</text>

  <g fill="none" stroke-width="2">
    <path d="M120,270 V380" stroke="#64748B" marker-end="url(#sc1-m-slate)"/>
    <path d="M732,270 V380" stroke="#2563EB" marker-end="url(#sc1-m-blue)"/>
    <path d="M915,270 V380" stroke="#2563EB" marker-end="url(#sc1-m-blue)"/>
    <path d="M1098,270 V380" stroke="#2563EB" marker-end="url(#sc1-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="196" y="332" fill="#475569">upgrade</text>
  </g>

  <g filter="url(#sc1-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#sc1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="325" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">8 cores, 32 GB memory</text>
  <g filter="url(#sc1-soft)">
    <rect x="64" y="380" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="380" width="6" height="90" fill="#64748B" clip-path="url(#sc1-k2)"/>
  </g>
  <circle cx="102" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,414.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="432" font-size="21.5" font-weight="600" fill="#111827">Bigger server</text>
  <text x="325" y="499" font-size="18.5" text-anchor="middle" fill="#6B7280">64 cores, 512 GB memory</text>
  <text x="325" y="526" font-size="18.5" text-anchor="middle" fill="#94A3B8">still only one machine</text>
  <g filter="url(#sc1-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#sc1-k3)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">Load balancer</text>
  <g filter="url(#sc1-soft)">
    <rect x="654" y="380" width="156" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="380" width="6" height="90" fill="#2563EB" clip-path="url(#sc1-k4)"/>
  </g>
  <circle cx="692" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,414.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="718" y="432" font-size="21.5" font-weight="600" fill="#111827">Node 1</text>
  <g filter="url(#sc1-soft)">
    <rect x="837" y="380" width="156" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="837" y="380" width="6" height="90" fill="#2563EB" clip-path="url(#sc1-k5)"/>
  </g>
  <circle cx="875" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(864.56,414.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="901" y="432" font-size="21.5" font-weight="600" fill="#111827">Node 2</text>
  <text x="915" y="499" font-size="18.5" text-anchor="middle" fill="#6B7280">add nodes while running</text>
  <g filter="url(#sc1-soft)">
    <rect x="1020" y="380" width="156" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="1020" y="380" width="6" height="90" fill="#2563EB" clip-path="url(#sc1-k6)"/>
  </g>
  <circle cx="1058" cy="425" r="18" fill="#FFFFFF"/>
  <g transform="translate(1047.56,414.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="1084" y="432" font-size="21.5" font-weight="600" fill="#111827">Node 3</text>

  <rect x="40" y="610" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Scaling up</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">simple, but limited by the biggest machine, and usually needs downtime</text>
  <rect x="64" y="685" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="710" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Scaling out</text>
  <text x="323" y="710" font-size="18.5" fill="#475569">no fixed limit and no downtime, but the app must be built for it</text>
</svg>