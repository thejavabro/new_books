<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="724" viewBox="0 0 1240 724" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Pairs sorted by end value, with a greedy scan taking three of the four"><rect x="0" y="0" width="1240" height="724" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="420" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Sorted by end value, then taken greedily from left to right</text>
<path d="M230,372 H1100" stroke="#94A3B8" stroke-width="2"/>
<path d="M250.0,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="250" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">0</text>
<path d="M342.2,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="342" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">1</text>
<path d="M434.4,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="434" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">2</text>
<path d="M526.7,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="526" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">3</text>
<path d="M618.9,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="618" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">4</text>
<path d="M711.1,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="711" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">5</text>
<path d="M803.3,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="803" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">6</text>
<path d="M895.6,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="895" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">7</text>
<path d="M987.8,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="987" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">8</text>
<path d="M1080.0,366 V378" stroke="#94A3B8" stroke-width="2"/>
<text x="1080" y="404" text-anchor="middle" font-size="19.5" font-weight="normal" fill="#6B7280">9</text>
<rect x="342.2" y="142" width="92.2" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="388" y="171" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">[1, 2]</text>
<text x="210" y="171" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">take</text>
<rect x="434.4" y="196" width="184.4" height="42" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
<text x="526" y="225" text-anchor="middle" font-size="22.5" font-weight="600" fill="#BE185D">[2, 4]</text>
<text x="210" y="225" text-anchor="end" font-size="19.5" font-weight="600" fill="#BE185D">skip</text>
<rect x="618.9" y="250" width="184.4" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="711" y="279" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">[4, 6]</text>
<text x="210" y="279" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">take</text>
<rect x="895.6" y="304" width="92.2" height="42" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="941" y="333" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">[7, 8]</text>
<text x="210" y="333" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">take</text>
<text x="210" y="401" text-anchor="end" font-size="19.5" font-weight="600" fill="#047857">chain = 3</text>
<rect x="40" y="508" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="530" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="556" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">taken</text>
<text x="348" y="556" font-size="19.5" fill="#475569">it starts after the last pair we took</text>
<rect x="64" y="578" width="255" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="191" y="604" text-anchor="middle" font-size="19.5" font-weight="600" fill="#BE185D">skipped</text>
<text x="348" y="604" font-size="19.5" fill="#475569">it starts at 2, which is not after the previous end of 2</text>
<rect x="64" y="626" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="652" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the rule</text>
<text x="348" y="652" font-size="19.5" fill="#475569">the pair that ends soonest leaves the most room for the rest</text>
</svg>