<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One worked sizing chain from daily requests to average QPS to peak QPS to bandwidth to storage, each step derived from the one above it">
  <rect x="0" y="0" width="1240" height="772" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every number below comes from the one above it</text>

  <rect x="50" y="88" width="1140" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="120" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Assume: 1 million writes a day, 1 KB per record, 100 reads for every write</text>

  
  <rect x="50" y="170" width="1140" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="100" cy="210" r="22" fill="#3B82F6"/>
  <text x="100" y="217" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="150" y="204" font-size="20" font-weight="600" fill="#0F172A">Requests per day</text>
  <text x="150" y="234" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">1 M writes + 100 M reads</text>
  <rect x="880" y="188" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1025" y="217" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">101 M per day</text>

  
  <rect x="50" y="262" width="1140" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="100" cy="302" r="22" fill="#3B82F6"/>
  <text x="100" y="309" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="150" y="296" font-size="20" font-weight="600" fill="#0F172A">Average QPS, reads dominate</text>
  <text x="150" y="326" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">100,000,000 ÷ 86,400 seconds</text>
  <rect x="880" y="280" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1025" y="309" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">≈ 1,200 read QPS</text>

  
  <rect x="50" y="354" width="1140" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <circle cx="100" cy="394" r="22" fill="#3B82F6"/>
  <text x="100" y="401" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="150" y="388" font-size="20" font-weight="600" fill="#0F172A">Peak QPS</text>
  <text x="150" y="418" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">1,200 × 3 for the busy hour</text>
  <rect x="880" y="372" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="1025" y="401" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">≈ 3,600 read QPS</text>

  
  <rect x="50" y="446" width="1140" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="100" cy="486" r="22" fill="#D97706"/>
  <text x="100" y="493" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="150" y="480" font-size="20" font-weight="600" fill="#0F172A">Bandwidth: 100 M reads × 1 KB = 100 GB/day</text>
  <text x="150" y="510" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">100 GB/day ÷ 86,400 seconds</text>
  <rect x="880" y="464" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <text x="1025" y="493" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">≈ 1 MB/s</text>

  
  <rect x="50" y="538" width="1140" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <circle cx="100" cy="578" r="22" fill="#7C3AED"/>
  <text x="100" y="585" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="middle">5</text>
  <text x="150" y="572" font-size="20" font-weight="600" fill="#0F172A">Storage: 1 M writes × 1 KB = 1 GB/day</text>
  <text x="150" y="602" font-size="20" fill="#334155" font-family="&#39;Consolas&#39;, &#39;Courier New&#39;, monospace">1 GB/day × 365 × 10 years + overhead</text>
  <rect x="880" y="556" width="290" height="44" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1025" y="585" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">≈ 4 TB</text>

  
  <rect x="50" y="650" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="686" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Get the daily total right and everything under it is arithmetic.</text>
  <text x="620" y="716" font-size="20" fill="#334155" text-anchor="middle">The number that trips people up is 86,400: a million a day is twelve a second, not a million.</text>
</svg>