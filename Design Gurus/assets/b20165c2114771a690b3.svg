    </marker>
    <marker id="bff2-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="bff2-k1"><rect x="72" y="110" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="bff2-k2"><rect x="470" y="110" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="bff2-k3"><rect x="868" y="110" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="bff2-k4"><rect x="72" y="224" width="300" height="76" rx="12"/></clipPath>
    <clipPath id="bff2-k5"><rect x="470" y="224" width="300" height="76" rx="12"/></clipPath>
    <clipPath id="bff2-k6"><rect x="868" y="224" width="300" height="76" rx="12"/></clipPath>
    <clipPath id="bff2-k7"><rect x="320" y="392" width="600" height="86" rx="12"/></clipPath>
    <filter id="bff2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bff2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="490" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Three layers: frontends, one backend each, shared services</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M222,180 V222" marker-end="url(#bff2-mblue)"/>
    <path d="M620,180 V222" marker-end="url(#bff2-mblue)"/>
    <path d="M1018,180 V222" marker-end="url(#bff2-mblue)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M222,300 V330 Q222,346 238,346 H604 Q620,346 620,362 V392" marker-end="url(#bff2-mviolet)"/>
    <path d="M620,300 V392" marker-end="url(#bff2-mviolet)"/>
    <path d="M1018,300 V330 Q1018,346 1002,346 H636 Q620,346 620,362 V392" marker-end="url(#bff2-mviolet)"/>
  </g>
  <g filter="url(#bff2-soft)">
    <rect x="72" y="110" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="110" width="6" height="70" fill="#2563EB" clip-path="url(#bff2-k1)"/>
  </g>
  <circle cx="110" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="152" font-size="18.5" font-weight="600" fill="#111827">Web App</text>
  <g filter="url(#bff2-soft)">
    <rect x="470" y="110" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="110" width="6" height="70" fill="#2563EB" clip-path="url(#bff2-k2)"/>
  </g>
  <circle cx="508" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="534" y="152" font-size="18.5" font-weight="600" fill="#111827">Mobile App</text>
  <g filter="url(#bff2-soft)">
    <rect x="868" y="110" width="300" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="868" y="110" width="6" height="70" fill="#2563EB" clip-path="url(#bff2-k3)"/>
  </g>
  <circle cx="906" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="932" y="152" font-size="18.5" font-weight="600" fill="#111827">TV App</text>
  <g filter="url(#bff2-soft)">
    <rect x="72" y="224" width="300" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="224" width="6" height="76" fill="#059669" clip-path="url(#bff2-k4)"/>
  </g>
  <circle cx="110" cy="262" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,251.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="269" font-size="18.5" font-weight="600" fill="#111827">Web BFF</text>
  <g filter="url(#bff2-soft)">
    <rect x="470" y="224" width="300" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="470" y="224" width="6" height="76" fill="#059669" clip-path="url(#bff2-k5)"/>
  </g>
  <circle cx="508" cy="262" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,251.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="534" y="269" font-size="18.5" font-weight="600" fill="#111827">Mobile BFF</text>
  <g filter="url(#bff2-soft)">
    <rect x="868" y="224" width="300" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="868" y="224" width="6" height="76" fill="#059669" clip-path="url(#bff2-k6)"/>
  </g>
  <circle cx="906" cy="262" r="18" fill="#FFFFFF"/>
  <g transform="translate(895.56,251.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="932" y="269" font-size="18.5" font-weight="600" fill="#111827">TV BFF</text>
  <g filter="url(#bff2-lift)">
    <rect x="320" y="392" width="600" height="86" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="320" y="392" width="9" height="86" fill="#7C3AED" clip-path="url(#bff2-k7)"/>
  </g>
  <circle cx="358" cy="435" r="18" fill="#FFFFFF"/>
  <g transform="translate(347.56,424.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="384" y="442" font-size="18.5" font-weight="600" fill="#111827">Shared Services That Own The Data</text>
  <text x="620" y="503" font-size="15.5" text-anchor="middle" fill="#6B7280">orders, catalog, accounts: called by every BFF</text>
  <rect x="40" y="566" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="590" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="612" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What a BFF does</text>
  <text x="288" y="612" font-size="15.5" fill="#475569">calls the shared services and returns only what its own frontend will display</text>
  <rect x="64" y="634" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="656" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">What it never does</text>
  <text x="288" y="656" font-size="15.5" fill="#475569">own data of its own, so the services stay the single source of truth</text>
</svg>