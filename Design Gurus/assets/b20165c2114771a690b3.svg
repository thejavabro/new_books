<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three parts of the BFF pattern: each frontend has its own backend, and all the backends call the same shared services, which own the data">
