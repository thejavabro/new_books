<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One support message: the first token appears in under a second, the answer finishes in about 10 seconds, and its cost and quality are tracked afterward">
