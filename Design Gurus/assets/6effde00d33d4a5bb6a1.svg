<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="535" viewBox="0 0 1240 535" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Kafka as a commit log: records are appended at the end of an append-only log, and consumers read from oldest to newest">
  <rect x="0" y="0" width="1240" height="535" fill="#FFFFFF"/>
  <defs>
    <marker id="dm3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="dm3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="dm3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M872,106 C872,140 930,140 948,170" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#dm3-slate)"/>
  <text x="970" y="140" font-size="20" fill="#475569" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">appends record 8</text>

  
  <rect x="228" y="170" width="784" height="155" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="253" y="200" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="start">Commit log (append-only)</text>

  
  <g filter="url(#dm3-soft)">
    <rect x="258" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="340" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="422" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="504" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="586" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="668" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="750" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="832" y="228" width="68" height="72" rx="8" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <rect x="914" y="228" width="68" height="72" rx="8" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="292" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">0</text>
  <text x="374" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">1</text>
  <text x="456" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">2</text>
  <text x="538" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">3</text>
  <text x="620" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">4</text>
  <text x="702" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">5</text>
  <text x="784" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">6</text>
  <text x="866" y="271" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">7</text>
  <text x="948" y="256" font-size="20" font-weight="600" fill="#7C3AED" text-anchor="middle">8</text>
  <text x="948" y="282" font-size="20" fill="#64748B" text-anchor="middle">next</text>

  <text x="208" y="271" font-size="20" fill="#64748B" text-anchor="end">old</text>
  <text x="1032" y="271" font-size="20" fill="#64748B" text-anchor="start">new</text>

  
  <g filter="url(#dm3-soft)">
    <rect x="732" y="30" width="280" height="76" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="872" y="60" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="872" y="88" font-size="20" fill="#64748B" text-anchor="middle">always writes at the end</text>

  
  <line x1="258" y1="375" x2="982" y2="375" stroke="#059669" stroke-width="2" marker-end="url(#dm3-emerald)"/>
  <text x="620" y="351" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">consumers read from left to right (old to new)</text>

  
  <rect x="210" y="415" width="820" height="76" rx="10" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="446" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Records are never modified or deleted once written.</text>
  <text x="620" y="474" font-size="20" fill="#64748B" text-anchor="middle">Kafka stores the log on disk and reads it sequentially, which is fast.</text>
</svg>