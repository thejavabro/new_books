<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1038" viewBox="0 0 1240 1038" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four stop_reason values on a completed response and what the caller should do with each: completed means use the output, maximum_output_tokens means treat it as truncated, tool_call means execute the tool under the agent contract, and content_filtered means the content will not be recovered by replaying.">
  <defs>
    <filter id="p20-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p20-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p20-k2"><rect x="76" y="342" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p20-k3"><rect x="76" y="538" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p20-k4"><rect x="76" y="734" width="400" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1038" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Completed does not always mean finished</text>
  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <circle cx="477" cy="71.5" r="6"/>
  </g>
  <circle cx="477" cy="71.5" r="1.9" fill="#94A3B8"/>
  <text x="496" y="77" font-size="15.5" fill="#6B7280">it means</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M600,71.5 H614 M609.5,67 L614,71.5 L609.5,76"/>
  </g>
  <text x="626" y="77" font-size="15.5" fill="#6B7280">the caller should</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each stop_reason value is a card title</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <g filter="url(#p20-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p20-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">completed</text>
  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <circle cx="84" cy="257" r="6"/>
  </g>
  <circle cx="84" cy="257" r="1.9" fill="#94A3B8"/>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">The model ended the answer normally.</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,283 H90 M85.5,278.5 L90,283 L85.5,287.5"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">Use the output.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#p20-soft)">
    <rect x="76" y="342" width="400" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#D97706" clip-path="url(#p20-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">maximum_output_tokens</text>
  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <circle cx="84" cy="453" r="6"/>
  </g>
  <circle cx="84" cy="453" r="1.9" fill="#94A3B8"/>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">The published output bound was reached.</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,479 H90 M85.5,474.5 L90,479 L85.5,483.5"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Treat the output as truncated, and raise the bound only if appropriate.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g filter="url(#p20-soft)">
    <rect x="76" y="538" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#2563EB" clip-path="url(#p20-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">tool_call</text>
  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <circle cx="84" cy="649" r="6"/>
  </g>
  <circle cx="84" cy="649" r="1.9" fill="#94A3B8"/>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">A complete tool request is waiting for its result.</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,675 H90 M85.5,670.5 L90,675 L85.5,679.5"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">Validate and execute it under the agent contract.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <g filter="url(#p20-soft)">
    <rect x="76" y="734" width="400" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#DB2777" clip-path="url(#p20-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">content_filtered</text>
  <g fill="none" stroke="#94A3B8" stroke-width="2">
    <circle cx="84" cy="845" r="6"/>
  </g>
  <circle cx="84" cy="845" r="1.9" fill="#94A3B8"/>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">Output ended under a published content rule.</text>
  <g fill="none" stroke="#64748B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,871 H90 M85.5,866.5 L90,871 L85.5,875.5"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Not assume that replaying the same request recovers the missing content.</text>

  
  <rect x="40" y="922" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="967" text-anchor="middle" font-size="16" fill="#475569">The enum may grow, so callers preserve unknown values and never treat an unknown value as completed.</text>
</svg>