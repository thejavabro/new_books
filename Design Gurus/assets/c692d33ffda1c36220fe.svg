<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="420" viewBox="0 0 1240 420" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Fifty clients ask for the same file at the same time. Without a proxy the origin server answers fifty times. With collapsed forwarding the proxy sends one request to the origin and answers all fifty clients from that one response.">
  <rect x="0" y="0" width="1240" height="420" fill="#FFFFFF"/>
  <defs>
    <marker id="px4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="px4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="px4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="px4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="px4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="px4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="px4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="px4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Collapsed forwarding turns many identical requests into one</text>
  <rect x="24" y="74" width="588" height="300" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="110" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">Without a proxy</text>
  <g filter="url(#px4-soft)"><rect x="74" y="156" width="170" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="159" y="192" font-size="19" fill="#0F172A" text-anchor="middle">50 clients</text>
  <line x1="250" y1="168" x2="400" y2="168" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <line x1="250" y1="177" x2="400" y2="177" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <line x1="250" y1="186" x2="400" y2="186" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <line x1="250" y1="195" x2="400" y2="195" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <line x1="250" y1="204" x2="400" y2="204" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <line x1="250" y1="213" x2="400" y2="213" stroke="#DC2626" stroke-width="2.2" marker-end="url(#px4-r)"/>
  <g filter="url(#px4-soft)"><rect x="404" y="152" width="170" height="64" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="489" y="190" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">origin</text>
  <text x="318" y="268" font-size="20" fill="#0F172A" text-anchor="middle">50 requests reach the origin.</text>
  <text x="318" y="300" font-size="19" fill="#64748B" text-anchor="middle">It reads the same file 50 times.</text>
  <rect x="628" y="74" width="588" height="300" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="110" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">With a proxy</text>
  <g filter="url(#px4-soft)"><rect x="660" y="156" width="150" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="735" y="192" font-size="19" fill="#0F172A" text-anchor="middle">50 clients</text>
  <line x1="816" y1="168" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <line x1="816" y1="177" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <line x1="816" y1="186" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <line x1="816" y1="195" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <line x1="816" y1="204" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <line x1="816" y1="213" x2="866" y2="180" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <g filter="url(#px4-soft)"><rect x="870" y="152" width="150" height="64" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="2"/></g>
  <text x="945" y="190" font-size="20" font-weight="700" fill="#0F766E" text-anchor="middle">proxy</text>
  <line x1="1024" y1="184" x2="1074" y2="184" stroke="#059669" stroke-width="2.2" marker-end="url(#px4-e)"/>
  <g filter="url(#px4-soft)"><rect x="1078" y="152" width="120" height="64" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="1138" y="190" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">origin</text>
  <text x="922" y="268" font-size="20" fill="#0F172A" text-anchor="middle">1 request reaches the origin.</text>
  <text x="922" y="300" font-size="19" fill="#64748B" text-anchor="middle">One response is sent to all 50 clients.</text>
  <text x="620" y="400" font-size="19" fill="#64748B" text-anchor="middle">This is the same idea that protects a database from a cache stampede.</text>
</svg>