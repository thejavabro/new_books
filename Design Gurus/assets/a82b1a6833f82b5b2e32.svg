<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The condition: the oldest payment_pending order is older than 60 seconds for more than 5 minutes, more than twice in any 30 days, from the pending-age alert, owned by the Payments team. Its five parts: metric, the age of the oldest payment_pending order; threshold, over 60 seconds for more than 5 minutes; time window, more than twice in any 30 days; data source, the pending-age alert; owner, the Payments team. A weak condition such as revisit if the worker causes problems never fires, while the checkable one can be answered yes or no on any day.">
  <defs>
    <filter id="md01d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md01d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md01d-k1"><rect x="60" y="244" width="320" height="70" rx="12"/></clipPath>
    <clipPath id="md01d-k2"><rect x="60" y="334" width="320" height="70" rx="12"/></clipPath>
    <clipPath id="md01d-k3"><rect x="60" y="424" width="320" height="70" rx="12"/></clipPath>
    <clipPath id="md01d-k4"><rect x="60" y="514" width="320" height="70" rx="12"/></clipPath>
    <clipPath id="md01d-k5"><rect x="60" y="604" width="320" height="70" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The five parts of a checkable revisit condition</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One condition from the payment worker decision, split into the parts that make it checkable.</text>

  <rect x="40" y="112" width="1160" height="104" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="142" font-size="19.5" font-weight="600" fill="#475569">The condition</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md01d-soft)">
    <rect x="60" y="244" width="320" height="70" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="244" width="6" height="70" fill="#2563EB" clip-path="url(#md01d-k1)"/>
  </g>
  <circle cx="98" cy="279" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,268.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="124" y="286" font-size="21.5" font-weight="600" fill="#111827">Metric</text>
  <g filter="url(#md01d-soft)">
    <rect x="60" y="334" width="320" height="70" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="60" y="334" width="6" height="70" fill="#D97706" clip-path="url(#md01d-k2)"/>
  </g>
  <circle cx="98" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,358.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="124" y="376" font-size="21.5" font-weight="600" fill="#111827">Threshold</text>
  <g filter="url(#md01d-soft)">
    <rect x="60" y="424" width="320" height="70" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="60" y="424" width="6" height="70" fill="#4F46E5" clip-path="url(#md01d-k3)"/>
  </g>
  <circle cx="98" cy="459" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,448.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g>
  <text x="124" y="466" font-size="21.5" font-weight="600" fill="#111827">Time window</text>
  <g filter="url(#md01d-soft)">
    <rect x="60" y="514" width="320" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="514" width="6" height="70" fill="#64748B" clip-path="url(#md01d-k4)"/>
  </g>
  <circle cx="98" cy="549" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,538.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="124" y="556" font-size="21.5" font-weight="600" fill="#111827">Data source</text>
  <g filter="url(#md01d-soft)">
    <rect x="60" y="604" width="320" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="60" y="604" width="6" height="70" fill="#059669" clip-path="url(#md01d-k5)"/>
  </g>
  <circle cx="98" cy="639" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,628.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="124" y="646" font-size="21.5" font-weight="600" fill="#111827">Owner</text>
  <rect x="60" y="708" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(74,719) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="110" y="736.5" font-size="18.5" fill="#1F2937">Weak: "Revisit if the worker causes problems" never fires, because nobody can say when it is true.</text>
  <rect x="60" y="762" width="1120" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(74,773) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="110" y="790.5" font-size="18.5" fill="#1F2937">Checkable: on any day, anyone can answer yes or no from the alert history.</text>
  <text x="64" y="180" font-size="18.5" fill="#1F2937">The oldest payment_pending order is older than 60 seconds for more than 5 minutes,</text>
  <text x="64" y="206" font-size="18.5" fill="#1F2937">more than twice in any 30 days (pending-age alert; Payments team).</text>
  <text x="420" y="274" font-size="19.5" font-weight="600" fill="#111827">Age of the oldest payment_pending order</text>
  <text x="420" y="301" font-size="18.5" fill="#6B7280">One number the alert computes from the orders table</text>
  <text x="420" y="364" font-size="19.5" font-weight="600" fill="#111827">Over 60 seconds for more than 5 minutes</text>
  <text x="420" y="391" font-size="18.5" fill="#6B7280">A value, and how long the metric must stay past it</text>
  <text x="420" y="454" font-size="19.5" font-weight="600" fill="#111827">More than twice in any 30 days</text>
  <text x="420" y="481" font-size="18.5" fill="#6B7280">So one slow evening does not reopen the decision</text>
  <text x="420" y="544" font-size="19.5" font-weight="600" fill="#111827">The pending-age alert</text>
  <text x="420" y="571" font-size="18.5" fill="#6B7280">Where anyone can look the value up</text>
  <text x="420" y="634" font-size="19.5" font-weight="600" fill="#111827">The Payments team</text>
  <text x="420" y="661" font-size="18.5" fill="#6B7280">Who reopens the decision when it fires</text>




</svg>