<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dedup-title dedup-desc">
<title id="dedup-title">The dedup table is a transaction, not a table</title>
<desc id="dedup-desc">Recording the message id and performing the business write have to share one local transaction. Split across two, a crash between them produces exactly the divergence the dedup table was supposed to prevent.</desc>
<defs>
<marker id="dedup-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dedup-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dedup-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dedup-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="736" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The dedup table is a transaction, not a table</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Recording the message id and performing the business write have to share one local transaction.</text>
<rect x="40" y="658" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="658" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="560" height="250" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V362A6 6 0 0 0 46 368H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">One transaction</text>
<rect x="72" y="174" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT message_id</text>
<rect x="72" y="226" width="500" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT the shipment</text>
<rect x="72" y="278" width="500" height="46" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">COMMIT</text>
<text x="320" y="354" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">A duplicate rolls back both</text>
<rect x="640" y="118" width="560" height="250" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V362A6 6 0 0 0 646 368H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Two transactions</text>
<rect x="672" y="174" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="203" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT message_id, COMMIT</text>
<rect x="672" y="226" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="255" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">crash</text>
<rect x="672" y="278" width="500" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="307" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the shipment never happens</text>
<text x="920" y="354" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">The dual write, moved not solved</text>
<text x="40" y="410" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three details that decide whether this works</text>
<rect x="40" y="428" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Choosing the identifier</text>
<path d="M526 458H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 458H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dedup-marker-slate)"/>
<rect x="570" y="428" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="451.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partition and offset change on a republish,</text><text x="590" y="476.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so use a producer-generated id</text>
<rect x="40" y="500" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="536" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retention</text>
<path d="M526 530H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 530H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dedup-marker-slate)"/>
<rect x="570" y="500" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="523.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the bound must exceed topic retention</text><text x="590" y="548.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">plus the longest consumer outage</text>
<rect x="40" y="572" width="480" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="608" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Contention</text>
<path d="M526 602H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 602H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dedup-marker-slate)"/>
<rect x="570" y="572" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="595.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every message writes here, so keep it narrow</text><text x="590" y="620.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and partition it by time</text>
<text x="66" y="692" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Retention here is a correctness parameter, not a cleanup job.</text>
</svg>