<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The encoded string with both stacks empty">
<defs>
<filter id="ds-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Decode "3[a3[c]]"</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A bracket group can hold another bracket group, so the work has to be paused and resumed</text>
<rect x="40" y="106" width="1160" height="538" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Two stacks: the repeat counts still owed, and the text each one has to be joined back on to</text>
<text x="256" y="252" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the input</text>
<rect x="280" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="329" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="392" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="441" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">[</text>
<rect x="504" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="553" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">a</text>
<rect x="616" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="665" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="728" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="777" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">[</text>
<rect x="840" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="889" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">c</text>
<rect x="952" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1001" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">]</text>
<rect x="1064" y="214" width="98" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1113" y="251.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">]</text>
<text x="256" y="360" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts held</text>
<text x="286" y="359" font-size="18" fill="#475569">no counts held</text>
<text x="256" y="446" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">text held</text>
<text x="286" y="445" font-size="18" fill="#475569">no text held</text>
<rect x="280" y="508" width="320" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="298" y="542" font-size="20" font-weight="600" fill="#1D4ED8">empty</text>
<text x="256" y="542" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">building now</text>
<text x="620" y="584" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Nothing is repeated until a closing bracket is reached, because until then the text is unfinished</text>
<rect x="40" y="656" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="696" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">An opening bracket pauses the work, and a closing bracket resumes it</text>
<text x="620" y="728" text-anchor="middle" font-size="18.5" fill="#475569">That is exactly what a stack is for: the most recently paused job is the first to resume</text>
</svg>