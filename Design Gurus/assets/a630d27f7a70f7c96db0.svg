<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" role="img" aria-label="The notification system database schema. Four SQL tables hold configuration that must stay consistent: tenants, users, user_preferences and notification_templates, joined by tenant_id and user_id foreign keys. Two NoSQL collections hold the high volume history: notifications, one document per message sent, and notification_status, one document per delivery status change, joined by notification_id. The ids on the NoSQL side are copies rather than foreign keys, because the design does not use joins.">
