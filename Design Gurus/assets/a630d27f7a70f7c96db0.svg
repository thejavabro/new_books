  <rect x="575" y="494" width="90" height="34" rx="8" fill="#FFFFFF" opacity="0.96"/>
  <text x="620" y="518" font-size="18" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">1 : many</text>

  <text x="620" y="376" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Normalised, joined by foreign keys, and small enough to stay in one place.</text>
  <text x="620" y="778" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One document per send, and a separate document for every status change.</text>

  <rect x="40" y="800" width="1160" height="180" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="620" y="840" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the schema is split in two</text>
  <text x="620" y="880" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The SQL half is small and changes rarely: who exists, what they allow, and what to send them.</text>
  <text x="620" y="910" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The NoSQL half is the event history. It grows without limit and is written once per message.</text>
  <text x="620" y="940" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The ids repeated on the right are copies, not foreign keys, because this side never joins.</text>
</svg>