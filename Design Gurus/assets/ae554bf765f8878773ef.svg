<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="At 50 percent utilization, average latency is 20 ms. At 70 percent it is 33 ms. At 80 percent it is 50 ms. At 90 percent it is 100 ms. At 95 percent it is 200 ms. The work stays at 10 ms, and the waiting time grows.">
  <defs>
    <filter id="lvt3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lvt3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lvt3-k1"><rect x="40" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="lvt3-k2"><rect x="281" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="lvt3-k3"><rect x="522" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="lvt3-k4"><rect x="763" y="140" width="196" height="90" rx="12"/></clipPath>
    <clipPath id="lvt3-k5"><rect x="1004" y="140" width="196" height="90" rx="12"/></clipPath>
    <marker id="lvt3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Average latency as a server gets busier</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A simple queueing model. Each request needs 10 ms of work. The rest is waiting.</text>



  <g fill="none" stroke-width="2">
    <path d="M236,185 H281" stroke="#64748B" marker-end="url(#lvt3-m-slate)"/>
    <path d="M477,185 H522" stroke="#64748B" marker-end="url(#lvt3-m-slate)"/>
    <path d="M718,185 H763" stroke="#64748B" marker-end="url(#lvt3-m-slate)"/>
    <path d="M959,185 H1004" stroke="#64748B" marker-end="url(#lvt3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#lvt3-soft)">
    <rect x="40" y="140" width="196" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#059669" clip-path="url(#lvt3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">50%: 20 ms</text>
  <text x="138" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">short queue</text>
  <g filter="url(#lvt3-soft)">
    <rect x="281" y="140" width="196" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="281" y="140" width="6" height="90" fill="#059669" clip-path="url(#lvt3-k2)"/>
  </g>
  <circle cx="319" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(308.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="345" y="192" font-size="21.5" font-weight="600" fill="#111827">70%: 33 ms</text>
  <text x="379" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">still stable</text>
  <g filter="url(#lvt3-soft)">
    <rect x="522" y="140" width="196" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="522" y="140" width="6" height="90" fill="#D97706" clip-path="url(#lvt3-k3)"/>
  </g>
  <circle cx="560" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(549.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="586" y="192" font-size="21.5" font-weight="600" fill="#111827">80%: 50 ms</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">climbing</text>
  <g filter="url(#lvt3-soft)">
    <rect x="763" y="140" width="196" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="763" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#lvt3-k4)"/>
  </g>
  <circle cx="801" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(790.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="827" y="192" font-size="21.5" font-weight="600" fill="#111827">90%: 100 ms</text>
  <text x="861" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">long queue</text>
  <g filter="url(#lvt3-lift)">
    <rect x="1004" y="140" width="196" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="1004" y="140" width="9" height="90" fill="#DB2777" clip-path="url(#lvt3-k5)"/>
  </g>
  <circle cx="1042" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(1031.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="1068" y="192" font-size="21.5" font-weight="600" fill="#111827">95%: 200 ms</text>
  <text x="1102" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">very steep</text>

  <rect x="40" y="310" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="335" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="360" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">The model</text>
  <text x="323" y="360" font-size="18.5" fill="#475569">latency = work time / free share of capacity, so 10 ms / 0.1 = 100 ms</text>
  <rect x="64" y="385" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="410" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Safe zone</text>
  <text x="323" y="410" font-size="18.5" fill="#475569">run at 50 to 70 percent, so a traffic rise does not break latency targets</text>
  <rect x="64" y="435" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="460" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Near capacity</text>
  <text x="323" y="460" font-size="18.5" fill="#475569">throughput stops growing, and every request waits in a queue</text>
</svg>