<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="625" viewBox="0 0 1240 625" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The data plane is the proxies that carry every request; the control plane holds the configuration and pushes it to them, and is never on the request path">
  <defs>
    <marker id="sm3-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <clipPath id="sm3-k1"><rect x="400" y="92" width="440" height="78" rx="12"/></clipPath>
    <clipPath id="sm3-k2"><rect x="80" y="320" width="240" height="76" rx="12"/></clipPath>
    <clipPath id="sm3-k3"><rect x="500" y="320" width="240" height="76" rx="12"/></clipPath>
    <clipPath id="sm3-k4"><rect x="920" y="320" width="240" height="76" rx="12"/></clipPath>
    <marker id="sm3-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <filter id="sm3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sm3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="625" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="150" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#5B21B6">Control plane: configures the proxies, never carries a request</text>
  <rect x="40" y="244" width="1160" height="192" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="274" font-size="16.5" font-weight="600" fill="#1D4ED8">Data plane: the proxies, on the path of every request</text>
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M620,170 V320" marker-end="url(#sm3-mviolet)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="790" y="214" fill="#5B21B6">pushes rules and certificates</text>
  </g>
  <g filter="url(#sm3-lift)">
    <rect x="400" y="92" width="440" height="78" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="400" y="92" width="9" height="78" fill="#7C3AED" clip-path="url(#sm3-k1)"/>
  </g>
  <circle cx="438" cy="131" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,120.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="464" y="138" font-size="18.5" font-weight="600" fill="#111827">Control Plane</text>
  <g filter="url(#sm3-soft)">
    <rect x="80" y="320" width="240" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="320" width="6" height="76" fill="#2563EB" clip-path="url(#sm3-k2)"/>
  </g>
  <circle cx="118" cy="358" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,347.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="144" y="365" font-size="18.5" font-weight="600" fill="#111827">Service A + Proxy</text>
  <g filter="url(#sm3-soft)">
    <rect x="500" y="320" width="240" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="500" y="320" width="6" height="76" fill="#2563EB" clip-path="url(#sm3-k3)"/>
  </g>
  <circle cx="538" cy="358" r="18" fill="#FFFFFF"/>
  <g transform="translate(527.56,347.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="564" y="365" font-size="18.5" font-weight="600" fill="#111827">Service B + Proxy</text>
  <g filter="url(#sm3-soft)">
    <rect x="920" y="320" width="240" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="920" y="320" width="6" height="76" fill="#2563EB" clip-path="url(#sm3-k4)"/>
  </g>
  <circle cx="958" cy="358" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,347.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="984" y="365" font-size="18.5" font-weight="600" fill="#111827">Service C + Proxy</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M320,358 H500" marker-end="url(#sm3-mblue)"/>
    <path d="M740,358 H920" marker-end="url(#sm3-mblue)"/>
  </g>
  <rect x="40" y="472" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="496" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="518" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Control plane</text>
  <text x="288" y="518" font-size="15.5" fill="#475569">off the request path, so if it stops, proxies keep serving with the rules they already hold</text>
  <rect x="64" y="540" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="562" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Data plane</text>
  <text x="288" y="562" font-size="15.5" fill="#475569">on the request path, so every hop costs a little and every hop can be measured</text>
</svg>