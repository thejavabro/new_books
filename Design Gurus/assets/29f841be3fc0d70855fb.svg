<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A failing liveness probe restarts the instance, while a failing readiness probe only removes it from the load balancer pool and leaves the process running">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="lb3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lb3-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="lb3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Same instance, two probes, two very different consequences</text>

  
  <rect x="40" y="72" width="1160" height="272" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="106" font-size="20" font-weight="600" fill="#B91C1C">Liveness fails: is the process still alive?</text>

  <line x1="336" y1="212" x2="440" y2="212" stroke="#DC2626" stroke-width="2" marker-end="url(#lb3-red)"/>
  <line x1="736" y1="212" x2="840" y2="212" stroke="#DC2626" stroke-width="2" marker-end="url(#lb3-red)"/>

  <g filter="url(#lb3-soft)">
    <rect x="80" y="160" width="256" height="104" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="444" y="176" width="292" height="72" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="844" y="160" width="292" height="104" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  </g>
  <text x="208" y="196" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Deadlocked instance</text>
  <text x="208" y="226" font-size="20" fill="#B91C1C" text-anchor="middle">threads frozen, cannot</text>
  <text x="208" y="250" font-size="20" fill="#B91C1C" text-anchor="middle">recover on its own</text>
  <text x="590" y="220" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">probe fails 3 times</text>
  <text x="990" y="196" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The container is killed</text>
  <text x="990" y="226" font-size="20" fill="#B91C1C" text-anchor="middle">and restarted from</text>
  <text x="990" y="250" font-size="20" fill="#B91C1C" text-anchor="middle">a clean state</text>

  <text x="620" y="316" font-size="20" fill="#475569" text-anchor="middle">Use it only for faults nothing but a restart can clear. Never point it at a dependency.</text>

  
  <rect x="40" y="372" width="1160" height="272" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="406" font-size="20" font-weight="600" fill="#92400E">Readiness fails: can it serve a request right now?</text>

  <line x1="336" y1="512" x2="440" y2="512" stroke="#D97706" stroke-width="2" marker-end="url(#lb3-amber)"/>
  <line x1="736" y1="512" x2="840" y2="512" stroke="#D97706" stroke-width="2" marker-end="url(#lb3-amber)"/>

  <g filter="url(#lb3-soft)">
    <rect x="80" y="460" width="256" height="104" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="444" y="476" width="292" height="72" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="844" y="460" width="292" height="104" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2.5"/>
  </g>
  <text x="208" y="496" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Database is briefly down</text>
  <text x="208" y="526" font-size="20" fill="#92400E" text-anchor="middle">the app itself is fine,</text>
  <text x="208" y="550" font-size="20" fill="#92400E" text-anchor="middle">it just cannot answer</text>
  <text x="590" y="520" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">probe fails</text>
  <text x="990" y="496" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pulled from the pool</text>
  <text x="990" y="526" font-size="20" fill="#92400E" text-anchor="middle">process keeps running,</text>
  <text x="990" y="550" font-size="20" fill="#92400E" text-anchor="middle">rejoins when it recovers</text>

  <text x="620" y="616" font-size="20" fill="#475569" text-anchor="middle">No restart, so nothing is lost and no warm-up is repeated when the dependency comes back.</text>

  <rect x="40" y="664" width="1160" height="24" rx="6" fill="none" stroke="none"/>
</svg>