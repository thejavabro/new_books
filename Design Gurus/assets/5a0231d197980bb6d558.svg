<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="844" viewBox="0 0 1240 844" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An array split in half, every subset sum of each half generated, and one pair of sums combining to the target"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="844" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="540" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Split the input, brute force each half, then pair the two answer sets</text>
<text x="232" y="191" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">left half</text>
<rect x="260" y="150" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="306" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">3</text>
<rect x="362" y="150" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="408" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">34</text>
<rect x="464" y="150" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="510" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">4</text>
<text x="692" y="191" text-anchor="end" font-size="19.5" font-weight="600" fill="#5B21B6">right half</text>
<rect x="720" y="150" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="766" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">12</text>
<rect x="822" y="150" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="868" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">5</text>
<rect x="924" y="150" width="92" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="970" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#5B21B6">2</text>
<text x="260" y="262" text-anchor="start" font-size="19.5" font-weight="600" fill="#475569">every subset sum of each half, which is 2 to the power 3, so 8 each</text>
<text x="232" y="331" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">left sums</text>
<rect x="260" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="297" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">0</text>
<rect x="342" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="379" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">3</text>
<rect x="424" y="290" width="74" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="461" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">4</text>
<rect x="506" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="543" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">7</text>
<rect x="588" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="625" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">34</text>
<rect x="670" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="707" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">37</text>
<rect x="752" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="789" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">38</text>
<rect x="834" y="290" width="74" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="871" y="331" text-anchor="middle" font-size="20.5" font-weight="600" fill="#1D4ED8">41</text>
<text x="232" y="431" text-anchor="end" font-size="19.5" font-weight="600" fill="#5B21B6">right sums</text>
<rect x="260" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="297" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">0</text>
<rect x="342" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="379" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">2</text>
<rect x="424" y="390" width="74" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="461" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#047857">5</text>
<rect x="506" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="543" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">7</text>
<rect x="588" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="625" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">12</text>
<rect x="670" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="707" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">14</text>
<rect x="752" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="789" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">17</text>
<rect x="834" y="390" width="74" height="66" rx="9" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
<text x="871" y="431" text-anchor="middle" font-size="20.5" font-weight="600" fill="#5B21B6">19</text>
<text x="260" y="486" text-anchor="start" font-size="17.5" font-weight="normal" fill="#475569">sorted once, then binary searched</text>
<text x="260" y="550" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">target 9: take the left sum 4, search the right sums for 5, and find it</text>
<rect x="40" y="628" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="650" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="676" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">the left half</text>
<text x="348" y="676" font-size="19.5" fill="#475569">and every subset sum it can produce</text>
<rect x="64" y="698" width="255" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="191" y="724" text-anchor="middle" font-size="19.5" font-weight="600" fill="#5B21B6">the right half</text>
<text x="348" y="724" font-size="19.5" fill="#475569">sorted once, so each search costs log time</text>
<rect x="64" y="746" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="772" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the pair found</text>
<text x="348" y="772" font-size="19.5" fill="#475569">one sum from each half, adding to the target</text>
</svg>