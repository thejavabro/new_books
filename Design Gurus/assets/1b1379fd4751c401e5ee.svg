<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="658" viewBox="0 0 1240 658" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="conncount-title conncount-desc">
<title id="conncount-title">Where the connections come from</title>
<desc id="conncount-desc">Twenty application instances holding fifty pooled connections each already reach a thousand connections. Cron jobs, background workers, an analytics tool and the overlap during a deploy push the total far higher, without any single decision to do so.</desc>
<defs>
<marker id="conncount-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="conncount-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="conncount-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="conncount-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="658" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Where the connections come from</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Application servers each open their own pool, and the arithmetic is rarely done out loud.</text>
<rect x="40" y="580" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="580" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="340" y="139" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">20 app instances</text>
<text x="340" y="164" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">x 50 pooled each</text>
<rect x="360" y="127" width="840" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="360" y="127" width="464.1" height="38" rx="10" fill="#159BEF"/>
<text x="838.0883977900553" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">1000</text>
<text x="340" y="207" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Cron fleet</text>
<text x="340" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">batch jobs</text>
<rect x="360" y="195" width="840" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="360" y="195" width="55.7" height="38" rx="10" fill="#06AC80"/>
<text x="429.69060773480663" y="221" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">120</text>
<text x="340" y="275" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Background workers</text>
<text x="340" y="300" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">queue consumers</text>
<rect x="360" y="263" width="840" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="360" y="263" width="69.6" height="38" rx="10" fill="#7650D6"/>
<text x="443.61325966850825" y="289" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">150</text>
<text x="340" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Analytics tool</text>
<text x="340" y="368" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">pointed at the primary</text>
<rect x="360" y="331" width="840" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="360" y="331" width="18.6" height="38" rx="10" fill="#E8BC60"/>
<text x="392.56353591160223" y="357" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">40</text>
<text x="340" y="411" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Deploy overlap</text>
<text x="340" y="436" font-size="19" font-weight="400" fill="#4A5568" text-anchor="end">new instances before old drain</text>
<rect x="360" y="399" width="840" height="38" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="360" y="399" width="232.0" height="38" rx="10" fill="#F25461"/>
<text x="606.0441988950276" y="425" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">500</text>
<rect x="40" y="466" width="1160" height="88" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="466" width="5" height="88" rx="2.5" fill="#F28B9D"/><text x="64" y="503" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">1,810 connections, and not one person chose that number</text><text x="64" y="529" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">Every line above was a reasonable local decision made by a different team</text>
<text x="66" y="614" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Nothing here is user traffic. The count can double during a deploy while request volume stays flat.</text>
</svg>