<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="824" viewBox="0 0 1240 824" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="first-title first-desc">
<title id="first-title">The first nine minutes</title>
<desc id="first-desc">Detection failed because the monitoring was inside the failing region. Escalation is the component that cannot be engineered away, only planned around.</desc>
<defs>
<marker id="first-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="first-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="first-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="first-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="824" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The first nine minutes</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Detection failed because the monitoring was inside the failing region.</text>
<rect x="40" y="746" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="746" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="148" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Detection took five minutes for a specific reason</text><text x="64" y="174" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Much of the monitoring ran in the primary region, so the dashboards were</text><text x="64" y="200" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">degraded and the alerts that fired were about the monitoring, not about users.</text>
<rect x="40" y="240" width="1160" height="60" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="240" width="5" height="60" rx="2.5" fill="#39D5AA"/><text x="64" y="276" font-size="21" font-weight="700" fill="#169B77" text-anchor="start">The thing that watches a region cannot run inside it.</text>
<rect x="40" y="322" width="1160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An external check, from outside both regions, hitting the real user path. It is also cheap</text>
<text x="40" y="424" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Escalation took four more minutes, and that part can only be planned around</text>
<rect x="40" y="442" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="476" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A secondary on call</text>
<path d="M526 470H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 470H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#first-marker-slate)"/>
<rect x="570" y="442" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="476" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">paged automatically if the primary does not acknowledge</text>
<rect x="40" y="510" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="544" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A severity that pages several</text>
<path d="M526 538H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 538H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#first-marker-slate)"/>
<rect x="570" y="510" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="544" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because a whole-region event is not a bug to triage</text>
<rect x="40" y="578" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="612" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A runbook reachable from a phone</text>
<path d="M526 606H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 606H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#first-marker-slate)"/>
<rect x="570" y="578" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="612" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which fails if it is a wiki page in the failing region</text>
<rect x="40" y="658" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="658" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="695" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">That last one sounds like a joke and is the most common finding in real reviews.</text>
<text x="66" y="780" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A region that is degraded rather than down cannot report on itself.</text>
</svg>