<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="490" viewBox="0 0 1240 490" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each rung of the ladder is about a thousand times the one below it, from a page of text to the storage of a whole product">
  <rect x="0" y="0" width="1240" height="490" fill="#FFFFFF"/>
  <defs>
    <filter id="be3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <g filter="url(#be3-soft)">
    <rect x="40" y="350" width="180" height="76" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="240" y="290" width="180" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="440" y="230" width="180" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="640" y="170" width="180" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="840" y="110" width="180" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="1040" y="50" width="180" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="130" y="382" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Byte</text>
  <text x="130" y="412" font-size="20" fill="#64748B" text-anchor="middle">one character</text>

  <text x="330" y="322" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Kilobyte</text>
  <text x="330" y="352" font-size="20" fill="#3B82F6" text-anchor="middle">a page of text</text>

  <text x="530" y="262" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Megabyte</text>
  <text x="530" y="292" font-size="20" fill="#3B82F6" text-anchor="middle">a photo</text>

  <text x="730" y="202" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Gigabyte</text>
  <text x="730" y="232" font-size="20" fill="#B45309" text-anchor="middle">a movie</text>

  <text x="930" y="142" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Terabyte</text>
  <text x="930" y="172" font-size="20" fill="#B45309" text-anchor="middle">a laptop disk</text>

  <text x="1130" y="82" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Petabyte</text>
  <text x="1130" y="112" font-size="20" fill="#059669" text-anchor="middle">a photo library</text>

  <text x="620" y="468" font-size="20" fill="#475569" text-anchor="middle">Each rung is about a thousand times the one below it</text>
</svg>