<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The fee on each step with an empty table below it">
<defs>
<filter id="mf-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the cheapest way past 6 steps, jumping 1, 2 or 3 at a time?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">You pay the fee for a step when you stand on it, and the top is past the last step</text>
<rect x="40" y="106" width="1160" height="452" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The table below holds the cheapest total that gets you past each step</text>
<text x="225" y="254" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">fee to stand here</text>
<rect x="249" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="305" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="305" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="375" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="431" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="431" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="501" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="557" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="557" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="627" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="683" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="683" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="753" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="809" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="809" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<rect x="879" y="216" width="112" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="935" y="253.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="935" y="298" text-anchor="middle" font-size="15.5" fill="#94A3B8"></text>
<text x="225" y="390" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">cheapest way past</text>
<rect x="249" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="305" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="375" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="431" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="501" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="557" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="627" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="683" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="753" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="809" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<rect x="879" y="352" width="112" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="935" y="389.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">-</text>
<text x="620" y="474" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">You start standing on step 0, so its fee is paid no matter what route you take</text>
<rect x="40" y="570" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="610" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The last step you stand on must be one of the final three</text>
<text x="620" y="642" text-anchor="middle" font-size="18.5" fill="#475569">A jump covers at most 3, so nothing further back can be the one you leave from</text>
</svg>