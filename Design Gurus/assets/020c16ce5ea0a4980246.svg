<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="columns-title columns-desc">
<title id="columns-title">The whole comparison, one page</title>
<desc id="columns-desc">Eleven engineer-months against two hundred thousand dollars and two engineer-months. The build column has been estimated optimistically and the buy column has not, which is the most important thing about the table.</desc>
<defs>
<marker id="columns-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="columns-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="columns-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="columns-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="840" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The whole comparison, one page</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The whole comparison fits on one page, and writing it down is most of the value.</text>
<rect x="40" y="762" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="762" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="254" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V366A6 6 0 0 0 46 372H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">BUILD</text>
<rect x="72" y="172" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="88" y="199" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">initial build</text><text x="556" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">4 eng-months</text>
<rect x="72" y="218" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="88" y="245" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">production work</text><text x="556" y="245" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">2 eng-months</text>
<rect x="72" y="264" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="88" y="291" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">operate</text><text x="556" y="291" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">1 eng-month / year</text>
<rect x="72" y="318" width="500" height="44" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="88" y="347" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">five-year total</text><text x="556" y="347" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">11 eng-months</text>
<rect x="640" y="118" width="560" height="254" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V366A6 6 0 0 0 646 372H654Z" fill="#F3CF6A"/><text x="670" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">BUY</text>
<rect x="672" y="172" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="688" y="199" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">license</text><text x="1156" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$40k / year</text>
<rect x="672" y="218" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="688" y="245" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">integration</text><text x="1156" y="245" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">1 eng-month</text>
<rect x="672" y="264" width="500" height="40" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="688" y="291" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">operate</text><text x="1156" y="291" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">0.2 eng-month / year</text>
<rect x="672" y="318" width="500" height="44" rx="9" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="688" y="347" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">five-year total</text><text x="1156" y="347" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">$200k + 2 eng-months</text>
<rect x="40" y="392" width="1160" height="58" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="392" width="5" height="58" rx="2.5" fill="#F28B9D"/><text x="64" y="427" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">The build column was estimated optimistically. The buy column was not.</text>
<rect x="40" y="472" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="506" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Multiply the build estimate</text>
<path d="M526 500H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 500H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#columns-marker-green)"/>
<rect x="570" y="472" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="493.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it covers the version you imagined,</text><text x="590" y="518.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not the one that survives production</text>
<rect x="40" y="536" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="570" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Put operating cost on both sides</text>
<path d="M526 564H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 564H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#columns-marker-green)"/>
<rect x="570" y="536" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="557.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it is the term that grows with time,</text><text x="590" y="582.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so it decides long horizons</text>
<rect x="40" y="600" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="634" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">State the horizon explicitly</text>
<path d="M526 628H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 628H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#columns-marker-green)"/>
<rect x="570" y="600" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="621.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">buying usually wins over one year</text><text x="590" y="646.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the gap narrows over five</text>
<rect x="40" y="678" width="1160" height="58" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="678" width="5" height="58" rx="2.5" fill="#39D5AA"/><text x="64" y="713" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Write both columns in engineer-months, and convert to money last.</text>
<text x="66" y="796" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The answer is usually obvious before you finish filling it in.</text>
</svg>