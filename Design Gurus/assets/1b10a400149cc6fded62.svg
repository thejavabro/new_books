<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Which failures to retry and which to fail fast: transient failures clear on their own, permanent ones repeat the same error, and unsafe writes need an idempotency key first">
  <defs>
    <clipPath id="rt3-k1"><rect x="88" y="100" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k2"><rect x="88" y="200" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k3"><rect x="88" y="300" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k4"><rect x="688" y="100" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k5"><rect x="688" y="200" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k6"><rect x="688" y="300" width="464" height="76" rx="12"/></clipPath>
    <clipPath id="rt3-k7"><rect x="370" y="448" width="500" height="80" rx="12"/></clipPath>
    <filter id="rt3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rt3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  <rect x="40" y="44" width="560" height="370" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#047857">Retry these: the cause passes</text>
  <rect x="640" y="44" width="560" height="370" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="74" font-size="16.5" font-weight="600" fill="#BE185D">Do not retry these: the cause stays</text>
  <g filter="url(#rt3-soft)">
    <rect x="88" y="100" width="464" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="88" y="100" width="6" height="76" fill="#059669" clip-path="url(#rt3-k1)"/>
  </g>
  <circle cx="126" cy="138" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,127.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="152" y="145" font-size="18.5" font-weight="600" fill="#111827">Network Timeout</text>
  <g filter="url(#rt3-soft)">
    <rect x="88" y="200" width="464" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="88" y="200" width="6" height="76" fill="#059669" clip-path="url(#rt3-k2)"/>
  </g>
  <circle cx="126" cy="238" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,227.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="152" y="245" font-size="18.5" font-weight="600" fill="#111827">Server Error 503</text>
  <g filter="url(#rt3-soft)">
    <rect x="88" y="300" width="464" height="76" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="88" y="300" width="6" height="76" fill="#059669" clip-path="url(#rt3-k3)"/>
  </g>
  <circle cx="126" cy="338" r="18" fill="#FFFFFF"/>
  <g transform="translate(115.56,327.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="152" y="345" font-size="18.5" font-weight="600" fill="#111827">Database Deadlock</text>
  <g filter="url(#rt3-soft)">
    <rect x="688" y="100" width="464" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="688" y="100" width="6" height="76" fill="#DB2777" clip-path="url(#rt3-k4)"/>
  </g>
  <circle cx="726" cy="138" r="18" fill="#FFFFFF"/>
  <g transform="translate(715.56,127.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="752" y="145" font-size="18.5" font-weight="600" fill="#111827">Bad Request 400</text>
  <g filter="url(#rt3-soft)">
    <rect x="688" y="200" width="464" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="688" y="200" width="6" height="76" fill="#DB2777" clip-path="url(#rt3-k5)"/>
  </g>
  <circle cx="726" cy="238" r="18" fill="#FFFFFF"/>
  <g transform="translate(715.56,227.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </g>
  <text x="752" y="245" font-size="18.5" font-weight="600" fill="#111827">Unauthorized 401</text>
  <g filter="url(#rt3-soft)">
    <rect x="688" y="300" width="464" height="76" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="688" y="300" width="6" height="76" fill="#DB2777" clip-path="url(#rt3-k6)"/>
  </g>
  <circle cx="726" cy="338" r="18" fill="#FFFFFF"/>
  <g transform="translate(715.56,327.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/>
  </g>
  <text x="752" y="345" font-size="18.5" font-weight="600" fill="#111827">Not Found 404</text>
  <g filter="url(#rt3-lift)">
    <rect x="370" y="448" width="500" height="80" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="370" y="448" width="9" height="80" fill="#D97706" clip-path="url(#rt3-k7)"/>
  </g>
  <circle cx="408" cy="488" r="18" fill="#FFFFFF"/>
  <g transform="translate(397.56,477.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="434" y="495" font-size="18.5" font-weight="600" fill="#111827">Retrying a Write Needs an Idempotency Key</text>
  <text x="620" y="553" font-size="15.5" text-anchor="middle" fill="#6B7280">without one, a retried payment can charge the customer twice</text>
</svg>