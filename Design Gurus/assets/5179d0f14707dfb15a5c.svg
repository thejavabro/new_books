  <text x="184" y="1367" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M294,1444 L294,1500 A90,16 0 0 0 474,1500 L474,1444" fill="#DBEAFE"/>
    <ellipse cx="384" cy="1444" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="384" y="1487" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="88" y="231" font-size="18.5" fill="#1D4ED8">(UI, DB, external services)</text>
  <text x="680" y="205" font-size="18.5" font-weight="600" text-anchor="end" fill="#1D4ED8">depends on inner rings</text>
  <text x="108" y="303" font-size="18.5" fill="#047857">(controllers, presenters, gateways)</text>
  <text x="660" y="277" font-size="18.5" font-weight="600" text-anchor="end" fill="#047857">implements interfaces</text>
  <text x="128" y="375" font-size="18.5" fill="#B45309">(application logic)</text>
  <text x="640" y="349" font-size="18.5" font-weight="600" text-anchor="end" fill="#B45309">application business rules</text>
  <text x="144" y="423" font-size="21.5" font-weight="600" fill="#111827">Entities</text>
  <text x="144" y="451" font-size="18.5" fill="#4338CA">(business rules)</text>
  <text x="624" y="423" font-size="18.5" font-weight="600" text-anchor="end" fill="#4338CA">core domain model</text>
  <text x="139" y="659" font-size="19.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">Inbound</text>
  <text x="139" y="683" font-size="19.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">adapters</text>
  <text x="629" y="659" font-size="19.5" font-weight="600" text-anchor="middle" fill="#475569">Outbound</text>
  <text x="629" y="683" font-size="19.5" font-weight="600" text-anchor="middle" fill="#475569">adapters</text>
  <text x="384" y="1147" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Presentation layer</text>
  <text x="384" y="1173" font-size="18.5" text-anchor="middle" fill="#1D4ED8">(UI / controllers)</text>
  <text x="384" y="1251" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Business layer</text>
  <text x="384" y="1277" font-size="18.5" text-anchor="middle" fill="#047857">(service / business logic)</text>
  <text x="384" y="1355" font-size="21.5" font-weight="600" text-anchor="middle" fill="#111827">Data access layer</text>
  <text x="384" y="1381" font-size="18.5" text-anchor="middle" fill="#B45309">(repositories / DAOs)</text>

  <polygon points="244,823.5 304,698.5 464,698.5 524,823.5 464,948.5 304,948.5" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="384" y="736.5" text-anchor="middle" font-size="19.5" font-weight="600" fill="#4338CA">Ports</text>
  <text x="384" y="761.5" text-anchor="middle" font-size="18.5" fill="#4338CA">(interfaces)</text>
  <polygon points="282,853.5 314,789.5 454,789.5 486,853.5 454,917.5 314,917.5" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="384" y="847.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="384" y="875.5" text-anchor="middle" font-size="18.5" fill="#047857">(use cases, domain)</text>
  <rect x="728" y="175" width="448" height="243" rx="12" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="752" cy="207" r="6" fill="#2563EB"/>
  <text x="770" y="213" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Structure:</tspan> Concentric rings</text>
  <circle cx="752" cy="245" r="6" fill="#2563EB"/>
  <text x="770" y="251" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Core:</tspan> Entities and business rules</text>
  <circle cx="752" cy="283" r="6" fill="#2563EB"/>
  <text x="770" y="289" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">External dependencies:</tspan> At the outer ring</text>
  <circle cx="752" cy="321" r="6" fill="#2563EB"/>
  <text x="770" y="327" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Key principle:</tspan> Dependencies point inward</text>
  <circle cx="752" cy="359" r="6" fill="#2563EB"/>
  <text x="770" y="365" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Common use case:</tspan> Complex business</text>
  <text x="770" y="392" font-size="18.5" fill="#1F2937">applications</text>
  <rect x="728" y="629" width="448" height="389" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="752" cy="661" r="6" fill="#059669"/>
  <text x="770" y="667" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Structure:</tspan> Ports and adapters (hexagon)</text>
  <circle cx="752" cy="699" r="6" fill="#059669"/>
  <text x="770" y="705" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Core:</tspan> Domain logic</text>
  <circle cx="752" cy="737" r="6" fill="#059669"/>
  <text x="770" y="743" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Inbound adapters:</tspan> Drive the application</text>
  <text x="770" y="770" font-size="18.5" fill="#1F2937">(for example, REST, CLI)</text>
  <circle cx="752" cy="802" r="6" fill="#059669"/>
  <text x="770" y="808" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Outbound adapters:</tspan> Implement external</text>
  <text x="770" y="835" font-size="18.5" fill="#1F2937">integrations (for example, DB, third-party</text>
  <text x="770" y="862" font-size="18.5" fill="#1F2937">services)</text>
  <circle cx="752" cy="894" r="6" fill="#059669"/>
  <text x="770" y="900" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Key principle:</tspan> Isolates domain from external</text>
  <text x="770" y="927" font-size="18.5" fill="#1F2937">concerns</text>
  <circle cx="752" cy="959" r="6" fill="#059669"/>
  <text x="770" y="965" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Common use case:</tspan> Applications with multiple</text>
  <text x="770" y="992" font-size="18.5" fill="#1F2937">interfaces and integrations</text>
  <rect x="728" y="1116" width="448" height="297" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="752" cy="1148" r="6" fill="#4F46E5"/>
  <text x="770" y="1154" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Structure:</tspan> Stack of layers</text>
  <circle cx="752" cy="1186" r="6" fill="#4F46E5"/>
  <text x="770" y="1192" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Core:</tspan> Business logic in service layer</text>
  <circle cx="752" cy="1224" r="6" fill="#4F46E5"/>
  <text x="770" y="1230" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Dependencies:</tspan> Presentation depends on</text>
  <text x="770" y="1257" font-size="18.5" fill="#1F2937">business; data access and integration</text>
  <text x="770" y="1284" font-size="18.5" fill="#1F2937">implement interfaces the business layer owns</text>
  <circle cx="752" cy="1316" r="6" fill="#4F46E5"/>
  <text x="770" y="1322" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Key principle:</tspan> Separation of concerns</text>
  <circle cx="752" cy="1354" r="6" fill="#4F46E5"/>
  <text x="770" y="1360" font-size="18.5" fill="#1F2937"><tspan font-weight="700" fill="#111827">Common use case:</tspan> Simple to medium</text>
  <text x="770" y="1387" font-size="18.5" fill="#1F2937">complexity applications</text>


</svg>