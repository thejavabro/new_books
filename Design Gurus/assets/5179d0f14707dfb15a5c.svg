  </g>
  <text x="94" y="779.25" font-size="18.5" font-weight="600" fill="#111827">REST</text>
  <text x="94" y="801.75" font-size="18.5" font-weight="600" fill="#111827">controller</text>
  <g filter="url(#m11m-soft)">
    <rect x="74" y="863.5" width="130" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="74" y="863.5" width="6" height="60" fill="#2563EB" clip-path="url(#m11m-k3)"/>
  </g>
  <text x="94" y="900.5" font-size="18.5" font-weight="600" fill="#111827">CLI</text>
  <g filter="url(#m11m-soft)">
    <rect x="564" y="743.5" width="130" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="564" y="743.5" width="6" height="80" fill="#2563EB" clip-path="url(#m11m-k4)"/>
  </g>
  <text x="584" y="779.25" font-size="18.5" font-weight="600" fill="#111827">PostgreSQL</text>
  <text x="584" y="801.75" font-size="18.5" font-weight="600" fill="#111827">repository</text>
  <g filter="url(#m11m-soft)">
    <rect x="564" y="853.5" width="130" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="564" y="853.5" width="6" height="80" fill="#64748B" clip-path="url(#m11m-k5)"/>
  </g>
  <text x="584" y="889.25" font-size="18.5" font-weight="600" fill="#111827">Stripe</text>
  <text x="584" y="911.75" font-size="18.5" font-weight="600" fill="#111827">gateway</text>
  <g filter="url(#m11m-soft)">
    <rect x="164" y="1116" width="440" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="164" y="1116" width="6" height="72" fill="#2563EB" clip-path="url(#m11m-k6)"/>
