<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1580" viewBox="0 0 1240 1580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three panels. Clean Architecture: concentric rings, frameworks and drivers depend on inner rings, interface adapters implement interfaces, use cases hold the application business rules, entities are the core domain model; dependencies point inward; common use case complex business applications. Hexagonal Architecture: REST controller and CLI inbound adapters drive ports around the application, outbound adapters, a PostgreSQL repository and a Stripe gateway, implement the database and external service integrations; isolates the domain from external concerns; common use case applications with multiple interfaces and integrations. Layered Architecture: presentation, business and data access layers above a database; presentation depends on business, and data access and integration implement interfaces the business layer owns; separation of concerns; common use case simple to medium complexity applications">
