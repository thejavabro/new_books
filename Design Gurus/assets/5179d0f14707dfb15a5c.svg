    <path d="M490.4,893.5 H564" stroke="#64748B" marker-end="url(#m11m-m-slate)"/>
    <path d="M384,1188 V1220" stroke="#64748B" marker-end="url(#m11m-m-slate)"/>
    <path d="M384,1292 V1324" stroke="#64748B" marker-end="url(#m11m-m-slate)"/>
    <path d="M384,1396 V1412" stroke="#64748B" marker-end="url(#m11m-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

