    <rect x="124" y="391" width="6" height="80" fill="#4F46E5" clip-path="url(#m11m-k1)"/>
  </g>
  <text x="144" y="438" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m11m-soft)">
