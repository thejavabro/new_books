    <clipPath id="m11m-k8"><rect x="164" y="1324" width="440" height="72" rx="12"/></clipPath>
    <marker id="m11m-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m11m-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1580" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Clean Architecture vs. Hexagonal vs. Layered Architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Clean Architecture uses rings, Hexagonal uses ports and adapters, and Layered uses a stack of layers.</text>

  <rect x="40" y="125" width="1160" height="430" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">Clean Architecture</text>
  <rect x="40" y="579" width="1160" height="463" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="609" font-size="19.5" font-weight="600" fill="#047857">Hexagonal Architecture</text>
  <rect x="40" y="1066" width="1160" height="474" rx="14" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="1096" font-size="19.5" font-weight="600" fill="#4338CA">Layered Architecture</text>
  <rect x="64" y="175" width="640" height="356" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="205" font-size="19.5" font-weight="600" fill="#1D4ED8">Frameworks and Drivers</text>
  <rect x="84" y="247" width="600" height="264" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="108" y="277" font-size="19.5" font-weight="600" fill="#047857">Interface Adapters</text>
  <rect x="104" y="319" width="560" height="172" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="128" y="349" font-size="19.5" font-weight="600" fill="#B45309">Use Cases</text>
  <rect x="64" y="629" width="150" height="389" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="659" font-size="19.5" font-weight="600" fill="#1D4ED8"></text>
  <rect x="554" y="629" width="150" height="389" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="578" y="659" font-size="19.5" font-weight="600" fill="#475569"></text>

  <g fill="none" stroke-width="2">
    <path d="M204,783.5 H262.2" stroke="#2563EB" marker-end="url(#m11m-m-blue)"/>
    <path d="M204,893.5 H276.6" stroke="#2563EB" marker-end="url(#m11m-m-blue)"/>
