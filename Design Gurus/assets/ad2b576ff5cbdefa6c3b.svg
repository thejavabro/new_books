<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1254" viewBox="0 0 1240 1254" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Stripe architecture: tokenisation in an isolated PCI zone, idempotent charge flow with a double entry ledger, timeout reconciliation and async webhooks">
  <defs>
    <filter id="st-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="st-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="st-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="st-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="st-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="st-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1254" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Stripe: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Card data quarantined, every charge idempotent, and a ledger that always balances</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Tokenisation · the merchant server never sees a card number</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#st-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">direct</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#st-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">encrypt</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#st-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">token</text>
  <g filter="url(#st-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="979" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Browser</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">card details</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Token Vault</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">isolated VPC</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Secure store</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">encrypted with an HSM</text>
  <text x="1089" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Merchant</text>
  <text x="1089" y="216" font-size="20" fill="#64748B" text-anchor="middle">only gets tok_123</text>

  <rect x="24" y="338" width="1192" height="332" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#1E40AF">2. Charge · write the intent before calling the bank, never hold a lock across it</text>
  <path d="M364,436 L456,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#st-blue)"/>
  <text x="410" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M784,436 L876,436" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#st-blue)"/>
  <text x="830" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">authorise</text>
  <path d="M620,474 L620,514" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#st-emerald)"/>
  <text x="638" y="502" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">seen before?</text>
  <path d="M1040,474 L1040,514" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#st-blue)"/>
  <text x="1058" y="502" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on success</text>
  <g filter="url(#st-soft)">
    <rect x="40" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="880" y="398" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M460,533 L460,579 A160,15 0 0 0 780,579 L780,533" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="533" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,533 L880,579 A160,15 0 0 0 1200,579 L1200,533" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="533" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Merchant</text>
  <text x="200" y="458" font-size="20" fill="#64748B" text-anchor="middle">idempotency key</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Payment Service</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">PENDING first</text>
  <text x="1040" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bank</text>
  <text x="1040" y="458" font-size="20" fill="#64748B" text-anchor="middle">takes 2 to 5s</text>
  <text x="620" y="567" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Idempotency keys</text>
  <text x="620" y="624" font-size="20" fill="#065F46" text-anchor="middle">replays the answer</text>
  <text x="1040" y="567" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Ledger</text>
  <text x="1040" y="624" font-size="20" fill="#5B21B6" text-anchor="middle">debits equal credits</text>

  <rect x="24" y="700" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="732" font-size="20" font-weight="600" fill="#92400E">3. The timeout · the bank charged the card and we never heard back</text>
  <path d="M264,798 L349,798" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#st-amber)"/>
  <text x="307" y="786" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">scan</text>
  <path d="M577,798 L662,798" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#st-amber)"/>
  <text x="620" y="786" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ask</text>
  <path d="M890,798 L975,798" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#st-amber)"/>
  <text x="933" y="786" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">settle</text>
  <g filter="url(#st-soft)">
    <path d="M40,775 L40,821 A110,15 0 0 0 260,821 L260,775" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="150" cy="775" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="353" y="760" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="760" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M979,775 L979,821 A110,15 0 0 0 1199,821 L1199,775" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="775" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="809" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Stuck PENDING</text>
  <text x="150" y="866" font-size="20" fill="#5B21B6" text-anchor="middle">older than 2 minutes</text>
  <text x="463" y="794" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reconciler</text>
  <text x="463" y="820" font-size="20" fill="#64748B" text-anchor="middle">asks, never retries</text>
  <text x="776" y="794" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bank inquiry</text>
  <text x="776" y="820" font-size="20" fill="#64748B" text-anchor="middle">paid or not found</text>
  <text x="1089" y="809" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Resolved</text>
  <text x="1089" y="866" font-size="20" fill="#5B21B6" text-anchor="middle">nightly file as backstop</text>

  <rect x="24" y="942" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="974" font-size="20" font-weight="600" fill="#92400E">4. Everything else moves off the request path</text>
  <path d="M364,1040 L456,1040" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#st-amber)"/>
  <text x="410" y="1028" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">offload</text>
  <path d="M784,1040 L876,1040" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#st-amber)"/>
  <text x="830" y="1028" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">report</text>
  <g filter="url(#st-soft)">
    <rect x="40" y="1002" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M460,1017 L460,1063 A160,15 0 0 0 780,1063 L780,1017" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="620" cy="1017" rx="160" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="880" y="1002" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="1036" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Payment Service</text>
  <text x="200" y="1062" font-size="20" fill="#64748B" text-anchor="middle">returns fast</text>
  <text x="620" y="1051" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="620" y="1108" font-size="20" fill="#92400E" text-anchor="middle">webhooks and email</text>
  <text x="1040" y="1036" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Read replicas</text>
  <text x="1040" y="1062" font-size="20" fill="#64748B" text-anchor="middle">dashboards only</text>
  <line x1="44" y1="1214" x2="72" y2="1214" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1221" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1214" x2="344.576" y2="1214" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1221" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1205" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1221" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1205" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1221" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1205" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1221" font-size="20" fill="#475569">core service</text>
</svg>