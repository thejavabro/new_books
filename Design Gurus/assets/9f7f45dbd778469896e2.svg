<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Compare expected benefit, feasibility, and risk.">
  <defs>

    <filter id="m1l5b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l5b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>


  <rect x="50" y="66" width="340" height="66" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="105" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">Delivery-time prediction</text>
  <text x="414" y="94" font-size="15.5" font-weight="700" text-anchor="start" fill="#047857">a strong predictive option</text>
  <text x="414" y="116" font-size="15.5" text-anchor="start" fill="#94A3B8">uses recorded delivery times; check data quality</text>
  <rect x="50" y="152" width="340" height="66" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="220" y="191" text-anchor="middle" font-size="16.5" font-weight="600" fill="#047857">Support assistant</text>
  <text x="414" y="180" font-size="15.5" font-weight="700" text-anchor="start" fill="#047857">a strong generative option</text>
  <text x="414" y="202" font-size="15.5" text-anchor="start" fill="#94A3B8">measurable cost, internal data, restricted actions</text>
  <rect x="50" y="238" width="340" height="66" rx="8" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <text x="220" y="277" text-anchor="middle" font-size="16.5" font-weight="600" fill="#BE185D">Ordering agent</text>
  <text x="414" y="266" font-size="15.5" font-weight="700" text-anchor="start" fill="#BE185D">needs additional controls</text>
  <text x="414" y="288" font-size="15.5" text-anchor="start" fill="#94A3B8">payment authorization, confirmation, cancellation</text>
  <rect x="40" y="336" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="370" font-size="16" fill="#475569">Any option can support a design. Explain why your choice fits these assumptions.</text>
  <rect x="64" y="396" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="164" y="418" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Feasibility means</text>
  <text x="288" y="418" font-size="15.5" fill="#475569">whether the team can build and operate it with the available data and resources</text>
  <rect x="64" y="440" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="462" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">What to check</text>
  <text x="288" y="462" font-size="15.5" fill="#475569">data quality, access permissions, expected benefit, and consequences of errors</text>
  <rect x="64" y="484" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="506" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Explain the trade-off</text>
  <text x="288" y="506" font-size="15.5" fill="#475569">state the main risk and what would change your decision</text>
</svg>