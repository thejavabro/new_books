<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="734" viewBox="0 0 1240 734" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="bug2-title bug2-desc">
<title id="bug2-title">Defect two: offsets on a timer</title>
<desc id="bug2-desc">Auto-commit records progress on a schedule that has nothing to do with whether the work finished, which produces both loss and duplication from one unchosen default. The charge call then has no way to recognize a retry.</desc>
<defs>
<marker id="bug2-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="bug2-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="bug2-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="bug2-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="734" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Defect two: offsets on a timer</text>
<text x="40" y="86" font-size="21" fill="#4A5568">enable.auto.commit defaults to true, and the default commit interval is five seconds.</text>
<rect x="40" y="656" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="656" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="560" height="300" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V412A6 6 0 0 0 46 418H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">It loses orders</text>
<rect x="72" y="176" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a poll returns 500 records</text>
<rect x="72" y="234" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">five seconds pass, the whole batch commits</text>
<rect x="72" y="292" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the process dies at record 100</text>
<rect x="72" y="350" width="500" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="382" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">400 orders are never charged</text>
<rect x="640" y="118" width="560" height="300" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V412A6 6 0 0 0 646 418H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">It double-charges</text>
<rect x="672" y="176" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="208" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the gateway is charged</text>
<rect x="672" y="234" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the process dies before the next commit</text>
<rect x="672" y="292" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="922" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the record is redelivered</text>
<rect x="672" y="350" width="500" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="382" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the customer pays twice</text>
<rect x="40" y="442" width="1160" height="60" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="442" width="5" height="60" rx="2.5" fill="#AC8BE8"/><text x="64" y="478" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The charge call also carries no idempotency key, so the gateway cannot recognize a retry</text>
<rect x="40" y="526" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="526" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="558" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The repair, in two parts, both needed</text><text x="64" y="584" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Disable auto-commit and commit after processing</text><text x="64" y="610" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Idempotency key at the gateway, unique constraint in the write transaction</text>
<text x="66" y="690" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is the defect currently costing money, and there is no line of code to read.</text>
</svg>