<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-label="Caching happens at five points along the request path: the browser, the CDN, the API gateway, the application and the database. Answering at any one of them means the request never travels further.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="540" fill="#FFFFFF"/>
  <rect x="40" y="120" width="216" height="108" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="148" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Browser</text>
  <rect x="60" y="176" width="176" height="34" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="148" y="200" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cache</text>
  <line x1="258" y1="174" x2="272" y2="174" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="148" y="260" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">never leaves</text>
  <text x="148" y="286" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the device</text>
  <rect x="276" y="120" width="216" height="108" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="384" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">CDN</text>
  <rect x="296" y="176" width="176" height="34" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="384" y="200" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cache</text>
  <line x1="494" y1="174" x2="508" y2="174" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="384" y="260" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">never reaches your</text>
  <text x="384" y="286" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">data center</text>
  <rect x="512" y="120" width="216" height="108" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="620" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Gateway</text>
  <rect x="532" y="176" width="176" height="34" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="200" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cache</text>
  <line x1="730" y1="174" x2="744" y2="174" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="620" y="260" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">never reaches</text>
  <text x="620" y="286" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a service</text>
  <rect x="748" y="120" width="216" height="108" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="856" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Application</text>
  <rect x="768" y="176" width="176" height="34" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="856" y="200" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cache</text>
  <line x1="966" y1="174" x2="980" y2="174" stroke="#94A3B8" stroke-width="1.8" marker-end="url(#ar)"/>
  <text x="856" y="260" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">never reaches</text>
  <text x="856" y="286" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">the database</text>
  <rect x="984" y="120" width="216" height="108" rx="10" fill="#F1F5F9" stroke="#D97706" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1092" y="158" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Database</text>
  <rect x="1004" y="176" width="176" height="34" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1092" y="200" font-size="20" font-weight="600" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">cache</text>
  <text x="1092" y="260" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">hot pages kept</text>
  <text x="1092" y="286" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">in memory</text>
  <text x="620" y="62" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A request travels left to right, and stops at the first cache that can answer it.</text>
  <line x1="40" y1="92" x2="1200" y2="92" stroke="#E2E8F0" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="40" y="322" width="1160" height="90" rx="10" fill="#F0FDF4" stroke="#059669" stroke-width="1.5"/>
  <text x="70" y="358" font-size="20" font-weight="600" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Every hop you stop at is work the rest of the system never does.</text>
  <text x="70" y="388" font-size="20" fill="#065F46" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">A CDN hit costs you nothing at all. A database hit costs you everything upstream of it.</text>
  <rect x="40" y="430" width="1160" height="82" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="70" y="466" font-size="20" font-weight="600" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The hard part is never the reading.</text>
  <text x="70" y="496" font-size="20" fill="#B45309" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">It is deciding what happens to the cached copy when the underlying data changes.</text>
</svg>