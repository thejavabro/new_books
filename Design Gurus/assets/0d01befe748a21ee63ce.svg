<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1250" viewBox="0 0 1240 1250" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision path for graceful degradation. A dependency call fails. If the feature is part of the core, refuse cleanly with a fast honest error plus a retry path. If not, serve a recent cached answer as stale data, otherwise serve a generic default such as best sellers, otherwise accept the work now and complete it through a queue, and if none of those apply, hide the section on the page.">
  <defs>
    <marker id="m04-l07-core-or-not-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m04-l07-core-or-not-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l07-core-or-not-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m04-l07-core-or-not-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l07-core-or-not-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1250" fill="#FFFFFF"/>

  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="60" y="60" width="460" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="290" y="106" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A dependency call fails</text>
  <text x="290" y="138" text-anchor="middle" font-size="20" fill="#64748B">a timeout, an error, or an open breaker</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="60" y="200" width="460" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Is this feature part of the core?</text>
  <text x="290" y="288" text-anchor="middle" font-size="20" fill="#64748B">checkout is the business, reviews are not</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="60" y="380" width="460" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="436" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Is there a recent cached answer?</text>
  <text x="290" y="468" text-anchor="middle" font-size="20" fill="#64748B">with a lifetime that outlives the outage</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="60" y="560" width="460" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="616" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Would a generic answer still help?</text>
  <text x="290" y="648" text-anchor="middle" font-size="20" fill="#64748B">a standard shipping quote, not the live rate</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="60" y="740" width="460" height="130" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="290" y="796" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Can the work finish later?</text>
  <text x="290" y="828" text-anchor="middle" font-size="20" fill="#64748B">order confirmed, the email may be delayed</text>

  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="640" y="200" width="540" height="130" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="910" y="256" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Refuse cleanly: a fast, honest error</text>
  <text x="910" y="288" text-anchor="middle" font-size="20" fill="#64748B">slow confusion is worse than a clean error</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="640" y="380" width="540" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="910" y="436" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Serve stale data</text>
  <text x="910" y="468" text-anchor="middle" font-size="20" fill="#64748B">on most read paths, stale beats absent</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="640" y="560" width="540" height="130" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="910" y="616" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Serve a default: best sellers</text>
  <text x="910" y="648" text-anchor="middle" font-size="20" fill="#64748B">generic where personalized failed</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="640" y="740" width="540" height="130" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="910" y="796" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Accept now, finish through a queue</text>
  <text x="910" y="828" text-anchor="middle" font-size="20" fill="#64748B">a queue defers a synchronous feature</text>
  <g filter="url(#m04-l07-core-or-not-soft)">
    <rect x="640" y="920" width="540" height="130" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="910" y="976" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Hide the section on the page</text>
  <text x="910" y="1008" text-anchor="middle" font-size="20" fill="#64748B">the layout omits what it cannot fill</text>

  <g fill="none" stroke-width="2.5">
    <path d="M290,170 L290,192" stroke="#475569" stroke-width="2" marker-end="url(#m04-l07-core-or-not-sl)"/>
    <path d="M290,330 L290,372" stroke="#475569" stroke-width="2" marker-end="url(#m04-l07-core-or-not-sl)"/>
    <path d="M290,510 L290,552" stroke="#475569" stroke-width="2" marker-end="url(#m04-l07-core-or-not-sl)"/>
    <path d="M290,690 L290,732" stroke="#475569" stroke-width="2" marker-end="url(#m04-l07-core-or-not-sl)"/>
    <path d="M290,870 L290,985 L632,985" stroke="#059669" stroke-width="2" marker-end="url(#m04-l07-core-or-not-em)"/>
    <path d="M520,265 L632,265" stroke="#DC2626" marker-end="url(#m04-l07-core-or-not-rd)"/>
    <path d="M520,445 L632,445" stroke="#059669" marker-end="url(#m04-l07-core-or-not-em)"/>
    <path d="M520,625 L632,625" stroke="#059669" stroke-width="2" marker-end="url(#m04-l07-core-or-not-em)"/>
    <path d="M520,805 L632,805" stroke="#D97706" stroke-width="2" marker-end="url(#m04-l07-core-or-not-ab)"/>
  </g>

  <text x="576" y="253" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="576" y="433" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="576" y="613" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="576" y="793" text-anchor="middle" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="306" y="358" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="306" y="538" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="306" y="718" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="306" y="930" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <line x1="60" y1="1090" x2="96" y2="1090" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1097" font-size="20" fill="#475569">Core: refuse cleanly, and fail fast and honestly</text>
  <line x1="60" y1="1130" x2="96" y2="1130" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1137" font-size="20" fill="#475569">Keeps the page rendering for the user</text>
  <line x1="60" y1="1170" x2="96" y2="1170" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="1177" font-size="20" fill="#475569">Deferred through a queue</text>
  <line x1="60" y1="1210" x2="96" y2="1210" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1217" font-size="20" fill="#475569">No: try the next, cheaper move</text>
</svg>