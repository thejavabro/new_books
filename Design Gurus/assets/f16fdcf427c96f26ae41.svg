<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="838" viewBox="0 0 1240 838" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="breaker-title breaker-desc">
<title id="breaker-title">What a circuit breaker is actually for</title>
<desc id="breaker-desc">Three states, of which half open is the one that matters. The saving is resources rather than correctness, which is why a breaker needs a fallback to be worth much.</desc>
<defs>
<marker id="breaker-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="breaker-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="breaker-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="breaker-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="838" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What a circuit breaker is actually for</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three states, of which half open is the one that matters.</text>
<rect x="40" y="760" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="760" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="352" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="216" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Closed</text><text x="216" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">calls pass, failures counted</text>
<path d="M398 154H438" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 154H438" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaker-marker-slate)"/>
<rect x="444" y="118" width="352" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Open</text><text x="620" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">calls fail immediately</text>
<path d="M802 154H842" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M802 154H842" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaker-marker-slate)"/>
<rect x="848" y="118" width="352" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1024" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Half open</text><text x="1024" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a few probes test recovery</text>
<path d="M1024 190C1024 238 216 238 216 192" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1024 190C1024 238 216 238 216 192" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaker-marker-slate)"/>
<text x="620" y="264" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">probes succeed, the breaker closes. They fail, it opens again</text>
<rect x="40" y="288" width="1160" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="288" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="64" y="327" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A breaker buys resources, not correctness</text><text x="64" y="353" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The user still does not get the thing. They are told faster, and your service</text><text x="64" y="379" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">keeps its threads and connections for everything else.</text>
<rect x="40" y="424" width="560" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="454.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Open plus a cached value or default</text><text x="320" y="481.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is a genuinely better outcome</text>
<rect x="640" y="424" width="560" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="454.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Open plus an error</text><text x="920" y="481.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">is a faster error</text>
<rect x="40" y="518" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Needs enough volume</text>
<path d="M526 550H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 550H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaker-marker-slate)"/>
<rect x="570" y="518" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="543.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three failures out of five is noise, and a percentage</text><text x="590" y="568.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">threshold will flap</text>
<rect x="40" y="592" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="630" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Per dependency, not per service</text>
<path d="M526 624H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 624H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaker-marker-slate)"/>
<rect x="570" y="592" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="617.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one breaker over everything opens on an unimportant call</text><text x="590" y="642.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and blocks the important ones</text>
<rect x="40" y="674" width="1160" height="58" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="674" width="5" height="58" rx="2.5" fill="#5EC9EC"/><text x="64" y="709" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The breaker is the last of the four patterns, not the first.</text>
<text x="66" y="794" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Letting too many probes through at once re-overloads a dependency when it is most fragile.</text>
</svg>