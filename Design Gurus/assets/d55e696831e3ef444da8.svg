<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Explain a decision in four parts</title><desc id="desc">The article-storage decision is explained through its requirement, chosen persistence, management cost, and a changed requirement that would justify reconsideration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="780" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Explain a decision in four parts</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Example: users must read saved articles after restarting offline.</tspan></text><rect x="50" y="160" width="530" height="190" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="202" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">1. Requirement</tspan></text><text x="72" y="250" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Saved text must remain</tspan><tspan x="72" dy="32">after the process ends.</tspan></text><rect x="620" y="160" width="530" height="190" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="642" y="202" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="642" dy="0">2. Choice</tspan></text><text x="642" y="250" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="642" dy="0">Save text and metadata.</tspan><tspan x="642" dy="32">Memory alone is insufficient.</tspan></text><rect x="50" y="395" width="530" height="190" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="437" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="72" dy="0">3. Cost</tspan></text><text x="72" y="485" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Storage cleanup and</tspan><tspan x="72" dy="32">saved-data upgrades.</tspan></text><rect x="620" y="395" width="530" height="190" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="642" y="437" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="642" dy="0">4. Reconsider when...</tspan></text><text x="642" y="485" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="642" dy="0">Content no longer needs</tspan><tspan x="642" dy="32">to remain after the session.</tspan></text><rect x="50" y="630" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="676" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Connect the decision to a requirement, not only to a tool name.</tspan></text></g></svg>