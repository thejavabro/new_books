<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="804" viewBox="0 0 1240 804" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="partcap-title partcap-desc">
<title id="partcap-title">Partitions cap your recovery speed</title>
<desc id="partcap-desc">Within a consumer group each partition is assigned to exactly one consumer, so consumers beyond the partition count sit idle. Partition count is therefore a capacity decision made at topic creation and awkward to change.</desc>
<defs>
<marker id="partcap-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="partcap-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="partcap-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="partcap-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="804" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Partitions cap your recovery speed</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Scaling out is capped by a number that was chosen when the topic was created.</text>
<rect x="40" y="726" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="726" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A topic with four partitions, and five consumers in the group</text>
<rect x="40" y="168" width="200" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="140" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition 0</text>
<path d="M140 224V248" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M140 224V248" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="40" y="254" width="200" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="140" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer 0</text>
<rect x="280" y="168" width="200" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="380" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition 1</text>
<path d="M380 224V248" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M380 224V248" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="280" y="254" width="200" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="380" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer 1</text>
<rect x="520" y="168" width="200" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition 2</text>
<path d="M620 224V248" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M620 224V248" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="520" y="254" width="200" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer 2</text>
<rect x="760" y="168" width="200" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="860" y="199" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition 3</text>
<path d="M860 224V248" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M860 224V248" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="760" y="254" width="200" height="50" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="860" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer 3</text>
<rect x="1000" y="168" width="200" height="50" rx="7" fill="#FFFFFF" stroke="#B8C4D0" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="1000" y="254" width="200" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1100" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">consumer 4</text>
<text x="1100" y="332" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">assigned nothing</text>
<text x="1100" y="358" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">and idle</text>
<rect x="40" y="380" width="1160" height="58" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="380" width="5" height="58" rx="2.5" fill="#AC8BE8"/><text x="64" y="415" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each partition is assigned to exactly one consumer in the group.</text>
<text x="40" y="478" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two consequences and one caveat</text>
<rect x="40" y="496" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="532" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Partition count is a recovery decision</text>
<path d="M526 526H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 526H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="570" y="496" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="519.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">more partitions than consumers is cheap; fewer is a</text><text x="590" y="544.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ceiling found during an incident</text>
<rect x="40" y="568" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="604" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Adding partitions is a migration</text>
<path d="M526 598H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 598H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="570" y="568" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="591.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the partition is the key hash modulo the count, so</text><text x="590" y="616.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">changing the count moves existing keys</text>
<rect x="40" y="640" width="480" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="676" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Key skew caps you anyway</text>
<path d="M526 670H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 670H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#partcap-marker-slate)"/>
<rect x="570" y="640" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="663.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">if one partition takes most of the traffic, adding</text><text x="590" y="688.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">consumers does nothing at all</text>
<text x="66" y="760" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The symptom of key skew is high total lag with most consumers doing nothing.</text>
</svg>