<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="380" viewBox="0 0 1240 380" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A sliding window with counters: the key Kristie maps to a hash with one counter per minute, and an incoming request is rejected because the counters inside the window sum to the limit.">
  <defs>
    <filter id="rl10-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <marker id="rl10-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="rl10-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="rl10-k1"><rect x="100" y="100" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="rl10-k2"><rect x="430" y="70" width="340" height="150" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="380" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M270,145 H422" stroke="#64748B" marker-end="url(#rl10-sl)"/>
    <path d="M936,145 H778" stroke="#DB2777" marker-end="url(#rl10-pk)"/>
  </g>

  
  <g filter="url(#rl10-soft)">
    <rect x="100" y="100" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="100" width="6" height="90" fill="#2563EB" clip-path="url(#rl10-k1)"/>
  </g>
  <circle cx="138" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,134.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="164" y="152" font-size="18.5" font-weight="600" fill="#111827">Kristie</text>
  <text x="185" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">UserID, 8 bytes</text>

  
  <g filter="url(#rl10-soft)">
    <rect x="430" y="70" width="340" height="150" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="430" y="70" width="6" height="150" fill="#7C3AED" clip-path="url(#rl10-k2)"/>
  </g>
  <circle cx="468" cy="106" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,95.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="494" y="113" font-size="18.5" font-weight="600" fill="#111827">Hash</text>
  <rect x="454" y="130" width="292" height="32" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="468" y="151" font-size="15.5" fill="#111827">03:00 &#8594; 1</text>
  <rect x="454" y="172" width="292" height="32" rx="8" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1"/>
  <text x="468" y="193" font-size="15.5" fill="#111827">03:01 &#8594; 2</text>
  <text x="600" y="245" font-size="15.5" text-anchor="middle" fill="#6B7280">per-minute counters</text>

  
  <circle cx="950" cy="145" r="13" fill="#DB2777"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round">
    <path d="M945,140 l10,10 M955,140 l-10,10"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="950" y="105" fill="#BE185D">incoming request</text>
    <text x="950" y="190" fill="#BE185D">sum inside the window = 3 = limit, reject</text>
  </g>

  
  <rect x="40" y="285" width="1160" height="56" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="319" text-anchor="middle" font-size="16" fill="#475569">One counter per normalized minute; old minutes drop out as the window slides.</text>
</svg>