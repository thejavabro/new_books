<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="846" viewBox="0 0 1240 846" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight named failures for task creation, split into two groups. Each carries a status code, a stable machine-readable error code, the condition that produces it, and the action the caller should take next.">
  <defs>
    <filter id="yl04failure-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="yl04failure-k1"><rect x="84" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k2"><rect x="84" y="300" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k3"><rect x="84" y="426" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k4"><rect x="84" y="552" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k5"><rect x="684" y="174" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k6"><rect x="684" y="300" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k7"><rect x="684" y="426" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yl04failure-k8"><rect x="684" y="552" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="846" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Eight named failures, each with a caller action</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M560,66 L571,77 M571,66 L560,77"/>
  </g>
  <text x="583" y="77" font-size="15.5" fill="#6B7280">the condition that produces it</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M856,71 L860.5,75.5 L868,65.5"/>
  </g>
  <text x="882" y="77" font-size="15.5" fill="#6B7280">the action the caller takes next</text>

  
  <rect x="44" y="126" width="552" height="548" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Bad request or missing credential</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="84" y="174" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#yl04failure-k1)"/>
  </g>
  <circle cx="118" cy="198" r="4.5" fill="#DB2777"/>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="184" y="205" font-size="18.5" font-weight="600" fill="#111827">invalid_request</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,237 L97,248 M97,237 L86,248"/>
  </g>
  <text x="110" y="248" font-size="15.5" fill="#6B7280">Malformed JSON or a missing required field</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,268 L90.5,272.5 L98,262.5"/>
  </g>
  <text x="110" y="274" font-size="15.5" fill="#6B7280">correct it, do not retry unchanged</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="84" y="300" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="300" width="6" height="48" fill="#DB2777" clip-path="url(#yl04failure-k2)"/>
  </g>
  <circle cx="118" cy="324" r="4.5" fill="#DB2777"/>
  <text x="142" y="331" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="184" y="331" font-size="18.5" font-weight="600" fill="#111827">invalid_assignee</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,363 L97,374 M97,363 L86,374"/>
  </g>
  <text x="110" y="374" font-size="15.5" fill="#6B7280">Shape is valid but the assignee cannot be assigned</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,394 L90.5,398.5 L98,388.5"/>
  </g>
  <text x="110" y="400" font-size="15.5" fill="#6B7280">correct the listed assignee</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="84" y="426" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="426" width="6" height="48" fill="#DB2777" clip-path="url(#yl04failure-k3)"/>
  </g>
  <circle cx="118" cy="450" r="4.5" fill="#DB2777"/>
  <text x="142" y="457" font-size="18.5" font-weight="600" fill="#BE185D">400</text>
  <text x="184" y="457" font-size="18.5" font-weight="600" fill="#111827">idempotency_key_reused</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,489 L97,500 M97,489 L86,500"/>
  </g>
  <text x="110" y="500" font-size="15.5" fill="#6B7280">Same key sent with a different body</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,520 L90.5,524.5 L98,514.5"/>
  </g>
  <text x="110" y="526" font-size="15.5" fill="#6B7280">new key, or restore the body</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="84" y="552" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="84" y="552" width="6" height="48" fill="#DB2777" clip-path="url(#yl04failure-k4)"/>
  </g>
  <circle cx="118" cy="576" r="4.5" fill="#DB2777"/>
  <text x="142" y="583" font-size="18.5" font-weight="600" fill="#BE185D">401</text>
  <text x="184" y="583" font-size="18.5" font-weight="600" fill="#111827">authentication_required</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M86,615 L97,626 M97,615 L86,626"/>
  </g>
  <text x="110" y="626" font-size="15.5" fill="#6B7280">Credential missing, expired, or invalid</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M86,646 L90.5,650.5 L98,640.5"/>
  </g>
  <text x="110" y="652" font-size="15.5" fill="#6B7280">obtain a valid credential</text>

  
  <rect x="644" y="126" width="552" height="548" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#B45309">Blocked by identity, state, or limits</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="684" y="174" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="48" fill="#D97706" clip-path="url(#yl04failure-k5)"/>
  </g>
  <circle cx="718" cy="198" r="4.5" fill="#D97706"/>
  <text x="742" y="205" font-size="18.5" font-weight="600" fill="#B45309">403</text>
  <text x="784" y="205" font-size="18.5" font-weight="600" fill="#111827">task_create_forbidden</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,237 L697,248 M697,237 L686,248"/>
  </g>
  <text x="710" y="248" font-size="15.5" fill="#6B7280">Authenticated but cannot create here</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,268 L690.5,272.5 L698,262.5"/>
  </g>
  <text x="710" y="274" font-size="15.5" fill="#6B7280">use an authorized identity</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="684" y="300" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="300" width="6" height="48" fill="#D97706" clip-path="url(#yl04failure-k6)"/>
  </g>
  <circle cx="718" cy="324" r="4.5" fill="#D97706"/>
  <text x="742" y="331" font-size="18.5" font-weight="600" fill="#B45309">404</text>
  <text x="784" y="331" font-size="18.5" font-weight="600" fill="#111827">project_not_found</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,363 L697,374 M697,363 L686,374"/>
  </g>
  <text x="710" y="374" font-size="15.5" fill="#6B7280">Project absent, or not visible to the caller</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,394 L690.5,398.5 L698,388.5"/>
  </g>
  <text x="710" y="400" font-size="15.5" fill="#6B7280">correct the project reference</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="684" y="426" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="426" width="6" height="48" fill="#D97706" clip-path="url(#yl04failure-k7)"/>
  </g>
  <circle cx="718" cy="450" r="4.5" fill="#D97706"/>
  <text x="742" y="457" font-size="18.5" font-weight="600" fill="#B45309">409</text>
  <text x="784" y="457" font-size="18.5" font-weight="600" fill="#111827">external_id_conflict</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,489 L697,500 M697,489 L686,500"/>
  </g>
  <text x="710" y="500" font-size="15.5" fill="#6B7280">Another task already uses this external ID</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,520 L690.5,524.5 L698,514.5"/>
  </g>
  <text x="710" y="526" font-size="15.5" fill="#6B7280">fetch it, or choose another ID</text>

  <g filter="url(#yl04failure-soft)">
    <rect x="684" y="552" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="552" width="6" height="48" fill="#D97706" clip-path="url(#yl04failure-k8)"/>
  </g>
  <circle cx="718" cy="576" r="4.5" fill="#D97706"/>
  <text x="742" y="583" font-size="18.5" font-weight="600" fill="#B45309">429</text>
  <text x="784" y="583" font-size="18.5" font-weight="600" fill="#111827">rate_limit_exceeded</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M686,615 L697,626 M697,615 L686,626"/>
  </g>
  <text x="710" y="626" font-size="15.5" fill="#6B7280">Caller exceeded the write limit</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M686,646 L690.5,650.5 L698,640.5"/>
  </g>
  <text x="710" y="652" font-size="15.5" fill="#6B7280">wait for Retry-After</text>

  
  <rect x="40" y="706" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="748" text-anchor="middle" font-size="16" fill="#475569">A failure the caller cannot act on is an unfinished contract.</text>
  <text x="620" y="776" text-anchor="middle" font-size="16" fill="#475569">Two callers, a person and a program, both need to know what to do next.</text>
</svg>