<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">One screen can have several facts</title><desc id="desc">Content availability, refresh progress, and data freshness are independent dimensions of feed state.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="675" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">One screen can have several facts</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Do not force useful content into a single loading or error state.</tspan></text><rect x="50" y="175" width="345.3333333333333" height="280" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="217" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Content</tspan></text><text x="72" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Saved posts are visible</tspan></text><rect x="427.3333333333333" y="175" width="345.3333333333333" height="280" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="449.3333333333333" y="217" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="449.3333333333333" dy="0">Refresh</tspan></text><text x="449.3333333333333" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="449.3333333333333" dy="0">A request is running</tspan><tspan x="449.3333333333333" dy="32">or has failed</tspan></text><rect x="804.6666666666666" y="175" width="345.3333333333333" height="280" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="826.6666666666666" y="217" font-size="25" fill="#059669" font-weight="700" text-anchor="start"><tspan x="826.6666666666666" dy="0">Freshness</tspan></text><text x="826.6666666666666" y="265" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="826.6666666666666" dy="0">Data was validated</tspan><tspan x="826.6666666666666" dy="32">at a known time</tspan></text><rect x="50" y="515" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="561" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Visible content can coexist with refreshing or a refresh error.</tspan></text></g></svg>