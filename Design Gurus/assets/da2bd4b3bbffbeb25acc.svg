<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1010" viewBox="0 0 1240 1010" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four rows. Object Request Broker (CORBA): a client with its stub calls through the ORB to a server with its skeleton, and the return value comes back. API gateways such as Kong and AWS API Gateway: external clients send HTTP requests through the gateway to internal services and get responses. Service mesh sidecars such as Istio and Linkerd: service A calls service B through two sidecar proxies. Related pattern, not an implementation: message brokers such as Kafka and RabbitMQ pass messages from a producer through the broker to consumers, with no remote call, no return value, and no stub or skeleton.">
