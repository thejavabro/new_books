  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Broker architecture in real-world systems</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three systems that apply the broker pattern, and message brokers, a related pattern.</text>

