<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="862" viewBox="0 0 1240 862" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same burst of fourteen requests under three controls: a rate limiter rejects four of them, a throttle queues and delays them, and a monthly quota blocks everything once the total allowance is spent">
  <rect x="0" y="0" width="1240" height="862" fill="#FFFFFF"/>
  <defs>
    <marker id="ap5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same client, the same burst, three different controls</text>

  
  <rect x="40" y="76" width="1160" height="200" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">Rate limiting: a hard cap on arrivals per second</text>
  <text x="64" y="140" font-size="20" fill="#334155">the limit is 10 per second, and 14 arrive</text>

  <circle cx="110" cy="190" r="13" fill="#059669"/>
  <circle cx="166" cy="190" r="13" fill="#059669"/>
  <circle cx="222" cy="190" r="13" fill="#059669"/>
  <circle cx="278" cy="190" r="13" fill="#059669"/>
  <circle cx="334" cy="190" r="13" fill="#059669"/>
  <circle cx="390" cy="190" r="13" fill="#059669"/>
  <circle cx="446" cy="190" r="13" fill="#059669"/>
  <circle cx="502" cy="190" r="13" fill="#059669"/>
  <circle cx="558" cy="190" r="13" fill="#059669"/>
  <circle cx="614" cy="190" r="13" fill="#059669"/>
  <circle cx="670" cy="190" r="13" fill="#DC2626"/>
  <circle cx="726" cy="190" r="13" fill="#DC2626"/>
  <circle cx="782" cy="190" r="13" fill="#DC2626"/>
  <circle cx="838" cy="190" r="13" fill="#DC2626"/>

  <text x="362" y="238" font-size="20" fill="#065F46" text-anchor="middle">10 served</text>
  <text x="754" y="238" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">4 rejected with 429</text>

  <rect x="940" y="136" width="244" height="112" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1062" y="172" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Rejected.</text>
  <text x="1062" y="198" font-size="20" fill="#B91C1C" text-anchor="middle">The client has to</text>
  <text x="1062" y="224" font-size="20" fill="#B91C1C" text-anchor="middle">send them again.</text>

  
  <rect x="40" y="296" width="1160" height="200" rx="14" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="330" font-size="20" font-weight="600" fill="#92400E">Throttling: the same burst, slowed instead of dropped</text>
  <text x="64" y="360" font-size="20" fill="#334155">10 go through now, 4 wait in a queue</text>

  <circle cx="110" cy="410" r="13" fill="#059669"/>
  <circle cx="166" cy="410" r="13" fill="#059669"/>
  <circle cx="222" cy="410" r="13" fill="#059669"/>
  <circle cx="278" cy="410" r="13" fill="#059669"/>
  <circle cx="334" cy="410" r="13" fill="#059669"/>
  <circle cx="390" cy="410" r="13" fill="#059669"/>
  <circle cx="446" cy="410" r="13" fill="#059669"/>
  <circle cx="502" cy="410" r="13" fill="#059669"/>
  <circle cx="558" cy="410" r="13" fill="#059669"/>
  <circle cx="614" cy="410" r="13" fill="#059669"/>

  <circle cx="670" cy="410" r="13" fill="#D97706"/>
  <circle cx="726" cy="410" r="13" fill="#D97706"/>
  <circle cx="782" cy="410" r="13" fill="#D97706"/>
  <circle cx="838" cy="410" r="13" fill="#D97706"/>

  <text x="362" y="458" font-size="20" fill="#065F46" text-anchor="middle">10 served now</text>
  <text x="754" y="458" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">4 queued, then served</text>

  <rect x="940" y="356" width="244" height="112" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="1062" y="392" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Delayed.</text>
  <text x="1062" y="418" font-size="20" fill="#92400E" text-anchor="middle">All 14 land. Four of</text>
  <text x="1062" y="444" font-size="20" fill="#92400E" text-anchor="middle">them arrive late.</text>

  
  <rect x="40" y="516" width="1160" height="200" rx="14" fill="none" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="550" font-size="20" font-weight="600" fill="#5B21B6">Quota: a total allowance for the whole billing period</text>
  <text x="64" y="580" font-size="20" fill="#334155">10,000 calls per month</text>

  <rect x="110" y="606" width="555" height="44" fill="#ECFDF5"/>
  <rect x="665" y="606" width="205" height="44" fill="#FEF2F2"/>
  <rect x="110" y="606" width="760" height="44" rx="6" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="387" y="634" font-size="20" fill="#065F46" text-anchor="middle">10,000 used by day 22</text>
  <text x="767" y="634" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">every call blocked</text>
  <line x1="665" y1="598" x2="665" y2="658" stroke="#DC2626" stroke-width="2.5"/>
  <text x="665" y="686" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the cap is reached on day 22</text>

  <rect x="940" y="576" width="244" height="112" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="1062" y="612" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Exhausted.</text>
  <text x="1062" y="638" font-size="20" fill="#5B21B6" text-anchor="middle">Blocked until the</text>
  <text x="1062" y="664" font-size="20" fill="#5B21B6" text-anchor="middle">counter resets.</text>

  
  <rect x="40" y="740" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="776" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three different answers to too much traffic: refuse it, slow it down, or say the allowance is spent.</text>
  <text x="620" y="806" font-size="20" fill="#334155" text-anchor="middle">Most real systems run all three at once, at different layers.</text>
</svg>