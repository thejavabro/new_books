<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="964" viewBox="0 0 1240 964" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One GraphQL request descends through orders, items, product and reviews. Each selected relationship carries a field cost. The costs add to 320 against a caller budget of 250, so the request is refused before execution. A depth gate, a cost gate and a persisted query gate all run before execution begins.">
  <defs>
    <marker id="pf-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="pf-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="pf-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="pf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="pf-k1"><rect x="70" y="104" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k2"><rect x="118" y="184" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k3"><rect x="166" y="264" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k4"><rect x="214" y="344" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k5"><rect x="262" y="424" width="280" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k6"><rect x="780" y="166" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k7"><rect x="780" y="278" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k8"><rect x="780" y="398" width="360" height="48" rx="10"/></clipPath>
    <clipPath id="pf-k9"><rect x="76" y="652" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="pf-k10"><rect x="360" y="652" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="pf-k11"><rect x="644" y="652" width="236" height="90" rx="12"/></clipPath>
    <clipPath id="pf-k12"><rect x="928" y="652" width="236" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="964" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="520" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One request, expanding work</text>

  
  <rect x="740" y="96" width="440" height="404" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="764" y="126" font-size="16.5" font-weight="600" fill="#BE185D">Before execution</text>

  
  <g fill="none" stroke-width="2">
    <path d="M84,152 V196 Q84,208 96,208 H118" stroke="#64748B" marker-end="url(#pf-sl)"/>
    <path d="M132,232 V276 Q132,288 144,288 H166" stroke="#64748B" marker-end="url(#pf-sl)"/>
    <path d="M180,312 V356 Q180,368 192,368 H214" stroke="#64748B" marker-end="url(#pf-sl)"/>
    <path d="M228,392 V436 Q228,448 240,448 H262" stroke="#64748B" marker-end="url(#pf-sl)"/>
  </g>
  <g fill="none" stroke-width="2.5">
    <path d="M960,214 V278" stroke="#DB2777" marker-end="url(#pf-pk)"/>
    <path d="M960,326 V398" stroke="#DB2777" marker-end="url(#pf-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="1036" y="252" fill="#BE185D">over budget</text>
    <text x="1030" y="368" fill="#BE185D">so refuse</text>
  </g>

  
  <g filter="url(#pf-soft)">
    <rect x="70" y="104" width="280" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="104" width="6" height="48" fill="#64748B" clip-path="url(#pf-k1)"/>
  </g>
  <circle cx="104" cy="128" r="15" fill="#FFFFFF"/>
  <g transform="translate(95,119) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="128" y="135" font-size="18.5" font-weight="600" fill="#111827">One GraphQL request</text>

  
  <g filter="url(#pf-soft)">
    <rect x="118" y="184" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="118" y="184" width="6" height="48" fill="#2563EB" clip-path="url(#pf-k2)"/>
  </g>
  <circle cx="152" cy="208" r="4.5" fill="#2563EB"/>
  <text x="176" y="215" font-size="18.5" font-weight="600" fill="#111827">orders(limit: 100)</text>
  <rect x="420" y="191" width="118" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="479" y="213" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">base cost 105</text>

  
  <g filter="url(#pf-soft)">
    <rect x="166" y="264" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="166" y="264" width="6" height="48" fill="#2563EB" clip-path="url(#pf-k3)"/>
  </g>
  <circle cx="200" cy="288" r="4.5" fill="#2563EB"/>
  <text x="224" y="295" font-size="18.5" font-weight="600" fill="#111827">items(limit: 100)</text>
  <rect x="468" y="271" width="118" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="527" y="293" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">base cost 105</text>

  
  <g filter="url(#pf-soft)">
    <rect x="214" y="344" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="214" y="344" width="6" height="48" fill="#2563EB" clip-path="url(#pf-k4)"/>
  </g>
  <circle cx="248" cy="368" r="4.5" fill="#2563EB"/>
  <text x="272" y="375" font-size="18.5" font-weight="600" fill="#111827">product</text>
  <rect x="516" y="351" width="118" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="575" y="373" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">base cost 5</text>

  
  <g filter="url(#pf-soft)">
    <rect x="262" y="424" width="280" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="262" y="424" width="6" height="48" fill="#2563EB" clip-path="url(#pf-k5)"/>
  </g>
  <circle cx="296" cy="448" r="4.5" fill="#2563EB"/>
  <text x="320" y="455" font-size="18.5" font-weight="600" fill="#111827">reviews(limit: 100)</text>
  <rect x="564" y="431" width="118" height="34" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="623" y="453" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">base cost 105</text>

  
  <text x="306" y="506" text-anchor="middle" font-size="15.5" fill="#6B7280">Multiply nested costs by parent list sizes.</text>
  <text x="306" y="529" text-anchor="middle" font-size="15.5" fill="#6B7280">Adding base weights alone misses repeated work.</text>

  
  <g filter="url(#pf-lift)">
    <rect x="780" y="166" width="360" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="780" y="166" width="9" height="48" fill="#DB2777" clip-path="url(#pf-k6)"/>
  </g>
  <circle cx="814" cy="190" r="15" fill="#FFFFFF"/>
  <g transform="translate(805,181) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="838" y="197" font-size="18.5" font-weight="600" fill="#111827">Estimated cost over 1 million</text>

  
  <g filter="url(#pf-soft)">
    <rect x="780" y="278" width="360" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="780" y="278" width="6" height="48" fill="#64748B" clip-path="url(#pf-k7)"/>
  </g>
  <circle cx="814" cy="302" r="15" fill="#FFFFFF"/>
  <g transform="translate(805,293) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="838" y="309" font-size="18.5" font-weight="600" fill="#111827">Caller budget 250</text>

  
  <g filter="url(#pf-lift)">
    <rect x="780" y="398" width="360" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="780" y="398" width="9" height="48" fill="#DB2777" clip-path="url(#pf-k8)"/>
  </g>
  <circle cx="814" cy="422" r="15" fill="#FFFFFF"/>
  <g transform="translate(805,413) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="838" y="429" font-size="18.5" font-weight="600" fill="#111827">Refused with 400</text>

  
  <rect x="40" y="592" width="1160" height="200" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="622" font-size="16.5" font-weight="600" fill="#475569">Every gate runs before any resolver executes</text>

  <g fill="none" stroke-width="2">
    <path d="M312,697 H360" stroke="#D97706" marker-end="url(#pf-am)"/>
    <path d="M596,697 H644" stroke="#D97706" marker-end="url(#pf-am)"/>
    <path d="M880,697 H928" stroke="#D97706" marker-end="url(#pf-am)"/>
  </g>

  <g filter="url(#pf-soft)">
    <rect x="76" y="652" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="652" width="6" height="90" fill="#D97706" clip-path="url(#pf-k9)"/>
  </g>
  <circle cx="114" cy="697" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,686.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="704" font-size="18.5" font-weight="600" fill="#111827">Depth gate</text>
  <text x="194" y="767" text-anchor="middle" font-size="15.5" fill="#6B7280">maximum nesting</text>

  <g filter="url(#pf-soft)">
    <rect x="360" y="652" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="360" y="652" width="6" height="90" fill="#D97706" clip-path="url(#pf-k10)"/>
  </g>
  <circle cx="398" cy="697" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,686.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="424" y="704" font-size="18.5" font-weight="600" fill="#111827">Cost gate</text>
  <text x="478" y="767" text-anchor="middle" font-size="15.5" fill="#6B7280">budget per caller</text>

  <g filter="url(#pf-soft)">
    <rect x="644" y="652" width="236" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="644" y="652" width="6" height="90" fill="#D97706" clip-path="url(#pf-k11)"/>
  </g>
  <circle cx="682" cy="697" r="18" fill="#FFFFFF"/>
  <g transform="translate(671.56,686.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="708" y="704" font-size="18.5" font-weight="600" fill="#111827">Persisted gate</text>
  <text x="762" y="767" text-anchor="middle" font-size="15.5" fill="#6B7280">approved documents</text>

  <g filter="url(#pf-soft)">
    <rect x="928" y="652" width="236" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="928" y="652" width="6" height="90" fill="#059669" clip-path="url(#pf-k12)"/>
  </g>
  <circle cx="966" cy="697" r="18" fill="#FFFFFF"/>
  <g transform="translate(955.56,686.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="992" y="704" font-size="18.5" font-weight="600" fill="#111827">Execute</text>
  <text x="1046" y="767" text-anchor="middle" font-size="15.5" fill="#6B7280">within the cost budget</text>

  
  <rect x="40" y="824" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="866" text-anchor="middle" font-size="16" fill="#475569">Every field may be valid while the combined request is not reasonable.</text>
  <text x="620" y="894" text-anchor="middle" font-size="16" fill="#475569">A short request can create a large amount of nested work.</text>
</svg>