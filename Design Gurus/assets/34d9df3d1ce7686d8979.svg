<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="796" viewBox="0 0 1240 796" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="recall-title recall-desc">
<title id="recall-title">Recall is a parameter you set</title>
<desc id="recall-desc">Approximate nearest-neighbor search is approximate by a degree you choose, and it is the dial that connects index tuning to retrieval quality.</desc>
<defs>
<marker id="recall-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="recall-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="recall-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="recall-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="796" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Recall is a parameter you set</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Approximate nearest-neighbor search is approximate by a degree you choose.</text>
<rect x="40" y="718" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="718" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="154" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Build-time parameters</text><text x="64" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">build time and memory, for achievable recall</text>
<rect x="640" y="118" width="560" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="118" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="664" y="154" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Query-time parameters</text><text x="664" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">latency, for recall, on every query</text>
<rect x="40" y="224" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="224" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="260" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Recall is a dial, and a team that has not set it has accepted a default</text><text x="64" y="286" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Wrong passages may mean a chunking problem, an embedding problem, or a search</text><text x="64" y="312" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">examining too little of the index. Only measurement distinguishes them.</text>
<rect x="40" y="358" width="480" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Measure against exact search</text>
<path d="M526 388H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 388H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recall-marker-slate)"/>
<rect x="570" y="358" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="381.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">run the exhaustive search on a sample and compare.</text><text x="590" y="406.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Otherwise every change is a guess</text>
<rect x="40" y="428" width="480" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="464" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Tune query-time first</text>
<path d="M526 458H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 458H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recall-marker-slate)"/>
<rect x="570" y="428" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="464" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">changeable per query with no rebuild, so it is the cheap dial</text>
<rect x="40" y="498" width="480" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="534" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Know the build cost in advance</text>
<path d="M526 528H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 528H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#recall-marker-slate)"/>
<rect x="570" y="498" width="630" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="521.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rebuilding a large index can take hours, and finding</text><text x="590" y="546.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that out mid-incident is avoidable</text>
<rect x="40" y="584" width="1160" height="108" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="584" width="5" height="108" rx="2.5" fill="#F28B9D"/><text x="64" y="618" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Filtering and approximate search interact</text><text x="64" y="644" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A selective filter applied after the search can return far fewer results than requested, or none:</text><text x="64" y="670" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a tenant whose documents are a thousandth of the corpus may have none among the candidates examined.</text>
<text x="66" y="751" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">In a relational store the planner handles this. In a specialist store it is a feature you check for by name.</text>
</svg>