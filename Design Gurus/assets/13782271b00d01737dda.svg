<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="648" viewBox="0 0 1240 648" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three circuit breaker states: closed passes calls through, open fails fast after the failure threshold, and half-open sends trial calls that either close the circuit again or reopen it">
  <rect x="0" y="0" width="1240" height="648" fill="#FFFFFF"/>
  <defs>
    <marker id="dp3-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="dp3-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="dp3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The three states of a circuit breaker</text>

  
  <path d="M1010 240 L1010 170 L620 170 L620 234" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#dp3-red)"/>
  <text x="815" y="160" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">a trial call fails, so the circuit opens again</text>

  
  <line x1="380" y1="295" x2="462" y2="295" stroke="#DC2626" stroke-width="2" marker-end="url(#dp3-red)"/>
  <text x="421" y="214" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">failure threshold</text>
  <text x="421" y="242" font-size="20" fill="#B91C1C" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">reached</text>

  
  <line x1="770" y1="295" x2="852" y2="295" stroke="#475569" stroke-width="2" marker-end="url(#dp3-slate)"/>
  <text x="811" y="214" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">cool-down timer</text>
  <text x="811" y="242" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">expires</text>

  
  <path d="M1010 356 L1010 434 L230 434 L230 362" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#dp3-emerald)"/>
  <text x="620" y="426" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the trial calls succeed, so the circuit closes</text>

  
  <g filter="url(#dp3-soft)">
    <rect x="80" y="240" width="300" height="116" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="470" y="240" width="300" height="116" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="860" y="240" width="300" height="116" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <text x="230" y="278" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Closed</text>
  <text x="230" y="310" font-size="20" fill="#64748B" text-anchor="middle">calls pass straight through</text>
  <text x="230" y="338" font-size="20" fill="#64748B" text-anchor="middle">failures are counted</text>

  <text x="620" y="278" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Open</text>
  <text x="620" y="310" font-size="20" fill="#64748B" text-anchor="middle">calls fail immediately</text>
  <text x="620" y="338" font-size="20" fill="#64748B" text-anchor="middle">nothing is sent downstream</text>

  <text x="1010" y="278" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Half-Open</text>
  <text x="1010" y="310" font-size="20" fill="#64748B" text-anchor="middle">a few trial calls go out</text>
  <text x="1010" y="338" font-size="20" fill="#64748B" text-anchor="middle">to test for recovery</text>

  
  <rect x="120" y="474" width="1000" height="72" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="506" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Failing fast is the point.</text>
  <text x="620" y="534" font-size="20" fill="#475569" text-anchor="middle">While the circuit is open, no caller thread waits on a service already known to be down.</text>

  
  <line x1="326" y1="592" x2="366" y2="592" stroke="#DC2626" stroke-width="2"/>
  <text x="378" y="599" font-size="20" fill="#475569">failure path</text>
  <line x1="546" y1="592" x2="586" y2="592" stroke="#475569" stroke-width="2"/>
  <text x="598" y="599" font-size="20" fill="#475569">timer</text>
  <line x1="712" y1="592" x2="752" y2="592" stroke="#059669" stroke-width="2"/>
  <text x="764" y="599" font-size="20" fill="#475569">recovery path</text>
</svg>