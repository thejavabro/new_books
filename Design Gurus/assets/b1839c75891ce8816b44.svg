  <circle cx="680" cy="310" r="5" fill="#64748B"/>
  <circle cx="780" cy="355" r="5" fill="#2563EB"/>
  <circle cx="730" cy="355" r="5" fill="#2563EB"/>
  <circle cx="780" cy="535" r="5" fill="#4F46E5"/>
  <circle cx="680" cy="400" r="5" fill="#4F46E5"/>


</svg>