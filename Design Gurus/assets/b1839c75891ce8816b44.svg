<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An execution environment joined to six limits: an execution timeout, the maximum time a function can run, 15 minutes on AWS Lambda; a maximum request and response payload size; a function concurrency cap, set with reserved concurrency, on how many environments of the function run at once; a cap on configurable memory, with CPU scaling with memory on AWS Lambda; limited local disk space for temporary files; and networking, with no inbound connections other than through the event source">
  <defs>
    <filter id="m15g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m15g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m15g-k1"><rect x="510" y="310" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k2"><rect x="40" y="130" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k3"><rect x="40" y="310" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k4"><rect x="40" y="490" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k5"><rect x="780" y="130" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k6"><rect x="780" y="310" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="m15g-k7"><rect x="780" y="490" width="420" height="90" rx="12"/></clipPath>
    <marker id="m15g-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m15g-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m15g-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="m15g-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m15g-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="680" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Serverless function execution limits</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every execution environment runs inside fixed limits, and each function has a concurrency cap.</text>



  <g fill="none" stroke-width="2">
    <path d="M460,175 H548 Q560,175 560,187 V310" stroke="#2563EB"/>
    <path d="M460,355 H510" stroke="#D97706"/>
    <path d="M460,535 H548 Q560,535 560,523 V400" stroke="#7C3AED"/>
    <path d="M780,175 H692 Q680,175 680,187 V310" stroke="#64748B"/>
    <path d="M780,355 H730" stroke="#2563EB"/>
    <path d="M780,535 H692 Q680,535 680,523 V400" stroke="#4F46E5"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m15g-lift)">
    <rect x="510" y="310" width="220" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="510" y="310" width="9" height="90" fill="#7C3AED" clip-path="url(#m15g-k1)"/>
  </g>
  <circle cx="548" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,344.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="574" y="349.25" font-size="21.5" font-weight="600" fill="#111827">Execution</text>
  <text x="574" y="374.75" font-size="21.5" font-weight="600" fill="#111827">environment</text>
  <g filter="url(#m15g-soft)">
    <rect x="40" y="130" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#m15g-k2)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">Execution timeout</text>
  <text x="250" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">Maximum time a function can run</text>
  <text x="250" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">15 minutes on AWS Lambda</text>
  <g filter="url(#m15g-soft)">
    <rect x="40" y="310" width="420" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#D97706" clip-path="url(#m15g-k3)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="104" y="349.25" font-size="21.5" font-weight="600" fill="#111827">Request and response</text>
  <text x="104" y="374.75" font-size="21.5" font-weight="600" fill="#111827">payload size</text>
  <text x="250" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">Maximum size of the event and response</text>
  <g filter="url(#m15g-soft)">
    <rect x="40" y="490" width="420" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="490" width="6" height="90" fill="#7C3AED" clip-path="url(#m15g-k4)"/>
  </g>
  <circle cx="78" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,524.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="542" font-size="21.5" font-weight="600" fill="#111827">Function concurrency cap</text>
  <text x="250" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">How many environments of the function</text>
  <text x="250" y="636" font-size="18.5" text-anchor="middle" fill="#94A3B8">can run at once (reserved concurrency)</text>
  <g filter="url(#m15g-soft)">
    <rect x="780" y="130" width="420" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="780" y="130" width="6" height="90" fill="#64748B" clip-path="url(#m15g-k5)"/>
  </g>
  <circle cx="818" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,164.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="844" y="182" font-size="21.5" font-weight="600" fill="#111827">Memory and CPU</text>
  <text x="990" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">A cap on memory, which you configure</text>
  <text x="990" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">on AWS Lambda, CPU scales with memory</text>
  <g filter="url(#m15g-soft)">
    <rect x="780" y="310" width="420" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="780" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#m15g-k6)"/>
  </g>
  <circle cx="818" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="844" y="362" font-size="21.5" font-weight="600" fill="#111827">Temporary storage</text>
  <text x="990" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">Limited local disk space for temporary files</text>
  <g filter="url(#m15g-soft)">
    <rect x="780" y="490" width="420" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="780" y="490" width="6" height="90" fill="#4F46E5" clip-path="url(#m15g-k7)"/>
  </g>
  <circle cx="818" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,524.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="844" y="542" font-size="21.5" font-weight="600" fill="#111827">Networking</text>
  <text x="990" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">No inbound connections</text>
  <text x="990" y="636" font-size="18.5" text-anchor="middle" fill="#94A3B8">other than through the event source</text>

