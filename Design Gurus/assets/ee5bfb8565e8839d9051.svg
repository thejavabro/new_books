<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1060" viewBox="0 0 1240 1060" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six steps: 1 the client constructs an HTTP request with method, URL, headers and an optional body; 2 it resolves DNS, opens a TCP connection and, for HTTPS, performs a TLS handshake; 3 it sends the request over that connection; 4 the application server parses and authenticates the request, runs business logic, reads or writes the database and builds a response; 5 the server sends back a response with status code, headers and a body such as JSON or HTML; 6 the client checks the status code, processes the response and updates the UI">
  <defs>
    <filter id="m04d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m04d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m04d-k1"><rect x="464" y="285" width="312" height="56" rx="12"/></clipPath>
    <clipPath id="m04d-k2"><rect x="464" y="367" width="312" height="56" rx="12"/></clipPath>
    <clipPath id="m04d-k3"><rect x="464" y="449" width="312" height="56" rx="12"/></clipPath>
    <clipPath id="m04d-k4"><rect x="905" y="354" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="m04d-k5"><rect x="85" y="754" width="270" height="90" rx="12"/></clipPath>
    <marker id="m04d-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="m04d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m04d-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1060" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The HTTP request-response lifecycle</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Six steps carry a request from the client to the server and the response back to the client.</text>

  <rect x="40" y="120" width="360" height="419" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Construct request</text>
  <rect x="440" y="120" width="360" height="419" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="464" y="150" font-size="19.5" font-weight="600" fill="#B45309">2. Establish connection</text>
  <rect x="840" y="120" width="360" height="419" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="864" y="150" font-size="19.5" font-weight="600" fill="#047857">3. Send request</text>
  <rect x="40" y="589" width="360" height="435" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="619" font-size="19.5" font-weight="600" fill="#5B21B6">4. Process request</text>
  <rect x="440" y="589" width="360" height="435" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="464" y="619" font-size="19.5" font-weight="600" fill="#047857">5. Send response</text>
  <rect x="840" y="589" width="360" height="435" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="864" y="619" font-size="19.5" font-weight="600" fill="#1D4ED8">6. Update client</text>

  <g fill="none" stroke-width="2">
    <path d="M620,341 V367" stroke="#D97706" marker-end="url(#m04d-m-amber)"/>
    <path d="M620,423 V449" stroke="#D97706" marker-end="url(#m04d-m-amber)"/>
    <path d="M220,844 V882" stroke="#2563EB" marker-end="url(#m04d-m-blue)" marker-start="url(#m04d-s-blue)"/>
    <path d="M400,329.5 H440" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04d-m-blue)"/>
    <path d="M800,329.5 H840" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04d-m-blue)"/>
    <path d="M1020,539 V552 Q1020,564 1008,564 H232 Q220,564 220,576 V589" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04d-m-blue)"/>
    <path d="M400,806.5 H440" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04d-m-blue)"/>
    <path d="M800,806.5 H840" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04d-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m04d-soft)">
    <rect x="464" y="285" width="312" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="464" y="285" width="6" height="56" fill="#D97706" clip-path="url(#m04d-k1)"/>
  </g>
  <circle cx="502" cy="313" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,302.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="528" y="320" font-size="18.5" font-weight="600" fill="#111827">DNS</text>
  <g filter="url(#m04d-soft)">
    <rect x="464" y="367" width="312" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="464" y="367" width="6" height="56" fill="#D97706" clip-path="url(#m04d-k2)"/>
  </g>
  <circle cx="502" cy="395" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,384.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="528" y="402" font-size="18.5" font-weight="600" fill="#111827">TCP</text>
  <g filter="url(#m04d-soft)">
    <rect x="464" y="449" width="312" height="56" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="464" y="449" width="6" height="56" fill="#D97706" clip-path="url(#m04d-k3)"/>
  </g>
  <circle cx="502" cy="477" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,466.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="528" y="484" font-size="18.5" font-weight="600" fill="#111827">TLS</text>
  <g filter="url(#m04d-soft)">
    <rect x="905" y="354" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="905" y="354" width="6" height="90" fill="#059669" clip-path="url(#m04d-k4)"/>
  </g>
  <circle cx="943" cy="399" r="18" fill="#FFFFFF"/>
  <g transform="translate(932.56,388.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="969" y="406" font-size="21.5" font-weight="600" fill="#111827">HTTP request</text>
  <g filter="url(#m04d-soft)">
    <rect x="85" y="754" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="85" y="754" width="6" height="90" fill="#2563EB" clip-path="url(#m04d-k5)"/>
  </g>
  <circle cx="123" cy="799" r="18" fill="#FFFFFF"/>
  <g transform="translate(112.56,788.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="149" y="806" font-size="21.5" font-weight="600" fill="#111827">Application server</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M150,898 L150,982 A70,16 0 0 0 290,982 L290,898" fill="#DBEAFE"/>
    <ellipse cx="220" cy="898" rx="70" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="220" y="955" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="64" y="182" font-size="18.5" fill="#475569">Client creates an HTTP request with</text>
  <text x="64" y="208" font-size="18.5" fill="#475569">method, URL, headers and optional</text>
  <text x="64" y="234" font-size="18.5" fill="#475569">body.</text>
  <text x="464" y="182" font-size="18.5" fill="#475569">Client resolves DNS and establishes a</text>
  <text x="464" y="208" font-size="18.5" fill="#475569">TCP connection. For HTTPS, it also</text>
  <text x="464" y="234" font-size="18.5" fill="#475569">performs a TLS handshake.</text>
  <text x="864" y="182" font-size="18.5" fill="#475569">Client sends the HTTP request over</text>
  <text x="864" y="208" font-size="18.5" fill="#475569">the established connection.</text>
  <text x="64" y="651" font-size="18.5" fill="#475569">Server parses the request,</text>
  <text x="64" y="677" font-size="18.5" fill="#475569">authenticates it, runs business logic,</text>
  <text x="64" y="703" font-size="18.5" fill="#475569">accesses data, and generates a</text>
  <text x="64" y="729" font-size="18.5" fill="#475569">response.</text>
  <text x="464" y="651" font-size="18.5" fill="#475569">Server sends back an HTTP response</text>
  <text x="464" y="677" font-size="18.5" fill="#475569">with status code, headers and body</text>
  <text x="464" y="703" font-size="18.5" fill="#475569">(for example, JSON or HTML).</text>
  <text x="864" y="651" font-size="18.5" fill="#475569">Client receives the response,</text>
  <text x="864" y="677" font-size="18.5" fill="#475569">checks the status code, processes</text>
  <text x="864" y="703" font-size="18.5" fill="#475569">the data, and updates the UI.</text>
  <text x="582" y="320" font-size="18.5" fill="#475569">(resolve domain)</text>
  <text x="582" y="402" font-size="18.5" fill="#475569">(open connection)</text>
  <text x="582" y="484" font-size="18.5" fill="#475569">(for HTTPS)</text>

  <rect x="64" y="314" width="312" height="170" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <path d="M64,344 V324 Q64,314 74,314 H366 Q376,314 376,324 V344 Z" fill="#2563EB"/>
  <circle cx="82" cy="329" r="4" fill="#FFFFFF"/><circle cx="96" cy="329" r="4" fill="#FFFFFF"/><circle cx="110" cy="329" r="4" fill="#FFFFFF"/>
  <text x="80" y="372" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">GET /users/1 HTTP/1.1</text>
  <text x="80" y="416" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">Host: example.com</text>
  <text x="80" y="438" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">Authorization: Bearer ...</text>
  <text x="80" y="460" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">Accept: application/json</text>
  <rect x="464" y="739" width="312" height="258" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <path d="M464,769 V749 Q464,739 474,739 H766 Q776,739 776,749 V769 Z" fill="#059669"/>
  <circle cx="482" cy="754" r="4" fill="#FFFFFF"/><circle cx="496" cy="754" r="4" fill="#FFFFFF"/><circle cx="510" cy="754" r="4" fill="#FFFFFF"/>
  <text x="480" y="797" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">HTTP/1.1 200 OK</text>
  <text x="480" y="819" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">Content-Type: application/json</text>
  <text x="480" y="841" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">Content-Length: 66</text>
  <text x="480" y="885" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">{</text>
  <text x="497" y="907" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">"id": "1",</text>
  <text x="497" y="929" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">"name": "Alice",</text>
  <text x="497" y="951" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">"email": "alice@example.com"</text>
  <text x="480" y="973" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="16" fill="#1F2937">}</text>
  <circle cx="1020" cy="876" r="62" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <g transform="translate(984,840) scale(3)" fill="none" stroke="#2563EB" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>


</svg>