<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1328" viewBox="0 0 1240 1328" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated YouTube architecture: upload write path, asynchronous transcode, metadata read path and the streaming data plane">
  <defs>
    <filter id="yt-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="yt-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="yt-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="yt-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="yt-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="yt-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1328" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">YouTube: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Upload, transcode, watch and stream, with every cache and scaling strategy marked</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Upload (write path) · 720 TB of raw video per day</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#yt-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">init</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#yt-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">PUT</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#yt-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">event</text>
  <g filter="url(#yt-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">resumable</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Service</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">presigned URL</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 raw</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">source of truth</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="1089" y="262" font-size="20" fill="#92400E" text-anchor="middle">transcode jobs</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#92400E">2. Transcode (asynchronous) · the user never waits for it</text>
  <path d="M264,436 L349,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#yt-amber)"/>
  <text x="307" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pull</text>
  <path d="M577,436 L662,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#yt-amber)"/>
  <text x="620" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">write</text>
  <path d="M890,436 L975,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#yt-amber)"/>
  <text x="933" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">push</text>
  <g filter="url(#yt-soft)">
    <path d="M40,413 L40,459 A110,15 0 0 0 260,459 L260,413" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="413" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M666,413 L666,459 A110,15 0 0 0 886,459 L886,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="413" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="979" y="398" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Kafka</text>
  <text x="150" y="504" font-size="20" fill="#92400E" text-anchor="middle">shock absorber</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Transcode fleet</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">split and merge</text>
  <text x="776" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 chunks</text>
  <text x="776" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">HLS and DASH</text>
  <text x="1089" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">CDN</text>
  <text x="1089" y="458" font-size="20" fill="#64748B" text-anchor="middle">pushed to edge</text>

  <rect x="24" y="580" width="1192" height="406" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Metadata (read path) · 5 billion views a day</text>
  <path d="M364,678 L456,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#yt-blue)"/>
  <text x="410" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M784,678 L876,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#yt-blue)"/>
  <text x="830" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <path d="M620,716 L620,830" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#yt-emerald)"/>
  <text x="638" y="781" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">cache first</text>
  <path d="M760,716 L760,778 L1040,778 L1040,830" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#yt-blue)"/>
  <text x="900" y="768" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">counters</text>
  <g filter="url(#yt-soft)">
    <rect x="40" y="640" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="640" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,655 L880,701 A160,15 0 0 0 1200,701 L1200,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="655" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M460,849 L460,895 A160,15 0 0 0 780,895 L780,849" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="620" cy="849" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <path d="M880,849 L880,895 A160,15 0 0 0 1200,895 L1200,849" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="849" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="200" y="700" font-size="20" fill="#64748B" text-anchor="middle">player</text>
  <text x="620" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metadata Service</text>
  <text x="620" y="700" font-size="20" fill="#64748B" text-anchor="middle">title, likes, URL</text>
  <text x="1040" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SQL metadata</text>
  <text x="1040" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">sharded by video_id</text>
  <text x="620" y="883" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis cache</text>
  <text x="620" y="940" font-size="20" fill="#065F46" text-anchor="middle">video_meta:{id}</text>
  <text x="1040" y="883" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra</text>
  <text x="1040" y="940" font-size="20" fill="#5B21B6" text-anchor="middle">view and like counters</text>

  <rect x="24" y="1016" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="1048" font-size="20" font-weight="600" fill="#475569">4. Streaming (data plane) · 5.8 TB per second, the CDN serves 99%</text>
  <path d="M364,1114 L456,1114" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#yt-blue)"/>
  <text x="410" y="1102" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">chunks</text>
  <path d="M784,1114 L876,1114" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#yt-amber)"/>
  <text x="830" y="1102" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">on miss</text>
  <g filter="url(#yt-soft)">
    <rect x="40" y="1076" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="1076" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <path d="M880,1091 L880,1137 A160,15 0 0 0 1200,1137 L1200,1091" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="1091" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="1110" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Player</text>
  <text x="200" y="1136" font-size="20" fill="#64748B" text-anchor="middle">adaptive bitrate</text>
  <text x="620" y="1110" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">CDN edge</text>
  <text x="620" y="1136" font-size="20" fill="#64748B" text-anchor="middle">LRU, ISP peering</text>
  <text x="1040" y="1125" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 origin</text>
  <text x="1040" y="1182" font-size="20" fill="#5B21B6" text-anchor="middle">only on a cache miss</text>
  <line x1="44" y1="1288" x2="72" y2="1288" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1295" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1288" x2="344.576" y2="1288" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1295" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1279" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1295" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1279" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1295" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1279" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1295" font-size="20" fill="#475569">core service</text>
</svg>