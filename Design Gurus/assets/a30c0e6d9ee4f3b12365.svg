<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five components in order: the client (the application), the client stub (proxy on the client side), the broker (routes requests), the server skeleton (proxy on the server side) and the server (the actual service). The client makes a method call on the stub, which sends a serialized request to the broker; the broker forwards the serialized request to the skeleton, which makes a method call on the server. The return value travels back the same way, as a serialized response on both network hops">
  <defs>
    <filter id="m12b-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12b-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12b-k1"><rect x="340" y="125" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12b-k2"><rect x="340" y="275" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12b-k3"><rect x="340" y="425" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12b-k4"><rect x="340" y="575" width="560" height="80" rx="12"/></clipPath>
    <clipPath id="m12b-k5"><rect x="340" y="725" width="560" height="80" rx="12"/></clipPath>
    <marker id="m12b-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Broker architecture: the five core components</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A request passes through all five roles to reach the server, and the response returns the same way.</text>



  <g fill="none" stroke-width="2">
    <path d="M560,205 V275" stroke="#2563EB" marker-end="url(#m12b-m-blue)"/>
    <path d="M680,275 V205" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12b-m-blue)"/>
    <path d="M560,355 V425" stroke="#2563EB" marker-end="url(#m12b-m-blue)"/>
    <path d="M680,425 V355" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12b-m-blue)"/>
    <path d="M560,505 V575" stroke="#2563EB" marker-end="url(#m12b-m-blue)"/>
    <path d="M680,575 V505" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12b-m-blue)"/>
    <path d="M560,655 V725" stroke="#2563EB" marker-end="url(#m12b-m-blue)"/>
    <path d="M680,725 V655" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12b-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="544" y="246" fill="#1D4ED8" text-anchor="end">Method call</text>
    <text x="696" y="246" fill="#1D4ED8" text-anchor="start">Return value</text>
    <text x="544" y="396" fill="#1D4ED8" text-anchor="end">Serialized request</text>
    <text x="696" y="396" fill="#1D4ED8" text-anchor="start">Serialized response</text>
    <text x="544" y="546" fill="#1D4ED8" text-anchor="end">Serialized request</text>
    <text x="696" y="546" fill="#1D4ED8" text-anchor="start">Serialized response</text>
    <text x="544" y="696" fill="#1D4ED8" text-anchor="end">Method call</text>
    <text x="696" y="696" fill="#1D4ED8" text-anchor="start">Return value</text>
  </g>

  <g filter="url(#m12b-soft)">
    <rect x="340" y="125" width="560" height="80" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="340" y="125" width="6" height="80" fill="#64748B" clip-path="url(#m12b-k1)"/>
  </g>
  <circle cx="378" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,154.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="404" y="172" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m12b-soft)">
    <rect x="340" y="275" width="560" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="275" width="6" height="80" fill="#4F46E5" clip-path="url(#m12b-k2)"/>
  </g>
  <circle cx="378" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,304.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="404" y="322" font-size="21.5" font-weight="600" fill="#111827">Client stub</text>
  <g filter="url(#m12b-lift)">
    <rect x="340" y="425" width="560" height="80" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="340" y="425" width="9" height="80" fill="#7C3AED" clip-path="url(#m12b-k3)"/>
  </g>
  <circle cx="378" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,454.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="472" font-size="21.5" font-weight="600" fill="#111827">Broker</text>
  <g filter="url(#m12b-soft)">
    <rect x="340" y="575" width="560" height="80" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="340" y="575" width="6" height="80" fill="#4F46E5" clip-path="url(#m12b-k4)"/>
  </g>
  <circle cx="378" cy="615" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,604.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="404" y="622" font-size="21.5" font-weight="600" fill="#111827">Server skeleton</text>
  <g filter="url(#m12b-soft)">
    <rect x="340" y="725" width="560" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="340" y="725" width="6" height="80" fill="#2563EB" clip-path="url(#m12b-k5)"/>
  </g>
  <circle cx="378" cy="765" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,754.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="404" y="772" font-size="21.5" font-weight="600" fill="#111827">Server</text>
  <text x="876" y="172" font-size="18.5" text-anchor="end" fill="#6B7280">Application</text>
  <text x="876" y="322" font-size="18.5" text-anchor="end" fill="#6B7280">Proxy on client side</text>
  <text x="876" y="472" font-size="18.5" text-anchor="end" fill="#6B7280">Routes requests</text>
  <text x="876" y="622" font-size="18.5" text-anchor="end" fill="#6B7280">Proxy on server side</text>
  <text x="876" y="772" font-size="18.5" text-anchor="end" fill="#6B7280">Actual service</text>




</svg>