<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two timelines for one day at a restaurant. The leaky feature averages deliveries from the start of the day to midnight, including the 6:02 PM order being predicted, which joins the average when it is delivered at about 6:40 PM. The point-in-time feature averages only deliveries before 6:02 PM and leaves out later data.">
  <defs>
    <marker id="tvs2-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="tvs2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="tvs2-b1"><rect x="100" y="160" width="720" height="34" rx="8"/></clipPath>
    <clipPath id="tvs2-b2"><rect x="100" y="450" width="420" height="34" rx="8"/></clipPath>
    <clipPath id="tvs2-k3"><rect x="880" y="132" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="tvs2-k4"><rect x="880" y="422" width="290" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="752" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#B45309">Leaky: the restaurant&#39;s average delivery time today</text>
  <rect x="40" y="346" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="376" font-size="16.5" font-weight="600" fill="#B45309">Point-in-time: the average as it was at 6:02 PM</text>
  <g fill="none" stroke="#94A3B8" stroke-width="1.5"><path d="M70,206 H840"/><path d="M100,206 V213"/><path d="M520,206 V213"/><path d="M820,206 V213"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="100" y="233">start of day</text><text x="520" y="233">6:02 PM</text><text x="820" y="233">midnight</text></g>
  <g fill="none" stroke="#94A3B8" stroke-width="1.5"><path d="M70,496 H840"/><path d="M100,496 V503"/><path d="M520,496 V503"/><path d="M820,496 V503"/></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="100" y="523">start of day</text><text x="520" y="523">6:02 PM</text><text x="820" y="523">midnight</text></g>
  <rect x="100" y="160" width="720" height="34" rx="8" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.5"/>
  <rect x="100" y="160" width="6" height="34" fill="#E11D48" clip-path="url(#tvs2-b1)"/>
  <text x="118" y="183" font-size="15.5" font-weight="600" fill="#9F1239">window covers the whole day</text>
  <rect x="520" y="450" width="300" height="34" rx="8" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="536" y="473" font-size="15.5" fill="#6B7280">left out: data that arrived later</text>
  <rect x="100" y="450" width="420" height="34" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
  <rect x="100" y="450" width="6" height="34" fill="#059669" clip-path="url(#tvs2-b2)"/>
  <text x="118" y="473" font-size="15.5" font-weight="600" fill="#047857">window ends at prediction time</text>
  <text x="520" y="114" font-size="15.5" font-weight="600" text-anchor="middle" fill="#1D4ED8">prediction time</text>
  <path d="M520,122 V504" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="6 4"/>
  <g font-size="15.5" font-weight="600" text-anchor="middle" fill="#6B7280" paint-order="stroke" stroke="#FFFBEB" stroke-width="7"><text x="520" y="233">6:02 PM</text></g>
  <circle cx="560" cy="177" r="9" fill="#E11D48" stroke="#FFFFFF" stroke-width="2"/>
  <text x="550" y="150" font-size="15.5" fill="#6B7280">includes the order being predicted</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M820,177 H880" marker-end="url(#tvs2-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M820,467 H880" marker-end="url(#tvs2-mslate)"/></g>
  <g filter="url(#tvs2-soft)">
    <rect x="880" y="132" width="290" height="90" rx="12" fill="#FFE4E6" stroke="#FDA4AF" stroke-width="1.5"/>
    <rect x="880" y="132" width="6" height="90" fill="#E11D48" clip-path="url(#tvs2-k3)"/>
  </g>
  <circle cx="918" cy="177" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,166.56) scale(0.87)" fill="none" stroke="#E11D48" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="944" y="184" font-size="18.5" font-weight="600" fill="#111827">Scores very well offline</text>
  <text x="1025" y="247" font-size="15.5" text-anchor="middle" fill="#6B7280">then poor live quality</text>
  <g filter="url(#tvs2-soft)">
    <rect x="880" y="422" width="290" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="880" y="422" width="6" height="90" fill="#059669" clip-path="url(#tvs2-k4)"/>
  </g>
  <circle cx="918" cy="467" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,456.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="944" y="474" font-size="18.5" font-weight="600" fill="#111827">Same as serving</text>
  <text x="1025" y="537" font-size="15.5" text-anchor="middle" fill="#6B7280">only data that existed at prediction time</text>
  <rect x="40" y="636" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="681" text-anchor="middle" font-size="16" fill="#475569">Each example sees only data that existed at prediction time.</text>
</svg>