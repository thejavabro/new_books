<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The list with a dummy in front and both pointers at the start">
<defs>
<filter id="rn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Remove the node 2 from the end, in a single pass</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The trick is to open a gap of exactly the right size between two pointers</text>
<rect x="40" y="106" width="1160" height="468" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The dashed box is a dummy sitting in front of the list, so removing the head needs no special case</text>
<line x1="298" y1="322" x2="326" y2="322" stroke="#94A3B8" stroke-width="2.5"/>
<path d="M334,322 l -10,-6 l 0,12 Z" fill="#94A3B8"/>
<rect x="186" y="292" width="108" height="60" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
<text x="240" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">start</text>
<line x1="450" y1="322" x2="478" y2="322" stroke="#94A3B8" stroke-width="2.5"/>
<path d="M486,322 l -10,-6 l 0,12 Z" fill="#94A3B8"/>
<rect x="338" y="292" width="108" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="392" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">1</text>
<line x1="602" y1="322" x2="630" y2="322" stroke="#94A3B8" stroke-width="2.5"/>
<path d="M638,322 l -10,-6 l 0,12 Z" fill="#94A3B8"/>
<rect x="490" y="292" width="108" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="544" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">2</text>
<line x1="754" y1="322" x2="782" y2="322" stroke="#94A3B8" stroke-width="2.5"/>
<path d="M790,322 l -10,-6 l 0,12 Z" fill="#94A3B8"/>
<rect x="642" y="292" width="108" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="696" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">3</text>
<line x1="906" y1="322" x2="934" y2="322" stroke="#94A3B8" stroke-width="2.5"/>
<path d="M942,322 l -10,-6 l 0,12 Z" fill="#94A3B8"/>
<rect x="794" y="292" width="108" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="848" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">4</text>
<rect x="946" y="292" width="108" height="60" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="1000" y="330" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">5</text>
<text x="240" y="266" text-anchor="middle" font-size="17.5" font-weight="600" fill="#B45309">first</text>
<path d="M240,284 l -7,-12 l 14,0 Z" fill="#D97706"/>
<text x="240" y="392" text-anchor="middle" font-size="17.5" font-weight="600" fill="#5B21B6">second</text>
<path d="M240,360 l -7,12 l 14,0 Z" fill="#7C3AED"/>
<text x="620" y="508" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Both pointers start on the dummy, so nothing has to be counted first</text>
<rect x="40" y="586" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="626" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A gap of n nodes turns "n from the end" into "just ahead of me"</text>
<text x="620" y="658" text-anchor="middle" font-size="18.5" fill="#475569">When the leading pointer runs off the end, the trailing one is exactly where it is needed</text>
</svg>