<svg xmlns="http://www.w3.org/2000/svg" width="980" height="400" viewBox="0 0 980 400" style="background-color:#ffffff">
<defs>
<marker id="crc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="crd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="330" y="40" width="320" height="96" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="330" y="40" width="320" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="490" y="59" text-anchor="middle" font-weight="bold" font-style="italic">Handler</text>
<text x="342" y="88">- next : Handler</text>
<text x="342" y="108">+ setNext(Handler) : Handler</text>
<text x="342" y="128"># passOn(Request) : boolean</text>

<path d="M 654 60 L 720 60 L 720 100 L 654 100" stroke="#000000" fill="none" marker-start="url(#crd)"/>
<text x="730" y="76" font-size="11.5" fill="#414d60">holds exactly one</text>
<text x="730" y="92" font-size="11.5" fill="#414d60">next handler</text>

<rect x="20" y="228" width="215" height="56" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="20" y="228" width="215" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="127" y="246" text-anchor="middle" font-size="12">AuthHandler</text>
<text x="30" y="272" font-size="11">+ handle(Request)</text>

<rect x="252" y="228" width="215" height="56" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="252" y="228" width="215" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="359" y="246" text-anchor="middle" font-size="12">RateLimitHandler</text>
<text x="262" y="272" font-size="11">+ handle(Request)</text>

<rect x="484" y="228" width="215" height="56" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="484" y="228" width="215" height="26" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="591" y="246" text-anchor="middle" font-size="12">ValidationHandler</text>
<text x="494" y="272" font-size="11">+ handle(Request)</text>

<rect x="716" y="228" width="240" height="56" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="716" y="228" width="240" height="26" fill="#dcefe4" stroke="#2f7a55"/>
<text x="836" y="246" text-anchor="middle" font-size="12">CreateOrderHandler</text>
<text x="726" y="272" font-size="11" fill="#2f7a55">the tail: does the real work</text>

<path d="M 127 228 L 127 180 L 490 180 L 490 136" stroke="#000000" fill="none" marker-end="url(#crc)"/>
<path d="M 359 228 L 359 180" stroke="#000000" fill="none"/>
<path d="M 591 228 L 591 180" stroke="#000000" fill="none"/>
<path d="M 836 228 L 836 180 L 490 180" stroke="#000000" fill="none"/>

<rect x="20" y="318" width="936" height="66" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="42" y="344" font-size="12.5" fill="#414d60">No handler references another concrete handler. They all reference the abstract Handler, which is what makes the chain reorderable.</text>
<text x="42" y="368" font-size="12.5" fill="#414d60">The wiring lives in one place, usually at start-up, and is the only code that knows the order.</text>
</g>
</svg>