<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="HTTP/2 over TCP with TLS 1.3 needs two round trips. A new HTTP/3 connection needs one round trip, because QUIC combines both handshakes. A resumed HTTP/3 connection with 0-RTT needs zero round trips.">
  <defs>
    <filter id="ht4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ht4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ht4-k1"><rect x="40" y="140" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="ht4-k2"><rect x="440" y="140" width="360" height="90" rx="12"/></clipPath>
    <clipPath id="ht4-k3"><rect x="840" y="140" width="360" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Round trips before the first request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">How long a browser waits before it can send its first HTTP request over HTTPS.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ht4-soft)">
    <rect x="40" y="140" width="360" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ht4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">HTTP/2 over TCP</text>
  <text x="220" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">2 round trips</text>
  <text x="220" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">TCP handshake, then TLS 1.3</text>
  <g filter="url(#ht4-soft)">
    <rect x="440" y="140" width="360" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ht4-k2)"/>
  </g>
  <circle cx="478" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="504" y="192" font-size="21.5" font-weight="600" fill="#111827">HTTP/3, new</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">1 round trip</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">QUIC and TLS 1.3 together</text>
  <g filter="url(#ht4-lift)">
    <rect x="840" y="140" width="360" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="840" y="140" width="9" height="90" fill="#059669" clip-path="url(#ht4-k3)"/>
  </g>
  <circle cx="878" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="904" y="192" font-size="21.5" font-weight="600" fill="#111827">HTTP/3, resumed</text>
  <text x="1020" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">0 round trips</text>
  <text x="1020" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">0-RTT: send the request at once</text>

  <rect x="40" y="340" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="365" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="390" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">At 100 ms</text>
  <text x="323" y="390" font-size="18.5" fill="#475569">about 200 ms, 100 ms, and 0 ms of waiting before the first request</text>
  <rect x="64" y="415" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="440" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">0-RTT caution</text>
  <text x="323" y="440" font-size="18.5" fill="#475569">this data can be replayed, so servers accept it only for safe requests</text>
</svg>