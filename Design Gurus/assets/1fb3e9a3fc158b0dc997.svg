<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="question-title question-desc">
<title id="question-title">The question behind the question</title>
<desc id="question-desc">Which vector database to use is usually asked too early. The prior question is whether a separate one is needed at all.</desc>
<defs>
<marker id="question-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="question-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="question-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="question-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="752" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The question behind the question</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The prior question is whether a separate one is needed at all.</text>
<rect x="40" y="674" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="674" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="64" y="154" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Nearest-neighbor search is an index type, not a category of system</text><text x="64" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">In the same way that full-text search is a capability rather than a product category</text>
<text x="40" y="240" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A second datastore is a permanent operational cost</text>
<rect x="40" y="258" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Two things to operate</text>
<path d="M526 290H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 290H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="258" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="296" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">monitor, back up, upgrade and pay for</text>
<rect x="40" y="334" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="372" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Two consistency domains</text>
<path d="M526 366H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 366H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="334" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="372" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the embedding and its row are now in different systems</text>
<rect x="40" y="410" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No joins</text>
<path d="M526 442H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 442H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="410" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="435.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">filtering means duplicating data</text><text x="590" y="460.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or filtering in application code, badly</text>
<rect x="40" y="486" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A new failure mode</text>
<path d="M526 518H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 518H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#question-marker-slate)"/>
<rect x="570" y="486" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="511.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in the request path, with its own</text><text x="590" y="536.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">timeout, bulkhead and fallback</text>
<rect x="40" y="578" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="578" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="619" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">It needs to buy something the first one cannot do.</text>
<text x="66" y="708" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The payoff is real at scale, and the question is where that crossover sits.</text>
</svg>