<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Thread exhaustion from a slow dependency: Payments answers in 30 seconds, each Checkout request holds a thread for 30 seconds, 300 per second times 30 seconds equals 9,000 threads needed against a pool of about 200, Checkout stops answering anyone, its callers fill their own thread pools, and the cascading failure climbs the call graph.">
  <defs>
    <marker id="m04-l01-thread-exhaustion-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l01-thread-exhaustion-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m04-l01-thread-exhaustion-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m04-l01-thread-exhaustion-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  
  <rect x="60" y="60" width="1120" height="160" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="86" font-size="13.5" font-weight="600" fill="#1E3A8A">Step 1: Payments is slow, not dead, so Checkout waits</text>
  <text x="1160" y="86" text-anchor="end" font-size="12" fill="#64748B">a fast error would cost almost nothing, waiting is what hurts</text>

  <rect x="60" y="280" width="1120" height="160" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="306" font-size="13.5" font-weight="600" fill="#334155">Step 2: the arithmetic is unforgiving</text>

  <rect x="60" y="500" width="1120" height="160" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="526" font-size="13.5" font-weight="600" fill="#B91C1C">Step 3: exhaustion, then the cascade climbs</text>
  <text x="1160" y="526" text-anchor="end" font-size="12" fill="#64748B">this is how a slow widget takes down a checkout page</text>

  
  <g fill="none" stroke-width="2">
    <path d="M433,154 L563,154" stroke="#3B82F6" marker-end="url(#m04-l01-thread-exhaustion-bl)"/>
    <path d="M738,196 V235 Q738,245 728,245 H380 Q370,245 370,255 V332" stroke="#3B82F6" marker-end="url(#m04-l01-thread-exhaustion-bl)"/>
    <path d="M443,374 L593,374" stroke="#475569" marker-end="url(#m04-l01-thread-exhaustion-sl)"/>
    <path d="M748,416 V455 Q748,465 738,465 H380 Q370,465 370,475 V552" stroke="#DC2626" stroke-width="2.5" marker-end="url(#m04-l01-thread-exhaustion-rd)"/>
    <path d="M403,594 L485,594" stroke="#DC2626" marker-end="url(#m04-l01-thread-exhaustion-rd)"/>
    <path d="M785,594 L867,594" stroke="#DC2626" marker-end="url(#m04-l01-thread-exhaustion-rd)"/>
  </g>

  
  <g font-size="12" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="498" y="144" fill="#1E40AF">Checkout waits</text>
    <text x="505" y="233" fill="#1E40AF">multiply by the arrival rate</text>
    <text x="518" y="364" fill="#475569">versus what it has</text>
    <text x="500" y="453" fill="#B91C1C">the pool is gone within seconds</text>
  </g>

  
  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="103" y="112" width="330" height="84" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="268" y="150" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Payments answers in 30 seconds</text>
  <text x="268" y="171" text-anchor="middle" font-size="12" fill="#64748B">instead of the usual 200 ms</text>

  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="563" y="112" width="350" height="84" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="738" y="140" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Each Checkout request holds</text>
  <text x="738" y="160" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">a thread for 30 seconds</text>
  <text x="738" y="181" text-anchor="middle" font-size="12" fill="#64748B">one thread = one request at a time</text>

  
  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="103" y="332" width="340" height="84" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="273" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">300 per second times 30 seconds</text>
  <text x="273" y="388" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">equals 9,000 threads needed</text>

  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="593" y="332" width="310" height="84" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="748" y="370" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Checkout has about 200 threads</text>
  <text x="748" y="391" text-anchor="middle" font-size="12" fill="#64748B">the hard ceiling</text>

  
  <text x="940" y="348" font-size="12" font-weight="600" fill="#334155">The gap, drawn to scale</text>
  <text x="940" y="370" font-size="12" fill="#B91C1C">9,000 threads needed</text>
  <rect x="940" y="376" width="200" height="12" rx="2" fill="#DC2626"/>
  <text x="940" y="406" font-size="12" fill="#475569">about 200 threads available</text>
  <rect x="940" y="412" width="200" height="12" rx="2" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="940" y="412" width="4.4" height="12" rx="1" fill="#475569"/>

  
  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="103" y="552" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="253" y="590" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Checkout stops answering anyone</text>
  <text x="253" y="611" text-anchor="middle" font-size="12" fill="#64748B">a healthy service, now stuck</text>

  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="485" y="552" width="300" height="84" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="635" y="580" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Checkout's callers wait and</text>
  <text x="635" y="600" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">fill their own thread pools</text>
  <text x="635" y="621" text-anchor="middle" font-size="12" fill="#64748B">the same math, one level up</text>

  <g filter="url(#m04-l01-thread-exhaustion-soft)">
    <rect x="867" y="552" width="270" height="84" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="1002" y="588" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Cascading failure climbs</text>
  <text x="1002" y="608" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">the call graph</text>

  
  <g stroke-width="3" fill="none">
    <line x1="60" y1="700" x2="88" y2="700" stroke="#3B82F6"/>
    <line x1="400" y1="700" x2="428" y2="700" stroke="#475569"/>
    <line x1="770" y1="700" x2="798" y2="700" stroke="#DC2626"/>
  </g>
  <text x="96" y="704" font-size="12.5" fill="#475569">Synchronous wait: the caller holds a thread</text>
  <text x="436" y="704" font-size="12.5" fill="#475569">The arithmetic: threads needed versus available</text>
  <text x="806" y="704" font-size="12.5" fill="#475569">Failure: pool exhausted, cascade climbs upward</text>
</svg>