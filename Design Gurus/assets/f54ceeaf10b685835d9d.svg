<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The primary crashes. Writes pause, because only the primary accepts writes. A replica is promoted to become the new primary. Writes resume, often after several seconds to a minute of automatic failover.">
  <defs>
    <filter id="rpp3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rpp3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rpp3-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="rpp3-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="rpp3-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="rpp3-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="rpp3-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Failover when the primary crashes</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Reads can continue from replicas, but writes must wait for a new primary.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#rpp3-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#rpp3-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#rpp3-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#rpp3-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#rpp3-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Primary crashes</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">the only node</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">for writes</text>
  <g filter="url(#rpp3-lift)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="343" y="140" width="9" height="90" fill="#D97706" clip-path="url(#rpp3-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Writes pause</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">reads can still</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">use replicas</text>
  <g filter="url(#rpp3-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#rpp3-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Replica promoted</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">it becomes the</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">new primary</text>
  <g filter="url(#rpp3-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#rpp3-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Writes resume</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">often after seconds</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">to a minute</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Failover</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">promoting a replica to replace a failed primary</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">The gap</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the time without writes; ask whether failover is automatic</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Async risk</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">writes the promoted replica never received are lost</text>
</svg>