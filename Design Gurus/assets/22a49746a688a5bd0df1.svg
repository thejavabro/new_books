<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Why an offset can repeat an item</title><desc id="desc">The first page returns A, B, C. After X is added first, offset 3 skips X, A, B and returns C, D, E. C is repeated.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><rect width="1200" height="810" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><g font-family="Arial, sans-serif"><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700" text-anchor="start"><tspan x="50" dy="0">Why an offset can repeat an item</tspan></text><text x="50" y="108" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="50" dy="0">Each page contains three comments. New comments appear first.</tspan></text><rect x="50" y="160" width="1100" height="135" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="202" font-size="25" fill="#2563eb" font-weight="700" text-anchor="start"><tspan x="72" dy="0">First page: A, B, C</tspan></text><text x="72" y="250" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Original order: A, B, C, D, E, F</tspan></text><path d="M600 302 V330" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="340" width="1100" height="135" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="382" font-size="25" fill="#7c3aed" font-weight="700" text-anchor="start"><tspan x="72" dy="0">A new comment X is added</tspan></text><text x="72" y="430" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">New order: X, A, B, C, D, E, F</tspan></text><path d="M600 482 V510" fill="none" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="520" width="1100" height="135" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="562" font-size="25" fill="#c2410c" font-weight="700" text-anchor="start"><tspan x="72" dy="0">Next request: skip three comments</tspan></text><text x="72" y="610" font-size="23" fill="#334155" font-weight="400" text-anchor="start"><tspan x="72" dy="0">Skip X, A, B. Return C, D, E. Comment C appears again.</tspan></text><rect x="50" y="690" width="1100" height="80" rx="18" fill="#0f172a" stroke="none" stroke-width="2"/><text x="600" y="736" font-size="23" fill="white" font-weight="400" text-anchor="middle"><tspan x="600" dy="0">Keyset pagination after C can return D, E, F if the ordering values stay unchanged.</tspan></text></g></svg>