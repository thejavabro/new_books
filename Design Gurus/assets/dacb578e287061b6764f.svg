<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="366" viewBox="0 0 1240 366" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The three-stage funnel every design in this module uses">
  <defs>
    <marker id="m3l0a-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="m3l0a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m3l0a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m3l0a-k1"><rect x="50" y="64" width="193" height="90" rx="12"/></clipPath>
    <clipPath id="m3l0a-k2"><rect x="499" y="64" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m3l0a-k3"><rect x="925" y="64" width="265" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="366" fill="#FFFFFF"/>

  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M243,109 L499,109" marker-end="url(#m3l0a-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M669,109 L925,109" marker-end="url(#m3l0a-mslate)"/></g>
  <g filter="url(#m3l0a-soft)">
    <rect x="50" y="64" width="193" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="50" y="64" width="6" height="90" fill="#4F46E5" clip-path="url(#m3l0a-k1)"/>
  </g>
  <circle cx="88" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,98.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="114" y="116" font-size="18.5" font-weight="600" fill="#111827">1. Retrieve</text>
  <text x="146.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">millions down to a few hundred</text>
  <text x="146.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">judged on recall</text>
  <g filter="url(#m3l0a-soft)">
    <rect x="499" y="64" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="499" y="64" width="6" height="90" fill="#2563EB" clip-path="url(#m3l0a-k2)"/>
  </g>
  <circle cx="537" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(526.56,98.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="563" y="116" font-size="18.5" font-weight="600" fill="#111827">2. Rank</text>
  <text x="584" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">a few hundred, scored and sorted</text>
  <text x="584" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">judged on precision at the top</text>
  <g filter="url(#m3l0a-soft)">
    <rect x="925" y="64" width="265" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
