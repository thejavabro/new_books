  </g>
  <circle cx="963" cy="109" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,98.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="989" y="116" font-size="18.5" font-weight="600" fill="#111827">3. Apply the rules</text>
  <text x="1057.5" y="179" font-size="15.5" text-anchor="middle" fill="#6B7280">freshness, variety, policy</text>
  <text x="1057.5" y="202" font-size="15.5" text-anchor="middle" fill="#94A3B8">rules or a re-ranker</text>
  <rect x="40" y="250" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="295" text-anchor="middle" font-size="16" fill="#475569">This structure supports retrieval and ranking. Fraud and moderation use different decision paths.</text>
</svg>