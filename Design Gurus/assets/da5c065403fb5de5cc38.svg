<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="788" viewBox="0 0 1240 788" role="img" aria-label="What happens when someone follows a short link. The request hits the cache, falls through to the database on a miss, and then runs three checks: whether the key exists, whether it has expired, and whether the caller may see it. The answers are 404 Not Found, 410 Gone, 403 Forbidden for a signed-in user without permission or 401 Unauthorized for an anonymous one, and otherwise 302 Found with the original URL in the Location header.">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.09"/></filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#4F46E5" flood-opacity="0.20"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94A3B8"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="arv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/></marker>
    <marker id="ara" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DB2777"/></marker>
    <marker id="arc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0891B2"/></marker>
  </defs>
  <rect width="1240" height="788" fill="#FFFFFF"/>
  <g transform="translate(0,-42)">
  <rect x="190" y="82" width="420" height="96" rx="13" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="400" cy="112" r="18" fill="#EFF6FF"/>
  <g transform="translate(389.0 101.0) scale(0.9167)" fill="none" stroke="#1D4ED8" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#1D4ED8"><circle cx="12" cy="12" r="8.5"/><ellipse cx="12" cy="12" rx="4.2" ry="8.5"/><path d="M3.5 12h17"/></g>
  <text x="400" y="152" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">GET  tinyurl.com/k7Fq2aX</text>
  <rect x="165" y="224" width="470" height="76" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M165 238 a14 14 0 0 1 14 -14 h0 v76 h0 a14 14 0 0 1 -14 -14 z" fill="#7C3AED"/>
  <circle cx="209" cy="262" r="21" fill="#F5F3FF"/>
  <g transform="translate(196.5 249.5) scale(1.0417)" fill="none" stroke="#6D28D9" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#6D28D9"><path d="M13.5 2.5L5.5 13.5h5l-1 8 8-11h-5z" fill="currentColor" stroke="none"/></g>
  <text x="239" y="269" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Look in the cache, then the database</text>
  <line x1="400" y1="180" x2="400" y2="222" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <text x="675" y="268" font-size="18" fill="#475569" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">a hit answers ~90% of reads</text>
  <rect x="165" y="362" width="470" height="76" rx="13" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="203" cy="400" r="19" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="203" y="408" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">?</text>
  <text x="235" y="407" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Does the key exist?</text>
  <line x1="400" y1="324" x2="400" y2="356" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <line x1="641" y1="400" x2="754" y2="400" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="697.5" y="386" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">no</text>
  <rect x="760" y="360" width="400" height="80" rx="13" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="782" y="408" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">404</text>
  <text x="1138" y="396" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Not Found</text>
  <text x="1138" y="422" font-size="17" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">no such short link</text>
  <rect x="165" y="492" width="470" height="76" rx="13" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="203" cy="530" r="19" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="203" y="538" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">?</text>
  <text x="235" y="537" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Has it expired?</text>
  <line x1="400" y1="454" x2="400" y2="486" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <text x="418" y="476" font-size="18" font-weight="600" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">yes</text>
  <line x1="641" y1="530" x2="754" y2="530" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="697.5" y="516" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">yes</text>
  <rect x="760" y="490" width="400" height="80" rx="13" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="782" y="538" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">410</text>
  <text x="1138" y="526" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Gone</text>
  <text x="1138" y="552" font-size="17" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">it existed, and no longer does</text>
  <rect x="165" y="622" width="470" height="76" rx="13" fill="#FFFFFF" stroke="#D97706" stroke-width="1.8" filter="url(#sh)"/>
  <circle cx="203" cy="660" r="19" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/>
  <text x="203" y="668" font-size="22" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">?</text>
  <text x="235" y="654.5" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Is it private, and is the</text>
  <text x="235" y="679.5" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">caller not allowed?</text>
  <line x1="400" y1="584" x2="400" y2="616" stroke="#2563EB" stroke-width="2.2" marker-end="url(#arb)"/>
  <text x="418" y="606" font-size="18" font-weight="600" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">no</text>
  <line x1="641" y1="660" x2="754" y2="660" stroke="#DC2626" stroke-width="2.2" marker-end="url(#arr)"/>
  <text x="697.5" y="646" font-size="18" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">yes</text>
  <rect x="760" y="620" width="400" height="80" rx="13" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.8"/>
  <text x="782" y="668" font-size="26" font-weight="700" fill="#B91C1C" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">403</text>
  <text x="1138" y="656" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Forbidden</text>
  <text x="1138" y="682" font-size="17" fill="#475569" text-anchor="end" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">401 if nobody is signed in</text>
  <line x1="400" y1="704" x2="400" y2="738" stroke="#059669" stroke-width="2.2" marker-end="url(#arg)"/>
  <text x="420" y="726" font-size="18" font-weight="600" fill="#047857" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">otherwise</text>
  <rect x="165" y="740" width="470" height="76" rx="14" fill="#FFFFFF" stroke="#059669" stroke-width="1.8" filter="url(#sh)"/>
  <path d="M165 754 a14 14 0 0 1 14 -14 h0 v76 h0 a14 14 0 0 1 -14 -14 z" fill="#059669"/>
  <circle cx="209" cy="778" r="21" fill="#ECFDF5"/>
  <g transform="translate(196.5 765.5) scale(1.0417)" fill="none" stroke="#047857" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" color="#047857"><path d="M9.5 14.5l5-5"/><path d="M11 6.5l1.6-1.6a4.2 4.2 0 0 1 6 6L17 12.5M13 17.5l-1.6 1.6a4.2 4.2 0 0 1-6-6L7 11.5"/></g>
  <text x="239" y="785" font-size="20" font-weight="600" fill="#0F172A" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">302 Found + Location header</text>
  <rect x="760" y="738" width="400" height="80" rx="13" fill="#ECFDF5" stroke="#059669" stroke-width="1.8"/>
  <text x="960" y="768" font-size="20" font-weight="600" fill="#047857" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">and emit a click event</text>
  <text x="960" y="794" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">without waiting for it</text>
  <line x1="641" y1="778" x2="754" y2="778" stroke="#059669" stroke-width="2.2" marker-end="url(#arg)"/>
  </g>
</svg>