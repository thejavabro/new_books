<text x="912" y="400" font-size="15.5" text-anchor="middle" font-weight="600" fill="#B45309">the same fact, stored twice</text>
<text x="912" y="428" font-size="15.5" text-anchor="middle" fill="#6B7280">three loans would store it three times</text>

<rect x="40" y="514" width="1160" height="216" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="540" width="240" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="184" y="562" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">normalized read</text>
<text x="328" y="562" font-size="15.5" fill="#475569">needs a join to Member before it can show the name</text>
<rect x="64" y="584" width="240" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="184" y="606" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">normalized write</text>
<text x="328" y="606" font-size="15.5" fill="#475569">a name change updates exactly one row, and cannot disagree</text>
<rect x="64" y="628" width="240" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="184" y="650" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">denormalized read</text>
<text x="328" y="650" font-size="15.5" fill="#475569">no join at all, because the name is already in the row</text>
<rect x="64" y="672" width="240" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
<text x="184" y="694" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">denormalized write</text>
<text x="328" y="694" font-size="15.5" fill="#475569">a name change must update every loan row for that member</text>
</svg>