<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="958" viewBox="0 0 1240 958" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six named failures of creating a chat message, each with its status, stable code, and the caller action, covering invalid text, a conversation that is not visible, a closed conversation, a reused idempotency key, an in-progress first attempt, and a rate limit.">
  <defs>
    <filter id="p2m-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2m-k1"><rect x="76" y="174" width="940" height="48" rx="10"/></clipPath>
    <clipPath id="p2m-k2"><rect x="76" y="264" width="940" height="48" rx="10"/></clipPath>
    <clipPath id="p2m-k3"><rect x="76" y="354" width="940" height="48" rx="10"/></clipPath>
    <clipPath id="p2m-k4"><rect x="76" y="444" width="940" height="48" rx="10"/></clipPath>
    <clipPath id="p2m-k5"><rect x="76" y="610" width="940" height="48" rx="10"/></clipPath>
    <clipPath id="p2m-k6"><rect x="76" y="700" width="940" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="958" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six named failures for one message create</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the HTTP status sits at the right of each row</text>

  
  <rect x="40" y="126" width="1160" height="412" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">The request cannot succeed as sent</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four failures</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="174" width="940" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p2m-k1)"/>
  </g>
  <circle cx="110" cy="198" r="4.5" fill="#DB2777"/>
  <text x="134" y="205" font-size="18.5" font-weight="600" fill="#111827">invalid_text</text>
  <rect x="1088" y="180" width="72" height="36" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1124" y="204" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="134" y="246" font-size="15.5" fill="#6B7280">Fix the body, and use a new key because the intended operation changed</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="264" width="940" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="264" width="6" height="48" fill="#DB2777" clip-path="url(#p2m-k2)"/>
  </g>
  <circle cx="110" cy="288" r="4.5" fill="#DB2777"/>
  <text x="134" y="295" font-size="18.5" font-weight="600" fill="#111827">conversation_not_found</text>
  <rect x="1088" y="270" width="72" height="36" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1124" y="294" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">404</text>
  <text x="134" y="336" font-size="15.5" fill="#6B7280">Correct the id, or stop; this also covers a conversation hidden from you</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="354" width="940" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="354" width="6" height="48" fill="#DB2777" clip-path="url(#p2m-k3)"/>
  </g>
  <circle cx="110" cy="378" r="4.5" fill="#DB2777"/>
  <text x="134" y="385" font-size="18.5" font-weight="600" fill="#111827">conversation_closed</text>
  <rect x="1088" y="360" width="72" height="36" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1124" y="384" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">409</text>
  <text x="134" y="426" font-size="15.5" fill="#6B7280">The input is valid, but current product state refuses new messages</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="444" width="940" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="444" width="6" height="48" fill="#DB2777" clip-path="url(#p2m-k4)"/>
  </g>
  <circle cx="110" cy="468" r="4.5" fill="#DB2777"/>
  <text x="134" y="475" font-size="18.5" font-weight="600" fill="#111827">idempotency_key_reused</text>
  <rect x="1088" y="450" width="72" height="36" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="1124" y="474" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">400</text>
  <text x="134" y="516" font-size="15.5" fill="#6B7280">Correct the key usage; returning the first message would hide a caller bug</text>

  
  <rect x="40" y="562" width="1160" height="232" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="592" font-size="16.5" font-weight="600" fill="#B45309">The same request can succeed later</text>
  <text x="1176" y="592" text-anchor="end" font-size="15.5" fill="#6B7280">two failures</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="610" width="940" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="610" width="6" height="48" fill="#D97706" clip-path="url(#p2m-k5)"/>
  </g>
  <circle cx="110" cy="634" r="4.5" fill="#D97706"/>
  <text x="134" y="641" font-size="18.5" font-weight="600" fill="#111827">idempotency_request_in_progress</text>
  <rect x="1088" y="616" width="72" height="36" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="1124" y="640" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">409</text>
  <text x="134" y="682" font-size="15.5" fill="#6B7280">Wait, then repeat the identical request with the same key</text>

  <g filter="url(#p2m-soft)">
    <rect x="76" y="700" width="940" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="700" width="6" height="48" fill="#D97706" clip-path="url(#p2m-k6)"/>
  </g>
  <circle cx="110" cy="724" r="4.5" fill="#D97706"/>
  <text x="134" y="731" font-size="18.5" font-weight="600" fill="#111827">rate_limit_exceeded</text>
  <rect x="1088" y="706" width="72" height="36" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="1124" y="730" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">429</text>
  <text x="134" y="772" font-size="15.5" fill="#6B7280">Wait for Retry-After, and add a random extra delay</text>

  
  <rect x="40" y="818" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="860" text-anchor="middle" font-size="16" fill="#475569">Three of the six concern repeats and pace: a reused key, a first attempt still running, and a rate limit.</text>
  <text x="620" y="888" text-anchor="middle" font-size="16" fill="#475569">Only the last two succeed on a repeat of the identical request. The rest need a changed request, or a stop.</text>
</svg>