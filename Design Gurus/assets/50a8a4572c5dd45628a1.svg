<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Functional requirements for a unique ID generator: every ID is globally unique and comes in an opaque or a time ordered format; callers get a simple API that can return a batch, and all generation happens server side">
  <defs>
    <filter id="uidf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidf-k1"><rect x="80" y="175" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="uidf-k2"><rect x="640" y="175" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="uidf-k3"><rect x="80" y="430" width="520" height="90" rx="12"/></clipPath>
    <clipPath id="uidf-k4"><rect x="640" y="430" width="520" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Unique ID generator: functional requirements</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">What the service has to do. Split into what an ID guarantees, and what a caller gets.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What every ID guarantees</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What every caller gets</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#uidf-lift)">
    <rect x="80" y="175" width="520" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="80" y="175" width="9" height="90" fill="#4F46E5" clip-path="url(#uidf-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">Globally unique</text>
  <text x="340" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">no two nodes, regions or moments ever produce the same ID</text>
  <g filter="url(#uidf-soft)">
    <rect x="640" y="175" width="520" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="640" y="175" width="6" height="90" fill="#D97706" clip-path="url(#uidf-k2)"/>
  </g>
  <circle cx="678" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="704" y="227" font-size="21.5" font-weight="600" fill="#111827">Two formats</text>
  <text x="900" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">opaque and random, or time ordered and sortable</text>
  <g filter="url(#uidf-soft)">
    <rect x="80" y="430" width="520" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#uidf-k3)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">One call, or a batch</text>
  <text x="340" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">a REST or gRPC endpoint that returns one ID or many</text>
  <g filter="url(#uidf-soft)">
    <rect x="640" y="430" width="520" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="640" y="430" width="6" height="90" fill="#64748B" clip-path="url(#uidf-k4)"/>
  </g>
  <circle cx="678" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,464.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="704" y="482" font-size="21.5" font-weight="600" fill="#111827">Server side only</text>
  <text x="900" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">clients never mint their own, which keeps the design simple</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Opaque</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">random, so it reveals nothing about when or where it was made, and it does not sort</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Time ordered</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">newer IDs compare larger than older ones, which is what makes them useful as keys</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Out of scope</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">offline generation on the client, which would need collision handling the service avoids</text>
</svg>