<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six normal forms in order, with the rule each one adds">
<rect x="0" y="0" width="1240" height="712" fill="#FFFFFF"/><defs>
<filter id="c7b-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<marker id="c7b-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<clipPath id="c7b-k0"><rect x="90" y="90" width="300" height="90" rx="12"/></clipPath>
<clipPath id="c7b-k1"><rect x="470" y="90" width="300" height="90" rx="12"/></clipPath>
<clipPath id="c7b-k2"><rect x="850" y="90" width="300" height="90" rx="12"/></clipPath>
<clipPath id="c7b-k3"><rect x="90" y="340" width="300" height="90" rx="12"/></clipPath>
<clipPath id="c7b-k4"><rect x="470" y="340" width="300" height="90" rx="12"/></clipPath>
<clipPath id="c7b-k5"><rect x="850" y="340" width="300" height="90" rx="12"/></clipPath>
</defs>
<path d="M400,135 H458" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#c7b-m-slate)"/>
<path d="M780,135 H838" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#c7b-m-slate)"/>
<path d="M400,385 H458" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#c7b-m-slate)"/>
<path d="M780,385 H838" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#c7b-m-slate)"/>
<path d="M1000,242 V250 Q1000,262 988,262 H252 Q240,262 240,274 V330" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#c7b-m-slate)"/>
<g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="620" y="252" fill="#475569">stricter rules from here on</text></g>
<g filter="url(#c7b-soft)"><rect x="90" y="90" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/><rect x="90" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#c7b-k0)"/></g>
<circle cx="128" cy="135" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="154" y="142" font-size="18.5" font-weight="600" fill="#111827">1NF</text>
<text x="240" y="206" font-size="15.5" text-anchor="middle" fill="#6B7280">one value in every cell</text>
<text x="240" y="229" font-size="15.5" text-anchor="middle" fill="#94A3B8">no repeating groups of columns</text>
<g filter="url(#c7b-soft)"><rect x="470" y="90" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/><rect x="470" y="90" width="6" height="90" fill="#2563EB" clip-path="url(#c7b-k1)"/></g>
<circle cx="508" cy="135" r="18" fill="#FFFFFF"/>
<g transform="translate(497.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="534" y="142" font-size="18.5" font-weight="600" fill="#111827">2NF</text>
<text x="620" y="206" font-size="15.5" text-anchor="middle" fill="#6B7280">no partial dependency</text>
<text x="620" y="229" font-size="15.5" text-anchor="middle" fill="#94A3B8">only possible on a composite key</text>
<g filter="url(#c7b-soft)"><rect x="850" y="90" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/><rect x="850" y="90" width="9" height="90" fill="#2563EB" clip-path="url(#c7b-k2)"/></g>
<circle cx="888" cy="135" r="18" fill="#FFFFFF"/>
<g transform="translate(877.56,124.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="914" y="142" font-size="18.5" font-weight="600" fill="#111827">3NF</text>
<text x="1000" y="206" font-size="15.5" text-anchor="middle" fill="#6B7280">no transitive dependency</text>
<text x="1000" y="229" font-size="15.5" text-anchor="middle" fill="#94A3B8">the usual stopping point</text>
<g filter="url(#c7b-soft)"><rect x="90" y="340" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/><rect x="90" y="340" width="6" height="90" fill="#7C3AED" clip-path="url(#c7b-k3)"/></g>
<circle cx="128" cy="385" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,374.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="154" y="392" font-size="18.5" font-weight="600" fill="#111827">BCNF</text>
<text x="240" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">every determinant is a superkey</text>
<text x="240" y="479" font-size="15.5" text-anchor="middle" fill="#94A3B8">can cost a checkable rule</text>
<g filter="url(#c7b-soft)"><rect x="470" y="340" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/><rect x="470" y="340" width="6" height="90" fill="#64748B" clip-path="url(#c7b-k4)"/></g>
<circle cx="508" cy="385" r="18" fill="#FFFFFF"/>
<g transform="translate(497.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="534" y="392" font-size="18.5" font-weight="600" fill="#111827">4NF</text>
<text x="620" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">no multivalued dependency</text>
<text x="620" y="479" font-size="15.5" text-anchor="middle" fill="#94A3B8">two independent lists in one table</text>
<g filter="url(#c7b-soft)"><rect x="850" y="340" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/><rect x="850" y="340" width="6" height="90" fill="#64748B" clip-path="url(#c7b-k5)"/></g>
<circle cx="888" cy="385" r="18" fill="#FFFFFF"/>
<g transform="translate(877.56,374.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
<text x="914" y="392" font-size="18.5" font-weight="600" fill="#111827">5NF</text>
<text x="1000" y="456" font-size="15.5" text-anchor="middle" fill="#6B7280">no join dependency</text>
<text x="1000" y="479" font-size="15.5" text-anchor="middle" fill="#94A3B8">rare, needs a cyclic rule</text>
<rect x="40" y="500" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="520" width="260" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="194" y="542" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">do these every time</text>
<text x="348" y="542" font-size="15.5" fill="#475569">1NF, 2NF and 3NF are the default target for every table you design</text>
<rect x="64" y="564" width="260" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
<text x="194" y="586" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">usually already true</text>
<text x="348" y="586" font-size="15.5" fill="#475569">most 3NF tables are in BCNF, so check it only when two candidate keys overlap</text>
<rect x="64" y="608" width="260" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="194" y="630" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">rarely needed</text>
<text x="348" y="630" font-size="15.5" fill="#475569">4NF and 5NF matter only for a small set of multivalued and cyclic rules</text>
</svg>