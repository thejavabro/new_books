<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="658" viewBox="0 0 1240 658" role="img" aria-label="Analytics must never sit on the redirect path. The redirect service returns the 302 immediately and fires an event to a queue; consumers batch those events into an analytics store that the analytics API reads. Updating a counter column on the URL row instead would add a database write to every redirect and turn a viral link into a single contended row.">
