<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1002" viewBox="0 0 1240 1002" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A rename inside your own code is a local refactor: tools find the call sites, you update them and deploy once. The same rename in a published API field is a compatibility migration: you must return both fields, document the old one as deprecated, contact consumers, measure remaining use, set a deadline, and often support the old field longer than planned, because partner integrations, unmaintained scripts and old mobile applications cannot be reached or forced to upgrade.">
  <defs>
    <marker id="yapirenamec-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="yapirenamec-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yapirenamec-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yapirenamec-k1"><rect x="84" y="190" width="472" height="48" rx="10"/></clipPath>
