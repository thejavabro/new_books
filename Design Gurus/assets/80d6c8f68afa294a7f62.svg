    <clipPath id="yapirenamec-k5"><rect x="84" y="606" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k6"><rect x="84" y="706" width="472" height="48" rx="10"/></clipPath>

    <clipPath id="yapirenamec-k7"><rect x="684" y="190" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k8"><rect x="684" y="288" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k9"><rect x="684" y="352" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k10"><rect x="684" y="416" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k11"><rect x="684" y="480" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k12"><rect x="684" y="544" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k13"><rect x="684" y="608" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="yapirenamec-k14"><rect x="684" y="706" width="472" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1002" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">The same rename, two very different costs</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the same rename in two places</text>

  
  <rect x="44" y="126" width="552" height="706" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="84" y="162" font-size="16.5" font-weight="600" fill="#047857">Internal function</text>
  <text x="556" y="162" text-anchor="end" font-size="15.5" fill="#6B7280">four steps</text>

  
  <g fill="none" stroke-width="2">
    <path d="M320,344 V394" stroke="#059669" marker-end="url(#yapirenamec-em)"/>
    <path d="M320,450 V500" stroke="#059669" marker-end="url(#yapirenamec-em)"/>
    <path d="M320,556 V606" stroke="#059669" marker-end="url(#yapirenamec-em)"/>
  </g>

  
