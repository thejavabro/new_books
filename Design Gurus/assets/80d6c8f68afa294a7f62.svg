    <rect x="84" y="190" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="190" width="6" height="48" fill="#64748B" clip-path="url(#yapirenamec-k1)"/>
  </g>
  <circle cx="118" cy="214" r="15" fill="#FFFFFF"/>
