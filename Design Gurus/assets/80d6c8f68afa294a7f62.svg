  </g>
  <text x="142" y="221" font-size="18.5" font-weight="600" fill="#111827">loadCustomerProfile()</text>
  <text x="320" y="263" font-size="15.5" text-anchor="middle" fill="#6B7280">becomes getCustomerProfile()</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="84" y="288" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="288" width="6" height="48" fill="#059669" clip-path="url(#yapirenamec-k2)"/>
  </g>
  <circle cx="118" cy="312" r="4.5" fill="#059669"/>
  <text x="142" y="319" font-size="18.5" font-weight="600" fill="#111827">Tools find the call sites</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="84" y="394" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="394" width="6" height="48" fill="#059669" clip-path="url(#yapirenamec-k3)"/>
  </g>
  <circle cx="118" cy="418" r="4.5" fill="#059669"/>
  <text x="142" y="425" font-size="18.5" font-weight="600" fill="#111827">Update every caller</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="84" y="500" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="500" width="6" height="48" fill="#059669" clip-path="url(#yapirenamec-k4)"/>
  </g>
  <circle cx="118" cy="524" r="4.5" fill="#059669"/>
  <text x="142" y="531" font-size="18.5" font-weight="600" fill="#111827">Run the tests</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="84" y="606" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="606" width="6" height="48" fill="#059669" clip-path="url(#yapirenamec-k5)"/>
  </g>
  <circle cx="118" cy="630" r="4.5" fill="#059669"/>
  <text x="142" y="637" font-size="18.5" font-weight="600" fill="#111827">Deploy once</text>

  
  <g filter="url(#yapirenamec-lift)">
    <rect x="84" y="706" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="84" y="706" width="9" height="48" fill="#059669" clip-path="url(#yapirenamec-k6)"/>
  </g>
  <circle cx="118" cy="730" r="15" fill="#FFFFFF"/>
  <g transform="translate(109,721) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="142" y="737" font-size="18.5" font-weight="600" fill="#111827">A local refactor</text>
  <text x="320" y="779" font-size="15.5" text-anchor="middle" fill="#6B7280">You control the function and its callers.</text>

  
  <rect x="644" y="126" width="552" height="706" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="684" y="162" font-size="16.5" font-weight="600" fill="#BE185D">Published API field</text>
  <text x="1156" y="162" text-anchor="end" font-size="15.5" fill="#6B7280">six steps</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="190" width="472" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="190" width="6" height="48" fill="#64748B" clip-path="url(#yapirenamec-k7)"/>
  </g>
  <circle cx="718" cy="214" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,205) scale(0.75)" fill="none" stroke="#64748B" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="742" y="221" font-size="18.5" font-weight="600" fill="#111827">"display_name"</text>
  <text x="920" y="263" font-size="15.5" text-anchor="middle" fill="#6B7280">becomes "name"</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="288" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="288" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k8)"/>
  </g>
  <circle cx="718" cy="312" r="4.5" fill="#DB2777"/>
  <text x="742" y="319" font-size="18.5" font-weight="600" fill="#111827">Return both fields for a period</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="352" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="352" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k9)"/>
  </g>
  <circle cx="718" cy="376" r="4.5" fill="#DB2777"/>
  <text x="742" y="383" font-size="18.5" font-weight="600" fill="#111827">Document display_name as deprecated</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="416" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="416" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k10)"/>
  </g>
  <circle cx="718" cy="440" r="4.5" fill="#DB2777"/>
  <text x="742" y="447" font-size="18.5" font-weight="600" fill="#111827">Contact the consumers you know</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="480" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="480" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k11)"/>
  </g>
  <circle cx="718" cy="504" r="4.5" fill="#DB2777"/>
  <text x="742" y="511" font-size="18.5" font-weight="600" fill="#111827">Measure the remaining use</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="544" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="544" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k12)"/>
  </g>
  <circle cx="718" cy="568" r="4.5" fill="#DB2777"/>
  <text x="742" y="575" font-size="18.5" font-weight="600" fill="#111827">Give callers a migration deadline</text>

  
  <g filter="url(#yapirenamec-soft)">
    <rect x="684" y="608" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="608" width="6" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k13)"/>
  </g>
  <circle cx="718" cy="632" r="4.5" fill="#DB2777"/>
  <text x="742" y="639" font-size="18.5" font-weight="600" fill="#111827">Allow for clients that update late</text>

  
  <g filter="url(#yapirenamec-lift)">
    <rect x="684" y="706" width="472" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="684" y="706" width="9" height="48" fill="#DB2777" clip-path="url(#yapirenamec-k14)"/>
  </g>
  <circle cx="718" cy="730" r="15" fill="#FFFFFF"/>
  <g transform="translate(709,721) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="742" y="737" font-size="18.5" font-weight="600" fill="#111827">A compatibility migration</text>
  <text x="920" y="779" font-size="15.5" text-anchor="middle" fill="#6B7280">Partner integrations, unmaintained scripts, old mobile applications.</text>
  <text x="920" y="802" font-size="15.5" text-anchor="middle" fill="#94A3B8">You cannot update every client yourself.</text>

  
  <rect x="40" y="862" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="904" text-anchor="middle" font-size="16" fill="#475569">Much of the effort is in updating clients, not in renaming the server field.</text>
  <text x="620" y="932" text-anchor="middle" font-size="16" fill="#475569">Design the smallest contract that completes the job, and assume every published decision will be expensive to reverse.</text>
</svg>