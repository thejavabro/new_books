<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" style="background-color:#ffffff">
<defs>
<marker id="cra" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#2f7a55"/></marker>
<marker id="crb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold">Each handler either deals with the request or passes it on. Any one of them can stop it.</text>

<rect x="30" y="52" width="130" height="42" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="95" y="78" text-anchor="middle" font-size="12.5">Request</text>

<rect x="205" y="52" width="150" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="280" y="78" text-anchor="middle" font-size="12.5">AuthHandler</text>

<rect x="400" y="52" width="160" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="480" y="78" text-anchor="middle" font-size="12.5">RateLimitHandler</text>

<rect x="605" y="52" width="160" height="42" rx="4" fill="#ffffff" stroke="#6c8ebf"/>
<text x="685" y="78" text-anchor="middle" font-size="12.5">ValidationHandler</text>

<rect x="810" y="52" width="150" height="42" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="885" y="72" text-anchor="middle" font-size="12">CreateOrder</text>
<text x="885" y="88" text-anchor="middle" font-size="10.5" fill="#2f7a55">the terminal handler</text>

<path d="M 160 73 L 200 73" stroke="#2f7a55" fill="none" marker-end="url(#cra)"/>
<path d="M 355 73 L 395 73" stroke="#2f7a55" fill="none" marker-end="url(#cra)"/>
<path d="M 560 73 L 600 73" stroke="#2f7a55" fill="none" marker-end="url(#cra)"/>
<path d="M 765 73 L 805 73" stroke="#2f7a55" fill="none" marker-end="url(#cra)"/>

<text x="30" y="140" font-size="12.5" font-weight="bold" fill="#414d60">Three requests, three different paths through the same chain</text>

<rect x="30" y="156" width="200" height="30" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="44" y="176" font-size="11.5" fill="#2f7a55">valid request</text>
<path d="M 234 171 L 940 171" stroke="#2f7a55" fill="none" stroke-width="1.5" marker-end="url(#cra)"/>
<text x="600" y="164" font-size="11" fill="#2f7a55">reaches the end and the order is created</text>

<rect x="30" y="206" width="200" height="30" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="44" y="226" font-size="11.5" fill="#b4322c">no token</text>
<path d="M 234 221 L 340 221" stroke="#b4322c" fill="none" stroke-width="1.5" marker-end="url(#crb)"/>
<text x="350" y="225" font-size="11.5" fill="#b4322c">stopped at auth. Rate limiting, validation and handling never run.</text>

<rect x="30" y="256" width="200" height="30" rx="3" fill="#f7e2e0" stroke="#b4322c"/>
<text x="44" y="276" font-size="11.5" fill="#b4322c">over the limit</text>
<path d="M 234 271 L 540 271" stroke="#b4322c" fill="none" stroke-width="1.5" marker-end="url(#crb)"/>
<text x="550" y="275" font-size="11.5" fill="#b4322c">passed auth, stopped at the rate limiter.</text>

<rect x="30" y="316" width="920" height="86" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="342" font-size="12.5" fill="#414d60">Each handler knows only the next one. None of them knows how long the chain is, or what else is on it.</text>
<text x="52" y="364" font-size="12.5" fill="#414d60">Adding a rule is a new class and one wiring line. Reordering the chain is one line, with no handler edited.</text>
<text x="52" y="388" font-size="12.5" fill="#b4322c">The failure mode: a handler that forgets to pass on. The request then vanishes with no error anywhere.</text>
</g>
</svg>