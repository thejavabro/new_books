<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="300" viewBox="0 0 1240 300" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="range">
<defs>
<filter id="nd-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="300" fill="#FFFFFF"/>
<text x="620" y="50" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">1-digit numbers (1-9): n=110000 &gt; 1*9, skip this whole range</text>
<rect x="360" y="130" width="160" height="90" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="440" y="157" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">digitLength</text>
<text x="440" y="206" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="540" y="130" width="160" height="90" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="157" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">count</text>
<text x="620" y="206" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<rect x="720" y="130" width="160" height="90" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="800" y="157" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">n remaining</text>
<text x="800" y="206" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">110000</text>
</svg>