<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1270" viewBox="0 0 1240 1270" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The guarded order lifecycle state machine: placed, accepted, preparing, driver_assigned, picked_up, then delivered on payment capture, with timeout exits to cancelled and support, and no path at all from placed straight to picked_up.">
  <defs>
    <marker id="m07-l03-order-lifecycle-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l03-order-lifecycle-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l03-order-lifecycle-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l03-order-lifecycle-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l03-order-lifecycle-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1270" fill="#FFFFFF"/>

  <text x="620" y="70" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">The guard: there is no placed to picked_up transition,</text>
  <text x="620" y="102" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">so a duplicate or out-of-order event cannot skip ahead</text>

  <path d="M220,292 C320,160 820,150 1180,215 L1180,620 L1156,620" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l03-order-lifecycle-rd)"/>
  <circle cx="700" cy="155" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <line x1="691" y1="146" x2="709" y2="164"/>
    <line x1="709" y1="146" x2="691" y2="164"/>
  </g>

  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="80" y="300" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="220" y="351" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">placed</text>
  <text x="220" y="383" text-anchor="middle" font-size="20" fill="#64748B">payment authorized</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="470" y="300" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="610" y="351" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">accepted</text>
  <text x="610" y="383" text-anchor="middle" font-size="20" fill="#64748B">the restaurant commits</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="860" y="300" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1000" y="351" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">preparing</text>
  <text x="1000" y="383" text-anchor="middle" font-size="20" fill="#64748B">the kitchen is working</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="470" y="560" width="300" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="620" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">driver_assigned</text>
  <text x="620" y="643" text-anchor="middle" font-size="20" fill="#64748B">the first accept wins</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="860" y="560" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1000" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">picked_up</text>
  <text x="1000" y="643" text-anchor="middle" font-size="20" fill="#64748B">the food is moving</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="100" y="790" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="240" y="841" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">cancelled</text>
  <text x="240" y="873" text-anchor="middle" font-size="20" fill="#64748B">the payment is voided</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="500" y="790" width="280" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="640" y="841" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">support</text>
  <text x="640" y="873" text-anchor="middle" font-size="20" fill="#64748B">credits, an approximate undo</text>
  <g filter="url(#m07-l03-order-lifecycle-soft)">
    <rect x="880" y="790" width="280" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1020" y="841" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">delivered</text>
  <text x="1020" y="873" text-anchor="middle" font-size="20" fill="#64748B">the funds are finally taken</text>

  <g fill="none" stroke-width="2.5">
    <path d="M63,360 L72,360" stroke="#475569" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-sl)"/>
    <path d="M360,360 L462,360" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-bl)"/>
    <path d="M750,360 L852,360" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-bl)"/>
    <path d="M1000,420 L1000,490 L620,490 L620,552" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-bl)"/>
    <path d="M770,620 L852,620" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-bl)"/>
    <path d="M180,420 L180,782" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-rd)"/>
    <path d="M560,680 L560,782" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-rd)"/>
    <path d="M900,680 L900,730 L700,730 L700,782" stroke="#DC2626" stroke-width="2" marker-end="url(#m07-l03-order-lifecycle-rd)"/>
    <path d="M1020,680 L1020,782" stroke="#059669" marker-end="url(#m07-l03-order-lifecycle-em)"/>
  </g>

  <circle cx="50" cy="360" r="12" fill="#475569"/>

  <text x="411" y="255" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the restaurant</text>
  <text x="411" y="283" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">accepts</text>
  <text x="801" y="269" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the kitchen starts</text>
  <text x="810" y="478" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the driver accepts the offer</text>
  <text x="811" y="529" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the driver collects the food</text>
  <text x="200" y="470" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the accept times out,</text>
  <text x="200" y="498" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">so refund and cancel</text>
  <text x="580" y="708" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the pickup times out</text>
  <text x="720" y="762" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the delivery times out</text>
  <text x="1040" y="718" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">capture the</text>
  <text x="1040" y="746" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">payment</text>

  <rect x="60" y="960" width="540" height="140" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="90" y="1006" font-size="20" font-weight="600" fill="#334155">Compensation by stage</text>
  <text x="90" y="1044" font-size="20" fill="#475569">before pickup: refund and re-dispatch</text>
  <text x="90" y="1078" font-size="20" fill="#475569">after pickup: credits and support</text>
  <rect x="640" y="960" width="540" height="140" rx="12" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="670" y="1006" font-size="20" font-weight="600" fill="#334155">Timeouts are business logic</text>
  <text x="670" y="1044" font-size="20" fill="#475569">a transition that never arrives escalates:</text>
  <text x="670" y="1078" font-size="20" fill="#475569">re-ping, then re-dispatch or support</text>

  <line x1="60" y1="1150" x2="96" y2="1150" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1157" font-size="20" fill="#475569">The forward path, one guarded transition at a time</text>
  <line x1="60" y1="1190" x2="96" y2="1190" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1197" font-size="20" fill="#475569">A timeout fires: the exit is a state, not a hang</text>
  <line x1="60" y1="1230" x2="96" y2="1230" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1237" font-size="20" fill="#475569">The only ending that takes the money</text>
</svg>