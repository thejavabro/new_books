<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Main system design concerns and topics to discuss when relevant.">
  <defs>

    <filter id="m1l1c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m1l1c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <rect x="40" y="48" width="570" height="300" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="78" font-size="16.5" font-weight="600" fill="#047857">Main design concerns</text>
  <rect x="630" y="48" width="570" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="78" font-size="16.5" font-weight="600" fill="#475569">Secondary unless requested</text>

  <rect x="68" y="96" width="514" height="50" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="127" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">Requirements, with numbers</text>
  <rect x="68" y="158" width="514" height="50" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="189" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">The full feedback loop</text>
  <rect x="68" y="220" width="514" height="50" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="251" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">Cost and latency realism</text>
  <rect x="68" y="282" width="514" height="50" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="325" y="313" text-anchor="middle" font-size="17" font-weight="600" fill="#047857">Failure handling</text>
  <rect x="658" y="96" width="514" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="915" y="127" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Deriving the transformer</text>
  <rect x="658" y="158" width="514" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="915" y="189" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Naming the newest model</text>
  <rect x="658" y="220" width="514" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="915" y="251" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Framework and brand trivia</text>
  <rect x="658" y="282" width="514" height="50" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <text x="915" y="313" text-anchor="middle" font-size="17" font-weight="600" fill="#475569">Attention head math</text>
  <rect x="40" y="372" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="64" y="406" font-size="16" fill="#475569">Confirm the expected depth. Research and model-development roles may require more detail.</text>
  <rect x="64" y="432" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="454" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Estimate, do not assume</text>
  <text x="288" y="454" font-size="15.5" fill="#475569">model cost and latency depend on workload, model, and hosting</text>
  <rect x="64" y="476" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="498" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Explain the decision</text>
  <text x="288" y="498" font-size="15.5" fill="#475569">"we will test which requests a smaller model handles well"</text>
  <rect x="64" y="520" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="542" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Discuss the risk</text>
  <text x="288" y="542" font-size="15.5" fill="#475569">"the model may be wrong, so we need checks and a fallback"</text>
</svg>