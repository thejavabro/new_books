<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="DFS architecture: clients send metadata requests to a replicated metadata server and move file blocks directly to storage nodes, which replicate blocks between themselves and send heartbeats">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="df2-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="df2-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="df2-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="df2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="df2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M330,176 C400,176 440,110 490,100" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df2-blue)"/>
  <path d="M330,286 C420,286 460,160 490,150" fill="none" stroke="#3B82F6" stroke-width="2" marker-end="url(#df2-blue)"/>
  <text x="410" y="235" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">control path: where is the file?</text>

  <path d="M210,322 C210,400 220,430 230,460" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#df2-emerald)"/>
  <text x="250" y="390" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">data path: read and write blocks</text>

  <path d="M620,404 L620,180" fill="none" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df2-slate)"/>
  <text x="690" y="290" font-size="20" fill="#475569" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">heartbeats</text>

  <path d="M430,470 L520,470" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df2-amber)"/>
  <path d="M720,470 L810,470" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#df2-amber)"/>
  <text x="620" y="560" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">blocks are copied between nodes (replication)</text>

  
  <rect x="50" y="90" width="320" height="270" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="210" y="116" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Clients</text>
  <g filter="url(#df2-soft)">
    <rect x="90" y="140" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="90" y="250" width="240" height="72" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="210" y="170" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client A</text>
  <text x="210" y="198" font-size="20" fill="#64748B" text-anchor="middle">app or user</text>
  <text x="210" y="280" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client B</text>
  <text x="210" y="308" font-size="20" fill="#64748B" text-anchor="middle">app or user</text>

  
  <rect x="522" y="48" width="420" height="110" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="6 5"/>
  <g filter="url(#df2-soft)">
    <rect x="490" y="70" width="420" height="110" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="700" y="100" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Metadata Server</text>
  <text x="700" y="128" font-size="20" fill="#64748B" text-anchor="middle">file tree, permissions, block map</text>
  <text x="700" y="155" font-size="20" fill="#64748B" text-anchor="middle">replicated: a standby can take over</text>

  
  <g filter="url(#df2-soft)">
    <path d="M230,420 L230,520 A100,16 0 0 0 430,520 L430,420" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="330" cy="420" rx="100" ry="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M520,420 L520,520 A100,16 0 0 0 720,520 L720,420" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="620" cy="420" rx="100" ry="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M810,420 L810,520 A100,16 0 0 0 1010,520 L1010,420" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="910" cy="420" rx="100" ry="16" fill="#FAF5FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="330" y="475" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage node 1</text>
  <text x="330" y="502" font-size="20" fill="#64748B" text-anchor="middle">data blocks</text>
  <text x="620" y="475" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage node 2</text>
  <text x="620" y="502" font-size="20" fill="#64748B" text-anchor="middle">data blocks</text>
  <text x="910" y="475" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Storage node 3</text>
  <text x="910" y="502" font-size="20" fill="#64748B" text-anchor="middle">data blocks</text>

  
  <line x1="114" y1="640" x2="142" y2="640" stroke="#3B82F6" stroke-width="3"/>
  <text x="152" y="647" font-size="20" fill="#475569">control path (metadata)</text>
  <line x1="449" y1="640" x2="477" y2="640" stroke="#059669" stroke-width="3"/>
  <text x="487" y="647" font-size="20" fill="#475569">data path (file blocks)</text>
  <line x1="784" y1="640" x2="812" y2="640" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="822" y="647" font-size="20" fill="#475569">replication</text>
  <line x1="985" y1="640" x2="1013" y2="640" stroke="#475569" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="1023" y="647" font-size="20" fill="#475569">heartbeats</text>
</svg>