<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="real-title real-desc">
<title id="real-title">What makes a boundary real</title>
<desc id="real-desc">A public interface with a private implementation, explicit dependencies with no cycles, no shared mutable state, and no reaching into another module tables. The fourth is the one that decides whether the rest holds.</desc>
<defs>
<marker id="real-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="real-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="real-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="real-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="748" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What makes a boundary real</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four properties separate a real boundary from a naming convention.</text>
<rect x="40" y="670" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="670" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<circle cx="60" cy="154" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="161" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="118" width="468" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="326" y="146.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A public interface,</text><text x="326" y="173.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a private implementation</text>
<path d="M566 154H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 154H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#real-marker-slate)"/>
<rect x="610" y="118" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="147.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">everything not deliberately exposed is unreachable,</text><text x="630" y="172.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and the default is private</text>
<circle cx="60" cy="236" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="200" width="468" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="326" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Explicit dependencies, with no cycles</text>
<path d="M566 236H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 236H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#real-marker-slate)"/>
<rect x="610" y="200" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="229.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a cycle is not a style problem; it means two modules</text><text x="630" y="254.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">are one with two names</text>
<circle cx="60" cy="318" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="325" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="282" width="468" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="326" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No shared mutable state</text>
<path d="M566 318H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 318H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#real-marker-slate)"/>
<rect x="610" y="282" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="311.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no global registry, no shared cache object,</text><text x="630" y="336.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no static both modules write to</text>
<circle cx="60" cy="400" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="407" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="92" y="364" width="468" height="72" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="326" y="392.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">No reaching into</text><text x="326" y="419.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">another module's tables</text>
<path d="M566 400H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 400H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#real-marker-slate)"/>
<rect x="610" y="364" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="406" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the one that decides whether the whole exercise works</text>
<rect x="40" y="460" width="1160" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="64" y="498" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A module is not a folder, and domain-shaped directories change nothing on their own.</text>
<rect x="40" y="544" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="544" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="574" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The test</text><text x="64" y="600" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Replace the module with a different implementation of the same interface.</text><text x="64" y="626" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If anything else needs to change, the boundary is decorative.</text>
<text x="66" y="703" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Teams organize a codebase by domain and find nothing changed, because every directory still reaches into every other.</text>
</svg>