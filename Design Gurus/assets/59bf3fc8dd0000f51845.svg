<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Heap contents, 4th largest first</text>
<text x="266" y="225" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">stream</text>
<rect x="290" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="332" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<rect x="386" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="482" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="524" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">5</text>
<rect x="578" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">12</text>
<rect x="674" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="716" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<rect x="770" y="186" width="84" height="62" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="812" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">11</text>
<text x="362" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<rect x="386" y="316" width="84" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="428" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="428" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">4th largest</text>
<rect x="482" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="524" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="578" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">11</text>
<rect x="674" y="316" width="84" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="716" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">12</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep only the 4 largest numbers, with the smallest of them on top</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">The smallest of the 4 largest is exactly the 4th largest, so the top is the answer</text>
</svg>