<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The heap after the initial numbers">
<defs>
<filter id="kl-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Report the 4th largest number as more arrive</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The stream started with 3, 1, 5, 12, 2, 11, and more numbers keep coming</text>
