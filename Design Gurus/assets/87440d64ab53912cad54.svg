<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="698" viewBox="0 0 1240 698" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="worth-title worth-desc">
<title id="worth-title">Which estimates are worth computing</title>
<desc id="worth-desc">An estimate is worth computing when a very different answer would have led to a different design. Peak write rate, working set against memory and fan-out pass that test. Five-year storage, three-digit precision and anything solved by adding a machine do not.</desc>
<defs>
<marker id="worth-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="worth-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="worth-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="worth-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="698" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Which estimates are worth computing</text>
<text x="40" y="86" font-size="21" fill="#4A5568">An estimate is worth computing when a very different answer would have led to a different design.</text>
<rect x="40" y="620" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="620" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="340" y="118" width="560" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Would a different answer change the design?</text>
<path d="M520 180V210" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M520 180V210" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#worth-marker-green)"/>
<path d="M720 180V210" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M720 180V210" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#worth-marker-red)"/>
<rect x="40" y="216" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 216H46A6 6 0 0 0 40 222V490A6 6 0 0 0 46 496H54Z" fill="#39D5AA"/><text x="70" y="252" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Yes, so compute it</text>
<rect x="62" y="272" width="516" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="62" y="272" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="86" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Peak write rate</text><text x="86" y="322" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decides whether one machine is enough</text>
<rect x="62" y="344" width="516" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="62" y="344" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="86" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Working set vs memory</text><text x="86" y="394" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">decides whether reads touch disk</text>
<rect x="62" y="416" width="516" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="62" y="416" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="86" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Fan-out</text><text x="86" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one write becoming a million is a different system</text>
<rect x="640" y="216" width="560" height="280" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 216H646A6 6 0 0 0 640 222V490A6 6 0 0 0 646 496H654Z" fill="#F28B9D"/><text x="670" y="252" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">No, so do not</text>
<rect x="662" y="272" width="516" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="662" y="272" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="686" y="296" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Storage after five years</text><text x="686" y="322" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the design will change twice first</text>
<rect x="662" y="344" width="516" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="662" y="344" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="686" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Volume to three digits</text><text x="686" y="394" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every input is softer than that</text>
<rect x="662" y="416" width="516" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="662" y="416" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="686" y="440" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Anything a machine fixes</text><text x="686" y="466" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">changes the invoice, not the architecture</text>
<rect x="40" y="516" width="1160" height="78" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="516" width="5" height="78" rx="2.5" fill="#5EC9EC"/><text x="64" y="546.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Say what the number is for before you compute it.</text><text x="64" y="575.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">That one sentence turns estimation from a ritual into an argument.</text>
<text x="66" y="654" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">If a number could come back ten times larger and nothing would move, it is decoration.</text>
</svg>