<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="778" viewBox="0 0 1240 778" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="instead-title instead-desc">
<title id="instead-title">What you can buy instead</title>
<desc id="instead-desc">Multiple availability zones, backups with a rehearsed restore, a documented degraded mode, a content delivery network, and limiting how far one failure reaches. Most of the availability people reach for is available far cheaper.</desc>
<defs>
<marker id="instead-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="instead-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="instead-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="instead-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="778" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What you can buy instead</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Most of the availability people are reaching for is available far cheaper.</text>
<rect x="40" y="700" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="700" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="990" y="110" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">value for the money</text>
<rect x="40" y="118" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Multiple availability zones</text>
<path d="M446 150H490" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 150H490" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#instead-marker-green)"/>
<rect x="500" y="118" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="520" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the highest-value item here: much of what</text><text x="520" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">people fear as region failure is zone-level</text>
<rect x="990" y="133" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="990" y="133" width="200.0" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="194" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="218.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backups elsewhere,</text><text x="240" y="245.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">restore rehearsed</text>
<path d="M446 226H490" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 226H490" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#instead-marker-green)"/>
<rect x="500" y="194" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="520" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">converts a catastrophe into a bad day,</text><text x="520" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">at almost no running cost</text>
<rect x="990" y="209" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="990" y="209" width="80.0" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="270" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A documented degraded mode</text>
<path d="M446 302H490" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 302H490" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#instead-marker-green)"/>
<rect x="500" y="270" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="520" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">read-only, a static fallback, a queue</text><text x="520" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">absorbing writes; often a few days of work</text>
<rect x="990" y="285" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="990" y="285" width="106.7" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="346" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A content delivery network</text>
<path d="M446 378H490" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 378H490" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#instead-marker-green)"/>
<rect x="500" y="346" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="520" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">keeps static and cacheable content</text><text x="520" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">available when the origin is not</text>
<rect x="990" y="361" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="990" y="361" width="66.7" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="422" width="400" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Limit how far one failure reaches</text>
<path d="M446 454H490" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 454H490" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#instead-marker-green)"/>
<rect x="500" y="422" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="520" y="447.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one bad shard affects a fraction of users</text><text x="520" y="472.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than all of them</text>
<rect x="990" y="437" width="200" height="34" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="990" y="437" width="146.7" height="34" rx="10" fill="#06AC80"/>
<rect x="40" y="510" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="510" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="542.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Multiple zones, tested restores and a degraded mode cover a large majority</text><text x="64" y="569.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">of real incidents, for a small fraction of the cost and complexity.</text>
<rect x="40" y="612" width="1160" height="62" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="612" width="5" height="62" rx="2.5" fill="#F3CF6A"/><text x="64" y="649" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">That is the comparison to make, and most designs never make it.</text>
<text x="66" y="734" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A large share of the failures imagined as region outages are zone-level.</text>
</svg>