<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1130" viewBox="0 0 1240 1130" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow with four checks run in order: team size, product-market fit, operational readiness, and scaling needs. Any exit leads to staying with a monolith; only passing all four checks leads to considering extracting one part.">
  <defs>
    <marker id="m01-l03-monolith-first-checks-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m01-l03-monolith-first-checks-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m01-l03-monolith-first-checks-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m01-l03-monolith-first-checks-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="1130" fill="#FFFFFF"/>

  
  <rect x="40" y="24" width="800" height="846" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="56" font-size="20" font-weight="600" fill="#334155">Run the checks in order</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M470,220 L470,280" stroke="#475569" marker-end="url(#m01-l03-monolith-first-checks-sl)"/>
    <path d="M470,430 L470,490" stroke="#475569" marker-end="url(#m01-l03-monolith-first-checks-sl)"/>
    <path d="M470,640 L470,700" stroke="#475569" marker-end="url(#m01-l03-monolith-first-checks-sl)"/>
    <path d="M470,850 L470,910" stroke="#3B82F6" stroke-width="3" marker-end="url(#m01-l03-monolith-first-checks-bl)"/>
    <path d="M720,145 C800,145 800,385 860,385" stroke="#059669" marker-end="url(#m01-l03-monolith-first-checks-em)"/>
    <path d="M720,355 C800,355 800,425 860,425" stroke="#059669" marker-end="url(#m01-l03-monolith-first-checks-em)"/>
    <path d="M720,565 C800,565 800,465 860,465" stroke="#059669" marker-end="url(#m01-l03-monolith-first-checks-em)"/>
    <path d="M720,775 C800,775 800,505 860,505" stroke="#059669" marker-end="url(#m01-l03-monolith-first-checks-em)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="512" y="257" fill="#475569">No</text>
    <text x="512" y="467" fill="#475569">No</text>
    <text x="514" y="677" fill="#475569">Yes</text>
    <text x="516" y="887" fill="#1E40AF">Yes</text>
    <text x="780" y="133" fill="#065F46">Yes</text>
    <text x="780" y="343" fill="#065F46">Yes</text>
    <text x="780" y="553" fill="#065F46">No</text>
    <text x="780" y="763" fill="#065F46">No</text>
  </g>

  
  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <path d="M470,70 L720,145 L470,220 L220,145 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="139" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Team under roughly</text>
  <text x="470" y="167" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">20 to 50 engineers?</text>

  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <path d="M470,280 L720,355 L470,430 L220,355 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="349" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Still before</text>
  <text x="470" y="377" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">product-market fit?</text>

  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <path d="M470,490 L720,565 L470,640 L220,565 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="559" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Deployment, logging,</text>
  <text x="470" y="587" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">tracing, on-call in place?</text>

  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <path d="M470,700 L720,775 L470,850 L220,775 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="470" y="769" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Does one part need</text>
  <text x="470" y="797" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">wildly different scaling?</text>

  
  <g text-anchor="end">
    <text x="200" y="137" font-size="20" font-weight="600" fill="#334155">Check 1</text>
    <text x="200" y="165" font-size="20" fill="#64748B">team size</text>
    <text x="200" y="347" font-size="20" font-weight="600" fill="#334155">Check 2</text>
    <text x="200" y="375" font-size="20" fill="#64748B">product stage</text>
    <text x="200" y="557" font-size="20" font-weight="600" fill="#334155">Check 3</text>
    <text x="200" y="585" font-size="20" fill="#64748B">operations</text>
    <text x="200" y="767" font-size="20" font-weight="600" fill="#334155">Check 4</text>
    <text x="200" y="795" font-size="20" fill="#64748B">load shape</text>
  </g>

  
  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <rect x="860" y="360" width="350" height="160" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="1035" y="432" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Stay with a monolith</text>
  <text x="1035" y="464" text-anchor="middle" font-size="20" fill="#64748B">splitting is not justified yet</text>

  
  <g filter="url(#m01-l03-monolith-first-checks-soft)">
    <rect x="270" y="910" width="400" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="470" y="962" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consider extracting that part</text>

  
  <g stroke-width="4">
    <line x1="50" y1="1055" x2="84" y2="1055" stroke="#475569"/>
    <line x1="560" y1="1055" x2="594" y2="1055" stroke="#059669"/>
    <line x1="50" y1="1095" x2="84" y2="1095" stroke="#3B82F6"/>
  </g>
  <text x="94" y="1062" font-size="20" fill="#475569">Continue to the next check</text>
  <text x="604" y="1062" font-size="20" fill="#475569">Exit: stay with a monolith</text>
  <text x="94" y="1102" font-size="20" fill="#475569">All four checks pass: consider extracting that part</text>
</svg>