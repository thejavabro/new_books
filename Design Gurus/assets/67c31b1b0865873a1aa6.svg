<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four fields of the POST slash v1 slash notifications request body and what each decides. The channels field is a list and is optional, and user preferences still override it. The priority field names urgency rather than a channel, and gives one queue per class. The idempotency key is one value per event, reused on every retry. The response is 202 Accepted, meaning queued rather than sent, with status reported later.">
  <defs>
    <filter id="ntfapi-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ntfapi-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ntfapi-k1"><rect x="60" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ntfapi-k2"><rect x="350" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ntfapi-k3"><rect x="640" y="175" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ntfapi-k4"><rect x="930" y="175" width="250" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four fields, four decisions</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">POST /v1/notifications. Each one settles a question the rest of the design would otherwise reopen.</text>

  <rect x="40" y="115" width="1160" height="245" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="145" font-size="19.5" font-weight="600" fill="#1D4ED8">POST /v1/notifications</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ntfapi-soft)">
    <rect x="60" y="175" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="175" width="6" height="90" fill="#2563EB" clip-path="url(#ntfapi-k1)"/>
  </g>
  <circle cx="98" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,209.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="124" y="227" font-size="21.5" font-weight="600" fill="#111827">channels</text>
  <text x="185" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a list, and optional;</text>
  <text x="185" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">preferences still win</text>
  <g filter="url(#ntfapi-lift)">
    <rect x="350" y="175" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="350" y="175" width="9" height="90" fill="#D97706" clip-path="url(#ntfapi-k2)"/>
  </g>
  <circle cx="388" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(377.56,209.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="414" y="227" font-size="21.5" font-weight="600" fill="#111827">priority</text>
  <text x="475" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">urgency, not channel;</text>
  <text x="475" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">one queue per class</text>
  <g filter="url(#ntfapi-soft)">
    <rect x="640" y="175" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="640" y="175" width="6" height="90" fill="#059669" clip-path="url(#ntfapi-k3)"/>
  </g>
  <circle cx="678" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,209.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="704" y="227" font-size="21.5" font-weight="600" fill="#111827">idempotency key</text>
  <text x="765" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">one per event,</text>
  <text x="765" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">reused on retry</text>
  <g filter="url(#ntfapi-soft)">
    <rect x="930" y="175" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="930" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#ntfapi-k4)"/>
  </g>
  <circle cx="968" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(957.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="994" y="227" font-size="21.5" font-weight="600" fill="#111827">202 Accepted</text>
  <text x="1055" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">queued, not sent;</text>
  <text x="1055" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">status comes later</text>

  <rect x="40" y="400" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="425" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">A list, not one</text>
  <text x="323" y="450" font-size="18.5" fill="#475569">The requirement asks for one or several channels, so a single field could not say it.</text>
  <rect x="64" y="475" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Urgency is separate</text>
  <text x="323" y="500" font-size="18.5" fill="#475569">Channels are never ranked against each other. A passcode against a campaign is.</text>
  <rect x="64" y="525" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="550" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">What 202 promises</text>
  <text x="323" y="550" font-size="18.5" fill="#475569">The request is stored and will be attempted. Delivery can still fail afterwards.</text>
</svg>