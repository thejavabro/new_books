<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="638" viewBox="0 0 1240 638" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The string and the pattern tally before the scan starts">
<defs>
<filter id="pm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="638" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Does "aaacb" contain a permutation of "abc"?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A permutation only reorders characters, so the counts are what matter, not the order</text>
<rect x="40" y="106" width="1160" height="268" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Nothing read yet</text>
<rect x="386" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="428" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">"a"</text>
<text x="428" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="482" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="524" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">"a"</text>
<text x="524" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="578" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">"a"</text>
<text x="620" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="674" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="716" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">"c"</text>
<text x="716" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="770" y="196" width="84" height="66" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="812" y="236.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">"b"</text>
<text x="812" y="284" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<rect x="373" y="404" width="150" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="448" y="431" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">"a" still needed</text>
<text x="448" y="464" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="545" y="404" width="150" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="431" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">"b" still needed</text>
<text x="620" y="464" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="717" y="404" width="150" height="74" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="792" y="431" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">"c" still needed</text>
<text x="792" y="464" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="40" y="508" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="548" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Slide a window of length 3 and compare its counts against the tally</text>
<text x="620" y="580" text-anchor="middle" font-size="18.5" fill="#475569">When all 3 counts reach zero at the same time, the window is a permutation</text>
</svg>