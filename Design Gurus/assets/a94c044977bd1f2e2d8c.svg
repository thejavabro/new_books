<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cost-title cost-desc">
<title id="cost-title">Always compute the count</title>
<desc id="cost-desc">A price cached for sixty seconds that changes twice a day is wrong for about fourteen hundredths of one percent of the day. At a thousand requests per second that same window serves a hundred and twenty thousand wrong prices every day.</desc>
<defs>
<marker id="cost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="678" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Always compute the count</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Work a real example, because the intuition here is unreliable in a specific and dangerous way.</text>
<rect x="40" y="600" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="600" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="230" y="118" width="780" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="148.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A price cached 60 seconds, changing twice a day,</text><text x="620" y="175.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on a page serving 1,000 requests per second</text>
<path d="M320 200V232" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 200V232" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<path d="M920 200V232" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 200V232" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cost-marker-slate)"/>
<rect x="40" y="238" width="560" height="236" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 238H46A6 6 0 0 0 40 244V468A6 6 0 0 0 46 474H54Z" fill="#39D5AA"/><text x="320" y="274" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">As a percentage</text>
<text x="320" y="310" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">2 changes x 60 seconds</text><text x="320" y="338" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">out of 86,400 seconds</text>
<path d="M120 358H520" fill="none" stroke="#8795A5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="320" y="414" font-size="46" font-weight="700" fill="#169B77" text-anchor="middle">0.14%</text>
<text x="320" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">of the day, which sounds like nothing</text>
<rect x="640" y="238" width="560" height="236" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 238H646A6 6 0 0 0 640 244V468A6 6 0 0 0 646 474H654Z" fill="#F28B9D"/><text x="920" y="274" font-size="23" font-weight="700" fill="#A83147" text-anchor="middle">As a count</text>
<text x="920" y="310" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">120 seconds x 1,000 req/sec</text><text x="920" y="338" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">of wrong answers</text>
<path d="M720 358H1120" fill="none" stroke="#8795A5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="920" y="414" font-size="46" font-weight="700" fill="#A83147" text-anchor="middle">120,000</text>
<text x="920" y="452" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">customers shown a wrong price, daily</text>
<rect x="40" y="494" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="494" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="527" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Both figures are correct, and they tell opposite stories.</text><text x="64" y="553" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The percentage appears in design discussions. The count appears in the support queue.</text>
<text x="66" y="634" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Exposure is not a property of the expiry time. It is the expiry time, the rate of change, and the traffic.</text>
</svg>