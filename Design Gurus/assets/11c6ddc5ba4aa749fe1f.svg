<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="580" viewBox="0 0 1240 580" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Deadline propagation along a synchronous chain: the gateway passes a total budget of 2,000 ms to Checkout, Checkout spends 300 ms and passes 1,700 ms down to Payments, which does the work only if it fits what remains of the budget">
  <defs>
    <marker id="m04-l02-deadline-propagation-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <filter id="m04-l02-deadline-propagation-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="580" fill="#FFFFFF"/>

  
  <rect x="60" y="86" width="1120" height="160" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#60A5FA" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="112" font-size="13.5" font-weight="600" fill="#1E3A8A">One request, one budget: each hop passes down what is left</text>
  <text x="1160" y="112" text-anchor="end" font-size="12" fill="#64748B">gRPC carries deadlines natively, plain HTTP passes a deadline header</text>

  
  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M336,178 L470,178" marker-end="url(#m04-l02-deadline-propagation-bl)"/>
    <path d="M730,178 L864,178" marker-end="url(#m04-l02-deadline-propagation-bl)"/>
  </g>

  
  <g font-size="12" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="403" y="154">deadline passed:</text>
    <text x="403" y="169">2,000 ms</text>
    <text x="797" y="154">deadline passed:</text>
    <text x="797" y="169">1,700 ms</text>
  </g>

  
  <g filter="url(#m04-l02-deadline-propagation-soft)">
    <rect x="96" y="132" width="240" height="92" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="216" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="216" y="194" text-anchor="middle" font-size="12.5" fill="#475569">total budget 2,000 ms</text>

  <g filter="url(#m04-l02-deadline-propagation-soft)">
    <rect x="470" y="132" width="260" height="92" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="600" y="170" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="600" y="194" text-anchor="middle" font-size="12.5" fill="#64748B">spends 300 ms of its own work</text>

  <g filter="url(#m04-l02-deadline-propagation-soft)">
    <rect x="864" y="132" width="280" height="92" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="1004" y="161" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">Payments</text>
  <text x="1004" y="184" text-anchor="middle" font-size="12.5" fill="#64748B">works only if it fits what remains</text>
  <text x="1004" y="205" text-anchor="middle" font-size="12" fill="#B91C1C">does not fit: fail immediately</text>

  
  <rect x="60" y="282" width="1120" height="150" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="80" y="308" font-size="13.5" font-weight="600" fill="#334155">The 2,000 ms budget as one clock</text>

  
  <rect x="100" y="340" width="156" height="44" rx="8" fill="#E2E8F0" stroke="#64748B" stroke-width="1.5"/>
  <rect x="260" y="340" width="880" height="44" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

  
  <line x1="1140" y1="330" x2="1140" y2="394" stroke="#DC2626" stroke-width="3"/>

  <g font-size="12">
    <text x="100" y="324" fill="#64748B">0 ms</text>
    <text x="1128" y="324" text-anchor="end" fill="#B91C1C">2,000 ms: the caller has already hung up</text>
  </g>

  <text x="178" y="367" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">300 ms</text>
  <text x="700" y="368" text-anchor="middle" font-size="15" font-weight="600" fill="#0F172A">1,700 ms passed down to Payments</text>

  <g font-size="12.5" text-anchor="middle" fill="#64748B">
    <text x="178" y="406">spent by Checkout</text>
    <text x="700" y="406">each hop subtracts what it used before calling the next one</text>
  </g>

  
  <g filter="url(#m04-l02-deadline-propagation-soft)">
    <rect x="200" y="452" width="840" height="48" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="620" y="482" text-anchor="middle" font-size="14" font-weight="600" fill="#334155">Rule: each hop's timeout must be shorter than the time its caller has left</text>

  
  <g stroke-width="3">
    <line x1="60" y1="538" x2="88" y2="538" stroke="#3B82F6"/>
    <line x1="400" y1="538" x2="428" y2="538" stroke="#64748B"/>
    <line x1="720" y1="538" x2="748" y2="538" stroke="#DC2626"/>
  </g>
  <g font-size="12.5" fill="#475569">
    <text x="96" y="542">Synchronous path: the caller is waiting</text>
    <text x="436" y="542">Time already spent by an earlier hop</text>
    <text x="756" y="542">Deadline: past it, nobody is waiting</text>
  </g>
</svg>