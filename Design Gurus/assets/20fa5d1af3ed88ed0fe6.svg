<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends an HTTP request to the presentation layer (controllers, API handlers, views) and receives an HTTP response; the presentation layer handles HTTP requests and responses, validates input, authenticates the request, translates exceptions to status codes, formats the response, and calls the business logic layer">
  <defs>
    <filter id="m02c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m02c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m02c-k1"><rect x="40" y="322" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="m02c-k2"><rect x="384" y="228" width="402" height="56" rx="12"/></clipPath>
    <clipPath id="m02c-k3"><rect x="384" y="302" width="402" height="56" rx="12"/></clipPath>
    <clipPath id="m02c-k4"><rect x="384" y="376" width="402" height="56" rx="12"/></clipPath>
    <clipPath id="m02c-k5"><rect x="384" y="524" width="402" height="56" rx="12"/></clipPath>
    <clipPath id="m02c-k7"><rect x="384" y="450" width="402" height="56" rx="12"/></clipPath>
    <clipPath id="m02c-k6"><rect x="980" y="322" width="220" height="90" rx="12"/></clipPath>
    <marker id="m02c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="650" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Presentation layer: handling HTTP requests</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The presentation layer turns an HTTP request into a call to the business logic layer and formats the response.</text>

  <rect x="360" y="130" width="450" height="470" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="384" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Presentation layer</text>

  <g fill="none" stroke-width="2">
    <path d="M210,347 H360" stroke="#2563EB" marker-end="url(#m02c-m-blue)"/>
    <path d="M360,387 H210" stroke="#2563EB" marker-end="url(#m02c-m-blue)"/>
    <path d="M810,367 H980" stroke="#2563EB" marker-end="url(#m02c-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="285" y="334" fill="#1D4ED8">HTTP request</text>
    <text x="285" y="415" fill="#1D4ED8">HTTP response</text>
    <text x="895" y="330" fill="#1D4ED8">Calls</text>
    <text x="895" y="353" fill="#1D4ED8">business logic</text>
  </g>

  <g filter="url(#m02c-soft)">
    <rect x="40" y="322" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="322" width="6" height="90" fill="#64748B" clip-path="url(#m02c-k1)"/>
  </g>
  <circle cx="78" cy="367" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,356.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="374" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#m02c-soft)">
    <rect x="384" y="228" width="402" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="228" width="6" height="56" fill="#2563EB" clip-path="url(#m02c-k2)"/>
  </g>
  <text x="404" y="263" font-size="18.5" font-weight="600" fill="#111827">Handle HTTP requests and responses</text>
  <g filter="url(#m02c-soft)">
    <rect x="384" y="302" width="402" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="302" width="6" height="56" fill="#2563EB" clip-path="url(#m02c-k3)"/>
  </g>
  <text x="404" y="337" font-size="18.5" font-weight="600" fill="#111827">Validate input</text>
  <g filter="url(#m02c-soft)">
    <rect x="384" y="376" width="402" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="376" width="6" height="56" fill="#2563EB" clip-path="url(#m02c-k4)"/>
  </g>
  <text x="404" y="411" font-size="18.5" font-weight="600" fill="#111827">Authenticate the request</text>
  <g filter="url(#m02c-soft)">
    <rect x="384" y="450" width="402" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="450" width="6" height="56" fill="#2563EB" clip-path="url(#m02c-k7)"/>
  </g>
  <text x="404" y="485" font-size="18.5" font-weight="600" fill="#111827">Translate exceptions to status codes</text>
  <g filter="url(#m02c-soft)">
    <rect x="384" y="524" width="402" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="384" y="524" width="6" height="56" fill="#2563EB" clip-path="url(#m02c-k5)"/>
  </g>
  <text x="404" y="559" font-size="18.5" font-weight="600" fill="#111827">Format the response</text>
  <g filter="url(#m02c-soft)">
    <rect x="980" y="322" width="220" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="980" y="322" width="6" height="90" fill="#059669" clip-path="url(#m02c-k6)"/>
  </g>
  <circle cx="1018" cy="367" r="18" fill="#FFFFFF"/>
  <g transform="translate(1007.56,356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="1044" y="361.25" font-size="21.5" font-weight="600" fill="#111827">Business</text>
  <text x="1044" y="386.75" font-size="21.5" font-weight="600" fill="#111827">logic layer</text>
  <text x="384" y="188" font-size="18.5" text-anchor="start" fill="#6B7280">(controllers, API handlers, views)</text>




</svg>