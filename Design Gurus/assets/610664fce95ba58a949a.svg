<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="wrongnums-title wrongnums-desc">
<title id="wrongnums-title">Two numbers, both wrong</title>
<desc id="wrongnums-desc">The vendor price omits integration, discovered limits and the exit. The one-month estimate omits production work and every year after. Total cost of ownership over three to five years is the comparison that decides.</desc>
<defs>
<marker id="wrongnums-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="wrongnums-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="wrongnums-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="wrongnums-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="630" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Two numbers, both wrong</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Both numbers in that exchange are wrong, and they are wrong in opposite directions.</text>
<rect x="40" y="552" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="552" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V282A6 6 0 0 0 46 288H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">"Their price is $40k a year"</text>
<rect x="72" y="174" width="500" height="92" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="92" y="201" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">omits integration</text><text x="92" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">omits the limits you find later</text><text x="92" y="251" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">omits the cost of leaving</text>
<rect x="640" y="118" width="560" height="170" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V282A6 6 0 0 0 646 288H654Z" fill="#5EC9EC"/><text x="670" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">"I could write that in a month"</text>
<rect x="672" y="174" width="500" height="92" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="692" y="201" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">estimates the first version only</text><text x="692" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">omits the production work</text><text x="692" y="251" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">omits every year after</text>
<rect x="40" y="310" width="1160" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="310" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="346" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Both numbers are wrong, in opposite directions</text><text x="64" y="372" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The comparison that decides correctly is total cost of ownership</text><text x="64" y="398" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">over three to five years, because that is how long the decision stays made.</text>
<rect x="40" y="444" width="1160" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="444" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="64" y="477" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Engineering time is the currency</text><text x="64" y="503" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Everything else on both sides is small against the cost of the people who have to keep it working.</text>
<text x="66" y="586" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A vendor bill that looks enormous next to a server bill looks very different next to a salary.</text>
</svg>