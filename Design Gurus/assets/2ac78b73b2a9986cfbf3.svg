  </defs>

  <rect x="0" y="0" width="1240" height="735" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to use hexagonal architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Use it when any one of the three reasons applies; skip it when there is little business logic to protect.</text>


  <rect x="40" y="120" width="560" height="575" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Good fit when...</text>
  <rect x="640" y="120" width="560" height="575" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Not ideal when...</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m10m-soft)">
    <rect x="64" y="200" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="200" width="6" height="70" fill="#059669" clip-path="url(#m10m-k1)"/>
  </g>
  <circle cx="102" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,224.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="128" y="242" font-size="21.5" font-weight="600" fill="#111827">Complex business logic</text>
  <g filter="url(#m10m-soft)">
    <rect x="64" y="356" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="356" width="6" height="70" fill="#059669" clip-path="url(#m10m-k2)"/>
  </g>
  <circle cx="102" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,380.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="398" font-size="21.5" font-weight="600" fill="#111827">Several driving mechanisms</text>
  <g filter="url(#m10m-soft)">
    <rect x="64" y="512" width="512" height="70" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="512" width="6" height="70" fill="#059669" clip-path="url(#m10m-k3)"/>
  </g>
  <circle cx="102" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,536.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="128" y="554" font-size="21.5" font-weight="600" fill="#111827">Infrastructure expected to change</text>
  <g filter="url(#m10m-soft)">
    <rect x="664" y="200" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
