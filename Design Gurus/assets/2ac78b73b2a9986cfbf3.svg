  <g transform="translate(691.56,224.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="728" y="242" font-size="21.5" font-weight="600" fill="#111827">CRUD admin panel</text>
  <g filter="url(#m10m-soft)">
    <rect x="664" y="356" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="356" width="6" height="70" fill="#DB2777" clip-path="url(#m10m-k7)"/>
  </g>
  <circle cx="702" cy="391" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,380.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="728" y="398" font-size="21.5" font-weight="600" fill="#111827">Data pipeline</text>
  <g filter="url(#m10m-soft)">
    <rect x="664" y="512" width="512" height="70" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="512" width="6" height="70" fill="#DB2777" clip-path="url(#m10m-k9)"/>
  </g>
  <circle cx="702" cy="547" r="18" fill="#FFFFFF"/>
  <g transform="translate(691.56,536.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="728" y="554" font-size="21.5" font-weight="600" fill="#111827">Thin proxy service</text>
  <text x="320" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">The business logic is complex enough that</text>
  <text x="320" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">fast, thorough testing matters.</text>
  <text x="320" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">HTTP, a CLI command and a queue consumer</text>
  <text x="320" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">call the same operations.</text>
  <text x="320" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">Infrastructure choices, such as the database</text>
  <text x="320" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">or payment provider, are expected to change.</text>
  <text x="920" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">Each screen reads or writes one table, so the</text>
  <text x="920" y="326" font-size="18.5" text-anchor="middle" fill="#6B7280">ports would only forward calls to the database.</text>
  <text x="920" y="455" font-size="18.5" text-anchor="middle" fill="#6B7280">Mostly infrastructure orchestration, and its few</text>
  <text x="920" y="482" font-size="18.5" text-anchor="middle" fill="#6B7280">rules are easier to test as plain functions.</text>
  <text x="920" y="611" font-size="18.5" text-anchor="middle" fill="#6B7280">A service that authenticates a request</text>
  <text x="920" y="638" font-size="18.5" text-anchor="middle" fill="#6B7280">and forwards it to another service has</text>
  <text x="920" y="665" font-size="18.5" text-anchor="middle" fill="#6B7280">almost no domain to isolate.</text>




</svg>