<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Superkeys contain candidate keys, which contain the primary key and the alternate keys, with prime and non-prime attributes shown alongside">
<rect x="0" y="0" width="1240" height="606" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="424" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Every candidate key is a superkey. Most superkeys are not candidate keys.</text>

<rect x="72" y="96" width="700" height="344" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.8"/>
<text x="96" y="126" font-size="16.5" font-weight="600" fill="#1D4ED8">Superkeys</text>
<text x="96" y="148" font-size="14.5" fill="#6B7280">unique in every row. Add any column and it is still a superkey.</text>
<text x="96" y="420" font-size="14.5" font-style="italic" fill="#1D4ED8">{roll_no, name}, {roll_no, name, cgpa}, {email, branch} ...</text>

<rect x="112" y="168" width="620" height="230" rx="14" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.8"/>
<text x="136" y="198" font-size="16.5" font-weight="600" fill="#5B21B6">Candidate keys</text>
<text x="136" y="220" font-size="14.5" fill="#6B7280">minimal superkeys. Remove any one column and uniqueness breaks.</text>

<rect x="152" y="242" width="260" height="130" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="176" y="272" font-size="16.5" font-weight="600" fill="#047857">Primary key</text>
<text x="176" y="296" font-size="14.5" fill="#111827">the one you choose</text>
<text x="176" y="318" font-size="14.5" fill="#6B7280">never NULL, never</text>
<text x="176" y="336" font-size="14.5" fill="#6B7280">reused</text>
<text x="176" y="360" font-size="14.5" font-style="italic" fill="#047857">{roll_no}</text>

<rect x="440" y="242" width="260" height="130" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="1.8"/>
<text x="464" y="272" font-size="16.5" font-weight="600" fill="#B45309">Alternate keys</text>
<text x="464" y="296" font-size="14.5" fill="#111827">the candidate keys</text>
<text x="464" y="318" font-size="14.5" fill="#6B7280">you did not choose.</text>
<text x="464" y="336" font-size="14.5" fill="#6B7280">Give each one UNIQUE</text>
<text x="464" y="360" font-size="14.5" font-style="italic" fill="#B45309">{email}</text>

<rect x="812" y="96" width="356" height="344" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
<text x="836" y="126" font-size="16.5" font-weight="600" fill="#475569">Prime and non-prime</text>
<text x="836" y="150" font-size="14.5" fill="#6B7280">tested against every candidate key,</text>
<text x="836" y="168" font-size="14.5" fill="#6B7280">not only the primary key</text>

<rect x="836" y="192" width="308" height="96" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.3"/>
<text x="856" y="218" font-size="15.5" font-weight="600" fill="#047857">prime</text>
<text x="856" y="242" font-size="14.5" fill="#111827">in at least one candidate key</text>
<text x="856" y="270" font-size="14.5" font-style="italic" fill="#047857">roll_no, email</text>

<rect x="836" y="304" width="308" height="96" rx="10" fill="#FEF2F2" stroke="#F9A8D4" stroke-width="1.3"/>
<text x="856" y="330" font-size="15.5" font-weight="600" fill="#BE185D">non-prime</text>
<text x="856" y="354" font-size="14.5" fill="#111827">in no candidate key at all</text>
<text x="856" y="382" font-size="14.5" font-style="italic" fill="#BE185D">name, branch, cgpa</text>

<rect x="40" y="498" width="1160" height="88" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="64" y="532" font-size="16" fill="#475569">These four words carry the whole of chapter 7. Third normal form is written in terms of prime attributes,</text>
<text x="64" y="558" font-size="16" fill="#475569">and Boyce-Codd normal form is written in terms of superkeys. Neither rule is readable until these are exact.</text>
</svg>