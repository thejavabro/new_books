<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Serverless has three common forms. Serverless functions, such as AWS Lambda, run code for each event and can scale to zero. Serverless containers, such as AWS Fargate and Cloud Run, run your container without machines to manage. Serverless databases, such as DynamoDB, grow and shrink with load.">
  <defs>
    <filter id="slv1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="slv1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="slv1-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="slv1-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="slv1-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Serverless is a model, with three common forms</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The provider manages the machines, scales them, and charges for use.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#slv1-lift)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="64" y="140" width="9" height="90" fill="#7C3AED" clip-path="url(#slv1-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Functions</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">code runs for each event,</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">like AWS Lambda</text>
  <g filter="url(#slv1-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#slv1-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Containers</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">your container, no machines,</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">like Fargate or Cloud Run</text>
  <g filter="url(#slv1-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#059669" clip-path="url(#slv1-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Databases</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">grow and shrink with load,</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">like DynamoDB</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Same model</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">no machines to manage, automatic scaling, and payment for use</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Cold starts</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">mainly a problem for functions that scale to zero</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Servers exist</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">the provider runs them, and you never see them</text>
</svg>