<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Each review item is answered out loud and timed; a correct answer moves on, and a miss goes back to its lesson and returns on a later day">
  <defs>
    <marker id="c9in1-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="c9in1-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="c9in1-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="c9in1-mviolet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="c9in1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="c9in1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="c9in1-k1"><rect x="60" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c9in1-k2"><rect x="304" y="136" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c9in1-k3"><rect x="628" y="136" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c9in1-k4"><rect x="980" y="136" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="c9in1-k5"><rect x="628" y="400" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="c9in1-k6"><rect x="304" y="400" width="280" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <rect x="40" y="56" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="86" font-size="16.5" font-weight="600" fill="#1D4ED8">Every item</text>
  <rect x="40" y="320" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="350" font-size="16.5" font-weight="600" fill="#1D4ED8">Only a miss</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M260,181 H304" marker-end="url(#c9in1-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M584,181 H628" marker-end="url(#c9in1-mslate)"/></g>
  <g fill="none" stroke="#059669" stroke-width="2"><path d="M908,181 H980" marker-end="url(#c9in1-memerald)"/></g>
  <g fill="none" stroke="#D97706" stroke-width="2"><path d="M892,226 V400" marker-end="url(#c9in1-mamber)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M628,445 H584" marker-end="url(#c9in1-mslate)"/></g>
  <g fill="none" stroke="#7C3AED" stroke-width="2"><path d="M568,400 V226" marker-end="url(#c9in1-mviolet)"/></g>
  <g filter="url(#c9in1-soft)">
    <rect x="60" y="136" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="60" y="136" width="6" height="90" fill="#2563EB" clip-path="url(#c9in1-k1)"/>
  </g>
  <circle cx="98" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="60" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 1</text>
  <text x="124" y="176.5" font-size="18.5" font-weight="600" fill="#111827">Cover the</text>
  <text x="124" y="199.5" font-size="18.5" font-weight="600" fill="#111827">answer</text>
  <text x="160" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">read only the question</text>
  <g filter="url(#c9in1-lift)">
    <rect x="304" y="136" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="304" y="136" width="9" height="90" fill="#2563EB" clip-path="url(#c9in1-k2)"/>
  </g>
  <circle cx="342" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(331.56,170.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="304" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 2</text>
  <text x="368" y="188" font-size="18.5" font-weight="600" fill="#111827">Answer out loud</text>
  <text x="434" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">about 30 seconds, as an example</text>
  <g filter="url(#c9in1-soft)">
    <rect x="628" y="136" width="280" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="628" y="136" width="6" height="90" fill="#4F46E5" clip-path="url(#c9in1-k3)"/>
  </g>
  <circle cx="666" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(655.56,170.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="628" y="124" font-size="15.5" font-weight="600" fill="#6B7280">Step 3</text>
  <text x="692" y="188" font-size="18.5" font-weight="600" fill="#111827">Check and mark</text>
  <text x="758" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">compare with the written answer</text>
  <g filter="url(#c9in1-soft)">
    <rect x="980" y="136" width="200" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="980" y="136" width="6" height="90" fill="#059669" clip-path="url(#c9in1-k4)"/>
  </g>
  <circle cx="1018" cy="181" r="18" fill="#FFFFFF"/>
  <g transform="translate(1007.56,170.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1044" y="188" font-size="18.5" font-weight="600" fill="#111827">Next item</text>
  <text x="1080" y="251" font-size="15.5" text-anchor="middle" fill="#6B7280">a correct answer moves on</text>
  <g filter="url(#c9in1-soft)">
    <rect x="628" y="400" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="628" y="400" width="6" height="90" fill="#D97706" clip-path="url(#c9in1-k5)"/>
  </g>
  <circle cx="666" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(655.56,434.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="628" y="388" font-size="15.5" font-weight="600" fill="#6B7280">Step 4</text>
  <text x="692" y="452" font-size="18.5" font-weight="600" fill="#111827">Go back to the lesson</text>
  <text x="768" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">reread the part, add it to the miss list</text>
  <g filter="url(#c9in1-soft)">
    <rect x="304" y="400" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="304" y="400" width="6" height="90" fill="#7C3AED" clip-path="url(#c9in1-k6)"/>
  </g>
  <circle cx="342" cy="445" r="18" fill="#FFFFFF"/>
  <g transform="translate(331.56,434.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="304" y="388" font-size="15.5" font-weight="600" fill="#6B7280">Step 5</text>
  <text x="368" y="452" font-size="18.5" font-weight="600" fill="#111827">Drill it again</text>
  <text x="444" y="515" font-size="15.5" text-anchor="middle" fill="#6B7280">on a later day</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="944" y="170" fill="#047857">correct</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="start" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="904" y="304" fill="#B45309">miss</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="end" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="556" y="304" fill="#5B21B6">a day or more later</text></g>
  <rect x="40" y="572" width="1160" height="60" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="607.5" text-anchor="middle" font-size="15.5" fill="#374151">Remove an item from the miss list after two correct answers in a row, on two different days.</text>
</svg>