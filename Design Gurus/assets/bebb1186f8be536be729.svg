    <clipPath id="m03m-k8"><rect x="1009" y="586" width="165" height="90" rx="12"/></clipPath>
    <marker id="m03m-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m03m-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Cross-tier timeouts: preventing cascading failures</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">With a timeout on each hop, a slow database fails fast instead of stalling every tier above it.</text>

  <rect x="40" y="120" width="1160" height="356" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#047857">Each server-side hop has a timeout</text>
  <rect x="40" y="506" width="1160" height="370" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="536" font-size="19.5" font-weight="600" fill="#BE185D">Without timeouts: failures cascade</text>

  <g fill="none" stroke-width="2">
    <path d="M204,245 H349" stroke="#2563EB" marker-end="url(#m03m-m-blue)"/>
    <path d="M519,245 H664" stroke="#2563EB" marker-end="url(#m03m-m-blue)"/>
