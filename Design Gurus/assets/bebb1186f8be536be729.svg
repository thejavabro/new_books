    <text x="276.5" y="274" fill="#1D4ED8">HTTP/HTTPS</text>
    <text x="591.5" y="274" fill="#1D4ED8">HTTP/gRPC</text>
    <text x="936.5" y="274" fill="#1D4ED8">Database</text>
    <text x="936.5" y="297" fill="#1D4ED8">protocol (TCP)</text>
    <text x="276.5" y="594" fill="#BE185D">Keeps waiting</text>
    <text x="276.5" y="616" fill="#BE185D">(no timeout)</text>
    <text x="591.5" y="594" fill="#BE185D">Keeps waiting</text>
    <text x="591.5" y="616" fill="#BE185D">(no timeout)</text>
    <text x="936.5" y="572" fill="#BE185D">Slow or</text>
    <text x="936.5" y="594" fill="#BE185D">unresponsive</text>
    <text x="936.5" y="616" fill="#BE185D">(no timeout)</text>
    <text x="276.5" y="660" fill="#BE185D">HTTP/HTTPS</text>
