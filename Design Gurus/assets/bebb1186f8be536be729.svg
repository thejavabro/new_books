<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With timeouts: the client calls the load balancer over HTTP or HTTPS, the load balancer calls the application tier over HTTP or gRPC with a 2 second timeout, and the application tier calls the database over a database protocol (TCP) with a 1 second timeout; slow calls stop quickly, requests fail fast with a graceful error, resources are freed and failures do not cascade. Without timeouts: every tier keeps waiting on a slow or down database, so requests pile up, threads and connections are exhausted, latency rises everywhere and the whole application can become unresponsive">
