<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="absolute-title absolute-desc">
<title id="absolute-title">Set the value, do not shift it by an amount</title>
<desc id="absolute-desc">Operations that set a value are idempotent, and operations that adjust one are not. Surprisingly often an event can be reshaped to carry the resulting value instead of the amount of change, which makes the consumer idempotent with no extra storage.</desc>
<defs>
<marker id="absolute-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="absolute-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="absolute-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="absolute-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="716" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Set the value, do not shift it by an amount</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Operations that set a value are idempotent, and operations that adjust one are not.</text>
<rect x="40" y="638" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="638" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The pattern behind natural idempotence</text>
<rect x="40" y="168" width="400" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SET status = 'shipped'</text>
<rect x="456" y="175" width="130" height="42" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="521" y="203" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">idempotent</text>
<rect x="600" y="168" width="600" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="620" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">run it a hundred times, the row looks the same</text>
<rect x="40" y="236" width="400" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">SET balance = balance + 10</text>
<rect x="456" y="243" width="130" height="42" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="521" y="271" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">not</text>
<rect x="600" y="236" width="600" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="620" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every run moves the balance</text>
<rect x="40" y="304" width="400" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">INSERT ... ON CONFLICT DO NOTHING</text>
<rect x="456" y="311" width="130" height="42" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="521" y="339" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">idempotent</text>
<rect x="600" y="304" width="600" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="620" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the constraint absorbs the repeat</text>
<rect x="40" y="372" width="400" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">add an element to a set</text>
<rect x="456" y="379" width="130" height="42" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="521" y="407" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">idempotent</text>
<rect x="600" y="372" width="600" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="620" y="406" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">membership does not accumulate</text>
<rect x="40" y="440" width="400" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="240" y="474" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">append to a list</text>
<rect x="456" y="447" width="130" height="42" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="521" y="475" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">not</text>
<rect x="600" y="440" width="600" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="620" y="474" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the list grows by one each time</text>
<text x="40" y="538" font-size="23" font-weight="700" fill="#6040A8" text-anchor="start">Carry the result, not the amount of change</text>
<rect x="40" y="556" width="560" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="590" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">balance_after: 110</text>
<rect x="640" y="556" width="560" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="590" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">amount: 10</text>
<text x="66" y="671" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The first question for any consumer is whether the effect can be expressed as a set rather than an increment.</text>
</svg>