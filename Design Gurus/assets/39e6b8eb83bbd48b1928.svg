<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="930" viewBox="0 0 1240 930" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="HTTP/1.0 opens a connection, gets the page, and closes it, then repeats for the stylesheet and the image. HTTP/1.1 opens one connection and gets the page, the stylesheet, and the image over it.">
  <defs>
    <filter id="ht1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ht1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ht1-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k2"><rect x="64" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k3"><rect x="64" y="450" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k4"><rect x="654" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k5"><rect x="654" y="315" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k6"><rect x="654" y="450" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="ht1-k7"><rect x="654" y="585" width="522" height="90" rx="12"/></clipPath>
    <marker id="ht1-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="930" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">HTTP/1.0 and HTTP/1.1 connections</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same three files. HTTP/1.0 pays for a handshake each time. HTTP/1.1 pays once.</text>

  <rect x="40" y="120" width="570" height="600" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">HTTP/1.0: a new connection per file</text>
  <rect x="630" y="120" width="570" height="600" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#047857">HTTP/1.1: one persistent connection</text>

  <g fill="none" stroke-width="2">
    <path d="M915,270 V315" stroke="#64748B" marker-end="url(#ht1-m-slate)"/>
    <path d="M915,405 V450" stroke="#64748B" marker-end="url(#ht1-m-slate)"/>
    <path d="M915,540 V585" stroke="#64748B" marker-end="url(#ht1-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ht1-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#DB2777" clip-path="url(#ht1-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">Open, get page, close</text>
  <g filter="url(#ht1-soft)">
    <rect x="64" y="315" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="315" width="6" height="90" fill="#DB2777" clip-path="url(#ht1-k2)"/>
  </g>
  <circle cx="102" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,349.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="367" font-size="21.5" font-weight="600" fill="#111827">Open, get CSS, close</text>
  <g filter="url(#ht1-soft)">
    <rect x="64" y="450" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="450" width="6" height="90" fill="#DB2777" clip-path="url(#ht1-k3)"/>
  </g>
  <circle cx="102" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,484.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="502" font-size="21.5" font-weight="600" fill="#111827">Open, get image, close</text>
  <g filter="url(#ht1-soft)">
    <rect x="654" y="180" width="522" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="654" y="180" width="6" height="90" fill="#059669" clip-path="url(#ht1-k4)"/>
  </g>
  <circle cx="692" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="718" y="232" font-size="21.5" font-weight="600" fill="#111827">Open one connection</text>
  <g filter="url(#ht1-soft)">
    <rect x="654" y="315" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="315" width="6" height="90" fill="#2563EB" clip-path="url(#ht1-k5)"/>
  </g>
  <circle cx="692" cy="360" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,349.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="718" y="367" font-size="21.5" font-weight="600" fill="#111827">Get page</text>
  <g filter="url(#ht1-soft)">
    <rect x="654" y="450" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="450" width="6" height="90" fill="#2563EB" clip-path="url(#ht1-k6)"/>
  </g>
  <circle cx="692" cy="495" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,484.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="718" y="502" font-size="21.5" font-weight="600" fill="#111827">Get CSS</text>
  <g filter="url(#ht1-soft)">
    <rect x="654" y="585" width="522" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="654" y="585" width="6" height="90" fill="#2563EB" clip-path="url(#ht1-k7)"/>
  </g>
  <circle cx="692" cy="630" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,619.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="718" y="637" font-size="21.5" font-weight="600" fill="#111827">Get image</text>

  <rect x="40" y="750" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">HTTP/1.0</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">a new TCP handshake for every file</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">HTTP/1.1</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">one connection, reused for many requests, but still one at a time</text>
</svg>