<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="table-title table-desc">
<title id="table-title">The table, and what has to change</title>
<desc id="table-desc">Three changes to a live payments table: an exact numeric conversion, a currency column with no historical source, and a column split whose deletion is required by a retention policy. One of each kind of difficulty.</desc>
<defs>
<marker id="table-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="table-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="table-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="table-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="674" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The table, and what has to change</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three things have to change, and they are deliberately not the same kind of problem.</text>
<rect x="40" y="596" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="596" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="151" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">payments</text><text x="64" y="177" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">eleven million rows, four hundred writes a second at peak, four years old</text>
<circle cx="60" cy="255" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="262" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="220" width="470" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="261" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">amount_cents becomes NUMERIC</text>
<path d="M566 255H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 255H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#table-marker-slate)"/>
<rect x="610" y="220" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="261" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">mechanical: exact, derived, safe to apply twice</text>
<circle cx="60" cy="337" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="344" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="302" width="470" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="343" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a currency column is added</text>
<path d="M566 337H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 337H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#table-marker-slate)"/>
<rect x="610" y="302" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="330.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not an engineering decision: no row records</text><text x="630" y="355.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which currency it was</text>
<circle cx="60" cy="419" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="426" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="384" width="470" height="70" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="325" y="425" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the card columns move out</text>
<path d="M566 419H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 419H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#table-marker-slate)"/>
<rect x="610" y="384" width="590" height="70" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="412.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">irreversible: a retention policy means the deletion is</text><text x="630" y="437.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the point of the change</text>
<rect x="40" y="490" width="1160" height="74" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="74" rx="2.5" fill="#AC8BE8"/><text x="64" y="533" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every row in it is money that somebody will eventually audit.</text>
<text x="66" y="630" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Plan the migration. Then decide what you do when the backfill stops at row four million.</text>
</svg>