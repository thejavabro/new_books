<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="776" viewBox="0 0 1240 776" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same reader and writer under two-phase locking, where the reader is blocked until the writer commits, and under MVCC, where the reader takes the older version and finishes before the writer commits">
  <rect x="0" y="0" width="1240" height="776" fill="#FFFFFF"/>
  <defs>
    <marker id="db8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same two transactions, on the same clock, under each scheme</text>

  
  <rect x="40" y="76" width="1160" height="264" rx="14" fill="none" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="110" font-size="20" font-weight="600" fill="#B91C1C">Two-phase locking: the reader waits for the writer to finish</text>

  <line x1="700" y1="140" x2="700" y2="300" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="860" y1="204" x2="860" y2="300" stroke="#059669" stroke-width="2"/>

  <text x="130" y="179" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Bob</text>
  <text x="130" y="239" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Alice</text>

  <rect x="300" y="150" width="400" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="500" y="179" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Bob holds the write lock</text>

  <rect x="300" y="210" width="400" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="500" y="239" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Alice is blocked</text>

  <rect x="700" y="210" width="160" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="780" y="239" font-size="20" fill="#065F46" text-anchor="middle">reads</text>

  <line x1="220" y1="290" x2="1160" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#db8-slate)"/>
  <text x="700" y="322" font-size="20" fill="#334155" text-anchor="middle">Bob commits</text>
  <text x="860" y="322" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Alice done</text>

  
  <rect x="40" y="360" width="1160" height="264" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="64" y="394" font-size="20" font-weight="600" fill="#065F46">MVCC: the reader takes the old version and never waits</text>

  <line x1="700" y1="424" x2="700" y2="584" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 6"/>
  <line x1="560" y1="488" x2="560" y2="584" stroke="#059669" stroke-width="2"/>

  <text x="130" y="463" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Bob</text>
  <text x="130" y="523" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Alice</text>

  <rect x="300" y="434" width="400" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="500" y="463" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Bob writes version 2</text>

  <rect x="300" y="494" width="260" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="430" y="523" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">reads version 1</text>

  <text x="720" y="523" font-size="20" font-weight="600" fill="#065F46">done before Bob commits</text>

  <line x1="220" y1="574" x2="1160" y2="574" stroke="#475569" stroke-width="2" marker-end="url(#db8-slate)"/>
  <text x="560" y="606" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Alice done</text>
  <text x="700" y="606" font-size="20" fill="#334155" text-anchor="middle">Bob commits</text>

  
  <rect x="40" y="668" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="704" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Locking makes them take turns. MVCC lets both run, because the old version is still there.</text>
  <text x="620" y="734" font-size="20" fill="#334155" text-anchor="middle">The cost is storage: old versions must be kept until no transaction can still need them.</text>
</svg>