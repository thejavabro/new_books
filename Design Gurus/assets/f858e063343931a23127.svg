<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="680" viewBox="0 0 1240 680" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="util-title util-desc">
<title id="util-title">Paying for peak, using the average</title>
<desc id="util-desc">Four individually defensible sizing decisions compound into a fleet running at a small fraction of what it costs. The useful question is not how to run closer to the limit.</desc>
<defs>
<marker id="util-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="util-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="util-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="util-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="680" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Paying for peak, using the average</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Provisioned capacity is paid for by the hour whether or not anything uses it.</text>
<rect x="40" y="602" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="602" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Size for peak</text>
<path d="M566 146H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 146H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#util-marker-slate)"/>
<rect x="610" y="118" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="152" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the hour that has to work</text>
<circle cx="60" cy="214" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="221" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="186" width="470" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add headroom for a failure</text>
<path d="M566 214H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 214H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#util-marker-slate)"/>
<rect x="610" y="186" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="220" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one instance can be gone</text>
<circle cx="60" cy="282" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="289" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="254" width="470" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="288" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add headroom for a deploy</text>
<path d="M566 282H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 282H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#util-marker-slate)"/>
<rect x="610" y="254" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="288" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">capacity leaves during a rollout</text>
<circle cx="60" cy="350" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="357" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="322" width="470" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="356" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add a little more</text>
<path d="M566 350H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 350H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#util-marker-slate)"/>
<rect x="610" y="322" width="590" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="356" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">over-provisioning beats being the cause of an outage</text>
<rect x="40" y="390" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="390" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="420" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Each step is individually defensible</text><text x="64" y="446" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The product of all four is a fleet running at a small fraction of what it costs,</text><text x="64" y="472" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">far lower than the people paying for it expect. And nothing revisits the number.</text>
<rect x="40" y="506" width="560" height="70" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="533.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Not: how do we run closer to the limit</text><text x="320" y="560.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">risky, and saves a little</text>
<rect x="640" y="506" width="560" height="70" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="533.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">But: how do we stop paying for peak</text><text x="920" y="560.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">in the hours when there is no peak</text>
<text x="66" y="636" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Utilization is the fraction of what you are paying for that is actually doing work.</text>
</svg>