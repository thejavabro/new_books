<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two chapters from top to bottom. Chapter 1, Architecture Fundamentals, has five lessons read in order: What Software Architecture Is, Responsibilities and Boundaries, Coupling, Cohesion, and Dependencies, Quality Attributes, and Constraints and Trade-offs, all using one food-delivery app as the running example. An arrow leads to Chapter 2, Architecture Styles, which has fifteen lessons in four groups: lessons 1 to 4, basic structures (Monolith, Layered, N-Tier, Client-server); lessons 5 to 7, services and events (Microservices, SOA, Event-driven); lessons 8 to 11, code and processing (Pipe-and-Filter, Microkernel, Hexagonal, Clean and Onion); lessons 12 to 15, distribution and scale (Broker, Peer-to-Peer, Space-Based, Serverless).">
