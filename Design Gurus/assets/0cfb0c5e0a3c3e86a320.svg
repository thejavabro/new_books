<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1170" viewBox="0 0 1240 1170" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A Reddit comment thread: a post has top level comments, each comment can have replies to any depth, and every row stores a parent id so the whole thread can be fetched from one shard and assembled on read">
  <defs>
    <filter id="rct-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rct-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rct-k1"><rect x="40" y="150" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k2"><rect x="120" y="310" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k3"><rect x="200" y="430" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k4"><rect x="280" y="550" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k5"><rect x="120" y="670" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k6"><rect x="200" y="790" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k7"><rect x="720" y="420" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="rct-k8"><rect x="720" y="640" width="440" height="90" rx="12"/></clipPath>
    <marker id="rct-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rct-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1170" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a Reddit comment thread is stored</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Replies nest without limit, so each row records its own parent and the tree is rebuilt when the thread is read.</text>



  <g fill="none" stroke-width="2">
    <path d="M340,195 H754" stroke="#059669" marker-end="url(#rct-m-emerald)"/>
    <path d="M60,240 V343 Q60,355 72,355 H114" stroke="#2563EB" marker-end="url(#rct-m-blue)"/>
    <path d="M140,400 V463 Q140,475 152,475 H194" stroke="#2563EB" marker-end="url(#rct-m-blue)"/>
    <path d="M220,520 V583 Q220,595 232,595 H274" stroke="#2563EB" marker-end="url(#rct-m-blue)"/>
    <path d="M60,240 V703 Q60,715 72,715 H114" stroke="#2563EB" marker-end="url(#rct-m-blue)"/>
    <path d="M140,760 V823 Q140,835 152,835 H194" stroke="#2563EB" marker-end="url(#rct-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="547" y="178" fill="#047857">stored as rows</text>
  </g>

  <g filter="url(#rct-lift)">
    <rect x="40" y="150" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="150" width="9" height="90" fill="#059669" clip-path="url(#rct-k1)"/>
  </g>
  <circle cx="78" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,184.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Post</text>
  <text x="190" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">the root of the thread</text>
  <g filter="url(#rct-soft)">
    <rect x="120" y="310" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="120" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#rct-k2)"/>
  </g>
  <circle cx="158" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="184" y="362" font-size="21.5" font-weight="600" fill="#111827">Top level comment</text>
  <g filter="url(#rct-soft)">
    <rect x="200" y="430" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="200" y="430" width="6" height="90" fill="#2563EB" clip-path="url(#rct-k3)"/>
  </g>
  <circle cx="238" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,464.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="264" y="482" font-size="21.5" font-weight="600" fill="#111827">Reply</text>
  <g filter="url(#rct-soft)">
    <rect x="280" y="550" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="280" y="550" width="6" height="90" fill="#2563EB" clip-path="url(#rct-k4)"/>
  </g>
  <circle cx="318" cy="595" r="18" fill="#FFFFFF"/>
  <g transform="translate(307.56,584.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="344" y="602" font-size="21.5" font-weight="600" fill="#111827">Reply to a reply</text>
  <g filter="url(#rct-soft)">
    <rect x="120" y="670" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="120" y="670" width="6" height="90" fill="#2563EB" clip-path="url(#rct-k5)"/>
  </g>
  <circle cx="158" cy="715" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,704.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="184" y="722" font-size="21.5" font-weight="600" fill="#111827">Top level comment</text>
  <g filter="url(#rct-soft)">
    <rect x="200" y="790" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="200" y="790" width="6" height="90" fill="#2563EB" clip-path="url(#rct-k6)"/>
  </g>
  <circle cx="238" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(227.56,824.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="264" y="842" font-size="21.5" font-weight="600" fill="#111827">Reply</text>
  <g filter="url(#rct-soft)">
    <rect x="720" y="420" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="720" y="420" width="6" height="90" fill="#7C3AED" clip-path="url(#rct-k7)"/>
  </g>
  <circle cx="758" cy="465" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,454.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="784" y="472" font-size="21.5" font-weight="600" fill="#111827">parent id</text>
  <text x="940" y="539" font-size="18.5" text-anchor="middle" fill="#6B7280">empty for a top level comment</text>
  <text x="940" y="566" font-size="18.5" text-anchor="middle" fill="#94A3B8">otherwise the comment above it</text>
  <g filter="url(#rct-soft)">
    <rect x="720" y="640" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="720" y="640" width="6" height="90" fill="#D97706" clip-path="url(#rct-k8)"/>
  </g>
  <circle cx="758" cy="685" r="18" fill="#FFFFFF"/>
  <g transform="translate(747.56,674.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="784" y="692" font-size="21.5" font-weight="600" fill="#111827">One query per thread</text>
  <text x="940" y="759" font-size="18.5" text-anchor="middle" fill="#6B7280">every comment for a post is</text>
  <text x="940" y="786" font-size="18.5" text-anchor="middle" fill="#94A3B8">on the same shard, so one read gets it</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M760,170 L760,254 A200,16 0 0 0 1160,254 L1160,170" fill="#D1FAE5"/>
    <ellipse cx="960" cy="170" rx="200" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="960" y="227" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Comments</text>
  <text x="960" y="304" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL, sharded by post id</text>
  <text x="960" y="331" font-size="18.5" text-anchor="middle" fill="#94A3B8">one row per comment</text>

  <rect x="40" y="930" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="955" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="980" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Adjacency list</text>
  <text x="323" y="980" font-size="18.5" fill="#475569">every row stores only its own parent, which makes writing a reply a single insert</text>
  <rect x="64" y="1005" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1030" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Tree built on read</text>
  <text x="323" y="1030" font-size="18.5" fill="#475569">the rows come back flat and the service assembles the nesting before it answers</text>
  <rect x="64" y="1055" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1080" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Depth is unbounded</text>
  <text x="323" y="1080" font-size="18.5" fill="#475569">render the deep tail lazily, or a thread with thousands of replies never finishes</text>
</svg>