<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1880" viewBox="0 0 1240 1880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Notification system high level design: producers call an API gateway, the notification service checks user preferences, templates and the schedule, publishes to Kafka, and channel workers for email, SMS, push and in app deliver through external providers">
