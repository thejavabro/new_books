    <clipPath id="nhl-k11"><rect x="976" y="890" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="nhl-k12"><rect x="64" y="1350" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="nhl-k13"><rect x="470" y="1350" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="nhl-k14"><rect x="876" y="1350" width="300" height="90" rx="12"/></clipPath>
