  <circle cx="838" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="864" y="202" font-size="21.5" font-weight="600" fill="#111827">Notification Service</text>
  <text x="980" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">decides what to send</text>
  <text x="980" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">and which channels to use</text>
  <g filter="url(#nhl-soft)">
    <rect x="64" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nhl-k4)"/>
  </g>
  <circle cx="102" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">User preferences</text>
  <text x="214" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">SQL behind a cache</text>
  <text x="214" y="586" font-size="18.5" text-anchor="middle" fill="#94A3B8">the channels a user allows</text>
  <g filter="url(#nhl-soft)">
    <rect x="456" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="456" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#nhl-k5)"/>
