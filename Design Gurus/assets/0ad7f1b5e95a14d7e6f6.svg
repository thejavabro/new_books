  </defs>

  <rect x="0" y="0" width="1240" height="1880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Notification system: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One service decides what to send and to whom, a queue absorbs the fan out, and a worker per channel talks to the outside world.</text>

  <rect x="40" y="380" width="740" height="399" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Checked on every send</text>
  <rect x="40" y="830" width="1160" height="416" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="860" font-size="19.5" font-weight="600" fill="#5B21B6">Channel workers, and what they record</text>
  <rect x="40" y="1290" width="1160" height="256" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="1320" font-size="19.5" font-weight="600" fill="#B45309">External providers, outside our system</text>

  <g fill="none" stroke-width="2">
    <path d="M280,195 H392" stroke="#2563EB" marker-end="url(#nhl-m-blue)"/>
    <path d="M680,195 H792" stroke="#2563EB" marker-end="url(#nhl-m-blue)"/>
    <path d="M900,312 V336 Q900,348 888,348 H712 Q700,348 700,360 V374" stroke="#2563EB" marker-end="url(#nhl-m-blue)"/>
    <path d="M1000,312 V434" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nhl-m-violet)"/>
    <path d="M1000,606 V824" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nhl-m-violet)"/>
    <path d="M620,1246 V1284" stroke="#D97706" stroke-width="2.5" marker-end="url(#nhl-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="336" y="183" fill="#1D4ED8">notify</text>
    <text x="736" y="183" fill="#1D4ED8">routes</text>
    <text x="800" y="338" fill="#1D4ED8">looks up</text>
    <text x="1110" y="372" fill="#5B21B6">enqueue</text>
    <text x="1090" y="700" fill="#5B21B6">fan out</text>
    <text x="762" y="1272" fill="#B45309">hand off to the provider</text>
  </g>

