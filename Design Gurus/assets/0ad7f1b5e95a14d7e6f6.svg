  <g transform="translate(483.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="520" y="492" font-size="21.5" font-weight="600" fill="#111827">Templates</text>
  <text x="606" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">SQL behind a cache</text>
  <text x="606" y="586" font-size="18.5" text-anchor="middle" fill="#94A3B8">one per notification type</text>
  <g filter="url(#nhl-soft)">
    <rect x="260" y="610" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="260" y="610" width="6" height="90" fill="#2563EB" clip-path="url(#nhl-k6)"/>
  </g>
  <circle cx="298" cy="655" r="18" fill="#FFFFFF"/>
  <g transform="translate(287.56,644.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="324" y="662" font-size="21.5" font-weight="600" fill="#111827">Scheduler</text>
  <text x="410" y="729" font-size="18.5" text-anchor="middle" fill="#6B7280">SQL of future sends</text>
  <text x="410" y="756" font-size="18.5" text-anchor="middle" fill="#94A3B8">delayed and batched</text>
  <g filter="url(#nhl-soft)">
    <rect x="840" y="440" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="440" width="6" height="90" fill="#7C3AED" clip-path="url(#nhl-k7)"/>
  </g>
  <circle cx="878" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,474.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="904" y="492" font-size="21.5" font-weight="600" fill="#111827">Kafka</text>
  <text x="1000" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">the notification queue</text>
  <text x="1000" y="586" font-size="18.5" text-anchor="middle" fill="#94A3B8">absorbs every burst</text>
  <g filter="url(#nhl-soft)">
    <rect x="64" y="890" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="890" width="6" height="90" fill="#7C3AED" clip-path="url(#nhl-k8)"/>
  </g>
  <circle cx="102" cy="935" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,924.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="128" y="942" font-size="21.5" font-weight="600" fill="#111827">Email</text>
  <text x="164" y="1009" font-size="18.5" text-anchor="middle" fill="#6B7280">sender worker</text>
  <g filter="url(#nhl-soft)">
    <rect x="368" y="890" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="368" y="890" width="6" height="90" fill="#7C3AED" clip-path="url(#nhl-k9)"/>
  </g>
  <circle cx="406" cy="935" r="18" fill="#FFFFFF"/>
  <g transform="translate(395.56,924.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="432" y="942" font-size="21.5" font-weight="600" fill="#111827">SMS</text>
  <text x="468" y="1009" font-size="18.5" text-anchor="middle" fill="#6B7280">sender worker</text>
  <g filter="url(#nhl-soft)">
    <rect x="672" y="890" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="672" y="890" width="6" height="90" fill="#7C3AED" clip-path="url(#nhl-k10)"/>
  </g>
  <circle cx="710" cy="935" r="18" fill="#FFFFFF"/>
  <g transform="translate(699.56,924.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="736" y="942" font-size="21.5" font-weight="600" fill="#111827">Push</text>
  <text x="772" y="1009" font-size="18.5" text-anchor="middle" fill="#6B7280">sender worker</text>
  <g filter="url(#nhl-soft)">
    <rect x="976" y="890" width="200" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="976" y="890" width="6" height="90" fill="#7C3AED" clip-path="url(#nhl-k11)"/>
  </g>
  <circle cx="1014" cy="935" r="18" fill="#FFFFFF"/>
  <g transform="translate(1003.56,924.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="1040" y="942" font-size="21.5" font-weight="600" fill="#111827">In-app</text>
  <text x="1076" y="1009" font-size="18.5" text-anchor="middle" fill="#6B7280">notifier worker</text>
  <g filter="url(#nhl-soft)">
    <rect x="64" y="1350" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="1350" width="6" height="90" fill="#D97706" clip-path="url(#nhl-k12)"/>
  </g>
  <circle cx="102" cy="1395" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,1384.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="128" y="1402" font-size="21.5" font-weight="600" fill="#111827">SMTP server</text>
  <text x="214" y="1469" font-size="18.5" text-anchor="middle" fill="#6B7280">SendGrid, Mailgun</text>
  <g filter="url(#nhl-soft)">
    <rect x="470" y="1350" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="470" y="1350" width="6" height="90" fill="#D97706" clip-path="url(#nhl-k13)"/>
  </g>
  <circle cx="508" cy="1395" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,1384.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="534" y="1402" font-size="21.5" font-weight="600" fill="#111827">SMS gateway</text>
  <text x="620" y="1469" font-size="18.5" text-anchor="middle" fill="#6B7280">Twilio, Nexmo</text>
  <g filter="url(#nhl-soft)">
    <rect x="876" y="1350" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="876" y="1350" width="6" height="90" fill="#D97706" clip-path="url(#nhl-k14)"/>
  </g>
  <circle cx="914" cy="1395" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,1384.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="940" y="1402" font-size="21.5" font-weight="600" fill="#111827">Push processor</text>
  <text x="1026" y="1469" font-size="18.5" text-anchor="middle" fill="#6B7280">APNs, FCM</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M260,1070 L260,1144 A150,16 0 0 0 560,1144 L560,1070" fill="#E2E8F0"/>
    <ellipse cx="410" cy="1070" rx="150" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="410" y="1122" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Notification log</text>
  <text x="410" y="1194" font-size="18.5" text-anchor="middle" fill="#6B7280">every attempt, with status</text>
  <text x="410" y="1221" font-size="18.5" text-anchor="middle" fill="#94A3B8">what a retry reads</text>
  <g stroke="#64748B" stroke-width="1.5">
    <path d="M700,1070 L700,1144 A150,16 0 0 0 1000,1144 L1000,1070" fill="#E2E8F0"/>
    <ellipse cx="850" cy="1070" rx="150" ry="16" fill="#F8FAFC"/>
  </g>
  <text x="850" y="1122" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">In-app store</text>
  <text x="850" y="1194" font-size="18.5" text-anchor="middle" fill="#6B7280">unread per user</text>
  <text x="850" y="1221" font-size="18.5" text-anchor="middle" fill="#94A3B8">behind a cache</text>

  <rect x="40" y="1590" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1615" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1640" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">One decision point</text>
  <text x="323" y="1640" font-size="18.5" fill="#475569">preferences and templates are checked once, before anything is queued</text>
  <rect x="64" y="1665" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">The queue is the buffer</text>
  <text x="323" y="1690" font-size="18.5" fill="#475569">a million events land on Kafka, and the workers drain it at whatever rate they can</text>
  <rect x="64" y="1715" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">One worker per channel</text>
  <text x="323" y="1740" font-size="18.5" fill="#475569">a dead SMS provider stops SMS, and email and push carry on unaffected</text>
  <rect x="64" y="1765" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="1790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Everything is logged</text>
  <text x="323" y="1790" font-size="18.5" fill="#475569">the log is what a retry, a bounce and a support question all read from</text>
</svg>