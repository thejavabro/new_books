  <text x="104" y="202" font-size="21.5" font-weight="600" fill="#111827">Producer</text>
  <text x="160" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">any service with news</text>
  <text x="160" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">calls one endpoint</text>
  <g filter="url(#nhl-soft)">
    <rect x="400" y="150" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="400" y="150" width="6" height="90" fill="#2563EB" clip-path="url(#nhl-k2)"/>
  </g>
  <circle cx="438" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,184.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="464" y="202" font-size="21.5" font-weight="600" fill="#111827">API Gateway</text>
  <text x="540" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">auth and rate limits</text>
  <g filter="url(#nhl-lift)">
