<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="688" viewBox="0 0 1240 688" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A table comparing short polling, long polling, WebSockets and server-sent events on direction, what they run over, when the client learns about an update, the cost per idle client, how well they pass through proxies and old browsers, and what happens after the connection drops.">
  <rect x="0" y="0" width="1240" height="688" fill="#FFFFFF"/>
  <defs>
    <marker id="rtd3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="rtd3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="rtd3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="rtd3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="rtd3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rtd3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="rtd3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="rtd3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="rtd3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The four options, side by side</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="56" width="215" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">Short polling</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="56" width="215" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Long polling</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="56" width="215" height="40" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">WebSockets</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="56" width="215" height="40" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="84" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">Server-sent events</text>
  <rect x="24" y="106" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="153" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Direction</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="106" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="153" font-size="19" fill="#0F172A" text-anchor="middle">Client asks</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="106" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="139" font-size="19" fill="#0F172A" text-anchor="middle">Client asks,</text>
  <text x="656.5" y="165" font-size="19" fill="#0F172A" text-anchor="middle">server waits</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="106" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="153" font-size="19" fill="#0F172A" text-anchor="middle">Both ways</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="106" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="153" font-size="19" fill="#0F172A" text-anchor="middle">Server to client</text>
  <rect x="24" y="196" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="243" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Runs over</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="196" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="243" font-size="19" fill="#0F172A" text-anchor="middle">Plain HTTP</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="196" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="243" font-size="19" fill="#0F172A" text-anchor="middle">Plain HTTP</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="196" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="229" font-size="19" fill="#0F172A" text-anchor="middle">Its own protocol,</text>
  <text x="881.5" y="255" font-size="19" fill="#0F172A" text-anchor="middle">starts as HTTP</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="196" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="243" font-size="19" fill="#0F172A" text-anchor="middle">Plain HTTP</text>
  <rect x="24" y="286" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="319" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">When the client</text>
  <text x="48" y="347" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">learns of an update</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="286" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="333" font-size="19" fill="#0F172A" text-anchor="middle">At the next poll</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="286" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="333" font-size="19" fill="#0F172A" text-anchor="middle">At once</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="286" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="333" font-size="19" fill="#0F172A" text-anchor="middle">At once</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="286" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="333" font-size="19" fill="#0F172A" text-anchor="middle">At once</text>
  <rect x="24" y="376" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="423" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Cost per idle client</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="376" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="409" font-size="19" fill="#0F172A" text-anchor="middle">Nothing</text>
  <text x="431.5" y="435" font-size="19" fill="#0F172A" text-anchor="middle">between polls</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="376" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="409" font-size="19" fill="#0F172A" text-anchor="middle">One held</text>
  <text x="656.5" y="435" font-size="19" fill="#0F172A" text-anchor="middle">connection</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="376" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="409" font-size="19" fill="#0F172A" text-anchor="middle">One held</text>
  <text x="881.5" y="435" font-size="19" fill="#0F172A" text-anchor="middle">connection</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="376" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="409" font-size="19" fill="#0F172A" text-anchor="middle">One held</text>
  <text x="1106.5" y="435" font-size="19" fill="#0F172A" text-anchor="middle">connection</text>
  <rect x="24" y="466" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="499" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Proxies and</text>
  <text x="48" y="527" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">older browsers</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="466" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="513" font-size="19" fill="#0F172A" text-anchor="middle">Always fine</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="466" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="499" font-size="19" fill="#0F172A" text-anchor="middle">Almost always</text>
  <text x="656.5" y="525" font-size="19" fill="#0F172A" text-anchor="middle">fine</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="466" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="499" font-size="19" fill="#0F172A" text-anchor="middle">Proxy must allow</text>
  <text x="881.5" y="525" font-size="19" fill="#0F172A" text-anchor="middle">the upgrade</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="466" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="499" font-size="19" fill="#0F172A" text-anchor="middle">Fine, if nothing</text>
  <text x="1106.5" y="525" font-size="19" fill="#0F172A" text-anchor="middle">buffers it</text>
  <rect x="24" y="556" width="290" height="80" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="589" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">After the</text>
  <text x="48" y="617" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">connection drops</text>
  <g filter="url(#rtd3-soft)"><rect x="324" y="556" width="215" height="80" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="431.5" y="589" font-size="19" fill="#0F172A" text-anchor="middle">Next poll,</text>
  <text x="431.5" y="615" font-size="19" fill="#0F172A" text-anchor="middle">nothing to do</text>
  <g filter="url(#rtd3-soft)"><rect x="549" y="556" width="215" height="80" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="656.5" y="589" font-size="19" fill="#0F172A" text-anchor="middle">Client asks</text>
  <text x="656.5" y="615" font-size="19" fill="#0F172A" text-anchor="middle">again</text>
  <g filter="url(#rtd3-soft)"><rect x="774" y="556" width="215" height="80" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="881.5" y="589" font-size="19" fill="#0F172A" text-anchor="middle">You write the</text>
  <text x="881.5" y="615" font-size="19" fill="#0F172A" text-anchor="middle">reconnect code</text>
  <g filter="url(#rtd3-soft)"><rect x="999" y="556" width="215" height="80" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1106.5" y="589" font-size="19" fill="#0F172A" text-anchor="middle">Browser reconnects</text>
  <text x="1106.5" y="615" font-size="19" fill="#0F172A" text-anchor="middle">by itself</text>
  <text x="620" y="676" font-size="19" fill="#64748B" text-anchor="middle">Direction is the first question. If the client only receives, you do not need WebSockets.</text>
</svg>