<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A spike of 5,000 writes per second arrives for 60 seconds. The extra 3,000 per second wait in the queue, which grows to 180,000 messages. The database keeps consuming 2,000 writes per second. When traffic falls to 500 per second, the backlog shrinks by 1,500 per second and is gone in about 120 seconds.">
  <defs>
    <filter id="sva4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sva4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sva4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sva4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sva4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="sva4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="sva4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A queue absorbs a traffic spike</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The database handles 2,000 writes per second. For 60 seconds, 5,000 arrive.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#sva4-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#sva4-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#sva4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#sva4-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#sva4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Spike</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">5,000 writes/s</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">for 60 seconds</text>
  <g filter="url(#sva4-lift)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="343" y="140" width="9" height="90" fill="#D97706" clip-path="url(#sva4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Queue grows</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">3,000/s x 60 s</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">= 180,000 waiting</text>
  <g filter="url(#sva4-soft)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#sva4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Steady DB</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">still takes</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">2,000 writes/s</text>
  <g filter="url(#sva4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#sva4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Backlog clears</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">1,500/s faster,</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">gone in 120 s</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Without a queue</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">about 3,000 writes per second fail or time out during the spike</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">With a queue</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">the burst becomes a longer queue, and nothing is lost</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">The cost</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">queued writes are delayed, so the data is eventually consistent</text>
</svg>