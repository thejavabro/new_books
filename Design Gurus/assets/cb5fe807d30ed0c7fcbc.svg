<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="674" viewBox="0 0 1240 674" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array before the window starts moving">
<defs>
<filter id="lc-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="674" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the longest stretch of [10, 1, 2, 4, 7] within a range of 5?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Every pair inside the stretch has to differ by no more than the limit</text>
<rect x="40" y="106" width="1160" height="420" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The whole stretch fits when its largest and smallest differ by no more than the limit</text>
<text x="276" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="298" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="356" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="356" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="430" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="488" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="488" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="562" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="694" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="752" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="752" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="826" y="160" width="116" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="884" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="884" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="540" y="426" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">window sorted</text>
<text x="568" y="425" font-size="18" fill="#475569">the window is empty</text>
<text x="620" y="290" text-anchor="middle" font-size="19.5" font-weight="600" fill="#475569">Only the smallest and largest of the window matter, so the set is kept sorted</text>
<text x="620" y="318" text-anchor="middle" font-size="18" fill="#475569">Both of them sit at the ends of the sorted row, which is why they are free to read</text>
<rect x="40" y="548" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="588" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Checking every pair is not needed, only the two extremes</text>
<text x="620" y="620" text-anchor="middle" font-size="18.5" fill="#475569">An ordered set hands back its smallest and largest without any searching</text>
</svg>