<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="642" viewBox="0 0 1240 642" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Exactly-once is not a delivery mode: it is at-least-once delivery combined with a deduplication store that remembers which message ids have already been processed">
  <rect x="0" y="0" width="1240" height="642" fill="#FFFFFF"/>
  <defs>
    <marker id="ms2-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="ms2-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Exactly-once is not a delivery mode. It is something you assemble.</text>

  <g filter="url(#ms2-soft)">
    <rect x="70" y="100" width="340" height="120" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="470" y="100" width="340" height="120" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="870" y="100" width="300" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="240" y="140" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">At-least-once delivery</text>
  <text x="240" y="172" font-size="20" fill="#92400E" text-anchor="middle">the broker retries until</text>
  <text x="240" y="198" font-size="20" fill="#92400E" text-anchor="middle">it sees an ack</text>

  <text x="640" y="140" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">A dedup store</text>
  <text x="640" y="172" font-size="20" fill="#5B21B6" text-anchor="middle">remembers every id it</text>
  <text x="640" y="198" font-size="20" fill="#5B21B6" text-anchor="middle">has already processed</text>

  <text x="1020" y="140" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Exactly-once effect</text>
  <text x="1020" y="172" font-size="20" fill="#065F46" text-anchor="middle">the work happens once,</text>
  <text x="1020" y="198" font-size="20" fill="#065F46" text-anchor="middle">however many arrive</text>

  <text x="440" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">+</text>
  <text x="840" y="168" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">=</text>

  
  <text x="560" y="330" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">m-42 delivered twice</text>

  <line x1="254" y1="380" x2="322" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#ms2-slate)"/>
  <line x1="524" y1="380" x2="592" y2="380" stroke="#D97706" stroke-width="2" marker-end="url(#ms2-slate)"/>
  <line x1="814" y1="380" x2="882" y2="380" stroke="#475569" stroke-width="2" marker-end="url(#ms2-slate)"/>

  <g filter="url(#ms2-soft)">
    <rect x="60" y="345" width="190" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="330" y="345" width="190" height="70" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="600" y="345" width="210" height="70" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="890" y="305" width="280" height="150" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="155" y="387" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Producer</text>
  <text x="425" y="387" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Broker</text>
  <text x="705" y="387" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Consumer</text>
  <text x="1030" y="340" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Dedup store</text>

  <rect x="910" y="354" width="240" height="40" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="381" font-size="20" fill="#065F46" text-anchor="middle">m-42 is new: process</text>
  <rect x="910" y="402" width="240" height="40" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="1030" y="429" font-size="20" fill="#B91C1C" text-anchor="middle">m-42 again: drop</text>

  
  <rect x="50" y="520" width="1140" height="92" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="620" y="556" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">There is no magic mode. Exactly-once is at-least-once plus a record of what you already did.</text>
  <text x="620" y="586" font-size="20" fill="#065F46" text-anchor="middle">Which makes the dedup key and how long you keep it the real design decisions.</text>
</svg>