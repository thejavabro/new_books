<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="624" viewBox="0 0 1240 624" role="img" aria-label="A monolith is one deployable unit holding every feature and one database. Microservices split it into services that each own their data and can be deployed and scaled on their own, at the cost of network calls between them.">
