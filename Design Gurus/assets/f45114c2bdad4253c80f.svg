  <text x="620" y="582" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Split where the scaling requirements differ. Fifteen services for a system with three features is over-engineering.</text>
