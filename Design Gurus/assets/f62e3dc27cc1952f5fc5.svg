<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1038" viewBox="0 0 1240 1038" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every hard-part guarantee needs four boundaries: the scope it covers, the duration it lasts, the exact failure response when it cannot be honored, and the cost it accepts. Without all four the answer is still a preference.">
  <defs>
    <filter id="py-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="py-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="py-k1"><rect x="76" y="146" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="py-k2"><rect x="76" y="342" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="py-k3"><rect x="76" y="538" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="py-k4"><rect x="76" y="734" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1038" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Every guarantee needs four boundaries</text>
  <g transform="translate(556,66) scale(0.5)" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="580" y="77" font-size="15.5" fill="#6B7280">the question it answers</text>
  <g transform="translate(800,66) scale(0.5)" fill="none" stroke="#DB2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="824" y="77" font-size="15.5" fill="#6B7280">an example from this chapter</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#py-soft)">
    <rect x="76" y="146" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#py-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Scope</text>
  <text x="1176" y="198" text-anchor="end" font-size="15.5" fill="#6B7280">boundary 1 of 4</text>
  <g transform="translate(78,251) scale(0.5)" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">Who and what does it cover?</text>
  <g transform="translate(78,277) scale(0.5)" fill="none" stroke="#DB2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">One caller and one operation, or one API key, or one tenant.</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#py-soft)">
    <rect x="76" y="342" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#2563EB" clip-path="url(#py-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Duration</text>
  <text x="1176" y="394" text-anchor="end" font-size="15.5" fill="#6B7280">boundary 2 of 4</text>
  <g transform="translate(78,447) scale(0.5)" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">How long does it last?</text>
  <g transform="translate(78,473) scale(0.5)" fill="none" stroke="#DB2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">24 hours for an idempotency result, 5 minutes for a freshness token.</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#py-soft)">
    <rect x="76" y="538" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#2563EB" clip-path="url(#py-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Failure behavior</text>
  <text x="1176" y="590" text-anchor="end" font-size="15.5" fill="#6B7280">boundary 3 of 4</text>
  <g transform="translate(78,643) scale(0.5)" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">What response says it cannot be honored?</text>
  <g transform="translate(78,669) scale(0.5)" fill="none" stroke="#DB2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">400 idempotency_key_reused, 412 precondition_failed, 429, 503.</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#py-lift)">
    <rect x="76" y="734" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="76" y="734" width="9" height="90" fill="#2563EB" clip-path="url(#py-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Cost</text>
  <text x="1176" y="786" text-anchor="end" font-size="15.5" fill="#6B7280">boundary 4 of 4</text>
  <g transform="translate(78,839) scale(0.5)" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">What does it make harder?</text>
  <g transform="translate(78,865) scale(0.5)" fill="none" stroke="#DB2777" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Storage, coordination, capacity, or a promise you cannot remove later.</text>

  
  <rect x="40" y="922" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="967" text-anchor="middle" font-size="16" fill="#475569">If no cost is named, the answer is probably still a preference.</text>
</svg>