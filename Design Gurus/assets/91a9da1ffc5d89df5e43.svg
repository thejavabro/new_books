<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="money-title money-desc">
<title id="money-title">Why money is different</title>
<desc id="money-desc">Three properties separate billing from every other system in this course, and they are why the usual instinct toward eventual correctness is wrong here.</desc>
<defs>
<marker id="money-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="money-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="money-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="money-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="748" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why money is different</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Three properties separate billing from every other system in this course.</text>
<rect x="40" y="670" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="670" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="149.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Every other system here can be made eventually correct.</text><text x="64" y="178.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">This one has to be provably correct</text>
<circle cx="60" cy="250" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="257" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="218" width="400" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="290" y="256" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">There is no acceptable error rate</text>
<path d="M496 250H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 250H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#money-marker-slate)"/>
<rect x="540" y="218" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="243.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three nines of availability is a reasonable position.</text><text x="560" y="268.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Three nines of charging accuracy ends a company</text>
<circle cx="60" cy="322" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="329" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="290" width="400" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="328" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The errors are asymmetric</text>
<path d="M496 322H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 322H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#money-marker-slate)"/>
<rect x="540" y="290" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="315.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a double charge produces a refund and a support contact.</text><text x="560" y="340.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A missed charge produces revenue nobody notices</text>
<circle cx="60" cy="394" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="401" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="362" width="400" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="290" y="400" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Correctness must be demonstrable</text>
<path d="M496 394H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 394H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#money-marker-slate)"/>
<rect x="540" y="362" width="650" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="387.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it is not enough for the number to be right. Somebody has to</text><text x="560" y="412.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">show why, from records, months later</text>
<text x="40" y="460" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The dangerous one is not the loud one</text>
<rect x="40" y="478" width="560" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="478" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="513" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">double charge</text><text x="64" y="539" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">visible, refunded, costly in trust</text>
<rect x="640" y="478" width="560" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="478" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="664" y="513" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">missed charge</text><text x="664" y="539" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">silent, undetected, compounds every month</text>
<rect x="40" y="586" width="1160" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="621" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The migration is the easy half. The hard half is that the requirement is exactness</text>
<text x="66" y="704" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Almost every instinct this course has built is about accepting approximation.</text>
</svg>