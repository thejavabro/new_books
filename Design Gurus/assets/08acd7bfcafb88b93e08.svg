<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A row of health checks sent to one server every ten seconds. Two good answers, then four failures, then good answers again. The server is removed from the pool after three failures in a row and added back after two good answers.">
  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>
  <defs>
    <marker id="lb2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="lb2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lb2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="lb2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="lb2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="lb2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="lb2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="lb2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A health check every few seconds decides which servers get traffic</text>
  <text x="620" y="70" font-size="19" fill="#64748B" text-anchor="middle">the load balancer keeps asking, and reacts only after several answers in a row</text>
  <text x="120" y="207" font-size="20" font-weight="700" fill="#0F172A" text-anchor="end">server 3</text>
  <path d="M170 200 H1040" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <circle cx="210" cy="200" r="23" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <path d="M201,200 L208,208 L220,192" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="308" cy="200" r="23" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <path d="M299,200 L306,208 L318,192" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="406" cy="200" r="23" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <path d="M398,192 L414,208 M414,192 L398,208" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="504" cy="200" r="23" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <path d="M496,192 L512,208 M512,192 L496,208" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="602" cy="200" r="23" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <path d="M594,192 L610,208 M610,192 L594,208" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="700" cy="200" r="23" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.2"/>
  <path d="M692,192 L708,208 M708,192 L692,208" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="798" cy="200" r="23" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <path d="M789,200 L796,208 L808,192" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="896" cy="200" r="23" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <path d="M887,200 L894,208 L906,192" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <circle cx="994" cy="200" r="23" fill="#ECFDF5" stroke="#059669" stroke-width="2.2"/>
  <path d="M985,200 L992,208 L1004,192" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <g filter="url(#lb2-soft)"><rect x="330" y="96" width="480" height="62" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="570" y="134" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">three failures: no more traffic for it</text>
  <path d="M602 158 V172" fill="none" stroke="#DC2626" stroke-width="2"/>
  <g filter="url(#lb2-soft)"><rect x="700" y="268" width="470" height="62" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="935" y="306" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">good answers again: traffic returns</text>
  <path d="M896 228 V268" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="602" y="258" font-size="18" fill="#64748B" text-anchor="middle">one check every few seconds</text>
  <text x="120" y="352" font-size="19" fill="#64748B" text-anchor="start">One missed answer can be a slow network, not a broken server. That is why the load balancer waits.</text>
</svg>