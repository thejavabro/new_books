<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="838" viewBox="0 0 1240 838" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="budget-title budget-desc">
<title id="budget-title">The error budget</title>
<desc id="budget-desc">The inverse of the objective is a quantity you are allowed to spend. Looking at it that way lets unreliability enter a conversation with the people who allocate other quantities.</desc>
<defs>
<marker id="budget-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="budget-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="budget-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="budget-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="838" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The error budget</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The inverse of the objective is a quantity you are allowed to spend.</text>
<rect x="40" y="760" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="760" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<defs><clipPath id="clip-40-130"><rect x="40" y="130" width="1100" height="46" rx="10"/></clipPath></defs><rect x="40" y="130" width="1100" height="46" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="40.0" y="130" width="1009.8" height="46" fill="#06AC80" clip-path="url(#clip-40-130)"/><rect x="1049.8" y="130" width="90.2" height="46" fill="#F25461" clip-path="url(#clip-40-130)"/><rect x="40" y="130" width="1100" height="46" rx="10" fill="none" stroke="#5EC9EC" stroke-width="2"/>
<text x="545" y="160" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">99.9% the objective</text>
<text x="1095" y="206" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">0.1%</text>
<text x="1095" y="232" font-size="19" font-weight="400" fill="#A83147" text-anchor="middle">the budget</text>
<text x="40" y="232" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">the red segment is drawn large enough to see; at 0.1% it would be one pixel</text>
<rect x="40" y="262" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="262" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="301" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Spending the budget is not a failure. It is a quantity you are allowed to allocate.</text>
<circle cx="60" cy="380" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="387" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="348" width="428" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="306" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Whether to ship</text>
<path d="M526 380H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 380H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#budget-marker-slate)"/>
<rect x="570" y="348" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="373.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">budget remaining means risk is affordable; budget gone</text><text x="590" y="398.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">means the next change improves reliability</text>
<circle cx="60" cy="456" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="463" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="424" width="428" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="306" y="462" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Whether to invest</text>
<path d="M526 456H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 456H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#budget-marker-slate)"/>
<rect x="570" y="424" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="449.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a budget never touched means the system is more</text><text x="590" y="474.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reliable than it needs to be</text>
<circle cx="60" cy="532" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="539" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="500" width="428" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="306" y="538" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">How to settle the argument</text>
<path d="M526 532H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 532H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#budget-marker-slate)"/>
<rect x="570" y="500" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="525.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">features against reliability stops being a matter</text><text x="590" y="550.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">of temperament</text>
<rect x="40" y="586" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="586" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="625" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">It turns a disagreement about values into a reading off a dashboard.</text>
<rect x="40" y="668" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="668" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="707" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">On one condition: the response is agreed before the budget is spent.</text>
<text x="66" y="794" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">An unspent budget is a finding, not a trophy.</text>
</svg>