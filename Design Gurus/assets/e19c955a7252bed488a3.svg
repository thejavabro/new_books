<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="786" viewBox="0 0 1240 786" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="highlevel-title highlevel-desc">
<title id="highlevel-title">Deliberately shallow, and complete</title>
<desc id="highlevel-desc">Complete means a request can be traced from the user to storage and back with nothing missing in the middle. What to resist is the detail that feels like expertise.</desc>
<defs>
<marker id="highlevel-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="highlevel-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="highlevel-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="highlevel-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="786" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Deliberately shallow, and complete</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The goal of this block is a complete picture, not an impressive one.</text>
<rect x="40" y="708" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="708" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Follow one path end to end</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#highlevel-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a complete narrow path beats a broad incomplete one,</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">because it can be deepened</text>
<rect x="40" y="194" width="480" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Name components by role</text>
<path d="M526 226H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 226H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#highlevel-marker-slate)"/>
<rect x="570" y="194" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a message queue, not a brand.</text><text x="590" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The role is what you design with</text>
<rect x="40" y="270" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Say the data model early</text>
<path d="M526 302H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 302H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#highlevel-marker-slate)"/>
<rect x="570" y="270" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the access patterns constrain everything downstream</text>
<rect x="40" y="364" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="364" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="399" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Do not optimize anything yet</text><text x="64" y="425" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Caching, sharding and replication are deep-dive material. Spending them here</text>
<rect x="40" y="476" width="1160" height="116" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="476" width="5" height="116" rx="2.5" fill="#39D5AA"/><text x="64" y="514" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">End the block by naming where it breaks first</text><text x="64" y="540" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">It shows you know where the difficulty is, gives the interviewer an easy way to</text><text x="64" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">choose the deep dive, and ensures whichever they pick was one you nominated.</text>
<rect x="40" y="620" width="1160" height="62" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="620" y="657" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Which changes the dynamic from being examined to running a review</text>
<text x="66" y="742" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Leaves you with nothing to go deeper into.</text>
</svg>