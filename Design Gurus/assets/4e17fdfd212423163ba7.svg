<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1150" viewBox="0 0 1240 1150" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="C4 container view. Inside the food-delivery platform boundary are six containers: the Customer app and Courier app (mobile apps), the Restaurant app (tablet app), the backend application (Python, Flask), the matching worker (a Python process) and the PostgreSQL database. Each app calls the backend over JSON and HTTPS. The backend reads and writes PostgreSQL over SQL; the matching worker reads orders and writes assignments over SQL. The backend charges cards through the external payment provider and sends messages through the external push and SMS services, both over HTTPS.">
