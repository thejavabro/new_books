<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="790" viewBox="0 0 1240 790" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The numbers with both running rows empty">
<defs>
<filter id="mp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="790" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which run of neighbouring numbers multiplies to the most?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A negative number flips large into small, so the smallest has to be carried too</text>
<rect x="40" y="106" width="1160" height="538" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Two running values per position: the largest product ending here, and the smallest</text>
<text x="310" y="250" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the numbers</text>
<rect x="334" y="212" width="128" height="60" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<text x="398" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-2</text>
<rect x="482" y="212" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="546" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="630" y="212" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="694" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="778" y="212" width="128" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="842" y="249.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-4</text>
<text x="310" y="368" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">largest ending here</text>
<rect x="334" y="330" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="398" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="482" y="330" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="546" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="630" y="330" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="694" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="778" y="330" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="842" y="367.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="310" y="466" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">smallest ending here</text>
<rect x="334" y="428" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="398" y="465.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="482" y="428" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="546" y="465.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="630" y="428" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="694" y="465.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="778" y="428" width="128" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="842" y="465.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="280" y="518" width="680" height="48" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="549" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">a big negative is one multiplication away from being the answer</text>
<text x="620" y="596" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Carrying only the largest would throw away exactly what a later negative needs</text>
<rect x="40" y="656" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="696" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The smallest product so far is not junk, it is a candidate in waiting</text>
<text x="620" y="728" text-anchor="middle" font-size="18.5" fill="#475569">Multiply it by a negative and it becomes the largest</text>
</svg>