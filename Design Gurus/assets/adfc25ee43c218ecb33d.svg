<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="distance-title distance-desc">
<title id="distance-title">What distance actually costs</title>
<desc id="distance-desc">Distance has a floor set by physics, and the computation is short enough to do out loud. A transatlantic round trip cannot go below about fifty-five milliseconds, and measured paths run about a third higher.</desc>
<defs>
<marker id="distance-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="distance-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="distance-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="distance-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="746" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What distance actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Distance has a floor set by physics, and it is worth computing rather than looking up.</text>
<rect x="40" y="668" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="668" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="151" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Light in fiber: about 200,000 km per second, or 1 ms per 200 km each way</text><text x="64" y="177" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">The same number stated as a round trip: 1 ms per 100 km</text>
<rect x="40" y="218" width="560" height="46" rx="9" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="56" y="248" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">London to New York</text><text x="584" y="248" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">5,500 km</text>
<rect x="40" y="270" width="560" height="46" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="300" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">one way = 5,500 / 200,000</text><text x="584" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">27.5 ms</text>
<rect x="40" y="322" width="560" height="46" rx="9" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="56" y="352" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">round trip floor</text><text x="584" y="352" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">55 ms</text>
<rect x="640" y="218" width="560" height="150" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="218" width="5" height="150" rx="2.5" fill="#F3CF6A"/><text x="664" y="260" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Measured round trips are usually in the seventies,</text><text x="664" y="286" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">because fiber does not run in straight lines.</text><text x="664" y="312" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A working rule: real latency is the computed</text><text x="664" y="338" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">floor plus about a third</text>
<text x="40" y="412" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two consequences, and both settle arguments</text>
<rect x="40" y="430" width="560" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="430" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="469" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">You cannot optimize below the floor.</text><text x="64" y="495" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">If the budget needs 10 ms across an ocean,</text><text x="64" y="521" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">the data has to be nearer</text>
<rect x="640" y="430" width="560" height="118" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="430" width="5" height="118" rx="2.5" fill="#AC8BE8"/><text x="664" y="469" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each round trip is charged separately.</text><text x="664" y="495" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Three sequential cross-region calls</text><text x="664" y="521" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">pay three times</text>
<rect x="40" y="572" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="613" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The second is usually where the latency goes, and the fix is removing round trips.</text>
<text x="66" y="702" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Worth computing rather than looking up, because the computation tells you what is achievable.</text>
</svg>