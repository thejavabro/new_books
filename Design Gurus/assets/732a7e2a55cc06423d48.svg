<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="618" viewBox="0 0 1240 618" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of CP stores such as HBase, ZooKeeper, etcd and Spanner against AP stores such as Cassandra, DynamoDB, Riak and CouchDB, covering what happens during a partition, what the user sees, what repair is needed afterwards, and what each is good for.">
  <rect x="0" y="0" width="1240" height="618" fill="#FFFFFF"/>
  <defs>
    <marker id="cp5-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cp5-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cp5-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cp5-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cp5-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="cp5-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="cp5-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="cp5-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="cp5-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Systems usually called CP and systems usually called AP</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="56" width="436" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">CP: consistency first</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="56" width="436" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">AP: availability first</text>
  <rect x="24" y="106" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="155" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Usual examples</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="106" width="436" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="141" font-size="19" fill="#0F172A" text-anchor="middle">HBase, ZooKeeper,</text>
  <text x="552" y="167" font-size="19" fill="#0F172A" text-anchor="middle">etcd, Google Spanner</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="106" width="436" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="141" font-size="19" fill="#0F172A" text-anchor="middle">Cassandra, DynamoDB,</text>
  <text x="998" y="167" font-size="19" fill="#0F172A" text-anchor="middle">Riak, CouchDB</text>
  <rect x="24" y="200" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="249" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">During a partition</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="200" width="436" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="235" font-size="19" fill="#0F172A" text-anchor="middle">The side without a majority</text>
  <text x="552" y="261" font-size="19" fill="#0F172A" text-anchor="middle">stops answering</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="200" width="436" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="235" font-size="19" fill="#0F172A" text-anchor="middle">Every reachable node</text>
  <text x="998" y="261" font-size="19" fill="#0F172A" text-anchor="middle">keeps answering</text>
  <rect x="24" y="294" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="343" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">What the user sees</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="294" width="436" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="343" font-size="19" fill="#0F172A" text-anchor="middle">An error, or a wait</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="294" width="436" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="343" font-size="19" fill="#0F172A" text-anchor="middle">A value that may be old</text>
  <rect x="24" y="388" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="423" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">After the network</text>
  <text x="48" y="451" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">comes back</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="388" width="436" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="423" font-size="19" fill="#0F172A" text-anchor="middle">No conflicts. The cut-off</text>
  <text x="552" y="449" font-size="19" fill="#0F172A" text-anchor="middle">side catches up.</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="388" width="436" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="423" font-size="19" fill="#0F172A" text-anchor="middle">The two copies</text>
  <text x="998" y="449" font-size="19" fill="#0F172A" text-anchor="middle">must be merged</text>
  <rect x="24" y="482" width="300" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="531" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Good for</text>
  <g filter="url(#cp5-soft)"><rect x="334" y="482" width="436" height="84" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="552" y="531" font-size="19" fill="#0F172A" text-anchor="middle">Money, stock levels, locks</text>
  <g filter="url(#cp5-soft)"><rect x="780" y="482" width="436" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="998" y="531" font-size="19" fill="#0F172A" text-anchor="middle">Feeds, carts, view counts</text>
  <text x="620" y="606" font-size="19" fill="#64748B" text-anchor="middle">These are defaults, not laws. A quorum setting can move one operation from either column to the other.</text>
</svg>