<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="With a local index, each shard indexes only its own rows, so a query on a non-partition-key column has to be sent to every shard and the results merged">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ix15-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix15-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ix15-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <rect x="20" y="36" width="580" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="310" y="72" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">WHERE email = 'alice@example.com'</text>

  
  <line x1="760" y1="46" x2="792" y2="46" stroke="#3B82F6" stroke-width="3"/>
  <text x="804" y="53" font-size="20" fill="#475569">ask every shard</text>
  <line x1="1000" y1="46" x2="1032" y2="46" stroke="#059669" stroke-width="3"/>
  <text x="1044" y="53" font-size="20" fill="#475569">only one has it</text>

  
  <path d="M560,168 C560,215 170,210 170,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix15-blue)"/>
  <path d="M600,168 C600,215 480,210 480,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix15-blue)"/>
  <path d="M640,168 C640,215 760,210 760,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix15-blue)"/>
  <path d="M680,168 C680,215 1070,210 1070,254" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix15-blue)"/>

  
  <g filter="url(#ix15-soft)">
    <rect x="500" y="104" width="240" height="64" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="1.5"/>
  </g>
  <text x="620" y="143" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Coordinator</text>

  
  <g filter="url(#ix15-soft)">
    <rect x="50" y="256" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="360" y="256" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="670" y="256" width="240" height="150" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="980" y="256" width="240" height="150" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="170" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard 1</text>
  <text x="480" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard 2</text>
  <text x="790" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard 3</text>
  <text x="1100" y="292" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Shard 4</text>

  <rect x="74" y="310" width="192" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="384" y="310" width="192" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="694" y="310" width="192" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="1004" y="310" width="192" height="74" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="170" y="340" font-size="20" fill="#0F172A" text-anchor="middle">index of</text>
  <text x="170" y="368" font-size="20" fill="#0F172A" text-anchor="middle">its own rows</text>
  <text x="480" y="340" font-size="20" fill="#0F172A" text-anchor="middle">index of</text>
  <text x="480" y="368" font-size="20" fill="#0F172A" text-anchor="middle">its own rows</text>
  <text x="790" y="340" font-size="20" fill="#0F172A" text-anchor="middle">index of</text>
  <text x="790" y="368" font-size="20" fill="#0F172A" text-anchor="middle">its own rows</text>
  <text x="1100" y="340" font-size="20" fill="#0F172A" text-anchor="middle">index of</text>
  <text x="1100" y="368" font-size="20" fill="#0F172A" text-anchor="middle">its own rows</text>

  <text x="170" y="440" font-size="20" fill="#94A3B8" text-anchor="middle">no match</text>
  <text x="480" y="440" font-size="20" fill="#94A3B8" text-anchor="middle">no match</text>
  <text x="790" y="440" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">found it</text>
  <text x="1100" y="440" font-size="20" fill="#94A3B8" text-anchor="middle">no match</text>

  <text x="620" y="524" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Three of the four shards did work that returned nothing, and the query waits for all four.</text>

  <text x="620" y="586" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Writes are cheap because the index sits with its rows. Reads pay for that, on every shard.</text>
</svg>