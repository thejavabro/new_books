<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="798" viewBox="0 0 1240 798" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="gray-title gray-desc">
<title id="gray-title">Gray failure</title>
<desc id="gray-desc">The system reports healthy because every signal it can see is fine, while users see errors. Monitoring built entirely from internal signals will not fire during exactly the incident you most need it to.</desc>
<defs>
<marker id="gray-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="gray-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="gray-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="gray-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="798" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Gray failure</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Gray failure is when the system's own view of its health disagrees with what users are experiencing.</text>
<rect x="40" y="720" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="720" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="540" height="80" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="150.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the system's own view</text><text x="310" y="177.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every signal healthy</text>
<rect x="660" y="118" width="540" height="80" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="930" y="150.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what users experience</text><text x="930" y="177.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">errors and unusable latency</text>
<path d="M620 110V208" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="620" y="236" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">the disagreement is the defining property</text>
<text x="40" y="278" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Recognizable shapes</text>
<rect x="40" y="294" width="560" height="90" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="294" width="5" height="90" rx="2.5" fill="#F3CF6A"/><text x="64" y="319" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Partial packet loss</text><text x="64" y="345" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">most checks pass and a subset of</text><text x="64" y="371" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">users cannot connect</text>
<rect x="640" y="294" width="560" height="90" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="294" width="5" height="90" rx="2.5" fill="#F3CF6A"/><text x="664" y="319" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A slow dependency</text><text x="664" y="345" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">inside the health check timeout,</text><text x="664" y="371" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">outside what users tolerate</text>
<rect x="40" y="398" width="560" height="90" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="398" width="5" height="90" rx="2.5" fill="#F3CF6A"/><text x="64" y="436" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">One shard or zone degraded</text><text x="64" y="462" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which aggregate metrics average away</text>
<rect x="640" y="398" width="560" height="90" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="398" width="5" height="90" rx="2.5" fill="#F3CF6A"/><text x="664" y="436" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A specific client version</text><text x="664" y="462" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which no synthetic check happens to send</text>
<text x="40" y="528" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The answer is to measure from where the user is</text>
<rect x="40" y="544" width="372" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="582" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">synthetic probes from outside</text>
<rect x="434" y="544" width="372" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="582" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">real user measurements</text>
<rect x="828" y="544" width="372" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1014" y="568.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">metrics split by region,</text><text x="1014" y="595.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">zone and version</text>
<rect x="40" y="624" width="1160" height="70" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="624" width="5" height="70" rx="2.5" fill="#AC8BE8"/><text x="64" y="665" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A failover that only internal signals can trigger will not trigger during a gray failure.</text>
<text x="66" y="754" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The failures that defeat failover planning are not the ones where a region goes dark.</text>
</svg>