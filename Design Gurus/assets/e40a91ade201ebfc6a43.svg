<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="872" viewBox="0 0 1240 872" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for an email service: mail arrives over SMTP, passes spam filtering, becomes a message grouped into a thread, attachments go to their own store, the mailbox is indexed for search, and clients sync over IMAP, POP3 and web">
  <defs>
    <filter id="gmlk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="gmlk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="gmlk-k1"><rect x="40" y="310" width="200" height="90" rx="12"/></clipPath>
    <clipPath id="gmlk-k2"><rect x="340" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="gmlk-k3"><rect x="690" y="310" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="gmlk-k4"><rect x="690" y="140" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="gmlk-k5"><rect x="690" y="480" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="gmlk-k6"><rect x="1000" y="310" width="200" height="90" rx="12"/></clipPath>
    <marker id="gmlk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="gmlk-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="gmlk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="gmlk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="gmlk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="gmlk-s-indigo" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#4F46E5"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="872" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Email service: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A message is written once and then read many ways, so storage, index and attachments are separate concerns.</text>



  <g fill="none" stroke-width="2">
    <path d="M240,335 H340" stroke="#64748B" marker-end="url(#gmlk-m-slate)"/>
    <path d="M590,335 H690" stroke="#DB2777" marker-end="url(#gmlk-m-pink)"/>
    <path d="M905,310 V230" stroke="#D97706" marker-end="url(#gmlk-m-amber)"/>
    <path d="M905,400 V480" stroke="#059669" marker-end="url(#gmlk-m-emerald)"/>
    <path d="M930,335 H1000" stroke="#4F46E5" marker-end="url(#gmlk-m-indigo)" marker-start="url(#gmlk-s-indigo)"/>
    <path d="M690,360 H678 Q666,360 666,372 V488 Q666,500 654,500 H590" stroke="#4F46E5" marker-end="url(#gmlk-m-indigo)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="290" y="322" fill="#475569">delivers</text>
    <text x="640" y="322" fill="#BE185D">passes</text>
    <text x="985" y="272" fill="#B45309">split out</text>
    <text x="945" y="445" fill="#047857">indexed</text>
    <text x="965" y="322" fill="#4338CA">sync</text>
    <text x="620" y="445" fill="#4338CA">stored</text>
  </g>

  <g filter="url(#gmlk-soft)">
    <rect x="40" y="310" width="200" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#64748B" clip-path="url(#gmlk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">Sender</text>
  <text x="140" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">inbound over SMTP</text>
  <text x="140" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">inside or outside the service</text>
  <g filter="url(#gmlk-soft)">
    <rect x="340" y="310" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="340" y="310" width="6" height="90" fill="#DB2777" clip-path="url(#gmlk-k2)"/>
  </g>
  <circle cx="378" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,344.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="404" y="362" font-size="21.5" font-weight="600" fill="#111827">Spam Filter</text>
  <text x="465" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">checked before delivery</text>
  <text x="465" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">never after</text>
  <g filter="url(#gmlk-lift)">
    <rect x="690" y="310" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="690" y="310" width="9" height="90" fill="#4F46E5" clip-path="url(#gmlk-k3)"/>
  </g>
  <circle cx="728" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="754" y="362" font-size="21.5" font-weight="600" fill="#111827">Message</text>
  <text x="810" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">headers, body, thread</text>
  <g filter="url(#gmlk-soft)">
    <rect x="690" y="140" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="690" y="140" width="6" height="90" fill="#D97706" clip-path="url(#gmlk-k4)"/>
  </g>
  <circle cx="728" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="754" y="192" font-size="21.5" font-weight="600" fill="#111827">Attachment</text>
  <text x="810" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">kept out of the body</text>
  <text x="810" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">referenced, not inlined</text>
  <g filter="url(#gmlk-soft)">
    <rect x="690" y="480" width="240" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="480" width="6" height="90" fill="#059669" clip-path="url(#gmlk-k5)"/>
  </g>
  <circle cx="728" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,514.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="754" y="532" font-size="21.5" font-weight="600" fill="#111827">Search Index</text>
  <text x="810" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">subject, body, metadata</text>
  <text x="810" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">built on write, read on query</text>
  <g filter="url(#gmlk-soft)">
    <rect x="1000" y="310" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="1000" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#gmlk-k6)"/>
  </g>
  <circle cx="1038" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="1064" y="362" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="1100" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">IMAP, POP3 and web</text>
  <text x="1100" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">every device stays in sync</text>
  <g stroke="#7C3AED" stroke-width="1.5">
    <path d="M340,500 L340,594 A125,16 0 0 0 590,594 L590,500" fill="#EDE9FE"/>
    <ellipse cx="465" cy="500" rx="125" ry="16" fill="#F5F3FF"/>
  </g>
  <text x="465" y="562" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Mailbox</text>
  <text x="465" y="644" font-size="18.5" text-anchor="middle" fill="#6B7280">one per user, labelled</text>
  <text x="465" y="671" font-size="18.5" text-anchor="middle" fill="#94A3B8">threads live here</text>

  <rect x="40" y="670" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="695" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="720" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Thread</text>
  <text x="323" y="720" font-size="18.5" fill="#475569">messages sharing a conversation id, which is why replies must carry a reference to the original</text>
  <rect x="64" y="745" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="770" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Label</text>
  <text x="323" y="770" font-size="18.5" fill="#475569">a tag on a message, not a folder, so one message can appear in many views without being copied</text>
  <rect x="64" y="795" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="820" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Missing step</text>
  <text x="323" y="820" font-size="18.5" fill="#475569">this lesson has no System Definition step; the entity model above is drawn from its later steps</text>
</svg>