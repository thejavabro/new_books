<text x="176.5" y="796" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">two parts, two tables</text>
<text x="313" y="796" font-size="15.5" fill="#475569">each half of the key takes the columns that depend on it, so one new table is not enough</text>
<rect x="64" y="818" width="225" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="176.5" y="840" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">the link table</text>
<text x="313" y="840" font-size="15.5" fill="#475569">Employee_Project keeps the composite key and has no non-key columns at all</text>
<rect x="64" y="862" width="225" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="176.5" y="884" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">still a weakness</text>
<text x="313" y="884" font-size="15.5" fill="#475569">Project_Manager stores a name, so nothing says Anita the manager is employee 101. Normal forms cannot see that</text>
