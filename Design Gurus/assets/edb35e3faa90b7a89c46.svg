<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The words grouped into buckets by frequency">
<defs>
<filter id="tw-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which 2 words appear most often, with ties broken alphabetically?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">apple 3x, banana 2x, orange 1x</text>
<rect x="40" y="106" width="1160" height="366" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">One bucket per frequency, holding the words seen that many times</text>
<text x="113" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">words</text>
<rect x="135" y="160" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="210" y="195.95" text-anchor="middle" font-size="17" font-weight="600" fill="#94A3B8">apple</text>
