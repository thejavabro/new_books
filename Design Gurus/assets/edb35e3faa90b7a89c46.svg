<text x="702" y="195.95" text-anchor="middle" font-size="17" font-weight="600" fill="#94A3B8">orange</text>
<rect x="791" y="160" width="150" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="866" y="195.95" text-anchor="middle" font-size="17" font-weight="600" fill="#94A3B8">banana</text>
