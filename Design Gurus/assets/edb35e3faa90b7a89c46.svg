<text x="727" y="403.95" text-anchor="middle" font-size="17" font-weight="600" fill="#94A3B8">?</text>
<rect x="40" y="490" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="530" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Put each word in the bucket for its count, then read the buckets from the top down</text>
<text x="620" y="562" text-anchor="middle" font-size="18.5" fill="#475569">No sorting by frequency is needed, because the frequency IS the bucket number</text>
