<rect x="739" y="264" width="190" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="834" y="299.95" text-anchor="middle" font-size="17" font-weight="600" fill="#111827">orange</text>
