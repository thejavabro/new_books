<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="836" viewBox="0 0 1240 836" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ladder-title ladder-desc">
<title id="ladder-title">Isolation is not binary</title>
<desc id="ladder-desc">Four common positions trading cost against the strength of the guarantee, and the choice is frequently mixed across the customer base.</desc>
<defs>
<marker id="ladder-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ladder-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ladder-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ladder-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="836" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Isolation is not binary</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There are four common positions, and they trade cost against the strength of the guarantee.</text>
<rect x="40" y="758" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="758" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="1086" y="140" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">cost</text>
<circle cx="60" cy="182" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="189" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="152" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="174.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shared everything,</text><text x="290" y="201.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">tenant column</text>
<path d="M496 182H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 182H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ladder-marker-slate)"/>
<rect x="540" y="152" width="530" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="175.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">cheapest, and the guarantee depends on</text><text x="560" y="200.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">application code being right every time</text>
<rect x="1086" y="170" width="114" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1086" y="170" width="22.8" height="24" rx="10" fill="#06AC80"/>
<circle cx="60" cy="254" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="261" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="224" width="400" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="290" y="246.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shared database,</text><text x="290" y="273.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">separate schemas</text>
<path d="M496 254H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 254H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ladder-marker-slate)"/>
<rect x="540" y="224" width="530" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="247.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a mistake is less likely to cross; operational</text><text x="560" y="272.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">burden grows with tenant count</text>
<rect x="1086" y="242" width="114" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1086" y="242" width="51.3" height="24" rx="10" fill="#159BEF"/>
<circle cx="60" cy="326" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="333" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="296" width="400" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separate databases</text>
<path d="M496 326H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 326H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ladder-marker-slate)"/>
<rect x="540" y="296" width="530" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="319.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">strong data isolation, and migrations</text><text x="560" y="344.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">now run many times</text>
<rect x="1086" y="314" width="114" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1086" y="314" width="79.8" height="24" rx="10" fill="#E8BC60"/>
<circle cx="60" cy="398" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="405" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="368" width="400" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="290" y="390.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Separate stacks,</text><text x="290" y="417.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a cell per tenant</text>
<path d="M496 398H530" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M496 398H530" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ladder-marker-slate)"/>
<rect x="540" y="368" width="530" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="560" y="391.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">strongest, most expensive, usually for</text><text x="560" y="416.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the largest customers</text>
<rect x="1086" y="386" width="114" height="24" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="1086" y="386" width="114.0" height="24" rx="10" fill="#F25461"/>
<text x="40" y="468" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The choice is frequently mixed</text>
<rect x="40" y="486" width="1160" height="128" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="76" y="514" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">the long tail of customers</text>
<text x="560" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">shared, with a tenant column</text>
<text x="76" y="556" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">the largest few customers</text>
<text x="560" y="556" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">their own database or their own cell</text>
<text x="76" y="598" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">the regulated customers</text>
<text x="560" y="598" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">their own, because the contract says so</text>
<rect x="40" y="644" width="560" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="644" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="679.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">Most products should start at the first</text><text x="64" y="706.5" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">and have a path to the others.</text>
<rect x="640" y="644" width="560" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="644" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="664" y="679.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">Achieving a mixed model mostly means routing</text><text x="664" y="706.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">tenant to connection in one place.</text>
<text x="66" y="792" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The migration between levels is possible, and it is a real project.</text>
</svg>