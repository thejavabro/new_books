<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="title desc"><title id="title">One mutation can affect several cached views</title><desc id="desc">A confirmed mutation can change an entity, its list position or membership, and an aggregate count. Update affected records or invalidate the relevant queries. An older in-flight response must pass revision and request-generation checks before it can change those views again.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="970" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">One mutation can affect several cached views</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Update or invalidate every affected view, then guard against an older response.</text><rect x="345" y="180" width="510" height="135" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="367" y="220" font-size="24" fill="#2563eb" font-weight="700">Confirmed mutation</text><text x="367" y="261" font-size="21" fill="#334155" font-weight="400">Use the server result and its identity.</text><rect x="50" y="445" width="330" height="150" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="485" font-size="24" fill="#7c3aed" font-weight="700">Entity record</text><text x="72" y="526" font-size="21" fill="#334155" font-weight="400">Update the confirmed fields</text><text x="72" y="557" font-size="21" fill="#334155" font-weight="400">and applicable revision.</text><rect x="435" y="445" width="330" height="150" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="485" font-size="24" fill="#059669" font-weight="700">Lists and queries</text><text x="457" y="526" font-size="21" fill="#334155" font-weight="400">Recheck membership</text><text x="457" y="557" font-size="21" fill="#334155" font-weight="400">and sorted position.</text><rect x="820" y="445" width="330" height="150" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="485" font-size="24" fill="#c2410c" font-weight="700">Aggregate values</text><text x="842" y="526" font-size="21" fill="#334155" font-weight="400">Reconcile affected counts</text><text x="842" y="557" font-size="21" fill="#334155" font-weight="400">under the server contract.</text><path d="M480 323 V380 H215 V437" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M600 323 V437" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M720 323 V380 H985 V437" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="700" width="430" height="150" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="740" font-size="24" fill="#475569" font-weight="700">Older request completes</text><text x="72" y="781" font-size="21" fill="#334155" font-weight="400">Its data may predate the mutation.</text><rect x="600" y="700" width="550" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="622" y="740" font-size="24" fill="#2563eb" font-weight="700">Check before applying</text><text x="622" y="781" font-size="21" fill="#334155" font-weight="400">Compare the relevant revision or generation.</text><text x="622" y="812" font-size="21" fill="#334155" font-weight="400">Do not restore an outdated cached view.</text><path d="M488 775 H592" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="50" y="922" font-size="22" fill="#475569" font-weight="400">In-flight responses still need revision and generation checks after cache invalidation.</text></g></svg>