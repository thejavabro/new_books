<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="702" viewBox="0 0 1240 702" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="primitives-title primitives-desc">
<title id="primitives-title">Four primitives, not three products</title>
<desc id="primitives-desc">A consistent key-value store, compare-and-swap, watches and sessions with expiry. Everything these systems are used for is built from those four, which is why the choice between them is operational rather than architectural.</desc>
<defs>
<marker id="primitives-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="primitives-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="primitives-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="primitives-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="702" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four primitives, not three products</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Everything these systems are used for is built from those four.</text>
<rect x="40" y="624" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="624" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="372" height="56" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="56" y="153" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">etcd</text><text x="396" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Raft</text>
<rect x="434" y="118" width="372" height="56" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="450" y="153" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Consul</text><text x="790" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">Raft</text>
<rect x="828" y="118" width="372" height="56" rx="9" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="844" y="153" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">ZooKeeper</text><text x="1184" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">ZAB</text>
<text x="620" y="198" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Different protocols, near-identical for the purposes of design</text>
<circle cx="60" cy="244" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="251" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="216" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A consistent key-value store</text>
<path d="M536 244H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 244H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#primitives-marker-slate)"/>
<rect x="580" y="216" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="250" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">small values, quorum-backed</text>
<circle cx="60" cy="312" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="319" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="284" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="318" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compare-and-swap</text>
<path d="M536 312H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 312H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#primitives-marker-slate)"/>
<rect x="580" y="284" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="318" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the primitive that makes exclusion possible</text>
<circle cx="60" cy="380" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="387" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="352" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Watches</text>
<path d="M536 380H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 380H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#primitives-marker-slate)"/>
<rect x="580" y="352" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="386" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tell me when this changes</text>
<circle cx="60" cy="448" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="455" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="420" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="454" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Sessions with expiry</text>
<path d="M536 448H570" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 448H570" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#primitives-marker-slate)"/>
<rect x="580" y="420" width="620" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="600" y="454" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">keys that vanish when heartbeats stop</text>
<rect x="40" y="494" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="494" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="523" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Leader election, locks, membership, service discovery and dynamic</text><text x="64" y="552" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">configuration are all applications of those four.</text><text x="64" y="581" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Which lets you reason about a system you have never used.</text>
<text x="66" y="658" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Recognizing the primitives is what stops product comparison standing in for design.</text>
</svg>