<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What each chapter of the course gives you">
  <defs>
    <marker id="oodm-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodm-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodm-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodm-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodm-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodm-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodm-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodm-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodm-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodm-c0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-d0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-c1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-d1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-c2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-d2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-c3"><rect x="44" y="342" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodm-d3"><rect x="570" y="342" width="626" height="64" rx="12"/></clipPath>
