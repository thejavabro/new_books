  <rect x="0" y="0" width="1240" height="520" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The chapter</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">What you can do when you finish it</text>
  <g filter="url(#oodm-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oodm-c0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">1</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">Introduction (4 lessons)</text>
  <g filter="url(#oodm-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oodm-d0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">know what the round is, and how to work through this course</text>
  <path d="M514,110 L570,110" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodm-arrow-slate)"/>
  <g filter="url(#oodm-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#oodm-c1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">2</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">Design and UML (7 lessons)</text>
  <g filter="url(#oodm-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#2563EB" clip-path="url(#oodm-d1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">read and draw a class, use case, activity and sequence diagram</text>
  <path d="M514,198 L570,198" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oodm-arrow-blue)"/>
  <g filter="url(#oodm-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#oodm-c2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">3</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">How to answer (6 lessons)</text>
  <g filter="url(#oodm-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#7C3AED" clip-path="url(#oodm-d2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">turn one sentence into requirements, classes, relationships, code</text>
  <path d="M514,286 L570,286" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#oodm-arrow-violet)"/>
  <g filter="url(#oodm-soft)">
    <rect x="44" y="342" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="342" width="6" height="64" fill="#059669" clip-path="url(#oodm-c3)"/>
  </g>
  <circle cx="82" cy="374.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="380.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">4</text>
  <text x="112" y="380.5" font-size="18.5" font-weight="600" fill="#111827">Case studies (22 lessons)</text>
  <g filter="url(#oodm-soft)">
    <rect x="570" y="342" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="64" fill="#059669" clip-path="url(#oodm-d3)"/>
  </g>
  <text x="592" y="380.5" font-size="18.5" font-weight="600" fill="#111827">answer the questions companies actually ask, in your own words</text>
  <path d="M514,374 L570,374" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodm-arrow-emerald)"/>
  <text x="620" y="470" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Every case study carries a staged class diagram and working code in Python, Java and C++.</text>
</svg>