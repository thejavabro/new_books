  <rect x="0" y="0" width="1240" height="1690" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google Calendar: high level design</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Five services behind one gateway, two stores behind them, and every reminder or invitation handled off the request path.</text>

  <rect x="40" y="380" width="1160" height="200" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#1D4ED8">Services, each owning one domain</text>
  <rect x="40" y="640" width="700" height="432" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="670" font-size="19.5" font-weight="600" fill="#475569">Storage</text>
  <rect x="40" y="1120" width="1160" height="234" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="1150" font-size="19.5" font-weight="600" fill="#5B21B6">Notification workers, one per channel</text>

