<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1690" viewBox="0 0 1240 1690" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Google Calendar high level design: clients reach an API gateway that routes to user, calendar, event, availability and room services, which read and write SQL and NoSQL stores behind a cache, and publish event created and event updated to Kafka for the notification workers">
