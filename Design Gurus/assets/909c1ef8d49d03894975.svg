  <text x="812" y="492" font-size="21.5" font-weight="600" fill="#111827">Availability</text>
  <text x="848" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">free and busy windows</text>
  <g filter="url(#cal1-soft)">
    <rect x="976" y="440" width="200" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="976" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#cal1-k8)"/>
  </g>
  <circle cx="1014" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(1003.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="1040" y="492" font-size="21.5" font-weight="600" fill="#111827">Room</text>
  <text x="1076" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">rooms and resources</text>
  <g filter="url(#cal1-soft)">
    <rect x="840" y="700" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="700" width="6" height="90" fill="#7C3AED" clip-path="url(#cal1-k9)"/>
  </g>
  <circle cx="878" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,734.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="904" y="752" font-size="21.5" font-weight="600" fill="#111827">Kafka</text>
  <text x="1000" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">event_created and event_updated</text>
  <g filter="url(#cal1-soft)">
    <rect x="840" y="880" width="320" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="840" y="880" width="6" height="90" fill="#7C3AED" clip-path="url(#cal1-k10)"/>
  </g>
  <circle cx="878" cy="925" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,914.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="904" y="932" font-size="21.5" font-weight="600" fill="#111827">Notification Service</text>
  <text x="1000" y="999" font-size="18.5" text-anchor="middle" fill="#6B7280">one job per recipient</text>
  <g filter="url(#cal1-soft)">
    <rect x="64" y="1180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="1180" width="6" height="90" fill="#7C3AED" clip-path="url(#cal1-k11)"/>
  </g>
  <circle cx="102" cy="1225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,1214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="128" y="1232" font-size="21.5" font-weight="600" fill="#111827">Push worker</text>
  <text x="214" y="1299" font-size="18.5" text-anchor="middle" fill="#6B7280">device notifications</text>
  <g filter="url(#cal1-soft)">
    <rect x="470" y="1180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="1180" width="6" height="90" fill="#7C3AED" clip-path="url(#cal1-k12)"/>
  </g>
  <circle cx="508" cy="1225" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,1214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="534" y="1232" font-size="21.5" font-weight="600" fill="#111827">In-app worker</text>
  <text x="620" y="1299" font-size="18.5" text-anchor="middle" fill="#6B7280">the bell in the UI</text>
  <g filter="url(#cal1-soft)">
    <rect x="876" y="1180" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="876" y="1180" width="6" height="90" fill="#7C3AED" clip-path="url(#cal1-k13)"/>
  </g>
  <circle cx="914" cy="1225" r="18" fill="#FFFFFF"/>
  <g transform="translate(903.56,1214.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="940" y="1232" font-size="21.5" font-weight="600" fill="#111827">Email worker</text>
  <text x="1026" y="1299" font-size="18.5" text-anchor="middle" fill="#6B7280">invites and reminders</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M64,700 L64,774 A150,16 0 0 0 364,774 L364,700" fill="#E0E7FF"/>
    <ellipse cx="214" cy="700" rx="150" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="214" y="752" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">SQL</text>
  <text x="214" y="824" font-size="18.5" text-anchor="middle" fill="#6B7280">users, events, invites</text>
  <text x="214" y="851" font-size="18.5" text-anchor="middle" fill="#94A3B8">the source of truth</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M416,700 L416,774 A150,16 0 0 0 716,774 L716,700" fill="#D1FAE5"/>
    <ellipse cx="566" cy="700" rx="150" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="566" y="752" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">NoSQL</text>
  <text x="566" y="824" font-size="18.5" text-anchor="middle" fill="#6B7280">notifications and logs</text>
  <text x="566" y="851" font-size="18.5" text-anchor="middle" fill="#94A3B8">high volume, low value</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M240,890 L240,964 A150,16 0 0 0 540,964 L540,890" fill="#FEF3C7"/>
    <ellipse cx="390" cy="890" rx="150" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="390" y="942" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="390" y="1014" font-size="18.5" text-anchor="middle" fill="#6B7280">a day of a busy calendar</text>
  <text x="390" y="1041" font-size="18.5" text-anchor="middle" fill="#94A3B8">read far more than written</text>

  <rect x="40" y="1400" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1425" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="1450" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">SQL for the truth</text>
  <text x="323" y="1450" font-size="18.5" fill="#475569">an event and its invitations must agree, so they live in one transactional store</text>
  <rect x="64" y="1475" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1500" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Availability is the hard part</text>
  <text x="323" y="1500" font-size="18.5" fill="#475569">free and busy for a room full of people is a query nobody wants to run twice</text>
  <rect x="64" y="1525" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1550" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Reminders are events</text>
  <text x="323" y="1550" font-size="18.5" fill="#475569">nothing polls for what is due, the calendar publishes and the workers pick it up</text>
  <rect x="64" y="1575" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="1600" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cache the visible week</text>
  <text x="323" y="1600" font-size="18.5" fill="#475569">a calendar is read constantly and written rarely, which is what a cache is for</text>
</svg>