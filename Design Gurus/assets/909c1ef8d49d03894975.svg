  <text x="128" y="492" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="164" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">accounts and sharing</text>
  <g filter="url(#cal1-soft)">
