  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Microkernel architecture: advantages and limitations</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Plugins make the system easier to extend and maintain, at costs that grow with the number of plugins.</text>

