  <text x="728" y="675" font-size="21.5" font-weight="600" fill="#111827"></text>
  <text x="134" y="242" font-size="21.5" font-weight="600" fill="#111827">Modularity</text>
  <text x="134" y="272" font-size="18.5" fill="#4B5563">Features are implemented as separate plugins,</text>
  <text x="134" y="298" font-size="18.5" fill="#4B5563">making the system easier to extend.</text>
  <text x="134" y="378" font-size="21.5" font-weight="600" fill="#111827">Maintainability</text>
  <text x="134" y="408" font-size="18.5" fill="#4B5563">Plugins can be developed, updated, or replaced</text>
  <text x="134" y="434" font-size="18.5" fill="#4B5563">without changing the core.</text>
  <text x="134" y="514" font-size="21.5" font-weight="600" fill="#111827">Flexibility</text>
  <text x="134" y="544" font-size="18.5" fill="#4B5563">New features can be added through plugins</text>
  <text x="134" y="570" font-size="18.5" fill="#4B5563">to support different use cases.</text>
  <text x="134" y="650" font-size="21.5" font-weight="600" fill="#111827">Stability</text>
  <text x="134" y="680" font-size="18.5" fill="#4B5563">With isolation, a minimal core reduces the impact</text>
  <text x="134" y="706" font-size="18.5" fill="#4B5563">of plugin failures on the overall system.</text>
  <text x="734" y="242" font-size="21.5" font-weight="600" fill="#111827">Testing combinations</text>
  <text x="734" y="272" font-size="18.5" fill="#4B5563">Plugins that run together can interfere, and the</text>
  <text x="734" y="298" font-size="18.5" fill="#4B5563">number of combinations to test grows quickly.</text>
  <text x="734" y="378" font-size="21.5" font-weight="600" fill="#111827">Compatibility tracking</text>
  <text x="734" y="408" font-size="18.5" fill="#4B5563">Before the core is upgraded, teams need a record</text>
  <text x="734" y="434" font-size="18.5" fill="#4B5563">of which plugin versions work with which core.</text>
  <text x="734" y="514" font-size="21.5" font-weight="600" fill="#111827">Third-party code</text>
  <text x="734" y="544" font-size="18.5" fill="#4B5563">Outside plugins run with the core's privileges,</text>
  <text x="734" y="570" font-size="18.5" fill="#4B5563">so each must be trusted, reviewed or isolated.</text>
  <text x="734" y="650" font-size="21.5" font-weight="600" fill="#111827">A core that is hard to change</text>
  <text x="734" y="680" font-size="18.5" fill="#4B5563">Once many plugins depend on the contract, even</text>
  <text x="734" y="706" font-size="18.5" fill="#4B5563">a small change means work for every plugin author.</text>




</svg>