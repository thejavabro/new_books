<text x="52" y="396" font-size="13" fill="#414d60">ReportGenerator depends only on the Document interface. It never names PdfDocument or HtmlDocument.</text>
<text x="52" y="420" font-size="13" fill="#414d60">Each concrete generator overrides one method, and that is the only place a concrete type appears.</text>
