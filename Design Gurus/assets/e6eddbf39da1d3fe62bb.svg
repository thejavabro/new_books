<rect x="600" y="40" width="330" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="765" y="60" text-anchor="middle" font-weight="bold">&#171;interface&#187; Document</text>
<text x="612" y="92">+ render(rows)</text>
<text x="612" y="112">+ fileName() : String</text>

<rect x="30" y="252" width="250" height="70" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="252" width="250" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="155" y="272" text-anchor="middle" font-weight="bold">PdfReportGenerator</text>
