    </filter>
    <clipPath id="m03f-k1"><rect x="100" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="m03f-k2"><rect x="780" y="140" width="300" height="90" rx="12"/></clipPath>
