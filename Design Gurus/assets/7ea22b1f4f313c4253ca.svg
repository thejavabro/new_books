  <rect x="0" y="0" width="1240" height="890" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Application tier: stateless servers and shared sessions</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Any app server can handle any request, because session data lives in a shared store.</text>

