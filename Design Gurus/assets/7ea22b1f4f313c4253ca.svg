<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="890" viewBox="0 0 1240 890" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The client, a browser or mobile app, sends an HTTP or HTTPS request to the load balancer and gets an HTML or JSON response. The load balancer sends requests to the application tier of stateless servers: app servers 1, 2 and 3, each running Python, Java or Go. The application tier sends database queries to the database (PostgreSQL, MySQL or MongoDB) in the data tier and gets results. Every app server reads and writes session data in the shared session store (Redis), which is also in the data tier">
