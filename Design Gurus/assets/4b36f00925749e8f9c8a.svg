<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The leftmost prefix rule: an index on CustomerID then OrderDate serves a filter on CustomerID, or on both, but not on OrderDate alone">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ix5-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix5-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ix5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <g filter="url(#ix5-soft)">
    <rect x="330" y="40" width="580" height="100" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="620" y="78" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Composite index on (CustomerID, OrderDate)</text>
  <text x="620" y="112" font-size="20" fill="#64748B" text-anchor="middle">sorted by CustomerID first, then by OrderDate within it</text>

  
  <path d="M480,140 C420,180 340,190 300,222" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ix5-emerald)"/>
  <path d="M760,140 C820,180 900,190 940,222" fill="none" stroke="#DC2626" stroke-width="2" marker-end="url(#ix5-red)"/>

  
  <g filter="url(#ix5-soft)">
    <rect x="40" y="226" width="500" height="230" rx="12" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="700" y="226" width="500" height="230" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="270" y="480" width="700" height="100" rx="12" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>

  <text x="290" y="266" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Uses the index</text>
  <text x="290" y="308" font-size="20" fill="#334155" text-anchor="middle">WHERE CustomerID = 42</text>
  <text x="290" y="344" font-size="20" fill="#64748B" text-anchor="middle">the leftmost column alone is enough</text>
  <text x="290" y="392" font-size="20" fill="#334155" text-anchor="middle">WHERE CustomerID = 42</text>
  <text x="290" y="420" font-size="20" fill="#334155" text-anchor="middle">AND OrderDate &gt;= last Monday</text>

  <text x="950" y="266" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Cannot use the index</text>
  <text x="950" y="308" font-size="20" fill="#334155" text-anchor="middle">WHERE OrderDate &gt;= last Monday</text>
  <text x="950" y="352" font-size="20" fill="#64748B" text-anchor="middle">the dates are only sorted inside each</text>
  <text x="950" y="380" font-size="20" fill="#64748B" text-anchor="middle">customer, so they are scattered</text>
  <text x="950" y="424" font-size="20" fill="#64748B" text-anchor="middle">across the index as a whole</text>

  <text x="620" y="518" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Leftmost prefix rule</text>
  <text x="620" y="552" font-size="20" fill="#64748B" text-anchor="middle">Column order decides which queries an index can serve.</text>
</svg>