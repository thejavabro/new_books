<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="nines-title nines-desc">
<title id="nines-title">What the nines actually cost</title>
<desc id="nines-desc">Converting an availability percentage into minutes changes the conversation, because four nines stops sounding like an aspiration once it is four minutes a month.</desc>
<defs>
<marker id="nines-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="nines-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="nines-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="nines-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What the nines actually cost</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Converting an availability percentage into minutes changes the conversation.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="226" y="142" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">objective</text>
<text x="620" y="142" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">budget per 30 days</text>
<text x="1014" y="142" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">budget per year</text>
<rect x="40" y="160" width="372" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="226" y="193" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">99%</text>
<rect x="434" y="160" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="620" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">7.2 hours</text>
<rect x="828" y="160" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="1014" y="194" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">3.6 days</text>
<rect x="40" y="224" width="372" height="54" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="257" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">99.9%</text>
<rect x="434" y="224" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="620" y="258" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">43 minutes</text>
<rect x="828" y="224" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="1014" y="258" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">8.8 hours</text>
<rect x="40" y="288" width="372" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="321" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">99.95%</text>
<rect x="434" y="288" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="620" y="322" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">22 minutes</text>
<rect x="828" y="288" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="1014" y="322" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">4.4 hours</text>
<rect x="40" y="352" width="372" height="54" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="226" y="385" font-size="23" font-weight="700" fill="#080C50" text-anchor="middle">99.99%</text>
<rect x="434" y="352" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="620" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">4.3 minutes</text>
<rect x="828" y="352" width="372" height="54" rx="7" fill="#F4F7FA" stroke="#D5E3EF" stroke-width="2"/><text x="1014" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">53 minutes</text>
<rect x="40" y="428" width="1160" height="142" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="428" width="5" height="142" rx="2.5" fill="#F28B9D"/><text x="64" y="466" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Four nines is about four minutes a month</text><text x="64" y="492" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Less than a careless deploy. Shorter than most failovers.</text><text x="64" y="518" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Shorter than the time it takes a person to read a page and open a laptop.</text><text x="64" y="544" font-size="19" font-weight="700" fill="#A83147" text-anchor="start">So it is a commitment to no human in the recovery path.</text>
<rect x="40" y="590" width="560" height="80" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="320" y="622.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Measured as a count of failed requests.</text><text x="320" y="649.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Stated as the outage that count would allow.</text>
<rect x="640" y="590" width="560" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="590" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="664" y="621.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The right target is the lowest one</text><text x="664" y="650.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">your users will not notice.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Reliability above what users notice is bought for no gain anybody notices.</text>
</svg>