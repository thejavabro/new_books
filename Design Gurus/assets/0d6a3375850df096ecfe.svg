  <text x="128" y="372" font-size="21.5" font-weight="600" fill="#111827">CDN</text>
  <text x="194" y="439" font-size="18.5" text-anchor="middle" fill="#6B7280">images, video, scripts</text>
  <g filter="url(#sc4-soft)">
    <rect x="490" y="320" width="260" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
