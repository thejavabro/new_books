  <text x="924" y="732" font-size="21.5" font-weight="600" fill="#111827">Queue</text>
  <g filter="url(#sc4-soft)">
    <rect x="860" y="850" width="240" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
