  <text x="399" y="532" font-size="21.5" font-weight="600" fill="#111827">App 1</text>
  <g filter="url(#sc4-soft)">
    <rect x="535" y="480" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="535" y="480" width="6" height="90" fill="#2563EB" clip-path="url(#sc4-k5)"/>
