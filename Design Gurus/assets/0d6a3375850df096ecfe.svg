<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Users download static files from a CDN and send API calls to a load balancer. The load balancer spreads requests over three stateless app servers. The app servers read from a cache, read and write a database with replicas and shards, and send slow jobs to a queue that workers process.">
