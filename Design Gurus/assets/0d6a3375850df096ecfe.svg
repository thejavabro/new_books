  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">A web application built to scale</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Each part can grow on its own, so no single machine limits the whole system.</text>



