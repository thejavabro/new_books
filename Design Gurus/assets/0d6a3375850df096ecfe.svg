  <circle cx="898" cy="895" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,884.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="924" y="902" font-size="21.5" font-weight="600" fill="#111827">Workers</text>
  <text x="980" y="969" font-size="18.5" text-anchor="middle" fill="#6B7280">emails, invoices, photos</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M170,690 L170,764 A120,16 0 0 0 410,764 L410,690" fill="#FEF3C7"/>
    <ellipse cx="290" cy="690" rx="120" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="290" y="742" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Cache</text>
  <text x="290" y="814" font-size="18.5" text-anchor="middle" fill="#6B7280">repeated reads</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M500,690 L500,764 A120,16 0 0 0 740,764 L740,690" fill="#E0E7FF"/>
    <ellipse cx="620" cy="690" rx="120" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="620" y="742" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="620" y="814" font-size="18.5" text-anchor="middle" fill="#6B7280">primary and read replicas</text>
  <text x="620" y="841" font-size="18.5" text-anchor="middle" fill="#94A3B8">shards when writes grow</text>

  <rect x="40" y="1010" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1035" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1060" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">App servers</text>
  <text x="323" y="1060" font-size="18.5" fill="#475569">stateless, so autoscaling can add them when busy and remove them when quiet</text>
  <rect x="64" y="1085" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1110" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Queue + workers</text>
  <text x="323" y="1110" font-size="18.5" fill="#475569">slow jobs wait in the queue, so the user gets a fast response</text>
