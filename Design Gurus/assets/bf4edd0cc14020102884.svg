<rect x="1104.0" y="301.2" width="32" height="28.8" rx="5" fill="#06AC80"/>
<rect x="1152.0" y="308.4" width="32" height="21.6" rx="5" fill="#06AC80"/>
<path d="M40 330H1200" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M40 261.9H1200" fill="none" stroke="#159BEF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="1200" y="249.89999999999998" font-size="19" font-weight="700" fill="#155B9E" text-anchor="end">average</text>
<text x="880" y="159.2" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">peak</text>
<text x="620" y="362" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one day</text>
<rect x="40" y="390" width="272" height="108" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 390H46A6 6 0 0 0 40 396V492A6 6 0 0 0 46 498H54Z" fill="#5EC9EC"/><text x="176" y="426" font-size="23" font-weight="700" fill="#155B9E" text-anchor="middle">Daily</text>
<text x="176" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">two to four times the</text><text x="176" y="481" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">daily average</text>
<rect x="336" y="390" width="272" height="108" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M350 390H342A6 6 0 0 0 336 396V492A6 6 0 0 0 342 498H350Z" fill="#39D5AA"/><text x="472" y="426" font-size="23" font-weight="700" fill="#169B77" text-anchor="middle">Weekly</text>
<text x="472" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Monday can be double</text><text x="472" y="481" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Saturday</text>
<rect x="632" y="390" width="272" height="108" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M646 390H638A6 6 0 0 0 632 396V492A6 6 0 0 0 638 498H646Z" fill="#F3CF6A"/><text x="768" y="426" font-size="23" font-weight="700" fill="#91642E" text-anchor="middle">Seasonal</text>
<text x="768" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">ten times an ordinary day,</text><text x="768" y="481" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">and known months ahead</text>
<rect x="928" y="390" width="272" height="108" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M942 390H934A6 6 0 0 0 928 396V492A6 6 0 0 0 934 498H942Z" fill="#F28B9D"/><text x="1064" y="426" font-size="23" font-weight="700" fill="#A83147" text-anchor="middle">Event-driven</text>
<text x="1064" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">the sharpest, and the only</text><text x="1064" y="481" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">one without warning</text>
<rect x="40" y="522" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="522" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="554.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">And there is a peak inside the peak: the busiest minute of the busiest hour.</text><text x="64" y="581.5" font-size="20" font-weight="700" fill="#6040A8" text-anchor="start">If a scheduled push drives your traffic, that minute is your real capacity input.</text>
<text x="66" y="662" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A capacity number means nothing without naming which peak it was planned for.</text>
</svg>