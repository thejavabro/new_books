<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="706" viewBox="0 0 1240 706" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="peaks-title peaks-desc">
<title id="peaks-title">Systems experience peaks, not averages</title>
<desc id="peaks-desc">A day of demand against its average, showing how far the peak sits above it. Daily, weekly, seasonal and event-driven shapes each have different ratios, and the busiest minute inside the busiest hour is higher again.</desc>
<defs>
<marker id="peaks-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="peaks-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="peaks-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="peaks-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
