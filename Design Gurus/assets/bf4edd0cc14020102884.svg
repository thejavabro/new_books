<rect x="576.0" y="265.2" width="32" height="64.8" rx="5" fill="#06AC80"/>
<rect x="624.0" y="276.0" width="32" height="54" rx="5" fill="#06AC80"/>
<rect x="672.0" y="268.8" width="32" height="61.2" rx="5" fill="#06AC80"/>
<rect x="720.0" y="258.0" width="32" height="72" rx="5" fill="#06AC80"/>
