<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-label="Each server sends a heartbeat at a fixed interval. When the messages from one server stop for longer than the timeout, the system marks it dead, stops routing to it and starts a replacement.">
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker>
    <marker id="ar-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#DC2626"/></marker>
    <marker id="ar-grn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="ar-blu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3B82F6"/></marker>
  </defs>
  <rect width="1240" height="540" fill="#FFFFFF"/>
  <rect x="890" y="145" width="300" height="90" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" filter="url(#sh)"/>
  <text x="1040" y="188" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Monitor</text>
  <text x="1040" y="213" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">watches the beats</text>
  <rect x="40" y="29" width="220" height="74" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="64" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 1</text>
  <text x="150" y="89" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">alive</text>
  <circle cx="290" cy="66" r="9" fill="#059669"/>
  <circle cx="368" cy="66" r="9" fill="#059669"/>
  <circle cx="446" cy="66" r="9" fill="#059669"/>
  <circle cx="524" cy="66" r="9" fill="#059669"/>
  <circle cx="602" cy="66" r="9" fill="#059669"/>
  <circle cx="680" cy="66" r="9" fill="#059669"/>
  <path d="M696 66 C 830 66, 830 190, 884 168" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-grn)"/>
  <rect x="40" y="153" width="220" height="74" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="188" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 2</text>
  <text x="150" y="213" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">stopped</text>
  <circle cx="290" cy="190" r="9" fill="#059669"/>
  <circle cx="368" cy="190" r="9" fill="#059669"/>
  <circle cx="446" cy="190" r="9" fill="#059669"/>
  <circle cx="524" cy="190" r="9" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="602" cy="190" r="9" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="3 3"/>
  <circle cx="680" cy="190" r="9" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.8" stroke-dasharray="3 3"/>
  <text x="600" y="234" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">no beat for longer than the timeout</text>
  <rect x="40" y="277" width="220" height="74" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" filter="url(#sh)"/>
  <text x="150" y="312" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 3</text>
  <text x="150" y="337" font-size="20" fill="#64748B" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">alive</text>
  <circle cx="290" cy="314" r="9" fill="#059669"/>
  <circle cx="368" cy="314" r="9" fill="#059669"/>
  <circle cx="446" cy="314" r="9" fill="#059669"/>
  <circle cx="524" cy="314" r="9" fill="#059669"/>
  <circle cx="602" cy="314" r="9" fill="#059669"/>
  <circle cx="680" cy="314" r="9" fill="#059669"/>
  <path d="M696 314 C 830 314, 830 190, 884 212" fill="none" stroke="#059669" stroke-width="1.6" marker-end="url(#ar-grn)"/>
  <text x="290" y="30" font-size="20" fill="#64748B" text-anchor="start" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">heartbeats, one every few seconds</text>
  <rect x="40" y="386" width="1160" height="62" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="620" y="424" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Server 2 is marked dead: no more traffic is routed to it, and a replacement is started.</text>
  <rect x="40" y="462" width="1160" height="62" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="500" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The timeout is the number that matters: too short kills healthy servers, too long keeps users on a dead one.</text>
</svg>