<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="At 5 million requests per month, functions cost about 10 dollars and the server costs 100 dollars. At 50 million requests per month, both cost about 100 dollars, which is the crossover. At 200 million requests per month, functions cost about 400 dollars and the server still costs 100 dollars.">
  <defs>
    <filter id="slv4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="slv4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="slv4-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="slv4-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="slv4-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    <marker id="slv4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The cost crossover</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Example prices only: $0.000002 per request, or $100 per month for a server.</text>



  <g fill="none" stroke-width="2">
    <path d="M404,185 H450" stroke="#64748B" marker-end="url(#slv4-m-slate)"/>
    <path d="M790,185 H836" stroke="#64748B" marker-end="url(#slv4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#slv4-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#059669" clip-path="url(#slv4-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">5M requests</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">functions: about $10</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">server: $100</text>
  <g filter="url(#slv4-lift)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="450" y="140" width="9" height="90" fill="#D97706" clip-path="url(#slv4-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">50M requests</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">functions: about $100</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">server: $100</text>
  <g filter="url(#slv4-soft)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="836" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#slv4-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">200M requests</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">functions: about $400</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">server: $100</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Crossover</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">$100 / $0.000002 = 50,000,000 requests per month</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Below it</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">paying per use is cheaper</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Above it</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">a server you keep running is cheaper</text>
</svg>