  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Three serverless invocation models</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The event source decides whether a function is invoked synchronously, asynchronously, or by polling.</text>

  <rect x="40" y="125" width="1160" height="220" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Synchronous invocation</text>
  <rect x="40" y="369" width="1160" height="307" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="399" font-size="19.5" font-weight="600" fill="#4338CA">2. Asynchronous invocation</text>
  <rect x="40" y="700" width="1160" height="220" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="730" font-size="19.5" font-weight="600" fill="#B45309">3. Poll-based invocation</text>

