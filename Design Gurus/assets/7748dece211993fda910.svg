<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="960" viewBox="0 0 1240 960" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three panels. Synchronous invocation: a client sends a request through an API gateway to an on-demand function and receives the response directly, and retries are the caller&#39;s responsibility; used for web APIs via API Gateway, APIs behind a load balancer and request-response workflows. Asynchronous invocation: object storage, SNS notifications and EventBridge rules hand the event to a platform queue, which invokes the function; the caller does not wait, and the platform retries failures and can route persistent ones to a dead-letter queue; used for file processing, event-driven workflows, scheduled jobs and background tasks. Poll-based invocation: a platform poller polls a queue or stream, receives the messages, and invokes the function with the batch, and a poison message can block a stream shard; used for processing queue messages, stream data processing, and Kafka topic processing">
