    <rect x="600" y="795" width="220" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="600" y="795" width="6" height="90" fill="#7C3AED" clip-path="url(#m15h-k9)"/>
  </g>
  <circle cx="638" cy="840" r="18" fill="#FFFFFF"/>
  <g transform="translate(627.56,829.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="664" y="834.25" font-size="21.5" font-weight="600" fill="#111827">Function</text>
  <text x="664" y="859.75" font-size="21.5" font-weight="600" fill="#111827">(on demand)</text>
  <text x="64" y="187" font-size="18.5" fill="#475569">Triggered by a client request and returns a response directly; retries are the caller's responsibility.</text>
  <text x="64" y="431" font-size="18.5" fill="#475569">The caller does not wait; the platform queues the event, retries failures, and can route persistent ones to a dead-letter queue.</text>
  <text x="64" y="762" font-size="18.5" fill="#475569">The platform polls a data source for new messages or records; a poison message can block a stream shard.</text>
  <text x="880" y="230" font-size="18.5" font-weight="600" fill="#1D4ED8">Typical use cases</text>
  <text x="906" y="262" font-size="18.5" fill="#1F2937">Web APIs (via API Gateway)</text>
  <text x="906" y="289" font-size="18.5" fill="#1F2937">APIs behind a load balancer</text>
  <text x="906" y="316" font-size="18.5" fill="#1F2937">Request-response workflows</text>
  <text x="880" y="474" font-size="18.5" font-weight="600" fill="#4338CA">Typical use cases</text>
  <text x="906" y="506" font-size="18.5" fill="#1F2937">File processing</text>
  <text x="906" y="533" font-size="18.5" fill="#1F2937">Event-driven workflows</text>
  <text x="906" y="560" font-size="18.5" fill="#1F2937">Scheduled jobs</text>
  <text x="906" y="587" font-size="18.5" fill="#1F2937">Background tasks</text>
  <text x="880" y="805" font-size="18.5" font-weight="600" fill="#B45309">Typical use cases</text>
  <text x="906" y="837" font-size="18.5" fill="#1F2937">Processing queue messages</text>
  <text x="906" y="864" font-size="18.5" fill="#1F2937">Stream data processing</text>
  <text x="906" y="891" font-size="18.5" fill="#1F2937">Kafka topic processing</text>

