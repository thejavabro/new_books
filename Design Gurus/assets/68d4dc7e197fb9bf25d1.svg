  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Eventual consistency: how data propagates across services</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">An update in one service reaches the other services through an event, after some delay.</text>

  <rect x="40" y="120" width="1160" height="140" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Update in service A</text>
  <rect x="40" y="300" width="1160" height="150" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="330" font-size="19.5" font-weight="600" fill="#047857">2. Publish event</text>
  <rect x="40" y="490" width="1160" height="170" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="520" font-size="19.5" font-weight="600" fill="#5B21B6">3. Other services consume event</text>
  <rect x="40" y="700" width="1160" height="150" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="730" font-size="19.5" font-weight="600" fill="#B45309">4. Asynchronous propagation</text>
  <rect x="40" y="890" width="1160" height="220" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="920" font-size="19.5" font-weight="600" fill="#475569">5. Eventually consistent state</text>

