<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="buildbuy-title buildbuy-desc">
<title id="buildbuy-title">Build against buy, compared honestly</title>
<desc id="buildbuy-desc">The comparison is not feature against feature. It is engineer-time to build plus engineer-time to operate forever, against the price, how close the thing is to your product, and whether you could replace it later.</desc>
<defs>
<marker id="buildbuy-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="buildbuy-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="buildbuy-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="buildbuy-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Build against buy, compared honestly</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The honest comparison is not feature against feature.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="100" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="100" rx="2.5" fill="#F28B9D"/><text x="64" y="148" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The comparison candidates make</text><text x="64" y="174" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">feature against feature, which is the wrong axis</text><text x="64" y="200" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and which almost always favors building</text>
<rect x="40" y="242" width="560" height="258" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 242H46A6 6 0 0 0 40 248V494A6 6 0 0 0 46 500H54Z" fill="#5EC9EC"/><text x="70" y="278" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">The real cost of building</text>
<rect x="72" y="298" width="500" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="322" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">engineer-time to build it</text>
<text x="322" y="390" font-size="26" font-weight="700" fill="#080C50" text-anchor="middle">+</text>
<rect x="72" y="410" width="500" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="435.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">engineer-time to operate it</text><text x="322" y="462.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">for as long as it exists</text>
<rect x="640" y="242" width="560" height="258" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 242H646A6 6 0 0 0 640 248V494A6 6 0 0 0 646 500H654Z" fill="#39D5AA"/><text x="670" y="278" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Weighed against</text>
<rect x="672" y="298" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the price</text>
<rect x="672" y="360" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">whether it is part of the product itself</text>
<rect x="672" y="422" width="500" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="456" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">whether you could replace it later</text>
<rect x="40" y="524" width="560" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="524" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="557" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Build the thing that is the reason</text><text x="64" y="586" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">the company exists.</text><text x="64" y="615" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Everything else is overhead.</text>
<rect x="640" y="524" width="560" height="112" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="524" width="5" height="112" rx="2.5" fill="#F3CF6A"/><text x="664" y="557" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Reversibility is decided</text><text x="664" y="586" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">when you adopt it.</text><text x="664" y="615" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A narrow interface keeps it reversible.</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">That rule is violated routinely, because building is more interesting than integrating.</text>
</svg>