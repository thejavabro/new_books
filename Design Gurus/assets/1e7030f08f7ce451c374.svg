<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every split must pay for its own overhead: if a concrete benefit applies, split along that seam; if none applies, keep the service whole or merge over-split services">
  <defs>
    <marker id="m02-l03-split-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m02-l03-split-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m02-l03-split-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m02-l03-split-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>

  <g fill="none" stroke-width="2.5">
    <path d="M280,290 L340,290" stroke="#475569" marker-end="url(#m02-l03-split-decision-sl)"/>
    <path d="M700,225 C780,180 790,190 860,190" stroke="#059669" stroke-width="3" marker-end="url(#m02-l03-split-decision-em)"/>
    <path d="M700,355 C780,400 790,455 860,455" stroke="#DC2626" stroke-width="3" marker-end="url(#m02-l03-split-decision-rd)"/>
  </g>

  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="790" y="172" fill="#065F46">Yes</text>
    <text x="790" y="425" fill="#B91C1C">No</text>
  </g>

  <g filter="url(#m02-l03-split-decision-soft)">
    <rect x="20" y="230" width="260" height="120" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="150" y="272" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Tempted to split</text>
  <text x="150" y="302" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">a service?</text>
  <text x="150" y="332" text-anchor="middle" font-size="20" fill="#64748B">a recurring temptation</text>

  <g filter="url(#m02-l03-split-decision-soft)">
    <path d="M560,190 L780,290 L560,390 L340,290 Z" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5" stroke-linejoin="round"/>
  </g>
  <text x="560" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Will the split pay for</text>
  <text x="560" y="304" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">its own overhead?</text>
  <text x="560" y="334" text-anchor="middle" font-size="20" fill="#334155">pipelines, deploys, on-call</text>

  <g filter="url(#m02-l03-split-decision-soft)">
    <rect x="860" y="100" width="340" height="180" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5"/>
  </g>
  <text x="1030" y="145" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split along that seam</text>
  <text x="1030" y="181" text-anchor="middle" font-size="20" fill="#64748B">divergent scaling,</text>
  <text x="1030" y="211" text-anchor="middle" font-size="20" fill="#64748B">critical isolation, or</text>
  <text x="1030" y="241" text-anchor="middle" font-size="20" fill="#64748B">a team that must move alone</text>

  <g filter="url(#m02-l03-split-decision-soft)">
    <rect x="860" y="380" width="340" height="150" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="1030" y="425" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Keep it whole, or merge</text>
  <text x="1030" y="455" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">over-split services</text>
  <text x="1030" y="490" text-anchor="middle" font-size="20" fill="#64748B">merging is normal engineering</text>

  <g stroke-width="4">
    <line x1="40" y1="565" x2="74" y2="565" stroke="#059669"/>
    <line x1="680" y1="565" x2="714" y2="565" stroke="#DC2626"/>
  </g>
  <text x="84" y="572" font-size="20" fill="#475569">Split justified: a concrete benefit pays the overhead</text>
  <text x="724" y="572" font-size="20" fill="#475569">No concrete benefit: do not split</text>
</svg>