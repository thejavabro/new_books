  <rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Monolithic architecture overview</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every module ships in one artifact, runs in one process, and shares one database.</text>

  <rect x="590" y="130" width="380" height="585" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="614" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolithic application</text>

