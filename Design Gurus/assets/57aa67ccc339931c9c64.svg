  <g transform="translate(641.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="678" y="362" font-size="21.5" font-weight="600" fill="#111827">Order module</text>
  <text x="780" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">orders, checkout</text>
  <g filter="url(#msa1a-soft)">
    <rect x="614" y="440" width="332" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="614" y="440" width="6" height="90" fill="#D97706" clip-path="url(#msa1a-k5)"/>
