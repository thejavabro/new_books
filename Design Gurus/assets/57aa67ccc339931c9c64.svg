  </g>
  <circle cx="838" cy="845" r="18" fill="#FFFFFF"/>
  <g transform="translate(827.56,834.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="864" y="852" font-size="21.5" font-weight="600" fill="#111827">Instance 3</text>
