  <text x="678" y="492" font-size="21.5" font-weight="600" fill="#111827">Payment module</text>
  <text x="780" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">payments, invoices</text>
  <g filter="url(#msa1a-soft)">
