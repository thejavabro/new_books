  <text x="224" y="852" font-size="21.5" font-weight="600" fill="#111827">Instance 1</text>
  <text x="300" y="919" font-size="18.5" text-anchor="middle" fill="#6B7280">full copy of the app</text>
  <g filter="url(#msa1a-soft)">
    <rect x="480" y="800" width="280" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
