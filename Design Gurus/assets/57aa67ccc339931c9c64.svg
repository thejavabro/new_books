<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client reaches a load balancer, which sends requests to three identical instances of a monolithic application holding user, order, payment and notification modules; the application reads and writes one shared database; the application box shows what runs inside each of the three instances">
