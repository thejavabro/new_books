  <text x="1110" y="409.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared</text>
  <text x="1110" y="434.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">database</text>
  <text x="1110" y="504" font-size="18.5" text-anchor="middle" fill="#6B7280">users, orders, payments</text>
  <text x="1024" y="741" font-size="18.5" fill="#6B7280">the same application</text>
  <text x="1024" y="768" font-size="18.5" fill="#6B7280">runs in each instance</text>



  <rect x="40" y="950" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="975" width="270" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="199" y="1000" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Single deployable unit</text>
  <text x="363" y="1000" font-size="18.5" fill="#475569">every module is built, tested and shipped together as one artifact</text>
  <rect x="64" y="1025" width="270" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="199" y="1050" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Shared database</text>
  <text x="363" y="1050" font-size="18.5" fill="#475569">all modules use one database, so one transaction can cover writes from several of them</text>
  <rect x="64" y="1075" width="270" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="199" y="1100" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Scaled by copying</text>
  <text x="363" y="1100" font-size="18.5" fill="#475569">each instance runs the whole application behind the load balancer</text>
</svg>