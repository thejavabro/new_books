<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five failure modes across the top, each pointing to what the design does about it. A provider outage leads to breaking the circuit so it can recover. A queue backing up during a fan-out surge leads to shedding bulk traffic first while keeping transactional traffic moving. A worker dying leads to the idempotency key dropping the redelivered message, giving an at-least-once guarantee. A user who has gone away, with a dead token or a hard bounce, leads to deleting the address rather than retrying. An unreachable preference store leads to holding the notification rather than guessing.">
  <defs>
    <filter id="ntffail-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ntffail-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ntffail-k1"><rect x="55" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k2"><rect x="285" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k3"><rect x="515" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k4"><rect x="745" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k5"><rect x="975" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k6"><rect x="55" y="430" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k7"><rect x="285" y="430" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k8"><rect x="515" y="430" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k9"><rect x="745" y="430" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ntffail-k10"><rect x="975" y="430" width="215" height="90" rx="12"/></clipPath>
    <marker id="ntffail-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="ntffail-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ntffail-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="900" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Five failures, and what each one is allowed to do</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Most of what can fail here belongs to somebody else. What we control is how the system behaves when it does.</text>

  <rect x="40" y="110" width="1160" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">What breaks</text>
  <rect x="40" y="380" width="1160" height="240" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#047857">The response</text>

  <g fill="none" stroke-width="2">
    <path d="M162.5 300 V 352 H 225 V 424" stroke="#DB2777" marker-end="url(#ntffail-m-pink)"/>
    <path d="M392.5 300 V 424" stroke="#D97706" marker-end="url(#ntffail-m-amber)"/>
    <path d="M622.5 300 V 424" stroke="#D97706" marker-end="url(#ntffail-m-amber)"/>
    <path d="M852.5 300 V 424" stroke="#DB2777" marker-end="url(#ntffail-m-pink)"/>
    <path d="M1082.5 300 V 424" stroke="#7C3AED" marker-end="url(#ntffail-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ntffail-soft)">
    <rect x="55" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="55" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#ntffail-k1)"/>
  </g>
  <circle cx="93" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(82.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="119" y="217" font-size="21.5" font-weight="600" fill="#111827">Provider out</text>
  <text x="162.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">503 or throttling</text>
  <g filter="url(#ntffail-soft)">
    <rect x="285" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="285" y="165" width="6" height="90" fill="#D97706" clip-path="url(#ntffail-k2)"/>
  </g>
  <circle cx="323" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(312.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="349" y="217" font-size="21.5" font-weight="600" fill="#111827">Backlog</text>
  <text x="392.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">a fan-out surge</text>
  <g filter="url(#ntffail-soft)">
    <rect x="515" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="515" y="165" width="6" height="90" fill="#D97706" clip-path="url(#ntffail-k3)"/>
  </g>
  <circle cx="553" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(542.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="579" y="217" font-size="21.5" font-weight="600" fill="#111827">Worker dies</text>
  <text x="622.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">messages redelivered</text>
  <g filter="url(#ntffail-soft)">
    <rect x="745" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="745" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#ntffail-k4)"/>
  </g>
  <circle cx="783" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(772.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="809" y="217" font-size="21.5" font-weight="600" fill="#111827">User is gone</text>
  <text x="852.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">dead token, bounce</text>
  <g filter="url(#ntffail-soft)">
    <rect x="975" y="165" width="215" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="975" y="165" width="6" height="90" fill="#7C3AED" clip-path="url(#ntffail-k5)"/>
  </g>
  <circle cx="1013" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(1002.56,199.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="1039" y="217" font-size="21.5" font-weight="600" fill="#111827">Store is down</text>
  <text x="1082.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">store unreachable</text>
  <g filter="url(#ntffail-soft)">
    <rect x="55" y="430" width="215" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="55" y="430" width="6" height="90" fill="#059669" clip-path="url(#ntffail-k6)"/>
  </g>
  <circle cx="93" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(82.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="119" y="482" font-size="21.5" font-weight="600" fill="#111827">Break circuit</text>
  <text x="162.5" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">let it recover</text>
  <g filter="url(#ntffail-soft)">
    <rect x="285" y="430" width="215" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="285" y="430" width="6" height="90" fill="#059669" clip-path="url(#ntffail-k7)"/>
  </g>
  <circle cx="323" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(312.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="349" y="482" font-size="21.5" font-weight="600" fill="#111827">Shed bulk</text>
  <text x="392.5" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">keep transactional</text>
  <g filter="url(#ntffail-soft)">
    <rect x="515" y="430" width="215" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="515" y="430" width="6" height="90" fill="#059669" clip-path="url(#ntffail-k8)"/>
  </g>
  <circle cx="553" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(542.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="579" y="482" font-size="21.5" font-weight="600" fill="#111827">Drop repeats</text>
  <text x="622.5" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">the key makes it safe</text>
  <g filter="url(#ntffail-soft)">
    <rect x="745" y="430" width="215" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="745" y="430" width="6" height="90" fill="#059669" clip-path="url(#ntffail-k9)"/>
  </g>
  <circle cx="783" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(772.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="809" y="482" font-size="21.5" font-weight="600" fill="#111827">Delete it</text>
  <text x="852.5" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">stop retrying</text>
  <g filter="url(#ntffail-soft)">
    <rect x="975" y="430" width="215" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="975" y="430" width="6" height="90" fill="#059669" clip-path="url(#ntffail-k10)"/>
  </g>
  <circle cx="1013" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(1002.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="1039" y="482" font-size="21.5" font-weight="600" fill="#111827">Hold and wait</text>
  <text x="1082.5" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">never guess</text>

  <rect x="40" y="660" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="685" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="710" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Not ours to fix</text>
  <text x="323" y="710" font-size="18.5" fill="#475569">Email and SMS providers can be swapped. Only Apple delivers to an iPhone.</text>
  <rect x="64" y="735" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="760" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Ours to contain</text>
  <text x="323" y="760" font-size="18.5" fill="#475569">A surge and a dead worker are expected, and both are handled without losing a message.</text>
  <rect x="64" y="785" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="810" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Hold, do not guess</text>
  <text x="323" y="810" font-size="18.5" fill="#475569">Sending to somebody who opted out cannot be undone. A late notification can.</text>
</svg>