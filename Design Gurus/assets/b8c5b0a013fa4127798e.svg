<rect x="110" y="282" width="240" height="60" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="230" y="318.5" text-anchor="middle" font-size="18" fill="#94A3B8">empty</text>
<rect x="900" y="282" width="240" height="60" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2"/>
<text x="1020" y="318.84" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">remaining = 9</text>
<rect x="40" y="402" width="1160" height="130" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
