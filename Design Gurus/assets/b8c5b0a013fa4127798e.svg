<text x="150" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="206" y="142" width="80" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="246" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="302" y="142" width="80" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="342" y="179.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="900" y="142" width="240" height="60" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="2"/>
<text x="1020" y="178.84" text-anchor="middle" font-size="19" font-weight="600" fill="#5B21B6">target = 9</text>
<rect x="40" y="236" width="1160" height="150" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
