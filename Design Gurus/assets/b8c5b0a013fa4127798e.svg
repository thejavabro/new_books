<rect x="40" y="552" width="1160" height="84" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="592" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">nothing chosen yet</text>
<text x="620" y="624" text-anchor="middle" font-size="18.5" fill="#475569">the remaining target starts at the full target of 9</text>
</svg>