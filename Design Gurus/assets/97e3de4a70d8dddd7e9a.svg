<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Kafka fan-out versus queue work distribution: one retained order event log is read in full by the fulfillment, analytics and fraud consumer groups, while a queue hands each job to exactly one of three workers">
  <defs>
    <marker id="m03-l03-kafka-consumer-groups-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m03-l03-kafka-consumer-groups-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <rect x="40" y="60" width="1160" height="460" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="98" font-size="20" font-weight="600" fill="#334155">Kafka: one stream, every group reads all of it</text>
  <text x="1178" y="98" text-anchor="end" font-size="20" fill="#64748B">Add a fourth group and the other three are unaffected</text>
  <rect x="40" y="550" width="1160" height="460" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="588" font-size="20" font-weight="600" fill="#334155">Classic queue (RabbitMQ, SQS): one pile of jobs</text>
  <text x="1178" y="588" text-anchor="end" font-size="20" fill="#64748B">Add a fourth worker and the pile drains faster</text>

  <g fill="none" stroke="#D97706" stroke-width="2.5">
    <path d="M610,202 L610,248" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M540,368 C540,400 255,392 255,422" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M610,368 L610,422" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M680,368 C680,400 965,392 965,422" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M610,692 L610,738" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M540,838 C540,872 255,878 255,912" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M610,838 L610,912" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
    <path d="M680,838 C680,872 965,878 965,912" marker-end="url(#m03-l03-kafka-consumer-groups-ab)"/>
  </g>

  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="470" y="126" width="280" height="76" rx="10" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="610" y="171" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order events</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <path d="M400,254 L400,364 A210,14 0 0 0 820,364 L820,254 Z" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <ellipse cx="610" cy="254" rx="210" ry="14" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="610" y="312" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Kafka topic: retained log</text>
  <text x="610" y="344" text-anchor="middle" font-size="20" fill="#64748B">each group tracks its own position</text>

  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="110" y="422" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="255" y="460" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment group</text>
  <text x="255" y="490" text-anchor="middle" font-size="20" fill="#64748B">reads all messages</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="465" y="422" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="610" y="460" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Analytics group</text>
  <text x="610" y="490" text-anchor="middle" font-size="20" fill="#64748B">reads all messages</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="820" y="422" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="965" y="460" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fraud group</text>
  <text x="965" y="490" text-anchor="middle" font-size="20" fill="#64748B">reads all messages</text>

  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="470" y="616" width="280" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="610" y="661" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Jobs to run</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="400" y="744" width="420" height="94" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="610" y="784" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Queue: gone once acked</text>
  <text x="610" y="816" text-anchor="middle" font-size="20" fill="#64748B">no history to replay</text>

  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="110" y="912" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="255" y="950" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Worker 1</text>
  <text x="255" y="980" text-anchor="middle" font-size="20" fill="#64748B">takes next job</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="465" y="912" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="610" y="950" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Worker 2</text>
  <text x="610" y="980" text-anchor="middle" font-size="20" fill="#64748B">takes next job</text>
  <g filter="url(#m03-l03-kafka-consumer-groups-soft)">
    <rect x="820" y="912" width="290" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="965" y="950" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Worker 3</text>
  <text x="965" y="980" text-anchor="middle" font-size="20" fill="#64748B">takes next job</text>

  
  <g font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="628" y="232">publish</text>
    <text x="628" y="722">enqueue</text>
    <text x="578" y="400" text-anchor="end">every group receives</text>
    <text x="642" y="400">every message</text>
    <text x="578" y="890" text-anchor="end">each job goes to</text>
    <text x="642" y="890">exactly one worker</text>
  </g>

  <line x1="50" y1="1050" x2="86" y2="1050" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="1057" font-size="20" fill="#475569">Asynchronous delivery: the producer does not wait, the broker holds the message</text>
</svg>