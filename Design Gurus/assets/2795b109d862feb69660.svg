<text x="60" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">0</text>
<path d="M60.0 132V140" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="286.6666666666667" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">10</text>
<path d="M286.7 132V140" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="558.6666666666667" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">22</text>
<path d="M558.7 132V140" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="921.3333333333334" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">38</text>
<path d="M921.3 132V140" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1080" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="middle">45</text>
<path d="M1080.0 132V140" fill="none" stroke="#284E65" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1100" y="126" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">minutes</text>
<text x="139.33333333333334" y="218" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">scope</text>
<path d="M252.7 192V222" fill="none" stroke="#39D5AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="252.66666666666669" y="244" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">numbers</text>
<text x="422.6666666666667" y="218" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">high level</text>
<path d="M740.0 192V222" fill="none" stroke="#F28B9D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="740" y="244" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the deep dive</text>
<path d="M966.7 192V222" fill="none" stroke="#AC8BE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="966.6666666666667" y="244" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">failure, ops, cost</text>
<text x="1046" y="218" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">close</text>
<rect x="40" y="276" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="314" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The shortest substantial block</text>
<path d="M526 308H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 308H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#budget-marker-slate)"/>
<rect x="570" y="276" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="301.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the high-level design is necessary and is not where the</text><text x="590" y="326.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">differentiation is. It makes a deep dive possible</text>
<rect x="40" y="352" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="390" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The largest block</text>
<path d="M526 384H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 384H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#budget-marker-slate)"/>
<rect x="570" y="352" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="377.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sixteen of the forty-five minutes. Arriving at minute</text><text x="590" y="402.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">thirty-five caps the score, whatever you say next</text>
<rect x="40" y="436" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="436" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="467.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The characteristic failure is not ignorance. It is budgeting.</text><text x="64" y="496.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">You are not being asked to finish. You are being asked to demonstrate.</text>
<text x="66" y="576" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Demonstration has an order, and the order is the plan.</text>
</svg>