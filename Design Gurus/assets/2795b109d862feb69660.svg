<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="budget-title budget-desc">
<title id="budget-title">The constraint nobody plans for</title>
<desc id="budget-desc">A design exercise with a hard time limit, where most candidates lose to the limit rather than to the material. Two properties of the allocation are counterintuitive.</desc>
<defs>
<marker id="budget-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="budget-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="budget-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="budget-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="620" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The constraint nobody plans for</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A working allocation for a forty-five minute session, which is the common length.</text>
<rect x="40" y="542" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="542" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
