<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="628" viewBox="0 0 1240 628" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On one incident timeline the RPO is the window of data written before the failure that was never backed up, and the RTO is the window after the failure before service returns">
  <rect x="0" y="0" width="1240" height="628" fill="#FFFFFF"/>
  <defs>
    <marker id="rl1-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two different windows around the same moment</text>

  <line x1="620" y1="110" x2="620" y2="302" stroke="#DC2626" stroke-width="3"/>
  <text x="620" y="100" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the failure</text>

  <rect x="330" y="170" width="290" height="70" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="475" y="212" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">RPO: data at risk</text>

  <rect x="620" y="170" width="380" height="70" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="810" y="212" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">RTO: time to be back</text>

  <text x="330" y="150" font-size="20" fill="#64748B" text-anchor="middle">last good backup</text>
  <text x="1000" y="150" font-size="20" fill="#64748B" text-anchor="middle">service restored</text>

  <line x1="180" y1="290" x2="1120" y2="290" stroke="#475569" stroke-width="2" marker-end="url(#rl1-slate)"/>

  <text x="450" y="330" font-size="20" fill="#92400E" text-anchor="middle">everything in here is gone</text>
  <text x="810" y="330" font-size="20" fill="#1E40AF" text-anchor="middle">everyone is waiting in here</text>

  <rect x="50" y="376" width="555" height="150" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M50 388 a12 12 0 0 1 12 -12 h531 a12 12 0 0 1 12 12 v40 h-555 z" fill="#FFFBEB"/>
  <text x="327" y="410" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">RPO looks backwards</text>
  <text x="70" y="468" font-size="20" fill="#0F172A">How much data can you afford to lose?</text>
  <text x="70" y="500" font-size="20" fill="#92400E">Answered by how often you replicate or back up.</text>

  <rect x="635" y="376" width="555" height="150" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M635 388 a12 12 0 0 1 12 -12 h531 a12 12 0 0 1 12 12 v40 h-555 z" fill="#EFF6FF"/>
  <text x="912" y="410" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">RTO looks forwards</text>
  <text x="655" y="468" font-size="20" fill="#0F172A">How long can you afford to be down?</text>
  <text x="655" y="500" font-size="20" fill="#1E40AF">Answered by how fast you can fail over.</text>

  <rect x="50" y="556" width="1140" height="52" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="588" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">They are independent. You can come back in a minute and still have lost an hour of writes.</text>
</svg>