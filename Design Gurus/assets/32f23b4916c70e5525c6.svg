<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five questions, always in this order">
  <rect x="0" y="0" width="1240" height="728" fill="#FFFFFF"/>
  <defs>
    <marker id="a-3B82F6" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="a-DC2626" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
  </defs>
  <text x="620" y="46" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">Five questions, always in this order</text>
  <rect x="60" y="104" width="620" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="370" y="143" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">1. How does data move?</text>
  <rect x="750" y="104" width="380" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="940" y="143" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">The arrows</text>
  <line x1="680" y1="136.5" x2="742" y2="136.5" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a-3B82F6)"/>
  <rect x="60" y="208" width="620" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="370" y="247" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">2. Where does data live?</text>
  <rect x="750" y="208" width="380" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="940" y="247" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">The databases</text>
  <line x1="680" y1="240.5" x2="742" y2="240.5" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a-3B82F6)"/>
  <rect x="60" y="312" width="620" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="370" y="351" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">3. How is it served fast?</text>
  <rect x="750" y="312" width="380" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="940" y="351" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">The caches</text>
  <line x1="680" y1="344.5" x2="742" y2="344.5" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a-3B82F6)"/>
  <rect x="60" y="416" width="620" height="65" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="370" y="455" font-size="21" font-weight="700" fill="#991B1B" text-anchor="middle">4. What happens when it fails?</text>
  <rect x="750" y="416" width="380" height="65" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="940" y="455" font-size="21" font-weight="700" fill="#991B1B" text-anchor="middle">The failure budget</text>
  <line x1="680" y1="448.5" x2="742" y2="448.5" stroke="#DC2626" stroke-width="2.5" marker-end="url(#a-DC2626)"/>
  <rect x="60" y="520" width="620" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="370" y="559" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">5. How does it grow?</text>
  <rect x="750" y="520" width="380" height="65" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="940" y="559" font-size="21" font-weight="700" fill="#1E3A8A" text-anchor="middle">The capacity plan</text>
  <line x1="680" y1="552.5" x2="742" y2="552.5" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#a-3B82F6)"/>
  <text x="620" y="639" font-size="21" font-weight="700" fill="#0F172A" text-anchor="middle">Get the numbers first. Then ask them in order, every time.</text>
  <text x="620" y="675" font-size="20" fill="#991B1B" text-anchor="middle">Question 4 is commonly skipped.</text>
</svg>