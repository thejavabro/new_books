<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1004" viewBox="0 0 1240 1004" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A conversation with many messages and many receipts. The messages carry server-assigned sequence numbers 518 through 521. Two participants have read to different points, so one receipt stops at 519 and the other at 521. The sequence orders the messages while a receipt advances through it.">
  <defs>
    <marker id="p2o-bm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p2o-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p2o-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2o-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2o-k1"><rect x="470" y="178" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p2o-k2"><rect x="100" y="448" width="444" height="48" rx="10"/></clipPath>
    <clipPath id="p2o-k3"><rect x="100" y="530" width="444" height="48" rx="10"/></clipPath>
    <clipPath id="p2o-k4"><rect x="100" y="612" width="444" height="48" rx="10"/></clipPath>
    <clipPath id="p2o-k5"><rect x="100" y="694" width="444" height="48" rx="10"/></clipPath>
    <clipPath id="p2o-k6"><rect x="696" y="509" width="444" height="90" rx="12"/></clipPath>
    <clipPath id="p2o-k7"><rect x="696" y="673" width="444" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1004" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Sequence orders messages, a receipt advances through it</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the chat data model</text>

  
  <rect x="40" y="126" width="1160" height="198" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">The parent record</text>

  
  <rect x="40" y="400" width="564" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="430" font-size="16.5" font-weight="600" fill="#1D4ED8">Message</text>
  <text x="580" y="430" text-anchor="end" font-size="15.5" fill="#6B7280">four messages</text>

  
  <rect x="636" y="400" width="564" height="420" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="660" y="430" font-size="16.5" font-weight="600" fill="#047857">Receipt</text>
  <text x="1176" y="430" text-anchor="end" font-size="15.5" fill="#6B7280">two receipts</text>

  
  <g fill="none" stroke-width="2">
    <path d="M470,223 H334 Q322,223 322,235 V448" stroke="#2563EB" marker-end="url(#p2o-bm)"/>
    <path d="M770,223 H906 Q918,223 918,235 V509" stroke="#059669" marker-end="url(#p2o-em)"/>
    <path d="M696,554 H544" stroke="#059669" stroke-width="2.5" marker-end="url(#p2o-em)"/>
    <path d="M696,718 H544" stroke="#059669" stroke-width="2.5" marker-end="url(#p2o-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="400" y="212" fill="#1D4ED8">one to many</text>
    <text x="840" y="212" fill="#047857">one to many</text>
  </g>

  
  <g filter="url(#p2o-lift)">
    <rect x="470" y="178" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="470" y="178" width="9" height="90" fill="#64748B" clip-path="url(#p2o-k1)"/>
  </g>
  <circle cx="508" cy="223" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,212.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="534" y="230" font-size="18.5" font-weight="600" fill="#111827">Conversation</text>
  <text x="620" y="293" text-anchor="middle" font-size="15.5" fill="#6B7280">many messages and many receipts belong to one conversation</text>

  
  <g filter="url(#p2o-soft)">
    <rect x="100" y="448" width="444" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="448" width="6" height="48" fill="#2563EB" clip-path="url(#p2o-k2)"/>
  </g>
  <circle cx="134" cy="472" r="4.5" fill="#2563EB"/>
  <text x="158" y="479" font-size="18.5" font-weight="600" fill="#111827">sequence 518</text>

  <g filter="url(#p2o-soft)">
    <rect x="100" y="530" width="444" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="530" width="6" height="48" fill="#2563EB" clip-path="url(#p2o-k3)"/>
  </g>
  <circle cx="134" cy="554" r="4.5" fill="#2563EB"/>
  <text x="158" y="561" font-size="18.5" font-weight="600" fill="#111827">sequence 519</text>

  <g filter="url(#p2o-soft)">
    <rect x="100" y="612" width="444" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="612" width="6" height="48" fill="#2563EB" clip-path="url(#p2o-k4)"/>
  </g>
  <circle cx="134" cy="636" r="4.5" fill="#2563EB"/>
  <text x="158" y="643" font-size="18.5" font-weight="600" fill="#111827">sequence 520</text>

  <g filter="url(#p2o-soft)">
    <rect x="100" y="694" width="444" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="100" y="694" width="6" height="48" fill="#2563EB" clip-path="url(#p2o-k5)"/>
  </g>
  <circle cx="134" cy="718" r="4.5" fill="#2563EB"/>
  <text x="158" y="725" font-size="18.5" font-weight="600" fill="#111827">sequence 521</text>

  <text x="322" y="782" text-anchor="middle" font-size="15.5" fill="#94A3B8">sequence numbers are assigned by the server, in order</text>

  
  <g filter="url(#p2o-soft)">
    <rect x="696" y="509" width="444" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="509" width="6" height="90" fill="#059669" clip-path="url(#p2o-k6)"/>
  </g>
  <circle cx="734" cy="554" r="18" fill="#FFFFFF"/>
  <g transform="translate(723.56,543.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="760" y="561" font-size="18.5" font-weight="600" fill="#111827">usr_73P</text>
  <text x="918" y="624" text-anchor="middle" font-size="15.5" fill="#6B7280">read through 519</text>

  <g filter="url(#p2o-soft)">
    <rect x="696" y="673" width="444" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="696" y="673" width="6" height="90" fill="#059669" clip-path="url(#p2o-k7)"/>
  </g>
  <circle cx="734" cy="718" r="18" fill="#FFFFFF"/>
  <g transform="translate(723.56,707.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="760" y="725" font-size="18.5" font-weight="600" fill="#111827">usr_42Q</text>
  <text x="918" y="788" text-anchor="middle" font-size="15.5" fill="#6B7280">read through 521</text>

  
  <rect x="40" y="864" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="906" text-anchor="middle" font-size="16" fill="#475569">One receipt marks a whole screen read, so thirty readers do not need a flag on every message.</text>
  <text x="620" y="934" text-anchor="middle" font-size="16" fill="#475569">To ask who read message 520, the server asks which positions are at least 520.</text>
</svg>