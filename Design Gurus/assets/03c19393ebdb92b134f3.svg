<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Ask who set up the proxy. If the client side configured it in the browser or network settings, it is a forward proxy that works for the clients. If the service owner set it up and pointed DNS at it, it is a reverse proxy that works for the servers.">
  <defs>
    <filter id="pvr2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="pvr2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="pvr2-k1"><rect x="40" y="290" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="pvr2-k2"><rect x="470" y="140" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="pvr2-k3"><rect x="470" y="440" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="pvr2-k4"><rect x="900" y="140" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="pvr2-k5"><rect x="900" y="440" width="300" height="90" rx="12"/></clipPath>
    <marker id="pvr2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pvr2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">One question tells them apart</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The side that sets up the proxy is the side it works for.</text>



  <g fill="none" stroke-width="2">
    <path d="M320,315 H400 Q415,315 415,300 V200 Q415,185 430,185 H470" stroke="#7C3AED" marker-end="url(#pvr2-m-violet)"/>
    <path d="M320,355 H400 Q415,355 415,370 V470 Q415,485 430,485 H470" stroke="#2563EB" marker-end="url(#pvr2-m-blue)"/>
    <path d="M800,185 H900" stroke="#7C3AED" marker-end="url(#pvr2-m-violet)"/>
    <path d="M800,485 H900" stroke="#2563EB" marker-end="url(#pvr2-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#pvr2-soft)">
    <rect x="40" y="290" width="280" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="290" width="6" height="90" fill="#64748B" clip-path="url(#pvr2-k1)"/>
  </g>
  <circle cx="78" cy="335" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,324.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="104" y="342" font-size="21.5" font-weight="600" fill="#111827">Who set it up?</text>
  <g filter="url(#pvr2-soft)">
    <rect x="470" y="140" width="330" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="470" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#pvr2-k2)"/>
  </g>
  <circle cx="508" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="534" y="192" font-size="21.5" font-weight="600" fill="#111827">The client side</text>
  <text x="635" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">browser or network settings</text>
  <g filter="url(#pvr2-soft)">
    <rect x="470" y="440" width="330" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="470" y="440" width="6" height="90" fill="#2563EB" clip-path="url(#pvr2-k3)"/>
  </g>
  <circle cx="508" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="534" y="492" font-size="21.5" font-weight="600" fill="#111827">The service owner</text>
  <text x="635" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">DNS points to the proxy</text>
  <g filter="url(#pvr2-soft)">
    <rect x="900" y="140" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="900" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#pvr2-k4)"/>
  </g>
  <circle cx="938" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="964" y="192" font-size="21.5" font-weight="600" fill="#111827">Forward proxy</text>
  <text x="1050" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">works for the clients</text>
  <g filter="url(#pvr2-lift)">
    <rect x="900" y="440" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="900" y="440" width="9" height="90" fill="#2563EB" clip-path="url(#pvr2-k5)"/>
  </g>
  <circle cx="938" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(927.56,474.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="964" y="492" font-size="21.5" font-weight="600" fill="#111827">Reverse proxy</text>
  <text x="1050" y="559" font-size="18.5" text-anchor="middle" fill="#6B7280">works for the servers</text>

  <rect x="40" y="600" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="625" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Forward</text>
  <text x="323" y="650" font-size="18.5" fill="#475569">hides the clients from the websites they visit</text>
  <rect x="64" y="675" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="700" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Reverse</text>
  <text x="323" y="700" font-size="18.5" fill="#475569">hides the backend servers from the clients</text>
</svg>