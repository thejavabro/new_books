<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="738" viewBox="0 0 1240 738" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="replaces-title replaces-desc">
<title id="replaces-title">What it replaces, and what it does not</title>
<desc id="replaces-desc">Overclaiming is how this gets rejected by the people who have to approve it. The modest version is easy to approve and finds real defects in the first afternoon.</desc>
<defs>
<marker id="replaces-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="replaces-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="replaces-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="replaces-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="738" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What it replaces, and what it does not</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Overclaiming is how this gets rejected by the people who have to approve it.</text>
<rect x="40" y="660" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="660" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It does not replace tests</text>
<path d="M526 150H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 150H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#replaces-marker-slate)"/>
<rect x="570" y="118" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tests check logic; this checks beliefs</text><text x="590" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">about behavior under failure</text>
<rect x="40" y="190" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It does not prove resilience</text>
<path d="M526 222H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 222H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#replaces-marker-slate)"/>
<rect x="570" y="190" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="215.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">it proves one mechanism worked once</text><text x="590" y="240.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">under one injected condition</text>
<rect x="40" y="262" width="480" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="300" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">It does not require randomness</text>
<path d="M526 294H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 294H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#replaces-marker-slate)"/>
<rect x="570" y="262" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="287.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a chosen hypothesis-driven injection</text><text x="590" y="312.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">answers a question somebody had</text>
<rect x="40" y="346" width="1160" height="102" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="346" width="5" height="102" rx="2.5" fill="#39D5AA"/><text x="64" y="377" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What it does replace</text><text x="64" y="403" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The belief that the resilience mechanisms work. That belief is held with</text><text x="64" y="429" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">confidence everywhere and is correct much less often than people expect.</text>
<rect x="40" y="468" width="1160" height="80" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="500.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A reasonable rhythm for a small team: one experiment attached to anything new that goes</text><text x="620" y="527.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on call, plus a recurring one on the critical path. A few hours a month</text>
<rect x="40" y="568" width="1160" height="66" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="568" width="5" height="66" rx="2.5" fill="#AC8BE8"/><text x="64" y="607" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A mechanism never exercised should be assumed broken until somebody has watched it work.</text>
<text x="66" y="694" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The cheapest reliability work available, because every finding costs nothing at the moment it is found.</text>
</svg>