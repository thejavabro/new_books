<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1058" viewBox="0 0 1240 1058" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A user authors many posts, and the user to post relationship is a reaction which owns its own type and created_at. A feed is a read-only derived collection over an ordered set of posts. One feed item carries four separate projections: the post, a small author projection, reaction counts, and the viewer reaction placed beside the post rather than stored on it.">
  <defs>
    <marker id="p3m-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p3m-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p3m-sm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p3m-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p3m-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p3m-k1"><rect x="90" y="196" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3m-k2"><rect x="470" y="196" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3m-k3"><rect x="850" y="196" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3m-k4"><rect x="470" y="510" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="p3m-k5"><rect x="104" y="730" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p3m-k6"><rect x="636" y="730" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p3m-k7"><rect x="104" y="812" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p3m-k8"><rect x="636" y="812" width="500" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1058" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Viewer reaction sits beside the post, never on it</text>

  
  <rect x="40" y="126" width="1160" height="314" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">What the server stores</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">User to Post is many to many, through Reaction</text>

  
  <g fill="none" stroke-width="2">
    <path d="M390,241 H470" stroke="#D97706" marker-end="url(#p3m-am)"/>
    <path d="M770,241 H850" stroke="#D97706" marker-end="url(#p3m-am)"/>
    <path d="M240,286 V388 Q240,400 252,400 H988 Q1000,400 1000,388 V286" stroke="#059669" stroke-width="2.5" marker-end="url(#p3m-em)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="388" fill="#047857">authors, one to many</text>
  </g>

  
  <g filter="url(#p3m-soft)">
    <rect x="90" y="196" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="90" y="196" width="6" height="90" fill="#059669" clip-path="url(#p3m-k1)"/>
  </g>
  <circle cx="128" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(117.56,230.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="154" y="248" font-size="18.5" font-weight="600" fill="#111827">User</text>

  
  <g filter="url(#p3m-lift)">
    <rect x="470" y="196" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="470" y="196" width="9" height="90" fill="#D97706" clip-path="url(#p3m-k2)"/>
  </g>
  <circle cx="508" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,230.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="534" y="248" font-size="18.5" font-weight="600" fill="#111827">Reaction</text>
  <text x="620" y="311" text-anchor="middle" font-size="15.5" fill="#6B7280">type</text>
  <text x="620" y="334" text-anchor="middle" font-size="15.5" fill="#94A3B8">created_at</text>

  
  <g filter="url(#p3m-soft)">
    <rect x="850" y="196" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="850" y="196" width="6" height="90" fill="#2563EB" clip-path="url(#p3m-k3)"/>
  </g>
  <circle cx="888" cy="241" r="18" fill="#FFFFFF"/>
  <g transform="translate(877.56,230.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="914" y="248" font-size="18.5" font-weight="600" fill="#111827">Post</text>

  
  <rect x="40" y="460" width="1160" height="462" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="490" font-size="16.5" font-weight="600" fill="#475569">The feed, derived over those posts</text>

  
  <rect x="64" y="680" width="1112" height="222" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="88" y="710" font-size="16.5" font-weight="600" fill="#5B21B6">One feed item</text>
  <text x="1152" y="710" text-anchor="end" font-size="15.5" fill="#6B7280">four projections</text>

  
  <g fill="none" stroke-width="2">
    <path d="M470,555 H372 Q360,555 360,567 V680" stroke="#64748B" marker-end="url(#p3m-sm)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="360" y="630" fill="#475569">each item carries</text>
  </g>

  
  <g filter="url(#p3m-soft)">
    <rect x="470" y="510" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="470" y="510" width="6" height="90" fill="#64748B" clip-path="url(#p3m-k4)"/>
  </g>
  <circle cx="508" cy="555" r="18" fill="#FFFFFF"/>
  <g transform="translate(497.56,544.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="534" y="562" font-size="18.5" font-weight="600" fill="#111827">Feed</text>
  <text x="620" y="625" text-anchor="middle" font-size="15.5" fill="#6B7280">read-only derived</text>
  <text x="620" y="648" text-anchor="middle" font-size="15.5" fill="#94A3B8">an ordered set of posts</text>

  
  <g filter="url(#p3m-soft)">
    <rect x="104" y="730" width="500" height="48" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="104" y="730" width="6" height="48" fill="#2563EB" clip-path="url(#p3m-k5)"/>
  </g>
  <circle cx="138" cy="754" r="4.5" fill="#2563EB"/>
  <text x="162" y="761" font-size="18.5" font-weight="600" fill="#111827">post</text>
  <text x="354" y="798" text-anchor="middle" font-size="15.5" fill="#6B7280">the canonical content</text>

  
  <g filter="url(#p3m-soft)">
    <rect x="636" y="730" width="500" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="636" y="730" width="6" height="48" fill="#059669" clip-path="url(#p3m-k6)"/>
  </g>
  <circle cx="670" cy="754" r="4.5" fill="#059669"/>
  <text x="694" y="761" font-size="18.5" font-weight="600" fill="#111827">author</text>
  <text x="886" y="798" text-anchor="middle" font-size="15.5" fill="#6B7280">a small projection</text>

  
  <g filter="url(#p3m-soft)">
    <rect x="104" y="812" width="500" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="104" y="812" width="6" height="48" fill="#64748B" clip-path="url(#p3m-k7)"/>
  </g>
  <circle cx="138" cy="836" r="4.5" fill="#64748B"/>
  <text x="162" y="843" font-size="18.5" font-weight="600" fill="#111827">reaction_counts</text>
  <text x="354" y="880" text-anchor="middle" font-size="15.5" fill="#6B7280">a computed aggregate</text>

  
  <g filter="url(#p3m-lift)">
    <rect x="636" y="812" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="636" y="812" width="9" height="48" fill="#D97706" clip-path="url(#p3m-k8)"/>
  </g>
  <circle cx="670" cy="836" r="15" fill="#FFFFFF"/>
  <g transform="translate(661,827) scale(0.75)" fill="none" stroke="#D97706" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="694" y="843" font-size="18.5" font-weight="600" fill="#111827">viewer_reaction</text>
  <text x="886" y="880" text-anchor="middle" font-size="15.5" fill="#6B7280">caller-specific, beside the post</text>

  
  <rect x="40" y="942" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="987" text-anchor="middle" font-size="16" fill="#475569">Stored on the post, viewer_reaction would claim a different value for every caller.</text>
</svg>