<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A grid of twelve queues. Three rows are the priority classes: transactional, which is never delayed or shed; default, carrying most product notifications; and bulk, which is delayed first and dropped first. Each row holds four channels: email, SMS, push and in-app. Separating channels contains a failing provider, and separating classes keeps an urgent message out of a campaign queue.">
