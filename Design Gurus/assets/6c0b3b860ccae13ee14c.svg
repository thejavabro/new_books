  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">One queue per channel, and one per class inside it</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Separating channels contains a failing provider. Separating classes keeps a passcode out of a campaign queue.</text>

