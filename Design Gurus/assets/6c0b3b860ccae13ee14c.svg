  <rect x="64" y="660" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="685" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Twelve topics</text>
  <text x="323" y="685" font-size="18.5" fill="#475569">Four channels times three classes. More to operate, and the only way to promise both.</text>
  <rect x="64" y="710" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="735" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Channel isolation</text>
  <text x="323" y="735" font-size="18.5" fill="#475569">A failing email provider cannot delay a push, because they share no queue.</text>
  <rect x="64" y="760" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="785" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Class isolation</text>
  <text x="323" y="785" font-size="18.5" fill="#475569">A ten million message campaign cannot delay a one-time passcode.</text>
