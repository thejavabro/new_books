  <text x="230" y="460" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One partition per user.</text>
  <text x="645" y="636" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One minute of due work, split N ways so N schedulers can drain it.</text>
  <text x="1035" y="420" font-size="18" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">One row per attempt.</text>

  <rect x="40" y="690" width="1160" height="210" rx="14" fill="#FFFBEB" stroke="#D97706" stroke-width="1.8"/>
  <text x="620" y="730" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Why the due minute alone is not a good partition key</text>
  <text x="620" y="770" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Reminders cluster on round times. Far more are due at 09:00 than at 09:03.</text>
  <text x="620" y="800" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Partitioning on the minute alone would send that whole spike to one partition and one node.</text>
  <text x="620" y="830" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">Adding a segment chosen at write time spreads the same minute over N partitions.</text>
  <text x="620" y="860" font-size="19" fill="#475569" text-anchor="middle" font-family="&#39;Segoe UI&#39;, Arial, sans-serif">The scheduler is then N workers each draining one segment, instead of one worker queueing.</text>
</svg>