<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" role="img" aria-label="The reminder alert system data model. The Reminders table is partitioned by user_id and clustered by reminder_id, so listing one user reminders reads one partition. The Schedule table is partitioned by execution_minute together with a segment number and clustered by reminder_id, so the reminders due in one minute are spread across N partitions instead of landing in one. It carries a copy of user_id so the scheduler needs no second read. The NotificationLog is partitioned by reminder_id and clustered by execution time, holding one row per delivery attempt.">
