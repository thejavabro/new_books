<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="621" viewBox="0 0 1240 621" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="egress-title egress-desc">
<title id="egress-title">The egress bill exceeds the revenue</title>
<desc id="egress-desc">Thirty minutes a day at three megabits per second is about twenty gigabytes a month per user, which at the order of ten cents a gigabyte costs about two dollars, against a product earning about two dollars per user.</desc>
<defs>
<marker id="egress-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="egress-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="egress-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="egress-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="621" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The egress bill exceeds the revenue</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Compare that against what a user is worth.</text>
<rect x="40" y="543" width="1160" height="52" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="543" width="5" height="52" rx="2.5" fill="#F28B9D"/>
<rect x="40" y="118" width="1160" height="72" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="72" rx="2.5" fill="#5EC9EC"/><text x="64" y="162" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">The proposal</text><text x="290" y="147.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Serve video streams directly from the application servers. Simple, no third party,</text><text x="290" y="174.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">full control over delivery.</text>
<text x="40" y="229" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The arithmetic</text>
<rect x="40" y="247" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="279" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">3 Mbps  x  1,800 seconds  =  about 675 MB a day</text>
<rect x="40" y="309" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="341" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">across a month, roughly 20 GB per user</text>
<rect x="40" y="371" width="830" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="60" y="403" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">at the order of 10 cents a gigabyte, about $2 per user per month</text>
<rect x="890" y="247" width="310" height="176" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1045" y="312" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">Bandwidth alone</text><text x="1045" y="341" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">consumes the whole</text><text x="1045" y="370" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">revenue</text>
<rect x="40" y="445" width="1160" height="72" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="445" width="5" height="72" rx="2.5" fill="#39D5AA"/><text x="64" y="489" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">What replaces it</text><text x="290" y="474.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Reduce bytes with a lower bitrate, reduce price per byte with a delivery network at</text><text x="290" y="501.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">committed volume, or reduce minutes, which is a product decision.</text>
<text x="66" y="577" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The design is not expensive. It loses money on every user, and the calculation takes under a minute.</text>
</svg>