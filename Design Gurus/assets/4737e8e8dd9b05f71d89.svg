<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sorted array and the target">
<defs>
<filter id="kn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Which 3 numbers are closest to 10?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is sorted, so the closest numbers must sit together around where 10 belongs</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The array is sorted, and the target is 10</text>
<text x="362" y="225" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">sorted</text>
<rect x="386" y="186" width="84" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="428" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="482" y="186" width="84" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="524" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="578" y="186" width="84" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="620" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="674" y="186" width="84" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="716" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="770" y="186" width="84" height="62" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="812" y="224.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">9</text>
<text x="378" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">heap</text>
<text x="408" y="354" font-size="18.5" fill="#475569">empty</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Find where 10 belongs, then look only at the 3 numbers either side of it</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">Sorted order means nothing far from that place can be among the closest</text>
</svg>