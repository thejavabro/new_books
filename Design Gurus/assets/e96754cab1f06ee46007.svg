<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="440" viewBox="0 0 1240 440" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="When a very popular key expires, every request for it misses at the same moment and all of them reach the database. The fix is to let one request refresh the key while the others wait or use the old value.">
  <rect x="0" y="0" width="1240" height="440" fill="#FFFFFF"/>
  <defs>
    <marker id="ca4-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ca4-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ca4-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ca4-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="ca4-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ca4-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="ca4-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="ca4-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="ca4-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">A popular key expires, and every request goes to the database at once</text>
  <rect x="24" y="70" width="588" height="330" rx="11" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#B91C1C" text-anchor="middle">Without protection</text>
  <g filter="url(#ca4-soft)"><rect x="94" y="132" width="180" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="184" y="168" font-size="19" fill="#0F172A" text-anchor="middle">5,000 requests</text>
  <g filter="url(#ca4-soft)"><rect x="354" y="132" width="180" height="56" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="444" y="168" font-size="19" fill="#B91C1C" text-anchor="middle">key expired</text>
  <line x1="278" y1="160" x2="350" y2="160" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="240" y1="200" x2="300" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="280" y1="200" x2="308" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="320" y1="200" x2="316" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="360" y1="200" x2="324" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="400" y1="200" x2="332" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="440" y1="200" x2="340" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <line x1="480" y1="200" x2="348" y2="268" stroke="#DC2626" stroke-width="2.2" marker-end="url(#ca4-r)"/>
  <g filter="url(#ca4-soft)"><rect x="214" y="274" width="200" height="62" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="314" y="313" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">database</text>
  <text x="318" y="372" font-size="19" fill="#B91C1C" text-anchor="middle">5,000 copies of the same query.</text>
  <rect x="628" y="70" width="588" height="330" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#065F46" text-anchor="middle">With one refresher</text>
  <g filter="url(#ca4-soft)"><rect x="698" y="132" width="180" height="56" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="788" y="168" font-size="19" fill="#0F172A" text-anchor="middle">5,000 requests</text>
  <g filter="url(#ca4-soft)"><rect x="958" y="132" width="180" height="56" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="1048" y="168" font-size="19" fill="#065F46" text-anchor="middle">key expired</text>
  <line x1="882" y1="160" x2="954" y2="160" stroke="#059669" stroke-width="2.2" marker-end="url(#ca4-e)"/>
  <line x1="1048" y1="192" x2="1000" y2="268" stroke="#059669" stroke-width="2.2" marker-end="url(#ca4-e)"/>
  <text x="1080" y="236" font-size="18" font-weight="600" fill="#065F46" text-anchor="start">only one</text>
  <text x="1080" y="260" font-size="18" fill="#64748B" text-anchor="start">goes through</text>
  <g filter="url(#ca4-soft)"><rect x="818" y="274" width="200" height="62" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="918" y="313" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">database</text>
  <text x="922" y="372" font-size="19" fill="#065F46" text-anchor="middle">The rest wait, or get the old value.</text>
</svg>