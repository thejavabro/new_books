<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1326" viewBox="0 0 1240 1326" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four decision drivers worked top down. Each numbered question sits on the left with the condition that answers it, and points right to the contract that condition selects: REST, then GraphQL, then gRPC, then REST again. The GraphQL and gRPC rows carry the cost each one adds. A default row at the bottom keeps REST when no trigger fires.">
  <defs>
    <marker id="p7-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="p7-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p7-vt" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="p7-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p7-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p7-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p7-k1"><rect x="72" y="146" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k2"><rect x="790" y="146" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k3"><rect x="72" y="362" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k4"><rect x="790" y="362" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k5"><rect x="72" y="578" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k6"><rect x="790" y="578" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k7"><rect x="72" y="794" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k8"><rect x="790" y="794" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="p7-k9"><rect x="480" y="1034" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1326" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Four decision drivers</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each gate points to the contract it selects</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M302,306 V342" marker-end="url(#p7-sl)"/>
    <path d="M302,522 V558" marker-end="url(#p7-sl)"/>
    <path d="M302,738 V774" marker-end="url(#p7-sl)"/>
    <path d="M302,954 V990" marker-end="url(#p7-sl)"/>
  </g>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M532,191 H790" stroke="#2563EB" marker-end="url(#p7-bl)"/>
  </g>

  <g filter="url(#p7-soft)">
    <rect x="72" y="146" width="460" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="146" width="6" height="90" fill="#64748B" clip-path="url(#p7-k1)"/>
  </g>
  <circle cx="110" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,180.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="136" y="198" font-size="18.5" font-weight="600" fill="#111827">1. Who calls it?</text>
  <text x="302" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">Browser or public partner</text>

  <g filter="url(#p7-soft)">
    <rect x="790" y="146" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="790" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p7-k2)"/>
  </g>
  <circle cx="828" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(817.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="854" y="198" font-size="18.5" font-weight="600" fill="#111827">REST</text>
  <text x="885" y="261" font-size="15.5" text-anchor="middle" fill="#6B7280">Fixed response shapes</text>

  
  <rect x="40" y="342" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M532,407 H790" stroke="#7C3AED" marker-end="url(#p7-vt)"/>
  </g>

  <g filter="url(#p7-soft)">
    <rect x="72" y="362" width="460" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="362" width="6" height="90" fill="#64748B" clip-path="url(#p7-k3)"/>
  </g>
  <circle cx="110" cy="407" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,396.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="136" y="414" font-size="18.5" font-weight="600" fill="#111827">2. How varied are the field needs?</text>
  <text x="302" y="477" font-size="15.5" text-anchor="middle" fill="#6B7280">Several clients need different</text>
  <text x="302" y="500" font-size="15.5" text-anchor="middle" fill="#6B7280">connected field sets</text>

  <g filter="url(#p7-soft)">
    <rect x="790" y="362" width="190" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="790" y="362" width="6" height="90" fill="#7C3AED" clip-path="url(#p7-k4)"/>
  </g>
  <circle cx="828" cy="407" r="18" fill="#FFFFFF"/>
  <g transform="translate(817.56,396.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="854" y="414" font-size="18.5" font-weight="600" fill="#111827">GraphQL</text>
  <text x="885" y="477" font-size="15.5" text-anchor="middle" fill="#6B7280">Cost: depth limits, field budgets,</text>
  <text x="885" y="500" font-size="15.5" text-anchor="middle" fill="#6B7280">N+1 batching, harder caching</text>

  
  <rect x="40" y="558" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M532,623 H790" stroke="#059669" marker-end="url(#p7-em)"/>
  </g>

  <g filter="url(#p7-soft)">
    <rect x="72" y="578" width="460" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="578" width="6" height="90" fill="#64748B" clip-path="url(#p7-k5)"/>
  </g>
  <circle cx="110" cy="623" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,612.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="630" font-size="18.5" font-weight="600" fill="#111827">3. What volume and message size?</text>
  <text x="302" y="693" font-size="15.5" text-anchor="middle" fill="#6B7280">Controlled internal services,</text>
  <text x="302" y="716" font-size="15.5" text-anchor="middle" fill="#6B7280">high volume of small typed calls</text>

  <g filter="url(#p7-soft)">
    <rect x="790" y="578" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="790" y="578" width="6" height="90" fill="#059669" clip-path="url(#p7-k6)"/>
  </g>
  <circle cx="828" cy="623" r="18" fill="#FFFFFF"/>
  <g transform="translate(817.56,612.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="854" y="630" font-size="18.5" font-weight="600" fill="#111827">gRPC</text>
  <text x="885" y="693" font-size="15.5" text-anchor="middle" fill="#6B7280">Cost: code generation, tooling,</text>
  <text x="885" y="716" font-size="15.5" text-anchor="middle" fill="#6B7280">gateway for browsers</text>

  
  <rect x="40" y="774" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke-width="2">
    <path d="M532,839 H790" stroke="#2563EB" marker-end="url(#p7-bl)"/>
  </g>

  <g filter="url(#p7-soft)">
    <rect x="72" y="794" width="460" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="794" width="6" height="90" fill="#64748B" clip-path="url(#p7-k7)"/>
  </g>
  <circle cx="110" cy="839" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,828.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="136" y="846" font-size="18.5" font-weight="600" fill="#111827">4. How easy must it be to try?</text>
  <text x="302" y="909" font-size="15.5" text-anchor="middle" fill="#6B7280">Public onboarding and</text>
  <text x="302" y="932" font-size="15.5" text-anchor="middle" fill="#6B7280">incident response across teams</text>

  <g filter="url(#p7-soft)">
    <rect x="790" y="794" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="790" y="794" width="6" height="90" fill="#2563EB" clip-path="url(#p7-k8)"/>
  </g>
  <circle cx="828" cy="839" r="18" fill="#FFFFFF"/>
  <g transform="translate(817.56,828.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="854" y="846" font-size="18.5" font-weight="600" fill="#111827">REST</text>
  <text x="885" y="909" font-size="15.5" text-anchor="middle" fill="#6B7280">Readable requests and statuses</text>

  
  <rect x="40" y="990" width="1160" height="180" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="1020" font-size="16.5" font-weight="600" fill="#1D4ED8">No trigger fired</text>
  <text x="1176" y="1020" text-anchor="end" font-size="15.5" fill="#6B7280">the standing default</text>

  <g filter="url(#p7-lift)">
    <rect x="480" y="1034" width="280" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="480" y="1034" width="9" height="90" fill="#2563EB" clip-path="url(#p7-k9)"/>
  </g>
  <circle cx="518" cy="1079" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,1068.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="544" y="1086" font-size="18.5" font-weight="600" fill="#111827">Stay with REST</text>
  <text x="620" y="1149" font-size="15.5" text-anchor="middle" fill="#6B7280">An alternative is not correct merely because it is more specialized.</text>

  
  <rect x="40" y="1210" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1255" text-anchor="middle" font-size="16" fill="#475569">Work down the questions. REST is the default until a named trigger fires.</text>
</svg>