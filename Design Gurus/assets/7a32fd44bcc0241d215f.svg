  <text x="760" y="100" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">THE INDEX ON TITLE</text>
  <text x="760" y="126" font-size="18" fill="#64748B" text-anchor="middle">sorted, with a pointer</text>
