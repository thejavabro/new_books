<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="520" viewBox="0 0 1240 520" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The table holds rows in no useful order. The index holds the title column in sorted order, and next to each title a pointer to the row. A full scan of one million rows reads one million rows, while the same lookup through an index reads about twenty entries.">
