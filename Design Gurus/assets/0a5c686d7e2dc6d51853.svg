<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="654" viewBox="0 0 1240 654" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four ANSI isolation levels against the three read anomalies, showing which each level prevents and which engines use each level as their default">
  <rect x="0" y="0" width="1240" height="654" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Each level buys you one more anomaly, and pays for it in concurrency</text>

  
  <rect x="50" y="88" width="1140" height="52" fill="#F1F5F9"/>
  <text x="415" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Dirty read</text>
  <text x="645" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Non-repeatable read</text>
  <text x="875" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Phantom read</text>
  <text x="1090" y="121" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Default in</text>

  
  <text x="70" y="180" font-size="20" font-weight="600" fill="#0F172A">Read Uncommitted</text>
  <rect x="340" y="154" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="415" y="180" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <rect x="570" y="154" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="645" y="180" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <rect x="800" y="154" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="875" y="180" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <text x="1090" y="180" font-size="20" fill="#64748B" text-anchor="middle">rarely enabled</text>

  
  <text x="70" y="246" font-size="20" font-weight="600" fill="#0F172A">Read Committed</text>
  <rect x="340" y="220" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="415" y="246" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <rect x="570" y="220" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="645" y="246" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <rect x="800" y="220" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="875" y="246" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <text x="1090" y="246" font-size="20" fill="#334155" text-anchor="middle">PostgreSQL, Oracle</text>

  
  <text x="70" y="312" font-size="20" font-weight="600" fill="#0F172A">Repeatable Read</text>
  <rect x="340" y="286" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="415" y="312" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <rect x="570" y="286" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="645" y="312" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <rect x="800" y="286" width="150" height="38" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="875" y="312" font-size="20" fill="#B91C1C" text-anchor="middle">possible</text>
  <text x="1090" y="312" font-size="20" fill="#334155" text-anchor="middle">MySQL InnoDB</text>

  
  <text x="70" y="378" font-size="20" font-weight="600" fill="#0F172A">Serializable</text>
  <rect x="340" y="352" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="415" y="378" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <rect x="570" y="352" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="645" y="378" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <rect x="800" y="352" width="150" height="38" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="875" y="378" font-size="20" fill="#065F46" text-anchor="middle">prevented</text>
  <text x="1090" y="378" font-size="20" fill="#64748B" text-anchor="middle">opt in</text>

  
  <line x1="50" y1="88" x2="1190" y2="88" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="140" x2="1190" y2="140" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="50" y1="206" x2="1190" y2="206" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="272" x2="1190" y2="272" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="338" x2="1190" y2="338" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="50" y1="404" x2="1190" y2="404" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="50" y1="88" x2="50" y2="404" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="300" y1="88" x2="300" y2="404" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="530" y1="88" x2="530" y2="404" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="760" y1="88" x2="760" y2="404" stroke="#E2E8F0" stroke-width="1.5"/>
  <line x1="990" y1="88" x2="990" y2="404" stroke="#CBD5E1" stroke-width="1.5"/>
  <line x1="1190" y1="88" x2="1190" y2="404" stroke="#CBD5E1" stroke-width="1.5"/>

  
  <rect x="50" y="436" width="1140" height="88" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="620" y="470" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">The grid above is the ANSI standard. Real engines are often stricter than it requires.</text>
  <text x="620" y="500" font-size="20" fill="#92400E" text-anchor="middle">PostgreSQL's Repeatable Read is a snapshot and blocks phantoms too, and MySQL InnoDB uses next key locks.</text>

  
  <rect x="50" y="556" width="1140" height="68" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="596" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Pick the level by which anomaly would actually corrupt your data, not by which one sounds safest.</text>
</svg>