<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1222" viewBox="0 0 1240 1222" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The useful subset of gRPC status codes, each with its meaning and the caller action it implies, from INVALID_ARGUMENT and UNAUTHENTICATED through DEADLINE_EXCEEDED, UNAVAILABLE, and INTERNAL.">
  <defs>
    <filter id="p9-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p9-ks"><rect x="430" y="64" width="26" height="17" rx="5"/></clipPath>
    <clipPath id="p9-k1"><rect x="76" y="174" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k2"><rect x="664" y="174" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k3"><rect x="76" y="306" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k4"><rect x="664" y="306" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k5"><rect x="76" y="498" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k6"><rect x="664" y="498" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k7"><rect x="76" y="630" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k8"><rect x="664" y="630" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k9"><rect x="76" y="822" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k10"><rect x="664" y="822" width="500" height="48" rx="10"/></clipPath>
    <clipPath id="p9-k11"><rect x="76" y="954" width="500" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1222" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">gRPC has its own status vocabulary</text>
  <rect x="430" y="64" width="26" height="17" rx="5" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <rect x="430" y="64" width="5" height="17" fill="#DB2777" clip-path="url(#p9-ks)"/>
  <text x="466" y="77" font-size="15.5" fill="#6B7280">Status</text>
  <circle cx="560" cy="72" r="4" fill="#94A3B8"/>
  <text x="580" y="77" font-size="15.5" fill="#6B7280">Meaning</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M700,71 L704.5,75.5 L712,65.5"/>
  </g>
  <text x="728" y="77" font-size="15.5" fill="#6B7280">Typical caller action</text>

  
  <rect x="40" y="126" width="1160" height="300" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">The caller must change the request</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">four codes</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="174" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p9-k1)"/>
  </g>
  <circle cx="110" cy="198" r="4.5" fill="#DB2777"/>
  <text x="134" y="205" font-size="18.5" font-weight="600" fill="#111827">INVALID_ARGUMENT</text>
  <circle cx="84" cy="242" r="4" fill="#94A3B8"/>
  <text x="104" y="247" font-size="15.5" fill="#6B7280">Input is malformed, missing, or breaks a field rule</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,265 L82.5,269.5 L90,259.5"/>
  </g>
  <text x="104" y="271" font-size="15.5" fill="#6B7280">Correct it; do not retry unchanged</text>

  <g filter="url(#p9-soft)">
    <rect x="664" y="174" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p9-k2)"/>
  </g>
  <circle cx="698" cy="198" r="4.5" fill="#DB2777"/>
  <text x="722" y="205" font-size="18.5" font-weight="600" fill="#111827">UNAUTHENTICATED</text>
  <circle cx="672" cy="242" r="4" fill="#94A3B8"/>
  <text x="692" y="247" font-size="15.5" fill="#6B7280">A valid credential is missing or invalid</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,265 L670.5,269.5 L678,259.5"/>
  </g>
  <text x="692" y="271" font-size="15.5" fill="#6B7280">Obtain or refresh a credential</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="306" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="76" y="306" width="6" height="48" fill="#DB2777" clip-path="url(#p9-k3)"/>
  </g>
  <circle cx="110" cy="330" r="4.5" fill="#DB2777"/>
  <text x="134" y="337" font-size="18.5" font-weight="600" fill="#111827">PERMISSION_DENIED</text>
  <circle cx="84" cy="374" r="4" fill="#94A3B8"/>
  <text x="104" y="379" font-size="15.5" fill="#6B7280">The identity is known but not allowed</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,397 L82.5,401.5 L90,391.5"/>
  </g>
  <text x="104" y="403" font-size="15.5" fill="#6B7280">Obtain scope, or stop</text>

  <g filter="url(#p9-soft)">
    <rect x="664" y="306" width="500" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="664" y="306" width="6" height="48" fill="#DB2777" clip-path="url(#p9-k4)"/>
  </g>
  <circle cx="698" cy="330" r="4.5" fill="#DB2777"/>
  <text x="722" y="337" font-size="18.5" font-weight="600" fill="#111827">NOT_FOUND</text>
  <circle cx="672" cy="374" r="4" fill="#94A3B8"/>
  <text x="692" y="379" font-size="15.5" fill="#6B7280">The resource does not exist, or is hidden</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,397 L670.5,401.5 L678,391.5"/>
  </g>
  <text x="692" y="403" font-size="15.5" fill="#6B7280">Correct the id, or stop</text>

  
  <rect x="40" y="450" width="1160" height="300" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="480" font-size="16.5" font-weight="600" fill="#B45309">Current state or a limit blocks the call</text>
  <text x="1176" y="480" text-anchor="end" font-size="15.5" fill="#6B7280">four codes</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="498" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="498" width="6" height="48" fill="#D97706" clip-path="url(#p9-k5)"/>
  </g>
  <circle cx="110" cy="522" r="4.5" fill="#D97706"/>
  <text x="134" y="529" font-size="18.5" font-weight="600" fill="#111827">ALREADY_EXISTS</text>
  <circle cx="84" cy="566" r="4" fill="#94A3B8"/>
  <text x="104" y="571" font-size="15.5" fill="#6B7280">A create conflicts with an existing unique resource</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,589 L82.5,593.5 L90,583.5"/>
  </g>
  <text x="104" y="595" font-size="15.5" fill="#6B7280">Reuse it, or choose another key</text>

  <g filter="url(#p9-soft)">
    <rect x="664" y="498" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="664" y="498" width="6" height="48" fill="#D97706" clip-path="url(#p9-k6)"/>
  </g>
  <circle cx="698" cy="522" r="4.5" fill="#D97706"/>
  <text x="722" y="529" font-size="18.5" font-weight="600" fill="#111827">FAILED_PRECONDITION</text>
  <circle cx="672" cy="566" r="4" fill="#94A3B8"/>
  <text x="692" y="571" font-size="15.5" fill="#6B7280">Current state does not allow the operation</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,589 L670.5,593.5 L678,583.5"/>
  </g>
  <text x="692" y="595" font-size="15.5" fill="#6B7280">Refresh, or choose another operation</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="630" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="76" y="630" width="6" height="48" fill="#D97706" clip-path="url(#p9-k7)"/>
  </g>
  <circle cx="110" cy="654" r="4.5" fill="#D97706"/>
  <text x="134" y="661" font-size="18.5" font-weight="600" fill="#111827">RESOURCE_EXHAUSTED</text>
  <circle cx="84" cy="698" r="4" fill="#94A3B8"/>
  <text x="104" y="703" font-size="15.5" fill="#6B7280">A published quota or rate limit was reached</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,721 L82.5,725.5 L90,715.5"/>
  </g>
  <text x="104" y="727" font-size="15.5" fill="#6B7280">Wait, or reduce usage</text>

  <g filter="url(#p9-soft)">
    <rect x="664" y="630" width="500" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="664" y="630" width="6" height="48" fill="#D97706" clip-path="url(#p9-k8)"/>
  </g>
  <circle cx="698" cy="654" r="4.5" fill="#D97706"/>
  <text x="722" y="661" font-size="18.5" font-weight="600" fill="#111827">ABORTED</text>
  <circle cx="672" cy="698" r="4" fill="#94A3B8"/>
  <text x="692" y="703" font-size="15.5" fill="#6B7280">Concurrent work caused the operation to abort</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,721 L670.5,725.5 L678,715.5"/>
  </g>
  <text x="692" y="727" font-size="15.5" fill="#6B7280">Reread state, retry only if safe</text>

  
  <rect x="40" y="774" width="1160" height="300" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="804" font-size="16.5" font-weight="600" fill="#475569">The outcome is unknown, or the server failed</text>
  <text x="1176" y="804" text-anchor="end" font-size="15.5" fill="#6B7280">three codes</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="822" width="500" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="822" width="6" height="48" fill="#64748B" clip-path="url(#p9-k9)"/>
  </g>
  <circle cx="110" cy="846" r="4.5" fill="#64748B"/>
  <text x="134" y="853" font-size="18.5" font-weight="600" fill="#111827">DEADLINE_EXCEEDED</text>
  <circle cx="84" cy="890" r="4" fill="#94A3B8"/>
  <text x="104" y="895" font-size="15.5" fill="#6B7280">The deadline expired before completion</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,913 L82.5,917.5 L90,907.5"/>
  </g>
  <text x="104" y="919" font-size="15.5" fill="#6B7280">Treat the outcome as unknown</text>

  <g filter="url(#p9-soft)">
    <rect x="664" y="822" width="500" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="664" y="822" width="6" height="48" fill="#64748B" clip-path="url(#p9-k10)"/>
  </g>
  <circle cx="698" cy="846" r="4.5" fill="#64748B"/>
  <text x="722" y="853" font-size="18.5" font-weight="600" fill="#111827">UNAVAILABLE</text>
  <circle cx="672" cy="890" r="4" fill="#94A3B8"/>
  <text x="692" y="895" font-size="15.5" fill="#6B7280">The service is temporarily unavailable</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M666,913 L670.5,917.5 L678,907.5"/>
  </g>
  <text x="692" y="919" font-size="15.5" fill="#6B7280">A bounded retry may help if safe</text>

  <g filter="url(#p9-soft)">
    <rect x="76" y="954" width="500" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="76" y="954" width="6" height="48" fill="#64748B" clip-path="url(#p9-k11)"/>
  </g>
  <circle cx="110" cy="978" r="4.5" fill="#64748B"/>
  <text x="134" y="985" font-size="18.5" font-weight="600" fill="#111827">INTERNAL</text>
  <circle cx="84" cy="1022" r="4" fill="#94A3B8"/>
  <text x="104" y="1027" font-size="15.5" fill="#6B7280">An unexpected server failure</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1045 L82.5,1049.5 L90,1039.5"/>
  </g>
  <text x="104" y="1051" font-size="15.5" fill="#6B7280">Record the request id; retry only if safe</text>

  
  <rect x="40" y="1106" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1151" text-anchor="middle" font-size="16" fill="#475569">A status alone is broad. Attach machine-readable details that carry the error fields this course defines.</text>
</svg>