<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="deps-title deps-desc">
<title id="deps-title">Your radius includes everybody you call</title>
<desc id="deps-desc">A service calling five dependencies that can be slow has five ways to become entirely unavailable. Bulkheads bound the resource each one can consume, and classification decides what happens when it fails.</desc>
<defs>
<marker id="deps-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="deps-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="deps-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="deps-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Your radius includes everybody you call</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Your blast radius includes everybody you call, unless you do something about it.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">shared pool of 100 connections</text><text x="64" y="177" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">dependency A hangs, absorbs all 100, everything stops</text>
<rect x="640" y="118" width="560" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="118" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="664" y="151" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">per-dependency limits: A=40, B=30, C=30</text><text x="664" y="177" font-size="19" font-weight="400" fill="#169B77" text-anchor="start">A hangs, absorbs its 40, B and C keep serving</text>
<rect x="40" y="218" width="1160" height="64" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="218" width="5" height="64" rx="2.5" fill="#F3CF6A"/><text x="64" y="256" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">The limits should sum to less than the total, with headroom reserved</text>
<text x="40" y="324" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Classify every dependency before the incident, not during it</text>
<rect x="40" y="342" width="230" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="155" y="380" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Critical</text>
<rect x="286" y="342" width="414" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="306" y="380" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the product does not work without it</text>
<rect x="716" y="342" width="484" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="736" y="380" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the request fails, quickly and clearly</text>
<rect x="40" y="418" width="230" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="155" y="456" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Degradable</text>
<rect x="286" y="418" width="414" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="306" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the product works worse without it</text>
<rect x="716" y="418" width="484" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="736" y="456" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">short timeout plus a defined fallback</text>
<rect x="40" y="494" width="230" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="155" y="532" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Optional</text>
<rect x="286" y="494" width="414" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="306" y="532" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">no user can detect its absence</text>
<rect x="716" y="494" width="484" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="736" y="519.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">must be asynchronous,</text><text x="736" y="544.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never in the request path</text>
<rect x="40" y="580" width="1160" height="78" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="580" width="5" height="78" rx="2.5" fill="#F28B9D"/><text x="64" y="610.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Most outages here come from something everybody would call optional,</text><text x="64" y="639.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">sitting synchronously in the request path because that was easiest.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A dependency that fails fast is survivable. One that hangs consumes what you need for everything else.</text>
</svg>