<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="872" viewBox="0 0 1240 872" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities and flow for a globally unique ID generator: callers request an ID, each generator node carries its own worker id so nothing has to be coordinated, and the service returns either an opaque random ID or a time ordered ID">
  <defs>
    <filter id="uidk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="uidk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="uidk-k1"><rect x="50" y="330" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="uidk-k2"><rect x="360" y="150" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="uidk-k3"><rect x="360" y="330" width="290" height="90" rx="12"/></clipPath>
    <clipPath id="uidk-k4"><rect x="760" y="180" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="uidk-k5"><rect x="760" y="480" width="240" height="90" rx="12"/></clipPath>
    <marker id="uidk-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="uidk-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="uidk-in" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="uidk-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="872" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Unique ID generator: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every node can mint IDs on its own, because the worker id makes collisions impossible without a central counter.</text>

  <g fill="none" stroke-width="2">
    <path d="M240,375 H360" stroke="#2563EB" marker-end="url(#uidk-bl)"/>
    <path d="M600,240 V330" stroke="#64748B" marker-end="url(#uidk-sl)"/>
    <path d="M650,355 H688 Q700,355 700,343 V237 Q700,225 712,225 H760" stroke="#4F46E5" marker-end="url(#uidk-in)"/>
    <path d="M650,395 H688 Q700,395 700,407 V513 Q700,525 712,525 H760" stroke="#D97706" marker-end="url(#uidk-am)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="300" y="362" fill="#1D4ED8">request an ID</text>
    <text x="703" y="292" fill="#4338CA">opaque</text>
    <text x="703" y="462" fill="#B45309">ordered</text>
  </g>

  
  <g filter="url(#uidk-soft)">
    <rect x="50" y="330" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="50" y="330" width="6" height="90" fill="#2563EB" clip-path="url(#uidk-k1)"/>
  </g>
  <circle cx="88" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(77.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="114" y="382" font-size="21.5" font-weight="600" fill="#111827">Callers</text>
  <text x="145" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">web servers, services</text>
  <text x="145" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">and devices</text>

  
  <g filter="url(#uidk-soft)">
    <rect x="360" y="150" width="290" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="360" y="150" width="6" height="90" fill="#64748B" clip-path="url(#uidk-k2)"/>
  </g>
  <circle cx="398" cy="195" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,184.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="424" y="202" font-size="21.5" font-weight="600" fill="#111827">Worker id</text>
  <text x="505" y="269" font-size="18.5" text-anchor="middle" fill="#6B7280">one per generator</text>
  <text x="505" y="296" font-size="18.5" text-anchor="middle" fill="#94A3B8">never shared</text>

  
  <g filter="url(#uidk-lift)">
    <rect x="360" y="330" width="290" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="360" y="330" width="9" height="90" fill="#2563EB" clip-path="url(#uidk-k3)"/>
  </g>
  <circle cx="398" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,364.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="424" y="382" font-size="21.5" font-weight="600" fill="#111827">ID Generation Service</text>
  <text x="505" y="449" font-size="18.5" text-anchor="middle" fill="#6B7280">no coordination between nodes</text>
  <text x="505" y="476" font-size="18.5" text-anchor="middle" fill="#94A3B8">hundreds of thousands per second</text>

  
  <g filter="url(#uidk-soft)">
    <rect x="760" y="180" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="760" y="180" width="6" height="90" fill="#4F46E5" clip-path="url(#uidk-k4)"/>
  </g>
  <circle cx="798" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,214.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="824" y="232" font-size="21.5" font-weight="600" fill="#111827">Opaque IDs</text>
  <text x="880" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">UUIDv4, 128 bits, random</text>
  <text x="880" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">no order, no meaning</text>

  
  <g filter="url(#uidk-soft)">
    <rect x="760" y="480" width="240" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="760" y="480" width="6" height="90" fill="#D97706" clip-path="url(#uidk-k5)"/>
  </g>
  <circle cx="798" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(787.56,514.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="824" y="532" font-size="21.5" font-weight="600" fill="#111827">Ordered IDs</text>
  <text x="880" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">Snowflake 64 bits, ULID, KSUID</text>
  <text x="880" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">time, then worker, then sequence</text>

  
  <rect x="40" y="670" width="1160" height="172" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="692" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="715" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Opaque</text>
  <text x="323" y="715" font-size="18.5" fill="#475569">random, so it leaks nothing about when or where it was made; it does not sort</text>

  <rect x="64" y="736" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="759" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Ordered</text>
  <text x="323" y="759" font-size="18.5" fill="#475569">carries a timestamp in its high bits, so newer IDs sort after older ones</text>

  <rect x="64" y="780" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="803" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Auto-increment</text>
  <text x="323" y="803" font-size="18.5" fill="#475569">the option to avoid here: one shared counter is both a bottleneck and a single point of failure</text>
</svg>