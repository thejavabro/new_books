<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The order service example: one hundred threads for inventory and fifty for shipping, so a slow inventory service exhausts only its own pool and shipping keeps running">
  <defs>
    <marker id="bh4-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="bh4-mpink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="bh4-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="bh4-k1"><rect x="72" y="200" width="268" height="72" rx="12"/></clipPath>
    <clipPath id="bh4-k2"><rect x="492" y="110" width="338" height="80" rx="12"/></clipPath>
    <clipPath id="bh4-k3"><rect x="492" y="282" width="338" height="80" rx="12"/></clipPath>
    <clipPath id="bh4-k4"><rect x="898" y="110" width="240" height="80" rx="12"/></clipPath>
    <clipPath id="bh4-k5"><rect x="898" y="282" width="240" height="80" rx="12"/></clipPath>
    <filter id="bh4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="bh4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="400" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">One createOrder call, two separate pools</text>
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M340,236 H400 Q412,236 412,224 V162 Q412,150 424,150 H482" marker-end="url(#bh4-mslate)"/>
    <path d="M340,236 H400 Q412,236 412,248 V310 Q412,322 424,322 H482" marker-end="url(#bh4-mslate)"/>
  </g>
  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M830,150 H888" marker-end="url(#bh4-mpink)"/>
  </g>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M830,322 H888" marker-end="url(#bh4-memerald)"/>
  </g>
  <g filter="url(#bh4-soft)">
    <rect x="72" y="200" width="268" height="72" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="72" y="200" width="6" height="72" fill="#64748B" clip-path="url(#bh4-k1)"/>
  </g>
  <circle cx="110" cy="236" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,225.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="243" font-size="18.5" font-weight="600" fill="#111827">createOrder()</text>
  <g filter="url(#bh4-soft)">
    <rect x="492" y="110" width="338" height="80" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="492" y="110" width="6" height="80" fill="#DB2777" clip-path="url(#bh4-k2)"/>
  </g>
  <circle cx="530" cy="150" r="18" fill="#FFFFFF"/>
  <g transform="translate(519.56,139.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="556" y="157" font-size="18.5" font-weight="600" fill="#111827">inventoryExecutor</text>
  <text x="661" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">100 threads, all busy</text>
  <g filter="url(#bh4-soft)">
    <rect x="492" y="282" width="338" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="492" y="282" width="6" height="80" fill="#059669" clip-path="url(#bh4-k3)"/>
  </g>
  <circle cx="530" cy="322" r="18" fill="#FFFFFF"/>
  <g transform="translate(519.56,311.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="556" y="329" font-size="18.5" font-weight="600" fill="#111827">shippingExecutor</text>
  <text x="661" y="387" font-size="15.5" text-anchor="middle" fill="#6B7280">50 threads, still free</text>
  <g filter="url(#bh4-soft)">
    <rect x="898" y="110" width="240" height="80" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="898" y="110" width="6" height="80" fill="#DB2777" clip-path="url(#bh4-k4)"/>
  </g>
  <circle cx="936" cy="150" r="18" fill="#FFFFFF"/>
  <g transform="translate(925.56,139.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="962" y="157" font-size="18.5" font-weight="600" fill="#111827">Inventory Slow</text>
  <g filter="url(#bh4-soft)">
    <rect x="898" y="282" width="240" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="898" y="282" width="6" height="80" fill="#059669" clip-path="url(#bh4-k5)"/>
  </g>
  <circle cx="936" cy="322" r="18" fill="#FFFFFF"/>
  <g transform="translate(925.56,311.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="962" y="329" font-size="18.5" font-weight="600" fill="#111827">Shipping Fine</text>
  <rect x="40" y="494" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="518" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="540" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">The failing side</text>
  <text x="288" y="540" font-size="15.5" fill="#475569">a slow inventory service can exhaust its own 100 threads and no others</text>
  <rect x="64" y="562" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="584" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The protected side</text>
  <text x="288" y="584" font-size="15.5" fill="#475569">shipping keeps its own 50 threads, so it answers at normal speed throughout</text>
</svg>