<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="830" viewBox="0 0 1240 830" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram: checkout publishes an order placed event to the broker and immediately gets a durable-write acknowledgement, the broker holds the message while the fulfillment service is down for a deploy, then fulfillment returns, asks for what it missed, receives the event, and acknowledges it.">
  <defs>
    <marker id="m03-l03-broker-decoupling-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m03-l03-broker-decoupling-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m03-l03-broker-decoupling-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <filter id="m03-l03-broker-decoupling-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="830" fill="#FFFFFF"/>

  <rect x="100" y="320" width="1100" height="140" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="6 5"/>

  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5">
    <line x1="225" y1="124" x2="225" y2="700"/>
    <line x1="640" y1="124" x2="640" y2="700"/>
    <line x1="1055" y1="124" x2="1055" y2="700"/>
  </g>

  <text x="34" y="150" text-anchor="middle" font-size="20" fill="#64748B">time</text>
  <line x1="34" y1="166" x2="34" y2="690" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#m03-l03-broker-decoupling-sl)"/>

  <g fill="none">
    <path d="M232,200 L634,200" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l03-broker-decoupling-ab)"/>
    <path d="M634,262 L238,262" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l03-broker-decoupling-em)"/>
    <path d="M1049,530 L646,530" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l03-broker-decoupling-ab)"/>
    <path d="M646,600 L1049,600" stroke="#D97706" stroke-width="2.5" marker-end="url(#m03-l03-broker-decoupling-ab)"/>
    <path d="M1049,670 L646,670" stroke="#059669" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#m03-l03-broker-decoupling-em)"/>
  </g>

  
  <rect x="218" y="190" width="14" height="84" rx="2" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <g font-size="20" text-anchor="end" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="204" y="228">producer waits</text>
    <text x="204" y="258">only this long</text>
  </g>

  <g filter="url(#m03-l03-broker-decoupling-soft)">
    <rect x="100" y="40" width="250" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="225" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout</text>
  <text x="225" y="108" text-anchor="middle" font-size="20" fill="#64748B">producer</text>
  <g filter="url(#m03-l03-broker-decoupling-soft)">
    <rect x="490" y="40" width="300" height="84" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="640" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="640" y="108" text-anchor="middle" font-size="20" fill="#64748B">Kafka, RabbitMQ, or SQS</text>
  <g filter="url(#m03-l03-broker-decoupling-soft)">
    <rect x="930" y="40" width="250" height="84" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="1055" y="78" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment</text>
  <text x="1055" y="108" text-anchor="middle" font-size="20" fill="#64748B">consumer</text>

  <text x="122" y="356" font-size="20" font-weight="600" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">Time decoupling: neither side needs the other to be up</text>

  <g filter="url(#m03-l03-broker-decoupling-soft)">
    <rect x="180" y="380" width="420" height="56" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="390" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#B91C1C">Fulfillment is down for a deploy</text>

  <g filter="url(#m03-l03-broker-decoupling-soft)">
    <rect x="650" y="380" width="470" height="56" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="885" y="416" text-anchor="middle" font-size="20" font-weight="600" fill="#92400E">The message waits, nobody is blocked</text>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="6">
    <text x="432" y="186" fill="#92400E">Publish order placed event</text>
    <text x="432" y="248" fill="#065F46">Stored on disk, you can move on</text>
    <text x="848" y="516" fill="#92400E">Back up, send me what I missed</text>
    <text x="848" y="586" fill="#92400E">Deliver order placed event</text>
    <text x="848" y="656" fill="#065F46">Acknowledge, processing done</text>
  </g>

  <line x1="50" y1="750" x2="86" y2="750" stroke="#D97706" stroke-width="4"/>
  <text x="98" y="757" font-size="20" fill="#475569">Async publish and delivery through the broker</text>
  <line x1="50" y1="790" x2="86" y2="790" stroke="#059669" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="98" y="797" font-size="20" fill="#475569">Acknowledgement, the sender can move on</text>
</svg>