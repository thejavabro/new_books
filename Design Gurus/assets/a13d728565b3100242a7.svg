<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The twenty uses of an API gateway grouped into deciding where a request goes, reshaping it, protecting the backend, and running the business">
  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>
  <defs>
    <filter id="ag3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="290" height="470" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="165" y="80" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Where it goes</text>

  <rect x="330" y="40" width="290" height="470" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="475" y="80" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">How it is shaped</text>

  <rect x="640" y="40" width="290" height="470" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="785" y="80" font-size="20" font-weight="700" fill="#991B1B" text-anchor="middle">What protects it</text>

  <rect x="950" y="40" width="270" height="470" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1085" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Running it</text>

  <g filter="url(#ag3-soft)">
    <rect x="40" y="106" width="250" height="52" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="40" y="170" width="250" height="52" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="40" y="234" width="250" height="52" rx="9" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
