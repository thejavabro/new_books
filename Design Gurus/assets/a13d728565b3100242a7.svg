    <rect x="350" y="106" width="250" height="52" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="350" y="170" width="250" height="52" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="350" y="234" width="250" height="52" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="350" y="298" width="250" height="52" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="350" y="362" width="250" height="52" rx="9" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>

    <rect x="660" y="106" width="250" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="660" y="170" width="250" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="660" y="234" width="250" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="660" y="298" width="250" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
    <rect x="660" y="362" width="250" height="52" rx="9" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>

    <rect x="968" y="106" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="968" y="170" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="968" y="234" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="968" y="298" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="968" y="362" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="968" y="426" width="234" height="52" rx="9" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="165" y="139" font-size="20" fill="#1E3A8A" text-anchor="middle">Request routing</text>
  <text x="165" y="203" font-size="20" fill="#1E3A8A" text-anchor="middle">Content-based routing</text>
  <text x="165" y="267" font-size="20" fill="#1E3A8A" text-anchor="middle">Service discovery</text>
  <text x="165" y="331" font-size="20" fill="#1E3A8A" text-anchor="middle">Canary and A/B</text>

  <text x="475" y="139" font-size="20" fill="#5B21B6" text-anchor="middle">Aggregation</text>
  <text x="475" y="203" font-size="20" fill="#5B21B6" text-anchor="middle">Protocol translation</text>
  <text x="475" y="267" font-size="20" fill="#5B21B6" text-anchor="middle">Transformation</text>
  <text x="475" y="331" font-size="20" fill="#5B21B6" text-anchor="middle">Localization</text>
  <text x="475" y="395" font-size="20" fill="#5B21B6" text-anchor="middle">Simpler clients</text>

  <text x="785" y="139" font-size="20" fill="#991B1B" text-anchor="middle">Security enforcement</text>
  <text x="785" y="203" font-size="20" fill="#991B1B" text-anchor="middle">Rate limiting</text>
  <text x="785" y="267" font-size="20" fill="#991B1B" text-anchor="middle">Circuit breaker</text>
  <text x="785" y="331" font-size="20" fill="#991B1B" text-anchor="middle">SSL termination</text>
  <text x="785" y="395" font-size="20" fill="#991B1B" text-anchor="middle">Policy enforcement</text>

  <text x="1085" y="139" font-size="20" fill="#065F46" text-anchor="middle">Load balancing</text>
  <text x="1085" y="203" font-size="20" fill="#065F46" text-anchor="middle">Caching</text>
  <text x="1085" y="267" font-size="20" fill="#065F46" text-anchor="middle">Monitoring and logs</text>
  <text x="1085" y="331" font-size="20" fill="#065F46" text-anchor="middle">API versioning</text>
  <text x="1085" y="395" font-size="20" fill="#065F46" text-anchor="middle">Monetization</text>
  <text x="1085" y="459" font-size="20" fill="#065F46" text-anchor="middle">Multi-tenancy</text>

  <text x="620" y="540" font-size="20" fill="#475569" text-anchor="middle">All twenty are possible because every request already passes through the same place</text>
