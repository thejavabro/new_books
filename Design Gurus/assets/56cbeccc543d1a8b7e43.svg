  <text x="964" y="985" font-size="18.5" font-weight="600" fill="#111827">Consumer group C</text>
  <text x="64" y="172" font-size="18.5" fill="#475569">Each message is processed by one consumer (competing consumers).</text>
  <text x="384" y="318" font-size="18.5" fill="#6B7280">(for example, RabbitMQ, SQS)</text>
  <text x="64" y="732" font-size="18.5" fill="#475569">Events are stored in an append-only log and can be consumed by multiple independent consumers.</text>
  <text x="384" y="878" font-size="18.5" fill="#6B7280">(for example, Kafka)</text>
  <text x="642" y="933" font-size="21.5" font-weight="600" fill="#1D4ED8">...</text>

