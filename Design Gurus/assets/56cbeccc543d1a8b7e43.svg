<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1250" viewBox="0 0 1240 1250" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two rows. Message queue: a producer sends messages to a queue such as RabbitMQ or SQS, and each message is consumed by exactly one of three competing consumers and then deleted. Event streaming: a producer publishes events to an append-only stream such as Kafka, and three consumer groups each read every event at their own offset while the events are retained for a configured period">
