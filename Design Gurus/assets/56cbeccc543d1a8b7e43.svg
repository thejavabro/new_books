  <circle cx="92" cy="492" r="6" fill="#2563EB"/>
  <text x="112" y="498" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Consumption:</tspan> Each message processed by one consumer</text>
  <circle cx="92" cy="526" r="6" fill="#2563EB"/>
  <text x="112" y="532" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Storage:</tspan> Messages are typically deleted after consumption</text>
  <circle cx="92" cy="560" r="6" fill="#2563EB"/>
  <text x="112" y="566" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Use cases:</tspan> Task processing, background jobs, work queues</text>
  <circle cx="92" cy="594" r="6" fill="#2563EB"/>
  <text x="112" y="600" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Examples:</tspan> RabbitMQ, Amazon SQS, Azure Service Bus</text>
  <circle cx="92" cy="1052" r="6" fill="#059669"/>
  <text x="112" y="1058" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Consumption:</tspan> Multiple independent consumers (each with its own offset)</text>
  <circle cx="92" cy="1086" r="6" fill="#059669"/>
  <text x="112" y="1092" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Storage:</tspan> Events are retained for a configurable period</text>
  <circle cx="92" cy="1120" r="6" fill="#059669"/>
  <text x="112" y="1126" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Use cases:</tspan> Facts many systems need, historical replay, per-key ordering</text>
  <circle cx="92" cy="1154" r="6" fill="#059669"/>
  <text x="112" y="1160" font-size="18.5" fill="#1F2937"><tspan font-weight="600">Examples:</tspan> Apache Kafka, Amazon Kinesis, Apache Pulsar</text>


</svg>