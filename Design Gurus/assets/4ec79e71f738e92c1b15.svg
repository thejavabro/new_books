<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="660" viewBox="0 0 1240 660" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Choosing between the four class relationships">
  <defs>
    <marker id="oodi4-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodi4-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodi4-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodi4-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodi4-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodi4-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodi4-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodi4-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodi4-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodi4-q0"><rect x="44" y="74" width="540" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-r0"><rect x="728" y="74" width="468" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-q1"><rect x="44" y="216" width="540" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-r1"><rect x="728" y="216" width="468" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-q2"><rect x="44" y="358" width="540" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-r2"><rect x="728" y="358" width="468" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-q3"><rect x="44" y="500" width="540" height="78" rx="12"/></clipPath>
    <clipPath id="oodi4-r3"><rect x="728" y="500" width="468" height="78" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="660" fill="#FFFFFF"/>
  <g filter="url(#oodi4-soft)">
    <rect x="44" y="74" width="540" height="78" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="74" width="6" height="78" fill="#64748B" clip-path="url(#oodi4-q0)"/>
  </g>
  <circle cx="82" cy="113.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="119.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">1</text>
  <text x="112" y="119.5" font-size="18.5" font-weight="600" fill="#111827">Can B stand in anywhere A is expected?</text>
  <g filter="url(#oodi4-soft)">
    <rect x="728" y="74" width="468" height="78" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="728" y="74" width="6" height="78" fill="#7C3AED" clip-path="url(#oodi4-r0)"/>
  </g>
  <circle cx="766" cy="113.0" r="18" fill="#FFFFFF"/>
  <text x="766" y="119.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">=</text>
  <text x="796" y="119.5" font-size="18.5" font-weight="600" fill="#111827">Inheritance</text>
  <text x="752" y="178" font-size="15.5" fill="#94A3B8">B is an A</text>
  <path d="M584,113 L728,113" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi4-arrow-emerald)"/>
  <text x="656" y="102" font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857">yes</text>
  <path d="M314,152 L314,216" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi4-arrow-slate)"/>
  <text x="340" y="190" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">no</text>
  <g filter="url(#oodi4-soft)">
    <rect x="44" y="216" width="540" height="78" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="216" width="6" height="78" fill="#64748B" clip-path="url(#oodi4-q1)"/>
  </g>
  <circle cx="82" cy="255.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="261.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">2</text>
  <text x="112" y="261.5" font-size="18.5" font-weight="600" fill="#111827">Does B die when A dies?</text>
  <g filter="url(#oodi4-soft)">
    <rect x="728" y="216" width="468" height="78" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="728" y="216" width="6" height="78" fill="#DB2777" clip-path="url(#oodi4-r1)"/>
  </g>
  <circle cx="766" cy="255.0" r="18" fill="#FFFFFF"/>
  <text x="766" y="261.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">=</text>
  <text x="796" y="261.5" font-size="18.5" font-weight="600" fill="#111827">Composition</text>
  <text x="752" y="320" font-size="15.5" fill="#94A3B8">A owns B, filled diamond</text>
  <path d="M584,255 L728,255" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi4-arrow-emerald)"/>
  <text x="656" y="244" font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857">yes</text>
  <path d="M314,294 L314,358" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi4-arrow-slate)"/>
  <text x="340" y="332" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">no</text>
  <g filter="url(#oodi4-soft)">
    <rect x="44" y="358" width="540" height="78" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="358" width="6" height="78" fill="#64748B" clip-path="url(#oodi4-q2)"/>
  </g>
  <circle cx="82" cy="397.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="403.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">3</text>
  <text x="112" y="403.5" font-size="18.5" font-weight="600" fill="#111827">Is B a part that outlives A?</text>
  <g filter="url(#oodi4-soft)">
    <rect x="728" y="358" width="468" height="78" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="728" y="358" width="6" height="78" fill="#D97706" clip-path="url(#oodi4-r2)"/>
  </g>
  <circle cx="766" cy="397.0" r="18" fill="#FFFFFF"/>
  <text x="766" y="403.5" font-size="17" font-weight="700" text-anchor="middle" fill="#D97706">=</text>
  <text x="796" y="403.5" font-size="18.5" font-weight="600" fill="#111827">Aggregation</text>
  <text x="752" y="462" font-size="15.5" fill="#94A3B8">A holds B, hollow diamond</text>
  <path d="M584,397 L728,397" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi4-arrow-emerald)"/>
  <text x="656" y="386" font-size="15.5" font-weight="600" text-anchor="middle" fill="#047857">yes</text>
  <path d="M314,436 L314,500" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodi4-arrow-slate)"/>
  <text x="340" y="474" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">no</text>
  <g filter="url(#oodi4-soft)">
    <rect x="44" y="500" width="540" height="78" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="500" width="6" height="78" fill="#64748B" clip-path="url(#oodi4-q3)"/>
  </g>
  <circle cx="82" cy="539.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="545.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">4</text>
  <text x="112" y="545.5" font-size="18.5" font-weight="600" fill="#111827">None of the above</text>
  <g filter="url(#oodi4-soft)">
    <rect x="728" y="500" width="468" height="78" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="728" y="500" width="6" height="78" fill="#2563EB" clip-path="url(#oodi4-r3)"/>
  </g>
  <circle cx="766" cy="539.0" r="18" fill="#FFFFFF"/>
  <text x="766" y="545.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">=</text>
  <text x="796" y="545.5" font-size="18.5" font-weight="600" fill="#111827">Association</text>
  <text x="752" y="604" font-size="15.5" fill="#94A3B8">A can call B, plain line</text>
  <path d="M584,539 L728,539" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodi4-arrow-emerald)"/>
  <text x="620" y="636" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Take the first yes. Most pairs land on association, and that is correct.</text>
</svg>