<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1410" viewBox="0 0 1240 1410" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inside a code judging worker: the execution service pulls a job from the queue, starts a language specific container with the test cases mounted, runs the submission under CPU, memory and time limits, and writes the verdict to the submission database and the Redis leaderboard">
  <defs>
    <filter id="jdg2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="jdg2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="jdg2-k1"><rect x="180" y="170" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k2"><rect x="680" y="170" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k3"><rect x="64" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k4"><rect x="351" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k5"><rect x="638" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k6"><rect x="925" y="490" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k7"><rect x="64" y="780" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k8"><rect x="351" y="780" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k9"><rect x="638" y="780" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdg2-k10"><rect x="925" y="780" width="250" height="90" rx="12"/></clipPath>
    <marker id="jdg2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="jdg2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="jdg2-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="jdg2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1410" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Code judging system: inside one execution worker</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One container per submission, one runtime image per language, and a verdict that has to be the same every time.</text>

  <rect x="40" y="430" width="1160" height="236" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="460" font-size="19.5" font-weight="600" fill="#BE185D">One container per submission, thrown away after</text>
  <rect x="40" y="720" width="1160" height="236" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="750" font-size="19.5" font-weight="600" fill="#475569">What the limits are set to</text>

  <g fill="none" stroke-width="2">
    <path d="M370,306 V424" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#jdg2-m-violet)"/>
    <path d="M870,306 V424" stroke="#64748B" marker-end="url(#jdg2-m-slate)"/>
    <path d="M310,956 V1024" stroke="#4F46E5" stroke-width="2.5" marker-end="url(#jdg2-m-indigo)"/>
    <path d="M930,956 V1024" stroke="#D97706" marker-end="url(#jdg2-m-amber)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="470" y="386" fill="#5B21B6">start a container</text>
    <text x="970" y="386" fill="#475569">mount</text>
    <text x="440" y="998" fill="#4338CA">verdict</text>
    <text x="1050" y="998" fill="#B45309">rank</text>
  </g>

  <g filter="url(#jdg2-soft)">
    <rect x="180" y="170" width="380" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="180" y="170" width="6" height="90" fill="#7C3AED" clip-path="url(#jdg2-k1)"/>
  </g>
  <circle cx="218" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,204.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="244" y="222" font-size="21.5" font-weight="600" fill="#111827">Execution service</text>
  <text x="370" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">pulls the next job</text>
  <g filter="url(#jdg2-soft)">
    <rect x="680" y="170" width="380" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="680" y="170" width="6" height="90" fill="#64748B" clip-path="url(#jdg2-k2)"/>
  </g>
  <circle cx="718" cy="215" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,204.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="744" y="222" font-size="21.5" font-weight="600" fill="#111827">Test cases</text>
  <text x="870" y="289" font-size="18.5" text-anchor="middle" fill="#6B7280">fetched and cached locally</text>
  <g filter="url(#jdg2-soft)">
    <rect x="64" y="490" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="490" width="6" height="90" fill="#DB2777" clip-path="url(#jdg2-k3)"/>
  </g>
  <circle cx="102" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="128" y="542" font-size="21.5" font-weight="600" fill="#111827">Python</text>
  <text x="189" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">runtime image</text>
  <g filter="url(#jdg2-soft)">
    <rect x="351" y="490" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="351" y="490" width="6" height="90" fill="#DB2777" clip-path="url(#jdg2-k4)"/>
  </g>
  <circle cx="389" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(378.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="415" y="542" font-size="21.5" font-weight="600" fill="#111827">Java</text>
  <text x="476" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">runtime image</text>
  <g filter="url(#jdg2-soft)">
    <rect x="638" y="490" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="638" y="490" width="6" height="90" fill="#DB2777" clip-path="url(#jdg2-k5)"/>
  </g>
  <circle cx="676" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="702" y="542" font-size="21.5" font-weight="600" fill="#111827">C++</text>
  <text x="763" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">runtime image</text>
  <g filter="url(#jdg2-soft)">
    <rect x="925" y="490" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="925" y="490" width="6" height="90" fill="#DB2777" clip-path="url(#jdg2-k6)"/>
  </g>
  <circle cx="963" cy="535" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,524.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="989" y="542" font-size="21.5" font-weight="600" fill="#111827">Go, JS, C#</text>
  <text x="1050" y="609" font-size="18.5" text-anchor="middle" fill="#6B7280">and the rest</text>
  <g filter="url(#jdg2-soft)">
    <rect x="64" y="780" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="780" width="6" height="90" fill="#64748B" clip-path="url(#jdg2-k7)"/>
  </g>
  <circle cx="102" cy="825" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,814.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="128" y="832" font-size="21.5" font-weight="600" fill="#111827">Time</text>
  <text x="189" y="899" font-size="18.5" text-anchor="middle" fill="#6B7280">a hard wall clock cap</text>
  <g filter="url(#jdg2-soft)">
    <rect x="351" y="780" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="351" y="780" width="6" height="90" fill="#64748B" clip-path="url(#jdg2-k8)"/>
  </g>
  <circle cx="389" cy="825" r="18" fill="#FFFFFF"/>
  <g transform="translate(378.56,814.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="415" y="832" font-size="21.5" font-weight="600" fill="#111827">Memory</text>
  <text x="476" y="899" font-size="18.5" text-anchor="middle" fill="#6B7280">killed if it exceeds</text>
  <g filter="url(#jdg2-soft)">
    <rect x="638" y="780" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="638" y="780" width="6" height="90" fill="#64748B" clip-path="url(#jdg2-k9)"/>
  </g>
  <circle cx="676" cy="825" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,814.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="702" y="832" font-size="21.5" font-weight="600" fill="#111827">Network</text>
  <text x="763" y="899" font-size="18.5" text-anchor="middle" fill="#6B7280">none at all</text>
  <g filter="url(#jdg2-soft)">
    <rect x="925" y="780" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="925" y="780" width="6" height="90" fill="#64748B" clip-path="url(#jdg2-k10)"/>
  </g>
  <circle cx="963" cy="825" r="18" fill="#FFFFFF"/>
  <g transform="translate(952.56,814.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="989" y="832" font-size="21.5" font-weight="600" fill="#111827">Filesystem</text>
  <text x="1050" y="899" font-size="18.5" text-anchor="middle" fill="#6B7280">read only, throwaway</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M140,1030 L140,1104 A170,16 0 0 0 480,1104 L480,1030" fill="#E0E7FF"/>
    <ellipse cx="310" cy="1030" rx="170" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="310" y="1082" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Submissions</text>
  <text x="310" y="1154" font-size="18.5" text-anchor="middle" fill="#6B7280">the verdict and the timing</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M760,1030 L760,1104 A170,16 0 0 0 1100,1104 L1100,1030" fill="#FEF3C7"/>
    <ellipse cx="930" cy="1030" rx="170" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="930" y="1082" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Leaderboard</text>
  <text x="930" y="1154" font-size="18.5" text-anchor="middle" fill="#6B7280">Redis, a sorted set</text>

  <rect x="40" y="1210" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1235" width="230" height="38" rx="10" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="179" y="1260" text-anchor="middle" font-size="18.5" font-weight="600" fill="#4338CA">Same answer every time</text>
  <text x="323" y="1260" font-size="18.5" fill="#475569">pin the image and the limits, or the same code passes on Tuesday and fails on Friday</text>
  <rect x="64" y="1285" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1310" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Nothing survives the run</text>
  <text x="323" y="1310" font-size="18.5" fill="#475569">the container is destroyed, so one submission can never see or affect another</text>
</svg>