<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The values 1 to 3 with the counts by size">
<defs>
<filter id="cb-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many differently shaped search trees hold the values 1 to 3?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Only the shape counts, and a search tree fixes where every value has to go</text>
<rect x="40" y="106" width="1160" height="528" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Pick any value as the root, and the rest are forced to one side or the other</text>
<text x="440" y="241" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the values</text>
<rect x="464" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="572" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="680" y="202" width="96" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="240.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="260" y="320" width="900" height="56" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="2"/>
<text x="280" y="356" font-size="19.5" font-weight="600" fill="#047857">sizes 0 to 1: 0 gives 1,   1 gives 1</text>
<text x="236" y="356" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts by size</text>
<text x="620" y="594" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">An empty set of values has one shape, the empty tree, and one value has one shape</text>
<rect x="40" y="646" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="686" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A root splits the values into a smaller group and a larger group</text>
<text x="620" y="718" text-anchor="middle" font-size="18.5" fill="#475569">Everything below the root goes left and everything above goes right, with no choice</text>
</svg>