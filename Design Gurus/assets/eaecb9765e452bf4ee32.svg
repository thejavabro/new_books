<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="864" viewBox="0 0 1240 864" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="visible-title visible-desc">
<title id="visible-title">The mode nobody notices</title>
<desc id="visible-desc">Degradation and shedding both have the dangerous property that the system looks healthy while they are working, which is how a reduced product becomes permanent.</desc>
<defs>
<marker id="visible-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="visible-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="visible-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="visible-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="864" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The mode nobody notices</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Degradation and shedding both have a dangerous property: when they work, the system looks healthy.</text>
<rect x="40" y="786" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="786" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="152" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">When these work, the system looks healthy and part of the product is quietly off</text>
<circle cx="60" cy="222" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="229" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="192" width="470" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="228" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Degraded mode is a metric</text>
<path d="M566 222H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 222H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visible-marker-slate)"/>
<rect x="610" y="192" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="215.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the fraction served from a fallback, on a</text><text x="630" y="240.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">dashboard and past a threshold an alert</text>
<circle cx="60" cy="292" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="299" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="262" width="470" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Shedding is counted separately</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visible-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a bug, and a system shedding ten percent</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">continuously is under-provisioned</text>
<circle cx="60" cy="362" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="369" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="332" width="470" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="368" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The fallback path runs regularly</text>
<path d="M566 362H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 362H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#visible-marker-slate)"/>
<rect x="610" y="332" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="355.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in a drill, or by routing a small fraction</text><text x="630" y="380.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">of traffic through it</text>
<text x="40" y="432" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">What testing the fallback usually discovers</text>
<rect x="40" y="450" width="1160" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="476" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the fallback has a dependency on the thing that failed</text>
<rect x="40" y="498" width="1160" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="524" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the stale cache was empty, because nothing had populated it</text>
<rect x="40" y="546" width="1160" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="572" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the cheap default was never implemented</text>
<rect x="40" y="594" width="1160" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="620" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the shed response triggers a client retry loop</text>
<rect x="40" y="642" width="1160" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="620" y="668" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">degraded mode was never wired to a switch anybody could find</text>
<rect x="40" y="704" width="1160" height="56" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="704" width="5" height="56" rx="2.5" fill="#39D5AA"/><text x="64" y="738" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A fallback exercised only during incidents is tested only during incidents.</text>
<text x="66" y="820" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">This is where most of these designs turn out not to be real.</text>
</svg>