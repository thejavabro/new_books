  <g transform="translate(94,1427) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="130" y="1444.5" font-size="18.5" fill="#1F2937">Lower storage overhead</text>
  <rect x="80" y="1468" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(94,1479) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="130" y="1496.5" font-size="18.5" fill="#1F2937">Still tolerates node failures</text>
  <rect x="648" y="1416" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(662,1427) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="698" y="1444.5" font-size="18.5" fill="#1F2937">More complex to implement</text>
  <rect x="648" y="1468" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(662,1479) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="698" y="1496.5" font-size="18.5" fill="#1F2937">Higher CPU/network cost for encoding and decoding</text>
  <text x="64" y="176" font-size="18.5" fill="#6B7280">Each peer stores a full copy of the data.</text>
  <text x="64" y="868" font-size="18.5" fill="#6B7280">The file is split into k data chunks and m parity chunks.</text>
  <text x="64" y="894" font-size="18.5" fill="#6B7280">Any k of the n chunks (n = k + m) can reconstruct the file.</text>
  <text x="284" y="1208" font-size="18.5" text-anchor="middle" fill="#475569">Data chunks (k = 3)</text>
