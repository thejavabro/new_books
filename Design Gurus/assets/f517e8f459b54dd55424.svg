  <text x="698" y="594.5" font-size="18.5" fill="#1F2937">High storage overhead</text>
  <rect x="648" y="618" width="512" height="44" rx="10" fill="#FFFFFF" stroke="#F9A8D4" stroke-width="1.2"/>
  <g transform="translate(662,629) scale(0.92)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="698" y="646.5" font-size="18.5" fill="#1F2937">Uses more network bandwidth</text>
