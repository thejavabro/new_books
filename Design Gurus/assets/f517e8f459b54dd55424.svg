<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1600" viewBox="0 0 1240 1600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Replication: a 100 MB file is copied whole to Peers A, B, C and D; it is simple, gives fast reads and high availability, but has high storage overhead and uses more network bandwidth. Erasure coding: the file is split into three 33.3 MB data chunks and two 33.3 MB parity chunks stored on Peers A to E, and any three of the five rebuild the file; it has lower storage overhead and still tolerates node failures, but is more complex and costs more CPU and network for encoding and decoding">
