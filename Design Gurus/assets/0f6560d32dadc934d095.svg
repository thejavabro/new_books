<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five variants of the Bloom filter, each removing one limit of the standard version at a different cost">
  <rect x="0" y="0" width="1240" height="720" fill="#FFFFFF"/>
  <defs>
    <marker id="bf5-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="bf5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  
  <path d="M370,330 C420,180 430,110 470,98" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf5-slate)"/>
  <path d="M370,344 C420,254 430,224 470,214" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf5-slate)"/>
  <path d="M370,362 C420,348 430,338 470,330" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf5-slate)"/>
  <path d="M370,398 C420,420 430,438 470,446" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf5-slate)"/>
  <path d="M370,414 C420,500 430,548 470,562" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#bf5-slate)"/>

  
  <g filter="url(#bf5-soft)">
    <rect x="40" y="316" width="330" height="120" rx="12" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="205" y="360" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Standard Bloom filter</text>
  <text x="205" y="392" font-size="20" fill="#64748B" text-anchor="middle">smallest and simplest,</text>
  <text x="205" y="420" font-size="20" fill="#64748B" text-anchor="middle">but fixed and add-only</text>

  
  <g filter="url(#bf5-soft)">
    <rect x="474" y="46" width="726" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="474" y="162" width="726" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="474" y="278" width="726" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="474" y="394" width="726" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="474" y="510" width="726" height="104" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="500" y="82" font-size="20" font-weight="600" fill="#0F172A">Counting Bloom filter</text>
  <text x="500" y="114" font-size="20" fill="#065F46">adds: deletion</text>
  <text x="860" y="114" font-size="20" fill="#991B1B">costs: several times the memory</text>

  <text x="500" y="198" font-size="20" font-weight="600" fill="#0F172A">Compressed Bloom filter</text>
  <text x="500" y="230" font-size="20" fill="#065F46">adds: a smaller payload on the wire</text>
  <text x="860" y="230" font-size="20" fill="#991B1B">costs: compression work</text>

  <text x="500" y="314" font-size="20" font-weight="600" fill="#0F172A">Spectral Bloom filter</text>
  <text x="500" y="346" font-size="20" fill="#065F46">adds: frequency estimates</text>
  <text x="860" y="346" font-size="20" fill="#991B1B">costs: counters, and over-counting</text>

  <text x="500" y="430" font-size="20" font-weight="600" fill="#0F172A">Scalable Bloom filter</text>
  <text x="500" y="462" font-size="20" fill="#065F46">adds: growth without a known size</text>
  <text x="860" y="462" font-size="20" fill="#991B1B">costs: a check per sub-filter</text>

  <text x="500" y="546" font-size="20" font-weight="600" fill="#0F172A">Cuckoo filter</text>
  <text x="500" y="578" font-size="20" fill="#065F46">adds: deletion in tight memory</text>
  <text x="860" y="578" font-size="20" fill="#991B1B">costs: inserts fail when nearly full</text>

  
  <text x="620" y="676" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Every variant relaxes one constraint of the standard filter, and pays for it somewhere else.</text>
</svg>