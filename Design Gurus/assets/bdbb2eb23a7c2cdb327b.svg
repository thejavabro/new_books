<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The parts of a case study lesson, and what to do with each one">
  <defs>
    <marker id="oodl-arrow-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="oodl-arrow-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="oodl-arrow-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="oodl-arrow-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="oodl-arrow-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="oodl-arrow-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="oodl-arrow-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <filter id="oodl-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
    <filter id="oodl-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
    <clipPath id="oodl-p0"><rect x="44" y="78" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q0"><rect x="570" y="78" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p1"><rect x="44" y="166" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q1"><rect x="570" y="166" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p2"><rect x="44" y="254" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q2"><rect x="570" y="254" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p3"><rect x="44" y="342" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q3"><rect x="570" y="342" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p4"><rect x="44" y="430" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q4"><rect x="570" y="430" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p5"><rect x="44" y="518" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q5"><rect x="570" y="518" width="626" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-p6"><rect x="44" y="606" width="470" height="64" rx="12"/></clipPath>
    <clipPath id="oodl-q6"><rect x="570" y="606" width="626" height="64" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>
  <text x="44" y="56" font-size="16.5" fill="#6B7280" font-weight="600">The part of the lesson</text>
  <text x="570" y="56" font-size="16.5" fill="#6B7280" font-weight="600">What to do with it</text>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="78" width="470" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="44" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oodl-p0)"/>
  </g>
  <circle cx="82" cy="110.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="116.5" font-size="17" font-weight="700" text-anchor="middle" fill="#64748B">1</text>
  <text x="112" y="116.5" font-size="18.5" font-weight="600" fill="#111827">The question and requirements</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="78" width="626" height="64" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="570" y="78" width="6" height="64" fill="#64748B" clip-path="url(#oodl-q0)"/>
  </g>
  <text x="592" y="116.5" font-size="18.5" font-weight="600" fill="#111827">stop, and write your own list before you read ours</text>
  <path d="M514,110 L570,110" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#oodl-arrow-slate)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="166" width="470" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="44" y="166" width="6" height="64" fill="#4F46E5" clip-path="url(#oodl-p1)"/>
  </g>
  <circle cx="82" cy="198.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="204.5" font-size="17" font-weight="700" text-anchor="middle" fill="#4F46E5">2</text>
  <text x="112" y="204.5" font-size="18.5" font-weight="600" fill="#111827">The use case diagram</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="166" width="626" height="64" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="570" y="166" width="6" height="64" fill="#4F46E5" clip-path="url(#oodl-q1)"/>
  </g>
  <text x="592" y="204.5" font-size="18.5" font-weight="600" fill="#111827">name the actors before you name a single class</text>
  <path d="M514,198 L570,198" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#oodl-arrow-indigo)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="254" width="470" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="44" y="254" width="6" height="64" fill="#2563EB" clip-path="url(#oodl-p2)"/>
  </g>
  <circle cx="82" cy="286.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="292.5" font-size="17" font-weight="700" text-anchor="middle" fill="#2563EB">3</text>
  <text x="112" y="292.5" font-size="18.5" font-weight="600" fill="#111827">The class diagram, built in stages</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="254" width="626" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="570" y="254" width="6" height="64" fill="#2563EB" clip-path="url(#oodl-q2)"/>
  </g>
  <text x="592" y="292.5" font-size="18.5" font-weight="600" fill="#111827">at each stage, predict what the next one adds</text>
  <path d="M514,286 L570,286" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#oodl-arrow-blue)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="342" width="470" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="44" y="342" width="6" height="64" fill="#7C3AED" clip-path="url(#oodl-p3)"/>
  </g>
  <circle cx="82" cy="374.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="380.5" font-size="17" font-weight="700" text-anchor="middle" fill="#7C3AED">4</text>
  <text x="112" y="380.5" font-size="18.5" font-weight="600" fill="#111827">The activity diagrams</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="342" width="626" height="64" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="570" y="342" width="6" height="64" fill="#7C3AED" clip-path="url(#oodl-q3)"/>
  </g>
  <text x="592" y="380.5" font-size="18.5" font-weight="600" fill="#111827">follow one flow from start to end, out loud</text>
  <path d="M514,374 L570,374" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#oodl-arrow-violet)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="430" width="470" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="44" y="430" width="6" height="64" fill="#059669" clip-path="url(#oodl-p4)"/>
  </g>
  <circle cx="82" cy="462.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="468.5" font-size="17" font-weight="700" text-anchor="middle" fill="#059669">5</text>
  <text x="112" y="468.5" font-size="18.5" font-weight="600" fill="#111827">Code in three languages</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="430" width="626" height="64" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="570" y="430" width="6" height="64" fill="#059669" clip-path="url(#oodl-q4)"/>
  </g>
  <text x="592" y="468.5" font-size="18.5" font-weight="600" fill="#111827">read only the one you will use in the interview</text>
  <path d="M514,462 L570,462" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#oodl-arrow-emerald)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="518" width="470" height="64" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="44" y="518" width="6" height="64" fill="#D97706" clip-path="url(#oodl-p5)"/>
  </g>
  <circle cx="82" cy="550.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="556.5" font-size="17" font-weight="700" text-anchor="middle" fill="#D97706">6</text>
  <text x="112" y="556.5" font-size="18.5" font-weight="600" fill="#111827">The patterns in this design</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="518" width="626" height="64" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="570" y="518" width="6" height="64" fill="#D97706" clip-path="url(#oodl-q5)"/>
  </g>
  <text x="592" y="556.5" font-size="18.5" font-weight="600" fill="#111827">name the pattern, when the design uses one</text>
  <path d="M514,550 L570,550" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#oodl-arrow-amber)"/>
  <g filter="url(#oodl-soft)">
    <rect x="44" y="606" width="470" height="64" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="44" y="606" width="6" height="64" fill="#DB2777" clip-path="url(#oodl-p6)"/>
  </g>
  <circle cx="82" cy="638.0" r="18" fill="#FFFFFF"/>
  <text x="82" y="644.5" font-size="17" font-weight="700" text-anchor="middle" fill="#DB2777">7</text>
  <text x="112" y="644.5" font-size="18.5" font-weight="600" fill="#111827">What we left out</text>
  <g filter="url(#oodl-soft)">
    <rect x="570" y="606" width="626" height="64" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="570" y="606" width="6" height="64" fill="#DB2777" clip-path="url(#oodl-q6)"/>
  </g>
  <text x="592" y="644.5" font-size="18.5" font-weight="600" fill="#111827">this is the trade off you will be asked about</text>
  <path d="M514,638 L570,638" fill="none" stroke="#DB2777" stroke-width="2" marker-end="url(#oodl-arrow-pink)"/>
  <text x="620" y="700" text-anchor="middle" font-size="16.5" fill="#6B7280" font-weight="600">Reading a finished design teaches very little. The comparison with your own is the lesson.</text>
</svg>