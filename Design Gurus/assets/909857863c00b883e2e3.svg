<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated code deployment architecture: intent recorded in Postgres, orchestrator batching through a Redis inbox, agent pull execution and automatic rollback">
  <defs>
    <filter id="cd-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="cd-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="cd-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cd-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="cd-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="cd-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">Code deployment: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Agents pull, the orchestrator paces, and Redis is only ever a mailbox</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Intent · clicking deploy contacts no servers at all</text>
  <path d="M364,194 L456,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="410" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">POST</text>
  <path d="M784,194 L876,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="830" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">explode</text>
  <g filter="url(#cd-soft)">
    <rect x="40" y="156" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="460" y="156" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M880,171 L880,217 A160,15 0 0 0 1200,217 L1200,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1040" cy="171" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="200" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Developer</text>
  <text x="200" y="216" font-size="20" fill="#64748B" text-anchor="middle">picks a version</text>
  <text x="620" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">API Server</text>
  <text x="620" y="216" font-size="20" fill="#64748B" text-anchor="middle">writes rows only</text>
  <text x="1040" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
  <text x="1040" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">one row per host</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#92400E">2. Pacing · the orchestrator moves 10 hosts at a time, and can stop</text>
  <path d="M364,436 L456,436" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#cd-amber)"/>
  <text x="410" y="424" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">poll</text>
  <path d="M784,436 L876,436" stroke="#059669" stroke-width="2" fill="none" marker-end="url(#cd-emerald)"/>
  <text x="830" y="424" font-size="20" fill="#065F46" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">next 10</text>
  <g filter="url(#cd-soft)">
    <path d="M40,413 L40,459 A160,15 0 0 0 360,459 L360,413" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="200" cy="413" rx="160" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="460" y="398" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M880,413 L880,459 A160,15 0 0 0 1200,459 L1200,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1040" cy="413" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="200" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PostgreSQL</text>
  <text x="200" y="504" font-size="20" fill="#5B21B6" text-anchor="middle">the source of truth</text>
  <text x="620" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Orchestrator</text>
  <text x="620" y="458" font-size="20" fill="#64748B" text-anchor="middle">wakes every 5s</text>
  <text x="1040" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis inbox</text>
  <text x="1040" y="504" font-size="20" fill="#065F46" text-anchor="middle">derived, rebuildable</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Execution · agents phone home, so no firewall has to be opened</text>
  <path d="M264,678 L349,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="307" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">poll</text>
  <path d="M577,678 L662,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="620" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">signed</text>
  <path d="M890,678 L975,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="933" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">install</text>
  <g filter="url(#cd-soft)">
    <rect x="40" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="640" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,655 L666,701 A110,15 0 0 0 886,701 L886,655" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="655" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="979" y="640" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="150" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Agent</text>
  <text x="150" y="700" font-size="20" fill="#64748B" text-anchor="middle">every 10s, jittered</text>
  <text x="463" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Agent Gateway</text>
  <text x="463" y="700" font-size="20" fill="#64748B" text-anchor="middle">reads Redis only</text>
  <text x="776" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3 and CDN</text>
  <text x="776" y="746" font-size="20" fill="#5B21B6" text-anchor="middle">signed, verified</text>
  <text x="1089" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Local swap</text>
  <text x="1089" y="700" font-size="20" fill="#64748B" text-anchor="middle">health check itself</text>

  <rect x="24" y="822" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. Safety · a bad build must stop, not spread</text>
  <path d="M364,920 L456,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="410" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">trips</text>
  <path d="M784,920 L876,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#cd-blue)"/>
  <text x="830" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">at scale</text>
  <g filter="url(#cd-soft)">
    <rect x="40" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Failure rate</text>
  <text x="200" y="942" font-size="20" fill="#64748B" text-anchor="middle">watched per batch</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Freeze</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">over 20% pauses</text>
  <text x="1040" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">P2P copy</text>
  <text x="1040" y="942" font-size="20" fill="#64748B" text-anchor="middle">fleet feeds itself</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>