<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="backfill-title backfill-desc">
<title id="backfill-title">Backfilling safely</title>
<desc id="backfill-desc">Bounded batches with a pause and a resumable cursor, each its own transaction. A single statement over the whole table holds one long transaction, blocks cleanup across the database, and loses everything if interrupted.</desc>
<defs>
<marker id="backfill-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="backfill-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="backfill-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="backfill-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="780" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Backfilling safely</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The shape that works is boring.</text>
<rect x="40" y="702" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="702" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="240" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V352A6 6 0 0 0 46 358H54Z" fill="#39D5AA"/><text x="70" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Bounded batches</text>
<rect x="72" y="172" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a batch</text>
<rect x="72" y="216" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a short pause</text>
<rect x="72" y="260" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a resumable cursor</text>
<rect x="72" y="304" width="500" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="322" y="330" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">each batch its own transaction</text>
<rect x="640" y="118" width="560" height="240" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V352A6 6 0 0 0 646 358H654Z" fill="#F28B9D"/><text x="670" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">One statement over the table</text>
<rect x="672" y="172" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="198" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">one enormous transaction</text>
<rect x="672" y="216" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="242" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a large amount of garbage</text>
<rect x="672" y="260" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="286" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a snapshot that blocks cleanup</text>
<rect x="672" y="304" width="500" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="330" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cannot be interrupted</text>
<rect x="40" y="380" width="1160" height="56" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="380" width="5" height="56" rx="2.5" fill="#F3CF6A"/><text x="64" y="414" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A long transaction blocks cleanup of dead rows across the whole database, as the databases module covers</text>
<text x="40" y="478" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two details that come from having done this</text>
<rect x="40" y="496" width="560" height="86" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="496" width="5" height="86" rx="2.5" fill="#5EC9EC"/><text x="64" y="519" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Throttle against a signal, not a constant.</text><text x="64" y="545" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Replication lag adapts to time of day.</text><text x="64" y="571" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A fixed sleep does not.</text>
<rect x="640" y="496" width="560" height="86" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="496" width="5" height="86" rx="2.5" fill="#AC8BE8"/><text x="664" y="519" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Make it idempotent and re-runnable.</text><text x="664" y="545" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A backfill you are afraid to re-run</text><text x="664" y="571" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is one nobody finishes.</text>
<rect x="40" y="610" width="1160" height="66" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="610" width="5" height="66" rx="2.5" fill="#F28B9D"/><text x="64" y="649" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The backfill is the step most likely to take the database down.</text>
<text x="66" y="736" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">It will be interrupted, so design for restarting rather than for finishing.</text>
</svg>