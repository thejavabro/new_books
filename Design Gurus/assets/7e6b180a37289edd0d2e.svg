<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="728" viewBox="0 0 1240 728" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="composite-title composite-desc">
<title id="composite-title">Composite keys and the range read</title>
<desc id="composite-desc">Items sit in sort key order inside a partition, so any pattern expressible as a contiguous range becomes one request. A composite sort key serves several patterns, provided the components are in the right order.</desc>
<defs>
<marker id="composite-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="composite-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="composite-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="composite-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="728" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Composite keys and the range read</text>
<text x="40" y="86" font-size="21" fill="#4A5568">A composite sort key serves several patterns, provided the components are in the right order.</text>
<rect x="40" y="650" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="650" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Within a partition, items are stored in sort key order</text>
<rect x="40" y="168" width="1160" height="88" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<rect x="70" y="186" width="170" height="54" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="155" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">OPEN#...T09</text><rect x="256" y="186" width="170" height="54" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="341" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">OPEN#...T14</text><rect x="442" y="186" width="170" height="54" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="527" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">SHIP#...T11</text><rect x="628" y="186" width="170" height="54" rx="7" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="713" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">SHIP#...T16</text><rect x="814" y="186" width="170" height="54" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="899" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">DONE#...T08</text><rect x="1000" y="186" width="170" height="54" rx="7" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1085" y="220" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">DONE#...T21</text>
<path d="M62 178H434V248H62Z" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<text x="248" y="282" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">one contiguous range read</text>
<rect x="40" y="306" width="1160" height="78" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="306" width="5" height="78" rx="2.5" fill="#39D5AA"/><text x="64" y="338" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">A range read is the cheapest query the store offers.</text><text x="64" y="364" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Contiguous, bounded, and needing no filtering.</text>
<text x="40" y="424" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The ordering inside the composite is the decision</text>
<rect x="40" y="442" width="560" height="82" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">status#timestamp</text><text x="320" y="502.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">filter by status, ordered by time</text>
<rect x="640" y="442" width="560" height="82" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="475.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">timestamp#status</text><text x="920" y="502.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">cannot filter by status at all</text>
<rect x="40" y="544" width="1160" height="80" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="544" width="5" height="80" rx="2.5" fill="#AC8BE8"/><text x="64" y="577" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A prefix is queryable. A suffix is not.</text><text x="64" y="603" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Getting it backwards is not visible until somebody writes the query.</text>
<text x="66" y="684" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The sort key gets the least attention and does most of the work.</text>
</svg>