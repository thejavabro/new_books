<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1340" viewBox="0 0 1200 1340" role="img" aria-labelledby="title desc"><title id="title">AI assistant: client architecture</title><desc id="desc">The generation coordinator saves the question and applies privacy and capability policy before selecting a route. The local runtime uses model assets prepared by the installer. A cloud adapter is used only when authorized. The conversation store preserves questions and labeled partial or complete answers. Stop must cancel the actual attempt, not only hide its output.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1340" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="870" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">AI assistant: client architecture</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">Choose an allowed route before generation. Keep attempt identity and cancellation explicit.</text><rect x="50" y="165" width="1100" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="205" font-size="24" fill="#2563eb" font-weight="700">Conversation view + presentation state</text><text x="72" y="243" font-size="21" fill="#334155" font-weight="400">Show the saved question, identified output, and accurate partial or complete status.</text><rect x="435" y="350" width="330" height="205" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="390" font-size="24" fill="#059669" font-weight="700">Generation</text><text x="457" y="420" font-size="24" fill="#059669" font-weight="700">coordinator</text><text x="457" y="458" font-size="21" fill="#334155" font-weight="400">Check privacy and capability.</text><text x="457" y="488" font-size="21" fill="#334155" font-weight="400">Freeze route and context.</text><text x="457" y="518" font-size="21" fill="#334155" font-weight="400">Own the attempt and Stop.</text><rect x="820" y="350" width="330" height="205" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="842" y="390" font-size="24" fill="#7c3aed" font-weight="700">Conversation store</text><text x="842" y="428" font-size="21" fill="#334155" font-weight="400">Saved questions and history</text><text x="842" y="458" font-size="21" fill="#334155" font-weight="400">Attempt identities</text><text x="842" y="488" font-size="21" fill="#334155" font-weight="400">Partial and complete answers</text><rect x="50" y="350" width="330" height="205" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="390" font-size="24" fill="#c2410c" font-weight="700">Model installer</text><text x="72" y="428" font-size="21" fill="#334155" font-weight="400">Stage model assets.</text><text x="72" y="458" font-size="21" fill="#334155" font-weight="400">Prepare the local model</text><text x="72" y="488" font-size="21" fill="#334155" font-weight="400">for runtime use.</text><path d="M600 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M773 450 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="995" y="310" font-size="18" fill="#64748b" font-weight="700">MOBILE APP</text><rect x="50" y="725" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="765" font-size="24" fill="#7c3aed" font-weight="700">Local-runtime adapter</text><text x="72" y="803" font-size="21" fill="#334155" font-weight="400">Run the chosen local model off UI execution.</text><text x="72" y="833" font-size="21" fill="#334155" font-weight="400">Use bounded memory and concurrency.</text><text x="72" y="863" font-size="21" fill="#334155" font-weight="400">Honor cancellation and resource cleanup.</text><rect x="650" y="725" width="500" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="765" font-size="24" fill="#2563eb" font-weight="700">Authorized cloud adapter</text><text x="672" y="803" font-size="21" fill="#334155" font-weight="400">Send only policy-approved context.</text><text x="672" y="833" font-size="21" fill="#334155" font-weight="400">Stream events for the identified attempt.</text><text x="672" y="863" font-size="21" fill="#334155" font-weight="400">Request actual cancellation on Stop.</text><path d="M540 563 V630 H310 V717" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M660 563 V665 H900 V717" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="332" y="699" font-size="21" fill="#64748b" font-weight="400">Local route</text><text x="674" y="699" font-size="21" fill="#64748b" font-weight="400">Authorized cloud route</text><path d="M215 563 V717" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><text x="75" y="604" font-size="21" fill="#64748b" font-weight="400">Model</text><text x="75" y="634" font-size="21" fill="#64748b" font-weight="400">assets</text><path d="M900 918 V1062" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="922" y="1047" font-size="19" fill="#64748b" font-weight="400">Network</text><rect x="650" y="1070" width="500" height="170" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="1110" font-size="24" fill="#c2410c" font-weight="700">Authorized cloud service</text><text x="672" y="1148" font-size="21" fill="#334155" font-weight="400">Run the selected remote attempt.</text><text x="672" y="1178" font-size="21" fill="#334155" font-weight="400">Return identified events and completion.</text><rect x="50" y="1070" width="520" height="170" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1110" font-size="24" fill="#ffffff" font-weight="700">Stopping must reach the runtime</text><text x="72" y="1148" font-size="21" fill="#ffffff" font-weight="400">Request cancellation of the actual attempt.</text><text x="72" y="1178" font-size="21" fill="#ffffff" font-weight="400">Ignore late output for a stopped attempt.</text><text x="72" y="1208" font-size="21" fill="#ffffff" font-weight="400">Keep a clearly labeled partial answer.</text><text x="50" y="1290" font-size="20" fill="#475569" font-weight="400">Selected connections shown. The coordinator checkpoints output in the conversation store.</text></g></svg>