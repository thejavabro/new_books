  <text x="620" y="175" font-size="19" fill="#0F172A" text-anchor="middle">machine 1</text>
  <text x="850" y="175" font-size="19" fill="#0F172A" text-anchor="middle">machine 1</text>
  <text x="1070" y="175" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">stayed</text>
  <rect x="100" y="194" width="1060" height="40" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
