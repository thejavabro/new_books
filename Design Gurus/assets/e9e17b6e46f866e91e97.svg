  <text x="620" y="558" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Six of these eight keys moved. Across millions of keys the share settles near 80 percent.</text>
  <text x="620" y="588" font-size="19" fill="#64748B" text-anchor="middle">Every moved key has to be copied to a new machine before it can be read again.</text>
</svg>