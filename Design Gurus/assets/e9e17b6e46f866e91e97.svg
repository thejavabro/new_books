  <text x="1070" y="359" font-size="19" font-weight="700" fill="#065F46" text-anchor="middle">stayed</text>
  <rect x="100" y="378" width="1060" height="40" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190" y="405" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user:79</text>
  <text x="400" y="405" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">72</text>
