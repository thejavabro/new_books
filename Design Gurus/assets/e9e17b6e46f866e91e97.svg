  <text x="1070" y="221" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">moved</text>
  <rect x="100" y="240" width="1060" height="40" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190" y="267" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user:48</text>
  <text x="400" y="267" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">47</text>
  <text x="620" y="267" font-size="19" fill="#0F172A" text-anchor="middle">machine 3</text>
  <text x="850" y="267" font-size="19" fill="#0F172A" text-anchor="middle">machine 2</text>
  <text x="1070" y="267" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">moved</text>
  <rect x="100" y="286" width="1060" height="40" rx="7" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/>
  <text x="190" y="313" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user:55</text>
  <text x="400" y="313" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">58</text>
  <text x="620" y="313" font-size="19" fill="#0F172A" text-anchor="middle">machine 2</text>
  <text x="850" y="313" font-size="19" fill="#0F172A" text-anchor="middle">machine 3</text>
  <text x="1070" y="313" font-size="19" font-weight="700" fill="#B91C1C" text-anchor="middle">moved</text>
  <rect x="100" y="332" width="1060" height="40" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="359" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user:61</text>
  <text x="400" y="359" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">63</text>
