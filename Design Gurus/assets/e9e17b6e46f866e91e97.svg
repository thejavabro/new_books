<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="606" viewBox="0 0 1240 606" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A table of eight keys. Each key has a hash value, the machine chosen by hash modulo four, and the machine chosen by hash modulo five. Six of the eight keys land on a different machine after one machine is added.">
  <rect x="0" y="0" width="1240" height="606" fill="#FFFFFF"/>
  <defs>
    <marker id="chs1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="chs1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="chs1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="chs1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="chs1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="chs1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="chs1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="chs1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="chs1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Adding one machine to hash(key) % n moves almost every key</text>
  <text x="620" y="70" font-size="19" fill="#64748B" text-anchor="middle">four machines become five</text>
  <text x="190" y="122" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">KEY</text>
  <text x="400" y="122" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">hash(key)</text>
  <text x="620" y="122" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">hash % 4</text>
  <text x="850" y="122" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">hash % 5</text>
  <text x="1070" y="122" font-size="17" font-weight="700" fill="#64748B" text-anchor="middle">DID IT MOVE?</text>
  <path d="M100 134 H1160" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <rect x="100" y="148" width="1060" height="40" rx="7" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/>
  <text x="190" y="175" font-size="19" fill="#0F172A" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">user:12</text>
