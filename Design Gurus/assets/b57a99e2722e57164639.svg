<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="910" viewBox="0 0 1240 910" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="costs-title costs-desc">
<title id="costs-title">What each change actually costs</title>
<desc id="costs-desc">Some statements are catalog-only and instant, some rewrite the table under an exclusive lock, and the one that causes the outage is none of them. It is a DDL statement queuing for a lock while every later query queues behind it.</desc>
<defs>
<marker id="costs-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="costs-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="costs-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="costs-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="910" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What each change actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Some statements are catalog-only and instant, some rewrite the table under an exclusive lock.</text>
<rect x="40" y="832" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="832" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="500" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="153" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add a nullable column</text>
<path d="M546 147H580" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 147H580" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-green)"/>
<rect x="590" y="118" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="153" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">instant, a catalog change only</text>
<rect x="40" y="182" width="500" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="217" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add a column with a constant default</text>
<path d="M546 211H580" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 211H580" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-green)"/>
<rect x="590" y="182" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="204.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">instant since Postgres 11; the default is</text><text x="610" y="229.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stored in the catalog</text>
<rect x="40" y="246" width="500" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="290" y="267.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add a volatile default, generated or</text><text x="290" y="294.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">identity column</text>
<path d="M546 275H580" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 275H580" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-red)"/>
<rect x="590" y="246" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="281" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rewrites the whole table under an exclusive lock</text>
<rect x="40" y="310" width="500" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="345" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add an index</text>
<path d="M546 339H580" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 339H580" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-amber)"/>
<rect x="590" y="310" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="332.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">CREATE INDEX CONCURRENTLY: no write lock,</text><text x="610" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">slower, no transaction</text>
<rect x="40" y="374" width="500" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="290" y="409" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Add NOT NULL to an existing column</text>
<path d="M546 403H580" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 403H580" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-amber)"/>
<rect x="590" y="374" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">CHECK ... NOT VALID, then VALIDATE</text><text x="610" y="421.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">separately, for a weaker lock</text>
<rect x="40" y="438" width="500" height="58" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="290" y="473" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Drop a column</text>
<path d="M546 467H580" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M546 467H580" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#costs-marker-green)"/>
<rect x="590" y="438" width="610" height="58" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="610" y="473" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">instant, though the space is not reclaimed</text>
<rect x="40" y="516" width="1160" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="550" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A great deal of published advice predates Postgres 11 and still says to avoid defaults</text>
<rect x="40" y="600" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="600" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="633" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">And none of those is what causes the outage</text><text x="64" y="662" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A DDL statement waiting for its lock blocks every query behind it.</text><text x="64" y="691" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">An ALTER waits on one forgotten analytics query, and every new query on that table queues behind the ALTER.</text>
<rect x="40" y="740" width="1160" height="66" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="740" width="5" height="66" rx="2.5" fill="#39D5AA"/><text x="64" y="779" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Set a short lock_timeout, let it fail, and retry. Failing fast beats waiting.</text>
<text x="66" y="864" font-size="18" font-weight="400" fill="#080C50" text-anchor="start">A migration documented as instant can still take a table offline for the length of a transaction somebody else left open.</text>
</svg>