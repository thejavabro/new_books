<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1038" viewBox="0 0 1240 1038" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What each relationship shape costs the API: one-to-many becomes a paged sub-collection, many-to-one becomes an id field on the child, many-to-many becomes its own resource whenever the join carries fields of its own, and a join with no fields today is still worth testing because promoting it later is a breaking change.">
  <defs>
    <filter id="p38-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p38-k1"><rect x="76" y="146" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p38-k2"><rect x="76" y="342" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p38-k3"><rect x="76" y="538" width="1088" height="90" rx="12"/></clipPath>
    <clipPath id="p38-k4"><rect x="76" y="734" width="1088" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1038" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Every relationship shape has an API consequence</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M688,71.5 L702,71.5 M696.5,66 L702,71.5 L696.5,77"/>
  </g>
  <text x="716" y="77" font-size="15.5" fill="#6B7280">what it becomes</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M912,66 L923,77 M923,66 L912,77"/>
  </g>
  <text x="938" y="77" font-size="15.5" fill="#6B7280">what that costs</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p38-soft)">
    <rect x="76" y="146" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#4F46E5" clip-path="url(#p38-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">One-to-many</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256.5 L92,256.5 M86.5,251 L92,256.5 L86.5,262"/>
  </g>
  <text x="106" y="262" font-size="15.5" fill="#6B7280">A paged sub-collection under the parent</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="106" y="288" font-size="15.5" fill="#6B7280">Paging, ordering, and a cursor for a list that can grow</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p38-soft)">
    <rect x="76" y="342" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#4F46E5" clip-path="url(#p38-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Many-to-one</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452.5 L92,452.5 M86.5,447 L92,452.5 L86.5,458"/>
  </g>
  <text x="106" y="458" font-size="15.5" fill="#6B7280">An id field on the child</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="106" y="484" font-size="15.5" fill="#6B7280">A second read, unless the summary is embedded</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p38-soft)">
    <rect x="76" y="538" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#4F46E5" clip-path="url(#p38-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Many-to-many with fields</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648.5 L92,648.5 M86.5,643 L92,648.5 L86.5,654"/>
  </g>
  <text x="106" y="654" font-size="15.5" fill="#6B7280">Its own resource, such as Membership</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="106" y="680" font-size="15.5" fill="#6B7280">An id, a lifecycle, permissions, and its own operations</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p38-soft)">
    <rect x="76" y="734" width="1088" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#4F46E5" clip-path="url(#p38-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Many-to-many with no fields</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844.5 L92,844.5 M86.5,839 L92,844.5 L86.5,850"/>
  </g>
  <text x="106" y="850" font-size="15.5" fill="#6B7280">A plain link today, but still test it: a role or joined_at appears later</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="106" y="876" font-size="15.5" fill="#6B7280">Adding a resource needs compatibility review</text>

  
  <rect x="40" y="922" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="967" text-anchor="middle" font-size="16" fill="#475569">An entity does not automatically become a resource, and a resource is not a copy of a storage table.</text>
</svg>