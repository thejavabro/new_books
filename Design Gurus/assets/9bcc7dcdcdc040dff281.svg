<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1060" viewBox="0 0 1200 1060" role="img" aria-labelledby="title desc"><title id="title">An await can separate a check from its use</title><desc id="desc">Task A reads generation 7 and suspends at await. While it is suspended, another actor operation changes the generation to 8. When A resumes, it must check the current generation again before applying its result. Actor-isolated access alone does not make the complete multi-step operation atomic.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1060" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">An await can separate a check from its use</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Actor-owned state may change while a method is suspended.</text><text x="75" y="180" font-size="25" fill="#2563eb" font-weight="700">Task A</text><text x="705" y="180" font-size="25" fill="#7c3aed" font-weight="700">Actor-owned state</text><rect x="50" y="220" width="500" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="260" font-size="24" fill="#2563eb" font-weight="700">Read generation 7</text><text x="72" y="301" font-size="21" fill="#334155" font-weight="400">Start work for that generation.</text><rect x="650" y="220" width="500" height="130" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="672" y="260" font-size="24" fill="#7c3aed" font-weight="700">Current generation: 7</text><text x="672" y="301" font-size="21" fill="#334155" font-weight="400">The initial check matches.</text><path d="M642 285 H558" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="430" width="500" height="130" rx="18" fill="#f1f5f9" stroke="#475569" stroke-width="2"/><text x="72" y="470" font-size="24" fill="#475569" font-weight="700">Suspend at await</text><text x="72" y="511" font-size="21" fill="#334155" font-weight="400">Other actor work can run while A waits.</text><path d="M300 358 V422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="650" y="430" width="500" height="130" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="470" font-size="24" fill="#c2410c" font-weight="700">Other actor work runs</text><text x="672" y="511" font-size="21" fill="#334155" font-weight="400">A new action changes generation to 8.</text><path d="M900 358 V422" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="660" width="500" height="150" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="700" font-size="24" fill="#2563eb" font-weight="700">A resumes with its old result</text><text x="72" y="741" font-size="21" fill="#334155" font-weight="400">Captured generation: 7</text><text x="72" y="772" font-size="21" fill="#334155" font-weight="400">Check the current state again.</text><path d="M300 568 V652" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="650" y="660" width="500" height="150" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="700" font-size="24" fill="#059669" font-weight="700">Current generation: 8</text><text x="672" y="741" font-size="21" fill="#334155" font-weight="400">The generations differ.</text><text x="672" y="772" font-size="21" fill="#334155" font-weight="400">Do not apply A’s obsolete result.</text><path d="M900 568 V652" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M558 735 H642" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="900" width="1100" height="115" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="940" font-size="24" fill="#ffffff" font-weight="700">Suspension is a point where assumptions may change</text><text x="72" y="981" font-size="21" fill="#ffffff" font-weight="400">Recheck identity, versions, and other conditions before committing or displaying a result.</text></g></svg>