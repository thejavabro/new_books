<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="678" viewBox="0 0 1240 678" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="levels-title levels-desc">
<title id="levels-title">What each isolation level prevents</title>
<desc id="levels-desc">Read committed stops only dirty reads. Repeatable read in both Postgres and InnoDB also stops non-repeatable reads and phantoms, by different mechanisms, but neither stops write skew. Only serializable stops all four, and it does so by aborting transactions.</desc>
<defs>
<marker id="levels-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="levels-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="levels-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="levels-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="678" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What each isolation level prevents</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The implementations differ from the standard and from each other.</text>
<rect x="40" y="600" width="1160" height="52" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="600" width="5" height="52" rx="2.5" fill="#AC8BE8"/>
<text x="512" y="152" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Dirty read</text>
<text x="707" y="152" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Non-repeatable read</text>
<text x="902" y="152" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Phantom read</text>
<text x="1097" y="152" font-size="20" font-weight="700" fill="#4A5568" text-anchor="middle">Write skew</text>
<rect x="40" y="180" width="364" height="66" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="180" width="5" height="66" rx="2.5" fill="#5EC9EC"/><text x="64" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Read committed</text><text x="64" y="232" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Postgres default</text>
<rect x="420" y="187" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="512" y="219" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="615" y="187" width="184" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="707" y="219" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">possible</text>
<rect x="810" y="187" width="184" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="902" y="219" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">possible</text>
<rect x="1005" y="187" width="184" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1097" y="219" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">possible</text>
<rect x="40" y="256" width="364" height="66" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="256" width="5" height="66" rx="2.5" fill="#5EC9EC"/><text x="64" y="282" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Repeatable read</text><text x="64" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Postgres: snapshot isolation</text>
<rect x="420" y="263" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="512" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="615" y="263" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="707" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="810" y="263" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="902" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="1005" y="263" width="184" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1097" y="295" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">possible</text>
<rect x="40" y="332" width="364" height="66" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="332" width="5" height="66" rx="2.5" fill="#5EC9EC"/><text x="64" y="358" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Repeatable read</text><text x="64" y="384" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">InnoDB default: next-key locks</text>
<rect x="420" y="339" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="512" y="371" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="615" y="339" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="707" y="371" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="810" y="339" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="902" y="371" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="1005" y="339" width="184" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1097" y="371" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">possible</text>
<rect x="40" y="408" width="364" height="66" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="408" width="5" height="66" rx="2.5" fill="#5EC9EC"/><text x="64" y="434" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Serializable</text><text x="64" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">aborts in Postgres, locks in MySQL</text>
<rect x="420" y="415" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="512" y="447" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="615" y="415" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="707" y="447" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="810" y="415" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="902" y="447" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="1005" y="415" width="184" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1097" y="447" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">prevented</text>
<rect x="40" y="498" width="1160" height="76" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="498" width="5" height="76" rx="2.5" fill="#F3CF6A"/><text x="64" y="528.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">Only the last row stops write skew, and it is the only row that can abort your transactions.</text><text x="64" y="555.5" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">That is why the fix usually belongs in the schema or the query, not in the isolation level.</text>
<text x="66" y="633" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Read uncommitted is omitted: Postgres treats it as read committed, so it is a standards entry rather than a choice.</text>
</svg>