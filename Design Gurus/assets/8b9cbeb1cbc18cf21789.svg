<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="848" viewBox="0 0 1240 848" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client receives events 41, 42 and 43 and then disconnects. Reconnecting with resume after 43 replays 44 and 45 and continues live at 46. If 43 has expired from the buffer the handshake returns 409 resync required, so the client reads history and opens a new connection.">
  <defs>
    <marker id="p2p-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="p2p-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="p2p-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>

    <filter id="p2p-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p2p-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p2p-k1"><rect x="84" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k2"><rect x="254" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k3"><rect x="424" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k4"><rect x="666" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k5"><rect x="836" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k6"><rect x="1006" y="174" width="150" height="48" rx="10"/></clipPath>
    <clipPath id="p2p-k7"><rect x="390" y="320" width="460" height="90" rx="12"/></clipPath>
    <clipPath id="p2p-k8"><rect x="80" y="524" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="p2p-k9"><rect x="680" y="524" width="480" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="848" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Drop, replay, and resync</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">one drop, two outcomes</text>

  
  <rect x="40" y="126" width="1160" height="152" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#475569">The stream, and where it breaks</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">six events</text>

  
  <rect x="40" y="474" width="560" height="214" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="504" font-size="16.5" font-weight="600" fill="#047857">The point is still buffered</text>

  <rect x="640" y="474" width="560" height="214" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="664" y="504" font-size="16.5" font-weight="600" fill="#BE185D">The point has expired</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,278 V320" stroke="#2563EB" stroke-width="2.5" marker-end="url(#p2p-bl)"/>
    <path d="M430,410 V447 Q430,459 418,459 H392 Q380,459 380,471 V524" stroke="#059669" marker-end="url(#p2p-em)"/>
    <path d="M810,410 V447 Q810,459 822,459 H968 Q980,459 980,471 V524" stroke="#DB2777" marker-end="url(#p2p-pm)"/>
  </g>

  
  <g filter="url(#p2p-soft)">
    <rect x="84" y="174" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="48" fill="#059669" clip-path="url(#p2p-k1)"/>
  </g>
  <circle cx="118" cy="198" r="4.5" fill="#059669"/>
  <text x="142" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_41</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="254" y="174" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="254" y="174" width="6" height="48" fill="#059669" clip-path="url(#p2p-k2)"/>
  </g>
  <circle cx="288" cy="198" r="4.5" fill="#059669"/>
  <text x="312" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_42</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="424" y="174" width="150" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="424" y="174" width="6" height="48" fill="#059669" clip-path="url(#p2p-k3)"/>
  </g>
  <circle cx="458" cy="198" r="4.5" fill="#059669"/>
  <text x="482" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_43</text>

  
  <circle cx="620" cy="198" r="19" fill="#FCE7F3" stroke="#DB2777" stroke-width="1.5"/>
  <path d="M613,191 L627,205 M627,191 L613,205" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round"/>

  
  <g filter="url(#p2p-soft)">
    <rect x="666" y="174" width="150" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="666" y="174" width="6" height="48" fill="#64748B" clip-path="url(#p2p-k4)"/>
  </g>
  <circle cx="700" cy="198" r="4.5" fill="#64748B"/>
  <text x="724" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_44</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="836" y="174" width="150" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="836" y="174" width="6" height="48" fill="#64748B" clip-path="url(#p2p-k5)"/>
  </g>
  <circle cx="870" cy="198" r="4.5" fill="#64748B"/>
  <text x="894" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_45</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="1006" y="174" width="150" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="1006" y="174" width="6" height="48" fill="#64748B" clip-path="url(#p2p-k6)"/>
  </g>
  <circle cx="1040" cy="198" r="4.5" fill="#64748B"/>
  <text x="1064" y="205" font-size="18.5" font-weight="600" fill="#111827">evt_46</text>

  
  <rect x="84" y="230" width="490" height="5" rx="2.5" fill="#059669"/>
  <text x="329" y="258" text-anchor="middle" font-size="15.5" fill="#6B7280">received</text>
  <rect x="666" y="230" width="490" height="5" rx="2.5" fill="#94A3B8"/>
  <text x="911" y="258" text-anchor="middle" font-size="15.5" fill="#6B7280">not yet delivered</text>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="258" fill="#BE185D">connection drops</text>
  </g>

  
  <g filter="url(#p2p-lift)">
    <rect x="390" y="320" width="460" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="390" y="320" width="9" height="90" fill="#2563EB" clip-path="url(#p2p-k7)"/>
  </g>
  <circle cx="428" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(417.56,354.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="454" y="372" font-size="18.5" font-weight="600" fill="#111827">Reconnect with resume_after=evt_43</text>
  <text x="620" y="435" text-anchor="middle" font-size="15.5" fill="#6B7280">the client names the last event it saw</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="80" y="524" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="524" width="6" height="90" fill="#059669" clip-path="url(#p2p-k8)"/>
  </g>
  <circle cx="118" cy="569" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,558.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="144" y="576" font-size="18.5" font-weight="600" fill="#111827">replay evt_44 and evt_45</text>
  <text x="320" y="639" text-anchor="middle" font-size="15.5" fill="#6B7280">then live from evt_46</text>
  <text x="320" y="662" text-anchor="middle" font-size="15.5" fill="#94A3B8">Duplicates are ignored by event id.</text>

  
  <g filter="url(#p2p-soft)">
    <rect x="680" y="524" width="480" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="680" y="524" width="6" height="90" fill="#DB2777" clip-path="url(#p2p-k9)"/>
  </g>
  <circle cx="718" cy="569" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,558.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="744" y="576" font-size="18.5" font-weight="600" fill="#111827">409 resync_required</text>
  <text x="920" y="639" text-anchor="middle" font-size="15.5" fill="#6B7280">read history, then reconnect</text>
  <text x="920" y="662" text-anchor="middle" font-size="15.5" fill="#94A3B8">The client never guesses what it missed.</text>

  
  <rect x="40" y="732" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="777" text-anchor="middle" font-size="16" fill="#475569">Event ids resume delivery. Message sequences order the conversation.</text>
</svg>