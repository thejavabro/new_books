  <g transform="translate(97.56,733.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="751" font-size="18.5" font-weight="600" fill="#111827">Count the costs</text>
  <text x="295" y="799" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 38 to 43</text>
  <text x="550" y="749.5" font-size="15.5" fill="#374151"><tspan font-weight="700" fill="#111827">Exit:</tspan> two ledgers, the top failure modes with responses, and unit cost times volume</text>
