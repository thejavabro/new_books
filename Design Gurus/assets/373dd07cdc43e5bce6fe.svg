  <g transform="translate(97.56,833.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="851" font-size="18.5" font-weight="600" fill="#111827">Slack</text>
  <text x="295" y="899" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 43 to 45</text>
  <text x="550" y="849.5" font-size="15.5" fill="#374151">Held for the interviewer's questions and for parked topics</text>
