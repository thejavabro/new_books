  <text x="134" y="451" font-size="18.5" font-weight="600" fill="#111827">Pick the model</text>
  <text x="295" y="499" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 13 to 18</text>
  <text x="550" y="449.5" font-size="15.5" fill="#374151"><tspan font-weight="700" fill="#111827">Exit:</tspan> a baseline, and the condition for an upgrade</text>
