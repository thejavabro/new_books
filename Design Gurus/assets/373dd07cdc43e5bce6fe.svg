  <g transform="translate(97.56,633.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="651" font-size="18.5" font-weight="600" fill="#111827">Keep it working</text>
  <text x="295" y="699" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 30 to 38</text>
  <text x="550" y="649.5" font-size="15.5" fill="#374151"><tspan font-weight="700" fill="#111827">Exit:</tspan> offline, a metric gates changes; online, a metric decides; retraining has a schedule</text>
