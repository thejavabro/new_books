  <text x="375.1" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">13</text>
  <text x="504.0" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">18</text>
  <text x="813.3" y="134" font-size="15.5" text-anchor="middle" fill="#6B7280">30</text>
