<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1078" viewBox="0 0 1240 1078" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The 45-minute clock: seven framework steps in six phases, each ending with an exit criterion, plus two minutes of slack">
