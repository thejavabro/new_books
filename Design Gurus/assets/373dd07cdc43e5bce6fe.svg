  </g>
  <circle cx="108" cy="544" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,533.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="134" y="551" font-size="18.5" font-weight="600" fill="#111827">Design the serving path</text>
  <text x="295" y="599" font-size="15.5" text-anchor="middle" fill="#6B7280">minutes 18 to 30</text>
  <text x="550" y="549.5" font-size="15.5" fill="#374151"><tspan font-weight="700" fill="#111827">Exit:</tspan> every arrow carries its latency or cost and its failure behavior</text>
