<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="542" viewBox="0 0 1240 542" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the left a write with N equal to three and W equal to two. The client sends the new value to all three replicas and returns as soon as two confirm. On the right a read with R equal to two. The client asks all three replicas and waits for two answers, one with the new version and one with the old one, and it keeps the newer version. The third reply is not awaited.">
  <rect x="0" y="0" width="1240" height="542" fill="#FFFFFF"/>
  <defs>
    <marker id="qm1-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="qm1-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="qm1-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="qm1-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="qm1-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="qm1-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="qm1-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="qm1-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="qm1-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">N is how many copies, W is how many confirm a write, R is how many answer a read</text>
  <rect x="24" y="70" width="588" height="400" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="318" y="106" font-size="22" font-weight="600" fill="#1E40AF" text-anchor="middle">Write with N = 3, W = 2</text>
  <g filter="url(#qm1-soft)"><rect x="228" y="130" width="180" height="52" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="318" y="163" font-size="19" font-weight="600" fill="#1E40AF" text-anchor="middle">client writes v7</text>
  <line x1="318" y1="186" x2="146" y2="254" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#qm1-b)"/>
  <g filter="url(#qm1-soft)"><rect x="76" y="262" width="140" height="78" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="146" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 1</text>
  <text x="146" y="322" font-size="19" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v7</text>
  <path d="M137,366 L144,374 L156,358" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="318" y1="186" x2="318" y2="254" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#qm1-b)"/>
  <g filter="url(#qm1-soft)"><rect x="248" y="262" width="140" height="78" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="318" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 2</text>
  <text x="318" y="322" font-size="19" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v7</text>
  <path d="M309,366 L316,374 L328,358" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <line x1="318" y1="186" x2="490" y2="254" stroke="#3B82F6" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#qm1-b)"/>
  <g filter="url(#qm1-soft)"><rect x="420" y="262" width="140" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="490" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 3</text>
  <text x="490" y="322" font-size="19" fill="#B45309" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v6</text>
  <text x="318" y="402" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two replicas confirmed, so the write is done.</text>
  <text x="318" y="430" font-size="19" fill="#64748B" text-anchor="middle">Replica 3 catches up in the background.</text>
  <rect x="628" y="70" width="588" height="400" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text x="922" y="106" font-size="22" font-weight="600" fill="#6D28D9" text-anchor="middle">Read with N = 3, R = 2</text>
  <g filter="url(#qm1-soft)"><rect x="832" y="130" width="180" height="52" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="922" y="163" font-size="19" font-weight="600" fill="#6D28D9" text-anchor="middle">client reads</text>
  <line x1="750" y1="254" x2="922" y2="190" stroke="#7C3AED" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#qm1-v)"/>
  <g filter="url(#qm1-soft)"><rect x="680" y="262" width="140" height="78" rx="11" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.6"/></g>
  <text x="750" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 1</text>
  <text x="750" y="322" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v7</text>
  <line x1="922" y1="254" x2="922" y2="190" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#qm1-v)"/>
  <g filter="url(#qm1-soft)"><rect x="852" y="262" width="140" height="78" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="1.6"/></g>
  <text x="922" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 2</text>
  <text x="922" y="322" font-size="19" fill="#065F46" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v7</text>
  <line x1="1094" y1="254" x2="922" y2="190" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#qm1-v)"/>
  <g filter="url(#qm1-soft)"><rect x="1024" y="262" width="140" height="78" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="1094" y="294" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">replica 3</text>
  <text x="1094" y="322" font-size="19" fill="#B45309" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">holds v6</text>
  <text x="750" y="366" font-size="18" fill="#64748B" text-anchor="middle">reply not awaited</text>
  <text x="922" y="402" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Two replicas answered, v7 and v6.</text>
  <text x="922" y="430" font-size="19" fill="#64748B" text-anchor="middle">The client keeps v7, because 7 is the newer version.</text>
  <text x="620" y="506" font-size="19" fill="#64748B" text-anchor="middle">Every replica can serve both reads and writes. W and R are counts of replies, not names of machines.</text>
</svg>