<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="482" viewBox="0 0 1240 482" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four ways to decide which machine holds a row: hash partitioning, range partitioning, list partitioning and directory based partitioning, with the strength and the weakness of each.">
  <rect x="0" y="0" width="1240" height="482" fill="#FFFFFF"/>
  <defs>
    <marker id="dp2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="dp2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="dp2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="dp2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="dp2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="dp2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="dp2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="dp2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="dp2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Four ways to decide which machine holds a row</text>
  <text x="48" y="78" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">METHOD</text>
  <text x="214" y="78" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">THE RULE</text>
  <text x="544" y="78" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">GOOD AT</text>
  <text x="834" y="78" font-size="17" font-weight="700" fill="#64748B" text-anchor="start">THE COST</text>
  <path d="M24 90 H1216" fill="none" stroke="#CBD5E1" stroke-width="1.8"/>
  <g filter="url(#dp2-soft)"><rect x="24" y="100" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="1.6"/></g>
  <text x="48" y="149" font-size="21" font-weight="700" fill="#065F46" text-anchor="start">Hash</text>
  <text x="214" y="149" font-size="18" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">hash(key) % machines</text>
  <text x="544" y="149" font-size="19" fill="#0F172A" text-anchor="start">Very even spread</text>
  <text x="834" y="137" font-size="18" fill="#64748B" text-anchor="start">Adding a machine moves</text>
  <text x="834" y="165" font-size="18" fill="#64748B" text-anchor="start">almost every row</text>
  <g filter="url(#dp2-soft)"><rect x="24" y="194" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="48" y="243" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="start">Range</text>
  <text x="214" y="243" font-size="18" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">values from A to M here</text>
  <text x="544" y="243" font-size="19" fill="#0F172A" text-anchor="start">Range queries are easy</text>
  <text x="834" y="231" font-size="18" fill="#64748B" text-anchor="start">Today's writes all land</text>
  <text x="834" y="259" font-size="18" fill="#64748B" text-anchor="start">on one machine</text>
  <g filter="url(#dp2-soft)"><rect x="24" y="288" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="48" y="337" font-size="21" font-weight="700" fill="#B45309" text-anchor="start">List</text>
  <text x="214" y="337" font-size="18" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">you name the values</text>
  <text x="544" y="337" font-size="19" fill="#0F172A" text-anchor="start">Simple and readable</text>
  <text x="834" y="325" font-size="18" fill="#64748B" text-anchor="start">You maintain it, and the</text>
  <text x="834" y="353" font-size="18" fill="#64748B" text-anchor="start">parts differ in size</text>
  <g filter="url(#dp2-soft)"><rect x="24" y="382" width="1192" height="84" rx="11" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="48" y="431" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="start">Directory</text>
  <text x="214" y="431" font-size="18" fill="#64748B" text-anchor="start" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">a lookup service knows</text>
  <text x="544" y="419" font-size="19" fill="#0F172A" text-anchor="start">Any key can move</text>
  <text x="544" y="447" font-size="19" fill="#0F172A" text-anchor="start">at any time</text>
  <text x="834" y="419" font-size="18" fill="#64748B" text-anchor="start">The lookup service is on</text>
  <text x="834" y="447" font-size="18" fill="#64748B" text-anchor="start">every query path</text>
</svg>