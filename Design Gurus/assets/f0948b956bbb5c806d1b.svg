<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="762" viewBox="0 0 1240 762" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="intercept-title intercept-desc">
<title id="intercept-title">Choosing the interception point</title>
<desc id="intercept-desc">A gateway, a routing layer inside the application, a seam in the code, or event interception. The choice sets how small a slice can be, and therefore how long the whole migration runs.</desc>
<defs>
<marker id="intercept-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="intercept-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="intercept-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="intercept-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="762" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Choosing the interception point</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The options, in increasing order of how invasive they are.</text>
<rect x="40" y="684" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="684" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="158" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="165" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="122" width="470" height="72" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="164" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A proxy or gateway in front</text>
<path d="M566 158H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 158H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#intercept-marker-slate)"/>
<rect x="610" y="122" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="151.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">route by path or host; no change to either system,</text><text x="630" y="176.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">slices limited by the URL structure</text>
<circle cx="60" cy="242" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="249" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="206" width="470" height="72" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="248" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A routing layer in the application</text>
<path d="M566 242H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 242H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#intercept-marker-slate)"/>
<rect x="610" y="206" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="235.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">smaller slices, and it requires</text><text x="630" y="260.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the old system to be changeable</text>
<circle cx="60" cy="326" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="333" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="290" width="470" height="72" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">An interface inside the code</text>
<path d="M566 326H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 326H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#intercept-marker-slate)"/>
<rect x="610" y="290" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="319.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the finest available, and exactly what</text><text x="630" y="344.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">module boundaries give you</text>
<circle cx="60" cy="410" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="417" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="374" width="470" height="72" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="416" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Event interception</text>
<path d="M566 410H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 410H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#intercept-marker-slate)"/>
<rect x="610" y="374" width="590" height="72" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="403.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">both implementations consume the same events; suits</text><text x="630" y="428.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">asynchronous work with no request to route</text>
<rect x="40" y="482" width="1160" height="82" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="482" width="5" height="82" rx="2.5" fill="#AC8BE8"/><text x="64" y="515.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">This is the first design decision</text><text x="64" y="542.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">It determines how fine-grained the slices can be, which determines how long the whole migration takes.</text>
<rect x="40" y="594" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="594" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="631" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Most real migrations use more than one of these at the same time.</text>
<text x="66" y="718" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">You cannot route without somewhere to route from.</text>
</svg>