<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="764" viewBox="0 0 1240 764" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="scoping-title scoping-desc">
<title id="scoping-title">Scoping under ambiguity</title>
<desc id="scoping-desc">Strong scoping narrows the problem out loud and checks it, asks for the numbers that change the design, and states what is out of scope. Weak scoping is usually not silence but thorough-sounding questions whose answers change nothing.</desc>
<defs>
<marker id="scoping-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="scoping-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="scoping-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="scoping-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="764" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Scoping under ambiguity</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The question is vague on purpose. The missing information is the test.</text>
<rect x="40" y="686" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="686" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Strong</text>
<rect x="40" y="168" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="202" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Narrow it out loud, then check</text>
<path d="M526 196H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 196H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scoping-marker-green)"/>
<rect x="570" y="168" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">"I will treat matching as the core. Does that work?"</text>
<rect x="40" y="236" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="270" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ask for numbers that move the design</text>
<path d="M526 264H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 264H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scoping-marker-green)"/>
<rect x="570" y="236" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="270" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not the ones that only add detail</text>
<rect x="40" y="304" width="480" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="338" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">State what is out of scope</text>
<path d="M526 332H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 332H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#scoping-marker-green)"/>
<rect x="570" y="304" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="338" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so it reads as a decision, not an omission</text>
<text x="40" y="404" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Weak</text>
<rect x="40" y="422" width="1160" height="118" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="422" width="5" height="118" rx="2.5" fill="#F28B9D"/><text x="64" y="458" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Not silence. Four thorough-sounding questions,</text><text x="64" y="487" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">then the design you had already decided on.</text><text x="64" y="516" font-size="18" font-weight="400" fill="#4A5568" text-anchor="start">Interviewers notice when the answers changed nothing.</text>
<rect x="40" y="560" width="1160" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="560" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="602.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">"How large is the largest file, because that decides whether this fits in the request path"</text><text x="64" y="629.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">is a different signal from "how large are the files."</text>
<text x="66" y="720" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Connect a question to a decision before you ask it, and you get a better answer as well as a better score.</text>
</svg>