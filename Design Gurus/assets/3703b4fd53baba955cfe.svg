<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A request passes the browser cache first, which is fastest but gives the least control. Then a CDN near users, where a purge takes time. Then the server-side cache, where entries can be deleted at once. Finally the database memory buffers, which are fully under your control.">
  <defs>
    <filter id="ssc4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ssc4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ssc4-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc4-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc4-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ssc4-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="ssc4-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The cache layers along one request</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">When a layer answers, the layers behind it do no work.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#ssc4-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#ssc4-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#ssc4-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ssc4-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ssc4-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Browser cache</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">fastest,</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">least control</text>
  <g filter="url(#ssc4-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#2563EB" clip-path="url(#ssc4-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">CDN</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">near users,</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">purges take time</text>
  <g filter="url(#ssc4-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#059669" clip-path="url(#ssc4-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Server cache</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">delete entries</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">at once</text>
  <g filter="url(#ssc4-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ssc4-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Database buffers</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">slowest to reach,</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">full control</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Near the user</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">saves the most time, but gives the least control</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Near the data</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">takes longer to reach, but is fully under your control</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Placement</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">static versioned files near the user, changing shared data on the server</text>
</svg>