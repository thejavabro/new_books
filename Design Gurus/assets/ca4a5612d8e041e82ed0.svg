<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five failure modes across the top, all pointing down into a single repair. The failures are consumer lag, where the durable count trails; a worker dying, so events replay; the cache dying, so hot counts are gone; counts drifting, so totals stop matching; and a lost region, whose rows have not been copied yet. All five point to one card: recount from UserLikes, run on a rolling schedule across all content and on demand for a single item.">
  <defs>
    <filter id="ytfail-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ytfail-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ytfail-k1"><rect x="55" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ytfail-k2"><rect x="285" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ytfail-k3"><rect x="515" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ytfail-k4"><rect x="745" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ytfail-k5"><rect x="975" y="165" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="ytfail-k6"><rect x="380" y="430" width="480" height="90" rx="12"/></clipPath>
    <marker id="ytfail-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="ytfail-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="ytfail-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Five ways this system fails, and the one thing that repairs it</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every count is a total derived from the per user rows, so every count can be recomputed.</text>

  <rect x="40" y="110" width="1160" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#BE185D">What breaks</text>
  <rect x="40" y="380" width="1160" height="220" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="410" font-size="19.5" font-weight="600" fill="#047857">What repairs all five</text>

  <g fill="none" stroke-width="2">
    <path d="M162.5 300 V 352 H 420 V 424" stroke="#D97706" marker-end="url(#ytfail-m-amber)"/>
    <path d="M392.5 300 V 332 H 530 V 424" stroke="#D97706" marker-end="url(#ytfail-m-amber)"/>
    <path d="M622.5 300 V 424" stroke="#DB2777" marker-end="url(#ytfail-m-pink)"/>
    <path d="M852.5 300 V 332 H 730 V 424" stroke="#DB2777" marker-end="url(#ytfail-m-pink)"/>
    <path d="M1082.5 300 V 352 H 840 V 424" stroke="#64748B" marker-end="url(#ytfail-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ytfail-soft)">
    <rect x="55" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="55" y="165" width="6" height="90" fill="#D97706" clip-path="url(#ytfail-k1)"/>
  </g>
  <circle cx="93" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(82.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="119" y="217" font-size="21.5" font-weight="600" fill="#111827">Consumer lag</text>
  <text x="162.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">the durable count trails</text>
  <g filter="url(#ytfail-soft)">
    <rect x="285" y="165" width="215" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="285" y="165" width="6" height="90" fill="#D97706" clip-path="url(#ytfail-k2)"/>
  </g>
  <circle cx="323" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(312.56,199.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="349" y="217" font-size="21.5" font-weight="600" fill="#111827">Worker dies</text>
  <text x="392.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">events replay</text>
  <g filter="url(#ytfail-soft)">
    <rect x="515" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="515" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#ytfail-k3)"/>
  </g>
  <circle cx="553" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(542.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="579" y="217" font-size="21.5" font-weight="600" fill="#111827">Cache dies</text>
  <text x="622.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">hot counts are gone</text>
  <g filter="url(#ytfail-soft)">
    <rect x="745" y="165" width="215" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="745" y="165" width="6" height="90" fill="#DB2777" clip-path="url(#ytfail-k4)"/>
  </g>
  <circle cx="783" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(772.56,199.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="809" y="217" font-size="21.5" font-weight="600" fill="#111827">Counts drift</text>
  <text x="852.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">totals stop matching</text>
  <g filter="url(#ytfail-soft)">
    <rect x="975" y="165" width="215" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="975" y="165" width="6" height="90" fill="#64748B" clip-path="url(#ytfail-k5)"/>
  </g>
  <circle cx="1013" cy="210" r="18" fill="#FFFFFF"/>
  <g transform="translate(1002.56,199.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="1039" y="217" font-size="21.5" font-weight="600" fill="#111827">Region lost</text>
  <text x="1082.5" y="284" font-size="18.5" text-anchor="middle" fill="#6B7280">rows not yet copied</text>
  <g filter="url(#ytfail-lift)">
    <rect x="380" y="430" width="480" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="380" y="430" width="9" height="90" fill="#059669" clip-path="url(#ytfail-k6)"/>
  </g>
  <circle cx="418" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(407.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="444" y="482" font-size="21.5" font-weight="600" fill="#111827">Recount from UserLikes</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">on a rolling schedule for everything,</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">and on demand for one item</text>

  <rect x="40" y="640" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="665" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="690" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Five failures</text>
  <text x="323" y="690" font-size="18.5" fill="#475569">Each one is expected, and each one has a stated response rather than a hope.</text>
  <rect x="64" y="715" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="740" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">One repair</text>
  <text x="323" y="740" font-size="18.5" fill="#475569">The per user rows make every count recomputable, which is why they are kept.</text>
  <rect x="64" y="765" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="790" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">What you watch</text>
  <text x="323" y="790" font-size="18.5" fill="#475569">Consumer lag, cache hit rate, drift, and the two p95 targets set in Step 2.</text>
</svg>