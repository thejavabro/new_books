<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="878" viewBox="0 0 1240 878" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="pipeline-title pipeline-desc">
<title id="pipeline-title">The shape that makes it provable</title>
<desc id="pipeline-desc">The event-sourced shape applied with discipline. Four properties do the work, and each is a decision with an alternative worth stating.</desc>
<defs>
<marker id="pipeline-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="pipeline-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="pipeline-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="pipeline-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="878" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The shape that makes it provable</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The event-sourced shape applied with discipline.</text>
<rect x="40" y="800" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="800" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="124" width="230" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="155" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">usage events</text>
<path d="M276 150H324" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M276 150H324" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="40" y="182" width="230" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="155" y="214" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">plan changes</text>
<path d="M276 208H324" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M276 208H324" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="40" y="240" width="230" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="155" y="272" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">credits</text>
<path d="M276 266H324" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M276 266H324" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="330" y="124" width="240" height="168" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="450" y="187" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">immutable</text><text x="450" y="214" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">event log</text><text x="450" y="241" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">(append only)</text>
<path d="M576 208H620" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M576 208H620" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="626" y="153" width="230" height="110" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="741" y="200.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">rating</text><text x="741" y="227.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">(a pure function)</text>
<path d="M862 208H906" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M862 208H906" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="912" y="153" width="288" height="110" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1056" y="200.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">invoice draft</text><text x="1056" y="227.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">then review</text>
<path d="M1056 269V306" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1056 269V306" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="912" y="312" width="288" height="58" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1056" y="347" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">charge</text>
<path d="M906 341H862" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M906 341H862" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#pipeline-marker-slate)"/>
<rect x="626" y="312" width="230" height="58" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="741" y="347" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">charge ledger</text>
<text x="741" y="396" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">what the provider confirmed</text>
<text x="40" y="438" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four decisions, each with an alternative</text>
<rect x="40" y="456" width="570" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="456" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="488" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">An append-only input log, in original form</text><text x="64" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the alternative computes against current state, which</text><text x="64" y="540" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is why nothing in the old system can be explained</text>
<rect x="630" y="456" width="570" height="104" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="630" y="456" width="5" height="104" rx="2.5" fill="#F3CF6A"/><text x="654" y="488" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Rating as a pure function</text><text x="654" y="514" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a job that reads and writes as it goes cannot be</text><text x="654" y="540" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">tested and cannot be rerun</text>
<rect x="40" y="574" width="570" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="64" y="606" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Idempotency keyed by invoice identity</text><text x="64" y="632" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not generated per attempt, so a retried charge is the</text><text x="64" y="658" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">same charge. This is what prevents the double charge</text>
<rect x="630" y="574" width="570" height="104" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="630" y="574" width="5" height="104" rx="2.5" fill="#5EC9EC"/><text x="654" y="606" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">A separate ledger of what was charged</text><text x="654" y="632" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one record with a status field loses the history of</text><text x="654" y="658" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">attempts and hides a partial failure</text>
<rect x="40" y="698" width="1160" height="76" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="698" width="5" height="76" rx="2.5" fill="#AC8BE8"/><text x="64" y="728.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">Do not make the charge path asynchronous. A queue adds a window</text><text x="64" y="755.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="start">in which the system does not know what it did</text>
<text x="66" y="834" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The invoice says what should be charged. The ledger records what was.</text>
</svg>