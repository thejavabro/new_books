<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="850" viewBox="0 0 1240 850" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six named failures of POST /tweets, each with its status, its stable machine-readable code, the condition that produces it, and what the caller should do next.">
  <defs>
    <filter id="xl12sixfail-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="xl12sixfail-k1"><rect x="150" y="100" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl12sixfail-k2"><rect x="710" y="100" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl12sixfail-k3"><rect x="150" y="280" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl12sixfail-k4"><rect x="710" y="280" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl12sixfail-k5"><rect x="150" y="460" width="380" height="90" rx="12"/></clipPath>
    <clipPath id="xl12sixfail-k6"><rect x="710" y="460" width="380" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="850" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="588" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Six named failures for one operation</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">under each card: the condition in gray, then what the caller does next in green</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="150" y="100" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="150" y="100" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k1)"/>
  </g>
  <circle cx="188" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,134.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="214" y="152" font-size="18.5" font-weight="600" fill="#111827">400 invalid_request</text>
  <text x="340" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">Empty text, over 280 characters, or an unknown field</text>
  <text x="340" y="238" font-size="15.5" text-anchor="middle" fill="#047857">Change it. Never retry unchanged.</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="710" y="100" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="710" y="100" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k2)"/>
  </g>
  <circle cx="748" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,134.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="774" y="152" font-size="18.5" font-weight="600" fill="#111827">401 authentication_required</text>
  <text x="900" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">The access token is missing, expired, or invalid</text>
  <text x="900" y="238" font-size="15.5" text-anchor="middle" fill="#047857">Obtain or refresh a credential.</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="150" y="280" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="150" y="280" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k3)"/>
  </g>
  <circle cx="188" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="214" y="332" font-size="18.5" font-weight="600" fill="#111827">403 tweet_create_forbidden</text>
  <text x="340" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">The credential lacks the tweets:create scope</text>
  <text x="340" y="418" font-size="15.5" text-anchor="middle" fill="#047857">Get the scope. Waiting will not help.</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="710" y="280" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="710" y="280" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k4)"/>
  </g>
  <circle cx="748" cy="325" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,314.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="774" y="332" font-size="18.5" font-weight="600" fill="#111827">404 reply_target_not_found</text>
  <text x="900" y="395" font-size="15.5" text-anchor="middle" fill="#6B7280">reply_to_tweet_id names a tweet that is missing or hidden</text>
  <text x="900" y="418" font-size="15.5" text-anchor="middle" fill="#047857">Correct the target, or stop.</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="150" y="460" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="150" y="460" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k5)"/>
  </g>
  <circle cx="188" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,494.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="214" y="512" font-size="18.5" font-weight="600" fill="#111827">409 replies_closed</text>
  <text x="340" y="575" font-size="15.5" text-anchor="middle" fill="#6B7280">The id is valid, but that tweet is not accepting replies</text>
  <text x="340" y="598" font-size="15.5" text-anchor="middle" fill="#047857">The state must change first.</text>

  
  <g filter="url(#xl12sixfail-soft)">
    <rect x="710" y="460" width="380" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="710" y="460" width="6" height="90" fill="#DB2777" clip-path="url(#xl12sixfail-k6)"/>
  </g>
  <circle cx="748" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(737.56,494.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="774" y="512" font-size="18.5" font-weight="600" fill="#111827">429 rate_limit_exceeded</text>
  <text x="900" y="575" font-size="15.5" text-anchor="middle" fill="#6B7280">The published tweet-creation limit was reached</text>
  <text x="900" y="598" font-size="15.5" text-anchor="middle" fill="#047857">Wait for Retry-After, plus a delay.</text>

  
  <rect x="40" y="652" width="1160" height="62" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="620" y="690" text-anchor="middle" font-size="16" font-weight="600" fill="#1D4ED8">A 24-hour idempotency key covers the seventh case: the response was lost and the outcome is unknown.</text>

  
  <rect x="40" y="734" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="779" text-anchor="middle" font-size="16" fill="#475569">A failure the caller cannot act on is an unfinished contract.</text>
</svg>