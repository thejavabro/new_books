<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="856" viewBox="0 0 1240 856" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The closure loop traced on three starting sets, one step per row, showing which rule fires and what the set becomes">
<rect x="0" y="0" width="1240" height="856" fill="#FFFFFF"/>

<rect x="40" y="40" width="1160" height="120" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">The four rules of Enrollment</text>
<g font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="14.5" fill="#111827">
<text x="64" y="102">1.  Student_ID -&gt; Student_Name</text>
<text x="420" y="102">2.  Course_ID -&gt; Instructor</text>
<text x="770" y="102">3.  Instructor -&gt; Dept</text>
<text x="64" y="130">4.  {Student_ID, Course_ID} -&gt; Grade</text>
<text x="420" y="130" fill="#6B7280">six attributes in total</text>
</g>

<rect x="40" y="186" width="1160" height="188" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="64" y="216" font-size="16.5" font-weight="600" fill="#1D4ED8">Closure of {Student_ID}</text>
<g stroke="#93C5FD" stroke-width="1.2">
<rect x="64" y="234" width="300" height="36" fill="#DBEAFE"/><rect x="364" y="234" width="772" height="36" fill="#DBEAFE"/>
<rect x="64" y="270" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="270" width="772" height="34" fill="#FFFFFF"/>
<rect x="64" y="304" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="304" width="772" height="34" fill="#FFFFFF"/>
</g>
<g font-size="14.5" font-weight="600" fill="#1D4ED8">
<text x="80" y="258">step</text>
<text x="380" y="258">the set after that step</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="80" y="292">start</text>
<text x="380" y="292" font-family="Consolas, &#39;Courier New&#39;, monospace">{Student_ID}</text>
<text x="80" y="326">rule 1 fires</text>
<text x="380" y="326" font-family="Consolas, &#39;Courier New&#39;, monospace">{Student_ID, Student_Name}</text>
</g>
<text x="64" y="362" font-size="15" fill="#6B7280">Rule 4 cannot fire: only half of its left side is present. Nothing else applies, so this is the closure.</text>

<rect x="40" y="400" width="1160" height="222" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
<text x="64" y="430" font-size="16.5" font-weight="600" fill="#5B21B6">Closure of {Course_ID}</text>
<g stroke="#C4B5FD" stroke-width="1.2">
<rect x="64" y="448" width="300" height="36" fill="#EDE9FE"/><rect x="364" y="448" width="772" height="36" fill="#EDE9FE"/>
<rect x="64" y="484" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="484" width="772" height="34" fill="#FFFFFF"/>
<rect x="64" y="518" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="518" width="772" height="34" fill="#FFFFFF"/>
<rect x="64" y="552" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="552" width="772" height="34" fill="#FFFFFF"/>
</g>
<g font-size="14.5" font-weight="600" fill="#5B21B6">
<text x="80" y="472">step</text>
<text x="380" y="472">the set after that step</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="80" y="506">start</text>
<text x="380" y="506" font-family="Consolas, &#39;Courier New&#39;, monospace">{Course_ID}</text>
<text x="80" y="540">rule 2 fires</text>
<text x="380" y="540" font-family="Consolas, &#39;Courier New&#39;, monospace">{Course_ID, Instructor}</text>
<text x="80" y="574">rule 3 fires</text>
<text x="380" y="574" font-family="Consolas, &#39;Courier New&#39;, monospace">{Course_ID, Instructor, Dept}</text>
</g>
<text x="64" y="610" font-size="15" fill="#6B7280">Rule 3 only became usable once rule 2 had added Instructor. That is why the loop repeats.</text>

<rect x="40" y="648" width="1160" height="132" rx="14" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
<text x="64" y="678" font-size="16.5" font-weight="600" fill="#047857">Closure of {Student_ID, Course_ID}</text>
<g stroke="#6EE7B7" stroke-width="1.2">
<rect x="64" y="696" width="300" height="34" fill="#D1FAE5"/><rect x="364" y="696" width="772" height="34" fill="#D1FAE5"/>
<rect x="64" y="730" width="300" height="34" fill="#FFFFFF"/><rect x="364" y="730" width="772" height="34" fill="#FFFFFF"/>
</g>
<g font-size="14.5" font-weight="600" fill="#047857">
<text x="80" y="719">rules 1, 2, 3 and 4 all fire</text>
<text x="380" y="719">the set after that step</text>
</g>
<g font-size="14.5" fill="#111827">
<text x="80" y="753">all six attributes</text>
<text x="380" y="753" font-family="Consolas, &#39;Courier New&#39;, monospace">{Student_ID, Course_ID, Student_Name, Grade, Instructor, Dept}</text>
</g>

<rect x="40" y="808" width="1160" height="0" fill="none"/>
<text x="64" y="812" font-size="16" fill="#475569">The closure holds every attribute, so this set is a superkey. Neither half was, so it is also a candidate key.</text>
</svg>