<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="database-title database-desc">
<title id="database-title">The database is where this fails</title>
<desc id="database-desc">Each module owns a set of tables and no other module touches them directly. Separate schemas with separate database users turn that convention into a constraint the database itself enforces.</desc>
<defs>
<marker id="database-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="database-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="database-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="database-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="748" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The database is where this fails</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each module owns a set of tables, and no other module reads or writes them directly.</text>
<rect x="40" y="670" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="670" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="226" rx="14" fill="#F4F7FA" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V338A6 6 0 0 0 46 344H54Z" fill="#F28B9D"/><text x="70" y="154" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">One schema, everything reachable</text>
<path d="M72 170H568V242H72Z" fill="none" stroke="#CE475C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 7"/>
<rect x="84" y="182" width="148" height="48" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="158" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">orders</text>
<rect x="246" y="182" width="148" height="48" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">billing</text>
<rect x="408" y="182" width="148" height="48" rx="7" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="482" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">catalog</text>
<text x="320" y="278" font-size="19" font-weight="700" fill="#A83147" text-anchor="middle">one schema, one user: anything joins anything</text>
<text x="320" y="308" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">a join is faster to write than a call</text>
<rect x="640" y="118" width="560" height="226" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V338A6 6 0 0 0 646 344H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">A schema and a user per module</text>
<path d="M672 170H828V242H672Z" fill="none" stroke="#169B77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="682" y="182" width="136" height="48" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="750" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">orders</text>
<path d="M842 170H998V242H842Z" fill="none" stroke="#169B77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="852" y="182" width="136" height="48" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">billing</text>
<path d="M1012 170H1168V242H1012Z" fill="none" stroke="#169B77" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="1022" y="182" width="136" height="48" rx="7" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1090" y="213" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">catalog</text>
<text x="920" y="265" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">a schema and a user each:</text>
<text x="920" y="293" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">the database refuses the join</text>
<text x="920" y="321" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">grants only on its own tables</text>
<rect x="40" y="362" width="1160" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="393" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Very little to set up at the start, and painful to add later, which argues for day one</text>
<text x="40" y="446" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">And be honest about what it costs</text>
<rect x="40" y="464" width="372" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="226" y="503" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you lose cross-module joins</text>
<rect x="434" y="464" width="372" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="489.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you lose cross-module</text><text x="620" y="516.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">foreign keys</text>
<rect x="828" y="464" width="372" height="66" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="1014" y="489.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">you get the consistency</text><text x="1014" y="516.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">problem early</text>
<rect x="40" y="552" width="1160" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="552" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="64" y="580" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">So be selective.</text><text x="64" y="606" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Hard boundaries where ownership is clear and the data separates.</text><text x="64" y="632" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Soft where it is tangled together, and revisit when the separation becomes obvious.</text>
<text x="66" y="704" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Modular monoliths fail at the database almost without exception, and for an understandable reason.</text>
</svg>