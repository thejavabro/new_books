<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="450" viewBox="0 0 1240 450" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="While the circuit is open the gateway stops calling the failing service and answers with a fallback, then tries again after a delay">
  <rect x="0" y="0" width="1240" height="450" fill="#FFFFFF"/>
  <defs>
    <marker id="ag5-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ag5-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <filter id="ag5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="30" width="1200" height="170" rx="14" fill="#FEF2F2" fill-opacity="0.4" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="52" y="68" font-size="20" font-weight="700" fill="#991B1B">Circuit closed: the service starts failing</text>

  <line x1="286" y1="132" x2="404" y2="132" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag5-red)"/>
  <line x1="676" y1="132" x2="794" y2="132" stroke="#DC2626" stroke-width="2.5" marker-end="url(#ag5-red)"/>

  <g filter="url(#ag5-soft)">
    <rect x="60" y="98" width="226" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="410" y="98" width="266" height="70" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="800" y="98" width="300" height="70" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="173" y="140" font-size="20" fill="#0F172A" text-anchor="middle">Client request</text>
  <text x="543" y="140" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Gateway</text>
  <text x="950" y="140" font-size="20" font-weight="600" fill="#991B1B" text-anchor="middle">Order service: failing</text>

  <rect x="20" y="230" width="1200" height="190" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="52" y="268" font-size="20" font-weight="700" fill="#92400E">Circuit open: the gateway stops calling it</text>

  <line x1="286" y1="322" x2="404" y2="322" stroke="#D97706" stroke-width="2.5" marker-end="url(#ag5-amber)"/>
  <line x1="404" y1="360" x2="286" y2="360" stroke="#D97706" stroke-width="2.5" marker-end="url(#ag5-amber)"/>
  <line x1="690" y1="316" x2="790" y2="376" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>
  <line x1="790" y1="316" x2="690" y2="376" stroke="#DC2626" stroke-width="4" stroke-linecap="round"/>

  <g filter="url(#ag5-soft)">
    <rect x="60" y="306" width="226" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="410" y="298" width="266" height="86" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="800" y="306" width="300" height="70" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>
  </g>
  <text x="173" y="348" font-size="20" fill="#0F172A" text-anchor="middle">Client request</text>
  <text x="543" y="332" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Gateway</text>
  <text x="543" y="362" font-size="20" fill="#B45309" text-anchor="middle">returns a fallback</text>
  <text x="950" y="348" font-size="20" fill="#64748B" text-anchor="middle">left alone to recover</text>
</svg>