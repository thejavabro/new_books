<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A secondary index lookup on a clustered table costs two B-tree walks: one in the secondary index to get the clustered key, and one in the clustered index to get the row">
  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>
  <defs>
    <marker id="ix19-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix19-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="ix19-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="36" width="620" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="330" y="72" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">WHERE LastName = 'Okafor'</text>

  
  <rect x="20" y="124" width="580" height="380" rx="14" fill="#EFF6FF" fill-opacity="0.35" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="160" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Walk 1: the LastName index</text>

  <rect x="640" y="124" width="580" height="380" rx="14" fill="#F5F3FF" fill-opacity="0.35" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="160" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Walk 2: the clustered index</text>

  
  <path d="M310,240 L310,290" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix19-blue)"/>
  <path d="M310,364 L310,414" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix19-blue)"/>

  
  <g filter="url(#ix19-soft)">
    <rect x="190" y="180" width="240" height="60" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="190" y="292" width="240" height="72" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="130" y="416" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="310" y="217" font-size="20" fill="#0F172A" text-anchor="middle">root</text>
  <text x="310" y="322" font-size="20" fill="#0F172A" text-anchor="middle">internal page</text>
  <text x="310" y="348" font-size="20" fill="#64748B" text-anchor="middle">signposts by last name</text>
  <text x="310" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">leaf: Okafor</text>
  <text x="310" y="473" font-size="20" font-weight="600" fill="#1D4ED8" text-anchor="middle">EmployeeID 4271903</text>

  
  <path d="M930,240 L930,290" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ix19-violet)"/>
  <path d="M930,364 L930,414" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ix19-violet)"/>

  
  <g filter="url(#ix19-soft)">
    <rect x="810" y="180" width="240" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="810" y="292" width="240" height="72" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="750" y="416" width="360" height="72" rx="10" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="930" y="217" font-size="20" fill="#0F172A" text-anchor="middle">root</text>
  <text x="930" y="322" font-size="20" fill="#0F172A" text-anchor="middle">internal page</text>
  <text x="930" y="348" font-size="20" fill="#64748B" text-anchor="middle">signposts by employee id</text>
  <text x="930" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">leaf: the whole row</text>
  <text x="930" y="473" font-size="20" fill="#64748B" text-anchor="middle">Okafor, Lima, paused</text>

  
  <path d="M494,452 L634,452" fill="none" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#ix19-violet)"/>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="564" y="428" font-size="20" fill="#5B21B6" text-anchor="middle">use the key</text>
  </g>

  <text x="620" y="546" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">The secondary index stores the clustered key, not a disk address, so the pointer survives a moved row.</text>

  <rect x="120" y="576" width="1000" height="86" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="611" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Every matching row pays for walk 2. SQL Server calls it a bookmark lookup.</text>
  <text x="620" y="641" font-size="20" fill="#334155" text-anchor="middle">Match 100,000 rows and the planner will decide a full scan was cheaper, and skip your index.</text>
</svg>