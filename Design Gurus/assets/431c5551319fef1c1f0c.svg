<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="places-title places-desc">
<title id="places-title">The four places it actually breaks</title>
<desc id="places-desc">Across most designs the answer comes from a short list, and recognizing which one applies is most of the skill.</desc>
<defs>
<marker id="places-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="places-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="places-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="places-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="780" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The four places it actually breaks</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Across most designs, the answer comes from a short list.</text>
<rect x="40" y="702" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="702" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="810" y="112" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">the answer</text>
<rect x="40" y="128" width="280" height="78" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="180" y="173" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The write path</text>
<rect x="330" y="128" width="430" height="78" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="350" y="160.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reads scale with replicas and caches.</text><text x="350" y="185.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">Writes go to one primary with a ceiling</text>
<path d="M766 167H800" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M766 167H800" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#places-marker-green)"/>
<rect x="810" y="128" width="390" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1005" y="173" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">partition, and name the key</text>
<rect x="40" y="216" width="280" height="78" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="180" y="261" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The fan-out</text>
<rect x="330" y="216" width="430" height="78" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="350" y="236" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one event producing work per</text><text x="350" y="261" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recipient. Ten times the users is often</text><text x="350" y="286" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a hundred times the work</text>
<path d="M766 255H800" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M766 255H800" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#places-marker-green)"/>
<rect x="810" y="216" width="390" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1005" y="247.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">read-time against write-time,</text><text x="1005" y="274.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">with a hybrid for outliers</text>
<rect x="40" y="304" width="280" height="78" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="180" y="349" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The hot key</text>
<rect x="330" y="304" width="430" height="78" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="350" y="324" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">ten times the traffic makes it ten</text><text x="350" y="349" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">times hotter, and the partition is</text><text x="350" y="374" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">still one partition</text>
<path d="M766 343H800" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M766 343H800" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#places-marker-green)"/>
<rect x="810" y="304" width="390" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1005" y="335.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">split the key; noticing beats</text><text x="1005" y="362.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the technique</text>
<rect x="40" y="392" width="280" height="78" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="180" y="423.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The fast synchronous</text><text x="180" y="450.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">call</text>
<rect x="330" y="392" width="430" height="78" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="350" y="424.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a 5 ms call that becomes 200 ms under</text><text x="350" y="449.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">contention, inside a 300 ms budget</text>
<path d="M766 431H800" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M766 431H800" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#places-marker-green)"/>
<rect x="810" y="392" width="390" height="78" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1005" y="423.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">remove it from the path, not</text><text x="1005" y="450.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">make it faster</text>
<rect x="40" y="490" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="490" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="527" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Each has the same shape: something that was fine because it was small.</text>
<rect x="40" y="572" width="1160" height="104" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="104" rx="2.5" fill="#39D5AA"/><text x="64" y="604" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">And the design assumed it would stay small</text><text x="64" y="630" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">"I would shard" is incomplete. "I would shard by customer, because activity</text><text x="64" y="656" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">clusters there and it keeps a customer's data co-located" is the answer.</text>
<text x="66" y="736" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">For the write path, the answer behind the answer is the partition key.</text>
</svg>