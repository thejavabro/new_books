<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="746" viewBox="0 0 1240 746" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="cancel-title cancel-desc">
<title id="cancel-title">The first move is to cancel</title>
<desc id="cancel-desc">Egress, the database and object storage are identical in both designs, so they cancel. Pricing both full bills is twice the work and hides the answer.</desc>
<defs>
<marker id="cancel-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="cancel-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="cancel-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="cancel-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="746" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The first move is to cancel</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Egress, the database and object storage are identical in both designs.</text>
<rect x="40" y="668" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="668" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three lines are identical in both designs</text>
<rect x="40" y="166" width="400" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Egress to the internet</text>
<path d="M446 194H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 194H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cancel-marker-slate)"/>
<rect x="490" y="166" width="420" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="200" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">300M x 8 KB = 2,400 GB</text>
<rect x="930" y="166" width="270" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1065" y="187" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">$216</text><text x="1065" y="213" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">cancels</text>
<rect x="40" y="232" width="400" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The database</text>
<path d="M446 260H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 260H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cancel-marker-slate)"/>
<rect x="490" y="232" width="420" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="266" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">same engine, same two reads</text>
<rect x="930" y="232" width="270" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1065" y="253" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">same</text><text x="1065" y="279" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">cancels</text>
<rect x="40" y="298" width="400" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="240" y="332" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Object storage</text>
<path d="M446 326H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 326H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#cancel-marker-slate)"/>
<rect x="490" y="298" width="420" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="332" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">same objects, same requests</text>
<rect x="930" y="298" width="270" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1065" y="319" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">same</text><text x="1065" y="345" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">cancels</text>
<rect x="40" y="374" width="1160" height="70" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="374" width="5" height="70" rx="2.5" fill="#39D5AA"/><text x="64" y="402" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Compute the differences, not the totals</text><text x="64" y="428" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A line that appears identically in both columns cannot change the decision, however large it is.</text>
<rect x="40" y="460" width="1160" height="108" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="108" rx="2.5" fill="#F28B9D"/><text x="64" y="494" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Egress is the line the lessons told you to watch, and here it is irrelevant</text><text x="64" y="520" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">$216 is three quarters of the whole difference between these designs,</text><text x="64" y="546" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and analyzing it produces a number that cannot move the answer.</text>
<rect x="40" y="584" width="1160" height="58" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="620" y="619" font-size="22" font-weight="700" fill="#080C50" text-anchor="middle">What remains: how compute is bought, and what sits in front of it</text>
<text x="66" y="702" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Only the lines that differ between the designs are decision-relevant.</text>
</svg>