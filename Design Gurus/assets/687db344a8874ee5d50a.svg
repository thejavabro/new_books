<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Independent scaling: image processing needs 40 servers and the rest needs 4. A monolith runs 40 full copies of everything and pays for idle code, while splitting out the image service means paying only for what each part needs.">
  <defs>
    <marker id="m01-l04-independent-scaling-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m01-l04-independent-scaling-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m01-l04-independent-scaling-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m01-l04-independent-scaling-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2.5">
    <path d="M490,150 C490,192 300,188 300,230" stroke="#475569" marker-end="url(#m01-l04-independent-scaling-sl)"/>
    <path d="M750,150 C750,192 940,188 940,230" stroke="#475569" marker-end="url(#m01-l04-independent-scaling-sl)"/>
    <path d="M300,330 L300,400" stroke="#DC2626" stroke-width="3" marker-end="url(#m01-l04-independent-scaling-rd)"/>
    <path d="M940,330 L940,400" stroke="#059669" stroke-width="3" marker-end="url(#m01-l04-independent-scaling-em)"/>
  </g>

  
  <g font-size="20" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="140" y="185" fill="#475569">the whole app is</text>
    <text x="140" y="213" fill="#475569">one deployment unit</text>
    <text x="1100" y="185" fill="#475569">image processing</text>
    <text x="1100" y="213" fill="#475569">scales by itself</text>
  </g>

  
  <g filter="url(#m01-l04-independent-scaling-soft)">
    <rect x="320" y="50" width="600" height="100" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="620" y="94" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Image processing needs 40 servers, the rest needs 4</text>
  <text x="620" y="126" text-anchor="middle" font-size="20" fill="#64748B">one part of the workload dwarfs the rest</text>

  
  <g filter="url(#m01-l04-independent-scaling-soft)">
    <rect x="90" y="230" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="300" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Monolith: run 40 full</text>
  <text x="300" y="304" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">copies of everything</text>

  
  <g filter="url(#m01-l04-independent-scaling-soft)">
    <rect x="730" y="230" width="420" height="100" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="940" y="274" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split: image service on</text>
  <text x="940" y="304" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">40 servers, the rest on 4</text>

  
  <g filter="url(#m01-l04-independent-scaling-soft)">
    <rect x="90" y="400" width="420" height="100" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="300" y="444" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">You pay for 40 copies of</text>
  <text x="300" y="474" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">code that sits mostly idle</text>

  
  <g filter="url(#m01-l04-independent-scaling-soft)">
    <rect x="730" y="400" width="420" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="940" y="444" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">You pay only for what</text>
  <text x="940" y="474" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">each part needs</text>

  
  <g stroke-width="4">
    <line x1="40" y1="555" x2="74" y2="555" stroke="#475569"/>
    <line x1="560" y1="555" x2="594" y2="555" stroke="#DC2626"/>
    <line x1="40" y1="595" x2="74" y2="595" stroke="#059669"/>
  </g>
  <text x="84" y="562" font-size="20" fill="#475569">Same workload, two ways to provision it</text>
  <text x="604" y="562" font-size="20" fill="#475569">Outcome: pay for idle copies</text>
  <text x="84" y="602" font-size="20" fill="#475569">Outcome: pay only for real load</text>
</svg>