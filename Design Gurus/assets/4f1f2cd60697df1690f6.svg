<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="916" viewBox="0 0 1240 916" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One question settles most path-versus-query debates: does this value identify the resource, or does it modify which representation of it the caller wants? Identity goes in the path, shown by a member id, a parent-scoped collection, and a create under its parent. Filters, sorting, and page size with a cursor go in the query string. A final warning card adds that a required value is still not a path parameter, because /orders/status/confirmed makes a filter value look like an identity.">
  <defs>
    <filter id="xl04pathorq-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl04pathorq-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl04pathorq-k1"><rect x="180" y="94" width="880" height="90" rx="12"/></clipPath>
    <clipPath id="xl04pathorq-k2"><rect x="84" y="310" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k3"><rect x="84" y="410" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k4"><rect x="84" y="510" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k5"><rect x="684" y="310" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k6"><rect x="684" y="410" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k7"><rect x="684" y="510" width="472" height="48" rx="10"/></clipPath>
    <clipPath id="xl04pathorq-k8"><rect x="270" y="636" width="700" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="916" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="196" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="76" font-size="16.5" font-weight="600" fill="#1D4ED8">One question settles the path-or-query debate</text>

  <g filter="url(#xl04pathorq-lift)">
    <rect x="180" y="94" width="880" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="180" y="94" width="9" height="90" fill="#2563EB" clip-path="url(#xl04pathorq-k1)"/>
  </g>
  <circle cx="218" cy="139" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,128.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="244" y="146" font-size="18.5" font-weight="600" fill="#111827">Does this value identify the resource, or modify which representation I want?</text>
  <text x="620" y="209" font-size="15.5" text-anchor="middle" fill="#6B7280">Identity goes in the path. Filters, sorting, page size, cursor, and search text go in the query string.</text>

  
  <rect x="40" y="256" width="556" height="348" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="286" font-size="16.5" font-weight="600" fill="#047857">It identifies: put it in the path</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="84" y="310" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="310" width="6" height="48" fill="#059669" clip-path="url(#xl04pathorq-k2)"/>
  </g>
  <circle cx="118" cy="334" r="4.5" fill="#059669"/>
  <text x="142" y="341" font-size="18.5" font-weight="600" fill="#111827">GET /orders/ord_7M2K</text>
  <text x="142" y="380" font-size="15.5" fill="#6B7280">the id names one member</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="84" y="410" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="410" width="6" height="48" fill="#059669" clip-path="url(#xl04pathorq-k3)"/>
  </g>
  <circle cx="118" cy="434" r="4.5" fill="#059669"/>
  <text x="142" y="441" font-size="18.5" font-weight="600" fill="#111827">GET /projects/prj_81M/tasks</text>
  <text x="142" y="480" font-size="15.5" fill="#6B7280">the parent scopes the collection</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="84" y="510" width="472" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="84" y="510" width="6" height="48" fill="#059669" clip-path="url(#xl04pathorq-k4)"/>
  </g>
  <circle cx="118" cy="534" r="4.5" fill="#059669"/>
  <text x="142" y="541" font-size="18.5" font-weight="600" fill="#111827">POST /orders/ord_7M2K/refunds</text>
  <text x="142" y="580" font-size="15.5" fill="#6B7280">the parent owns the new child</text>

  
  <rect x="644" y="256" width="556" height="348" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="668" y="286" font-size="16.5" font-weight="600" fill="#B45309">It modifies: put it in the query string</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="684" y="310" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="310" width="6" height="48" fill="#D97706" clip-path="url(#xl04pathorq-k5)"/>
  </g>
  <circle cx="718" cy="334" r="4.5" fill="#D97706"/>
  <text x="742" y="341" font-size="18.5" font-weight="600" fill="#111827">?status=confirmed</text>
  <text x="742" y="380" font-size="15.5" fill="#6B7280">a filter removes non-matching members</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="684" y="410" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="410" width="6" height="48" fill="#D97706" clip-path="url(#xl04pathorq-k6)"/>
  </g>
  <circle cx="718" cy="434" r="4.5" fill="#D97706"/>
  <text x="742" y="441" font-size="18.5" font-weight="600" fill="#111827">?sort=-created_at</text>
  <text x="742" y="480" font-size="15.5" fill="#6B7280">the same collection in another order</text>

  <g filter="url(#xl04pathorq-soft)">
    <rect x="684" y="510" width="472" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="684" y="510" width="6" height="48" fill="#D97706" clip-path="url(#xl04pathorq-k7)"/>
  </g>
  <circle cx="718" cy="534" r="4.5" fill="#D97706"/>
  <text x="742" y="541" font-size="18.5" font-weight="600" fill="#111827">?limit=20&amp;cursor=eyJhZnRlciI6...</text>
  <text x="742" y="580" font-size="15.5" fill="#6B7280">moving through the same collection</text>

  
  <g filter="url(#xl04pathorq-lift)">
    <rect x="270" y="636" width="700" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="270" y="636" width="9" height="90" fill="#DB2777" clip-path="url(#xl04pathorq-k8)"/>
  </g>
  <circle cx="308" cy="681" r="18" fill="#FFFFFF"/>
  <g transform="translate(297.56,670.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="334" y="688" font-size="18.5" font-weight="600" fill="#111827">Required does not mean path</text>
  <text x="620" y="751" font-size="15.5" text-anchor="middle" fill="#6B7280">/orders/status/confirmed makes a filter value look like an identity.</text>
  <text x="620" y="774" font-size="15.5" text-anchor="middle" fill="#94A3B8">Whether a value is required and whether it identifies a resource are two separate questions.</text>

  
  <rect x="40" y="800" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="845" text-anchor="middle" font-size="16" fill="#475569">A caller who has seen two URLs should be able to write the third without opening the documentation.</text>
</svg>