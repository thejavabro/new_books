<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="590" viewBox="0 0 1240 590" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Entity split chains five synchronous service calls to place one order, while a capability split completes the order inside Checkout and notifies Fulfillment with one async event">
  <defs>
    <marker id="m02-l02-entity-split-chain-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m02-l02-entity-split-chain-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m02-l02-entity-split-chain-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="590" fill="#FFFFFF"/>

  
  <rect x="20" y="50" width="1200" height="200" rx="14" fill="#FEF2F2" fill-opacity="0.5" stroke="#F87171" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="88" font-size="20" font-weight="600" fill="#B91C1C">Entity split: five services per order</text>
  <text x="1200" y="88" text-anchor="end" font-size="20" fill="#B91C1C">every call is a new failure point</text>

  <g fill="none" stroke="#3B82F6" stroke-width="2.5">
    <path d="M230,170 L280,170" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
    <path d="M430,170 L480,170" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
    <path d="M630,170 L680,170" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
    <path d="M830,170 L880,170" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
    <path d="M1030,170 L1080,170" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
  </g>
  <g font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="255" y="235">call 1</text>
    <text x="455" y="235">call 2</text>
    <text x="655" y="235">call 3</text>
    <text x="855" y="235">call 4</text>
    <text x="1055" y="235">call 5</text>
  </g>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="30" y="130" width="200" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="130" y="177" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Place an order</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="280" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="355" y="163" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">User</text>
  <text x="355" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="480" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="555" y="163" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Product</text>
  <text x="555" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="680" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="755" y="163" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Inventory</text>
  <text x="755" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="880" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="955" y="163" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Payment</text>
  <text x="955" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="1080" y="130" width="150" height="80" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1155" y="163" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Order</text>
  <text x="1155" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">service</text>

  
  <rect x="20" y="290" width="1200" height="200" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="42" y="328" font-size="20" font-weight="600" fill="#065F46">Capability split: one service per order</text>
  <text x="1200" y="328" text-anchor="end" font-size="20" fill="#065F46">the order completes inside Checkout</text>

  <g fill="none">
    <path d="M230,415 L396,415" stroke="#3B82F6" stroke-width="3" marker-end="url(#m02-l02-entity-split-chain-bl)"/>
    <path d="M740,415 L906,415" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#m02-l02-entity-split-chain-ab)"/>
  </g>
  <text x="313" y="360" font-size="20" text-anchor="middle" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one synchronous call</text>
  <text x="823" y="400" font-size="20" text-anchor="middle" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">event</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="30" y="370" width="200" height="90" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="2"/>
  </g>
  <text x="130" y="422" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Place an order</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="400" y="370" width="340" height="90" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
  </g>
  <text x="570" y="408" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Checkout service</text>
  <text x="570" y="438" text-anchor="middle" font-size="20" fill="#64748B">carts, orders, price snapshots</text>

  <g filter="url(#m02-l02-entity-split-chain-soft)">
    <rect x="910" y="370" width="310" height="90" rx="10" fill="#FFFFFF" stroke="#475569" stroke-width="2"/>
  </g>
  <text x="1065" y="422" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Fulfillment service</text>

  
  <g stroke-width="4">
    <line x1="40" y1="545" x2="74" y2="545" stroke="#3B82F6"/>
    <line x1="640" y1="545" x2="674" y2="545" stroke="#D97706" stroke-dasharray="6 5"/>
  </g>
  <text x="84" y="552" font-size="20" fill="#475569">Synchronous call (caller waits)</text>
  <text x="684" y="552" font-size="20" fill="#475569">Async event: Checkout tells the rest</text>
</svg>