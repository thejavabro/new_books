<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="708" viewBox="0 0 1240 708" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="repmode-title repmode-desc">
<title id="repmode-title">Physical and logical replication</title>
<desc id="repmode-desc">Physical replication ships write-ahead log bytes and produces a block-level copy, which is fast and low in lag but cannot be selective or cross major versions. Logical replication ships decoded row changes, which is selective and version tolerant but does not carry schema changes and needs a primary key on every table.</desc>
<defs>
<marker id="repmode-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="repmode-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="repmode-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="repmode-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="708" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Physical and logical replication</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The split of work is stable.</text>
<rect x="40" y="630" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="630" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="378" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V490A6 6 0 0 0 46 496H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">Physical (streaming)</text>
<text x="70" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the replica is a block-level copy</text>
<rect x="72" y="200" width="170" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="157" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Primary</text>
<text x="321" y="212" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">WAL bytes</text>
<path d="M248 228H394" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M248 228H394" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#repmode-marker-slate)"/>
<rect x="398" y="200" width="170" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="483" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Replica</text>
<rect x="72" y="272" width="496" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="88" y="302" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Scope</text><text x="552" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">whole cluster only</text>
<rect x="72" y="324" width="496" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="88" y="354" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Across major versions</text><text x="552" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">no</text>
<rect x="72" y="376" width="496" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="88" y="406" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Schema changes</text><text x="552" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">replicate automatically</text>
<rect x="72" y="428" width="496" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="88" y="458" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Lag</text><text x="552" y="458" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">lowest</text>
<rect x="640" y="118" width="560" height="378" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V490A6 6 0 0 0 646 496H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Logical (decoding)</text>
<text x="670" y="180" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the replica is rebuilt from row changes</text>
<rect x="672" y="200" width="170" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="757" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Primary</text>
<text x="921" y="212" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">row changes</text>
<path d="M848 228H994" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M848 228H994" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#repmode-marker-slate)"/>
<rect x="998" y="200" width="170" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1083" y="234" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Replica</text>
<rect x="672" y="272" width="496" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="688" y="302" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Scope</text><text x="1152" y="302" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">choose your tables</text>
<rect x="672" y="324" width="496" height="46" rx="9" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="688" y="354" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Across major versions</text><text x="1152" y="354" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">yes</text>
<rect x="672" y="376" width="496" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="688" y="406" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Schema changes</text><text x="1152" y="406" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">you apply both sides</text>
<rect x="672" y="428" width="496" height="46" rx="9" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="688" y="458" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Requires</text><text x="1152" y="458" font-size="20" font-weight="700" fill="#080C50" text-anchor="end">a primary key per table</text>
<rect x="40" y="520" width="1160" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="520" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="553.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Physical for standby copies and high availability.</text><text x="64" y="582.5" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Logical for major-version upgrades, selective copies, and feeding other systems.</text>
<text x="66" y="664" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The question is never which is better. It is which property you need: a standby, or a selective copy.</text>
</svg>