<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The same lost acknowledgement under at-most-once, at-least-once and exactly-once delivery, and the payment outcome each one produces">
  <rect x="0" y="0" width="1240" height="718" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One failure, three answers, three different bank statements</text>

  <rect x="50" y="88" width="1140" height="82" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="122" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same failure in all three: the consumer receives the message, processes it, and its ack is lost.</text>
  <text x="620" y="152" font-size="20" fill="#334155" text-anchor="middle">The broker cannot tell a lost ack from a lost message. What it does next is the whole difference.</text>

  
  <rect x="50" y="200" width="360" height="360" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5"/>
  <path d="M50 212 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FEF2F2"/>
  <text x="230" y="234" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">At-most-once</text>
  <text x="70" y="290" font-size="20" font-weight="600" fill="#475569">On failure</text>
  <text x="70" y="320" font-size="20" fill="#0F172A">The message is not resent.</text>
  <text x="70" y="346" font-size="20" fill="#0F172A">Send and forget.</text>
  <text x="70" y="396" font-size="20" font-weight="600" fill="#475569">What you risk</text>
  <text x="70" y="426" font-size="20" fill="#0F172A">The payment silently never</text>
  <text x="70" y="452" font-size="20" fill="#0F172A">happens at all.</text>
  <rect x="70" y="490" width="320" height="44" rx="8" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="230" y="519" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">charged 0 times</text>

  
  <rect x="440" y="200" width="360" height="360" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M440 212 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="620" y="234" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">At-least-once</text>
  <text x="460" y="290" font-size="20" font-weight="600" fill="#475569">On failure</text>
  <text x="460" y="320" font-size="20" fill="#0F172A">The message is resent until</text>
  <text x="460" y="346" font-size="20" fill="#0F172A">an ack comes back.</text>
  <text x="460" y="396" font-size="20" font-weight="600" fill="#475569">What you risk</text>
  <text x="460" y="426" font-size="20" fill="#0F172A">The consumer processes the</text>
  <text x="460" y="452" font-size="20" fill="#0F172A">same payment twice.</text>
  <rect x="460" y="490" width="320" height="44" rx="8" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="620" y="519" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">charged twice</text>

  
  <rect x="830" y="200" width="360" height="360" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="1.5"/>
  <path d="M830 212 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#ECFDF5"/>
  <text x="1010" y="234" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Exactly-once</text>
  <text x="850" y="290" font-size="20" font-weight="600" fill="#475569">On failure</text>
  <text x="850" y="320" font-size="20" fill="#0F172A">Resent as above, but the</text>
  <text x="850" y="346" font-size="20" fill="#0F172A">consumer dedups on an id.</text>
  <text x="850" y="396" font-size="20" font-weight="600" fill="#475569">What you risk</text>
  <text x="850" y="426" font-size="20" fill="#0F172A">Cost and complexity: a</text>
  <text x="850" y="452" font-size="20" fill="#0F172A">dedup store you maintain.</text>
  <rect x="850" y="490" width="320" height="44" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="1010" y="519" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">charged exactly once</text>

  
  <rect x="50" y="596" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="632" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Nobody picks at-most-once by accident. You pick it when a lost event costs less than a duplicate one.</text>
  <text x="620" y="662" font-size="20" fill="#334155" text-anchor="middle">At-least-once is the practical default, which makes idempotent consumers a requirement, not a nicety.</text>
</svg>