<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="646" viewBox="0 0 1240 646" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="order-title order-desc">
<title id="order-title">One line of code picks the semantics</title>
<desc id="order-desc">Committing the offset before processing gives at-most-once, because a crash in between loses the message. Processing before committing gives at-least-once, because a crash in between replays it. There is no third ordering.</desc>
<defs>
<marker id="order-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="order-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="order-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="order-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="646" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">One line of code picks the semantics</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The two operations happen in some sequence, and whichever one goes second is the one a crash can skip.</text>
<rect x="40" y="568" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="568" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="338" rx="14" fill="#F4F7FA" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V450A6 6 0 0 0 46 456H54Z" fill="#F3CF6A"/><text x="70" y="154" font-size="23" font-weight="700" fill="#91642E" text-anchor="start">Commit, then process</text>
<rect x="72" y="174" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">commit offset</text>
<path d="M320 230V260" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 230V260" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#order-marker-slate)"/>
<rect x="72" y="262" width="500" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="322" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">crash here: message lost</text>
<path d="M320 318V348" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M320 318V348" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#order-marker-slate)"/>
<rect x="72" y="350" width="500" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="322" y="382" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">do the work</text>
<text x="320" y="438" font-size="22" font-weight="700" fill="#91642E" text-anchor="middle">AT-MOST-ONCE</text>
<rect x="640" y="118" width="560" height="338" rx="14" fill="#F4F7FA" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.6"/><path d="M654 118H646A6 6 0 0 0 640 124V450A6 6 0 0 0 646 456H654Z" fill="#39D5AA"/><text x="670" y="154" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Process, then commit</text>
<rect x="672" y="174" width="500" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="206" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">do the work</text>
<path d="M920 230V260" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 230V260" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#order-marker-green)"/>
<rect x="672" y="262" width="500" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="922" y="294" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">crash here: message replayed</text>
<path d="M920 318V348" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M920 318V348" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#order-marker-green)"/>
<rect x="672" y="350" width="500" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="922" y="382" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">commit offset</text>
<text x="920" y="438" font-size="22" font-weight="700" fill="#169B77" text-anchor="middle">AT-LEAST-ONCE</text>
<rect x="40" y="480" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="480" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="517" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">There is no third ordering.</text>
<text x="66" y="602" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Most engineers have written this line without noticing which guarantee they chose.</text>
</svg>