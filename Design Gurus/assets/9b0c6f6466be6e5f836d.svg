<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A mesh handles traffic between services inside the system, while an API gateway handles traffic entering the system from outside clients">
  <defs>
    <marker id="sm4-mblue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <clipPath id="sm4-k1"><rect x="170" y="112" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="sm4-k2"><rect x="170" y="228" width="300" height="78" rx="12"/></clipPath>
    <clipPath id="sm4-k3"><rect x="170" y="340" width="300" height="70" rx="12"/></clipPath>
    <marker id="sm4-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="sm4-k4"><rect x="770" y="112" width="300" height="70" rx="12"/></clipPath>
    <clipPath id="sm4-k5"><rect x="770" y="228" width="300" height="78" rx="12"/></clipPath>
    <clipPath id="sm4-k6"><rect x="770" y="340" width="300" height="70" rx="12"/></clipPath>
    <filter id="sm4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sm4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  <rect x="40" y="44" width="560" height="400" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">API gateway: traffic coming in</text>
  <rect x="640" y="44" width="560" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="74" font-size="16.5" font-weight="600" fill="#047857">Service mesh: traffic between services</text>
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M320,182 V228" marker-end="url(#sm4-mblue)"/>
    <path d="M320,306 V340" marker-end="url(#sm4-mblue)"/>
  </g>
  <g filter="url(#sm4-soft)">
    <rect x="170" y="112" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="170" y="112" width="6" height="70" fill="#64748B" clip-path="url(#sm4-k1)"/>
  </g>
  <circle cx="208" cy="147" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,136.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="234" y="154" font-size="18.5" font-weight="600" fill="#111827">Outside Client</text>
  <g filter="url(#sm4-lift)">
    <rect x="170" y="228" width="300" height="78" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="170" y="228" width="9" height="78" fill="#2563EB" clip-path="url(#sm4-k2)"/>
  </g>
  <circle cx="208" cy="267" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,256.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9s1.3-6.4 3.9-9z"/>
  </g>
  <text x="234" y="274" font-size="18.5" font-weight="600" fill="#111827">API Gateway</text>
  <g filter="url(#sm4-soft)">
    <rect x="170" y="340" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="170" y="340" width="6" height="70" fill="#64748B" clip-path="url(#sm4-k3)"/>
  </g>
  <circle cx="208" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(197.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="234" y="382" font-size="18.5" font-weight="600" fill="#111827">An Internal Service</text>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M920,182 V228" marker-end="url(#sm4-memerald)"/>
    <path d="M920,306 V340" marker-end="url(#sm4-memerald)"/>
  </g>
  <g filter="url(#sm4-soft)">
    <rect x="770" y="112" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="770" y="112" width="6" height="70" fill="#64748B" clip-path="url(#sm4-k4)"/>
  </g>
  <circle cx="808" cy="147" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,136.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="834" y="154" font-size="18.5" font-weight="600" fill="#111827">Service A</text>
  <g filter="url(#sm4-lift)">
    <rect x="770" y="228" width="300" height="78" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="770" y="228" width="9" height="78" fill="#059669" clip-path="url(#sm4-k5)"/>
  </g>
  <circle cx="808" cy="267" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,256.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="834" y="274" font-size="18.5" font-weight="600" fill="#111827">Proxy to Proxy</text>
  <g filter="url(#sm4-soft)">
    <rect x="770" y="340" width="300" height="70" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="770" y="340" width="6" height="70" fill="#64748B" clip-path="url(#sm4-k6)"/>
  </g>
  <circle cx="808" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="834" y="382" font-size="18.5" font-weight="600" fill="#111827">Service B</text>
  <rect x="40" y="480" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="504" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="526" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">The gateway</text>
  <text x="288" y="526" font-size="15.5" fill="#475569">one door into the system, where outside clients arrive and are authenticated</text>
  <rect x="64" y="548" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="570" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">The mesh</text>
  <text x="288" y="570" font-size="15.5" fill="#475569">the traffic already inside, between services that all belong to you</text>
</svg>