<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="908" viewBox="0 0 1240 908" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="retries-title retries-desc">
<title id="retries-title">The arithmetic that makes retries dangerous</title>
<desc id="retries-desc">Retry amplification multiplies across layers. The published figure for a five-deep stack with three retries per layer is a 243 times increase in load on the database.</desc>
<defs>
<marker id="retries-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="retries-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="retries-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="retries-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="908" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The arithmetic that makes retries dangerous</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Retry amplification multiplies across layers.</text>
<rect x="40" y="830" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="830" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="148" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Five layers that retry, and one that pays for it</text>
<rect x="40" y="164" width="150" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="115" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">client</text>
<text x="115" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x3</text>
<path d="M196 189H234" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M196 189H234" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="242" y="164" width="150" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="317" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">gateway</text>
<text x="317" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x3</text>
<path d="M398 189H436" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M398 189H436" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="444" y="164" width="150" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="519" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">api</text>
<text x="519" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x3</text>
<path d="M600 189H638" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M600 189H638" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="646" y="164" width="150" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="721" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">service</text>
<text x="721" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x3</text>
<path d="M802 189H840" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M802 189H840" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="848" y="164" width="150" height="50" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="923" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">worker</text>
<text x="923" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x3</text>
<path d="M1004 189H1042" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M1004 189H1042" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="1050" y="164" width="150" height="50" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1125" y="195" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">database</text>
<text x="1125" y="240" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">x243</text>
<rect x="40" y="256" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="256" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="290" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">load on the database increases 243 times, which is three to the fifth power</text>
<text x="40" y="350" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Four controls, and all four are needed</text>
<rect x="40" y="366" width="480" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="398" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retry only what is idempotent</text>
<path d="M526 392H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 392H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="570" y="366" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="398" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">or made idempotent with a key</text>
<rect x="40" y="428" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="460" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Retry only the right errors</text>
<path d="M526 454H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 454H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="570" y="428" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="460" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a timeout, not a validation error</text>
<rect x="40" y="490" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="522" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Back off exponentially, with jitter</text>
<path d="M526 516H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 516H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="570" y="490" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="522" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">without jitter everyone retries at the same moment</text>
<rect x="40" y="552" width="480" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="584" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Cap the total</text>
<path d="M526 578H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 578H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#retries-marker-slate)"/>
<rect x="570" y="552" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="584" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">this is the control that bounds the arithmetic</text>
<rect x="40" y="624" width="372" height="100" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="624" width="5" height="100" rx="2.5" fill="#5EC9EC"/><text x="64" y="654" font-size="20" font-weight="700" fill="#155B9E" text-anchor="start">per request</text><text x="64" y="680" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">three failures, then the error</text><text x="64" y="706" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">returns to the caller</text>
<rect x="434" y="624" width="372" height="100" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="434" y="624" width="5" height="100" rx="2.5" fill="#F3CF6A"/><text x="458" y="654" font-size="20" font-weight="700" fill="#91642E" text-anchor="start">per client</text><text x="458" y="680" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">retries only while below ten</text><text x="458" y="706" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">percent of total requests</text>
<rect x="828" y="624" width="372" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="828" y="624" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="852" y="654" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">together</text><text x="852" y="680" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">growth falls to about 1.1x,</text><text x="852" y="706" font-size="19" font-weight="700" fill="#169B77" text-anchor="start">against 243x uncontrolled</text>
<rect x="40" y="744" width="1160" height="58" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="744" width="5" height="58" rx="2.5" fill="#39D5AA"/><text x="64" y="779" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">And the simplest fix of all: decide which single layer owns retrying.</text>
<text x="66" y="864" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The budget does the work, because it bounds the total rather than bounding each request.</text>
</svg>