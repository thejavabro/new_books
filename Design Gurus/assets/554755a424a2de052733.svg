  <text x="249" y="472" font-size="21.5" font-weight="600" fill="#111827">Cancelled</text>
  <g filter="url(#m11f-soft)">
    <rect x="940" y="404" width="260" height="96" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="940" y="404" width="6" height="96" fill="#DB2777" clip-path="url(#m11f-k4)"/>
  </g>
  <circle cx="978" cy="452" r="18" fill="#FFFFFF"/>
  <g transform="translate(967.56,441.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="1004" y="446.25" font-size="21.5" font-weight="600" fill="#111827">Cannot cancel a</text>
  <text x="1004" y="471.75" font-size="21.5" font-weight="600" fill="#111827">shipped order</text>
  <g filter="url(#m11f-soft)">
    <rect x="40" y="560" width="560" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="40" y="560" width="6" height="90" fill="#059669" clip-path="url(#m11f-k5)"/>
  </g>
  <circle cx="78" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,594.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="612" font-size="21.5" font-weight="600" fill="#111827">Valid state transitions</text>
  <text x="320" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">only allowed operations can change the state</text>
  <g filter="url(#m11f-soft)">
    <rect x="640" y="560" width="560" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="640" y="560" width="6" height="90" fill="#DB2777" clip-path="url(#m11f-k6)"/>
  </g>
  <circle cx="678" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(667.56,594.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="704" y="612" font-size="21.5" font-weight="600" fill="#111827">Invalid state transitions</text>
  <text x="920" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">the entity prevents operations that violate business rules</text>

  <rect x="624" y="185" width="252" height="210" rx="12" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="648" y="266" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="18.5" fill="#1F2937">confirm()</text>
  <text x="648" y="296" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="18.5" fill="#1F2937">ship()</text>
  <text x="648" y="326" font-family="Consolas, &#39;Courier New&#39;, monospace" font-size="18.5" fill="#1F2937">cancel()</text>
