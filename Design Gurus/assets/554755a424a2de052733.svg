  </g>
  <circle cx="368" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,264.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="394" y="282" font-size="21.5" font-weight="600" fill="#111827">Confirmed</text>
  <g filter="url(#m11f-soft)">
    <rect x="1010" y="230" width="190" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="1010" y="230" width="6" height="90" fill="#D97706" clip-path="url(#m11f-k3)"/>
  </g>
  <circle cx="1048" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,264.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="1074" y="282" font-size="21.5" font-weight="600" fill="#111827">Shipped</text>
  <g filter="url(#m11f-soft)">
    <rect x="185" y="420" width="200" height="90" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="185" y="420" width="6" height="90" fill="#64748B" clip-path="url(#m11f-k7)"/>
  </g>
  <circle cx="223" cy="465" r="18" fill="#FFFFFF"/>
