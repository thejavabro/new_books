<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An order moves from Draft to Confirmed with confirm and from Confirmed to Shipped with ship; cancel moves a Draft or Confirmed order to Cancelled. Beside the states, the Order domain entity exposes confirm, ship and cancel. A dashed cancel path from Shipped to the entity is crossed out: you cannot cancel a shipped order. Valid state transitions: only allowed operations can change the state. Invalid state transitions: the entity prevents operations that violate business rules">
  <defs>
    <filter id="m11f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m11f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m11f-k1"><rect x="40" y="230" width="180" height="90" rx="12"/></clipPath>
    <clipPath id="m11f-k2"><rect x="330" y="230" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m11f-k3"><rect x="1010" y="230" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m11f-k4"><rect x="940" y="404" width="260" height="96" rx="12"/></clipPath>
    <clipPath id="m11f-k5"><rect x="40" y="560" width="560" height="90" rx="12"/></clipPath>
