    <clipPath id="m11f-k6"><rect x="640" y="560" width="560" height="90" rx="12"/></clipPath>
    <marker id="m11f-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m11f-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How domain entities enforce business rules</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The Order entity allows only valid state changes and refuses to cancel a shipped order.</text>

  <rect x="600" y="130" width="300" height="290" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="624" y="160" font-size="19.5" font-weight="600" fill="#4338CA">Order (domain entity)</text>

  <g fill="none" stroke-width="2">
    <path d="M220,275 H330" stroke="#059669" marker-end="url(#m11f-m-emerald)"/>
    <path d="M440,230 V124 Q440,112 452,112 H1093 Q1105,112 1105,124 V230" stroke="#059669" marker-end="url(#m11f-m-emerald)"/>
    <path d="M130,320 V453 Q130,465 142,465 H185" stroke="#059669" marker-end="url(#m11f-m-emerald)"/>
    <path d="M440,320 V453 Q440,465 428,465 H385" stroke="#059669" marker-end="url(#m11f-m-emerald)"/>
    <path d="M1105,320 V358 Q1105,370 1093,370 H900" stroke="#DB2777" stroke-dasharray="7 6" marker-end="url(#m11f-m-pink)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="275" y="263" fill="#047857">confirm()</text>
    <text x="1117" y="180" text-anchor="start" fill="#047857">ship()</text>
    <text x="140" y="390" text-anchor="start" fill="#047857">cancel()</text>
    <text x="430" y="390" text-anchor="end" fill="#047857">cancel()</text>
    <text x="1117" y="352" text-anchor="start" fill="#BE185D">cancel()</text>
  </g>

