      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="yl07twosurf-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="yl07twosurf-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl07twosurf-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl07twosurf-k1"><rect x="80" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07twosurf-k2"><rect x="80" y="330" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07twosurf-k3"><rect x="495" y="110" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="yl07twosurf-k4"><rect x="495" y="330" width="270" height="90" rx="12"/></clipPath>
    <clipPath id="yl07twosurf-k5"><rect x="880" y="110" width="280" height="90" rx="12"/></clipPath>
    <clipPath id="yl07twosurf-k6"><rect x="880" y="330" width="280" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="430" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Two resources, two surfaces</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">authenticated consumers on the left, a browser on the right</text>

  
  <g fill="none" stroke-width="2">
    <path d="M230,264 V330" stroke="#2563EB" marker-end="url(#yl07twosurf-bm)"/>
    <path d="M380,355 H440 Q452,355 452,343 V167 Q452,155 464,155 H495" stroke="#2563EB" marker-end="url(#yl07twosurf-bm)"/>
    <path d="M380,390 H495" stroke="#2563EB" marker-end="url(#yl07twosurf-bm)"/>
    <path d="M1020,222 V330" stroke="#D97706" marker-end="url(#yl07twosurf-am)"/>
    <path d="M880,355 H830 Q818,355 818,343 V167 Q818,155 806,155 H765" stroke="#D97706" stroke-width="2.5" marker-end="url(#yl07twosurf-am)"/>
    <path d="M630,200 V330" stroke="#94A3B8"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="678" y="270" fill="#475569">1 to 1</text>
    <text x="452" y="127" fill="#1D4ED8">reads</text>
    <text x="818" y="127" fill="#B45309">resolves</text>
  </g>

  
  <g filter="url(#yl07twosurf-soft)">
