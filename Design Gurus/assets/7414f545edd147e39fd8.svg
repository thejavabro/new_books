  </g>
  <circle cx="118" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,144.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="144" y="162" font-size="18.5" font-weight="600" fill="#111827">Consumers</text>
  <text x="230" y="225" font-size="15.5" text-anchor="middle" fill="#6B7280">web app, partner, automation</text>
  <text x="230" y="248" font-size="15.5" text-anchor="middle" fill="#94A3B8">authenticated callers</text>

  
  <g filter="url(#yl07twosurf-soft)">
