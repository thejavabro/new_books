<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two resources in the center, Link and ClickStatistics, connected one to one. On the left, authenticated consumers call a JSON management API that reads both resources. On the right, a browser calls a separate redirect surface that uses only the link alias. Both surfaces use the same link mapping but publish different contracts.">
