    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="144" y="382" font-size="18.5" font-weight="600" fill="#111827">JSON management API</text>
  <text x="230" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">reads both resources</text>

  
  <g filter="url(#yl07twosurf-lift)">
    <rect x="495" y="110" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <rect x="495" y="110" width="9" height="90" fill="#64748B" clip-path="url(#yl07twosurf-k3)"/>
  </g>
  <circle cx="533" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(522.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 12h6"/>
    <path d="M10.5 7.5H7a4.5 4.5 0 0 0 0 9h3.5"/>
    <path d="M13.5 7.5H17a4.5 4.5 0 0 1 0 9h-3.5"/>
  </g>
  <text x="559" y="162" font-size="18.5" font-weight="600" fill="#111827">Link</text>

  
  <g filter="url(#yl07twosurf-soft)">
    <rect x="495" y="330" width="270" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="495" y="330" width="6" height="90" fill="#64748B" clip-path="url(#yl07twosurf-k4)"/>
