  <circle cx="533" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(522.56,364.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="559" y="382" font-size="18.5" font-weight="600" fill="#111827">ClickStatistics</text>

  
  <g filter="url(#yl07twosurf-soft)">
    <rect x="880" y="110" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="880" y="110" width="6" height="90" fill="#D97706" clip-path="url(#yl07twosurf-k5)"/>
  </g>
  <circle cx="918" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,144.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="944" y="162" font-size="18.5" font-weight="600" fill="#111827">Browser</text>

  
  <g filter="url(#yl07twosurf-soft)">
    <rect x="880" y="330" width="280" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="880" y="330" width="6" height="90" fill="#D97706" clip-path="url(#yl07twosurf-k6)"/>
  </g>
  <circle cx="918" cy="375" r="18" fill="#FFFFFF"/>
  <g transform="translate(907.56,364.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="944" y="382" font-size="18.5" font-weight="600" fill="#111827">Redirect surface</text>
  <text x="1020" y="445" font-size="15.5" text-anchor="middle" fill="#6B7280">uses the link alias only</text>

  
  <rect x="40" y="494" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="534" text-anchor="middle" font-size="16" fill="#475569">Both surfaces use the same link mapping.</text>
  <text x="620" y="562" text-anchor="middle" font-size="16" fill="#475569">They publish different contracts, for different callers.</text>
</svg>