<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="892" viewBox="0 0 1240 892" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Critique findings ranked by caller consequence. The top tier breaks or harms callers, the middle tier stops a caller finishing a job, and the bottom tier only costs extra work. The arrow down the tiers reads lower priority, not lower value.">
  <defs>
    <marker id="p45-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p45-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p45-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p45-k1"><rect x="64" y="174" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k2"><rect x="444" y="174" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k3"><rect x="824" y="174" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k4"><rect x="64" y="242" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k5"><rect x="444" y="242" width="352" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k6"><rect x="64" y="438" width="542" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k7"><rect x="634" y="438" width="542" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k8"><rect x="64" y="634" width="542" height="48" rx="10"/></clipPath>
    <clipPath id="p45-k9"><rect x="634" y="634" width="542" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="892" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Rank findings by caller consequence</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">eight findings in three tiers</text>

  
  <g fill="none" stroke-width="2">
    <path d="M620,316 V390" stroke="#64748B" marker-end="url(#p45-sl)"/>
    <path d="M620,512 V586" stroke="#64748B" marker-end="url(#p45-sl)"/>
  </g>

  
  <rect x="40" y="126" width="1160" height="190" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Breaks or harms callers</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">five findings</text>

  <g filter="url(#p45-soft)">
    <rect x="64" y="174" width="352" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p45-k1)"/>
  </g>
  <circle cx="98" cy="198" r="4.5" fill="#DB2777"/>
  <text x="122" y="205" font-size="18.5" font-weight="600" fill="#111827">caller-controlled identity</text>

  <g filter="url(#p45-soft)">
    <rect x="444" y="174" width="352" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="444" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p45-k2)"/>
  </g>
  <circle cx="478" cy="198" r="4.5" fill="#DB2777"/>
  <text x="502" y="205" font-size="18.5" font-weight="600" fill="#111827">caller-controlled price</text>

  <g filter="url(#p45-soft)">
    <rect x="824" y="174" width="352" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="824" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p45-k3)"/>
  </g>
  <circle cx="858" cy="198" r="4.5" fill="#DB2777"/>
  <text x="882" y="205" font-size="18.5" font-weight="600" fill="#111827">unsafe checkout retry</text>

  <g filter="url(#p45-soft)">
    <rect x="64" y="242" width="352" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="242" width="6" height="48" fill="#DB2777" clip-path="url(#p45-k4)"/>
  </g>
  <circle cx="98" cy="266" r="4.5" fill="#DB2777"/>
  <text x="122" y="273" font-size="18.5" font-weight="600" fill="#111827">200 for every failure</text>

  <g filter="url(#p45-soft)">
    <rect x="444" y="242" width="352" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="444" y="242" width="6" height="48" fill="#DB2777" clip-path="url(#p45-k5)"/>
  </g>
  <circle cx="478" cy="266" r="4.5" fill="#DB2777"/>
  <text x="502" y="273" font-size="18.5" font-weight="600" fill="#111827">unconstrained stale PATCH</text>

  
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="640" y="358" fill="#475569">lower priority</text>
  </g>

  
  <rect x="40" y="390" width="1160" height="122" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="420" font-size="16.5" font-weight="600" fill="#B45309">The caller cannot finish a job</text>
  <text x="1176" y="420" text-anchor="end" font-size="15.5" fill="#6B7280">two findings</text>

  <g filter="url(#p45-soft)">
    <rect x="64" y="438" width="542" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="438" width="6" height="48" fill="#D97706" clip-path="url(#p45-k6)"/>
  </g>
  <circle cx="98" cy="462" r="4.5" fill="#D97706"/>
  <text x="122" y="469" font-size="18.5" font-weight="600" fill="#111827">cancellation has no outcome</text>

  <g filter="url(#p45-soft)">
    <rect x="634" y="438" width="542" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="634" y="438" width="6" height="48" fill="#D97706" clip-path="url(#p45-k7)"/>
  </g>
  <circle cx="668" cy="462" r="4.5" fill="#D97706"/>
  <text x="692" y="469" font-size="18.5" font-weight="600" fill="#111827">list traversal is unreliable</text>

  
  <rect x="40" y="586" width="1160" height="122" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="616" font-size="16.5" font-weight="600" fill="#475569">Extra caller work</text>
  <text x="1176" y="616" text-anchor="end" font-size="15.5" fill="#6B7280">one finding, two symptoms</text>

  <g filter="url(#p45-soft)">
    <rect x="64" y="634" width="542" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="634" width="6" height="48" fill="#64748B" clip-path="url(#p45-k8)"/>
  </g>
  <circle cx="98" cy="658" r="4.5" fill="#64748B"/>
  <text x="122" y="665" font-size="18.5" font-weight="600" fill="#111827">mixed paths and casing</text>

  <g filter="url(#p45-soft)">
    <rect x="634" y="634" width="542" height="48" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="634" y="634" width="6" height="48" fill="#64748B" clip-path="url(#p45-k9)"/>
  </g>
  <circle cx="668" cy="658" r="4.5" fill="#64748B"/>
  <text x="692" y="665" font-size="18.5" font-weight="600" fill="#111827">numeric ids and bare arrays</text>

  
  <rect x="40" y="752" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="794" text-anchor="middle" font-size="16" fill="#475569">Lower priority, not lower value. The tiers set the order you raise findings in, not which ones are worth raising.</text>
  <text x="620" y="822" text-anchor="middle" font-size="16" fill="#475569">Every finding names the defect, the caller consequence, and the smallest fix.</text>
</svg>