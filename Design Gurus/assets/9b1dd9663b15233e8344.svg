<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A paid user submits a prompt; the API accepts it in about 0.2 seconds and puts the job in the paid queue; in the background the prompt is enhanced, a warm worker generates four images in one batch, the image gate checks them, provenance is added at about 47 seconds, and the user sees the grid">
