  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="652.5" y="570" fill="#B45309">four images, one batch</text></g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="7"><text x="422.5" y="669" fill="#059669">all four pass</text></g>
  <rect x="40" y="824" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="869" text-anchor="middle" font-size="16" fill="#475569">The user waited about 47 seconds, but the open request lasted only 0.2 seconds.</text>
