<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="712" viewBox="0 0 1240 712" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="breaks-title breaks-desc">
<title id="breaks-title">What transaction pooling breaks, and why</title>
<desc id="breaks-desc">Under transaction pooling, two consecutive transactions on one application connection can run on different backend processes. Every feature that stores state on a backend between transactions therefore stops working.</desc>
<defs>
<marker id="breaks-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="breaks-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="breaks-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="breaks-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="712" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What transaction pooling breaks, and why</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Transaction pooling breaks anything that assumes session state.</text>
<rect x="40" y="634" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="634" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<rect x="40" y="118" width="1160" height="218" rx="14" fill="#F4F7FA" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.6"/><path d="M54 118H46A6 6 0 0 0 40 124V330A6 6 0 0 0 46 336H54Z" fill="#5EC9EC"/><text x="70" y="154" font-size="23" font-weight="700" fill="#155B9E" text-anchor="start">One application connection, two transactions, two different backends</text>
<rect x="72" y="214" width="210" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="177" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">App connection</text>
<path d="M288 244H322" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M288 244H322" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaks-marker-slate)"/>
<rect x="328" y="214" width="150" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="403" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Pooler</text>
<rect x="660" y="176" width="200" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="760" y="209" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backend 1</text>
<rect x="660" y="258" width="200" height="54" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="760" y="291" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Backend 2</text>
<path d="M484 234L654 205" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M484 234L654 205" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaks-marker-green)"/>
<path d="M484 254L654 283" fill="none" stroke="#91642E" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M484 254L654 283" fill="none" stroke="#91642E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#breaks-marker-amber)"/>
<text x="560" y="192" font-size="19" font-weight="700" fill="#169B77" text-anchor="middle">transaction 1</text>
<text x="560" y="308" font-size="19" font-weight="700" fill="#91642E" text-anchor="middle">transaction 2</text>
<rect x="900" y="206" width="276" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1038" y="236.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Anything remembered</text><text x="1038" y="263.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">on backend 1 is gone</text>
<text x="40" y="378" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So these stop working</text>
<rect x="40" y="396" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="396" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="64" y="421" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Prepared statements</text><text x="64" y="447" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the pooler cannot promise the same backend</text>
<rect x="640" y="396" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="396" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="664" y="421" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">LISTEN and NOTIFY</text><text x="664" y="447" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the subscription belongs to one backend</text>
<rect x="40" y="470" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="470" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="64" y="495" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Advisory locks</text><text x="64" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">held across transactions, so they are released</text>
<rect x="640" y="470" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="470" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="664" y="495" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Temporary tables</text><text x="664" y="521" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">created on a backend you will not see again</text>
<rect x="40" y="544" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="544" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="64" y="569" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Session SET variables</text><text x="64" y="595" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the next transaction starts without them</text>
<rect x="640" y="544" width="560" height="64" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="544" width="5" height="64" rx="2.5" fill="#F28B9D"/><text x="664" y="569" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">Cursors WITH HOLD</text><text x="664" y="595" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">they outlive the transaction, the backend does not</text>
<text x="66" y="668" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">One rule covers the whole list: nothing may assume the next statement runs on the same backend process.</text>
</svg>