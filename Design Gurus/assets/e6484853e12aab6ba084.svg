<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three families of real systems: relational where structure and correctness dominate, non-relational where scale and relationships dominate, and hybrids that use both">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <filter id="db8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="386" height="400" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="213" y="80" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">SQL won</text>

  <rect x="426" y="40" width="386" height="400" rx="14" fill="#ECFDF5" fill-opacity="0.4" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="619" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">NoSQL won</text>

  <rect x="832" y="40" width="386" height="400" rx="14" fill="#F5F3FF" fill-opacity="0.5" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1025" y="80" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Both won</text>

  <g filter="url(#db8-soft)">
    <rect x="42" y="106" width="342" height="94" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="42" y="214" width="342" height="94" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="42" y="322" width="342" height="94" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>

    <rect x="448" y="106" width="342" height="94" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="448" y="214" width="342" height="94" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="448" y="322" width="342" height="94" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>

    <rect x="854" y="106" width="342" height="94" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="854" y="214" width="342" height="94" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>

  <text x="213" y="142" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">E-commerce</text>
  <text x="213" y="176" font-size="20" fill="#475569" text-anchor="middle">structured and related</text>
  <text x="213" y="250" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Financial systems</text>
  <text x="213" y="284" font-size="20" fill="#475569" text-anchor="middle">ACID is the reason</text>
  <text x="213" y="358" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Content management</text>
  <text x="213" y="392" font-size="20" fill="#475569" text-anchor="middle">WordPress, Joomla</text>

  <text x="619" y="142" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Facebook social graph</text>
  <text x="619" y="176" font-size="20" fill="#475569" text-anchor="middle">TAO, a graph database</text>
  <text x="619" y="250" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Netflix viewing history</text>
  <text x="619" y="284" font-size="20" fill="#475569" text-anchor="middle">Cassandra, heavy writes</text>
  <text x="619" y="358" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Philips Hue devices</text>
  <text x="619" y="392" font-size="20" fill="#475569" text-anchor="middle">DynamoDB, IoT data</text>

  <text x="1025" y="142" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Gaming</text>
  <text x="1025" y="176" font-size="20" fill="#475569" text-anchor="middle">MySQL plus Redis</text>
  <text x="1025" y="250" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">E-commerce with recs</text>
  <text x="1025" y="284" font-size="20" fill="#475569" text-anchor="middle">orders plus suggestions</text>
  <text x="1025" y="368" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Polyglot persistence</text>

  <text x="620" y="476" font-size="20" fill="#475569" text-anchor="middle">The interesting cases are not one database, they are two requirements refusing to share one answer</text>
</svg>