<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="608" viewBox="0 0 1480 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of the four NoSQL families. Key-value stores hold a value under a key, are read by key, suit caching and sessions, are weak at anything but a key lookup, and include Redis and DynamoDB. Document stores hold JSON documents, are queried on fields inside the document, suit records whose shape varies, are weak at joins across collections, and include MongoDB. Wide-column stores group rows under a partition key, are read by partition key and sort columns, suit very high write rates, are weak at queries you did not plan for, and include Cassandra and HBase. Graph databases hold nodes and edges, are read by walking edges, suit questions several steps deep, are weak at very large scale sharding, and include Neo4j and Neptune. Vector stores hold embeddings, are read by nearest neighbour search against a query vector, suit semantic search and retrieval-augmented generation, are weak at exact lookups because results are approximate, and include Pinecone and pgvector.">
  <rect x="0" y="0" width="1480" height="608" fill="#FFFFFF"/>
  <defs>
    <marker id="sn2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sn2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sn2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sn2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sn2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sn2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="sn2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="sn2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="sn2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="740" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">NoSQL is five different designs, not one</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="56" width="230" height="40" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">Key-value</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="56" width="230" height="40" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">Document</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="56" width="230" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Wide-column</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="56" width="230" height="40" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="84" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">Graph</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="56" width="230" height="40" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="84" font-size="21" font-weight="700" fill="#B91C1C" text-anchor="middle">Vector</text>
  <rect x="24" y="106" width="230" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="154" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">What it holds</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="106" width="230" height="82" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="140" font-size="19" fill="#0F172A" text-anchor="middle">A value under</text>
  <text x="379" y="166" font-size="19" fill="#0F172A" text-anchor="middle">a key</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="106" width="230" height="82" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="140" font-size="19" fill="#0F172A" text-anchor="middle">A document,</text>
  <text x="619" y="166" font-size="19" fill="#0F172A" text-anchor="middle">usually JSON</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="106" width="230" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="140" font-size="19" fill="#0F172A" text-anchor="middle">Rows grouped under</text>
  <text x="859" y="166" font-size="19" fill="#0F172A" text-anchor="middle">a partition key</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="106" width="230" height="82" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="140" font-size="19" fill="#0F172A" text-anchor="middle">Nodes and the</text>
  <text x="1099" y="166" font-size="19" fill="#0F172A" text-anchor="middle">edges between them</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="106" width="230" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="140" font-size="19" fill="#0F172A" text-anchor="middle">Embeddings: arrays</text>
  <text x="1339" y="166" font-size="19" fill="#0F172A" text-anchor="middle">of numbers</text>
  <rect x="24" y="198" width="230" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="246" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">How you read it</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="198" width="230" height="82" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="246" font-size="19" fill="#0F172A" text-anchor="middle">Get it by key</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="198" width="230" height="82" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="232" font-size="19" fill="#0F172A" text-anchor="middle">Query fields</text>
  <text x="619" y="258" font-size="19" fill="#0F172A" text-anchor="middle">inside the document</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="198" width="230" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="232" font-size="19" fill="#0F172A" text-anchor="middle">By partition key,</text>
  <text x="859" y="258" font-size="19" fill="#0F172A" text-anchor="middle">then sort columns</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="198" width="230" height="82" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="232" font-size="19" fill="#0F172A" text-anchor="middle">Walk the edges</text>
  <text x="1099" y="258" font-size="19" fill="#0F172A" text-anchor="middle">from a node</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="198" width="230" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="232" font-size="19" fill="#0F172A" text-anchor="middle">Nearest neighbours</text>
  <text x="1339" y="258" font-size="19" fill="#0F172A" text-anchor="middle">to a query vector</text>
  <rect x="24" y="290" width="230" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="338" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Good for</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="290" width="230" height="82" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="324" font-size="19" fill="#0F172A" text-anchor="middle">Caching, sessions,</text>
  <text x="379" y="350" font-size="19" fill="#0F172A" text-anchor="middle">counters</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="290" width="230" height="82" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="324" font-size="19" fill="#0F172A" text-anchor="middle">Records whose</text>
  <text x="619" y="350" font-size="19" fill="#0F172A" text-anchor="middle">shape varies</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="290" width="230" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="324" font-size="19" fill="#0F172A" text-anchor="middle">Very high write</text>
  <text x="859" y="350" font-size="19" fill="#0F172A" text-anchor="middle">rates, time series</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="290" width="230" height="82" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="324" font-size="19" fill="#0F172A" text-anchor="middle">Questions several</text>
  <text x="1099" y="350" font-size="19" fill="#0F172A" text-anchor="middle">steps deep</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="290" width="230" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="324" font-size="19" fill="#0F172A" text-anchor="middle">Semantic search,</text>
  <text x="1339" y="350" font-size="19" fill="#0F172A" text-anchor="middle">RAG retrieval</text>
  <rect x="24" y="382" width="230" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="430" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Weak at</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="382" width="230" height="82" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="416" font-size="19" fill="#0F172A" text-anchor="middle">Anything but</text>
  <text x="379" y="442" font-size="19" fill="#0F172A" text-anchor="middle">a key lookup</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="382" width="230" height="82" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="416" font-size="19" fill="#0F172A" text-anchor="middle">Joins across</text>
  <text x="619" y="442" font-size="19" fill="#0F172A" text-anchor="middle">collections</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="382" width="230" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="416" font-size="19" fill="#0F172A" text-anchor="middle">Queries you did</text>
  <text x="859" y="442" font-size="19" fill="#0F172A" text-anchor="middle">not plan for</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="382" width="230" height="82" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="416" font-size="19" fill="#0F172A" text-anchor="middle">Spreading over</text>
  <text x="1099" y="442" font-size="19" fill="#0F172A" text-anchor="middle">very many machines</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="382" width="230" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="416" font-size="19" fill="#0F172A" text-anchor="middle">Exact lookups;</text>
  <text x="1339" y="442" font-size="19" fill="#0F172A" text-anchor="middle">results are approximate</text>
  <rect x="24" y="474" width="230" height="82" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="48" y="522" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Common products</text>
  <g filter="url(#sn2-soft)"><rect x="264" y="474" width="230" height="82" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.6"/></g>
  <text x="379" y="522" font-size="19" fill="#0F172A" text-anchor="middle">Redis, DynamoDB</text>
  <g filter="url(#sn2-soft)"><rect x="504" y="474" width="230" height="82" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.6"/></g>
  <text x="619" y="522" font-size="19" fill="#0F172A" text-anchor="middle">MongoDB</text>
  <g filter="url(#sn2-soft)"><rect x="744" y="474" width="230" height="82" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="859" y="522" font-size="19" fill="#0F172A" text-anchor="middle">Cassandra, HBase</text>
  <g filter="url(#sn2-soft)"><rect x="984" y="474" width="230" height="82" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1099" y="522" font-size="19" fill="#0F172A" text-anchor="middle">Neo4j, Neptune</text>
  <g filter="url(#sn2-soft)"><rect x="1224" y="474" width="230" height="82" rx="11" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.6"/></g>
  <text x="1339" y="522" font-size="19" fill="#0F172A" text-anchor="middle">Pinecone, pgvector</text>
  <text x="740" y="596" font-size="19" fill="#64748B" text-anchor="middle">Picking "NoSQL" is not a decision. Picking one of these five is.</text>
</svg>