<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="640" viewBox="0 0 1240 640" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The array, its running sums, and the axis of running sums">
<defs>
<filter id="cr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="640" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many stretches of [2, -1, 2, -3, 4] add up to something between 0 and 2?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">A running sum turns every stretch into the difference of two numbers</text>
<rect x="40" y="106" width="1160" height="386" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">P0 is zero, and Pk is the sum of the first k numbers</text>
<text x="324" y="198" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">nums</text>
<rect x="346" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="396" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="396" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">0</text>
<rect x="458" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="508" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-1</text>
<text x="508" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">1</text>
<rect x="570" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="620" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">2</text>
<rect x="682" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="732" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">-3</text>
<text x="732" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">3</text>
<rect x="794" y="160" width="100" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="844" y="197.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="844" y="242" text-anchor="middle" font-size="15.5" fill="#94A3B8">4</text>
<text x="292" y="302" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">running sums</text>
<rect x="314" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="360" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="360" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P0</text>
<rect x="418" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="464" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<text x="464" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P1</text>
<rect x="522" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="568" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="568" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P2</text>
<rect x="626" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="672" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="672" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P3</text>
<rect x="730" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="776" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="776" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P4</text>
<rect x="834" y="264" width="92" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="880" y="301.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<text x="880" y="346" text-anchor="middle" font-size="15.5" fill="#94A3B8">P5</text>
<text x="320" y="426" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">sums placed</text>
<rect x="342" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="392" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">0</text>
<text x="392" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">not seen</text>
<rect x="456" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="506" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<text x="506" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">not seen</text>
<rect x="570" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<text x="620" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">not seen</text>
<rect x="684" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="734" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<text x="734" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">not seen</text>
<rect x="798" y="388" width="100" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="848" y="425.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">4</text>
<text x="848" y="470" text-anchor="middle" font-size="15.5" fill="#94A3B8">not seen</text>
<rect x="40" y="510" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="550" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The sum from i to j is Pj+1 minus Pi, so a stretch is just a pair of running sums</text>
<text x="620" y="582" text-anchor="middle" font-size="18.5" fill="#475569">That replaces the question about stretches with a question about how many earlier sums fall in a window</text>
</svg>