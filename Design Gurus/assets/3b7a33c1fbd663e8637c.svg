<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Eight requests arrive at once and wait in a queue that holds up to eight. They leave at a constant rate of one every 0.5 seconds, so the output is a steady 2 requests per second, never faster. New arrivals are dropped when the queue is full.">
  <defs>
    <filter id="tvl2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tvl2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tvl2-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tvl2-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tvl2-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="tvl2-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <marker id="tvl2-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How a leaky bucket shapes traffic</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Drain rate: 2 requests per second. Queue size: 8 requests.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#tvl2-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#tvl2-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#tvl2-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#tvl2-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#tvl2-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">Spiky arrivals</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">8 requests</text>
  <text x="165" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">at once</text>
  <g filter="url(#tvl2-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#D97706" clip-path="url(#tvl2-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">Queue</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">holds up to</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">8 requests</text>
  <g filter="url(#tvl2-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#2563EB" clip-path="url(#tvl2-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">Constant drain</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">1 request every</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">0.5 seconds</text>
  <g filter="url(#tvl2-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#059669" clip-path="url(#tvl2-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">Steady output</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">2 per second,</text>
  <text x="1074" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">never faster</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Shaping</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">changes the timing of traffic, not only its amount</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Queue full</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">new requests are dropped</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">The cost</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">every queued request waits, and the caller does not know why</text>
</svg>