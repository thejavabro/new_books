  <text x="892" y="302" font-size="21.5" font-weight="600" fill="#111827">Data access layer</text>
  <text x="988" y="369" font-size="18.5" text-anchor="middle" fill="#6B7280">repositories, ORM</text>
  <g filter="url(#m03a-soft)">
    <rect x="84" y="700" width="266" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="700" width="6" height="90" fill="#2563EB" clip-path="url(#m03a-k4)"/>
  </g>
  <circle cx="122" cy="745" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,734.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="148" y="752" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="217" y="819" font-size="18.5" text-anchor="middle" fill="#6B7280">browser or mobile app</text>
  <g filter="url(#m03a-soft)">
    <rect x="84" y="880" width="266" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="880" width="6" height="90" fill="#2563EB" clip-path="url(#m03a-k5)"/>
