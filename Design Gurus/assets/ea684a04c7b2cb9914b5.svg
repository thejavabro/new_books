  <text x="156" y="302" font-size="21.5" font-weight="600" fill="#111827">Presentation layer</text>
  <text x="252" y="369" font-size="18.5" text-anchor="middle" fill="#6B7280">controllers, views</text>
  <g filter="url(#m03a-soft)">
    <rect x="460" y="250" width="320" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="460" y="250" width="6" height="90" fill="#059669" clip-path="url(#m03a-k2)"/>
  </g>
  <circle cx="498" cy="295" r="18" fill="#FFFFFF"/>
  <g transform="translate(487.56,284.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="524" y="302" font-size="21.5" font-weight="600" fill="#111827">Business logic layer</text>
