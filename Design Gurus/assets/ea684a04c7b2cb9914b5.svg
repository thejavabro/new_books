  <text x="582" y="932" font-size="21.5" font-weight="600" fill="#111827">App server</text>
  <text x="638" y="999" font-size="18.5" text-anchor="middle" fill="#6B7280">Python, Java, Go</text>
  <g filter="url(#m03a-soft)">
    <rect x="901" y="880" width="260" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="901" y="880" width="6" height="90" fill="#7C3AED" clip-path="url(#m03a-k7)"/>
