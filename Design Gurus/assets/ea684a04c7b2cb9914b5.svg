<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. N-layer architecture, a logical separation on the same machine: one server running a single process holds the presentation layer (controllers, views), the business logic layer (services, use cases) and the data access layer (repositories, ORM), and the server talks to a database. N-tier architecture, a physical separation across different machines: the presentation tier (tier 1) is the client, a browser or mobile app, plus the web server (Nginx or Apache) that serves it; the client reaches the web server over HTTPS; the web server sends HTTP or HTTPS to the app server (Python, Java or Go) in the application tier (tier 2), which uses the database protocol over TCP to reach the database server (PostgreSQL, MySQL or MongoDB) in the data tier (tier 3)">
  <defs>
    <filter id="m03a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m03a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m03a-k1"><rect x="92" y="250" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k2"><rect x="460" y="250" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k3"><rect x="828" y="250" width="320" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k4"><rect x="84" y="700" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k5"><rect x="84" y="880" width="266" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k6"><rect x="518" y="880" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="m03a-k7"><rect x="901" y="880" width="260" height="90" rx="12"/></clipPath>
    <marker id="m03a-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">N-layer vs. N-tier architecture: logical vs. physical separation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Layers separate code inside one server; tiers separate machines that talk over the network.</text>

  <rect x="40" y="120" width="1160" height="440" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">N-layer architecture (logical separation, same machine)</text>
  <rect x="64" y="170" width="1112" height="214" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="88" y="200" font-size="19.5" font-weight="600" fill="#475569">One server (single process)</text>
  <rect x="40" y="590" width="1160" height="460" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="620" font-size="19.5" font-weight="600" fill="#047857">N-tier architecture (physical separation, different machines)</text>
  <rect x="64" y="640" width="310" height="386" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="88" y="670" font-size="19.5" font-weight="600" fill="#1D4ED8">Presentation tier (Tier 1)</text>
  <rect x="505" y="640" width="265" height="386" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="529" y="670" font-size="19.5" font-weight="600" fill="#047857">Application tier (Tier 2)</text>
  <rect x="886" y="640" width="290" height="386" rx="14" fill="#FFFFFF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="910" y="670" font-size="19.5" font-weight="600" fill="#5B21B6">Data tier (Tier 3)</text>

  <g fill="none" stroke-width="2">
    <path d="M412,295 H460" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
    <path d="M780,295 H828" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
    <path d="M988,384 V477 H700" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
    <path d="M110,790 V880" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
    <path d="M350,925 H518" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
    <path d="M758,925 H901" stroke="#2563EB" marker-end="url(#m03a-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="122" y="864" fill="#1D4ED8" text-anchor="start">HTTPS</text>
    <text x="440" y="911" fill="#1D4ED8">HTTP/HTTPS</text>
    <text x="829" y="863" fill="#1D4ED8">Database</text>
    <text x="829" y="887" fill="#1D4ED8">protocol</text>
    <text x="829" y="911" fill="#1D4ED8">(TCP)</text>
  </g>

  <g filter="url(#m03a-soft)">
