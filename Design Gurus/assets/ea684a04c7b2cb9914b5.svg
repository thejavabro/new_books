  <text x="148" y="932" font-size="21.5" font-weight="600" fill="#111827">Web server</text>
  <text x="217" y="999" font-size="18.5" text-anchor="middle" fill="#6B7280">Nginx, Apache</text>
  <g filter="url(#m03a-soft)">
