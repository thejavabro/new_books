  <circle cx="939" cy="925" r="18" fill="#FFFFFF"/>
  <g transform="translate(928.56,914.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="965" y="932" font-size="21.5" font-weight="600" fill="#111827">Database server</text>
  <text x="1031" y="999" font-size="18.5" text-anchor="middle" fill="#6B7280">PostgreSQL, MySQL, MongoDB</text>
  <g stroke="#7C3AED" stroke-width="1.5">
