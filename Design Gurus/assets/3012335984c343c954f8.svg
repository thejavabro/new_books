<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="586" viewBox="0 0 1240 586" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A comparison of a forward proxy and a reverse proxy across five rows: who it works for, where it sits, who knows it is there, whose address is hidden, and the typical jobs.">
  <rect x="0" y="0" width="1240" height="586" fill="#FFFFFF"/>
  <defs>
    <marker id="px3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="px3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="px3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="px3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="px3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="px3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="px3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="px3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="px3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same idea, pointed in two directions</text>
  <g filter="url(#px3-soft)"><rect x="354" y="56" width="426" height="40" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="84" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Forward proxy</text>
  <g filter="url(#px3-soft)"><rect x="790" y="56" width="426" height="40" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="84" font-size="21" font-weight="700" fill="#0F766E" text-anchor="middle">Reverse proxy</text>
  <rect x="24" y="106" width="320" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="46" y="155" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Who it works for</text>
  <g filter="url(#px3-soft)"><rect x="354" y="106" width="426" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="155" font-size="19" fill="#0F172A" text-anchor="middle">The clients</text>
  <g filter="url(#px3-soft)"><rect x="790" y="106" width="426" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="155" font-size="19" fill="#0F172A" text-anchor="middle">The servers</text>
  <rect x="24" y="200" width="320" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="46" y="249" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Where it sits</text>
  <g filter="url(#px3-soft)"><rect x="354" y="200" width="426" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="237" font-size="19" fill="#0F172A" text-anchor="middle">Next to the clients,</text>
  <text x="567" y="265" font-size="19" fill="#0F172A" text-anchor="middle">inside their network</text>
  <g filter="url(#px3-soft)"><rect x="790" y="200" width="426" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="249" font-size="19" fill="#0F172A" text-anchor="middle">In front of the servers</text>
  <rect x="24" y="294" width="320" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="46" y="343" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Who knows it is there</text>
  <g filter="url(#px3-soft)"><rect x="354" y="294" width="426" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="331" font-size="19" fill="#0F172A" text-anchor="middle">The client, which is</text>
  <text x="567" y="359" font-size="19" fill="#0F172A" text-anchor="middle">configured to use it</text>
  <g filter="url(#px3-soft)"><rect x="790" y="294" width="426" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="331" font-size="19" fill="#0F172A" text-anchor="middle">Nobody. The client thinks</text>
  <text x="1003" y="359" font-size="19" fill="#0F172A" text-anchor="middle">it is the real server</text>
  <rect x="24" y="388" width="320" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="46" y="437" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Whose address is hidden</text>
  <g filter="url(#px3-soft)"><rect x="354" y="388" width="426" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="437" font-size="19" fill="#0F172A" text-anchor="middle">The client address</text>
  <g filter="url(#px3-soft)"><rect x="790" y="388" width="426" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="437" font-size="19" fill="#0F172A" text-anchor="middle">The server addresses</text>
  <rect x="24" y="482" width="320" height="84" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="46" y="531" font-size="19" font-weight="600" fill="#0F172A" text-anchor="start">Typical jobs</text>
  <g filter="url(#px3-soft)"><rect x="354" y="482" width="426" height="84" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="1.6"/></g>
  <text x="567" y="519" font-size="19" fill="#0F172A" text-anchor="middle">Filtering, logging,</text>
  <text x="567" y="547" font-size="19" fill="#0F172A" text-anchor="middle">shared caching</text>
  <g filter="url(#px3-soft)"><rect x="790" y="482" width="426" height="84" rx="11" fill="#F0FDFA" stroke="#0D9488" stroke-width="1.6"/></g>
  <text x="1003" y="519" font-size="19" fill="#0F172A" text-anchor="middle">Load balancing, caching,</text>
  <text x="1003" y="547" font-size="19" fill="#0F172A" text-anchor="middle">TLS, routing, rate limits</text>
</svg>