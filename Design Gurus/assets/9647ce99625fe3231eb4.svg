  </g>
  <circle cx="1068" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(1057.56,104.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="1094" y="122" font-size="18.5" font-weight="600" fill="#111827">URL Filter</text>
  <text x="1121" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">blocks domains</text>
  <text x="1121" y="208" font-size="15.5" text-anchor="middle" fill="#6B7280">and traps</text>

  
  <g stroke="#D97706" stroke-width="1.5">
