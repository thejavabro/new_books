  </g>
  <text x="1095" y="745" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Document Store</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M640,906 L640,964 A80,16 0 0 0 800,964 L800,906" fill="#FEF3C7"/>
    <ellipse cx="720" cy="906" rx="80" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="720" y="945" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Checksum Set</text>

  
  <rect x="40" y="1020" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1044" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="1066" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Fetch path</text>
  <text x="288" y="1066" font-size="15.5" fill="#475569">one worker, one URL at a time per hostname</text>
  <rect x="64" y="1088" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="1110" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Dedupe</text>
  <text x="288" y="1110" font-size="15.5" fill="#475569">checksums stop repeat downloads and repeat content</text>
</svg>