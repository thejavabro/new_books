  </g>
  <circle cx="98" cy="735" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,724.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="124" y="742" font-size="18.5" font-weight="600" fill="#111827">DNS Resolver</text>
  <text x="162" y="805" font-size="15.5" text-anchor="middle" fill="#6B7280">local cache; most lookups</text>
  <text x="162" y="828" font-size="15.5" text-anchor="middle" fill="#6B7280">stay in the datacenter</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="660" y="690" width="235" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="660" y="690" width="6" height="90" fill="#D97706" clip-path="url(#wc03-k9)"/>
  </g>
  <circle cx="698" cy="735" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,724.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="724" y="742" font-size="18.5" font-weight="600" fill="#111827">Document De-Dup</text>
  <text x="777" y="805" font-size="15.5" text-anchor="middle" fill="#6B7280">64-bit checksum</text>
  <text x="777" y="828" font-size="15.5" text-anchor="middle" fill="#6B7280">per page</text>

  
  <g stroke="#7C3AED" stroke-width="1.5">
