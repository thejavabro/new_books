  <text x="170" y="125" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Queue files</text>
  <text x="170" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">per-queue disk buffers</text>

  
  <g filter="url(#wc03-lift)">
    <rect x="330" y="70" width="210" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
