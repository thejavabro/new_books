    <ellipse cx="785" cy="246" rx="80" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="785" y="285" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">URL Set</text>
  <text x="785" y="345" font-size="15.5" text-anchor="middle" fill="#6B7280">8-byte checksums, 120 GB</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="50" y="430" width="170" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
