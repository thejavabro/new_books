    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="754" y="122" font-size="18.5" font-weight="600" fill="#111827">URL De-Dup</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="1030" y="70" width="183" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
