<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The web crawler worker loop: the URL frontier feeds the HTML fetcher, pages flow through the document input stream to the dedupe test and the document store, and extracted links pass the URL filter and URL dedupe before returning to the frontier.">
