  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="615" y="106" fill="#1D4ED8">new URLs</text>
    <text x="590" y="285" fill="#1D4ED8">next URL</text>
    <text x="275" y="463" fill="#BE185D">fetch page</text>
    <text x="290" y="585" fill="#047857">resolve host</text>
