  </g>
  <text x="114" y="482" font-size="18.5" font-weight="600" fill="#111827">Internet</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="330" y="430" width="210" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="330" y="430" width="6" height="90" fill="#DB2777" clip-path="url(#wc03-k5)"/>
  </g>
  <circle cx="368" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v11"/>
    <path d="M7 10l5 5 5-5"/>
    <path d="M4.5 20.5h15"/>
  </g>
  <text x="394" y="482" font-size="18.5" font-weight="600" fill="#111827">HTML Fetcher</text>
  <text x="435" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">downloads the page;</text>
  <text x="435" y="568" font-size="15.5" text-anchor="middle" fill="#6B7280">obeys robots.txt</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="660" y="430" width="296" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="660" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#wc03-k6)"/>
  </g>
  <circle cx="698" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(687.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="724" y="482" font-size="18.5" font-weight="600" fill="#111827">Document Input Stream</text>
  <text x="808" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">caches the page so</text>
  <text x="808" y="568" font-size="15.5" text-anchor="middle" fill="#6B7280">modules re-read it free</text>

  
  <g filter="url(#wc03-soft)">
    <rect x="1030" y="430" width="173" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1030" y="430" width="6" height="90" fill="#059669" clip-path="url(#wc03-k7)"/>
  </g>
  <circle cx="1068" cy="475" r="18" fill="#FFFFFF"/>
