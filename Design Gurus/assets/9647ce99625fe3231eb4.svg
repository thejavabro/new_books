  <text x="435" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">the waiting list;</text>
  <text x="435" y="208" font-size="15.5" text-anchor="middle" fill="#6B7280">prioritizes what to crawl next</text>

  
  <g filter="url(#wc03-soft)">
