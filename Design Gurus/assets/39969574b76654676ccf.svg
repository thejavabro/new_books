<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="748" viewBox="0 0 1240 748" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The tokens with one empty slot to start">
<defs>
<filter id="vp-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="748" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Is "5,2,#,#,3,1,#,#,#" a valid preorder serialization?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The tree must not be rebuilt, so count the empty child slots instead</text>
<rect x="40" y="106" width="1160" height="496" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Start with exactly one empty slot: the place the root will go</text>
<text x="133" y="270" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">the tokens</text>
<rect x="157" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="204" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">5</text>
<rect x="261" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="308" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">2</text>
<rect x="365" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="412" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">#</text>
<rect x="469" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="516" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">#</text>
<rect x="573" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">3</text>
<rect x="677" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="724" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">1</text>
<rect x="781" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="828" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">#</text>
<rect x="885" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="932" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">#</text>
<rect x="989" y="232" width="94" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="1036" y="269.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8">#</text>
<rect x="370" y="336" width="500" height="62" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="374.92" text-anchor="middle" font-size="22" font-weight="600" fill="#1D4ED8">empty slots: 1</text>
<rect x="290" y="420" width="660" height="52" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="2.5"/>
<text x="620" y="452.84" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">a real node fills one slot and opens two, and a # fills one and opens none</text>
<text x="620" y="542" text-anchor="middle" font-size="19" font-weight="600" fill="#1D4ED8">Valid means the slots never run out early and end at exactly zero</text>
<rect x="40" y="614" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="654" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Every token fills one slot, and only a real node creates new ones</text>
<text x="620" y="686" text-anchor="middle" font-size="18.5" fill="#475569">So the whole tree can be checked with a single counter</text>
</svg>