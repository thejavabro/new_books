<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="headers-title headers-desc">
<title id="headers-title">Freshness, and how to avoid needing it</title>
<desc id="headers-desc">max-age binds every cache including browsers, s-maxage binds shared caches only, and the two stale directives allow serving an expired copy while refreshing or when the origin fails. A content hash in the filename removes invalidation altogether.</desc>
<defs>
<marker id="headers-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="headers-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="headers-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="headers-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="720" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Freshness, and how to avoid needing it</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The origin tells the CDN what to do through response headers.</text>
<rect x="40" y="642" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="642" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Directive</text>
<text x="414" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Who it binds</text>
<text x="760" y="150" font-size="19" font-weight="700" fill="#4A5568" text-anchor="start">Why it matters</text>
<rect x="40" y="168" width="330" height="52" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="205" y="200" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">max-age</text>
<rect x="394" y="168" width="806" height="52" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="414" y="201" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every cache, browsers included</text>
<text x="760" y="201" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">a long value here cannot be taken back</text>
<rect x="40" y="230" width="330" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="205" y="262" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">s-maxage</text>
<rect x="394" y="230" width="806" height="52" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="414" y="263" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">shared caches only</text>
<text x="760" y="263" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">long for the CDN, short for the browser</text>
<rect x="40" y="292" width="330" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="205" y="324" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">stale-while-revalidate</text>
<rect x="394" y="292" width="806" height="52" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="414" y="325" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">any cache that implements it</text>
<text x="760" y="325" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">serve the old copy while refreshing</text>
<rect x="40" y="354" width="330" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="205" y="386" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">stale-if-error</text>
<rect x="394" y="354" width="806" height="52" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="414" y="387" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">any cache that implements it</text>
<text x="760" y="387" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">an origin outage becomes stale pages</text>
<rect x="40" y="416" width="330" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="205" y="448" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no-store</text>
<rect x="394" y="416" width="806" height="52" rx="12" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/>
<text x="414" y="449" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every cache</text>
<text x="760" y="449" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">for anything never to be written down</text>
<text x="40" y="506" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Or remove the problem instead of managing it</text>
<rect x="40" y="524" width="340" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="210" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">app.4f9c2a.js</text>
<path d="M386 552H444" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M386 552H444" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#headers-marker-slate)"/>
<rect x="450" y="524" width="340" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">immutable, one year</text>
<path d="M796 552H854" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M796 552H854" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#headers-marker-slate)"/>
<rect x="860" y="524" width="340" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="1030" y="558" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">never needs purging</text>
<text x="620" y="610" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Changing the content changes the name, so the old entry is simply never requested again.</text>
<text x="66" y="676" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Static assets are a solved problem because they can be renamed. A page at a stable address cannot.</text>
</svg>