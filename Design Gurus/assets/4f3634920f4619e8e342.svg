<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="978" viewBox="0 0 1240 978" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What each success status commits, for four different write shapes: a synchronous update commits the whole change, a partial-success batch commits only that every item has a result, an accepted job commits durable acceptance, and a created payment may still be pending.">
  <defs>
    <marker id="p1q-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p1q-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p1q-k1"><rect x="76" y="146" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1q-k2"><rect x="76" y="326" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1q-k3"><rect x="76" y="506" width="400" height="90" rx="12"/></clipPath>
    <clipPath id="p1q-k4"><rect x="76" y="686" width="400" height="90" rx="12"/></clipPath>

    <clipPath id="p1q-s1"><rect x="528" y="167" width="100" height="48" rx="10"/></clipPath>
    <clipPath id="p1q-s2"><rect x="528" y="347" width="100" height="48" rx="10"/></clipPath>
    <clipPath id="p1q-s3"><rect x="528" y="527" width="100" height="48" rx="10"/></clipPath>
    <clipPath id="p1q-s4"><rect x="528" y="707" width="100" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="978" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Say what each success actually commits</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">every row: the write shape, its status, and what that status commits</text>

  
  <rect x="40" y="126" width="1160" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M484,191 H528" marker-end="url(#p1q-em)"/>
  </g>
  <g filter="url(#p1q-soft)">
    <rect x="76" y="146" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#2563EB" clip-path="url(#p1q-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">Synchronous update</text>
  <g filter="url(#p1q-soft)">
    <rect x="528" y="167" width="100" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="528" y="167" width="6" height="48" fill="#059669" clip-path="url(#p1q-s1)"/>
  </g>
  <circle cx="556" cy="191" r="4.5" fill="#059669"/>
  <text x="574" y="198" font-size="18.5" font-weight="600" fill="#111827">200</text>
  <text x="78" y="268" font-size="15.5" fill="#6B7280">Validation passed and the complete change was committed. There is no half-applied field set.</text>

  
  <rect x="40" y="306" width="1160" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M484,371 H528" marker-end="url(#p1q-em)"/>
  </g>
  <g filter="url(#p1q-soft)">
    <rect x="76" y="326" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="326" width="6" height="90" fill="#2563EB" clip-path="url(#p1q-k2)"/>
  </g>
  <circle cx="114" cy="371" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,360.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="140" y="378" font-size="18.5" font-weight="600" fill="#111827">Partial-success batch</text>
  <g filter="url(#p1q-soft)">
    <rect x="528" y="347" width="100" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="528" y="347" width="6" height="48" fill="#059669" clip-path="url(#p1q-s2)"/>
  </g>
  <circle cx="556" cy="371" r="4.5" fill="#059669"/>
  <text x="574" y="378" font-size="18.5" font-weight="600" fill="#111827">200</text>
  <text x="78" y="448" font-size="15.5" fill="#6B7280">Only that the batch was processed. Every entry in results must still be checked.</text>

  
  <rect x="40" y="486" width="1160" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M484,551 H528" marker-end="url(#p1q-em)"/>
  </g>
  <g filter="url(#p1q-soft)">
    <rect x="76" y="506" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="506" width="6" height="90" fill="#2563EB" clip-path="url(#p1q-k3)"/>
  </g>
  <circle cx="114" cy="551" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,540.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="558" font-size="18.5" font-weight="600" fill="#111827">Asynchronous job</text>
  <g filter="url(#p1q-soft)">
    <rect x="528" y="527" width="100" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="528" y="527" width="6" height="48" fill="#059669" clip-path="url(#p1q-s3)"/>
  </g>
  <circle cx="556" cy="551" r="4.5" fill="#059669"/>
  <text x="574" y="558" font-size="18.5" font-weight="600" fill="#111827">202</text>
  <text x="78" y="628" font-size="15.5" fill="#6B7280">Only that one job was durably accepted, not that its work succeeded.</text>

  
  <rect x="40" y="666" width="1160" height="164" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M484,731 H528" marker-end="url(#p1q-em)"/>
  </g>
  <g filter="url(#p1q-soft)">
    <rect x="76" y="686" width="400" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="76" y="686" width="6" height="90" fill="#2563EB" clip-path="url(#p1q-k4)"/>
  </g>
  <circle cx="114" cy="731" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,720.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="738" font-size="18.5" font-weight="600" fill="#111827">Payment create</text>
  <g filter="url(#p1q-soft)">
    <rect x="528" y="707" width="100" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="528" y="707" width="6" height="48" fill="#059669" clip-path="url(#p1q-s4)"/>
  </g>
  <circle cx="556" cy="731" r="4.5" fill="#059669"/>
  <text x="574" y="738" font-size="18.5" font-weight="600" fill="#111827">201</text>
  <text x="78" y="808" font-size="15.5" fill="#6B7280">A durable payment exists. It may still be pending, and the API never guesses.</text>

  
  <rect x="40" y="862" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="907" text-anchor="middle" font-size="16" fill="#475569">Do not turn unknown into failed to look final. A false failure makes callers repeat real work.</text>
</svg>