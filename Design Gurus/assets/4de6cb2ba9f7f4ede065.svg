<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="882" viewBox="0 0 1240 882" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="ranking-title ranking-desc">
<title id="ranking-title">Decide what degrades, before</title>
<desc id="ranking-desc">A ranking of features by what the product is for, made in advance by somebody who knew which parts matter. Made during an incident under pressure, it is a guess.</desc>
<defs>
<marker id="ranking-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="ranking-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="ranking-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="ranking-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="882" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Decide what degrades, before</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Degradation only works if the decision about what to drop was made in advance.</text>
<rect x="40" y="804" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="804" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="840" y="140" font-size="19" font-weight="400" fill="#8795A5" text-anchor="start">what survives</text>
<rect x="40" y="152" width="330" height="62" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="205" y="189" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The core transaction</text>
<rect x="390" y="152" width="420" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="176.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">place the order, send the message,</text><text x="410" y="201.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">play the video</text>
<rect x="840" y="157" width="250" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="157" width="250.0" height="26" rx="10" fill="#F25461"/>
<text x="840" y="204" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never degrades</text>
<rect x="40" y="224" width="330" height="62" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="205" y="261" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Things that improve it</text>
<rect x="390" y="224" width="420" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="248.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">recommendations, personalization,</text><text x="410" y="273.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rich previews</text>
<rect x="840" y="229" width="250" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="229" width="175.0" height="26" rx="10" fill="#E8BC60"/>
<text x="840" y="276" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">degrade to static or empty</text>
<rect x="40" y="296" width="330" height="62" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="205" y="333" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Things that are adjacent</text>
<rect x="390" y="296" width="420" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">activity feeds, badges, counts,</text><text x="410" y="345.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">suggestions</text>
<rect x="840" y="301" width="250" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="301" width="100.0" height="26" rx="10" fill="#159BEF"/>
<text x="840" y="348" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">disappear entirely</text>
<rect x="40" y="368" width="330" height="62" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="205" y="405" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Things that are internal</text>
<rect x="390" y="368" width="420" height="62" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="392.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">analytics enrichment,</text><text x="410" y="417.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">non-urgent writes</text>
<rect x="840" y="373" width="250" height="26" rx="10" fill="#FFFFFF" stroke="#5EC9EC" stroke-width="2"/><rect x="840" y="373" width="37.5" height="26" rx="10" fill="#06AC80"/>
<text x="840" y="420" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stop first</text>
<rect x="40" y="450" width="1160" height="56" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="450" width="5" height="56" rx="2.5" fill="#AC8BE8"/><text x="64" y="484" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Writing that list is a product conversation, not an engineering one</text>
<rect x="40" y="528" width="480" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="561" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A stale cache beats no answer</text>
<path d="M526 555H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 555H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ranking-marker-green)"/>
<rect x="570" y="528" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="561" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">say the staleness bound out loud</text>
<rect x="40" y="588" width="480" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="621" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A cheap default replaces a computation</text>
<path d="M526 615H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 615H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ranking-marker-green)"/>
<rect x="570" y="588" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="621" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">personalized ranking becomes popular ranking</text>
<rect x="40" y="648" width="480" height="54" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="681" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A write becomes asynchronous</text>
<path d="M526 675H560" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 675H560" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ranking-marker-green)"/>
<rect x="570" y="648" width="630" height="54" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="681" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">turns a capacity problem into a latency problem</text>
<rect x="40" y="722" width="1160" height="56" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="722" width="5" height="56" rx="2.5" fill="#F28B9D"/><text x="64" y="756" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A fallback that has never run in production will fail the first time it matters.</text>
<text x="66" y="838" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Degradation has to be a switch somebody can throw, not a path that triggers under untested conditions.</text>
</svg>