<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="390" viewBox="0 0 1240 390" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends its full allowance at the end of one window and again at the start of the next, so twice the limit gets through in a few seconds">
  <rect x="0" y="0" width="1240" height="390" fill="#FFFFFF"/>
  <defs>
    <filter id="rl5-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <g transform="translate(0,-60)">

  <rect x="80" y="140" width="520" height="180" rx="12" fill="#F1F5F9" fill-opacity="0.7" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <rect x="620" y="140" width="520" height="180" rx="12" fill="#F1F5F9" fill-opacity="0.7" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>

  <text x="340" y="175" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Window 1: 100 requests</text>
  <text x="880" y="175" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">Window 2: 100 requests</text>
  <text x="270" y="290" font-size="20" fill="#64748B" text-anchor="middle">within the limit</text>
  <text x="950" y="290" font-size="20" fill="#64748B" text-anchor="middle">within the limit</text>

  <g filter="url(#rl5-soft)">
    <rect x="520" y="200" width="70" height="110" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
    <rect x="630" y="200" width="70" height="110" rx="6" fill="#FDE68A" stroke="#D97706" stroke-width="1.8"/>
  </g>
  <text x="555" y="190" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">100</text>
  <text x="665" y="190" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">100</text>

  <line x1="60" y1="336" x2="1180" y2="336" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="328" x2="80" y2="344" stroke="#475569" stroke-width="2"/>
  <line x1="620" y1="328" x2="620" y2="344" stroke="#475569" stroke-width="2"/>
  <line x1="1140" y1="328" x2="1140" y2="344" stroke="#475569" stroke-width="2"/>
  <text x="80" y="366" font-size="20" fill="#475569" text-anchor="middle">12:00</text>
  <text x="620" y="366" font-size="20" fill="#475569" text-anchor="middle">12:01</text>
  <text x="1140" y="366" font-size="20" fill="#475569" text-anchor="middle">12:02</text>

  <line x1="520" y1="392" x2="700" y2="392" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="520" y1="384" x2="520" y2="400" stroke="#DC2626" stroke-width="2.5"/>
  <line x1="700" y1="384" x2="700" y2="400" stroke="#DC2626" stroke-width="2.5"/>
  <text x="610" y="428" font-size="20" font-weight="700" fill="#DC2626" text-anchor="middle">200 requests in about 2 seconds</text>
  </g>
</svg>