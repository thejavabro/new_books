<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="752" viewBox="0 0 1240 752" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="nosecret-title nosecret-desc">
<title id="nosecret-title">The secret you do not have</title>
<desc id="nosecret-desc">Workload identity, short-lived tokens and asymmetric keys all remove the stored secret rather than protecting it, and all three are frequently available and unused.</desc>
<defs>
<marker id="nosecret-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="nosecret-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="nosecret-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="nosecret-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="752" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The secret you do not have</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The pattern across all three is the same.</text>
<rect x="40" y="674" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="674" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="400" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="240" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Workload identity</text>
<path d="M446 148H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 148H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nosecret-marker-slate)"/>
<rect x="490" y="118" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="141.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the platform issues short-lived credentials</text><text x="510" y="166.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">automatically, with nothing stored</text>
<rect x="40" y="190" width="400" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="240" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Short-lived tokens</text>
<path d="M446 220H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 220H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nosecret-marker-slate)"/>
<rect x="490" y="190" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="226" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">valid for an hour, so the blast radius is bounded by an hour</text>
<rect x="40" y="262" width="400" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="240" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Asymmetric keys</text>
<path d="M446 292H480" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M446 292H480" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#nosecret-marker-slate)"/>
<rect x="490" y="262" width="710" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="510" y="298" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">only the public half travels, so no shared secret exists to leak</text>
<rect x="40" y="346" width="560" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="346" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="64" y="379" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">long-lived shared secret</text><text x="64" y="405" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">stored, copied, rotated by hand, leaks forever</text>
<rect x="640" y="346" width="560" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="346" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="664" y="379" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">short-lived issued token</text><text x="664" y="405" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not stored, expires, and a leak has a deadline</text>
<rect x="40" y="450" width="1160" height="100" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="450" width="5" height="100" rx="2.5" fill="#39D5AA"/><text x="64" y="491.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The best-protected credential is the one that does not exist</text><text x="64" y="520.5" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">and in several common cases it does not need to.</text>
<rect x="40" y="574" width="1160" height="74" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="574" width="5" height="74" rx="2.5" fill="#F3CF6A"/><text x="64" y="617" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Where a long-lived secret is genuinely required, it should be an exception you can name.</text>
<text x="66" y="708" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">There is nothing to leak, rotate, or accidentally commit.</text>
</svg>