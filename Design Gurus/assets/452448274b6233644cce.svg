<text x="883" y="246" font-size="18.5" font-weight="600" fill="#111827">Each cell is one stretch</text>
<text x="883" y="276" font-size="18.5" font-weight="400" fill="#475569">Row is where it starts,</text>
<text x="883" y="306" font-size="18.5" font-weight="400" fill="#475569">column is where it ends.</text>
<text x="883" y="336" font-size="18.5" font-weight="400" fill="#475569"></text>
<text x="883" y="366" font-size="18.5" font-weight="400" fill="#475569">The table is filled by</text>
<text x="883" y="396" font-size="18.5" font-weight="400" fill="#475569">stretch length, shortest</text>
<text x="883" y="426" font-size="18.5" font-weight="400" fill="#475569">first, so the answer a</text>
<text x="883" y="456" font-size="18.5" font-weight="400" fill="#475569">longer stretch needs is</text>
<text x="883" y="486" font-size="18.5" font-weight="400" fill="#475569">already there.</text>
<rect x="40" y="670" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="710" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">A long stretch is a palindrome only if the one inside it is</text>
<text x="620" y="742" text-anchor="middle" font-size="18.5" fill="#475569">That is why the shorter answers have to be written down before the longer ones are asked</text>
</svg>