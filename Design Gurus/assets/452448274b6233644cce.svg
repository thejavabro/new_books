<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">How many stretches of "abdbca" read the same both ways?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The cell at row i and column j answers one question: is the stretch from i to j a palindrome?</text>
