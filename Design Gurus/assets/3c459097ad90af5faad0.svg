  <text x="764" y="122" font-size="18.5" font-weight="600" fill="#111827">One shared feature path</text>
  <text x="869" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">shared definitions and consistency tests</text>
  <g filter="url(#m2l1c-soft)">
