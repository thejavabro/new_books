  <g transform="translate(87.56,104.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
  <text x="124" y="122" font-size="18.5" font-weight="600" fill="#111827">Different code paths</text>
  <text x="203" y="185" font-size="15.5" text-anchor="middle" fill="#6B7280">trained in Spark, served in Java</text>
