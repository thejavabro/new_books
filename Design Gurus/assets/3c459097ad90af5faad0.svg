  <text x="764" y="272" font-size="18.5" font-weight="600" fill="#111827">Point-in-time joins</text>
  <text x="869" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">each example sees only the past</text>
  <g filter="url(#m2l1c-soft)">
    <rect x="60" y="370" width="286" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="60" y="370" width="6" height="90" fill="#D97706" clip-path="url(#m2l1c-k5)"/>
