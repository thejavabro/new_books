    </filter>
    <clipPath id="m2l1c-k1"><rect x="60" y="70" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1c-k2"><rect x="700" y="70" width="338" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1c-k3"><rect x="60" y="220" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1c-k4"><rect x="700" y="220" width="338" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1c-k5"><rect x="60" y="370" width="286" height="90" rx="12"/></clipPath>
    <clipPath id="m2l1c-k6"><rect x="700" y="370" width="338" height="90" rx="12"/></clipPath>
