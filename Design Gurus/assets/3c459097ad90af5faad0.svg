  <circle cx="738" cy="415" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,404.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="764" y="422" font-size="18.5" font-weight="600" fill="#111827">Monitor and investigate</text>
  <text x="869" y="485" font-size="15.5" text-anchor="middle" fill="#6B7280">check impact before updating</text>
  <rect x="40" y="525" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="570" text-anchor="middle" font-size="16" fill="#475569">Test feature consistency and timing. Investigate distribution changes before updating the model.</text>
