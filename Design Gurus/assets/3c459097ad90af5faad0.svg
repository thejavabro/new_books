  <g transform="translate(87.56,404.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="124" y="422" font-size="18.5" font-weight="600" fill="#111827">Distribution shift</text>
  <text x="203" y="485" font-size="15.5" text-anchor="middle" fill="#6B7280">last month's data, this month's users</text>
  <g filter="url(#m2l1c-soft)">
    <rect x="700" y="370" width="338" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="700" y="370" width="6" height="90" fill="#64748B" clip-path="url(#m2l1c-k6)"/>
