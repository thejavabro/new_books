  <g fill="none" stroke="#059669" stroke-width="2"><path d="M346,265 L700,265" marker-end="url(#m2l1c-memerald)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M346,415 L700,415" marker-end="url(#m2l1c-mslate)"/></g>
  <text x="203" y="44" font-size="16.5" font-weight="600" text-anchor="middle" fill="#BE185D">Three sources of skew</text>
  <text x="869" y="44" font-size="16.5" font-weight="600" text-anchor="middle" fill="#047857">What fixes it</text>
