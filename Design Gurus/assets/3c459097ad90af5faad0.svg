  <text x="124" y="272" font-size="18.5" font-weight="600" fill="#111827">Information leakage</text>
  <text x="203" y="335" font-size="15.5" text-anchor="middle" fill="#6B7280">feature uses unavailable information</text>
  <g filter="url(#m2l1c-soft)">
