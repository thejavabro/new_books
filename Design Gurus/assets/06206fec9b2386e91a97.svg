<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="High-level Twitter search design: a client sends a search to the application server, which first finds matching TweetIDs in the in-memory inverted index and then fetches those tweets from the tweet database.">
  <defs>
    <marker id="ts02-mb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="ts02-mv" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="ts02-ma" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>

    <filter id="ts02-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ts02-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="ts02-k1"><rect x="80" y="70" width="170" height="90" rx="12"/></clipPath>
    <clipPath id="ts02-k2"><rect x="480" y="70" width="265" height="90" rx="12"/></clipPath>
    <clipPath id="ts02-k3"><rect x="250" y="320" width="230" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <g fill="none" stroke="#2563EB" stroke-width="2">
    <path d="M250,115 H480" marker-end="url(#ts02-mb)"/>
  </g>
  <g fill="none" stroke="#7C3AED" stroke-width="2.5">
    <path d="M540,160 V230 Q540,242 528,242 H377 Q365,242 365,254 V320" marker-end="url(#ts02-mv)"/>
  </g>
  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M680,160 V270 Q680,282 692,282 H868 Q880,282 880,294 V304" marker-end="url(#ts02-ma)"/>
  </g>

  
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="365" y="106" fill="#1D4ED8">search</text>
    <text x="452" y="234" fill="#5B21B6">1. find matching TweetIDs</text>
    <text x="770" y="274" fill="#B45309">2. fetch those tweets</text>
  </g>

  
  <g filter="url(#ts02-soft)">
    <rect x="80" y="70" width="170" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="80" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#ts02-k1)"/>
  </g>
  <circle cx="118" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="144" y="122" font-size="18.5" font-weight="600" fill="#111827">Client</text>

  
  <g filter="url(#ts02-soft)">
    <rect x="480" y="70" width="265" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="480" y="70" width="6" height="90" fill="#2563EB" clip-path="url(#ts02-k2)"/>
  </g>
  <circle cx="518" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(507.56,104.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="4.5" width="15" height="15" rx="2"/>
    <rect x="9.5" y="9.5" width="5" height="5"/>
    <path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/>
  </g>
  <text x="544" y="122" font-size="18.5" font-weight="600" fill="#111827">Application Server</text>

  
  <g filter="url(#ts02-lift)">
    <rect x="250" y="320" width="230" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="250" y="320" width="9" height="90" fill="#7C3AED" clip-path="url(#ts02-k3)"/>
  </g>
  <circle cx="288" cy="365" r="18" fill="#FFFFFF"/>
  <g transform="translate(277.56,354.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="314" y="372" font-size="18.5" font-weight="600" fill="#111827">Inverted Index</text>
  <text x="365" y="435" font-size="15.5" text-anchor="middle" fill="#6B7280">word -&gt; TweetIDs; lives in memory</text>

  
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M760,320 L760,430 A120,16 0 0 0 1000,430 L1000,320" fill="#FEF3C7"/>
    <ellipse cx="880" cy="320" rx="120" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="880" y="385" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Tweet Database</text>
  <text x="880" y="475" font-size="15.5" text-anchor="middle" fill="#6B7280">the tweet text, partitioned by TweetID</text>

  
  <rect x="40" y="530" width="1160" height="64" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="568" text-anchor="middle" font-size="16" fill="#475569">A search reads the index first, then fetches the matching tweets from the database.</text>
</svg>