<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six steps in sequence over two rows. 1, name the target: one main requirement, a scope and what counts as a finding. 2, read: diagrams, decision records, table owners and workflow code. 3, measure: cycles, cross-boundary writes, change coupling and traces. 4, ask: module owners about specific recent events. 5, rank: by effect on the target, then by cost to fix. 6, recommend: the shortest list that meets the target.">
  <defs>
    <filter id="md03a-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md03a-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="md03a-k1"><rect x="40" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md03a-k2"><rect x="450" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md03a-k3"><rect x="860" y="130" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md03a-k4"><rect x="40" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md03a-k5"><rect x="450" y="355" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="md03a-k6"><rect x="860" y="355" width="340" height="90" rx="12"/></clipPath>
    <marker id="md03a-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="md03a-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The six steps of an architecture review</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every step serves one measurable main requirement, and the output is one recommendation.</text>



  <g fill="none" stroke-width="2">
    <path d="M380,175 H450" stroke="#64748B" marker-end="url(#md03a-m-slate)"/>
    <path d="M790,175 H860" stroke="#64748B" marker-end="url(#md03a-m-slate)"/>
    <path d="M1200,175 H1212 Q1224,175 1224,187 V313 Q1224,325 1212,325 H222 Q210,325 210,337 V355" stroke="#64748B" marker-end="url(#md03a-m-slate)"/>
    <path d="M380,400 H450" stroke="#64748B" marker-end="url(#md03a-m-slate)"/>
    <path d="M790,400 H860" stroke="#059669" stroke-width="2.5" marker-end="url(#md03a-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#md03a-soft)">
    <rect x="40" y="130" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="130" width="6" height="90" fill="#2563EB" clip-path="url(#md03a-k1)"/>
  </g>
  <circle cx="78" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,164.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="104" y="182" font-size="21.5" font-weight="600" fill="#111827">1. Name the target</text>
  <text x="210" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">one main requirement, a scope</text>
  <text x="210" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">and what counts as a finding</text>
  <g filter="url(#md03a-soft)">
    <rect x="450" y="130" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="130" width="6" height="90" fill="#4F46E5" clip-path="url(#md03a-k2)"/>
  </g>
  <circle cx="488" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,164.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="514" y="182" font-size="21.5" font-weight="600" fill="#111827">2. Read</text>
  <text x="620" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">diagrams, decision records,</text>
  <text x="620" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">table owners, workflow code</text>
  <g filter="url(#md03a-soft)">
    <rect x="860" y="130" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="860" y="130" width="6" height="90" fill="#7C3AED" clip-path="url(#md03a-k3)"/>
  </g>
  <circle cx="898" cy="175" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,164.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="924" y="182" font-size="21.5" font-weight="600" fill="#111827">3. Measure</text>
  <text x="1030" y="249" font-size="18.5" text-anchor="middle" fill="#6B7280">cycles, cross-boundary writes,</text>
  <text x="1030" y="276" font-size="18.5" text-anchor="middle" fill="#94A3B8">change coupling, traces</text>
  <g filter="url(#md03a-soft)">
    <rect x="40" y="355" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="40" y="355" width="6" height="90" fill="#D97706" clip-path="url(#md03a-k4)"/>
  </g>
  <circle cx="78" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,389.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a5 5 0 0 1 3.5 4.8V20"/></g>
  <text x="104" y="407" font-size="21.5" font-weight="600" fill="#111827">4. Ask</text>
  <text x="210" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">module owners about</text>
  <text x="210" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">specific recent events</text>
  <g filter="url(#md03a-soft)">
    <rect x="450" y="355" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="450" y="355" width="6" height="90" fill="#64748B" clip-path="url(#md03a-k5)"/>
  </g>
  <circle cx="488" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,389.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="514" y="407" font-size="21.5" font-weight="600" fill="#111827">5. Rank</text>
  <text x="620" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">by effect on the target,</text>
  <text x="620" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">then by cost to fix</text>
  <g filter="url(#md03a-lift)">
    <rect x="860" y="355" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="860" y="355" width="9" height="90" fill="#059669" clip-path="url(#md03a-k6)"/>
  </g>
  <circle cx="898" cy="400" r="18" fill="#FFFFFF"/>
  <g transform="translate(887.56,389.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="924" y="407" font-size="21.5" font-weight="600" fill="#111827">6. Recommend</text>
  <text x="1030" y="474" font-size="18.5" text-anchor="middle" fill="#6B7280">the shortest list that</text>
  <text x="1030" y="501" font-size="18.5" text-anchor="middle" fill="#94A3B8">meets the target</text>




</svg>