<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="842" viewBox="0 0 1240 842" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six hard parts of the URL shortener answer, each with the decision taken and the caller-visible reason behind it: the redirect code, what counts as a click, alias generation, expiration and deletion, ownership and limits, and compatibility.">
  <defs>
    <filter id="yl07hardpar-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="yl07hardpar-k1"><rect x="84" y="146" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07hardpar-k2"><rect x="84" y="342" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07hardpar-k3"><rect x="84" y="538" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07hardpar-k4"><rect x="684" y="146" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07hardpar-k5"><rect x="684" y="342" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="yl07hardpar-k6"><rect x="684" y="538" width="300" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="842" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six hard parts, six caller-visible decisions</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the decision taken, then the reason the caller can see</text>

  
  <rect x="40" y="126" width="556" height="180" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="84" y="146" width="300" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="146" width="6" height="90" fill="#D97706" clip-path="url(#yl07hardpar-k1)"/>
  </g>
  <circle cx="122" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,180.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="148" y="198" font-size="18.5" font-weight="600" fill="#111827">Redirect code</text>
  <circle cx="94" cy="257" r="3.5" fill="#D97706"/>
  <text x="112" y="262" font-size="15.5" fill="#6B7280">302 with Cache-Control: no-store</text>
  <circle cx="94" cy="283" r="3.5" fill="#D97706"/>
  <text x="112" y="288" font-size="15.5" fill="#94A3B8">avoid cached redirects so requests reach the service</text>

  
  <rect x="40" y="322" width="556" height="180" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="84" y="342" width="300" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="84" y="342" width="6" height="90" fill="#7C3AED" clip-path="url(#yl07hardpar-k2)"/>
  </g>
  <circle cx="122" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,376.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="148" y="394" font-size="18.5" font-weight="600" fill="#111827">What counts as a click</text>
  <circle cx="94" cy="453" r="3.5" fill="#7C3AED"/>
  <text x="112" y="458" font-size="15.5" fill="#6B7280">a valid redirect for an active link</text>
  <circle cx="94" cy="479" r="3.5" fill="#7C3AED"/>
  <text x="112" y="484" font-size="15.5" fill="#94A3B8">repeats, previews, and bots all count, not unique humans</text>

  
  <rect x="40" y="518" width="556" height="180" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="84" y="538" width="300" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="84" y="538" width="6" height="90" fill="#2563EB" clip-path="url(#yl07hardpar-k3)"/>
  </g>
  <circle cx="122" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,572.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="148" y="590" font-size="18.5" font-weight="600" fill="#111827">Alias generation</text>
  <circle cx="94" cy="649" r="3.5" fill="#2563EB"/>
  <text x="112" y="654" font-size="15.5" fill="#6B7280">server-generated, or a checked custom alias</text>
  <circle cx="94" cy="675" r="3.5" fill="#2563EB"/>
  <text x="112" y="680" font-size="15.5" fill="#94A3B8">conflicts return 409, and aliases are never reused</text>

  
  <rect x="644" y="126" width="556" height="180" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="684" y="146" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="684" y="146" width="6" height="90" fill="#DB2777" clip-path="url(#yl07hardpar-k4)"/>
  </g>
  <circle cx="722" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,180.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="748" y="198" font-size="18.5" font-weight="600" fill="#111827">Expiration and deletion</text>
  <circle cx="694" cy="257" r="3.5" fill="#DB2777"/>
  <text x="712" y="262" font-size="15.5" fill="#6B7280">both stop the redirect</text>
  <circle cx="694" cy="283" r="3.5" fill="#DB2777"/>
  <text x="712" y="288" font-size="15.5" fill="#94A3B8">an expired or deleted alias is gone, not recycled</text>

  
  <rect x="644" y="322" width="556" height="180" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="684" y="342" width="300" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="342" width="6" height="90" fill="#059669" clip-path="url(#yl07hardpar-k5)"/>
  </g>
  <circle cx="722" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="748" y="394" font-size="18.5" font-weight="600" fill="#111827">Ownership and limits</text>
  <circle cx="694" cy="453" r="3.5" fill="#059669"/>
  <text x="712" y="458" font-size="15.5" fill="#6B7280">creation is authenticated and scoped</text>
  <circle cx="694" cy="479" r="3.5" fill="#059669"/>
  <text x="712" y="484" font-size="15.5" fill="#94A3B8">per-caller quotas, 429 with Retry-After</text>

  
  <rect x="644" y="518" width="556" height="180" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <g filter="url(#yl07hardpar-soft)">
    <rect x="684" y="538" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="538" width="6" height="90" fill="#64748B" clip-path="url(#yl07hardpar-k6)"/>
  </g>
  <circle cx="722" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,572.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="748" y="590" font-size="18.5" font-weight="600" fill="#111827">Compatibility</text>
  <circle cx="694" cy="649" r="3.5" fill="#64748B"/>
  <text x="712" y="654" font-size="15.5" fill="#6B7280">new response fields stay additive</text>
  <circle cx="694" cy="675" r="3.5" fill="#64748B"/>
  <text x="712" y="680" font-size="15.5" fill="#94A3B8">callers ignore what they do not recognize</text>

  
  <rect x="40" y="726" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="771" text-anchor="middle" font-size="16" fill="#475569">Each one names what the caller observes, not how the server is built.</text>
</svg>