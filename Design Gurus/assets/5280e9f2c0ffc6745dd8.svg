<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Cookie-based sessions: the browser sends a request with a session ID cookie to the application server, the server looks up the session data in a shared session store such as Redis, gets the session data back, and sends the response. JWT authentication: the browser sends a request with a JWT in the header, the application server itself verifies the signature with the public key and extracts the user info, with no lookup in any store, and sends the response">
  <defs>
    <filter id="m04g-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m04g-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m04g-k1"><rect x="64" y="230" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m04g-k2"><rect x="510" y="230" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m04g-k3"><rect x="64" y="790" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="m04g-k4"><rect x="510" y="790" width="666" height="90" rx="12"/></clipPath>
    <marker id="m04g-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m04g-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m04g-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1180" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Cookie-based sessions vs. JWT authentication</text>


  <rect x="40" y="120" width="1160" height="520" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Cookie-based sessions</text>
  <rect x="40" y="680" width="1160" height="460" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="710" font-size="19.5" font-weight="600" fill="#4338CA">JWT authentication</text>

  <g fill="none" stroke-width="2">
    <path d="M284,260 H510" stroke="#2563EB" marker-end="url(#m04g-m-blue)"/>
    <path d="M510,294 H284" stroke="#059669" marker-end="url(#m04g-m-emerald)"/>
    <path d="M730,260 H976" stroke="#2563EB" marker-end="url(#m04g-m-blue)"/>
    <path d="M976,294 H730" stroke="#059669" marker-end="url(#m04g-m-emerald)"/>
    <path d="M284,820 H510" stroke="#2563EB" marker-end="url(#m04g-m-blue)"/>
    <path d="M510,854 H284" stroke="#059669" marker-end="url(#m04g-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="397" y="224" fill="#1D4ED8">1. Request +</text>
    <text x="397" y="247" fill="#1D4ED8">session ID (cookie)</text>
    <text x="397" y="320" fill="#047857">4. Response</text>
    <text x="853" y="224" fill="#1D4ED8">2. Look up</text>
    <text x="853" y="247" fill="#1D4ED8">session data</text>
    <text x="853" y="320" fill="#047857">3. Session data</text>
    <text x="397" y="784" fill="#1D4ED8">1. Request + JWT</text>
    <text x="397" y="807" fill="#1D4ED8">(in header)</text>
    <text x="397" y="880" fill="#047857">3. Response</text>
  </g>

  <g filter="url(#m04g-soft)">
    <rect x="64" y="230" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="230" width="6" height="90" fill="#64748B" clip-path="url(#m04g-k1)"/>
  </g>
  <circle cx="102" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,264.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="128" y="282" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="174" y="349" font-size="18.5" text-anchor="middle" fill="#6B7280">browser</text>
  <g filter="url(#m04g-soft)">
    <rect x="510" y="230" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="510" y="230" width="6" height="90" fill="#2563EB" clip-path="url(#m04g-k2)"/>
  </g>
  <circle cx="548" cy="275" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,264.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="574" y="269.25" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="574" y="294.75" font-size="21.5" font-weight="600" fill="#111827">server</text>
  <g filter="url(#m04g-soft)">
    <rect x="64" y="790" width="220" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="790" width="6" height="90" fill="#64748B" clip-path="url(#m04g-k3)"/>
  </g>
  <circle cx="102" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,824.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="128" y="842" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <text x="174" y="909" font-size="18.5" text-anchor="middle" fill="#6B7280">browser</text>
  <g filter="url(#m04g-soft)">
    <rect x="510" y="790" width="666" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="510" y="790" width="6" height="90" fill="#2563EB" clip-path="url(#m04g-k4)"/>
  </g>
  <circle cx="548" cy="835" r="18" fill="#FFFFFF"/>
  <g transform="translate(537.56,824.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="574" y="829.25" font-size="21.5" font-weight="600" fill="#111827">Application</text>
  <text x="574" y="854.75" font-size="21.5" font-weight="600" fill="#111827">server</text>
  <circle cx="764" cy="835" r="14" fill="#4F46E5"/>
  <text x="764" y="841" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="790" y="829.25" font-size="18.5" fill="#1F2937">Verifies the signature with</text>
  <text x="790" y="854.75" font-size="18.5" fill="#1F2937">the public key, no lookup</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M976,234 L976,314 A90,16 0 0 0 1156,314 L1156,234" fill="#DBEAFE"/>
    <ellipse cx="1066" cy="234" rx="90" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1066" y="276.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared session</text>
  <text x="1066" y="301.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">store</text>
  <text x="1066" y="364" font-size="18.5" text-anchor="middle" fill="#6B7280">for example, Redis</text>
  <text x="64" y="178" font-size="18.5" fill="#475569">Server stores session data. Client keeps a session ID in a cookie.</text>
  <text x="64" y="738" font-size="18.5" fill="#475569">Client stores a signed token. Server verifies the token on each request.</text>

  <rect x="64" y="400" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="92" cy="422" r="14" fill="#2563EB"/>
  <text x="92" y="428" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="120" y="428.5" font-size="18.5" fill="#1F2937">Client sends a request with a session ID in a cookie.</text>
  <rect x="64" y="454" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="92" cy="476" r="14" fill="#2563EB"/>
  <text x="92" y="482" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="120" y="482.5" font-size="18.5" fill="#1F2937">Server looks up the session data in a session store (for example, Redis).</text>
  <rect x="64" y="508" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="92" cy="530" r="14" fill="#2563EB"/>
  <text x="92" y="536" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="120" y="536.5" font-size="18.5" fill="#1F2937">Server retrieves the user information.</text>
  <rect x="64" y="562" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="92" cy="584" r="14" fill="#2563EB"/>
  <text x="92" y="590" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">4</text>
  <text x="120" y="590.5" font-size="18.5" fill="#1F2937">Server sends the response.</text>
  <rect x="64" y="960" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="92" cy="982" r="14" fill="#4F46E5"/>
  <text x="92" y="988" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">1</text>
  <text x="120" y="988.5" font-size="18.5" fill="#1F2937">Client sends a request with a JWT in the Authorization header.</text>
  <rect x="64" y="1014" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="92" cy="1036" r="14" fill="#4F46E5"/>
  <text x="92" y="1042" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">2</text>
  <text x="120" y="1042.5" font-size="18.5" fill="#1F2937">Server verifies the token's signature and extracts the user information.</text>
  <rect x="64" y="1068" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <circle cx="92" cy="1090" r="14" fill="#4F46E5"/>
  <text x="92" y="1096" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">3</text>
  <text x="120" y="1096.5" font-size="18.5" fill="#1F2937">Server processes the request and sends the response.</text>


</svg>