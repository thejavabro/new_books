<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc"><title id="title">Make each migration batch recoverable</title><desc id="desc">Starting from checkpoint 100, the next batch converts records 101–200 and commits them together with checkpoint 200. An interruption before that commit leaves checkpoint 100; after the commit, recovery begins after 200. Repeating a batch must be safe, and readers need an explicit policy for old and converted formats during the transition.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1120" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Make each migration batch recoverable</text><text x="50" y="107" font-size="22" fill="#334155" font-weight="400">Illustrative record ranges. Keep converted records and progress in the same commit.</text><rect x="50" y="185" width="330" height="165" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="225" font-size="24" fill="#7c3aed" font-weight="700">Saved checkpoint: 100</text><text x="72" y="266" font-size="21" fill="#334155" font-weight="400">Earlier batches are committed.</text><text x="72" y="297" font-size="21" fill="#334155" font-weight="400">Read the saved resume point.</text><rect x="435" y="185" width="330" height="165" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="457" y="225" font-size="24" fill="#2563eb" font-weight="700">Convert 101–200</text><text x="457" y="266" font-size="21" fill="#334155" font-weight="400">Work within a bounded batch.</text><text x="457" y="297" font-size="21" fill="#334155" font-weight="400">Preserve identities and</text><text x="457" y="328" font-size="21" fill="#334155" font-weight="400">pending-operation meaning.</text><rect x="820" y="185" width="330" height="165" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="842" y="225" font-size="24" fill="#059669" font-weight="700">Commit together</text><text x="842" y="266" font-size="21" fill="#334155" font-weight="400">Converted records</text><text x="842" y="297" font-size="21" fill="#334155" font-weight="400">+ checkpoint 200</text><path d="M388 267 H427" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M773 267 H812" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="500" width="520" height="175" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="72" y="540" font-size="24" fill="#c2410c" font-weight="700">Interrupted before commit</text><text x="72" y="581" font-size="21" fill="#334155" font-weight="400">Checkpoint remains 100.</text><text x="72" y="612" font-size="21" fill="#334155" font-weight="400">Uncommitted changes do not count.</text><text x="72" y="643" font-size="21" fill="#334155" font-weight="400">Repeat the batch safely.</text><rect x="650" y="500" width="500" height="175" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="672" y="540" font-size="24" fill="#059669" font-weight="700">Interrupted after commit</text><text x="672" y="581" font-size="21" fill="#334155" font-weight="400">Checkpoint is 200.</text><text x="672" y="612" font-size="21" fill="#334155" font-weight="400">Those converted records are present.</text><text x="672" y="643" font-size="21" fill="#334155" font-weight="400">Resume after record 200.</text><path d="M600 358 V420 H310 V492" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><path d="M985 358 V420 H900 V492" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)"/><rect x="50" y="770" width="1100" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="810" font-size="24" fill="#2563eb" font-weight="700">During the transition</text><text x="72" y="851" font-size="21" fill="#334155" font-weight="400">Readers distinguish old and converted formats. Mark the transition complete only after validation.</text><rect x="50" y="940" width="1100" height="125" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="980" font-size="24" fill="#ffffff" font-weight="700">Preserve original user work on failure</text><text x="72" y="1021" font-size="21" fill="#ffffff" font-weight="400">A checkpoint helps resume conversion. It is not permission to recreate a database containing drafts.</text></g></svg>