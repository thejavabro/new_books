<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The browser asks the stub resolver, which asks the recursive resolver. The resolver checks its cache, then asks a root server, a .com TLD server, and an authoritative server. It caches the answer for the TTL and returns it, and the browser connects.">
  <defs>
    <filter id="ds5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ds5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="ds5-k1"><rect x="40" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k2"><rect x="343" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k3"><rect x="646" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k4"><rect x="949" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k5"><rect x="40" y="360" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k6"><rect x="343" y="360" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k7"><rect x="646" y="360" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="ds5-k8"><rect x="949" y="360" width="250" height="90" rx="12"/></clipPath>
    <marker id="ds5-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">One DNS lookup, end to end</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The first visit to www.example.com, when no cache has the answer yet.</text>



  <g fill="none" stroke-width="2">
    <path d="M290,185 H343" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M593,185 H646" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M896,185 H949" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M1199,185 H1210 Q1225,185 1225,200 V305 Q1225,320 1210,320 H180 Q165,320 165,335 V360" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M290,405 H343" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M593,405 H646" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
    <path d="M896,405 H949" stroke="#64748B" marker-end="url(#ds5-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#ds5-soft)">
    <rect x="40" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ds5-k1)"/>
  </g>
  <circle cx="78" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="104" y="192" font-size="21.5" font-weight="600" fill="#111827">1. Browser</text>
  <text x="165" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">you type the name</text>
  <g filter="url(#ds5-soft)">
    <rect x="343" y="140" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="343" y="140" width="6" height="90" fill="#64748B" clip-path="url(#ds5-k2)"/>
  </g>
  <circle cx="381" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,174.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="407" y="192" font-size="21.5" font-weight="600" fill="#111827">2. Stub</text>
  <text x="468" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">sends one query</text>
  <text x="468" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">to the resolver</text>
  <g filter="url(#ds5-lift)">
    <rect x="646" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="646" y="140" width="9" height="90" fill="#D97706" clip-path="url(#ds5-k3)"/>
  </g>
  <circle cx="684" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="710" y="192" font-size="21.5" font-weight="600" fill="#111827">3. Cache</text>
  <text x="771" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">resolver checks its cache</text>
  <text x="771" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">most lookups end here</text>
  <g filter="url(#ds5-soft)">
    <rect x="949" y="140" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="949" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#ds5-k4)"/>
  </g>
  <circle cx="987" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="1013" y="192" font-size="21.5" font-weight="600" fill="#111827">4. Root</text>
  <text x="1074" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">points to .com servers</text>
  <g filter="url(#ds5-soft)">
    <rect x="40" y="360" width="250" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="40" y="360" width="6" height="90" fill="#7C3AED" clip-path="url(#ds5-k5)"/>
  </g>
  <circle cx="78" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,394.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="104" y="412" font-size="21.5" font-weight="600" fill="#111827">5. TLD</text>
  <text x="165" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">points to example.com</text>
  <text x="165" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">name servers</text>
  <g filter="url(#ds5-soft)">
    <rect x="343" y="360" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="343" y="360" width="6" height="90" fill="#059669" clip-path="url(#ds5-k6)"/>
  </g>
  <circle cx="381" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(370.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="407" y="412" font-size="21.5" font-weight="600" fill="#111827">6. Authoritative</text>
  <text x="468" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">returns the IP address</text>
  <g filter="url(#ds5-soft)">
    <rect x="646" y="360" width="250" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="646" y="360" width="6" height="90" fill="#2563EB" clip-path="url(#ds5-k7)"/>
  </g>
  <circle cx="684" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,394.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="710" y="412" font-size="21.5" font-weight="600" fill="#111827">7. Cache it</text>
  <text x="771" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">saved for the TTL</text>
  <text x="771" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">then returned</text>
  <g filter="url(#ds5-soft)">
    <rect x="949" y="360" width="250" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="949" y="360" width="6" height="90" fill="#059669" clip-path="url(#ds5-k8)"/>
  </g>
  <circle cx="987" cy="405" r="18" fill="#FFFFFF"/>
  <g transform="translate(976.56,394.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1013" y="412" font-size="21.5" font-weight="600" fill="#111827">8. Connect</text>
  <text x="1074" y="479" font-size="18.5" text-anchor="middle" fill="#6B7280">browser opens</text>
  <text x="1074" y="506" font-size="18.5" text-anchor="middle" fill="#94A3B8">a connection</text>

  <rect x="40" y="560" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="585" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="610" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Cache hit</text>
  <text x="323" y="610" font-size="18.5" fill="#475569">if step 3 finds the answer, steps 4 to 6 are skipped</text>
  <rect x="64" y="635" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="660" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Referrals</text>
  <text x="323" y="660" font-size="18.5" fill="#475569">in steps 4 and 5, each server points the resolver to the next one</text>
</svg>