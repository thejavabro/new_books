<text x="856" y="451" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">5</text>
<text x="300" y="520" text-anchor="start" font-size="19.5" font-weight="600" fill="#047857">the tally is read back in value order, which is already sorted</text>
<rect x="40" y="578" width="1160" height="188" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="600" width="255" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="191" y="626" text-anchor="middle" font-size="19.5" font-weight="600" fill="#111827">the input</text>
<text x="348" y="626" font-size="19.5" fill="#475569">read once to build the tally</text>
<rect x="64" y="648" width="255" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="191" y="674" text-anchor="middle" font-size="19.5" font-weight="600" fill="#1D4ED8">the tally</text>
<text x="348" y="674" font-size="19.5" fill="#475569">indexed by value, so the index carries the order</text>
<rect x="64" y="696" width="255" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="191" y="722" text-anchor="middle" font-size="19.5" font-weight="600" fill="#047857">the output</text>
<text x="348" y="722" font-size="19.5" fill="#475569">written from the running totals, which keeps it stable</text>
</svg>