<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="794" viewBox="0 0 1240 794" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Counting sort turning an array into a tally and then into sorted output, with no comparisons"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker><marker id="arg" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker></defs><rect x="0" y="0" width="1240" height="794" fill="#FFFFFF"/>
<rect x="40" y="64" width="1160" height="490" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
<text x="64" y="98" font-size="20.5" font-weight="600" fill="#4338CA">Each value picks its own position, so no two elements are ever compared</text>
