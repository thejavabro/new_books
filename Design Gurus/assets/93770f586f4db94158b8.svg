<rect x="606" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="652" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">1</text>
<text x="652" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=3</text>
<rect x="708" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="754" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">2</text>
<text x="754" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=4</text>
<rect x="810" y="150" width="92" height="66" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="856" y="191" text-anchor="middle" font-size="22.5" font-weight="600" fill="#111827">5</text>
<text x="856" y="140" text-anchor="middle" font-size="17.5" fill="#94A3B8">i=5</text>
<text x="272" y="321" text-anchor="end" font-size="19.5" font-weight="600" fill="#1D4ED8">counts</text>
<rect x="300" y="280" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="346" y="321" text-anchor="middle" font-size="22.5" font-weight="600" fill="#94A3B8">0</text>
<text x="346" y="270" text-anchor="middle" font-size="17.5" fill="#94A3B8">value 0</text>
<rect x="402" y="280" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="448" y="321" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">1</text>
<text x="448" y="270" text-anchor="middle" font-size="17.5" fill="#94A3B8">value 1</text>
<rect x="504" y="280" width="92" height="66" rx="9" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<text x="550" y="321" text-anchor="middle" font-size="22.5" font-weight="600" fill="#1D4ED8">2</text>
<text x="550" y="270" text-anchor="middle" font-size="17.5" fill="#94A3B8">value 2</text>
<rect x="606" y="280" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
<text x="652" y="321" text-anchor="middle" font-size="22.5" font-weight="600" fill="#94A3B8">0</text>
<text x="652" y="270" text-anchor="middle" font-size="17.5" fill="#94A3B8">value 3</text>
<rect x="708" y="280" width="92" height="66" rx="9" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
