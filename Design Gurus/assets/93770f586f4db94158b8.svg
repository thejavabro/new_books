<text x="346" y="451" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">1</text>
<rect x="402" y="410" width="92" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="448" y="451" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
<rect x="504" y="410" width="92" height="66" rx="9" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
<text x="550" y="451" text-anchor="middle" font-size="22.5" font-weight="600" fill="#047857">2</text>
