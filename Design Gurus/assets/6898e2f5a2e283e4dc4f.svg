<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="808" viewBox="0 0 1240 808" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Example 3: six servers, an undirected network with its critical connections marked">
<defs>
<filter id="cc3-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="808" fill="#FFFFFF"/>
<rect x="40" y="40" width="382" height="534.0" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Example 3: six servers</text>
<text x="64" y="96" font-size="15.5" fill="#6B7280">Links are two-way</text>
<g fill="none" stroke-linecap="round">
<path d="M 136.0 152.0 L 326.0 152.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 326.0 152.0 L 326.0 327.0" stroke="#DB2777" stroke-width="3.2"/>
<path d="M 326.0 152.0 L 136.0 327.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 136.0 327.0 L 136.0 152.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 326.0 327.0 L 326.0 502.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 326.0 502.0 L 136.0 502.0" stroke="#64748B" stroke-width="2.4"/>
<path d="M 136.0 502.0 L 326.0 327.0" stroke="#64748B" stroke-width="2.4"/>
</g>
<g filter="url(#cc3-soft)"><circle cx="136.0" cy="152.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="136.0" y="160.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">0</text>
<g filter="url(#cc3-soft)"><circle cx="326.0" cy="152.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="326.0" y="160.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">1</text>
<g filter="url(#cc3-soft)"><circle cx="136.0" cy="327.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="136.0" y="335.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">2</text>
<g filter="url(#cc3-soft)"><circle cx="326.0" cy="327.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="326.0" y="335.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">3</text>
<g filter="url(#cc3-soft)"><circle cx="326.0" cy="502.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="326.0" y="510.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">4</text>
<g filter="url(#cc3-soft)"><circle cx="136.0" cy="502.0" r="36" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/></g>
<text x="136.0" y="510.0" text-anchor="middle" font-size="22" font-weight="600" fill="#111827">5</text>
<rect x="462" y="40" width="738" height="312.0" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="486" y="80.0" font-size="16.5" font-weight="600" fill="#475569">Connections</text>
<text x="486" y="106.0" font-size="15.5" fill="#475569">[[0, 1], [1, 2], [2, 0], [1, 3], [3, 4], [4, 5], [5, 3]]</text>
<text x="486" y="154.0" font-size="16.5" font-weight="600" fill="#BE185D">Critical connections</text>
<text x="486" y="180.0" font-size="15.5" fill="#475569">[[1, 3]]</text>
<text x="486" y="220.0" font-size="15.5" fill="#6B7280">Two triangles joined by one link. Inside each triangle every link has a way around</text>
<text x="486" y="246.0" font-size="15.5" fill="#6B7280">it. The single link between them has none, so cutting 1 to 3 separates servers 3, 4</text>
<text x="486" y="272.0" font-size="15.5" fill="#6B7280">and 5 from the rest.</text>
<rect x="40" y="606.0" width="1160" height="162" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<rect x="64" y="628.0" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
<text x="164" y="650.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Critical</text>
<line x1="288" y1="645.0" x2="348" y2="645.0" stroke="#DB2777" stroke-width="3.2" stroke-linecap="round"/>
<text x="372" y="650.0" font-size="15.5" fill="#475569">cutting this link leaves some server unable to reach some other server</text>
<rect x="64" y="672.0" width="200" height="32" rx="9" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
<text x="164" y="694.0" text-anchor="middle" font-size="15.5" font-weight="600" fill="#475569">Ordinary link</text>
<line x1="288" y1="689.0" x2="348" y2="689.0" stroke="#64748B" stroke-width="2.4" stroke-linecap="round"/>
<text x="372" y="694.0" font-size="15.5" fill="#475569">a way around it exists, so the network survives losing it</text>
<text x="64" y="746.0" font-size="15.5" fill="#6B7280">The network is undirected: every line is a two-way connection, which is why none of them carries an arrowhead.</text>
</svg>