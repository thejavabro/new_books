<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Throwing plastic, paper and food into one bin is low cohesion, while a separate bin for each material is high cohesion">
  <defs>
    <filter id="cmb-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cmb-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="cmb-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="cmb-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <clipPath id="cmb-w1"><rect x="70" y="110" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-w2"><rect x="245" y="110" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-w3"><rect x="420" y="110" width="150" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-mix"><rect x="170" y="270" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-src"><rect x="770" y="110" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-b1"><rect x="670" y="270" width="160" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-b2"><rect x="840" y="270" width="160" height="90" rx="12"/></clipPath>
    <clipPath id="cmb-b3"><rect x="1010" y="270" width="160" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="630" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="560" height="400" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#B45309">Low cohesion: everything goes in one bin</text>

  <g fill="none" stroke-width="2">
    <path d="M145,200 V220 Q145,232 157,232 H218 Q230,232 230,244 V264" stroke="#D97706" marker-end="url(#cmb-am)"/>
    <path d="M320,200 V264" stroke="#D97706" marker-end="url(#cmb-am)"/>
    <path d="M495,200 V220 Q495,232 483,232 H422 Q410,232 410,244 V264" stroke="#D97706" marker-end="url(#cmb-am)"/>
  </g>

  <g filter="url(#cmb-soft)">
    <rect x="70" y="110" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="70" y="110" width="6" height="90" fill="#64748B" clip-path="url(#cmb-w1)"/>
  </g>
  <circle cx="108" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(97.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 2.5h4v3l1.5 2v12a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-12z"/>
  </g>
  <text x="134" y="162" font-size="18.5" font-weight="600" fill="#111827">Plastic</text>

  <g filter="url(#cmb-soft)">
    <rect x="245" y="110" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="245" y="110" width="6" height="90" fill="#64748B" clip-path="url(#cmb-w2)"/>
  </g>
  <circle cx="283" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(272.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="309" y="162" font-size="18.5" font-weight="600" fill="#111827">Paper</text>

  <g filter="url(#cmb-soft)">
    <rect x="420" y="110" width="150" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="420" y="110" width="6" height="90" fill="#64748B" clip-path="url(#cmb-w3)"/>
  </g>
  <circle cx="458" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(447.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 7c-3-3-8-1-8 5c0 5 4 9 8 9s8-4 8-9c0-6-5-8-8-5z"/><path d="M12 7V3.5"/>
  </g>
  <text x="484" y="162" font-size="18.5" font-weight="600" fill="#111827">Food</text>

  <g filter="url(#cmb-lift)">
    <rect x="170" y="270" width="300" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="170" y="270" width="9" height="90" fill="#DB2777" clip-path="url(#cmb-mix)"/>
  </g>
  <circle cx="210" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(199.56,304.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M9 7V4h6v3M6.5 7l1 14h9l1-14"/>
  </g>
  <text x="236" y="322" font-size="18.5" font-weight="600" fill="#111827">One mixed bin</text>
  <text x="320" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">plastic, paper and food together</text>
  <text x="320" y="408" font-size="15.5" text-anchor="middle" fill="#BE185D">nothing in it has a clear purpose</text>

  
  <rect x="640" y="40" width="560" height="400" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="70" font-size="16.5" font-weight="600" fill="#047857">High cohesion: one bin per material</text>

  <g fill="none" stroke-width="2">
    <path d="M850,200 V220 Q850,232 838,232 H762 Q750,232 750,244 V264" stroke="#059669" marker-end="url(#cmb-em)"/>
    <path d="M920,200 V264" stroke="#059669" marker-end="url(#cmb-em)"/>
    <path d="M990,200 V220 Q990,232 1002,232 H1078 Q1090,232 1090,244 V264" stroke="#059669" marker-end="url(#cmb-em)"/>
  </g>

  <g filter="url(#cmb-soft)">
    <rect x="770" y="110" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="770" y="110" width="6" height="90" fill="#64748B" clip-path="url(#cmb-src)"/>
  </g>
  <circle cx="808" cy="155" r="18" fill="#FFFFFF"/>
  <g transform="translate(797.56,144.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="834" y="162" font-size="18.5" font-weight="600" fill="#111827">The same waste</text>

  <g filter="url(#cmb-soft)">
    <rect x="670" y="270" width="160" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="670" y="270" width="6" height="90" fill="#059669" clip-path="url(#cmb-b1)"/>
  </g>
  <circle cx="708" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(697.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M9 7V4h6v3M6.5 7l1 14h9l1-14"/>
  </g>
  <text x="734" y="322" font-size="18.5" font-weight="600" fill="#111827">Plastic</text>

  <g filter="url(#cmb-soft)">
    <rect x="840" y="270" width="160" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="840" y="270" width="6" height="90" fill="#059669" clip-path="url(#cmb-b2)"/>
  </g>
  <circle cx="878" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(867.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M9 7V4h6v3M6.5 7l1 14h9l1-14"/>
  </g>
  <text x="904" y="322" font-size="18.5" font-weight="600" fill="#111827">Paper</text>

  <g filter="url(#cmb-soft)">
    <rect x="1010" y="270" width="160" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1010" y="270" width="6" height="90" fill="#059669" clip-path="url(#cmb-b3)"/>
  </g>
  <circle cx="1048" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,304.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 7h16M9 7V4h6v3M6.5 7l1 14h9l1-14"/>
  </g>
  <text x="1074" y="322" font-size="18.5" font-weight="600" fill="#111827">Food</text>
  <text x="920" y="385" font-size="15.5" text-anchor="middle" fill="#6B7280">each bin holds one material</text>
  <text x="920" y="408" font-size="15.5" text-anchor="middle" fill="#047857">so each one has a single job</text>

  
  <rect x="40" y="470" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="494" width="200" height="32" rx="9" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="164" y="516" text-anchor="middle" font-size="15.5" font-weight="600" fill="#BE185D">Low cohesion</text>
  <text x="288" y="516" font-size="15.5" fill="#475569">unrelated work sits in one class, so changing one part means opening the class that owns the rest</text>
  <rect x="64" y="538" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="560" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">High cohesion</text>
  <text x="288" y="560" font-size="15.5" fill="#475569">every method in the class serves the same purpose, so there is one reason to open it</text>
</svg>