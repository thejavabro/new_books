<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="730" viewBox="0 0 1240 730" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The two facts about XOR that the whole method rests on">
<defs>
<filter id="sn-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="730" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Every number in [1, 4, 2, 1, 3, 2, 3] appears twice except one</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">Two facts about XOR are enough to find it without storing anything</text>
<rect x="40" y="106" width="1160" height="478" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">A bit XOR itself is 0, and a bit XOR 0 is itself</text>
<text x="527" y="226" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">a number</text>
<rect x="549" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="580" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="619" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="650" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="689" y="186" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="720" y="223.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="777" y="226" font-size="21.5" font-weight="600" fill="#1D4ED8">= 3</text>
<text x="527" y="318" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">itself</text>
<rect x="549" y="278" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="580" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="619" y="278" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="650" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="689" y="278" width="62" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="720" y="315.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<text x="777" y="318" font-size="21.5" font-weight="600" fill="#1D4ED8">= 3</text>
<path d="M539,356 L761,356" stroke="#CBD5E1" stroke-width="2"/>
<text x="527" y="410" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">XOR</text>
<rect x="549" y="370" width="62" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="580" y="407.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="619" y="370" width="62" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="650" y="407.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="689" y="370" width="62" height="60" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="720" y="407.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<text x="777" y="410" font-size="21.5" font-weight="600" fill="#475569">= 0</text>
<text x="527" y="502" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569"></text>
<text x="620" y="502" text-anchor="middle" font-size="18" fill="#475569">so a pair of equal numbers cancels, whatever order they arrive in</text>
<rect x="40" y="606" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="646" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">XOR of everything leaves only what did not cancel</text>
<text x="620" y="678" text-anchor="middle" font-size="18.5" fill="#475569">The order does not matter, so the array can be read straight through once</text>
</svg>