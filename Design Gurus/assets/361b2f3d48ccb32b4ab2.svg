<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="774" viewBox="0 0 1240 774" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="canary-title canary-desc">
<title id="canary-title">The canary, and the metric that has to move</title>
<desc id="canary-desc">Widening a rollout is supposed to be evidence-based, which requires a metric that responds inside the canary window. Assignment must be sticky and the metric must be broken down by flag value.</desc>
<defs>
<marker id="canary-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="canary-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="canary-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="canary-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="774" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The canary, and the metric that has to move</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Widening a rollout is supposed to be evidence-based.</text>
<rect x="40" y="696" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="696" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="84" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="84" rx="2.5" fill="#AC8BE8"/><text x="64" y="153" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">A canary is only as good as a metric that moves within the window.</text><text x="64" y="179" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">If the signal takes an hour and you widen after ten minutes, you have performed a ritual.</text>
<text x="40" y="238" font-size="23" font-weight="700" fill="#169B77" text-anchor="start">Usually fast enough</text>
<rect x="40" y="256" width="560" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">error rate</text>
<rect x="40" y="308" width="560" height="46" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="320" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">latency</text>
<text x="640" y="238" font-size="23" font-weight="700" fill="#A83147" text-anchor="start">Usually not</text>
<rect x="640" y="256" width="560" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="285" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">conversion, revenue</text>
<rect x="640" y="308" width="560" height="46" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="920" y="337" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">anything with a daily cycle</text>
<text x="920" y="378" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">these need a longer canary, not a faster decision</text>
<text x="40" y="432" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two details that are easy to get wrong</text>
<rect x="40" y="450" width="560" height="92" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="476" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Make the assignment sticky. Routing by request</text><text x="320" y="502" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">means one user hits both sides in a session</text><text x="320" y="528" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">and nothing is attributable</text>
<rect x="640" y="450" width="560" height="92" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="476" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Watch the canary, not the aggregate.</text><text x="920" y="502" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">One percent failing completely moves</text><text x="920" y="528" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the overall rate by one percent</text>
<rect x="40" y="566" width="1160" height="104" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="566" width="5" height="104" rx="2.5" fill="#5EC9EC"/><text x="64" y="598" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">And when the flag system is unreachable</text><text x="64" y="624" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Cache locally with a default, and during a migration that default is the old path.</text><text x="64" y="650" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A flag system outage should be invisible, not a release.</text>
<text x="66" y="730" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Every flag evaluation is a dependency, so it is cached with a safe default.</text>
</svg>