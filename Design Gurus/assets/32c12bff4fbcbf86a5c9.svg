<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="700" viewBox="0 0 1240 700" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Step 1: the consumer service consumes OrderPlaced at offset 100 from the orders topic. It starts a database transaction, applies the business logic and saves last_offset 100 in the kafka_offsets table, then commits the transaction. Step 2: the offset is saved in the same commit as the business data. Step 3: on restart, the consumer service reads last_offset from the database, and resume seeks it to offset 101, which is last_offset plus 1">
  <defs>
    <filter id="m07i-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m07i-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m07i-k1"><rect x="64" y="180" width="167" height="76" rx="12"/></clipPath>
    <clipPath id="m07i-k2"><rect x="64" y="270" width="167" height="76" rx="12"/></clipPath>
    <clipPath id="m07i-k3"><rect x="64" y="360" width="167" height="76" rx="12"/></clipPath>
    <clipPath id="m07i-k4"><rect x="464" y="180" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="m07i-k5"><rect x="684" y="180" width="260" height="90" rx="12"/></clipPath>
    <clipPath id="m07i-k6"><rect x="974" y="180" width="190" height="90" rx="12"/></clipPath>
    <marker id="m07i-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m07i-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="700" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Exactly-once processing: database transaction and Kafka offset</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The business write and the offset commit together in one database transaction.</text>

  <rect x="40" y="130" width="215" height="370" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="160" font-size="19.5" font-weight="600" fill="#4338CA">Kafka topic: orders</text>
  <rect x="440" y="130" width="760" height="260" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="464" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Consumer service</text>

  <g fill="none" stroke-width="2">
    <path d="M231,218 H462" stroke="#2563EB" marker-end="url(#m07i-m-blue)"/>
    <path d="M654,225 H682" stroke="#2563EB" marker-end="url(#m07i-m-blue)"/>
    <path d="M944,225 H972" stroke="#2563EB" marker-end="url(#m07i-m-blue)"/>
    <path d="M1069,270 V484" stroke="#059669" marker-end="url(#m07i-m-emerald)"/>
    <path d="M600,390 V543 Q600,555 588,555 H159 Q147,555 147,543 V502" stroke="#2563EB" marker-end="url(#m07i-m-blue)"/>
    <path d="M989,540 H712 Q700,540 700,528 V392" stroke="#2563EB" marker-end="url(#m07i-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="293" y="182" fill="#1D4ED8" text-anchor="start">Consume event</text>
    <text x="262" y="207" fill="#1D4ED8" text-anchor="start">(offset 100)</text>
    <text x="1053" y="432" fill="#047857" text-anchor="end">Offset saved in</text>
    <text x="1053" y="457" fill="#047857" text-anchor="end">the same commit</text>
    <text x="348" y="596" fill="#1D4ED8" text-anchor="start">On restart, resume seeks to offset 101 (last_offset + 1)</text>
    <text x="712" y="472" fill="#1D4ED8" text-anchor="start">Read last_offset</text>
  </g>

  <g filter="url(#m07i-soft)">
    <rect x="64" y="180" width="167" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="76" fill="#2563EB" clip-path="url(#m07i-k1)"/>
  </g>
  <text x="84" y="213.75" font-size="18.5" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="84" y="236.25" font-size="18.5" font-weight="600" fill="#111827">offset: 100</text>
  <g filter="url(#m07i-soft)">
    <rect x="64" y="270" width="167" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="270" width="6" height="76" fill="#2563EB" clip-path="url(#m07i-k2)"/>
  </g>
  <text x="84" y="303.75" font-size="18.5" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="84" y="326.25" font-size="18.5" font-weight="600" fill="#111827">offset: 101</text>
  <g filter="url(#m07i-soft)">
    <rect x="64" y="360" width="167" height="76" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="360" width="6" height="76" fill="#2563EB" clip-path="url(#m07i-k3)"/>
  </g>
  <text x="84" y="393.75" font-size="18.5" font-weight="600" fill="#111827">OrderPlaced</text>
  <text x="84" y="416.25" font-size="18.5" font-weight="600" fill="#111827">offset: 102</text>
  <g filter="url(#m07i-soft)">
    <rect x="464" y="180" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="464" y="180" width="6" height="90" fill="#2563EB" clip-path="url(#m07i-k4)"/>
  </g>
  <circle cx="502" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(491.56,214.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="528" y="219.25" font-size="21.5" font-weight="600" fill="#111827">Start DB</text>
  <text x="528" y="244.75" font-size="21.5" font-weight="600" fill="#111827">transaction</text>
  <g filter="url(#m07i-soft)">
    <rect x="684" y="180" width="260" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="684" y="180" width="6" height="90" fill="#059669" clip-path="url(#m07i-k5)"/>
  </g>
  <circle cx="722" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="748" y="219.25" font-size="21.5" font-weight="600" fill="#111827">Process event</text>
  <text x="748" y="244.75" font-size="21.5" font-weight="600" fill="#111827">and update data</text>
  <text x="814" y="299" font-size="18.5" text-anchor="middle" fill="#6B7280">apply business logic</text>
  <text x="814" y="326" font-size="18.5" text-anchor="middle" fill="#94A3B8">save last_offset = 100</text>
  <text x="814" y="353" font-size="18.5" text-anchor="middle" fill="#94A3B8">in kafka_offsets</text>
  <g filter="url(#m07i-soft)">
    <rect x="974" y="180" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="974" y="180" width="6" height="90" fill="#059669" clip-path="url(#m07i-k6)"/>
  </g>
  <circle cx="1012" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(1001.56,214.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1038" y="219.25" font-size="21.5" font-weight="600" fill="#111827">Commit DB</text>
  <text x="1038" y="244.75" font-size="21.5" font-weight="600" fill="#111827">transaction</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M989,500 L989,584 A80,16 0 0 0 1149,584 L1149,500" fill="#DBEAFE"/>
    <ellipse cx="1069" cy="500" rx="80" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1069" y="557" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="1069" y="634" font-size="18.5" text-anchor="middle" fill="#6B7280">kafka_offsets</text>
  <text x="1069" y="661" font-size="18.5" text-anchor="middle" fill="#94A3B8">last_offset = 100</text>

  <text x="147" y="474" text-anchor="middle" font-size="26" font-weight="700" fill="#4338CA">...</text>
  <circle cx="275" cy="176" r="13" fill="#2563EB"/>
  <text x="275" y="181.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">1</text>
  <circle cx="910" cy="426" r="13" fill="#2563EB"/>
  <text x="910" y="431.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">2</text>
  <circle cx="325" cy="590" r="13" fill="#2563EB"/>
  <text x="325" y="595.5" text-anchor="middle" font-size="15.5" font-weight="700" fill="#FFFFFF">3</text>


</svg>