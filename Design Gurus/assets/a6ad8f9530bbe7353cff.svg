<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="480" viewBox="0 0 1240 480" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An application issues one query to the federation layer, which routes sub-queries to the right databases and merges their results into a single answer">
  <rect x="0" y="0" width="1240" height="480" fill="#FFFFFF"/>
  <defs>
    <marker id="db12-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="db12-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <filter id="db12-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="62" font-size="20" font-weight="700" fill="#334155" text-anchor="middle">One query in, one answer out, several databases behind it</text>

  <line x1="620" y1="140" x2="620" y2="178" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#db12-violet)"/>
  <line x1="440" y1="264" x2="230" y2="308" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#db12-violet)"/>
  <line x1="620" y1="264" x2="620" y2="308" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#db12-violet)"/>
  <line x1="800" y1="264" x2="1010" y2="308" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#db12-violet)"/>
  <path d="M 120 350 H 60 V 223 H 334" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#db12-slate)"/>
  <path d="M 1120 350 H 1180 V 223 H 906" fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#db12-slate)"/>

  <g filter="url(#db12-soft)">
    <rect x="410" y="82" width="420" height="58" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="340" y="182" width="560" height="82" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="120" y="312" width="220" height="76" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="510" y="312" width="220" height="76" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="900" y="312" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>

  <text x="620" y="119" font-size="20" fill="#0F172A" text-anchor="middle">One query: profile and order history</text>
  <text x="620" y="216" font-size="20" font-weight="700" fill="#5B21B6" text-anchor="middle">Federation layer</text>
  <text x="620" y="246" font-size="20" fill="#7C3AED" text-anchor="middle">routes, translates, merges</text>

  <text x="230" y="345" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Users database</text>
  <text x="230" y="373" font-size="20" fill="#475569" text-anchor="middle">its own schema</text>
  <text x="620" y="345" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Orders database</text>
  <text x="620" y="373" font-size="20" fill="#475569" text-anchor="middle">its own engine</text>
  <text x="1010" y="345" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Catalog database</text>
  <text x="1010" y="373" font-size="20" fill="#475569" text-anchor="middle">a different vendor</text>

  <text x="620" y="440" font-size="20" fill="#475569" text-anchor="middle">Each source stays autonomous, which is why writes across them are hard and often unsupported</text>
</svg>