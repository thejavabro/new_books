<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1130" viewBox="0 0 1240 1130" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Sequence diagram of one Place order request. 1: the Customer app sends POST /orders to Orders. 2: Orders checks the login token with Accounts. 3: Orders checks prices with Menu. 4: Orders saves the order as pending in PostgreSQL. 5: Orders asks Payments to charge the order. 6: Payments creates a charge with the payment provider, which replies approved. 7: Orders marks the order paid in PostgreSQL. 8: Orders tells Notifications the order was placed. 9: Notifications sends a message through the push and SMS services. 10: Orders replies 201 Created to the Customer app. Steps 8 and 9 are highlighted because the customer waits for them.">
  <defs>
    <filter id="md02d-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="md02d-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    
    <marker id="md02d-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="md02d-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="md02d-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="md02d-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1130" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Runtime trace: placing one order</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A sequence diagram of one request through the backend components, top to bottom in time order.</text>

  <rect x="212" y="616" width="964" height="106" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="236" y="646" font-size="19.5" font-weight="600" fill="#BE185D"></text>

  <g fill="none" stroke-width="2">
    <path d="M100,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M232,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M364,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M496,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M628,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M760,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M892,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M1024,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M1156,210 V830" stroke="#64748B" stroke-dasharray="7 6"/>
    <path d="M100,250 H230" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M232,300 H362" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M232,350 H494" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M232,400 H626" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M232,450 H758" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M760,500 H890" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M892,550 H762" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#md02d-m-slate)"/>
    <path d="M232,600 H626" stroke="#2563EB" marker-end="url(#md02d-m-blue)"/>
    <path d="M232,650 H1022" stroke="#DB2777" stroke-width="2.5" marker-end="url(#md02d-m-pink)"/>
    <path d="M1024,700 H1154" stroke="#DB2777" stroke-width="2.5" marker-end="url(#md02d-m-pink)"/>
    <path d="M232,770 H102" stroke="#64748B" stroke-dasharray="7 6" marker-end="url(#md02d-m-slate)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>



  <rect x="38" y="120" width="124" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <rect x="38" y="120" width="124" height="5" rx="2" fill="#4F46E5"/>
  <text x="100" y="148" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Customer</text>
  <text x="100" y="169" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">app</text>
  <text x="100" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Container]</text>
  <rect x="170" y="120" width="124" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="170" y="120" width="124" height="5" rx="2" fill="#2563EB"/>
  <text x="232" y="156" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Orders</text>
  <text x="232" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Component]</text>
  <rect x="302" y="120" width="124" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="302" y="120" width="124" height="5" rx="2" fill="#2563EB"/>
  <text x="364" y="156" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Accounts</text>
  <text x="364" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Component]</text>
  <rect x="434" y="120" width="124" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="434" y="120" width="124" height="5" rx="2" fill="#2563EB"/>
  <text x="496" y="156" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Menu</text>
  <text x="496" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Component]</text>
  <g stroke="#2563EB" stroke-width="1.5"><path d="M566,130 L566,198 A62,12 0 0 0 690,198 L690,130" fill="#DBEAFE"/><ellipse cx="628" cy="130" rx="62" ry="12" fill="#EFF6FF"/></g>
  <text x="628" y="167" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">PostgreSQL</text>
  <text x="628" y="190" text-anchor="middle" font-size="13" fill="#4B5563">[Container]</text>
  <rect x="698" y="120" width="124" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="698" y="120" width="124" height="5" rx="2" fill="#2563EB"/>
  <text x="760" y="156" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Payments</text>
  <text x="760" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Component]</text>
  <rect x="830" y="120" width="124" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="830" y="120" width="124" height="5" rx="2" fill="#64748B"/>
  <text x="892" y="148" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Payment</text>
  <text x="892" y="169" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">provider</text>
  <text x="892" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Software system]</text>
  <rect x="962" y="120" width="124" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
  <rect x="962" y="120" width="124" height="5" rx="2" fill="#2563EB"/>
  <text x="1024" y="156" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Notifications</text>
  <text x="1024" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Component]</text>
  <rect x="1094" y="120" width="124" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="1094" y="120" width="124" height="5" rx="2" fill="#64748B"/>
  <text x="1156" y="148" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">Push and</text>
  <text x="1156" y="169" text-anchor="middle" font-size="16.5" font-weight="600" fill="#111827">SMS</text>
  <text x="1156" y="196" text-anchor="middle" font-size="13" fill="#4B5563">[Software system]</text>
  <text x="166" y="240" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">1. POST /orders [JSON/HTTPS]</text>
  <text x="298" y="290" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">2. check token</text>
  <text x="364" y="340" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">3. check prices</text>
  <text x="430" y="390" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">4. save order (pending) [SQL]</text>
  <text x="496" y="440" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">5. charge order</text>
  <text x="826" y="490" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">6. create charge [HTTPS]</text>
  <text x="826" y="540" text-anchor="middle" font-size="16.5" font-weight="600" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">approved</text>
  <text x="430" y="590" text-anchor="middle" font-size="16.5" font-weight="600" fill="#1D4ED8" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">7. mark order paid [SQL]</text>
  <text x="628" y="640" text-anchor="middle" font-size="16.5" font-weight="600" fill="#BE185D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">8. order placed</text>
  <text x="1142" y="690" text-anchor="end" font-size="16.5" font-weight="600" fill="#BE185D" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">9. send message [HTTPS]</text>
  <text x="166" y="760" text-anchor="middle" font-size="16.5" font-weight="600" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">10. 201 Created</text>

  <rect x="40" y="870" width="1160" height="246" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="895" width="240" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="184" y="920" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Numbered call</text>
  <text x="333" y="920" font-size="18.5" fill="#475569">the caller waits for the answer; numbers give the order</text>
  <rect x="64" y="945" width="240" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="184" y="970" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Dashed arrow</text>
  <text x="333" y="970" font-size="18.5" fill="#475569">a reply; most replies are left out to keep the trace short</text>
  <rect x="64" y="995" width="240" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="184" y="1020" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Steps 8 and 9</text>
  <text x="333" y="1020" font-size="18.5" fill="#475569">the customer waits for them, which no static view shows</text>
  <text x="64" y="1070" font-size="18.5" fill="#475569">Each header names its C4 type; the indigo header is the calling app, blue headers are the backend's</text>
  <text x="64" y="1093" font-size="18.5" fill="#475569">components and its database, and gray headers are external software systems</text>
</svg>