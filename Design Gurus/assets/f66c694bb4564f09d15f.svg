  <text x="120" y="566" font-size="20" font-weight="600" fill="#111827">Parallel development</text>
  <text x="120" y="590" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="120" y="614" font-size="20" font-weight="600" fill="#111827"> </text>
