    <rect x="646" y="170" width="538" height="106" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="170" width="6" height="106" fill="#DB2777" clip-path="url(#m02k-k6)"/>
  </g>
  <circle cx="684" cy="223" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,212.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="710" y="206" font-size="20" font-weight="600" fill="#111827">Overhead for simple operations</text>
  <text x="710" y="230" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="710" y="254" font-size="20" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02k-soft)">
    <rect x="646" y="290" width="538" height="106" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="290" width="6" height="106" fill="#DB2777" clip-path="url(#m02k-k7)"/>
  </g>
  <circle cx="684" cy="343" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,332.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="710" y="326" font-size="20" font-weight="600" fill="#111827">Anemic domain model trap</text>
  <text x="710" y="350" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="710" y="374" font-size="20" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02k-soft)">
    <rect x="646" y="410" width="538" height="106" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="410" width="6" height="106" fill="#DB2777" clip-path="url(#m02k-k8)"/>
  </g>
  <circle cx="684" cy="463" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,452.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5M12 17.2v.3"/></g>
  <text x="710" y="446" font-size="20" font-weight="600" fill="#111827">Layer bypass temptation</text>
  <text x="710" y="470" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="710" y="494" font-size="20" font-weight="600" fill="#111827"> </text>
  <g filter="url(#m02k-soft)">
    <rect x="646" y="530" width="538" height="106" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="646" y="530" width="6" height="106" fill="#DB2777" clip-path="url(#m02k-k9)"/>
  </g>
  <circle cx="684" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(673.56,572.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="710" y="566" font-size="20" font-weight="600" fill="#111827">Not ideal for all use cases</text>
  <text x="710" y="590" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="710" y="614" font-size="20" font-weight="600" fill="#111827"> </text>
  <text x="120" y="233" font-size="17.5" fill="#475569">Business logic tests run in milliseconds</text>
  <text x="120" y="257" font-size="17.5" fill="#475569">without a database.</text>
  <text x="120" y="353" font-size="17.5" fill="#475569">Swapping a database or provider is concentrated</text>
  <text x="120" y="377" font-size="17.5" fill="#475569">in one layer, though rarely confined to it.</text>
  <text x="120" y="473" font-size="17.5" fill="#475569">Business rules live in the business layer and</text>
  <text x="120" y="497" font-size="17.5" fill="#475569">database queries in the data access layer.</text>
  <text x="120" y="593" font-size="17.5" fill="#475569">Teams can build different layers at the same</text>
  <text x="120" y="617" font-size="17.5" fill="#475569">time once the interfaces are agreed.</text>
  <text x="710" y="233" font-size="17.5" fill="#475569">Every simple operation needs a controller, a</text>
  <text x="710" y="257" font-size="17.5" fill="#475569">service method and a repository method.</text>
  <text x="710" y="353" font-size="17.5" fill="#475569">Domain objects become plain data containers</text>
  <text x="710" y="377" font-size="17.5" fill="#475569">and all logic moves into service classes.</text>
  <text x="710" y="473" font-size="17.5" fill="#475569">Shortcuts grow with the codebase unless</text>
  <text x="710" y="497" font-size="17.5" fill="#475569">automated checks enforce the boundaries.</text>
  <text x="710" y="593" font-size="17.5" fill="#475569">Simple CRUD apps, complex domains and narrow</text>
  <text x="710" y="617" font-size="17.5" fill="#475569">microservices often fit other designs better.</text>




</svg>