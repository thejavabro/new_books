<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One uploaded object moving automatically from hot to warm to cold to archive as a lifecycle policy ages it, with nobody deciding each move by hand">
  <rect x="0" y="0" width="1240" height="608" fill="#FFFFFF"/>
  <defs>
    <marker id="st6-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">One invoice PDF, and the four homes it has over three years</text>

  <line x1="314" y1="230" x2="336" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#st6-slate)"/>
  <line x1="604" y1="230" x2="626" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#st6-slate)"/>
  <line x1="894" y1="230" x2="916" y2="230" stroke="#475569" stroke-width="2" marker-end="url(#st6-slate)"/>

  <rect x="50" y="130" width="260" height="200" rx="12" fill="#FEF2F2" stroke="#DC2626" stroke-width="2"/>
  <text x="180" y="172" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Hot</text>
  <text x="180" y="212" font-size="20" fill="#B91C1C" text-anchor="middle">day 0 to 30</text>
  <text x="180" y="252" font-size="20" fill="#334155" text-anchor="middle">the customer is</text>
  <text x="180" y="278" font-size="20" fill="#334155" text-anchor="middle">still looking at it</text>

  <rect x="340" y="130" width="260" height="200" rx="12" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
  <text x="470" y="172" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Warm</text>
  <text x="470" y="212" font-size="20" fill="#92400E" text-anchor="middle">day 30 to 90</text>
  <text x="470" y="252" font-size="20" fill="#334155" text-anchor="middle">support still pulls</text>
  <text x="470" y="278" font-size="20" fill="#334155" text-anchor="middle">it up sometimes</text>

  <rect x="630" y="130" width="260" height="200" rx="12" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  <text x="760" y="172" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Cold</text>
  <text x="760" y="212" font-size="20" fill="#1E40AF" text-anchor="middle">day 90 to 365</text>
  <text x="760" y="252" font-size="20" fill="#334155" text-anchor="middle">only opened for a</text>
  <text x="760" y="278" font-size="20" fill="#334155" text-anchor="middle">dispute or an audit</text>

  <rect x="920" y="130" width="260" height="200" rx="12" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="1050" y="172" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Archive</text>
  <text x="1050" y="212" font-size="20" fill="#5B21B6" text-anchor="middle">year 1 to 7</text>
  <text x="1050" y="252" font-size="20" fill="#334155" text-anchor="middle">kept because the</text>
  <text x="1050" y="278" font-size="20" fill="#334155" text-anchor="middle">law says to keep it</text>

  <rect x="50" y="376" width="1130" height="70" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="615" y="418" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Nobody moved it. A lifecycle rule on the bucket did each transition on the due date.</text>

  
  <rect x="50" y="476" width="1130" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="615" y="512" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Data gets colder on a schedule you can predict, so the move should be a policy, not a project.</text>
  <text x="615" y="542" font-size="20" fill="#334155" text-anchor="middle">Write the rule when you create the bucket, while you still remember why the data exists.</text>
</svg>