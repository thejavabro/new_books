<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Far: a user in London reads from a database in California, about 150 ms per round trip. Near: the same user reads from a replica in London, under 10 ms per round trip.">
  <defs>
    <filter id="lt4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="lt4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="lt4-k1"><rect x="64" y="180" width="300" height="90" rx="12"/></clipPath>
    <clipPath id="lt4-k2"><rect x="64" y="410" width="300" height="90" rx="12"/></clipPath>
    <marker id="lt4-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="lt4-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="lt4-s-pink" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#DB2777"/></marker>
    <marker id="lt4-s-emerald" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#059669"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Data locality: keep data close to where it is used</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The same read, with the data far away and with a copy nearby.</text>

  <rect x="40" y="120" width="1160" height="200" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#BE185D">Far: the data is in another region</text>
  <rect x="40" y="350" width="1160" height="200" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="380" font-size="19.5" font-weight="600" fill="#047857">Near: a copy of the data is close to the user</text>

  <g fill="none" stroke-width="2">
    <path d="M364,225 H818" stroke="#DB2777" marker-end="url(#lt4-m-pink)" marker-start="url(#lt4-s-pink)"/>
    <path d="M364,455 H818" stroke="#059669" marker-end="url(#lt4-m-emerald)" marker-start="url(#lt4-s-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="591" y="213" fill="#BE185D">about 150 ms per round trip</text>
    <text x="591" y="443" fill="#047857">under 10 ms per round trip</text>
  </g>

  <g filter="url(#lt4-soft)">
    <rect x="64" y="180" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#lt4-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">User in London</text>
  <g filter="url(#lt4-soft)">
    <rect x="64" y="410" width="300" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="410" width="6" height="90" fill="#64748B" clip-path="url(#lt4-k2)"/>
  </g>
  <circle cx="102" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,444.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="128" y="462" font-size="21.5" font-weight="600" fill="#111827">User in London</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M820,190 L820,259 A165,16 0 0 0 1150,259 L1150,190" fill="#E0E7FF"/>
    <ellipse cx="985" cy="190" rx="165" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="985" y="239.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database in California</text>
  <g stroke="#4F46E5" stroke-width="1.5">
    <path d="M820,420 L820,489 A165,16 0 0 0 1150,489 L1150,420" fill="#E0E7FF"/>
    <ellipse cx="985" cy="420" rx="165" ry="16" fill="#EEF2FF"/>
  </g>
  <text x="985" y="469.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Replica in London</text>

  <rect x="40" y="580" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="605" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="630" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Far</text>
  <text x="323" y="630" font-size="18.5" fill="#475569">every read crosses an ocean, so distance adds most of the latency</text>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Near</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">related data sits close to the users and nodes that read it most</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">How</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">partitioning, sharding, and replication place data near where it is used</text>
</svg>