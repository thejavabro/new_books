  <text x="727" y="1062" font-size="18.5" text-anchor="middle" fill="#6B7280">(still running)</text>
  <text x="931" y="1062" font-size="18.5" text-anchor="middle" fill="#6B7280">(failed)</text>
  <text x="1120" y="1062" font-size="18.5" text-anchor="middle" fill="#6B7280">(still running)</text>
