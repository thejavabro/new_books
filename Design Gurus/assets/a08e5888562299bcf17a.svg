  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When to choose N-tier architecture</text>


  <rect x="40" y="120" width="568" height="330" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">1. Different scaling requirements</text>
  <rect x="632" y="120" width="568" height="330" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="656" y="150" font-size="19.5" font-weight="600" fill="#4338CA">2. Public internet traffic</text>
  <rect x="40" y="474" width="568" height="330" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="504" font-size="19.5" font-weight="600" fill="#475569">3. Capacity to operate each tier</text>
  <rect x="632" y="474" width="568" height="330" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="656" y="504" font-size="19.5" font-weight="600" fill="#047857">4. Security and compliance requirements</text>
  <rect x="40" y="828" width="568" height="330" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="858" font-size="19.5" font-weight="600" fill="#4338CA">5. Technology flexibility</text>
  <rect x="632" y="828" width="568" height="330" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="656" y="858" font-size="19.5" font-weight="600" fill="#1D4ED8">6. High availability and fault isolation</text>

