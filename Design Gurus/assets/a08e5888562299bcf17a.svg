  <text x="736" y="643" font-size="21.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#m03o-soft)">
    <rect x="64" y="928" width="142" height="80" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="928" width="6" height="80" fill="#2563EB" clip-path="url(#m03o-k10)"/>
  </g>
  <text x="84" y="963.75" font-size="18.5" font-weight="600" fill="#111827">Presentation</text>
  <text x="84" y="986.25" font-size="18.5" font-weight="600" fill="#111827">tier</text>
  <text x="135" y="1037" font-size="18.5" text-anchor="middle" fill="#6B7280">Nginx</text>
  <g filter="url(#m03o-soft)">
    <rect x="255" y="928" width="150" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
