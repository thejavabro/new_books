  <text x="828" y="575.5" font-size="18.5" fill="#1F2937">Isolate sensitive data</text>
  <rect x="778" y="594" width="382" height="38" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(792,602) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="828" y="619.5" font-size="18.5" fill="#1F2937">Control access between tiers</text>
  <rect x="778" y="638" width="382" height="38" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(792,646) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="828" y="663.5" font-size="18.5" fill="#1F2937">Apply different security policies</text>
  <rect x="778" y="682" width="382" height="38" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <g transform="translate(792,690) scale(0.92)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="828" y="707.5" font-size="18.5" fill="#1F2937">Meet compliance requirements</text>
  <text x="324" y="402" font-size="18.5" text-anchor="middle" fill="#374151">When you expect high traffic and need to scale</text>
  <text x="324" y="429" font-size="18.5" text-anchor="middle" fill="#374151">different tiers independently.</text>
  <text x="916" y="402" font-size="18.5" text-anchor="middle" fill="#374151">When the application serves public internet traffic and</text>
  <text x="916" y="429" font-size="18.5" text-anchor="middle" fill="#374151">the database must not be reachable from the internet.</text>
  <text x="324" y="756" font-size="18.5" text-anchor="middle" fill="#374151">When the team can monitor, scale, and operate each</text>
  <text x="324" y="783" font-size="18.5" text-anchor="middle" fill="#374151">tier as a separate deployment.</text>
  <text x="916" y="756" font-size="18.5" text-anchor="middle" fill="#374151">When you need to protect data and apply different</text>
  <text x="916" y="783" font-size="18.5" text-anchor="middle" fill="#374151">security controls at each tier.</text>
  <text x="324" y="1110" font-size="18.5" text-anchor="middle" fill="#374151">When you want to use different technologies at each</text>
  <text x="324" y="1137" font-size="18.5" text-anchor="middle" fill="#374151">tier based on specific needs.</text>
  <text x="916" y="1110" font-size="18.5" text-anchor="middle" fill="#374151">When you want failures in one tier to have minimal</text>
  <text x="916" y="1137" font-size="18.5" text-anchor="middle" fill="#374151">impact on other tiers and keep the system running.</text>

