<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Detailed Messenger design: users connect through a load balancer to stateful chat servers, which write history to HBase asynchronously and read recent messages from cache servers behind a second load balancer.">
