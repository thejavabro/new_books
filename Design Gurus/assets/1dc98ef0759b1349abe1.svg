  <g filter="url(#fm04-soft)">
    <rect x="980" y="650" width="214" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="980" y="650" width="6" height="90" fill="#2563EB" clip-path="url(#fm04-k9)"/>
