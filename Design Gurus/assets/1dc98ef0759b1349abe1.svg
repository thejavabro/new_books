  </g>
  <text x="1044" y="702" font-size="18.5" font-weight="600" fill="#111827">Cache Servers</text>
  <text x="1087" y="765" font-size="15.5" text-anchor="middle" fill="#6B7280">last 15 messages of</text>
  <text x="1087" y="788" font-size="15.5" text-anchor="middle" fill="#6B7280">recent conversations</text>

  
  <rect x="40" y="900" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
