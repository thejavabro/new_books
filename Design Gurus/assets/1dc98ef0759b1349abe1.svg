  <text x="425" y="762" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">HBase partitions</text>
  <text x="425" y="856" font-size="15.5" text-anchor="middle" fill="#6B7280">20B small writes a day, buffered and flushed in bulk; partitioned by UserID</text>

  
  <g filter="url(#fm04-soft)">
    <rect x="980" y="455" width="214" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
