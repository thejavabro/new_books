  </g>
  <text x="382" y="526" font-size="18.5" font-weight="600" fill="#111827">Chat Server 2</text>

  <g filter="url(#fm04-soft)">
    <rect x="572" y="474" width="214" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
