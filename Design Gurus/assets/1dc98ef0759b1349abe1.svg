    <clipPath id="fm04-k9"><rect x="980" y="650" width="214" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  
  <rect x="40" y="420" width="770" height="200" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="450" font-size="16.5" font-weight="600" fill="#5B21B6">Chat servers, stateful</text>

  
