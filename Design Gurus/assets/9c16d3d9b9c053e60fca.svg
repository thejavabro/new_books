<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" style="background-color:#ffffff">
<defs>
<marker id="ha" markerWidth="10" markerHeight="8" refX="9.5" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8 z" fill="#000000"/></marker>
<marker id="hb" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="30" y="40" width="330" height="88" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="40" width="330" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="195" y="59" text-anchor="middle" font-weight="bold">&#171;interface&#187; StorageFactory</text>
<text x="42" y="88">+ createConnection() : Connection</text>
<text x="42" y="110">+ createQueryBuilder() : QueryBuilder</text>

<rect x="30" y="230" width="300" height="88" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="30" y="230" width="300" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="180" y="249" text-anchor="middle" font-weight="bold">PostgresFactory</text>
<text x="42" y="278">+ createConnection() : PostgresConnection</text>
<text x="42" y="300">+ createQueryBuilder() : PostgresQueryBuilder</text>

<rect x="360" y="230" width="290" height="88" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="360" y="230" width="290" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="505" y="249" text-anchor="middle" font-weight="bold">MySqlFactory</text>
<text x="372" y="278">+ createConnection() : MySqlConnection</text>
<text x="372" y="300">+ createQueryBuilder() : MySqlQueryBuilder</text>

<rect x="700" y="40" width="270" height="50" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="700" y="40" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="835" y="59" text-anchor="middle" font-weight="bold">&#171;interface&#187; Connection</text>
<text x="712" y="84">+ connect()</text>

<rect x="700" y="130" width="130" height="38" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="765" y="154" text-anchor="middle" font-size="11.5">PostgresConnection</text>
<rect x="845" y="130" width="125" height="38" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="907" y="154" text-anchor="middle" font-size="11.5">MySqlConnection</text>

<rect x="700" y="240" width="270" height="50" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="700" y="240" width="270" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="835" y="259" text-anchor="middle" font-weight="bold">&#171;interface&#187; QueryBuilder</text>
<text x="712" y="284">+ selectAll(table) : String</text>

<rect x="700" y="330" width="130" height="38" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="765" y="354" text-anchor="middle" font-size="11.5">PostgresQueryBuilder</text>
<rect x="845" y="330" width="125" height="38" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="907" y="354" text-anchor="middle" font-size="11.5">MySqlQueryBuilder</text>

<path d="M 180 230 L 180 180 L 195 180 L 195 128" stroke="#000000" fill="none" marker-end="url(#hb)"/>
<path d="M 505 230 L 505 180 L 195 180" stroke="#000000" fill="none"/>

<path d="M 765 130 L 765 108 L 835 108 L 835 90" stroke="#000000" fill="none" marker-end="url(#hb)"/>
<path d="M 907 130 L 907 108 L 835 108" stroke="#000000" fill="none"/>

<path d="M 765 330 L 765 308 L 835 308 L 835 290" stroke="#000000" fill="none" marker-end="url(#hb)"/>
<path d="M 907 330 L 907 308 L 835 308" stroke="#000000" fill="none"/>

<path d="M 360 74 L 695 74" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#ha)"/>
<text x="420" y="66" font-size="11.5" fill="#414d60">creates</text>
<path d="M 360 110 L 670 110 L 670 264 L 695 264" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#ha)"/>
<text x="500" y="102" font-size="11.5" fill="#414d60">creates</text>

<rect x="30" y="410" width="940" height="94" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="438" font-size="12.5" fill="#414d60">Every concrete factory implements every create method. That is what makes it a family rather than two unrelated factories.</text>
<text x="52" y="462" font-size="12.5" fill="#414d60">The return types are narrowed to one family per factory, so PostgresFactory can never hand back a MySqlQueryBuilder.</text>
<text x="52" y="486" font-size="12.5" fill="#414d60">Client code holds only StorageFactory, Connection and QueryBuilder, and never names a concrete class.</text>
</g>
</svg>