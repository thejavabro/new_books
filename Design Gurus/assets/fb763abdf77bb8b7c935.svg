  <text x="484" y="833" font-size="18.5" font-weight="600" fill="#111827">Peer</text>
  <text x="766" y="236" font-size="18.5" fill="#1F2937">Clients send requests to a central server</text>
  <text x="766" y="280" font-size="18.5" fill="#1F2937">Server processes requests and returns responses</text>
  <text x="766" y="324" font-size="18.5" fill="#1F2937">Clients and server have different roles</text>
  <text x="766" y="368" font-size="18.5" fill="#1F2937">Server must scale to handle all traffic</text>
  <text x="766" y="412" font-size="18.5" fill="#1F2937">The server is a single point of failure</text>
  <text x="766" y="620" font-size="18.5" fill="#1F2937">Every node is both a client and a server</text>
  <text x="766" y="664" font-size="18.5" fill="#1F2937">Peers communicate directly with each other</text>
  <text x="766" y="708" font-size="18.5" fill="#1F2937">No central server or single point of failure</text>
  <text x="766" y="752" font-size="18.5" fill="#1F2937">Capacity grows as more peers join</text>
  <text x="766" y="796" font-size="18.5" fill="#1F2937">Used for content sharing, decentralized</text>
  <text x="766" y="822" font-size="18.5" fill="#1F2937">storage, and blockchains</text>

