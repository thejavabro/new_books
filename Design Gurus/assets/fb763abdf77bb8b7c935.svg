  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Client-server vs. peer-to-peer architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Clients depend on one central server; peers connect directly and act as both client and server.</text>

