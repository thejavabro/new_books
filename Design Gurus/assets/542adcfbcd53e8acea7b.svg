<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="876" viewBox="0 0 1240 876" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="data-title data-desc">
<title id="data-title">Moving the data, which is the hard half</title>
<desc id="data-desc">Four arrangements for where the data lives during a migration, each correct somewhere. The decision that matters is which system is authoritative at each moment, and that it changes exactly once per slice.</desc>
<defs>
<marker id="data-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="data-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="data-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="data-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="876" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Moving the data, which is the hard half</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Descriptions of this pattern usually stop at routing, and routing is the easy part.</text>
<rect x="40" y="798" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="798" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="126" width="440" height="68" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="260" y="166" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The new service calls the old one</text>
<rect x="510" y="118" width="690" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="855" y="144" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">simple, and still exactly one authority</text>
<rect x="510" y="162" width="690" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="855" y="188" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">couples them, and the old system cannot be deleted</text>
<rect x="40" y="226" width="440" height="68" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="260" y="266" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Both read the same database</text>
<rect x="510" y="218" width="690" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="855" y="244" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">fast to build</text>
<rect x="510" y="262" width="690" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="855" y="288" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">not a boundary at all; a step, never a destination</text>
<rect x="40" y="326" width="440" height="68" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="260" y="366" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Replicate, old system authoritative</text>
<rect x="510" y="318" width="690" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="855" y="344" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the new one serves reads immediately</text>
<rect x="510" y="362" width="690" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="855" y="388" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">needs change data capture or an outbox</text>
<rect x="40" y="426" width="440" height="68" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="260" y="466" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Write to both for a period</text>
<rect x="510" y="418" width="690" height="40" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="855" y="444" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">both can serve writes during the transition</text>
<rect x="510" y="462" width="690" height="40" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="855" y="488" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">brings the reconciliation requirement with it</text>
<rect x="40" y="534" width="1160" height="82" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="534" width="5" height="82" rx="2.5" fill="#AC8BE8"/><text x="64" y="567.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">What matters is not which you pick</text><text x="64" y="594.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">The authority is explicit and moves exactly once per slice, deliberately, at a moment you chose.</text>
<rect x="40" y="646" width="1160" height="112" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="646" width="5" height="112" rx="2.5" fill="#39D5AA"/><text x="64" y="681" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Verify before cutting over</text><text x="64" y="708" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">Send the request to both, serve the old answer, record the differences.</text><text x="64" y="735" font-size="20" font-weight="400" fill="#080C50" text-anchor="start">You flip with evidence rather than hope.</text>
<text x="66" y="832" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The failure is an arrangement where nobody can say which system owns a given field.</text>
</svg>