<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="566" viewBox="0 0 1240 566" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The counts before any removal">
<defs>
<filter id="md-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="566" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Remove 2 numbers to leave as many distinct values as possible</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">The array is [7, 3, 5, 8, 5, 3, 3], and a value with c copies costs c minus 1 removals to become distinct</text>
<rect x="40" y="106" width="1160" height="312" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">Green values are already distinct, blue ones have copies to clear</text>
<rect x="326" y="176" width="132" height="78" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="392" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">value 7</text>
<text x="392" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1 copy</text>
<rect x="478" y="176" width="132" height="78" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="544" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 3</text>
<text x="544" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3 copies</text>
<rect x="630" y="176" width="132" height="78" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="696" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">value 5</text>
<text x="696" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2 copies</text>
<rect x="782" y="176" width="132" height="78" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="848" y="203" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">value 8</text>
<text x="848" y="240" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1 copy</text>
<text x="302" y="223" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">counts</text>
<text x="454" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">duplicates</text>
<rect x="478" y="316" width="132" height="62" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="544" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="544" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">costs 1</text>
<rect x="630" y="316" width="132" height="62" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="696" y="354.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="696" y="400" text-anchor="middle" font-size="15.5" fill="#94A3B8">costs 2</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Spend the removals on the cheapest duplicates first</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">Making one value distinct is all or nothing, so a half paid group gains nothing</text>
</svg>