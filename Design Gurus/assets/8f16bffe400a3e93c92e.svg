<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1626" viewBox="0 0 1240 1626" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seven trade-offs of the checkout API, each with what it gives and the cost accepted: a quote resource, server-only money, conditional cart state, idempotent checkout, stock taken at checkout, a pending state on unknown outcome, and no-store on money.">
  <defs>
    <filter id="p2x-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p2x-k1"><rect x="76" y="146" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k2"><rect x="76" y="342" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k3"><rect x="76" y="538" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k4"><rect x="76" y="734" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k5"><rect x="76" y="930" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k6"><rect x="76" y="1126" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-k7"><rect x="76" y="1322" width="420" height="90" rx="12"/></clipPath>
    <clipPath id="p2x-ks"><rect x="596" y="61" width="24" height="20" rx="5"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1626" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Checkout: seven choices, seven costs</text>

  <rect x="596" y="61" width="24" height="20" rx="5" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <rect x="596" y="61" width="5" height="20" fill="#059669" clip-path="url(#p2x-ks)"/>
  <text x="630" y="77" font-size="15.5" fill="#6B7280">chosen</text>

  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M724,71 L728.5,75.5 L736,65.5"/>
  </g>
  <text x="750" y="77" font-size="15.5" fill="#6B7280">what it gives</text>

  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M902,66 L913,77 M913,66 L902,77"/>
  </g>
  <text x="927" y="77" font-size="15.5" fill="#6B7280">cost accepted</text>

  
  <rect x="40" y="126" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="146" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="146" width="6" height="90" fill="#059669" clip-path="url(#p2x-k1)"/>
  </g>
  <circle cx="114" cy="191" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,180.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="140" y="198" font-size="18.5" font-weight="600" fill="#111827">A Quote resource</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,256 L82.5,260.5 L90,250.5"/>
  </g>
  <text x="104" y="262" font-size="15.5" fill="#6B7280">A ten-minute price promise, separate from a days-long cart</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,277 L89,288 M89,277 L78,288"/>
  </g>
  <text x="104" y="288" font-size="15.5" fill="#6B7280">One more create and lifecycle for the caller</text>

  
  <rect x="40" y="322" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="342" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="342" width="6" height="90" fill="#059669" clip-path="url(#p2x-k2)"/>
  </g>
  <circle cx="114" cy="387" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,376.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="140" y="394" font-size="18.5" font-weight="600" fill="#111827">Server-only money</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,452 L82.5,456.5 L90,446.5"/>
  </g>
  <text x="104" y="458" font-size="15.5" fill="#6B7280">The charged amount uses one authoritative calculation</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,473 L89,484 M89,473 L78,484"/>
  </g>
  <text x="104" y="484" font-size="15.5" fill="#6B7280">Every price-changing input must be representable server-side</text>

  
  <rect x="40" y="518" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="538" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="538" width="6" height="90" fill="#059669" clip-path="url(#p2x-k3)"/>
  </g>
  <circle cx="114" cy="583" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,572.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="140" y="590" font-size="18.5" font-weight="600" fill="#111827">Conditional cart state</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,648 L82.5,652.5 L90,642.5"/>
  </g>
  <text x="104" y="654" font-size="15.5" fill="#6B7280">Another tab's change is never silently ignored</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,669 L89,680 M89,669 L78,680"/>
  </g>
  <text x="104" y="680" font-size="15.5" fill="#6B7280">A refresh-and-requote path after 412</text>

  
  <rect x="40" y="714" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="734" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="734" width="6" height="90" fill="#059669" clip-path="url(#p2x-k4)"/>
  </g>
  <circle cx="114" cy="779" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,768.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="140" y="786" font-size="18.5" font-weight="600" fill="#111827">Idempotent checkout</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,844 L82.5,848.5 L90,838.5"/>
  </g>
  <text x="104" y="850" font-size="15.5" fill="#6B7280">A timeout cannot duplicate payment and order effects</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,865 L89,876 M89,865 L78,876"/>
  </g>
  <text x="104" y="876" font-size="15.5" fill="#6B7280">Storing request fingerprints and results for 24 hours</text>

  
  <rect x="40" y="910" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="930" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="930" width="6" height="90" fill="#059669" clip-path="url(#p2x-k5)"/>
  </g>
  <circle cx="114" cy="975" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,964.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/>
    <path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/>
    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="140" y="982" font-size="18.5" font-weight="600" fill="#111827">Stock at checkout</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1040 L82.5,1044.5 L90,1034.5"/>
  </g>
  <text x="104" y="1046" font-size="15.5" fill="#6B7280">Carts cannot hoard inventory for days</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1061 L89,1072 M89,1061 L78,1072"/>
  </g>
  <text x="104" y="1072" font-size="15.5" fill="#6B7280">An out-of-stock failure after the customer invested time</text>

  
  <rect x="40" y="1106" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="1126" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1126" width="6" height="90" fill="#059669" clip-path="url(#p2x-k6)"/>
  </g>
  <circle cx="114" cy="1171" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1160.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="140" y="1178" font-size="18.5" font-weight="600" fill="#111827">Pending on unknown outcome</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1236 L82.5,1240.5 L90,1230.5"/>
  </g>
  <text x="104" y="1242" font-size="15.5" fill="#6B7280">The API never guesses about payment</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1257 L89,1268 M89,1257 L78,1268"/>
  </g>
  <text x="104" y="1268" font-size="15.5" fill="#6B7280">Holding inventory until reconciliation finishes</text>

  
  <rect x="40" y="1302" width="1160" height="180" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <g filter="url(#p2x-soft)">
    <rect x="76" y="1322" width="420" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="76" y="1322" width="6" height="90" fill="#059669" clip-path="url(#p2x-k7)"/>
  </g>
  <circle cx="114" cy="1367" r="18" fill="#FFFFFF"/>
  <g transform="translate(103.56,1356.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="140" y="1374" font-size="18.5" font-weight="600" fill="#111827">no-store on money</text>
  <g fill="none" stroke="#059669" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M78,1432 L82.5,1436.5 L90,1426.5"/>
  </g>
  <text x="104" y="1438" font-size="15.5" fill="#6B7280">No stale price or status can drive a wrong action</text>
  <g fill="none" stroke="#DB2777" stroke-width="2.4" stroke-linecap="round">
    <path d="M78,1453 L89,1464 M89,1453 L78,1464"/>
  </g>
  <text x="104" y="1464" font-size="15.5" fill="#6B7280">Every monetary read reaches the service</text>

  
  <rect x="40" y="1510" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="1555" text-anchor="middle" font-size="16" fill="#475569">The cost proves that the alternative was actually considered.</text>
</svg>