<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="buycost-title buycost-desc">
<title id="buycost-title">What buying actually costs</title>
<desc id="buycost-desc">Integration, the limit you find later, price changes you do not control, the exit migration, and operational dependency. Smaller than the costs of building, and not zero.</desc>
<defs>
<marker id="buycost-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="buycost-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="buycost-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="buycost-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">What buying actually costs</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Buying has its own costs that are absent from the quote.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<circle cx="60" cy="146" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="153" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="440" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="310" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Integration</text>
<path d="M536 146H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 146H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buycost-marker-slate)"/>
<rect x="570" y="118" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="139.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">auth, data mapping, the part of your model</text><text x="590" y="164.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">that does not fit theirs</text>
<circle cx="60" cy="210" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="217" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="182" width="440" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="310" y="216" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The limit you find later</text>
<path d="M536 210H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 210H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buycost-marker-slate)"/>
<rect x="570" y="182" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="203.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">every vendor has a boundary; finding it</text><text x="590" y="228.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in year two is the expensive case</text>
<circle cx="60" cy="274" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="281" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="246" width="440" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="310" y="280" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Price changes you do not control</text>
<path d="M536 274H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 274H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buycost-marker-slate)"/>
<rect x="570" y="246" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="267.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per seat grows with headcount,</text><text x="590" y="292.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">per request grows with traffic</text>
<circle cx="60" cy="338" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="345" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="310" width="440" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="310" y="344" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The exit</text>
<path d="M536 338H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 338H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buycost-marker-slate)"/>
<rect x="570" y="310" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="331.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">this is the real content of the word lock-in,</text><text x="590" y="356.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and it is a migration project</text>
<circle cx="60" cy="402" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="409" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text>
<rect x="90" y="374" width="440" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="310" y="408" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Operational dependency</text>
<path d="M536 402H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M536 402H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#buycost-marker-slate)"/>
<rect x="570" y="374" width="630" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="395.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">their outage is now your outage,</text><text x="590" y="420.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">and you can only communicate about it</text>
<rect x="40" y="458" width="1160" height="124" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="458" width="5" height="124" rx="2.5" fill="#39D5AA"/><text x="64" y="487" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The honest framing of the dependency</text><text x="64" y="513" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Not their outage against no outage. Their outage against your outage.</text><text x="64" y="539" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A vendor whose only business is this thing usually runs it better</text><text x="64" y="565" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">than a team for whom it is one responsibility among nine.</text>
<rect x="40" y="606" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="606" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="643" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">The exception: if their outage takes your core product down, that is a single point of failure.</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The cost engineers feel most sharply is the one they reason about least well.</text>
</svg>