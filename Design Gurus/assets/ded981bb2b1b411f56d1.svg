<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Write-through: the cache writes the database and confirms only after the database commits, which keeps the cache and database consistent. Write-back: the cache confirms immediately and updates the database later, which is fastest but can lose recent writes in a crash. Write-around: the application writes only to the database and deletes the cache key.">
  <defs>
    <filter id="cwb3-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cwb3-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="cwb3-k1"><rect x="64" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cwb3-k2"><rect x="450" y="140" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="cwb3-k3"><rect x="836" y="140" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="540" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">When does a write reach the database?</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Three write strategies, with very different risks.</text>



  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#cwb3-soft)">
    <rect x="64" y="140" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="140" width="6" height="90" fill="#059669" clip-path="url(#cwb3-k1)"/>
  </g>
  <circle cx="102" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,174.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="128" y="192" font-size="21.5" font-weight="600" fill="#111827">Write-through</text>
  <text x="234" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">cache writes the database,</text>
  <text x="234" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">then confirms</text>
  <g filter="url(#cwb3-soft)">
    <rect x="450" y="140" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="450" y="140" width="6" height="90" fill="#DB2777" clip-path="url(#cwb3-k2)"/>
  </g>
  <circle cx="488" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,174.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="192" font-size="21.5" font-weight="600" fill="#111827">Write-back</text>
  <text x="620" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">confirms immediately,</text>
  <text x="620" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">database updated later</text>
  <g filter="url(#cwb3-lift)">
    <rect x="836" y="140" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="836" y="140" width="9" height="90" fill="#D97706" clip-path="url(#cwb3-k3)"/>
  </g>
  <circle cx="874" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(863.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="900" y="192" font-size="21.5" font-weight="600" fill="#111827">Write-around</text>
  <text x="1006" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">database only, then</text>
  <text x="1006" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">delete the cache key</text>

  <rect x="40" y="330" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="355" width="230" height="38" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="179" y="380" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">Write-through</text>
  <text x="323" y="380" font-size="18.5" fill="#475569">high consistency between cache and database, but slower writes</text>
  <rect x="64" y="405" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="430" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Write-back</text>
  <text x="323" y="430" font-size="18.5" fill="#475569">fastest, fewer database writes, but a crash loses unsaved writes</text>
  <rect x="64" y="455" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="480" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Write-around</text>
  <text x="323" y="480" font-size="18.5" fill="#475569">simple and safe; the next read loads the fresh value</text>
</svg>