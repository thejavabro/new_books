<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="970" viewBox="0 0 1240 970" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A web application sends a JSON message, a mobile application an XML message and a legacy system a SOAP message into the enterprise service bus; inside it a message adapter accepts the different formats, routing picks the appropriate service for each message based on routing rules: by message type, by content such as customer type or region, and by endpoint or service availability, and transformation then converts the message to the format that target service expects; the bus delivers a JSON message to the order service, an XML message to the payment service and a JSON message to the notification service">
