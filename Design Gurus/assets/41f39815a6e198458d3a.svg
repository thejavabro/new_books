    <marker id="m02f-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1000" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Four-layer architecture: adding external integrations</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">An integration layer beside the data access layer handles calls to external services.</text>

  <rect x="840" y="660" width="360" height="230" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="864" y="690" font-size="19.5" font-weight="600" fill="#B45309">Integration layer</text>

