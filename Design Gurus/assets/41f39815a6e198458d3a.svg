  <g transform="translate(891.56,757.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="928" y="775" font-size="18.5" font-weight="600" fill="#111827">Stripe payment gateway</text>
