  <g transform="translate(891.56,937.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
