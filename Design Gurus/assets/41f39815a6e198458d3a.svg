<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1000" viewBox="0 0 1240 1000" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends an HTTP request to the presentation layer and receives an HTTP response; the presentation layer calls down to the business logic layer, which calls down to the data access layer, which reads and writes the database; the business logic layer also calls down to an integration layer of adapters, a Stripe payment gateway and an email adapter, which call the external services">
