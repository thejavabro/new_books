<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="state-title state-desc">
<title id="state-title">State cannot stay in the process</title>
<desc id="state-desc">The first thing that breaks when a demo becomes a product, with three parts that have different lifetimes and different sizes.</desc>
<defs>
<marker id="state-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="state-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="state-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="state-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="810" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">State cannot stay in the process</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The first thing that breaks when a demo becomes a product.</text>
<rect x="40" y="732" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="732" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="82" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="82" rx="2.5" fill="#F28B9D"/><text x="64" y="150.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">In-memory state breaks on a restart, a different instance,</text><text x="64" y="179.5" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">a task longer than a request timeout, or a user returning an hour later.</text>
<rect x="40" y="224" width="300" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="190" y="258" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Conversation state</text>
<path d="M346 252H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 252H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#state-marker-slate)"/>
<rect x="390" y="224" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="258" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">grows without limit and will exceed the context window. Needs a strategy</text>
<rect x="40" y="292" width="300" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="190" y="326" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Task state</text>
<path d="M346 320H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 320H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#state-marker-slate)"/>
<rect x="390" y="292" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="326" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which step, what is done, what it is waiting for. This makes resumption possible</text>
<rect x="40" y="360" width="300" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="190" y="394" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Results</text>
<path d="M346 388H380" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M346 388H380" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#state-marker-slate)"/>
<rect x="390" y="360" width="810" height="56" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="410" y="394" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">what each step produced, so a resumed run does not repeat work that had effects</text>
<rect x="40" y="442" width="1160" height="60" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="442" width="5" height="60" rx="2.5" fill="#5EC9EC"/><text x="64" y="478" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">Durable, external and resumable. A failed step retries from the last completed one</text>
<rect x="40" y="528" width="1160" height="76" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="528" width="5" height="76" rx="2.5" fill="#F3CF6A"/><text x="64" y="559" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">That is a workflow engine, and most teams build a worse one by accident</text><text x="64" y="585" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A request handler grows retry logic, then a queue, then a state table, then a scheduler.</text>
<rect x="40" y="630" width="1160" height="76" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="630" width="5" height="76" rx="2.5" fill="#F28B9D"/><text x="64" y="661" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Resumption without idempotency is worse than no resumption</text><text x="64" y="687" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A resumed run sends the email twice. Key every action by the run and the step.</text>
<text x="66" y="766" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">All four of those failures happen in the first week.</text>
</svg>