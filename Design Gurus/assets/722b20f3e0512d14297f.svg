<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="736" viewBox="0 0 1240 736" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client panel holds the user&#39;s device and the client responsibilities: provide the user interface, capture user input, send requests to the server, display and process server responses, manage local state, and handle errors from the server. A request, for example an HTTP request, goes to the server panel, which holds an application server linked two ways to a database and the server responsibilities: listen for connections on a port, receive and process client requests, authenticate and authorize the caller, run business logic, access and manage data, and send responses back to the client. A response, for example data or a result, returns to the client">
  <defs>
    <filter id="m04c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m04c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m04c-k1"><rect x="157" y="210" width="215" height="90" rx="12"/></clipPath>
    <clipPath id="m04c-k2"><rect x="679" y="210" width="270" height="90" rx="12"/></clipPath>
    <marker id="m04c-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m04c-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="m04c-s-blue" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#2563EB"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="736" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Client vs. server: responsibilities explained</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The client presents the interface and sends requests; the server runs the logic, manages the data and responds.</text>

  <rect x="40" y="125" width="449" height="560" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="155" font-size="19.5" font-weight="600" fill="#475569">Client</text>
  <rect x="655" y="125" width="545" height="560" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="679" y="155" font-size="19.5" font-weight="600" fill="#047857">Server</text>
  <rect x="64" y="360" width="401" height="296" rx="14" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="88" y="390" font-size="19.5" font-weight="600" fill="#475569">Client responsibilities</text>
  <rect x="679" y="360" width="497" height="296" rx="14" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="703" y="390" font-size="19.5" font-weight="600" fill="#047857">Server responsibilities</text>

  <g fill="none" stroke-width="2">
    <path d="M489,230 H655" stroke="#2563EB" stroke-width="2.5" marker-end="url(#m04c-m-blue)"/>
    <path d="M655,340 H489" stroke="#059669" stroke-width="2.5" marker-end="url(#m04c-m-emerald)"/>
    <path d="M949,262 H1010" stroke="#2563EB" marker-end="url(#m04c-m-blue)" marker-start="url(#m04c-s-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="572" y="218" fill="#1D4ED8">Request</text>
    <text x="572" y="328" fill="#047857">Response</text>
  </g>

  <g filter="url(#m04c-soft)">
    <rect x="157" y="210" width="215" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="157" y="210" width="6" height="90" fill="#64748B" clip-path="url(#m04c-k1)"/>
  </g>
  <circle cx="195" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(184.56,244.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="221" y="262" font-size="21.5" font-weight="600" fill="#111827">User's device</text>
  <g filter="url(#m04c-soft)">
    <rect x="679" y="210" width="270" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="679" y="210" width="6" height="90" fill="#2563EB" clip-path="url(#m04c-k2)"/>
  </g>
  <circle cx="717" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(706.56,244.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="743" y="262" font-size="21.5" font-weight="600" fill="#111827">Application server</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M1010,206 L1010,302 A83,16 0 0 0 1176,302 L1176,206" fill="#DBEAFE"/>
    <ellipse cx="1093" cy="206" rx="83" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1093" y="269" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Database</text>
  <text x="572" y="256" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example,</text>
  <text x="572" y="278" font-size="18.5" text-anchor="middle" fill="#6B7280">HTTP request)</text>
  <text x="572" y="366" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example,</text>
  <text x="572" y="388" font-size="18.5" text-anchor="middle" fill="#6B7280">data or result)</text>

  <circle cx="94" cy="430" r="6" fill="#64748B"/>
  <text x="112" y="436" font-size="18.5" fill="#1F2937">Provide user interface (UI)</text>
  <circle cx="94" cy="468" r="6" fill="#64748B"/>
  <text x="112" y="474" font-size="18.5" fill="#1F2937">Capture user input</text>
  <circle cx="94" cy="506" r="6" fill="#64748B"/>
  <text x="112" y="512" font-size="18.5" fill="#1F2937">Send requests to the server</text>
  <circle cx="94" cy="544" r="6" fill="#64748B"/>
  <text x="112" y="550" font-size="18.5" fill="#1F2937">Display and process server responses</text>
  <circle cx="94" cy="582" r="6" fill="#64748B"/>
  <text x="112" y="588" font-size="18.5" fill="#1F2937">Manage local state</text>
  <circle cx="94" cy="620" r="6" fill="#64748B"/>
  <text x="112" y="626" font-size="18.5" fill="#1F2937">Handle errors from the server</text>
  <circle cx="709" cy="430" r="6" fill="#059669"/>
  <text x="727" y="436" font-size="18.5" fill="#1F2937">Listen for connections on a port</text>
  <circle cx="709" cy="468" r="6" fill="#059669"/>
  <text x="727" y="474" font-size="18.5" fill="#1F2937">Receive and process client requests</text>
  <circle cx="709" cy="506" r="6" fill="#059669"/>
  <text x="727" y="512" font-size="18.5" fill="#1F2937">Authenticate and authorize the caller</text>
  <circle cx="709" cy="544" r="6" fill="#059669"/>
  <text x="727" y="550" font-size="18.5" fill="#1F2937">Run business logic</text>
  <circle cx="709" cy="582" r="6" fill="#059669"/>
  <text x="727" y="588" font-size="18.5" fill="#1F2937">Access and manage data (for example, a database)</text>
  <circle cx="709" cy="620" r="6" fill="#059669"/>
  <text x="727" y="626" font-size="18.5" fill="#1F2937">Send responses back to the client</text>


</svg>