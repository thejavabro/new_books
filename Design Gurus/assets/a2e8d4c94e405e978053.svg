<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="846" viewBox="0 0 1240 846" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="variants-title variants-desc">
<title id="variants-title">The variants of the question</title>
<desc id="variants-desc">The question arrives in several forms and they want different things. Recognizing which one you were asked matters more than the technique you reach for.</desc>
<defs>
<marker id="variants-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="variants-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="variants-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="variants-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="846" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The variants of the question</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The question arrives in several forms and they want different things.</text>
<rect x="40" y="768" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="768" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="520" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="300" y="154" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"What breaks at ten times?"</text>
<path d="M566 148H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 148H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#variants-marker-slate)"/>
<rect x="610" y="118" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="154" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the component, the reason, the change, and what stays</text>
<rect x="40" y="190" width="520" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="300" y="226" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"What about a hundred times?"</text>
<path d="M566 220H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 220H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#variants-marker-slate)"/>
<rect x="610" y="190" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="213.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a different question. Usually a different</text><text x="630" y="238.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">architecture, possibly cells or regions</text>
<rect x="40" y="262" width="520" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="300" y="298" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"What if traffic is spiky?"</text>
<path d="M566 292H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 292H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#variants-marker-slate)"/>
<rect x="610" y="262" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="285.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">load shape, not volume. Queueing, shedding and</text><text x="630" y="310.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">autoscaling, not partitioning</text>
<rect x="40" y="334" width="520" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="300" y="370" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"What if data grows but traffic does not?"</text>
<path d="M566 364H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 364H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#variants-marker-slate)"/>
<rect x="610" y="334" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="357.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">storage and query cost. Archival, tiering,</text><text x="630" y="382.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">partitioning by time, keeping less</text>
<rect x="40" y="406" width="520" height="60" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="300" y="442" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">"What would you do differently?"</text>
<path d="M566 436H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 436H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#variants-marker-slate)"/>
<rect x="610" y="406" width="590" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="429.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not a scale question. Name one thing</text><text x="630" y="454.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">specifically and briefly</text>
<rect x="40" y="486" width="1160" height="62" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="486" width="5" height="62" rx="2.5" fill="#F28B9D"/><text x="64" y="523" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The common failure is answering the question you prepared.</text>
<text x="40" y="586" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The four scaling dimensions have different answers</text>
<rect x="40" y="604" width="272" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="176" y="638" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">traffic</text>
<rect x="336" y="604" width="272" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="472" y="638" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">data</text>
<rect x="632" y="604" width="272" height="56" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="768" y="638" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">users</text>
<rect x="928" y="604" width="272" height="56" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="1064" y="638" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">complexity</text>
<rect x="40" y="680" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="680" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="717" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">Noticing which one moved is the first thing to say.</text>
<text x="66" y="802" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A design is correct for a scale, and saying which scale makes it a design rather than a drawing.</text>
</svg>