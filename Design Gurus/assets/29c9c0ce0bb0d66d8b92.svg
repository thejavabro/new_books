<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="920" viewBox="0 0 1240 920" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Five authenticated management operations for the URL shortener, each tied to a caller job, plus the separate public redirect surface that the browser uses.">
  <defs>
    <filter id="yl07operati-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="yl07operati-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="yl07operati-k1"><rect x="84" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl07operati-k2"><rect x="84" y="364" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl07operati-k3"><rect x="84" y="596" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl07operati-k4"><rect x="684" y="174" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl07operati-k5"><rect x="684" y="397" width="472" height="90" rx="12"/></clipPath>
    <clipPath id="yl07operati-k6"><rect x="684" y="620" width="472" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="920" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Five management operations, and one public redirect</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">all five require authentication</text>

  
  <rect x="44" y="126" width="552" height="398" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#475569">Write operations</text>
  <text x="572" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two operations</text>

  
  <g filter="url(#yl07operati-lift)">
    <rect x="84" y="174" width="472" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="84" y="174" width="9" height="90" fill="#2563EB" clip-path="url(#yl07operati-k1)"/>
  </g>
  <circle cx="122" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,208.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="148" y="226" font-size="18.5" font-weight="600" fill="#111827">Create a short link</text>
  <text x="320" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">POST /v1/links</text>
  <text x="320" y="312" text-anchor="middle" font-size="15.5" fill="#94A3B8">designed in full in Step 4</text>

  
  <g filter="url(#yl07operati-soft)">
    <rect x="84" y="364" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="364" width="6" height="90" fill="#64748B" clip-path="url(#yl07operati-k2)"/>
  </g>
  <circle cx="122" cy="409" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,398.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="148" y="416" font-size="18.5" font-weight="600" fill="#111827">Stop a link redirecting</text>
  <text x="320" y="479" text-anchor="middle" font-size="15.5" fill="#6B7280">DELETE /v1/links/{link_id}</text>
  <text x="320" y="502" text-anchor="middle" font-size="15.5" fill="#94A3B8">marks it unusable, returns 204</text>

  
  <rect x="44" y="548" width="552" height="232" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="578" font-size="16.5" font-weight="600" fill="#B45309">The public redirect surface</text>
  <text x="572" y="578" text-anchor="end" font-size="15.5" fill="#6B7280">not one of the five</text>

  <g filter="url(#yl07operati-soft)">
    <rect x="84" y="596" width="472" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="84" y="596" width="6" height="90" fill="#D97706" clip-path="url(#yl07operati-k3)"/>
  </g>
  <circle cx="122" cy="641" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,630.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/>
    <path d="M8 21h8"/>
    <path d="M12 17v4"/>
  </g>
  <text x="148" y="648" font-size="18.5" font-weight="600" fill="#111827">Browser follows a short link</text>
  <text x="320" y="711" text-anchor="middle" font-size="15.5" fill="#6B7280">The browser never calls these operations.</text>
  <text x="320" y="734" text-anchor="middle" font-size="15.5" fill="#94A3B8">It sends GET to the short-link domain and receives a redirect.</text>
  <text x="320" y="757" text-anchor="middle" font-size="15.5" fill="#94A3B8">That is a separate surface, with separate rules.</text>

  
  <rect x="644" y="126" width="552" height="654" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="668" y="156" font-size="16.5" font-weight="600" fill="#475569">Read operations</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">three operations</text>

  <g filter="url(#yl07operati-soft)">
    <rect x="684" y="174" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="174" width="6" height="90" fill="#64748B" clip-path="url(#yl07operati-k4)"/>
  </g>
  <circle cx="722" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,208.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="748" y="226" font-size="18.5" font-weight="600" fill="#111827">Retrieve one managed link</text>
  <text x="920" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">GET /v1/links/{link_id}</text>
  <text x="920" y="312" text-anchor="middle" font-size="15.5" fill="#94A3B8">authorized owner or service only</text>

  <g filter="url(#yl07operati-soft)">
    <rect x="684" y="397" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="397" width="6" height="90" fill="#64748B" clip-path="url(#yl07operati-k5)"/>
  </g>
  <circle cx="722" cy="442" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,431.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/>
    <path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="748" y="449" font-size="18.5" font-weight="600" fill="#111827">List owned links</text>
  <text x="920" y="512" text-anchor="middle" font-size="15.5" fill="#6B7280">GET /v1/links?cursor=...&amp;limit=...</text>
  <text x="920" y="535" text-anchor="middle" font-size="15.5" fill="#94A3B8">cursor paged, may filter by status</text>

  <g filter="url(#yl07operati-soft)">
    <rect x="684" y="620" width="472" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="684" y="620" width="6" height="90" fill="#64748B" clip-path="url(#yl07operati-k6)"/>
  </g>
  <circle cx="722" cy="665" r="18" fill="#FFFFFF"/>
  <g transform="translate(711.56,654.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="748" y="672" font-size="18.5" font-weight="600" fill="#111827">Read aggregate clicks</text>
  <text x="920" y="735" text-anchor="middle" font-size="15.5" fill="#6B7280">GET /v1/links/{link_id}/statistics</text>
  <text x="920" y="758" text-anchor="middle" font-size="15.5" fill="#94A3B8">may be eventually consistent</text>

  
  <rect x="40" y="804" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="849" text-anchor="middle" font-size="16" fill="#475569">Creation is the most important write, so it becomes the deep operation.</text>
</svg>