<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="One order traced through the outbox: the request commits both rows, the relay polls and publishes, the broker delivers at least once, and the consumer checks the event id before acting">
  <defs>
    <marker id="ob4-mamber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <clipPath id="ob4-k1"><rect x="72" y="60" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="ob4-k2"><rect x="304" y="60" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="ob4-k3"><rect x="536" y="60" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="ob4-k4"><rect x="768" y="60" width="204" height="90" rx="12"/></clipPath>
    <clipPath id="ob4-k5"><rect x="1000" y="60" width="204" height="90" rx="12"/></clipPath>
    <filter id="ob4-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="ob4-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="400" fill="#FFFFFF"/>

  <g fill="none" stroke="#D97706" stroke-width="2">
    <path d="M276,105 H296" marker-end="url(#ob4-mamber)"/>
    <path d="M508,105 H528" marker-end="url(#ob4-mamber)"/>
    <path d="M740,105 H760" marker-end="url(#ob4-mamber)"/>
    <path d="M972,105 H992" marker-end="url(#ob4-mamber)"/>
  </g>
  <g filter="url(#ob4-soft)">
    <rect x="72" y="60" width="204" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="60" width="6" height="90" fill="#2563EB" clip-path="url(#ob4-k1)"/>
  </g>
  <circle cx="110" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,94.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="136" y="112" font-size="18.5" font-weight="600" fill="#111827">placeOrder()</text>
  <text x="174" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">the request handler</text>
  <g filter="url(#ob4-soft)">
    <rect x="304" y="60" width="204" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="304" y="60" width="6" height="90" fill="#7C3AED" clip-path="url(#ob4-k2)"/>
  </g>
  <circle cx="342" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(331.56,94.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  </g>
  <text x="368" y="112" font-size="18.5" font-weight="600" fill="#111827">One Commit</text>
  <text x="406" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">order + outbox row</text>
  <g filter="url(#ob4-soft)">
    <rect x="536" y="60" width="204" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="536" y="60" width="6" height="90" fill="#D97706" clip-path="url(#ob4-k3)"/>
  </g>
  <circle cx="574" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(563.56,94.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12a8.5 8.5 0 0 1-14.6 5.9"/><path d="M3.5 12a8.5 8.5 0 0 1 14.6-5.9"/><path d="M18.1 2.6v3.5h-3.5M5.9 21.4v-3.5h3.5"/>
  </g>
  <text x="600" y="112" font-size="18.5" font-weight="600" fill="#111827">Relay</text>
  <text x="638" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">polls the table</text>
  <g filter="url(#ob4-soft)">
    <rect x="768" y="60" width="204" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="768" y="60" width="6" height="90" fill="#D97706" clip-path="url(#ob4-k4)"/>
  </g>
  <circle cx="806" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(795.56,94.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="832" y="112" font-size="18.5" font-weight="600" fill="#111827">Broker</text>
  <text x="870" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">delivers at least once</text>
  <g filter="url(#ob4-soft)">
    <rect x="1000" y="60" width="204" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1000" y="60" width="6" height="90" fill="#059669" clip-path="url(#ob4-k5)"/>
  </g>
  <circle cx="1038" cy="105" r="18" fill="#FFFFFF"/>
  <g transform="translate(1027.56,94.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1064" y="112" font-size="18.5" font-weight="600" fill="#111827">Consumer</text>
  <text x="1102" y="175" font-size="15.5" text-anchor="middle" fill="#6B7280">checks event id first</text>
  <rect x="40" y="240" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="264" width="200" height="32" rx="9" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="164" y="286" text-anchor="middle" font-size="15.5" font-weight="600" fill="#5B21B6">Atomic</text>
  <text x="288" y="286" font-size="15.5" fill="#475569">the order row and the event row commit together</text>
  <rect x="64" y="308" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="330" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Repeatable</text>
  <text x="288" y="330" font-size="15.5" fill="#475569">publish happens later and may repeat, the consumer makes repeats safe</text>
</svg>