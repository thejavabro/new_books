<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="550" viewBox="0 0 1240 550" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="ActiveReservationsService keeps one Linked HashMap per show, mapping each BookingID to its timestamp with the oldest hold always at the head of the map.">
  <defs>
    <marker id="tm04-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <filter id="tm04-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <clipPath id="tm04-k1"><rect x="100" y="140" width="183" height="90" rx="12"/></clipPath>
    <clipPath id="tm04-k2"><rect x="430" y="120" width="470" height="224" rx="12"/></clipPath>
    <clipPath id="tm04-k3"><rect x="960" y="140" width="183" height="90" rx="12"/></clipPath>
    <clipPath id="tm04-k4"><rect x="996" y="290" width="110" height="56" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="550" fill="#FFFFFF"/>

  
  <rect x="50" y="56" width="1140" height="344" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="74" y="86" font-size="16.5" font-weight="600" fill="#5B21B6">ActiveReservationsService</text>

  
  <g fill="none" stroke="#7C3AED" stroke-width="2">
    <path d="M283,185 L430,185" marker-end="url(#tm04-vi)"/>
    <path d="M1051,230 V290" marker-end="url(#tm04-vi)"/>
  </g>

  
  <g filter="url(#tm04-soft)">
    <rect x="100" y="140" width="183" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="100" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#tm04-k1)"/>
  </g>
  <circle cx="138" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(127.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="164" y="192" font-size="18.5" font-weight="600" fill="#111827">ShowID 512</text>

  
  <g filter="url(#tm04-soft)">
    <rect x="430" y="120" width="470" height="224" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="430" y="120" width="6" height="224" fill="#2563EB" clip-path="url(#tm04-k2)"/>
  </g>
  <circle cx="468" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(457.56,154.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="494" y="172" font-size="18.5" font-weight="600" fill="#111827">Linked HashMap</text>

  <rect x="454" y="192" width="422" height="40" rx="8" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  <text x="470" y="217" font-size="15.5" fill="#111827">BookingID 71 -&gt; 14:02:10</text>
  <text x="860" y="217" font-size="15.5" font-weight="600" text-anchor="end" fill="#047857">head, next to expire</text>

  <rect x="454" y="240" width="422" height="40" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="470" y="265" font-size="15.5" fill="#111827">BookingID 74 -&gt; 14:03:05</text>

  <rect x="454" y="288" width="422" height="40" rx="8" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="470" y="313" font-size="15.5" fill="#111827">BookingID 79 -&gt; 14:04:40</text>

  <text x="665" y="369" font-size="15.5" text-anchor="middle" fill="#6B7280">insertion order IS expiry order, so the daemon only ever checks the head</text>

  
  <g filter="url(#tm04-soft)">
    <rect x="960" y="140" width="183" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="960" y="140" width="6" height="90" fill="#7C3AED" clip-path="url(#tm04-k3)"/>
  </g>
  <circle cx="998" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(987.56,174.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="1024" y="192" font-size="18.5" font-weight="600" fill="#111827">ShowID 517</text>

  <g filter="url(#tm04-soft)">
    <rect x="996" y="290" width="110" height="56" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="996" y="290" width="6" height="56" fill="#2563EB" clip-path="url(#tm04-k4)"/>
  </g>
  <text x="1054" y="325" font-size="18.5" font-weight="600" text-anchor="middle" fill="#111827">...</text>
  <text x="1051" y="371" font-size="15.5" text-anchor="middle" fill="#94A3B8">one map per show</text>

  
  <rect x="40" y="436" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="481" text-anchor="middle" font-size="16" fill="#475569">All holds also exist as Booking rows with Status Reserved, so a crashed service rebuilds this memory with one query.</text>
</svg>