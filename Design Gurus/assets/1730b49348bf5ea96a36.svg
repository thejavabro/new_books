<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1070" viewBox="0 0 1240 1070" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The seat state machine: a named seat starts available, a hold moves it to held with a two minute expiry, a successful payment moves it to sold, and a TTL expiry or an abandoned buyer returns it to available. There is no direct transition from available to sold.">
  <defs>
    <marker id="m07-l05-seat-states-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m07-l05-seat-states-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l05-seat-states-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <marker id="m07-l05-seat-states-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l05-seat-states-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1070" fill="#FFFFFF"/>

  <text x="620" y="70" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">There is no available to sold transition</text>
  <text x="620" y="102" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Every path to sold goes through held, so nothing can skip the claim</text>

  <path d="M320,352 C450,180 900,180 1005,352" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l05-seat-states-rd)"/>
  <circle cx="663" cy="205" r="16" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="3" stroke-linecap="round">
    <line x1="654" y1="196" x2="672" y2="214"/>
    <line x1="672" y1="196" x2="654" y2="214"/>
  </g>

  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="100" y="360" width="320" height="140" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="260" y="405" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">available</text>
  <text x="260" y="437" text-anchor="middle" font-size="20" fill="#64748B">nobody has a claim,</text>
  <text x="260" y="469" text-anchor="middle" font-size="20" fill="#64748B">an expired hold reads as this</text>
  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="490" y="345" width="340" height="170" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="660" y="389" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">held</text>
  <text x="660" y="421" text-anchor="middle" font-size="20" fill="#64748B">a temporary exclusive claim,</text>
  <text x="660" y="453" text-anchor="middle" font-size="20" fill="#64748B">expiry now plus 2 minutes,</text>
  <text x="660" y="485" text-anchor="middle" font-size="20" fill="#64748B">server enforced</text>
  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="880" y="360" width="280" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="1020" y="405" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">sold</text>
  <text x="1020" y="437" text-anchor="middle" font-size="20" fill="#64748B">the ticket is issued,</text>
  <text x="1020" y="469" text-anchor="middle" font-size="20" fill="#64748B">never sold twice</text>

  <g fill="none" stroke-width="2.5">
    <path d="M73,430 L92,430" stroke="#475569" stroke-width="2" marker-end="url(#m07-l05-seat-states-sl)"/>
    <path d="M420,430 L482,430" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l05-seat-states-bl)"/>
    <path d="M830,430 L872,430" stroke="#059669" marker-end="url(#m07-l05-seat-states-em)"/>
    <path d="M1160,430 L1176,430" stroke="#475569" stroke-width="2" marker-end="url(#m07-l05-seat-states-sl)"/>
    <path d="M660,514 L660,570 L260,570 L260,508" stroke="#DC2626" marker-end="url(#m07-l05-seat-states-rd)"/>
  </g>

  <circle cx="60" cy="430" r="12" fill="#475569"/>
  <circle cx="1195" cy="430" r="14" fill="#FFFFFF" stroke="#475569" stroke-width="2.5"/>
  <circle cx="1195" cy="430" r="7" fill="#475569"/>

  <text x="455" y="330" text-anchor="middle" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hold taken</text>
  <text x="851" y="314" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">payment succeeds</text>
  <text x="460" y="556" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the TTL expires, or the buyer abandons it</text>
  <text x="460" y="604" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">applied lazily, at the very next claim</text>

  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="40" y="660" width="380" height="230" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="230" y="718" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">The conditional write</text>
  <text x="230" y="750" text-anchor="middle" font-size="20" fill="#475569">One update on one seat row: set</text>
  <text x="230" y="782" text-anchor="middle" font-size="20" fill="#475569">it to held with a 2 minute expiry,</text>
  <text x="230" y="814" text-anchor="middle" font-size="20" fill="#475569">only if it is available or expired.</text>
  <text x="230" y="846" text-anchor="middle" font-size="20" fill="#475569">1 row updated means you got it.</text>
  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="430" y="660" width="380" height="230" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="620" y="718" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Who enforces the expiry</text>
  <text x="620" y="750" text-anchor="middle" font-size="20" fill="#475569">The server, never a countdown in</text>
  <text x="620" y="782" text-anchor="middle" font-size="20" fill="#475569">the browser. The next claim treats</text>
  <text x="620" y="814" text-anchor="middle" font-size="20" fill="#475569">an expired hold as available.</text>
  <text x="620" y="846" text-anchor="middle" font-size="20" fill="#475569">The sweeper only republishes.</text>
  <g filter="url(#m07-l05-seat-states-soft)">
    <rect x="820" y="660" width="380" height="230" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  </g>
  <text x="1010" y="718" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Four adjacent seats</text>
  <text x="1010" y="750" text-anchor="middle" font-size="20" fill="#475569">Four conditional writes in one</text>
  <text x="1010" y="782" text-anchor="middle" font-size="20" fill="#475569">local transaction: all four land,</text>
  <text x="1010" y="814" text-anchor="middle" font-size="20" fill="#475569">or nothing is held. No distributed</text>
  <text x="1010" y="846" text-anchor="middle" font-size="20" fill="#475569">lock, no two phase commit.</text>

  <line x1="60" y1="950" x2="96" y2="950" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="957" font-size="20" fill="#475569">The legal forward transition: available to held</text>
  <line x1="60" y1="990" x2="96" y2="990" stroke="#059669" stroke-width="4"/>
  <text x="108" y="997" font-size="20" fill="#475569">Payment captured, and the seat is sold</text>
  <line x1="60" y1="1030" x2="96" y2="1030" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1037" font-size="20" fill="#475569">Server-enforced expiry, and the transition that does not exist</text>
</svg>