<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="What externalizing configuration costs and what keeps each cost small. The configuration server is one more thing to run, values arrive over the network at startup, and secrets move into a shared store. Running several servers, caching values in the client and encrypting secrets keep each cost small">
  <defs>
    <marker id="cf5-memerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <clipPath id="cf5-k1"><rect x="72" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf5-k2"><rect x="455" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf5-k3"><rect x="838" y="112" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf5-k4"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf5-k5"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="cf5-k6"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
    <filter id="cf5-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="cf5-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#B45309">What externalizing configuration costs</text>
  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">What keeps each cost small</text>
  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M237,296 V394" marker-end="url(#cf5-memerald)"/>
    <path d="M620,296 V394" marker-end="url(#cf5-memerald)"/>
    <path d="M1003,296 V394" marker-end="url(#cf5-memerald)"/>
  </g>
  <g filter="url(#cf5-soft)">
    <rect x="72" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf5-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">One More Thing To Run</text>
  <text x="237" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">if the config server is down,</text>
  <text x="237" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">services cannot start</text>
  <g filter="url(#cf5-soft)">
    <rect x="455" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="455" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf5-k2)"/>
  </g>
  <circle cx="493" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="519" y="164" font-size="18.5" font-weight="600" fill="#111827">A Fetch On Startup</text>
  <text x="620" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">values arrive over the network</text>
  <text x="620" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">so startup now depends on it</text>
  <g filter="url(#cf5-soft)">
    <rect x="838" y="112" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="838" y="112" width="6" height="90" fill="#D97706" clip-path="url(#cf5-k3)"/>
  </g>
  <circle cx="876" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,146.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4.5" y="10.5" width="15" height="10.5" rx="2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/>
  </g>
  <text x="902" y="164" font-size="18.5" font-weight="600" fill="#111827">Secrets In One Place</text>
  <text x="1003" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">credentials now live in a store</text>
  <text x="1003" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">that has to be locked down</text>
  <g filter="url(#cf5-lift)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="72" y="398" width="9" height="90" fill="#059669" clip-path="url(#cf5-k4)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Run Several Of Them</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">more than one instance, so a</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">single failure stops nothing</text>
  <g filter="url(#cf5-soft)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="455" y="398" width="6" height="90" fill="#059669" clip-path="url(#cf5-k5)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Cache The Values</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">clients hold them in memory,</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">so no fetch happens per request</text>
  <g filter="url(#cf5-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#059669" clip-path="url(#cf5-k6)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Encrypt And Restrict</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">secrets are stored encrypted</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">and read by who needs them</text>
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="636" width="200" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#047857">Worth knowing</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">a version controlled store gives you the rollback path, so a bad value is reverted like a bad commit</text>
  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Do not forget</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">services still have to find the configuration server itself, which is what a service registry is for</text>
</svg>