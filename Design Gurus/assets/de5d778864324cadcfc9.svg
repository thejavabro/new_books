<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="500" viewBox="0 0 1240 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The rejected response carries the wait time, and the client that respects it succeeds on the retry">
  <rect x="0" y="0" width="1240" height="500" fill="#FFFFFF"/>
  <defs>
    <marker id="rl12-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="rl12-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="rl12-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="rl12-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="280" y1="110" x2="280" y2="420" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="960" y1="110" x2="960" y2="420" stroke="#94A3B8" stroke-width="2" stroke-dasharray="6 5"/>

  <line x1="280" y1="160" x2="952" y2="160" stroke="#475569" stroke-width="2.5" marker-end="url(#rl12-slate)"/>
  <line x1="960" y1="215" x2="288" y2="215" stroke="#DC2626" stroke-width="2.5" marker-end="url(#rl12-red)"/>
  <line x1="280" y1="340" x2="952" y2="340" stroke="#475569" stroke-width="2.5" marker-end="url(#rl12-slate)"/>
  <line x1="960" y1="395" x2="288" y2="395" stroke="#059669" stroke-width="2.5" marker-end="url(#rl12-green)"/>

  <g filter="url(#rl12-soft)">
    <rect x="140" y="40" width="280" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="820" y="40" width="280" height="64" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="150" y="250" width="260" height="56" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  </g>

  <text x="280" y="79" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Client</text>
  <text x="960" y="79" font-size="20" font-weight="700" fill="#92400E" text-anchor="middle">Server</text>

  <text x="616" y="145" font-size="20" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">request</text>
  <text x="616" y="200" font-size="20" font-weight="600" fill="#DC2626" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">429, Retry-After: 30</text>
  <text x="280" y="286" font-size="20" fill="#475569" text-anchor="middle">waits 30 seconds</text>
  <text x="616" y="325" font-size="20" fill="#334155" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">the same request again</text>
  <text x="616" y="380" font-size="20" font-weight="600" fill="#059669" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">200 OK</text>

  <text x="620" y="465" font-size="20" fill="#475569" text-anchor="middle">Retry-After tells the client when the allowance refills, so the retry succeeds instead of failing again</text>
</svg>