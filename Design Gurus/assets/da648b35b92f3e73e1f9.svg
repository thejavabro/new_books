<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="840" viewBox="0 0 1240 840" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Six steps. 1, servers A, B and C register with the service registry. 2, a client (a web app, a mobile app or a batch job) sends a request such as create_order(items) to the broker, which holds service discovery and load balancing. 3, the broker looks up the service in the registry to get its healthy instances. 4, the broker routes the request to the selected server, Server B; Server A is also healthy and Server C is unhealthy. 5, Server B sends the response to the broker. 6, the broker returns the response to the client">
  <defs>
    <filter id="m12f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m12f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m12f-k1"><rect x="60" y="495" width="190" height="60" rx="12"/></clipPath>
    <clipPath id="m12f-k2"><rect x="60" y="575" width="190" height="60" rx="12"/></clipPath>
    <clipPath id="m12f-k3"><rect x="60" y="655" width="190" height="60" rx="12"/></clipPath>
    <clipPath id="m12f-k4"><rect x="550" y="560" width="220" height="100" rx="12"/></clipPath>
    <clipPath id="m12f-k5"><rect x="990" y="300" width="210" height="80" rx="12"/></clipPath>
    <clipPath id="m12f-k6"><rect x="990" y="505" width="210" height="80" rx="12"/></clipPath>
    <clipPath id="m12f-k7"><rect x="990" y="680" width="210" height="80" rx="12"/></clipPath>
    <marker id="m12f-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="m12f-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="840" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How service discovery works in broker architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Servers register, the broker looks up healthy instances, and it routes each client request to one of them.</text>

  <rect x="40" y="440" width="230" height="310" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="470" font-size="19.5" font-weight="600" fill="#475569">Clients</text>
  <rect x="530" y="470" width="260" height="270" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="554" y="500" font-size="19.5" font-weight="600" fill="#5B21B6">Broker</text>

  <g fill="none" stroke-width="2">
    <path d="M1200,340 H1222" stroke="#4F46E5" stroke-dasharray="7 6"/>
    <path d="M1200,545 H1222" stroke="#4F46E5" stroke-dasharray="7 6"/>
    <path d="M1200,720 H1222 V164 Q1222,152 1210,152 H662 Q650,152 650,164 V184" stroke="#4F46E5" stroke-dasharray="7 6" marker-end="url(#m12f-m-indigo)"/>
    <path d="M650,470 V310" stroke="#4F46E5" stroke-dasharray="7 6" marker-end="url(#m12f-m-indigo)"/>
    <path d="M270,530 H530" stroke="#2563EB" marker-end="url(#m12f-m-blue)"/>
    <path d="M530,700 H270" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12f-m-blue)"/>
    <path d="M790,530 H990" stroke="#2563EB" marker-end="url(#m12f-m-blue)"/>
    <path d="M990,565 H790" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m12f-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="940" y="140" fill="#4338CA">1. Register services</text>
    <text x="664" y="382" fill="#4338CA" text-anchor="start">3. Lookup service</text>
    <text x="400" y="468" fill="#1D4ED8">2. Send request</text>
    <text x="890" y="488" fill="#1D4ED8">4. Route to</text>
    <text x="890" y="511" fill="#1D4ED8">selected server</text>
    <text x="890" y="598" fill="#1D4ED8">5. Response</text>
    <text x="400" y="660" fill="#1D4ED8">6. Return response</text>
  </g>

  <g filter="url(#m12f-soft)">
    <rect x="60" y="495" width="190" height="60" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="495" width="6" height="60" fill="#64748B" clip-path="url(#m12f-k1)"/>
  </g>
  <circle cx="98" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,514.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="124" y="532" font-size="18.5" font-weight="600" fill="#111827">Web app</text>
  <g filter="url(#m12f-soft)">
    <rect x="60" y="575" width="190" height="60" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="575" width="6" height="60" fill="#64748B" clip-path="url(#m12f-k2)"/>
  </g>
  <circle cx="98" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,594.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="124" y="612" font-size="18.5" font-weight="600" fill="#111827">Mobile app</text>
  <g filter="url(#m12f-soft)">
    <rect x="60" y="655" width="190" height="60" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="60" y="655" width="6" height="60" fill="#64748B" clip-path="url(#m12f-k3)"/>
  </g>
  <circle cx="98" cy="685" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,674.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="124" y="692" font-size="18.5" font-weight="600" fill="#111827">Batch job</text>
  <g filter="url(#m12f-lift)">
    <rect x="550" y="560" width="220" height="100" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="550" y="560" width="9" height="100" fill="#7C3AED" clip-path="url(#m12f-k4)"/>
  </g>
  <text x="570" y="605.75" font-size="18.5" font-weight="600" fill="#111827">Service discovery</text>
  <text x="570" y="628.25" font-size="18.5" font-weight="600" fill="#111827">+ load balancing</text>
  <g filter="url(#m12f-soft)">
    <rect x="990" y="300" width="210" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="990" y="300" width="6" height="80" fill="#059669" clip-path="url(#m12f-k5)"/>
  </g>
  <circle cx="1028" cy="340" r="18" fill="#FFFFFF"/>
  <g transform="translate(1017.56,329.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="1054" y="347" font-size="21.5" font-weight="600" fill="#111827">Server A</text>
  <text x="1095" y="409" font-size="18.5" text-anchor="middle" fill="#6B7280">healthy</text>
  <g filter="url(#m12f-soft)">
    <rect x="990" y="505" width="210" height="80" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="990" y="505" width="6" height="80" fill="#059669" clip-path="url(#m12f-k6)"/>
  </g>
  <circle cx="1028" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(1017.56,534.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="1054" y="552" font-size="21.5" font-weight="600" fill="#111827">Server B</text>
  <text x="1095" y="614" font-size="18.5" text-anchor="middle" fill="#6B7280">healthy</text>
  <g filter="url(#m12f-soft)">
    <rect x="990" y="680" width="210" height="80" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="990" y="680" width="6" height="80" fill="#DB2777" clip-path="url(#m12f-k7)"/>
  </g>
  <circle cx="1028" cy="720" r="18" fill="#FFFFFF"/>
  <g transform="translate(1017.56,709.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="1054" y="727" font-size="21.5" font-weight="600" fill="#111827">Server C</text>
  <text x="1095" y="789" font-size="18.5" text-anchor="middle" fill="#6B7280">unhealthy</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M540,200 L540,294 A110,16 0 0 0 760,294 L760,200" fill="#DBEAFE"/>
    <ellipse cx="650" cy="200" rx="110" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="650" y="249.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Service</text>
  <text x="650" y="274.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">registry</text>
  <text x="664" y="407" font-size="18.5" text-anchor="start" fill="#6B7280">(get healthy instances)</text>
  <text x="400" y="492" font-size="18.5" text-anchor="middle" fill="#6B7280">(for example,</text>
  <text x="400" y="516" font-size="18.5" text-anchor="middle" fill="#6B7280">create_order(items))</text>
  <text x="400" y="684" font-size="18.5" text-anchor="middle" fill="#6B7280">(to client)</text>

  <circle cx="98" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(87.56,594.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></g>


</svg>