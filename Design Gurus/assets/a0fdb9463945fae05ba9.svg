<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="718" viewBox="0 0 1240 718" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A forward proxy sits beside the client and represents it, NAT sits at the network edge and only rewrites addresses, and a reverse proxy sits in front of the servers and represents them">
  <rect x="0" y="0" width="1240" height="718" fill="#FFFFFF"/>
  <defs>
    <marker id="nw3-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <filter id="nw3-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Three intermediaries on one path, and whose side each is on</text>

  <line x1="204" y1="220" x2="226" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw3-slate)"/>
  <line x1="434" y1="220" x2="456" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw3-slate)"/>
  <line x1="644" y1="220" x2="666" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw3-slate)"/>
  <line x1="814" y1="220" x2="836" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw3-slate)"/>
  <line x1="1044" y1="220" x2="1066" y2="220" stroke="#475569" stroke-width="2" marker-end="url(#nw3-slate)"/>

  <g filter="url(#nw3-soft)">
    <rect x="50" y="180" width="150" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="230" y="180" width="200" height="80" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="460" y="180" width="180" height="80" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
    <rect x="670" y="180" width="140" height="80" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="7 5"/>
    <rect x="840" y="180" width="200" height="80" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="1070" y="180" width="130" height="80" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="125" y="228" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Client</text>
  <text x="330" y="216" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Forward</text>
  <text x="330" y="242" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">proxy</text>
  <text x="550" y="228" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">NAT</text>
  <text x="740" y="228" font-size="20" fill="#94A3B8" text-anchor="middle">internet</text>
  <text x="940" y="216" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Reverse</text>
  <text x="940" y="242" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">proxy</text>
  <text x="1135" y="228" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Servers</text>

  
  <rect x="50" y="320" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5"/>
  <path d="M50 332 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#FFFBEB"/>
  <text x="230" y="354" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Forward proxy</text>
  <text x="70" y="410" font-size="20" font-weight="600" fill="#475569">Sits</text>
  <text x="70" y="440" font-size="20" fill="#0F172A">next to the client</text>
  <text x="70" y="482" font-size="20" font-weight="600" fill="#475569">Acts for</text>
  <text x="70" y="512" font-size="20" fill="#0F172A">the client</text>
  <text x="70" y="544" font-size="20" fill="#92400E">hides who is asking</text>

  <rect x="440" y="320" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#7C3AED" stroke-width="1.5"/>
  <path d="M440 332 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#F5F3FF"/>
  <text x="620" y="354" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">NAT</text>
  <text x="460" y="410" font-size="20" font-weight="600" fill="#475569">Sits</text>
  <text x="460" y="440" font-size="20" fill="#0F172A">at the network edge</text>
  <text x="460" y="482" font-size="20" font-weight="600" fill="#475569">Acts for</text>
  <text x="460" y="512" font-size="20" fill="#0F172A">nobody, it rewrites</text>
  <text x="460" y="544" font-size="20" fill="#5B21B6">hides the private address</text>

  <rect x="830" y="320" width="360" height="240" rx="12" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  <path d="M830 332 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v40 h-360 z" fill="#EFF6FF"/>
  <text x="1010" y="354" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">Reverse proxy</text>
  <text x="850" y="410" font-size="20" font-weight="600" fill="#475569">Sits</text>
  <text x="850" y="440" font-size="20" fill="#0F172A">in front of the servers</text>
  <text x="850" y="482" font-size="20" font-weight="600" fill="#475569">Acts for</text>
  <text x="850" y="512" font-size="20" fill="#0F172A">the servers</text>
  <text x="850" y="544" font-size="20" fill="#1E40AF">hides how many there are</text>

  
  <rect x="50" y="596" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="632" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">All three sit in the middle. What separates them is whose identity they are protecting.</text>
  <text x="620" y="662" font-size="20" fill="#334155" text-anchor="middle">NAT is the odd one out: it represents nobody and makes no decisions, it only rewrites addresses.</text>
</svg>