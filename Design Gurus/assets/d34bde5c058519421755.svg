<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="582" viewBox="0 0 1240 582" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four PACELC combinations. PA slash EL is Cassandra, DynamoDB and Riak. PA slash EC is MongoDB in its usual primary-based setup. PC slash EL is PNUTS. PC slash EC is HBase, Spanner and VoltDB.">
  <rect x="0" y="0" width="1240" height="582" fill="#FFFFFF"/>
  <defs>
    <marker id="pc2-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="pc2-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="pc2-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pc2-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pc2-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="pc2-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="pc2-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="pc2-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="pc2-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The four combinations, and a system for each one</text>
  <g filter="url(#pc2-soft)"><rect x="320" y="68" width="440" height="62" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="540" y="96" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Else: Latency (EL)</text>
  <text x="540" y="120" font-size="18" fill="#64748B" text-anchor="middle">answer from the nearest copy</text>
  <g filter="url(#pc2-soft)"><rect x="776" y="68" width="440" height="62" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="996" y="96" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">Else: Consistency (EC)</text>
  <text x="996" y="120" font-size="18" fill="#64748B" text-anchor="middle">wait for the other copies</text>
  <rect x="24" y="146" width="280" height="186" rx="11" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <text x="164" y="220" font-size="19" fill="#64748B" text-anchor="middle">Partition:</text>
  <text x="164" y="250" font-size="21" font-weight="700" fill="#B45309" text-anchor="middle">Availability (PA)</text>
  <text x="164" y="280" font-size="18" fill="#64748B" text-anchor="middle">keep answering</text>
  <g filter="url(#pc2-soft)"><rect x="320" y="146" width="440" height="186" rx="11" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/></g>
  <text x="540" y="194" font-size="26" font-weight="700" fill="#B45309" text-anchor="middle">PA / EL</text>
  <text x="540" y="230" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cassandra, DynamoDB, Riak</text>
  <text x="540" y="268" font-size="19" fill="#64748B" text-anchor="middle">Fast at all times.</text>
  <text x="540" y="296" font-size="19" fill="#64748B" text-anchor="middle">A read can be old at any time.</text>
  <g filter="url(#pc2-soft)"><rect x="776" y="146" width="440" height="186" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="996" y="194" font-size="26" font-weight="700" fill="#1E40AF" text-anchor="middle">PA / EC</text>
  <text x="996" y="230" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">MongoDB, primary-based setup</text>
  <text x="996" y="268" font-size="19" fill="#64748B" text-anchor="middle">Fresh reads when healthy.</text>
  <text x="996" y="296" font-size="19" fill="#64748B" text-anchor="middle">Writes can be lost in a partition.</text>
  <rect x="24" y="348" width="280" height="186" rx="11" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <text x="164" y="422" font-size="19" fill="#64748B" text-anchor="middle">Partition:</text>
  <text x="164" y="452" font-size="21" font-weight="700" fill="#065F46" text-anchor="middle">Consistency (PC)</text>
  <text x="164" y="482" font-size="18" fill="#64748B" text-anchor="middle">stop answering</text>
  <g filter="url(#pc2-soft)"><rect x="320" y="348" width="440" height="186" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="540" y="396" font-size="26" font-weight="700" fill="#6D28D9" text-anchor="middle">PC / EL</text>
  <text x="540" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Yahoo PNUTS</text>
  <text x="540" y="470" font-size="19" fill="#64748B" text-anchor="middle">Refuses writes in a partition.</text>
  <text x="540" y="498" font-size="19" fill="#64748B" text-anchor="middle">Reads a nearby copy when healthy.</text>
  <g filter="url(#pc2-soft)"><rect x="776" y="348" width="440" height="186" rx="11" fill="#ECFDF5" stroke="#059669" stroke-width="2"/></g>
  <text x="996" y="396" font-size="26" font-weight="700" fill="#065F46" text-anchor="middle">PC / EC</text>
  <text x="996" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">HBase, Spanner, VoltDB</text>
  <text x="996" y="470" font-size="19" fill="#64748B" text-anchor="middle">Correct at all times.</text>
  <text x="996" y="498" font-size="19" fill="#64748B" text-anchor="middle">Slower at all times.</text>
  <text x="620" y="566" font-size="19" fill="#64748B" text-anchor="middle">Most stores can be configured, so a system can sit in more than one box at once.</text>
</svg>