<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The houses in a circle, with the first and last next to each other">
<defs>
<filter id="hr-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>
<text x="620" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">What is the most that can be taken from these 5 houses in a circle?</text>
<text x="620" y="80" text-anchor="middle" font-size="19" fill="#475569">No two houses next to each other, and the first and last count as next to each other</text>
<rect x="40" y="106" width="1160" height="548" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
<text x="64" y="136" font-size="19.5" font-weight="600" fill="#475569">The dashed line is the extra adjacency the circle adds, between the last and the first</text>
<path d="M836,302 C836,344 404,344 404,302" fill="none" stroke="#DB2777" stroke-width="2.5" stroke-dasharray="6 5"/>
<text x="620" y="360" text-anchor="middle" font-size="17.5" font-weight="600" fill="#BE185D">house 4 and house 0 are neighbours too</text>
<text x="332" y="264" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">money in house</text>
<rect x="356" y="226" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="404" y="263.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">1</text>
<rect x="464" y="226" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="512" y="263.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="572" y="226" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="620" y="263.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<rect x="680" y="226" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="728" y="263.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">4</text>
<rect x="788" y="226" width="96" height="60" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="836" y="263.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<text x="332" y="438" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">skipping the last</text>
<rect x="356" y="400" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="404" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="464" y="400" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="512" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="572" y="400" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="680" y="400" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="728" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="788" y="400" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="836" y="437.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="332" y="524" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">skipping the first</text>
<rect x="356" y="486" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="404" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="464" y="486" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="512" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="572" y="486" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="620" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="680" y="486" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="728" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<rect x="788" y="486" width="96" height="60" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="836" y="523.525" text-anchor="middle" font-size="21.5" font-weight="600" fill="#94A3B8"></text>
<text x="620" y="590" text-anchor="middle" font-size="19" font-weight="600" fill="#BE185D">That one extra pair is the only difference from a straight row of houses</text>
<rect x="40" y="668" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="708" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">The first and last houses can never both be taken</text>
<text x="620" y="740" text-anchor="middle" font-size="18.5" fill="#475569">So every answer either leaves out the first house or leaves out the last one</text>
</svg>