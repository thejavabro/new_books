<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="740" viewBox="0 0 1240 740" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="perreq-title perreq-desc">
<title id="perreq-title">The curve that changes shape</title>
<desc id="perreq-desc">Per-request pricing is excellent at low volume and is the most common source of a bill that grows faster than the product, because there is no moment where the price tells you the range has changed.</desc>
<defs>
<marker id="perreq-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="perreq-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="perreq-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="perreq-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="740" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The curve that changes shape</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Managed services bill in two broad ways, and the difference only matters at the extremes.</text>
<rect x="40" y="662" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="662" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="560" height="96" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="96" rx="2.5" fill="#5EC9EC"/><text x="64" y="146" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">By provisioned capacity</text><text x="64" y="172" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">predictable, paid whether used or not,</text><text x="64" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">idle is expensive</text>
<rect x="640" y="118" width="560" height="96" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="118" width="5" height="96" rx="2.5" fill="#F3CF6A"/><text x="664" y="146" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">By request</text><text x="664" y="172" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">nearly free to start, linear,</text><text x="664" y="198" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and no ceiling</text>
<rect x="40" y="232" width="1160" height="86" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="232" width="5" height="86" rx="2.5" fill="#F28B9D"/><text x="64" y="268" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Nothing in the price tells you the range has changed</text><text x="64" y="294" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">$3 a month at launch, $30 at traction, $30,000 at scale, and it never once looks alarming on the way up.</text>
<circle cx="60" cy="368" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="375" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="92" y="338" width="370" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="277" y="374" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A function invoked per item</text>
<path d="M468 368H502" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M468 368H502" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#perreq-marker-slate)"/>
<rect x="512" y="338" width="688" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="532" y="361.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a million events one at a time costs far more</text><text x="532" y="386.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">than a thousand at a time</text>
<circle cx="60" cy="440" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="447" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="92" y="410" width="370" height="60" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="277" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Requests rather than storage</text>
<path d="M468 440H502" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M468 440H502" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#perreq-marker-slate)"/>
<rect x="512" y="410" width="688" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="532" y="433.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a billion tiny objects can cost more in PUT and GET</text><text x="532" y="458.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">than in bytes held</text>
<circle cx="60" cy="512" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="519" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="92" y="482" width="370" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="277" y="518" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Logs and metrics by ingestion</text>
<path d="M468 512H502" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M468 512H502" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#perreq-marker-slate)"/>
<rect x="512" y="482" width="688" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="532" y="518" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">grows with traffic and with every field somebody adds</text>
<rect x="40" y="554" width="1160" height="82" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="554" width="5" height="82" rx="2.5" fill="#39D5AA"/><text x="64" y="588" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">For any per-request line, ask what it costs at ten times and a hundred times volume.</text><text x="64" y="614" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The hundred-times answer is the one that tells you the model is wrong.</text>
<text x="66" y="696" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Observability spend is frequently discovered to be a double-digit percentage of a bill.</text>
</svg>