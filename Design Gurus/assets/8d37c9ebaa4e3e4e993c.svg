<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1740" viewBox="0 0 1240 1740" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The Google News ingestion pipeline: a source configuration store drives crawlers and third party news APIs that pull from publishers over the internet, a feed manager checks a Bloom filter cache for duplicates, and a crawl queue feeds article fetchers and content parsers that write the article database and publish to the New_Article topic">
  <defs>
    <filter id="nws2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nws2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nws2-k1"><rect x="64" y="210" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k2"><rect x="680" y="210" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k3"><rect x="64" y="500" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k4"><rect x="440" y="500" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k5"><rect x="816" y="500" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k6"><rect x="340" y="770" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k7"><rect x="780" y="770" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k8"><rect x="340" y="960" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k9"><rect x="64" y="1200" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k10"><rect x="440" y="1200" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nws2-k11"><rect x="816" y="1200" width="340" height="90" rx="12"/></clipPath>
    <marker id="nws2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="nws2-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="nws2-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="nws2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="nws2-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="nws2-s-pink" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#DB2777"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="1740" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Google News: the content ingestion pipeline</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Thousands of publishers, no shared format, and the same story from twenty of them. Deduplication is the whole job.</text>

  <rect x="40" y="150" width="1160" height="246" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="64" y="180" font-size="19.5" font-weight="600" fill="#B45309">Out on the internet</text>
  <rect x="40" y="440" width="1160" height="266" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="470" font-size="19.5" font-weight="600" fill="#1D4ED8">What we run to pull it in</text>
  <rect x="40" y="1140" width="1160" height="236" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="1170" font-size="19.5" font-weight="600" fill="#047857">Where a finished article lands</text>

  <g fill="none" stroke-width="2">
    <path d="M234,382 V434" stroke="#D97706" stroke-width="2.5" marker-end="url(#nws2-m-amber)"/>
    <path d="M510,712 V764" stroke="#2563EB" stroke-width="2.5" marker-end="url(#nws2-m-blue)"/>
    <path d="M680,815 H774" stroke="#DB2777" marker-end="url(#nws2-m-pink)" marker-start="url(#nws2-s-pink)"/>
    <path d="M510,911 V954" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nws2-m-violet)"/>
    <path d="M510,1101 V1134" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#nws2-m-violet)"/>
    <path d="M610,1341 V1414" stroke="#059669" stroke-width="2.5" marker-end="url(#nws2-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="330" y="414" fill="#B45309">pull</text>
    <text x="700" y="740" fill="#1D4ED8">every candidate goes through here</text>
    <text x="727" y="798" fill="#BE185D">check</text>
    <text x="640" y="1118" fill="#5B21B6">only the new ones</text>
    <text x="720" y="1385" fill="#047857">store</text>
  </g>

  <g filter="url(#nws2-soft)">
    <rect x="64" y="210" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="64" y="210" width="6" height="90" fill="#D97706" clip-path="url(#nws2-k1)"/>
  </g>
  <circle cx="102" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,244.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18a15 15 0 0 1 0-18z"/></g>
  <text x="128" y="262" font-size="21.5" font-weight="600" fill="#111827">Publishers</text>
  <text x="234" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">Reuters, CNN, BBC, Reddit,</text>
  <text x="234" y="356" font-size="18.5" text-anchor="middle" fill="#94A3B8">Hacker News and thousands more</text>
  <g filter="url(#nws2-soft)">
    <rect x="680" y="210" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="680" y="210" width="6" height="90" fill="#D97706" clip-path="url(#nws2-k2)"/>
  </g>
  <circle cx="718" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(707.56,244.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="744" y="262" font-size="21.5" font-weight="600" fill="#111827">No shared format</text>
  <text x="850" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">RSS, JSON APIs, scraped HTML</text>
  <g filter="url(#nws2-soft)">
    <rect x="64" y="500" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="500" width="6" height="90" fill="#2563EB" clip-path="url(#nws2-k3)"/>
  </g>
  <circle cx="102" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,534.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="128" y="552" font-size="21.5" font-weight="600" fill="#111827">Web crawlers</text>
  <text x="234" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">RSS and public feeds</text>
  <g filter="url(#nws2-soft)">
    <rect x="440" y="500" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="440" y="500" width="6" height="90" fill="#2563EB" clip-path="url(#nws2-k4)"/>
  </g>
  <circle cx="478" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,534.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="504" y="552" font-size="21.5" font-weight="600" fill="#111827">Partner APIs</text>
  <text x="610" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">licensed news feeds</text>
  <g filter="url(#nws2-soft)">
    <rect x="816" y="500" width="340" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="816" y="500" width="6" height="90" fill="#2563EB" clip-path="url(#nws2-k5)"/>
  </g>
  <circle cx="854" cy="545" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,534.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="880" y="552" font-size="21.5" font-weight="600" fill="#111827">Source config</text>
  <text x="986" y="619" font-size="18.5" text-anchor="middle" fill="#6B7280">which sources, how often</text>
  <g filter="url(#nws2-lift)">
    <rect x="340" y="770" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="340" y="770" width="9" height="90" fill="#DB2777" clip-path="url(#nws2-k6)"/>
  </g>
  <circle cx="378" cy="815" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,804.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="404" y="822" font-size="21.5" font-weight="600" fill="#111827">Feed manager</text>
  <text x="510" y="889" font-size="18.5" text-anchor="middle" fill="#6B7280">is this story already in?</text>
  <g filter="url(#nws2-soft)">
    <rect x="780" y="770" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="780" y="770" width="6" height="90" fill="#DB2777" clip-path="url(#nws2-k7)"/>
  </g>
  <circle cx="818" cy="815" r="18" fill="#FFFFFF"/>
  <g transform="translate(807.56,804.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.4"/></g>
  <text x="844" y="822" font-size="21.5" font-weight="600" fill="#111827">Bloom filter</text>
  <text x="950" y="889" font-size="18.5" text-anchor="middle" fill="#6B7280">in the cache, not the database</text>
  <g filter="url(#nws2-soft)">
    <rect x="340" y="960" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="340" y="960" width="6" height="90" fill="#7C3AED" clip-path="url(#nws2-k8)"/>
  </g>
  <circle cx="378" cy="1005" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,994.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="404" y="1012" font-size="21.5" font-weight="600" fill="#111827">Crawl queue</text>
  <text x="510" y="1079" font-size="18.5" text-anchor="middle" fill="#6B7280">Kafka, one job per article</text>
  <g filter="url(#nws2-soft)">
    <rect x="64" y="1200" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="1200" width="6" height="90" fill="#059669" clip-path="url(#nws2-k9)"/>
  </g>
  <circle cx="102" cy="1245" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,1234.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8.5 4.5v10L12 21.5 3.5 17V7z"/><path d="M3.5 7l8.5 4.5L20.5 7M12 11.5v10"/></g>
  <text x="128" y="1252" font-size="21.5" font-weight="600" fill="#111827">Article fetcher</text>
  <text x="234" y="1319" font-size="18.5" text-anchor="middle" fill="#6B7280">pulls the full text</text>
  <g filter="url(#nws2-soft)">
    <rect x="440" y="1200" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="440" y="1200" width="6" height="90" fill="#059669" clip-path="url(#nws2-k10)"/>
  </g>
  <circle cx="478" cy="1245" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,1234.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="504" y="1252" font-size="21.5" font-weight="600" fill="#111827">Content parser</text>
  <text x="610" y="1319" font-size="18.5" text-anchor="middle" fill="#6B7280">extracts and categorises</text>
  <g filter="url(#nws2-soft)">
    <rect x="816" y="1200" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="816" y="1200" width="6" height="90" fill="#7C3AED" clip-path="url(#nws2-k11)"/>
  </g>
  <circle cx="854" cy="1245" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,1234.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="880" y="1252" font-size="21.5" font-weight="600" fill="#111827">New_Article</text>
  <text x="986" y="1319" font-size="18.5" text-anchor="middle" fill="#6B7280">the topic everything else reads</text>
  <g stroke="#059669" stroke-width="1.5">
    <path d="M440,1420 L440,1494 A170,16 0 0 0 780,1494 L780,1420" fill="#D1FAE5"/>
    <ellipse cx="610" cy="1420" rx="170" ry="16" fill="#ECFDF5"/>
  </g>
  <text x="610" y="1472" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Article database</text>
  <text x="610" y="1544" font-size="18.5" text-anchor="middle" fill="#6B7280">NoSQL, the parsed article</text>

  <rect x="40" y="1600" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1625" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1650" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Dedup or drown</text>
  <text x="323" y="1650" font-size="18.5" fill="#475569">twenty publishers carry the same story, and the reader wants to see it once</text>
</svg>