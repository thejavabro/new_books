<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="772" viewBox="0 0 1240 772" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="rotation-title rotation-desc">
<title id="rotation-title">Why rotation does not happen</title>
<desc id="rotation-desc">Everybody agrees secrets should be rotated and very few systems rotate them, for a reason that is mechanical rather than cultural.</desc>
<defs>
<marker id="rotation-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="rotation-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="rotation-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="rotation-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="772" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Why rotation does not happen</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Everybody agrees secrets should be rotated and very few systems rotate them.</text>
<rect x="40" y="694" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="694" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="84" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="84" rx="2.5" fill="#F28B9D"/><text x="64" y="153" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Rotation is a migration, and like every migration it needs an overlap</text><text x="64" y="179" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">A system that cannot hold two valid credentials at once cannot rotate without downtime.</text>
<circle cx="167" cy="236" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="167" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="40" y="264" width="254" height="76" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="167" y="294.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">issue the new one,</text><text x="167" y="321.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">both now valid</text>
<path d="M300 302H334" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M300 302H334" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rotation-marker-slate)"/>
<circle cx="467" cy="236" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="467" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="340" y="264" width="254" height="76" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="467" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">distribute it</text>
<path d="M600 302H634" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M600 302H634" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rotation-marker-slate)"/>
<circle cx="767" cy="236" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="767" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="640" y="264" width="254" height="76" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="767" y="294.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">verify nothing uses</text><text x="767" y="321.5" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the old one</text>
<path d="M900 302H934" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M900 302H934" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#rotation-marker-slate)"/>
<circle cx="1067" cy="236" r="20" fill="#D14A63" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="1067" y="243" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="940" y="264" width="254" height="76" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="1067" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">revoke the old one</text>
<rect x="40" y="364" width="1160" height="100" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="364" width="5" height="100" rx="2.5" fill="#F3CF6A"/><text x="64" y="394" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Step three is the one that needs instrumentation</text><text x="64" y="420" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">If you cannot tell whether a credential is still in use, you will not revoke it,</text><text x="64" y="446" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">and the old one stays valid forever. Log usage per credential.</text>
<rect x="40" y="488" width="1160" height="100" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="488" width="5" height="100" rx="2.5" fill="#AC8BE8"/><text x="64" y="518" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">And the mode that matters more than the scheduled one</text><text x="64" y="544" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Emergency rotation. How long does it take to invalidate a credential and bring</text><text x="64" y="570" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">everything back up? That number is the real exposure window.</text>
<rect x="40" y="612" width="1160" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="620" y="646" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The step never practiced is revoking, and it is the one you need under pressure</text>
<text x="66" y="728" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Accepting two valid secrets at once is what makes rotation routine instead of an outage.</text>
</svg>