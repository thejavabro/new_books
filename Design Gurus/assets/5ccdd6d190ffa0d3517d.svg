<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="880" viewBox="0 0 1240 880" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How reads stay fast in an event-sourced system: the append-only event log produces a snapshot saved every N events plus the tail of events written after it, both feed the projection that answers the query for the balance, while scanning the whole log per query is never the read path.">
  <defs>
    <marker id="m05-l07-snapshots-vi" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/>
    </marker>
    <marker id="m05-l07-snapshots-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m05-l07-snapshots-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m05-l07-snapshots-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m05-l07-snapshots-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="880" fill="#FFFFFF"/>

  <text x="50" y="120" font-size="20" font-weight="600" fill="#92400E">Source of truth</text>
  <text x="50" y="152" font-size="20" fill="#64748B">every state the system passed through</text>
  <text x="1190" y="120" text-anchor="end" font-size="20" font-weight="600" fill="#1E40AF">Reads never scan the whole log</text>
  <text x="1190" y="152" text-anchor="end" font-size="20" fill="#64748B">the log stays the truth</text>

  <g filter="url(#m05-l07-snapshots-soft)">
    <path d="M50,300 L50,410 A140,20 0 0 0 330,410 L330,300" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="190" cy="300" rx="140" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="190" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Event log</text>
  <text x="190" y="362" text-anchor="middle" font-size="20" fill="#64748B">append only,</text>
  <text x="190" y="392" text-anchor="middle" font-size="20" fill="#64748B">the source of truth</text>

  <rect x="380" y="210" width="300" height="340" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="530" y="250" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">What a read replays</text>
  <text x="530" y="280" text-anchor="middle" font-size="20" fill="#64748B">snapshot plus tail</text>
  <g filter="url(#m05-l07-snapshots-soft)">
    <rect x="400" y="310" width="260" height="100" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="530" y="351" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Snapshot</text>
  <text x="530" y="383" text-anchor="middle" font-size="20" fill="#64748B">saved every N events</text>
  <g filter="url(#m05-l07-snapshots-soft)">
    <rect x="400" y="440" width="260" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="530" y="481" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Events after it</text>
  <text x="530" y="513" text-anchor="middle" font-size="20" fill="#64748B">the recent tail</text>

  <g filter="url(#m05-l07-snapshots-soft)">
    <path d="M720,300 L720,410 A140,20 0 0 0 1000,410 L1000,300" fill="#DBEAFE" stroke="#2563EB" stroke-width="1.5"/>
    <ellipse cx="860" cy="300" rx="140" ry="20" fill="#F8FAFC" stroke="#2563EB" stroke-width="1.5"/>
  </g>
  <text x="860" y="332" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Projection</text>
  <text x="860" y="362" text-anchor="middle" font-size="20" fill="#64748B">the read model,</text>
  <text x="860" y="392" text-anchor="middle" font-size="20" fill="#64748B">kept current</text>
  <g filter="url(#m05-l07-snapshots-soft)">
    <rect x="720" y="490" width="280" height="100" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="860" y="531" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Query</text>
  <text x="860" y="563" text-anchor="middle" font-size="20" fill="#64748B">what is the balance?</text>

  <g fill="none" stroke-width="2.5">
    <path d="M330,320 C368,320 360,360 392,360" stroke="#7C3AED" stroke-width="2" marker-end="url(#m05-l07-snapshots-vi)"/>
    <path d="M330,380 C368,380 360,490 392,490" stroke="#D97706" stroke-width="2" marker-end="url(#m05-l07-snapshots-ab)"/>
    <path d="M660,360 C698,360 690,330 712,330" stroke="#7C3AED" stroke-width="2" marker-end="url(#m05-l07-snapshots-vi)"/>
    <path d="M660,490 C698,490 690,390 712,390" stroke="#D97706" marker-end="url(#m05-l07-snapshots-ab)"/>
    <path d="M860,430 L860,482" stroke="#3B82F6" marker-end="url(#m05-l07-snapshots-bl)"/>
    <path d="M190,430 L190,650 L860,650 L860,598" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m05-l07-snapshots-rd)"/>
  </g>

  <text x="712" y="300" text-anchor="end" font-size="20" fill="#5B21B6" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">load state</text>
  <text x="712" y="434" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">replay the tail</text>
  <text x="878" y="465" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">one read</text>
  <text x="525" y="690" text-anchor="middle" font-size="20" fill="#B91C1C">Not this: scanning a million events per query</text>

  <line x1="60" y1="740" x2="96" y2="740" stroke="#7C3AED" stroke-width="4"/>
  <text x="108" y="747" font-size="20" fill="#475569">Snapshot: the replay starting point</text>
  <line x1="60" y1="780" x2="96" y2="780" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="787" font-size="20" fill="#475569">Events: the log, and the tail after the snapshot</text>
  <line x1="60" y1="820" x2="96" y2="820" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="827" font-size="20" fill="#475569">Live read from the projection</text>
  <line x1="60" y1="860" x2="96" y2="860" stroke="#DC2626" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="867" font-size="20" fill="#475569">Not this: a full log scan</text>
</svg>