<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1180" viewBox="0 0 1240 1180" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Food delivery architecture: customer, restaurant, and driver apps call one gateway that drives the Orders state machine; order state events feed the real-time layer and Dispatch; driver location pings flow through a queue into the Location service, which feeds position updates to both; the real-time layer pushes over WebSockets back out to all three apps.">
  <defs>
    <marker id="m07-l03-delivery-architecture-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m07-l03-delivery-architecture-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="m07-l03-delivery-architecture-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="m07-l03-delivery-architecture-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1180" fill="#FFFFFF"/>

  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="80" y="140" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="220" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Customer app</text>
  <text x="220" y="223" text-anchor="middle" font-size="20" fill="#64748B">watches the order move</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="420" y="140" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="560" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Restaurant app</text>
  <text x="560" y="223" text-anchor="middle" font-size="20" fill="#64748B">accepts or rejects</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="830" y="140" width="280" height="120" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="970" y="191" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Driver app</text>
  <text x="970" y="223" text-anchor="middle" font-size="20" fill="#64748B">pings, picks up, delivers</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="200" y="340" width="280" height="120" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="340" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Gateway</text>
  <text x="340" y="423" text-anchor="middle" font-size="20" fill="#64748B">one entry point per app</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <path d="M830,355 L830,455 A140,20 0 0 0 1110,455 L1110,355" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="970" cy="355" rx="140" ry="20" fill="#F8FAFC" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="970" y="397" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Pings queue</text>
  <text x="970" y="427" text-anchor="middle" font-size="20" fill="#64748B">load leveling</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="100" y="550" width="480" height="170" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="340" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Orders: the state machine</text>
  <text x="340" y="626" text-anchor="middle" font-size="20" fill="#64748B">placed, accepted, preparing,</text>
  <text x="340" y="658" text-anchor="middle" font-size="20" fill="#64748B">driver_assigned, picked_up, delivered</text>
  <text x="340" y="690" text-anchor="middle" font-size="20" fill="#64748B">about 12 a second, 60 at dinner peak</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="760" y="550" width="360" height="170" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="940" y="594" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Location service</text>
  <text x="940" y="626" text-anchor="middle" font-size="20" fill="#64748B">an in-memory geo index</text>
  <text x="940" y="658" text-anchor="middle" font-size="20" fill="#64748B">12,500 writes a second,</text>
  <text x="940" y="690" text-anchor="middle" font-size="20" fill="#64748B">a thousand times the orders</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="100" y="810" width="440" height="150" rx="10" fill="#FFFFFF" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="320" y="860" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Dispatch</text>
  <text x="320" y="892" text-anchor="middle" font-size="20" fill="#64748B">offers fan out in parallel,</text>
  <text x="320" y="924" text-anchor="middle" font-size="20" fill="#64748B">one row commits the accept</text>
  <g filter="url(#m07-l03-delivery-architecture-soft)">
    <rect x="700" y="810" width="480" height="150" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="940" y="860" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Real-time layer</text>
  <text x="940" y="892" text-anchor="middle" font-size="20" fill="#64748B">WebSocket connections held open,</text>
  <text x="940" y="924" text-anchor="middle" font-size="20" fill="#64748B">pushed to exactly who cares</text>

  <g fill="none" stroke-width="2.5">
    <path d="M220,268 C220,300 300,300 300,332" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-delivery-architecture-bl)"/>
    <path d="M560,268 C560,300 400,300 400,332" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-delivery-architecture-bl)"/>
    <path d="M830,240 C740,262 560,330 490,382" stroke="#3B82F6" stroke-width="2" marker-end="url(#m07-l03-delivery-architecture-bl)"/>
    <path d="M340,460 L340,542" stroke="#3B82F6" marker-end="url(#m07-l03-delivery-architecture-bl)"/>
    <path d="M970,268 L970,327" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M970,475 L970,542" stroke="#D97706" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M340,720 L340,802" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M580,610 L700,610 L700,770 L820,770 L820,802" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M940,720 L940,802" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M760,660 L620,660 L620,750 L460,750 L460,802" stroke="#D97706" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m07-l03-delivery-architecture-ab)"/>
    <path d="M940,960 L940,1010 L60,1010 L60,100 L940,100" stroke="#059669"/>
    <path d="M220,100 L220,132" stroke="#059669" marker-end="url(#m07-l03-delivery-architecture-em)"/>
    <path d="M560,100 L560,132" stroke="#059669" marker-end="url(#m07-l03-delivery-architecture-em)"/>
    <path d="M970,100 L970,132" stroke="#059669" marker-end="url(#m07-l03-delivery-architecture-em)"/>
  </g>

  <text x="620" y="78" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">WebSocket push: the same update, to exactly the parties who care</text>
  <text x="990" y="300" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">location pings</text>
  <text x="330" y="762" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">state events</text>
  <text x="712" y="748" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">state events</text>
  <text x="960" y="770" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">positions</text>
  <text x="480" y="730" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">positions</text>

  <line x1="60" y1="1060" x2="96" y2="1060" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="1067" font-size="20" fill="#475569">Synchronous: an app is waiting on the answer</text>
  <line x1="60" y1="1100" x2="96" y2="1100" stroke="#D97706" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1107" font-size="20" fill="#475569">Asynchronous: queued or published, nobody waits</text>
  <line x1="60" y1="1140" x2="96" y2="1140" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1147" font-size="20" fill="#475569">Pushed out: the connection is already open</text>
</svg>