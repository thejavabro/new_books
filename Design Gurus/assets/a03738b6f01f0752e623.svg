<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="800" viewBox="0 0 1240 800" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two relay options for moving a committed outbox row onto the broker: a polling relay that queries unsent rows every second and adds up to one polling interval of latency, or a CDC tool such as Debezium that tails the transaction log and publishes within milliseconds.">
  <defs>
    <marker id="m05-l03-relay-options-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m05-l03-relay-options-ab" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <filter id="m05-l03-relay-options-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="800" fill="#FFFFFF"/>

  <g filter="url(#m05-l03-relay-options-soft)">
    <path d="M50,330 L50,460 A145,20 0 0 0 340,460 L340,330" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="195" cy="330" rx="145" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="195" y="372" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Database</text>
  <text x="195" y="402" text-anchor="middle" font-size="20" fill="#64748B">order row + outbox row</text>
  <text x="195" y="432" text-anchor="middle" font-size="20" fill="#64748B">in one transaction</text>

  <rect x="380" y="90" width="560" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="130" font-size="20" font-weight="600" fill="#334155">Option 1: polling relay</text>
  <text x="920" y="130" text-anchor="end" font-size="20" fill="#64748B">works on every database</text>
  <g filter="url(#m05-l03-relay-options-soft)">
    <rect x="400" y="160" width="520" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="660" y="206" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Polling relay</text>
  <text x="660" y="238" text-anchor="middle" font-size="20" fill="#64748B">queries unsent rows every second</text>

  <rect x="380" y="480" width="560" height="200" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="400" y="520" font-size="20" font-weight="600" fill="#334155">Option 2: change data capture</text>
  <text x="920" y="520" text-anchor="end" font-size="20" fill="#64748B">one more pipeline</text>
  <g filter="url(#m05-l03-relay-options-soft)">
    <rect x="400" y="550" width="520" height="110" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  </g>
  <text x="660" y="596" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">CDC tool (Debezium)</text>
  <text x="660" y="628" text-anchor="middle" font-size="20" fill="#64748B">tails the transaction log</text>

  <g filter="url(#m05-l03-relay-options-soft)">
    <rect x="980" y="330" width="210" height="120" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="1085" y="381" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Broker</text>
  <text x="1085" y="413" text-anchor="middle" font-size="20" fill="#64748B">carries events</text>

  <g fill="none" stroke-width="2.5">
    <path d="M340,360 C378,360 370,215 392,215" stroke="#475569" stroke-width="2" marker-end="url(#m05-l03-relay-options-sl)"/>
    <path d="M340,430 C378,430 370,605 392,605" stroke="#475569" stroke-width="2" marker-end="url(#m05-l03-relay-options-sl)"/>
    <path d="M920,215 C958,215 950,360 972,360" stroke="#D97706" marker-end="url(#m05-l03-relay-options-ab)"/>
    <path d="M920,605 C958,605 950,420 972,420" stroke="#D97706" marker-end="url(#m05-l03-relay-options-ab)"/>
  </g>

  <text x="955" y="340" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">up to one polling interval</text>
  <text x="955" y="468" text-anchor="end" font-size="20" fill="#92400E" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">milliseconds</text>

  <line x1="60" y1="720" x2="96" y2="720" stroke="#475569" stroke-width="4"/>
  <text x="108" y="727" font-size="20" fill="#475569">The relay reads committed outbox rows from the database</text>
  <line x1="60" y1="760" x2="96" y2="760" stroke="#D97706" stroke-width="4"/>
  <text x="108" y="767" font-size="20" fill="#475569">The relay publishes onto the broker, and the latency differs</text>
</svg>