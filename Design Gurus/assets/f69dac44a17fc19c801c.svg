<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="856" viewBox="0 0 1240 856" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="stops-title stops-desc">
<title id="stops-title">The backfill stops at row four million</title>
<desc id="stops-desc">Three causes with three different responses, and the first move is to find out which one it was. The structural answer is a job that records what it cannot process and continues.</desc>
<defs>
<marker id="stops-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="stops-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="stops-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="stops-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="856" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The backfill stops at row four million</text>
<text x="40" y="86" font-size="21" fill="#4A5568">There are three categories, and they call for three different responses.</text>
<rect x="40" y="778" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="778" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="62" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="62" rx="2.5" fill="#AC8BE8"/><text x="64" y="155" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Do not restart it. Find out why it stopped.</text>
<rect x="40" y="212" width="480" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="250" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Infrastructure</text>
<path d="M526 244H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 244H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stops-marker-slate)"/>
<rect x="570" y="212" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="237.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">restart from the cursor. It resumes at four million, and the</text><text x="590" y="262.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">IS NULL guard skips anything half-processed.</text>
<rect x="40" y="288" width="480" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="280" y="326" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">A row</text>
<path d="M526 320H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 320H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stops-marker-slate)"/>
<rect x="570" y="288" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="313.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">restarting stops at the same place. What should that row be</text><text x="590" y="338.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">is a question with an owner, not a code change.</text>
<rect x="40" y="364" width="480" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="402" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The database</text>
<path d="M526 396H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 396H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#stops-marker-slate)"/>
<rect x="570" y="364" width="630" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="389.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">reduce the batch size rather than the interval, because the</text><text x="590" y="414.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">problem is how long each transaction holds locks.</text>
<rect x="40" y="460" width="1160" height="86" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="86" rx="2.5" fill="#39D5AA"/><text x="64" y="496" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The deeper answer is that stopping at all was a design flaw.</text><text x="64" y="522" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">One bad row should cost you one row, not the remaining seven million.</text>
<text x="40" y="582" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">So the completion gate has two parts</text>
<rect x="40" y="600" width="560" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="320" y="634" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the comparison is at zero</text>
<rect x="640" y="600" width="560" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="920" y="634" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">every skipped row has been resolved</text>
<rect x="40" y="688" width="1160" height="58" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="688" width="5" height="58" rx="2.5" fill="#F28B9D"/><text x="64" y="723" font-size="19" font-weight="400" fill="#A83147" text-anchor="start">In a payments table, those forty rows are the ones somebody will eventually ask about</text>
<text x="66" y="812" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A migration that completes with forty rows quietly skipped has not completed.</text>
</svg>