<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="776" viewBox="0 0 1240 776" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="dark-title dark-desc">
<title id="dark-title">Dark launching</title>
<desc id="dark-desc">Run the new path for real traffic, return the old result, and record whether they agreed. The read case is straightforward and the write case needs a shadow target, which in a migration dual writing already provides.</desc>
<defs>
<marker id="dark-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="dark-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="dark-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="dark-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="776" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Dark launching</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Run the new path for real traffic, return the old result, and record whether they agreed.</text>
<rect x="40" y="698" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="698" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="152" width="200" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="140" y="186" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">a request</text>
<path d="M246 166H276V146H304" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M246 166H276V146H304" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark-marker-slate)"/>
<path d="M246 194H276V214H304" fill="none" stroke="#169B77" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M246 194H276V214H304" fill="none" stroke="#169B77" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark-marker-green)"/>
<rect x="310" y="118" width="380" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="500" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the old path</text>
<rect x="310" y="186" width="380" height="56" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="500" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">the new path</text>
<path d="M696 146H764" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M696 146H764" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark-marker-slate)"/>
<path d="M696 214H764" fill="none" stroke="#CE475C" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M696 214H764" fill="none" stroke="#CE475C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dark-marker-red)"/>
<rect x="770" y="118" width="430" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="985" y="152" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">returned</text>
<rect x="770" y="186" width="430" height="56" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="985" y="220" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">discarded, compared</text>
<rect x="40" y="266" width="1160" height="84" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="266" width="5" height="84" rx="2.5" fill="#39D5AA"/><text x="64" y="301" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">You learn almost everything you would have learned by releasing it.</text><text x="64" y="327" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">A missing index, a plan that degrades at production cardinality, the one unusual record.</text>
<rect x="40" y="374" width="1160" height="84" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="374" width="5" height="84" rx="2.5" fill="#F3CF6A"/><text x="64" y="409" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">A write path needs more care, because a write has an effect</text><text x="64" y="435" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">The new path writes somewhere that is not the real destination, or it is not dark.</text>
<rect x="40" y="474" width="1160" height="54" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="474" width="5" height="54" rx="2.5" fill="#39D5AA"/><text x="64" y="507" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">In a migration, dual writing already is that shadow target, and the comparison job is the verification</text>
<text x="40" y="566" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Three things to decide before turning one on</text>
<rect x="40" y="584" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="226" y="618" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what counts as agreement</text>
<rect x="434" y="584" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="620" y="618" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what you record</text>
<rect x="828" y="584" width="372" height="56" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="1014" y="618" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">what it costs in capacity</text>
<text x="620" y="670" font-size="19" font-weight="400" fill="#4A5568" text-anchor="middle">Equality is rarely right for floating point, ordering or timestamps</text>
<text x="66" y="732" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Logging every mismatch during the first run of a broken implementation is its own outage.</text>
</svg>