<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The index on Title holds three sorted entries: Algorithms points to row 2, Databases points to row 3, and Networks points to row 1. The Books table holds the full rows in storage order: row 1 Networks by Lee, row 2 Algorithms by Garcia, and row 3 Databases by Rossi.">
  <defs>
    <filter id="wi1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="wi1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="wi1-k1"><rect x="64" y="190" width="432" height="90" rx="12"/></clipPath>
    <clipPath id="wi1-k2"><rect x="64" y="300" width="432" height="90" rx="12"/></clipPath>
    <clipPath id="wi1-k3"><rect x="64" y="410" width="432" height="90" rx="12"/></clipPath>
    <clipPath id="wi1-k4"><rect x="744" y="190" width="432" height="90" rx="12"/></clipPath>
    <clipPath id="wi1-k5"><rect x="744" y="300" width="432" height="90" rx="12"/></clipPath>
    <clipPath id="wi1-k6"><rect x="744" y="410" width="432" height="90" rx="12"/></clipPath>
    <marker id="wi1-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="760" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">An index on Title points to the full rows</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The index is sorted and small. The table keeps every column, in any order.</text>

  <rect x="40" y="120" width="480" height="420" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#5B21B6">Index on Title: sorted, small</text>
  <rect x="720" y="120" width="480" height="420" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="744" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Books table: full rows, any order</text>

  <g fill="none" stroke-width="2">
    <path d="M520,345 H720" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#wi1-m-violet)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="620" y="330" fill="#5B21B6">pointers</text>
  </g>

  <g filter="url(#wi1-soft)">
    <rect x="64" y="190" width="432" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="190" width="6" height="90" fill="#7C3AED" clip-path="url(#wi1-k1)"/>
  </g>
  <circle cx="102" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,224.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="242" font-size="21.5" font-weight="600" fill="#111827">Algorithms: row 2</text>
  <g filter="url(#wi1-soft)">
    <rect x="64" y="300" width="432" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="300" width="6" height="90" fill="#7C3AED" clip-path="url(#wi1-k2)"/>
  </g>
  <circle cx="102" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,334.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="352" font-size="21.5" font-weight="600" fill="#111827">Databases: row 3</text>
  <g filter="url(#wi1-soft)">
    <rect x="64" y="410" width="432" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="410" width="6" height="90" fill="#7C3AED" clip-path="url(#wi1-k3)"/>
  </g>
  <circle cx="102" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,444.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="128" y="462" font-size="21.5" font-weight="600" fill="#111827">Networks: row 1</text>
  <g filter="url(#wi1-soft)">
    <rect x="744" y="190" width="432" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="744" y="190" width="6" height="90" fill="#2563EB" clip-path="url(#wi1-k4)"/>
  </g>
  <circle cx="782" cy="235" r="18" fill="#FFFFFF"/>
  <g transform="translate(771.56,224.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="808" y="242" font-size="21.5" font-weight="600" fill="#111827">Row 1: Networks, Lee</text>
  <g filter="url(#wi1-soft)">
    <rect x="744" y="300" width="432" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="744" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#wi1-k5)"/>
  </g>
  <circle cx="782" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(771.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="808" y="352" font-size="21.5" font-weight="600" fill="#111827">Row 2: Algorithms, Garcia</text>
  <g filter="url(#wi1-soft)">
    <rect x="744" y="410" width="432" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="744" y="410" width="6" height="90" fill="#2563EB" clip-path="url(#wi1-k6)"/>
  </g>
  <circle cx="782" cy="455" r="18" fill="#FFFFFF"/>
  <g transform="translate(771.56,444.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="808" y="462" font-size="21.5" font-weight="600" fill="#111827">Row 3: Databases, Rossi</text>

  <rect x="40" y="570" width="1160" height="146" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="595" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="620" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">Index entry</text>
  <text x="323" y="620" font-size="18.5" fill="#475569">the column value, plus a pointer to where the full row lives</text>
  <rect x="64" y="645" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="670" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Table row</text>
  <text x="323" y="670" font-size="18.5" fill="#475569">the complete data, which never moves because of the index</text>
</svg>