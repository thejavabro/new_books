<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1396" viewBox="0 0 1240 1396" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three nested hexagons: adapters (infrastructure) on the outside, ports (interfaces) in the middle, and the domain (business logic, with entities, business rules and use cases) at the center. Outside the adapters sit the external actors and systems they connect to: a web browser, a terminal and a message queue on the driving side, and PostgreSQL, a payment provider and an email service on the driven side. Dependencies point inward, and only the adapters touch the outside. Zone 1, the domain, holds entities and value objects, business rules, use cases and domain services, independent of infrastructure. Zone 2, the ports, defines the interfaces the domain uses to talk to the outside world: driving ports for incoming requests and driven ports for external dependencies, defined by the domain. Zone 3, the adapters: driving adapters call the ports, driven adapters implement them, and adapters convert external data for the domain">
  <defs>
    <filter id="m10c-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m10c-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m10c-k1"><rect x="520" y="116" width="200" height="64" rx="12"/></clipPath>
    <clipPath id="m10c-k2"><rect x="40" y="260" width="280" height="64" rx="12"/></clipPath>
    <clipPath id="m10c-k3"><rect x="920" y="260" width="280" height="64" rx="12"/></clipPath>
    <clipPath id="m10c-k4"><rect x="40" y="586" width="280" height="64" rx="12"/></clipPath>
    <clipPath id="m10c-k5"><rect x="920" y="586" width="280" height="64" rx="12"/></clipPath>
    <clipPath id="m10c-k6"><rect x="520" y="730" width="200" height="64" rx="12"/></clipPath>
    <marker id="m10c-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1396" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">The three zones of hexagonal architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">The domain sits inside the ports and the ports inside the adapters; dependencies point inward, and only adapters touch the outside.</text>

  <rect x="40" y="830" width="570" height="250" rx="14" fill="#EEF2FF" stroke="#A5B4FC" stroke-width="1.5"/>
  <text x="64" y="860" font-size="19.5" font-weight="600" fill="#4338CA">1. Domain zone</text>
  <rect x="630" y="830" width="570" height="250" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="654" y="860" font-size="19.5" font-weight="600" fill="#475569">2. Ports zone</text>
  <rect x="40" y="1110" width="1160" height="246" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="1140" font-size="19.5" font-weight="600" fill="#1D4ED8">3. Adapters zone</text>

  <g fill="none" stroke-width="2">
    <path d="M620,180 V220" stroke="#4F46E5"/>
    <path d="M620,730 V690" stroke="#4F46E5"/>
    <path d="M320,292 H414.0" stroke="#4F46E5"/>
    <path d="M320,618 H414.0" stroke="#4F46E5"/>
    <path d="M920,292 H826.0" stroke="#4F46E5"/>
    <path d="M920,618 H826.0" stroke="#4F46E5"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#m10c-soft)">
    <rect x="520" y="116" width="200" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="520" y="116" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k1)"/>
  </g>
  <circle cx="558" cy="148" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,137.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="584" y="155" font-size="18.5" font-weight="600" fill="#111827">Web browser</text>
  <g filter="url(#m10c-soft)">
    <rect x="40" y="260" width="280" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="260" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k2)"/>
  </g>
  <circle cx="78" cy="292" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,281.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.5 5l-3 14"/></g>
  <text x="104" y="299" font-size="18.5" font-weight="600" fill="#111827">Terminal</text>
  <g filter="url(#m10c-soft)">
    <rect x="920" y="260" width="280" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="920" y="260" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k3)"/>
  </g>
  <circle cx="958" cy="292" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,281.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="984" y="299" font-size="18.5" font-weight="600" fill="#111827">PostgreSQL</text>
  <g filter="url(#m10c-soft)">
    <rect x="40" y="586" width="280" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="586" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k4)"/>
  </g>
  <circle cx="78" cy="618" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,607.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="104" y="625" font-size="18.5" font-weight="600" fill="#111827">Message queue</text>
  <g filter="url(#m10c-soft)">
    <rect x="920" y="586" width="280" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="920" y="586" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k5)"/>
  </g>
  <circle cx="958" cy="618" r="18" fill="#FFFFFF"/>
  <g transform="translate(947.56,607.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="984" y="625" font-size="18.5" font-weight="600" fill="#111827">Payment provider</text>
  <g filter="url(#m10c-soft)">
    <rect x="520" y="730" width="200" height="64" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="520" y="730" width="6" height="64" fill="#2563EB" clip-path="url(#m10c-k6)"/>
  </g>
  <circle cx="558" cy="762" r="18" fill="#FFFFFF"/>
  <g transform="translate(547.56,751.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 7.5l9.5 6.5 9.5-6.5"/></g>
  <text x="584" y="769" font-size="18.5" font-weight="600" fill="#111827">Email service</text>

  <polygon points="310,455 460,220 780,220 930,455 780,690 460,690" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#m10c-soft)"/>
  <polygon points="385,480 495,300 745,300 855,480 745,660 495,660" fill="#FFFFFF" stroke="#64748B" stroke-width="2"/>
  <polygon points="460,505 530,380 710,380 780,505 710,630 530,630" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2" filter="url(#m10c-lift)"/>
  <text x="620" y="254" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Adapters</text>
  <text x="620" y="278" text-anchor="middle" font-size="18.5" fill="#1D4ED8">(infrastructure)</text>
  <text x="620" y="334" text-anchor="middle" font-size="21.5" font-weight="600" fill="#475569">Ports</text>
  <text x="620" y="358" text-anchor="middle" font-size="18.5" fill="#475569">(interfaces)</text>
  <text x="620" y="420" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Domain</text>
  <text x="620" y="444" text-anchor="middle" font-size="18.5" fill="#4338CA">(business logic)</text>
  <rect x="545" y="462" width="150" height="34" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="485" text-anchor="middle" font-size="17" fill="#1F2937">Entities</text>
  <rect x="545" y="504" width="150" height="34" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="527" text-anchor="middle" font-size="17" fill="#1F2937">Business rules</text>
  <rect x="545" y="546" width="150" height="34" rx="9" fill="#FFFFFF" stroke="#A5B4FC" stroke-width="1.2"/>
  <text x="620" y="569" text-anchor="middle" font-size="17" fill="#1F2937">Use cases</text>
  <text x="64" y="892" font-size="18.5" fill="#475569">Contains the core business logic of the application.</text>
  <circle cx="70" cy="926" r="4" fill="#4F46E5"/>
  <text x="86" y="932" font-size="18.5" fill="#1F2937">Entities and value objects</text>
  <circle cx="70" cy="956" r="4" fill="#4F46E5"/>
  <text x="86" y="962" font-size="18.5" fill="#1F2937">Business rules</text>
  <circle cx="70" cy="986" r="4" fill="#4F46E5"/>
  <text x="86" y="992" font-size="18.5" fill="#1F2937">Use cases</text>
  <circle cx="70" cy="1016" r="4" fill="#4F46E5"/>
  <text x="86" y="1022" font-size="18.5" fill="#1F2937">Domain services</text>
  <circle cx="70" cy="1046" r="4" fill="#4F46E5"/>
  <text x="86" y="1052" font-size="18.5" fill="#1F2937">Independent of any infrastructure or external frameworks</text>
  <text x="654" y="892" font-size="18.5" fill="#475569">Defines the interfaces that the domain uses to</text>
  <text x="654" y="919" font-size="18.5" fill="#475569">communicate with the outside world.</text>
  <circle cx="660" cy="953" r="4" fill="#64748B"/>
  <text x="676" y="959" font-size="18.5" fill="#1F2937">Driving ports (inbound) for incoming requests</text>
  <circle cx="660" cy="983" r="4" fill="#64748B"/>
  <text x="676" y="989" font-size="18.5" fill="#1F2937">Driven ports (outbound) for external dependencies</text>
  <circle cx="660" cy="1013" r="4" fill="#64748B"/>
  <text x="676" y="1019" font-size="18.5" fill="#1F2937">Defined by the application core (domain)</text>
  <circle cx="660" cy="1043" r="4" fill="#64748B"/>
  <text x="676" y="1049" font-size="18.5" fill="#1F2937">Express what the domain needs, not how it is implemented</text>
  <text x="64" y="1172" font-size="18.5" fill="#475569">Driving adapters call the ports; driven adapters implement them.</text>
  <text x="64" y="1199" font-size="18.5" fill="#475569">Adapters convert external data into a format the domain understands and vice versa.</text>
  <circle cx="70" cy="1233" r="4" fill="#2563EB"/>
  <text x="86" y="1239" font-size="18.5" fill="#1F2937">Driving adapters (for example, REST controllers, CLI, message consumers)</text>
  <circle cx="70" cy="1263" r="4" fill="#2563EB"/>
  <text x="86" y="1269" font-size="18.5" fill="#1F2937">Driven adapters (for example, database, external APIs, message producers)</text>
  <circle cx="70" cy="1293" r="4" fill="#2563EB"/>
  <text x="86" y="1299" font-size="18.5" fill="#1F2937">Can be replaced without changing the domain or ports</text>
  <circle cx="70" cy="1323" r="4" fill="#2563EB"/>
  <text x="86" y="1329" font-size="18.5" fill="#1F2937">Handle technical details like protocols, frameworks, and data formats</text>


</svg>