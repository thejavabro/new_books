<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="832" viewBox="0 0 1240 832" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Capacity estimation for a news aggregator: about 10 million daily users, 5 feed refreshes each, and roughly 5 KB an article; giving 50 million feed fetches a day, 1,000 to 5,000 queries a second at peak, and about 180 GB of articles a year">
  <defs>
    <filter id="nwes-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="nwes-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="nwes-k1"><rect x="80" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwes-k2"><rect x="450" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwes-k3"><rect x="820" y="175" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwes-k4"><rect x="80" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwes-k5"><rect x="450" y="430" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="nwes-k6"><rect x="820" y="430" width="340" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="832" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">News aggregator: capacity estimation</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A small ingest rate feeding a much larger read rate, with breaking news as the spike.</text>

  <rect x="40" y="110" width="1160" height="225" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="140" font-size="19.5" font-weight="600" fill="#1D4ED8">What we assume</text>
  <rect x="40" y="365" width="1160" height="225" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="395" font-size="19.5" font-weight="600" fill="#047857">What follows from it</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#nwes-soft)">
    <rect x="80" y="175" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="80" y="175" width="6" height="90" fill="#7C3AED" clip-path="url(#nwes-k1)"/>
  </g>
  <circle cx="118" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,209.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="144" y="227" font-size="21.5" font-weight="600" fill="#111827">10M daily users</text>
  <text x="250" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">with hundreds of thousands</text>
  <text x="250" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">online at once</text>
  <g filter="url(#nwes-soft)">
    <rect x="450" y="175" width="340" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="450" y="175" width="6" height="90" fill="#4F46E5" clip-path="url(#nwes-k2)"/>
  </g>
  <circle cx="488" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,209.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
  <text x="514" y="227" font-size="21.5" font-weight="600" fill="#111827">5 refreshes each</text>
  <text x="620" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">a day, scrolling or</text>
  <text x="620" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">pulling to refresh</text>
  <g filter="url(#nwes-soft)">
    <rect x="820" y="175" width="340" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="820" y="175" width="6" height="90" fill="#64748B" clip-path="url(#nwes-k3)"/>
  </g>
  <circle cx="858" cy="220" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,209.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="884" y="227" font-size="21.5" font-weight="600" fill="#111827">About 5 KB an article</text>
  <text x="990" y="294" font-size="18.5" text-anchor="middle" fill="#6B7280">metadata plus the</text>
  <text x="990" y="321" font-size="18.5" text-anchor="middle" fill="#94A3B8">stored text</text>
  <g filter="url(#nwes-soft)">
    <rect x="80" y="430" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="80" y="430" width="6" height="90" fill="#059669" clip-path="url(#nwes-k4)"/>
  </g>
  <circle cx="118" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(107.56,464.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
  <text x="144" y="482" font-size="21.5" font-weight="600" fill="#111827">50M fetches a day</text>
  <text x="250" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">about 580 queries a second</text>
  <text x="250" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">on average</text>
  <g filter="url(#nwes-lift)">
    <rect x="450" y="430" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="450" y="430" width="9" height="90" fill="#DB2777" clip-path="url(#nwes-k5)"/>
  </g>
  <circle cx="488" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(477.56,464.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L4.5 13.2h6.2L10 22l8.5-11.2h-6.2z"/></g>
  <text x="514" y="482" font-size="21.5" font-weight="600" fill="#111827">1 to 5k QPS at peak</text>
  <text x="620" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">mornings and during</text>
  <text x="620" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">a breaking story</text>
  <g filter="url(#nwes-soft)">
    <rect x="820" y="430" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="820" y="430" width="6" height="90" fill="#D97706" clip-path="url(#nwes-k6)"/>
  </g>
  <circle cx="858" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,464.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="884" y="482" font-size="21.5" font-weight="600" fill="#111827">About 180 GB a year</text>
  <text x="990" y="549" font-size="18.5" text-anchor="middle" fill="#6B7280">from 100k articles a day,</text>
  <text x="990" y="576" font-size="18.5" text-anchor="middle" fill="#94A3B8">so 36 million a year</text>

  <rect x="40" y="630" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="655" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="680" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Slow ingest</text>
  <text x="323" y="680" font-size="18.5" fill="#475569">roughly 1 article a second. Ingestion is not the scaling problem; delivering it to millions is</text>
  <rect x="64" y="705" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="730" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Breaking news</text>
  <text x="323" y="730" font-size="18.5" fill="#475569">one big story can push to over a million users at once, which is the real burst to design for</text>
  <rect x="64" y="755" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="780" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Archive</text>
  <text x="323" y="780" font-size="18.5" fill="#475569">older articles move to colder storage after a month or two, which keeps the hot corpus small</text>
</svg>