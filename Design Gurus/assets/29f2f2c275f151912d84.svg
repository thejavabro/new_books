  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Mainframe vs. client-server architecture</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Terminals share one central mainframe; client devices send requests to an application server backed by a database.</text>

