<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1400" viewBox="0 0 1240 1400" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The flash sale event pipeline: the booking service publishes to a topic per product so no single item blocks the rest, the order service consumes them, and payment processed, reservation processed and inventory stock released topics carry the outcome back to the order service and the expiry handler">
  <defs>
    <filter id="fs2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="fs2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="fs2-k1"><rect x="64" y="210" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k2"><rect x="440" y="210" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k3"><rect x="816" y="210" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k4"><rect x="340" y="460" width="480" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k5"><rect x="64" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k6"><rect x="440" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k7"><rect x="816" y="680" width="340" height="90" rx="12"/></clipPath>
    <clipPath id="fs2-k8"><rect x="340" y="940" width="480" height="90" rx="12"/></clipPath>
    <marker id="fs2-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="fs2-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="fs2-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="fs2-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1400" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Flash sale: the topics that keep stock honest</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">One topic per product so a hot item cannot starve the others, then three more that carry the outcome of a reservation.</text>

  <rect x="40" y="150" width="1160" height="246" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="180" font-size="19.5" font-weight="600" fill="#1D4ED8">One topic per product, on purpose</text>
  <rect x="40" y="620" width="1160" height="236" rx="14" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="1.5"/>
  <text x="64" y="650" font-size="19.5" font-weight="600" fill="#5B21B6">Three topics carrying the outcome</text>

  <g fill="none" stroke-width="2">
    <path d="M234,350 V493 Q234,505 246,505 H332" stroke="#7C3AED" marker-end="url(#fs2-m-violet)"/>
    <path d="M610,350 V454" stroke="#7C3AED" stroke-width="2.5" marker-end="url(#fs2-m-violet)"/>
    <path d="M986,350 V493 Q986,505 974,505 H828" stroke="#7C3AED" marker-end="url(#fs2-m-violet)"/>
    <path d="M400,550 V586 Q400,598 388,598 H246 Q234,598 234,610 V614" stroke="#059669" marker-end="url(#fs2-m-emerald)"/>
    <path d="M610,592 V614" stroke="#D97706" marker-end="url(#fs2-m-amber)"/>
    <path d="M760,550 V586 Q760,598 772,598 H974 Q986,598 986,610 V614" stroke="#DB2777" marker-end="url(#fs2-m-pink)"/>
    <path d="M828,985 H848 Q860,985 860,973 V782" stroke="#DB2777" marker-end="url(#fs2-m-pink)"/>
    <path d="M580,825 V934" stroke="#059669" stroke-width="2.5" marker-end="url(#fs2-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="700" y="400" fill="#5B21B6">consumed</text>
    <text x="665" y="612" fill="#047857">emits</text>
    <text x="935" y="878" fill="#BE185D">raises</text>
    <text x="700" y="906" fill="#047857">closes the loop</text>
  </g>

  <g filter="url(#fs2-soft)">
    <rect x="64" y="210" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="64" y="210" width="6" height="90" fill="#7C3AED" clip-path="url(#fs2-k1)"/>
  </g>
  <circle cx="102" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,244.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="262" font-size="21.5" font-weight="600" fill="#111827">FlashSale_ProductA</text>
  <text x="234" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">its own partition</text>
  <g filter="url(#fs2-soft)">
    <rect x="440" y="210" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="440" y="210" width="6" height="90" fill="#7C3AED" clip-path="url(#fs2-k2)"/>
  </g>
  <circle cx="478" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,244.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="504" y="262" font-size="21.5" font-weight="600" fill="#111827">FlashSale_ProductB</text>
  <text x="610" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">its own partition</text>
  <g filter="url(#fs2-soft)">
    <rect x="816" y="210" width="340" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="816" y="210" width="6" height="90" fill="#7C3AED" clip-path="url(#fs2-k3)"/>
  </g>
  <circle cx="854" cy="255" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,244.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="880" y="262" font-size="21.5" font-weight="600" fill="#111827">FlashSale_ProductZ</text>
  <text x="986" y="329" font-size="18.5" text-anchor="middle" fill="#6B7280">and so on, per product</text>
  <g filter="url(#fs2-lift)">
    <rect x="340" y="460" width="480" height="90" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="340" y="460" width="9" height="90" fill="#2563EB" clip-path="url(#fs2-k4)"/>
  </g>
  <circle cx="378" cy="505" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,494.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="404" y="512" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <text x="580" y="579" font-size="18.5" text-anchor="middle" fill="#6B7280">consumes every product topic</text>
  <g filter="url(#fs2-soft)">
    <rect x="64" y="680" width="340" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="64" y="680" width="6" height="90" fill="#059669" clip-path="url(#fs2-k5)"/>
  </g>
  <circle cx="102" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,714.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="128" y="732" font-size="21.5" font-weight="600" fill="#111827">Payment_Processed</text>
  <text x="234" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">paid, or failed</text>
  <g filter="url(#fs2-soft)">
    <rect x="440" y="680" width="340" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="440" y="680" width="6" height="90" fill="#D97706" clip-path="url(#fs2-k6)"/>
  </g>
  <circle cx="478" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(467.56,714.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/></g>
  <text x="504" y="732" font-size="21.5" font-weight="600" fill="#111827">Reservation_Processed</text>
  <text x="610" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">the hold is confirmed</text>
  <g filter="url(#fs2-soft)">
    <rect x="816" y="680" width="340" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="816" y="680" width="6" height="90" fill="#DB2777" clip-path="url(#fs2-k7)"/>
  </g>
  <circle cx="854" cy="725" r="18" fill="#FFFFFF"/>
  <g transform="translate(843.56,714.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="880" y="732" font-size="21.5" font-weight="600" fill="#111827">Stock_Released</text>
  <text x="986" y="799" font-size="18.5" text-anchor="middle" fill="#6B7280">the hold expired</text>
  <g filter="url(#fs2-soft)">
    <rect x="340" y="940" width="480" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="340" y="940" width="6" height="90" fill="#DB2777" clip-path="url(#fs2-k8)"/>
  </g>
  <circle cx="378" cy="985" r="18" fill="#FFFFFF"/>
  <g transform="translate(367.56,974.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 6.5V12l3.5 2.5"/></g>
  <text x="404" y="992" font-size="21.5" font-weight="600" fill="#111827">Reserved expiry handler</text>
  <text x="580" y="1059" font-size="18.5" text-anchor="middle" fill="#6B7280">the only thing that can free stock</text>
  <text x="580" y="1086" font-size="18.5" text-anchor="middle" fill="#94A3B8">nobody paid for</text>

  <rect x="40" y="1120" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="1145" width="230" height="38" rx="10" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.2"/>
  <text x="179" y="1170" text-anchor="middle" font-size="18.5" font-weight="600" fill="#5B21B6">A topic per product</text>
  <text x="323" y="1170" font-size="18.5" fill="#475569">one wildly popular item cannot slow down every other item in the sale</text>
  <rect x="64" y="1195" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1220" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">The hold has a clock on it</text>
  <text x="323" y="1220" font-size="18.5" fill="#475569">stock reserved and never paid for goes back, or the sale sells out on paper only</text>
  <rect x="64" y="1245" width="230" height="38" rx="10" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="179" y="1270" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">Order is the only writer</text>
  <text x="323" y="1270" font-size="18.5" fill="#475569">every outcome comes back to one service, so the order state machine has one owner</text>
</svg>