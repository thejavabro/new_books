<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1035" viewBox="0 0 1240 1035" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Cache defaults by data type: money and permission decisions use no-store, personal data is at most private with a short lifetime, and rarely changing caller-independent reads may use a longer public lifetime.">
  <defs>
    <marker id="p1n-pm" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <marker id="p1n-am" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/>
    </marker>
    <marker id="p1n-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p1n-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p1n-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p1n-k1"><rect x="84" y="174" width="600" height="90" rx="12"/></clipPath>
    <clipPath id="p1n-k2"><rect x="84" y="324" width="600" height="90" rx="12"/></clipPath>
    <clipPath id="p1n-k3"><rect x="84" y="537" width="600" height="90" rx="12"/></clipPath>
    <clipPath id="p1n-k4"><rect x="84" y="750" width="600" height="90" rx="12"/></clipPath>
    <clipPath id="p1n-d1"><rect x="724" y="195" width="432" height="48" rx="10"/></clipPath>
    <clipPath id="p1n-d2"><rect x="724" y="345" width="432" height="48" rx="10"/></clipPath>
    <clipPath id="p1n-d3"><rect x="724" y="558" width="432" height="48" rx="10"/></clipPath>
    <clipPath id="p1n-d4"><rect x="724" y="771" width="432" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="1035" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Choose max-age by how long a wrong old answer is acceptable</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">each row: the data type, its default, and why</text>

  
  <rect x="44" y="126" width="1152" height="339" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="68" y="156" font-size="16.5" font-weight="600" fill="#BE185D">No caching at all</text>
  <text x="1172" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">two data types</text>

  
  <rect x="44" y="489" width="1152" height="189" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
  <text x="68" y="519" font-size="16.5" font-weight="600" fill="#B45309">Private cache, short lifetime</text>
  <text x="1172" y="519" text-anchor="end" font-size="15.5" fill="#6B7280">one data type</text>

  
  <rect x="44" y="702" width="1152" height="189" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="68" y="732" font-size="16.5" font-weight="600" fill="#047857">Shared cache, longer lifetime</text>
  <text x="1172" y="732" text-anchor="end" font-size="15.5" fill="#6B7280">one data type</text>

  
  <g fill="none" stroke-width="2">
    <path d="M684,219 H724" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p1n-pm)"/>
    <path d="M684,369 H724" stroke="#DB2777" stroke-width="2.5" marker-end="url(#p1n-pm)"/>
    <path d="M684,582 H724" stroke="#D97706" marker-end="url(#p1n-am)"/>
    <path d="M684,795 H724" stroke="#059669" marker-end="url(#p1n-em)"/>
  </g>

  
  <g filter="url(#p1n-soft)">
    <rect x="84" y="174" width="600" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="174" width="6" height="90" fill="#64748B" clip-path="url(#p1n-k1)"/>
  </g>
  <circle cx="122" cy="219" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,208.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.6"/>
    <path d="M12 6.6v10.8"/>
    <path d="M14.6 9.5c-.6-.9-1.5-1.3-2.6-1.3-1.6 0-2.8.8-2.8 1.9s1.2 1.9 2.8 1.9 2.8.8 2.8 1.9-1.2 1.9-2.8 1.9c-1.1 0-2-.4-2.6-1.3"/>
  </g>
  <text x="148" y="226" font-size="18.5" font-weight="600" fill="#111827">Money: payments, balances, refundable amounts</text>
  <text x="384" y="289" text-anchor="middle" font-size="15.5" fill="#6B7280">A stale monetary decision costs more than the saved read</text>

  <g filter="url(#p1n-lift)">
    <rect x="724" y="195" width="432" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="724" y="195" width="9" height="48" fill="#DB2777" clip-path="url(#p1n-d1)"/>
  </g>
  <circle cx="758" cy="219" r="4.5" fill="#DB2777"/>
  <text x="782" y="226" font-size="18.5" font-weight="600" fill="#111827">no-store</text>

  
  <g filter="url(#p1n-soft)">
    <rect x="84" y="324" width="600" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="324" width="6" height="90" fill="#64748B" clip-path="url(#p1n-k2)"/>
  </g>
  <circle cx="122" cy="369" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,358.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="148" y="376" font-size="18.5" font-weight="600" fill="#111827">Permissions and authorization decisions</text>
  <text x="384" y="439" text-anchor="middle" font-size="15.5" fill="#6B7280">A withdrawn role must not stay authorized by a retained response</text>

  <g filter="url(#p1n-lift)">
    <rect x="724" y="345" width="432" height="48" rx="10" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <rect x="724" y="345" width="9" height="48" fill="#DB2777" clip-path="url(#p1n-d2)"/>
  </g>
  <circle cx="758" cy="369" r="4.5" fill="#DB2777"/>
  <text x="782" y="376" font-size="18.5" font-weight="600" fill="#111827">no-store</text>

  
  <g filter="url(#p1n-soft)">
    <rect x="84" y="537" width="600" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="537" width="6" height="90" fill="#64748B" clip-path="url(#p1n-k3)"/>
  </g>
  <circle cx="122" cy="582" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,571.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="4"/>
    <path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/>
  </g>
  <text x="148" y="589" font-size="18.5" font-weight="600" fill="#111827">Personal data, when brief reuse is safe</text>
  <text x="384" y="652" text-anchor="middle" font-size="15.5" fill="#6B7280">Local reuse is acceptable; shared reuse is not</text>

  <g filter="url(#p1n-soft)">
    <rect x="724" y="558" width="432" height="48" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="724" y="558" width="6" height="48" fill="#D97706" clip-path="url(#p1n-d3)"/>
  </g>
  <circle cx="758" cy="582" r="4.5" fill="#D97706"/>
  <text x="782" y="589" font-size="18.5" font-weight="600" fill="#111827">private, max-age=30</text>

  
  <g filter="url(#p1n-soft)">
    <rect x="84" y="750" width="600" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="84" y="750" width="6" height="90" fill="#64748B" clip-path="url(#p1n-k4)"/>
  </g>
  <circle cx="122" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(111.56,784.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/>
    <path d="M19 15.5H6"/>
  </g>
  <text x="148" y="802" font-size="18.5" font-weight="600" fill="#111827">Rarely changing caller-independent reads</text>
  <text x="384" y="865" text-anchor="middle" font-size="15.5" fill="#6B7280">A country list or static help content can be shared safely</text>

  <g filter="url(#p1n-soft)">
    <rect x="724" y="771" width="432" height="48" rx="10" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="724" y="771" width="6" height="48" fill="#059669" clip-path="url(#p1n-d4)"/>
  </g>
  <circle cx="758" cy="795" r="4.5" fill="#059669"/>
  <text x="782" y="802" font-size="18.5" font-weight="600" fill="#111827">public, max-age=3600</text>

  
  <rect x="40" y="919" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="964" text-anchor="middle" font-size="16" fill="#475569">A copy already granted a fresh lifetime cannot be reliably recalled, whatever the database now says.</text>
</svg>