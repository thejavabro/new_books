<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="470" viewBox="0 0 1240 470" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="An in-memory database answers from RAM and writes a log or snapshot to disk for safety, while an on-disk database reads and writes to disk directly">
  <rect x="0" y="0" width="1240" height="470" fill="#FFFFFF"/>
  <defs>
    <marker id="db10-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="db10-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="db10-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="db10-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <rect x="20" y="40" width="580" height="380" rx="14" fill="#ECFDF5" fill-opacity="0.35" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="310" y="80" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">In-memory</text>

  <rect x="640" y="40" width="580" height="380" rx="14" fill="#EFF6FF" fill-opacity="0.4" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="930" y="80" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">On-disk</text>

  <line x1="216" y1="150" x2="314" y2="150" stroke="#059669" stroke-width="2.5" marker-end="url(#db10-emerald)"/>
  <line x1="314" y1="188" x2="216" y2="188" stroke="#059669" stroke-width="2.5" marker-end="url(#db10-emerald)"/>
  <line x1="420" y1="222" x2="420" y2="286" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#db10-slate)"/>

  <line x1="836" y1="150" x2="934" y2="150" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#db10-blue)"/>
  <line x1="934" y1="188" x2="836" y2="188" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#db10-blue)"/>

  <g filter="url(#db10-soft)">
    <rect x="50" y="134" width="166" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="320" y="126" width="200" height="96" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <rect x="300" y="290" width="240" height="80" rx="10" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="5 4"/>

    <rect x="670" y="134" width="166" height="70" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <rect x="940" y="126" width="220" height="96" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>

  <text x="133" y="176" font-size="20" fill="#0F172A" text-anchor="middle">Query</text>
  <text x="420" y="164" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">RAM</text>
  <text x="420" y="196" font-size="20" fill="#059669" text-anchor="middle">answered here</text>
  <text x="420" y="324" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">Disk</text>
  <text x="420" y="352" font-size="20" fill="#475569" text-anchor="middle">log or snapshot only</text>

  <text x="753" y="176" font-size="20" fill="#0F172A" text-anchor="middle">Query</text>
  <text x="1050" y="164" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle">Disk</text>
  <text x="1050" y="196" font-size="20" fill="#2563EB" text-anchor="middle">read and written here</text>

  <text x="310" y="392" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Fast and expensive, lost on a crash</text>
  <text x="930" y="392" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Slower and cheap, survives a crash</text>

  <text x="620" y="450" font-size="20" fill="#475569" text-anchor="middle">Persistence is something an in-memory database adds, and it costs some of the speed you came for</text>
</svg>