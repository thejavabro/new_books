<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1090" viewBox="0 0 1240 1090" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The sender sends packets 1, 2 and 3. Packet 2 is lost. The receiver acknowledges packet 1 and holds packet 3. The sender resends packet 2. The application receives 1, 2 and 3 in order.">
  <defs>
    <filter id="tu2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="tu2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="tu2-k1"><rect x="64" y="180" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu2-k2"><rect x="654" y="300" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu2-k3"><rect x="654" y="440" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu2-k4"><rect x="64" y="560" width="522" height="90" rx="12"/></clipPath>
    <clipPath id="tu2-k5"><rect x="40" y="800" width="1160" height="90" rx="12"/></clipPath>
    
    
  </defs>

  <rect x="0" y="0" width="1240" height="1090" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How TCP recovers a lost packet</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Packet 2 is lost. TCP resends it, and the application still gets the data in order.</text>

  <rect x="40" y="120" width="570" height="640" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#475569">Sender</text>
  <rect x="630" y="120" width="570" height="640" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="654" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Receiver</text>

  <g fill="none" stroke-width="2">

  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">

  </g>

  <g filter="url(#tu2-soft)">
    <rect x="64" y="180" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="180" width="6" height="90" fill="#64748B" clip-path="url(#tu2-k1)"/>
  </g>
  <circle cx="102" cy="225" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,214.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="232" font-size="21.5" font-weight="600" fill="#111827">1. Send packets 1, 2, 3</text>
  <g filter="url(#tu2-soft)">
    <rect x="654" y="300" width="522" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="654" y="300" width="6" height="90" fill="#DB2777" clip-path="url(#tu2-k2)"/>
  </g>
  <circle cx="692" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,334.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></g>
  <text x="718" y="352" font-size="21.5" font-weight="600" fill="#111827">2. Gets 1 and 3, not 2</text>
  <text x="915" y="419" font-size="18.5" text-anchor="middle" fill="#6B7280">holds 3 until 2 arrives</text>
  <g filter="url(#tu2-soft)">
    <rect x="654" y="440" width="522" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="654" y="440" width="6" height="90" fill="#D97706" clip-path="url(#tu2-k3)"/>
  </g>
  <circle cx="692" cy="485" r="18" fill="#FFFFFF"/>
  <g transform="translate(681.56,474.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/></g>
  <text x="718" y="492" font-size="21.5" font-weight="600" fill="#111827">3. ACK: "still need 2"</text>
  <g filter="url(#tu2-soft)">
    <rect x="64" y="560" width="522" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="64" y="560" width="6" height="90" fill="#64748B" clip-path="url(#tu2-k4)"/>
  </g>
  <circle cx="102" cy="605" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,594.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/></g>
  <text x="128" y="612" font-size="21.5" font-weight="600" fill="#111827">4. Resend packet 2</text>
  <text x="325" y="679" font-size="18.5" text-anchor="middle" fill="#6B7280">no ACK for it in time</text>
  <g filter="url(#tu2-lift)">
    <rect x="40" y="800" width="1160" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="40" y="800" width="9" height="90" fill="#059669" clip-path="url(#tu2-k5)"/>
  </g>
  <circle cx="78" cy="845" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,834.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="104" y="852" font-size="21.5" font-weight="600" fill="#111827">5. The application receives 1, 2, 3, in order</text>
  <text x="620" y="919" font-size="18.5" text-anchor="middle" fill="#6B7280">it never sees the loss, only a small delay</text>

  <rect x="40" y="960" width="1160" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="985" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="1010" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Head-of-line</text>
  <text x="323" y="1010" font-size="18.5" fill="#475569">packet 3 arrived but waits, because TCP delivers only in order</text>
</svg>