<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1240" viewBox="0 0 1200 1240" role="img" aria-labelledby="title desc"><title id="title">Email: client architecture</title><desc id="desc">The unified inbox combines account-scoped results for display. The email repository coordinates saved and provider data, while the submission coordinator owns outgoing work. Search tracks which content is available, and the restricted viewer displays content safely. Account removal stops that account’s work. Selected connections are shown.</desc><defs><marker id="end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker><marker id="start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs><g font-family="Arial, sans-serif"><rect width="1200" height="1240" fill="#f8fafc"/><rect width="1200" height="9" fill="#2563eb"/><rect x="25" y="140" width="1150" height="760" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="50" y="64" font-size="33" fill="#0f172a" font-weight="700">Email: client architecture</text><text x="50" y="106" font-size="22" fill="#334155" font-weight="400">Combine inboxes for display. Keep data and outgoing work separate by account.</text><rect x="50" y="165" width="1100" height="100" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="72" y="205" font-size="24" fill="#2563eb" font-weight="700">Inbox and message views + presentation state</text><text x="72" y="243" font-size="21" fill="#334155" font-weight="400">Show messages, search results, downloads, and submission status.</text><text x="995" y="310" font-size="18" fill="#64748b" font-weight="700">MOBILE APP</text><path d="M215 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M600 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M985 273 V342" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><rect x="50" y="350" width="330" height="205" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="390" font-size="24" fill="#7c3aed" font-weight="700">Email repository</text><text x="72" y="428" font-size="21" fill="#334155" font-weight="400">Read messages; coordinate</text><text x="72" y="458" font-size="21" fill="#334155" font-weight="400">actions and provider data.</text><rect x="435" y="350" width="330" height="205" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="457" y="390" font-size="24" fill="#059669" font-weight="700">Submission</text><text x="457" y="420" font-size="24" fill="#059669" font-weight="700">coordinator</text><text x="457" y="458" font-size="21" fill="#334155" font-weight="400">Save, send, and recover</text><text x="457" y="488" font-size="21" fill="#334155" font-weight="400">the same reviewed email.</text><rect x="820" y="350" width="330" height="205" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="842" y="390" font-size="24" fill="#c2410c" font-weight="700">Search + restricted</text><text x="842" y="420" font-size="24" fill="#c2410c" font-weight="700">content viewer</text><text x="842" y="458" font-size="21" fill="#334155" font-weight="400">Track search coverage.</text><text x="842" y="488" font-size="21" fill="#334155" font-weight="400">Display content safely.</text><path d="M215 563 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M540 563 V612 H450 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><path d="M660 563 V612 H800 V672" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="260" y="651" font-size="19" fill="#64748b" font-weight="400">Saved data</text><text x="1000" y="603" font-size="19" fill="#64748b" font-weight="400">Requests</text><text x="1000" y="633" font-size="19" fill="#64748b" font-weight="400">and updates</text><rect x="50" y="680" width="520" height="185" rx="18" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="72" y="720" font-size="24" fill="#7c3aed" font-weight="700">Account-scoped local store</text><text x="72" y="758" font-size="21" fill="#334155" font-weight="400">Messages, bodies, and attachment state</text><text x="72" y="788" font-size="21" fill="#334155" font-weight="400">Search indexes and pending actions</text><text x="72" y="818" font-size="21" fill="#334155" font-weight="400">Reviewed email and submission identity</text><rect x="650" y="680" width="500" height="185" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="672" y="720" font-size="24" fill="#2563eb" font-weight="700">Provider adapters</text><text x="672" y="758" font-size="21" fill="#334155" font-weight="400">Keep each account and provider separate.</text><text x="672" y="788" font-size="21" fill="#334155" font-weight="400">Fetch authorized messages and resources.</text><text x="672" y="818" font-size="21" fill="#334155" font-weight="400">Submit and recover under provider rules.</text><path d="M900 873 V952" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#end)" marker-start="url(#start)"/><text x="922" y="927" font-size="19" fill="#64748b" font-weight="400">Network</text><rect x="50" y="960" width="520" height="185" rx="18" fill="#0f172a" stroke="#0f172a" stroke-width="2"/><text x="72" y="1000" font-size="24" fill="#ffffff" font-weight="700">A unified inbox is only a view</text><text x="72" y="1038" font-size="21" fill="#ffffff" font-weight="400">Do not merge credentials or storage keys.</text><text x="72" y="1068" font-size="21" fill="#ffffff" font-weight="400">Stop removed-account work.</text><text x="72" y="1098" font-size="21" fill="#ffffff" font-weight="400">Reject its late responses.</text><rect x="650" y="960" width="500" height="185" rx="18" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/><text x="672" y="1000" font-size="24" fill="#c2410c" font-weight="700">Email providers</text><text x="672" y="1038" font-size="21" fill="#334155" font-weight="400">Enforce account access.</text><text x="672" y="1068" font-size="21" fill="#334155" font-weight="400">Return message and submission results.</text><text x="672" y="1098" font-size="21" fill="#334155" font-weight="400">Define supported recovery operations.</text><text x="50" y="1191" font-size="19" fill="#475569" font-weight="400">Selected connections shown. The repository also uses provider adapters and supports search and viewing.</text></g></svg>