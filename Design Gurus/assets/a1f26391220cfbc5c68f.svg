<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="600" viewBox="0 0 1240 600" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two concurrent requests both read a count of 2 from the same record, both write 3, and both are allowed, so the user exceeds the limit.">
  <defs>
    <filter id="rl07-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rl07-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <marker id="rl07-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/>
    </marker>
    <marker id="rl07-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <clipPath id="rl07-k1"><rect x="150" y="300" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="rl07-k2"><rect x="870" y="300" width="220" height="90" rx="12"/></clipPath>
    <clipPath id="rl07-k3"><rect x="492" y="70" width="256" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="600" fill="#FFFFFF"/>

  
  <g fill="none" stroke-width="2">
    <path d="M220,300 V232 Q220,220 232,220 H528 Q540,220 540,208 V164" stroke="#2563EB" marker-end="url(#rl07-bl)"/>
    <path d="M300,300 V262 Q300,250 312,250 H573 Q585,250 585,238 V164" stroke="#DB2777" marker-end="url(#rl07-pk)"/>
    <path d="M990,300 V232 Q990,220 978,220 H712 Q700,220 700,208 V164" stroke="#2563EB" marker-end="url(#rl07-bl)"/>
    <path d="M910,300 V262 Q910,250 898,250 H667 Q655,250 655,238 V164" stroke="#DB2777" marker-end="url(#rl07-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="380" y="212" fill="#1D4ED8">read 2</text>
    <text x="440" y="242" fill="#BE185D">write 3</text>
    <text x="855" y="212" fill="#1D4ED8">read 2</text>
    <text x="785" y="242" fill="#BE185D">write 3</text>
  </g>

  
  <g filter="url(#rl07-lift)">
    <rect x="492" y="70" width="256" height="90" rx="12" fill="#EDE9FE" stroke="#7C3AED" stroke-width="2"/>
    <rect x="492" y="70" width="9" height="90" fill="#7C3AED" clip-path="url(#rl07-k3)"/>
  </g>
  <circle cx="530" cy="115" r="18" fill="#FFFFFF"/>
  <g transform="translate(519.56,104.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>
  </g>
  <text x="556" y="122" font-size="18.5" font-weight="600" fill="#111827">Kristie: Count = 2</text>

  
  <g filter="url(#rl07-soft)">
    <rect x="150" y="300" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="150" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#rl07-k1)"/>
  </g>
  <circle cx="188" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(177.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="214" y="352" font-size="18.5" font-weight="600" fill="#111827">Request A</text>

  
  <g filter="url(#rl07-soft)">
    <rect x="870" y="300" width="220" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="870" y="300" width="6" height="90" fill="#2563EB" clip-path="url(#rl07-k2)"/>
  </g>
  <circle cx="908" cy="345" r="18" fill="#FFFFFF"/>
  <g transform="translate(897.56,334.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/>
  </g>
  <text x="934" y="352" font-size="18.5" font-weight="600" fill="#111827">Request B</text>

  
  <rect x="205" y="412" width="110" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <path d="M221,428 l4,4 l7,-8" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="243" y="433" font-size="15.5" font-weight="600" fill="#047857">allowed</text>
  <rect x="925" y="412" width="110" height="32" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
  <path d="M941,428 l4,4 l7,-8" fill="none" stroke="#047857" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="963" y="433" font-size="15.5" font-weight="600" fill="#047857">allowed</text>

  
  <g font-size="15.5" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="4">
    <text x="620" y="478" fill="#475569">both see one slot left, so Kristie gets four requests in the window</text>
  </g>

  
  <rect x="40" y="505" width="1160" height="56" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="539" text-anchor="middle" font-size="16" fill="#475569">Read-then-write is the race; the fix is one atomic check-and-update.</text>
</svg>