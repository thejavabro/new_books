<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="534" viewBox="0 0 1240 534" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A retry with exponential backoff. The first attempt fails and the caller waits one second, the second fails and it waits two seconds, the third fails and it waits four seconds, and the fourth attempt succeeds. Each wait doubles, and a small random amount is added so that many callers do not retry in step">
  <defs>
    <marker id="rt1-pk" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/>
    </marker>
    <filter id="rt1-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="rt1-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="rt1-k1"><rect x="72" y="112" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="rt1-k2"><rect x="360" y="112" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="rt1-k3"><rect x="648" y="112" width="230" height="90" rx="12"/></clipPath>
    <clipPath id="rt1-k4"><rect x="936" y="112" width="230" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="534" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="290" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#475569">Each wait doubles, so a brief failure recovers fast and a long outage does not overload the service</text>

  <g fill="none" stroke="#DB2777" stroke-width="2">
    <path d="M302,157 L356,157" marker-end="url(#rt1-pk)"/>
    <path d="M590,157 L644,157" marker-end="url(#rt1-pk)"/>
    <path d="M878,157 L932,157" marker-end="url(#rt1-pk)"/>
  </g>
  <g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="329" y="150" fill="#BE185D">+1s</text>
    <text x="617" y="150" fill="#BE185D">+2s</text>
    <text x="905" y="150" fill="#BE185D">+4s</text>
  </g>

  <g filter="url(#rt1-soft)">
    <rect x="72" y="112" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#rt1-k1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Attempt 1</text>
  <text x="187" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">fails at t = 0</text>
  <text x="187" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">timeout, not a 400</text>

  <g filter="url(#rt1-soft)">
    <rect x="360" y="112" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="360" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#rt1-k2)"/>
  </g>
  <circle cx="398" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(387.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="424" y="164" font-size="18.5" font-weight="600" fill="#111827">Attempt 2</text>
  <text x="475" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">fails at t = 1s</text>
  <text x="475" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">still recovering</text>

  <g filter="url(#rt1-soft)">
    <rect x="648" y="112" width="230" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="648" y="112" width="6" height="90" fill="#DB2777" clip-path="url(#rt1-k3)"/>
  </g>
  <circle cx="686" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(675.56,146.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="712" y="164" font-size="18.5" font-weight="600" fill="#111827">Attempt 3</text>
  <text x="763" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">fails at t = 3s</text>
  <text x="763" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">last free attempt</text>

  <g filter="url(#rt1-lift)">
    <rect x="936" y="112" width="230" height="90" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="936" y="112" width="9" height="90" fill="#059669" clip-path="url(#rt1-k4)"/>
  </g>
  <circle cx="974" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(963.56,146.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.2 12.3l2.6 2.6 5-5.4"/>
  </g>
  <text x="1000" y="164" font-size="18.5" font-weight="600" fill="#111827">Attempt 4</text>
  <text x="1051" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">succeeds at t = 7s</text>
  <text x="1051" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">then stop retrying</text>

  <rect x="40" y="366" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="390" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="412" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Add jitter</text>
  <text x="288" y="412" font-size="15.5" fill="#475569">add a small random amount to each wait, or every caller that failed together retries together</text>

  <rect x="64" y="434" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="456" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Retry only some</text>
  <text x="288" y="456" font-size="15.5" fill="#475569">retry a timeout or a 503, never a 400 or a 404, because those will fail exactly the same way again</text>
</svg>