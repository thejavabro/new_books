<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1019" viewBox="0 0 1240 1019" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Four stacked layers keep an answer grounded: instructions, citations, entailment checks, and designed refusal, all resting on retrieval quality">
  <defs>
    <marker id="kagfl-mslate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <filter id="kagfl-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="kagfl-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="kagfl-k1"><rect x="180" y="585" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="kagfl-k2"><rect x="180" y="430" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="kagfl-k3"><rect x="180" y="275" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="kagfl-k4"><rect x="180" y="120" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="kagfl-k5"><rect x="40" y="750" width="1160" height="90" rx="12"/></clipPath>
  </defs>
  <rect x="0" y="0" width="1240" height="1019" fill="#FFFFFF"/>
  <rect x="40" y="40" width="1160" height="690" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Four layers, stacked</text>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M218,585 V520" marker-end="url(#kagfl-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M218,430 V365" marker-end="url(#kagfl-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M218,275 V210" marker-end="url(#kagfl-mslate)"/></g>
  <g fill="none" stroke="#64748B" stroke-width="2"><path d="M110,663 V134" marker-end="url(#kagfl-mslate)"/></g>
  <text x="110" y="114" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">applied last</text>
  <text x="110" y="689" font-size="15.5" font-weight="600" text-anchor="middle" fill="#475569">applied first</text>
  <g filter="url(#kagfl-soft)">
    <rect x="180" y="585" width="530" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="180" y="585" width="6" height="90" fill="#2563EB" clip-path="url(#kagfl-k1)"/>
  </g>
  <circle cx="218" cy="630" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,619.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="244" y="637" font-size="18.5" font-weight="600" fill="#111827">1. Instructions and framing</text>
  <text x="445" y="700" font-size="15.5" text-anchor="middle" fill="#6B7280">answer only from the context, and admit gaps</text>
  <text x="736" y="635" font-size="15.5" font-weight="600" fill="#1D4ED8">catches many made-up claims, but not all</text>
  <g filter="url(#kagfl-soft)">
    <rect x="180" y="430" width="530" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="180" y="430" width="6" height="90" fill="#7C3AED" clip-path="url(#kagfl-k2)"/>
  </g>
  <circle cx="218" cy="475" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,464.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="244" y="482" font-size="18.5" font-weight="600" fill="#111827">2. Citations</text>
  <text x="445" y="545" font-size="15.5" text-anchor="middle" fill="#6B7280">claim-source pairs, resolved by code</text>
  <text x="736" y="480" font-size="15.5" font-weight="600" fill="#5B21B6">catches missing or invented sources</text>
  <g filter="url(#kagfl-soft)">
    <rect x="180" y="275" width="530" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="180" y="275" width="6" height="90" fill="#D97706" clip-path="url(#kagfl-k3)"/>
  </g>
  <circle cx="218" cy="320" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,309.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
  <text x="244" y="327" font-size="18.5" font-weight="600" fill="#111827">3. Entailment checks</text>
  <text x="445" y="390" font-size="15.5" text-anchor="middle" fill="#6B7280">a verifier checks each claim against its chunk</text>
  <text x="736" y="325" font-size="15.5" font-weight="600" fill="#B45309">catches claims that misstate a real source</text>
  <g filter="url(#kagfl-soft)">
    <rect x="180" y="120" width="530" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="180" y="120" width="6" height="90" fill="#059669" clip-path="url(#kagfl-k4)"/>
  </g>
  <circle cx="218" cy="165" r="18" fill="#FFFFFF"/>
  <g transform="translate(207.56,154.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="244" y="172" font-size="18.5" font-weight="600" fill="#111827">4. Designed refusal</text>
  <text x="445" y="235" font-size="15.5" text-anchor="middle" fill="#6B7280">a useful &quot;I don't know&quot; with a next step</text>
  <text x="736" y="170" font-size="15.5" font-weight="600" fill="#047857">catches empty retrieval, failed checks, out-of-scope questions</text>
  <g filter="url(#kagfl-soft)">
    <rect x="40" y="750" width="1160" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="40" y="750" width="6" height="90" fill="#64748B" clip-path="url(#kagfl-k5)"/>
  </g>
  <circle cx="78" cy="795" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,784.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="104" y="802" font-size="18.5" font-weight="600" fill="#111827">Retrieval quality is the floor</text>
  <text x="620" y="865" font-size="15.5" text-anchor="middle" fill="#6B7280">the layers check that the answer matches the evidence, not that the evidence is right</text>
  <rect x="40" y="903" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="948" text-anchor="middle" font-size="16" fill="#475569">No grounding layer can rescue an answer built on the wrong documents.</text>
</svg>