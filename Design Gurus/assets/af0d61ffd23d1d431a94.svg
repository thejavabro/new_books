<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1210" viewBox="0 0 1240 1210" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Two panels. Synchronous: the order service sends a request to the payment service to charge the card and waits for the response that the payment succeeded; the service waits for a response, is simple to understand, is used when the caller needs the result before it can continue and is best for real-time, user-facing operations. Asynchronous: the order service publishes an OrderCreated event to a Kafka message broker, and the analytics service consumes it to record the event while the notification service consumes it to send an email; the service does not wait, it suits long-running or non-critical operations, decouples services and improves scalability, and is common for background processing and integrations">
  <defs>
    <filter id="m05e-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="m05e-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="m05e-k1"><rect x="120" y="215" width="280" height="100" rx="12"/></clipPath>
    <clipPath id="m05e-k2"><rect x="820" y="215" width="300" height="100" rx="12"/></clipPath>
    <clipPath id="m05e-k3"><rect x="64" y="750" width="250" height="100" rx="12"/></clipPath>
    <clipPath id="m05e-k4"><rect x="936" y="695" width="240" height="90" rx="12"/></clipPath>
    <clipPath id="m05e-k5"><rect x="936" y="815" width="240" height="90" rx="12"/></clipPath>
    <marker id="m05e-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="m05e-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="1210" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Synchronous vs. asynchronous communication in microservices</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">A synchronous caller waits for the answer; an asynchronous publisher hands an event to a broker and moves on.</text>

  <rect x="40" y="120" width="1160" height="460" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="150" font-size="19.5" font-weight="600" fill="#1D4ED8">Synchronous communication</text>
  <rect x="40" y="600" width="1160" height="570" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="630" font-size="19.5" font-weight="600" fill="#047857">Asynchronous communication</text>

  <g fill="none" stroke-width="2">
    <path d="M400,245 H820" stroke="#2563EB" marker-end="url(#m05e-m-blue)"/>
    <path d="M820,285 H400" stroke="#2563EB" stroke-dasharray="7 6" marker-end="url(#m05e-m-blue)"/>
    <path d="M314,800 H480" stroke="#059669" marker-end="url(#m05e-m-emerald)"/>
    <path d="M680,740 H936" stroke="#059669" marker-end="url(#m05e-m-emerald)"/>
    <path d="M680,860 H936" stroke="#059669" marker-end="url(#m05e-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="610" y="231" fill="#1D4ED8">1. Request (charge card)</text>
    <text x="610" y="314" fill="#1D4ED8">2. Response (payment succeeded)</text>
    <text x="397" y="766" fill="#047857">Publish event</text>
    <text x="397" y="789" fill="#047857">(OrderCreated)</text>
    <text x="808" y="704" fill="#047857">Consume event</text>
    <text x="808" y="728" fill="#047857">(record event)</text>
    <text x="808" y="888" fill="#047857">Consume event</text>
    <text x="808" y="912" fill="#047857">(send email)</text>
  </g>

  <g filter="url(#m05e-soft)">
    <rect x="120" y="215" width="280" height="100" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="120" y="215" width="6" height="100" fill="#2563EB" clip-path="url(#m05e-k1)"/>
  </g>
  <circle cx="158" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(147.56,254.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="184" y="272" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <g filter="url(#m05e-soft)">
    <rect x="820" y="215" width="300" height="100" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="820" y="215" width="6" height="100" fill="#D97706" clip-path="url(#m05e-k2)"/>
  </g>
  <circle cx="858" cy="265" r="18" fill="#FFFFFF"/>
  <g transform="translate(847.56,254.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="884" y="272" font-size="21.5" font-weight="600" fill="#111827">Payment service</text>
  <g filter="url(#m05e-soft)">
    <rect x="64" y="750" width="250" height="100" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="64" y="750" width="6" height="100" fill="#2563EB" clip-path="url(#m05e-k3)"/>
  </g>
  <circle cx="102" cy="800" r="18" fill="#FFFFFF"/>
  <g transform="translate(91.56,789.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2.5 3.5h3l2.4 11.2a1.5 1.5 0 0 0 1.5 1.3h8.8a1.5 1.5 0 0 0 1.5-1.2L21.5 7.5H6.3"/></g>
  <text x="128" y="807" font-size="21.5" font-weight="600" fill="#111827">Order service</text>
  <g filter="url(#m05e-soft)">
    <rect x="936" y="695" width="240" height="90" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="936" y="695" width="6" height="90" fill="#4F46E5" clip-path="url(#m05e-k4)"/>
  </g>
  <circle cx="974" cy="740" r="18" fill="#FFFFFF"/>
  <g transform="translate(963.56,729.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="1000" y="734.25" font-size="21.5" font-weight="600" fill="#111827">Analytics</text>
  <text x="1000" y="759.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <g filter="url(#m05e-soft)">
    <rect x="936" y="815" width="240" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="936" y="815" width="6" height="90" fill="#DB2777" clip-path="url(#m05e-k5)"/>
  </g>
  <circle cx="974" cy="860" r="18" fill="#FFFFFF"/>
  <g transform="translate(963.56,849.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="1000" y="854.25" font-size="21.5" font-weight="600" fill="#111827">Notification</text>
  <text x="1000" y="879.75" font-size="21.5" font-weight="600" fill="#111827">service</text>
  <g stroke="#D97706" stroke-width="1.5">
    <path d="M480,710 L480,874 A100,16 0 0 0 680,874 L680,710" fill="#FEF3C7"/>
    <ellipse cx="580" cy="710" rx="100" ry="16" fill="#FFFBEB"/>
  </g>
  <text x="580" y="782" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Message</text>
  <text x="580" y="807" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">broker</text>
  <text x="580" y="832" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">(Kafka)</text>
  <text x="64" y="178" font-size="18.5" fill="#475569">Direct request and response (for example, HTTP or gRPC)</text>
  <text x="64" y="658" font-size="18.5" fill="#475569">Event-driven using a message broker (for example, Kafka)</text>

  <rect x="64" y="350" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="372" r="6" fill="#2563EB"/>
  <text x="110" y="378.5" font-size="18.5" fill="#1F2937">Service waits for a response</text>
  <rect x="64" y="404" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="426" r="6" fill="#2563EB"/>
  <text x="110" y="432.5" font-size="18.5" fill="#1F2937">Simple to understand</text>
  <rect x="64" y="458" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="480" r="6" fill="#2563EB"/>
  <text x="110" y="486.5" font-size="18.5" fill="#1F2937">Use when the caller needs the result before it can continue</text>
  <rect x="64" y="512" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="1.2"/>
  <circle cx="90" cy="534" r="6" fill="#2563EB"/>
  <text x="110" y="540.5" font-size="18.5" fill="#1F2937">Best for real-time, user-facing operations</text>
  <rect x="64" y="945" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="90" cy="967" r="6" fill="#059669"/>
  <text x="110" y="973.5" font-size="18.5" fill="#1F2937">Service does not wait for a response</text>
  <rect x="64" y="999" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="90" cy="1021" r="6" fill="#059669"/>
  <text x="110" y="1027.5" font-size="18.5" fill="#1F2937">Better for long-running or non-critical operations</text>
  <rect x="64" y="1053" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="90" cy="1075" r="6" fill="#059669"/>
  <text x="110" y="1081.5" font-size="18.5" fill="#1F2937">Decouples services and improves scalability</text>
  <rect x="64" y="1107" width="1112" height="44" rx="10" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.2"/>
  <circle cx="90" cy="1129" r="6" fill="#059669"/>
  <text x="110" y="1135.5" font-size="18.5" fill="#1F2937">Commonly used for background processing and integrations</text>


</svg>