<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Inside a service mesh every service has a certificate issued by the mesh CA and calls between them are mutually authenticated, so a process without a certificate is refused at the connection">
  <rect x="0" y="0" width="1240" height="608" fill="#FFFFFF"/>
  <defs>
    <marker id="se4-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="se4-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <filter id="se4-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Being inside the network is no longer enough to be trusted</text>

  <rect x="240" y="86" width="700" height="60" rx="10" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/>
  <text x="590" y="124" font-size="20" font-weight="600" fill="#5B21B6" text-anchor="middle">Mesh CA, issues a short-lived certificate to every workload</text>

  <line x1="380" y1="150" x2="300" y2="216" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#se4-violet)"/>
  <line x1="590" y1="150" x2="590" y2="216" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#se4-violet)"/>
  <line x1="800" y1="150" x2="880" y2="216" stroke="#7C3AED" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#se4-violet)"/>

  <rect x="150" y="196" width="880" height="230" rx="14" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="590" y="410" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">every hop is mutually authenticated and encrypted</text>

  <g filter="url(#se4-soft)">
    <rect x="190" y="220" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="480" y="220" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="770" y="220" width="220" height="80" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="300" y="254" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">orders</text>
  <text x="300" y="282" font-size="20" fill="#065F46" text-anchor="middle">has a certificate</text>
  <text x="590" y="254" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">payments</text>
  <text x="590" y="282" font-size="20" fill="#065F46" text-anchor="middle">has a certificate</text>
  <text x="880" y="254" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">ledger</text>
  <text x="880" y="282" font-size="20" fill="#065F46" text-anchor="middle">has a certificate</text>

  <line x1="414" y1="260" x2="476" y2="260" stroke="#059669" stroke-width="2.5" marker-end="url(#se4-emerald)"/>
  <line x1="704" y1="260" x2="766" y2="260" stroke="#059669" stroke-width="2.5" marker-end="url(#se4-emerald)"/>

  
  <rect x="1060" y="220" width="140" height="80" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="2.5"/>
  <text x="1130" y="254" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">a pod</text>
  <text x="1130" y="282" font-size="20" fill="#B91C1C" text-anchor="middle">with no cert</text>
  <line x1="1056" y1="260" x2="998" y2="260" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 5"/>
  <line x1="1012" y1="248" x2="1034" y2="272" stroke="#DC2626" stroke-width="3"/>
  <line x1="1034" y1="248" x2="1012" y2="272" stroke="#DC2626" stroke-width="3"/>
  <text x="1130" y="330" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">refused</text>

  
  <rect x="40" y="476" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="512" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The network perimeter stops being the security boundary. The certificate becomes it.</text>
  <text x="620" y="542" font-size="20" fill="#334155" text-anchor="middle">An attacker who lands inside the cluster still cannot open a single connection.</text>
</svg>