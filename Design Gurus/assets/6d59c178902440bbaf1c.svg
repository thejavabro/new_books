<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="620" viewBox="0 0 1240 620" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A read checks the memtable, then consults each SSTable&#39;s Bloom filter and opens only the files that might hold the key, newest first">
  <rect x="0" y="0" width="1240" height="620" fill="#FFFFFF"/>
  <defs>
    <marker id="ix13-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="ix13-green" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="ix13-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <filter id="ix13-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="20" y="46" font-size="20" font-weight="600" fill="#334155">Read key 4271903, checking the newest source first</text>

  
  <line x1="860" y1="40" x2="892" y2="40" stroke="#DC2626" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="904" y="47" font-size="20" fill="#475569">filter says no, file skipped</text>

  
  <path d="M164,150 C164,220 250,233 314,233" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix13-blue)"/>
  <path d="M520,233 L584,233" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix13-blue)"/>
  <path d="M790,233 L854,233" fill="none" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#ix13-blue)"/>

  <path d="M420,270 L420,318" fill="none" stroke="#059669" stroke-width="2.5" marker-end="url(#ix13-green)"/>
  <path d="M690,270 L690,318" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ix13-red)"/>
  <path d="M960,270 L960,318" fill="none" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#ix13-red)"/>

  
  <g filter="url(#ix13-soft)">
    <rect x="44" y="86" width="240" height="64" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
  </g>
  <text x="164" y="125" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Memtable</text>
  <g paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="232" y="192" font-size="20" fill="#1D4ED8" text-anchor="middle">not here</text>
  </g>

  
  <g filter="url(#ix13-soft)">
    <rect x="320" y="196" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
    <rect x="590" y="196" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <rect x="860" y="196" width="200" height="74" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  </g>
  <text x="420" y="226" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bloom filter</text>
  <text x="420" y="256" font-size="20" fill="#047857" text-anchor="middle">possibly present</text>
  <text x="690" y="226" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bloom filter</text>
  <text x="690" y="256" font-size="20" fill="#B91C1C" text-anchor="middle">definitely absent</text>
  <text x="960" y="226" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Bloom filter</text>
  <text x="960" y="256" font-size="20" fill="#B91C1C" text-anchor="middle">definitely absent</text>

  
  <g filter="url(#ix13-soft)">
    <rect x="320" y="320" width="200" height="84" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
    <rect x="590" y="320" width="200" height="84" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
    <rect x="860" y="320" width="200" height="84" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>
  <text x="420" y="354" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">SSTable 3</text>
  <text x="420" y="384" font-size="20" fill="#047857" text-anchor="middle">opened, key found</text>
  <text x="690" y="354" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">SSTable 2</text>
  <text x="690" y="384" font-size="20" fill="#94A3B8" text-anchor="middle">never opened</text>
  <text x="960" y="354" font-size="20" font-weight="600" fill="#94A3B8" text-anchor="middle">SSTable 1</text>
  <text x="960" y="384" font-size="20" fill="#94A3B8" text-anchor="middle">never opened</text>

  <text x="620" y="464" font-size="20" font-weight="600" fill="#047857" text-anchor="middle">The first hit wins, because the newest write is the current value.</text>

  <rect x="150" y="494" width="940" height="56" rx="12" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="529" font-size="20" fill="#334155" text-anchor="middle">Without the filters, one lookup would have to open every file that could hold the key.</text>

  <text x="620" y="594" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">A read costs more than a B-tree lookup, and the Bloom filter is what keeps the cost near one file.</text>
</svg>