<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" style="background-color:#ffffff">
<defs>
<marker id="pxa" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#3a6fb0"/></marker>
<marker id="pxb" markerWidth="9" markerHeight="7" refX="8.5" refY="3.5" orient="auto"><path d="M 0 0 L 9 3.5 L 0 7 z" fill="#b4322c"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<text x="30" y="28" font-size="13.5" font-weight="bold">The caller writes the same code either way. Only the timing changes.</text>

<rect x="30" y="50" width="170" height="52" rx="4" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="115" y="72" text-anchor="middle" font-weight="bold" font-size="12.5">Caller</text>
<text x="115" y="90" text-anchor="middle" font-size="11" fill="#414d60">holds a Report</text>

<rect x="300" y="50" width="200" height="52" rx="4" fill="#dcefe4" stroke="#2f7a55" stroke-width="2"/>
<text x="400" y="72" text-anchor="middle" font-weight="bold" font-size="12.5">LazyReport</text>
<text x="400" y="90" text-anchor="middle" font-size="11" fill="#2f7a55">the proxy</text>

<rect x="620" y="50" width="200" height="52" rx="4" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="720" y="72" text-anchor="middle" font-weight="bold" font-size="12.5" fill="#414d60">RealReport</text>
<text x="720" y="90" text-anchor="middle" font-size="11" fill="#6b7789">100 MB to build</text>

<path d="M 204 76 L 295 76" stroke="#3a6fb0" fill="none" stroke-width="1.5" marker-end="url(#pxa)"/>
<path d="M 504 76 L 615 76" stroke="#3a6fb0" fill="none" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#pxa)"/>
<text x="511" y="68" font-size="11" fill="#414d60">only on first render()</text>

<line x1="30" y1="132" x2="930" y2="132" stroke="#dbe2ed"/>

<text x="30" y="160" font-size="13" font-weight="bold" fill="#414d60">What actually happens, call by call</text>

<rect x="30" y="176" width="440" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="198" font-family="monospace" font-size="11.5">new LazyReport("Q3 revenue")</text>
<rect x="490" y="176" width="440" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="506" y="198" font-size="12" fill="#2f7a55">nothing loaded, no cost paid</text>

<rect x="30" y="216" width="440" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="238" font-family="monospace" font-size="11.5">report.title()</text>
<rect x="490" y="216" width="440" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="506" y="238" font-size="12" fill="#2f7a55">still nothing, the proxy knows the title itself</text>

<rect x="30" y="256" width="440" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="278" font-family="monospace" font-size="11.5">report.render()</text>
<rect x="490" y="256" width="440" height="34" rx="3" fill="#f6ecd6" stroke="#8a5f10"/>
<text x="506" y="278" font-size="12" fill="#8a5f10">now the 100 MB load happens, once</text>

<rect x="30" y="296" width="440" height="34" rx="3" fill="#ffffff" stroke="#c3cfe0"/>
<text x="46" y="318" font-family="monospace" font-size="11.5">report.render()</text>
<rect x="490" y="296" width="440" height="34" rx="3" fill="#dcefe4" stroke="#2f7a55"/>
<text x="506" y="318" font-size="12" fill="#2f7a55">reuses what was loaded, no second cost</text>

<rect x="30" y="356" width="900" height="58" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="378" font-size="12.5" fill="#414d60">A proxy has the same interface as the thing it stands in for. That is what lets it be dropped in without any caller changing.</text>
<text x="52" y="400" font-size="12.5" fill="#b4322c">It is also the risk: an expensive or remote call now looks exactly like a cheap local one.</text>
</g>
</svg>