<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="754" viewBox="0 0 1240 754" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="debt-title debt-desc">
<title id="debt-title">Flag debt is combinatorial</title>
<desc id="debt-desc">Every flag is a branch and branches compose, so ten of them describe over a thousand configurations of which you test two. Untested combinations become the normal case rather than the exception.</desc>
<defs>
<marker id="debt-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="debt-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="debt-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="debt-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="754" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Flag debt is combinatorial</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Every flag is a branch, and branches multiply, which is why this grows faster than it feels like it should.</text>
<rect x="40" y="676" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="676" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<text x="40" y="150" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Ten independent boolean flags</text>
<rect x="40" y="168" width="560" height="80" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="168" width="5" height="80" rx="2.5" fill="#F28B9D"/><text x="320" y="200.5" font-size="28" font-weight="700" fill="#A83147" text-anchor="middle">1,024</text><text x="320" y="227.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">possible configurations</text>
<rect x="640" y="168" width="560" height="80" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="168" width="5" height="80" rx="2.5" fill="#39D5AA"/><text x="920" y="200.5" font-size="28" font-weight="700" fill="#169B77" text-anchor="middle">2</text><text x="920" y="227.5" font-size="20" font-weight="400" fill="#080C50" text-anchor="middle">you actually test</text>
<text x="620" y="280" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">and the one running in production is usually neither</text>
<text x="40" y="326" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Two consequences, both practical</text>
<rect x="40" y="344" width="560" height="92" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="320" y="370" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Untested combinations are the normal case,</text><text x="320" y="396" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">so a bug needing A on and B off</text><text x="320" y="422" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">is one nobody will reproduce</text>
<rect x="640" y="344" width="560" height="92" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="920" y="370" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">Code becomes unreadable: three flags in a</text><text x="920" y="396" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">function is eight behaviors, and the one</text><text x="920" y="422" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">you are debugging is not written down</text>
<rect x="40" y="460" width="1160" height="88" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="460" width="5" height="88" rx="2.5" fill="#39D5AA"/><text x="64" y="497" font-size="22" font-weight="700" fill="#169B77" text-anchor="start">The discipline that works is a process rather than a technique</text><text x="64" y="523" font-size="19" font-weight="400" fill="#080C50" text-anchor="start">Every release flag gets a removal date when it is created, and a flag past its date is a bug with a ticket.</text>
<rect x="40" y="572" width="1160" height="78" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="572" width="5" height="78" rx="2.5" fill="#AC8BE8"/><text x="64" y="602.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Removing a flag is a deploy, which means it is work,</text><text x="64" y="631.5" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">which means it will not happen unless it is scheduled.</text>
<text x="66" y="710" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Teams that keep flag counts low treat removal as part of the feature, not as follow-up.</text>
</svg>