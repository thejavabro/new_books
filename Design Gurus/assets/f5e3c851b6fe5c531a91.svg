<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated Lambda architecture: deployment control plane, cold start provisioning with Firecracker, warm start routing and asynchronous invocation">
  <defs>
    <filter id="la-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="la-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="la-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="la-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="la-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="la-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">AWS Lambda: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">Cold starts, warm starts, and the freezing trick that makes 95% of calls cheap</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#1E40AF">1. Deploy · code is stored, never pushed to the fleet</text>
  <path d="M264,194 L349,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="307" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">create</text>
  <path d="M577,194 L662,194" stroke="#3B82F6" stroke-width="2.5" fill="none" marker-end="url(#la-blue)"/>
  <text x="620" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">direct</text>
  <path d="M890,194 L975,194" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="933" y="182" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">record</text>
  <g filter="url(#la-soft)">
    <rect x="40" y="156" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M666,171 L666,217 A110,15 0 0 0 886,217 L886,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="776" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
  </g>
  <text x="150" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Developer</text>
  <text x="150" y="216" font-size="20" fill="#64748B" text-anchor="middle">uploads a zip</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Function Manager</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">presigned URL</text>
  <text x="776" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">S3</text>
  <text x="776" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">immutable artifacts</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DynamoDB</text>
  <text x="1089" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">account, then name</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#475569">2. Cold start · zero to running code, 200ms to 1s</text>
  <path d="M264,436 L349,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="307" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">ask</text>
  <path d="M577,436 L662,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="620" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">boot</text>
  <path d="M890,436 L975,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="933" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">load</text>
  <g filter="url(#la-soft)">
    <rect x="40" y="398" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="666" y="398" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M979,413 L979,459 A110,15 0 0 0 1199,459 L1199,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Frontend Invoker</text>
  <text x="150" y="458" font-size="20" fill="#64748B" text-anchor="middle">needs a slot</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Placement</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">power of two</text>
  <text x="776" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Firecracker VM</text>
  <text x="776" y="458" font-size="20" fill="#64748B" text-anchor="middle">its own kernel</text>
  <text x="1089" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Local code cache</text>
  <text x="1089" y="504" font-size="20" fill="#065F46" text-anchor="middle">NVMe, avoids S3</text>

  <rect x="24" y="580" width="1192" height="166" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#1E40AF">3. Warm start · the VM was frozen, not killed. This is 95% of traffic</text>
  <path d="M364,678 L456,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="410" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">lookup</text>
  <path d="M784,678 L876,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#la-blue)"/>
  <text x="830" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">unfreeze</text>
  <g filter="url(#la-soft)">
    <rect x="40" y="640" width="320" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <rect x="460" y="640" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="640" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Frontend Invoker</text>
  <text x="200" y="700" font-size="20" fill="#64748B" text-anchor="middle">same function</text>
  <text x="620" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Sticky routing</text>
  <text x="620" y="700" font-size="20" fill="#64748B" text-anchor="middle">back to node 42</text>
  <text x="1040" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Thaw</text>
  <text x="1040" y="700" font-size="20" fill="#64748B" text-anchor="middle">under 20ms</text>

  <rect x="24" y="776" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="808" font-size="20" font-weight="600" fill="#92400E">4. Async and limits · events queue, and one tenant cannot take the fleet</text>
  <path d="M264,874 L349,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#la-amber)"/>
  <text x="307" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">pull</text>
  <path d="M577,874 L662,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#la-amber)"/>
  <text x="620" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">gives up</text>
  <path d="M890,874 L975,874" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#la-amber)"/>
  <text x="933" y="862" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">throttle</text>
  <g filter="url(#la-soft)">
    <path d="M40,851 L40,897 A110,15 0 0 0 260,897 L260,851" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="150" cy="851" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="353" y="836" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M666,851 L666,897 A110,15 0 0 0 886,897 L886,851" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <ellipse cx="776" cy="851" rx="110" ry="15" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5"/>
    <rect x="979" y="836" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Event queue</text>
  <text x="150" y="942" font-size="20" fill="#92400E" text-anchor="middle">202 returns at once</text>
  <text x="463" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Poller</text>
  <text x="463" y="896" font-size="20" fill="#64748B" text-anchor="middle">retries with backoff</text>
  <text x="776" y="885" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">DLQ</text>
  <text x="776" y="942" font-size="20" fill="#92400E" text-anchor="middle">after three tries</text>
  <text x="1089" y="870" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Concurrency cap</text>
  <text x="1089" y="896" font-size="20" fill="#64748B" text-anchor="middle">429 per account</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>