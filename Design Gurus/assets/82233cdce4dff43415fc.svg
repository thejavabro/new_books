<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1030" viewBox="0 0 1240 1030" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Clients send requests to the messaging grid of the virtualized middleware, which routes them to processing units. The middleware has four parts: the messaging grid routes and balances requests across processing units and can route by key to the unit that holds its data; the data grid is a library embedded in each processing unit that handles partitioning, replication and fast access; the optional processing grid orchestrates requests across unit types; the deployment manager starts and stops units based on load, monitors the cluster, and scales units up or down for elasticity">
