<text x="878" y="224" text-anchor="middle" font-size="20" font-weight="600" fill="#111827">9</text>
<text x="878" y="270" text-anchor="middle" font-size="15.5" fill="#94A3B8">6</text>
<text x="301" y="355" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">stack</text>
<text x="331" y="354" font-size="18.5" fill="#475569">empty</text>
<rect x="40" y="436" width="1160" height="98" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="620" y="476" text-anchor="middle" font-size="21.5" font-weight="600" fill="#1D4ED8">Keep the digits in increasing order by dropping any digit bigger than the one after it</text>
<text x="620" y="508" text-anchor="middle" font-size="18.5" fill="#475569">3 removals are allowed, and each drop must be spent as far left as possible</text>
