<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="810" viewBox="0 0 1240 810" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="On the left an agent must discover and sequence six fine-grained calls, each one a round trip, a failure point and more consumed context. On the right one job-shaped call returns the same support answer as a compact typed result, at the price of a larger response and stronger coupling.">
  <defs>
    <marker id="p25-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>

    <filter id="p25-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="p25-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="p25-k1"><rect x="80" y="174" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k2"><rect x="80" y="240" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k3"><rect x="80" y="306" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k4"><rect x="80" y="372" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k5"><rect x="80" y="438" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k6"><rect x="80" y="504" width="480" height="48" rx="10"/></clipPath>
    <clipPath id="p25-k7"><rect x="680" y="174" width="480" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="810" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="62" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="77" font-size="16.5" font-weight="600" fill="#475569">Six fine-grained calls, or one job-shaped call</text>
  <text x="1176" y="77" text-anchor="end" font-size="15.5" fill="#6B7280">the same support answer, two tool shapes</text>

  
  <rect x="40" y="126" width="560" height="514" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="156" font-size="16.5" font-weight="600" fill="#BE185D">Six fine-grained calls</text>
  <text x="576" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">six operations</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="174" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="174" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k1)"/>
  </g>
  <circle cx="114" cy="198" r="4.5" fill="#DB2777"/>
  <text x="138" y="205" font-size="18.5" font-weight="600" fill="#111827">get_order_status</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="240" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="240" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k2)"/>
  </g>
  <circle cx="114" cy="264" r="4.5" fill="#DB2777"/>
  <text x="138" y="271" font-size="18.5" font-weight="600" fill="#111827">get_order_address</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="306" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="306" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k3)"/>
  </g>
  <circle cx="114" cy="330" r="4.5" fill="#DB2777"/>
  <text x="138" y="337" font-size="18.5" font-weight="600" fill="#111827">get_latest_shipment</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="372" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="372" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k4)"/>
  </g>
  <circle cx="114" cy="396" r="4.5" fill="#DB2777"/>
  <text x="138" y="403" font-size="18.5" font-weight="600" fill="#111827">get_shipment_events</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="438" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="438" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k5)"/>
  </g>
  <circle cx="114" cy="462" r="4.5" fill="#DB2777"/>
  <text x="138" y="469" font-size="18.5" font-weight="600" fill="#111827">get_return_eligibility</text>

  <g filter="url(#p25-soft)">
    <rect x="80" y="504" width="480" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="80" y="504" width="6" height="48" fill="#DB2777" clip-path="url(#p25-k6)"/>
  </g>
  <circle cx="114" cy="528" r="4.5" fill="#DB2777"/>
  <text x="138" y="535" font-size="18.5" font-weight="600" fill="#111827">get_cancellation_eligibility</text>

  <text x="320" y="590" text-anchor="middle" font-size="15.5" fill="#6B7280">Six round trips and six failure points.</text>
  <text x="320" y="616" text-anchor="middle" font-size="15.5" fill="#94A3B8">Every result consumes the model context.</text>

  
  <rect x="640" y="126" width="560" height="514" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="664" y="156" font-size="16.5" font-weight="600" fill="#047857">One job-shaped call</text>
  <text x="1176" y="156" text-anchor="end" font-size="15.5" fill="#6B7280">one operation</text>

  
  <g fill="none" stroke-width="2.5">
    <path d="M920,222 V266" stroke="#059669" marker-end="url(#p25-em)"/>
  </g>

  <g filter="url(#p25-lift)">
    <rect x="680" y="174" width="480" height="48" rx="10" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <rect x="680" y="174" width="9" height="48" fill="#059669" clip-path="url(#p25-k7)"/>
  </g>
  <circle cx="714" cy="198" r="15" fill="#FFFFFF"/>
  <g transform="translate(705,189) scale(0.75)" fill="none" stroke="#059669" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="738" y="205" font-size="18.5" font-weight="600" fill="#111827">get_order_support_context</text>

  
  <rect x="712" y="266" width="416" height="238" rx="12" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="736" y="298" font-size="16.5" font-weight="600" fill="#047857">returns a compact typed result</text>

  <circle cx="744" cy="337" r="3.5" fill="#059669"/>
  <text x="764" y="342" font-size="15.5" fill="#475569">order summary</text>

  <circle cx="744" cy="377" r="3.5" fill="#059669"/>
  <text x="764" y="382" font-size="15.5" fill="#475569">latest shipment state</text>

  <circle cx="744" cy="417" r="3.5" fill="#059669"/>
  <text x="764" y="422" font-size="15.5" fill="#475569">recent meaningful events</text>

  <circle cx="744" cy="457" r="3.5" fill="#059669"/>
  <text x="764" y="462" font-size="15.5" fill="#475569">cancellation and return eligibility</text>

  <text x="920" y="534" text-anchor="middle" font-size="15.5" fill="#6B7280">Four fields of one response, not four calls.</text>

  <text x="920" y="590" text-anchor="middle" font-size="15.5" fill="#6B7280">One larger response.</text>
  <text x="920" y="616" text-anchor="middle" font-size="15.5" fill="#94A3B8">Stronger coupling to one product job.</text>

  
  <rect x="40" y="670" width="1160" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="712" text-anchor="middle" font-size="16" fill="#475569">Prefer the fewest operations that finish one agent job without returning unrelated data.</text>
  <text x="620" y="740" text-anchor="middle" font-size="16" fill="#475569">Merging unrelated jobs to reduce the tool count is not a resource boundary.</text>
</svg>