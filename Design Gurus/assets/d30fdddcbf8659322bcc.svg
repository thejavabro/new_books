<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="902" viewBox="0 0 1240 902" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Key entities for a code judging system: a user submits code in a chosen language against a problem, the submission runs in an isolated sandbox under time and memory limits, and a verdict is returned">
  <defs>
    <filter id="jdgk-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="jdgk-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="jdgk-k1"><rect x="40" y="310" width="190" height="90" rx="12"/></clipPath>
    <clipPath id="jdgk-k2"><rect x="330" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdgk-k3"><rect x="330" y="140" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdgk-k4"><rect x="330" y="480" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdgk-k5"><rect x="700" y="310" width="250" height="90" rx="12"/></clipPath>
    <clipPath id="jdgk-k6"><rect x="1010" y="310" width="190" height="90" rx="12"/></clipPath>
    <marker id="jdgk-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="jdgk-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="jdgk-m-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
    <marker id="jdgk-m-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
    <marker id="jdgk-m-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
    <marker id="jdgk-m-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    
  </defs>

  <rect x="0" y="0" width="1240" height="902" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">Code judging system: key entities and flow</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Every submission is untrusted code, so isolation is a correctness requirement, not a hardening step.</text>



  <g fill="none" stroke-width="2">
    <path d="M230,335 H330" stroke="#2563EB" marker-end="url(#jdgk-m-blue)"/>
    <path d="M555,310 V230" stroke="#D97706" marker-end="url(#jdgk-m-amber)"/>
    <path d="M598,480 V400" stroke="#64748B" marker-end="url(#jdgk-m-slate)"/>
    <path d="M580,335 H700" stroke="#4F46E5" marker-end="url(#jdgk-m-indigo)"/>
    <path d="M950,335 H1010" stroke="#DB2777" marker-end="url(#jdgk-m-pink)"/>
    <path d="M1190,400 V648 Q1190,660 1178,660 H32 Q20,660 20,648 V367 Q20,355 32,355 H40" stroke="#059669" stroke-width="2.5" marker-end="url(#jdgk-m-emerald)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="280" y="322" fill="#1D4ED8">submits</text>
    <text x="650" y="272" fill="#B45309">answers</text>
    <text x="650" y="445" fill="#475569">runs in</text>
    <text x="640" y="322" fill="#4338CA">executed</text>
    <text x="980" y="322" fill="#BE185D">judged</text>
    <text x="480" y="652" fill="#047857">verdict returned in seconds</text>
  </g>

  <g filter="url(#jdgk-soft)">
    <rect x="40" y="310" width="190" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="40" y="310" width="6" height="90" fill="#2563EB" clip-path="url(#jdgk-k1)"/>
  </g>
  <circle cx="78" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(67.56,344.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></g>
  <text x="104" y="362" font-size="21.5" font-weight="600" fill="#111827">User</text>
  <text x="135" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">authenticated</text>
  <text x="135" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">writes a solution</text>
  <g filter="url(#jdgk-lift)">
    <rect x="330" y="310" width="250" height="90" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <rect x="330" y="310" width="9" height="90" fill="#4F46E5" clip-path="url(#jdgk-k2)"/>
  </g>
  <circle cx="368" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,344.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></g>
  <text x="394" y="362" font-size="21.5" font-weight="600" fill="#111827">Submission</text>
  <text x="455" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">code, language, problem</text>
  <g filter="url(#jdgk-soft)">
    <rect x="330" y="140" width="250" height="90" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="330" y="140" width="6" height="90" fill="#D97706" clip-path="url(#jdgk-k3)"/>
  </g>
  <circle cx="368" cy="185" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,174.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2 2 0 0 1 6 3h13v16H6a2 2 0 0 0-2 2z"/><path d="M19 15.5H6"/></g>
  <text x="394" y="192" font-size="21.5" font-weight="600" fill="#111827">Problem</text>
  <text x="455" y="259" font-size="18.5" text-anchor="middle" fill="#6B7280">description and io spec</text>
  <text x="455" y="286" font-size="18.5" text-anchor="middle" fill="#94A3B8">test cases and limits</text>
  <g filter="url(#jdgk-soft)">
    <rect x="330" y="480" width="250" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="330" y="480" width="6" height="90" fill="#64748B" clip-path="url(#jdgk-k4)"/>
  </g>
  <circle cx="368" cy="525" r="18" fill="#FFFFFF"/>
  <g transform="translate(357.56,514.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="4.5" width="15" height="15" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 1.5v3M15 1.5v3M9 19.5v3M15 19.5v3M1.5 9h3M1.5 15h3M19.5 9h3M19.5 15h3"/></g>
  <text x="394" y="532" font-size="21.5" font-weight="600" fill="#111827">Runtime</text>
  <text x="455" y="599" font-size="18.5" text-anchor="middle" fill="#6B7280">Python, Java, C++, Go</text>
  <text x="455" y="626" font-size="18.5" text-anchor="middle" fill="#94A3B8">each with its own limits</text>
  <g filter="url(#jdgk-soft)">
    <rect x="700" y="310" width="250" height="90" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="700" y="310" width="6" height="90" fill="#DB2777" clip-path="url(#jdgk-k5)"/>
  </g>
  <circle cx="738" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(727.56,344.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/></g>
  <text x="764" y="362" font-size="21.5" font-weight="600" fill="#111827">Sandbox</text>
  <text x="825" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">isolated, no network</text>
  <text x="825" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">killed at the time limit</text>
  <g filter="url(#jdgk-soft)">
    <rect x="1010" y="310" width="190" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="1010" y="310" width="6" height="90" fill="#059669" clip-path="url(#jdgk-k6)"/>
  </g>
  <circle cx="1048" cy="355" r="18" fill="#FFFFFF"/>
  <g transform="translate(1037.56,344.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.2 12.3l2.6 2.6 5-5.4"/></g>
  <text x="1074" y="362" font-size="21.5" font-weight="600" fill="#111827">Verdict</text>
  <text x="1105" y="429" font-size="18.5" text-anchor="middle" fill="#6B7280">pass or fail</text>
  <text x="1105" y="456" font-size="18.5" text-anchor="middle" fill="#94A3B8">time and memory</text>

  <rect x="40" y="700" width="1160" height="196" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <rect x="64" y="725" width="230" height="38" rx="10" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="179" y="750" text-anchor="middle" font-size="18.5" font-weight="600" fill="#B45309">Test case</text>
  <text x="323" y="750" font-size="18.5" fill="#475569">an input paired with its expected output; the visible ones are a subset of the hidden set</text>
  <rect x="64" y="775" width="230" height="38" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.2"/>
  <text x="179" y="800" text-anchor="middle" font-size="18.5" font-weight="600" fill="#BE185D">Isolation</text>
  <text x="323" y="800" font-size="18.5" fill="#475569">no network, no shared filesystem, hard time and memory caps, because the code belongs to a stranger</text>
  <rect x="64" y="825" width="230" height="38" rx="10" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="179" y="850" text-anchor="middle" font-size="18.5" font-weight="600" fill="#475569">Queue</text>
  <text x="323" y="850" font-size="18.5" fill="#475569">submissions arrive in bursts and judging is slow, so the two are decoupled by a queue</text>
</svg>