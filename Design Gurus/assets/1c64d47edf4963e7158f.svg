<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="trap-title trap-desc">
<title id="trap-title">The trap in the brief</title>
<desc id="trap-desc">The brief contains no scale requirement, and the three numbers it does contain are the binding constraints on the design.</desc>
<defs>
<marker id="trap-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="trap-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="trap-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="trap-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="720" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The trap in the brief</text>
<text x="40" y="86" font-size="21" fill="#4A5568">The brief contains no scale requirement.</text>
<rect x="40" y="642" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="642" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="104" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="104" rx="2.5" fill="#F28B9D"/><text x="64" y="150" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Nothing in the brief asks for scale</text><text x="64" y="176" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">No users, no traffic figures, no growth targets. An answer that opens with</text><text x="64" y="202" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">sharding has answered a different question.</text>
<text x="40" y="256" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">The three numbers that are in the brief</text>
<rect x="40" y="274" width="360" height="60" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="220" y="310" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">five engineers</text>
<path d="M406 304H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 304H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-slate)"/>
<rect x="450" y="274" width="750" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="297.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">the constraint. It bounds how many systems can be operated and how much</text><text x="470" y="322.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">surface anybody can hold</text>
<rect x="40" y="342" width="360" height="60" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="220" y="378" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">two years</text>
<path d="M406 372H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 372H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-slate)"/>
<rect x="450" y="342" width="750" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="365.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">long enough that the first design will be wrong, short enough that a</text><text x="470" y="390.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rewrite is not available</text>
<rect x="40" y="410" width="360" height="60" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="220" y="446" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">no paying customers</text>
<path d="M406 440H440" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M406 440H440" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#trap-marker-slate)"/>
<rect x="450" y="410" width="750" height="60" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="470" y="433.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so the primary risk is building the wrong thing,</text><text x="470" y="458.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">not building it too small</text>
<rect x="40" y="504" width="560" height="112" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="504" width="5" height="112" rx="2.5" fill="#AC8BE8"/><text x="64" y="540" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">The failure to avoid</text><text x="64" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">spending the two years on the architecture</text><text x="64" y="592" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">rather than on finding out what to build</text>
<rect x="640" y="504" width="560" height="112" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="504" width="5" height="112" rx="2.5" fill="#5EC9EC"/><text x="664" y="540" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">And its opposite, which is real</text><text x="664" y="566" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a design that cannot change is as fatal</text><text x="664" y="592" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">as one that is over-built</text>
<text x="66" y="676" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">A small number of decisions are genuinely expensive to reverse, and they deserve the care.</text>
</svg>