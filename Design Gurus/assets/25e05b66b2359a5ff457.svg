<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Incoming bandwidth is write QPS times object size, outgoing is read QPS times object size, and the read heavy side is usually far larger">
  <rect x="0" y="0" width="1240" height="370" fill="#FFFFFF"/>
  <defs>
    <marker id="be8-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <filter id="be8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <line x1="340" y1="160" x2="512" y2="160" stroke="#3B82F6" stroke-width="4" marker-end="url(#be8-blue)"/>
  <polygon points="820,140 884,140 884,124 932,160 884,196 884,180 820,180" fill="#059669"/>

  <g filter="url(#be8-soft)">
    <rect x="40" y="110" width="300" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="520" y="100" width="300" height="120" rx="12" fill="#F1F5F9" stroke="#475569" stroke-width="2"/>
    <rect x="940" y="90" width="270" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>

  <text x="190" y="152" font-size="20" font-weight="700" fill="#1E3A8A" text-anchor="middle">Uploads</text>
  <text x="190" y="185" font-size="20" fill="#3B82F6" text-anchor="middle">100 a second</text>

  <text x="670" y="147" font-size="20" font-weight="700" fill="#0F172A" text-anchor="middle">Photo service</text>
  <text x="670" y="183" font-size="20" fill="#475569" text-anchor="middle">the origin</text>

  <text x="1075" y="136" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">Downloads</text>
  <text x="1075" y="169" font-size="20" fill="#059669" text-anchor="middle">10,000 a second</text>
  <text x="1075" y="202" font-size="20" font-weight="700" fill="#065F46" text-anchor="middle">5 GB a second</text>

  <text x="428" y="136" font-size="20" font-weight="600" fill="#1E3A8A" text-anchor="middle" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">50 MB a second</text>

  <text x="620" y="300" font-size="20" fill="#475569" text-anchor="middle">The two directions differ by the read to write ratio</text>
  <text x="620" y="332" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">and the outgoing number is what forces a CDN</text>
</svg>