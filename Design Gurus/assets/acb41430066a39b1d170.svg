<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="628" viewBox="0 0 1240 628" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Three states of an error budget, healthy, low and exhausted, and what each state permits the team to release">
  <rect x="0" y="0" width="1240" height="628" fill="#FFFFFF"/>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The release policy is decided before the incident, not during it</text>

  
  <rect x="50" y="100" width="360" height="340" rx="12" fill="#FFFFFF" stroke="#059669" stroke-width="2"/>
  <circle cx="230" cy="158" r="38" fill="#059669"/>
  <text x="230" y="232" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Healthy</text>
  <text x="70" y="280" font-size="20" font-weight="600" fill="#475569">Budget left</text>
  <text x="70" y="310" font-size="20" fill="#0F172A">more than half</text>
  <text x="70" y="356" font-size="20" font-weight="600" fill="#475569">What you ship</text>
  <text x="70" y="386" font-size="20" fill="#0F172A">Anything. Ship features, run</text>
  <text x="70" y="412" font-size="20" fill="#0F172A">experiments, take risks.</text>

  
  <rect x="440" y="100" width="360" height="340" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/>
  <circle cx="620" cy="158" r="38" fill="#D97706"/>
  <text x="620" y="232" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">Low</text>
  <text x="460" y="280" font-size="20" font-weight="600" fill="#475569">Budget left</text>
  <text x="460" y="310" font-size="20" fill="#0F172A">under a quarter</text>
  <text x="460" y="356" font-size="20" font-weight="600" fill="#475569">What you ship</text>
  <text x="460" y="386" font-size="20" fill="#0F172A">Low-risk changes only. Risky</text>
  <text x="460" y="412" font-size="20" fill="#0F172A">releases wait for the reset.</text>

  
  <rect x="830" y="100" width="360" height="340" rx="12" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
  <circle cx="1010" cy="158" r="38" fill="#DC2626"/>
  <text x="1010" y="232" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">Exhausted</text>
  <text x="850" y="280" font-size="20" font-weight="600" fill="#475569">Budget left</text>
  <text x="850" y="310" font-size="20" fill="#0F172A">none</text>
  <text x="850" y="356" font-size="20" font-weight="600" fill="#475569">What you ship</text>
  <text x="850" y="386" font-size="20" fill="#0F172A">Reliability work only, until</text>
  <text x="850" y="412" font-size="20" fill="#0F172A">the next budget period.</text>

  
  <rect x="50" y="506" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="542" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The budget turns an argument about whether to ship into arithmetic both sides already agreed to.</text>
  <text x="620" y="572" font-size="20" fill="#334155" text-anchor="middle">That is the real value. Nobody negotiates the policy while the site is on fire.</text>
</svg>