<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1190" viewBox="0 0 1240 1190" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The typeahead data model: a trie node with children, counts, and a precomputed top 10 list of references to terminal nodes, the sampled query log and term frequency rows that update it offline, and the snapshot file used to rebuild it">
<defs>
<filter id="ta1-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
<filter id="ta1-lift" x="-14%" y="-16%" width="128%" height="145%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/></filter>
<marker id="ta1-mbl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="ta1-mind" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="ta1-mem" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="ta1-mamb" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="ta1-msl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<clipPath id="ta1-k1"><rect x="90" y="115" width="460" height="250" rx="12"/></clipPath>
<clipPath id="ta1-k2"><rect x="720" y="150" width="420" height="142" rx="12"/></clipPath>
<clipPath id="ta1-k3"><rect x="90" y="550" width="440" height="142" rx="12"/></clipPath>
<clipPath id="ta1-k4"><rect x="720" y="550" width="440" height="142" rx="12"/></clipPath>
</defs>
<rect x="0" y="0" width="1240" height="1190" fill="#FFFFFF"/>
<rect x="40" y="50" width="1160" height="390" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/><text x="64" y="80" font-size="16.5" font-weight="600" fill="#1D4ED8">Trie server memory, the read path</text><rect x="40" y="480" width="1160" height="500" rx="14" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/><text x="64" y="510" font-size="16.5" font-weight="600" fill="#B45309">The update path, on disk</text><path d="M 550,297 H 640 Q 652,297 652,285 V 236 Q 652,224 664,224 H 717" fill="none" stroke="#2563EB" stroke-width="2.5" marker-end="url(#ta1-mbl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="652" y="253" fill="#1D4ED8">each node keeps</text><text x="652" y="275" fill="#1D4ED8">ten of these</text></g><path d="M 930,147 V 112 Q 930,100 918,100 H 332 Q 320,100 320,104 V 112" fill="none" stroke="#4F46E5" stroke-width="2" marker-end="url(#ta1-mind)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="625" y="92" fill="#4338CA">points to a terminal node</text></g><path d="M 530,624 H 717" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ta1-mem)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="623" y="571" fill="#047857">an offline job</text><text x="623" y="593" fill="#047857">counts terms hourly</text></g><path d="M 940,547 V 480 Q 940,468 928,468 H 172 Q 160,468 160,456 V 368" fill="none" stroke="#D97706" stroke-width="2" marker-end="url(#ta1-mamb)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="560" y="457" fill="#B45309">applied to the trie at the offline update</text></g><path d="M 550,340 H 1173 Q 1185,340 1185,352 V 828 Q 1185,840 1173,840 H 793" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#ta1-msl)"/><g font-size="15.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5"><text x="985" y="800" fill="#475569">written level by level, periodically</text><text x="985" y="822" fill="#475569">a restarted server rebuilds from it</text></g><g filter="url(#ta1-lift)">
<rect x="90" y="115" width="460" height="250" rx="12" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
<rect x="90" y="115" width="9" height="250" fill="#2563EB" clip-path="url(#ta1-k1)"/>
</g>
<circle cx="128" cy="143" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,132.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="5" r="2.2"/><circle cx="7" cy="19" r="2.2"/><circle cx="17" cy="12" r="2.2"/><path d="M7 7.2v9.6M9.2 12H14.8"/></g>
<text x="154" y="150" font-size="18.5" font-weight="600" fill="#111827">Trie node (one per prefix)</text><text x="114" y="196" font-size="15.5" fill="#111827">Prefix, the key</text><text x="526" y="196" font-size="15.5" text-anchor="end" fill="#6B7280">spelled by the path from the root</text><line x1="104" y1="207" x2="536" y2="207" stroke="#93C5FD" stroke-width="1"/><text x="114" y="232" font-size="15.5" fill="#111827">Characters</text><text x="526" y="232" font-size="15.5" text-anchor="end" fill="#6B7280">one or more per node</text><line x1="104" y1="243" x2="536" y2="243" stroke="#93C5FD" stroke-width="1"/><text x="114" y="268" font-size="15.5" fill="#111827">Children</text><text x="526" y="268" font-size="15.5" text-anchor="end" fill="#6B7280">references to child nodes</text><line x1="104" y1="279" x2="536" y2="279" stroke="#93C5FD" stroke-width="1"/><text x="114" y="304" font-size="15.5" fill="#111827">Top10List</text><text x="526" y="304" font-size="15.5" text-anchor="end" fill="#6B7280">ten entries, precomputed</text><line x1="104" y1="315" x2="536" y2="315" stroke="#93C5FD" stroke-width="1"/><text x="114" y="340" font-size="15.5" fill="#111827">Count</text><text x="526" y="340" font-size="15.5" text-anchor="end" fill="#6B7280">searches that ended at this node</text><text x="320" y="390" font-size="15.5" text-anchor="middle" fill="#6B7280">the whole trie stays in memory</text><g filter="url(#ta1-soft)">
<rect x="720" y="150" width="420" height="142" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
<rect x="720" y="150" width="6" height="142" fill="#4F46E5" clip-path="url(#ta1-k2)"/>
</g>
<circle cx="758" cy="178" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,167.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/></g>
<text x="784" y="185" font-size="18.5" font-weight="600" fill="#111827">Top 10 entry (ten per node)</text><text x="744" y="231" font-size="15.5" fill="#111827">TerminalNodeRef</text><text x="1116" y="231" font-size="15.5" text-anchor="end" fill="#6B7280">the node where the term ends</text><line x1="734" y1="242" x2="1126" y2="242" stroke="#A5B4FC" stroke-width="1"/><text x="744" y="267" font-size="15.5" fill="#111827">Frequency</text><text x="1116" y="267" font-size="15.5" text-anchor="end" fill="#6B7280">how often it is searched</text><text x="930" y="317" font-size="15.5" text-anchor="middle" fill="#6B7280">a reference, not the full phrase</text><g filter="url(#ta1-soft)">
<rect x="90" y="550" width="440" height="142" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<rect x="90" y="550" width="6" height="142" fill="#059669" clip-path="url(#ta1-k3)"/>
</g>
<circle cx="128" cy="578" r="18" fill="#FFFFFF"/>
<g transform="translate(117.56,567.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></g>
<text x="154" y="585" font-size="18.5" font-weight="600" fill="#111827">Query log entry (sampled)</text><text x="114" y="631" font-size="15.5" fill="#111827">Term</text><text x="506" y="631" font-size="15.5" text-anchor="end" fill="#6B7280">the raw query, about 30 bytes</text><line x1="104" y1="642" x2="516" y2="642" stroke="#6EE7B7" stroke-width="1"/><text x="114" y="667" font-size="15.5" fill="#111827">Frequency</text><text x="506" y="667" font-size="15.5" text-anchor="end" fill="#6B7280">logged with the term</text><text x="310" y="717" font-size="15.5" text-anchor="middle" fill="#6B7280">only a sample of queries is logged</text><g filter="url(#ta1-soft)">
<rect x="720" y="550" width="440" height="142" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
<rect x="720" y="550" width="6" height="142" fill="#D97706" clip-path="url(#ta1-k4)"/>
</g>
<circle cx="758" cy="578" r="18" fill="#FFFFFF"/>
<g transform="translate(747.56,567.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/><path d="M3 12l9 4.5 9-4.5"/><path d="M3 16.5l9 4.5 9-4.5"/></g>
<text x="784" y="585" font-size="18.5" font-weight="600" fill="#111827">Term frequency (one per term)</text><text x="744" y="631" font-size="15.5" fill="#111827">Term</text><text x="1136" y="631" font-size="15.5" text-anchor="end" fill="#6B7280">each distinct term, once</text><line x1="734" y1="642" x2="1146" y2="642" stroke="#FCD34D" stroke-width="1"/><text x="744" y="667" font-size="15.5" fill="#111827">Frequency</text><text x="1136" y="667" font-size="15.5" text-anchor="end" fill="#6B7280">searches in the past hour</text><text x="940" y="717" font-size="15.5" text-anchor="middle" fill="#6B7280">built from the log by an offline job</text><g stroke="#64748B" stroke-width="1.5">
<path d="M 450,790 L 450,874 A 170,16 0 0 0 790,874 L 790,790" fill="#E2E8F0"/>
<ellipse cx="620" cy="790" rx="170" ry="16" fill="#F8FAFC"/>
</g>
<text x="620" y="854" text-anchor="middle" font-size="18.5" font-weight="600" fill="#111827">Snapshot file</text><text x="620" y="915" font-size="15.5" text-anchor="middle" fill="#6B7280">characters and child counts, level by level</text><text x="620" y="938" font-size="15.5" text-anchor="middle" fill="#94A3B8">top 10 lists are rebuilt, not stored</text><rect x="40" y="1020" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/><rect x="64" y="1046" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/><text x="164" y="1068" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">All reads hit memory</text><text x="288" y="1068" font-size="15.5" fill="#475569">the whole 25 GB index lives in trie server memory; a disk lookup cannot meet the 200 ms budget</text><rect x="64" y="1090" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/><text x="164" y="1112" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">Updates live on disk</text><text x="288" y="1112" font-size="15.5" fill="#475569">the query log, the term frequencies, and the snapshot support updates and restarts, never a live read</text>
</svg>