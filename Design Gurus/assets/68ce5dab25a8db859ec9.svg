<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="892" viewBox="0 0 1240 892" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="sync-title sync-desc">
<title id="sync-title">The problem both options share</title>
<desc id="sync-desc">Four cases cause nearly all the pain, and treating the index as derived data that can be rebuilt from source converts them from incidents into scheduled jobs.</desc>
<defs>
<marker id="sync-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="sync-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="sync-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="sync-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="892" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">The problem both options share</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four cases cause nearly all of the pain.</text>
<rect x="40" y="814" width="1160" height="52" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="814" width="5" height="52" rx="2.5" fill="#5EC9EC"/>
<rect x="40" y="118" width="1160" height="70" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="118" width="5" height="70" rx="2.5" fill="#F28B9D"/><text x="64" y="159" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">The hard part is not search. It is keeping the index consistent with the truth</text>
<rect x="40" y="206" width="560" height="96" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="206" width="5" height="96" rx="2.5" fill="#5EC9EC"/><text x="64" y="247" font-size="22" font-weight="700" fill="#155B9E" text-anchor="start">A document changes</text><text x="64" y="273" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">old chunks are now wrong and must be replaced</text>
<rect x="640" y="206" width="560" height="96" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="206" width="5" height="96" rx="2.5" fill="#F28B9D"/><text x="664" y="234" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">A document is deleted</text><text x="664" y="260" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a missed deletion is a correctness and possibly</text><text x="664" y="286" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a compliance problem</text>
<rect x="40" y="314" width="560" height="96" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="314" width="5" height="96" rx="2.5" fill="#F3CF6A"/><text x="64" y="342" font-size="22" font-weight="700" fill="#91642E" text-anchor="start">Embeddings need regenerating</text><text x="64" y="368" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">a model or chunking change means</text><text x="64" y="394" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">re-embedding everything</text>
<rect x="640" y="314" width="560" height="96" rx="12" fill="#F0EAFE" stroke="#AC8BE8" stroke-opacity="0.8" stroke-width="1.4"/><rect x="640" y="314" width="5" height="96" rx="2.5" fill="#AC8BE8"/><text x="664" y="342" font-size="22" font-weight="700" fill="#6040A8" text-anchor="start">Ingest fails partway</text><text x="664" y="368" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">some chunks indexed, some not,</text><text x="664" y="394" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">in a state nobody intended</text>
<text x="40" y="450" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Treat the index as derived data</text>
<rect x="40" y="468" width="480" height="52" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="280" y="500" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">The document store is the truth</text>
<path d="M526 494H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 494H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="468" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="500" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">never the index</text>
<rect x="40" y="528" width="480" height="52" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="280" y="560" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Records carry a source id and version</text>
<path d="M526 554H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 554H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="528" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="560" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">so stale entries are identifiable, not merely wrong</text>
<rect x="40" y="588" width="480" height="52" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="280" y="620" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Rebuild from source is rehearsed</text>
<path d="M526 614H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 614H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="588" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="620" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">which turns the four cases into scheduled jobs</text>
<rect x="40" y="648" width="480" height="52" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="280" y="680" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Deletions travel the same path</text>
<path d="M526 674H560" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M526 674H560" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#sync-marker-slate)"/>
<rect x="570" y="648" width="630" height="52" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="590" y="680" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">monitored for lag, which is consumer lag by another name</text>
<rect x="40" y="726" width="1160" height="62" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="726" width="5" height="62" rx="2.5" fill="#39D5AA"/><text x="64" y="763" font-size="20" font-weight="700" fill="#169B77" text-anchor="start">In the relational option, most of this collapses into a transaction and a foreign key.</text>
<text x="66" y="848" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Which is the strongest practical argument for starting there.</text>
</svg>