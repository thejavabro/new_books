<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="732" viewBox="0 0 1240 732" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Require an idempotency key only when all three statements are true: the operation is not already idempotent, the caller may reasonably retry after an uncertain outcome, and duplicate execution would cost something meaningful.">
  <defs>
    <marker id="p11-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>

    <filter id="p11-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>

    <clipPath id="p11-k1"><rect x="290" y="96" width="660" height="90" rx="12"/></clipPath>
    <clipPath id="p11-k2"><rect x="290" y="270" width="660" height="90" rx="12"/></clipPath>
    <clipPath id="p11-k3"><rect x="290" y="444" width="660" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="732" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="548" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#1D4ED8">Require a key only when all three are true</text>
  <text x="1176" y="70" text-anchor="end" font-size="15.5" fill="#6B7280">three tests, all three must hold</text>

  
  <g fill="none" stroke="#64748B" stroke-width="2">
    <path d="M620,228 V270" marker-end="url(#p11-sl)"/>
    <path d="M620,402 V444" marker-end="url(#p11-sl)"/>
  </g>
  <g font-size="15.5" font-weight="600" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="638" y="255" fill="#475569">and</text>
    <text x="638" y="429" fill="#475569">and</text>
  </g>

  
  <g filter="url(#p11-soft)">
    <rect x="290" y="96" width="660" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="290" y="96" width="6" height="90" fill="#2563EB" clip-path="url(#p11-k1)"/>
  </g>
  <circle cx="328" cy="141" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,130.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="354" y="148" font-size="18.5" font-weight="600" fill="#111827">1. It is not idempotent by its existing semantics</text>
  <text x="620" y="211" text-anchor="middle" font-size="15.5" fill="#6B7280">A GET, a PUT, or a DELETE already promises a final state</text>

  
  <g filter="url(#p11-soft)">
    <rect x="290" y="270" width="660" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="290" y="270" width="6" height="90" fill="#2563EB" clip-path="url(#p11-k2)"/>
  </g>
  <circle cx="328" cy="315" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,304.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="354" y="322" font-size="18.5" font-weight="600" fill="#111827">2. The caller may retry after an uncertain outcome</text>
  <text x="620" y="385" text-anchor="middle" font-size="15.5" fill="#6B7280">A timeout gives the caller no way to know what happened</text>

  
  <g filter="url(#p11-soft)">
    <rect x="290" y="444" width="660" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="290" y="444" width="6" height="90" fill="#2563EB" clip-path="url(#p11-k3)"/>
  </g>
  <circle cx="328" cy="489" r="18" fill="#FFFFFF"/>
  <g transform="translate(317.56,478.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="354" y="496" font-size="18.5" font-weight="600" fill="#111827">3. Duplicate execution would cost something meaningful</text>
  <text x="620" y="559" text-anchor="middle" font-size="15.5" fill="#6B7280">Money moved, a message sent, a job billed, an order placed</text>

  
  <rect x="40" y="616" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="661" text-anchor="middle" font-size="16" fill="#475569">Requiring meaningless keys adds state, documentation, and caller work, and prevents no real duplicate.</text>
</svg>