<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="650" viewBox="0 0 1240 650" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="checks-title checks-desc">
<title id="checks-title">Four checks that catch real errors</title>
<desc id="checks-desc">Make the units cancel, ask whether the answer is a lot, compare against a system you already know, and derive the result twice. Estimation errors are usually factors of a thousand caused by a unit slip, and these four checks catch nearly all of them.</desc>
<defs>
<marker id="checks-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="checks-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="checks-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="checks-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="650" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Four checks that catch real errors</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Four checks catch nearly all of them, and they take seconds.</text>
<rect x="40" y="572" width="1160" height="52" rx="12" fill="#E8FCF3" stroke="#39D5AA" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="572" width="5" height="52" rx="2.5" fill="#39D5AA"/>
<circle cx="60" cy="150" r="20" fill="#2F86D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="157" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="90" y="118" width="470" height="64" rx="10" fill="#E7F7FE" stroke="#5EC9EC" stroke-width="2"/><text x="325" y="156" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Make the units cancel</text>
<path d="M566 150H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 150H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#checks-marker-slate)"/>
<rect x="610" y="118" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="143.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">requests/sec x bytes/request gives bytes/sec, and an</text><text x="630" y="168.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">answer in bytes means something slipped</text>
<circle cx="60" cy="226" r="20" fill="#1BA97E" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="233" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="90" y="194" width="470" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="325" y="232" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Ask whether it is a lot</text>
<path d="M566 226H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 226H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#checks-marker-slate)"/>
<rect x="610" y="194" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="219.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">one laptop or a thousand racks? a number you cannot</text><text x="630" y="244.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">picture cannot be checked</text>
<circle cx="60" cy="302" r="20" fill="#E09B2D" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="309" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="90" y="270" width="470" height="64" rx="10" fill="#FFF6DF" stroke="#F3CF6A" stroke-width="2"/><text x="325" y="308" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Compare to a known system</text>
<path d="M566 302H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 302H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#checks-marker-slate)"/>
<rect x="610" y="270" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="295.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">more storage than a service with a hundred times the</text><text x="630" y="320.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">users means the estimate is wrong</text>
<circle cx="60" cy="378" r="20" fill="#7650D6" stroke="#FFFFFF" stroke-opacity="0.35"/><text x="60" y="385" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="90" y="346" width="470" height="64" rx="10" fill="#F0EAFE" stroke="#AC8BE8" stroke-width="2"/><text x="325" y="384" font-size="20" font-weight="700" fill="#080C50" text-anchor="middle">Derive it twice</text>
<path d="M566 378H600" fill="none" stroke="#284E65" stroke-opacity="0.16" stroke-width="11" stroke-linecap="round"/><path d="M566 378H600" fill="none" stroke="#284E65" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#checks-marker-slate)"/>
<rect x="610" y="346" width="590" height="64" rx="10" fill="#FFFFFF" stroke="#D5E3EF" stroke-width="1.6"/><text x="630" y="371.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">work backwards from the result to one input; a silent</text><text x="630" y="396.5" font-size="19" font-weight="400" fill="#4A5568" text-anchor="start">factor of a thousand rarely survives</text>
<rect x="40" y="434" width="1160" height="112" rx="12" fill="#FFF0F0" stroke="#F28B9D" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="434" width="5" height="112" rx="2.5" fill="#F28B9D"/><text x="64" y="469" font-size="22" font-weight="700" fill="#A83147" text-anchor="start">Estimation errors are rarely small.</text><text x="64" y="496" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">They are factors of a thousand, caused by a unit slip,</text><text x="64" y="523" font-size="20" font-weight="700" fill="#A83147" text-anchor="start">and all four of these checks take seconds.</text>
<text x="66" y="606" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">Do them out loud. An interviewer cannot see you check your work silently, and a colleague cannot either.</text>
</svg>