<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="608" viewBox="0 0 1240 608" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Active-passive failover spends time detecting the failure, promoting the standby, repointing traffic and warming caches, while active-active only sheds the requests already in flight on the lost site">
  <rect x="0" y="0" width="1240" height="608" fill="#FFFFFF"/>
  <defs>
    <marker id="rl4-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The same site failure, and how long users notice it</text>

  <line x1="250" y1="100" x2="250" y2="400" stroke="#DC2626" stroke-width="2.5" stroke-dasharray="7 5"/>
  <text x="250" y="90" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">the site fails</text>

  <text x="230" y="176" font-size="20" font-weight="600" fill="#92400E" text-anchor="end">Active-passive</text>
  <rect x="250" y="150" width="180" height="50" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="340" y="182" font-size="20" fill="#B91C1C" text-anchor="middle">detect</text>
  <rect x="430" y="150" width="220" height="50" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="540" y="182" font-size="20" fill="#B91C1C" text-anchor="middle">promote standby</text>
  <rect x="650" y="150" width="180" height="50" rx="6" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="740" y="182" font-size="20" fill="#B91C1C" text-anchor="middle">repoint DNS</text>
  <rect x="830" y="150" width="200" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="930" y="182" font-size="20" fill="#92400E" text-anchor="middle">warm caches</text>
  <rect x="1030" y="150" width="130" height="50" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1095" y="182" font-size="20" fill="#065F46" text-anchor="middle">back</text>
  <text x="640" y="234" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">minutes of degraded or absent service, and only the last step is optional</text>

  <text x="230" y="316" font-size="20" font-weight="600" fill="#065F46" text-anchor="end">Active-active</text>
  <rect x="250" y="290" width="90" height="50" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
  <text x="295" y="322" font-size="20" fill="#92400E" text-anchor="middle">drain</text>
  <rect x="340" y="290" width="820" height="50" rx="6" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  <text x="750" y="322" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the other site was already serving, so it just serves more</text>
  <text x="640" y="374" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">only the requests in flight on the lost site are affected</text>

  <line x1="250" y1="410" x2="1170" y2="410" stroke="#475569" stroke-width="2" marker-end="url(#rl4-slate)"/>

  <rect x="50" y="452" width="1140" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="488" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Active-active has no failover step, because there is nothing to fail over to. It is already running.</text>
  <text x="620" y="518" font-size="20" fill="#334155" text-anchor="middle">That is what the extra consistency work buys you, and the only honest reason to pay for it.</text>
</svg>