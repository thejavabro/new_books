<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="782" viewBox="0 0 1240 782" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The four states of an idempotency key record: new, in progress where a concurrent duplicate is answered with 409 Conflict, completed where a retry replays the stored response, and expired after twenty four hours">
  <rect x="0" y="0" width="1240" height="782" fill="#FFFFFF"/>
  <defs>
    <marker id="ap8-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#475569"/></marker>
    <marker id="ap8-red" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="ap8-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <filter id="ap8-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>

  <text x="620" y="44" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">An idempotency key is a small record with a state, and every state has an answer</text>

  
  <line x1="305" y1="200" x2="465" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ap8-slate)"/>
  <text x="385" y="156" font-size="20" fill="#334155" text-anchor="middle">the first request</text>
  <text x="385" y="182" font-size="20" fill="#334155" text-anchor="middle">reserves the key</text>

  <line x1="735" y1="200" x2="895" y2="200" stroke="#475569" stroke-width="2" marker-end="url(#ap8-slate)"/>
  <text x="815" y="156" font-size="20" fill="#334155" text-anchor="middle">the work finishes</text>
  <text x="815" y="182" font-size="20" fill="#334155" text-anchor="middle">and is recorded</text>

  <line x1="600" y1="240" x2="600" y2="324" stroke="#DC2626" stroke-width="2" marker-end="url(#ap8-red)"/>
  <line x1="1030" y1="240" x2="1030" y2="324" stroke="#059669" stroke-width="2" marker-end="url(#ap8-emerald)"/>

  <path d="M1160 200 H1190 V620 H170 V584" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ap8-slate)"/>
  <text x="680" y="606" font-size="20" fill="#334155" text-anchor="middle">24 hours later the record is purged</text>

  <line x1="170" y1="476" x2="170" y2="244" stroke="#475569" stroke-width="2" marker-end="url(#ap8-slate)"/>
  <text x="190" y="360" font-size="20" fill="#334155">the key looks new again</text>

  
  <g filter="url(#ap8-soft)">
    <rect x="40" y="140" width="260" height="100" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/>
    <rect x="470" y="140" width="260" height="100" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/>
    <rect x="900" y="140" width="260" height="100" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="170" y="178" font-size="20" font-weight="600" fill="#1E40AF" text-anchor="middle">New</text>
  <text x="170" y="210" font-size="20" fill="#1E40AF" text-anchor="middle">no record for this key</text>
  <text x="600" y="178" font-size="20" font-weight="600" fill="#92400E" text-anchor="middle">In progress</text>
  <text x="600" y="210" font-size="20" fill="#92400E" text-anchor="middle">the charge is running</text>
  <text x="1030" y="178" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">Completed</text>
  <text x="1030" y="210" font-size="20" fill="#065F46" text-anchor="middle">the response is stored</text>

  
  <text x="815" y="300" font-size="20" font-weight="600" fill="#475569" text-anchor="middle">what a retry meets in each state</text>
  <rect x="440" y="330" width="320" height="110" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  <text x="600" y="366" font-size="20" font-weight="600" fill="#B91C1C" text-anchor="middle">a duplicate arrives while</text>
  <text x="600" y="392" font-size="20" fill="#B91C1C" text-anchor="middle">the first is still running</text>
  <text x="600" y="418" font-size="20" fill="#B91C1C" text-anchor="middle">409 Conflict, ask it to wait</text>

  <rect x="890" y="330" width="280" height="110" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="1030" y="366" font-size="20" font-weight="600" fill="#065F46" text-anchor="middle">the same key arrives again</text>
  <text x="1030" y="392" font-size="20" fill="#065F46" text-anchor="middle">replay the stored response</text>
  <text x="1030" y="418" font-size="20" fill="#065F46" text-anchor="middle">no second charge</text>

  
  <g filter="url(#ap8-soft)">
    <rect x="40" y="480" width="260" height="100" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="2"/>
  </g>
  <text x="170" y="518" font-size="20" font-weight="600" fill="#334155" text-anchor="middle">Expired</text>
  <text x="170" y="550" font-size="20" fill="#334155" text-anchor="middle">purged after 24 hours</text>

  
  <rect x="40" y="660" width="1160" height="92" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="620" y="696" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The key is not a flag. It is a small record with a state, and every state has a defined answer.</text>
  <text x="620" y="726" font-size="20" fill="#334155" text-anchor="middle">Get the in-progress case wrong and two concurrent retries both charge the card.</text>
</svg>