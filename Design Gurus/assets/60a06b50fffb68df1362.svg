<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1050" viewBox="0 0 1240 1050" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Flowchart. A request arrives carrying an idempotency key, the server checks whether the key is already recorded in the processed keys store, a recorded key returns the stored result and runs nothing, and an unseen key does the work and records the key in one transaction before returning the fresh result.">
  <defs>
    <marker id="m04-l04-idempotency-key-path-bl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/>
    </marker>
    <marker id="m04-l04-idempotency-key-path-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m04-l04-idempotency-key-path-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <filter id="m04-l04-idempotency-key-path-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1050" fill="#FFFFFF"/>

  <rect x="50" y="60" width="330" height="140" rx="14" fill="#F8FAFC" fill-opacity="0.6" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="215" y="105" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Stripe requires an</text>
  <text x="215" y="137" text-anchor="middle" font-size="20" font-weight="600" fill="#334155">Idempotency-Key header</text>
  <text x="215" y="172" text-anchor="middle" font-size="20" fill="#64748B">for exactly this reason</text>

  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <rect x="50" y="250" width="310" height="140" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="205" y="295" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Request arrives with</text>
  <text x="205" y="327" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">an idempotency key</text>
  <text x="205" y="359" text-anchor="middle" font-size="20" fill="#64748B">one key per logical action</text>
  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <path d="M610,232 L800,320 L610,408 L420,320 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="610" y="311" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Key already</text>
  <text x="610" y="343" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">recorded?</text>
  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <rect x="830" y="90" width="360" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1010" y="135" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Return the stored result,</text>
  <text x="1010" y="167" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">run nothing</text>
  <text x="1010" y="199" text-anchor="middle" font-size="20" fill="#64748B">no second charge, no new effects</text>
  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <rect x="830" y="470" width="360" height="140" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="1010" y="515" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do the work and record</text>
  <text x="1010" y="547" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">the key together</text>
  <text x="1010" y="579" text-anchor="middle" font-size="20" fill="#64748B">one transaction, no crash window</text>
  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <rect x="830" y="690" width="360" height="130" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="1010" y="746" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Return the fresh result</text>
  <text x="1010" y="778" text-anchor="middle" font-size="20" fill="#64748B">the work ran exactly once</text>
  <g filter="url(#m04-l04-idempotency-key-path-soft)">
    <path d="M60,580 L60,730 A180,20 0 0 0 420,730 L420,580" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
    <ellipse cx="240" cy="580" rx="180" ry="20" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="240" y="632" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Processed keys store</text>
  <text x="240" y="662" text-anchor="middle" font-size="20" fill="#64748B">key to stored result</text>
  <text x="240" y="692" text-anchor="middle" font-size="20" fill="#64748B">expires after the retry window</text>

  <rect x="440" y="750" width="360" height="140" rx="14" fill="#ECFDF5" fill-opacity="0.5" stroke="#34D399" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="795" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">Either way the caller</text>
  <text x="620" y="827" text-anchor="middle" font-size="20" font-weight="600" fill="#065F46">gets the same answer</text>
  <text x="620" y="862" text-anchor="middle" font-size="20" fill="#64748B">the card is charged once</text>

  <g fill="none" stroke-width="2.5">
    <path d="M360,320 L412,320" stroke="#3B82F6" marker-end="url(#m04-l04-idempotency-key-path-bl)"/>
    <path d="M800,300 C838,300 812,160 822,160" stroke="#059669" marker-end="url(#m04-l04-idempotency-key-path-em)"/>
    <path d="M800,340 C838,340 812,540 822,540" stroke="#3B82F6" marker-end="url(#m04-l04-idempotency-key-path-bl)"/>
    <path d="M610,408 L610,520 L250,520 L250,548" stroke="#475569" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#m04-l04-idempotency-key-path-sl)"/>
    <path d="M830,600 L560,600 L560,660 L432,660" stroke="#3B82F6" marker-end="url(#m04-l04-idempotency-key-path-bl)"/>
    <path d="M1010,610 L1010,682" stroke="#059669" marker-end="url(#m04-l04-idempotency-key-path-em)"/>
  </g>

  <text x="800" y="182" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="800" y="208" text-anchor="end" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the key is on record</text>
  <text x="800" y="452" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="800" y="478" text-anchor="end" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">first time for this key</text>
  <text x="430" y="512" font-size="20" fill="#475569" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">look up the key</text>
  <text x="600" y="558" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">the key row commits</text>
  <text x="600" y="584" font-size="20" fill="#1E40AF" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">with the effect</text>

  <line x1="60" y1="930" x2="96" y2="930" stroke="#3B82F6" stroke-width="4"/>
  <text x="108" y="937" font-size="20" fill="#475569">Live request path: the work actually runs</text>
  <line x1="60" y1="970" x2="96" y2="970" stroke="#059669" stroke-width="4"/>
  <text x="108" y="977" font-size="20" fill="#475569">Result returned to the caller, stored or fresh</text>
  <line x1="60" y1="1010" x2="96" y2="1010" stroke="#475569" stroke-width="4" stroke-dasharray="6 5"/>
  <text x="108" y="1017" font-size="20" fill="#475569">Lookup against the processed keys store</text>
</svg>