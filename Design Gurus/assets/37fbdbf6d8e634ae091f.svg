<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="780" viewBox="0 0 1240 780" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="How an instance gets into the registry and how it gets out. It registers itself, or a separate registrar watches the platform and registers it. To stay listed it renews its entry on a timer. When the registry stops hearing from it the entry expires and clients are no longer given that address">
  <defs>
    <marker id="sd2-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <filter id="sd2-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="sd2-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="sd2-a1"><rect x="72" y="112" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="sd2-a2"><rect x="638" y="112" width="530" height="90" rx="12"/></clipPath>
    <clipPath id="sd2-b1"><rect x="72" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sd2-b2"><rect x="455" y="398" width="330" height="90" rx="12"/></clipPath>
    <clipPath id="sd2-b3"><rect x="838" y="398" width="330" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="780" fill="#FFFFFF"/>

  <rect x="40" y="44" width="1160" height="250" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="64" y="74" font-size="16.5" font-weight="600" fill="#1D4ED8">Getting in: two ways an instance ends up in the registry</text>

  <rect x="40" y="330" width="1160" height="250" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5"/>
  <text x="64" y="360" font-size="16.5" font-weight="600" fill="#047857">Staying in, and getting out: the health check decides</text>

  <g fill="none" stroke="#059669" stroke-width="2">
    <path d="M402,443 L451,443" marker-end="url(#sd2-em)"/>
    <path d="M785,443 L834,443" marker-end="url(#sd2-em)"/>
  </g>

  
  <g filter="url(#sd2-soft)">
    <rect x="72" y="112" width="530" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="72" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#sd2-a1)"/>
  </g>
  <circle cx="110" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="136" y="164" font-size="18.5" font-weight="600" fill="#111827">Self-Registration</text>
  <text x="337" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">the instance calls the registry itself when it starts</text>
  <text x="337" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">simple, but every service needs the registry client code</text>

  <g filter="url(#sd2-soft)">
    <rect x="638" y="112" width="530" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="638" y="112" width="6" height="90" fill="#2563EB" clip-path="url(#sd2-a2)"/>
  </g>
  <circle cx="676" cy="157" r="18" fill="#FFFFFF"/>
  <g transform="translate(665.56,146.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="702" y="164" font-size="18.5" font-weight="600" fill="#111827">Third-Party Registration</text>
  <text x="903" y="227" font-size="15.5" text-anchor="middle" fill="#6B7280">a separate registrar watches the platform and registers it</text>
  <text x="903" y="250" font-size="15.5" text-anchor="middle" fill="#94A3B8">the service stays unaware that a registry exists</text>

  
  <g filter="url(#sd2-soft)">
    <rect x="72" y="398" width="330" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="72" y="398" width="6" height="90" fill="#059669" clip-path="url(#sd2-b1)"/>
  </g>
  <circle cx="110" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(99.56,432.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M12 6.5V12l3.5 2.5"/>
  </g>
  <text x="136" y="450" font-size="18.5" font-weight="600" fill="#111827">Heartbeat</text>
  <text x="237" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">the instance renews its entry</text>
  <text x="237" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">on a timer, say every 30 seconds</text>

  <g filter="url(#sd2-lift)">
    <rect x="455" y="398" width="330" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="455" y="398" width="9" height="90" fill="#D97706" clip-path="url(#sd2-b2)"/>
  </g>
  <circle cx="493" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(482.56,432.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l9.5 16.5H2.5z"/>
    <path d="M12 10v4M12 17.2v.1"/>
  </g>
  <text x="519" y="450" font-size="18.5" font-weight="600" fill="#111827">Renewals Stop</text>
  <text x="620" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">the machine crashed or the network broke</text>
  <text x="620" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">the registry cannot tell which</text>

  <g filter="url(#sd2-soft)">
    <rect x="838" y="398" width="330" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="838" y="398" width="6" height="90" fill="#64748B" clip-path="url(#sd2-b3)"/>
  </g>
  <circle cx="876" cy="443" r="18" fill="#FFFFFF"/>
  <g transform="translate(865.56,432.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12h8"/>
  </g>
  <text x="902" y="450" font-size="18.5" font-weight="600" fill="#111827">Entry Expires</text>
  <text x="1003" y="513" font-size="15.5" text-anchor="middle" fill="#6B7280">after a few missed renewals</text>
  <text x="1003" y="536" font-size="15.5" text-anchor="middle" fill="#94A3B8">clients stop being given that address</text>

  
  <rect x="40" y="612" width="1160" height="128" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>

  <rect x="64" y="636" width="200" height="32" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
  <text x="164" y="658" text-anchor="middle" font-size="15.5" font-weight="600" fill="#1D4ED8">Which to use</text>
  <text x="288" y="658" font-size="15.5" fill="#475569">on a platform like Kubernetes the registrar already exists, so third-party registration is the default</text>

  <rect x="64" y="680" width="200" height="32" rx="9" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="164" y="702" text-anchor="middle" font-size="15.5" font-weight="600" fill="#B45309">The tuning problem</text>
  <text x="288" y="702" font-size="15.5" fill="#475569">expire too fast and a slow instance is dropped while healthy, too slow and clients keep calling a dead one</text>
</svg>