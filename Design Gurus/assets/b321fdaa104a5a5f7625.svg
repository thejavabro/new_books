<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" style="background-color:#ffffff">
<defs>
<marker id="pxc" markerWidth="11" markerHeight="9" refX="10.5" refY="4.5" orient="auto"><path d="M 0 0 L 11 4.5 L 0 9 z" fill="#ffffff" stroke="#000000"/></marker>
<marker id="pxd" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto"><path d="M 0 5 L 5 1 L 10 5 L 5 9 z" fill="#ffffff" stroke="#000000"/></marker>
</defs>
<g font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#000000">

<rect x="340" y="40" width="280" height="70" fill="#ffffff" stroke="#6c8ebf"/>
<rect x="340" y="40" width="280" height="28" fill="#dae8fc" stroke="#6c8ebf"/>
<text x="480" y="59" text-anchor="middle" font-weight="bold">&#171;interface&#187; Report</text>
<text x="352" y="86">+ title() : String</text>
<text x="352" y="104">+ render()</text>

<rect x="30" y="216" width="250" height="70" fill="#ffffff" stroke="#c3cfe0"/>
<rect x="30" y="216" width="250" height="28" fill="#eef2f8" stroke="#c3cfe0"/>
<text x="155" y="235" text-anchor="middle" font-weight="bold" fill="#414d60">RealReport</text>
<text x="42" y="262" font-size="11.5" fill="#414d60">the real subject</text>
<text x="42" y="279" font-size="11.5" fill="#8a5f10">expensive to construct</text>

<rect x="330" y="216" width="270" height="70" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="330" y="216" width="270" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="465" y="235" text-anchor="middle" font-weight="bold">LazyReport</text>
<text x="342" y="262" font-size="11.5">- real : RealReport   (null at first)</text>
<text x="342" y="279" font-size="11.5" fill="#2f7a55">virtual proxy: defers the cost</text>

<rect x="650" y="216" width="280" height="70" fill="#ffffff" stroke="#2f7a55" stroke-width="1.5"/>
<rect x="650" y="216" width="280" height="28" fill="#dcefe4" stroke="#2f7a55"/>
<text x="790" y="235" text-anchor="middle" font-weight="bold">AuditedReport</text>
<text x="662" y="262" font-size="11.5">- inner : Report, - role : String</text>
<text x="662" y="279" font-size="11.5" fill="#2f7a55">protection proxy: can refuse</text>

<path d="M 155 216 L 155 160 L 480 160 L 480 110" stroke="#000000" fill="none" stroke-dasharray="5 4" marker-end="url(#pxc)"/>
<path d="M 465 216 L 465 160" stroke="#000000" fill="none" stroke-dasharray="5 4"/>
<path d="M 790 216 L 790 160 L 480 160" stroke="#000000" fill="none" stroke-dasharray="5 4"/>

<path d="M 330 258 L 285 258" stroke="#000000" fill="none" marker-start="url(#pxd)"/>
<text x="288" y="298" font-size="11" fill="#414d60">builds one on first use</text>

<path d="M 650 250 L 620 250 L 620 330 L 480 330" stroke="#000000" fill="none" marker-start="url(#pxd)"/>
<text x="490" y="350" font-size="11" fill="#414d60">wraps any Report, including another proxy</text>

<rect x="30" y="368" width="900" height="42" rx="6" fill="#f5f7fa" stroke="#c3cfe0"/>
<text x="52" y="394" font-size="12.5" fill="#414d60">Both proxies implement Report, so a caller holding a Report cannot tell which of the three it has. That is the whole point, and the whole risk.</text>
</g>
</svg>