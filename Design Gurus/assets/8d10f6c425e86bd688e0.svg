<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1088" viewBox="0 0 1240 1088" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Consolidated People You May Know architecture: offline Spark generation, online cache serving, last mile filtering and supernode sampling">
  <defs>
    <filter id="pk-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
    <marker id="pk-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="pk-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="pk-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="pk-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="pk-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="1088" fill="#FFFFFF"/>
  <text x="40" y="44" font-size="20" font-weight="600" fill="#0F172A">People You May Know: the whole system in one view</text>
  <text x="40" y="72" font-size="20" fill="#64748B">All the hard maths runs overnight, so the request itself is a cache read</text>

  <rect x="24" y="96" width="1192" height="212" rx="14" fill="#FFFBEB" fill-opacity="0.5" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="128" font-size="20" font-weight="600" fill="#92400E">1. Offline generation (nightly) · friend of a friend is too slow to do live</text>
  <path d="M264,194 L349,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#pk-amber)"/>
  <text x="307" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">snapshot</text>
  <path d="M577,194 L662,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#pk-amber)"/>
  <text x="620" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">shuffle</text>
  <path d="M890,194 L975,194" stroke="#D97706" stroke-width="2" fill="none" stroke-dasharray="6 5" marker-end="url(#pk-amber)"/>
  <text x="933" y="182" font-size="20" fill="#92400E" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">load</text>
  <g filter="url(#pk-soft)">
    <path d="M40,171 L40,217 A110,15 0 0 0 260,217 L260,171" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
    <ellipse cx="150" cy="171" rx="110" ry="15" fill="#EDE9FE" stroke="#7C3AED" stroke-width="1.5"/>
    <rect x="353" y="156" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <rect x="666" y="156" width="220" height="76" rx="10" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <path d="M979,171 L979,217 A110,15 0 0 0 1199,217 L1199,171" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="1089" cy="171" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="150" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Social graph</text>
  <text x="150" y="262" font-size="20" fill="#5B21B6" text-anchor="middle">the source of truth</text>
  <text x="463" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Spark map</text>
  <text x="463" y="216" font-size="20" fill="#64748B" text-anchor="middle">emits a vote per pair</text>
  <text x="776" y="190" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Reduce</text>
  <text x="776" y="216" font-size="20" fill="#64748B" text-anchor="middle">counts the votes</text>
  <text x="1089" y="205" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis ZSET</text>
  <text x="1089" y="262" font-size="20" fill="#065F46" text-anchor="middle">top 100 per user</text>

  <rect x="24" y="338" width="1192" height="212" rx="14" fill="#EFF6FF" fill-opacity="0.5" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="370" font-size="20" font-weight="600" fill="#1E40AF">2. Serving (read path) · 23,000 QPS at peak, under 200ms</text>
  <path d="M264,436 L349,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="307" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">GET</text>
  <path d="M577,436 L662,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="620" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">read</text>
  <path d="M890,436 L975,436" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="933" y="424" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">hydrate</text>
  <g filter="url(#pk-soft)">
    <rect x="40" y="398" width="220" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
    <rect x="353" y="398" width="220" height="76" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
    <path d="M666,413 L666,459 A110,15 0 0 0 886,459 L886,413" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="776" cy="413" rx="110" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="979" y="398" width="220" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="150" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">App</text>
  <text x="150" y="458" font-size="20" fill="#64748B" text-anchor="middle">opens the tab</text>
  <text x="463" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">PYMK API</text>
  <text x="463" y="458" font-size="20" fill="#64748B" text-anchor="middle">ids then names</text>
  <text x="776" y="447" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Redis ZSET</text>
  <text x="776" y="504" font-size="20" fill="#065F46" text-anchor="middle">scored by mutuals</text>
  <text x="1089" y="432" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Profile Service</text>
  <text x="1089" y="458" font-size="20" fill="#64748B" text-anchor="middle">names and photos</text>

  <rect x="24" y="580" width="1192" height="212" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="612" font-size="20" font-weight="600" fill="#475569">3. The last mile · the batch ran last night, the graph moved this morning</text>
  <path d="M364,678 L456,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="410" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">check</text>
  <path d="M784,678 L876,678" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="830" y="666" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">return</text>
  <g filter="url(#pk-soft)">
    <path d="M40,655 L40,701 A160,15 0 0 0 360,701 L360,655" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
    <ellipse cx="200" cy="655" rx="160" ry="15" fill="#D1FAE5" stroke="#059669" stroke-width="1.5"/>
    <rect x="460" y="640" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="640" width="320" height="76" rx="10" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="200" y="689" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Candidates</text>
  <text x="200" y="746" font-size="20" fill="#065F46" text-anchor="middle">100 ids from Redis</text>
  <text x="620" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Live filter</text>
  <text x="620" y="700" font-size="20" fill="#64748B" text-anchor="middle">added or blocked</text>
  <text x="1040" y="674" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Result</text>
  <text x="1040" y="700" font-size="20" fill="#64748B" text-anchor="middle">never an old friend</text>

  <rect x="24" y="822" width="1192" height="166" rx="14" fill="#F8FAFC" fill-opacity="0.5" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="854" font-size="20" font-weight="600" fill="#475569">4. Keeping the job alive · a 5,000 friend node makes 25 million pairs</text>
  <path d="M364,920 L456,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="410" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">no graph</text>
  <path d="M784,920 L876,920" stroke="#3B82F6" stroke-width="2" fill="none" marker-end="url(#pk-blue)"/>
  <text x="830" y="908" font-size="20" fill="#1E40AF" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">job fails</text>
  <g filter="url(#pk-soft)">
    <rect x="40" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="460" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="880" y="882" width="320" height="76" rx="10" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <text x="200" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Supernode cap</text>
  <text x="200" y="942" font-size="20" fill="#64748B" text-anchor="middle">500 friends sampled</text>
  <text x="620" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Cold start</text>
  <text x="620" y="942" font-size="20" fill="#64748B" text-anchor="middle">city and school</text>
  <text x="1040" y="916" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Stale is fine</text>
  <text x="1040" y="942" font-size="20" fill="#64748B" text-anchor="middle">serve yesterday</text>
  <line x1="44" y1="1048" x2="72" y2="1048" stroke="#3B82F6" stroke-width="3"/>
  <text x="84" y="1055" font-size="20" fill="#475569">synchronous request</text>
  <line x1="316.576" y1="1048" x2="344.576" y2="1048" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="356.576" y="1055" font-size="20" fill="#475569">asynchronous event</text>
  <rect x="581.976" y="1039" width="28" height="18" rx="4" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  <text x="621.976" y="1055" font-size="20" fill="#475569">cache</text>
  <rect x="718.832" y="1039" width="28" height="18" rx="4" fill="#F5F3FF" stroke="#7C3AED" stroke-width="1.5"/>
  <text x="758.832" y="1055" font-size="20" fill="#475569">datastore</text>
  <rect x="890.008" y="1039" width="28" height="18" rx="4" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="930.008" y="1055" font-size="20" fill="#475569">core service</text>
</svg>