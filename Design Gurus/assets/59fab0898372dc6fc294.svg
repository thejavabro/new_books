<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="940" viewBox="0 0 1240 940" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A client sends a Create Order request into a monolithic application. 1 the application server receives it and the framework&#39;s router picks the controller; 2 the controller parses, validates and authenticates; 3 OrderService applies business rules; 4 PaymentService charges the card through the external payment processor, a network call; 5 OrderService opens one transaction in the shared database, in which OrderRepository saves the order and its line items and the inventory module reserves stock with a conditional update; 6 OrderService publishes an in-process OrderCreated event that the notification and inventory modules react to; 7 the controller returns the order as JSON with HTTP 201 Created to the client">
  <defs>
    <filter id="msa1f-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="msa1f-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>
    <clipPath id="msa1f-k1"><rect x="30" y="180" width="150" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k2"><rect x="294" y="180" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k3"><rect x="294" y="284" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k4"><rect x="294" y="388" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k5"><rect x="294" y="492" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k6"><rect x="294" y="596" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k7"><rect x="294" y="700" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k8"><rect x="294" y="804" width="480" height="72" rx="12"/></clipPath>
    <clipPath id="msa1f-k9"><rect x="950" y="492" width="250" height="72" rx="12"/></clipPath>
    <marker id="msa1f-m-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
    <marker id="msa1f-m-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="msa1f-m-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="msa1f-s-amber" viewBox="0 0 8 8" refX="0.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M8,0 L0,4 L8,8 Z" fill="#D97706"/></marker>
  </defs>

  <rect x="0" y="0" width="1240" height="940" fill="#FFFFFF"/>

  <text x="40" y="52" font-size="27" font-weight="700" fill="#111827">How an HTTP request flows through a monolith</text>
  <text x="40" y="82" font-size="19" fill="#6B7280">Seven steps run inside one process; the payment processor, the database and the job queue are network calls.</text>

  <rect x="270" y="130" width="528" height="770" rx="14" fill="#EFF6FF" stroke="#93C5FD" stroke-width="1.5"/>
  <text x="294" y="160" font-size="19.5" font-weight="600" fill="#1D4ED8">Monolithic application</text>

  <g fill="none" stroke-width="2">
    <path d="M180,216 H294" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,252 V284" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,356 V388" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,460 V492" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,564 V596" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,668 V700" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M534,772 V804" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
    <path d="M774,528 H950" stroke="#D97706" marker-end="url(#msa1f-m-amber)" marker-start="url(#msa1f-s-amber)"/>
    <path d="M774,650 H950" stroke="#7C3AED" marker-end="url(#msa1f-m-violet)"/>
    <path d="M294,840 H117 Q105,840 105,828 V252" stroke="#2563EB" marker-end="url(#msa1f-m-blue)"/>
  </g>

  <g font-size="18.5" font-weight="600" text-anchor="middle" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">
    <text x="237" y="182" fill="#1D4ED8">HTTP</text>
    <text x="237" y="204" fill="#1D4ED8">request</text>
    <text x="874" y="516" fill="#B45309">network call</text>
    <text x="874" y="616" fill="#5B21B6">one</text>
    <text x="874" y="638" fill="#5B21B6">transaction</text>
    <text x="190" y="806" fill="#1D4ED8">HTTP 201</text>
    <text x="190" y="828" fill="#1D4ED8">Created</text>
  </g>

  <g filter="url(#msa1f-soft)">
    <rect x="30" y="180" width="150" height="72" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="30" y="180" width="6" height="72" fill="#64748B" clip-path="url(#msa1f-k1)"/>
  </g>
  <circle cx="68" cy="216" r="18" fill="#FFFFFF"/>
  <g transform="translate(57.56,205.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g>
  <text x="94" y="223" font-size="21.5" font-weight="600" fill="#111827">Client</text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="180" width="480" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="294" y="180" width="6" height="72" fill="#2563EB" clip-path="url(#msa1f-k2)"/>
  </g>
  <circle cx="332" cy="216" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,205.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/></g>
  <text x="358" y="201" font-size="18.5" font-weight="600" fill="#111827">1. Application server receives the request</text>
  <text x="358" y="234.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="284" width="480" height="72" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="294" y="284" width="6" height="72" fill="#2563EB" clip-path="url(#msa1f-k3)"/>
  </g>
  <circle cx="332" cy="320" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,309.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="16" rx="2"/><path d="M2.5 9h19M6 6.5h.01M9 6.5h.01"/></g>
  <text x="358" y="315.75" font-size="18.5" font-weight="600" fill="#111827">2. Controller handles the request</text>
  <text x="358" y="338.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="388" width="480" height="72" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="294" y="388" width="6" height="72" fill="#059669" clip-path="url(#msa1f-k4)"/>
  </g>
  <circle cx="332" cy="424" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,413.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></g>
  <text x="358" y="419.75" font-size="18.5" font-weight="600" fill="#111827">3. OrderService applies business rules</text>
  <text x="358" y="442.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="492" width="480" height="72" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="294" y="492" width="6" height="72" fill="#D97706" clip-path="url(#msa1f-k5)"/>
  </g>
  <circle cx="332" cy="528" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,517.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/></g>
  <text x="358" y="523.75" font-size="18.5" font-weight="600" fill="#111827">4. PaymentService charges the card</text>
  <text x="358" y="546.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="596" width="480" height="72" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="294" y="596" width="6" height="72" fill="#7C3AED" clip-path="url(#msa1f-k6)"/>
  </g>
  <circle cx="332" cy="632" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,621.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></g>
  <text x="358" y="617" font-size="18.5" font-weight="600" fill="#111827">5. OrderService opens one transaction</text>
  <text x="358" y="650.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="700" width="480" height="72" rx="12" fill="#E0E7FF" stroke="#A5B4FC" stroke-width="1.5"/>
    <rect x="294" y="700" width="6" height="72" fill="#4F46E5" clip-path="url(#msa1f-k7)"/>
  </g>
  <circle cx="332" cy="736" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,725.56) scale(0.87)" fill="none" stroke="#4F46E5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8.5a6 6 0 1 0-12 0c0 6-2.5 7.5-2.5 7.5h17S18 14.5 18 8.5z"/><path d="M13.7 20a2 2 0 0 1-3.4 0"/></g>
  <text x="358" y="731.75" font-size="18.5" font-weight="600" fill="#111827">6. OrderService publishes OrderCreated</text>
  <text x="358" y="754.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="294" y="804" width="480" height="72" rx="12" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="294" y="804" width="6" height="72" fill="#DB2777" clip-path="url(#msa1f-k8)"/>
  </g>
  <circle cx="332" cy="840" r="18" fill="#FFFFFF"/>
  <g transform="translate(321.56,829.56) scale(0.87)" fill="none" stroke="#DB2777" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2.5h8l5 5v14H6z"/><path d="M14 2.5v5h5M9 13h6M9 17h6"/></g>
  <text x="358" y="835.75" font-size="18.5" font-weight="600" fill="#111827">7. Controller returns the response</text>
  <text x="358" y="858.25" font-size="18.5" font-weight="600" fill="#111827"></text>
  <g filter="url(#msa1f-soft)">
    <rect x="950" y="492" width="250" height="72" rx="12" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1.5"/>
    <rect x="950" y="492" width="6" height="72" fill="#D97706" clip-path="url(#msa1f-k9)"/>
  </g>
  <circle cx="988" cy="528" r="18" fill="#FFFFFF"/>
  <g transform="translate(977.56,517.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18.5h11a4 4 0 0 0 .6-7.95A6 6 0 0 0 7.1 9.1 4.75 4.75 0 0 0 7 18.5z"/></g>
  <text x="1014" y="523.75" font-size="18.5" font-weight="600" fill="#111827">Payment processor</text>
  <text x="1014" y="546.25" font-size="18.5" font-weight="600" fill="#111827">(external API)</text>
  <g stroke="#2563EB" stroke-width="1.5">
    <path d="M950,618 L950,702 A125,16 0 0 0 1200,702 L1200,618" fill="#DBEAFE"/>
    <ellipse cx="1075" cy="618" rx="125" ry="16" fill="#EFF6FF"/>
  </g>
  <text x="1075" y="675" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">Shared database</text>
  <text x="358" y="221" font-size="17" fill="#6B7280">the framework's router picks the controller</text>
  <text x="358" y="240" font-size="17" fill="#6B7280">by URL and method</text>
  <text x="358" y="339" font-size="17" fill="#6B7280">parses, validates and authenticates</text>
  <text x="358" y="443" font-size="17" fill="#6B7280">checks products and stock, prices the order</text>
  <text x="358" y="547" font-size="17" fill="#6B7280">calls the external payment processor</text>
  <text x="358" y="637" font-size="17" fill="#6B7280">OrderRepository saves order and items;</text>
  <text x="358" y="656" font-size="17" fill="#6B7280">inventory module reserves stock (conditional update)</text>
  <text x="358" y="755" font-size="17" fill="#6B7280">in-process; notification and inventory react</text>
  <text x="358" y="859" font-size="17" fill="#6B7280">the order as JSON with HTTP 201 Created</text>




</svg>