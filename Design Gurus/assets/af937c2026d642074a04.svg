<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1290" viewBox="0 0 1240 1290" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Decision flow for splitting a system: ask three questions in order, and the first Yes decides. Yes to teams blocking each other&#39;s releases means split by capability with one team per service. Yes to one component scaling, failing, or complying differently means split out that one component only. Yes to services deploying in lockstep on a shared database means the system is already over-split, so consolidate. Falling through every question lands on a modular monolith, split later on evidence.">
  <defs>
    <marker id="m08-l03-split-decision-sl" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="m08-l03-split-decision-em" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#059669"/>
    </marker>
    <marker id="m08-l03-split-decision-rd" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
    <filter id="m08-l03-split-decision-soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="1240" height="1290" fill="#FFFFFF"/>

  <rect x="50" y="110" width="470" height="1030" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="70" y="150" font-size="20" font-weight="600" fill="#334155">Ask in order: the first Yes decides</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="100" y="180" width="400" height="110" rx="10" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  </g>
  <text x="300" y="242" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Should we split this system?</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <path d="M300,320 L500,400 L300,480 L100,400 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="300" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Are teams blocking</text>
  <text x="300" y="423" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">each other's releases?</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <path d="M300,540 L500,620 L300,700 L100,620 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="300" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Does one component</text>
  <text x="300" y="643" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">scale or fail differently?</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <path d="M300,760 L500,840 L300,920 L100,840 Z" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
  <text x="300" y="831" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Do services deploy in</text>
  <text x="300" y="863" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">lockstep on one database?</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="100" y="980" width="400" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="300" y="1031" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">A modular monolith,</text>
  <text x="300" y="1063" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">split later on evidence</text>

  <rect x="690" y="110" width="500" height="800" rx="14" fill="none" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="710" y="150" font-size="20" font-weight="600" fill="#334155">Where each Yes exits</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="700" y="340" width="480" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="940" y="391" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split by capability,</text>
  <text x="940" y="423" text-anchor="middle" font-size="20" fill="#64748B">one team per service</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="700" y="560" width="480" height="120" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="940" y="611" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Split out that one</text>
  <text x="940" y="643" text-anchor="middle" font-size="20" fill="#64748B">component, and no more</text>
  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="700" y="780" width="480" height="120" rx="10" fill="#FEF2F2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <text x="940" y="831" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Consolidate: it is</text>
  <text x="940" y="863" text-anchor="middle" font-size="20" fill="#64748B">already over-split</text>

  <g fill="none" stroke-width="2.5">
    <path d="M300,290 L300,312" stroke="#475569" stroke-width="2" marker-end="url(#m08-l03-split-decision-sl)"/>
    <path d="M300,480 L300,532" stroke="#475569" stroke-width="2" marker-end="url(#m08-l03-split-decision-sl)"/>
    <path d="M300,700 L300,752" stroke="#475569" stroke-width="2" marker-end="url(#m08-l03-split-decision-sl)"/>
    <path d="M300,920 L300,972" stroke="#475569" marker-end="url(#m08-l03-split-decision-sl)"/>
    <path d="M500,400 L692,400" stroke="#059669" marker-end="url(#m08-l03-split-decision-em)"/>
    <path d="M500,620 L692,620" stroke="#059669" marker-end="url(#m08-l03-split-decision-em)"/>
    <path d="M500,840 L692,840" stroke="#DC2626" marker-end="url(#m08-l03-split-decision-rd)"/>
  </g>

  <text x="591" y="380" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="591" y="600" text-anchor="middle" font-size="20" fill="#065F46" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="591" y="820" text-anchor="middle" font-size="20" fill="#B91C1C" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">Yes</text>
  <text x="330" y="512" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="330" y="732" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>
  <text x="330" y="952" font-size="20" fill="#64748B" paint-order="stroke" stroke="#FFFFFF" stroke-width="5">No</text>

  <g filter="url(#m08-l03-split-decision-soft)">
    <rect x="700" y="960" width="480" height="140" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="1.5"/>
  </g>
  <text x="940" y="1005" text-anchor="middle" font-size="20" font-weight="600" fill="#0F172A">Say the evidence out loud</text>
  <text x="940" y="1037" text-anchor="middle" font-size="20" fill="#065F46">A split you cannot name a measured</text>
  <text x="940" y="1069" text-anchor="middle" font-size="20" fill="#065F46">reason for is a split you should not make.</text>

  <line x1="60" y1="1170" x2="96" y2="1170" stroke="#059669" stroke-width="4"/>
  <text x="108" y="1177" font-size="20" fill="#475569">Yes: a measured signal, so the split is justified</text>
  <line x1="60" y1="1210" x2="96" y2="1210" stroke="#DC2626" stroke-width="4"/>
  <text x="108" y="1217" font-size="20" fill="#475569">Yes, and the answer is to go back the other way</text>
  <line x1="60" y1="1250" x2="96" y2="1250" stroke="#475569" stroke-width="4"/>
  <text x="108" y="1257" font-size="20" fill="#475569">No: fall through to the next question</text>
</svg>