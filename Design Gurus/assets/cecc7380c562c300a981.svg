<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="510" viewBox="0 0 1240 510" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="A relational database checks the schema itself and rejects a record with a missing field. A NoSQL store accepts the same record as sent. The schema does not disappear, it moves into the application, where nothing checks that you kept it.">
  <rect x="0" y="0" width="1240" height="510" fill="#FFFFFF"/>
  <defs>
    <marker id="sn3-b" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#3B82F6"/></marker>
    <marker id="sn3-e" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
    <marker id="sn3-a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
    <marker id="sn3-v" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
    <marker id="sn3-r" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/></marker>
    <marker id="sn3-t" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#0D9488"/></marker>
    <marker id="sn3-s" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/></marker>
    <marker id="sn3-g" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#CBD5E1"/></marker>
    <filter id="sn3-soft" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0F172A" flood-opacity="0.12"/></filter>
  </defs>
  <text x="620" y="40" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">The schema does not disappear, it moves</text>
  <text x="317" y="84" font-size="21" font-weight="700" fill="#1E40AF" text-anchor="middle">RELATIONAL</text>
  <g filter="url(#sn3-soft)"><rect x="97" y="104" width="440" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="317" y="142" font-size="20" fill="#0F172A" text-anchor="middle">Application writes a record</text>
  <line x1="317" y1="168" x2="317" y2="202" stroke="#3B82F6" stroke-width="2.2" marker-end="url(#sn3-b)"/>
  <g filter="url(#sn3-soft)"><rect x="97" y="208" width="440" height="124" rx="11" fill="#EFF6FF" stroke="#3B82F6" stroke-width="2"/></g>
  <text x="317" y="242" font-size="20" font-weight="700" fill="#1E40AF" text-anchor="middle">The database checks the shape</text>
  <text x="317" y="274" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">phone field is missing</text>
  <path d="M230,298 L246,314 M246,298 L230,314" fill="none" stroke="#DC2626" stroke-width="3" stroke-linecap="round"/>
  <text x="262" y="313" font-size="19" font-weight="600" fill="#B91C1C" text-anchor="start">the write is rejected</text>
  <rect x="24" y="362" width="586" height="116" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="317" y="396" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Every reader can rely on the shape</text>
  <text x="317" y="426" font-size="19" fill="#64748B" text-anchor="middle">Changing the shape means a migration,</text>
  <text x="317" y="452" font-size="19" fill="#64748B" text-anchor="middle">planned and run against a large table</text>
  <text x="923" y="84" font-size="21" font-weight="700" fill="#6D28D9" text-anchor="middle">NoSQL</text>
  <g filter="url(#sn3-soft)"><rect x="703" y="104" width="440" height="60" rx="11" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.6"/></g>
  <text x="923" y="142" font-size="20" fill="#0F172A" text-anchor="middle">Application writes a record</text>
  <line x1="923" y1="168" x2="923" y2="202" stroke="#7C3AED" stroke-width="2.2" marker-end="url(#sn3-v)"/>
  <g filter="url(#sn3-soft)"><rect x="703" y="208" width="440" height="124" rx="11" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/></g>
  <text x="923" y="242" font-size="20" font-weight="700" fill="#6D28D9" text-anchor="middle">The store accepts it as sent</text>
  <text x="923" y="274" font-size="19" fill="#64748B" text-anchor="middle" font-family="&#39;Consolas&#39;,&#39;SF Mono&#39;,Menlo,monospace">phone field is missing</text>
  <path d="M837,306 L844,314 L856,298" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
  <text x="872" y="313" font-size="19" font-weight="600" fill="#065F46" text-anchor="start">the write is accepted</text>
  <rect x="630" y="362" width="586" height="116" rx="11" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="923" y="396" font-size="20" font-weight="600" fill="#0F172A" text-anchor="middle">Your code must handle both shapes</text>
  <text x="923" y="426" font-size="19" fill="#64748B" text-anchor="middle">The schema now lives in the application,</text>
  <text x="923" y="452" font-size="19" fill="#64748B" text-anchor="middle">where nothing checks that you kept it</text>
</svg>