<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="716" viewBox="0 0 1240 716" font-family="Arial, Helvetica, sans-serif" role="img" aria-labelledby="failure-title failure-desc">
<title id="failure-title">Failure modes to design for</title>
<desc id="failure-desc">Losing quorum, putting a coordination call on the request path, and sessions expiring under load rather than on death. Each has a predictable wrong response and a short correct one.</desc>
<defs>
<marker id="failure-marker-slate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#284E65"/></marker>
<marker id="failure-marker-green" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#169B77"/></marker>
<marker id="failure-marker-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#CE475C"/></marker>
<marker id="failure-marker-amber" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#91642E"/></marker>
</defs>
<rect width="1240" height="716" fill="#FFFFFF"/>
<text x="40" y="52" font-size="32" font-weight="800" fill="#080C50">Failure modes to design for</text>
<text x="40" y="86" font-size="21" fill="#4A5568">Each has a predictable wrong response and a short correct one.</text>
<rect x="40" y="638" width="1160" height="52" rx="12" fill="#FFF6DF" stroke="#F3CF6A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="40" y="638" width="5" height="52" rx="2.5" fill="#F3CF6A"/>
<text x="320" y="134" font-size="20" font-weight="700" fill="#A83147" text-anchor="middle">the failure</text>
<text x="920" y="134" font-size="20" font-weight="700" fill="#169B77" text-anchor="middle">what to do instead</text>
<text x="40" y="180" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Quorum loss</text>
<rect x="40" y="196" width="560" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="221" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">a service that cannot serve a read because it</text><text x="320" y="247" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">cannot renew a lease it never needed for reads</text>
<rect x="640" y="196" width="560" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="221" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">keep serving traffic, stop whatever needed</text><text x="920" y="247" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">the lock or the election, and alert</text>
<text x="40" y="304" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">A call on the request path</text>
<rect x="40" y="320" width="560" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="345" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">its availability becomes a ceiling on yours</text><text x="320" y="371" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">and its latency a floor</text>
<rect x="640" y="320" width="560" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="345" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">cache leadership and configuration locally,</text><text x="920" y="371" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">refresh in the background</text>
<text x="40" y="428" font-size="23" font-weight="700" fill="#080C50" text-anchor="start">Session expiry under load</text>
<rect x="40" y="444" width="560" height="64" rx="10" fill="#FFF0F0" stroke="#F28B9D" stroke-width="2"/><text x="320" y="469" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">assuming sessions expire only when</text><text x="320" y="495" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">a process dies</text>
<rect x="640" y="444" width="560" height="64" rx="10" fill="#E8FCF3" stroke="#39D5AA" stroke-width="2"/><text x="920" y="469" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">design for the window between expiry</text><text x="920" y="495" font-size="19" font-weight="700" fill="#080C50" text-anchor="middle">and the process noticing</text>
<rect x="40" y="532" width="1160" height="80" rx="12" fill="#E7F7FE" stroke="#5EC9EC" stroke-opacity="0.8" stroke-width="1.4"/><rect x="40" y="532" width="5" height="80" rx="2.5" fill="#5EC9EC"/><text x="64" y="563.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">Adding any dependency lowers your availability</text><text x="64" y="592.5" font-size="22" font-weight="700" fill="#080C50" text-anchor="start">unless you decide in advance what happens when it is gone.</text>
<text x="66" y="672" font-size="21" font-weight="400" fill="#080C50" text-anchor="start">The store will decide you are dead exactly when you are busiest.</text>
</svg>