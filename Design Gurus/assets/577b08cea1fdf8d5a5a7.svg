<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="Every account is read once, and the best total is kept as we go">
<defs>
<marker id="d3-ar-blue" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563EB"/></marker>
<marker id="d3-ar-violet" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#7C3AED"/></marker>
<marker id="d3-ar-emerald" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#059669"/></marker>
<marker id="d3-ar-pink" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#DB2777"/></marker>
<marker id="d3-ar-amber" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#D97706"/></marker>
<marker id="d3-ar-indigo" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#4F46E5"/></marker>
<marker id="d3-ar-slate" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<marker id="d3-ar" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/></marker>
<filter id="d3-soft" x="-12%" y="-14%" width="124%" height="140%"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/></filter>
</defs>
<rect x="0" y="0" width="940" height="500" fill="#FFFFFF"/>
<text x="470" y="46" text-anchor="middle" font-size="27" font-weight="600" fill="#111827">Sum each customer, keep the best as you go</text>
<text x="110" y="108" font-size="18.5" font-weight="600" fill="#475569">accounts</text>
<rect x="110" y="128" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="155" y="180.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">5</text>
<rect x="212" y="128" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="257" y="180.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">2</text>
<rect x="314" y="128" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="359" y="180.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">3</text>
<text x="92" y="180" text-anchor="end" font-size="17" font-weight="600" fill="#475569">customer 0</text>
<rect x="110" y="230" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="155" y="282.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">0</text>
<rect x="212" y="230" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="257" y="282.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">6</text>
<rect x="314" y="230" width="90" height="90" rx="8" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
<text x="359" y="282.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">7</text>
<text x="92" y="282" text-anchor="end" font-size="17" font-weight="600" fill="#475569">customer 1</text>
<path d="M416,173 L450,173" stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#d3-ar-blue)"/>
<rect x="460" y="145" width="128" height="56" rx="8" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
<text x="524" y="180.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">10</text>
<text x="608" y="180" font-size="18.5" fill="#475569">5 + 2 + 3 = 10</text>
<path d="M416,275 L450,275" stroke="#2563EB" stroke-width="2.2" fill="none" marker-end="url(#d3-ar-blue)"/>
<rect x="460" y="247" width="128" height="56" rx="8" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
<text x="524" y="282.5" text-anchor="middle" font-size="21.5" font-weight="600" fill="#111827">13</text>
<text x="608" y="282" font-size="18.5" fill="#475569">0 + 6 + 7 = 13</text>
<text x="460" y="108" font-size="18.5" font-weight="600" fill="#1D4ED8">total wealth</text>
<rect x="110" y="336" width="380" height="38" rx="9" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.2"/>
<text x="300" y="361" text-anchor="middle" font-size="18.5" font-weight="600" fill="#1D4ED8">maxWealth after customer 0: 10</text>
<rect x="510" y="336" width="380" height="38" rx="9" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.2"/>
<text x="700" y="361" text-anchor="middle" font-size="18.5" font-weight="600" fill="#047857">maxWealth after customer 1: 13</text>
<rect x="50" y="396" width="840" height="82" rx="12" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
<text x="72" y="432" font-size="18.5" fill="#475569">Two loops are needed: every balance changes the answer, so every cell gets read.</text>
<text x="72" y="460" font-size="18.5" fill="#475569">What the code avoids is a second pass, by keeping the best total while it sums.</text>
</svg>