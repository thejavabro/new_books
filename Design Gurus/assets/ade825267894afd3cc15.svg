<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="922" viewBox="0 0 1240 922" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The six trade-offs of the Twitter answer, each with the reason it was taken and the cost it accepts: immutable tweets, a derived home timeline, cursor paging, likes as sub-resources, thread tombstones, and a small first-version scope.">
  <defs>
    <filter id="xl12tradeof-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl12tradeof-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl12tradeof-k1"><rect x="110" y="106" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl12tradeof-k2"><rect x="690" y="106" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl12tradeof-k3"><rect x="110" y="332" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl12tradeof-k4"><rect x="690" y="332" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl12tradeof-k5"><rect x="110" y="558" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl12tradeof-k6"><rect x="690" y="558" width="440" height="90" rx="12"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="922" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="742" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">Six choices, six costs named aloud</text>

  
  <circle cx="830" cy="65" r="4.5" fill="#059669"/>
  <text x="846" y="70" font-size="15.5" font-weight="600" fill="#047857">Why it was chosen</text>
  <circle cx="1006" cy="65" r="4.5" fill="#DB2777"/>
  <text x="1022" y="70" font-size="15.5" font-weight="600" fill="#BE185D">What it costs</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="110" y="106" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="110" y="106" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k1)"/>
  </g>
  <circle cx="148" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,140.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l8 3v6c0 5-3.4 8.7-8 10-4.6-1.3-8-5-8-10v-6z"/>
  </g>
  <text x="174" y="158" font-size="18.5" font-weight="600" fill="#111827">Tweets are immutable</text>
  <circle cx="119" cy="219" r="4.5" fill="#059669"/>
  <text x="134" y="224" font-size="15.5" fill="#6B7280">Replies, caches, moderation history, and</text>
  <text x="134" y="247" font-size="15.5" fill="#6B7280">outside reads share one meaning.</text>
  <circle cx="119" cy="272" r="4.5" fill="#DB2777"/>
  <text x="134" y="277" font-size="15.5" fill="#6B7280">A typo needs a delete and a repost,</text>
  <text x="134" y="300" font-size="15.5" fill="#6B7280">losing the engagement.</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="690" y="106" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="690" y="106" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k2)"/>
  </g>
  <circle cx="728" cy="151" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,140.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5l9 4.5-9 4.5-9-4.5z"/>
    <path d="M3 12l9 4.5 9-4.5"/>
    <path d="M3 16.5l9 4.5 9-4.5"/>
  </g>
  <text x="754" y="158" font-size="18.5" font-weight="600" fill="#111827">One derived HomeTimeline</text>
  <circle cx="699" cy="219" r="4.5" fill="#059669"/>
  <text x="714" y="224" font-size="15.5" fill="#6B7280">One bounded call and one cursor for</text>
  <text x="714" y="247" font-size="15.5" fill="#6B7280">every client.</text>
  <circle cx="699" cy="272" r="4.5" fill="#DB2777"/>
  <text x="714" y="277" font-size="15.5" fill="#6B7280">Server-side fan-in complexity and a</text>
  <text x="714" y="300" font-size="15.5" fill="#6B7280">published freshness delay.</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="110" y="332" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="110" y="332" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k3)"/>
  </g>
  <circle cx="148" cy="377" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,366.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8.5 12h7M12.8 8.8L16 12l-3.2 3.2"/>
  </g>
  <text x="174" y="384" font-size="18.5" font-weight="600" fill="#111827">A cursor, not an offset</text>
  <circle cx="119" cy="445" r="4.5" fill="#059669"/>
  <text x="134" y="450" font-size="15.5" fill="#6B7280">New tweets arrive constantly, so an</text>
  <text x="134" y="473" font-size="15.5" fill="#6B7280">offset would repeat and skip rows.</text>
  <circle cx="119" cy="498" r="4.5" fill="#DB2777"/>
  <text x="134" y="503" font-size="15.5" fill="#6B7280">No numbered pages, and no jump to</text>
  <text x="134" y="526" font-size="15.5" fill="#6B7280">page fifty.</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="690" y="332" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="690" y="332" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k4)"/>
  </g>
  <circle cx="728" cy="377" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,366.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="7" cy="5" r="2.2"/>
    <circle cx="7" cy="19" r="2.2"/>
    <circle cx="17" cy="12" r="2.2"/>
    <path d="M7 7.2v9.6M9.2 12H14.8"/>
  </g>
  <text x="754" y="384" font-size="18.5" font-weight="600" fill="#111827">A like is a sub-resource</text>
  <circle cx="699" cy="445" r="4.5" fill="#059669"/>
  <text x="714" y="450" font-size="15.5" fill="#6B7280">Repeated writes are idempotent and</text>
  <text x="714" y="473" font-size="15.5" fill="#6B7280">the count stays server-owned.</text>
  <circle cx="699" cy="498" r="4.5" fill="#DB2777"/>
  <text x="714" y="503" font-size="15.5" fill="#6B7280">Another resource, and another</text>
  <text x="714" y="526" font-size="15.5" fill="#6B7280">permission surface.</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="110" y="558" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="110" y="558" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k5)"/>
  </g>
  <circle cx="148" cy="603" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,592.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="174" y="610" font-size="18.5" font-weight="600" fill="#111827">Tombstones inside threads</text>
  <circle cx="119" cy="671" r="4.5" fill="#059669"/>
  <text x="134" y="676" font-size="15.5" fill="#6B7280">A deleted tweet returns 410, but reply</text>
  <text x="134" y="699" font-size="15.5" fill="#6B7280">structure survives it.</text>
  <circle cx="119" cy="724" r="4.5" fill="#DB2777"/>
  <text x="134" y="729" font-size="15.5" fill="#6B7280">Structural metadata is kept after</text>
  <text x="134" y="752" font-size="15.5" fill="#6B7280">the content goes.</text>

  
  <g filter="url(#xl12tradeof-soft)">
    <rect x="690" y="558" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="690" y="558" width="6" height="90" fill="#2563EB" clip-path="url(#xl12tradeof-k6)"/>
  </g>
  <circle cx="728" cy="603" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,592.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 4h19l-7.5 8.5V20l-4 2v-9.5z"/>
  </g>
  <text x="754" y="610" font-size="18.5" font-weight="600" fill="#111827">A deliberately small scope</text>
  <circle cx="699" cy="671" r="4.5" fill="#059669"/>
  <text x="714" y="676" font-size="15.5" fill="#6B7280">The primary write and the changing</text>
  <text x="714" y="699" font-size="15.5" fill="#6B7280">timeline are designed completely.</text>
  <circle cx="699" cy="724" r="4.5" fill="#DB2777"/>
  <text x="714" y="729" font-size="15.5" fill="#6B7280">No media, messages, search,</text>
  <text x="714" y="752" font-size="15.5" fill="#6B7280">notifications, or moderation.</text>

  
  <rect x="40" y="806" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="851" text-anchor="middle" font-size="16" fill="#475569">Explain why each major choice fits the requirements and what disadvantage it has.</text>
</svg>