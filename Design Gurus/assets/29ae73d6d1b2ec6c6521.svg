<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="992" viewBox="0 0 1240 992" font-family="&#39;Segoe UI&#39;, Arial, sans-serif" role="img" aria-label="The course error object field by field: a stable machine-readable code that client code branches on, a human message that may change, the field at fault, useful values such as the provided and maximum, and a request_id for locating the failure in logs. A second band lists what an error body must never carry: a stack trace, a table or host name, a secret, a raw dependency error, or anything that confirms a private resource exists.">
  <defs>
    <filter id="xl07errorsh-soft" x="-12%" y="-14%" width="124%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
    <filter id="xl07errorsh-lift" x="-14%" y="-16%" width="128%" height="145%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.16"/>
    </filter>

    <clipPath id="xl07errorsh-k1"><rect x="110" y="100" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl07errorsh-k2"><rect x="690" y="100" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl07errorsh-k3"><rect x="110" y="286" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl07errorsh-k4"><rect x="690" y="286" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl07errorsh-k5"><rect x="400" y="472" width="440" height="90" rx="12"/></clipPath>
    <clipPath id="xl07errorsh-k6"><rect x="64" y="716" width="1112" height="48" rx="10"/></clipPath>
    <clipPath id="xl07errorsh-k7"><rect x="64" y="780" width="1112" height="48" rx="10"/></clipPath>
  </defs>

  <rect x="0" y="0" width="1240" height="992" fill="#FFFFFF"/>

  
  <rect x="40" y="40" width="1160" height="606" rx="14" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="64" y="70" font-size="16.5" font-weight="600" fill="#475569">One error shape, five jobs</text>

  
  <g filter="url(#xl07errorsh-lift)">
    <rect x="110" y="100" width="440" height="90" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <rect x="110" y="100" width="9" height="90" fill="#D97706" clip-path="url(#xl07errorsh-k1)"/>
  </g>
  <circle cx="148" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,134.56) scale(0.87)" fill="none" stroke="#D97706" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <circle cx="12" cy="12" r="5"/>
    <circle cx="12" cy="12" r="1.4"/>
  </g>
  <text x="174" y="152" font-size="18.5" font-weight="600" fill="#111827">"code": "page_size_too_large"</text>
  <text x="330" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">stable, so client code branches on it</text>
  <text x="330" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">never on the message text</text>

  
  <g filter="url(#xl07errorsh-soft)">
    <rect x="690" y="100" width="440" height="90" rx="12" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="690" y="100" width="6" height="90" fill="#64748B" clip-path="url(#xl07errorsh-k2)"/>
  </g>
  <circle cx="728" cy="145" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,134.56) scale(0.87)" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20.5 12c0 4.1-3.8 7.4-8.5 7.4a10 10 0 0 1-2.6-.34L4.5 21l1.3-3.6A6.9 6.9 0 0 1 3.5 12C3.5 7.9 7.3 4.6 12 4.6s8.5 3.3 8.5 7.4z"/>
  </g>
  <text x="754" y="152" font-size="18.5" font-weight="600" fill="#111827">"message": "Page size exceeds 100."</text>
  <text x="910" y="215" font-size="15.5" text-anchor="middle" fill="#6B7280">written for a person to read</text>
  <text x="910" y="238" font-size="15.5" text-anchor="middle" fill="#94A3B8">it may be reworded or translated later, so it is not a key</text>

  
  <g filter="url(#xl07errorsh-soft)">
    <rect x="110" y="286" width="440" height="90" rx="12" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5"/>
    <rect x="110" y="286" width="6" height="90" fill="#2563EB" clip-path="url(#xl07errorsh-k3)"/>
  </g>
  <circle cx="148" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(137.56,320.56) scale(0.87)" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 21V4M5 4.5h12l-2.5 4 2.5 4H5"/>
  </g>
  <text x="174" y="338" font-size="18.5" font-weight="600" fill="#111827">"field": "limit"</text>
  <text x="330" y="401" font-size="15.5" text-anchor="middle" fill="#6B7280">which input the caller must change</text>
  <text x="330" y="424" font-size="15.5" text-anchor="middle" fill="#94A3B8">for arrays, a path such as items[2].quantity</text>

  
  <g filter="url(#xl07errorsh-soft)">
    <rect x="690" y="286" width="440" height="90" rx="12" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1.5"/>
    <rect x="690" y="286" width="6" height="90" fill="#059669" clip-path="url(#xl07errorsh-k4)"/>
  </g>
  <circle cx="728" cy="331" r="18" fill="#FFFFFF"/>
  <g transform="translate(717.56,320.56) scale(0.87)" fill="none" stroke="#059669" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v16M6 20h12M12 6l-6 3M12 6l6 3"/>
    <path d="M2.5 9.5h7M14.5 9.5h7"/>
  </g>
  <text x="754" y="338" font-size="18.5" font-weight="600" fill="#111827">"provided": 250, "maximum": 100</text>
  <text x="910" y="401" font-size="15.5" text-anchor="middle" fill="#6B7280">the values that let the caller settle the problem</text>
  <text x="910" y="424" font-size="15.5" text-anchor="middle" fill="#94A3B8">without asking anyone</text>

  
  <g filter="url(#xl07errorsh-soft)">
    <rect x="400" y="472" width="440" height="90" rx="12" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5"/>
    <rect x="400" y="472" width="6" height="90" fill="#7C3AED" clip-path="url(#xl07errorsh-k5)"/>
  </g>
  <circle cx="438" cy="517" r="18" fill="#FFFFFF"/>
  <g transform="translate(427.56,506.56) scale(0.87)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10.5" cy="10.5" r="6.5"/>
    <path d="M15.3 15.3L21 21"/>
  </g>
  <text x="464" y="524" font-size="18.5" font-weight="600" fill="#111827">"request_id": "req_4C8P"</text>
  <text x="620" y="587" font-size="15.5" text-anchor="middle" fill="#6B7280">opaque, and it points at one request in the logs</text>
  <text x="620" y="610" font-size="15.5" text-anchor="middle" fill="#94A3B8">both the caller and the API team can use it</text>

  
  <rect x="40" y="670" width="1160" height="182" rx="14" fill="#FDF2F8" stroke="#F9A8D4" stroke-width="1.5"/>
  <text x="64" y="700" font-size="16.5" font-weight="600" fill="#BE185D">Never in the error body</text>

  <g filter="url(#xl07errorsh-soft)">
    <rect x="64" y="716" width="1112" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="716" width="6" height="48" fill="#DB2777" clip-path="url(#xl07errorsh-k6)"/>
  </g>
  <circle cx="98" cy="740" r="15" fill="#FFFFFF"/>
  <g transform="translate(89,731) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="122" y="747" font-size="18.5" font-weight="600" fill="#111827">A stack trace, a table or host name, a secret, or a raw dependency error</text>

  <g filter="url(#xl07errorsh-soft)">
    <rect x="64" y="780" width="1112" height="48" rx="10" fill="#FCE7F3" stroke="#F9A8D4" stroke-width="1.5"/>
    <rect x="64" y="780" width="6" height="48" fill="#DB2777" clip-path="url(#xl07errorsh-k7)"/>
  </g>
  <circle cx="98" cy="804" r="15" fill="#FFFFFF"/>
  <g transform="translate(89,795) scale(0.75)" fill="none" stroke="#DB2777" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M9 9l6 6M15 9l-6 6"/>
  </g>
  <text x="122" y="811" font-size="18.5" font-weight="600" fill="#111827">Anything that confirms a private resource exists</text>

  
  <rect x="40" y="876" width="1160" height="76" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="620" y="921" text-anchor="middle" font-size="16" fill="#475569">Every failure in this course returns one top-level error object with these parts.</text>
</svg>